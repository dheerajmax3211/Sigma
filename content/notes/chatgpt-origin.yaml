id: chatgpt-origin
title: "ChatGPT: five years of scaling nobody noticed, then an interface that broke the internet"
summary: >-
  ChatGPT was not a research breakthrough. It was GPT-3.5 plus RLHF plus a text
  box, shipped as a research preview because nobody expected it to matter. It
  reached a million users in five days and an estimated hundred million monthly
  users in two months, and in doing so converted a scaling-law result into a
  consumer product. The engineering story is three decisions: scale the
  pretrain, align it to preference rather than likelihood, and hide the prompt
  behind a conversation.
kind: case_study
date: "2022-11-30"
actors: [OpenAI]
key_facts:
  - "GPT-1 (June 2018) was 117M parameters: pretrain on BooksCorpus, then fine-tune per task, and it beat task-specific baselines with far less labelled data."
  - "GPT-2 (February 2019) scaled to 1.5B parameters on a 40 GB WebText corpus and was released in stages over misuse concerns."
  - "GPT-3 (May 2020) was 175B parameters across 96 layers, trained on 300B tokens, and introduced in-context learning: a task could be specified in the prompt with no gradient step."
  - "InstructGPT (January 2022) added RLHF. A 1.3B aligned model was preferred over the 175B base model in about 85% of blind human comparisons."
  - "ChatGPT launched on 30 November 2022 as a research preview with a chat box. The model was a GPT-3.5 sibling of text-davinci-003, not a new architecture."
  - "It reached roughly 1M users in five days and an estimated 100M monthly users within two months, the fastest consumer ramp recorded at the time."
  - "The API price for davinci was $0.02 per 1K tokens, or $20 per million, which set the mental model for token pricing that the whole industry inherited."
timeline:
  - when: Jun 2018
    what: "GPT-1 — 117M parameters, 12 layers, pretrain then fine-tune, beating task-specific baselines."
  - when: Feb 2019
    what: "GPT-2 — 1.5B parameters, 48 layers, staged release because of misuse concerns."
  - when: May 2020
    what: "GPT-3 — 175B parameters, 300B tokens, few-shot prompting replaces fine-tuning as the default interface."
  - when: Jan 2022
    what: "InstructGPT — RLHF makes a 1.3B aligned model preferred over the 175B raw one."
  - when: 30 Nov 2022
    what: "ChatGPT ships as a research preview. The product is the conversation, not the model."
  - when: Dec 2022
    what: "Roughly 1M users in five days; the free tier saturates and sign-ups are throttled."
  - when: Jan 2023
    what: "An estimated 100M monthly users, and a $10B-scale investment to buy the compute to serve them."
decisions:
  - choice: "Scale the pretrain instead of engineering task-specific architectures"
    why: "GPT-1 showed that a single pretrained transformer fine-tuned per task beat bespoke models. GPT-2 and GPT-3 tested whether the same recipe kept paying at 10x and 100x. It did, and the scaling laws made the return predictable enough to commit capital before the result existed."
    cost: "Every step up in scale was a bet on a curve rather than a demonstration. It also concentrated the work in data and systems engineering, where progress is measured in months of cluster time, not in papers."
  - choice: "Optimise for human preference rather than next-token likelihood"
    why: "A pretrained model is good at continuing text, which is not the same as being useful. Supervised fine-tuning on demonstrations taught the format; RLHF taught the preference. The 1.3B InstructGPT beating the 175B base model is the cleanest evidence that alignment is a separate axis from capability."
    cost: "RLHF is expensive to collect and easy to over-optimise. The policy learns to please the reward model, and the gap between preferred and true is where confident fabrication lives."
  - choice: "Ship a chat interface instead of a completion endpoint"
    why: "Prompting a base model is a skill. A conversation hides the prompt engineering behind a familiar form, so a non-expert gets value on the first try, and the model's context does the work of remembering the task."
    cost: "It exposed failure modes loudly and publicly — hallucination, confident wrongness — to an audience that had never used a language model, and it made those failures the product's defining controversy."
  - choice: "Launch as a free research preview"
    why: "Real usage data was worth more than another quarter of internal evaluation, and the label lowered expectations enough to make being wrong acceptable."
    cost: "It normalised shipping imperfect models to hundreds of millions of users and set a precedent every competitor had to match. It also created a free-tier cost structure that took years to unwind."
  - choice: "Cap and queue rather than degrade quality under load"
    why: "A slow answer preserves the impression of intelligence; a truncated or lower-quality answer destroys it. Queueing converts a capacity problem into a patience problem."
    cost: "It made the product unreliable at exactly the moment of maximum enthusiasm, and it revealed how thin the serving margin was."
lessons:
  - "The product surface decides adoption, not the benchmark. The same model behind a completion endpoint was a curiosity; behind a chat box it was a phenomenon."
  - "Alignment has a better marginal return than scaling once you are near the frontier. Preference tuning changed what the model was good at, not how large it was."
  - "Labelling something a preview buys permission to be wrong, and early real users are worth more than polish."
  - "Scaling laws are a capital-allocation tool. They let you commit to a run whose result you cannot yet see."
  - "Free at launch is a growth strategy and a cost structure. Both arrive at once, and only one of them was planned."
mistakes:
  - "Believing ChatGPT was a new model. It was GPT-3.5 plus RLHF plus an interface; the delta was interface and alignment."
  - "Assuming RLHF makes a model truthful. It makes it preferred. Those are different targets, and the gap is where confident fabrication lives."
  - "Treating the 1M-users-in-five-days figure as a demand signal. It was a demand signal and a capacity failure at the same time; the queue was the product for the first week."
  - "Assuming the API and the chat product are the same business. One sells tokens to developers, the other sells an experience to consumers, and they need different models, prices and reliability targets."
problem_statement: >-
  By 2022 OpenAI had a model that could do almost any text task from a prompt and
  almost no way for a normal person to use it. The API required a developer to
  construct a prompt, manage tokens and interpret a completion. The research
  question — does pretraining scale — had been answered; the product question —
  what do you put in front of a user — had not. The constraint was not model
  quality but interface and alignment: a raw pretrained model will happily
  continue a prompt into something unhelpful, offensive or incoherent, because
  its objective is likelihood, not usefulness. The design problem was therefore
  to build a system that turns a next-token predictor into something a person can
  have a conversation with, and then to serve it to a audience that arrived
  faster than any capacity plan had allowed for.
requirements:
  functional:
    - "Accept free-form natural-language input with no prompt-engineering syntax and return a coherent multi-turn reply."
    - "Maintain conversational context across turns so the user does not restate the task each time."
    - "Refuse or deflect harmful requests without refusing ordinary ones, which is a much harder boundary than it sounds."
    - "Run on the existing GPT-3.5 family so that no new pretrain is on the critical path."
    - "Expose the same capability through an API for developers, with token-based pricing."
  non_functional:
    - "Time to first token under about 2 seconds at launch, which for a 175B model means the request must already be batched."
    - "Survive a 1,000x traffic ramp in eight weeks without a model change, which forces queueing, rate limits and capacity purchase in parallel."
    - "Cost per conversation low enough that a free tier is survivable, which rules out serving the full 175B model at 8-bit or above to everyone."
    - "Refusal behaviour consistent enough that a user cannot get a harmful answer by rephrasing twice."
    - "Keep the safety layer outside the model where possible, so a policy change does not require a retrain."
clarifying_questions:
  - question: "Is this a consumer product or a developer API?"
    why_it_matters: "A consumer product is judged on the first response and pays for free users; an API is judged on price per token and latency variance. The same model supports both, but the capacity plan, the rate limits and the pricing do not."
  - question: "What is the expected conversation length?"
    why_it_matters: "Every turn resends the whole transcript. A 10-turn conversation with 300-token turns costs 1,500 tokens of prefill by turn 10, so cost grows quadratically in turn count while the user perceives it as linear."
  - question: "How much does a refusal cost compared with a bad answer?"
    why_it_matters: "Over-refusal is the dominant failure mode of an aligned model and it is invisible in benchmark scores. If the product is a coding assistant, a false refusal is a churn event; if it is a general chat product, a false answer is a trust event."
  - question: "What is the monthly budget for the free tier?"
    why_it_matters: "Free users at 100M scale dominate the GPU bill. The model choice for the free tier is a finance decision as much as a quality decision, and it usually means serving a smaller model than the paid tier."
  - question: "Is the model allowed to say it does not know?"
    why_it_matters: "Calibration is a product decision. A model trained purely on preference learns to sound confident, because confidence is preferred in blind comparisons even when it is wrong."
capacity_estimation:
  assumptions:
    - "GPT-3 is 175B parameters, 96 layers, 96 heads, model dimension 12,288, trained on 300B tokens."
    - "V100 has 125 TFLOPS FP16 peak and 900 GB/s of HBM bandwidth; A100 80GB has 312 TFLOPS and 2.039 TB/s."
    - "The reported GPT-3 compute is 3.14e23 FLOPs; the 6ND formula gives 6 x 175e9 x 300e9 = 3.15e23, which matches, so the formula is a good sanity check."
    - "Serving arithmetic assumes BF16 weights at 2 bytes per parameter and 40% MFU for compute-bound batching."
    - "Launch traffic is modelled as 100M monthly users, 10 conversations per month, 6 turns each, 250 tokens per turn."
  arithmetic:
    - label: "GPT-3 pretrain FLOPs"
      calculation: "6 x 175e9 params x 300e9 tokens = 3.15e23 FLOPs, which matches the reported 3.14e23"
      conclusion: "The 6ND estimate is accurate to within 0.5% for a dense model, which makes it the right back-of-envelope tool for any pretrain you are asked to size."
    - label: "GPT-3 wall clock on V100s"
      calculation: "3.15e23 FLOPs / (10,000 V100 x 1.25e14 x 0.15 MFU) = 3.15e23 / 1.875e17 = 1.68e6 s = 19.4 days"
      conclusion: "About three weeks of pure compute on a 10,000-GPU V100 cluster at a plausible 15% MFU. The real run was longer because of restarts and co-scheduling."
    - label: "GPT-3 rental cost"
      calculation: "10,000 GPUs x 1.68e6 s / 3,600 = 4.67e6 GPU-hours; x $2/GPU-hour = $9.3M"
      conclusion: "Single-digit millions for the flagship pretrain, which is why the strategy was fundable by a lab of OpenAI's size in 2020 and is not fundable today."
    - label: "GPT-3 weight memory"
      calculation: "175e9 x 2 bytes = 350 GB; 8 x A100 40GB = 320 GB does not fit; 8 x A100 80GB = 640 GB fits with 290 GB for cache"
      conclusion: "The model does not fit on the previous GPU generation at all. The 80 GB A100 is what made 175B servable, which is a hardware coincidence the whole product depended on."
    - label: "Decode rate at batch 1"
      calculation: "350 GB of weights read per token / (8 A100 x 2.039 TB/s = 16.3 TB/s) = 21.5 ms/token = 46 tokens/s, before all-reduce"
      conclusion: "A single stream is bandwidth-bound at about 46 tokens/s theoretical and closer to 15 in practice once tensor-parallel all-reduce is counted. Latency is a memory problem, not a FLOPs problem."
    - label: "Throughput at batch 64"
      calculation: "175e9 x 2 FLOPs/token = 350 GFLOP per token; 8 x A100 x 3.12e14 x 0.4 MFU = 1.0e15 FLOP/s; 1.0e15 / 3.5e11 = 2,857 tokens/s"
      conclusion: "Batching converts a latency-bound node into a throughput machine: 2,857 tokens/s is 62x the single-stream rate. Every serving decision in this era was about keeping the batch full."
    - label: "Launch traffic in tokens per second"
      calculation: "100e6 users x 10 conversations x 6 turns x 250 tokens = 1.5e12 tokens/month; / (30 x 86,400) = 579,000 tokens/s average"
      conclusion: "Half a million tokens per second average, with peaks several times higher. At 2,857 tokens/s per 8-GPU node that is 200 nodes at average load, or 1,600 A100s, before peak headroom."
    - label: "Cost per conversation on the free tier"
      calculation: "6 turns x 250 tokens = 1,500 output tokens plus 1,500 of accumulated prefill; at 2,857 tokens/s per node and $30/hour per node, 3,000 tokens costs 1.05 s of node time = $0.0087"
      conclusion: "Under a cent of raw GPU time per conversation, which sounds survivable until you multiply by 1e9 conversations a month and add the peak-to-average ratio and the failed requests."
    - label: "RLHF labelling cost"
      calculation: "40 labelers x 8 h/day x 180 days x $25/h = $1.44M; 33,000 comparisons over the same period = $43.6 per comparison"
      conclusion: "The preference dataset cost low single-digit millions, roughly a tenth of the pretrain. The asymmetry is the lesson: alignment is cheap relative to capability and buys more of what users notice."
architecture_summary: >-
  The system is a straightforward decoder-only transformer served behind a
  stateless HTTP API with a session store in front of it. The model itself is the
  GPT-3.5 family: 96-ish layers of pre-norm transformer blocks with learned
  positional embeddings, byte-pair-encoded tokens and a vocabulary of about
  50,257. Weights are sharded across eight GPUs with tensor parallelism, because
  one layer's feed-forward matrix at 49,152 hidden dimensions does not fit on a
  single device; the all-reduce per layer is what makes latency scale badly with
  node count, so the topology is one node per replica and many replicas rather
  than one replica across many nodes. Requests arrive at a gateway that enforces
  per-user rate limits, appends the conversation history to the prompt, and
  places the request in a continuous batch. A separate safety layer classifies
  the prompt and the response on the way in and out, which keeps policy changes
  out of the model weights. The serving stack keeps the batch as full as latency
  allows, because at 175B parameters the weights are read once per batch step
  regardless of batch size, and every empty slot in the batch is wasted
  bandwidth.
deep_dives:
  - topic: "Scaling laws as a capital-allocation instrument"
    explanation: >-
      The GPT-1 to GPT-3 progression is not three models; it is one hypothesis
      tested at three scales. GPT-1 used 117M parameters on a 700M-word corpus
      and showed that pretraining plus fine-tuning beat task-specific models.
      GPT-2 scaled to 1.5B on a 40 GB web crawl and showed that the same recipe
      kept improving, with the surprising side effect that the model could do
      tasks it was never trained on. GPT-3 scaled to 175B and 300B tokens and
      showed that in-context learning was a real capability rather than a
      curiosity: a task could be specified in the prompt, with no gradient step.
      What made this a strategy rather than a series of experiments is that the
      loss curve was predictable in advance. If you can predict the loss from
      parameter count and token count, you can commit a $10M run before you have
      the result, because you know what you are buying. That is the actual
      innovation of this period: not the transformer, which was published, but
      the willingness to spend on a forecast. The corollary is that once the
      curve is known by everyone, it stops being an advantage and becomes a
      table stake, which is exactly what happened after 2023.
    tradeoffs:
      - option: "Scale the pretrain"
        pros: "Predictable loss improvement per dollar; one architecture covers every task; the capability is general rather than benchmark-shaped."
        cons: "Enormous capital commitment before any result; the returns are smooth, so there is no early signal that you picked the wrong data mixture."
      - option: "Engineer task-specific models"
        pros: "Cheaper per task, easier to evaluate, no giant cluster; the right answer when you have one narrow job."
        cons: "Does not compound. Every new task is a new project, and none of them benefit from the scale you already paid for."
      - option: "Scale data rather than parameters"
        pros: "Chinchilla-style ratios get more capability per FLOP; cheaper inference at a given quality."
        cons: "Requires a data pipeline that can produce trillions of deduplicated, filtered tokens, which is a different and less glamorous engineering problem."
  - topic: "RLHF: the three-stage pipeline that made a small model win"
    explanation: >-
      InstructGPT is three models in sequence. First, supervised fine-tuning: a
      few tens of thousands of demonstrations teach the base model the shape of
      an answer, because a pretrained model's natural output is a continuation,
      not a reply. Second, a reward model: humans see pairs of outputs for the
      same prompt and pick the better one, and a model is trained to predict that
      preference. Third, PPO: the policy generates answers, the reward model
      scores them, and the policy is updated to increase the score while a KL
      penalty keeps it from drifting too far from the supervised model. The
      result that matters is the ablation: a 1.3B InstructGPT was preferred over
      the 175B base GPT-3 in about 85% of blind comparisons. A 130x smaller model
      won on the metric users actually experience. The mechanism is not that
      alignment adds knowledge; it is that the base model already had the
      knowledge and was spending its output on the wrong distribution. RLHF
      reshapes which of its capabilities get expressed. The KL penalty is the
      safety rail: without it the policy finds the reward model's blind spots and
      produces text that scores well and reads badly.
    tradeoffs:
      - option: "SFT then RLHF"
        pros: "Large preference gains from a small model; the reward model is reusable across policy versions; the KL penalty bounds drift."
        cons: "Three training stages, a human labelling pipeline, and a reward model that can be gamed; the pipeline is slow to iterate."
      - option: "SFT only"
        pros: "One stage, stable, cheap; captures the format and much of the perceived quality."
        cons: "Cannot express relative preference, so it plateaus below RLHF on the comparisons users make; imitation caps at the demonstrator."
      - option: "Prompting a base model with few-shot examples"
        pros: "No training at all; works immediately; fully reversible."
        cons: "Requires a skilled user, burns context on examples, and cannot fix tone or refusal behaviour reliably."
  - topic: "The interface is the product decision"
    explanation: >-
      The completion endpoint and the chat box call the same family of models and
      produce wildly different outcomes. A completion endpoint presents a text
      field and expects the user to know that they should write a prompt, include
      examples, specify the format and stop the generation. That is a skill, and
      the market of people who have it is small. A chat box presents a message
      field and expects the user to type what they want. The model's context
      window then does the work that prompt engineering was doing: the system
      prompt, the conversation history and the user's turn are assembled on the
      server, so the user never sees the machinery. This is why ChatGPT is often
      described as a product innovation rather than a research one, and the
      description is accurate but incomplete. The interface also changed the
      failure mode. A bad completion is a bad paragraph; a bad chat reply is a
      wrong answer to a direct question, which is far more damaging because it is
      attributed to the system rather than to the prompt. The hallucination
      problem became a public problem the day the interface made the model
      addressable.
    tradeoffs:
      - option: "Chat interface"
        pros: "Zero skill required; context is managed server-side; the interaction is familiar enough that non-technical users adopt it immediately."
        cons: "Failures are attributed to the product; multi-turn history inflates cost; the conversation metaphor invites questions the model cannot answer."
      - option: "Completion endpoint only"
        pros: "Maximum control for developers; cheaper per call; no session state to manage."
        cons: "Small addressable market; every user must learn prompt engineering; no consumer growth loop."
      - option: "Both, with the API as the durable business"
        pros: "Consumer adoption builds the brand and the data; the API monetises developers with better margins and no free tier."
        cons: "Two products with different reliability, pricing and roadmaps competing for the same GPUs, which is exactly the tension that showed up in 2023."
  - topic: "Serving a 175B model: the arithmetic of the launch"
    explanation: >-
      A 175B model at BF16 is 350 GB, which is why serving it is a memory problem
      before it is a compute problem. With tensor parallelism across 8 A100 80GB
      cards there is 640 GB of HBM, so the weights fit with 290 GB left for KV
      cache and activations. At batch 1 the decode loop reads all 350 GB per
      token, and at 16.3 TB/s of aggregate bandwidth that is 21.5 ms per token,
      or 46 tokens per second before the all-reduce overhead that tensor
      parallelism adds at every layer. In practice the achieved rate was a
      fraction of that. The way out is batching: at batch 64 the same 350 GB read
      serves 64 tokens, so the memory cost per token falls by 64x and the node
      becomes compute-bound at around 2,857 tokens per second. That number is the
      entire economics of the launch. Every request that arrives when the batch
      is full waits; every slot that is empty is bandwidth paid for nothing. The
      queue at launch was not a bug, it was the only way to keep the batch full
      while the fleet was being purchased.
    tradeoffs:
      - option: "Large batch, continuous batching"
        pros: "Amortises the weight read across many requests; 60x throughput versus batch 1; the only way to serve at consumer price points."
        cons: "Adds queueing latency; a long request holds a slot; tail latency becomes the user-visible metric."
      - option: "Small batch, low latency"
        pros: "Fast first token; predictable latency; good for interactive coding tools."
        cons: "Throughput collapses to tens of tokens per second per node, which at 100M users is unaffordable by orders of magnitude."
      - option: "Serve a smaller model to free users"
        pros: "Cuts the dominant cost line; most free queries do not need frontier quality."
        cons: "Quality is inconsistent across tiers, and users notice the difference at exactly the moment they are deciding whether to pay."
  - topic: "What 100 million users actually costs"
    explanation: >-
      The viral numbers hide a bill. A hundred million monthly users at ten
      conversations of six turns and 250 tokens is 1.5 trillion tokens a month,
      or about 579,000 tokens per second on average. At 2,857 tokens per second
      per eight-GPU node that is roughly 200 nodes running flat out, around 1,600
      A100s, and the peak-to-average ratio for a consumer product is typically 3
      to 5x, so the real fleet is closer to 5,000 to 8,000 GPUs. Multiply by
      $30 per node-hour and the monthly infrastructure bill is in the tens of
      millions before you account for failed requests, retries, or the fact that
      a free user's conversation is longer than the model's useful answer. This
      is why the free tier was capped, why the model was swapped for a cheaper
      sibling under load, and why the company raised at a scale that looked
      absurd for a company with no revenue. The demand was real; the unit
      economics were the problem, and they were a direct consequence of giving
      away a 175B-parameter forward pass.
    tradeoffs:
      - option: "Free tier at full quality"
        pros: "Maximum growth and data; the fastest possible adoption curve."
        cons: "The GPU bill scales linearly with users and revenue does not; the free tier becomes a subsidy to the heaviest users."
      - option: "Metered free tier with a cap"
        pros: "Bounds the cost per user; converts the heaviest users into paying ones; keeps the growth story."
        cons: "The cap is a visible product limitation and it arrives exactly when a user is forming a habit."
      - option: "Ads or data licensing to fund the free tier"
        pros: "Aligns cost with a revenue stream that scales with usage."
        cons: "Conflicts with the privacy posture and with enterprise customers, and it changes what the product optimises for."
bottlenecks:
  - failure: "Capacity saturation at launch"
    symptom: "Queue times measured in minutes, rate-limit errors surfaced as product failures, and a model that answered well when it answered at all."
    mitigation: "Continuous batching with a hard cap on queue depth, an explicit waiting-room UI rather than silent timeouts, and pre-purchased burst capacity that can be turned on in hours rather than weeks."
  - failure: "Hallucination as a trust failure"
    symptom: "Confident, fluent, wrong answers, especially for facts with a single correct value; the failure is uncorrelated with the model's expressed certainty."
    mitigation: "Retrieval for factual queries, a refusal path that is trained rather than prompted, and product copy that frames the model as a drafting tool. None of these fix the model; together they bound the damage."
  - failure: "Reward-model over-optimisation"
    symptom: "Preference scores keep climbing while human spot checks get worse; outputs grow longer, more flattering and more hedged."
    mitigation: "A KL penalty to the supervised model, a held-out preference set scored by fresh labelers, and a length-controlled evaluation so the policy cannot win by writing more."
  - failure: "Context growth in long conversations"
    symptom: "Cost per conversation rises quadratically with turn count while latency rises linearly; the oldest turns are the least useful and the most expensive."
    mitigation: "Summarise the transcript beyond a threshold, pin the system prompt, and drop turns from the middle rather than the beginning, since the first turn usually carries the task."
  - failure: "Safety layer latency and false refusals"
    symptom: "A second model in the request path doubles time to first token, and the refusal classifier blocks benign requests at a rate users notice before the team does."
    mitigation: "Run the safety classifier concurrently with generation rather than before it, tune for a low false-positive rate on the benign distribution, and log every refusal with the prompt so the boundary can be audited."
interview_questions:
  - question: "Why did a 1.3B InstructGPT beat a 175B base model on human preference?"
    level: senior
    key_points:
      - "The base model's objective is likelihood of the next token, which is not the same as being useful; it had the knowledge but spent output on the wrong distribution."
      - "SFT taught the format of an answer, and the reward model taught relative preference, which is what humans actually judge."
      - "The win is about which capabilities get expressed, not about adding knowledge."
      - "A 130x smaller model winning shows alignment is a separate axis from scale, and it is cheaper to move."
    follow_up: "Where would that conclusion break down? Name a task where the 175B base model still wins."
  - question: "Walk me through RLHF end to end and tell me where it fails."
    level: senior
    key_points:
      - "Three stages: supervised fine-tuning on demonstrations, a reward model trained on pairwise human comparisons, then PPO against that reward with a KL penalty."
      - "The KL penalty keeps the policy near the supervised model so it cannot wander into the reward model's blind spots."
      - "It fails through reward hacking: longer, more agreeable, more hedged text scores well without being better."
      - "It also encodes the labelers' preferences, including their cultural and stylistic biases, and those become the product's defaults."
    follow_up: "How would you detect reward hacking in production, using signals you already have?"
  - question: "Estimate the GPU fleet needed to serve 100M monthly users. State your assumptions."
    level: staff
    key_points:
      - "Convert users to tokens: 100M x 10 conversations x 6 turns x 250 tokens is 1.5T tokens per month, about 579K tokens/s average."
      - "Convert tokens to nodes using a measured throughput number, for example 2,857 tokens/s per 8-GPU node at batch 64."
      - "That gives roughly 200 nodes at average load, or 1,600 A100s, and peak-to-average of 3 to 5x gives 5,000 to 8,000 GPUs."
      - "State the omissions explicitly: retries, failed requests, free-tier abuse, and the fact that conversations grow with turn count."
    follow_up: "What single change would cut that fleet by half without changing the model?"
  - question: "A 175B model at BF16 does not fit on 8 A100 40GB cards. What are your options?"
    level: mid
    key_points:
      - "Weights are 350 GB at BF16 and 175 GB at FP8, against 320 GB of HBM on 8 x 40GB."
      - "Option one is more or bigger GPUs, which is what the 80 GB A100 provided."
      - "Option two is quantisation to 8 bits, which fits but needs accuracy validation."
      - "Option three is pipeline parallelism across nodes, which fits but makes latency worse because of the stage boundaries."
    follow_up: "Which of those would you pick for an interactive chat product, and why is pipeline parallelism usually the wrong answer there?"
  - question: "Why did the chat interface matter more than the model upgrade?"
    level: senior
    key_points:
      - "A completion endpoint requires prompt engineering skill; a chat box requires none, so the addressable market changes by orders of magnitude."
      - "The server assembles the system prompt and history, so context management moves from the user to the product."
      - "The interface changed the failure mode: a bad completion is a bad paragraph, a bad reply is a wrong answer to a direct question."
      - "Same weights, different product; that is the definition of a product decision rather than a research one."
    follow_up: "What interface decision in the last two years had the same effect on adoption, and why?"
  - question: "The launch was free. Argue for and against that decision with numbers."
    level: staff
    key_points:
      - "Free removed all adoption friction and produced the fastest consumer ramp on record, which was worth more than the revenue foregone."
      - "It also created a cost structure where the heaviest users pay nothing, and at 100M users the GPU bill is tens of millions a month."
      - "Free users generate preference data and usage distribution data that no amount of internal evaluation can buy."
      - "The counter-argument is that a metered tier from day one would have bounded the loss and still grown, at the cost of a slower curve."
    follow_up: "If you were launching the same product today into a market with three strong competitors, would you still make it free? What would you change?"
  - question: "Where does the scaling-law argument stop being useful for capacity planning?"
    level: senior
    key_points:
      - "Scaling laws predict loss, not latency, throughput or unit cost; they say nothing about the serving bill."
      - "They hold for pretraining loss on a distribution; they do not predict post-training quality or task performance reliably."
      - "They assume a fixed data distribution, so a data-mixture change invalidates the extrapolation."
      - "As a planning tool they are excellent for a pretrain budget and useless for a product roadmap."
    follow_up: "What would you measure instead if you had to forecast the quality of a post-trained model?"
what_to_steal:
  - "Ship the interface, not the capability. The same model behind a text box reached a hundred million people; behind an API it reached a hundred thousand developers."
  - "Align to preference, not to likelihood. It is the cheapest quality win available at any given parameter count."
  - "Price the free tier before you launch it. Growth and burn arrive on the same day."
  - "Keep the batch full. At 175B parameters, an empty slot is bandwidth you paid for and did not use."
  - "Put safety in a layer you can change without a retrain. Policy moves faster than checkpoints."
  - "Label the launch a preview. It buys permission to be wrong, which is the only way to get real usage data early."
