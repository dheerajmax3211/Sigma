id: agent-harness-playbook
title: "Build your own agent harness in an afternoon"
summary: >-
  A harness is a model, a tool list, a loop, and a way to check the work. Most
  agent failures are harness failures: the model was fine, the loop had no
  verification and the tools had no scope.
kind: playbook
date: "2026-10-29"
actors: [Claude Code, Codex, Hermes, OpenCode]
key_facts:
  - "Four parts, in order of importance: the verification loop, the tool set, the context management, and the model. Teams usually pick in the reverse order."
  - "A harness without a way to check its own output is a generator, not an agent. The check is what lets it retry, and retrying is where the quality comes from."
  - "Model Context Protocol handles connectivity — reaching files, APIs, databases. Skills handle procedure — what to do with what comes back. They are complements."
  - "Subagents are a context strategy, not a speed trick: each gets a fresh window, so a large search or a long file dump does not consume the parent's budget."
  - "Every serious harness in 2026 ships with approval gates and a sandbox: tools that mutate the world run in a container, with explicit approval for network and credentials."
steps:
  - step: "Write the loop before the prompt"
    detail: "Minimum loop: propose an action, execute, observe, verify against an explicit criterion, repeat or stop. If you cannot name the verification step, you have a chatbot that can call functions."
  - step: "Choose the smallest tool set that can close the loop"
    detail: "Read, write, run, search. Every extra tool is a chance to pick the wrong one, and tool descriptions compete for the model's attention. Add a tool only when a task is impossible without it."
  - step: "Decide MCP versus skill versus prompt"
    detail: "Live external data → MCP server. A repeated procedure → skill. A one-off instruction → the prompt. Putting a procedure in a system prompt is how you end up paying for it on every unrelated turn."
  - step: "Give each subagent one job and a clean window"
    detail: "Delegate reasoning-heavy or context-heavy work: 'audit this repo for X and report findings', not 'help with the project'. Require a verifiable handle back — a path, a commit, a test result — because a child's summary is a self-report, not evidence."
  - step: "Put the guardrails at the tool boundary"
    detail: "Sandbox writes, gate network and credentials behind approval, refuse destructive commands by pattern before the model sees them. Do not rely on the prompt to prevent damage; the prompt is advice, the harness is enforcement."
  - step: "Log every tool call and its result"
    detail: "When an agent goes wrong, the transcript is the only evidence of what it actually did versus what it said it did. Without it you are debugging a story."
mistakes:
  - "Picking the model first. A frontier model in a harness with no verification produces confident wrong work faster than a small model with a check."
  - "Letting subagents write and report success. A child claiming 'tests pass' is a claim; require the command output or re-run it yourself."
  - "One enormous system prompt instead of skills. The prompt is paid on every request; skills load only when relevant."
  - "Trusting the agent's description of its own work. Verify external side effects by reading back the target — a successful tool call is not a successful task."
lessons:
  - "Verification first, then tools, then context, then model. Inverting that order is the most common reason a harness feels impressive in a demo and unreliable in use."
  - "Constrain the tools and the agent gets more reliable, not less capable. Most bad actions are reachable, not desirable."
  - "Subagents buy context isolation. Use them for breadth and for isolation, and treat every returned summary as a lead to verify."
sources:
  - label: "Anthropic — Skills explained: vs prompts, Projects, MCP, and subagents"
    url: "https://claude.com/resources/articles/skills-explained"
  - label: "Anthropic — Building agents with Skills"
    url: "https://claude.com/resources/articles/building-agents-with-skills-equipping-agents-for-specialized-work"
tags: [agents, harness, mcp, subagents, tooling]
