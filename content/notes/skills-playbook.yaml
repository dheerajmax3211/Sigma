id: skills-playbook
title: "Skills: write one, import one, and know when not to"
summary: >-
  A skill is a folder with a SKILL.md that an agent loads only when a task
  matches its description. It is how you stop re-explaining the same procedure
  every session — and it became a cross-platform open standard in December 2025.
kind: playbook
date: "2026-10-29"
actors: [Anthropic, Agent Skills standard]
key_facts:
  - "Minimum viable skill is one file: SKILL.md, starting with YAML frontmatter (`name`, `description`) and then the instructions. The directory name must match `name`."
  - "Optional folders carry the weight: `references/` for docs read on demand, `assets/` for templates, `scripts/` for code the agent executes."
  - "Progressive disclosure is the whole point: metadata loads first (~100 tokens), full instructions only when relevant (under ~5k), bundled files only when a step calls for them."
  - "Agent Skills were published as an open standard on 18 December 2025, so the same skill folder works across platforms rather than being vendor-locked."
  - "On the Claude API, skills are passed in `container.skills` alongside the code-execution tool; custom skills are uploaded through the `/v1/skills` endpoints and are workspace-wide."
steps:
  - step: "Write the task in one sentence"
    detail: "That sentence is your `description`. If you cannot write it in one sentence, you have two skills or none — the description is what the agent matches against, so vagueness means it never loads."
  - step: "Create the folder and SKILL.md"
    detail: "Directory name equals `name` in the frontmatter. Put the procedure in imperative steps, not prose. Anything the agent must do every time belongs here."
  - step: "Move bulk into references/"
    detail: "Schemas, glossaries, long examples, and API tables go into `references/*.md` and SKILL.md points at them. This keeps the always-loaded body small enough to stay cheap."
  - step: "Add scripts/ for anything deterministic"
    detail: "If a step is arithmetic, validation, or a fixed transform, write it as a script the agent runs. Models are unreliable at exact arithmetic and reliable at following instructions."
  - step: "Test by triggering it"
    detail: "Ask a question that should match the description. If the skill does not load, the description is wrong — rewrite the description, not the body. Then ask one that should NOT match and confirm it stays dormant."
  - step: "Only then share it"
    detail: "A skill that has never been triggered is a document. Run it on three real tasks before you put it in a team folder, or you will distribute a procedure that does not work."
mistakes:
  - "Putting explanations in the skill. Skills are procedures, not tutorials; a learner needs the why, an agent needs the what and the order."
  - "One giant SKILL.md. It gets loaded in full on every match, so length is a permanent tax on every relevant request."
  - "Using a skill for live data. Connecting to a service is MCP's job — a skill can tell the agent how to use a connector, but it cannot reach anything itself."
  - "Using a skill for a one-off. Describe the task in the conversation instead; a skill earns its keep only on repetition."
lessons:
  - "Write the description first and make it specific. It is the only part that runs on every turn, and the reason skills silently fail to trigger."
  - "Deterministic work goes in scripts/, judgement goes in SKILL.md. Mixing them is how a skill becomes nondeterministic for no reason."
  - "Skills and MCP are complements, not alternatives: MCP is connectivity, skills are procedure. One skill can orchestrate several servers."
sources:
  - label: "Anthropic — Agent Skills overview"
    url: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview"
  - label: "Claude — Create custom skills"
    url: "https://claude.com/docs/skills/how-to"
  - label: "Claude — Extending capabilities with skills and MCP"
    url: "https://claude.com/resources/articles/extending-claude-capabilities-with-skills-mcp-servers"
tags: [skills, mcp, agents, tooling]
