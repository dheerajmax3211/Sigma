id: claude-origin
title: "How Claude started: Constitutional AI, long context, and the bet that the buyer is a business"
summary: >-
  Anthropic was founded in 2021 by researchers who left OpenAI, and its first
  model was defined by a training method rather than a parameter count.
  Constitutional AI replaced a large share of human preference labelling with a
  written set of principles the model applies to itself. The product bet was the
  opposite of a chat toy: long documents, long context, and agentic work for
  businesses. That choice pulled context length and tool use forward years
  before the consumer market asked for them, and it made the KV cache the most
  important object in the serving stack.
kind: case_study
date: "2023-03-14"
actors: [Anthropic]
key_facts:
  - "Anthropic was founded in 2021 by Dario and Daniela Amodei with a group of OpenAI researchers, positioned explicitly as a safety-focused lab."
  - "Claude's first public release was March 2023. The differentiator was Constitutional AI: the model critiques and revises its own outputs against a written list of principles, then is trained on those revisions."
  - "That is RLAIF, reinforcement learning from AI feedback, which replaces a large share of human preference labels with model-generated ones and makes alignment cheaper to scale."
  - "Claude 2 shipped a 100k-token context window in July 2023, aimed at contract review and codebase analysis rather than conversation."
  - "The product bet was agentic work: tool use, code execution and multi-step tasks, which turn a single request into a loop of dozens of model calls."
  - "By October 2026 Anthropic sits at the top of the frontier, with Claude Opus 5.5 at 66.4% on Terminal-Bench 4.0 and a score of 58 on the Artificial Analysis Intelligence Index, against Sonnet 5.5 at 56 — all self-reported."
timeline:
  - when: 2021
    what: "Anthropic founded by ex-OpenAI researchers; the stated goal is frontier safety research with commercial funding."
  - when: Dec 2022
    what: "The Constitutional AI paper is published: critique, revise, then train on the revisions, with AI feedback replacing human preference labels."
  - when: Mar 2023
    what: "Claude released — Constitutional AI as the method, long context and document work as the market."
  - when: Jul 2023
    what: "Claude 2 ships a 100k-token context window, aiming at contract review and codebase analysis rather than conversation."
  - when: 2024
    what: "Tool use and computer use turn the model from an answerer into an agent that acts, observes and retries."
  - when: 2025
    what: "Agent Skills launch, then become an open standard in December: procedural knowledge packaged as files rather than prompts."
  - when: Oct 2026
    what: "Opus 5.5 and Sonnet 5.5 at the frontier on agentic terminal benchmarks."
decisions:
  - choice: "Train against a written constitution instead of pure human labels"
    why: "Principles are auditable, editable and cheap to apply at scale. You can change one rule and retrain, where relabelling millions of preferences is prohibitive. The model can also generate its own critique, which turns alignment into a self-supervised loop rather than a labelling project."
    cost: "The model inherits whatever the constitution says, including its authors' judgement. Who writes the principles becomes the real governance question, and no benchmark can tell you whether the constitution is right."
  - choice: "Optimise for long context and documents, not conversation"
    why: "Businesses pay for work on their own corpus. A 100k window into a contract or a repository is a purchase order, not a novelty, and the buyer is identifiable."
    cost: "It ceded consumer mindshare to ChatGPT for two years, and long context is expensive at inference: the KV cache dominates memory and the prefill dominates latency."
  - choice: "Make tool use a first-class capability rather than a bolt-on"
    why: "An agent that can call a function, read the result and decide what to do next can complete work that no single generation can. That is the difference between a demo and a product for coding and operations."
    cost: "Every tool call is a full model round trip with a growing transcript, so cost and latency scale with the number of steps rather than the size of the answer."
  - choice: "Build prompt caching and prefix sharing into the serving layer"
    why: "Agentic workloads resend the same system prompt, tool definitions and file contents on every turn. Caching the KV for that prefix removes the dominant prefill cost, which is the difference between an agent that is affordable and one that is not."
    cost: "Cache-aware routing constrains the scheduler: requests must land on the replica holding their prefix, which fights with load balancing and complicates eviction under memory pressure."
  - choice: "Publish safety research and an open-standard skills format"
    why: "Portability lowers adoption friction: a skill written once works across platforms, which makes Anthropic the reference implementation rather than a walled garden."
    cost: "Open standards are hard to monetise directly, and competitors implement them freely."
lessons:
  - "A training method can be a product identity. Constitutional AI was a defensible story that a parameter count could never be."
  - "Choosing the buyer changes the roadmap. Document work pulled context length and toolability forward years before the consumer market asked for them."
  - "In an agentic product the transcript is the workload. Cost is set by the number of turns times the context length, not by the length of the answer."
  - "Prefix caching is not an optimisation, it is a business model. Without it, a multi-step agent re-pays for the same tokens on every step."
  - "Making a format open is a distribution strategy. Skills became the standard because the spec shipped with the product, not after it."
mistakes:
  - "Reading Constitutional AI as no humans involved. Humans write the principles and still label preference data; RLAIF reduces labelling, it does not remove judgement."
  - "Assuming a safety-focused lab ships slower. It shipped a frontier model within two years of founding."
  - "Treating a 200k context window as a free feature. The cache for one such request is tens of gigabytes, so concurrency is bounded by memory, not by compute."
  - "Assuming a cached prefix is always a win. Cache lookups cost latency, and a miss on a cold prefix is slower than no cache at all."
problem_statement: >-
  Anthropic's problem was to build a frontier model whose alignment method could
  scale with the model rather than with a labelling budget, and to find a market
  where that model was worth more than a chat toy. Human preference labelling
  costs roughly a dollar per comparison and does not scale to millions of
  comparisons per training run, so the alignment loop had to be partly
  self-supervised. The market had to be one where a long context window and
  reliable tool use are the product, because those are expensive capabilities
  that a consumer chat product would not pay for. The resulting system is a
  long-context model behind an agentic harness, where the dominant costs are
  prefill over a large prefix and the KV cache that prefix occupies. Almost every
  serving decision in this stack follows from that: cache the prefix, route by
  cache affinity, and price per token rather than per request.
requirements:
  functional:
    - "Accept up to 200k tokens of context and answer questions that require retrieving facts from the middle of that window, not just the end."
    - "Support a tool-use loop: emit a structured call, receive a result, and continue reasoning without a human in the middle."
    - "Cache and reuse the KV state of a shared prefix across requests, including system prompts, tool definitions and attached documents."
    - "Expose a batch API for offline work at a lower price, and a streaming API for interactive work."
    - "Allow policy changes to refusal behaviour without retraining the model."
  non_functional:
    - "Time to first token under 2 seconds on a cache hit for a 100k-token prefix, which is only possible if the prefill is skipped."
    - "Serve a 200k-token request on a single 8-GPU node, which bounds the cache at roughly 33 GB per sequence."
    - "Keep the cost of a 40-turn agent task within a small multiple of a single-turn answer, which is a caching requirement, not a model requirement."
    - "Refusal behaviour consistent enough that a user cannot get a harmful answer by rephrasing twice, without a false-refusal rate that makes the product unusable."
    - "Survive a replica loss without losing the cached prefixes of in-flight agent sessions, or the task restarts from turn one."
clarifying_questions:
  - question: "Is the workload a single long document, or a long agent transcript?"
    why_it_matters: "A document is prefilled once and read many times, so prefix caching wins completely. An agent transcript grows every turn, so only the stable prefix — system prompt and tool definitions — is cacheable, and the growing tail is paid for every step."
  - question: "How many turns does a typical task take?"
    why_it_matters: "Cost scales with turns times average context. A 40-turn task at 50k average context is 2M prefill tokens; a 4-turn task is 200k. That 10x difference decides whether the product is viable at all."
  - question: "What fraction of the prefix is shared across requests?"
    why_it_matters: "Cache hit rate is the whole economics. If 90% of the prefix is shared, an agent costs a tenth of its naive price; if 10% is shared, caching buys almost nothing and the routing constraints are pure overhead."
  - question: "What is the acceptable false-refusal rate?"
    why_it_matters: "Over-refusal is the dominant failure mode of an aligned model and it is invisible in capability benchmarks. For a coding tool, a false refusal is a churn event; for a general assistant, a missed harmful answer is a trust event. The threshold is a business decision."
  - question: "Does the customer need data residency or a private deployment?"
    why_it_matters: "Prefix caching across tenants is a data-isolation question, not just a performance one. A shared cache keyed by prefix hash can leak the existence of a document, so multi-tenant caching needs per-tenant namespacing."
capacity_estimation:
  assumptions:
    - "The model is a hypothetical 200B dense-equivalent with 80 layers and grouped-query attention using 8 KV heads at head dimension 128."
    - "KV cache is stored at FP8, so each K or V element is one byte: 8 heads x 128 dim x 2 tensors x 1 byte = 2,048 bytes per token per layer."
    - "An H200 node is 8 GPUs at 141 GB, 1.128 TB of HBM, with 4.8 TB/s per GPU."
    - "Prefill throughput is taken at 20,000 tokens/s per node for a long sequence, a plausible figure for a 200B model at 40% MFU."
    - "Human preference labelling is assumed at $1 per comparison and AI feedback at $0.02, both as planning figures rather than published prices."
  arithmetic:
    - label: "KV cache per token per layer"
      calculation: "8 KV heads x 128 dim x 2 for K and V x 1 byte = 2,048 bytes per token per layer; x 80 layers = 163,840 bytes = 164 KB per token"
      conclusion: "Every token in the window costs 164 KB of HBM. That single number drives every other capacity decision in a long-context product."
    - label: "Cache for a 200k-token request"
      calculation: "164 KB/token x 200,000 tokens = 32.8 GB per sequence"
      conclusion: "One request holds 33 GB. On a node with 240 GB of weights and activations that leaves room for about five concurrent 200k sequences before the node is full."
    - label: "Cache for a 1M-token request"
      calculation: "164 KB x 1e6 = 164 GB, which exceeds a single H200's 141 GB"
      conclusion: "Beyond roughly 850k tokens a single sequence cannot fit on one GPU at all, so the cache must be sharded across the node and attention becomes a ring exchange."
    - label: "Prefill cost with and without a prefix cache"
      calculation: "50,000-token prefix x 10,000 requests/hour = 5e8 prefill tokens/hour; at 20,000 tokens/s per node that is 25,000 node-seconds = 6.9 node-hours per hour, so 7 nodes dedicated to prefill"
      conclusion: "A shared 50k prefix burns seven nodes continuously if it is recomputed. With a cache hit the marginal prefill is zero, which is why caching is a capacity feature and not a latency tweak."
    - label: "How many prefixes fit in a node's spare memory"
      calculation: "1.128 TB total - 240 GB of weights and activations = 888 GB for cache; 888 GB / 8.2 GB per 50k prefix = 108 cached prefixes per node"
      conclusion: "A node holds about a hundred distinct 50k prefixes. Beyond that the cache thrashes and hit rate collapses, so routing has to cluster requests by prefix rather than spread them evenly."
    - label: "Cost of a 40-turn agent task"
      calculation: "Average context 50,000 tokens x 40 turns = 2e6 prefill tokens per task; at $3 per million input tokens that is $6.00 uncached; at a 90% cache hit it is $0.60 plus output"
      conclusion: "Caching is a 10x cost reduction on agentic work. Without it, a 40-turn task costs more in prefill than the answer is worth, which is why agents only became products after prefix caching existed."
    - label: "Constitutional AI labelling economics"
      calculation: "1e6 preference comparisons x $1 human = $1.0M; the same volume with AI feedback at $0.02 = $20,000; a 50x reduction before counting the human-written principles"
      conclusion: "RLAIF moves alignment from a labelling budget to a compute budget, which is the only way it scales with model size. The human cost does not go to zero; it moves upstream to writing and auditing the principles."
    - label: "Training compute for a frontier-class model"
      calculation: "6 x 400e9 params x 15e12 tokens = 3.6e25 FLOPs; 16,384 H100 x 9.89e14 x 0.4 MFU = 6.48e18 FLOP/s; 3.6e25 / 6.48e18 = 5.6e6 s = 64 days"
      conclusion: "A frontier pretrain is about two months on 16K GPUs, or roughly 25M GPU-hours. Any plan that assumes a faster cycle is assuming a smaller model."
architecture_summary: >-
  The system is a long-context decoder served behind a cache-aware router. The
  model is a standard pre-norm transformer with grouped-query attention, which
  keeps the KV cache small enough that a 200k window is servable, and with a
  positional scheme that has to generalise beyond the lengths seen in
  pretraining. In front of the model sits a prefix cache: the tokenised system
  prompt, tool definitions and any attached document are hashed, the hash is
  looked up in a per-replica cache of KV blocks, and on a hit the prefill for
  that span is skipped entirely. The router uses the same hash for affinity, so
  requests sharing a prefix land on the replica that already holds it. The agent
  harness is a loop rather than a single call: it sends the transcript plus a
  tool schema, receives either text or a structured call, executes the call in a
  sandbox, appends the result, and repeats. Because the transcript grows by the
  size of each tool result, the stable prefix is the system prompt and the tool
  definitions, and the variable tail is the part that cannot be cached. The
  serving stack therefore optimises two things at once: prefill amortisation for
  the stable prefix, and decode batching for the growing tail.
deep_dives:
  - topic: "Constitutional AI: critique, revise, then learn from AI feedback"
    explanation: >-
      The method has two stages and the first one is often skipped in summaries.
      In the supervised stage the model is given a harmful or ambiguous request,
      generates a response, then is asked to critique that response against a
      specific principle drawn from a written constitution, and then to revise it.
      The revised response becomes the training target. This is self-supervision
      with a rubric: no human labels the individual example, but a human wrote the
      rubric. In the second stage the model is used as the preference labeller.
      Two responses are compared, the model is asked which better satisfies a
      principle, and its answer becomes a preference label for a reward model,
      which is then used in PPO exactly as in RLHF. The economics are the point.
      A million human comparisons at a dollar each is a million dollars and
      several months; a million AI comparisons is compute, which scales with the
      cluster you already have. The failure mode is equally clear: the model's
      critique is only as good as its ability to apply the principle, so a
      constitution that is vague, contradictory or incomplete produces a model
      that is confidently aligned to the wrong thing. That is why the
      constitution itself becomes an artefact subject to review, versioning and
      publication rather than an internal prompt.
    tradeoffs:
      - option: "Constitutional AI with RLAIF"
        pros: "Alignment cost scales with compute rather than headcount; principles are auditable and editable; the critique traces are inspectable evidence."
        cons: "The model judges itself, so its blind spots become the policy's blind spots; principle conflicts are resolved by the model rather than by a human."
      - option: "RLHF with human preference labels"
        pros: "Grounds the reward in actual human judgement; catches failure modes the model cannot see in itself."
        cons: "Roughly a dollar per comparison and weeks of latency per iteration; labeler preferences become the product's defaults, including their biases."
      - option: "Prompted constitution at inference only"
        pros: "No training, instantly editable, fully reversible; a good first line of defence."
        cons: "Burns context on every request and is trivially bypassed by a user who argues with it; it changes behaviour at the margin, not the distribution."
  - topic: "Long context: the KV cache is the product constraint"
    explanation: >-
      A 200k-token window is not a positional-encoding trick, it is a memory
      commitment. With 8 KV heads, head dimension 128, 80 layers and FP8 storage,
      each token costs 164 KB, so one full-window request holds 33 GB. A node
      with 240 GB of weights and activations has about 888 GB spare, which is
      five full-window sequences and no more. That number, not the FLOPs,
      determines concurrency, and it explains why long-context products are
      priced per token rather than per request: a request is a memory reservation
      for its entire lifetime. The second-order effect is that the batch must be
      shaped by context length. Mixing a 200k request with a hundred short ones
      in the same batch wastes HBM on padding or forces paged allocation, and
      either way the short requests subsidise the long one. The third-order
      effect is prefill. A 200k prefill at 20,000 tokens per second is ten
      seconds of a node before the first output token, which is unusable
      interactively unless the prefix was cached. So the product architecture is:
      cache the stable prefix, stream the answer, and make the long-context path
      a batch or document workflow rather than an interactive one.
    tradeoffs:
      - option: "Full 200k window on every request"
        pros: "The simplest product promise; no retrieval infrastructure; works on documents that no chunker handles well."
        cons: "33 GB of cache per sequence bounds concurrency to single digits per node; prefill latency is measured in seconds to tens of seconds."
      - option: "Retrieval over a smaller window"
        pros: "Cheap, fast, scales to a corpus rather than a document; cache stays small."
        cons: "Recall is bounded by the retriever; multi-hop questions across a whole contract fail, and the failure is invisible to the user."
      - option: "Cache the prefix and stream the tail"
        pros: "Removes the prefill cost for the stable part while keeping the full window available for the variable part."
        cons: "Requires cache-aware routing and a memory budget for cached blocks; a cache miss is slower than no cache, because the lookup and eviction work is wasted."
  - topic: "Prefix caching and cache-aware routing"
    explanation: >-
      Prompt caching works by hashing the tokenised prefix, looking the hash up
      in a per-replica table of KV blocks, and reusing those blocks if the prefix
      matches exactly. The saving is the entire prefill for the matched span,
      which for a 50k-token system prompt and tool schema is the difference
      between seven nodes of prefill and none. The cost is architectural. A
      request can only hit the cache on the replica that holds the blocks, so the
      load balancer can no longer spread requests evenly; it has to route by
      affinity, which means hot prefixes overload their replicas while cold ones
      idle. Then there is eviction: cache blocks compete with live KV for the
      same HBM, and the eviction policy has to decide whether a cached prefix
      that has not been used in ten minutes is worth more than an in-flight
      sequence that needs to grow. Finally, an exact-match cache is brittle. A
      single changed token at the start of the prefix, or a different tool
      ordering, invalidates the whole entry. In practice the win comes from
      putting the stable material first, keeping the system prompt byte-identical
      across requests, and treating cache hit rate as a first-class SLO on the
      same dashboard as latency.
    tradeoffs:
      - option: "Exact-prefix KV caching"
        pros: "Removes the dominant prefill cost for repeated prompts; no model change; works with any architecture."
        cons: "Exact match only, so any edit invalidates the entry; requires affinity routing and a memory budget that competes with live KV."
      - option: "No caching, recompute every time"
        pros: "Perfect load balancing, no eviction policy, no isolation concerns; the simplest possible scheduler."
        cons: "Six to seven nodes of continuous prefill for a single shared prefix, which at scale is the difference between a viable and an unviable product."
      - option: "Cheaper model for the cached path"
        pros: "Avoids the cache complexity entirely by making prefill cheap enough not to matter."
        cons: "Quality drops exactly where the task is hardest, on long documents and multi-step agents, so the product loses the reason it existed."
  - topic: "Agentic tool use: the transcript is the workload"
    explanation: >-
      A tool-using agent is a loop, not a generation. The model receives a
      transcript plus a schema of available tools and returns either text or a
      structured call. The harness executes the call, appends the result to the
      transcript, and calls the model again. Every iteration re-sends the whole
      transcript, so cost grows quadratically in the number of turns for a fixed
      per-turn growth: a 40-turn task with 2k tokens added per turn averages 40k
      tokens of context, and the total prefill is 40 x 40k = 1.6M tokens. That is
      the economic reason agents only became products once prefix caching and
      cheaper small models existed. The engineering problem is not calling a
      function; it is error handling. A tool returns a malformed result, a shell
      command times out, a file does not exist. The model has to see the error as
      text and decide whether to retry, change approach or stop, and it has to do
      so without looping forever. That requires a step budget, a duplicate-call
      detector, and a summary of prior attempts so the model can see what it has
      already tried. The harness matters as much as the model: the same weights
      with a bad harness will thrash, and with a good one will complete tasks it
      appears too weak for.
    tradeoffs:
      - option: "Long-running agent with a large step budget"
        pros: "Can complete genuinely hard multi-step tasks; recovers from its own errors; the capability users actually want."
        cons: "Cost and latency scale with turns; a stuck loop can burn an entire budget on one task; failure is slow and expensive rather than fast."
      - option: "Single-turn tool call"
        pros: "Bounded cost, predictable latency, easy to evaluate and to price."
        cons: "Cannot chain dependent steps; the user becomes the loop, which defeats the point of an agent."
      - option: "Plan-then-execute with a fixed plan"
        pros: "Cheaper, because the plan is generated once and the execution steps are small; easier to audit."
        cons: "Brittle when the environment disagrees with the plan; replanning is exactly the capability you gave up."
  - topic: "Safety as a serving constraint, not a filter"
    explanation: >-
      An aligned model's refusals are part of its serving behaviour, and they
      cost money in a way that benchmarks do not capture. Every refusal is a
      failed request that still consumed a full forward pass, and a false refusal
      is a churn event. The usual architecture is two layers: the model's own
      trained behaviour, which handles the distribution it was trained on, and a
      classifier in front of or beside it, which handles the policy edge cases
      and can be updated without a retrain. Putting the classifier before
      generation doubles time to first token, so the better pattern is to run it
      concurrently with generation and cancel the stream if it fires. The deeper
      problem is that helpfulness and harmlessness are in tension, and the
      training signal resolves that tension by making the model cautious, which
      shows up as over-refusal on benign but unusual requests. The fix is not a
      better classifier; it is an evaluation set of benign edge cases — medical
      questions, security research, fiction with violence — scored separately
      from the harmful set, so the trade-off is visible and tunable rather than
      discovered by users.
    tradeoffs:
      - option: "Model-level refusal behaviour only"
        pros: "No extra latency; refusal is fluent and context-aware; one artefact to version."
        cons: "Policy changes require a retrain; the boundary is opaque and hard to audit; over-refusal is baked in."
      - option: "External classifier in the request path"
        pros: "Policy is code, updated in minutes; auditable and testable independently of the model."
        cons: "Adds latency and a second failure domain; a classifier tuned on a different distribution produces false refusals that look like model failures."
      - option: "Concurrent classifier with stream cancellation"
        pros: "No added time to first token; a fired classifier cuts the stream before the harmful content completes."
        cons: "Some harmful tokens have already been generated and may reach the client; needs careful buffering to be safe."
bottlenecks:
  - failure: "Prefill saturation in multi-turn agents"
    symptom: "Time to first token grows with turn number while output speed stays flat; GPU utilisation is high but most of it is attention over the transcript, not generation."
    mitigation: "Cache the stable prefix, summarise older turns, and route the request to the replica holding the session's cache rather than to the least-loaded one."
  - failure: "Cache thrashing under memory pressure"
    symptom: "Hit rate falls from 80% to 20% over a few hours; latency for the same prompt varies by an order of magnitude and no code changed."
    mitigation: "Reserve a fixed fraction of HBM for cache, evict by prefix frequency rather than recency, and alarm on hit rate as an SLO rather than on cache size."
  - failure: "Context rot at long windows"
    symptom: "Retrieval accuracy on facts in the middle of a 200k document is materially worse than at the start or end, and the model answers confidently from the wrong section."
    mitigation: "Place critical instructions at both ends, evaluate with a needle-in-a-haystack suite at multiple depths, and prefer retrieval over stuffing when the question is specific."
  - failure: "Agent loops that never terminate"
    symptom: "A single task consumes its entire step budget retrying the same failing command with slightly different arguments, and the bill arrives before the failure does."
    mitigation: "A hard step budget, a duplicate-action detector that hashes the call and its arguments, and an explicit summary of failed attempts injected into the transcript so the model can see the loop."
  - failure: "Cache isolation across tenants"
    symptom: "A prefix hash collision or a shared cache key lets one tenant's latency reveal whether another tenant's document is being processed."
    mitigation: "Namespace every cache key by tenant, never share KV blocks across tenants even on an exact hash match, and treat the cache as a per-tenant resource for both eviction and accounting."
interview_questions:
  - question: "Explain Constitutional AI. What does it replace, and what does it not replace?"
    level: senior
    key_points:
      - "Two stages: supervised critique-and-revise against written principles, then RLAIF where the model labels preference pairs for a reward model used in PPO."
      - "It replaces a large share of human preference labels with model-generated ones, moving alignment cost from headcount to compute."
      - "It does not replace human judgement: humans write and audit the constitution, and the model's blind spots become the policy's blind spots."
      - "The failure mode is a vague or contradictory constitution producing confident alignment to the wrong target."
    follow_up: "How would you version and evaluate a constitution the way you version a model?"
  - question: "A customer wants 200k-token context. What does that cost you in memory, and how many can you serve?"
    level: senior
    key_points:
      - "Compute the per-token cache: KV heads x head dim x 2 x bytes per layer x layers, which at 8 heads, 128 dim, 80 layers and FP8 is 164 KB per token."
      - "Multiply by 200k to get 33 GB per sequence."
      - "Subtract weights and activations from node HBM, then divide: roughly five concurrent full-window sequences per node."
      - "Concurrency, not throughput, is the binding constraint, so price per token rather than per request."
    follow_up: "How would you serve a mix of 2k and 200k requests on the same fleet without the short ones subsidising the long ones?"
  - question: "Design prefix caching for an agentic product. What breaks?"
    level: staff
    key_points:
      - "Hash the tokenised prefix, store KV blocks per replica, skip prefill on an exact match."
      - "Routing must be cache-affine, which fights load balancing; hot prefixes overload their replicas."
      - "Eviction competes with live KV for the same HBM, and exact match means any edit invalidates the entry."
      - "Multi-tenant isolation requires namespaced keys; a shared cache can leak the existence of a document."
    follow_up: "Your hit rate is 80% and latency is still bad on the first turn of each session. What would you do?"
  - question: "Why did long context and tool use go together as a product bet?"
    level: senior
    key_points:
      - "Both are business capabilities: a contract or a repository is long, and acting on it requires tools rather than a longer answer."
      - "Both are expensive, so they select for buyers who will pay per token rather than consumers who expect free."
      - "Tool use multiplies context because the transcript grows each turn, which makes long context a prerequisite for agents rather than a separate feature."
      - "Together they define a workload where caching is the difference between viable and not."
    follow_up: "What would you have had to build first if you had targeted consumers instead?"
  - question: "Estimate the cost of a 40-turn agent task and tell me how caching changes it."
    level: mid
    key_points:
      - "Assume 2k tokens added per turn, so average context is about 40k and total prefill is 40 x 40k = 1.6M tokens."
      - "At $3 per million input tokens that is roughly $5 of prefill for one task, before output."
      - "With a 90% cache hit on the stable prefix, the billed prefill falls by an order of magnitude."
      - "State that output tokens, retries and failed tool calls are additional and often dominate in practice."
    follow_up: "What would you change in the harness to reduce the number of turns rather than the cost per turn?"
  - question: "How do you evaluate an aligned model without rewarding over-refusal?"
    level: staff
    key_points:
      - "Score harmful-request compliance and benign-request refusal as two separate metrics, never a single safety score."
      - "Build a benign edge-case set: medical, security research, fiction, legal advice, and measure refusals there."
      - "Use held-out labelers so the policy cannot overfit to one annotator's taste."
      - "Track refusal rate in production by intent, because the distribution shifts and the benchmark does not."
    follow_up: "Your false-refusal rate doubles after a safety update. How do you decide whether to roll back?"
  - question: "Why is a cached prefix not always faster?"
    level: senior
    key_points:
      - "The lookup itself costs a hash and a table probe, and a miss pays that plus the prefill."
      - "Cache-affine routing can send a request to a loaded replica, adding queueing that outweighs the prefill saving."
      - "Eviction under memory pressure can thrash, so the same prefix misses repeatedly."
      - "The saving is only realised if the prefix is byte-identical, which real prompts rarely are without discipline."
    follow_up: "How would you structure the prompt to maximise the cacheable span without hurting quality?"
what_to_steal:
  - "Make your alignment method an artefact you can version, audit and publish. Principles are cheaper to change than labels."
  - "Pick the buyer before the feature. Long context and tool use are expensive, and only some markets pay for them."
  - "Treat the KV cache as capacity, not as an implementation detail. It sets concurrency and therefore price."
  - "Build prefix caching before you build agents. Without it, an agent is a quadratic bill with a linear answer."
  - "Measure false refusals separately from harmful compliance, or your safety metric will quietly become a refusal metric."
  - "Ship the harness with the model. Agent quality is a property of the loop, not only of the weights."
