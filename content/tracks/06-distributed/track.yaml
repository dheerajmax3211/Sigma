track:
  id: distributed
  slug: distributed
  title: "Distributed Systems, MLOps, and Inference"
  subtitle: "Splitting a model across devices, and paying for every byte you move"
  description: >-
    Training and serving stopped being single-device problems the moment models
    outgrew one accelerator. This track starts with the simplest split — the
    batch — and derives the price of it: averaging gradients, the ring
    all-reduce, bucketing, and the difference between a parameter server and a
    collective. From there it follows the model apart in every other direction:
    sharding optimizer state, splitting layers across devices, pipelining,
    batching requests that arrive at different times, and finally the cost
    models and measurement machinery that tell you which of those you actually
    needed.
  tier: 5
  color: "#06b6d4"
  sortOrder: 6
  outcomes:
    - "Split a batch across workers and explain why the averaged gradient is exactly the gradient of the larger batch, not an approximation of it."
    - "Price a synchronisation step in bytes: 2(N-1)/N times the model size per rank for a ring all-reduce, and why that number stops growing with worker count."
    - "Choose a bucket size from the launch latency and the step time, and say what bucketing does and does not save."
    - "Decide between a parameter server and a collective on bandwidth, latency, and failure behaviour rather than on fashion."
    - "Predict scaling efficiency from tokens per accelerator per step, and diagnose whether a slow job needs more bandwidth or a larger batch."
    - "Read a distributed training run and tell which of the four parallelisms — data, tensor, pipeline, or sharding — is limiting it."
  topics: []
