      title: "The control loop"
      nodes:
        - { id: lb, x: 0, y: 0, label: "Load balancer", kind: client, detail: "Routes to replicas. Queue depth here, not CPU, is the signal that leads demand." }
        - { id: q, x: 1, y: 0, label: "Bounded queue", kind: worker, detail: "Bounded so overflow becomes a fast rejection rather than an unbounded wait. Depth is the leading indicator." }
        - { id: repl, x: 2, y: 0, label: "Replicas", kind: model, detail: "Each has a warmup cost. A cold replica inflates effective service time until weights are resident." }
        - { id: as, x: 1, y: 2, label: "Autoscaler", kind: worker, detail: "Replicas = ceil(arrival x service / target). Reacts with lag, so the target must absorb the lag's traffic growth." }
        - { id: slo, x: 3, y: 1, label: "SLO feedback", kind: external, detail: "Compare p99 against budget and adjust the target, not the replica count. The target is the tunable." }
      edges:
