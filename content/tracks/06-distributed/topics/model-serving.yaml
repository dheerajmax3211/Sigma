    - type: pipeline
      title: "Where a request's latency is spent"
      nodes:
        - label: "Edge / auth"
          note: "milliseconds"
          detail: "Cheap and fixed. Worth measuring because it is pure overhead on every request."
        - label: "Queue"
          note: "the term that diverges"
          detail: "Multiplied by 1/(1-utilisation). At 90% this is nine service times — the largest term in the sum by far."
        - label: "Coalescing window"
          note: "bounded by its own length"
          detail: "Up to 25 ms here, buying 21x throughput at batch 32. Added delay compounds with queueing because it lengthens occupancy."
        - label: "Service"
