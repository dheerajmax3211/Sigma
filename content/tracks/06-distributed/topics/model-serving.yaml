      title: "Two autoscaling targets, one bill"
      left_label: "Target 60% utilisation"
      left_points:
        - "10,000 rps of 50 ms work needs 834 replicas"
        - "Mean response close to 1.7x service time"
        - "p99 stays inside a tight SLO"
        - "33% more hardware than the 80% target"
      right_label: "Target 80% utilisation"
