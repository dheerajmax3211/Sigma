id: model-serving
slug: model-serving
title: "Model Serving: Queues, Batching, and Autoscaling"
summary: >-
  Serving is queueing theory with a GPU attached: at 90% utilisation the mean
  response is ten times the service time and the p99 is forty-six times, which
  is why healthy fleets run near half load and why autoscaling targets matter
  more than replica counts.
kind: lesson
difficulty: hard
position: 13
estMinutes: 18
prerequisites: [continuous-batching, inference-cost-model]
phase: serving
tags: [serving, queueing, autoscaling, batching, latency]

body:
  big_idea: >-
    Latency is not a property of the model but of the queue in front of it:
    service time sets a floor and utilisation multiplies it — twice at 50%
    load, ten times at 90%.
  problem:
    - "CPU sits at 90% and p99 is 2.3 seconds on a 50 ms model: you are on the steep part of the queueing curve."
    - "You size for 80% utilisation, a 10% traffic spike takes you to 88%, and latency triples: your headroom was smaller than your variance."
    - "You enable a 25 ms coalescing window and the median barely moves while p99 rises by more than the window, because the queue amplifies it."
  analogy: >-
    A supermarket with one checkout. Half full, the queue is twice the
    scanning time; nine-tenths full, ten times — same cashier, same speed,
    entirely different experience. The cashier is the model, the scanning is
    service time, and nothing about either changed between those two states.
  concept_points:
    - "**Mean response is service time divided by one minus utilisation.** With a 50 ms service time, 50% load gives a 100 ms mean, 75% gives 200 ms, 90% gives 500 ms and 97% gives 2,000 ms. The curve from 50% to 90% costs five times the service time for forty points of utilisation."
    - "**The tail grows faster than the mean, and the tail is the SLO.** Measured p99 is 441 ms at 50% load, 913 ms at 75%, **2,300 ms at 90%** and 9,210 ms at 97% — at 90% that is 46 times the 50 ms service time. The utilisation you can afford is far below what the mean suggests."
    - "**This is why fleets run near half load.** Targeting 60% instead of 80% costs 33% more replicas: 10,000 rps of 50 ms work needs **834 replicas at 60% against 625 at 80%**. You are buying tail latency with hardware, and the price is explicit — the only way to make that trade honestly."
    - "**Batching trades single-request latency for throughput superlinearly.** A 25 ms coalescing window takes batch 1 from 20 tok/s to batch 32 at **426.7 tok/s**, 21x, while service time rises from 50 ms to 75 ms. The added delay is bounded by one window; at batch 128 throughput reaches 914.3 tok/s but service time climbs to 140 ms and the penalty dominates."
    - "**Autoscaling is capacity divided by a target, and the target is the whole decision.** Replicas needed is arrival rate times service time over target utilisation. Scale-up lags — detection, scheduling, model load, warmup — while existing replicas absorb the excess, so the safety margin must exceed the lag times the traffic slope."
    - "**Admission control is cheaper than a queue you cannot serve.** A bounded queue with an explicit rejection is a decision made in microseconds; an unbounded queue is a decision made implicitly, badly, by timing out. Rejecting 1% of traffic at the edge usually beats degrading 100% of it."
  definitions:
    - { term: "Service time", meaning: "Time to handle one request with no queueing. The floor on latency." }
    - { term: "Utilisation", meaning: "Arrival rate times service time, as a fraction of capacity. The multiplier on latency." }
    - { term: "Queueing delay", meaning: "Time spent waiting before service begins. Diverges as utilisation approaches 1." }
    - { term: "p99 latency", meaning: "The 99th percentile response time. The statistic SLOs are written against." }
    - { term: "Coalescing window", meaning: "How long a batcher waits to fill a batch. Bounds added latency by its own length." }
    - { term: "Target utilisation", meaning: "The load fraction autoscaling provisions for. Lower means more replicas and a shorter tail." }
    - { term: "Scale-up lag", meaning: "Time from demand change to a serving replica: detection, scheduling, load, warmup." }
    - { term: "Admission control", meaning: "Rejecting or shedding requests at the edge rather than queueing them indefinitely." }
    - { term: "Warmup", meaning: "Work a new replica must do before it serves at full rate: weights resident, graphs captured, caches primed." }
    - { term: "Little's law", meaning: "Concurrency equals arrival rate times time in system. Converts between queue depth and latency." }
    - { term: "Shed load", meaning: "Deliberately failing fast when the queue exceeds a bound, to keep the served fraction healthy." }

