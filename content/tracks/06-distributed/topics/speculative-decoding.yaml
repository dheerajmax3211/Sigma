id: speculative-decoding
slug: speculative-decoding
title: "Speculative Decoding"
summary: >-
  A small draft model guesses the next few tokens and the target model checks
  all of them in one forward pass, so a step that used to emit one token emits
  three. This topic derives the acceptance rule that makes the output
  distribution exactly the target's, measures it (TV 0.002 against 0.100 for the
  naive residual), and then prices the whole thing: break-even is a cost ratio,
  the ratio your implementation actually has is not the one your model does, and
  measuring both is what tells you whether to ship.
kind: lesson
difficulty: hard
position: 7
estMinutes: 28
prerequisites: [decoding-strategies, continuous-batching]
phase: serving
tags:
  - speculative-decoding
  - draft-model
  - rejection-sampling
  - acceptance-rate
  - break-even
  - serving
  - latency
  - lookahead
  - medusa
  - eagle
  - sampling

body:
  big_idea: >-
    A decode step is priced by the weights it reads, not the tokens it emits:
    draft guesses ride along almost free — if acceptance samples the target's
    distribution and drafting undercuts the pass it saves.
  problem:
    - "You need 100 tokens per second from a 70B at 40; a second GPU does not help, each step being one weight read, one token."
    - "You wire up \"draft four, keep what the big model agrees with\" and outputs change in ways no benchmark catches."
    - "You fix the distribution, measure 0.76 acceptance, and get 1.02x: the cost ratio you computed is not the cost ratio the stack pays."
  analogy: >-
    A tax partner and an associate. The associate drafts the whole letter; the
    partner reads it in one sitting and either signs each paragraph or
    rewrites from where it stops sounding like her. Her time is billed per
    letter read and per paragraph rewritten, so correct guesses are nearly
    free and wrong ones cost one rewrite.
  concept_points:
    - "**The step is a weight read, so extra positions are nearly free — that is the premise, and it is borrowed.** Measured on this harness: a 9 MB target costs **0.127 ms for one position and 0.188 ms for five, 1.48x not 5x**, because the extra rows ride the same weight read. The factor is 1.03 on an H100 that is genuinely bandwidth-bound and 1.4-1.6 on CPU."
    - "**The acceptance rule is two lines and it is exact.** Draw $x$ from $q$, accept with probability $\\min(1, p(x)/q(x))$, and on rejection draw once from the residual $r(y) \\propto (p(y)-q(y))_+$. Measured acceptance is **0.7849**, the residual has non-zero mass on **26 of 256 tokens**, and over 4,000,000 draws the output's distance from $p$ is **0.0022, below the 0.0036 noise floor**."
    - "**The naive residual is the classic bug, and it is worth 0.1 TV.** Resampling from $p$ itself on rejection gives $\\min(p,q) + (1-\\alpha)p$, whose distance from $p$ is **0.1001 analytically and 0.1002 measured — 46x the correct sampler's error** — and it does not shrink with samples, because it is a bias. The text stays fluent and quietly over-represents tokens the target already favoured."
    - "**A speculative step emits $1 + \\alpha + \\alpha^2 + \\dots + \\alpha^\\gamma$ tokens, not $\\gamma$.** It always emits at least the correction or bonus token, plus one per draft token accepted before the first rejection. Measured: **1.760, 2.266, 2.703, 3.116 and 3.502 tokens per step at $\\gamma = 1, 2, 3, 4, 8$**, against a naive $\\gamma$ model that overstates the last by 128%."
    - "**The speedup is $(1-\\alpha^{\\gamma+1})/((1-\\alpha)(v+\\gamma c))$, and it has an interior maximum.** With $c = 0.128$ measured and $v = 1$ it peaks at **$\\gamma = 4$ for $\\alpha = 0.7$ (1.83x), $\\gamma = 5$ for $\\alpha = 0.8$ (2.25x), $\\gamma = 9$ for $\\alpha = 0.9$ (3.03x)**. At $\\alpha = 0.76$ it is flat from 4 to 8, then falls: **$\\gamma = 20$ gives 1.17x, $\\gamma = 32$ gives 0.82x**."
    - "**Your effective $c$ is not your model's $c$.** Inverting the formula, $c_{\\text{eff}} = (\\mathbb{E}[T]/S - v)/\\gamma$ gives **0.26 to 0.41** against the model's 0.128, because each draft position also pays a softmax over a 4,096-token vocabulary, a cumsum and a search: **0.065 ms of bookkeeping against 0.016 ms of arithmetic**. That predicts the measured 1.02x at $\\gamma = 4$."
  definitions:
    - term: "Speculative decoding (draft-then-verify, assisted generation)"
      meaning: >-
        A decoding loop in which a cheap draft model proposes $\gamma$ tokens,
        the target model scores all $\gamma+1$ positions in one forward pass, and
        an acceptance test decides how many proposals survive. It is exact: the
        emitted sequence is distributed as if the target had sampled every token
        itself.
    - term: "Draft model"
      meaning: >-
        Any model cheap enough that $\gamma$ of its passes cost less than one
        target pass: a distilled smaller sibling, a pruned or quantised copy, an
        auxiliary head on the target (Medusa, EAGLE), or a lookup table over the
        context. Its only job is to put probability mass where the target does.
        Being wrong is allowed; being *differently* wrong is what costs.
    - term: "Target model (verifier)"
      meaning: >-
        The model whose distribution you are contractually serving. It scores
        $\gamma+1$ positions per step and never samples more than once, which is
        where the whole saving comes from.
    - term: "Lookahead $\\gamma$"
      meaning: >-
        The number of tokens the draft proposes per step. It is not a batch size
        and it is not "more is better": expected tokens per step is
        $1+\alpha+\dots+\alpha^{\gamma}$ while the step costs $v + \gamma c$, so
        the optimum is where the marginal survival probability
        $\alpha^{\gamma+1}$ meets the marginal cost $c$.
    - term: "Acceptance probability"
      meaning: >-
        For a draft token $x$ drawn from $q$, the probability it survives is
        $\min(1, p(x)/q(x))$. Tokens the target likes more than the draft are
        always kept; tokens the draft overweights are kept in proportion.
    - term: "Acceptance rate $\\alpha$"
      meaning: >-
        The unconditional probability that a draft token is accepted,
        $\alpha = \sum_y \min(p(y), q(y))$ — equivalently one minus the total
        variation distance. 0.7849 for the reference pair, and 0.7850 measured
        empirically over 4,000,000 draws.
    - term: "Residual distribution"
      meaning: >-
        $r(y) \propto (p(y)-q(y))_+$: the mass the target has and the draft does
        not. It is the exact complement of what acceptance removed, which is why
        sampling from it restores $p$ exactly rather than approximately. Non-zero
        on 26 of 256 tokens for the reference pair.
    - term: "Exact rejection sampling"
      meaning: >-
        The accept-or-resample scheme above, in the sense of von Neumann: it
        turns samples from $q$ into samples from $p$ using only pointwise ratios,
        with no normalising constant and no retry loop. Its output distribution
        equals $p$ to float precision — 5.2e-18 measured.
    - term: "Verification pass"
      meaning: >-
        One target forward over the $\gamma+1$ positions of a speculative step.
        Its cost relative to a single-token pass is $v$: 1.03 on a
        bandwidth-bound GPU, 1.48 on the CPU harness here. The technique rests on
        $v$ being close to 1, and $v$ enters the break-even directly — at
        $\gamma = 4$, raising $v$ from 1 to 1.48 cuts the tolerable cost ratio
        from 0.53 to 0.41.
    - term: "Bonus token"
      meaning: >-
        The token the target samples at position $\gamma+1$ when every draft
        token was accepted. It is not a correction; it is the free token that
        makes a fully-accepted step emit $\gamma+1$ rather than $\gamma$, and it
        is why the numerator is $1-\alpha^{\gamma+1}$ rather than
        $1-\alpha^{\gamma}$.
    - term: "Cost ratio $c$"
      meaning: >-
        One draft pass divided by one target pass, measured on the *models*:
        **0.128** here (0.0162 ms against 0.1268 ms). It is the left-hand side of
        the break-even comparison, and the single number most often assumed
        instead of measured.
    - term: "Effective cost ratio $c_{\\text{eff}}$"
      meaning: >-
        The cost ratio your implementation actually has, recovered from the
        speedup you actually got: $c_{\text{eff}} = (\mathbb{E}[T]/S - v)/\gamma$.
        **0.26 to 0.41** on this harness against a model $c$ of 0.128, because
        per-position bookkeeping is charged to the draft. It is the number that
        decides deployment, and it is only ever obtained by measurement.
    - term: "Break-even ratio"
      meaning: >-
        $c_{\text{break}}(\gamma) = (\mathbb{E}[T]-v)/\gamma$, the cost ratio at
        which $S = 1$: **0.53 at $\gamma = 4$** with $v = 1$, 0.41 with the
        measured $v = 1.48$. Below it speculation pays; above it, no acceptance
        rate rescues the step.
    - term: "Reach probability"
      meaning: >-
        The probability a draft position is evaluated at all: the product of the
        acceptance rates of every position before it. Measured 1.000, 0.785,
        0.613, 0.398 for the four positions of a $\gamma = 4$ step. Expected
        tokens per step is $1 + \sum_k P(\text{reach } k)$, so reach, not
        acceptance, is what makes long drafts unprofitable.
    - term: "Tree drafting (Medusa, EAGLE, lookahead decoding)"
      meaning: >-
        Proposing several continuations per position and verifying them as a
        tree with a custom attention mask, so one pass covers many candidate
        sequences. It buys more shots at the positions where reach probability is
        still high, instead of betting further out on a chain whose reach decays
        geometrically.

  diagrams:
    - type: architecture
      title: "Where the two models and the acceptance test sit"
      nodes:
        - { id: c, x: 0, y: 1, label: "Token stream", kind: client, detail: "The accepted prefix plus one correction token per step. Nothing downstream can tell that some tokens were proposed by a smaller model." }
        - { id: d, x: 1, y: 0, label: "Draft model", kind: "model", detail: "Autoregressive and cheap: 0.6 MB of weights against the target's 9 MB, 0.016 ms per token of arithmetic. Runs gamma times per step on its own samples." }
        - { id: t, x: 1, y: 2, label: "Target model", kind: "gpu", detail: "One forward over gamma+1 positions per step: 0.127 ms for one position, 0.188 ms for five. It never samples more than once per step, and that single draw is the correction or the bonus token." }
        - { id: a, x: 2, y: 1, label: "Acceptance test", kind: worker, detail: "Draws one uniform per draft position, compares it with min(1, p/q) using the target's logits, and on the first rejection draws once from the residual. Two lines of code, exact by construction — and 0.065 ms of bookkeeping per position, which is why the effective cost ratio is three times the model's." }
        - { id: k, x: 3, y: 1, label: "KV cache", kind: storage, detail: "The accepted prefix is appended once; rejected draft positions are never written. A gamma = 4 step appends 3.12 positions on average, not 4, so the cache grows at the rate tokens are emitted." }
      edges:
        - { from: c, to: a, label: "accepted tokens", style: bidirectional }
        - { from: d, to: a, label: "gamma proposals + q(x)" }
        - { from: t, to: a, label: "p(x) at gamma+1 positions" }
        - { from: a, to: k, label: "append accepted prefix" }
        - { from: a, to: d, label: "continue from accepted", style: async }
      caption: "The target appears once per step and produces the probabilities for every candidate position. That single pass is the entire budget; the draft is only allowed to spend it on better guesses."

    - type: pipeline
      title: "One speculative step, end to end"
      nodes:
        - label: "Draft"
          note: "gamma tokens from q, autoregressively"
          detail: "Each draft token conditions on the previous draft token, not on the target's choice. 0.016 ms of arithmetic per token and about 0.065 ms of everything around it — the softmax over the vocabulary, the cumsum and the search."
        - label: "Verify"
          note: "one target pass over gamma+1 positions"
          detail: "Reads the target's weights once and produces p at every candidate position, including the one after the last draft token. 0.188 ms for five positions against 0.127 ms for one."
        - label: "Accept"
          note: "walk left to right, stop at the first rejection"
          detail: "min(1, p/q) per position. Every position before the first rejection is appended; the position at the rejection is replaced, and every draft token after it is discarded without being looked at again."
        - label: "Correct or bonus"
          note: "one draw: residual, or the extra position"
          detail: "On rejection the draw comes from (p-q)+ normalised, which is the exact complement of what acceptance removed. If nothing was rejected, the same draw comes from p at position gamma+1 and is a free token."
        - label: "Append"
          note: "3.12 positions per step at gamma = 4"
          detail: "The KV cache grows by the number of emitted tokens, not by gamma. Rejected positions cost the target pass but never a cache slot, which is why speculative decoding composes with paged allocation."
      caption: "Four beats, one target forward. Everything that makes the technique safe lives in the third and fourth beats, everything that makes it fast lives in the second, and everything that makes it lose money lives in the first."

    - type: plot
      title: "Speedup against gamma, from the formula, at measured c = 0.128"
      chart: line
      xLabel: "gamma (draft tokens per step)"
      yLabel: "speedup at v = 1"
      series:
        - name: "alpha = 0.5"
          points:
            - { x: 1, y: 1.330 }
            - { x: 2, y: 1.393 }
            - { x: 3, y: 1.355 }
            - { x: 4, y: 1.281 }
            - { x: 5, y: 1.200 }
            - { x: 6, y: 1.122 }
            - { x: 8, y: 0.986 }
        - name: "alpha = 0.7"
          points:
            - { x: 1, y: 1.507 }
            - { x: 2, y: 1.744 }
            - { x: 3, y: 1.830 }
            - { x: 4, y: 1.834 }
            - { x: 5, y: 1.793 }
            - { x: 6, y: 1.730 }
            - { x: 8, y: 1.580 }
        - name: "alpha = 0.9"
          points:
            - { x: 1, y: 1.684 }
            - { x: 2, y: 2.158 }
            - { x: 3, y: 2.485 }
            - { x: 4, y: 2.708 }
            - { x: 5, y: 2.857 }
            - { x: 6, y: 2.951 }
            - { x: 8, y: 3.027 }
      caption: "Every curve turns over. The turnover is not a kernel artefact: it is the marginal draft token becoming less likely to survive than it is expensive to compute."

    - type: compare
      title: "Break-even at gamma = 4: which cost ratio you are comparing"
      left_label: "Model ratio, c = 0.128 (measured on the passes)"
      left_points:
        - "Draft 0.0162 ms against target 0.1268 ms per pass"
        - "Break-even at gamma = 4 is 0.529 with v = 1, 0.41 with v = 1.48"
        - "The model ratio clears both by a factor of three"
        - "Predicted speedup 2.06x at v = 1, 1.56x at v = 1.48"
        - "This is the number the paper assumes"
      right_label: "Effective ratio, c_eff = 0.40 (measured end to end)"
      right_points:
        - "Each draft position also costs 0.065 ms of bookkeeping"
        - "Break-even at gamma = 4 with v = 1.48 is 0.41"
        - "0.40 against 0.41 is a dead heat"
        - "Measured speedup 1.01x at an acceptance rate of 0.758"
        - "This is the number your users experience"

    - type: sequence
      title: "Reach, not acceptance, is what limits a four-token draft"
      items:
        - "Position 1: accepted 76.1% of the time; reached on 100% of steps"
        - "Position 2: accepted 75.8%; reached on 78.5% — the first position was rejected in 22% of steps"
        - "Position 3: accepted 68.0%; reached on 61.3%"
        - "Position 4: accepted 71.5%; reached on 39.8%"
        - "Expected tokens: 1 + 0.785 + 0.613 + 0.398 + 0.285 = 3.12 per step, which matches the replay exactly"
        - "A sixteenth draft token would be reached on under 1% of steps and would still cost c on every one"
      caption: "Acceptance is flat — 0.76, 0.76, 0.68, 0.72 — and it is still the wrong number to reason with. What decays is the product, and the product is why gamma has an optimum."

  markdown: |
    ## The step you are already paying for

    *Continuous Batching* established the premise this topic spends. A decode
    step reads every weight in the model once and emits one token per live
    sequence, so the cost of a step is the weight read and the sequences in the
    batch ride along for close to nothing.

    Speculative decoding points the same premise at one sequence's future instead
    of other sequences' present. If a cheap model proposes the next four tokens,
    the target can score five positions in the forward pass it would have spent
    on one — measured here at **0.188 ms against 0.127 ms, 1.48x**, and on a
    bandwidth-bound accelerator about 1.03x — and then emit however many of those
    proposals survive. The step still reads the weights once. It just stopped
    producing one token.

    ## The rule, and why it is exact

    Let the target distribution at a position be $p$ and the draft's be $q$. Draw
    the draft token $x \sim q$. Accept it with probability

    $$P(\text{accept}) = \min\left(1, \frac{p(x)}{q(x)}\right),$$

    and on rejection draw exactly once from the residual

    $$r(y) = \frac{(p(y)-q(y))_+}{\sum_z (p(z)-q(z))_+}.$$

    That is the whole algorithm, and its output distribution is $p$ — not an
    approximation to it. Acceptance keeps $\min(p,q)$ of the mass; rejection
    happens with probability $1-\alpha$ where

    $$\alpha = \sum_y \min(p(y), q(y)) = 1 - \operatorname{TV}(p,q);$$

    the residual carries exactly that much mass, so the correction restores $p$
    identically. The measurement is that
    over **4,000,000 draws the empirical distribution sits 0.0022 from $p$**,
    against a **0.0036 noise floor** measured between two independent draws from
    $p$ — and 5.2e-18 analytically.

    This matters because the alternative is not "slightly worse". Resampling from
    $p$ on rejection is the natural implementation and it produces
    $\min(p,q) + (1-\alpha)p$: **TV 0.1001 from the target, 46x the correct
    sampler's error**, permanently. Every rejected position over-represents the
    tokens the target already liked, which biases toward high-probability
    continuations — shorter, flatter, more repetitive text. No number of samples
    fixes a bias.

    The second requirement is that acceptance is *pointwise*, not greedy. If you
    keep a draft token whenever the target's argmax agrees, you sample from a
    distribution that equals $p$ only on the tokens where $p > q$; where the draft
    overweights, the target's own preference is never expressed. The $p(x)/q(x)$
    ratio is what turns "the target agrees" into "the target's probability is
    preserved".

    ## How many tokens a step actually emits

    A step emits one token no matter what — the correction draw, or the bonus
    token at position $\gamma+1$ if everything was accepted — plus one for every
    draft token accepted before the first rejection:

    $$\mathbb{E}[T] = 1 + \alpha + \alpha^2 + \dots + \alpha^{\gamma}
      = \frac{1-\alpha^{\gamma+1}}{1-\alpha}.$$

    The replay measures **1.760, 2.266, 2.703, 3.116 and 3.502** tokens per step
    at $\gamma = 1, 2, 3, 4, 8$. The bonus token is why the numerator runs to
    $\gamma$ and not $\gamma-1$: a perfect one-token draft yields two tokens.

    The correction worth internalising is that this is a *reach* calculation, not
    an acceptance one. Measured inside a single $\gamma = 4$ run, conditional
    acceptance is flat — **0.761, 0.758, 0.680, 0.715** — while the probability of
    reaching those positions is **1.000, 0.785, 0.613, 0.398**. The fourth draft
    token is used on 40% of steps and paid for on all of them. That gap, not any
    decay in accuracy, is what makes long drafts a bad buy.

    ## The speedup, and the cost ratio that decides it

    One step costs $\gamma c$ draft passes plus $v$ target-pass equivalents, where
    $c$ is the draft-to-target cost ratio and $v$ is the verify pass relative to a
    single token:

    $$S(\gamma) = \frac{1-\alpha^{\gamma+1}}{(1-\alpha)(v+\gamma c)}.$$

    Setting $S = 1$ turns this into a statement about cost, which is the form that
    is actually useful:

    $$c_{\text{break}}(\gamma) = \frac{\mathbb{E}[T]-v}{\gamma}.$$

    At $v = 1$ and $\alpha \approx 0.76$ that is **0.760, 0.633, 0.568, 0.529,
    0.393, 0.313** for $\gamma = 1, 2, 3, 4, 6, 8$. The line *tightens* as the
    draft gets longer: four draft passes amortise the verify over 3.12 tokens, but
    eight barely improve on that and double the draft bill.

    | $\gamma$ | measured $\alpha$ | tokens/step | $c_{\text{break}}$ at $v=1$ | $S$ at $c=0.128$, $v=1$ | $S$ at $v=1.48$ | measured | $c_{\text{eff}}$ |
    |---|---|---|---|---|---|---|---|
    | 1 | 0.760 | 1.76 | 0.760 | 1.56x | 1.09x | 1.02x | 0.26 |
    | 2 | 0.734 | 2.27 | 0.633 | 1.80x | 1.31x | 1.03x | 0.36 |
    | 3 | 0.751 | 2.70 | 0.568 | 1.95x | 1.45x | 1.04x | 0.38 |
    | 4 | 0.758 | 3.12 | 0.529 | 2.06x | 1.56x | 1.01x | 0.40 |
    | 6 | 0.739 | 3.36 | 0.393 | 1.90x | 1.49x | 0.85x | 0.41 |
    | 8 | 0.744 | 3.50 | 0.313 | 1.73x | 1.40x | 0.74x | 0.40 |

    Read the last column first. The model's cost ratio is 0.128; the *effective*
    ratio, recovered by inverting the formula against the measured speedup, is
    0.26 to 0.41. At $\gamma = 4$ the break-even line with the measured
    $v = 1.48$ is $(\mathbb{E}[T]-1.48)/\gamma = 0.41$, and $c_{\text{eff}} = 0.40$
    sits exactly on it — hence 1.01x at an acceptance rate of 0.758. At
    $\gamma = 8$ the line falls to 0.25 while $c_{\text{eff}}$ stays at 0.40, and
    the measurement is 0.74x. Those two columns are one run: they move 15-20%
    between runs on one CPU core, while $\alpha$, tokens/step and
    $c_{\text{break}}$ do not.

    The gap between 0.128 and 0.40 is not the draft model. It is everything else
    charged to a draft position: a softmax over the 4,096-token vocabulary, a
    cumsum, a search, and the Python around them — **0.065 ms against 0.016 ms of
    arithmetic**. A fused implementation does not pay that; a naive one pays it
    three times over. This is the number to measure before you promise anything,
    and it is the one nobody measures, because the paper reports $c$ for the
    models and the wall clock for the system.

    With the bookkeeping gone, $c_{\text{eff}} = c = 0.128$ and the same
    acceptance gives **2.06x at $\gamma = 4$ with $v = 1$**, or 1.56x with the
    verify penalty intact. If no route gets you under the line — a cheaper draft,
    fused kernels, a bigger target pass — then a smaller $\gamma$ will not save it:
    the workload does not support speculative decoding, and a larger batch is the
    better use of the GPU.

    ## What a draft has to be

    "Small and fast" is the wrong specification. At $\gamma = 4$: a draft with
    $\alpha = 0.35$, $c = 0.03$ returns **1.37x** — clear of its 0.133 line, but
    capped at 1.54x by its own acceptance; one with $\alpha = 0.75$, $c = 0.13$
    returns **2.01x** against a line of 0.513; one with $\alpha = 0.90$,
    $c = 0.40$ returns **1.58x** against a line of 0.774. All three clear, and the
    middle one wins: it is the only one where neither acceptance nor cost binds.

    ## What breaks

    Four things, all measurable before deployment. Verification is not free: $v$
    is 1.48 here and 1.03 on an H800, which at $\gamma = 4$ moves the tolerable
    cost ratio from 0.53 to 0.41. Reach decays geometrically while acceptance
    does not, so the honest $\gamma$ is usually 3 to 5. Bookkeeping per draft
    position can triple your effective $c$ without touching a model weight. And
    the line is unforgiving: at $\gamma = 4$, $c_{\text{eff}} = 0.40$ is on it,
    and a draft from another model family routinely lands past it. Tree drafting
    buys shots at high-reach positions; it does not fix a cost ratio.

    ## The longer version

    ### The idea, stated at length

    A decode step is priced by the weights it reads rather than by the tokens it emits, so a cheap model's guesses can ride along in the same pass for almost nothing — provided the expensive model's acceptance test samples from its own distribution exactly, and provided the extra work per draft token costs less than the target pass it saves.

    ### The analogy, in full

    A tax partner and an associate. The associate drafts the whole letter; the partner reads all of it in one sitting and either signs each paragraph or rewrites it from the point where it stops sounding like her. Her time is billed per letter read and per paragraph rewritten, not per paragraph read, so the associate's correct guesses are nearly free and the wrong ones cost one rewrite. The mapping is exact. A paragraph is a draft token, the partner's sitting is one verification pass, "signs it" is acceptance with probability min(1, p/q), and "rewrites it" is a draw from the residual — the paragraphs the partner would have written that the associate did not. The letters that leave the office are distributed exactly as if the partner had written every one of them herself, which is the property the whole scheme exists to preserve. It breaks in four places, and the fourth is the one that kills deployments. The partner reads more slowly than she reads one paragraph — five paragraphs take 1.48x as long as one. The associate's fourth paragraph is only reached 39.8% of the time, so a fifth is a guess about a letter that mostly does not exist. And every paragraph the associate drafts has to be typed, filed and handed over: 0.065 ms of overhead per paragraph against 0.016 ms of thinking. If the filing costs more than the reading saves, the letter takes longer than if the partner had written it, at any acceptance rate.

    ### Failure modes, in full

    - You serve a 70B model at 40 tokens per second and the product wants 100. Buying a second GPU does not help, because each step emits exactly one token per sequence and the card is already saturating its memory bandwidth. The step is not compute-bound; it is a weight read that produces one token, and no amount of hardware makes that read shorter.
    - You read that a small model can guess ahead and the big model can check the guesses, so you wire up "draft four, keep the ones the big model agrees with" and ship it. Outputs change. Not degrade in a way a benchmark catches — change, on prompts where the model used to be stable at temperature 0.4, in a way a reviewer notices.
    - You fix the distribution, measure a healthy 0.76 acceptance rate, and get 1.02x. The draft is eight times cheaper than the target per pass, so the arithmetic promised 1.5x. Both numbers are right: the cost ratio you computed for the models is not the cost ratio your serving stack actually pays, because everything else in a step is charged to the draft.
    - You quote the paper's 2.4x in a design review and your own A/B says 1.0x. The paper's target was a 70B on an H100 where verifying five positions costs 1.03 target passes and the kernels are fused; yours is a 7B on a stack where verification costs 1.48 and per-position bookkeeping costs four times the draft's arithmetic. The technique's premise is a property of your implementation, not a law of the method.
    - Somebody proposes deleting the target model and serving the draft, since it is cheaper. It is also the model users rate lower, and the entire point of the acceptance rule is that you get the big model's distribution at the small model's speed — not the small model's distribution.

    ### The mechanisms, in full

    - **The step is a weight read, so extra positions are nearly free — that is the premise, and it is borrowed.** Continuous batching established that one decode step reads the whole model and emits one token per live sequence, which is why filling empty slots costs almost nothing. Measured on the harness in this topic: a 9 MB target costs **0.127 ms for one position and 0.188 ms for five — 1.48x, not 5x**, because the extra rows ride on the same weight read. Speculative decoding spends that free dimension on one sequence's future instead of on other sequences' present. The trap is assuming the factor is 1.0: it is 1.03 on an H100 whose decode step is genuinely bandwidth-bound and 1.4-1.6 on a CPU where the multi-row GEMM path gives up bandwidth, and the gap moves the break-even line by a third.
    - **The acceptance rule is two lines and it is exact.** Draw the draft token $x$ from $q$, accept it with probability $\min(1, p(x)/q(x))$, and on rejection draw once from the residual $r(y) \propto (p(y)-q(y))_+$. With a draft that is the target at temperature 1.6 over a 256-token vocabulary, the measured acceptance rate is **0.7849**, and the residual has non-zero mass on **26 of 256 tokens** — the places the draft overweights and the target does not. The trap is treating the residual as a fallback that "roughly" corrects the bias: it is the exact complement of what acceptance removed, and skipping it is not a small error.
    - **The output distribution is exactly the target's, not approximately.** Over 4,000,000 draws the measured total-variation distance from $p$ is **0.0022, below the 0.0036 sampling-noise floor** measured between two independent draws from $p$ itself, and the analytic output distribution differs from $p$ by **5.2e-18** — float noise on an identity. The sampler is exact for any pair $(p,q)$ where $q$ has mass everywhere $p$ does, with no correction term, no retry loop, and no tuning. The trap is believing exactness costs throughput: it costs one subtraction and one draw.
    - **The naive residual is the classic bug and it is worth 0.1 TV.** Resampling from $p$ itself on rejection — the natural thing to write, because "the draft was wrong so use the target" — produces $\min(p,q) + (1-\alpha)p$, whose TV distance from $p$ is **0.1001 analytically and 0.1002 over 4,000,000 draws: 46x the correct sampler's error**, and it does not shrink with more samples because it is a bias, not noise. The result is still fluent text, still passes a vibe check, and quietly over-represents the tokens the target already favoured at every rejected position. The trap is that the bug is invisible in aggregate metrics and obvious in a TV measurement.
    - **A speculative step emits $1 + \alpha + \alpha^2 + \dots + \alpha^\gamma$ tokens, not $\gamma$.** The step always emits at least one token — the correction draw, or the bonus token if every draft token was accepted — plus one for each draft token accepted before the first rejection, which happens with probability $\alpha^k$. Measured: **1.760, 2.266, 2.703, 3.116 and 3.502 tokens per step at $\gamma = 1, 2, 3, 4, 8$**, against a naive $\gamma$-token model that overstates the last one by 128%. The trap is estimating throughput from $\gamma$ instead of from the geometric sum, and it gets worse the more you draft.
    - **Acceptance is flat across a draft; what decays is the chance of getting there.** Measured conditional acceptance at each position inside a $\gamma = 4$ run: **0.761, 0.758, 0.680, 0.715** — no systematic decay, because the draft is judged against the target's logits on the same prefix every time. But the probability of *reaching* position four is **1.000, 0.785, 0.613, 0.398**, so the fourth draft token is emitted on 40% of steps while costing $c$ on every one. The trap is reading the mean acceptance fraction $n_{\text{accepted}}/\gamma$ as the per-position rate: at $\gamma = 8$ that statistic is **0.31** while the per-position rate is **0.74**, and feeding 0.31 into the formula predicts 1.45 tokens per step against 3.50 measured — a 2.4x understatement that makes you abandon a working technique.
    - **The speedup is $\dfrac{1-\alpha^{\gamma+1}}{(1-\alpha)(v+\gamma c)}$, and it has an interior maximum.** With $c = 0.128$ measured on the models (a 0.016 ms draft pass against a 0.127 ms target pass) and $v = 1$ assumed, the formula peaks at **$\gamma = 4$ for $\alpha = 0.7$ (1.83x), $\gamma = 5$ for $\alpha = 0.8$ (2.25x) and $\gamma = 9$ for $\alpha = 0.9$ (3.03x)**. At $\alpha = 0.76$ the curve is flat from $\gamma = 4$ to $8$ (2.06x, 1.88x) and then falls away: **$\gamma = 20$ gives 1.17x and $\gamma = 32$ gives 0.82x**, because 32 draft passes cost four target passes whether or not anybody accepts them. The trap is treating $\gamma$ as a "more is better" knob rather than as a price.
    - **Break-even is a cost ratio, and the line tightens as $\gamma$ grows.** Setting $S = 1$ at $v = 1$ gives $c_{\text{break}}(\gamma) = (\mathbb{E}[T]-1)/\gamma$: **0.760, 0.633, 0.568, 0.529, 0.393, 0.313** for $\gamma = 1, 2, 3, 4, 6, 8$. Longer drafts amortise the verify pass over more tokens but multiply the draft cost, so a $\gamma = 8$ draft must be **2.4x cheaper** than a $\gamma = 1$ draft to break even at the same acceptance rate. The measured model ratio of 0.128 clears every one of those lines with room to spare. The trap is quoting a speedup without quoting the $c$ it assumed: the same $\alpha$ is a 2x win at $c = 0.05$ and a loss at $c = 0.6$.
    - **Your effective $c$ is not your model's $c$, and inverting the formula recovers it.** From the measured speedup, $c_{\text{eff}} = (\mathbb{E}[T]/S - v)/\gamma$ gives **0.26, 0.36, 0.38, 0.40, 0.41, 0.40** at $\gamma = 1 \dots 8$ on one run (0.22 to 0.41 across runs, because the timing moves) — two to three times the model's 0.128, because each draft position also costs a softmax over the 4,096-token vocabulary, a cumsum and a search: **0.065 ms of bookkeeping against 0.016 ms of arithmetic**. Against the break-even line at $v = 1.48$ — 0.28, 0.39, 0.41, 0.41, 0.31, 0.25 — that predicts every measured point: wins at $\gamma = 1\text{-}3$ (1.02x, 1.03x, 1.04x), break-even at 4 (1.01x), losses at 6 and 8 (0.85x, 0.74x). The trap is measuring $c$ on the models and believing it describes the system.
    - **Below the break-even line speculation is a slowdown at any acceptance rate; above it the ceiling is $1/((1-\alpha)v)$.** Measured at $\gamma = 4$: $c_{\text{eff}} = 0.40$ against a break-even of 0.41 — a 1.01x result with an acceptance rate of 0.758. Nothing about that is an acceptance problem; it is a cost problem, and the only fixes are a cheaper draft, a cheaper per-position path, or a bigger target pass. Once cost is out of the way the ceiling is set by agreement alone: **5.0x at $\alpha = 0.8$, 2.0x at $\alpha = 0.5$**, 1.35x at 0.26. The trap is optimising $\gamma$ and the kernel while the ceiling is a training problem and the floor is an implementation one.
