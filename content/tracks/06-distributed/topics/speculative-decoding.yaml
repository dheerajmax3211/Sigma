        Nothing here is asymptotic and nothing is approximate. The two paths
        partition the outcome space, the masses add to $p$ exactly, and the only
        error is float. That is why the technique is safe to ship on top of a
        product whose outputs people have already evaluated — it is a sampler for
        $p$, not a heuristic that resembles one. Note what the proof does *not*
        require: nothing about $q$'s shape, nothing about $\alpha$, nothing about
        how good the draft is. A bad draft costs speed and buys nothing else.

    - title: "Expected tokens per step is a geometric sum, plus the bonus token"
      latex: |
        Number the draft positions $1..\gamma$. The step emits the correction
        token unconditionally — either the residual draw at the first rejection,
        or the target's own draw at position $\gamma+1$ — so

        $$\mathbb{E}[T] = 1 + \sum_{k=1}^{\gamma} P(\text{the first } k \text{ drafts are all accepted}).$$

        With per-position acceptance probabilities $\alpha_1,\dots,\alpha_\gamma$
        the survival term is the product $\prod_{i\le k}\alpha_i$; call it the
        reach probability of position $k+1$, $R_k$. If the rates are equal to a
        common $\alpha$,

        $$\mathbb{E}[T] = 1 + \alpha + \alpha^2 + \dots + \alpha^{\gamma}
          = \frac{1-\alpha^{\gamma+1}}{1-\alpha}.$$

        Two limits are worth memorising. At $\gamma = 1$,
        $\mathbb{E}[T] = 1+\alpha$: a single draft token is worth having only if
        it survives more often than never. As $\gamma\to\infty$,
        $\mathbb{E}[T]\to 1/(1-\alpha)$ — 5.0 tokens per step at $\alpha = 0.8$.

        The product form is the one to use on real data, because it needs no
        assumption of constant $\alpha$. Measured at $\gamma = 4$:
        $1 + 0.785 + 0.613 + 0.398 + 0.285 = 3.08$, against 3.116 replayed — the
        two agree because acceptance happens to be flat here (0.761, 0.758,
        0.680, 0.715). Where it decays with position, only the product is right.
