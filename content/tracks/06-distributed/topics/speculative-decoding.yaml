    - title: "The acceptance rule reproduces the target distribution exactly"
      latex: |
        Let $q$ be the draft's distribution and $p$ the target's. A token $y$ can
        be emitted in exactly two ways: it was drawn from $q$ and accepted, or a
        draw was rejected and the correction produced $y$.

        The first path contributes $q(y)\min(1, p(y)/q(y)) = \min(p(y), q(y))$.
        The rejection probability is

        $$1-\alpha = 1-\sum_z \min(p(z), q(z)) = \sum_z \bigl(p(z)-q(z)\bigr)_+ ,$$

        because $p$ and $q$ both sum to one, so whatever mass $p$ has that $q$
        does not is exactly the mass acceptance failed to cover. The correction
        draw is normalised by that same quantity, so the second path contributes

        $$(1-\alpha)\cdot\frac{(p(y)-q(y))_+}{1-\alpha} = (p(y)-q(y))_+ .$$

        Adding the two paths,

        $$P(\text{output}=y) = \min(p(y),q(y)) + (p(y)-q(y))_+
          = p(y),$$

        since $\min(a,b) + (a-b)_+ = a$ for any real $a,b$. The identity holds
        pointwise, so it holds for the whole distribution. Measured on the
        reference pair: maximum absolute deviation $5.2\times10^{-18}$,
        empirical TV 0.0022 over $4\times10^{6}$ draws against a 0.0036 noise
        floor.
