    - language: python
      title: "The exact sampler, and the four numbers that decide whether it pays"
      note: >-
        Correct, and deliberately instrumented: it prints the cost ratio $c$, the
        verify overhead $v$, the tokens per step, the break-even ratio and the
        *effective* ratio recovered from the measured speedup. Those five numbers
        are the deployment decision, and three of them are routinely guessed. The
        draft is the target with its 512-direction logit matrix truncated to 32
        directions — a stand-in for a distilled sibling: 8x cheaper per pass,
        agreeing about three quarters of the time. Watch the last column: it says
        the implementation pays 0.40 for a draft token whose arithmetic costs
        0.128, and that is the whole reason the measured speedup is 1.0x while the
        formula says 1.56x. Sampling is inverse-CDF with `searchsorted` rather
        than `rng.choice(p=q)`, because the latter validates the whole
        distribution and costs about 30 microseconds a call — a quarter of a draft
        pass, which is enough to corrupt the comparison you are trying to make.
      code: |
        import numpy as np
        import time

        D, V, K, S = 512, 4096, 32, 12.0          # residual width, vocab, draft dims, logit scale
        rng = np.random.default_rng(5)
        sig = 1.0 / (1.0 + np.arange(D) / 60.0)   # decaying spectrum: the draft keeps the head
        U = (rng.normal(0, 1 / np.sqrt(D), (D, D)) * sig[None, :]).astype(np.float32)
        Vt = rng.normal(0, 1 / np.sqrt(V), (D, V)).astype(np.float32)
        Ud, Vd = np.ascontiguousarray(U[:, :K]), np.ascontiguousarray(Vt[:K, :])
        E = rng.normal(0, 0.6, (V, D)).astype(np.float32)


        def logits(X, A, B):
            return ((X @ A) @ B) * S


        def softmax(Z):
            Z = Z - Z.max(axis=1, keepdims=True)
            e = np.exp(Z)
            return e / e.sum(axis=1, keepdims=True)


        def draw(cdf, u):
            return int(np.searchsorted(cdf, u * cdf[-1]))


        def target_only(n, seed):
            r = np.random.default_rng(seed)
            y, emitted = 3, 1
            while emitted < n:
                p = softmax(logits(E[y:y + 1], U, Vt))[0]
                y = draw(np.cumsum(p), r.random())
                emitted += 1
            return emitted


        def speculative(n, gamma, seed):
            """Tokens emitted, steps taken, and per-position acceptance."""
            r = np.random.default_rng(seed)
            y, emitted, steps = 3, 0, 0
            hit, seen = np.zeros(gamma), np.zeros(gamma)
            while emitted < n:
                steps += 1
                draft, qs, last = [], [], y
                for _ in range(gamma):                       # gamma cheap passes
                    q = softmax(logits(E[last:last + 1], Ud, Vd))[0]
                    t = draw(np.cumsum(q), r.random())
                    draft.append(t); qs.append(q); last = t
                P = softmax(logits(E[np.array([y] + draft)], U, Vt))   # ONE target pass
                nacc = 0
                for i in range(gamma):
                    seen[i] += 1
                    if r.random() < min(1.0, float(P[i][draft[i]] / qs[i][draft[i]])):
                        hit[i] += 1
                        nacc += 1
                    else:
                        w = np.clip(P[i] - qs[i], 0.0, None)
                        draw(np.cumsum(w / w.sum()), r.random())       # exact residual
                        break                                          # rest is discarded
                emitted += nacc + 1                                    # + correction or bonus
            return emitted, steps, hit / np.maximum(seen, 1)


        def bench(fn, n=200):
            fn(); fn()
            t0 = time.perf_counter()
            for _ in range(n):
                fn()
            return (time.perf_counter() - t0) / n * 1e3


        SEEDS, N = (77, 78, 79), 320
        t_t = bench(lambda: logits(E[3:4], U, Vt))
        t_d = bench(lambda: logits(E[3:4], Ud, Vd))
        v = bench(lambda: logits(E[:5], U, Vt)) / t_t
        c = t_d / t_t
        print("target %.4f ms/token  draft %.4f ms/token  c = draft/target = %.3f  v(5) = %.2f"
              % (t_t, t_d, c, v))

        base = []
        for s in SEEDS:
            t0 = time.perf_counter(); target_only(N, s); base.append(time.perf_counter() - t0)
        base = float(np.mean(base))
        print("plain decode %.4f ms/token" % (base * 1e3 / N))

        for g in (1, 2, 3, 4, 6, 8):
            dt, tps, acc = [], [], []
            for s in SEEDS:
                t0 = time.perf_counter()
                e, st, per = speculative(N, g, s)
                dt.append(time.perf_counter() - t0)
                tps.append(e / st); acc.append(float(per.mean()))
            a, et, sp = float(np.mean(acc)), float(np.mean(tps)), base / float(np.mean(dt))
            formula = (1 - a ** (g + 1)) / ((1 - a) * (g * c + v))
            c_break = (et - 1.0) / g            # the cost ratio at which S = 1, at v = 1
            c_eff = (et / sp - v) / g           # the cost ratio your implementation actually has
            print("gamma %2d  alpha %.3f  %.2f tok/step  c_break %.3f  formula %.2fx  "
                  "measured %.2fx  c_eff %.3f" % (g, a, et, c_break, formula, sp, c_eff))

        # One run, verbatim. alpha and tokens/step reproduce exactly; timings move
        # 15-20% between runs, so c, v, measured and c_eff move with them — across
        # runs c_eff at gamma = 4 lands between 0.37 and 0.40 and measured between
        # 1.01x and 1.05x, while the 1.56x formula column does not move at all:
        # target 0.1268 ms/token  draft 0.0162 ms/token  c = draft/target = 0.128  v(5) = 1.48
        # plain decode 0.1657 ms/token
        # gamma  1  alpha 0.760  1.76 tok/step  c_break 0.760  formula 1.10x  measured 1.02x  c_eff 0.255
        # gamma  2  alpha 0.734  2.27 tok/step  c_break 0.633  formula 1.31x  measured 1.03x  c_eff 0.359
        # gamma  3  alpha 0.751  2.70 tok/step  c_break 0.568  formula 1.47x  measured 1.04x  c_eff 0.377
        # gamma  4  alpha 0.758  3.12 tok/step  c_break 0.529  formula 1.56x  measured 1.01x  c_eff 0.403
        # gamma  6  alpha 0.739  3.36 tok/step  c_break 0.393  formula 1.50x  measured 0.85x  c_eff 0.413
        # gamma  8  alpha 0.744  3.50 tok/step  c_break 0.313  formula 1.45x  measured 0.74x  c_eff 0.404

