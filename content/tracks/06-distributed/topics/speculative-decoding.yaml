      answerKind: short_text
      hint: >-
        Break-even is a cost ratio: $c_{\text{break}} = (\mathbb{E}[T]-1)/\gamma$
        at $v = 1$. Compute it at gamma = 4 and compare with 0.08.
      solution: >-
        It clears easily: $c_{\text{break}}(4) = (2.19-1)/4 = 0.30$, so 0.08 is
        nearly four times under the line. The best gamma is 3, at 1.63x. With
        $c = 0.08$ and $v = 1$: $\gamma=1$ gives 1.44; $\gamma=2$ gives 1.60;
        $\gamma=3$ gives 1.63; $\gamma=4$ gives 1.60. The curve is flat to within
        0.03x from gamma 2 to 4, because $\alpha = 0.55$ caps the ceiling at
        $1/(1-\alpha) = 2.22$ — the binding constraint here is acceptance, not
        cost, which is the opposite of the harness this topic measured.
    - id: cp-4
      question: >-
        The replay shows 3.12 tokens per step at $\gamma = 4$ and 0.758
        acceptance, and the model cost ratio is 0.128 — yet the measured speedup
        is 1.01x. Which of the four numbers in the formula is lying?
      answerKind: short_text
      hint: >-
        None of them. Invert the formula against the measured speedup and see what
        cost ratio it implies; then compare that with the ratio you measured on
        the models.
      solution: >-
        None of them; they describe different objects. Invert the formula:
        $c_{\text{eff}} = (\mathbb{E}[T]/S - v)/\gamma = (3.12/1.01 - 1.48)/4 =
        0.40$. The models cost 0.128, but the implementation pays 0.40, because
        each draft position also carries a softmax over the 4,096-token
        vocabulary, a cumsum, a search and the Python around them: 0.065 ms
        against 0.016 ms of arithmetic. The break-even line at $v = 1.48$ and
        $\gamma = 4$ is 0.41, so 0.40 against 0.41 is a dead heat, and 1.01x is
        the correct answer to "what does this implementation do". The formula was
        never wrong; it was answering "what would this algorithm do if a draft
        token cost what its arithmetic costs".
    - id: cp-5
      question: >-
        Acceptance is flat at about 0.76 across the four positions of a draft, and
        the effective cost ratio sits exactly on the break-even line. Do you fix
        acceptance, fix cost, or reduce gamma?
      answerKind: short_text
      hint: >-
        Which term in $c_{\text{eff}} = (\mathbb{E}[T]/S - v)/\gamma$ does each
        intervention move, and which one has the most headroom?
      solution: >-
        Fix cost, and reduce gamma only as a stopgap. Acceptance is already 0.76;
        pushing it to 0.85 buys $\mathbb{E}[T]$ from 3.12 to 4.0, which moves the
        measured ratio by about 25% and is a training project. Cost has a 3x gap:
        $c_{\text{eff}}$ is 0.40 against a model $c$ of 0.128, so fusing the
        per-position path — one kernel for logits, softmax and the draw — returns
        the whole difference and takes the speedup from 1.0x to 1.56x at the same
        acceptance. Reducing gamma to 1 or 2 is the correct immediate move because
        the break-even line is loosest there (0.76 and 0.63 at $v = 1$), but it
        caps you near 1.1x; it buys time, not throughput.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A decode step reads the entire model and produces one token. That is a
        terrible ratio: the expensive part is the read, and the token is a
        rounding error. If something cheap could guess the next few tokens, the
        expensive model could score all of them during the read it was going to do
        anyway, and keep the ones it agrees with.

        The hard part is not the guessing, it is keeping the output honest. A
        draft model has its own distribution, and "keep what the big model likes"
        quietly changes the distribution the product was evaluated on. The fix has
        to be a sampling correction so exact that a four-million-sample histogram
        cannot tell the output from the target's own samples.
      blocks:
        - kind: checklist
          body: |
            - A step costs a weight read, not a token count
            - Cheap model proposes, expensive model scores, one pass
            - Acceptance must be probabilistic, not greedy
            - Rejections need a correction draw from the right distribution
            - Tokens per step is a geometric sum, not gamma
            - A speedup claim is meaningless without a cost ratio
      checkpoint: >-
        Before going on: if the draft model is wrong 25% of the time, where
        exactly does the 25% go? It cannot simply be discarded, or the output
        would be missing the mass the draft overstated.

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Write the sampler first and prove it before you write the loop. The object
        you need is a function of $(p, q, x, u)$ that returns a token whose
        distribution is $p$ — and you can test it without any model at all, by
        running it four million times on a fixed pair of distributions and
        computing the total-variation distance to $p$.

        Then the loop, then the economics. Four numbers, each measured: acceptance
        $\alpha$, cost ratio $c$, verify overhead $v$, and the effective cost
        ratio $c_{\text{eff}}$ recovered from the speedup you actually got. Every
        wrong claim in this area comes from assuming one of the four.
      blocks:
        - kind: checklist
          body: |
            - Build the sampler and audit it with TV before timing anything
            - Acceptance: min(1, p(x)/q(x)); rejection: (p-q)+ renormalised
            - Use reach probabilities, not the mean acceptance fraction
            - Measure c as one draft pass over one target pass, on the models
            - Measure v as a gamma+1-position pass over a one-position pass
            - Invert your own speedup to get c_eff; if it is not c, fix the path
      checkpoint: >-
        Two implementations differ by one line and one of them is wrong. What
        single measurement separates them without looking at the text they
        produce?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The sampler is four lines; the loop is the scheduler around it. Note that
        the target is called once per step and the draft is called gamma times.
      blocks:
        - kind: pseudocode
          body: |
            accept_or_resample(p, q, x, u):
                if u < min(1, p[x] / q[x]):     # draft token survives
                    return x
                w = max(p - q, 0)               # residual: mass p has and q does not
                w = w / sum(w)
                return inverse_cdf(w, u2)       # one draw, exact

            step(prefix, gamma):
                draft, qs = [], []
                for i in 1..gamma:
                    q = draft_model(prefix + draft)
                    draft.append(sample(q)); qs.append(q)
                P = target_model(prefix + draft)      # ONE pass, gamma+1 rows
                for i in 1..gamma:
                    if accept(P[i], qs[i], draft[i]):
                        continue
                    correction = resample(P[i], qs[i])
                    return prefix + draft[:i] + [correction]
                bonus = sample(P[gamma + 1])          # nothing was rejected
                return prefix + draft + [bonus]

            speedup(alpha, gamma, c, v):
                tokens = (1 - alpha**(gamma+1)) / (1 - alpha)
                return tokens / (v + gamma * c)

            break_even(alpha, gamma, v):
                return ((1 - alpha**(gamma+1)) / (1 - alpha) - v) / gamma
      checkpoint: >-
        In `step`, why does `P` need `gamma + 1` rows when only `gamma` draft
        tokens exist — and what would break if you only scored `gamma` positions?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Four expressions: exactness, expected length, speedup, and the cost ratio
        at which the speedup disappears.
      blocks:
        - kind: math
          body: |
            Exactness. Acceptance contributes $\min(p,q)$ because
            $q\min(1,p/q) = \min(p,q)$. Rejection happens with probability
            $1-\alpha = \sum_z (p-q)_+$, and the residual is normalised by that
            same mass, so the correction contributes $(p-q)_+$. Then

            $$P(\text{output}=y) = \min(p,q) + (p-q)_+ = p(y).$$

            Measured: TV 0.0022 over $4\times10^6$ draws, noise floor 0.0036,
            analytic deviation $5\times10^{-18}$. Resample-from-$p$ instead gives
            $\min(p,q)+(1-\alpha)p$, TV 0.1001 — a permanent 46x bias.

            Length. One guaranteed token plus one per accepted draft prefix:

            $$\mathbb{E}[T] = 1+\alpha+\dots+\alpha^{\gamma}
              = \frac{1-\alpha^{\gamma+1}}{1-\alpha},$$

            measured at 1.760, 2.266, 2.703, 3.116, 3.502 for gamma 1, 2, 3, 4, 8.

            Cost. The step costs $v + \gamma c$ target-pass equivalents, so

            $$S = \frac{\mathbb{E}[T]}{v+\gamma c},
              \qquad c_{\text{break}} = \frac{\mathbb{E}[T]-v}{\gamma}.$$

            At $\alpha=0.76$, $v=1$: $c_{\text{break}}$ falls from 0.760 at
            $\gamma=1$ to 0.313 at $\gamma=8$. At $v=1.48$, $\gamma=4$ the line is
            0.41 — and the implementation's measured $c_{\text{eff}}$ is 0.40,
            which is why the measured speedup is 1.01x rather than 1.56x.
      checkpoint: >-
        The break-even ratio falls as gamma grows, so a longer draft has to be
        cheaper. Explain the mechanism in one sentence, then say what it implies
        about which gamma a fixed-model draft should use.

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The sampler, the loop, and the four measurements that decide whether to
        ship it. The failure modes are all in the measurement, not the algebra.
      blocks:
        - kind: warning
          body: >-
            Three numbers get faked without anyone lying. Quoting tokens per step
            as throughput ignores $\gamma c$ in the denominator. Averaging
            acceptance instead of multiplying reach overstates long drafts — the
            mean rate stays at 0.74 while the reach of position eight collapses to
            0.13. And quoting the cost ratio of the two models as the cost ratio
            of the system understates it by 3x on this harness, which is the
            difference between a 1.56x prediction and a 1.01x measurement.
        - kind: code
          language: python
          body: |
            import numpy as np

            def accept_or_resample(p, q, x, u, rng):
                """One draw whose distribution is exactly p."""
                ratio = p[x] / q[x] if q[x] > 0 else np.inf
                if u < min(1.0, ratio):
                    return int(x)
                w = np.clip(p - q, 0.0, None)
                total = w.sum()
                if total <= 0.0:
                    return int(x)
                cdf = np.cumsum(w / total)
                return int(np.searchsorted(cdf, rng.random() * cdf[-1]))


            def speculative_step(target, draft_model, prefix, gamma, rng):
                draft, qs = [], []
                for _ in range(gamma):
                    q = draft_model(prefix + draft)
                    cdf = np.cumsum(q)
                    t = int(np.searchsorted(cdf, rng.random() * cdf[-1]))
                    draft.append(t)
                    qs.append(q)
                P = target(prefix + draft)                  # ONE pass, gamma+1 rows
                for i in range(gamma):
                    if rng.random() < min(1.0, P[i][draft[i]] / qs[i][draft[i]]):
                        continue
                    w = np.clip(P[i] - qs[i], 0.0, None)
                    cdf = np.cumsum(w / w.sum())
                    corr = int(np.searchsorted(cdf, rng.random() * cdf[-1]))
                    return prefix + draft[:i] + [corr]
                cdf = np.cumsum(P[gamma])
                bonus = int(np.searchsorted(cdf, rng.random() * cdf[-1]))
                return prefix + draft + [bonus]


            def plan(alpha, c, v, max_gamma=32):
                """Best gamma, its speedup, and the cost ratio that would tie."""
                best = max(range(1, max_gamma + 1),
                           key=lambda g: (1 - alpha ** (g + 1))
                                         / ((1 - alpha) * (v + g * c)))
                tokens = (1 - alpha ** (best + 1)) / (1 - alpha)
                return {"gamma": best,
                        "speedup": tokens / (v + best * c),
                        "tokens_per_step": tokens,
                        "c_break": (tokens - v) / best,
                        "ceiling": 1.0 / ((1 - alpha) * v)}
        - kind: checklist
          body: |
            - alpha = sum min(p,q): 0.785 for the temperature pair, 0.758 for the truncated draft
            - Correct sampler TV 0.0022; naive residual TV 0.1002; noise floor 0.0036
            - Tokens/step 1.760, 2.266, 2.703, 3.116, 3.502 at gamma 1, 2, 3, 4, 8
            - Reach probabilities 1.000, 0.785, 0.613, 0.398 inside a gamma = 4 step
            - c = 0.128 on the models, 0.40 effective; v = 1.48 here, 1.03 on an H800
            - c_break at gamma=4 is 0.529 with v=1, 0.41 with v=1.48
            - Measured 1.02x at gamma=1, 1.01x at gamma=4, 0.74x at gamma=8
      checkpoint: >-
        `plan` returns `c_break` next to the speedup. If your measured $c$ is
        close to it, what are the three levers available, and which one does the
        measurement say has the most headroom?

  problems:
    - id: p-accept-resample
      title: "One exact draw from the acceptance rule"
      difficulty: medium
      prompt: >-
        Implement `accept_or_resample(p, q, draft, u_accept, u_resample)`.

        `p` and `q` are lists of equal length summing to 1 (the target and draft
        distributions at one position). `draft` is the token index the draft
        sampled. `u_accept` and `u_resample` are uniforms in [0, 1).

        Accept the draft token when `u_accept < min(1, p[draft] / q[draft])`
        (strictly less; treat `q[draft] == 0` as an infinite ratio) and return it.
        Otherwise build `w = max(p[i] - q[i], 0)`, normalise it by its sum, and
        return the smallest index `i` whose cumulative sum is strictly greater
        than `u_resample`, falling back to the last index. If `w` sums to zero,
        return `draft`.

        Return an integer token index.
      starter: |
        def accept_or_resample(p, q, draft, u_accept, u_resample):
            # your implementation here
            pass
      language: python
      entry: accept_or_resample
      testCases:
        - input: '[[0.7, 0.3], [0.2, 0.8], 1, 0.5, 0.0]'
          expected: '0'
          mode: json
          tolerance: 1e-12
        - input: '[[0.7, 0.3], [0.2, 0.8], 1, 0.2, 0.0]'
          expected: '1'
          mode: json
          tolerance: 1e-12
        - input: '[[0.5, 0.5], [0.5, 0.5], 0, 0.99, 0.5]'
          expected: '0'
          mode: json
          tolerance: 1e-12
        - input: '[[0.1, 0.2, 0.7], [0.6, 0.3, 0.1], 0, 0.5, 0.9]'
          expected: '2'
          mode: json
          tolerance: 1e-12
        - input: '[[0.1, 0.2, 0.7], [0.6, 0.3, 0.1], 1, 0.5, 0.9]'
          expected: '1'
          mode: json
          tolerance: 1e-12
        - input: '[[0.05, 0.35, 0.6], [0.5, 0.1, 0.4], 0, 0.99, 0.3]'
          expected: '1'
          mode: json
          tolerance: 1e-12
        - input: '[[0.05, 0.35, 0.6], [0.5, 0.1, 0.4], 0, 0.99, 0.6]'
          expected: '2'
          mode: json
          tolerance: 1e-12
        - input: '[[0.05, 0.35, 0.6], [0.5, 0.1, 0.4], 0, 0.05, 0.0]'
          expected: '0'
          mode: json
          tolerance: 1e-12
        - input: '[[0.25, 0.25, 0.25, 0.25], [0.4, 0.3, 0.2, 0.1], 3, 0.1, 0.0]'
          expected: '3'
          mode: json
          tolerance: 1e-12
        - input: '[[0.5, 0.5], [0.25, 0.75], 1, 0.9, 0.0]'
          expected: '0'
          mode: json
          tolerance: 1e-12
      solution: |
        import numpy as np


        def accept_or_resample(p, q, draft, u_accept, u_resample):
            p = np.asarray(p, dtype=float)
            q = np.asarray(q, dtype=float)
            d = int(draft)
            ratio = p[d] / q[d] if q[d] > 0.0 else float("inf")
            if u_accept < min(1.0, float(ratio)):
                return d
            w = np.clip(p - q, 0.0, None)
            total = w.sum()
            if total <= 0.0:
                return d
            cdf = np.cumsum(w / total)
            return min(int(np.searchsorted(cdf, u_resample, side="right")), len(w) - 1)
      solutionExplanation: >-
        The first two cases are the same position with two uniforms, and they are
        the whole rule: $p(1)/q(1) = 0.3/0.8 = 0.375$, so a uniform of 0.5 rejects
        and a uniform of 0.2 accepts. When it rejects, the residual $(0.5, 0)$
        normalises to $(1, 0)$, so the only legal correction is token 0 — the
        draft proposed the wrong token and the target's remaining mass points the
        other way. The third case is $p = q$: the ratio is exactly 1, every
        uniform is below it, and the residual path is never reached, which is why
        the zero-sum branch exists as a guard rather than as a live path. The
        fourth and fifth are a rejection and an acceptance at the same position
        and they show the ratio working in both directions: token 0 is rejected
        because the draft overweights it six to one, token 1 is accepted because
        the target weights it two to three. The sixth and seventh test the
        inverse CDF: the residual of $(0.05,0.35,0.6)$ against $(0.5,0.1,0.4)$ is
        $(0, 0.25, 0.2)$, normalising to $(0, 0.556, 0.444)$, so a uniform of 0.3
        lands on 1 and 0.6 lands on 2 — an implementation that forgets to
        renormalise divides by the pre-clip sum and returns 2 for both. The eighth
        is the case that catches an inverted test: the ratio is
        $0.05/0.5 = 0.1$ and the uniform is 0.05, so it accepts narrowly, and a
        solver who wrote `u > min(1, p/q)` rejects and then hands back the
        residual's only non-zero entry, token 1, instead of 0. The ninth accepts a
        token whose ratio is $0.25/0.1 = 2.5$, which catches a solver who
        special-cases the final position instead of evaluating the ratio. The
        tenth is the rejection that lands on the residual's only non-zero entry,
        token 0, for a pair where the target and draft share token 1 exactly.
      complexity: "O(V) time and O(V) space for the residual"
      tags: [rejection-sampling, acceptance, speculative-decoding]

    - id: p-gamma-plan
      title: "Choose gamma, and find the cost ratio that ties"
      difficulty: medium
      prompt: >-
        Implement `spec_plan(alpha, c, max_gamma)` returning a dict with exactly
        the keys `best_gamma`, `expected_tokens`, `speedup` and `c_break`.

        For a candidate lookahead `g` in `1..max_gamma`, expected tokens per step
        is `(1 - alpha ** (g + 1)) / (1 - alpha)`, or `g + 1` when `alpha >= 1`.
        The speedup at cost ratio `c` with `v = 1` is `expected_tokens / (g * c +
        1)`. Return the `g` with the largest speedup, breaking ties toward the
        smaller `g` (compare with a strict `>` against the best so far plus
        1e-15), that `g`'s expected tokens and speedup, and
        `c_break = (expected_tokens - 1) / g` — the cost ratio at which this
        gamma would tie.
      starter: |
        def spec_plan(alpha, c, max_gamma):
            # your implementation here
            pass
      language: python
      entry: spec_plan
      testCases:
        - input: '[0.8, 0.1, 8]'
          expected: '{"best_gamma": 6, "expected_tokens": 3.9514240000000003, "speedup": 2.46964, "c_break": 0.49190400000000006}'
          mode: json
          tolerance: 1e-12
        - input: '[0.5, 0.3, 6]'
          expected: '{"best_gamma": 1, "expected_tokens": 1.5, "speedup": 1.1538461538461537, "c_break": 0.5}'
          mode: json
          tolerance: 1e-12
        - input: '[0.0, 0.1, 4]'
          expected: '{"best_gamma": 1, "expected_tokens": 1.0, "speedup": 0.9090909090909091, "c_break": 0.0}'
          mode: json
          tolerance: 1e-12
        - input: '[1.0, 0.2, 3]'
          expected: '{"best_gamma": 3, "expected_tokens": 4.0, "speedup": 2.5, "c_break": 1.0}'
          mode: json
          tolerance: 1e-12
        - input: '[0.9, 0.5, 10]'
          expected: '{"best_gamma": 3, "expected_tokens": 3.4390000000000005, "speedup": 1.3756000000000002, "c_break": 0.8130000000000002}'
          mode: json
          tolerance: 1e-12
        - input: '[0.76, 0.128, 8]'
          expected: '{"best_gamma": 4, "expected_tokens": 3.1101977599999997, "speedup": 2.0570091005291005, "c_break": 0.5275494399999999}'
          mode: json
          tolerance: 1e-12
      solution: |
        def spec_plan(alpha, c, max_gamma):
            best_g, best_e, best_s = 1, 0.0, -1.0
            for g in range(1, int(max_gamma) + 1):
                if alpha >= 1.0:
                    e = float(g + 1)
                else:
                    e = (1.0 - alpha ** (g + 1)) / (1.0 - alpha)
                s = e / (g * c + 1.0)
                if s > best_s + 1e-15:
                    best_g, best_e, best_s = g, e, s
            return {"best_gamma": best_g, "expected_tokens": best_e,
                    "speedup": best_s, "c_break": (best_e - 1.0) / best_g}
      solutionExplanation: >-
        The first case is the interior optimum the plot shows: at $\alpha=0.8$ and
        $c=0.1$ the best is 6 at 2.47x, and $\gamma=8$ has fallen to 2.28x because
        two extra draft passes cost 0.2 of a target pass and buy 0.09 of a token.
        The second is the discouraging one: at $\alpha=0.5$ and $c=0.3$ the only
        break-even gamma is 1, at 1.15x — the curve decreases monotonically
        because each extra pass costs 0.3 and buys at most 0.5 of a token. The
        third is the degenerate case that catches both a divide-by-zero and a
        missing floor: at $\alpha=0$ the draft never contributes, tokens are 1 for
        every gamma, `c_break` is 0, and the best is the smallest gamma — 0.909x,
        a 9% tax, and the right answer is not to deploy it. The fourth exercises
        the $\alpha=1$ branch where the closed form divides by zero, so tokens
        fall back to $\gamma+1$, the best is the largest gamma available, and
        `c_break` is exactly 1.0 — a perfect draft tolerates a cost ratio of one
        and no worse. The fifth shows cost dominating: at $c=0.5$ even
        $\alpha=0.9$ peaks at 1.38x, because three draft passes cost 1.5 target
        passes. The sixth is this topic's own measurement: $\alpha=0.76$,
        $c=0.128$ gives 4 at 2.06x with a tie-line of 0.53 — and the harness,
        whose effective cost ratio is 0.40, measures 1.01x, because at $\gamma=4$
        the line with $v=1.48$ is 0.41, not 0.53.
      complexity: "O(max_gamma) time and O(1) space"
      tags: [speculative-decoding, gamma, break-even, tuning]

    - id: p-sampler-audit
      title: "Audit a sampler against the target distribution"
      difficulty: medium
      prompt: >-
        Implement `sampler_audit(p, q, counts)` returning a dict with exactly the
        keys `tv`, `alpha`, `naive_tv` and `worst_index`.

        `p` and `q` are lists summing to 1. `counts` are observed counts per token
        from some sampler, so `obs = counts / sum(counts)`.

        `tv` is `0.5 * sum(abs(obs[i] - p[i]))`. `alpha` is
        `sum(min(p[i], q[i]))`. `naive_tv` is the total-variation distance from
        `p` of what a naive sampler produces when it resamples from `p` itself on
        rejection: `out = min(p, q) + (1 - alpha) * p`, so
        `naive_tv = 0.5 * sum(abs(out[i] - p[i]))`. `worst_index` is the smallest
        index maximising `abs(obs[i] - p[i])`.
      starter: |
        def sampler_audit(p, q, counts):
            # your implementation here
            pass
      language: python
      entry: sampler_audit
      testCases:
        - input: '[[0.5, 0.3, 0.2], [0.2, 0.3, 0.5], [5200, 2900, 1900]]'
          expected: '{"tv": 0.020000000000000018, "alpha": 0.7, "naive_tv": 0.15, "worst_index": 0}'
          mode: json
          tolerance: 1e-12
        - input: '[[0.5, 0.3, 0.2], [0.2, 0.3, 0.5], [5000, 3000, 2000]]'
          expected: '{"tv": 0.0, "alpha": 0.7, "naive_tv": 0.15, "worst_index": 0}'
          mode: json
          tolerance: 1e-12
        - input: '[[0.1, 0.2, 0.7], [0.6, 0.3, 0.1], [1200, 2500, 6300]]'
          expected: '{"tv": 0.06999999999999997, "alpha": 0.4, "naive_tv": 0.17999999999999997, "worst_index": 2}'
          mode: json
          tolerance: 1e-12
        - input: '[[0.25, 0.25, 0.25, 0.25], [0.25, 0.25, 0.25, 0.25], [250, 250, 250, 250]]'
          expected: '{"tv": 0.0, "alpha": 1.0, "naive_tv": 0.0, "worst_index": 0}'
          mode: json
          tolerance: 1e-12
        - input: '[[0.5, 0.5], [0.5, 0.5], [400, 600]]'
          expected: '{"tv": 0.09999999999999998, "alpha": 1.0, "naive_tv": 0.0, "worst_index": 0}'
          mode: json
          tolerance: 1e-12
      solution: |
        import numpy as np


        def sampler_audit(p, q, counts):
            p = np.asarray(p, dtype=float)
            q = np.asarray(q, dtype=float)
            cnt = np.asarray(counts, dtype=float)
            obs = cnt / cnt.sum()
            alpha = float(np.minimum(p, q).sum())
            naive = np.minimum(p, q) + (1.0 - alpha) * p
            return {
                "tv": float(0.5 * np.abs(obs - p).sum()),
                "alpha": alpha,
                "naive_tv": float(0.5 * np.abs(naive - p).sum()),
                "worst_index": int(np.argmax(np.abs(obs - p))),
            }
      solutionExplanation: >-
        This is the instrument that separates a working sampler from a plausible
        one, and the cases are chosen so that each failure mode shows up
        separately. The first is a sampler that is nearly right: 200 samples in
        10,000 land on the wrong token, TV is 0.02, and the naive rule's bias on
        the same pair is 0.15 — seven times a sampling error that a longer run
        would fix. The second is the same pair with exact counts, TV exactly 0,
        and `naive_tv` still 0.15: the bias belongs to the rule, not to the
        sample, which is the whole lesson of this topic in one row. The third is
        the only case where `worst_index` is not 0, and it also shows the bias and
        the overlap moving independently: only 0.4 of the mass is shared, so the
        naive rule is off by 0.18, more than the first pair's 0.15 despite the
        same formula, because the shared mass is smaller and the residual is
        bigger. The fourth is the identity: when $p = q$, alpha is 1, the residual
        is empty, the naive rule coincides with the correct one, and every number
        is 0 — an implementation that divides by `1 - alpha` crashes here. The
        fifth is the one that catches people who think exactness is only about
        acceptance: $p = q$, so `alpha` is 1 and `naive_tv` is 0, yet the observed
        counts are 400/600 against a uniform target and TV is 0.1 — a sampler can
        have an unbiased rule and still be broken in its CDF.
      complexity: "O(V) time and O(V) space"
      tags: [total-variation, rejection-sampling, auditing, speculative-decoding]

  try_it: >-
    With an acceptance rate of 0.76 and a four-token draft, compute the expected tokens per step
    from (1 − α^(γ+1))/(1 − α). You should get about 3.11, not 4. Then compute the break-even
    cost ratio c = (E[T] − 1)/γ, about 0.53, and compare it with the 0.40 measured on a real
    serving stack.
  interview_questions:
    - question: "Why is the acceptance rule min(1, p(x)/q(x)) rather than 'keep the token when the target agrees with the draft'?"
      level: mid
      key_points:
        - "Keeping the argmax token changes the distribution: it collapses sampling onto the target's mode, which is not a draw from p at temperature."
        - "The accept test plus a residual draw r(y) proportional to (p(y) − q(y))_+ is exact rejection sampling: measured TV distance 0.0022, below the 0.0036 sampling-noise floor, and an analytic difference of 5.2e−18."
        - "The naive repair — resampling from p on rejection — gives TV distance 0.1001, which is 46× the correct sampler's error."
        - "So the exactness lives in the residual, not in the accept test, and the accept test alone is not enough."
      follow_up: "What must the residual be proportional to, and why does that expression make the mixture exactly p?"
    - question: "You measure a healthy 0.76 acceptance rate and get 1.02×. Where did the arithmetic promise 1.5×?"
      level: senior
      key_points:
        - "The speedup is (1 − α^(γ+1)) / ((1 − α)(v + γc)), not 1/(1 − α); v and c are both in the denominator because every draft token is paid for."
        - "Break-even is a cost ratio: c_break(γ) = (E[T] − 1)/γ, which is 0.760 at γ = 1, 0.529 at 4 and 0.313 at 8."
        - "Measured c_eff at γ = 4 was 0.40 against a 0.41 break-even, so the run was 1.01× — an acceptance rate of 0.758 with nothing wrong with acceptance."
        - "The model's cost ratio of 0.128 is not the stack's: per-position bookkeeping and unfused verification inflate it two to three times."
      follow_up: "How would you measure c_eff from a running system instead of assuming the model's ratio?"
    - question: "Does acceptance decay across a four-token draft? What does decay instead?"
      level: senior
      key_points:
        - "Measured conditional acceptance at positions 1 to 4 was 0.761, 0.758, 0.680 and 0.715 — no systematic decay, because each draft token is judged against the target's logits on the same prefix."
        - "What decays is the probability of reaching position k, which is α^k, so the step emits 1 + α + α² + … tokens rather than γ."
        - "At α = 0.76 and γ = 4 that is about 3.11 tokens per step, and at α = 0.5 it is under 2."
        - "Because draft cost grows linearly in γ while the expected gain saturates, the speedup has an interior maximum — γ = 4 at α = 0.7 and γ = 5 at α = 0.8."
      follow_up: "At α = 0.5, what γ is optimal, and why is it smaller than at α = 0.8?"
  common_mistakes:
    - "Keeping the token whenever the draft and target agree, which changes the output distribution while every benchmark still looks plausible."
    - "Resampling from p on rejection instead of from the residual, which is 46× further from the target distribution — TV 0.1001 against 0.0022."
    - "Quoting the paper's 2.4× without measuring your own cost ratio, when 0.40 against a 0.41 break-even is a 1.01× result."
  further_reading:
    - label: "Leviathan, Kalman, Matias, Fast Inference from Transformers via Speculative Decoding, ICML 2023"
    - label: "Chen, Borgeaud, Irving, Lespiau, Sifre, Jumper, Accelerating Large Language Model Decoding with Speculative Sampling"
