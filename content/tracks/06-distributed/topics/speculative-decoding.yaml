      title: "The residual everyone writes first, and what it costs"
      note: >-
        **Numerically WRONG, in the way this mistake is actually made.** One line
        differs from the reference sampler: on rejection it draws from `p` itself
        instead of from `(p - q)+` renormalised. That is the reading most people
        take from "if the draft is rejected, sample from the target", and it is
        wrong because it double-counts the mass the two distributions share. On
        the reference pair it reports **TV 0.1002 from the target against the
        correct sampler's 0.0022 — a 46x bias that never shrinks**, because it is
        a bias, not variance: four million samples move it by less than 0.0001.
        Nothing raises, the text is fluent, and the damage is that every rejected
        position over-represents tokens the target already favoured, which reads
        as shorter and more repetitive completions. Pairing this with a greedy
        verify — keep the draft token when the target's argmax agrees — is the
        other half of the bug: it samples from $p$ only where $p > q$.
      code: |
        import numpy as np

        V, N = 256, 4_000_000
        rng = np.random.default_rng(11)
        z = rng.normal(0.0, 1.7, V)


        def softmax(z, t):
            a = np.exp(z / t - (z / t).max())
            return a / a.sum()


        p, q = softmax(z, 1.0), softmax(z, 1.6)        # draft = target at temperature 1.6
        alpha = float(np.minimum(p, q).sum())


        def sample(rule, r):
            """One pass over the vocabulary; `r` is shared so the stream is reproducible."""
            x = r.choice(V, size=N, p=q)
            u = r.random(N)
            ok = u < np.minimum(1.0, p[x] / q[x])
            out = np.empty(N, dtype=np.int64)
            out[ok] = x[ok]
            k = int((~ok).sum())
            if rule == "residual":                     # correct: (p-q)+ renormalised
                w = np.clip(p - q, 0.0, None)
                w = w / w.sum()
            else:                                      # WRONG: draw from the target
                w = p
            out[~ok] = r.choice(V, size=k, p=w)
            return out


        def tv_to_p(x):
            h = np.bincount(x, minlength=V).astype(float)
            return 0.5 * np.abs(h / h.sum() - p).sum()


        r = np.random.default_rng(2024)
        correct = sample("residual", r)
        naive = sample("naive", r)
        a, b = r.choice(V, N, p=p), r.choice(V, N, p=p)     # two draws from p itself

        print("alpha %.4f  TV(p,q) %.4f" % (alpha, 0.5 * np.abs(p - q).sum()))
        print("correct residual  TV %.4f" % tv_to_p(correct))
        print("naive residual    TV %.4f" % tv_to_p(naive))
        print("naive analytic    TV %.4f"
              % (0.5 * np.abs(np.minimum(p, q) + (1 - alpha) * p - p).sum()))
        print("noise floor, two draws from p: %.4f"
              % (0.5 * np.abs(np.bincount(a, minlength=V) / N
                              - np.bincount(b, minlength=V) / N).sum()))

        # alpha 0.7849  TV(p,q) 0.2151
        # correct residual  TV 0.0022
        # naive residual    TV 0.1002
        # naive analytic    TV 0.1001
        # noise floor, two draws from p: 0.0036

  checkpoints:
    - id: cp-1
      question: >-
        The draft model's distribution $q$ never appears in the output — only in
        the acceptance ratio and in the residual. Why is that enough for the
        output to be exactly $p$?
      answerKind: short_text
      hint: >-
        Split the outcome by path: accepted draws and correction draws. What mass
        does each path contribute at token $y$, and what is the rejection
        probability in terms of $p$ and $q$?
      solution: >-
        Because the two paths partition the space and their masses add to $p$.
        Acceptance contributes $q(y)\min(1,p(y)/q(y)) = \min(p(y),q(y))$. The
        rejection probability is $1-\alpha = \sum_z(p(z)-q(z))_+$, and the
        correction draw is normalised by exactly that, so it contributes
        $(1-\alpha)\cdot(p(y)-q(y))_+/(1-\alpha) = (p(y)-q(y))_+$. Since
        $\min(a,b)+(a-b)_+ = a$, the sum is $p(y)$ for every $y$. Nothing
        downstream needs to know $q$'s shape; $q$ entered through the ratio and
        the residual, and both cancelled.
    - id: cp-2
      question: >-
        You keep a draft token whenever the target's top-1 token agrees with it,
        and otherwise replace it with the target's top-1. The text looks fine.
        What distribution are you sampling from, and how would you prove it is
        wrong?
      answerKind: short_text
      hint: >-
        Where $p > q$ the rule always keeps the draft token; where $q > p$ it
        always replaces it. Write down the resulting probability of each token.
      solution: >-
        You are sampling from something like $\min(p,q)$ plus a point mass on the
        target's argmax at each rejection — not from $p$. Where the draft
        overweights a token ($q > p$), the rule never emits it, so the target's own
        probability for that token is thrown away; where the draft underweights it,
        the rule always keeps it, so the token is over-emitted. The proof is the
        instrument from this topic: draw four million samples, histogram them,
        compute $0.5\sum_y|\hat p(y)-p(y)|$. The correct sampler measures 0.0022
        against a 0.0036 noise floor; resample-from-$p$ measures 0.1002
        analytically and 0.1002 empirically. Greedy verify is worse still, because
        it is deterministic where $p$ is not.
