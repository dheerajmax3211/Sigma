        that does not at small gamma: a fully accepted one-token draft yields two
        tokens, not one, so the marginal value of the first draft token is its
        entire acceptance probability. It is also why the numerator in the
        speedup formula runs to $\gamma$ rather than to $\gamma-1$ — one extra
        term, and it is the one that makes $\gamma = 1$ worth deploying.

