id: data-parallelism
slug: data-parallelism
title: "Data Parallelism: All-Reduce, Bucketing, and Scaling"
summary: >-
  Split a batch across workers, average the gradients so the step is exactly the
  one a W-times-larger batch would have taken, and then price the synchronisation
  honestly: 23.45 GB per rank and 78 ms on NVLink for a 7B model, 2(N-1)/N times
  the model bytes on every step, and the reason strong scaling collapses while
  weak scaling does not.
kind: lesson
difficulty: hard
position: 1
estMinutes: 26
prerequisites: [backpropagation, gradient-descent-variants]
phase: distributed-training
tags: [data-parallelism, all-reduce, ring-allreduce, bucketing, ddp, parameter-server, scaling-efficiency, communication, distributed-training]

body:
  big_idea: >-
    The mean of the workers' gradients is not an approximation of the
    large-batch gradient — it is that gradient. Data parallelism changes the
    batch size and the bill, never the mathematics.
  problem:
    - "A second GPU makes the run 1.7x faster, not 2x, and the missing 30% is a collective you cannot see in the Python profile."
    - "Someone divides the loss by world_size before backward, so the model needs a learning rate eight times larger and the direction still looks perfect."
    - "A 64-GPU job reports 35% scaling efficiency with accelerators idle 60% inside one collective: bandwidth, batch, buckets or topology?"
  analogy: >-
    Eight surveyors measure a valley, each walking a different eighth and
    radioing back one average elevation. The coordinator averages the eight
    averages and gets the valley's mean exactly — a mean of means weighted by
    area is the mean over all the area. The radio report is one number per
    grid cell, so its cost is fixed however much land each surveyor covered.
  concept_points:
    - "**The mean of the shard gradients is the full-batch gradient, exactly.** Measured over 8 shards of an 8,192-example logistic regression: max absolute difference **1.4e-17** in float64 and **6.8e-08** in float32 — round-off. A mean of means weighted by shard size is the mean over the union. Divide by $W$ as well and each worker's already-averaged loss is averaged twice: the gradient is $W$ times too small."
    - "**Any positive scalar preserves the descent direction, so the sum bug is invisible in every direction-based check.** $\\cos(c\\,g, g) = 1$ for $c > 0$; measured, $\\|\\sum_w g_w\\| / \\|\\operatorname{mean}_w g_w\\|$ is exactly **8.000000** at $W = 8$. The step is not invisible: at $\\eta = 1.9/\\lambda_{\\max}$ the mean rule reaches **0.262** in 60 steps, the sum rule **9.8e135**."
    - "**Ring all-reduce costs $2(N-1)S/N$ bytes per rank and saturates at $2S$.** Instrumented on a 32 MB payload: **32.0, 48.0, 56.0 MB** per rank at $N = 2, 4, 8$. For a 7B fp16 model ($S = 13.4$ GB) that is **23.45 GB per rank at 8** and **26.38 GB at 64**, against the **214.4 GB** a parameter server's NIC carries at $N = 8$ — a factor of **9.1**."
    - "**It is bandwidth-bound by four orders of magnitude.** At $N = 8$, $S = 13.4$ GB the reduce does $5.86\\times10^{9}$ additions — **5.9 us** at 989 TFLOP/s — against **78.2 ms** of transfer at 300 GB/s, a factor of **13,187**. Arithmetic intensity is **0.25 FLOP/byte** against a 295 FLOP/byte ridge, so the tensor cores are idle by design and only fewer bytes or a wider pipe help."
    - "**Bucketing reduces collective calls, not bytes, and only matters when the message is small.** At $\\alpha = 8\\,\\mu$s and 300 GB/s a 200 MB gradient in 1,000 tensors costs **8.667 ms** unbucketed against **0.731 ms** in 8 buckets — **11.9x** — while the 13.4 GB gradient gains only **1.18x**. Bucket size has an interior optimum $b^\\star = S\\sqrt{2\\alpha/T_{\\text{step}}}$, and the real payoff is overlap with the backward pass."
    - "**Scaling efficiency is $T_{\\text{compute}}/(T_{\\text{compute}} + T_{\\text{comm}})$, set by tokens per accelerator, not by worker count.** With the global batch pinned at 65,536 tokens, efficiency falls from **91.4%** at 8 GPUs to **54.2%** at 64 and **22.6%** at 256; holding 8,192 tokens per GPU it stays **91.4%, 90.4%, 90.3%**. The per-rank bill does not grow — the work amortising it shrinks."
  definitions:
    - term: "Data parallelism"
      meaning: >-
        Replicating the whole model on every worker and splitting the batch
        instead. Each worker runs forward and backward on its own shard, the
        gradients are averaged across workers, and every worker applies the same
        update. Parameters and optimizer state are duplicated $W$ times, which
        is why it is the cheapest topology to implement and the first to run out
        of memory.
    - term: "Rank"
      meaning: >-
        One participating process in a collective, numbered $0 \ldots N-1$.
        Ranks are not the same thing as devices — one rank per GPU is the common
        mapping, but a rank can own a NUMA socket or be a CPU process in a
        simulation. Every rank in a ring all-reduce sends exactly the same
        number of bytes, which is what makes the algorithm symmetric.
    - term: "All-reduce"
      meaning: >-
        A collective that combines a buffer across all ranks and leaves the
        result in every rank's buffer. Data parallelism needs it because every
        worker must apply the same averaged gradient; a one-rank reduction would
        leave the others with stale weights. Cost: $2(N-1)S/N$ bytes per rank
        for a ring, and it is the single largest communication cost in training.
    - term: "Reduce-scatter and all-gather"
      meaning: >-
        The two halves of a ring all-reduce. Reduce-scatter sums each chunk
        around the ring so that rank $r$ ends up owning one fully reduced chunk;
        all-gather then circulates those chunks so every rank has all of them.
        Each half moves $(N-1)S/N$ bytes per rank, which is why the total is
        twice that and why neither half alone is a full all-reduce.
    - term: "Ring all-reduce"
      meaning: >-
        The bandwidth-optimal all-reduce: $N$ ranks in a cycle, $2(N-1)$ steps
        of $S/N$ bytes each. Optimal because every link carries the minimum
        possible traffic and no node is a hotspot; its weakness is latency,
        since the steps are sequential, which is why trees win for small
        messages and large $N$.
    - term: "Parameter server"
      meaning: >-
        The older alternative: workers push gradients to a central server (or a
        sharded set of them), which averages and pushes parameters back. Two
        hops of latency instead of $2(N-1)$, and it supports asynchronous and
        stale updates, but the server's NIC must carry $2NS$ bytes per step, so
        it does not scale past a few dozen workers without sharding itself.
    - term: "Gradient bucket"
      meaning: >-
        A fixed-size buffer that many small gradient tensors are copied into so
        that one collective can carry all of them. Buckets exist to amortise
        per-collective launch latency (about $8\,\mu$s) and to give the
        communication a granularity it can overlap with the backward pass.
        They do not reduce bytes.
    - term: "Effective batch size"
      meaning: >-
        The number of examples that produced one optimizer step: $B \cdot W$
        for $B$ per worker across $W$ workers, times the accumulation steps if
        you are also accumulating. Every learning-rate rule, every schedule, and
        every "we trained on 300B tokens" claim is stated in terms of it, which
        is why the same script at 8 GPUs and 64 GPUs is two different
        experiments.
    - term: "Linear scaling rule"
      meaning: >-
        $\eta' = W\eta$ when the batch grows by $W$: it holds $\eta/B_{\text{eff}}$
        constant, which keeps the SGD stationary distribution — and therefore
        the loss floor — fixed. It is exact for small steps and fails as the
        step approaches $2/\lambda_{\max}$; the square-root rule
        $\eta' = \sqrt{W}\eta$ trades speedup for stability when it does.
    - term: "Critical batch size"
      meaning: >-
        The batch beyond which doubling the batch no longer halves the number of
        steps needed. Below it, gradient noise dominates and a bigger batch is
        nearly free progress; above it, curvature dominates and the extra
        parallelism is wasted. It is a property of the problem and the current
        weights, not a constant, which is why "$B = 4$M tokens" works for one
        model and destroys another.
    - term: "Scaling efficiency"
      meaning: >-
        Speedup divided by worker count, or equivalently
        $T_{\text{compute}}/(T_{\text{compute}} + T_{\text{comm}})$ when
        communication is not hidden. It is a statement about the ratio of work
        to bytes per worker, so it is set by tokens per accelerator per step and
        by interconnect bandwidth — not by the number of workers, which cancels.

  diagrams:
    - type: architecture
      title: "One data-parallel step: four shards in, one averaged gradient out"
      nodes:
        - { id: batch, x: 0, y: 1, label: "global batch  8,192 tokens", kind: client, detail: "Split into four contiguous shards of 2,048 tokens each. Contiguous, not strided, so each rank's shard is still a valid sample of the data distribution." }
        - { id: r0, x: 1, y: 0, label: "rank 0  forward + backward", kind: gpu, detail: "2,048 tokens. Produces a full gradient vector of 6.7e9 fp16 values: 13.4 GB, the same size as the weights. Every rank holds a complete copy of the model and of the optimizer state." }
        - { id: r1, x: 1, y: 1, label: "rank 1  forward + backward", kind: gpu, detail: "Identical work on a different shard. The four backward passes are independent and take 2/3 of the step's FLOPs; nothing is shared until the gradients are ready." }
        - { id: r2, x: 1, y: 2, label: "rank 2  forward + backward", kind: gpu, detail: "Each rank's gradient is a mean over its own 2,048 examples, which is why the correct reduction across ranks is also a mean." }
        - { id: r3, x: 1, y: 3, label: "rank 3  forward + backward", kind: gpu, detail: "The smallest shard in the last batch of an epoch is the one that breaks the unweighted mean: see the checkpoint on uneven shards." }
        - { id: ar, x: 2, y: 1, label: "all-reduce  2(N-1)/N x 13.4 GB", kind: server, detail: "20.1 GB per rank at N=4 (1.5S), 67 ms at 300 GB/s: reduce-scatter then all-gather, 2(N-1)=6 steps of S/4 bytes each. A ring has no hotspot; a parameter server would put 4 x 13.4 GB through one NIC twice." }
        - { id: opt, x: 3, y: 1, label: "optimizer step  theta -= eta g", kind: model, detail: "Every rank applies the identical averaged gradient to identical weights, so the replicas stay bit-identical without a broadcast. This is the invariant that makes data parallelism work at all." }
      edges:
        - { from: batch, to: r0, label: "shard 0" }
        - { from: batch, to: r1, label: "shard 1" }
        - { from: batch, to: r2, label: "shard 2" }
        - { from: batch, to: r3, label: "shard 3" }
        - { from: r0, to: ar, label: "g0" }
        - { from: r1, to: ar, label: "g1" }
        - { from: r2, to: ar, label: "g2" }
        - { from: r3, to: ar, label: "g3" }
        - { from: ar, to: opt, label: "g average" }
        - { from: opt, to: r0, label: "same update, no broadcast", style: async }
      caption: "Read the loop: the only cross-rank edge is the all-reduce. Everything else in the diagram is duplicated work, which is why data parallelism scales the batch and the memory footprint, and never the model."

    - type: compare
      title: "Parameter server vs ring all-reduce, N = 64, 13.4 GB of fp16 gradients, 50 GB/s links"
      left_label: "Parameter server"
      left_points:
        - "Total traffic 2NS = 1.716 TB per step"
        - "All of it crosses the server's NIC: 34.3 s per step"
        - "Two hops of latency, so it wins on small messages"
        - "Supports asynchronous updates with stale gradients"
        - "Hotspot and single point of failure: one slow worker stalls the server"
      right_label: "Ring all-reduce"
      right_points:
        - "Total traffic 2(N-1)S = 1.688 TB per step — 1.7% less"
        - "Per-rank 26.38 GB, spread evenly: 0.528 s per step"
        - "2(N-1) = 126 sequential steps, so latency-bound below ~1 MB"
        - "Synchronous: every rank must arrive, every step"
        - "No hotspot, and bandwidth-optimal on every link"

