  try_it: >-
    Cut a 4096×11008 MLP across t = 8 ranks: each rank holds a 4096×1376 slice, which is
    5,636,096 parameters. Then count the collectives in one transformer block — attention's
    output projection and the MLP's second matrix, two forward and two backward — and multiply
    by 32 blocks to get 128 dependent collectives per step.
  interview_questions:
    - question: "Why does a column-parallel layer need no communication in the forward pass, and why is it always paired with a row-parallel one?"
      level: mid
      key_points:
        - "Column-parallel splits the weight by its output dimension, so every rank reads the full input and produces a slice of the output — no rendezvous in the forward."
        - "Row-parallel splits by the input dimension, takes the sharded input, and produces partial products that must be summed, so it needs one all-reduce in the forward."
        - "Pairing them means the pair needs one all-reduce rather than two, and the gradient of the row-parallel weight needs no communication given the summed output."
        - "The elementwise nonlinearity goes between the two halves on the shard, because f applied to a contiguous slice is the corresponding slice of f applied to the whole."
      follow_up: "What goes numerically wrong if you move the GELU after the all-reduce instead?"
    - question: "You double the tensor-parallel degree from 8 to 16 to halve memory and measure 8.1% more throughput. Why so little?"
      level: senior
      key_points:
        - "Per-rank communication is flat in t while per-rank compute falls as 1/t, so the ratio grows linearly in (t − 1) — the overhead does not shrink with the model."
        - "Only the weights shard: at t = 8 they are 1.65 GB, but the replicated region of LayerNorm inputs and outputs, attention output and MLP output is 8.59 GB, 5.2× larger."
        - "Sequence parallelism shards exactly that region along the sequence axis and replaces each all-reduce with a reduce-scatter plus all-gather at identical bytes — 234.88 MB per block."
        - "The degree is also capped by heads: 32 heads allow t up to 32, and a GQA model with 8 KV heads caps at 8."
      follow_up: "At 64 devices, what does a 2D split buy over a 1D one?"
    - question: "A block has four collectives. Which layers do they belong to, and why can none of them be hidden?"
      level: mid
      key_points:
        - "Two in the forward and two in the backward, one pair from attention's row-parallel output projection and one from the MLP's row-parallel second matrix."
        - "At 32 blocks that is 128 collectives per step, and each one is a dependency of the next layer rather than a side computation."
        - "Column-parallel layers need no forward collective, which is why the count is four per block rather than eight."
        - "Because they sit inside the forward pass rather than at the step boundary, they cannot be overlapped with a large independent batch of work."
      follow_up: "Why is the backward all-reduce easier to overlap than the forward one?"
  common_mistakes:
    - "Moving the nonlinearity after the all-reduce, which leaves every activation 23.65% wrong while training still converges and the loss merely looks mediocre."
    - "Expecting memory to halve when only the weights shard — at t = 8 the replicated region is 5.2× the size of the part that shrank."
    - "Launching TP = 64 on a 32-head model, where the degree is capped by head count (or by KV heads under GQA) before bandwidth is ever the limit."
  further_reading:
    - label: "Shoeybi et al., Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism"
    - label: "Korthikanti et al., Reducing Activation Recomputation in Large Transformer Models"
