        Move the TP degree and watch the two halves separate: the weights fall
        as 1/t to 1.65 GB at t=8 while the replicated activation set stays at
        8.59 GB, so the total bottoms out at 8.59 GB no matter how many devices
        you add. Turn sequence parallelism on and the same total falls as 21.80/t
        — 2.73 GB at t=8, 1.36 GB at t=16 — for exactly the same 469.76 MB of
