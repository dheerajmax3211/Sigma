  try_it: >-
    Take an 8192×4096 fp16 activation: one pass is 67.11 MB in and 67.11 MB out, 134.22 MB,
    which is 40.06 microseconds at 3.35 TB/s. Multiply it by five unfused elementwise ops and
    compare with one fused kernel: 671.09 MB and 200.32 microseconds against 134.22 MB and
    40.06 microseconds.
  interview_questions:
    - question: "Your first Triton kernel runs at 380 GB/s on a card that does 3.35 TB/s. Nothing is wrong with the code. Why?"
      level: mid
      key_points:
        - "HBM latency is about 500 cycles and bandwidth is 14.42 bytes per clock per SM, so keeping it busy needs 7,210 bytes in flight per SM."
        - "One warp issuing one 128-bit-per-lane load has 512 bytes outstanding, so about 14 such loads must be in flight — several warps, or more work per thread."
        - "384 contiguous words per program is not enough in flight, so the kernel is latency-bound: correct masks, correct block size, one ninth of the bandwidth."
        - "The fix is more parallelism per program — bigger blocks, more warps, vectorised loads — not a smaller tile."
      follow_up: "How would you distinguish latency-bound from bandwidth-bound without a profiler counter?"
    - question: "When is fusing kernels worth it, and when is it wasted work?"
      level: senior
      key_points:
        - "Pointwise chains are pure traffic: five ops move 671.09 MB where one fused kernel moves 134.22 MB, a measured 5.321× and 200.32 to 40.06 microseconds."
        - "The LayerNorm, GELU, dropout and residual block is the same argument at 3.33× — 671.09 MB unfused against 201.33 MB fused."
        - "Fusion buys nothing above the 147.7 FLOP/byte ridge point, where the arithmetic already pays for the bytes; a tiled GEMM is compute-bound already."
        - "So fuse pointwise chains and attention, and leave matmuls to tiling."
      follow_up: "Why is FlashAttention a fusion argument rather than a FLOP argument?"
    - question: "A 256×256 tile has an arithmetic intensity of 128, well above the ridge point. What actually limits it?"
      level: senior
      key_points:
        - "The register file, not shared memory: a k-slice of a 128×256 tile in fp16 is only 48 KiB, which fits the 227 KiB of shared memory four times over."
        - "The fp32 accumulators are 32,768 words, which is 128 registers per thread at 256 threads — half of the 65,536-word register file — so larger tiles spill."
        - "L2 reuse depends on tile order as much as tile size: at 128×256 HBM alone would give 280.0 TFLOP/s, 56.6% of peak, and swizzling the grid is what closes the gap."
        - "So tile size, tile order and register budget are one decision rather than three."
      follow_up: "Your kernel spills at 256×256. What do you change first, and what do you give up?"
  common_mistakes:
    - "Dropping the K-loop remainder: a 256-deep tile over K = 1000 skips 232 elements and gives maximum absolute error 61.52 and 47.9% relative error, while the same code is exact at K = 1024."
    - "Sizing a tile by shared memory when the fp32 accumulators are what bind the register file."
    - "Tuning an elementwise kernel for FLOPs when it sits at arithmetic intensity 1.5, two orders of magnitude below the 147.7 ridge point."
  further_reading:
    - label: "Dao, Fu, Ermon, Rudra, Re, FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness, NeurIPS 2022"
    - label: "Tillet, Kung, Cox, Triton: an intermediate language and compiler for tiled neural network computations, MAPL 2019"
