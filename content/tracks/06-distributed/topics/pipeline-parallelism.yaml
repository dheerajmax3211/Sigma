id: pipeline-parallelism
slug: pipeline-parallelism
title: "Pipeline Parallelism and Bubbles"
summary: >-
  Split a model's layers across devices in sequence and you buy capacity with
  idle time: at eight stages and thirty-two micro-batches the step loses 17.95%
  to the pipeline bubble — 190.25 ms of 1060 ms — and runs 61,828 tokens/s
  against an ideal 75,352. GPipe and 1F1B have the same bubble and completely
  different memory: one slot per micro-batch against one slot per stage.
kind: lesson
difficulty: expert
position: 4
estMinutes: 25
prerequisites: [fsdp-zero]
phase: distributed-training
tags:
  [pipeline-parallelism, gpipe, 1f1b, interleaving, micro-batch, bubble, activation-memory, point-to-point, scheduling, distributed-training]

body:
  big_idea: >-
    Pipeline parallelism converts capacity into latency, not bandwidth: split
    the layers into p stages and every step pays a fixed (p-1) stage-times of
    idle, so the micro-batch count decides whether the split was worth it.
  problem:
    - "A 32-layer model cut into eight stages runs at 82.05% of what fully-fed stages give, and the point-to-point sends are 0.169% of the step."
    - "You add micro-batches to shrink the bubble and the job OOMs: GPipe holds a slot per in-flight micro-batch, 79.03 GB becoming 136.41 GB."
    - "Eight GPUs give 6.56x, not 8x: a computable 190.25 ms per step that shrinks only when the pipeline is made wider, never longer."
  analogy: >-
    Eight workstations build one car at a time, each adding an eighth. Nothing
    finishes until the last station sees it, so the first seven beats fill the
    line and the last seven drain it: fourteen beats a shift produce nothing,
    and hiring more workers does not shorten them, because station seven still
    waits for station one.
  concept_points:
    - "**The bubble is a fixed number of stage-times, not a percentage.** With p stages a step begins with p - 1 stages waiting for a micro-batch and ends with p - 1 waiting for a gradient: exactly (p - 1) stage-times of idle, independent of m. At p = 8 that is 190.25 ms of a 1,060 ms step, 17.95%, and the sends themselves are 0.169%."
    - "**$(p-1)/(m+p-1)$ is exact, not a bound.** Simulating p x m passes over unit-time stages: at p = 8 the measured utilisation is **0.533333 at m = 8, 0.820513 at m = 32, 0.948148 at m = 128**, each identical to $m/(m+p-1)$ to the last digit — for p = 2 and 4 as well, and whether the backward costs one tick or two."
    - "**Measured throughput at m = 32 and 2,048 tokens per micro-batch: 18,267, 34,447 and 61,828 tokens/s** for p = 2, 4, 8 against ideals of 18,838, 37,676 and 75,352 — efficiencies 0.970, 0.914, 0.821, and speedups of **1.94x, 3.66x, 6.56x**. The degradation is not the network: (p - 1) grew from 1 to 7 while m stayed at 32."
    - "**m below p is not a pipeline, it is a queue.** At p = 8, m = 4 leaves 63.64% of the machine idle and m = 1 leaves 87.50%. The two numbers worth memorising: 80% utilisation needs $m = 4(p-1)$, which is 28 at p = 8, and 90% needs $m = 9(p-1)$, which is 63."
    - "**GPipe's activation bill is m slots per stage, and it is what actually chooses m.** A stage of 4 of 32 layers at 2,048 tokens keeps 956.301 MB per layer, **3.825205 GB per micro-batch**, so m = 32 is 122.41 GB of activations plus 14 GB of state — 136.41 GB on an 80 GB card. 1F1B holds p slots instead, **44.60 GB**, for a bit-identical schedule."
    - "**Interleaving buys bubble with messages, not memory.** With v chunks per device the bubble is $(p-1)/(m \\cdot v + p - 1)$: at p = 8, m = 32 that is 17.95%, 9.86% and 5.19% at v = 1, 2, 4, while memory stays at 30.60 GB. Message count goes 448 to 896 to 1,792 and the latency bill 3.584 to 14.336 ms."
  definitions:
    - term: "Pipeline parallelism"
      meaning: >-
        Splitting a model's layers into p contiguous groups, one per device, so
        that a micro-batch flows stage by stage through the whole model. It is
        the only parallelism that reduces per-device parameter memory without
        any collective communication: a stage talks only to its two neighbours,
        by point-to-point send, and never to the whole world.
    - term: "Micro-batch"
      meaning: >-
        One slice of the global batch, sized so that its activations fit on a
        stage. The step is one pass of all m micro-batches through all p stages,
        followed by a single optimizer update. m is the only free variable that
        reduces the bubble without a schedule change, and it is bounded above by
        activation memory.
    - term: "Pipeline bubble"
      meaning: >-
        The device-ticks in a step during which a stage has nothing to run,
        because the micro-batch it needs has not arrived or the gradient it needs
        has not come back. Its size is (p - 1) stage-times per step and its
        fraction is (p - 1)/(m + p - 1). It is idle time, not slow time: the
        hardware is fine and there is no work to give it.
    - term: "Stage"
      meaning: >-
        One device's contiguous slice of layers. A stage's work per micro-batch
        is 6 x (parameters in the stage) x tokens flops for the forward and
        backward together, so equal-depth stages are equal-time only if the
        layers are homogeneous — an embedding or a loss head makes one stage the
        straggler and the bubble becomes (p - 1) times the slowest stage.
    - term: "GPipe schedule"
      meaning: >-
        All m forwards through all p stages, then all m backwards in reverse
        order. The simplest schedule, the easiest to reason about, and the one
        with the worst memory: no backward can start until every forward has
        finished, so every stage holds m activation slots and the buffer grows
        linearly with the micro-batch count you were told to increase.
    - term: "1F1B schedule"
      meaning: >-
        Warm up p - 1 forwards, then alternate one backward with one forward so
        that at most p micro-batches are ever in flight, then drain. Same
        makespan as GPipe to the tick, because the dependency graph is identical;
        the difference is entirely in how many activation slots a stage has to
        keep, which is p rather than m.
    - term: "Interleaved pipeline stage"
      meaning: >-
        Giving each device v non-contiguous chunks of layers instead of one
        contiguous block, so a device can work on chunk 4 of micro-batch i while
        chunk 0 of micro-batch i+1 is still in flight. The bubble falls to
        (p - 1)/(m·v + p - 1) — a factor v — at the cost of v times as many
        point-to-point messages and a scheduler that has to track chunk order.
    - term: "Activation slot"
      meaning: >-
        The stored forward activations of one micro-batch on one stage, which the
        backward pass needs and therefore cannot be freed. 3.825205 GB for four
        7B-class layers at 2048 tokens without recomputation, 0.067109 GB with
        only the layer inputs kept. It is the unit in which pipeline memory is
        measured, and the difference between m slots and p slots is the whole
        GPipe-versus-1F1B story.
    - term: "Fill and drain"
      meaning: >-
        The two ends of a pipeline step. The fill is (p - 1) forwards during
        which stages 1 to p - 1 have nothing to do; the drain is (p - 1)
        backwards during which stages 0 to p - 2 have nothing to do. Together
        they are (p - 1) full stage-times, and they are why a pipeline's cost is
        proportional to depth rather than to bytes.
    - term: "Point-to-point send"
      meaning: >-
        The only communication a pipeline stage performs: an activation tensor
        forward to stage s + 1 and a gradient tensor back to stage s - 1. 16.777
        MB each way at 2048 tokens and 4096 hidden, with no reduction and no
        dependence on the world size — which is why pipeline parallelism scales
        to slower interconnects than tensor parallelism does.
    - term: "Bubble-free claim"
      meaning: >-
        The frequently repeated idea that a large enough micro-batch count makes
        the bubble negligible. It is arithmetically true, 7/135 = 5.19% at
        p = 8 and m = 128, and it is unusable in practice because m is capped by
        activation memory: under GPipe the cap is 17 on an 80 GB card, which
        pins the bubble at 30.43% no matter what the formula promises.

