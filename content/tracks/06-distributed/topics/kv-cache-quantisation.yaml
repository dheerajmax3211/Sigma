      title: "Quantisation error along a chosen axis"
      difficulty: medium
      prompt: >-
        Implement `quant_mse(x, bits, axis)` returning the mean squared error of
        symmetric quantisation with a scale taken per `axis` (None means
        per-tensor). x is a nested list of floats; return a float.
      starter: |
        import numpy as np

        def quant_mse(x, bits, axis):
            # your implementation here
            pass
      language: python
      entry: quant_mse
      testCases:
