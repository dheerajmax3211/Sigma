          expected: '3.100006200012389e-05'
          mode: json
          tolerance: 1e-12
        - input: '[[[1.0, 0.5],[0.25, 0.125]], 4, 0]'
          expected: '0.00039859693877550983'
          mode: json
          tolerance: 1e-9
        - input: '[[[3.0, 0.0],[0.0, 0.0]], 8, 1]'
          expected: '0.0'
          mode: json
          tolerance: 1e-12
      solution: |
        import numpy as np

        def quant_mse(x, bits, axis):
            x = np.asarray(x, dtype=float)
            if axis is None:
                scale = np.abs(x).max()
            else:
                scale = np.abs(x).max(axis=axis, keepdims=True)
            qmax = 2 ** (bits - 1) - 1
            step = np.maximum(scale, 1e-12) / qmax
            q = np.clip(np.round(x / step), -qmax - 1, qmax)
            return float(np.mean((q * step - x) ** 2))
      solutionExplanation: >-
        Values that land exactly on representable points give zero error, which
        is why the first and third cases are 0.0 — they are multiples of the
        step. The second case at 4 bits has a coarse step (~0.0333) so the small
        entries pick up error. The point of the exercise is that the same tensor
        gives very different errors depending on whether the scale follows the
        outlier axis.
      complexity: "O(n) time"
      tags: [quantisation, kv-cache]

    - id: p-cache-speedup
      title: "Decode speedup from halving cache bytes"
      difficulty: easy
      prompt: >-
        Implement `cache_speedup(weights_gb, cache_gb)` returning
        (W + C) / (W + C/2) as a float.
      starter: |
        def cache_speedup(weights_gb, cache_gb):
            # your implementation here
            pass
      language: python
      entry: cache_speedup
      testCases:
        - input: '[140.0, 42.9]'
          expected: '1.1328584701145867'
          mode: json
          tolerance: 1e-9
        - input: '[140.0, 343.6]'
          expected: '1.5509942270686337'
          mode: json
          tolerance: 1e-9
        - input: '[140.0, 0.0]'
          expected: '1.0'
          mode: json
          tolerance: 1e-9
      solution: |
        def cache_speedup(weights_gb, cache_gb):
            return (weights_gb + cache_gb) / (weights_gb + cache_gb / 2)
      solutionExplanation: >-
        At 4k the cache is 23% of bytes and halving it buys 1.13x; at 32k it is
        71% and buys 1.55x. With no cache the ratio is exactly 1.0 — the
        limiting case that shows the technique is bounded by cache share, never
        by the quantiser.
      complexity: "O(1)"
      tags: [kv-cache, roofline]

    - id: p-prefix-saving
      title: "Prefill FLOPs saved by a prefix cache"
      difficulty: >-
        easy
      prompt: >-
        Implement `prefix_saving(params, prompt_tokens, cached_tokens)`
        returning the fraction of prefill FLOPs removed by caching a prefix:
        cached_tokens / prompt_tokens, as a float.
      starter: |
        def prefix_saving(params, prompt_tokens, cached_tokens):
            # your implementation here
            pass
      language: python
      entry: prefix_saving
      testCases:
        - input: '[70000000000, 4096, 2048]'
          expected: '0.5'
          mode: json
          tolerance: 1e-12
        - input: '[70000000000, 4096, 0]'
          expected: '0.0'
          mode: json
          tolerance: 1e-12
        - input: '[70000000000, 1000, 1000]'
          expected: '1.0'
          mode: json
          tolerance: 1e-12
      solution: |
        def prefix_saving(params, prompt_tokens, cached_tokens):
            if prompt_tokens <= 0:
                return 0.0
            return min(cached_tokens, prompt_tokens) / prompt_tokens
      solutionExplanation: >-
        Prefill costs 2PT FLOPs, so removing P_c of T tokens removes exactly
        P_c/T of the work — params cancels. A 2k cached system prompt on a 4k
        request halves prefill and therefore halves first-token latency, which
        is why prefix caching usually beats cache quantisation on TTFT.
      complexity: "O(1)"
      tags: [prefix-cache, prefill]

  try_it: >-
    Build a 512-token, 128-dim, 8-head cache and scale five tokens by 20×. Quantise it to int8
    three ways — per-tensor, per-token and per-channel — and report the MSEs: 0.02688, 0.00021
    and 0.00576. Then move the 20× scaling from tokens to channels and watch the ranking of the
    three schemes reverse.
  interview_questions:
    - question: "Why does per-tensor int8 wreck the KV cache when the same scheme is acceptable for weights?"
      level: mid
      key_points:
        - "Weights are static and roughly symmetric; the cache is activation-like, written per token per layer, and its dynamic range is set by a few outlier rows."
        - "Five tokens scaled 20× set one scale for the whole tensor: per-tensor MSE 0.02688 against per-token 0.00021, a factor of 128."
        - "Move the outliers to channels and the ordering reverses — per-tensor 0.03548, per-channel 0.00041 (87× better), per-token 0.00334."
        - "So the scaling axis must match the axis carrying the outliers, which is measurable per layer before you commit."
      follow_up: "On a well-conditioned cache int8 reaches MSE 0.00012. What does that say about 8 bits?"
    - question: "You expect 2× from an int8 KV cache and measure 1.13×. Is the implementation broken?"
      level: senior
      key_points:
        - "No: decode reads weights plus cache each step, so t = (W + C)/B and halving C helps by 1 + C/(2W + C)."
        - "At 4k context, batch 32, weights are 140 GB and the cache 42.9 GB, so the step goes 54.6 to 48.2 ms — 1.13×."
        - "At 32k the cache is 343.6 GB against the same 140 GB of weights, and the step goes 144.4 to 93.1 ms — 1.55×."
        - "Evaluating cache quantisation at short context measures the one regime where it cannot matter."
      follow_up: "What else gives you 1.55× at 32k without touching precision?"
    - question: "What must a prefix cache be keyed on, and what happens if it is keyed on token ids alone?"
      level: senior
      key_points:
        - "The cache encodes positions and is model-specific, so the key needs the model version, the token sequence and the attention configuration."
        - "Keying on ids alone returns logits computed under a different context — a correctness bug that presents as a quality regression."
        - "The payoff is large and orthogonal to quantisation: a 4k prompt costs about 5.73e14 FLOPs and roughly 1,160 ms at peak, so a shared 2k system prompt saves about half the first-token latency on every request."
        - "Quantisation reduces bytes per step while prefix caching removes work entirely, so the two compose rather than compete."
      follow_up: "Two tenants share a system prompt. What stops the prefix cache from leaking across them?"
  common_mistakes:
    - "Quantising per-tensor by default, which lets five outlier tokens set a scale that flattens the rest of the cache — 128× worse MSE than per-token on the same data."
    - "Expecting a 2× decode speedup from int8 at any context: it is 1.13× at 4k and 1.55× at 32k, set by the cache's share of bytes moved."
    - "Keying a prefix cache on token ids alone, which returns logits produced under the wrong model or the wrong positions."
  further_reading:
    - label: "Hooper et al., KVQuant: Towards 10 Million Context Length LLM Inference with KV Cache Quantization, NeurIPS 2024"
    - label: "Kwon et al., Efficient Memory Management for Large Language Model Serving with PagedAttention (vLLM), SOSP 2023"
