id: fsdp-zero
slug: fsdp-zero
title: "FSDP and ZeRO Stages 1–3"
summary: >-
  Shard the training state instead of the batch: a parameter is 16 bytes in an
  Adam mixed-precision run, not 2, and the optimizer owns 12 of them — 107.2 GB
  per device for a 6.7e9-parameter model. Stages 1, 2 and 3 cut that to 36.85,
  25.13 and 13.40 GB on eight devices for 1.0x, 1.0x and 1.5x the all-reduce
  traffic, with a floor of 4, 2 and 0 bytes per parameter that decides which
  models can fit at all.
kind: lesson
difficulty: expert
position: 2
estMinutes: 25
prerequisites: [data-parallelism]
phase: distributed-training
tags: [zero, fsdp, sharding, optimizer-state, mixed-precision, all-gather, reduce-scatter, memory, distributed-training]

body:
  big_idea: >-
    ZeRO does not shard the model: it shards the sixteen bytes of training
    state every device keeps a private copy of, twelve of them optimizer
    state, buying that with at most 1.5x the communication.
  problem:
    - "A 7B job needs 107.2 GB per device before storing one activation, on 80 GB cards, and adding GPUs changes nothing."
    - "FSDP runs but is 40% slower than the data-parallel job, and nobody knows whether the cost is the all-gather, its exposed tail, or accumulation."
    - "A 70B model will not start on 8 GPUs at any device count: stage 1 keeps 4 bytes per parameter replicated, which is 280 GB."
  analogy: >-
    Every machinist keeps a private cabinet: the part (fp16 weights), the
    offcuts (gradients), the master drawing (fp32 weights) and the maintenance
    log with two service readings (Adam's m and v). Sixteen units, and only
    two of them are the part. ZeRO stops duplicating the cabinet — one eighth
    of the logs, then the offcuts, then the part itself.
  concept_points:
    - "**Sixteen bytes per parameter runs this topic.** Adam mixed precision keeps fp16 weights (2), fp16 gradients (2), an fp32 master (4) and two moments (4 each). For 6.7e9 parameters that is **107.2 GB per device**, of which **80.4 GB — 75% — is optimizer state**; the moments alone are 53.6 GB, **4.0x the weights**. Data parallelism replicates every one of those bytes on every rank."
    - "**Stage 1 shards the twelve optimizer bytes and touches nothing else.** $4 + 12/N$ bytes per parameter — **5.5 at N = 8, 36.85 GB**, a **2.9x** cut for the 2S bytes data parallelism already spends. It is numerically free: after 20 Adam steps the sharded update differs from the single-process reference by **0.000000e+00**, because Adam is elementwise."
    - "**Stage 2 shards the gradients, which changes the shape of the backward pass.** $2 + 14/N$ gives **3.75 bytes per parameter at N = 8 (25.13 GB)**, **4.3x** less. The full gradient can no longer exist on any device, so reduction is reduce-scattered as it is produced — and gradient accumulation must defer it, or eight micro-batches cost **321.6 GB per rank against 40.2 GB**."
    - "**Stage 3 shards the parameters, and it is the only stage with a zero floor.** $16/N$ bytes per parameter: **2.0 at N = 8, 13.40 GB**, an **8x** reduction. Stages 1 and 2 cannot go below **4 and 2 bytes**, so a 70B model needs **280 GB** and **140 GB** respectively and cannot fit 80 GB cards at any device count; stage 3 fits at **N >= 16**."
    - "**Stage 3 pays 3S, not 2S, and the third S is the backward all-gather.** Measured **35.175 GB against 23.45 GB per rank at N = 8**, **1.5x**. It is per layer, so the bill is small: 478.571 MB per layer is **1.396 ms against 29.730 ms of compute**, and prefetching one layer exposes only **0.17% of an 832.45 ms step**."
    - "**FSDP is ZeRO-3 with the shard boundary drawn at the module.** It packs a block's 12 parameter tensors into one flat buffer, so 28 blocks become **56 collectives instead of 672** and **0.448 ms of launch instead of 5.376 ms**. `reshard_after_forward` is the stage switch per module: true frees the parameters (ZeRO-3, 3S), false keeps them (ZeRO-2, 2S)."
  definitions:
    - term: "Sharded data parallelism"
      meaning: >-
        Keeping data parallelism's batch split and additionally splitting the
        per-device training state across the same ranks. The gradient is still
        averaged across workers; what changes is who is holding the optimizer
        state that consumes it, and therefore how much memory each rank needs.
    - term: "ZeRO stage 1"
      meaning: >-
        Shard the optimizer state (fp32 master weights, Adam m, Adam v) across
        ranks, keeping fp16 weights and fp16 gradients replicated. Memory goes
        from 16 to 4 + 12/N bytes per parameter for 2S bytes of traffic, the
        same as plain data parallelism.
    - term: "ZeRO stage 2"
      meaning: >-
        Stage 1 plus sharded gradients: 2 + 14/N bytes per parameter. The
        gradient is reduce-scattered as it is produced, so no rank ever holds a
        full gradient vector. Traffic is still 2S; the cost is that accumulation
        must be deferred to the last micro-batch.
    - term: "ZeRO stage 3"
      meaning: >-
        Stage 2 plus sharded parameters: 16/N bytes per parameter, and the only
        stage with no floor. Every use of a layer's weights needs an all-gather
        of that layer first, so the step makes three passes over the model
        instead of two: 3S bytes per rank, 1.5x data parallelism.
    - term: "Optimizer state"
      meaning: >-
        Everything the update rule must remember between steps: the fp32 master
        weights, Adam's first moment m and second moment v. Twelve bytes per
        parameter for Adam, 75% of the sixteen, 80.4 GB for a 6.7e9-parameter
        model. It is the largest thing in the training state and the least
        frequently touched, which is exactly why it is the first thing sharded.
    - term: "Master weights"
      meaning: >-
        The fp32 copy of the parameters that the optimizer actually updates.
        The fp16 weights are a projection of these, kept because that is the
        dtype the matrix multiplies want. Updating the fp16 copy directly loses
        the low bits of every small update, which is why the fp32 master exists
        and costs 4 bytes per parameter.
    - term: "Flat parameter"
      meaning: >-
        FSDP's per-module buffer: every tensor in a module is concatenated into
        one contiguous allocation so that a single all-gather materialises the
        whole module. It exists to collapse a dozen small collectives into one
        and to give the prefetch a unit it can reason about. `reshard_after_forward`
        decides whether that buffer is freed after use.
    - term: "All-gather"
      meaning: >-
        The collective that gives every rank a copy of every chunk: $N-1$ steps
        of $S/N$ bytes, $(N-1)S/N$ per rank. It is the second half of a ring
        all-reduce and the whole cost of ZeRO-3, whose parameter access pattern
        is gather, use, free, gather again.
    - term: "Reduce-scatter"
      meaning: >-
        The collective that sums a buffer across ranks and leaves each rank
        owning one fully reduced chunk: the first half of a ring all-reduce,
        $(N-1)S/N$ bytes per rank. ZeRO-1, 2 and 3 all use it for the gradient,
        which is why their gradient traffic is the same as data parallelism's
        and their state is not.
    - term: "Reshard after forward"
      meaning: >-
        FSDP's per-module switch between ZeRO-2 behaviour (keep the gathered
        parameters, 2S traffic, 2 + 14/N bytes) and ZeRO-3 behaviour (free them,
        re-gather for the backward, 3S traffic, 16/N bytes). Setting it False
        on the modules that dominate traffic and True on the ones that dominate
        memory is the standard tuning knob.
    - term: "Communication amplification"
      meaning: >-
        Traffic divided by data parallelism's 2S: 1.0 for stages 0, 1 and 2,
        1.5 for stage 3, and worse than that in practice when gradient
        accumulation re-gathers per micro-batch — eight micro-batches at stage 3
        with no deferral is 8.0x, and 5.7x even with the reduce-scatter
        deferred.

  diagrams:
    - type: architecture
      title: "One ZeRO-3 step: gather, compute, gather, scatter, update"
      nodes:
        - { id: store, x: 0, y: 1, label: "per-rank shard: 1/N of every tensor", kind: storage, detail: "2 bytes per parameter at N=8, so 13.40 GB for 6.7e9 parameters. Between steps this is the only copy of the weights that exists anywhere, so no rank can start a forward pass until the pieces for a layer have been collected." }
        - { id: ag1, x: 1, y: 0, label: "all-gather layer L: 418.75 MB/rank", kind: server, detail: "478.571 MB of parameters for one layer, of which (N-1)/N crosses each link: 418.750 MB per rank, 1.396 ms at 300 GB/s. Launched one layer early, so it runs inside layer L-1's 29.73 ms of compute." }
        - { id: fwd, x: 2, y: 0, label: "forward layer L", kind: gpu, detail: "29.73 ms at 8,192 tokens per GPU and 40% MFU. The gather is 4.7% of that, which is why a single layer of prefetch hides it completely and why an unprefetched stage 3 is a fifth slower rather than half again." }
        - { id: ag2, x: 1, y: 2, label: "all-gather again before backward", kind: server, detail: "The same 418.75 MB, a second time. The derivative with respect to W needs W, and the forward's copy was freed so the buffer could be reused by the next layer. This is the third pass over the model and the only place stage 3 costs more than stages 1 or 2." }
        - { id: bwd, x: 2, y: 2, label: "backward layer L", kind: gpu, detail: "Produces one layer's gradient. Because the parameters are already partitioned, the local shard's slice of the gradient can be kept and the rest discarded — no gather of the gradient is ever needed." }
        - { id: rs, x: 3, y: 2, label: "reduce-scatter: 418.75 MB/rank", kind: server, detail: "Averaged across ranks like any data-parallel gradient, but scattered: rank r ends up owning the reduced gradient for chunk r only. Fused into the backward pass, so it hides the way the all-reduce does." }
        - { id: upd, x: 3, y: 1, label: "Adam on the local shard", kind: model, detail: "Each rank updates 1/8 of the master weights with 1/8 of m and v. Elementwise, so it is bit-identical to a full-vector update: measured 0.000000e+00 difference against a single-process reference after 20 steps." }
      edges:
        - { from: store, to: ag1, label: "1/N chunks" }
        - { from: ag1, to: fwd, label: "full layer 478.57 MB" }
        - { from: store, to: ag2, label: "1/N chunks" }
        - { from: ag2, to: bwd, label: "full layer, again" }
        - { from: fwd, to: bwd, label: "activations" }
        - { from: bwd, to: rs, label: "dL/dW" }
        - { from: rs, to: upd, label: "1/N of the gradient" }
        - { from: upd, to: store, label: "1/N updated", style: async }
      caption: "Three passes over the model per step against data parallelism's two: gather before the forward, gather before the backward, scatter the gradient. 1.5x the bytes, and 0.17% of the step once one layer of prefetch is in place."

    - type: stack
      title: "The sixteen bytes per parameter, and which stage removes each slice"
      reversed: true
