    - type: compare
      title: "Plain data parallelism vs ZeRO-3, 6.7e9 parameters on 8 x 80 GB"
      left_label: "Plain data parallelism"
      left_points:
        - "16 bytes per parameter on every rank: 107.2 GB"
        - "Plus 10 GB of activations: 117.2 GB against an 80 GB card, at any device count"
        - "2S of traffic per rank: 23.45 GB, 78.17 ms at 300 GB/s"
        - "One all-reduce per bucket, entirely hidden inside the backward pass"
        - "Largest model that fits at N=8: 4.38e9 parameters"
      right_label: "ZeRO-3 (FSDP)"
      right_points:
