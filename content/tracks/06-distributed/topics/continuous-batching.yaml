id: continuous-batching
slug: continuous-batching
title: "Continuous Batching and PagedAttention"
summary: >-
  Static batching makes every request in a group wait for the longest one, so
  four fifths of the KV-cache slots you paid for produce nothing; continuous
  batching reschedules every decode step and refills each slot the moment it
  frees. This topic replays a 1,000-request trace through both schedulers,
  prices the difference in tokens per second and in wasted cache bytes, and
  shows why paged block tables are what make the larger running batch
  affordable.
kind: lesson
difficulty: hard
position: 6
estMinutes: 27
prerequisites: [kv-cache]
phase: serving
tags:
  - continuous-batching
  - iteration-level-scheduling
  - paged-attention
  - kv-cache
  - serving
  - throughput
  - latency
  - fragmentation
  - prefill-chunking
  - vllm

body:
  big_idea: >-
    For a decoder the unit of work is the step, not the batch: re-deciding
    membership every step keeps every KV-cache slot full and amortises weight
    traffic over the sequences still generating.
  problem:
    - "GPU at 100% but tokens per second a sixth of benchmark: three quarters of each batch already emitted EOS and still hold a slot."
    - "A one-line question waits forty seconds behind a batch admitted two seconds earlier that will not return to the queue for thirty."
    - "You reserve maximum context per request, so an 80 GiB card holds 66 users when the arithmetic says 194 at real lengths."
  analogy: >-
    A shuttle bus leaves only when all thirty-two seats are sold and completes
    the whole circuit before returning, so whoever is going the shortest
    distance rides to the end. A taxi rank resells each seat the moment it
    frees. The seat is the unit, not the vehicle: a seat is a KV-cache slot, a
    trip is one request's output length.
  concept_points:
    - "**Static batching charges every request for the longest in its group.** Thirty-two requests run until the slowest finishes: $\\max_i L_i$ steps for $\\sum_i L_i$ tokens. On a 1,000-request lognormal trace (median 103 tokens, p99 992) at batch 32 that is **23,723 steps at 6.77 tokens per step — 21.2% slot occupancy**, so four fifths of reserved slot-steps produce no token."
    - "**Iteration-level scheduling makes the step the unit of work.** Each step the scheduler retires sequences that emitted EOS, then admits from the queue until the running set is full. The same trace takes **5,818 steps at 27.60 tokens per step, 86.3% occupancy, 4.08x fewer steps** — same model, same kernel, only the membership question asked every step instead of every batch."
    - "**The speedup is dispersion, not batch size.** $S = \\mathbb{E}[\\max_i L_i]/\\mathbb{E}[L]$ is exactly 1 when all outputs are equal, at any batch width. Our trace predicts **4.37x** at 32 (expected max 702.4 against mean 160.6) and realises **4.08x**; a uniform trace gives **1.00x** at batch 2 and batch 4."
    - "**Throughput is bytes per generated token: $W/(\\text{tokens per step}) + C$.** At 693-token context ($W = 14.0$ GB, $C = 363.3$ MB) that is **2.43 GB per token static against 870 MB continuous — 1,378 against 3,848 tokens per second** at 3.35 TB/s. The ceiling as the batch widens is $C$ alone, **9,221 tokens per second**, which no scheduler changes."
    - "**Batching touches the queueing term, not time per output token.** Each live sequence emits one token per step either way, so TPOT is step time in both; what collapses is admission delay, **10,410 to 2,236 steps mean and 22,672 to 4,913 p99**. Prefill must now share the step — 96.6 ms for 2,048 tokens against a 7.65 ms decode — so it is chunked."
    - "**PagedAttention is orthogonal and multiplicative.** Reserving the 2,048-token maximum costs **1.00 GiB per sequence**, so 66.96 GiB holds **66** while the 693.6-token mean needs 0.339 GiB — **66.1% dead space**. Fixed 16-token blocks with a 175-byte table cut waste to **1.05%** and fit **194** sequences, **2.94x** more."
  definitions:
    - term: "Static batching (request-level batching)"
      meaning: >-
        Admitting a fixed group of requests together and running the group
        until every member has finished. Batch duration is the maximum output
        length in the group, so slot occupancy is
        $\mathbb{E}[L]/\mathbb{E}[\max L]$ — 21.2% on the reference trace at
        batch 32.
    - term: "Continuous batching (iteration-level scheduling, in-flight batching)"
      meaning: >-
        Re-deciding the batch composition on every decode step: finished
        sequences leave, queued requests take their slots, and the running set
        stays full. Same kernel, same batch-size cap, different question asked
        per step.
    - term: "Slot occupancy"
      meaning: >-
        Tokens actually produced divided by (batch size x steps). It is the
        fraction of the cache slots you reserved that did work. 21.2% static
        against 86.3% continuous on the reference trace, at the same nominal
        batch size of 32.
    - term: "Time to first token (TTFT)"
      meaning: >-
        Queueing delay plus prefill. This is the term continuous batching
        actually improves — 10,410 to 2,236 steps of mean admission wait in
        the replay — and the term chunked prefill makes slightly worse in
        exchange for a smoother stream.
    - term: "Time between tokens (TBT, also TPOT)"
      meaning: >-
        The decode step time, which is bytes moved divided by bandwidth. Set by
        how many sequences are live and how long their caches are, not by which
        scheduler admitted them. 7.65 ms at 32 live sequences and a 693-token
        context; 18.1 ms at 128.
    - term: "Prefill chunking"
      meaning: >-
        Splitting one long prompt's prefill into fixed-size pieces and putting
        one piece in each decode step, so a single 2,048-token prompt cannot
        stall the stream for 96.6 ms. It converts a TBT spike into extra TTFT:
        5 chunks of 473 tokens cost 38.25 ms of first-token latency to cap the
        worst step at 30 ms.
    - term: "Block table"
      meaning: >-
        A per-sequence array mapping logical block index to physical block
        index, 4 bytes per entry. 43.8 entries for a 693-token sequence at
        block size 16 — 175 bytes of table for 0.342 GiB of cache.
    - term: "Logical and physical block"
      meaning: >-
        A logical block is a fixed window of a sequence's token positions; a
        physical block is an 8 MiB slab of HBM holding 16 tokens' keys and
        values. The table is what lets the two be different, which is what makes
        non-contiguous allocation and sharing possible.
    - term: "Internal fragmentation"
      meaning: >-
        Space reserved and not used inside an allocated unit: the tail of the
        last block of a sequence. Expected at $(b-1)/2$ tokens, so waste is
        about $(b-1)/(2\mathbb{E}[L])$ — 1.08% predicted against 1.05% measured
        at block 16. Bounded by block size, never by the allocator.
    - term: "External fragmentation"
      meaning: >-
        Free memory that exists but cannot satisfy a request because it is
        split into unusable pieces. Contiguous per-request reservation suffers
        from it as sequences grow at different rates; a block pool with a table
        cannot, because any free block fits any logical position.
    - term: "KV block pool"
      meaning: >-
        The pre-allocated set of physical blocks that all sequences draw from —
        8,571 blocks of 8 MiB, 66.96 GiB, on one 80 GiB card holding a 7B model.
        Capacity is a division over this pool, not over parameter count.
    - term: "Copy-on-write block sharing"
      meaning: >-
        Two sequences pointing at the same physical block until one of them
        writes, at which point the writer gets a private copy. This is how
        parallel sampling and beam search avoid paying for the prompt $k$
        times, and it exists only because the block table is an indirection.

