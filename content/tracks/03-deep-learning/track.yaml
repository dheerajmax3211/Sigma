track:
  id: deep-learning
  slug: deep-learning
  title: "Deep Learning from Scratch"
  subtitle: "Build the engine, then the networks — every gradient derived and every number measured"
  description: >-
    From a scalar autograd engine to residual networks and sequence models. Each
    topic implements the mechanism rather than importing it: the graph, the
    backward pass, the initialisation, the normalisation, the residual path. The
    recurring question is numerical — what does this layer do to the gradient,
    and where does it stop working as depth grows.
  tier: 2
  color: "#1cd6ac"
  sortOrder: 3
  outcomes:
    - "Implement a reverse-mode autograd engine with correct accumulation, broadcasting, and topological ordering."
    - "Explain graph execution, operator fusion, and why unfused elementwise chains are memory-bound."
    - "Initialise a network so activation variance is preserved, and derive the 1/√fan_in and 2/√fan_in factors."
    - "Diagnose vanishing and exploding gradients by measuring per-layer gain instead of guessing."
    - "Build convolutions as structured matrix products and use the shape algebra to size any layer."
    - "Choose between batch, layer, and RMS normalisation from the batch-size and sequence-length constraints."
    - "Explain why residuals make deep networks trainable, via the identity path in the Jacobian."
    - "Implement dropout, weight decay, and augmentation, distinguishing the ensemble view from the noise view."
    - "Assemble a working optimiser configuration from a schedule, a stability diagnosis, and a clipping rule."
    - "Implement an LSTM and explain why gated cell state solves the long-range gradient problem."
