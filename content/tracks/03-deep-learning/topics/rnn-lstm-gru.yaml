id: rnn-lstm-gru
slug: rnn-lstm-gru
title: "RNNs, LSTMs, and GRUs"
summary: >-
  Model a sequence by applying one cell over and over, read the backward pass as
  a power of a single Jacobian rather than a product of different ones, and
  replace that power with an additive cell state whose decay is a gate you
  control — so the gradient survives a hundred steps instead of dying at thirty.
kind: lesson
difficulty: hard
position: 8
estMinutes: 27
prerequisites: [autograd-engine, time-series]
phase: deep-learning-foundations
tags: [rnn, lstm, gru, bptt, vanishing-gradient, sequence-modelling, gates, truncation]

body:
  big_idea: >-
    A recurrent net applies one cell $T$ times, so its gradient is a power of
    one Jacobian, not $T$ different ones; the LSTM's fix is structural: memory
    on an additive, gated path.

  problem:
    - >-
      Your RNN nails ten-step patterns, but on sixty-step sequences the loss
      parks at the target's variance: it predicts the mean, with gradient
      around $10^{-9}$.
    - >-
      You add gradient clipping, the NaNs stop, and you conclude the gradient
      problem is solved — clipping does nothing when the norm is too small.
    - >-
      You truncate backpropagation at 32 steps to fit the activations;
      training loss keeps falling while 200-step evaluation gets worse.

  analogy: |
    A factory with one night-shift worker and a written log. If the copying
    rule is "keep seventy percent", then after fifty shifts only
    $0.7^{50} = 1.6\times10^{-7}$ of the first night survives: uniform
    forgetting, not selective. The LSTM changes the rule, not the diligence —
    a vector log with a per-line volume knob, so one line can be copied at
    0.999 for a thousand shifts while its neighbours are wiped.

  concept_points:
    - >-
      **One cell, $T$ applications: the parameters do not grow with the sequence, the gradient exponent does.**
      An RNN over 100 steps with 256 hidden units owns
      $256\cdot(128+256+1) = \mathbf{98{,}560}$ parameters, identical at
      $T=10$ and $T=10{,}000$. The backward pass is a product of $T-1$ copies
      of the same matrix: $\|W_{hh}^{50}\|_2$ measures $6.376\times10^{8}$ at
      $\rho=1.5$, $117.4$ at $\rho=1.1$, $5.154\times10^{-3}$ at $\rho=0.9$ —
      exactly $\rho^{50}$.
    - >-
      **The per-step Jacobian norm lies about the horizon; only the product tells the truth.**
      At $\rho=1.0$, tanh, the mean per-step $\|J_t\|_2$ measured **0.9955** —
      a naive reading says no vanishing. The product: **0.213** at $k=5$,
      **0.0327** at $k=10$, **$8.78\times10^{-4}$** at 20,
      **$2.61\times10^{-10}$** at 50, crossing $10^{-6}$ at $k=34$. The
      effective per-step gain is 0.66, not 0.9955, because each factor rotates
      the top singular direction.
    - >-
      **The LSTM's cell state is additive, so the gradient path contains no weight matrix.**
      $c_t = f_t\odot c_{t-1} + i_t\odot g_t$ gives
      $\partial c_t/\partial c_{t-1} = \operatorname{diag}(f_t)$, so over $T$
      steps the path is $\operatorname{diag}(\prod_s f_s)$ — a product of
      *scalars*. That is the residual argument in its cheapest form, and it
      buys selectivity: one unit can hold $f=1$ for a thousand steps while its
      neighbour decays in ten.
    - >-
      **The forget-gate bias is 1 because the gate multiplies your only gradient path.**
      $\sigma(1)=0.7311$ against $\sigma(0)=0.5$: over 50 steps
      $0.7311^{50}=1.58\times10^{-7}$ versus $0.5^{50}=8.88\times10^{-16}$ —
      **8.25 decades** — and the half-life goes from 1.00 to 2.21 steps. The
      price is small: the gate's own derivative falls from 0.250 to 0.1966. At
      $b_f=0$ the instruction is "forget in one step".
    - >-
      **GRU: the leak is exactly $(1-z)$, and that preserves the highway.**
      With $h_t = (1-z)\odot h_{t-1} + z\odot\tilde h$ the coefficient on
      $h_{t-1}$ is $(1-z)$, so the path survives by construction and the cell
      state merges into the hidden state; what is lost is the output gate. The
      sign trap: an LSTM retains with $f\to1$ ($b_f>0$), a GRU with $z\to0$
      ($b_z<0$).
    - >-
      **Measured horizon on the adding problem: the vanilla RNN is done by 20 steps, the LSTM is unchanged at 100.**
      Held-out MSE, $h=32$, 2000 Adam steps: RNN **0.0023** at $T=10$, 0.0292
      at 20, 0.1593 at 50, **0.1797** at 100; LSTM 0.000197, 0.000187,
      0.000683, **0.000526**. In variance-explained terms the RNN falls from
      99.3% to **46.1%** while the LSTM stays above 99.7% — a 342x gap in MSE
      at $T=100$.

  definitions:
    - term: "Hidden state"
      meaning: >-
        The vector $h_t$ that carries everything the network remembers about
        steps $1..t$. It is the only thing passed between time steps; the
        parameters are shared, so the state is the entire interface.
    - term: "Unrolling (BPTT)"
      meaning: >-
        Writing the recurrence out as $T$ copies of the same cell, one per time
        step, so the ordinary reverse-mode autograd from *Building an Autograd
        Engine* applies unchanged. The graph has $T$ cells and one set of
        parameter nodes with $T$ incoming gradient edges, which is why the
        parameter gradient is a sum over time.
    - term: "Truncated BPTT"
      meaning: >-
        Running the backward pass only $k$ steps into the past. It bounds
        activation memory at $O(kBH)$ and gives a gradient that is not the
        gradient of any single objective — a biased estimator, so it converges
        to a different point rather than to a noisier version of the same one.
    - term: "Spectral radius"
      meaning: >-
        $\rho(W)=\max_i|\lambda_i|$, the largest eigenvalue magnitude. For a
        normal matrix $\|W^T\|_2=\rho^T$ exactly; for a non-normal one the power
        can be far larger at finite $T$ before the asymptotic rate wins. It is
        the single number that sets an RNN's memory horizon.
    - term: "Vanishing gradient (temporal)"
      meaning: >-
        $\|P_k\|_2$ falling below the precision of the gradient you need, so the
        parameters that wrote an early step receive no useful signal. Measured
        on a $\rho=1$ tanh RNN, it crosses $10^{-6}$ at $k=34$.
    - term: "Exploding gradient"
      meaning: >-
        The same product growing instead of shrinking: $\rho=1.5$ over 50 steps
        is $6.4\times10^{8}$, which is a NaN within a few steps in fp32. Fixed by
        clipping, which is a no-op for the vanishing case.
    - term: "Cell state"
      meaning: >-
        The LSTM's $c_t$, updated additively as $f_t\odot c_{t-1}+i_t\odot g_t$.
        Its Jacobian with respect to $c_{t-1}$ is diagonal and contains no weight
        matrix, which is the entire reason the gradient survives.
    - term: "Forget gate"
      meaning: >-
        $f_t=\sigma(W_{if}x_t+W_{hf}h_{t-1}+b_f)$, the per-unit coefficient on
        the previous cell state. Initialised with $b_f=1$ so $f\approx0.731$ at
        step zero rather than $0.5$.
    - term: "Input and output gates"
      meaning: >-
        $i_t$ scales what is written into the cell this step; $o_t$ scales what
        the cell exposes as $h_t=o_t\tanh(c_t)$. Keeping them separate is what
        lets a unit hold a value internally without publishing it.
    - term: "Identity path (highway)"
      meaning: >-
        A term in $\partial c_T/\partial c_t$ (or $\partial h_L/\partial h_l$ in
        a ResNet) that multiplies by a diagonal near 1 instead of by a weight
        matrix, so it cannot vanish through multiplication. In the LSTM it is
        $\prod f_s$; in a residual net it is the $I$ in $\prod(I+J_l)$.
    - term: "Update gate (GRU)"
      meaning: >-
        $z_t$ in $h_t=(1-z)\odot h_{t-1}+z\odot\tilde h$. The retention
        coefficient is $(1-z)$, so the bias sign for remembering is opposite to
        the LSTM's: $b_z<0$ to hold, $b_f>0$ to hold.
    - term: "Memory horizon"
      meaning: >-
        The number of steps over which a dependency can actually be learned,
        not merely represented. Measured on the adding problem: about 10-20 for
        a vanilla RNN, above 100 for an LSTM at the same hidden size.

  diagrams:
    - type: architecture
      title: "One cell, one parameter set, T copies in the graph"
      nodes:
        - { id: x, x: 0, y: 1, label: "x_t  (d,)", kind: client, detail: "One step of the input. Split into windows of length T; nothing about the cell depends on T except the number of copies in the graph." }
        - { id: wih, x: 1, y: 0, label: "W_ih  (h, d)", kind: storage, detail: "Input-to-hidden. Only this path sees the current input, so it is the only place new information can enter." }
        - { id: whh, x: 1, y: 2, label: "W_hh  (h, h), reused every step", kind: storage, detail: "The recurrent matrix. The gradient with respect to it is a sum of T terms, each containing a product of up to T Jacobians - which is why one bad spectral radius poisons every step at once." }
        - { id: cell, x: 1, y: 1, label: "tanh(W_ih x_t + W_hh h) ", kind: model, detail: "The only nonlinearity in the recurrence. Its derivative 1 - h squared is the per-step contraction factor, and it is bounded by 1, so the recurrence can never amplify through the activation." }
        - { id: h, x: 2, y: 1, label: "h_t  (h,)", kind: client, detail: "The whole memory. Everything the model knows about steps 1..t has to be inside this vector; if it is not linearly decodable from h_t, the model cannot use it." }
        - { id: y, x: 3, y: 1, label: "y_t = W_hy h_t", kind: model, detail: "The read-out, applied at whichever steps the task needs a prediction. For sequence labelling it runs at every step; for forecasting, only at the last." }
      edges:
        - { from: x, to: cell, label: "new information" }
        - { from: wih, to: cell, label: "input path" }
        - { from: whh, to: cell, label: "memory path" }
        - { from: cell, to: h, label: "state" }
        - { from: h, to: y, label: "read-out" }
        - { from: h, to: cell, label: "t+1, same matrix", style: async }

    - type: compare
      title: "Where the gradient actually travels in each cell"
      left_label: "Vanilla RNN: one matrix, T times"
      left_points:
        - "Path: product of diag(1 - h squared) times W_hh, T times"
        - "Measured per-step norm 0.9955 at rho=1, but the product crosses 1e-6 at k=34"
        - "Every direction is coupled: you cannot keep one feature and drop another"
        - "Controls only the total: rho below 1 kills long range, rho above 1 explodes"
      right_label: "LSTM: a diagonal gate on an additive path"
      right_points:
        - "Path: product of diag(f_t) - no weight matrix anywhere in it"
        - "One unit can hold f=1 while its neighbour decays in ten steps"
        - "Measured product at init: 2.48e-14 over 100 steps with b_f=1, 7.89e-31 with b_f=0"
        - "Controls decay per unit, and the gate is learned from the gradient it passes"

    - type: plot
      title: "Adding problem, h=32, 2 seeds: the RNN stops learning the dependency at about 20 steps"
      chart: line
      xLabel: "sequence length T"
      yLabel: "log10 held-out MSE (lower is better)"
      series:
        - name: "vanilla RNN"
          points:
            - { x: 10, y: -2.638 }
            - { x: 20, y: -1.535 }
            - { x: 50, y: -0.798 }
            - { x: 100, y: -0.745 }
        - name: "LSTM (forget bias 1)"
          points:
            - { x: 10, y: -3.706 }
            - { x: 20, y: -3.728 }
            - { x: 50, y: -3.166 }
            - { x: 100, y: -3.279 }
        - name: "baseline: predict the mean"
          points:
            - { x: 10, y: -0.477 }
            - { x: 100, y: -0.477 }

    - type: plot
      title: "The forget-gate bias as a decade budget: retention per step, log scale"
      chart: line
      xLabel: "steps back"
      yLabel: "log10 of the cell-state gradient kept"
      series:
        - name: "forget bias 0 (sigma = 0.5)"
          points:
            - { x: 0, y: 0.0 }
            - { x: 5, y: -1.5051 }
            - { x: 10, y: -3.0103 }
            - { x: 15, y: -4.5154 }
