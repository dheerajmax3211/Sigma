id: convolutions
slug: convolutions
title: "Convolutions: From Kernel to Feature Maps"
summary: >-
  Read a convolution as what it actually is — a matrix product whose matrix is
  forced to be banded and Toeplitz — then use that structure to compute the
  parameter count, the FLOP count, the output shape, the im2col memory bill and
  the receptive field exactly, instead of reciting them.
kind: lesson
difficulty: medium
position: 4
estMinutes: 28
prerequisites: [mlp-from-scratch, linear-algebra-foundations]
phase: deep-learning-foundations
tags: [convolution, toeplitz, im2col, receptive-field, parameter-sharing, feature-map, flops]

body:
  big_idea: >-
    A convolution is the same matrix product with the matrix constrained to be
    banded and Toeplitz — one kernel reused at every position — which turns a
    4.3-billion-parameter dense map into 36,928 numbers.

  problem:
    - >-
      You size a 224×224 RGB to 64-channel stem honestly: the dense matrix is
      483,385,147,392 entries, 1.9 TB in float32, for one layer.
    - >-
      Your shapes are off by one: 224 in, 7×7 kernel, stride 2, padding 2
      gives 111, not `ceil(224/2) = 112`.
    - >-
      You write the convolution with six nested loops, switch to im2col, get
      16× faster, and never learn the FLOP count did not change.

  analogy: |
    A rubber stamp: carve one 3×3 pattern and press it everywhere. A dense
    layer is a separate hand-carved stamp for every position, so moving the
    image one pixel invalidates all of them. But convolution windows overlap,
    so one input pixel feeds nine outputs and the shared weight's gradient is
    a sum over positions, not a copy.

  concept_points:
    - >-
      **A convolution is a matrix product with 99.7% of the matrix deleted.**
      For a length-1024 signal and a 3-tap kernel, the valid-convolution
      operator is $1022 \times 1024$ with three non-zeros per row:
      **3,066 non-zeros in 1,046,528 entries**, density **0.293%**. It is
      banded Toeplitz, so the 341× storage saving and the 341× arithmetic
      saving are the same fact.
    - >-
      **Parameter sharing is an equality constraint, and its dimension is $k$.**
      A conv layer is the same affine map as a `Linear`, with the weight
      matrix projected onto a $k$ -dimensional subspace. Concretely: 3×3,
      64→64 owns **36,928** numbers where the dense map on 32×32×64 owns
      **4,295,032,832** — a factor of **116,308**. That factor is a prior, not
      a free lunch.
    - >-
      **The FLOP saving is exactly $\text{HW}/K^2$, and the parameter saving is its square.**
      3×3 at 32×32×64 costs $2\cdot1024\cdot9\cdot64\cdot64 = 75{,}497{,}472$
      FLOPs against the dense $2\cdot1024^2\cdot64^2 = 8{,}589{,}934{,}592$ —
      ratio **113.78**, exactly $1024/9$. Parameters fall by $(HW/K)^2$. The
      224×224 stem runs at **6.75 FLOP/byte**, memory-bound; a 56×56 64→64
      runs at 131.9.
    - >-
      **The shape algebra is one floor and one plus-one.** With input $n$,
      kernel $k$, stride $s$, padding $p$, dilation $d$:
      $n_{\text{out}} = \lfloor (n + 2p - d(k-1) - 1)/s \rfloor + 1$. So 224,
      k=7, s=2, p=3 → **112**; 32, k=3, s=2, p=1 → **16**; 55, k=3, s=1, p=0,
      d=2 → **51**. Same padding $p=(k-1)/2$ holds only for odd $k$ at stride
      1.
    - >-
      **im2col turns the structure into a GEMM and pays for it in memory, not FLOPs.**
      For 56×56×64 with 3×3 the column matrix is $576 \times 3136$:
      **6.89 MiB against the input's 0.766 MiB, exactly 9×**, because each
      element is copied $K^2$ times. At 7×7 it is 49×. The GEMM does the same
      115.6M MACs — measured 48 ms direct against 3 ms, **16.4×**, difference
      **8.9e-15**.
    - >-
      **The theoretical receptive field is roughly four times the effective one.**
      Ten random 3×3 kernels compose to a $2\sigma$ width of **5.64 pixels**
      against a nominal $R=21$; at L=20 it is **9.49** against 41. Convolving
      distributions adds variances, so the composite is roughly Gaussian with
      $\sigma$ growing like $\sqrt{L}$ while support grows like $L$: 21 pixels
      is what can influence the output, not what does.

  definitions:
    - term: "Kernel (filter)"
      meaning: >-
        The $K \times K \times C_{\text{in}} \times C_{\text{out}}$ tensor of
        learned weights, applied identically at every spatial position. "The
        kernel" for a 3×3 64→64 layer is 36,864 numbers; the 9 weights of one
        channel pair is what the diagrams usually show, which is why the
        parameter count surprises people by a factor of 4,096.
    - term: "Feature map"
      meaning: >-
        The $C_{\text{out}} \times H_{\text{out}} \times W_{\text{out}}$ output
        of a conv layer — one 2-D activation map per output channel, each the
        response of one filter across space. Its spatial size is what the shape
        algebra computes; its channel count is what the next layer's fan-in
        reads.
    - term: "Stride"
      meaning: >-
        The step between successive window positions. Stride $s$ divides the
        output size by roughly $s$ and multiplies the *jump* $j$ by $s$, so it
        grows the receptive field of every later layer without adding a single
        parameter. It also breaks exact translation equivariance: a shift of one
        input pixel is no longer representable as a shift of the output when
        $s>1$.
    - term: "Padding"
      meaning: >-
        Extra positions added around the border so the window can start at the
        edge. Zero padding is the default and is the only reason a "same"
        convolution exists; it is also a lie about the world, since it tells the
        network that everything outside the image is black. Circular padding
        keeps exact equivariance and is what a toroidal convolution assumes.
    - term: "Dilation"
      meaning: >-
        Spacing between kernel taps. Dilation $d$ turns a $k$-tap kernel into a
        footprint of $d(k-1)+1$ while keeping $k$ weights, so a 3×3 with $d=2$
        sees 5×5 for 9/25 of the cost of a real 5×5 — and samples a comb rather
        than a block, which is a different inductive bias, not just a cheaper
        one.
    - term: "Receptive field"
      meaning: >-
        The set of input positions that can influence one output unit, computed
        by $r_{\text{out}} = r_{\text{in}} + (k-1)j_{\text{in}}$. It is a
        statement about *support*: every position in the field has a non-zero
        path to the output, which is not the same as having a meaningful one.
    - term: "Effective receptive field"
      meaning: >-
        The width that actually carries the gradient — measured as 2σ of the
        composite kernel, or of $|\partial y/\partial x|$. It grows like
        $\sqrt{L}$ while the nominal field grows like $L$, so at ten 3×3 layers
        it is 5.64 pixels against a nominal 21.
    - term: "Toeplitz matrix"
      meaning: >-
        A matrix that is constant along each diagonal, $T_{ij} = k_{j-i}$. A
        banded Toeplitz matrix with $k$ non-zero diagonals *is* a 1-D
        convolution, which is why its storage and its arithmetic both cost $k$
        per row instead of $n$.
    - term: "im2col"
      meaning: >-
        The layout transform that copies each $K \times K \times C_{\text{in}}$
        patch into a column, producing a
        $(C_{\text{in}}K^2) \times (H_{\text{out}}W_{\text{out}})$ matrix so the
        convolution becomes one GEMM. It changes no arithmetic and costs $K^2$
        times the input's memory.
    - term: "Parameter sharing (weight tying)"
      meaning: >-
        Reusing one weight tensor at every spatial position. Formally it is the
        constraint that the layer's matrix lie in a $k$-dimensional subspace of
        the full matrix space; informally it is the assumption that a pattern
        means the same thing wherever it appears.
    - term: "Translation equivariance"
      meaning: >-
        $f(\text{shift}_\delta x) = \text{shift}_\delta f(x)$. True exactly for
        convolution under circular padding (measured error 0.0), approximately
        true under zero padding (measured 0.522 for a 7-sample shift), and false
        once you add stride or pooling. Equivariance is the property; invariance
        — the output not changing at all — requires pooling or a global average.
    - term: "Depthwise separable convolution"
      meaning: >-
        A per-channel spatial convolution followed by a 1×1 channel mixer.
        4,672 weights instead of 36,864 at 64 channels, and formally a rank-
        $C_{\text{in}}$ factorisation of the full weight matrix, so it is an
        approximation with the error characteristics of a truncated SVD.

  diagrams:
    - type: architecture
      title: "One conv layer: where the reuse actually happens"
      caption: >-
        The kernel is the only thing stored. The patch matrix is derived, and its
        size — $C_{\text{in}}K^2$ columns per output position — is the whole
        memory bill of the layer.
      nodes:
        - { id: x, x: 0, y: 0, label: "x  (C_in, H, W)", kind: client, detail: "The input tensor. Nothing is copied yet; a conv can run straight off these strides, which is what every fast kernel does." }
        - { id: w, x: 1, y: 0, label: "W  (C_out, C_in, K, K)", kind: storage, detail: "The only parameters: 3x3x64x64 = 36,864 numbers plus 64 biases. Reused at every one of the H_out·W_out positions — that reuse is parameter sharing." }
        - { id: col, x: 1, y: 1, label: "patches  (C_in·K², HW)", kind: storage, detail: "im2col. 576 x 3136 for 56x56x64 with 3x3. Each input value is copied K^2 = 9 times, so this buffer is 9x the input: 6.89 MiB against 0.766 MiB." }
        - { id: b, x: 2, y: 0, label: "b  (C_out,)", kind: storage, detail: "One number per output channel, broadcast over space. Its gradient is a sum over H_out·W_out positions — the same unbroadcast rule as the MLP, with a larger reduction." }
        - { id: gemm, x: 2, y: 1, label: "GEMM  (C_out, C_in·K²)", kind: model, detail: "The matmul. Same 115.6M MACs as the direct loop — 16.4x faster in wall clock, not one FLOP cheaper. This is the step im2col exists to enable." }
        - { id: act, x: 3, y: 1, label: "ReLU", kind: server, detail: "Elementwise, parameter-free. Half the units go to exactly zero, which is why the next layer's effective fan-in is half its nominal one." }
        - { id: y, x: 3, y: 0, label: "y  (C_out, H_out, W_out)", kind: client, detail: "The feature map. Its spatial size comes from floor((n + 2p - d(k-1) - 1)/s) + 1, and its channel count becomes the next layer's C_in." }
      edges:
        - { from: x, to: col, label: "K² copies" }
        - { from: col, to: gemm, label: "columns" }
        - { from: w, to: gemm, label: "flattened kernel" }
        - { from: b, to: gemm, label: "broadcast" }
        - { from: gemm, to: act, label: "pre-activation" }
        - { from: act, to: y, label: "feature map" }

    - type: compare
      title: "The dense map and the Toeplitz map, on the same 32×32×64 tensor"
      left_label: "Dense map (what the MLP would do)"
      left_points:
        - "4,295,032,832 parameters for one 32x32x64 -> 32x32x64 layer: 1.7e10 bytes in float32, 17 GB of weights"
        - "8,589,934,592 FLOPs per image; 113.78x the convolutional version, exactly HW/K²"
        - "Every output position owns its own filter, so a pattern learned at (3,4) is not recognised at (4,3)"
        - "Condition number and rank are whatever training makes them; nothing about the operator is constrained"
        - "Arithmetic intensity 0.5 FLOP/byte — the weights alone are 17 GB, so it is bandwidth-bound by two orders of magnitude"
      right_label: "Toeplitz map (what the conv layer is)"
      right_points:
        - "36,928 parameters: 116,308x fewer, 144 KiB in float32 — small enough that a whole layer's weights sit in L2"
        - "75,497,472 FLOPs; the matrix has 3 non-zeros per row, so 99.7% of it is never touched in 1-D"
        - "One filter reused at every position, which is the assumption that a pattern is position-independent"
        - "The operator is banded Toeplitz: a k-dimensional subspace, so its spectrum is the kernel's DFT"
        - "A 3-tap box filter has condition number 846; a second difference is singular by construction"

    - type: plot
