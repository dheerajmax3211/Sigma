    - title: "Stacking 3x3 kernels: same receptive field, 9n/(2n+1)^2 of the parameters"
      latex: |
        A stride-1 convolution with kernel $k$ extends the receptive field by
        $k-1$ per layer, so a stack of $n$ 3x3 layers has

        $$r_n = 1 + \sum_{i=1}^{n}(3-1) = 2n+1,$$

        which is the support of a single $(2n+1)\times(2n+1)$ kernel. For a
        constant width $C$ and biases included, the parameter counts are

        $$P_{\text{stack}} = n\left(9C^2 + C\right), \qquad
          P_{\text{single}} = (2n+1)^2C^2 + C,$$

        so the ratio is

        $$\frac{P_{\text{stack}}}{P_{\text{single}}}
          = \frac{9nC^2 + nC}{(2n+1)^2C^2 + C},
          \qquad
          \lim_{C \to \infty}\frac{P_{\text{stack}}}{P_{\text{single}}}
          = \frac{9n}{(2n+1)^2},$$

        which gives $1.000$, $0.720$, $0.551$, $0.445$ for $n = 1,2,3,4$.
        Measured at $C = 64$: $36{,}928 / 36{,}928 = 1.0000$,
        $73{,}856 / 102{,}464 = 0.7208$, $110{,}784 / 200{,}768 = 0.5518$,
        $147{,}712 / 331{,}840 = 0.4451$. With $\text{pad} = k/2$ the spatial
        size is unchanged at every layer, so the FLOP ratio equals the parameter
        ratio at constant resolution. Insert a width change and the identity
        breaks: for $64 \to 128$ with $n = 2$,

        $$P_{\text{stack}} = (9\cdot64\cdot128 + 128) + (9\cdot128^2 + 128)
          = 221{,}440 \;>\; 204{,}928 = 25\cdot64\cdot128 + 128.$$
      prose: >-
        The parameter saving is real but it is the smaller half of the argument.
        The larger half is that $n$ layers carry $n$ nonlinearities inside the
        same support, so the stack's function class strictly contains the single
        kernel's at $n \geq 2$ — and that survives the width change that destroys
        the parameter ratio. The width-change case is the one to remember,
        because it is the common case: a 1.081 ratio means "three 3x3s are
        cheaper" is false for a layer that widens, and the design rule you
        actually want is about nonlinearity density, not about parameter count.

    - title: "Grouped convolution divides the cost by G, and the block eats the saving"
      latex: |
        A convolution from $C_{\text{in}}$ to $C_{\text{out}}$ channels with a
        $k \times k$ kernel costs $C_{\text{in}}C_{\text{out}}k^2$ MACs per
        output position. Split the channels into $G$ groups and convolve each
        independently:

        $$G \cdot \frac{C_{\text{in}}}{G} \cdot \frac{C_{\text{out}}}{G} \cdot k^2
          = \frac{C_{\text{in}}C_{\text{out}}k^2}{G},$$

        so the saving is exactly $G$ at the layer level, and at
        $G = C_{\text{in}} = C_{\text{out}}$ the layer is depthwise with $k^2$
        MACs per output — 9 for a 3x3, 49 for a 7x7. Now price the whole
        bottleneck, $256 \to 128 \to 128 \to 256$:

        $$\text{dense}: 32{,}768 + 147{,}456 + 32{,}768 = 212{,}992,$$

        $$\text{32 groups}: 32{,}768 + 4{,}608 + 32{,}768 = 70{,}144,$$

        so the block gets $3.04\times$ cheaper while the 3x3 term gets $32\times$
        cheaper, and the two 1x1s go from 30.8% to 93.4% of the block's
        arithmetic. ResNeXt therefore spends the saving on width: total inner
        channels rise from 64 to 128, FLOPs land at 4.2 against ResNet-50's 4.1,
        parameters at 25.0M against 25.5M, and the error falls 1.7 points.
      prose: >-
        This is why "grouped convolution is 32x cheaper" is a claim about a
        layer and never about a block. Once the 1x1s dominate, the only thing
        more groups buy is a larger inner width at the same cost — which is
        exactly what ResNeXt did, and why the FLOP count barely moved. It is also
        why depthwise convolution became the standard spatial mixer: at $G =
        C_{\text{in}}$ the spatial term collapses to $k^2$ per output, so the
        budget can be moved into the 1x1s where channel mixing happens, and a
        7x7 kernel costs 49 MACs instead of $49C$.

    - title: "Compound scaling: why the constraint is alpha*beta^2*gamma^2 = 2"
      latex: |
        Write the cost of a convolutional network as a sum over layers of
        $H_l W_l C_l C_{l-1} k_l^2$. Scaling depth by $\alpha$ multiplies the
        number of terms by $\alpha$; scaling width by $\beta$ multiplies each
        term by $\beta^2$ because both $C_l$ and $C_{l-1}$ scale; scaling
        resolution by $\gamma$ multiplies each $H_lW_l$ by $\gamma^2$ because
        both sides of the feature map scale. Hence

        $$F(\alpha,\beta,\gamma) = \alpha\,\beta^2\,\gamma^2\,F(1,1,1).$$

        Parameterising a family by a single coefficient $\phi$,
        $d = \alpha^\phi$, $w = \beta^\phi$, $r = \gamma^\phi$, gives

        $$F(\phi) = \left(\alpha\beta^2\gamma^2\right)^{\phi} F(0),$$

        and requiring one doubling per step — the choice that makes $\phi$ an
        interpretable budget rather than a tuned integer — gives

        $$\alpha\beta^2\gamma^2 = 2.$$

        EfficientNet's grid search returns $\alpha = 1.2$, $\beta = 1.1$,
        $\gamma = 1.15$, whose product is $1.2 \times 1.21 \times 1.3225 =
        1.9203$, so seven steps cost $1.9203^{7} = 96.28$ rather than
        $2^{7} = 128$ — 25% cheaper than the idealised constraint, which is the
        size of the approximation and not a rounding error.
      prose: >-
        The exponent 2 on $\beta$ and $\gamma$ is the whole content of the
        argument: width and resolution enter the cost twice, depth once, so
        scaling any single axis spends the budget on a linear term and saturates
        — which is what ResNet-50 to ResNet-152 shows, 2.8x the FLOPs for 2.2
        points. It also says what the constraint is not. It is a statement about
        FLOPs, not about accuracy: the multipliers came from a NAS search on B0
        and were frozen, so $\alpha = 1.2$ is a measured coefficient of a
        particular search, not a property of convolutions. Change the base model
        and the optimal triple changes with it.

  implementations:
    - language: python
      title: "A parameter and FLOP counter for AlexNet and VGG-16 — wrong in three specific places"
      note: >-
        Numerically WRONG in three ways, all of them visible in its own output.
        (1) It computes convolution output sizes with `(h - k)//s + 1`, i.e.
        valid padding, so VGG's 224 becomes 222 on the first layer and every
        later stage is one pixel small; the total comes out at 15.06 GMAC
        against the correct 15.35 — **1.9% low**, small enough to look like
        rounding. (2) It labels the result GFLOPs while computing MACs, so every
        number is half what a two-FLOPs-per-MAC profiler reports. (3) It
        normalises AlexNet's per-layer shares by a hard-coded `ALEXNET_TOTAL =
        0.716` copied from a table instead of by its own computed total of
        1.011 GMAC, which inflates every share by **41%** — conv1 prints as
        14.7% of the arithmetic when it is 10.4%. The parameter counts are
        correct, which is exactly why the bugs survive review: the column that
        looks right is right.
      code: |
        import numpy as np

        # (name, c_in, c_out, k, stride) with the input resolution implied.
        ALEXNET = [
            ("conv1", 3, 96, 11, 4),
            ("conv2", 96, 256, 5, 1),
            ("conv3", 256, 384, 3, 1),
            ("conv4", 384, 256, 3, 1),
            ("conv5", 256, 256, 3, 1),
        ]
        ALEXNET_FC = [("fc6", 9216, 4096), ("fc7", 4096, 4096), ("fc8", 4096, 1000)]
        ALEXNET_TOTAL = 0.716          # BUG 3: a copied constant, not the computed total

        VGG16 = [
            ("conv1_1", 3, 64), ("conv1_2", 64, 64),
            ("conv2_1", 64, 128), ("conv2_2", 128, 128),
            ("conv3_1", 128, 256), ("conv3_2", 256, 256), ("conv3_3", 256, 256),
            ("conv4_1", 256, 512), ("conv4_2", 512, 512), ("conv4_3", 512, 512),
            ("conv5_1", 512, 512), ("conv5_2", 512, 512), ("conv5_3", 512, 512),
        ]
        VGG16_FC = [("fc6", 25088, 4096), ("fc7", 4096, 4096), ("fc8", 4096, 1000)]

        def conv_cost(c_in, c_out, k, hw, bias=True):
            params = c_out * (c_in * k * k + (1 if bias else 0))
            macs = hw * hw * c_out * c_in * k * k
            return params, macs

        def forward_shapes(sizes, k, s):
            # BUG 1: no padding term, so every 'same' layer loses a pixel.
            return [(h - k) // s + 1 for h in sizes]

        def alexnet():
            hw = 224
            total_p = total_m = 0
            rows = []
            for name, c_in, c_out, k, s in ALEXNET:
                hw = forward_shapes([hw], k, s)[0]
                p, m = conv_cost(c_in, c_out, k, hw)
                rows.append((name, p, m))
                total_p += p
                total_m += m
            for name, i, o in ALEXNET_FC:
                p, m = i * o + o, i * o
                rows.append((name, p, m))
                total_p += p
                total_m += m
            return rows, total_p, total_m

        def vgg16():
            hw, total_p, total_m = 224, 0, 0
            for name, c_in, c_out in VGG16:
                p, m = conv_cost(c_in, c_out, 3, hw)
                total_p += p
                total_m += m
                if name in ("conv1_2", "conv2_2", "conv3_3", "conv4_3"):
                    hw //= 2                       # the 2x2 stride-2 max-pool
            for name, i, o in VGG16_FC:
                p, m = i * o + o, i * o
                total_p += p
                total_m += m
            return total_p, total_m

        if __name__ == "__main__":
            rows, tp, tm = alexnet()
            print(f"AlexNet params {tp:,}  MACs {tm/1e9:.3f}G")
            for name, p, m in rows[:2]:
                print(f"  {name}: {100*p/tp:6.2f}% of params, "
                      f"{100*m/1e9/ALEXNET_TOTAL:6.2f}% of GFLOPs")   # BUG 3
            vp, vm = vgg16()
            print(f"VGG-16 params {vp:,}  MACs {vm/1e9:.3f}G")          # BUG 1, BUG 2
            print(f"  fc share of params {100*sum(i*o+o for _, i, o in VGG16_FC)/vp:.1f}%")

    - language: python
      title: "A cardinality sweep that prices the block and not the layer"
      note: >-
        WRONG in the way every grouped-convolution benchmark is wrong. (1)
        `spatial_saving` reports the layer-level ratio, so at 32 groups it
        prints **32.0x** while the block as a whole is **3.04x** cheaper —
        because the two 1x1 convolutions are 93.4% of the grouped block's
        arithmetic and the function never counts them in the saving. (2) It uses
        `width // groups` with no divisibility check, so a call with
        `width=100, groups=32` silently truncates to 3 channels per group and
        returns a cost for a block nobody built (the correct behaviour is to
        raise). (3) It returns a dict of MACs and the comment claims a runtime
        ordering; MACs are not time, and at 32 groups the kernel is memory-bound
        and sustains a fraction of the dense path's FLOP/s. The arithmetic is
        right; the conclusion printed at the end is not.
      code: |
        import numpy as np

        def block_cost(c_in, width, c_out, groups, k=3):
            """MACs per spatial position for a 1x1 -> grouped 3x3 -> 1x1 block."""
            expand = c_in * width
            per_group = (width // groups) * (width // groups) * k * k   # BUG 2
            spatial = groups * per_group
            project = width * c_out
            dense_spatial = width * width * k * k
            return {
                "expand": expand,
                "spatial": spatial,
                "project": project,
                "total": expand + spatial + project,
                "spatial_saving": dense_spatial / spatial,   # BUG 1: layer, not block
            }

        def sweep(c_in=256, c_out=256, width=128, ks=(1, 2, 4, 8, 16, 32)):
            rows = []
            for g in ks:
                r = block_cost(c_in, width, c_out, g)
                rows.append((g, r))
            return rows

        if __name__ == "__main__":
            base = block_cost(256, 128, 256, 1)["total"]
            for g, r in sweep():
                print(f"G={g:3d}  total {r['total']:8.0f}  "
                      f"spatial {r['spatial']:7.0f}  "
                      f"saving {r['spatial_saving']:5.1f}x  "
                      f"block speedup {base/r['total']:4.2f}x")
            # the last line prints 32.0x and 3.04x for the same block.
            # 32.0x is the layer. 3.04x is the block. The GPU gives neither.

  checkpoints:
    - id: cp-1
      question: >-
        Two 3x3 convolutions at 64 channels against one 5x5 at 64 channels: give
        the parameter counts, the ratio, and the number of ReLUs. Then say what
        happens to the ratio when the second layer widens to 128 channels.
      answerKind: short_text
      hint: >-
        Count $9C^2$ per 3x3 layer and $25C^2$ for the 5x5, add one bias per
        output channel, and check what the second layer's input width is in the
        widening case.
      solution: >-
        Two 3x3s: $(9\cdot64^2 + 64)\times2 = 73{,}856$. One 5x5:
        $25\cdot64^2 + 64 = 102{,}464$. Ratio **0.7208** — the asymptotic
        $9n/(2n+1)^2 = 0.7200$ plus the bias term, and independent of $C$ as
        long as both layers have the same width. ReLUs: **two** against the
        5x5's one, which is the part of the argument that does not depend on the
        parameter count. Widen the second layer to 128 and the stack is
        $(9\cdot64\cdot128 + 128) + (9\cdot128^2 + 128) = 221{,}440$ against the
        5x5's $25\cdot64\cdot128 + 128 = 204{,}928$ — ratio **1.081**, so the
        stack is more expensive. The 72% is a constant-width result.
    - id: cp-2
      question: >-
        Plain-34 has 0.60 points *more* top-1 error than plain-18, while
        ResNet-34 has 2.85 points *less* than ResNet-18. What does the 3.45-point
        difference between those two deltas measure, and what does it not
        measure?
      answerKind: short_text
      hint: >-
        Both pairs have the same width, the same data and almost the same
        parameter count. The only difference between the pairs is what is inside
        the block.
      solution: >-
        It measures the identity path: 27.94 → 28.54 for the plain pair and
        27.88 → 25.03 for the residual pair (10-crop validation top-1 error).
        Adding 16 layers is worth −0.60 without a skip and +2.85 with one, so
        the sign of the depth term flips, which is the degradation problem
        stated as a number. What it does *not* measure is a gradient-magnitude
        improvement: the parameter count, width and dataset are fixed, so the
        delta is about which functions the deeper stack can represent — the
        residual block can be the identity, and the plain block cannot. The
        Jacobian argument for why that helps optimisation is in *Residual
        Connections*; this number is the empirical consequence.
    - id: cp-3
      question: >-
        A bottleneck block is 256 → 64 → 256 with a 3x3 in the middle. How much
        cheaper is it than a single dense 3x3 at 256 channels, and which layers
        carry the remaining cost?
      answerKind: short_text
      hint: >-
        Count three terms: $256\cdot64$, $9\cdot64^2$, $64\cdot256$. Compare
        with $9\cdot256^2$.
      solution: >-
        Dense 3x3: $9\cdot256^2 = 589{,}824$ MACs per position. Bottleneck:
        $16{,}384 + 36{,}864 + 16{,}384 = 69{,}632$ — **8.47x** cheaper. The two
        1x1s are $32{,}768$ of that $69{,}632$, i.e. **47.1%** of the block, so
        the compression itself is nearly half the cost and the 3x3 is the cheap
        part. That is the trade: the 3x3 sees 64 channels instead of 256, giving
        up a factor of 4 in the spatial layer's capacity in exchange for the
        8.47x discount that pays for 50 layers at 4.1 GFLOPs. At 128 inner
        channels the same block costs 70,144 with the 1x1s at 93.4%.
    - id: cp-4
      question: >-
        Where do the exponents in $\alpha\beta^2\gamma^2 \approx 2$ come from,
        and what would the constraint be for a network whose cost were linear in
        width?
      answerKind: short_text
      hint: >-
        Write one layer's cost, then scale each of its three symbols and see
        which appear twice.
      solution: >-
        One layer costs $H W C_{\text{in}}C_{\text{out}}k^2$. Width enters
        twice — once as the input channels and once as the output channels — so
        $\beta$ appears as $\beta^2$. Resolution enters twice because both sides
        of the feature map scale with $\gamma$, so $\gamma^2$. Depth enters once
        because it only multiplies the number of layers, so $\alpha^1$. Hence
        $\alpha\beta^2\gamma^2$. If cost were linear in width the constraint
        would be $\alpha\beta\gamma^2 = 2$, and the optimal $\beta$ would be
        larger relative to $\alpha$ — which is exactly the direction the measured
        multipliers already point (1.1 against 1.2 with a square attached).
        EfficientNet's actual product is $1.2 \times 1.21 \times 1.3225 =
        1.9203$, so seven steps cost 96.3x rather than 128x.
    - id: cp-5
      question: >-
        ConvNeXt's ablation says the 7x7 kernel is worth +0.0 points. Does that
        mean large kernels do not matter, and what would you measure to find out?
      answerKind: short_text
      hint: >-
        A cumulative ladder applies changes in an order. Ask what had already
        been applied when the kernel was enlarged, and what the block's binding
        constraint was at that point.
      solution: >-
        No. It means that at that point in the sequence — after the depthwise
        convolution and the 4x inverted bottleneck, at that width — the block's
        receptive field was no longer what limited accuracy, so enlarging the
        kernel moved nothing. The measurement that would settle it is a
        substitution sweep: take the finished model and vary only the kernel
        size, which isolates the kernel from the order. The general lesson is
        that cumulative ladders under-credit the change that enables a later one
        and over-credit the one that follows it, so the ladder tells you the
        total (+6.0 points) reliably and the individual attributions only within
        an order. What is not in doubt: the two biggest single steps are the
        training recipe (+2.7) and the depthwise convolution (+1.0), neither of
        which is the change the paper is famous for.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        An architecture is a budget, and every design decision moves a cost from
        one place to another. Before you argue about which block is better, work
        out which of the four quantities the change touches — depth, width,
        kernel support, connectivity — and whether it makes the layer cheaper,
        the block cheaper, or only the layer cheaper while the block stays the
        same. Most of the confusion in this literature is a layer-level saving
        being sold as a block-level one.
      blocks:
        - kind: checklist
          body: |
            Four questions, in this order, for any architecture claim:
            - Which quantity does the change alter: depth, width, support, or connectivity?
            - Is the saving at the layer, the block, or the network?
            - Does the parameter count move in the same direction as the FLOP count?
            - Is the comparison at the same input resolution, crop protocol and FLOP convention?
        - kind: warning
          body: >-
            Tier 1 has no formulas on purpose. Before reading on, commit to an
            answer: if a design halves the cost of the 3x3 in a bottleneck block
            and leaves the two 1x1s alone, what fraction of the block's cost
            have you removed — and what does that tell you about "32x cheaper"?
      checkpoint: >-
        If a layer becomes 32x cheaper and the block only becomes 3x cheaper,
        where did the other factor of 10 go, and which layer would you attack
        next?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Price the change symbolically, then cancel. Write one layer's cost as
        $H W C_{\text{in}} C_{\text{out}} k^2$, substitute the change, and see
        which symbols survive. If the ratio depends on $C$, you have a claim
        that holds only at one width — which is how the 72% rule breaks. Then
        sum over the layers that actually exist in the block, because a saving
        in a term that is 7% of the total is a rounding error.
      blocks:
        - kind: checklist
          body: |
            - Layer cost: H * W * C_in * C_out * k * k. Write it before anything else.
            - Depth change multiplies the layer count; width multiplies two channel terms; resolution multiplies both sides of the map.
            - Sum the block's terms, then express each as a share. The share is the answer.
            - Sanity-check against a published number you trust: VGG-16 is 15.5 GFLOPs, ResNet-50 is 4.1, EfficientNet-B0 is 0.39.
      checkpoint: >-
        Why does a parameter ratio of 0.72 become 1.08 when the layer widens,
        while the ReLU count stays at 2?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Three counters and one division. The counters are the whole method; the
        division is where the argument lives.
      blocks:
        - kind: pseudocode
          body: |
            # stack accounting
            for n in 1..4:
                params_stack  = n * (9*C*C + C)
                params_single = (2n+1)^2 * C * C + C
                ratio          = params_stack / params_single

            # grouped block accounting
            for G in [1, 2, 4, 8, 16, 32]:
                expand  = C_in  * width
                spatial = width * width * k * k / G
                project = width * C_out
                total   = expand + spatial + project
                print(G, total, spatial / total)      # the second number is the story

            # compound scaling
            constraint = alpha * beta**2 * gamma**2
            for phi in 0..7: print(phi, constraint**phi, alpha**phi, beta**phi, gamma**phi)
        - kind: math
          body: |
            The two ratios to carry:

            $$\frac{P_{\text{stack}}}{P_{\text{single}}} = \frac{9n}{(2n+1)^2},
              \qquad
              \text{MACs}_{\text{grouped}} = \frac{C_{\text{in}}C_{\text{out}}k^2}{G}.$$
      checkpoint: >-
        In the grouped block loop, which term does not change with G, and why is
        that the reason the block-level saving is small?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Receptive fields add, parameters multiply, and cost scales with two
        powers of width and resolution. Those three sentences are the whole
        derivation.
      blocks:
        - kind: math
          body: |
            Receptive field and parameter ratio for a stack of $n$ 3x3 layers
            at constant width $C$:

            $$r_n = 1 + 2n, \qquad
              P_{\text{stack}} = n(9C^2 + C), \qquad
              P_{\text{single}} = (2n+1)^2C^2 + C,$$

            $$\frac{P_{\text{stack}}}{P_{\text{single}}}
              = \frac{9n}{(2n+1)^2}\ \text{as}\ C \to \infty
              = 1.000,\ 0.720,\ 0.551,\ 0.445.$$

            Grouped convolution, and the block that contains it:

            $$G\cdot\frac{C_{\text{in}}}{G}\cdot\frac{C_{\text{out}}}{G}\cdot k^2
              = \frac{C_{\text{in}}C_{\text{out}}k^2}{G},
              \qquad
              \text{block} = C_{\text{in}}w + \frac{w^2k^2}{G} + wC_{\text{out}}.$$

            At $C_{\text{in}} = C_{\text{out}} = 256$, $w = 128$, $k = 3$:
            $32{,}768 + 147{,}456/G + 32{,}768$, so $G = 32$ gives 70,144
            against 212,992 — 3.04x for the block, 32x for the layer.

            Compound scaling:

            $$F(\phi) = (\alpha\beta^2\gamma^2)^{\phi}F(0),
              \qquad \alpha\beta^2\gamma^2 = 2
              \;\Rightarrow\; \alpha = 1.2,\ \beta = 1.1,\ \gamma = 1.15,\
              \text{product } 1.9203.$$
      checkpoint: >-
        Why does the block-level ratio approach 1 as $w$ grows, and what does
        that say about choosing cardinality in a very wide block?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The accounting as code: a stack pricer, a block pricer, and a scaling
        pricer, each returning the ratio that decides the argument.
      blocks:
        - kind: warning
          body: >-
            Write your own before reading this. The numbers in the assertions
            are the test; the code is only notation.
        - kind: code
          language: python
          body: |
            import numpy as np

            def stack(n, c_in, c_out):
                params_stack = (9*c_in*c_out + c_out) + (n-1)*(9*c_out*c_out + c_out)
                k = 2*n + 1
                params_single = k*k*c_in*c_out + c_out
                return {"rf": 2*n + 1, "stack": params_stack,
                        "single": params_single, "ratio": params_stack/params_single}

            def block(c_in, width, c_out, groups, k=3):
                e = c_in*width
                s = width*width*k*k/groups
                p = width*c_out
                dense = c_in*width + width*width*k*k + width*c_out
                return {"total": e+s+p, "layer_saving": groups,
                        "block_saving": dense/(e+s+p), "spatial_share": s/(e+s+p)}

            def compound(alpha, beta, gamma, phi):
                c = alpha*beta**2*gamma**2
                return {"constraint": c, "flops": c**phi,
                        "depth": alpha**phi, "width": beta**phi, "res": gamma**phi}

            if __name__ == "__main__":
                assert abs(stack(2, 64, 64)["ratio"] - 0.7208) < 1e-3
                assert stack(2, 64, 128)["ratio"] > 1.0          # the width-change trap
                assert abs(block(256, 128, 256, 32)["block_saving"] - 3.0365) < 1e-3
                assert abs(compound(1.2, 1.1, 1.15, 7)["flops"] - 96.28) < 0.01
                print("ok")
      checkpoint: >-
        The stack pricer returns 0.7208 for 64-to-64 and 1.0806 for 64-to-128.
        Which of those two is the number your design review needs, and why is the
        other one the one people quote?

  problems:
    - id: p-vgg-stack
      title: "Price a stack of 3x3 kernels against the single kernel it replaces"
      difficulty: medium
      prompt: >-
        Implement `stack_accounting(n, c_in, c_out)`. A stack of `n` 3x3
        convolutions, stride 1, padding 1, each with a bias, is compared with the
        single `(2n+1) x (2n+1)` convolution that has the same receptive field.
        The first layer maps `c_in` to `c_out` channels and every later layer
        maps `c_out` to `c_out`. Return a dict with five keys:
        `receptive_field` (int, the support of the stacked version),
        `params_stack` (int, weights plus biases for the whole stack),
        `params_single` (int, weights plus biases for the single kernel),
        `ratio` (float, `params_stack / params_single`), and `nonlinearities`
        (int, the number of activations in the stack). Do not assume the ratio
        is 0.72 — the fourth test case changes width and it is not.
      starter: |
        def stack_accounting(n, c_in, c_out):
            # your implementation here
            pass
      language: python
      entry: stack_accounting
      testCases:
        - input: '[1, 3, 64]'
          expected: '{"receptive_field": 3, "params_stack": 1792, "params_single": 1792, "ratio": 1.0, "nonlinearities": 1}'
          mode: json
          tolerance: 1.0e-9
        - input: '[2, 64, 64]'
          expected: '{"receptive_field": 5, "params_stack": 73856, "params_single": 102464, "ratio": 0.7207995003123048, "nonlinearities": 2}'
          mode: json
          tolerance: 1.0e-9
        - input: '[3, 128, 128]'
          expected: '{"receptive_field": 7, "params_stack": 442752, "params_single": 802944, "ratio": 0.5514108082257293, "nonlinearities": 3}'
          mode: json
          tolerance: 1.0e-9
        - input: '[2, 64, 128]'
          expected: '{"receptive_field": 5, "params_stack": 221440, "params_single": 204928, "ratio": 1.0805746408494692, "nonlinearities": 2}'
          mode: json
          tolerance: 1.0e-9
      solution: |
        def stack_accounting(n, c_in, c_out):
            params_stack = (9 * c_in * c_out + c_out) + (n - 1) * (9 * c_out * c_out + c_out)
            k = 2 * n + 1
            params_single = k * k * c_in * c_out + c_out
            return {
                "receptive_field": 2 * n + 1,
                "params_stack": params_stack,
                "params_single": params_single,
                "ratio": params_stack / params_single,
                "nonlinearities": n,
            }
      solutionExplanation: >-
        The two formulas are the topic in miniature. Receptive fields add, so a
        stack of stride-1 3x3 layers has support $1 + 2n$; parameters multiply,
        so the stack costs $n(9C^2 + C)$ and the single kernel costs
        $(2n+1)^2C^2 + C$. At equal width the ratio collapses to
        $9n/(2n+1)^2$ — 1.0, 0.72, 0.551, 0.445 — and the bias term is why the
        measured 0.7208 sits just above 0.7200. The fourth case is the one that
        matters: with a 64-to-128 widening the stack costs 221,440 against
        204,928, a ratio of **1.0806**, because the second 3x3 runs at 128
        channels while the single 5x5 only ever runs at 64 in and 128 out. So
        the parameter argument for small kernels is conditional and the
        nonlinearity argument is not: `nonlinearities` is `n` in both cases,
        which is the part of VGG's design that survives.
      complexity: "O(1) time, O(1) space"
      tags: [cnn-architectures, vgg, receptive-field, parameter-counting]

    - id: p-compound-scaling
      title: "Compound scaling: the multiplier triple and its FLOP bill"
      difficulty: easy
      prompt: >-
        Implement `compound_scale(alpha, beta, gamma, phi)`. The family scales
        depth by `alpha ** phi`, width by `beta ** phi` and input resolution by
        `gamma ** phi`, and its FLOPs scale by
        `(alpha * beta**2 * gamma**2) ** phi`. Return a dict with five keys:
        `constraint` (float, `alpha * beta**2 * gamma**2`), `depth_multiplier`,
        `width_multiplier`, `resolution_multiplier`, and `flops_multiplier`
        (all floats). `phi` may be 0, in which case every multiplier is 1.0.
      starter: |
        def compound_scale(alpha, beta, gamma, phi):
            # your implementation here
            pass
      language: python
      entry: compound_scale
      testCases:
        - input: '[1.2, 1.1, 1.15, 0]'
          expected: '{"constraint": 1.92027, "depth_multiplier": 1.0, "width_multiplier": 1.0, "resolution_multiplier": 1.0, "flops_multiplier": 1.0}'
          mode: json
          tolerance: 1.0e-9
        - input: '[1.2, 1.1, 1.15, 7]'
          expected: '{"constraint": 1.92027, "depth_multiplier": 3.583180799999999, "width_multiplier": 1.9487171000000012, "resolution_multiplier": 2.6600198804687487, "flops_multiplier": 96.27999953357931}'
          mode: json
          tolerance: 1.0e-9
        - input: '[1.0, 2.0, 1.0, 1]'
          expected: '{"constraint": 4.0, "depth_multiplier": 1.0, "width_multiplier": 2.0, "resolution_multiplier": 1.0, "flops_multiplier": 4.0}'
          mode: json
          tolerance: 1.0e-9
        - input: '[2.0, 1.0, 1.0, 3]'
          expected: '{"constraint": 2.0, "depth_multiplier": 8.0, "width_multiplier": 1.0, "resolution_multiplier": 1.0, "flops_multiplier": 8.0}'
          mode: json
          tolerance: 1.0e-9
      solution: |
        def compound_scale(alpha, beta, gamma, phi):
            constraint = alpha * beta ** 2 * gamma ** 2
            return {
                "constraint": constraint,
                "depth_multiplier": alpha ** phi,
                "width_multiplier": beta ** phi,
                "resolution_multiplier": gamma ** phi,
                "flops_multiplier": constraint ** phi,
            }
      solutionExplanation: >-
        The exponent on each multiplier is the whole content. Depth multiplies
        the number of layers, so it enters once; width multiplies both channel
        counts of every layer, so it enters squared; resolution multiplies both
        sides of the feature map, so it enters squared as well. That is why the
        constraint is $\alpha\beta^2\gamma^2$ and not $\alpha\beta\gamma$. The
        second case is EfficientNet's own triple at $\phi = 7$: 3.58x the depth,
        1.95x the width, 2.66x the resolution (224 to 600 is 2.68, close because
        $\gamma^7 = 2.660$), and **96.28x** the FLOPs — against the 128x the
        idealised constraint of 2 would predict, because $1.9203^7$ is 4% per
        step under 2 and the error compounds. The last two cases are the
        control: doubling width alone costs 4x per step and doubling depth alone
        costs 2x, so a width-only family spends the budget twice as fast for the
        same multiplier.
      complexity: "O(1) time, O(1) space"
      tags: [cnn-architectures, efficientnet, compound-scaling, flops]

    - id: p-grouped-conv
      title: "Grouped convolution: what the layer saves and what the block keeps"
      difficulty: medium
      prompt: >-
        Implement `grouped_conv(c_in, c_out, k, groups)`. The layer is a
        `k x k` convolution with the channel axis split into `groups` equal
        parts, each part convolved independently, with one bias per output
        channel. Return a dict with four keys: `params` (int, weights plus
        biases), `macs_per_position` (float, multiply-accumulates for one output
        position), `dense_macs_per_position` (int, the same for `groups = 1`),
        and `saving` (float, the ratio of the two). The channel counts are
        always divisible by `groups`.
      starter: |
        def grouped_conv(c_in, c_out, k, groups):
            # your implementation here
            pass
      language: python
      entry: grouped_conv
      testCases:
        - input: '[256, 256, 3, 1]'
          expected: '{"params": 590080, "macs_per_position": 589824.0, "dense_macs_per_position": 589824, "saving": 1.0}'
          mode: json
          tolerance: 1.0e-9
        - input: '[256, 256, 3, 32]'
          expected: '{"params": 18688, "macs_per_position": 18432.0, "dense_macs_per_position": 589824, "saving": 32.0}'
          mode: json
          tolerance: 1.0e-9
        - input: '[384, 384, 7, 384]'
          expected: '{"params": 19200, "macs_per_position": 18816.0, "dense_macs_per_position": 7225344, "saving": 384.0}'
          mode: json
          tolerance: 1.0e-9
        - input: '[128, 128, 9, 128]'
          expected: '{"params": 10496, "macs_per_position": 10368.0, "dense_macs_per_position": 1327104, "saving": 128.0}'
          mode: json
          tolerance: 1.0e-9
      solution: |
        def grouped_conv(c_in, c_out, k, groups):
            macs = c_in * c_out * k * k / groups
            params = (c_in // groups) * (c_out // groups) * k * k * groups + c_out
            dense = c_in * c_out * k * k
            return {
                "params": params,
                "macs_per_position": macs,
                "dense_macs_per_position": dense,
                "saving": dense / macs,
            }
      solutionExplanation: >-
        The saving is exactly the group count, and that is the trap: it is a
        property of the *layer*. At 256 channels and 32 groups the 3x3 costs
        18,432 MACs per position against 589,824 — 32x — and the parameter count
        falls from 590,080 to 18,688. But put that layer inside ResNet's block
        and the two 1x1s at 256-to-128 and 128-to-256 cost 32,768 each, so the
        block goes from 212,992 to 70,144 and is **3.04x** cheaper, not 32x.
        The third case is the depthwise limit at ConvNeXt's widths: 384 groups
        of one channel, $49 \times 384 = 18{,}816$ MACs per position, 384x the
        saving of the dense layer, and 19,200 parameters. That is the number
        that makes a 7x7 kernel affordable — 18,816 against a dense 3x3's
        1,327,104, a factor of 70.5.
      complexity: "O(1) time, O(1) space"
      tags: [cnn-architectures, resnext, grouped-convolution, depthwise]

  visualizers:
    - id: vs-accuracy-per-flop
      kind: shape_flow
      title: "Move the budget between depth, width and resolution and watch the FLOP bill"
      description: >-
        Drag the three multipliers and the panel prices the family with
        depth times width squared times resolution squared, alongside the
        measured frontier points: EfficientNet-B0 at 0.39 GFLOPs and 77.1%,
        ResNet-50 at 4.1 and 76.1%, ConvNeXt-T at 4.5 and 82.1%, VGG-16 at 15.5
        and 71.6%.
      params:
        alpha: 1.2
        beta: 1.1
        gamma: 1.15
        maxPhi: 7
        constraint: 2.0
        modes: ["multipliers", "accuracy-frontier"]

  try_it: >-
    Price two candidate stems before training either: a single 7x7 stride-2 convolution from
    3 to 64 channels, and two stacked 3x3 layers from 3 to 64 to 64, both on 224x224 input.
    Compute parameters and MACs for each and check the ratio against the claim that two 3x3
    layers cost 72% of one 5x5 at equal width.
  interview_questions:
    - question: 'Why do two 3x3 convolutions match a 5x5 at 72% of the parameters, and why do they also work better?'
      level: mid
      key_points:
        - 'Receptive field recurses as r_L = r_{L-1} + (k-1)s, so two stride-1 3x3 layers give 5 and three give 7.'
        - 'Parameters scale as 9nC^2 against (2n+1)^2 C^2, so the ratio is 18/25 = 72% at equal width.'
        - 'The parameter count is the smaller half of the argument: two layers carry two ReLUs against the 5x5 single one.'
        - 'That gives a strictly larger function class per parameter, which is what VGG actually bought.'
    - question: 'ResNet-34 has higher training error than ResNet-18 on the same data. What does that rule out, and what must the fix guarantee?'
      level: senior
      key_points:
        - 'It is a training-error problem on the same 512 examples, so overfitting is the wrong diagnosis: more data, dropout and a smaller model are all aimed elsewhere.'
        - 'Measured under 10-crop validation, plain-18 is 27.94% top-1 error and plain-34 is 28.54% — depth made it worse, not better.'
        - 'A plain block cannot represent the identity, because its output is a re-normalised function of its input; 36 extra blocks must at least be able to do nothing.'
        - 'The residual block makes the identity the zero of its parameterisation, and the residual pair reverses the sign of the depth trend.'
      follow_up: 'ConvNeXt starts from ResNet-50 at 76.1% and reaches 82.1%. Which rung of that ladder would you have predicted, and were you right?'
    - question: 'Where do parameters and FLOPs actually live in a conv net, and why does that matter under a latency budget?'
      level: mid
      key_points:
        - 'They live in different layers. In AlexNet, conv1 holds 0.06% of parameters but 10.4% of MACs, and conv2 holds 1.0% of parameters and 44.3% of MACs.'
        - 'fc6 holds 61.3% of the parameters and 3.7% of the MACs, so the parameter count barely constrains the arithmetic.'
        - 'VGG-16 carries 5.4x ResNet-50 parameters and 3.8x its FLOPs while scoring 4.5 points lower.'
        - 'Cost models have to be per layer, which is why a 4 GFLOP budget needs the accounting rather than a parameter table.'
  common_mistakes:
    - 'Quoting parameter counts as a proxy for cost, when VGG-16 carries 5.4x ResNet-50 parameters and 3.8x its FLOPs while being 4.5 points less accurate.'
    - 'Attributing a 6.0-point gain to the 7x7 depthwise kernel, when the published ablation ladder credits it with 0.0 in the order it was applied.'
    - 'Scaling depth, width and resolution each by the same factor, when the cost is O(d w^2 r^2) and the last two are squared.'
  further_reading:
    - label: "He, Zhang, Ren & Sun, Deep Residual Learning for Image Recognition (CVPR 2016)"
    - label: "Liu, Mao, Wu, Feichtenhofer, Darrell & Xie, A ConvNet for the 2020s (CVPR 2022)"
