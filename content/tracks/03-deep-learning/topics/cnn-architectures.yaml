id: cnn-architectures
slug: cnn-architectures
title: "CNN Architectures: ResNet, EfficientNet, and ConvNeXt"
summary: >-
  Price an architecture change before you train it: count what a 3x3 stack, a
  grouped convolution, or a compound scaling step costs in parameters and FLOPs,
  and read each ImageNet milestone as the specific trade it actually made — 72%
  of a 5x5's parameters for two 3x3 layers, 1.7 points for 2% more arithmetic at
  ResNeXt-50, 6.0 points for 1.1x at ConvNeXt-T.
kind: lesson
difficulty: hard
position: 11
estMinutes: 29
prerequisites: [residual-connections, convolutions]
phase: deep-learning-foundations
tags: [cnn, alexnet, vgg, resnet, resnext, efficientnet, convnext, grouped-convolution, depthwise-convolution, compound-scaling, imagenet]

body:
  big_idea: >-
    Every milestone changes one of four quantities — depth, width, kernel
    support, connectivity — and each change is a ratio you can compute before
    training, so the history is a table of prices.

  problem:
    - >-
      You size a backbone from parameter counts, the one number that does not
      predict latency: VGG-16 has 5.4x ResNet-50's parameters and 4.5 points
      less accuracy.
    - >-
      You quote "two 3x3s equal one 5x5 at 72% of the parameters", then the
      layer widens 64→128 and the ratio becomes **1.081**.
    - >-
      A model is 89% parameters in the classifier and 0.8% FLOPs there, and
      you spend a week quantising the convolution stack.

  analogy: |
    A city block rebuilt six times: a two-storey shop in 1998; eight storeys
    of concrete in 2012; the same height from one standard brick in 2014; an
    express lift in 2016; thirty-two narrow staircases in 2017; height, width
    and footprint scaled together in 2019; the neighbour's open plan in 2022.
    Buildings add — networks do not: width enters the cost twice.

  concept_points:
    - >-
      **Parameters and FLOPs live in different layers.** In AlexNet, conv2
      holds 1.0% of the parameters and **44.3%** of the MACs, while fc6 holds
      **61.3%** of the parameters and 3.7% of the MACs. VGG-16's three fully
      connected layers are **89.4%** of the parameters and **0.8%** of the
      FLOPs. Parameters are a memory budget, FLOPs a latency budget — ResNet
      got 5.4x fewer parameters free by replacing that classifier with
      pooling.
    - >-
      **Two 3x3 convolutions match one 5x5 at 72% of the parameters, provided the width does not change.**
      The receptive field recurses as $r_L = r_{L-1} + (k-1)s$; parameters
      scale as $9n/(2n+1)^2$, giving **0.720** for two layers. Put a 64→128
      width change in the middle and the stack costs **1.081x** the single
      kernel. The second ReLU per layer is the part that survives.
    - >-
      **ResNet's contribution is a sign flip on the depth axis.** Plain-18 has
      **27.94%** top-1 error and plain-34 **28.54%** — depth *hurts* by 0.60
      points. With identity paths, ResNet-18 is 27.88% and ResNet-34
      **25.03%**, so depth is worth **2.85 points** for one addition per
      element: **0.45%** of the block's arithmetic, zero parameters.
    - >-
      **The bottleneck is an 8.5x discount that pays for depth.** A dense 3x3
      at 256 channels costs $9\cdot256^2 = 589{,}824$ MACs; the 1x1→64,
      3x3→64, 1x1→256 stack costs **69,632**, a factor of **8.47**. That is
      why ResNet-50 has 1.47x the layers of ResNet-34 for 1.14x the FLOPs — at
      the price of a 3x3 that sees only 64 channels.
    - >-
      **EfficientNet's constraint is arithmetic: cost scales as $d\,w^2\,r^2$, so one doubling per step needs $\alpha\beta^2\gamma^2 \approx 2$.**
      The measured multipliers 1.2, 1.1, 1.15 give **1.9203**, compounding to
      96.3x over seven steps. B0 is 0.39 GFLOPs at 77.1%; B7 is 37 GFLOPs at
      84.3% — **95x the FLOPs for +7.2 points**.
    - >-
      **ConvNeXt's ablation ladder says the famous changes are the cheap ones.**
      From ResNet-50 at 76.1%: modern training recipe **78.8**, stage ratio
      79.4, patchify stem 79.5, depthwise 80.5, inverted bottleneck 80.6, 7x7
      kernel **80.6**, GELU 80.6, one activation 81.3, LayerNorm 81.5,
      separate downsampling **82.0**. The recipe is +2.7; the celebrated
      kernel is +0.0 in that order.
  definitions:
    - term: "Stem"
      meaning: >-
        The first layer or two, which set the resolution every later stage
        inherits. ResNet's is a 7x7 stride-2 convolution plus a 3x3 stride-2
        max-pool, which costs 4x downsampling before any block runs; ConvNeXt
        and ViT use a single 4x4 stride-4 convolution instead, so the stem is
        one layer and the first stage starts at 56x56.
    - term: "Stage"
      meaning: >-
        A run of blocks at constant resolution and width. ResNet-50 has four:
        56x56x256, 28x28x512, 14x14x1024, 7x7x2048. Nearly every FLOP difference
        between architectures is a difference in how the budget is split across
        stages.
    - term: "Stage compute ratio"
      meaning: >-
        The number of blocks per stage. ResNet's is (3,4,6,3) — the deepest
        stage sits at the lowest resolution, where blocks are cheapest. Swin and
        ConvNeXt use (3,3,9,3), moving budget from the 28x28 stage to the 7x7
        one; on ResNet-50 that change alone was worth +0.6 points.
    - term: "Bottleneck block"
      meaning: >-
        1x1 down, 3x3, 1x1 up: 256 to 64, a 3x3 at 64, back to 256. It costs
        69,632 MACs where a dense 3x3 at 256 costs 589,824 — 8.47x less — which
        is what makes 50-layer stacks affordable. Its two 1x1s are 47% of the
        block's arithmetic.
    - term: "Inverted bottleneck"
      meaning: >-
        Expand, mix, project: 1x1 from 96 to 384, a depthwise 3x3 or 7x7 at 384,
        1x1 back to 96. The inverse of the ResNet arrangement, and the same 4x
        expansion ratio a transformer's feed-forward block uses.
    - term: "Cardinality"
      meaning: >-
        The number of independent paths inside a block, written $G$ or $C$ in
        ResNeXt's notation. At fixed complexity, raising it from 1 to 32 bought
        1.7 points on ImageNet (23.9% to 22.2% error) without changing the
        parameter count or the FLOPs.
    - term: "Grouped convolution"
      meaning: >-
        A convolution that splits the channel axis into $G$ groups and convolves
        each independently, so the cost is $C_{\text{in}}C_{\text{out}}k^2/G$
        instead of $C_{\text{in}}C_{\text{out}}k^2$. The saving is exact in
        arithmetic and does not survive to wall-clock, because the resulting
        tensor is memory-bound.
    - term: "Depthwise convolution"
      meaning: >-
        Grouped convolution at $G = C_{\text{in}} = C_{\text{out}}$: one kernel
        per channel, no channel mixing. A 3x3 costs 9 MACs per output and a 7x7
        costs 49, which is why ConvNeXt can afford a 7x7 kernel where a dense
        one would cost 96x more.
    - term: "Compound scaling"
      meaning: >-
        Scaling depth, width and resolution together under one coefficient
        $\phi$: $d = \alpha^\phi$, $w = \beta^\phi$, $r = \gamma^\phi$, with
        $\alpha\beta^2\gamma^2 \approx 2$ so that each step doubles the FLOPs.
        EfficientNet's measured multipliers are 1.2, 1.1 and 1.15.
    - term: "Patchify stem"
      meaning: >-
        A 4x4 convolution with stride 4 and no overlap, which turns a 224x224
        image into a 56x56 grid of 96-channel tokens in one layer. It is ViT's
        patch embedding written as a convolution, and it replaced ResNet's
        7x7-plus-pool stem in ConvNeXt.
    - term: "Global average pooling"
      meaning: >-
        Averaging each final feature map to one number before the classifier.
        Replacing VGG's three fully connected layers with it is what took
        ResNet-50 to 25.6M parameters from VGG-16's 138.4M — it deletes 123.6M
        parameters that cost 0.8% of the FLOPs.
    - term: "GFLOPs (MAC convention)"
      meaning: >-
        One multiply-accumulate counted as one operation, which is the
        convention in every paper table quoted here. A profiler that counts a
        MAC as two FLOPs reports double, and ResNet-50's published 3.3-to-4.1
        spread is the difference between counting the stem and the classifier.

  diagrams:
    - type: pipeline
      title: "Seven milestones, and the one number each one bought"
      nodes:
        - label: "LeNet-5, 1998"
          note: "60,000 parameters, 2 conv + 3 FC, 0.95% error on MNIST"
          detail: >-
            The template everything else is a variation on: convolve, pool,
            convolve, pool, classify. Its parameter count is four orders of
            magnitude below AlexNet's, and it already has the shape.
        - label: "AlexNet, 2012"
          note: "8 weight layers, ReLU, dropout, 2 GPUs: 61.6M parameters, 15.3% top-5 error"
          detail: >-
            The depth was the least of it. ReLU removed a 0.0707-per-layer
            gradient factor, dropout was aimed at the two 4096-wide layers that
            held 88% of the parameters, and the two-GPU split is why the channel
            grouping looks arbitrary.
        - label: "VGG-16, 2014"
          note: "13 conv layers, all 3x3: 138.4M parameters, 15.5 GFLOPs, 71.6% top-1"
          detail: >-
            Uniform kernel size, and the first architecture whose cost is
            dominated by a classifier: 123.6M of the 138.4M parameters are in
            three fully connected layers that consume 0.8% of the arithmetic.
        - label: "ResNet-50, 2016"
          note: "Identity path plus bottleneck: 25.6M parameters, 4.1 GFLOPs, 76.1% top-1"
          detail: >-
            Depth stops being a liability: plain-34 is 0.60 points worse than
            plain-18, ResNet-34 is 2.85 better. The bottleneck's 8.47x discount
            pays for 50 layers at 4.1 GFLOPs.
        - label: "ResNeXt-50, 2017"
          note: "Cardinality 32: 25.0M parameters, 4.2 GFLOPs, 77.8% top-1"
          detail: >-
            Grouped convolution divides the spatial term by 32 and the saving is
            spent on 32 parallel paths rather than on speed. Error falls
            monotonically with cardinality at fixed complexity: 23.9 to 22.2.
        - label: "EfficientNet-B0, 2019"
          note: "Compound scaling: 5.3M parameters, 0.39 GFLOPs, 77.1% top-1"
          detail: >-
            Ten times less arithmetic than ResNet-50 for one point more. The
            constraint alpha*beta^2*gamma^2 = 2 is what makes a scaling step
            cost a fixed doubling instead of a tuned multiple.
        - label: "ConvNeXt-T, 2022"
          note: "Transformer block in conv clothes: 28.6M parameters, 4.5 GFLOPs, 82.1% top-1"
          detail: >-
            Patchify stem, depthwise 7x7, inverted bottleneck, GELU, LayerNorm,
            one activation per block. Six points over ResNet-50 for 10% more
            FLOPs, and 0.8 points over Swin-T at equal cost.

    - type: compare
      title: "Two 3x3 convolutions against one 5x5, at 64 channels"
      left_label: "2 x (3x3), stride 1, pad 1"
      left_points:
        - "Receptive field 5: r = 3 + (3-1) = 5, by the recursion r_L = r_{L-1} + (k-1)s"
        - "Parameters 73,856 against the 5x5's 102,464 — ratio 0.7208 including biases"
        - "Exact ratio 9n/(2n+1)^2 = 0.7200 at constant width, independent of channel count"
        - "Two ReLUs inside the same receptive field, so a strictly larger function class"
        - "Holds at 0.5514 for three layers against a 7x7 (27/49), and 0.4451 for four"
      right_label: "1 x (5x5), stride 1, pad 2"
      right_points:
        - "One layer, one weight matrix, one activation: fewer sequential dependencies"
        - "102,464 parameters at 64 channels, all in one 25-element kernel"
        - "Cheaper on hardware per unit of arithmetic: 1 launch, 1 im2col pass"
        - "At a 64-to-128 width change the comparison flips: 221,440 against 204,928, ratio 1.081"
        - "The parameter argument disappears first; the nonlinearity argument never does"

    - type: architecture
      title: "ResNeXt's split-transform-merge block at cardinality 32"
      nodes:
        - id: x
          x: 0
          y: 1
          label: "x, 256 channels"
          kind: client
          detail: >-
            The residual stream. Everything the block adds to it has to come
            back at 256 channels, which is why the last 1x1 exists.
        - id: split
          x: 1
          y: 1
          label: "1x1: 256 to 128"
          kind: worker
          detail: >-
            The split. 256 to 128 channels costs 32,768 MACs per position, and
            it is already 47% of the block's arithmetic before any 3x3 runs.
        - id: groups
          x: 2
          y: 1
          label: "32 x (3x3 on 4 channels)"
          kind: model
          detail: >-
            32 independent paths of 4 channels each. The grouped 3x3 costs
            128*128*9/32 = 4,608 MACs per position against 147,456 for a dense
            3x3 at 128 channels. Each path sees only its own 4 channels, so no
            path mixes information across groups.
        - id: add
          x: 3
          y: 2
          label: "concat, 1x1 to 256, + x"
          kind: server
          detail: >-
            Merge. The concat is free; the 1x1 back to 256 costs another 32,768
            MACs, which is why the block as a whole is 3.04x cheaper than its
            dense-3x3 twin rather than 32x cheaper. The 1x1s are 93.4% of the
            grouped block's arithmetic.
      edges:
        - { from: x, to: split, label: "split" }
        - { from: split, to: groups, label: "32 groups" }
        - { from: groups, to: add, label: "32 x 4 = 128" }
        - { from: x, to: add, label: "skip" }
      caption: >-
        The point of the block is not that it is cheap. It is that the cheapness
        bought 32 paths instead of a smaller bill: the FLOPs stayed at 4.2
        against ResNet-50's 4.1, and the error fell 1.7 points.

    - type: architecture
      title: "One ConvNeXt block: a transformer block with convolutions in it"
      nodes:
        - id: in
          x: 0
          y: 1
          label: "x, 96 channels, 56x56"
          kind: client
          detail: >-
            The stream. ConvNeXt keeps the hierarchical, multi-resolution
            structure a ViT throws away, so the block still runs on a grid
            rather than on a token sequence.
        - id: dw
          x: 1
          y: 0
          label: "7x7 depthwise"
          kind: model
          detail: >-
            49 x 96 = 4,704 MACs per position. The same 7x7 as a dense
            convolution would be 451,584 — 96x more — which is the only reason a
            kernel this large is affordable. This is the layer that replaced
            self-attention's spatial mixing.
        - id: pw1
          x: 2
          y: 0
          label: "1x1 to 384, GELU"
          kind: worker
          detail: >-
            The inverted bottleneck: expand 4x before the nonlinearity, exactly
            the ratio a transformer's feed-forward block uses. LayerNorm sits
            after this, inside the branch, so the skip stays a clean identity.
        - id: pw2
          x: 3
          y: 0
          label: "1x1 back to 96"
          kind: worker
          detail: >-
            Project. This 1x1 is where the block's parameters are: 384*96 =
            36,864 plus 96*384, against 4,704+96 for the spatial layer.
        - id: add
          x: 3
          y: 2
          label: "y = x + block(x)"
          kind: server
          detail: >-
            One addition, unchanged since 2016. Every retrofit in this block is
            inside the branch; the identity path is the one design decision the
            transformer inherited from ResNet and never gave back.
      edges:
        - { from: in, to: dw, label: "same shape" }
        - { from: dw, to: pw1, label: "expand 4x" }
        - { from: pw1, to: pw2, label: "GELU, LN" }
        - { from: pw2, to: add, label: "residual" }
        - { from: in, to: add, label: "skip" }
      caption: >-
        Six changes from ResNet-50, each applied and measured one at a time:
        patchify stem, depthwise spatial mix, inverted bottleneck, 7x7 kernel,
        GELU, LayerNorm, and one activation per block. Together they are worth
        six points at 1.1x the FLOPs; individually, the kernel and the GELU are
        worth zero in the order they were applied.

    - type: plot
      title: "Accuracy against arithmetic: the frontier moves left three times"
      chart: scatter
      xLabel: "GFLOPs per image at 224x224 (MAC convention)"
      yLabel: "ImageNet-1K top-1 (%)"
      series:
        - name: "2012-2014: AlexNet, VGG-16"
          points:
            - { x: 1.01, y: 56.5 }
            - { x: 15.5, y: 71.6 }
        - name: "2016-2017: ResNet, ResNeXt"
          points:
            - { x: 4.1, y: 76.1 }
            - { x: 4.2, y: 77.8 }
            - { x: 11.6, y: 78.3 }
        - name: "2019-2022: EfficientNet, ConvNeXt"
          points:
            - { x: 0.39, y: 77.1 }
            - { x: 4.5, y: 82.1 }
            - { x: 37.0, y: 84.3 }
      caption: >-
        EfficientNet-B0 sits above ResNet-50 at a tenth of the arithmetic, and
        ConvNeXt-T sits 3.8 points above ResNet-152 at 0.39x. VGG-16 is
        dominated on both axes by every model that came after it.

  markdown: |
    ## Seven models, one table

    Every number here is ImageNet-1K at 224x224, single crop, with a
    multiply-accumulate counted as one operation — the convention the papers'
    tables use, so a profiler that counts two FLOPs per MAC disagrees with all of
    them by exactly 2x.

    | model | year | params | GFLOPs | top-1 |
    |---|---|---|---|---|
    | LeNet-5 | 1998 | 0.06M | — | 99.05% (MNIST) |
    | AlexNet | 2012 | 61.6M | 1.01 | 56.5 |
    | VGG-16 | 2014 | 138.4M | 15.5 | 71.6 |
    | ResNet-50 | 2016 | 25.6M | 4.1 | 76.1 |
    | ResNeXt-50 (32x4d) | 2017 | 25.0M | 4.2 | 77.8 |
    | EfficientNet-B0 | 2019 | 5.3M | 0.39 | 77.1 |
    | ResNet-152 | 2016 | 60.2M | 11.6 | 78.3 |
    | ConvNeXt-T | 2022 | 28.6M | 4.5 | 82.1 |
    | EfficientNet-B7 | 2019 | 66M | 37 | 84.3 |

    Only one of those moves is an accuracy-for-compute trade — VGG's 15.3x
    FLOPs for 15.1 points. ResNet-50 over VGG-16 (3.8x fewer FLOPs) and
    EfficientNet-B0 over ResNet-50 (10.5x fewer) are free, and calling all three
    "scaling" hides where the wins came from.

    ## AlexNet: three of its four changes were not depth

    Eight weight layers against LeNet-5's five is not why it worked. ReLU's
    advantage is a gradient factor: $\tanh'(2) = 0.0707$, so eight tanh layers
    multiply a gradient by

    $$0.0707^{8} = 6.2\times10^{-10}$$

    while eight ReLU layers multiply it by 1, since the derivative is 1.0 for
    every positive pre-activation. The paper measured about 6x to the same error
    on CIFAR-10. Dropout at $p = 0.5$ went on the two 4096-wide layers, which
    hold 88% of the parameters and 3.7% of the MACs — a regulariser aimed at
    capacity, not at arithmetic.

    | layer | share of params | share of MACs |
    |---|---|---|
    | conv1 (11x11, stride 4) | 0.06% | 10.4% |
    | conv2 (5x5) | 1.0% | 44.3% |
    | fc6 (4096) | 61.3% | 3.7% |

    The 61.6M parameters are 246.6 MB in float32, and the two-GPU split across
    3 GB GTX 580s is why conv2, conv4 and conv5 see only channels produced on
    their own card — which is why the original channel grouping looks arbitrary.

    ## VGG: one kernel size, and the arithmetic of stacking

    Receptive fields add, and parameters multiply:

    $$r_n = 1 + 2n, \qquad
      P_{\text{stack}} = n\left(9C^2 + C\right), \qquad
      P_{\text{single}} = (2n+1)^2C^2 + C,$$

    $$\lim_{C \to \infty}\frac{P_{\text{stack}}}{P_{\text{single}}}
      = \frac{9n}{(2n+1)^2} = 1.000,\ 0.720,\ 0.551,\ 0.445 .$$

    Measured at 64 channels including biases: 36,928 / 73,856 / 110,784 /
    147,712 against 36,928 / 102,464 / 200,768 / 331,840, so the 0.7208 is
    0.7200 plus the bias term. It is a constant-width result: insert a 64-to-128
    widening and the stack costs 221,440 against 204,928 — ratio 1.081, i.e.
    worse than the single kernel.

    What survives that is the nonlinearity count, two ReLUs in a 5x5 field
    instead of one. VGG-16 spends it on 13 such layers, and the split is
    decisive:

    | part | params | GFLOPs |
    |---|---|---|
    | 13 conv layers | 14.7M | 15.35 |
    | fc6 + fc7 + fc8 | 123.6M | 0.25 |

    VGG is a 15M-parameter convolutional network wearing a 124M-parameter
    classifier. ResNet deleted the classifier with global average pooling and
    got 5.4x fewer parameters for nothing.

    ## ResNet: the identity path, measured

    | depth | plain | residual |
    |---|---|---|
    | 18 | 27.94% | 27.88% |
    | 34 | 28.54% | 25.03% |

    Going from 18 to 34 layers costs the plain net 0.60 points and gains the
    residual net 2.85. The 3.45-point swing is the block's entire contribution,
    at fixed width, fixed data and a parameter count within 0.1M. *Residual
    Connections* derived why: the block's Jacobian is $I + J_f$, so the identity
    is one term of the product at every depth.

    The bottleneck pays for the depth. At 256 channels:

    $$\underbrace{9\cdot256^2 = 589{,}824}_{\text{dense 3x3}}
      \;\longrightarrow\;
      \underbrace{256\cdot64 + 9\cdot64^2 + 64\cdot256 = 69{,}632}_{\text{1x1, 3x3, 1x1}}$$

    a factor of 8.47, which buys 1.47x the layers of ResNet-34 for 1.14x the
    FLOPs. The two 1x1s are 47.1% of the block: the compression is the trick,
    and its price is a 3x3 that only ever sees 64 channels.

    ## ResNeXt: cardinality at constant complexity

    A grouped convolution splits the channel axis and divides the cost:

    $$\text{MACs}_{\text{grouped}} = G\cdot\frac{C_{\text{in}}}{G}\cdot
      \frac{C_{\text{out}}}{G}\cdot k^2 = \frac{C_{\text{in}}C_{\text{out}}k^2}{G}.$$

    ResNeXt spends the saving on paths rather than on speed: 32 groups of 4 is
    128 inner channels at 25.0M parameters and 4.2 GFLOPs, against ResNet-50's
    25.5M and 4.1. At that fixed budget the error falls monotonically with
    cardinality — 23.9%, 23.0%, 22.6%, 22.3%, 22.2% for $G = 1, 2, 4, 8, 32$ —
    which is 1.7 points for changing nothing but the number of independent paths.

    The block-level accounting is the useful part. With 128 inner channels:

    | block | MACs per position | 1x1 share |
    |---|---|---|
    | dense 3x3 | 212,992 | 30.8% |
    | 32-group 3x3 | 70,144 | 93.4% |

    The block is 3.04x cheaper, not 32x. Any claim about grouped convolution's
    speedup has to be a claim about the block.

    ## EfficientNet: compound scaling is a constraint

    Cost is proportional to depth times width squared times resolution squared:
    width multiplies both channel counts of every layer, resolution multiplies
    both sides of the feature map. With $d = \alpha^\phi$, $w = \beta^\phi$,
    $r = \gamma^\phi$:

    $$\text{FLOPs}(\phi) = \bigl(\alpha\beta^2\gamma^2\bigr)^{\phi}\,
      \text{FLOPs}(0), \qquad \alpha\beta^2\gamma^2 \approx 2 .$$

    The constraint is what makes each step of $\phi$ cost one doubling instead of
    a tuned multiple. The measured triple is 1.2, 1.1, 1.15, whose product is
    $1.2 \times 1.21 \times 1.3225 = 1.9203$ — 4% under the ideal, compounding to
    96.3x rather than 128x over seven steps.

    B0 is 5.3M parameters, 0.39 GFLOPs, 77.1%; B7 is 66M, 37 GFLOPs, 84.3% — 95x
    the arithmetic for 7.2 points. Width alone, ResNet-50 to ResNet-152, is 2.8x
    the FLOPs for 2.2 points. Scaling one axis saturates because the other two
    become the binding constraint.

    ## ConvNeXt: the transformer block, retrofitted

    Starting from ResNet-50 at 76.1% and applying one change at a time:

    | change | top-1 |
    |---|---|
    | ResNet-50 baseline | 76.1 |
    | modern training recipe | 78.8 |
    | stage ratio (3,3,9,3) | 79.4 |
    | patchify stem (4x4, stride 4) | 79.5 |
    | depthwise convolution | 80.5 |
    | inverted bottleneck (4x) | 80.6 |
    | 7x7 kernel | 80.6 |
    | ReLU to GELU | 80.6 |
    | one activation per block | 81.3 |
    | one norm per block | 81.4 |
    | BatchNorm to LayerNorm | 81.5 |
    | separate downsampling | 82.0 |

    The training recipe is +2.7; the 7x7 kernel and the GELU are +0.0 each in
    that order. A cumulative ladder is not a ranking — it under-credits the
    change that enables a later one — but it is decisive about one thing: the
    transformer's advantage was never attention. ConvNeXt-T reaches 82.1% at 4.5
    GFLOPs against Swin-T's 81.3% at the same cost, using nothing but
    convolutions, and the largest architectural step is cutting three activations
    per block down to one. The 7x7 kernel is affordable only because it is
    depthwise: 49 MACs per output at 96 channels is 4,704 per position, against
    451,584 for a dense 7x7 at the same width.

    ## Reading the table

    Four numbers, in this order. Accuracy per GFLOP at your resolution: 18.6 for
    ResNet-50, 197.7 for EfficientNet-B0, the 10.6x that decided the last five
    years. Where the parameters are: if they are in a classifier, delete it.
    Which stage holds the FLOPs: ResNet-50's 56x56 stage is 17% and its 14x14
    stage is 36%, so the cut comes from the stage you did not suspect. And the
    protocol, or the numbers are not comparable to anything in this table.

    ## The longer version

    Every milestone in this history is a change to one of four quantities —
    depth, width, kernel support, and connectivity — and each change is a ratio
    you can compute before you train anything, so the history is a table of
    prices rather than a list of names.

    A city block rebuilt six times. 1998: a two-storey shop with a hand-cut
    staircase. 2012: eight storeys, concrete instead of timber (ReLU), a fire
    door on every floor (dropout), and a crane big enough to lift the concrete
    (the GPU). 2014: the same height built from one standard brick, because a
    crew that lays only one size of brick is faster than a crew that switches.
    2016: an express lift that skips floors, so height stops costing anything.
    2017: thirty-two narrow staircases instead of one wide one, at the same
    floor area. 2019: height, width, and footprint scaled together, because a
    tower that is tall and one room wide is as useless as a car park. 2022: the
    neighbour's floor plan — open plan, one big window, half the internal walls.

    Where it breaks: buildings add. A floor costs what a floor costs, and a
    building never gets worse when you add one — which is precisely the ResNet
    result that has no construction analogue, where the 34-storey plain building
    is 0.60 points *worse* than the 18-storey one. And the arithmetic is not
    additive either: width enters the cost twice, so doubling channels quadruples
    a layer's arithmetic, and resolution enters twice as well. What you are
    pricing is a product of ratios, not a sum of storeys.

    ### What goes wrong

    - You have 4 GFLOPs of latency budget per image and a list of five
      backbones. The vendor slides give you parameter counts, which is the one
      number that does not predict latency: VGG-16 carries 5.4x ResNet-50's
      parameters and 3.8x its FLOPs, and is 4.5 points less accurate. You need
      the accounting that says *which* layer the arithmetic is in.
    - You repeat "two 3x3 convolutions equal one 5x5 at 72% of the parameters"
      in a design review, and someone asks what happens when the layer widens
      from 64 to 128 channels. The ratio becomes **1.081** — the stack is now
      *more* expensive than the single kernel — and the rule you quoted
      without its precondition is wrong in exactly the case you were using it
      for.
    - A model is 89% parameters in the classifier and 0.8% FLOPs there, and
      you spend a week quantising the convolution stack because that is where
      "the compute" is. VGG-16's three fully connected layers hold 123.6M of
      its 138.4M parameters and 0.25 of its 15.5 GFLOPs. You optimised the
      wrong tensor for a week.
    - An interviewer asks why EfficientNet-B0 beats ResNet-50 with **10.5x
      fewer** FLOPs, and "compound scaling" is a name, not an explanation. The
      explanation is that FLOPs scale as depth times width squared times
      resolution squared, so the only free direction is the one that raises
      all three at once.
    - You inherit a "ResNet-50 but modernised" block with a 7x7 depthwise
      kernel, an inverted bottleneck, LayerNorm and GELU. It is 6.0 points
      better. You assume the 7x7 kernel did it, and the published ablation
      ladder says the kernel and the GELU are each worth **0.0** in the order
      they were applied, while the training recipe is worth 2.7.

    ### The full treatment

    **Each milestone is a price, and the price is a ratio you can compute
    before training.** AlexNet to VGG-16 bought **+15.1** top-1 points for
    **15.3x** the FLOPs and 2.2x the parameters. VGG-16 to ResNet-50 bought
    **+4.5** points for **0.26x** the FLOPs and **0.19x** the parameters — a
    model that is both smaller and better. ResNet-50 to EfficientNet-B0 bought
    **+1.0** point for **10.5x fewer** FLOPs and 4.8x fewer parameters. The
    frontier moved *left* three times in eight years, which is the opposite of
    the "newer is bigger" reading. The trap is that only one of those moves
    (VGG) was an accuracy-for-compute trade; the other two were free, and
    calling them all "scaling" hides where the wins came from.
    Accuracy per GFLOP at that budget reads 18.6 for ResNet-50 and
    **197.7** for EfficientNet-B0 — a **10.6x** improvement in the metric that
    decides whether a model ships — and every figure here is 224x224 single
    crop with a MAC counted as one FLOP, because a table that mixes the
    conventions differs by 2x on FLOPs and a point on accuracy.

    **Parameters and FLOPs live in different layers, and confusing them is the
    most common design error.** In AlexNet, conv1 holds **0.06%** of the
    parameters and **10.4%** of the MACs; conv2 holds 1.0% of the parameters
    and **44.3%** of the MACs; fc6 holds **61.3%** of the parameters and 3.7%
    of the MACs. VGG-16 sharpens it: three fully connected layers are
    **89.4%** of the parameters and **0.8%** of the FLOPs. So parameter count
    is a memory-and-regularisation budget and FLOPs is a latency budget, and
    from 2016 onward every architecture has been pushing them in opposite
    directions — ResNet replaced VGG's 123.6M-parameter classifier with global
    average pooling and got 5.4x fewer parameters for free. The trap is
    reporting either number alone as "the size of the model".

    **AlexNet's depth was the least interesting of its four changes.** It has
    eight weight layers against LeNet-5's five, which is not the reason it
    worked. ReLU replaced tanh, and the arithmetic is stark: tanh'(2) = 0.0707,
    so eight tanh layers multiply a gradient by $0.0707^8 = 6.2\times10^{-10}$
    while eight ReLU layers multiply it by exactly 1; the paper measured a
    **~6x** speedup to the same error on CIFAR-10. Dropout at p = 0.5 was
    applied to the two 4096-wide layers, which are **88%** of the parameters
    (54.5M of 61.6M) and 3.7% of the MACs — aimed precisely at where the
    capacity was, not where the arithmetic was. And the two-GPU split across
    3 GB GTX 580s is why conv2, conv4 and conv5 only ever see channels produced
    on their own card. The trap is crediting "8 layers" when 8 layers of tanh
    would have been 4 points worse.

    **Two 3x3 convolutions equal one 5x5 in receptive field at 72% of the
    parameters — provided the width does not change.** The receptive field
    recurses as $r_L = r_{L-1} + (k-1)s$, so two stride-1 3x3s give 5 and
    three give 7. Parameters scale as $9nC^2$ against $(2n+1)^2C^2$, so the
    ratio is $9n/(2n+1)^2$: **1.000, 0.720, 0.551, 0.445** for one to four
    layers, measured as 36,928 / 73,856 / 110,784 / 147,712 against 36,928 /
    102,464 / 200,768 / 331,840 at 64 channels. Both counts include biases, so
    the measured 0.7208 is 0.7200 plus the bias term. But put a 64-to-128
    width change in the middle and the stack costs **221,440 against 204,928 —
    1.081x**, because the second 3x3 now runs at 128 channels. The trap is
    quoting the 72% without the constant-width precondition, which is violated
    by every layer that changes width.

    **The reason to stack small kernels is the nonlinearity, not the parameter
    count.** Two 3x3 layers at the same receptive field carry **two** ReLUs
    against the 5x5's one, and three carry three against the 7x7's one. That
    is a strictly larger function class per parameter, and it is the part of
    VGG's argument that survives when the parameter saving evaporates at a
    width change. VGG-16 spends it: 13 conv layers, all 3x3, stride 1, pad 1,
    five 2x2 max-pools, **138.4M parameters, 15.5 GFLOPs, 71.6% top-1**. Its
    conv stack alone is 14.7M parameters and 15.35 GMAC — so VGG is a
    15M-parameter convolutional network wearing a 124M-parameter classifier.
    The trap is remembering VGG as "the big one" when the convolution stack is
    smaller than ResNet-50's and the classifier is the part that never should
    have existed.

    **ResNet's contribution is measured as a sign flip on the depth axis.**
    Under 10-crop ImageNet validation, the plain-18 net has **27.94%** top-1
    error and the plain-34 has **28.54%** — 34 layers are 0.60 points *worse*
    than 18 on the same data. The residual pair reverses it: ResNet-18
    **27.88%**, ResNet-34 **25.03%**, so depth is worth **2.85 points** once
    the identity path exists. The swing between those two deltas is **3.45
    points**, measured at fixed width, fixed dataset and a parameter count
    within 0.1M. The price is one addition per element per block: at
    56x56x256 that is 802,816 additions against the block's 179.8M MACs —
    **0.45%** of its arithmetic and zero parameters. The trap is describing
    this as a gradient fix; *Residual Connections* derived the Jacobian, and
    what the numbers here say is that the block became able to represent its
    own input, which is a statement about function classes, not optimisers.

    **The bottleneck is an 8.5x discount that pays for depth.** A dense 3x3 at
    256-to-256 channels costs $9\cdot256^2 = 589{,}824$ MACs. ResNet's
    bottleneck — 1x1 to 64 (16,384), 3x3 at 64 (36,864), 1x1 back to 256
    (16,384) — costs **69,632**, a factor of **8.47**. That discount is why
    ResNet-50 has 1.47x the layers of ResNet-34 for 1.14x the FLOPs (4.1
    against 3.6 GFLOPs) and 2.8 points more top-1. The two 1x1s are **47.1%**
    of the block's arithmetic and they are the compression that makes the 3x3
    cheap, which is also why the 3x3 only ever sees 64 channels. The trap is
    treating the bottleneck as a free lunch: it is a width-for-depth trade,
    and a 3x3 that sees 64 channels has a quarter of the capacity of one that
    sees 256.

    **ResNeXt shows that cardinality is a free axis at constant complexity.**
    A grouped convolution with $G$ groups costs $C_{\text{in}}C_{\text{out}}k^2/G$
    MACs, so splitting into 32 groups divides the spatial term by 32. ResNeXt
    spends the saving on paths rather than on speed — total inner width grows
    to 32x4 = 128 — which holds complexity at 25.0M parameters and 4.2 GFLOPs
    against ResNet-50's 25.5M and 4.1. At that fixed budget the error falls
    monotonically with cardinality: **23.9%** (1x64d) → **23.0%** (2x40d) →
    **22.6%** (4x24d) → **22.3%** (8x14d) → **22.2%** (32x4d). Same
    arithmetic, five designs, 1.7 points: the only thing that changed is how
    many independent paths the block contains. The trap is expecting the FLOPs
    to turn into wall-clock — a 32-group conv is memory-bound and sustains a
    fraction of a dense conv's FLOP/s — and the same trap inverted is why
    depthwise convolution ($G = C_{\text{in}}$) is the cheapest spatial mix
    available: 9 MACs per output for a 3x3.

    **EfficientNet's constraint is arithmetic, not a slogan.** For a conv net
    the cost is $O(d\,w^2\,r^2)$ — depth multiplies the number of layers,
    width multiplies both channel counts of every layer, resolution multiplies
    the number of positions. Scale by $d = \alpha^\phi$, $w = \beta^\phi$,
    $r = \gamma^\phi$ and the cost multiplies by
    $(\alpha\beta^2\gamma^2)^\phi$, so holding one doubling per step means
    **$\alpha\beta^2\gamma^2 \approx 2$**. The measured multipliers are
    $\alpha = 1.2$, $\beta = 1.1$, $\gamma = 1.15$, whose product is
    **1.9203** — 4% under the ideal, compounding to 96.3x rather than 128x
    over seven steps. B0 is 5.3M parameters, 0.39 GFLOPs, 77.1% top-1; B7 is
    66M, 37 GFLOPs, 84.3% — **95x the FLOPs for +7.2 points**. Width alone
    does worse: ResNet-50 to ResNet-152 is 2.8x the FLOPs for +2.2 points. The
    trap is treating α = 1.2 as physics: it came from a NAS search on B0 and
    was frozen, and the constraint is about FLOPs, not about accuracy.

    **ConvNeXt's ablation ladder says the famous changes are the cheap ones.**
    Starting from ResNet-50 at 76.1% and applying one transformer-inspired
    change at a time: modern training recipe **78.8**, stage ratio (3,3,9,3)
    **79.4**, patchify stem (4x4 stride 4) **79.5**, depthwise convolution
    **80.5**, inverted bottleneck (4x expand) **80.6**, 7x7 kernel **80.6**,
    ReLU to GELU **80.6**, one activation per block **81.3**, one norm per
    block **81.4**, BatchNorm to LayerNorm **81.5**, separate downsampling
    **82.0**. The training recipe alone is **+2.7**; the kernel everyone
    credits is **+0.0** in that order, and the GELU is +0.0 too. At equal cost
    ConvNeXt-T (82.1%, 4.5 GFLOPs) beats Swin-T (81.3%, 4.5 GFLOPs), so the
    transformer's advantage was the block design, not attention. The 7x7
    kernel is only affordable because it is depthwise: at 96 channels it costs
    4,704 MACs per position against 451,584 for a dense 7x7 — **96x**. The trap
    is reading a cumulative ladder as a ranking of ideas; it under-credits the
    change that enables a later one and over-credits the one that follows it.


