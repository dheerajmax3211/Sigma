    - title: "The block Jacobian is I + J_f, so the product has an identity term at every depth"
      latex: |
        For one block $y = x + f(x)$ with $f$ differentiable at $x$,

        $$\frac{\partial y}{\partial x} = I + \frac{\partial f}{\partial x} = I + J_f(x).$$

        Stacking $L$ blocks and applying the chain rule,

        $$\frac{\partial h_L}{\partial h_0} = \prod_{l=1}^{L}\left(I + J_{f_l}\right)
          = I + \sum_{l=1}^{L} J_{f_l} + \sum_{l<l'} J_{f_l}J_{f_{l'}} + \cdots
          + \prod_{l=1}^{L} J_{f_l},$$

        which has $2^L$ terms; at $L = 50$ that is $2^{50} = 1.13\times10^{15}$,
        and exactly one term — the product of the identities — is $I$, with
        coefficient 1 at any depth. Bounding the two extremes,

        $$\left\|\prod_l J_{f_l}\right\| \le c^{L}, \qquad
          \left\|\prod_l (I + J_{f_l})\right\| \le (1+c)^{L},
          \qquad c = \max_l \|J_{f_l}\|_2.$$

        Measured at $c = 0.1$, $L = 50$, $d = 64$, median of 20 draws: plain
        $1.85\times10^{-64}$ ($\log_{10} = -63.73$), residual $1.645$
        ($\log_{10} = +0.216$), typical vector gain $1.072$, and
        $\|\prod(I+J) - I\|_2 = 0.799$ against the bound $116.4$.
