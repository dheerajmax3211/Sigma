      latex: |
        For $\mathrm{LN}(z)$ over $d$ features with $\sigma = \sqrt{\operatorname{var}(z) + \varepsilon}$,

        $$S \;=\; \frac{\partial\,\mathrm{LN}}{\partial z}
          \;=\; \frac{1}{d\sigma}\left(dI - \mathbf{1}\mathbf{1}^\top
          - \hat z \hat z^\top\right), \qquad \|S\|_2 = \frac{1}{\sigma},$$

