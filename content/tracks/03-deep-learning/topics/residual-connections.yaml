    - language: python
      title: "A pre-norm block that is exactly the identity at init, and a post-norm twin that is not"
      note: >-
        Numerically WRONG in three specific ways, all measured at the bottom of
        the block. (1) `backward` differentiates the block as if LayerNorm's
        Jacobian were the identity, using `dx = g + g @ W.T`; the true term is
        `g + (g @ W.T) @ S` with $S$ the LN Jacobian, and the omission is a
        relative error of **21.4%** in Frobenius norm on a random cotangent at
        $d = 32$. It still trains — the missing term is a projection, so the
        error is a systematic bias rather than a divergence — which is exactly
        why this bug ships. (2) The stream is accumulated in float32, where the
        spacing at $\|h\| = 28$ is $1.9\times10^{-6}$: a branch of norm
        $10^{-8}$ added to that stream leaves it **bit-identical** (verified
        with `==`), so the branch's forward contribution vanishes and only its
        gradient survives. (3) `order` defaults to `"post"`, so calling
        `ResidualBlock(d, zero_init=True)` without reading the signature gives
        a block that is *not* the identity — measured `max|out - in| = 0.417`
        and an output std pinned to 1.0 — while the variable name says
        `zero_init`.
      code: |
        import numpy as np

        EPS = 1e-5

        def layernorm(x, eps=EPS):
            mu = x.mean(axis=-1, keepdims=True)
            var = x.var(axis=-1, keepdims=True)
            return (x - mu) / np.sqrt(var + eps)

        class ResidualBlock:
            """y = x + relu(LN(x) @ W)   (pre)   or   LN(x + relu(x @ W))   (post)."""

            def __init__(self, d, order="post", zero_init=True, seed=0):
                rng = np.random.default_rng(seed)
                self.order = order
                self.W = rng.normal(0, np.sqrt(2.0 / d), (d, d))
                if zero_init:
                    self.W = np.zeros_like(self.W)   # identity at init, pre-norm only
                self.cache = None

            def forward(self, x):
                if self.order == "pre":
                    c = layernorm(x)
                    pre = c @ self.W
                    self.cache = (c, x, pre > 0)
                    return x + np.maximum(pre, 0.0)
                pre = x @ self.W
                z = x + np.maximum(pre, 0.0)
                self.cache = (layernorm(z), x, pre > 0)
                return layernorm(z)

            def backward(self, g):
                c, x, mask = self.cache
                if self.order == "pre":
                    # BUG 1: the LN Jacobian is dropped entirely. The true term is
                    # g + ln_bwd((g * mask) @ W.T, cache); measured 21.4% off.
                    return g + (g * mask) @ self.W.T, c.T @ (g * mask)
                # Same omission on the post-norm path: g is treated as though it
                # had already passed through LN, and nothing here applies it.
                dpre = g * mask
                return g + dpre @ self.W.T, x.T @ dpre

        if __name__ == "__main__":
            rng = np.random.default_rng(0)
            d, n = 64, 8
            x = rng.normal(size=(n, d))
            for order in ("pre", "post"):
                blk = ResidualBlock(d, order=order, zero_init=True)
                out = blk.forward(x)
                print(order, "max|out - in| =", float(np.abs(out - x).max()),
                      "out std =", float(out.std()))

            # BUG 3: the default is post-norm, so this is not an identity.
            blk = ResidualBlock(d, zero_init=True)
            print("default order:", blk.order,
                  float(np.abs(blk.forward(x) - x).max()))

            # BUG 2: at stream norm 28, a 1e-8 branch is not representable.
            h = rng.normal(size=d); h = (h / np.linalg.norm(h) * 28).astype(np.float32)
            delta = rng.normal(size=d); delta = (1e-8 * delta / np.linalg.norm(delta)).astype(np.float32)
            print("h + delta == h:", bool((h + delta == h).all()))
            print("spacing at 28:", np.spacing(np.float32(28)))
