        The identity term is the only one that does not involve a product of the
        branch's Jacobians, which is why it survives when everything else
        decays — and why the fix is structural rather than a matter of scale.
        The bound is 146x loose in the measured case because random Jacobians
        rotate the signal away from each other's top singular directions, so
        quote the measured product, not the bound. The same expansion also says
        what a residual connection does *not* buy: the identity is one term of
        $10^{15}$, so it guarantees a route to layer 1 and guarantees nothing
        about its size relative to the branch terms.

