      latex: |
        Take the scalar-aligned case $J_{f_l} = cI$ for every block — the model
        of a branch whose linear part acts along one direction, which is the
        worst case a residual connection has to survive. Then

        $$\prod_{l=1}^{L}(I + J_{f_l}) = (1+c)^{L} I, \qquad
          \left\|\prod_{l=1}^{L} J_{f_l}\right\| = |c|^{L},$$

        so the per-block exponent is $\log_{10}|1+c|$ instead of
        $\log_{10}|c|$, and over fifty blocks

        $$c = +0.1:\ 1.1^{50} = 117.4, \quad c = 0:\ 1.0, \quad
          c = -0.1:\ 0.9^{50} = 5.15\times10^{-3}, \quad
          c = -0.5:\ 0.5^{50} = 8.9\times10^{-16}.$$

        For a matrix $J$ that does not commute with $I$ the growth is bounded
        by $(1+\|J\|)^L$ above and by $(1-\|J\|)^L$ below, and the realised
