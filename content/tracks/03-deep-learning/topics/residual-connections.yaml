id: residual-connections
slug: residual-connections
title: "Residual Connections and the Depth Problem"
summary: >-
  Measure the degradation problem — training error that rises as you add layers
  to the same task — and remove it with the identity path: read a block's
  Jacobian as I + J, count what the skip buys per block, and choose pre-norm,
  post-norm, and a projection shortcut from the arithmetic instead of the
  folklore.
kind: lesson
difficulty: hard
position: 7
estMinutes: 30
prerequisites: [batchnorm-layernorm, gradient-stability]
phase: deep-learning-foundations
tags: [residual-connections, degradation-problem, identity-path, jacobian, pre-norm, post-norm, projection-shortcut, resnet, depth]

body:
  big_idea: >-
    Depth is free only when the identity is free: a residual block makes the
    identity the zero of its parameterisation, and every useful fact about it
    follows from that one algebraic choice.

  problem:
    - >-
      You add sixteen blocks and the training loss, on the same 512 examples,
      gets worse; every suggestion you get targets overfitting or step size.
    - >-
      You paste `out = x + f(x)` and conclude "residuals help gradients flow",
      which predicts nothing about why depth 100 still falls over.
    - >-
      You inherit a ResNet whose shortcut `conv2d` is followed by BatchNorm:
      the "identity" path now changes its input by 3.17 per layer instead of
      0.0.

  analogy: |
    A document passed through a chain of photocopiers: each station re-copies
    the sheet it received, so the fifth generation is grainier and the
    fiftieth unreadable, though every station could make a perfect copy. The
    residual fix is to pass the original down the line as well, letting each
    station add its own annotations, so station fifty still has a clean
    original.

  concept_points:
    - >-
      **The degradation problem is a training-error problem, which is why overfitting is the wrong diagnosis.**
      On the identity task with 512 examples, training MSE is **0.172** at
      depth 2, **0.337** at 8, **0.451** at 20, **0.936** at 56 — a factor of
      **5.45** on data it was trained on — while the residual arm at the same
      depth reaches **0.020**. More data, dropout and early stopping leave
      this number untouched.
    - >-
      **The test is whether the block can be the identity, and a plain block fails it before training starts.**
      A plain pre-norm block computes $\varphi(\mathrm{LN}(h)W)$, which always
      carries the scale of $W$: measured, it changes its input by **4.22**. A
      residual block makes the identity the default — zero the branch's output
      matrix and $\max|y - x| = 0.0$ exactly — so its function class literally
      contains the shallower net's.
    - >-
      **A residual block's Jacobian is $I + J_f$, so the backward product has a term that is exactly the identity at every depth.**
      The product over $L$ blocks expands into $2^L$ terms —
      $2^{50} = 1.13\times10^{15}$ — of which one is the identity with
      coefficient 1. With $\|J_f\|_2 = 0.1$ and $d = 64$: the plain product
      has norm **$1.85\times10^{-64}$**, the residual product **1.645** —
      **63.9 decades** from one addition.
    - >-
      **The identity is a route, not a floor: an anti-aligned branch still decays.**
      With $J_f = cI$ the per-block gain is exactly $|1+c|$, so fifty blocks
      give $1.1^{50} = 117.4$ at $c = +0.1$, $1.0$ at $c = 0$,
      $0.9^{50} = 5.15\times10^{-3}$ at $c = -0.1$ and
      $0.5^{50} = 8.9\times10^{-16}$ at $c = -0.5$. The exponent moved from
      $\log_{10}c$ to $\log_{10}|1+c|$; it did not become zero.
    - >-
      **Where the normaliser sits decides whether the "identity" path is still an identity.**
      Post-norm computes $y = \mathrm{LN}(x + f(x))$; pre-norm computes
      $y = x + f(\mathrm{LN}(x))$. With a zero branch, the pre-norm block
      returns its input unchanged( $\max|y-x| = 0.0$); the post-norm block
      returns $\mathrm{LN}(x)$, differing by $\max|y-x| = \mathbf{0.417}$ and
      pinning the standard deviation to **0.999995**.
    - >-
      **Post-norm multiplies the skip route by LN's Jacobian, and the factor is $1/\sqrt{1+c^2}$ per block.**
      The stream entering block $l+1$ has norm $\sqrt{1+c^2}$ times the
      previous, so the skip over $L$ blocks is $(1+c^2)^{-L/2}$:
      **$2.98\times10^{-8}$** at $c=1$, $L=50$; **0.780** at $c=0.1$.
      Pre-norm's skip route is exactly 1 at every depth. Measured on 50
      blocks, the post-norm gradient *grows* by **103x** while its skip route
      is $3\times10^{-8}$.

  definitions:
    - term: "Residual connection"
      meaning: >-
        A path that adds a block's input to its output, $y = x + f(x)$, so the
        block computes a *residual* $f$ rather than the whole map. Its defining
        property is that $f = 0$ gives the identity exactly, which makes the
        identity reachable in one step from any initialisation.
    - term: "Shortcut / skip connection"
      meaning: >-
        The edge that carries $x$ past the branch. It has no parameters when
        the width is unchanged, and one linear map (a $1\times1$ convolution or
        a `Linear`, plus a norm in the original ResNet) when it is not. What it
        carries into the backward pass is exactly 1 per block, or $W_s^\top$
        when the width changes.
    - term: "Residual branch"
      meaning: >-
        The function $f$ inside the skip, usually two or three weighted layers.
        Everything learnable in a residual block is here; the skip itself is
        parameter-free, which is why it cannot decay.
    - term: "Residual stream"
      meaning: >-
        The tensor $h$ that the skips carry, and to which every block adds.
        Its norm grows with depth — like $\sqrt{1+Lc^2}$ per block for a branch
        of relative gain $c$ — so in a pre-norm transformer the stream is the
        widest thing in the model and the thing that needs a final norm.
    - term: "Identity path"
      meaning: >-
        The route through a stack that takes the skip at every block. It
        contributes the leading $I$ term of the product expansion with
        coefficient exactly 1 at any depth. It is one of $2^L$ paths, so it is
        not a lower bound on the norm — only a guaranteed non-zero route.
    - term: "Degradation problem"
      meaning: >-
        Training error that increases as layers are added to a network whose
        shallower version already fits. It is not overfitting (train error
        rises, so there is no gap to blame) and not a parameter shortage (the
        deeper net has more weights, and a residual net of the same size drives
        its training error far lower). He et al. (2016) demonstrated it on
        CIFAR-10 with 20- and 56-layer plain nets and introduced the residual
        block as the fix.
    - term: "Pre-norm (pre-LN)"
      meaning: >-
        $y = x + f(\mathrm{LN}(x))$: normalisation inside the branch, so the
        skip route is untouched and the block is exactly the identity when $f$
        is zero. Standard in every transformer since GPT-2, at the cost of a
        stream whose norm grows with depth and a final norm before the head.
    - term: "Post-norm (post-LN)"
      meaning: >-
        $y = \mathrm{LN}(x + f(x))$: normalisation after the addition, so the
        skip route is multiplied by LN's Jacobian at every block — a factor of
        $1/\sqrt{1+c^2}$ where $c$ is the branch-to-stream ratio. The original
        transformer and the original ResNet v1 arrangement; trainable, but it
        needs a small branch and a warmup, and it destroys the identity at
        initialisation.
    - term: "Projection shortcut"
      meaning: >-
        The $W_s$ used when the skip changes width or stride, $y = W_s x +
        f(x)$. It is a linear map, not an identity, so the route's gain is
        $\sigma_{\max}(W_s)$: 2.40 for a default-init $64\to128$ map,
        exactly 1.0 for a semi-orthogonal one, and 0.0 if you zero it.
    - term: "Zero-init residual"
      meaning: >-
        Initialising a block's final weight matrix (usually the last norm's
        gain, or the output projection) to zero so the block starts as the
        identity. Every block then contributes nothing at initialisation, and
        the deep stack starts as its own head; depth is grown by gradient
        descent. Zero the branch, never the shortcut.
    - term: "Residual (branch) scaling"
      meaning: >-
        A constant multiplying the branch output, typically
        $1/\sqrt{2L}$ for $L$ blocks (GPT-2), or $1/\sqrt{L}$. It keeps the
        branch-to-stream ratio $c$ small, which bounds the stream's growth as
        $\sqrt{1+Lc^2}$ and, in a post-norm net, keeps the skip route's
        $(1+c^2)^{-L/2}$ decay near 1.
    - term: "Block Jacobian"
      meaning: >-
        $\partial y/\partial x$ for one block: $I + J_f$ in a residual block,
        $J$ in a plain one, and $S(I + J_f)$ or $I + J_f S$ depending on where
        the norm sits. Its spectrum is what depth multiplies; for a residual
        block $\sigma_{\max} \ge 1$ always, because $J_f$ cannot change the
        directions LN deleted.

  diagrams:
    - type: architecture
      title: "The identity path through one pre-norm residual block"
      nodes:
        - id: x
          x: 0
          y: 1
          label: "x"
          kind: client
          detail: >-
            The residual stream entering the block. It is also the thing the
            skip carries forward untouched, which is why the block's Jacobian
            has an I in it.
        - id: ln
          x: 1
          y: 0
          label: "LayerNorm"
          kind: worker
          detail: >-
            Inside the branch, not on the skip. Its Jacobian removes the mean
            direction and scales by 1/sigma; putting it here means that
            projection applies to the branch only. Move it after the addition
            and it applies to the identity route too, which is the whole
            difference between pre-norm and post-norm.
        - id: w
          x: 2
          y: 0
          label: "W and activation"
          kind: model
          detail: >-
            The learnable part. Zero this matrix and the branch outputs zero,
            so the block is exactly y = x at initialisation, measured
            max|y - x| = 0.0. That single property is what makes 56 blocks
            trainable where 56 plain blocks are not.
        - id: add
          x: 3
          y: 1
          label: "+ (fan-in of two paths)"
          kind: server
          detail: >-
            Forward: the two paths add. Backward: the two cotangents add, and
            that sum is the identity route. The gradient arriving here leaves
            along the skip with factor exactly 1, and along the branch with
            factor J. Nothing else in the block can attenuate the first term.
        - id: out
          x: 3
          y: 2
          label: "y = x + f(x)"
          kind: client
          detail: >-
            Same width, same scale, same meaning as the input plus a
            correction. Stack fifty of these and the stream grows by about
            sqrt(1 + 50 c^2) rather than decaying by c^50.
      edges:
        - { from: x, to: ln, label: "branch input" }
        - { from: ln, to: w, label: "normalised" }
        - { from: w, to: add, label: "f(x)" }
        - { from: x, to: add, label: "skip, gain 1" }
        - { from: add, to: out, label: "add" }
      caption: >-
        The skip is the only edge with no parameters, no activation and no
        norm, which is precisely why its contribution to the backward pass is
        exactly 1 at any depth. Every property this topic derives is a
        consequence of that edge existing.

    - type: plot
      title: "Training error rises with depth, and the skip removes it"
      chart: line
      xLabel: "depth (blocks)"
      yLabel: "training MSE on the identity task"
      series:
        - name: "plain blocks: h = relu(LN(h) W)"
          points:
            - { x: 1, y: 0.1957 }
            - { x: 2, y: 0.1718 }
            - { x: 4, y: 0.3093 }
            - { x: 8, y: 0.3366 }
            - { x: 20, y: 0.4510 }
            - { x: 56, y: 0.9358 }
        - name: "residual blocks: h = h + relu(LN(h) W)"
          points:
            - { x: 1, y: 0.0419 }
            - { x: 2, y: 0.0439 }
            - { x: 4, y: 0.0366 }
            - { x: 8, y: 0.0438 }
            - { x: 20, y: 0.0233 }
            - { x: 56, y: 0.0197 }
      caption: >-
        Same width, same initialisation, same optimiser, same 3000 steps, same
        512 training examples: the only difference is the addition. The plain
        arm costs 5.45x more training error at depth 56 than at depth 2, on the
        data it was fit on, so no test set is needed to rule out overfitting.

    - type: plot
      title: "Gradient norm through 50 blocks with every block Jacobian at 0.1"
      chart: line
      xLabel: "number of blocks traversed"
      yLabel: "log10 of the gradient norm at the input"
      series:
        - name: "plain product of J"
          points:
            - { x: 1, y: -1.0 }
            - { x: 5, y: -5.9134 }
            - { x: 10, y: -12.2472 }
            - { x: 20, y: -25.0327 }
            - { x: 30, y: -37.8059 }
            - { x: 40, y: -50.6979 }
            - { x: 50, y: -63.7333 }
        - name: "residual product of I + J"
          points:
            - { x: 1, y: 0.0295 }
            - { x: 5, y: 0.0674 }
            - { x: 10, y: 0.0922 }
            - { x: 20, y: 0.1311 }
            - { x: 30, y: 0.1642 }
            - { x: 40, y: 0.1905 }
            - { x: 50, y: 0.2163 }
      caption: >-
        Median of 20 draws at d = 64, every J normalised to spectral norm 0.1.
        The plain arm loses 1.27 decades per block; the residual arm gains
        0.004. The gap at 50 blocks is 63.9 decades, and it is one addition
        wide.

    - type: compare
      title: "Pre-norm vs post-norm: what the skip actually carries"
      left_label: "Pre-norm: y = x + f(LN(x))"
      left_points:
        - "Block is exactly the identity when the branch is zero: max |y - x| = 0.0 measured"
        - "Skip route gain is exactly 1 at every depth; the branch is a correction"
        - "Stream grows like sqrt(1 + L c^2): 28.5x over 50 blocks at c = 1, 5.8x at c = 0.2"
        - "Gradient at block 1 grows with depth instead of decaying: 8.05x at 50 blocks, 14.8x at 100"
        - "No warmup needed at depth 100, but a final norm before the head is mandatory"
      right_label: "Post-norm: y = LN(x + f(x))"
      right_points:
        - "Block with a zero branch computes LN(x): max |y - x| = 0.417, std pinned to 0.99999"
        - "Skip route multiplied by 1/sqrt(1 + c^2) per block: 2.98e-8 over 50 blocks at c = 1, 0.78 at c = 0.1"
        - "Stream norm is pinned to sqrt(d) every block, so depth is invisible in the activations"
        - "Total gradient can grow while the skip route dies: 103x growth at 50 blocks, carried by branch paths"
        - "Trains at depth 50 only if the branch is scaled down: 0.0036 either way with 1/sqrt(2L)"

    - type: architecture
      title: "The projection shortcut when the width changes"
      nodes:
        - id: x
          x: 0
          y: 1
          label: "x (64)"
          kind: client
          detail: >-
            The stream at 64 features. The branch below will produce 128, so
            the skip must change width too: an addition needs matching shapes.
        - id: proj
          x: 1
          y: 0
          label: "W_s (128x64)"
          kind: model
          detail: >-
            The projection. Default init gives spectral norm 2.401 and condition
            5.30, so this route is a 5.3-conditioned linear map, not an
            identity. Semi-orthogonal init gives gain exactly 1.0. Zero-init
            gives 0.0 and deletes the route.
        - id: branch
          x: 1
          y: 2
          label: "branch to 128"
          kind: worker
          detail: >-
            The learnable function. Its output is a residual correction, so it
            should be the thing you shrink or zero at initialisation - not the
            projection, which is the route.
        - id: add
          x: 2
          y: 1
          label: "+"
          kind: server
          detail: >-
            Both inputs are now 128 wide. Backward, the skip contributes
            W_s^T g, whose gain is 0.687 for a semi-orthogonal 128x64 map - it
            shrinks a random cotangent by sqrt(64/128), and cannot do better
            because the map is rank 64.
        - id: out
          x: 3
          y: 1
          label: "y (128)"
          kind: client
          detail: >-
            The stream is now 128 wide and every later block is square again,
            so the projection is a one-off cost at each resolution change.
      edges:
        - { from: x, to: proj, label: "skip" }
        - { from: x, to: branch, label: "branch" }
        - { from: proj, to: add, label: "W_s x" }
        - { from: branch, to: add, label: "f(x)" }
        - { from: add, to: out, label: "add" }
      caption: >-
        A width change is the one place a residual block cannot have a
        parameter-free skip. It is also the one place where the "identity"
        route is a learned linear map, which is why the initialisation of this
        matrix - and not of the branch - decides whether the route survives.

  markdown: |
    ## Depth should be free, and it is not

    Adding layers to a network can only help if the extra layers are allowed to
    compute the identity. They are not, in a plain stack. Train the same task at
    several depths and the *training* error gets worse:

    | depth | plain block | residual block |
    |---|---|---|
    | 1 | 0.196 | 0.042 |
    | 2 | 0.172 | 0.044 |
    | 4 | 0.309 | 0.037 |
    | 8 | 0.337 | 0.044 |
    | 20 | 0.451 | 0.023 |
    | 56 | 0.936 | 0.020 |

    Identity target, 512 examples, $d = 32$, full-batch Adam at
    $3\times10^{-3}$ for 3000 steps, mean of three seeds, identical
    initialisation and parameter count in both arms. The plain net's training
    error rises by a factor of 5.45 between depth 2 and depth 56. Overfitting
    cannot produce that (it needs training error to fall), and neither can a
    shortage of weights: the plain-56 net has 36 more weight matrices than the
    plain-20, and the residual arm at the same depth and width drives its
    training error to 0.020 on the same examples. What the plain arm lacks is an
    identity setting — a pre-norm plain block re-normalises its input and can
    never pass $h$ through — so its extra blocks cannot be switched off. This is
    the **degradation problem**, and it is a failure of the parameterisation.

    Read the table for the ordering, not the absolute values. At width 32 and 56
    blocks the model has ~57k weights for 512 examples, so both arms are in the
    interpolation regime: a measured residual depth-20 model scores 1.17 MSE on
    fresh data, i.e. it memorised the batch. These are training errors, the
    right quantity for a degradation diagnosis, and they say nothing about
    generalisation.

    ## The identity is what a block has to be able to compute

    One plain block computes $h \mapsto \varphi(\mathrm{LN}(h)W)$. There is no
    $W$ that makes this the identity: $\mathrm{LN}(h)$ has unit variance by
    construction, so the block's output always has the scale of $W$ rather than
    the scale of its input. Measured on one random He-initialised block, it
    changes its input by 4.22 in max-abs — the opposite of identity — and fifty
    of them compose fifty such changes.

    A residual block computes

    $$y = x + f(x),$$

    so the identity is the *zero* of the parameterisation: set the branch's
    output matrix to zero and the block is exactly $y = x$ (measured
    $\max|y - x| = 0.0$). That is the entire mechanism. Nothing about the
    forward pass is approximated, nothing about the initialisation has to be
    lucky, and every block can start switched off.

    ## What the skip does to the Jacobian

    Differentiate one block:

    $$\frac{\partial y}{\partial x} = I + J_f, \qquad J_f = \frac{\partial f}{\partial x}.$$

    Stack $L$ of them and the product expands into $2^L$ terms:

    $$\prod_{l=1}^{L}(I + J_{f_l}) = I + \sum_{l=1}^{L} J_{f_l} + \sum_{l<l'} J_{f_l}J_{f_{l'}} + \cdots + \prod_{l=1}^{L} J_{f_l}.$$

    For fifty blocks that is $2^{50} = 1.13\times10^{15}$ paths, and exactly one
    of them — take the skip at every block — is the identity, with coefficient
    1. Measured with every $\|J_{f_l}\|_2 = 0.1$ at $d = 64$ (median of 20
    draws):

    | | norm | $\log_{10}$ |
    |---|---|---|
    | plain $\prod J$ | $1.85\times10^{-64}$ | $-63.73$ |
    | residual $\prod (I+J)$ | 1.645 | $+0.216$ |
    | typical vector through the residual product | 1.072 | $+0.030$ |

    Sixty-four decades, from one `+`. Note what the identity term is *not*: it
    is one term among $10^{15}$, so it does not bound the norm. Measured,
    $\|\prod(I+J) - I\|_2 = 0.799$ while the crude bound $(1.1)^{50} - 1$ is
    116 — the bound is 146x loose because random Jacobians rotate the signal
    away from each other's top directions. And the identity route can still
    decay: with an anti-aligned branch $J_f = cI$ the per-block gain is
    $|1+c|$, so $c = -0.1$ gives $0.9^{50} = 5.15\times10^{-3}$ and
    $c = -0.5$ gives $8.9\times10^{-16}$.

    ## Where the norm sits

    A residual block has two orderings, and they are not interchangeable:

    | | forward | skip route over $L$ blocks | identity at init |
    |---|---|---|---|
    | pre-norm | $x + f(\mathrm{LN}(x))$ | $1$ exactly | yes, 0.0 |
    | post-norm | $\mathrm{LN}(x + f(x))$ | $(1+c^2)^{-L/2}$ | no, 0.417 |

    The post-norm row follows from where LN's Jacobian lands. Writing
    $S = \partial\,\mathrm{LN}/\partial z$ with $\|S\| = 1/\sigma_z$ and
    $z = x + f(x)$:

    $$\text{pre: } J = I + J_f S, \qquad \text{post: } J = S\,(I + J_f).$$

    In the pre-norm case $S$ multiplies the branch only, so the skip's
    contribution is untouched. In the post-norm case $S$ multiplies both, and
    the stream's norm grows by $\sqrt{1+c^2}$ per block before each norm, so
    the skip route is multiplied by $1/\sqrt{1+c^2}$ at every block. At
    $c = 1$ and $L = 50$ that is $2^{-25} = 2.98\times10^{-8}$; at $c = 0.1$ it
    is $0.780$. Which one you get is a decision about how big you let the
    branch be, not a decision about depth.

    Post-norm is not broken. Measured with the branch scaled by
    $1/\sqrt{2L}$, both orderings reach training MSE 0.0036 at depth 50. What
    pre-norm removes is the *requirement* that $c \ll 1$ and that the first few
    hundred steps be small — the warmup post-LN transformers needed. That is why
    the modern default is pre-norm with a final norm before the head.

    ## When the width changes

    A skip can only add, so a block that changes width needs a projection:

    $$y = W_s x + f(x), \qquad W_s \in \mathbb{R}^{128\times64}.$$

    This route is a linear map, so its gain is $\sigma_{\max}(W_s)$ and its
    backward gain is governed by $W_s^\top$. Measured for $64\to128$: default
    init gives forward 1.328, backward 0.990, $\sigma_{\max} = 2.401$,
    $\sigma_{\min} = 0.453$, condition 5.30. Semi-orthogonal gives forward
    exactly 1.0 and backward 0.687. Zero-init gives 0.0 and 0.0.

    So: project to fix the shape, initialise the projection so its singular
    values are near 1, and never zero it. Zero the *branch's* last matrix
    instead — that is the one whose zero means "identity".

    ## What residuals do not fix

    - **The stream grows.** $\|h_L\| \approx \sqrt{1+Lc^2}\|h_0\|$: 28.5x over
      50 blocks at $c = 1$. The head sees a depth-dependent scale, which is why
      pre-norm stacks end in a norm and why residual scaling exists.
    - **The spectrum is better, not flat.** The residual product's condition
      number at 50 blocks is 2.80 against $8.4\times10^{17}$ for the plain
      product — seventeen orders of magnitude, and still not 1.
    - **Low precision eats small corrections.** At $\|h\| = 28$ the float32
      spacing is $1.9\times10^{-6}$, and a measured branch of norm $10^{-8}$
      added to that stream leaves it bit-identical. bf16 keeps 8 mantissa bits,
      a relative precision of $2^{-8} = 0.4\%$, so at that magnitude a
      correction below $28 \times 0.004 = 0.11$ is rounded away.
    - **Memory.** Every block's activations are needed for the backward pass,
      and the stream is carried at full width through all of them.

    ## What to measure

    Three numbers, in this order. Training error at depth 20 and depth 56 with
    everything else held fixed — if it rises, you have degradation and no
    amount of data will help. The per-block gradient norm with the skip removed
    and restored — at fifty blocks and $c = 0.1$ the ratio is $10^{-64}$, and
    anything below $10^{-12}$ means the skip is carrying the backward pass
    alone. And the skip route's own gain: exactly 1 for
    pre-norm with matched widths, $(1+c^2)^{-L/2}$ for post-norm,
    $\sigma_{\max}(W_s)$ for a projection. That last number is the one that
    tells you whether the depth you paid for is actually connected.

    ## The longer version

    Depth is free only when the identity is free: a residual block makes the
    identity the *zero* of its parameterisation, and the useful facts — the
    Jacobian $I + J_f$, the gradient that keeps a route to layer 1, the
    ordering rules for normalisation — are all consequences of that one
    algebraic choice rather than separate tricks.

    A document passed through a chain of photocopiers. Each station re-copies
    the sheet it received, so the fifth generation is grainier than the first
    and the fiftieth is unreadable — even though every station is capable of
    making a perfect copy. The failure is not that a copier is bad. It is that
    each one is asked to reproduce an already-degraded input, and small losses
    compound multiplicatively.

    The residual fix is the obvious office procedure: pass the *original* down
    the line as well, and let each station add its own annotations to it. Now
    station 50 still has the original, and the annotations are the only thing
    that accumulates.

    Where it breaks: paper does not change. In a network the "original" is the
    residual stream, and every block *adds* to it, so the stream is the
    original plus fifty annotations — measured, its norm grows 28.5x over 50
    blocks. The analogy also suggests the original is pristine, when in fact
    the forward pass rewrites it: the stream is the thing being learned, not a
    preserved input. And a photocopier that inverts its input would still ruin
    the copy no matter how many originals you hand out, which is the
    anti-aligned-$J$ case below.

    ### What goes wrong

    - You add sixteen blocks to a model that was training fine and the
      **training** loss gets worse. Not the validation loss — the training
      loss, measured on the same 512 examples you fit on. Every suggestion you
      get (more data, dropout, a bigger model, a lower learning rate) is aimed
      at overfitting or at step size, and this is neither.
    - You paste `out = x + f(x)` into the block because the paper did, the
      model trains a little better, and you conclude "residuals help gradients
      flow". That sentence predicts nothing: it does not tell you why depth
      100 still falls over, why zeroing the branch of a post-norm block does
      not give you an identity, or what to do when the skip has to change
      width.
    - You inherit a ResNet whose shortcut `conv2d` is followed by a BatchNorm.
      The "identity" path now rescales and re-centres every block, the block
      changes its input by 3.17 per layer instead of 0.0, and the property you
      added the skip for is gone. Nothing raises, and the loss curve looks
      normal until depth 30.
    - An interviewer asks why every transformer since GPT-2 is pre-norm, and
      "it trains better" is not an answer. The answer is a factor of
      $1/\sqrt{1+c^2}$ applied to the skip route at every block, where $c$ is
      the branch-to-stream ratio — 0.78 over 50 blocks at $c = 0.1$ and
      $2.98\times10^{-8}$ at $c = 1$.
    - You zero-init the branch output to "start at the identity", and the loss
      does not move for two hundred steps, because you also zeroed the
      *projection* in the shortcut and deleted the only path that had a
      gradient. Two `zeros_` calls, one word apart, opposite effects.

    ### The full treatment

    **The degradation problem is a training-error problem, which is why
    overfitting is the wrong diagnosis.** Take a fixed task — regress the
    identity on 512 examples in 32 dimensions — and train stacks of blocks
    that differ only in count. Measured, mean of three seeds, full-batch Adam
    at $3\times10^{-3}$ for 3000 steps: training MSE is **0.172** at depth 2,
    **0.337** at depth 8, **0.451** at depth 20 and **0.936** at depth 56 —
    a factor of **5.45** between the 2-block and the 56-block net, on data it
    was trained on. Overfitting has the opposite signature (train down, test
    up), and a shortage of parameters is not the story either: the plain-56
    net has 36 more weight matrices than the plain-20, and the residual arm at
    the same depth and width drives its training error to **0.020** on the
    same 512 examples. What the plain arm lacks is an identity setting — a
    pre-norm plain block computes $\varphi(\mathrm{LN}(h)W)$, which
    re-normalises its input and can never pass $h$ through — so its 56 blocks
    cannot even represent the 20-block solution. The trap is that
    every tool aimed at overfitting — more data, dropout, early stopping —
    leaves this number untouched, and the run looks like a hyperparameter
    problem forever.

    **The test is whether the block can be the identity, and a plain block
    fails it before training starts.** A 56-block net would match a 20-block
    net if its 36 extra blocks did nothing; a pre-norm plain block has no such
    setting, because its output $\varphi(\mathrm{LN}(h)W)$ is a re-normalised,
    rescaled function of $h$ — it always carries the scale of $W$, never the
    scale of its input. Measured on one block with random He-initialised
    weights, it changes its input by **4.22** in max-abs (relative change
    0.95), and stacking fifty of them composes fifty such changes. A
    residual block makes the identity the *default*: set the branch's output
    matrix to zero and the block is $y = x$, measured $\max|y - x| = 0.0$
    exactly, and the 56-block net's function class then literally contains the
    20-block net's. The trap is to read the skip as a gradient device. It is a
    parameterisation device: it makes one specific function — the identity —
    reachable in a single step from any initialisation, and gradient flow is
    the consequence.

    **A residual block's Jacobian is $I + J_f$, so the backward product has a
    term that is exactly the identity at every depth.** For $y = x + f(x)$,
    $\partial y/\partial x = I + J_f$, and the product over $L$ blocks is
    $I + \sum_l J_{f_l} + \sum_{l<l'} J_{f_l}J_{f_{l'}} + \cdots$ — $2^L$
    terms, $2^{50} = 1.13\times10^{15}$ of them for fifty blocks, of which
    exactly one is the identity, with coefficient 1. Measured with every
    block's Jacobian normalised to $\|J_f\|_2 = 0.1$, $d = 64$, median of 20
    draws: the plain product has norm **$1.85\times10^{-64}$**
    ($\log_{10} = -63.73$) and the residual product **1.645**
    ($\log_{10} = +0.216$) — **63.9 decades** from one addition. The trap is
    reading the identity term as a floor on the norm: it is one term of
    $10^{15}$, and the others can be larger than it (measured,
    $\|\prod(I+J) - I\|_2 = 0.799$ against the bound $(1.1)^{50} - 1 = 116$).

    **The identity is a route, not a floor: an anti-aligned branch still
    decays.** With a scalar-aligned branch $J_f = cI$ the per-block gain is
    exactly $|1 + c|$, so fifty blocks give $1.1^{50} = 117.4$ at $c = +0.1$,
    $1.0$ at $c = 0$, $0.9^{50} = 5.15\times10^{-3}$ at $c = -0.1$ and
    $0.5^{50} = 8.9\times10^{-16}$ at $c = -0.5$. The exponent moved from
    $\log_{10} c$ to $\log_{10}|1+c|$; it did not become zero. This is why a
    residual net with a badly scaled branch — one whose linear part is
    negative-definite, or whose output scale is large enough that
    $c \approx -1$ in some direction — still loses its early layers, and why
    "residuals fix vanishing gradients" is a claim about typical random $J$,
    not a theorem. The trap is the corollary: at $c$ near $-1$ the block is
    almost exactly annihilating, and the cheapest-looking fix (shrinking the
    branch by a large negative factor) is the worst one.

    **Where the normaliser sits decides whether the "identity" path is still
    an identity.** Post-norm computes $y = \mathrm{LN}(x + f(x))$; pre-norm
    computes $y = x + f(\mathrm{LN}(x))$. Measured on one block with a
    zero branch, $d = 64$, input standard deviation 1.0097: the pre-norm
    block returns its input unchanged ($\max|y-x| = 0.0$, std 1.0097), while
    the post-norm block returns $\mathrm{LN}(x)$, which differs by
    $\max|y-x| = \mathbf{0.417}$ (relative 0.123) and pins the standard
    deviation to **0.999995**. That is not a rounding difference, and it is
    the same measurement *Batch Normalisation and Layer Normalisation* made
    for a BatchNorm after the addition (3.17 per layer there, 0.417 for one
    LayerNorm block here): the post-norm block's forward map is a projection
    plus a rescale, so a stack
    of them cannot carry the input forward unchanged even with every branch
    at zero. The trap is that the block still trains, so this survives review;
    what you have lost is the reason you added depth.

    **Post-norm multiplies the skip route by LN's Jacobian, and the factor is
    $1/\sqrt{1+c^2}$ per block.** Differentiating $y = \mathrm{LN}(z)$ with
    $z = x + f(x)$ puts $S = \partial\,\mathrm{LN}/\partial z$ on the *left*
    of $(I + J_f)$, and $S$ has norm $1/\sigma_z$. The stream entering block
    $l+1$ has norm $\sqrt{1+c^2}$ times the norm entering block $l$ — the
    branch adds $c^2$ — so the skip route over $L$ blocks is
    $(1+c^2)^{-L/2}$: **$2.98\times10^{-8}$** at $c = 1$ and $L = 50$,
    **$3.78\times10^{-3}$** at $c = 0.5$, **0.375** at $c = 0.2$, **0.780** at
    $c = 0.1$. Pre-norm's skip route is exactly 1 at every depth. The trap is
    the total gradient norm: measured on a 50-block stack, the post-norm
    gradient *grows* by **103x** relative to depth 1 while its skip route is
    $3\times10^{-8}$ — the norm is carried by branch paths, and the identity
    route is gone. A healthy-looking gradient norm says nothing about which
    route is alive; that is the same lesson *Gradient Stability* drew about
    condition number.

    **Pre-norm is standard because it removes a constraint, not because
    post-norm cannot train.** With the branch scaled by $1/\sqrt{2L}$ — the
    GPT-2 residual scaling, which keeps $c$ small — both orderings train
    equally well: measured at depth 12 and depth 50 on the identity task,
    pre-norm reaches training MSE **0.00380** and **0.00359**, post-norm
    **0.00359** and **0.00362**. Post-norm is fine when $c \ll 1$ and you warm
    up; what pre-norm buys is that you no longer have to. That is the actual
    historical argument: post-LN transformers needed warmup and a small
    residual branch to stay stable at depth, and pre-LN ones did not, so
    depth stopped being a tuning problem. The price is a stream whose norm
    grows like $\sqrt{L}$ — measured **28.5x** over 50 blocks at branch gain
    1.0 and **5.8x** at 0.2 — which is why a pre-norm stack needs a final
    norm before the head and why very deep pre-LN runs still want a small
    learning rate. The trap is treating pre-norm as free: it trades a
    contraction for a growth.

    **The projection shortcut is not an identity, and its initialisation
    decides whether the route survives.** When the block changes width, the
    skip becomes $y = W_s x + f(x)$ with $W_s$ of shape $d_{\text{out}} \times
    d_{\text{in}}$. Measured for $64 \to 128$: PyTorch's default linear init
    gives a forward gain of **1.328** and a backward gain of **0.990** with
    $\sigma_{\max} = 2.401$, $\sigma_{\min} = 0.453$ and condition number
    **5.30** — so the "identity" route already stretches some directions
    2.4x and squashes others to 0.45. A semi-orthogonal $W_s$ gives forward
    gain exactly **1.0** and backward gain 0.687 (it is a $128\times64$ map,
    so $W_s^\top$ shrinks a random cotangent by $\sqrt{64/128}$). Zero-init
    gives **0.0** in both directions: you have deleted the route and left the
    branch as the only path, which is a plain network with extra steps. The
    trap is that the code for "zero the branch" and "zero the shortcut" is
    the same two tokens, and one of them is the whole idea.

    **Zeroing the branch makes the whole deep net start as a shallow linear
    model, and that is the point.** With every block's output matrix at zero,
    the 56-block stack computes $y = W_{\text{head}} x$ at initialisation:
    measured block-level $\max|y - x| = 0.0$, so the composition of 56
    identities is the identity and only the head is trained on step one. As
    the branch weights leave zero, depth is *grown* by gradient descent
    rather than imposed at initialisation — which is why 1000-layer ResNets
    train at all, and why the zero-init is not a trick but the mechanism. The
    trap is the neighbourhood: zero-init the branch's last layer only. If the
    block has a bias after the branch, or a norm after the addition, the
    initial function is not the identity (measured 0.417 for post-norm), and
    if you zero the head as well, every gradient on step one is exactly zero
    and nothing grows.

    **Residuals do not remove the depth budget; they move it.** Three things
    still bite. The stream: $\|h_L\| \approx \sqrt{1 + Lc^2}\,\|h_0\|$, so at
    $c = 1$ the norm is 28.5x after 50 blocks and the head sees an input
    whose scale depends on depth. The spectrum: the residual product's
    condition number is **2.80** where the plain product's is
    **$8.4\times10^{17}$** — better by seventeen orders of magnitude, and
    still not 1, so a residual net can be badly conditioned without being
    singular. The precision: a float32 addition at $\|h\| = 28$ has a spacing
    of $1.9\times10^{-6}$, and a measured branch of norm $10^{-8}$ added to
    such a stream leaves it **bit-identical** (`h + 1e-8*delta == h`), so the
    branch's forward contribution is silently dropped; bf16's relative
    precision is $2^{-8}$, so the same thing happens there to a correction of
    about 0.11.
    The trap is believing the skip makes depth safe. It makes depth
    *trainable*, and leaves you a norm budget to manage.


