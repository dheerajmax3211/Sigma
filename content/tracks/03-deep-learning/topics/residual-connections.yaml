        $$J_{\text{pre}} = I + J_f S,$$

        so the skip route is $I$ and the branch is modified. A post-norm block
        $y = \mathrm{LN}(x + f(x))$ has

        $$J_{\text{post}} = S\,(I + J_f),$$

        so both routes are multiplied by $S$. If the branch has relative gain
        $c$ then $\|z\| = \sqrt{1+c^2}\,\|x\|$ before each norm, hence
        $\|S\| = (1+c^2)^{-1/2}$ and the skip route over $L$ blocks is

        $$\left\|\prod_{l=1}^{L} S_l\right\| = (1+c^2)^{-L/2}:
