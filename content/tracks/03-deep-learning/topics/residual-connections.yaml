        This is the derivation that stops "residuals fix vanishing gradients"
        from being a slogan. The residual connection changes the exponent; it
        does not set it to zero. At $c > 0$ the identity route grows, at
        $c = 0$ it is neutral, and for $-1 < c < 0$ it decays — slowly at first
        (0.995 per block at $c = -0.01$) and then catastrophically as $c \to
