            - { x: 2999, y: 0.00000061 }
    - type: plot
      title: "Final loss against the clip value — flat where it always fires, a cliff where it never does"
      chart: line
      xLabel: "clip value c (100 = no clip)"
      yLabel: "held-out MSE"
      series:
        - name: "AdamW, cosine, 5% warmup"
          points:
            - { x: 0.05, y: 0.1351 }
            - { x: 0.1, y: 0.1351 }
            - { x: 0.25, y: 0.1351 }
            - { x: 0.5, y: 0.1352 }
            - { x: 1.0, y: 0.1397 }
            - { x: 2.0, y: 0.1758 }
            - { x: 4.0, y: 0.2787 }
            - { x: 100.0, y: 0.8438 }
    - type: compare
      title: "Two things people confuse: a clip and a smaller learning rate"
      left_label: "Same realised budget — 1.54 vs 1.50"
      left_points:
        - "cosine 2e-3 + clip 1.0: drawn 3.002, realised 1.536, held-out MSE 0.1397"
        - "cosine 1e-3, no clip: drawn 1.501, realised 1.501, held-out MSE 1.0018"
        - "Identical schedule shape, identical optimizer, identical movement available — 7.2x apart"
        - "The clipped run spends full rate on 28% of steps and ~45% on the rest; the low-rate run spends 100% everywhere, including on the spikes that wreck the weights"
      right_label: "Same clip value, different optimizer"
      right_points:
        - "AdamW, c = 0.05: budget ratio 0.027, loss 0.1351 — a no-op, because Adam divides by √v̂"
        - "SGD lr 0.01, c = 0.05: budget ratio 0.0137, loss 2.4240 — a 73x learning-rate cut"
        - "SGD lr 0.01, no clip: loss 2.2422 and θ drifting 1.56x — the spikes are the problem"
        - "AdamW, c = 1.0: loss 0.1397; SGD lr 0.01, c = 1.0: 0.1905 — 1.0 is the value that survives both"
    - type: architecture
      title: "Where each knob lives, and which ones talk to each other"
      nodes:
        - { id: sched, x: 0, y: 0, label: "schedule η_t", kind: worker, detail: "Reads (step, total_steps, warmup, peak). Produces one scalar per step and nothing else. Its budget is η·T/2 for any warmup length — if your warmup is inside T." }
        - { id: clip, x: 1, y: 0, label: "clip c", kind: worker, detail: "Reads the accumulated gradient norm and the schedule's current η. It is the only knob whose effect depends on where in the schedule you are, because the gradient norm falls as the loss falls: 3.11 to 0.86 across the run." }
        - { id: acc, x: 0, y: 1, label: "accumulation k", kind: queue, detail: "Decides what 'the gradient' even is: k size-weighted micro-batch means. It is exact for the mean and inexact for the clip, for dropout, and for any per-micro normalisation." }
        - { id: opt, x: 1, y: 1, label: "AdamW (m, v, λ)", kind: model, detail: "Applies the step. Its √v̂ division is why an always-on clip is a no-op, and its decoupled decay bypasses the clip entirely, which is why the decay's share doubles when s ≈ 0.5." }
        - { id: audit, x: 2, y: 0, label: "budget audit", kind: server, detail: "Σ η_t s_t / Σ η_t, clip rate by quintile, worst update over median. Three numbers, one instrumented run, and it explains most transfer failures." }
        - { id: params, x: 2, y: 1, label: "θ", kind: storage, detail: "The only thing that matters. Everything above is a way of deciding how far to move it; the audit tells you how far you actually moved it." }
      edges:
        - { from: sched, to: clip, label: "sets the stakes" }
        - { from: acc, to: clip, label: "what gets clipped" }
        - { from: clip, to: opt, label: "s_t · g" }
        - { from: sched, to: opt, label: "η_t" }
        - { from: opt, to: params, label: "−η(s·û + λθ)" }
        - { from: opt, to: audit, label: "trace" }
        - { from: audit, to: sched, label: "re-tune", style: "async" }

  markdown: |
    ## One step, four knobs

    The optimizer step, with every practical knob written into it:

    $$\theta_{t+1} = \theta_t - \eta_t\, s_t\, \hat{u}_t - \eta_t\lambda\theta_t,
      \qquad s_t = \min\!\left(1, \frac{c}{\|g_t\|}\right)$$

    where $\hat{u}_t$ is Adam's bias-corrected normalised direction. Read left to
    right: $\eta_t$ is the schedule from *Learning Rate Schedules, Warmup, and
    Batch Size*; $s_t$ is the clip from *Numerical Stability*; $g_t$ is whatever
    accumulation decided the gradient is; $\lambda$ is the decay. They enter as a
    **product**, so each one rescales the others.

    | knob | what you set | what it silently changes |
    |---|---|---|
    | schedule $\eta_t$ | peak, warmup, shape | how often the clip fires, because it fires where the loss is high |
    | clip $c$ | a norm ceiling | the realised budget, the decay's share, and the location of the effective peak |
    | accumulation $k$ | memory per step | which tensor gets clipped and how many times |
    | decay $\lambda$ | shrinkage per step | nothing in the gradient — but its relative size doubles when $s_t \approx 0.5$ |

    On the reference rig the schedule draws $\sum_t\eta_t = 3.002$ and the clip
    delivers $1.536$. Half the learning rate was removed by a constant.

    ## Clipping is a schedule you did not draw

    The clip is usually described as a safety net for rare NaNs. Measured, it is
    a second schedule that fires constantly, because the gradient norm falls as
    the loss falls:

    | quintile of the run | 1 | 2 | 3 | 4 | 5 |
    |---|---|---|---|---|---|
    | median gradient norm | 3.11 | 1.79 | 1.36 | 1.00 | 0.86 |
    | clip rate at c = 1.0 | 100% | 96.5% | 78.5% | 50.3% | 36.7% |

    A fixed cap against a falling norm is a *hard* cap early and a slack one
    late, so $s_t$ rises through the run and the curve the model experiences,
    $\eta_t s_t$, is not the curve you drew. The drawn peak is at step 149; the
    realised peak is at **step 578**. Clipping does not scale your schedule, it
    delays it — which is why adding a clip changes the optimal peak learning rate
    by a factor of two without changing anything else.

    It is also partly a warmup. With warmup switched off but $c = 1.0$ left on,
    the worst update is 10.4x the median; add 5% warmup and it is 3.35x. Two
    knobs, one effect, and the second one is the one you are not looking at.

    ## What clipping is not

    The tempting explanation for "clipping helped" is "it lowered the learning
    rate". It did not, and the experiment is one line of bookkeeping:

    | run | drawn | realised | held-out MSE |
    |---|---|---|---|
    | cosine 2e-3 + clip 1.0 | 3.002 | 1.536 | **0.1397** |
    | cosine 1e-3, no clip | 1.501 | 1.501 | 1.0018 |
    | cosine 1.4e-3, no clip | 2.101 | 2.101 | 0.8903 |

    At *matched realised budget* the clipped run is **7.2x** better. The
    difference is not how much movement was available but which steps got to
    spend it: the clipped run pays full rate on the 28% of steps with ordinary
    gradients and roughly 45% on the rest, while the low-rate run pays 100%
    everywhere, including on the batches that were going to wreck the weights.

    One caveat catches people moving a recipe between codebases. A cap that fires
    on *every* step is nearly a no-op under Adam, because Adam divides by
    $\sqrt{\hat v}$ and a uniform rescale cancels: clip values 0.05, 0.1 and 0.25
    give 0.1351, 0.1351 and 0.1351 — a 5x range of realised budget, a 0.01%
    change in loss. The same $c = 0.05$ under SGD is a 73x learning-rate cut and
    a loss of 2.42. *The clip value is only meaningful next to the optimizer that
    consumes it.*

    ## Warmup and cosine compose to a constant area

    Put the ramp inside $T$ and let the cosine span $[T_w, T)$:

    $$\eta(t) = \eta_{\max}\frac{t+1}{T_w}\ \ (t<T_w),
      \qquad
      \eta(t) = \eta_{\max}\cdot\tfrac12\left(1+\cos\pi\frac{t-T_w}{T-T_w}\right)\ \ (T_w \le t < T)$$

    The ramp contributes a triangle of area $\eta_{\max}T_w/2$; the cosine
    contributes $\eta_{\max}(T-T_w)/2$, because
    $\int_0^1 \tfrac12(1+\cos\pi x)\,dx = \tfrac12$. The total is
    $\eta_{\max}T/2$ — **the warmup length cancels**. Measured: 10.002 at
    $T_w = 500$ out of $T = 10^4$, and 10.0005 with no warmup, a 0.01%
    difference. Both ways of getting it wrong then cost exactly the warmup
    fraction:

    | composition | area | vs correct |
    |---|---|---|
    | ramp inside T, cosine shifted | 10.002 | — |
    | ramp appended on top of T | 10.502 | +5.0% |
    | cosine unshifted (starts at t/T) | 9.504 | −5.0% |

    ## Accumulation: exact for the mean, inexact for the pipeline

    Four micro-batches of 64 over the same 256 samples reproduce the full-batch
    gradient to cosine 1.0000000 and norm ratio 1.0000. Everything downstream is
    where the differences live:

    | variant | cosine vs true | norm ratio |
    |---|---|---|
    | 4 x 64, clip once | 1.0000 | 1.0000 |
    | clip each micro-batch at c | 0.9940 | 0.8155 |
    | unweighted short last chunk, k = 4 | 0.99996 | 0.9912 |
    | unweighted, k = 12 | 0.99979 | 0.9818 |
    | uneven chunks, 200 and 40 samples | 0.9718 | 0.9500 |
    | dropout 0.2 inside each micro-batch | 0.8963 | 1.0336 |

    The clip row is the one that matters here: clipping each micro-batch applies
    the cap $k$ times, so the accumulated gradient can never exceed $c$ even when
    the true full-batch gradient is ten times that. The uneven-chunk row is the
    LLM version — weight by *tokens*, not by chunk index, or a batch that happens
    to contain short sequences silently reweights the gradient.

    ## Units: loss scale, batch size, value versus norm

    **Loss scale.** Clipping the scaled gradient caps at $1/S$. At $S = 65536$
    that is $1.5\times10^{-5}$ against a typical norm of 10.96 — an effective
    learning-rate multiplier of $1.4\times10^{-6}$. The run is frozen, and the
    curve looks like a bad initialisation rather than a bad clip.

    **Batch size.** Fitting $\|g_B\|^2 = a + b/B$ over $B \in [8, 512]$ gives
    $a = 100.2$ and $b = 2271$: the median norm falls from 16.03 to 9.68 over a
    64x range, not by 8x, because the true gradient dominates at large $B$. The
    noise share is 75.4% at $B = 8$, 26.5% at $B = 64$, 4.7% at $B = 512$. A cap
    tuned at one batch size is a different cap at another.

    **Value versus norm.** Clamping each coordinate at ±0.2 touched 13.8% of
    entries, took the norm from 13.91 to 7.39, and left a cosine of 0.761 with
    the original direction. Norm clipping is cosine 1.0 by construction.

    ## The recipe, and what it costs

    | configuration | held-out MSE |
    |---|---|
    | AdamW, cosine 2e-3, 5% warmup, clip 1.0 | 0.1397 |
    | same, no clip | 0.8438 |
    | same, no warmup | 0.1482 |
    | constant 1e-3 (best of five constant-LR tunes, matched drawn budget) | 1.0203 |
    | constant 5e-4 | 1.0297 |
    | constant 2e-3 | 1.4240 |
    | constant 8e-3 | 3.2212 |
    | cosine 4e-3, 5% warmup, clip 1.0 (best of fifteen) | 0.1167 |

    The default is 7.3x better than the best constant learning rate at the same
    drawn budget, and 16% worse than the best of fifteen hand-tuned runs. On a
    clean version of the same task it wins at matched budget by 27% (0.1037
    against 0.1412) and loses to a constant 4e-3 given four times the budget
    (0.0697). The case for the default is not that it is best, but that its worst
    case is bounded — and the bound is worth about 7x on spiky data.

    ## Where this stops

    These are measurements on one small rig, and the ratios transfer better than
    the absolutes. What transfers: clipping is a state-dependent schedule, its
    budget cost must be measured rather than assumed, a cap that fires every step
    is invisible to Adam, and warmup plus cosine is one function with a constant
    area. What does not: the specific clip value, warmup fraction and 7.3x, which
    move with your data's gradient noise — which is why the audit exists.

    ## The longer version

    A training configuration is a product, not a checklist: the step the model
    actually takes is $\eta_t \cdot \min(1, c/\|g_t\|) \cdot \hat{u}_t$ plus the
    decay term, so the schedule, the clip, and the accumulation count each
    silently rescale the others — and the number that tells you what you built
    is the realised budget $\sum_t \eta_t s_t$, not the peak learning rate you
    typed.

    A rally stage: pace notes, cold tyres, and a rev limiter. The notes are the
    schedule — where to be fast and where to be slow, planned before the stage
    against a fixed time budget. The first kilometre on cold tyres is warmup:
    you cannot use the full throttle you will use later, not because the engine
    is weak but because nothing has reached operating temperature. The rev
    limiter is the clip: at 6000 rpm it does nothing at all, at 8000 it decides
    everything. Accumulation is the co-driver averaging four laps of telemetry
    before you change one thing about the setup — one change per four laps, not
    four changes per lap.

    Where the analogy breaks, and this is the content of the topic. First, the
    limiter engages on 72% of the measured run's steps, not only at the
    redline — because the gradient norm is 3.11 at the start of the run and 0.86
    at the end, a fixed cap is a *hard* cap early and a slack one late. Second,
    an automatic gearbox (Adam) hides the limiter: it re-gears to whatever
    torque arrives, so a cap that fires every step changes almost nothing,
    while a manual box (SGD) turns the same cap directly into road speed and a
    73× loss of it. Third, the limiter caps engine torque but not the brake:
    weight decay bypasses the clip entirely, so the moment the cap bites, the
    balance between acceleration and braking shifts by 1.95× without you
    touching either.

    ### What goes wrong

    - You add `clip_grad_norm_(1.0)` because a blog post said to. The run
      stops spiking and also stops improving. You cannot say whether the clip
      helped, hurt, or merely ate 49% of the learning-rate budget, because you
      have no number for "how much step size the clip removed" — and the peak
      LR you set is no longer the peak LR the model saw.
    - You port a recipe from a 300k-step pretraining run to an 8k-step
      fine-tune: 2000 warmup steps, cosine to zero over `total_steps`, clip
      1.0. A quarter of your run is now spent ramping, the cosine never
      reaches its flat region, and the result is worse than the constant
      learning rate you replaced — but every individual component is
      "correct".
    - You emulate a 4× larger batch with gradient accumulation, get a loss
      curve of the same shape, and land 0.3 worse on eval. You clipped each
      micro-batch instead of the accumulated gradient: on the measured rig
      that is a 0.82× norm and a cap applied four times, not once.
    - You enable fp16, keep the clip at 1.0, and the loss never leaves its
      initial value. The clip is capping the *scaled* gradient, so the update
      is 1.4×10⁻⁶ of what you intended and every step is a rounding error.
    - An interviewer asks why everyone runs AdamW + cosine + 5% warmup + clip
      1.0, and which of the four is actually doing the work. You have run the
      recipe a hundred times and never run the experiment that separates them.

    ### The full treatment

    **The applied step is a product of four functions, and only one of them is
    the one you drew.** $\theta_{t+1} = \theta_t - \eta_t s_t \hat{u}_t -
    \eta_t\lambda\theta_t$, with $s_t = \min(1, c/\|g_t\|)$. On the reference
    rig — a 10→64→64→1 tanh MLP, MSE, batch 64, 3000 steps, AdamW at
    $\lambda = 0.01$, with 0.4% of training targets contaminated by
    $\mathcal{N}(0, 30^2)$ noise — the schedule draws a budget of
    $\sum_t \eta_t = 3.002$ and the clip delivers
    $\sum_t \eta_t s_t = 1.536$. **Forty-nine percent of the learning rate was
    removed by a constant you set once and never looked at again.** The trap
    is tuning the peak $\eta$ after adding a clip and calling it a schedule
    fix; you are then tuning a product by adjusting one factor.

    **Clipping is a schedule you did not draw, and it is state-dependent.**
    Measured at $c = 1.0$, the clip fires on **100% / 96.5% / 78.5% / 50.3% /
    36.7%** of steps across the five quintiles of the run, tracking the median
    gradient norm down **3.11 → 1.79 → 1.36 → 1.00 → 0.86**. So $s_t$ climbs
    from **0.10 at step 0** to 1.00 by step 2100, non-monotonically, because
    each contaminated batch re-triggers it. The consequence is not just a
    smaller area: the realised curve $\eta_t s_t$ peaks at **step 578**, while
    $\eta_t$ peaks at step 149. A clip does not scale your schedule, it
    *delays* it.

    **The clip rate and the budget ratio are different numbers, and confusing
    them is the standard reporting error.** On the same run the clip fires on
    **72.4%** of steps but removes only **48.8%** of the budget. The clip rate
    is an unweighted mean of the indicator $[s_t<1]$; the budget ratio is
    $\sum_t \eta_t s_t / \sum_t \eta_t$, a mean of $s_t$ weighted by $\eta_t$.
    Because clipping is worst exactly where $\eta_t$ is largest, the weighted
    mean is below the unweighted one: the mean scale is **0.608** against a
    budget ratio of **0.5116**, so averaging $s_t$ instead of weighting it
    **overstates the realised budget by 19%**. "The clip fires on 3% of steps,
    so it cannot matter" is the same error in the other direction.

    **Under Adam, a clip that fires on every step is almost a no-op — and that
    is measurable.** Clip values 0.05, 0.1 and 0.25 all give a final loss of
    **0.1351** with budget ratios of **0.027, 0.054 and 0.134**: a 5× range of
    realised budget changes the answer by 0.01%. Adam divides by
    $\sqrt{\hat{v}}$, so a uniform rescale of the gradient cancels, and a cap
    that always fires is a uniform rescale with slowly varying magnitude. Only
    a cap that fires on *some* steps reweights them. Under SGD the same
    $c = 0.05$ is a hard step-size cap: at $\eta = 0.01$ the budget ratio is
    **0.0137** — a 73× learning-rate cut — and the loss is **2.42** against
    0.19 for $c=1.0$. The clip value is not portable between optimizers, and
    quoting "clip 1.0" without the optimizer is quoting half a fact.

    **Clipping is not a smaller learning rate, and the experiment that proves
    it is cheap.** At *matched realised budget* — 1.536 for
    cosine-2e-3-with-clip-1.0 against 1.501 for cosine-1e-3-without-clip —
    the clipped run finishes at **0.1397** and the unclipped one at
    **1.0018**, a factor of **7.2**. Same schedule shape, same movement
    available, same optimizer; the only difference is *which steps* got to
    spend it. Clipping spends the budget on the 28% of steps with ordinary
    gradients and refuses to spend it on the spikes; lowering the learning
    rate spends less on both. This is why "just lower the LR instead of
    clipping" is not a substitute, and why the two belong in the same
    sentence as *which* budget, not *what* peak.

    **Warmup and cosine compose to a constant area, so any warmup bug costs
    exactly the warmup fraction.** With the ramp inside $T$ and the cosine
    spanning $[T_w, T)$, the area is $\eta_{\max}T/2$ — independent of
    $T_w$. Measured at $T = 10^4$, $\eta_{\max} = 2\times10^{-3}$: **10.002**
    for $T_w = 500$, and **10.0005** with no warmup at all, a 0.01% difference.
    Append the ramp *on top* of $T$ and you buy **+5.0%** budget (10.502);
    leave the cosine unshifted so it starts at progress $t/T$ instead of
    $(t-T_w)/(T-T_w)$ and you lose **−5.0%** (9.504). Both errors equal
    $T_w/T$ — the warmup fraction — which is why the bug is invisible at 5%
    and fatal at 25%.

    **Warmup's measured effect is on the worst step, not the mean.** Sweeping
    the warmup over 0 / 1 / 2.5 / 5 / 10 / 20% of the run gives final losses
    of **0.148 / 0.144 / 0.145 / 0.140 / 0.142 / 0.141** — flat to ±6%, with a
    shallow minimum at 5%. The worst update as a multiple of the median update
    over the same sweep falls **10.4 → 6.2 → 3.7 → 3.35 → 3.46 → 3.40**. So
    warmup is not buying loss, it is buying a bound on the largest step, and
    5% is where that bound stops improving. The trap is spending a week tuning
    a knob whose loss response is inside the seed noise, while the clip — a
    knob with a 6× loss response — sits at its default.

    **Accumulation is exact for the gradient and inexact for everything you do
    to it.** Four micro-batches of 64 over the same 256 samples reproduce the
    full-batch gradient to **cosine 1.0000000 and norm ratio 1.0000**. But:
    clip each micro-batch separately and the accumulated norm is **0.4077**
    against **0.5000** for clipping once (cosine 0.9940) — the cap is applied
    four times; drop the last chunk's size weight and the norm is off by
    **0.9% at 2 chunks and 1.8% at 12**; use uneven chunks of 200 and 40
    samples and the unweighted average has **cosine 0.9718** and norm ratio
    **0.9500** against the true gradient; add dropout at 0.2 and the identity
    fails outright at **cosine 0.8963**, because each micro-batch draws its
    own mask. "Accumulation is the same as a large batch" is true for the
    mean and false for the pipeline.

    **The clip threshold lives in the units of the tensor you hand it, so it
    moves with loss scale and batch size.** Under fp16 loss scaling by
    $S = 65536$, clipping the scaled gradient at 1.0 caps the update at
    $1/65536 = 1.5\times10^{-5}$ against a typical norm of 10.96, an effective
    learning-rate multiplier of **1.4×10⁻⁶** — the run is frozen, not
    unstable. Unscale first, then clip. Batch size moves the threshold more
    gently than people assume: fitting $\|g_B\|^2 = a + b/B$ over
    $B \in [8, 512]$ gives **a = 100.2, b = 2271**, so the median norm falls
    only **16.03 → 9.68** over a 64× range of batch size, and the noise share
    of the gradient is **75.4% at B=8, 26.5% at B=64, 4.7% at B=512**. A clip
    tuned at B=64 is a different cap at B=8 because the *variance* changed,
    not the mean.

    **The default recipe is insurance, and its price is measurable.** At
    matched budget, AdamW + cosine + 5% warmup + clip 1.0 beats the best of five
    constant-LR hand-tunes by **7.3×** on the spiky rig (0.1397 against
    1.0203) and by **27%** on a clean one (0.1037 against 0.1412). But the
    best of fifteen hand-tuned configurations — cosine at peak 4e-3 with the
    same clip — reaches **0.1167**, 16% better than the default, for fifteen
    runs of tuning; and on clean data with 4× the budget a constant 4e-3 wins
    outright at **0.0697**. The honest statement is not "this recipe is
    optimal" but "this recipe is within 16% of the best thing you would find
    by tuning, and it is the thing that does not fail when the data is bad".
    That is what a default is for.


  derivations:
    - title: "The area of a warmup-plus-cosine schedule is η·T/2, whatever the warmup length"
      latex: |
        Split the sum at the join:
        $$\sum_{t=0}^{T-1}\eta(t) \;=\;
          \underbrace{\sum_{t=0}^{T_w-1}\eta_{\max}\frac{t+1}{T_w}}_{\text{ramp}}
          \;+\;
          \underbrace{\sum_{t=T_w}^{T-1}\eta_{\max}\cdot\tfrac12\left(1+\cos\pi\frac{t-T_w}{T-T_w}\right)}_{\text{cosine}}$$

        The ramp is an arithmetic series with mean $\eta_{\max}/2$:
        $$\sum_{t=0}^{T_w-1}\eta_{\max}\frac{t+1}{T_w}
          = \eta_{\max}\frac{T_w+1}{2} \;\approx\; \frac{\eta_{\max}T_w}{2}$$

        The cosine is a Riemann sum of $\tfrac12(1+\cos\pi x)$ over $x\in[0,1]$,
        whose integral is $1/2$:
        $$\int_0^1 \tfrac12\left(1+\cos\pi x\right)dx
          = \tfrac12\left[x + \frac{\sin\pi x}{\pi}\right]_0^1 = \tfrac12$$

        so the cosine contributes $\eta_{\max}(T-T_w)/2$ and

        $$\sum_{t=0}^{T-1}\eta(t) = \frac{\eta_{\max}T_w}{2}
          + \frac{\eta_{\max}(T-T_w)}{2} = \frac{\eta_{\max}T}{2}.$$

        Append the ramp outside $T$ instead and the run gains the whole triangle,
        $+\eta_{\max}T_w/2$, i.e. $+T_w/T$ relative. Leave the cosine unshifted
        and it starts at progress $T_w/T$ instead of 0, losing approximately
        $\eta_{\max}T_w/2$, i.e. $-T_w/T$. Both measured at 5%: $+5.0\%$ and
        $-5.0\%$.
      prose: >-
        The cancellation is the point: a warmup does not buy you extra budget
        and must not cost you any, and the only way to get both is to make the
        decay span the steps the ramp did not use. This is also the fastest
        check on someone else's schedule code — compute the area, and if it is
        not $\eta_{\max}T/2$ to within a rounding error, the warmup is being
        composed wrongly and the error is exactly the warmup fraction.
    - title: "The budget ratio is a weighted mean, so the clip rate overstates the damage"
      latex: |
        The realised budget is a sum of per-step products, while the clip rate is
        a count:
        $$B_{\text{real}} = \sum_t \eta_t s_t, \qquad
          r = \frac{1}{T}\sum_t \mathbf{1}[s_t<1].$$

        Dividing by the drawn budget turns the first into a mean of $s_t$
        weighted by the schedule:
        $$\frac{B_{\text{real}}}{B_{\text{drawn}}}
          = \sum_t \underbrace{\frac{\eta_t}{\sum_u \eta_u}}_{w_t}\, s_t,
          \qquad \sum_t w_t = 1.$$

        If $s_t$ and $\eta_t$ are similarly ordered — clipping is worst early,
        where $\eta$ is largest — Chebyshev's sum inequality gives
        $$\sum_t w_t s_t \;\le\; \frac{1}{T}\sum_t s_t,$$
        so the unweighted mean scale is biased *above* the budget ratio.
        Measured: mean scale 0.608, budget ratio 0.512, an overstatement of
        **19%**. In the other direction a clip that fires only on the schedule's
        flat top would make the unweighted mean *understate* the cost.
      prose: >-
        Reporting a clip rate is reporting how many steps were touched; reporting
        a budget ratio is reporting how much step size was removed. They differ
        by the correlation between the clip and the schedule, which is exactly
        the thing you were trying to understand, so never substitute one for the
        other. The measurement is two lines: the sum of $\eta_t s_t$ and the sum
        of $\eta_t$.
    - title: "Accumulation is exact; clipping before or after averaging is not"
      latex: |
        For a mean-reduced loss over $N$ samples split into chunks $C_j$ of size
        $n_j$ with $\sum_j n_j = N$:
        $$\hat{g}_{\text{acc}} = \sum_j \frac{n_j}{N}\,\hat{g}_j
          = \sum_j \frac{n_j}{N}\cdot\frac{1}{n_j}\sum_{i\in C_j}\nabla\ell_i
          = \frac{1}{N}\sum_{i=1}^{N}\nabla\ell_i = g_{\text{full}}.$$

        The middle equality needs $n_j/N$ as the weight; using $1/k$ instead
        leaves
        $$\hat{g}_{\text{unw}} - g_{\text{full}}
          = \sum_j\left(\frac{1}{k}-\frac{n_j}{N}\right)\hat{g}_j,$$
        which vanishes only when all $n_j$ are equal. For a 250/256 split into
        four chunks this is a 0.9% norm error; at twelve chunks, 1.8%; for a
        200/40 token split, 5%.

        Clipping is a nonlinear map, so it does not commute with the average:
        $$\left\|\sum_j w_j\,\operatorname{clip}_c(\hat{g}_j)\right\|
          \;\le\; \sum_j w_j \min(c, \|\hat{g}_j\|) \;\le\; c,$$
        whereas clipping once gives
        $\min(c, \|\sum_j w_j \hat{g}_j\|)$. With per-micro clipping the ceiling
        $c$ binds on every chunk separately, so the accumulated norm can never
        exceed $c$ even when the true gradient is $10c$ — measured 0.4077
        against 0.5000, cosine 0.9940.
      prose: >-
        This is the precise content of "accumulation is not the same as a large
        batch". The gradient is identical; the *clip* is applied $k$ times
        instead of once, the *normalisation layers* see $1/k$ of the samples per
        forward pass, and the *decay* is applied once per $k$ micro-batches
        rather than once per large batch. Every one of those is a change in the
        optimisation problem, and every one of them is invisible in a loss curve
        that only has the right shape.

  implementations:
    - language: python
      title: "One auditable step: accumulate, unscale, clip once, then AdamW"
      note: >-
        Numerically wrong in two specific ways, both worth knowing. First, in
        float32 the tail of the schedule falls below the half-ulp of a
        unit-magnitude weight: on the reference run measured at peak 2e-3 over
        10,000 steps, **33 of the last steps** add less than 6e-8 to a weight and
        are silently discarded, so "cosine to zero" is really "cosine to the
        dtype's floor". Second, if `loss_scale` is passed to the clip instead of
        being divided out first, the effective cap is `c / S` and at S = 65536
        the step is 1.4e-6 of the intended size — the function still runs, still
        returns finite weights, and learns nothing. `unscale=True` is the only
        correct usage.
      code: |
        import math
        import numpy as np

        class ClippedAdamW:
            """The assembly from this topic, with nothing hidden in a library call."""

            def __init__(self, params, peak_lr, total_steps, warmup_steps,
                         clip=1.0, weight_decay=0.01, betas=(0.9, 0.999), eps=1e-8):
                self.p = [np.asarray(x, dtype=np.float64) for x in params]
                self.peak, self.T, self.Tw = peak_lr, total_steps, warmup_steps
                self.clip, self.wd, self.eps = clip, weight_decay, eps
                self.b1, self.b2 = betas
                self.m = [np.zeros_like(x) for x in self.p]
                self.v = [np.zeros_like(x) for x in self.p]
                self.t = 0

            # the ramp is INSIDE T, and the cosine is shifted by Tw.
            # both mistakes cost exactly Tw/T; see the derivation.
            def lr_at(self, step):
                if self.Tw > 0 and step < self.Tw:
                    return self.peak * (step + 1) / self.Tw
                if step >= self.T:
                    return 0.0
                prog = (step - self.Tw) / max(1, self.T - self.Tw)
                return self.peak * 0.5 * (1.0 + math.cos(math.pi * prog))

            @staticmethod
            def _norm(grads):
                return float(np.sqrt(sum(float((g * g).sum()) for g in grads)))

            def step(self, micro_grads, micro_sizes, loss_scale=1.0, unscale=True):
                sizes = np.asarray(micro_sizes, dtype=np.float64)
                total = float(sizes.sum())
                grads = [np.zeros_like(x) for x in self.p]
                for g, n in zip(micro_grads, sizes):
                    w = n / total
                    for i in range(len(grads)):
                        grads[i] += g[i] * w
                if loss_scale != 1.0:
                    if not unscale:
                        raise ValueError("clip before unscale caps at c/loss_scale")
                    for i in range(len(grads)):
                        grads[i] /= loss_scale
                gn = self._norm(grads)
                scale = 1.0 if self.clip is None else min(1.0, self.clip / (gn + 1e-300))
                for i in range(len(grads)):
                    grads[i] *= scale

                lr = self.lr_at(self.t)
                self.t += 1
                bc1 = 1.0 - self.b1 ** self.t
                bc2 = 1.0 - self.b2 ** self.t
                for i, p in enumerate(self.p):
                    self.m[i] = self.b1 * self.m[i] + (1 - self.b1) * grads[i]
                    self.v[i] = self.b2 * self.v[i] + (1 - self.b2) * grads[i] ** 2
                    mh = self.m[i] / bc1
                    vh = self.v[i] / bc2
                    p -= lr * mh / (np.sqrt(vh) + self.eps)
                    p -= lr * self.wd * p          # decoupled: NOT inside grads
                return {"lr": lr, "gn": gn, "scale": scale,
                        "realised": lr * scale, "drawn": lr}

        if __name__ == "__main__":
            rng = np.random.default_rng(0)
            opt = ClippedAdamW([rng.normal(size=(4, 3)), np.zeros(4)],
                               peak_lr=2e-3, total_steps=1000, warmup_steps=50)
            drawn = realised = 0.0
            for t in range(1000):
                g = [rng.normal(0, 1.0, (4, 3)), rng.normal(0, 1.0, 4)]
                if rng.random() < 0.05:
                    g = [x * 30.0 for x in g]      # one contaminated batch
                info = opt.step([g], [64])
                drawn += info["drawn"]
                realised += info["realised"]
            print(round(realised / drawn, 4))
            # ~0.4-0.6 depending on the seed: the clip ate half the schedule
    - language: python
      title: "The budget audit: three numbers before any optimisation change"
      note: >-
        Two ways to make this report wrong. Averaging the per-step scales
        instead of weighting them by the learning rate overstates the realised
        budget — measured 0.608 against 0.5116, a 19% error, and the error has
        the same sign every time because clipping is worst where the schedule is
        largest. Auditing the gradient norm *before* clipping reports a clip
        rate of zero and a budget ratio of 1.0 for a run that lost half its
        schedule; the trace must record the norm that was actually applied.
      code: |
        import numpy as np

        def budget_audit(lrs, applied_scales, grad_norms, updates, quintiles=5):
            """Everything the three curves cannot tell you, in one dict."""
            lr = np.asarray(lrs, dtype=float)
            s = np.asarray(applied_scales, dtype=float)
            gn = np.asarray(grad_norms, dtype=float)
            upd = np.asarray(updates, dtype=float)
            T = len(lr)

            drawn = float(lr.sum())
            realised = float((lr * s).sum())
            edges = np.linspace(0, T, quintiles + 1).astype(int)

            return {
                "drawn_budget": drawn,
                "realised_budget": realised,
                "budget_ratio": realised / drawn,
                "clip_rate": float((s < 1.0).mean()),
                # the wrong number, kept so you can see the gap
                "mean_scale_NOT_the_ratio": float(s.mean()),
                "clip_rate_by_quintile": [
                    float((s[edges[i]:edges[i + 1]] < 1.0).mean())
                    for i in range(quintiles)
                ],
                "gn_median_by_quintile": [
                    float(np.median(gn[edges[i]:edges[i + 1]]))
                    for i in range(quintiles)
                ],
                "worst_update_over_median": float(upd.max() / np.median(upd)),
                "move_in_last_10pct": float(upd[int(0.9 * T):].sum() / upd.sum()),
                # the effective peak, which is not where eta peaks
                "peak_step_drawn": int(np.argmax(lr)),
                "peak_step_realised": int(np.argmax(lr * s)),
            }

        def verdict(a):
            if a["budget_ratio"] < 0.7:
                return "clip is eating the schedule: raise c or lower the peak"
            if a["worst_update_over_median"] > 8:
                return "spikes survive: lower c, or lengthen warmup"
            if a["move_in_last_10pct"] > 0.05:
                return "no tail: the schedule is not annealing, expect a noise floor"
            return "consistent"

