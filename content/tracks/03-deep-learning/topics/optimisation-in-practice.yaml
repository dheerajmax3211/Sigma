id: optimisation-in-practice
slug: optimisation-in-practice
title: "Optimisation in Practice: Schedules, Warmup, and Clipping"
summary: >-
  Assemble the four knobs that decide whether a run converges — the schedule,
  the warmup, the clip, and the accumulation count — into one configuration,
  and audit it with the only number that describes what the model actually
  experienced: the realised budget, which on a measured run was half of what
  the schedule asked for.
kind: lesson
difficulty: hard
position: 10
estMinutes: 29
prerequisites: [learning-rate-schedules, gradient-stability]
phase: deep-learning-foundations
tags: [optimisation, learning-rate, warmup, cosine, gradient-clipping, gradient-accumulation, adamw, loss-scale, budget-audit]

body:
  big_idea: >-
    A training configuration is a product, not a checklist: schedule, clip and
    accumulation each silently rescale the others, and the number that
    describes what you built is the realised budget $\sum_t \eta_t s_t$.

  problem:
    - >-
      You add `clip_grad_norm_(1.0)` because a blog said to: the run stops
      spiking, stops improving, and 49% of the LR budget has vanished.
    - >-
      You port a 300k-step recipe to an 8k-step fine-tune: a quarter of the
      run is warmup and the result is worse than a constant LR.
    - >-
      You emulate a 4× batch with gradient accumulation and land 0.3 worse,
      because you clipped each micro-batch instead of the accumulated
      gradient.

  analogy: |
    A rally stage: pace notes, cold tyres, a rev limiter. The notes are the
    schedule, planned against a fixed time budget. The first kilometre is
    warmup — full throttle is unavailable until things reach operating
    temperature. The limiter is the clip: at 6000 rpm it does nothing, at 8000
    it decides everything. Accumulation is the co-driver averaging four laps
    before you change one thing.

  concept_points:
    - >-
      **The applied step is a product of four functions, and only one is the one you drew.**
      $\theta_{t+1} = \theta_t - \eta_t s_t \hat{u}_t - \eta_t\lambda\theta_t$
      with $s_t = \min(1, c/\|g_t\|)$. On the reference rig the schedule draws
      $\sum_t \eta_t = 3.002$ and the clip delivers
      $\sum_t \eta_t s_t = 1.536$:
      **49% of the learning rate was removed by a constant you set once and never revisited.**
    - >-
      **Clipping is a schedule you did not draw, and it is state-dependent.**
      At $c = 1.0$ the clip fires on **100% / 96.5% / 78.5% / 50.3% / 36.7%**
      of steps across the run's quintiles as median gradient norm falls
      **3.11 → 0.86**. So $s_t$ climbs from 0.10 to 1.00 by step 2100, and the
      realised curve peaks at **step 578** while $\eta_t$ peaks at 149.
    - >-
      **The clip rate and the budget ratio are different numbers.** On the
      same run the clip fires on **72.4%** of steps but removes only **48.8%**
      of the budget: the rate is an unweighted mean of $[s_t<1]$, the ratio
      weights $s_t$ by $\eta_t$. Because clipping bites hardest where $\eta_t$
      is largest, averaging $s_t$ instead of weighting it
      **overstates the realised budget by 19%**.
    - >-
      **Under Adam, a clip that fires on every step is almost a no-op.** Clip
      values 0.05, 0.1 and 0.25 give a final loss of **0.1351** at budget
      ratios 0.027, 0.054 and 0.134: a 5× range of realised budget changes the
      answer by 0.01%. Adam divides by $\sqrt{\hat{v}}$, so a uniform rescale
      cancels. Under SGD the same $c=0.05$ is a **73×** learning-rate cut and
      loss **2.42** against 0.19.
    - >-
      **Clipping is not a smaller learning rate, and the experiment is cheap.**
      At matched realised budget — 1.536 against 1.501 — the clipped run
      finishes at **0.1397** and the unclipped at **1.0018**, a factor of
      **7.2**. Clipping spends the budget on the 72% of steps with ordinary
      gradients and refuses to spend it on spikes; lowering the learning rate
      spends less on both.
    - >-
      **Warmup and cosine compose to a constant area, so any warmup bug costs exactly the warmup fraction.**
      With the ramp inside $T$, the area is $\eta_{\max}T/2$, independent of
      $T_w$: measured **10.002** at $T_w = 500$ against 10.0005 with none —
      0.01%. Append the ramp on top and you buy **+5.0%**; leave the cosine
      unshifted and you lose **−5.0%**. Both errors equal $T_w/T$.

  definitions:
    - term: "Realised budget"
      meaning: >-
        $\sum_t \eta_t s_t$, the total parameter movement the optimizer actually
        applied, where $s_t$ is the clip's scale. It is the quantity the model
        experienced; the drawn budget $\sum_t \eta_t$ is the quantity you
        configured. Their ratio is the single number that tells you how much of
        your schedule survived.
    - term: "Clip activation rate"
      meaning: >-
        The fraction of steps on which $s_t < 1$. Not the same as the budget
        ratio and never a substitute for it: on the reference run the rate is
        72.4% while the budget ratio is 0.512, because most clipped steps are
        clipped by a few percent.
    - term: "Global-norm clipping"
      meaning: >-
        Rescaling the whole gradient vector by $\min(1, c/\|g\|)$ so its norm is
        at most $c$. Direction-preserving by construction, which is why it can
        be reasoned about as a step-size cap. The default in every framework's
        `clip_grad_norm_`.
    - term: "Value clipping"
      meaning: >-
        Clamping each coordinate independently, $\operatorname{clip}(g_i, -c,
        c)$. Not direction-preserving: measured on the reference gradient,
        clipping at ±0.2 touched 13.8% of entries, took the norm from 13.91 to
        7.39, and left a cosine of **0.761** with the original direction. Use it
        only when you mean "no coordinate may exceed this", never as a stability
        tool.
    - term: "Effective step size"
      meaning: >-
        $\eta_t s_t$: the learning rate after the clip has had its say. Its peak
        is not the peak of $\eta_t$. On the measured default run the drawn peak
        is at step 149 and the realised peak is at step 578.
    - term: "Gradient accumulation"
      meaning: >-
        Computing several micro-batch gradients at the same weights and summing
        them, size-weighted, before one optimizer step. Exact for a mean-reduced
        loss; exact for a sum-reduced loss only if you weight by the number of
        terms (tokens, not examples).
    - term: "Micro-batch"
      meaning: >-
        The slice that fits in memory in one forward/backward. Its size is what
        normalisation layers and dropout see, so it is the unit at which the
        "same as a large batch" claim breaks.
    - term: "Accumulation weighting"
      meaning: >-
        The factor $n_j / \sum_i n_i$ applied to micro-batch $j$'s gradient.
        With equal chunks it is $1/k$ and everything is exact; with a short last
        chunk, dropping it biases the gradient by a scale factor — measured
        0.9% at two chunks, 1.8% at twelve, and 5% for a 200/40 token split.
    - term: "Loss scale"
      meaning: >-
        The constant $S$ by which the loss is multiplied before backward so that
        fp16 gradients stay representable. It must be divided out before
        clipping, or the clip threshold is silently divided by $S$: at
        $S = 65536$ a clip of 1.0 becomes a cap of $1.5\times10^{-5}$.
    - term: "Warmup fraction"
      meaning: >-
        $T_w/T$, the share of the run spent ramping. It is the exact size of
        both composition bugs (ramp on top of $T$: $+T_w/T$ budget; unshifted
        cosine: $-T_w/T$), and 5% is the value at which the worst-step bound
        stops improving on the measured rig.
    - term: "Schedule composition"
      meaning: >-
        The rule that $\eta(t)$ is one function assembled from a ramp and a
        decay, not two schedules multiplied. Composed correctly the area is
        $\eta_{\max}T/2$ for any warmup length; composed as a product of two
        normalised curves it is not, and the error is the warmup fraction.
    - term: "Decoupled weight decay"
      meaning: >-
        Applying $\theta \leftarrow \theta - \eta\lambda\theta$ outside the
        gradient, as AdamW does, rather than adding $\lambda\theta$ to $g$.
        Decoupled decay bypasses the clip, so when $s_t \approx 0.5$ its share
        of the parameter movement is 1.95× what $\lambda$ says.
    - term: "Budget audit"
      meaning: >-
        The three-number report you run before trusting any optimisation change:
        drawn against realised budget, clip rate by phase, and the worst update
        as a multiple of the median. It costs one instrumented run and it
        explains most "the recipe did not transfer" failures.

  diagrams:
    - type: pipeline
      title: "The order of operations in one step — and which knob enters where"
      nodes:
        - label: "Sample the global batch"
          note: "B examples, split into k micro-batches"
          detail: "The only place batch size is decided. Everything downstream sees a micro-batch, which is why normalisation layers and dropout disagree with a true large batch."
        - label: "Forward + backward per micro-batch"
          note: "k gradients, each mean-reduced over its own slice"
          detail: "Mean-reduced losses make the accumulation exact. Sum-reduced losses (token-level LM) do not — you must weight by token count, not by chunk index."
        - label: "Weight and sum"
          note: "w_j = n_j / Σ n_i"
          detail: "With equal chunks this is 1/k. With a short last chunk, dropping the weight is a scale bias: 0.9% at 2 chunks, 1.8% at 12, 5% for a 200/40 split."
        - label: "Unscale (fp16 only)"
          note: "divide by S before anything else"
          detail: "Skip this and the clip threshold is divided by S. At S=65536 the run's effective learning rate multiplier is 1.4e-6: frozen, not unstable."
        - label: "Clip once"
          note: "s = min(1, c/‖g‖)"
          detail: "Once, on the accumulated tensor. Clipping each micro-batch applies the cap k times: measured norm 0.4077 against 0.5000 for clipping once."
        - label: "Adam moments + bias correction"
          note: "m, v, then m̂/√v̂"
          detail: "This is what makes a cap that fires every step a no-op: a uniform rescale of g cancels in m̂/√v̂, so only relative reweighting across steps survives."
        - label: "Decoupled decay"
          note: "θ ← θ − ηλθ, outside the clip"
          detail: "The decay is not clipped, so its share of the movement rises as s falls. At a budget ratio of 0.512 it is 1.95x the intended fraction."
        - label: "Next step, next η from the schedule"
          note: "η_t is read, not accumulated"
          detail: "Computing the schedule as a running product (η *= decay each step) drifts from the closed form and makes the budget unreproducible across restarts."
    - type: plot
      title: "Drawn versus realised learning rate on the measured default run"
      chart: line
      xLabel: "optimizer step"
      yLabel: "learning rate (drawn vs realised)"
      series:
        - name: "drawn η_t (cosine, 5% warmup)"
          points:
            - { x: 0, y: 0.00001333 }
            - { x: 299, y: 0.00198654 }
            - { x: 599, y: 0.00188000 }
            - { x: 899, y: 0.00167809 }
            - { x: 1199, y: 0.00140270 }
