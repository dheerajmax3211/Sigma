            - { x: 2099, y: 0.00045397 }
            - { x: 2399, y: 0.00021154 }
            - { x: 2699, y: 0.00005454 }
            - { x: 2999, y: 0.00000061 }
        - name: "realised η_t · s_t (clip 1.0)"
          points:
            - { x: 0, y: 0.00000134 }
            - { x: 299, y: 0.00097848 }
            - { x: 599, y: 0.00159282 }
            - { x: 899, y: 0.00158885 }
