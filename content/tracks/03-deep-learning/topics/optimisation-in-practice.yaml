    - id: cp-1
      question: "Your run draws a budget of 3.00 and the audit reports a realised budget of 1.54. Give two different clip regimes that produce the same ratio, and the measurement that separates them."
      answerKind: short_text
      hint: "One regime clips almost every step a little; the other clips a few steps a lot. Which statistic distinguishes them?"
      solution: >-
        Either the clip fires on most steps with a mild scale — the measured
        case: 72.4% of steps, median scale 0.453 — or it fires on a quarter of
        steps with a severe one, e.g. 25% at scale 0.08. The budget ratio is
        identical and says nothing about which. The separating measurement is
        the clip rate by quintile together with the median gradient norm by
        quintile: the first regime shows a rate that decays with the norm
        (100/96.5/78.5/50.3/36.7) and a scale near 0.45, the second shows
        sporadic firing concentrated wherever the contaminated batches land.
        The consequence differs too: the mild-always regime is close to a
        per-step normaliser, the sparse-severe regime is a spike filter, and
        only the second one gets better when you raise the peak learning rate.
    - id: cp-2
      question: "Why is clip 1.0 a no-op when it fires on every step under Adam, but a 73x learning-rate cut under SGD?"
      answerKind: short_text
      hint: "What does Adam divide by, and what happens to a constant factor in that quotient?"
      solution: >-
        Adam's step is $\eta\,\hat m/(\sqrt{\hat v}+\epsilon)$. If a cap rescales
        the gradient by a constant $s$, then $m$ scales by $s$ and $v$ by $s^2$,
        so $\hat m/\sqrt{\hat v}$ is unchanged — the cap cancels exactly. A cap
        that fires every step is a *slowly varying* constant, so it barely
        perturbs the direction sequence and the loss barely moves: 0.1351 at
        $c = 0.05$ against 0.1397 at $c = 1.0$, across a 19x range of realised
        budget. SGD has no such quotient: the update is $\eta g$, so a cap at
        $c$ is literally a step-size ceiling, and at $\eta = 0.01$ with a median
        norm near 11 the realised/drawn ratio is 0.0137 — the run behaves like
        $\eta = 1.4\times10^{-4}$ and finishes at 2.42.
    - id: cp-3
      question: "You move a 5% warmup from inside `total_steps` to on top of it. What happens to the budget, by how much, and what does the loss curve look like afterwards?"
      answerKind: short_text
      hint: "Draw the two curves. One of them has an extra triangle at the start, at full peak height."
      solution: >-
        The budget grows by the area of the ramp that is now outside the decay,
        $\eta_{\max}T_w/2$, which is $T_w/T = 5\%$ of the total. Measured:
        10.502 against 10.002 on a 10,000-step run at peak 2e-3. The loss curve
        does not jump — a 5% budget change is inside seed noise on most runs —
        which is exactly why the bug survives. It becomes visible when the
        fraction is large: port a 2000-step warmup into an 8,000-step run and you
        have added 25% to the budget, spent entirely at the peak, on a run whose
        whole cosine was supposed to be the annealing.
    - id: cp-4
      question: "Your accumulation reproduces the full-batch gradient to cosine 1.0, yet the run is worse than the same batch size on four GPUs. Name three mechanisms that survive the exactness of the mean."
      answerKind: short_text
      hint: "The gradient is exact. What else does the step contain, and what does each micro-batch see that a real 256-sample batch would not?"
      solution: >-
        (1) Clipping: per-micro clipping applies the cap $k$ times, giving a
        norm of 0.4077 against 0.5000 for clipping the accumulated gradient, and
        a cosine of 0.9940 — the cap now binds per chunk, not globally. (2)
        Per-micro stochasticity and normalisation: dropout at 0.2 gives cosine
        0.8963 because every micro-batch draws its own mask; BatchNorm computes
        statistics over 64 samples instead of 256, which is a different function,
        not a noisier estimate of the same one. (3) Uneven chunk sizes: with
        mean-reduced losses the weights fix it (cosine 1.0), but with
        sum-reduced token losses an unweighted 200/40 split gives cosine 0.9718
        and a 5% norm error. Add decoupled weight decay applied once per
        optimizer step rather than once per large batch and you have a fourth.
    - id: cp-5
      question: "The clip rate is 72.4% and the budget ratio is 0.512. Which is the honest number to quote, and what does the gap between them tell you?"
      answerKind: short_text
      hint: "One is a count, the other is a weighted sum. What is the weight?"
      solution: >-
        The budget ratio, because it is the fraction of the learning rate the
        model actually received. The gap — 72.4% of steps touched, 48.8% of the
        budget removed — says the clip is firing early and mildly: many steps are
        clipped, but most by only a few percent, and the steps it hits hardest
        are the ones where $\eta_t$ is largest. The unweighted mean scale is
        0.608, so quoting an "average clip factor" overstates the realised
        budget by 19%. If you want one sentence for a colleague: "the clip cost
        half the schedule, mostly in the first third".

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Four knobs decide one number: how far the weights move on each step. The
        schedule says how far you would like to move, the clip says how far you
        are allowed to, the accumulation count decides what the gradient even is,
        and the decay moves the weights whether or not any gradient arrived.
        They multiply. So a change to any one of them is a change to the others'
        effective values, and a run that "stopped working when I added clipping"
        is usually a run whose learning rate quietly halved.
      blocks:
        - kind: checklist
          body: |
            - What is drawn: sum of the schedule over the run
            - What is delivered: that sum after the clip has scaled each step
            - What the clip touched: the fraction of steps, and by how much
            - What the model saw: where the realised step size actually peaks
            - What the gradient was: k micro-batches, size-weighted, before clipping
      checkpoint: >-
        Before reading on: if your clip fires on 70% of steps, is the run's
        effective learning rate closer to 70% of the peak or to 50% of the drawn
        budget? What would make it 50%?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Do not reason about the four knobs separately — instrument one run and
        compute the ratio. The tool is a budget audit: record $\eta_t$, the
        applied scale $s_t$, the pre-clip gradient norm, and the update norm, then
        report $\sum\eta_t s_t / \sum\eta_t$, the clip rate by quintile, and the
        worst update over the median. That single table separates the three
        failure modes — a clip that is eating the schedule, a schedule that is
        not annealing, and a warmup that is too short — which look identical on a
        loss curve. The alternative, staring at the loss and adjusting, is what
        produced the bug.
      blocks:
        - kind: checklist
          body: |
            - Log eta_t, s_t, the pre-clip grad norm, and the update norm, every step
            - Compute realised/drawn, not the mean of s_t
            - Split the run into quintiles and report the clip rate in each
            - Find argmax(eta_t) and argmax(eta_t * s_t); if they differ, the clip is a schedule
            - Only then change a knob, and change one
      checkpoint: >-
        Which of the four logged series would you look at first to decide whether
        the problem is the clip or the schedule, and what pattern would settle it?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Three functions: the schedule (one function, two pieces, ramp inside T),
        the step (accumulate with weights, unscale, clip once, Adam, decay), and
        the audit (sums, not means).
      blocks:
        - kind: pseudocode
          body: |
            # 1. schedule: ONE function, ramp inside T
            def lr_at(step):
                if step < Tw: return peak * (step + 1) / Tw
                if step >= T: return 0
                p = (step - Tw) / (T - Tw)
                return peak * 0.5 * (1 + cos(pi * p))
            # area over the run is peak * T / 2, for any Tw

            # 2. one step
            g = sum_j (n_j / N) * micro_grad_j     # size-weighted, not 1/k
            if loss_scale != 1: g /= loss_scale    # BEFORE the clip
            s = min(1, c / norm(g))                # once, on the sum
            g *= s
            m, v = adam_moments(g)
            theta -= lr * m_hat / (sqrt(v_hat) + eps)
            theta -= lr * wd * theta               # outside the clip

            # 3. the audit
            ratio = sum(lr * s) / sum(lr)           # not mean(s)
            per_quintile: clip rate, grad norm median
            worst_update / median_update
            argmax(lr) vs argmax(lr * s)
      checkpoint: >-
        In step 2, why must the unscale happen before the clip rather than after,
        and what exactly goes wrong at a loss scale of 65536 if you forget?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Two identities do most of the work: the area of the composed schedule,
        and the fact that the budget ratio is a weighted mean while the clip rate
        is a count.
      blocks:
        - kind: math
          body: |
            Composed schedule, ramp inside $T$:

            $$\sum_{t=0}^{T-1}\eta(t)
              = \underbrace{\eta_{\max}\frac{T_w}{2}}_{\text{ramp triangle}}
              + \underbrace{\eta_{\max}\frac{T-T_w}{2}}_{\text{cosine}}
              = \frac{\eta_{\max}T}{2}$$

            using $\int_0^1 \tfrac12(1+\cos\pi x)\,dx = \tfrac12$. So the warmup
            length cancels, and appending the ramp outside $T$ adds
            $+T_w/T$ while an unshifted cosine subtracts $T_w/T$.

            Realised budget versus clip rate:

            $$\frac{B_{\text{real}}}{B_{\text{drawn}}}
              = \sum_t \frac{\eta_t}{\sum_u \eta_u}\, s_t,
              \qquad r = \frac{1}{T}\sum_t \mathbf{1}[s_t<1]$$

            The first is a mean weighted by the schedule, the second is a plain
            count. Since $s_t$ and $\eta_t$ are similarly ordered (clipping is
            worst early), Chebyshev gives weighted $\le$ unweighted: measured
            0.512 against 0.608, a 19% overstatement.

            Accumulation, mean-reduced loss:

            $$\sum_j \frac{n_j}{N}\cdot\frac{1}{n_j}\sum_{i\in C_j}\nabla\ell_i
              = \frac{1}{N}\sum_{i=1}^{N}\nabla\ell_i$$

            exact for any chunking with the right weights, and biased by
            $\sum_j (1/k - n_j/N)\hat g_j$ without them.

            Clipping is a nonlinear map and does not commute with the average:

            $$\left\|\sum_j w_j\,\operatorname{clip}_c(\hat g_j)\right\| \le c
              \quad\text{but}\quad
              \left\|\operatorname{clip}_c\!\left(\sum_j w_j \hat g_j\right)\right\| \le c$$

            with the first bound binding $k$ times, which is why per-micro
            clipping measured 0.4077 against 0.5000.
      checkpoint: >-
        In the Chebyshev step, what would have to be true of the correlation
        between $s_t$ and $\eta_t$ for the weighted mean to *exceed* the
        unweighted one, and when does that happen in a real run?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The complete step and audit, plus the reference numbers so you can check
        your own run against them.
      blocks:
        - kind: warning
          body: >-
            Read the expected numbers before the code. On the reference rig the
            default draws 3.002 and delivers 1.536; the clip fires on 72.4% of
            steps with a median scale of 0.453; the realised peak sits at step
            578 against a drawn peak at 149. If your implementation reports a
            budget ratio near 1.0 while the clip rate is above 50%, you are
            auditing the pre-clip norm.
        - kind: code
          language: python
          body: |
            import math
            import numpy as np

            def lr_at(step, T, Tw, peak, min_lr=0.0):
                if Tw > 0 and step < Tw:
                    return peak * (step + 1) / Tw
                if step >= T:
                    return min_lr
                p = (step - Tw) / max(1, T - Tw)
                return min_lr + (peak - min_lr) * 0.5 * (1 + math.cos(math.pi * p))

            def audit(lrs, scales, gnorms, updates):
                lr = np.asarray(lrs); s = np.asarray(scales)
                gn = np.asarray(gnorms); up = np.asarray(updates)
                T = len(lr)
                e = np.linspace(0, T, 6).astype(int)
                return {
                    "drawn": float(lr.sum()),
                    "realised": float((lr * s).sum()),
                    "ratio": float((lr * s).sum() / lr.sum()),
                    "clip_rate": float((s < 1).mean()),
                    "mean_scale": float(s.mean()),      # the wrong number
                    "rate_by_quintile": [float((s[e[i]:e[i+1]] < 1).mean()) for i in range(5)],
                    "gn_median_by_quintile": [float(np.median(gn[e[i]:e[i+1]])) for i in range(5)],
                    "worst_over_median": float(up.max() / np.median(up)),
                    "last10pct_move": float(up[int(0.9*T):].sum() / up.sum()),
                    "peak_drawn": int(np.argmax(lr)),
                    "peak_realised": int(np.argmax(lr * s)),
                }

            # reference run, T=3000, Tw=150, peak=2e-3, clip=1.0, AdamW, batch 64
            # drawn            3.002
            # realised         1.536      ratio 0.5116
            # clip rate        0.724      mean scale 0.608
            # median scale when clipped   0.453
            # worst/median update         3.35
            # last 10% of steps           0.15% of total movement
            # peak drawn 149 -> peak realised 578
      checkpoint: >-
        Your audition of the same recipe on a different dataset reports
        ratio 0.94, clip rate 0.08, worst/median 22. Which knob do you change
        first, and what does the combination tell you that either number alone
        does not?

  problems:
    - id: p-warmup-cosine
      title: "Compose warmup and cosine into one schedule"
      difficulty: medium
      prompt: >-
        Implement `warmup_cosine_lr(step, total_steps, warmup_steps, peak_lr,
        min_lr=0.0)` returning the learning rate as a float. The ramp is
        **inside** `total_steps`: for `step < warmup_steps` the rate is
        `peak_lr * (step + 1) / warmup_steps`, so the first step is never exactly
        zero. For `step >= total_steps` return `min_lr`. Otherwise, with
        `progress = (step - warmup_steps) / max(1, total_steps - warmup_steps)`,
        return `min_lr + (peak_lr - min_lr) * 0.5 * (1 + cos(pi * progress))`.
        When `warmup_steps` is 0 the cosine spans the whole run, so
        `progress = step / total_steps`.
      starter: |
        import math

        def warmup_cosine_lr(step, total_steps, warmup_steps, peak_lr, min_lr=0.0):
            # your implementation here
            pass
      language: python
      entry: warmup_cosine_lr
      testCases:
        - input: '[0, 1000, 100, 0.001, 0.0]'
          expected: "1e-05"
          mode: json
          tolerance: 1e-12
        - input: '[99, 1000, 100, 0.001, 0.0]'
          expected: "0.001"
          mode: json
          tolerance: 1e-12
        - input: '[100, 1000, 100, 0.001, 0.0]'
          expected: "0.001"
          mode: json
          tolerance: 1e-12
        - input: '[550, 1000, 100, 0.001, 0.0]'
          expected: "0.0005"
          mode: json
          tolerance: 1e-12
        - input: '[999, 1000, 100, 0.001, 0.0]'
          expected: "3.046171104803541e-09"
          mode: json
          tolerance: 1e-12
        - input: '[1000, 1000, 100, 0.001, 0.0]'
          expected: "0.0"
          mode: json
          tolerance: 1e-12
        - input: '[600, 1000, 0, 0.002, 0.0001]'
          expected: "0.0007564338553438001"
          mode: json
          tolerance: 1e-12
        - input: '[3000, 3000, 0, 0.001, 0.0]'
          expected: "0.0"
          mode: json
          tolerance: 1e-12
        - input: '[0, 100, 10, 1.0, 0.01]'
          expected: "0.1"
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def warmup_cosine_lr(step, total_steps, warmup_steps, peak_lr, min_lr=0.0):
            if warmup_steps > 0 and step < warmup_steps:
                return peak_lr * (step + 1) / warmup_steps
            if step >= total_steps:
                return min_lr
            span = max(1, total_steps - warmup_steps)
            progress = (step - warmup_steps) / span
            return min_lr + (peak_lr - min_lr) * 0.5 * (1.0 + math.cos(math.pi * progress))
      solutionExplanation: >-
        The whole exercise is the join. Three details decide whether the schedule
        you wrote is the schedule you meant. The `+ 1` in the ramp means step 0
        gets `peak/warmup_steps` rather than zero, which matters because a
        literal zero step is a wasted step and because some optimizers divide by
        the rate. The cosine spans `total_steps - warmup_steps`, not
        `total_steps`: with an unshifted argument the curve starts at progress
        `warmup_steps/total_steps` and the run loses about `warmup_steps/total_steps`
        of its budget — 5% at a 5% warmup, measured 9.504 against 10.002 on a
        10,000-step run. And the `step >= total_steps` branch must return
        `min_lr`, not the cosine evaluated past the end, or a resumed run at the
        boundary starts climbing back up. The composed area is
        `peak_lr * total_steps / 2` for any warmup length, which is the check to
        run on any schedule you inherit.
      complexity: "O(1) time, O(1) space"
      tags: [schedule, warmup, cosine, composition]

    - id: p-realised-budget
      title: "The realised budget, and the number the clip rate hides"
      difficulty: medium
      prompt: >-
        Implement `realised_budget(lrs, grad_norms, clip_value)`. Each step `t`
        applies a scale `s_t = min(1, clip_value / grad_norms[t])`; if a gradient
        norm is exactly zero the step is not clipped, so take `s_t = 1` rather
        than dividing by zero. Return
        `sum(lrs[t] * s_t) / sum(lrs)`, the fraction of the drawn learning-rate
        budget the model actually received, as a float. The inputs are equal
        length lists of numbers.
      starter: |
        def realised_budget(lrs, grad_norms, clip_value):
            # your implementation here
            pass
      language: python
      entry: realised_budget
      testCases:
        - input: '[[1.0, 1.0, 1.0, 1.0], [2.0, 2.0, 2.0, 2.0], 1.0]'
          expected: "0.5"
          mode: json
          tolerance: 1e-12
        - input: '[[1.0, 0.5], [0.5, 4.0], 1.0]'
          expected: "0.75"
          mode: json
          tolerance: 1e-12
        - input: '[[0.001, 0.001, 0.001], [0.2, 0.3, 0.4], 1.0]'
          expected: "1.0"
          mode: json
          tolerance: 1e-12
        - input: '[[0.002, 0.001, 0.0005, 0.0001], [8.0, 2.0, 0.5, 0.25], 1.0]'
          expected: "0.37500000000000006"
          mode: json
          tolerance: 1e-12
        - input: '[[1.0, 1.0, 1.0], [0.0, 2.0, 4.0], 1.0]'
          expected: "0.5833333333333334"
          mode: json
          tolerance: 1e-12
        - input: '[[0.5, 0.5, 0.5, 0.5], [10.0, 1.0, 10.0, 1.0], 1.0]'
          expected: "0.55"
          mode: json
          tolerance: 1e-12
      solution: |
        def realised_budget(lrs, grad_norms, clip_value):
            drawn = 0.0
            realised = 0.0
            for lr, gn in zip(lrs, grad_norms):
                drawn += lr
                if gn <= 0.0:
                    realised += lr
                else:
                    realised += lr * min(1.0, clip_value / gn)
            return realised / drawn
      solutionExplanation: >-
        Two things are being taught here. The arithmetic is a weighted mean of
        the per-step scales, weighted by the learning rate — not the average of
        the scales, which is what the "clip rate" measures and which overstates
        the realised budget whenever clipping correlates with the high-rate part
        of the schedule. On the reference run the mean scale is 0.608
        and the budget ratio is 0.512, a 19% gap; test case 4 is the same effect
        in miniature, where the clip bites hardest on the two largest rates and
        the answer is 0.375 rather than the 0.55 that averaging the four scales
        (1, 0.5, 1, 1) would give. The zero-norm branch is not pedantry: a
        perfectly zero gradient happens on the first step of a
        zero-initialised layer, and `1/0` in the min would raise rather than
        return.
      complexity: "O(n) time, O(1) space"
      tags: [clipping, budget, weighted-mean, audit]

    - id: p-accumulate
      title: "Accumulate with weights, and clip in the place you meant"
      difficulty: hard
      prompt: >-
        Implement
        `accumulate(micro_grads, micro_sizes, clip_value=None, clip_scope="after")`.
        `micro_grads` is a list of gradient vectors (each already mean-reduced
        over its own micro-batch), `micro_sizes` the number of samples in each.
        Weight each vector by `micro_sizes[j] / sum(micro_sizes)` and sum them.
        If `clip_value` is given and `clip_scope == "after"`, scale the summed
        vector by `min(1, clip_value / ||g||)` where the norm is the Euclidean
        norm over the whole vector. If `clip_scope == "per_micro"`, clip each
        micro-gradient to that norm **before** weighting and summing, and do not
        clip again. Return the resulting vector as a list of floats.
      starter: |
        import math

        def accumulate(micro_grads, micro_sizes, clip_value=None, clip_scope="after"):
            # your implementation here
            pass
      language: python
      entry: accumulate
      testCases:
        - input: '[[[1.0, 1.0], [3.0, 3.0]], [1, 1], null, "after"]'
          expected: "[2.0, 2.0]"
          mode: json
          tolerance: 1e-9
        - input: '[[[1.0, 1.0], [3.0, 3.0]], [1, 3], null, "after"]'
          expected: "[2.5, 2.5]"
          mode: json
          tolerance: 1e-9
        - input: '[[[3.0, 0.0], [0.0, 3.0]], [1, 1], 1.0, "after"]'
          expected: "[0.7071067811865476, 0.7071067811865476]"
          mode: json
          tolerance: 1e-9
        - input: '[[[3.0, 0.0], [0.0, 3.0]], [1, 1], 1.0, "per_micro"]'
          expected: "[0.5, 0.5]"
          mode: json
          tolerance: 1e-9
        - input: '[[[2.0, 2.0], [0.0, 0.0]], [3, 1], 5.0, "after"]'
          expected: "[1.5, 1.5]"
          mode: json
          tolerance: 1e-9
        - input: '[[[0.6, 0.8], [0.6, 0.8]], [1, 1], 1.0, "after"]'
          expected: "[0.6, 0.8]"
          mode: json
          tolerance: 1e-9
        - input: '[[[4.0, 0.0], [4.0, 0.0]], [1, 1], 1.0, "per_micro"]'
          expected: "[1.0, 0.0]"
          mode: json
          tolerance: 1e-9
      solution: |
        import math

        def accumulate(micro_grads, micro_sizes, clip_value=None, clip_scope="after"):
            total = float(sum(micro_sizes))
            vecs = [[float(x) for x in g] for g in micro_grads]

            if clip_scope == "per_micro" and clip_value is not None:
                clipped = []
                for g in vecs:
                    norm = math.sqrt(sum(x * x for x in g))
                    f = 1.0 if norm <= clip_value or norm == 0.0 else clip_value / norm
                    clipped.append([x * f for x in g])
                vecs = clipped

            acc = [0.0] * len(vecs[0])
            for g, n in zip(vecs, micro_sizes):
                w = n / total
                for i, x in enumerate(g):
                    acc[i] += x * w

            if clip_scope == "after" and clip_value is not None:
                norm = math.sqrt(sum(x * x for x in acc))
                if norm > clip_value and norm > 0.0:
                    acc = [x * (clip_value / norm) for x in acc]
            return acc
      solutionExplanation: >-
        The weighting is what makes accumulation an unbiased estimator: with
        `n_j / N` the sum telescopes to the mean over all samples, and with `1/k`
        it only agrees when every chunk is the same size. Test case 2 separates
        them (2.5 against 2.0 for an equal-weight mean). The two clip scopes then
        give deliberately different answers on the same input: cases 3 and 4 feed
        two vectors that are individually at norm 3 and orthogonal. Clipping
        after averaging caps the mean at 1.0 (each component 0.7071); clipping
        each vector first turns both into unit vectors and averages them to
        `[0.5, 0.5]`, a norm of 0.707 — the cap applied twice, and a different
        direction. That is the measured 0.4077 against 0.5000 in the lesson, and
        it is why the pipeline diagram puts a single clip node after the sum: if
        you clip per micro-batch you are not emulating a large batch, you are
        emulating a large batch with a smaller trust region.
      complexity: "O(k · d) time, O(d) space"
      tags: [gradient-accumulation, clipping, micro-batch, bias]

  visualizers:
    - id: vs-budget-audit
      kind: loss_surface
      title: "Watch the realised budget fall as the clip tightens"
      description: >-
        Drive the reference run's schedule and gradient-norm trace through
        different clip values and watch $\sum \eta_t s_t / \sum \eta_t$ fall
        while the clip rate saturates. At $c = 0.05$ the rate is 100% and the
        ratio is 0.027; at $c = 4.0$ the rate is 22% and the ratio is 0.889. The
        held-out loss is flat from 0.05 to 0.5 and doubles by 2.0 — the budget is
        not the objective.
      params:
        total_steps: 3000
        warmup_steps: 150
        peak_lr: 0.002
        clip_values: [0.05, 0.1, 0.25, 0.5, 1.0, 2.0, 4.0]

  try_it: >-
    Log $\|g_t\|$ at every step of a 3,000-step run with clip 1.0, then compute two numbers: the
    fraction of steps where the clip fired, and $\sum_t \eta_t s_t / \sum_t \eta_t$. You should
    reproduce roughly 72% and 49% — if the two numbers agree, you have collapsed them into one.
  interview_questions:
    - question: 'What is the difference between the clip rate and the budget ratio, and why does reporting the first one mislead?'
      level: mid
      key_points:
        - 'The clip rate is an unweighted mean of the indicator [s_t < 1]; the budget ratio weights each step by its learning rate, sum(eta_t s_t) / sum(eta_t).'
        - 'On the measured run the clip fired on 72.4% of steps but removed only 48.8% of the budget.'
        - 'It fires most in the early quintiles, where gradients are largest and the learning rate is also smallest, so the steps it shortens are the cheap ones.'
        - 'Reporting the rate as if it were the budget overstates the intervention by about 1.5x on this run.'
    - question: 'You have a spiky run and a clean run. When is clipping actually buying something, and how do you prove it?'
      level: senior
      key_points:
        - 'The experiment is matched realised budget: cosine 2e-3 with clip 1.0 (budget 1.536) against cosine 1e-3 without clip (budget 1.501).'
        - 'At matched budget the clipped run finishes at 0.1397 and the unclipped one at 1.0018, a factor of 7.2 — clipping is not a smaller learning rate.'
        - 'Under Adam a clip that fires on every step is nearly a no-op, because the update is divided by sqrt(v_hat): clip values 0.05, 0.1 and 0.25 all give 0.1351 with budgets 0.027, 0.054 and 0.134.'
        - 'On a clean rig the same recipe buys 27% (0.1037 against 0.1412), so the benefit scales with how heavy the tails are.'
      follow_up: 'If a clip that fires on every step is a no-op under Adam, what is it doing to a run that uses SGD with momentum?'
    - question: 'Gradient accumulation reproduces the gradient exactly but not the update. Where does it break?'
      level: mid
      key_points:
        - 'Four micro-batches of 64 over 256 samples reproduce the full-batch gradient to cosine 1.0000000 and norm ratio 1.0000, so the mean is exact.'
        - 'Clip each micro-batch separately and the accumulated norm is 0.4077 against the correct value, because you summed clipped gradients instead of clipping the sum.'
        - 'BatchNorm and other batch statistics are computed per micro-batch, so the forward pass itself differs from the full-batch one.'
        - 'The rule is to accumulate unclipped gradients and apply the clip once, after the loop, at the same place the unaccumulated run would.'
      follow_up: 'Warmup and cosine compose to a constant area of eta_max T / 2. Why does that make any warmup bug cost exactly the warmup fraction of the budget?'
  common_mistakes:
    - 'Clipping each micro-batch inside an accumulation loop, so the accumulated gradient is a sum of clipped gradients rather than the clip of the sum (0.4077 against the correct norm).'
    - 'Reading the clip rate as the amount of learning rate removed: 72.4% of steps against 48.8% of the budget on the same run.'
    - 'Clipping the loss-scaled gradient at 1.0 under fp16 scaling by 65536, which caps the real update at 1/65536, about 1.5e-5, against a typical norm of 10.96.'
