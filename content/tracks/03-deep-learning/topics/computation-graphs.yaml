id: computation-graphs
slug: computation-graphs
title: "Computation Graphs, Fusion, and Graph Execution"
summary: >-
  Treat the graph as a program rather than a derivative recipe: schedule its
  nodes, fuse the passes that only touch memory, plan which activations stay
  alive, and decide honestly when capturing the graph is worth losing dynamic
  control flow.
kind: lesson
difficulty: hard
position: 2
estMinutes: 24
prerequisites: [autograd-engine]
phase: deep-learning-foundations
tags: [computation-graph, graph-execution, operator-fusion, memory-planning, eager-vs-graph, kernels]

body:
  big_idea: >-
    The graph is a program, not just a derivative recipe: what a model can
    fuse, what it must keep alive, and whether it can replay a schedule are
    properties of the graph's shape.

  problem:
    - >-
      You profile a training step and 30% of the wall time is LayerNorm, GELU,
      dropout and residual adds — ops that do almost no arithmetic.
    - >-
      `torch.compile` is fast until the last, short batch of every epoch: the
      compiled graph was specialised to a shape it no longer sees.
    - >-
      You OOM on a 40 GB card, and "activations" is a diagnosis, not a fix:
      the schedule decides which tensors stay alive.

  analogy: |
    A restaurant kitchen. The recipe's dependencies are the graph. An eager
    cook reads one line at a time, walking to the pantry for each ingredient
    and using a fresh pan: correct, but the walking costs more than the
    cooking. A graph-mode kitchen writes a prep sheet — chop all the onions at
    once, one pan for three steps — and clears counter space by predicting
    when each component finishes.

  concept_points:
    - >-
      **One graph, many schedules, and the executor picks one.** A DAG with
      $V$ nodes has exponentially many valid topological orders, and finding
      one is linear: measured, an iterative post-order DFS takes 0.16-0.19 us
      per node, while Kahn's algorithm takes 41.1 ms on a 100,000-node chain —
      2.2x slower for its in-degree counters. The order your Python wrote is
      not the order that runs.
    - >-
      **Eager mode rebuilds and re-sorts the graph every step; graph mode captures it once.**
      A numpy-level op on a one-element array costs 0.458 us of dispatch, so a
      480-op step pays 0.22 ms before any arithmetic. Measured on a
      768→3072→768 MLP: batch 1 runs at 366.7 us/token (25.7 GFLOP/s), batch
      256 at 14.7 us/token (641 GFLOP/s). The 25x gap is launch overhead.
    - >-
      **Elementwise chains are memory-bound, and their arithmetic intensity does not improve with length.**
      For $k$ elementwise ops on $N$ fp32 elements, the unfused form moves
      $8kN$ bytes for $kN$ flops: **0.125 flop/byte regardless of $k$**.
      Measured on 32 MiB, 1 op is 2.09 ms and 32 ops are 79.35 ms — linear, at
      a flat 27 GB/s. Even fused, the chain reaches 4 flop/byte.
    - >-
      **Fusion is worth the number of collapsed passes, and pass counting gives a floor.**
      Softmax-cross-entropy on 1024x50,257 fp32 unfused took 256.9 ms; a
      log-sum-exp form making five passes instead of six took 130.2 ms —
      **1.97x** on a 1.2x traffic cut, because the removed pass was a `log`
      over 51 million elements. Transcendentals cost far more than loads.
    - >-
      **Peak memory is a property of the schedule, not of the graph.** The
      same seven-node graph in two valid orders peaks at 1500 versus 1900
      bytes — 27% more — purely from evaluating the shallow-but-large branch
      first. The rule is Sethi-Ullman: evaluate the larger-peak subtree first.
      A 24-layer stack keeping 12 tensors of 128 MiB per layer is 36 GiB
      against 2.6 GB of weights.
    - >-
      **Training memory is retention, and checkpointing converts it to compute at $\sqrt{n}$.**
      Storing all $n=32$ layer boundaries costs 32 tensors; storing every $k$
      -th and recomputing the rest costs $n/k + k$, minimised at
      $k=\sqrt{n}=5.66$, so $32/6 + 6 = 11.3$ tensors — a **2.8x** reduction
      for about **33%** more compute.

  definitions:
    - term: "Graph executor"
      meaning: >-
        The component that reads a computation graph and turns it into work:
        chooses a topological order, decides which ops to fuse, assigns memory, and
        launches kernels. In eager frameworks it runs per step; in graph-mode
        frameworks it runs once at capture and replays.
    - term: "Operator fusion"
      meaning: >-
        Compiling two or more adjacent ops into a single kernel so intermediate
        values stay in registers instead of going through memory. Buys bandwidth,
        not flops.
    - term: "Kernel"
      meaning: >-
        One function launched on the device, with its own launch overhead and its
        own pass over memory. An unfused elementwise chain of 32 ops is 32 kernels
        and 64 array-sized transfers; a fused one is 1 and 2.
    - term: "Memory-bound"
      meaning: >-
        A kernel whose runtime is set by bytes moved rather than arithmetic
        performed. Nearly every elementwise, normalisation, and reduction kernel in
        deep learning is memory-bound; matmuls usually are not.
    - term: "Arithmetic intensity"
      meaning: >-
        Flops performed per byte moved, $I = F/B$. An unfused elementwise chain sits
        at 0.125 flop/byte in fp32 no matter how long it is; a fused chain of $k$ ops
        sits at $k/8$, which is still below the ridge point until $k$ reaches a few
        hundred.
    - term: "Roofline model"
      meaning: >-
        $t = \max(F/P,\; B/\beta)$ for peak compute $P$ and bandwidth $\beta$. The
        two terms cross at the ridge intensity $P/\beta$; below it you are
        bandwidth-bound and only traffic reduction helps.
    - term: "Activation memory"
      meaning: >-
        The forward values retained because a backward closure will read them. It
        scales with batch, sequence length, width, and depth, and it is usually ten
        times the parameter memory of a model.
    - term: "Memory planner"
      meaning: >-
        The allocator pass that assigns each tensor a buffer and decides when that
        buffer is reusable. Its objective is peak live bytes, which depends on the
        execution order as much as on tensor sizes.
    - term: "Graph capture and replay"
      meaning: >-
        Recording a sequence of kernels once, with their arguments and addresses,
        then re-issuing the whole sequence with one call. Removes per-op launch and
        dispatch cost; requires every input to live at the same address on every
        replay.
    - term: "Graph break"
      meaning: >-
        Any construct the tracer cannot record — data-dependent control flow,
        `.item()`, printing, unsupported Python — which ends the captured region.
        The model still runs, but the surrounding regions revert to eager and the
        boundary is materialised.
    - term: "Static shape guard"
      meaning: >-
        The condition under which a captured graph is valid: same shapes, dtypes,
        and devices. A new batch or sequence length either triggers a recompile or
        falls back, which is why dynamic shapes cost either padding or a cache of
        compiled variants.
    - term: "Rematerialisation (activation checkpointing)"
      meaning: >-
        Discarding forward values and recomputing them during the backward pass.
        Trades one extra forward pass for $O(\sqrt{n})$ instead of $O(n)$ retained
        tensors over $n$ layers.
    - term: "Eager (define-by-run) mode"
      meaning: >-
        The graph is a side effect of executing Python, rebuilt every step. Fully
        dynamic, trivially debuggable, and pays dispatch plus launch cost per
        operation.
    - term: "Graph (define-and-run) mode"
      meaning: >-
        The graph is built or captured ahead of execution and then optimised and
        replayed. Enables fusion, memory planning, and whole-graph scheduling at the
        cost of static shapes and a harder debugging story.

  diagrams:
    - type: mermaid
      title: "Four elementwise ops, one kernel: the boundary is where fan-out or a reduction appears"
      code: |
        flowchart LR
