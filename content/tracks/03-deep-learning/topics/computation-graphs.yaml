          m1 --> a1["add 0.000001"]
          a1 --> t["tanh"]
          t --> m2["mul 0.5"]
          m2 --> y["y"]

          subgraph K1["kernel 1 — read once, write once, values stay in registers"]
            m1
            a1
            t
            m2
          end

    - type: compare
      title: "Eager vs graph mode: same arithmetic, different contract"
      left_label: "Eager (define-by-run)"
      left_points:
        - "Rebuilds the graph and re-derives the schedule every step"
        - "0.458 us of dispatch per op; 0.22 ms per 480-op step before any maths"
        - "No cross-op fusion: 32 elementwise ops are 32 passes over the tensor"
        - "Fully dynamic: shapes, control flow, and prints all work"
        - "Errors point at your line of Python"
      right_label: "Graph (capture and replay)"
      right_points:
        - "Captures once, then replays a fixed sequence of kernels"
        - "Launch cost amortised: one submission instead of hundreds"
        - "Fusion and memory planning run over the whole graph"
        - "Static shapes and stable addresses; a new batch size recompiles"
        - "One unsupported call breaks the region back to eager"

    - type: architecture
      title: "Where the executor sits between your model and the kernels"
      nodes:
        - { id: model, x: 0, y: 1, label: "Model code", kind: client, detail: "Ordinary Python or a traced function. In eager mode this is the graph; in graph mode it is the input to a tracer." }
        - { id: capture, x: 1, y: 0, label: "Capture / trace", kind: server, detail: "Records ops, shapes, dtypes, and argument addresses into an IR. Anything it cannot record becomes a graph break, not an error." }
        - { id: ir, x: 1, y: 2, label: "Graph IR", kind: "storage", detail: "Nodes plus shape and layout metadata. This is what the optimisation passes read — not your source code." }
        - { id: passes, x: 2, y: 0, label: "Passes: DCE, CSE, fusion", kind: worker, detail: "Dead-code elimination, common-subexpression elimination, and fusion. Fusion is restricted to single-consumer elementwise edges because a fan-out would be recomputed." }
        - { id: plan, x: 2, y: 2, label: "Memory planner", kind: database, detail: "Computes tensor lifetimes from the chosen order and assigns reusable buffers. Peak live bytes is its objective, and it is the number that decides whether you OOM." }
        - { id: launch, x: 3, y: 1, label: "Scheduler / launcher", kind: gpu, detail: "Emits kernels in topological order, one launch per fused group. In replay mode it re-issues the recorded sequence with a single call." }
      edges:
        - { from: model, to: capture, label: "trace" }
        - { from: capture, to: ir, label: "lower" }
        - { from: ir, to: passes, label: "rewrite" }
        - { from: passes, to: plan, label: "fused ops" }
        - { from: plan, to: launch, label: "buffers + order" }
      caption: >-
        Every arrow is a place a framework can refuse to compile. The passes are
        also the only stage that can see across operations, which is why they
        capture the entire win — and the entire risk.

    - type: plot
      title: "Measured: an unfused elementwise chain is linear in the number of passes"
      chart: "line"
      xLabel: "elementwise ops in the chain (k)"
      yLabel: "wall time (ms) on a 32 MiB float64 array"
      series:
        - name: "unfused numpy, measured"
          points:
            - { x: 1, y: 2.093 }
            - { x: 4, y: 10.794 }
            - { x: 16, y: 40.037 }
            - { x: 32, y: 79.354 }
        - name: "one fused pass, ideal"
          points:
            - { x: 1, y: 2.093 }
            - { x: 4, y: 2.093 }
            - { x: 16, y: 2.093 }
            - { x: 32, y: 2.093 }

    - type: graph
      title: "Fan-out is a fusion barrier: the residual value has two consumers"
      nodes:
        - { id: x, label: "x" }
        - { id: n1, label: "norm(x)" }
