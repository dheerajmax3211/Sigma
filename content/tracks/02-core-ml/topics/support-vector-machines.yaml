id: support-vector-machines
slug: support-vector-machines
title: "The Widest Street Between Two Classes, and the Kernel That Curves It"
summary: >-
  Turn "draw the widest street between two classes" into a convex program,
  derive its dual with Lagrange multipliers, read the answer off the KKT
  conditions, and know exactly what a kernel buys and what it costs — including
  the part where it inherits the geometry that broke k-NN.
kind: lesson
difficulty: hard
position: 8
estMinutes: 26
prerequisites: [convexity, matrix-calculus, knn-curse-dimensionality]
phase: supervised-learning
tags: [svm, kernels, duality, kkt, convex-optimization, margin, rbf, support-vectors]

body:
  big_idea: >-
    An SVM is the widest street between two classes — a convex program whose KKT
    conditions name the answer and whose dual touches data only through inner products,
    which is the kernel trick's door.

  problem:
    - "You have 300 rows and 40,000 features: logistic regression needs a penalty to be well-posed, a linear SVM needs none because the margin regularises it."
    - "You inherit an RBF SVM at 0.94 AUC and cannot say how many support vectors it keeps, what $\\gamma$ controls, or why prediction takes 40 ms."
    - "Every tutorial says \"use a kernel\" without the cost: 100,000 rows needs 80 GB for the Gram matrix, and a high $\\gamma$ makes it 1-NN."

  analogy: |
    Two neighbours want a fence as far from both houses as possible. Find the
    closest pair on opposite sides and put the fence halfway between them,
    perpendicular to the line joining them. Other houses are irrelevant: knock
    one down a mile away and the fence does not move. The fence is pinned by the
    two or three houses that crowd it — the support vectors — and the margin is
    a house's distance to it.

  concept_points:
    - "**The margin is $2/\\|w\\|$, and it is the only thing being maximised.** Distance to the hyperplane is $(w^\\top x+b)/\\|w\\|$, so requiring every point to sit at distance at least $m$ means $y_i(w^\\top x_i+b)\\ge m\\|w\\|$. Rescaling $(w,b)$ leaves the boundary identical, so the constraint normalises to $y_i(w^\\top x_i+b)\\ge1$ and the margin is $2/\\|w\\|$. On the six-point example $w=(2/3,2/3)$ and the margin is 2.1213."
    - "**The primal is a convex QP, so KKT is a certificate, not a hope.** The objective $\\tfrac12\\|w\\|^2$ has Hessian $I$ and the feasible set is a polyhedron, so any KKT point is the global minimiser. The minimiser is unique in $w$ even though the Hessian is zero in $b$. But $\\kappa=1$ in the primal says nothing about training speed; the conditioning lives in the dual."
    - "**The dual trades $d$ variables for $n$, and its value is a bound you can check by hand.** Stationarity gives $w=\\sum_i\\alpha_iy_ix_i$, leaving $\\max_\\alpha\\sum_i\\alpha_i-\\tfrac12\\sum_{i,j}\\alpha_i\\alpha_jy_iy_jx_i^\\top x_j$. On six points $\\alpha=(4/9,0,0,0,2/9,2/9)$, so the dual value is $4/9$ — exactly $\\tfrac12\\|w\\|^2$. The dual is cheaper only when $n<d$: for 41 points and $d=2$ it is 20× larger."
    - "**Complementary slackness sorts every point into three bins.** With $\\alpha_i\\ge0$ and $\\alpha_i[y_if(x_i)-1]=0$: $\\alpha_i=0$ means outside the margin with no influence; $0<\\alpha_i<C$ means exactly on the margin, and these determine $b$; $\\alpha_i=C$ means inside or misclassified, influence capped. On the example three points have $y_if=1$ and $(2,3)$ has $5/3$ with $\\alpha=0$."
    - "**$C$ is a per-point budget, not a knob that gets monotonically stronger.** In the dual it only changes $\\alpha_i\\ge0$ into $0\\le\\alpha_i\\le C$, capping how much any single point can pull on the boundary. On 41 points with one mislabelled: $C=0.01$ gives 40 of 41 support vectors and margin 5.21; $C=1$ gives 15 and 1.56; $C=10$ gives 12 and 1.04; $C=100$ and $1000$ are bit-identical."
    - "**The kernel trick is one substitution: $x_i^\\top x_j\\to K(x_i,x_j)$.** Both the dual and the predictor touch the data only through inner products, so any PSD function computes an inner product in a feature space without constructing it: degree-3 monomials in $d=100$ number 171,700 and cost one dot product. The Gram matrix is still $n\\times n$: $n=10^5$ is 80 GB."

  definitions:
    - term: "Geometric margin"
      meaning: >-
        The distance from the hyperplane to the closest training point, equal
        to $2/\|w\|$ once the functional margin is normalised to 1. It is the
        quantity the SVM maximises, and the only reason $\|w\|$ appears in the
        objective.
    - term: "Functional margin"
      meaning: >-
        $\hat{m}_i = y_i(w^\top x_i + b)$, the un-normalised version. It can be
        made arbitrarily large by scaling $(w, b)$, which is why the constraint
        $y_i f(x_i) \ge 1$ is a *convention* that fixes the scale rather than a
        modelling choice.
    - term: "Support vector"
      meaning: >-
        A training point with $\alpha_i > 0$. It lies on the margin
        ($0 < \alpha_i < C$) or inside it ($\alpha_i = C$). The classifier is
        unchanged if every other point is deleted after training.
    - term: "Hard margin"
      meaning: >-
        The $C = \infty$ limit: no slack, every point must be on the correct
        side by at least the margin. It has no solution when the classes
        overlap, and the failure is silent — solvers return alphas at their
        upper bound rather than an error.
    - term: 'Slack variable $\xi_i$'
      meaning: >-
        How far point $i$ is allowed to violate the margin,
        $\xi_i = \max(0, 1 - y_i f(x_i))$. The soft-margin objective is
        $\tfrac12\|w\|^2 + C\sum_i \xi_i$, so $\xi$ is exactly the hinge loss
        evaluated at that point.
    - term: "Hinge loss"
      meaning: >-
        $\max(0, 1 - y f(x))$. It is the smallest convex upper bound on the
        0-1 loss that grows linearly, and it is exactly zero once
        $y f(x) \ge 1$ — which is the algebraic reason the solution is sparse
        in the training points.
    - term: "Dual problem"
      meaning: >-
        The problem obtained by minimising the Lagrangian over $(w, b)$ and
        maximising over $\alpha \ge 0$. For the SVM it is
        $\max_\alpha \sum \alpha_i - \tfrac12 \alpha^\top Q \alpha$ subject to
        $0 \le \alpha_i \le C$ and $\sum_i \alpha_i y_i = 0$, with
        $Q_{ij} = y_i y_j K_{ij}$.
    - term: "KKT conditions"
      meaning: >-
        Stationarity, primal feasibility, dual feasibility and complementary
        slackness. For a convex problem they are sufficient for global
        optimality, so for the SVM they are a certificate: satisfying them
        proves you have the answer.
    - term: "Complementary slackness"
      meaning: >-
        $\alpha_i\,[y_i f(x_i) - 1] = 0$ for every $i$. Either a point has zero
        weight or it sits exactly on the margin (or, with slack, at the bound
        $\alpha_i = C$). It is what makes the solution a small subset of the
        data rather than a dense average.
    - term: "Kernel and the kernel trick"
      meaning: >-
        A function $K(x, z) = \varphi(x)^\top \varphi(z)$ for some feature map
        $\varphi$. The trick is to substitute $K$ for every inner product and
        never compute $\varphi$, which is what makes infinite-dimensional
        feature spaces usable.
    - term: "Gram matrix"
      meaning: >-
        The $n \times n$ matrix $K_{ij} = K(x_i, x_j)$. It is the object the
        dual actually optimises over, and its size — not the dimension — is
        what limits kernel methods to roughly $10^4$–$10^5$ points.
    - term: "Positive semi-definite kernel (Mercer)"
      meaning: >-
        A symmetric $K$ whose Gram matrix is PSD for every finite set of
        points. Exactly the condition under which $K$ is an inner product in
        some feature space, and therefore under which the dual is concave.
    - term: "SMO"
      meaning: >-
        Sequential Minimal Optimisation: coordinate ascent on the dual in
        pairs $(\alpha_i, \alpha_j)$ chosen so that the equality constraint
        $\sum \alpha_i y_i = 0$ stays satisfied. Each step is solved in closed
        form, which is why the SVM needs no general-purpose QP solver.

  diagrams:
    - type: compare
      title: "Primal and dual: what each one gives you"
      left_label: "Primal — min ½‖w‖² subject to y_i f(x_i) ≥ 1"
      left_points:
        - "d + 1 variables, so it is the cheap one when d is small"
        - "One constraint per training point: n of them"
        - "The solution is w and b — a weight per feature, which is what you want to inspect"
        - "No route to nonlinearity: you would have to write φ(x) explicitly"
        - "Conditioning is perfect (κ = 1), but a generic QP solver cannot exploit that"
      right_label: "Dual — max Σα − ½αᵀQα subject to 0 ≤ α ≤ C, Σαy = 0"
      right_points:
        - "n variables, one equality constraint, and a box — the shape SMO is built for"
        - "α is the answer: α_i > 0 names the support vectors directly"
        - "Data appears only as x_iᵀx_j, so any PSD kernel can be substituted"
        - "Cheap when n < d, expensive when n > d — the opposite regime"
        - "κ(Q) measured 3.6×10⁵ on 200 ten-dimensional points — that is where slow training comes from"
    - type: plot
      title: "Hinge is the tightest convex upper bound on 0-1 loss, and it is exactly zero past the margin"
      chart: "line"
      xLabel: "margin y·f(x)"
      yLabel: "loss"
      series:
        - name: "hinge: max(0, 1 − t)"
          points:
            - { x: -2, y: 3.0 }
            - { x: -1, y: 2.0 }
            - { x: 0, y: 1.0 }
            - { x: 0.5, y: 0.5 }
            - { x: 1, y: 0.0 }
            - { x: 2, y: 0.0 }
            - { x: 3, y: 0.0 }
        - name: "logistic: log(1 + e^(−t))"
          points:
            - { x: -2, y: 2.1269 }
            - { x: -1, y: 1.3133 }
            - { x: 0, y: 0.6931 }
            - { x: 0.5, y: 0.4741 }
            - { x: 1, y: 0.3133 }
            - { x: 2, y: 0.1269 }
            - { x: 3, y: 0.0486 }
        - name: "0-1 loss"
          points:
            - { x: -2, y: 1.0 }
            - { x: -1, y: 1.0 }
            - { x: 0, y: 1.0 }
            - { x: 0.5, y: 1.0 }
            - { x: 1, y: 0.0 }
            - { x: 2, y: 0.0 }
            - { x: 3, y: 0.0 }
    - type: plot
      title: "Support-vector fraction collapses as C rises (margin 5.21 → 1.04), then stops moving"
      chart: "line"
      xLabel: "log10(C)"
      yLabel: "% of training points that are support vectors"
      series:
        - name: "41 points, one mislabelled (measured)"
          points:
            - { x: -2, y: 97.6 }
            - { x: -1, y: 53.7 }
            - { x: 0, y: 36.6 }
            - { x: 1, y: 29.3 }
            - { x: 2, y: 29.3 }
            - { x: 3, y: 29.3 }
    - type: architecture
      title: "Where the work actually happens in a kernel SVM"
      nodes:
        - id: data
          x: 0
          y: 0
          label: "Training set (x_i, y_i)"
          kind: client
          detail: "n rows, d columns. Nothing here is transformed — the kernel does the transforming, without ever materialising φ(x)."
        - id: gram
          x: 1
          y: 0
          label: "Gram matrix K"
          kind: model
          detail: "n × n entries, O(n²d) time and O(n²) memory. This is the step that caps the method at 10⁴–10⁵ points: at n = 10⁵ the matrix is 80 GB in float64."
        - id: qp
          x: 2
          y: 0
          label: "Dual QP via SMO"
          kind: gpu
          detail: "Maximise Σα − ½αᵀQα with Q = y yᵀ ∘ K, subject to 0 ≤ α ≤ C and Σαy = 0. Convergence is governed by κ(Q), not by anything in the primal."
        - id: svs
          x: 3
          y: 0
          label: "Support vectors (α > 0)"
          kind: storage
          detail: "Usually 10–40% of the data; at C = 0.01 it was 97.6%, at C = 100 it was 29.3%. Everything with α = 0 can be discarded."
        - id: query
          x: 0
          y: 2
          label: "New point x"
          kind: client
          detail: "Never transformed either. Prediction only needs its kernel value against each stored support vector."
        - id: decision
          x: 3
          y: 1
          label: "f(x) = Σ α_i y_i K(x_i, x) + b"
          kind: server
          detail: "O(n_SV · d) per prediction. Compare a linear model's O(d) — with 3,000 support vectors that is a factor of 3,000."
      edges:
        - { from: data, to: gram, label: "every pair" }
        - { from: gram, to: qp, label: "Q = y yᵀ ∘ K" }
        - { from: qp, to: svs, label: "KKT" }
        - { from: svs, to: decision, label: "weights α_i y_i" }
        - { from: query, to: decision, label: "K(x_i, x), i ∈ SV" }
    - type: graph
      title: "One formulation, five consequences that show up in production"
      nodes:
        - { id: street, label: "Widest street" }
        - { id: qp, label: "Convex QP" }
        - { id: kkt, label: "KKT names the SVs" }
        - { id: sparse, label: "Sparse model" }
        - { id: fast, label: "O(n_SV·d) prediction" }
        - { id: inner, label: "Only inner products" }
        - { id: kernel, label: "Any PSD kernel" }
        - { id: gram, label: "n×n Gram matrix" }
        - { id: memory, label: "80 GB at n = 10⁵" }
        - { id: rbf, label: "RBF = distance" }
        - { id: curse, label: "Kernel goes flat at d = 768" }
      edges:
        - { from: street, to: qp, label: "½‖w‖²" }
        - { from: qp, to: kkt, label: "certificate" }
        - { from: kkt, to: sparse, label: "α_i = 0" }
        - { from: sparse, to: fast, label: "delete the rest" }
        - { from: inner, to: kernel, label: "substitute" }
        - { from: kernel, to: gram, label: "materialise" }
        - { from: gram, to: memory, label: "O(n²)" }
