id: knn-curse-dimensionality
slug: knn-curse-dimensionality
title: "k-NN at 1,000 Dimensions: Your Nearest Neighbour Is a Stranger"
summary: >-
  Build k-NN from scratch, then compute — before you train anything — whether
  its neighbourhood means anything, and learn the three moves that make it
  work at 768 dimensions: reduce, reweight, or abandon it for a parametric
  model.
kind: lesson
difficulty: medium
position: 4
estMinutes: 24
prerequisites: [linear-algebra-foundations, vectors-and-geometry]
phase: supervised-learning
tags: [knn, curse-of-dimensionality, distance-concentration, nonparametric, hubness, intrinsic-dimension, embeddings]

body:
  big_idea: >-
    k-NN has no parameters beyond the bet that a small ball holds informative labels,
    and the curse measures when that ball grows: at 1,000 dimensions the 10th neighbour
    is 95% as far as a stranger.

  problem:
    - "You fit k-NN on 40 features for 0.91 AUC, add a 400-dimensional TF-IDF block, and accuracy drops to 0.78."
    - "At $d=100$ your 10th neighbour and your 10,000th are 5% apart in distance, so choosing $k$ is choosing among near-ties."
    - "Your ANN index answers in 4 ms with recall@10 of 0.62, because it was built on distances that no longer rank anything."

  analogy: |
    You sort coins with a scale that reads to the nearest gram. In a sack of
    identical pennies — 2.5 g each, varying by ±0.05 g — every coin reads "3 g".
    Sorting by weight is impossible: the resolution is coarser than the spread
    you are asking it to rank. That is k-NN at 1,000 dimensions. The ruler is
    fine; the spread it must resolve has collapsed.

  concept_points:
    - "**k-NN is a Voronoi partition with a vote, and nothing else.** Fitting stores the training set; prediction finds the $k$ nearest points and takes a majority. No weights, no loss, no optimisation — so every failure is geometric and computable before training. Training accuracy is always 100.0% with $k=1$, since every point's nearest neighbour is itself."
    - "**The only thing that matters is the radius of the k-ball.** For $n$ points over unit volume, the ball holding $k$ has radius $r_k = (k/(nV_d))^{1/d}$ with $V_d = \\pi^{d/2}/\\Gamma(d/2+1)$. At $n = 10{,}000$, $k=10$: $r_{10} = 0.018$ at $d=2$, $0.46$ at $d=10$, $2.32$ at $d=100$, $7.63$ at $d=1000$ — measured $0.0176$, $0.534$, $3.36$, $12.04$."
    - "**Normalise the radius by the typical distance and the story is complete.** Measured at $n = 10{,}000$, $k=10$: $r_{10}$ is 3.0% of the mean interpoint distance at $d=2$, 41% at $d=10$, 82% at $d=100$, 94.6% at $d=1000$. By $d=1000$ the ten nearest neighbours are within 5.4% of the distance of a point chosen at random."
    - "**The data bill is exponential, not linear.** To keep a 10-point ball of radius 0.1 in a unit cube you need $n = k/(V_d r^d)$: 318 points at $d=2$, 190,000 at $d=5$, $3.9\\times10^{10}$ at $d=10$, $3.9\\times10^{22}$ at $d=20$, $4.2\\times10^{140}$ at $d=100$. At fixed $n$, each doubling of $d$ squares the density requirement."
    - "**The rate is $n^{-2/(d+2)}$, and that exponent is the interview answer.** k-NN regression balances bias $O(r^2)$ against variance $O(1/(nr^d))$, giving $r^* \\propto n^{-1/(d+2)}$ and risk $\\propto n^{-2/(d+2)}$. Halving the error needs $2^{(d+2)/2}$ times the data: 4× at $d=2$, 64× at $d=10$, 2,048× at $d=20$, $2.25\\times10^{15}$× at $d=100$. A correctly specified parametric model has rate $n^{-1}$ in any dimension."
    - "**Intrinsic dimension is the only real escape, and it is measurable.** The rate depends on the dimension the data fills. The Levina–Bickel MLE — for each point, take the $k$ nearest distances $T_1 < \\dots < T_k$ and compute $[\\frac{1}{k-1}\\sum_{j<k}\\log(T_k/T_j)]^{-1}$, then take the median — returns **4.7** on 100-dimensional data from a 5-dimensional subspace. Run it on your 768-dimensional embeddings before declaring k-NN hopeless."

  definitions:
    - { term: 'k-nearest-neighbours classifier', meaning: 'A model that stores the training set and predicts the majority label among the $k$ stored points closest to the query. No fitted parameters: the entire model is the training data plus a distance function.' }
    - { term: 'Curse of dimensionality', meaning: 'The family of ways algorithms calibrated on low-dimensional data fail as dimension grows — neighbourhoods inflate, distances concentrate, and the sample size needed for a fixed accuracy grows exponentially.' }
    - { term: 'Neighbourhood radius', meaning: 'The distance from a query to its $k$-th nearest training point, written $r_k$. The most useful single diagnostic for a k-NN model, because it says how much of the input space the local average actually covers.' }
    - { term: 'Distance contrast', meaning: '$(r_k - r_1)/r_1$ — how much further the $k$-th neighbour is than the first. At 0.05 the ranking among the top $k$ is mostly noise; at 4.7, which is two dimensions, it is a strong signal.' }
    - { term: 'Voronoi cell', meaning: 'The region of input space closer to a given training point than to any other. 1-NN is piecewise constant on these cells, which is why its decision boundary can be arbitrarily complicated while its only stored state is the training set.' }
    - { term: 'Nonparametric rate', meaning: 'The convergence rate of an estimator whose complexity grows with the data. For k-NN regression in $d$ dimensions the $L_2$ risk falls as $n^{-2/(d+2)}$, against $n^{-1}$ for a correctly specified parametric model.' }
    - { term: 'Intrinsic dimension', meaning: 'The number of degrees of freedom the data actually uses, as opposed to the ambient dimension of its coordinates. A curve in 3-D space has ambient dimension 3 and intrinsic dimension 1.' }
    - { term: 'Levina–Bickel MLE', meaning: 'An estimator of intrinsic dimension built from local distances to the $k$ nearest neighbours: $\hat\alpha = [\frac{1}{k-1}\sum_{j<k}\log(T_k/T_j)]^{-1}$, aggregated over points by the median.' }
    - { term: 'Hubness', meaning: 'The high-dimensional phenomenon in which a small number of points appear in an outsized share of all $k$-NN lists, so predictions are dominated by a handful of arbitrary training examples.' }
    - { term: 'Effective sample size per dimension', meaning: '$n/d$ — the crude budget that decides whether a local method has any chance. Below roughly 100 points per dimension, expect k-NN to be far from the Bayes rate regardless of tuning.' }

