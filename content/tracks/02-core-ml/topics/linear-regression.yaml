id: linear-regression
slug: linear-regression
title: "Least Squares Is a Projection (and Normal Equations Square the Error)"
summary: >-
  Derive the least-squares estimator from the gradient and from the Gaussian
  likelihood, then measure the exact point where forming $X^\top X$ stops
  returning your coefficients and starts returning noise — and what to do
  instead.
kind: lesson
difficulty: medium
position: 1
estMinutes: 22
prerequisites: [linear-algebra-foundations, matrix-calculus, maximum-likelihood-bayesian]
phase: supervised-learning
tags: [linear-regression, least-squares, normal-equations, conditioning, qr, collinearity]

body:
  big_idea: >-
    Least squares is an orthogonal projection of $y$ onto the column space of $X$, so
    only arithmetic can fail — and forming $X^\top X$ squares the condition number,
    costing half your digits.

  problem:
    - "You fit a regression, get $R^2 = 0.98$, ship the coefficients, and one has the wrong sign. Predictions are fine; the explanation is backwards."
    - "You write `beta = np.linalg.solve(X.T @ X, X.T @ y)`, and at $\\kappa(X) = 10^8$ it returns coefficients 3.6% wrong with no warning."
    - "Your model reports $R^2 = 0.53$ on 20 rows with 11 features. Pure noise on that shape averages 0.526, so nothing was explained."

  analogy: |
    A surveyor fixes a corner by intersecting bearings from two known points. If
    the bearings are nearly parallel, the intersection is a long thin sliver:
    one arcminute of error moves the corner hundreds of metres. In regression
    each column of $X$ is a bearing and $\kappa(X)$ is the fatness of the
    sliver; two identical columns are two bearings along one line.

  concept_points:
    - "**Least squares is a projection, and that is the whole content of the method.** $\\hat y = X\\hat\\beta$ is the orthogonal projection of $y$ onto $\\operatorname{col}(X)$, so $r = y - X\\hat\\beta$ is perpendicular to every column: $X^\\top r = 0$. In a 200-row fit with an intercept the residuals summed to $1.5\\times10^{-13}$ — zero to machine precision, not by accident."
    - "**The normal equations are what you get when you set the gradient to zero, and a Gaussian likelihood gives the identical estimator.** Differentiating the RSS gives $2X^\\top X\\beta - 2X^\\top y = 0$; the Hessian is PSD, so that point is the global minimum, unique at full column rank. With $\\varepsilon \\sim \\mathcal{N}(0,\\sigma^2 I)$ the negative log-likelihood is that same RSS plus a constant."
    - "**Forming $X^\\top X$ squares the condition number, and that is the entire failure.** If $X = U\\Sigma V^\\top$ then $X^\\top X = V\\Sigma^2V^\\top$, so $\\kappa(X^\\top X) = \\kappa(X)^2$. Measured on an $8\\times3$ design with two nearly identical columns: $\\kappa(X) = 8.4\\times10^4$ and $\\kappa(X^\\top X) = 7.1\\times10^9$. On a $120\\times3$ design the error's slope in $\\log\\kappa$ is 1.94 for normal equations and 1.04 for QR."
    - "**QR and SVD work with $X$ directly, so they never pay the square.** Factor $X = QR$ and back-substitute $R\\beta = Q^\\top y$; the error is bounded by $\\kappa(X)\\epsilon$, not $\\kappa(X)^2\\epsilon$. The cost is roughly twice the flops and buys a factor of $7.9\\times10^5$ in accuracy at $\\kappa = 10^6$. `np.linalg.lstsq` defaults to this for a reason."
    - "**Collinearity's other failure is interpretive and needs no large $\\kappa$.** With 200 rows and $\\operatorname{corr}(x_1,x_2) = 0.9943$, the partial coefficient on $x_1$ was $+1.951$ while the marginal slope of $y$ on $x_1$ alone was $-0.968$ — same data, opposite sign. The VIF was 88, so the standard error is $9.4\\times$ larger. $\\kappa$ asks whether the arithmetic survives; VIF asks whether the coefficients mean anything."
    - "**Leverage tells you which rows own the fit, before you look at $y$.** $h_{ii} = x_i^\\top(X^\\top X)^{-1}x_i$ lies in $[0,1]$ and satisfies $\\sum_i h_{ii} = p$ exactly — measured $3.000000000000001$ at $n=200, p=3$. Five points at $x = 0,1,2,3,10$ give leverages $(0.363, 0.277, 0.223, 0.201, 0.936)$: the last is 94% of its own fitted value. High leverage does not require an unusual $y$."

  definitions:
    - term: Design matrix ($X$)
      meaning: >-
        The $n \times p$ matrix whose rows are observations and whose columns
        are features, with a column of ones when an intercept is included. Every
        statement about conditioning in this topic is a statement about $X$,
        not about $y$.
    - term: Coefficient vector ($\hat\beta$)
      meaning: >-
        The $p$-vector minimising $\|y - X\beta\|^2$. Element $j$ is the change
        in the fitted value per unit change in feature $j$ *holding the other
        columns fixed* — which is why collinear columns make it unstable while
        leaving predictions alone.
    - term: Residual vs error
      meaning: >-
        The residual $r_i = y_i - \hat y_i$ is observable; the error
        $\varepsilon_i$ is not. OLS makes residuals orthogonal to
        $\operatorname{col}(X)$, but says nothing about the errors except
        through assumptions.
    - term: Normal equations
      meaning: >-
        $X^\top X\beta = X^\top y$, the first-order condition for least
        squares. Mathematically equivalent to the projection and numerically
        worse than every alternative, because $\kappa(X^\top X) = \kappa(X)^2$.
    - term: Hat matrix ($H$)
      meaning: >-
        $H = X(X^\top X)^{-1}X^\top$, the linear map taking $y$ to $\hat y$. It
        is symmetric and idempotent, with $\operatorname{tr}(H) = p$ — the
        number of parameters, which is also the model's degrees of freedom.
    - term: Leverage ($h_{ii}$)
      meaning: >-
        The $i$-th diagonal entry of $H$: how much observation $i$ pulls its own
        fitted value toward itself. Bounded in $[0,1]$, averaging $p/n$. The
        residual variance is $\sigma^2(1 - h_{ii})$, so high-leverage points
        have small residuals even when they fit badly.
    - term: Residual degrees of freedom
      meaning: >-
        $n - p$: the number of observations left after the $p$ fitted
        parameters are used up. The unbiased variance estimate is
        $s^2 = \text{RSS}/(n-p)$, and it is the denominator that makes
        $t$ and $F$ tests work.
    - term: Condition number ($\kappa$)
      meaning: >-
        $\sigma_{\max}/\sigma_{\min}$ of $X$ — the factor by which a relative
        perturbation in the inputs is amplified in $\hat\beta$. Computed from
        an SVD of $X$, never from $X^\top X$.
    - term: Rank deficiency
      meaning: >-
        $X$ has linearly dependent columns, so $X^\top X$ is singular and
        $\hat\beta$ is not unique. Every solution reproduces the same fitted
        values; only the coefficients differ, and they are chosen by the
        solver's pivoting, not by the data.
    - term: Variance inflation factor
      meaning: >-
        $\text{VIF}_j = 1/(1 - R_j^2)$, where $R_j^2$ comes from regressing
        column $j$ on the other columns. It is the factor by which the variance
        of $\hat\beta_j$ exceeds the orthogonal-design case, so the standard
        error is inflated by $\sqrt{\text{VIF}}$.
    - term: Adjusted $R^2$
      meaning: >-
        $1 - \frac{\text{RSS}/(n-p)}{\text{TSS}/(n-1)}$. It penalises extra
        parameters, so unlike $R^2$ it does not rise when you add noise
        features, and it can be compared across models with different $p$.
    - term: Best linear unbiased estimator
      meaning: >-
        Under the Gauss–Markov assumptions — linearity, $\mathbb{E}[\varepsilon
        \mid X] = 0$, homoscedasticity, uncorrelated errors — OLS has the
        smallest variance among all linear unbiased estimators. The theorem
        assumes full column rank and says nothing about conditioning.

  diagrams:
    - type: compare
      title: "Two ways to compute the same estimator"
      left_label: "Normal equations: solve $(X^\\top X)\\beta = X^\\top y$"
      left_points:
        - "$\\kappa$ squared: $10^6$ becomes $10^{12}$"
        - "Measured relative error $6.0 \\times 10^{-6}$ at $\\kappa = 10^6$"
        - "Measured $3.6 \\times 10^{-2}$ at $\\kappa = 10^8$ — no correct digits"
        - "Cheapest arithmetic: $np^2 + p^3/3$ flops"
        - "Raises `LinAlgError` on a duplicated column"
      right_label: "QR: factor $X = QR$, then solve $R\\beta = Q^\\top y$"
      right_points:
        - "$\\kappa$ preserved: error grows like $\\kappa$, not $\\kappa^2$"
        - "Measured relative error $7.6 \\times 10^{-12}$ at $\\kappa = 10^6$"
        - "Measured $4.7 \\times 10^{-9}$ at $\\kappa = 10^8$"
        - "About $2\\times$ the flops — irrelevant next to being wrong"
        - "Backward stable; column pivoting handles rank deficiency"
    - type: plot
      title: "Measured error in $\\hat\\beta$: the normal equations track $\\kappa^2$, QR tracks $\\kappa$"
      chart: "line"
      xLabel: "log10 κ(X)"
      yLabel: "log10 relative error in β̂"
      series:
        - name: "normal equations — measured"
          points:
            - { x: 0, y: -15.524 }
            - { x: 2, y: -12.616 }
            - { x: 4, y: -9.201 }
            - { x: 6, y: -5.221 }
            - { x: 8, y: -1.443 }
        - name: "QR — measured"
          points:
            - { x: 0, y: -15.296 }
            - { x: 2, y: -14.779 }
            - { x: 4, y: -12.472 }
            - { x: 6, y: -11.120 }
            - { x: 8, y: -8.327 }
        - name: "bound ε·κ(X)²"
          points:
            - { x: 0, y: -15.654 }
            - { x: 2, y: -11.654 }
            - { x: 4, y: -7.654 }
            - { x: 6, y: -3.654 }
            - { x: 8, y: 0.346 }
        - name: "bound ε·κ(X)"
          points:
            - { x: 0, y: -15.654 }
            - { x: 2, y: -13.654 }
            - { x: 4, y: -11.654 }
            - { x: 6, y: -9.654 }
            - { x: 8, y: -7.654 }
    - type: pipeline
      title: "The five minutes of diagnostics that prevent the whole class of bug"
      nodes:
        - label: "Standardise the feature columns"
          note: "centre and scale, never the intercept"
          detail: "A dollar feature at $10^5$ next to a year feature at $10^1$ inflates $\\kappa(X)$ by four orders of magnitude before any arithmetic happens. This is a conditioning operation, not cosmetics."
        - label: "Compute $\\kappa(X)$ from an SVD"
          note: "`np.linalg.cond(X)`, never `cond(X.T @ X)`"
          detail: "If you ask for the condition number of the Gram matrix you have already formed it. Call `cond` on $X$: the answer is the square root of what the solver will actually experience."
        - label: "Choose the solver from $\\kappa$"
          note: "$\\kappa < 10^4$: anything; above that: QR or SVD"
          detail: "At $\\kappa = 10^4$ the normal equations lose 8 of 15.7 digits. At $10^6$ they lose 12. The solver choice is not a style preference once the design matrix is real."
        - label: "Check VIF for every feature"
          note: "above 5 investigate, above 10 stop"
          detail: "This is the statistical axis, and $\\kappa$ does not detect it. A correlation of 0.994 gave a VIF of 88 and a sign flip while $\\kappa(X)$ sat at 18.7."
        - label: "Check leverage and the residual plot"
          note: "$h_{ii} > 2p/n$ flags an influential row"
          detail: "Leverage is computed from $X$ alone, so it finds unusual rows before you look at $y$. Pair it with Cook's distance, which adds the residual size."
        - label: "Report adjusted $R^2$ with $n$ and $p$"
          note: "never raw $R^2$ alone"
          detail: "Under pure noise $\\mathbb{E}[R^2] = (p-1)/(n-1)$. Eleven features on twenty rows averages 0.526 with nothing in the data at all."
    - type: architecture
      title: "Where each failure lives in a fitting pipeline"
      nodes:
        - { id: raw, x: 0, y: 1, label: "Raw feature table", kind: client, detail: "n rows, p-1 features. Units are whatever the source system used, which is the first thing that breaks conditioning." }
        - { id: design, x: 1, y: 1, label: "Design matrix X", kind: server, detail: "Intercept column plus standardised features. This object — not y — determines whether the fit is recoverable. kappa(X) is computed here." }
        - { id: qr, x: 2, y: 0, label: "QR / SVD solve", kind: model, detail: "Backward stable. Error bounded by kappa(X)*eps. Use this unless you have measured that kappa is small." }
        - { id: gram, x: 2, y: 2, label: "X^T X (rejected path)", kind: database, detail: "Squares the condition number. Fine below kappa = 1e4, catastrophic by 1e6, and singular on a duplicated column." }
        - { id: diag, x: 3, y: 1, label: "Diagnostics", kind: worker, detail: "Leverage, VIF, residual plots, standard errors, adjusted R^2. The solver cannot produce these judgements; it only produces beta." }
      edges:
        - { from: raw, to: design, label: "add intercept, standardise" }
        - { from: design, to: qr, label: "always safe" }
        - { from: design, to: gram, label: "only if κ < 1e4" }
        - { from: qr, to: diag, label: "β̂, residuals, H" }
    - type: stack
      title: "Four assumptions, four different things they buy you"
      layers:
        - "Normality of ε — makes the t and F tests exact, and nothing else"
        - "Homoscedasticity — makes σ²(XᵀX)⁻¹ the covariance, so standard errors are valid"
        - "Exogeneity, E[ε|X] = 0 — makes β̂ unbiased; violated by any omitted confounder"
        - "Full column rank — makes β̂ unique at all; everything above is meaningless without it"

  markdown: |
    ## The fit is a projection

    You have $n$ observations, $p$ columns, and a vector $y$. The least-squares
    estimate is the $\beta$ that minimises $\|y - X\beta\|^2$. Geometrically
    there is only one thing it can be: the orthogonal projection of $y$ onto
    the column space of $X$.

    $$\hat y = X\hat\beta = Hy, \qquad H = X(X^\top X)^{-1}X^\top.$$

    $H$ is symmetric and idempotent, its trace is $p$, and the residual
    $r = (I - H)y$ is orthogonal to every column of $X$. That orthogonality is
    the entire first-order condition:

    $$X^\top (y - X\hat\beta) = 0 \quad\Longleftrightarrow\quad X^\top X\hat\beta = X^\top y.$$

    Everything else in this topic is about the gap between that equation being
    *true* and it being *computable*.

    ## Two derivations of the same estimator

    Differentiate the residual sum of squares. Expanding,

    $$\text{RSS}(\beta) = y^\top y - 2\beta^\top X^\top y + \beta^\top X^\top X\beta,$$

    and applying $\nabla(\tfrac12 \beta^\top A\beta - b^\top\beta) =
    \tfrac12(A + A^\top)\beta - b$ with $A = X^\top X$ symmetric gives

    $$\nabla \text{RSS} = 2X^\top X\beta - 2X^\top y, \qquad
      \nabla^2 \text{RSS} = 2X^\top X \succeq 0.$$

    The Hessian is positive semidefinite, so the stationary point is the global
    minimum; it is unique exactly when $X$ has rank $p$. This is the same
    gradient identity from *Matrix Calculus*, applied to a particular $A$.

    Now do it probabilistically. Assume $y = X\beta + \varepsilon$ with
    $\varepsilon \sim \mathcal{N}(0, \sigma^2 I)$. The negative log likelihood is

    $$-\ell(\beta, \sigma^2) = \frac{n}{2}\log(2\pi\sigma^2) + \frac{1}{2\sigma^2}\|y - X\beta\|^2,$$

    so for fixed $\sigma^2$, maximising the likelihood over $\beta$ is exactly
    minimising RSS. The estimator is not a convenience — it is the maximum
    likelihood estimator under Gaussian noise, which is the derivation you did
    in *Maximum Likelihood and Bayesian Inference*. The same expression gives
    $\hat\sigma^2_{\text{MLE}} = \text{RSS}/n$; the unbiased version divides by
    $n - p$ instead, and on a 4-point fit with RSS $= 0.082$ those are $0.0205$
    and $0.041$.

    ## Where it breaks

    The singular value decomposition $X = U\Sigma V^\top$ gives
    $X^\top X = V\Sigma^2 V^\top$. So the Gram matrix's singular values are the
    **squares** of $X$'s, and

    $$\kappa(X^\top X) = \kappa(X)^2.$$

    Since a backward-stable solve of a system with condition number $\kappa$
    has relative error bounded by $\kappa\epsilon$, the normal equations carry
    a bound of $\kappa(X)^2\epsilon$. In float64, $\epsilon = 2.22 \times
    10^{-16}$: at $\kappa(X) = 10^3$ you have already lost 6 of your 15.7
    digits, and at $10^6$ you have 3.7 left.

    Measured on a $120 \times 3$ design with prescribed singular values and 1%
    noise, comparing both routes against an exact rational solve:

    | $\kappa(X)$ | $\kappa(X^\top X)$ | normal equations | QR | ratio |
    |---|---|---|---|---|
    | $1$ | $1.0$ | $2.99\times10^{-16}$ | $5.05\times10^{-16}$ | — |
    | $10^2$ | $1.0\times10^{4}$ | $2.42\times10^{-13}$ | $1.66\times10^{-15}$ | 146 |
    | $10^4$ | $1.0\times10^{8}$ | $6.30\times10^{-10}$ | $3.38\times10^{-13}$ | 1,860 |
    | $10^6$ | $1.0\times10^{12}$ | $6.01\times10^{-6}$ | $7.59\times10^{-12}$ | 792,000 |
    | $10^8$ | $6.31\times10^{15}$ | $3.61\times10^{-2}$ | $4.71\times10^{-9}$ | 7,660,000 |

    Two things to read off. First, the error grows as $\kappa^2$: the log-log
    slope is $1.94$ for the normal equations and $1.04$ for QR, which is the
    theoretical prediction measured rather than asserted. Second, the bound is
    loose by a factor of about 37 at $\kappa = 10^6$ — worst case is worse than
    typical, and typical is still catastrophic.

    The practical version: **a design matrix with $\kappa(X) = 10^6$ is not
    exotic.** Six features measured in different units, one of them a count and
    one a price, will do it.

    ## Three failures, not one

    **Ill-conditioning.** Fixable by not forming $X^\top X$. QR costs about
    twice the flops and removes the squared term entirely.

    **Rank deficiency.** A duplicated column makes $X^\top X$ exactly singular.
    `np.linalg.solve` raises; `lstsq` returns the minimum-norm solution, which
    splits the true slope across the duplicates according to the pivoting. The
    predictions are identical and the coefficients are arbitrary. If you report
    coefficients, this is a correctness bug; if you only predict, it is not.

    **Collinearity.** The one people miss, because the arithmetic still works.
    With $\operatorname{corr}(x_1, x_2) = 0.9943$ on 200 rows, the partial
    coefficient on $x_1$ was $+1.951$ with $t = 9.36$, while the marginal slope
    of $y$ on $x_1$ alone was $-0.968$. Same data, opposite sign, and
    $\kappa(X)$ was $18.7$ — completely unremarkable. The variance inflation
    factor was $88$, so the standard error is $9.4$ times what an orthogonal
    design would give. No solver fixes this. You drop a feature, combine them,
    or add a prior.

    ## What to report instead

    $R^2$ cannot compare models, because it is monotone in $p$. Under pure
    noise with an intercept, $\mathbb{E}[R^2] = (p-1)/(n-1)$: with $n = 20$,
    eleven features gave a mean $R^2$ of $0.527$ over 200 random datasets, and
    twenty features gave exactly $1.000$. Quote adjusted $R^2$ and always quote
    it next to $n$ and $p$.

    For the coefficients, quote standard errors — they are the diagonal of
    $s^2(X^\top X)^{-1}$, and their size relative to the estimate is the honest
    measure of how much the data pins the coefficient down. A coefficient with
    a standard error half its magnitude is a coefficient you do not know.

    ## What this topic is actually for

    Every model in the rest of this track — ridge, lasso, logistic regression,
    the linear head on a neural network — inherits this geometry. Ridge
    regression is precisely the admission that $\kappa(X)$ can be too large:
    adding $\lambda I$ to the diagonal moves every singular value away from
    zero and caps $\kappa$ at $\sigma_{\max}^2/\lambda$. Once you can see the
    normal equations as a projection whose accuracy is governed by
    $\kappa(X)^2$, ridge stops being a regularisation trick and becomes the
    obvious repair.

    ## The longer version

    The remaining mechanisms, verbatim: rank deficiency and the minimum-norm
    split, why $R^2$ is monotone in the parameter count, and why Cook's distance
    is a different diagnostic from leverage.

    ### Failure modes, in full

    - You fit a regression, get $R^2 = 0.98$, ship the coefficients, and one of them has the wrong sign. Nothing raised an exception. The predictions are fine; the explanation you gave the business is backwards.
    - You write `beta = np.linalg.solve(X.T @ X, X.T @ y)` because that is the equation in every textbook, and on a design matrix with $\kappa(X) = 10^8$ — which two collinear features produce easily — it returns coefficients that are 3.6% wrong, with no warning, no NaN, and a residual that still looks small.
    - Your model reports $R^2 = 0.53$ on 20 rows with 11 features and everyone is pleased. Pure noise on that shape produces $R^2 = 0.526$ on average, so the model has explained nothing and the metric cannot tell you that.
    - The interview question 'why not just invert $X^\top X$?' has a one-line answer — it squares the condition number — and a follow-up, 'how would you know?', that most candidates cannot answer with a number.

    ### The mechanisms, in full

    - **Least squares is a projection, and that is the whole content of the method.** $\hat y = X\hat\beta$ is the orthogonal projection of $y$ onto $\operatorname{col}(X)$, so the residual $r = y - X\hat\beta$ is perpendicular to every column: $X^\top r = 0$. Put numbers on it: in a 200-row fit with an intercept, the residuals summed to $1.5 \times 10^{-13}$ — zero to machine precision, and not by accident. The trap is reading $\hat\beta$ as a causal or structural statement: the projection is defined by the columns you supplied, so adding or dropping one changes every coefficient even when the fitted values barely move.
    - **The normal equations are what you get when you set the gradient to zero.** Expand $\|y - X\beta\|^2 = y^\top y - 2\beta^\top X^\top y + \beta^\top X^\top X\beta$ and differentiate — this is the same $\nabla(\tfrac12 x^\top A x - b^\top x) = \tfrac12(A + A^\top)x - b$ identity you proved in *Matrix Calculus*, with $A = X^\top X$ and $b = X^\top y$. The gradient is $2X^\top X\beta - 2X^\top y$, so the stationary point solves $X^\top X\beta = X^\top y$; the Hessian $2X^\top X$ is positive semidefinite, so that stationary point is the global minimum, and it is unique exactly when $X$ has full column rank. The trap is assuming the algebra tells you how to compute it. It does not.
    - **A Gaussian likelihood gives the identical estimator, which is why OLS is not an arbitrary choice.** With $y = X\beta + \varepsilon$ and $\varepsilon \sim \mathcal{N}(0, \sigma^2 I)$, the negative log likelihood is $\frac{n}{2}\log(2\pi\sigma^2) + \frac{1}{2\sigma^2}\|y - X\beta\|^2$ — maximising it over $\beta$ is minimising the residual sum of squares and nothing else. This is the derivation from *Maximum Likelihood and Bayesian Inference*, applied to a linear mean function. The same calculation gives $\hat\sigma^2_{\text{MLE}} = \text{RSS}/n$, which is biased low; on a 4-point fit with RSS $= 0.082$ that is $0.0205$ against the unbiased $s^2 = 0.082/(4-2) = 0.041$ — a factor of exactly $n/(n-p) = 2$.
    - **Forming $X^\top X$ squares the condition number, and that is the entire failure.** If $X = U\Sigma V^\top$ then $X^\top X = V\Sigma^2 V^\top$, so the singular values of the Gram matrix are $\sigma_i^2$ and $\kappa(X^\top X) = \kappa(X)^2$. Measured on an $8 \times 3$ design with two nearly identical columns: $\kappa(X) = 8.4 \times 10^4$ and $\kappa(X^\top X) = 7.1 \times 10^9$. Since the relative error bound is $\kappa \cdot \epsilon$, the normal equations lose *twice* as many digits as the problem actually costs. This is the phenomenon *Numerical Linear Algebra* measures on an $80 \times 80$ system; here it is on the object you will actually build.
    - **The damage is measurable, and it grows as $\kappa^2$ rather than $\kappa$.** On a $120 \times 3$ design with prescribed singular values, solving by normal equations and by QR gave: relative error $2.4 \times 10^{-13}$ vs $1.7 \times 10^{-15}$ at $\kappa = 10^2$; $6.3 \times 10^{-10}$ vs $3.4 \times 10^{-13}$ at $10^4$; $6.0 \times 10^{-6}$ vs $7.6 \times 10^{-12}$ at $10^6$; $3.6 \times 10^{-2}$ vs $4.7 \times 10^{-9}$ at $10^8$. The log-log slope is $1.94$ for the normal equations and $1.04$ for QR. At $\kappa = 10^8$ the normal equations agree with the truth in no digits at all, which is why the error looks like a bug rather than a rounding effect.
    - **QR and SVD work with $X$ directly, so they never pay the square.** Factor $X = QR$ with $Q$ orthonormal and solve the triangular system $R\beta = Q^\top y$ by back substitution; the error is then bounded by $\kappa(X)\epsilon$, not $\kappa(X)^2\epsilon$. The cost is roughly twice the flops ($2np^2 - \tfrac{2}{3}p^3$ versus $np^2 + \tfrac13 p^3$) and buys a factor of $7.9 \times 10^5$ in accuracy at $\kappa = 10^6$. There is no trade-off worth thinking about: `np.linalg.lstsq` and `scipy.linalg.lstsq` default to this for a reason, and every "my regression is unstable" bug report ends here.
    - **Rank deficiency is the limit case, and it is not exotic.** Duplicate a column and $\det(X^\top X) = 0.0$ exactly, $\kappa$ reports $3.96 \times 10^{33}$, and `np.linalg.solve` raises `LinAlgError: Singular matrix`. `lstsq` returns the minimum-norm solution instead: $(0.087, 0.396, 0.792)$, where the model's slope of $1.98$ is carried as $0.396$ on $x$ plus $0.792$ on $2x$ — a split chosen by the pivoting, not by the data. Predictions and $R^2$ are unaffected; the coefficients are arbitrary. The trap is believing a model with a singular Gram matrix is "broken" — it predicts fine and explains nothing.
    - **Collinearity's other failure is interpretive and does not need a large $\kappa$.** With 200 rows and $\operatorname{corr}(x_1, x_2) = 0.9943$, the partial coefficient on $x_1$ was $+1.951$ ($t = 9.36$) while the marginal slope of $y$ on $x_1$ alone was $-0.968$ — same data, opposite sign. The condition number of that design was only $18.7$, so no numerical alarm would have fired. The variance inflation factor was $88$, meaning the standard error is $9.4\times$ larger than it would be with orthogonal features. Two diagnostics, two different questions: $\kappa$ asks whether the arithmetic survives, VIF asks whether the coefficients mean anything.
    - **$R^2$ is a monotone function of the parameter count, so it cannot compare models.** Under pure noise with an intercept, $\mathbb{E}[R^2] = (p-1)/(n-1)$. Measured over 200 random datasets with $n = 20$: mean $R^2 = 0.105$ at $p=3$, $0.527$ at $p=11$, $0.847$ at $p=17$, and exactly $1.000$ at $p=20$. A reported $R^2$ with no $n$ and no $p$ attached is uninterpretable, which is why adjusted $R^2 = 1 - \frac{\text{RSS}/(n-p)}{\text{TSS}/(n-1)}$ exists and why it is the number to quote.
    - **Leverage tells you which rows own the fit, before you look at $y$.** $h_{ii} = x_i^\top (X^\top X)^{-1} x_i$ is the $i$-th diagonal of the hat matrix, lies in $[0,1]$, and satisfies $\sum_i h_{ii} = p$ exactly — measured $3.000000000000001$ at $n=200, p=3$ and $7.000000000000001$ at $n=12, p=7$. Five points at $x = 0,1,2,3,10$ give leverages $(0.363, 0.277, 0.223, 0.201, 0.936)$: the last point is 94% of its own fitted value, so the line is essentially aimed at it. The trap is that leverage is computed from $X$ alone — a point can have $h_{ii} = 0.94$ and a perfectly ordinary $y$, or a modest $h_{ii}$ and a catastrophic $y$. That second case is Cook's distance, not leverage.


  derivations:
    - title: "The normal equations, from the gradient"
      latex: |
        Let $f(\beta) = \|y - X\beta\|^2$. Expanding,
        $$f(\beta) = y^\top y - 2\beta^\top X^\top y + \beta^\top X^\top X\beta.$$
        With $A = X^\top X$ symmetric, $\nabla(\beta^\top A\beta) = 2A\beta$, so
        $$\nabla f(\beta) = -2X^\top y + 2X^\top X\beta, \qquad \nabla^2 f = 2X^\top X.$$
        Setting the gradient to zero:
        $$X^\top X\beta = X^\top y.$$
      prose: >-
        The Hessian is 2X^T X, which is positive semidefinite for every X, so
        the stationary point is a global minimum. It is unique exactly when X
        has rank p — and that caveat is the seed of everything that goes wrong
        later.
    - title: "Gaussian maximum likelihood is the same problem"
      latex: |
        With $\varepsilon \sim \mathcal{N}(0, \sigma^2 I)$ and $y = X\beta + \varepsilon$,
        $$p(y \mid X, \beta, \sigma^2) = (2\pi\sigma^2)^{-n/2}
          \exp\!\left(-\frac{\|y - X\beta\|^2}{2\sigma^2}\right).$$
        Taking $-2\log$,
        $$-2\ell = n\log(2\pi\sigma^2) + \frac{1}{\sigma^2}\|y - X\beta\|^2.$$
        For fixed $\sigma^2$ the first term is constant, so
        $$\arg\max_\beta \ell = \arg\min_\beta \|y - X\beta\|^2.$$
        Optimising over $\sigma^2$ as well gives
        $\hat\sigma^2 = \frac{1}{n}\|y - X\hat\beta\|^2$.
      prose: >-
        This is why OLS is not an arbitrary choice of loss: it is what you get
        whenever you assume additive Gaussian noise. It also explains the 1/n
        in the variance estimate and why that estimate is biased low by the
        factor n/(n-p) — the residual degrees of freedom are n-p, not n.
    - title: "Why the normal equations square the condition number"
      latex: |
        Let $X = U\Sigma V^\top$ be the thin SVD, with
        $\Sigma = \operatorname{diag}(\sigma_1, \dots, \sigma_p)$ and
        $\sigma_1 \ge \dots \ge \sigma_p > 0$. Then
        $$X^\top X = V\Sigma U^\top U \Sigma V^\top = V\Sigma^2 V^\top,$$
        which is an eigendecomposition with eigenvalues $\sigma_i^2$. Hence
        $$\kappa_2(X^\top X) = \frac{\sigma_1^2}{\sigma_p^2}
          = \left(\frac{\sigma_1}{\sigma_p}\right)^2 = \kappa_2(X)^2.$$
        A backward-stable solve of $A\beta = c$ satisfies
        $$\frac{\|\hat\beta - \beta\|}{\|\beta\|} \lesssim \kappa(A)\,\epsilon,$$
        so the normal equations give $\kappa(X)^2\epsilon$ while QR, which works
        on $X$ directly, gives $\kappa(X)\epsilon$.
      prose: >-
        Squaring turns 10^6 into 10^12, and since float64 carries about 15.7
        digits, that is the difference between 10 correct digits and 3.7. The
        measured errors in the table above follow this prediction with a
        log-log slope of 1.94 rather than 2.0, because the bound is worst-case
        and the constant matters.

  implementations:
    - language: python
      title: "The textbook estimator — and the exact conditions under which it is wrong"
      note: >-
        This implementation is NUMERICALLY WRONG for kappa(X) above roughly
        10^4, and it fails outright on a duplicated column. It is included
        because it is the version in every textbook and the version people
        write by default — run it and look at the error column before deciding
        it is fine. On the 120x3 design below it produces 6.0e-6 relative error
        at kappa = 1e6 where QR produces 7.6e-12, and 3.6e-2 at kappa = 1e8, at
        which point no digit of beta-hat is correct. The function itself is
        correct algebra; the arithmetic is not.
      code: |
        import numpy as np

        def fit_normal_equations(X, y):
            """Solve (X^T X) beta = X^T y exactly as written.

            NUMERICALLY WRONG when kappa(X) is large: forming X^T X squares the
            condition number, so the relative error is bounded by kappa(X)^2 * eps
            rather than kappa(X) * eps. Raises LinAlgError on a rank-deficient X.
            """
            X = np.asarray(X, dtype=float)
            y = np.asarray(y, dtype=float)
            XtX = X.T @ X
            Xty = X.T @ y
            return np.linalg.solve(XtX, Xty)

        def make_design(n=120, p=3, kappa=1e6, seed=7):
            """A design matrix with a prescribed condition number."""
            rng = np.random.default_rng(seed)
            U, _ = np.linalg.qr(rng.normal(size=(n, p)))
            V, _ = np.linalg.qr(rng.normal(size=(p, p)))
            s = np.array([1.0, 1.0 / np.sqrt(kappa), 1.0 / kappa])
            return U @ np.diag(s) @ V.T

        if __name__ == "__main__":
            beta_true = np.array([1.5, -0.8, 2.2])
            for k in (1e2, 1e4, 1e6, 1e8):
                X = make_design(kappa=k)
                y = X @ beta_true + 0.01 * np.random.default_rng(1).normal(size=120)
                b_ne = fit_normal_equations(X, y)
                b_qr = np.linalg.lstsq(X, y, rcond=None)[0]
                gap = np.linalg.norm(b_ne - b_qr) / np.linalg.norm(b_qr)
                print(f"kappa={np.linalg.cond(X):9.2e}  "
                      f"cond(XtX)={np.linalg.cond(X.T @ X):9.2e}  "
                      f"normal-vs-QR gap={gap:.2e}")
    - language: python
      title: "The stable fit, plus the diagnostics that the solver cannot give you"
      note: >-
        QR removes the numerical error, not the interpretive one. On the
        collinear pair below it returns a standard error 9.4x larger than an
        orthogonal design would give and a coefficient whose sign contradicts
        the marginal trend — correctly, and uselessly. Nothing in this function
        can fix that; only dropping a feature or adding a prior does. Note also
        that `np.linalg.cond` is called on X and never on X.T @ X: asking for
        the condition number of the Gram matrix requires forming it.
      code: |
        import numpy as np

        def fit_qr(X, y):
            """Least squares via Householder QR: error O(kappa(X) * eps), not kappa^2.

            Returns the coefficients, the residuals, and the hat-matrix diagonal.
            """
            X = np.asarray(X, dtype=float)
            y = np.asarray(y, dtype=float)
            Q, R = np.linalg.qr(X, mode="reduced")
            z = Q.T @ y
            p = R.shape[0]
            beta = np.zeros(p)
            for i in range(p - 1, -1, -1):          # back substitution
                beta[i] = (z[i] - R[i, i + 1:] @ beta[i + 1:]) / R[i, i]
            resid = y - X @ beta
            leverage = (Q ** 2).sum(axis=1)          # diag(X (X^T X)^-1 X^T)
            return beta, resid, leverage

        def standard_errors(X, y, beta, resid):
            """s^2 (X^T X)^-1 -- computed from R, never from an explicit inverse."""
            n, p = X.shape
            s2 = float(resid @ resid) / (n - p)
            _, R = np.linalg.qr(X, mode="reduced")
            Rinv = np.linalg.inv(R)
            cov = s2 * (Rinv @ Rinv.T)               # == s2 * (X^T X)^-1
            return np.sqrt(np.diag(cov)), s2

        def vif(X):
            """Variance inflation factor per column: 1 / (1 - R_j^2).

            Regressing each column on the others is the robust route. Inverting
            the correlation matrix is not: it raises LinAlgError on the exact
            case you most want a number for.
            """
            X = np.asarray(X, dtype=float)
            n, p = X.shape
            out = []
            for j in range(p):
                A = np.column_stack([np.ones(n), np.delete(X, j, axis=1)])
                b = np.linalg.lstsq(A, X[:, j], rcond=None)[0]
                r = X[:, j] - A @ b
                tss = float(((X[:, j] - X[:, j].mean()) ** 2).sum())
                unexplained = float(r @ r) / tss if tss > 0 else 0.0
                out.append(float("inf") if unexplained < 1e-12 else 1.0 / unexplained)
            return out

        if __name__ == "__main__":
            rng = np.random.default_rng(11)
            n = 200
            x1 = rng.normal(size=n)
            x2 = 0.995 * x1 + 0.1 * rng.normal(size=n)
            X = np.column_stack([np.ones(n), x1, x2])
            y = X @ np.array([1.0, 2.0, -3.0]) + 0.3 * rng.normal(size=n)
            beta, resid, h = fit_qr(X, y)
            se, s2 = standard_errors(X, y, beta, resid)
            print("kappa(X) =", np.linalg.cond(X))        # 18.7 -- unremarkable
            print("beta     =", beta)                     # (0.99, 1.95, -2.90)
            print("se       =", se)
            print("VIF      =", vif(X[:, 1:]))            # about 88 for both

  checkpoints:
    - id: cp-1
      question: "You have a design matrix with $\\kappa(X) = 10^6$ in float64. How many digits of $\\hat\\beta$ survive if you solve the normal equations, and how many if you use QR?"
      answerKind: short_text
      hint: "The bound is $\\kappa \\cdot \\epsilon$ for a backward-stable solve, and float64 has $\\epsilon = 2.22 \\times 10^{-16}$ — about 15.7 decimal digits."
      solution: >-
        Normal equations: the effective condition number is $\kappa(X)^2 =
        10^{12}$, so the bound is $10^{12} \times 2.22 \times 10^{-16} =
        2.2 \times 10^{-4}$ — about 3.7 digits. QR: $10^6 \times 2.22 \times
        10^{-16} = 2.2 \times 10^{-10}$ — about 9.7 digits. Measured on a
        $120 \times 3$ design at $\kappa = 10^6$: $6.0 \times 10^{-6}$ for
        the normal equations (5.2 digits) and $7.6 \times 10^{-12}$ (11.1
        digits) for QR. The bound is worst-case, so the measured numbers are
        better — but the 5-to-6-digit gap between the two methods is real and
        reproducible.
    - id: cp-2
      question: "Your fitted model has $R^2 = 0.53$, fitted on 20 rows with 11 parameters including the intercept. How impressed should you be?"
      answerKind: short_text
      hint: "What does $R^2$ average under pure noise, as a function of $n$ and $p$?"
      solution: >-
        Not at all. Under pure noise with an intercept, $\mathbb{E}[R^2] =
        (p-1)/(n-1) = 10/19 = 0.526$. Measured over 200 random datasets with
        $n = 20$ and $p = 11$, the mean was $0.527$. So $R^2 = 0.53$ is exactly
        the noise floor — the model has explained nothing. Increasing $p$ to 17
        would push the noise floor to $0.842$, and $p = 20$ gives $R^2 =
        1.000$ on pure noise. Report adjusted $R^2$: $1 -
        (\text{RSS}/(n-p))/(\text{TSS}/(n-1))$, which is centred near zero
        under the null.
    - id: cp-3
      question: "Two features have correlation $0.9943$ and the model is stable with $\\kappa(X) = 18.7$. Is collinearity a problem here?"
      answerKind: short_text
      hint: "Conditioning and collinearity are different questions. What does each one measure?"
      solution: >-
        Yes, but not numerically. $\kappa(X) = 18.7$ says the arithmetic is
        fine; the VIF says the inference is not. $\text{VIF} = 1/(1 - 0.9943^2)
        = 88$, so each standard error is inflated by $\sqrt{88} = 9.4\times$
        relative to an orthogonal design. Measured on 200 rows: the partial
        coefficient on $x_1$ was $+1.951$ ($t = 9.36$) while the marginal slope
        of $y$ on $x_1$ alone was $-0.968$ — opposite signs, same data. Both
        numbers are honest; they answer different questions. The model predicts
        fine and the coefficients do not mean what a reader will assume.
    - id: cp-4
      question: "`np.linalg.solve(X.T @ X, X.T @ y)` raises `LinAlgError: Singular matrix`. What does `lstsq` return instead, and is that answer better?"
      answerKind: short_text
      hint: "There are infinitely many $\\beta$ with the same fitted values. Which one does a minimum-norm solver pick?"
      solution: >-
        `lstsq` returns the minimum-norm solution: the one with the smallest
        $\|\beta\|_2$ among all exact minimisers. With the column $2x$
        appended to $x$, the model's slope of $1.98$ is carried as $0.396$ on
        $x$ plus $0.792$ on $2x$ — a split decided by the pivoting, not by the
        data. It is not "better"; it is a different arbitrary choice. On
        the same data, predictions and $R^2$ are identical for every minimiser.
        If you only predict, that is fine. If you report coefficients, the
        model is unidentified and no solver can rescue it.
    - id: cp-5
      question: "Why is $\\sum_i h_{ii}$ exactly $p$, and what would it mean if your computed leverages summed to $p - 1$?"
      answerKind: short_text
      hint: "The trace of a projection equals the dimension of the subspace it projects onto."
      solution: >-
        $H = X(X^\top X)^{-1}X^\top$ projects onto a $p$-dimensional subspace,
        and the trace of a projection matrix equals that dimension:
        $\operatorname{tr}(H) = \operatorname{tr}(X(X^\top X)^{-1}X^\top) =
        \operatorname{tr}((X^\top X)^{-1}X^\top X) = \operatorname{tr}(I_p) =
        p$. Measured: $3.000000000000001$ at $n=200, p=3$ and
        $7.000000000000001$ at $n=12, p=7$. A sum of $p-1$ means the design
        matrix has rank $p-1$ — one column is redundant, and the fit has fewer
        effective parameters than you think.
    - id: cp-6
      question: "With an intercept in the model, the residuals always sum to zero. Why, and which column of $X$ forces it?"
      answerKind: short_text
      hint: "The residuals are orthogonal to every column of $X$ — including the one that is all ones."
      solution: >-
        $X^\top r = 0$ means $r$ is orthogonal to each column. The intercept
        column is $\mathbf{1}$, so $\mathbf{1}^\top r = \sum_i r_i = 0$. That
        is a property of the projection, not of the data: measured on a 200-row
        fit, the residuals summed to $1.5 \times 10^{-13}$. Drop the intercept
        and this vanishes — the residuals can then sum to anything, and
        $R^2$ computed "about the mean" can even go negative. This is why
        omitting an intercept is not a neutral simplification.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A fitted regression is a projection of the response onto the space
        spanned by your columns. There are two completely separate ways for that
        projection to fail, and they need different tools. The *numerical* one:
        the route you take to compute the projection may be much more sensitive
        to rounding than the projection itself, because squaring a matrix
        squares its condition number. The *statistical* one: the projection is
        unique and stable, but the coefficient you read off it may be
        unidentifiable because another column already says almost the same
        thing.
      blocks:
        - kind: checklist
          body: |
            - Numerical axis: does the arithmetic survive? Measured by kappa(X).
            - Statistical axis: do the coefficients mean anything? Measured by VIF and standard errors.
            - These are independent. A design can be well-conditioned and useless, or ill-conditioned and unambiguous.
            - Every fix on one axis does nothing for the other.
      checkpoint: >-
        Before reading on: if a design matrix has a perfectly conditioned
        Gram matrix but two columns that are 0.995 correlated, which of the two
        axes is failing? What number would you look at to prove it?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Measure before you choose. Compute $\kappa(X)$ from an SVD of $X$ —
        never from $X^\top X$, because forming it is the thing you are trying
        to avoid — and let that number pick the solver. Then compute VIF for
        every feature, which is a separate diagnostic answering a separate
        question. QR or SVD is the right default solver; the normal equations
        are only defensible when you have measured $\kappa < 10^4$ and can say
        so.
      blocks:
        - kind: checklist
          body: |
            - kappa(X) < 1e4  -> normal equations are fine, and you can say why
            - 1e4 to 1e8      -> QR or SVD; the normal equations lose 8+ digits
            - kappa > 1e8     -> regularise or drop columns; even QR is at its limit
            - VIF > 5         -> investigate that feature
            - VIF > 10        -> the coefficient is not interpretable; drop, combine, or regularise
      checkpoint: >-
        Why does the threshold sit at $10^4$ rather than at $10^8$? What does
        $\kappa = 10^4$ cost you in a float64 solve, in digits?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The shape of a defensible fit: standardise, measure, choose, solve,
        then diagnose. The order matters — the solver choice depends on a
        number you have to compute first.
      blocks:
        - kind: pseudocode
          body: |
            # 1. Condition the problem
            X = hstack([ones(n, 1), standardise(features)])
            kappa = svd(X).max_singular / svd(X).min_singular

            # 2. Pick the solver from the measurement
            if kappa < 1e4:  beta = solve(X.T @ X, X.T @ y)
            else:            beta = qr_solve(X, y)        # or lstsq / svd

            # 3. Diagnose the fit
            resid    = y - X @ beta
            leverage = row_sums(Q ** 2)                  # diag of the hat matrix
            se       = sqrt(diag(s2 * inv(X.T @ X)))     # computed from R, not by inverting
            vif      = [1 / (1 - r2_of_column_j_on_the_rest) for each j]

            # 4. Report
            print(adjusted_r2, se, n, p, max(leverage), max(vif))
      checkpoint: >-
        Step 1 standardises the features but not the intercept column. Why
        would standardising the intercept be a mistake, and what would it do to
        the model?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The whole numerical story is one line of SVD algebra plus the standard
        perturbation bound. If you can reproduce these three lines you can
        answer any question about why the normal equations fail.
      blocks:
        - kind: math
          body: |
            With $X = U\Sigma V^\top$ and $\Sigma = \operatorname{diag}(\sigma_1, \dots, \sigma_p)$:

            $$X^\top X = V\Sigma U^\top U \Sigma V^\top = V\Sigma^2 V^\top$$

            so the eigenvalues of the Gram matrix are $\sigma_i^2$, and

            $$\kappa(X^\top X) = \frac{\sigma_1^2}{\sigma_p^2} = \kappa(X)^2.$$

            A backward-stable solve of $A\beta = c$ gives
            $\|\hat\beta - \beta\|/\|\beta\| \lesssim \kappa(A)\epsilon$, hence

            $$\text{normal equations}: \kappa(X)^2\epsilon, \qquad
              \text{QR}: \kappa(X)\epsilon.$$

            At $\kappa(X) = 10^6$ and $\epsilon = 2.22 \times 10^{-16}$:
            $\kappa^2\epsilon = 2.2 \times 10^{-4}$ — 3.7 correct digits out of 15.7.
        - kind: warning
          body: >-
            The bound is worst-case, and the measured error at $\kappa = 10^6$
            was $6.0 \times 10^{-6}$ — better than the bound by a factor of 37.
            Do not conclude the bound is wrong. Conclude that a worst-case
            analysis of a real matrix tells you the order of the failure, not
            its exact size.
      checkpoint: >-
        If $\kappa(X) = 10^3$, the normal equations give a bound of
        $2.2 \times 10^{-10}$. Is that good enough? It depends entirely on
        what you are going to do with $\hat\beta$ — say what changes the
        answer.
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete diagnostic-and-fit routine, with the reasoning for each
        choice and an explicit statement of what it still cannot fix.
      blocks:
        - kind: warning
          body: >-
            Read the diagnostics before the code. The important line in this
            implementation is not the solve — it is the three numbers printed
            afterwards, because they are what tells you whether the solve
            meant anything.
        - kind: code
          language: python
          body: |
            import numpy as np

            def diagnose(X, y):
                X = np.asarray(X, float)
                y = np.asarray(y, float)
                n, p = X.shape

                # 1. Conditioning of the object the solver will actually see.
                sv = np.linalg.svd(X, compute_uv=False)
                kappa = float(sv[0] / sv[-1]) if sv[-1] > 0 else float("inf")

                # 2. Solve the well-conditioned way, unconditionally.
                #    lstsq is QR/SVD-backed and returns the minimum-norm
                #    solution for a rank-deficient X instead of raising.
                beta = np.linalg.lstsq(X, y, rcond=None)[0]
                resid = y - X @ beta
                rss = float(resid @ resid)

                # 3. Leverage from Q, never from an explicit inverse.
                Q, R = np.linalg.qr(X, mode="reduced")
                h = (Q ** 2).sum(axis=1)

                # 4. Standard errors from R^-1, which is cheap and stable.
                dof = n - p
                s2 = rss / dof if dof > 0 else float("nan")
                try:
                    Rinv = np.linalg.inv(R)
                    se = np.sqrt(np.diag(s2 * (Rinv @ Rinv.T)))
                except np.linalg.LinAlgError:
                    se = np.full(p, np.nan)      # rank-deficient: no unique SE

                return {
                    "beta": beta, "resid": resid, "leverage": h,
                    "se": se, "sigma2": s2,
                    "kappa": kappa,
                    "digits_left": float(np.log10(1.0 / (kappa ** 2 * 2.22e-16)))
                                    if kappa > 0 else 0.0,
                }

            # Interpretation rules, in order of what kills you first:
            #   kappa > 1e8            -> the fit is not recoverable; regularise.
            #   digits_left < 3        -> do not trust the last reported digit.
            #   max(h) > 2*p/n         -> one row is driving the fit; inspect it.
            #   any(se > |beta| / 2)   -> that coefficient is not identified.
            #   R^2 without n and p    -> not a number, an advertisement.
      checkpoint: >-
        `diagnose` returns `digits_left` as $\log_{10}(1/(\kappa^2\epsilon))$.
        For a design with $\kappa = 10^6$ that is 3.65 — but the function
        solves with `lstsq`, not the normal equations, so its own answer is
        accurate to 11 digits. What is the number for, then, and why report it
        alongside a fit it does not describe?

  problems:
    - id: p-stable-ols
      title: "Least squares that survives an ill-conditioned design"
      difficulty: medium
      prompt: >-
        Implement `solve(X, y)` returning the least-squares coefficient vector
        for a full-rank design matrix $X$ (an $n \times p$ array, intercept
        column already included) and response $y$. Use a method whose error is
        bounded by $\kappa(X)\epsilon$ rather than $\kappa(X)^2\epsilon$ — do
        not form $X^\top X$. Return a plain list of $p$ floats.

        The third test case has $\kappa(X) = 8.4 \times 10^4$ and coefficients
        of magnitude 26; a normal-equations implementation misses it at this
        tolerance by a factor of about 90.
      starter: |
        import numpy as np

        def solve(X, y):
            # your implementation here
            pass
      language: python
      entry: solve
      testCases:
        - input: "[[[1,0],[1,1],[1,2],[1,3]], [1,3,5,7]]"
          expected: "[1.0, 2.0]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,1],[1,2],[1,3]], [1,2,2]]"
          expected: "[0.6666666666666666, 0.5]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,1,1],[1,2,2.0001],[1,3,2.9999],[1,4,4.0002],[1,5,4.9998],[1,6,6.0001],[1,7,6.9999],[1,8,8]], [2,4.1,5.9,8.2,10.1,11.8,14.2,15.9]]"
          expected: "[0.05819672131140888, 26.58278688367361, -24.590163932853923]"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def solve(X, y):
            X = np.asarray(X, dtype=float)
            y = np.asarray(y, dtype=float)
            # Householder QR: X = QR with Q orthonormal. The least-squares
            # solution solves R beta = Q^T y, and R keeps kappa(X) rather than
            # kappa(X)^2 -- which is the entire point.
            Q, R = np.linalg.qr(X, mode="reduced")
            z = Q.T @ y
            p = R.shape[0]
            beta = np.zeros(p)
            for i in range(p - 1, -1, -1):
                beta[i] = (z[i] - R[i, i + 1:] @ beta[i + 1:]) / R[i, i]
            return beta
      solutionExplanation: >-
        The QR route never forms $X^\top X$, so the conditioning it experiences
        is $\kappa(X)$ rather than $\kappa(X)^2$. On the third case
        ($\kappa = 8.4 \times 10^4$, $\kappa(X^\top X) = 7.1 \times 10^9$)
        this returns the coefficients to $2.0 \times 10^{-11}$ relative error,
        while `np.linalg.solve(X.T @ X, X.T @ y)` is off by $9.5 \times
        10^{-8}$ — passing the first two cases and failing the third, which is
        exactly the failure mode this problem is built to expose. Note the
        coefficients themselves: $26.58$ and $-24.59$ nearly cancel. That
        near-cancellation is the signature of an ill-conditioned design, and it
        is visible in the answer before you ever compute a condition number.
      complexity: "O(np^2) time for the QR factorisation, O(p^2) for back substitution"
      tags: [least-squares, qr, conditioning, numerical-stability]

    - id: p-leverage
      title: "Leverage without inverting anything"
      difficulty: medium
      prompt: >-
        Implement `solve(X)` returning the diagonal of the hat matrix
        $H = X(X^\top X)^{-1}X^\top$ for a full-rank design matrix $X$.
        Return a list of $n$ floats in $[0, 1]$.

        Compute it from the thin QR factorisation, not from an explicit inverse:
        if $X = QR$ then $H = QQ^\top$, so $h_{ii}$ is the squared norm of row
        $i$ of $Q$. The values must sum to $p$; the third case has one row with
        leverage above 0.9.
      starter: |
        import numpy as np

        def solve(X):
            # your implementation here
            pass
      language: python
      entry: solve
      testCases:
        - input: "[[[1,0],[1,1],[1,2],[1,3]]]"
          expected: "[0.7, 0.3, 0.3, 0.7]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,1,0],[1,2,1],[1,3,4],[1,4,9],[1,5,16],[1,6,25]]]"
          expected: "[0.8214285714285721, 0.30714285714285744, 0.3714285714285712, 0.37142857142857116, 0.3071428571428574, 0.8214285714285716]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,0],[1,1],[1,2],[1,3],[1,10]]]"
          expected: "[0.36305732484076436, 0.27707006369426745, 0.2229299363057324, 0.20063694267515916, 0.9363057324840767]"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def solve(X):
            X = np.asarray(X, dtype=float)
            # H = X (X^T X)^-1 X^T = Q Q^T for the thin QR factorisation,
            # so h_ii is just the squared norm of row i of Q.
            Q, _ = np.linalg.qr(X, mode="reduced")
            return (Q ** 2).sum(axis=1)
      solutionExplanation: >-
        Forming $H$ explicitly is $O(n^2 p)$ and numerically worse; the QR route
        is $O(np^2)$ and needs one array of size $n \times p$. Because $Q$ has
        orthonormal columns, $\sum_i h_{ii} = \|Q\|_F^2 = p$, so the third
        case sums to exactly 2 — and the point at $x = 10$ carries $h = 0.936$,
        meaning 94% of its own fitted value comes from itself. In simple linear
        regression $h_{ii} = 1/n + (x_i - \bar x)^2/S_{xx}$, which is why the
        first case is symmetric: $0.25 \pm (x - 1.5)^2/5$ gives
        $(0.7, 0.3, 0.3, 0.7)$. Leverage is a property of $X$ alone, so it
        flags a row before you know its $y$ — and it cannot see a bad $y$ at
        all.
      complexity: "O(np^2) time, O(np) space"
      tags: [leverage, hat-matrix, qr, influence]

    - id: p-vif
      title: "Variance inflation, including the degenerate case"
      difficulty: hard
      prompt: >-
        Implement `solve(X)` returning the variance inflation factor for each
        column of a predictor matrix $X$ (an $n \times p$ array *without* an
        intercept; every column is non-constant). For column $j$, regress
        $X_{:,j}$ on the remaining columns plus an intercept, take the $R^2$ of
        that regression, and return $1/(1 - R^2)$.

        Return `float('inf')` when the column is (numerically) exactly
        reproducible from the others — the fourth case duplicates a column, and
        inverting the correlation matrix there raises `LinAlgError`, which is
        why the regression route is the right one.
      starter: |
        import numpy as np

        def solve(X):
            # your implementation here
            pass
      language: python
      entry: solve
      testCases:
        - input: "[[[-1,-1],[-1,1],[1,-1],[1,1]]]"
          expected: "[1.0, 1.0]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,1],[2,3],[3,2],[4,4]]]"
          expected: "[2.7777777777777772, 2.7777777777777772]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,0,1],[2,1,3],[3,0,4],[4,1,2],[5,2,7],[6,3,5]]]"
          expected: "[5.135869565217392, 4.085144927536232, 2.2318840579710164]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1,1],[2,2],[3,3],[4,4]]]"
          expected: "[Infinity, Infinity]"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def solve(X):
            X = np.asarray(X, dtype=float)
            n, p = X.shape
            out = []
            for j in range(p):
                others = np.delete(X, j, axis=1)
                A = np.column_stack([np.ones(n), others])
                coef = np.linalg.lstsq(A, X[:, j], rcond=None)[0]
                resid = X[:, j] - A @ coef
                rss = float(resid @ resid)
                centred = X[:, j] - X[:, j].mean()
                tss = float(centred @ centred)
                # R^2 = 1 - rss/tss, so 1 - R^2 = rss/tss and VIF = tss/rss.
                # Guard the degenerate case before dividing: an exactly
                # reproducible column has rss at the floating-point floor.
                if tss <= 0.0 or rss / tss < 1e-12:
                    out.append(float("inf"))
                else:
                    out.append(tss / rss)
            return out
      solutionExplanation: >-
        $1 - R_j^2$ is exactly $\text{RSS}/\text{TSS}$ for the auxiliary
        regression, so the VIF is $\text{TSS}/\text{RSS}$ and needs no explicit
        $R^2$ computation. The regression route also handles the case that
        kills the textbook one: with a duplicated column the correlation matrix
        is singular and `np.linalg.inv` raises, while the auxiliary regression
        simply has RSS at the rounding floor and reports infinity. The
        orthogonal case gives exactly 1 — the definition of no inflation — and
        the $r = 0.8$ case gives $1/(1 - 0.64) = 25/9 = 2.777\ldots$ in both
        columns, which is the symmetry you expect. Read the third case before
        the numbers: VIFs of 5.1, 4.1 and 2.2 mean the standard errors are
        inflated by 2.3x, 2.0x and 1.5x, so a coefficient that looks
        significant at $t = 2$ is not.
      complexity: "O(p) least-squares solves of size n x p, so O(np^3) overall"
      tags: [collinearity, vif, diagnostics, rank-deficiency]

  try_it: >-
    On a design with $\kappa(X) = 10^8$ — two nearly identical columns will do it
    — fit with `np.linalg.solve(X.T @ X, X.T @ y)` and with `np.linalg.lstsq(X, y)`,
    then print both coefficient vectors side by side. Check that $X^\top r \approx 0$
    for each, and decide which one you would ship before you look at the true
    coefficients.
  interview_questions:
    - question: "Why is least squares a projection, and what does that imply about the residual?"
      level: mid
      key_points:
        - "$\\hat y = X\\hat\\beta$ is the orthogonal projection of $y$ onto $\\operatorname{col}(X)$, so only the part of $y$ inside that subspace is explainable."
        - "Orthogonality means $X^\\top r = 0$ exactly: the residual is perpendicular to every column, which is the geometric content of the normal equations."
        - "That is why adding a column can only reduce the residual — the subspace grows, and a larger subspace contains a closer point."
        - "It also explains $R^2$ as a squared cosine, and why $R^2$ cannot compare models with different column counts."
      follow_up: "The residual is orthogonal to the columns but not to the true noise. What does that tell you about using residuals to diagnose a model?"
    - question: "Your fit reports $R^2 = 0.98$ but one coefficient has the wrong sign. What happened?"
      level: senior
      key_points:
        - "Collinearity, not a bug: with $\\operatorname{corr}(x_1, x_2) = 0.9943$ over 200 rows, the partial coefficient on $x_1$ was $+1.951$ while the marginal slope was $-0.968$ on the same data."
        - "The variance inflation factor quantifies it, and a VIF of 88 says the coefficient is estimated from a sliver of independent variation."
        - "Predictions stay accurate because the fitted values depend only on the column space, which barely changes as the coefficients swing."
        - "The remedies change what you are estimating: drop or combine the collinear pair, or use ridge, which stabilises the direction collinearity destroyed."
      follow_up: "Ridge fixes the coefficient instability. What does it do to your ability to say which feature matters?"
    - question: "What does the diagonal of the hat matrix tell you, and what must it sum to?"
      level: mid
      key_points:
        - "$h_{ii} = x_i^\\top (X^\\top X)^{-1} x_i$ is the leverage of row $i$, lies in $[0, 1]$, and measures how much that row pulls the fit toward itself."
        - "The trace identity $\\sum_i h_{ii} = p$ holds exactly — measured $3.000000000000001$ at $n = 200, p = 3$ — so average leverage is $p/n$."
        - "Leverage is computable before you look at $y$, so it tells you which rows own the fit independently of the response."
        - "High leverage is not the same as an outlier: a point can be influential on the fit while sitting close to the trend."
  common_mistakes:
    - "Comparing models by $R^2$, which is monotone in the parameter count — under pure noise $E[R^2] = (p-1)/(n-1)$, reaching exactly 1.000 at $p = n$."
    - "Reading coefficients as effects when two features correlate 0.9943, where the partial coefficient can carry the opposite sign to the marginal slope."
    - "Trusting a high $R^2$ on a design with $\\kappa(X) = 10^8$, where the coefficients are 3.6% wrong and nothing raises an exception."
  further_reading:
    - label: "Golub & Van Loan, Matrix Computations, 4th edition, Chapter 5"
    - label: "Belsley, Kuh & Welsch, Regression Diagnostics: Identifying Influential Data and Sources of Collinearity"
