id: clustering
slug: clustering
title: "k-means Is a Gaussian Mixture That Believes Every Cluster Is a Ball"
summary: >-
  Learn why k-means is a spherical-covariance model in disguise, why inertia can
  never tell you the number of clusters, and how a Gaussian mixture recovers the
  structure k-means destroys.
kind: lesson
difficulty: medium
position: 10
estMinutes: 17
prerequisites: [probability-distributions, maximum-likelihood-bayesian]
phase: classical-models
tags: [clustering, kmeans, gmm, silhouette, unsupervised]

body:
  big_idea: >-
    k-means is maximum likelihood under a Gaussian mixture with identical spherical
    covariances, so it assumes every cluster is a ball of the same size, fails where
    that is false, and never learns $k$.

  problem:
    - "You run k-means, get clean-looking clusters, and never learn the algorithm imposed a shape on your data rather than finding one."
    - "You use the elbow method, but inertia falls monotonically from 11,339 at $k=2$ to 1,238 at $k=6$: there is no elbow to find."
    - "You cluster customers and get two groups split by whichever variable has the largest variance, because k-means minimises squared distance."

  analogy: |
    Sort a pile of stones into groups by weight, where each group's
    representative is its average weight and every stone joins the nearest. That
    works when groups really are clumps of similar weight. Now mix pebbles and
    boulders: the averaging rule pulls the boulder representative toward the
    middle, so the wide group splits while a pebble subgroup merges with the
    boulders.

  concept_points:
    - "**k-means is a Gaussian mixture with a fixed, shared covariance.** Write the GMM likelihood with $\\Sigma_j = \\sigma^2 I$ for every $j$ and take the hard-assignment limit $\\sigma \\to 0$: the E-step becomes 'assign to the nearest centroid' and the M-step 'set the centroid to the mean'. Every limitation of k-means follows from that one substitution, and it tells you which data will break it."
    - "**Inertia decreases monotonically in $k$, so it cannot choose $k$.** Measured on three well-separated blobs: 11,339.58 at $k=2$, 1,786.34 at $k=3$, 1,238.27 at $k=6$, and exactly 0 at $k=n$. Silhouette does have a maximum — 0.5175 at $k=2$, **0.7661 at $k=3$**, 0.6147 at $k=4$ — because it penalises over-splitting. It costs $O(n^2)$, but it answers the question inertia cannot."
    - "**k-means splits elongated clusters along the wrong axis, and it is not subtle.** On two blobs genuinely separated in $x$ but 8× more spread in $y$, k-means returned centroids at $y = -6.98$ and $y = +5.66$ with $x$ almost identical: it cut along the long axis, producing two clusters that each mix both true groups. Silhouette 0.5015."
    - "**Initialisation changes the answer, and k-means++ only halves the problem.** Twenty restarts at $k=6$: random init spanned inertia 1,179.30 to 1,422.26, a range of 243; k-means++ spanned 1,179.23 to 1,290.96, a range of 111.7. k-means++ samples the next centroid with probability proportional to $D^2$, avoiding two centroids in one blob, but it does not guarantee the global optimum."
    - "**Scaling the features is not preprocessing, it is part of the model.** Because k-means minimises squared Euclidean distance, a feature measured in thousands contributes a million times more to the objective than one measured in single digits. Without standardising you are clustering on whichever column happens to have the largest units."
    - "**A mixture models density, not distance.** Each component gets its own covariance $\\Sigma_j$, so clusters can be elongated and differently sized, and assignments become soft responsibilities rather than hard labels. k-means assigns every point to some cluster no matter how far away; a GMM assigns a probability, so an outlier in a low-density gap can be called improbable. The cost is $O(kd^2)$ and singular-covariance risk."

  definitions:
    - { term: "Inertia (within-cluster sum of squares)", meaning: "$\\sum_i \\|x_i - \\mu_{c(i)}\\|^2$. Monotonically non-increasing in $k$, reaching 0 at $k=n$ — which is why it cannot select $k$." }
    - { term: "Silhouette coefficient", meaning: "$(b - a)/\\max(a,b)$ where $a$ is mean distance to own-cluster points and $b$ the mean distance to the nearest other cluster. Ranges $[-1, 1]$; averages over points." }
    - { term: "Hard vs soft assignment", meaning: "k-means gives each point one label; a GMM gives a responsibility vector $\\gamma_{ij}$ summing to 1 across components." }
    - { term: "Responsibility $\\gamma_{ij}$", meaning: "The posterior probability that point $i$ was generated by component $j$ — the E-step of EM." }
    - { term: "EM algorithm", meaning: "Alternate computing responsibilities (E) and maximising expected complete-data likelihood (M). k-means is EM with hard responsibilities and fixed spherical covariance." }
    - { term: "k-means++", meaning: "Initialisation that samples each next centroid with probability $\\propto D^2$, the squared distance to the nearest chosen centroid. Reduces (does not eliminate) bad local optima." }
    - { term: "BIC", meaning: "$-2\\log L + p\\log n$. Penalises parameter count, so it can compare $k$ for a GMM where inertia cannot." }
    - { term: "Covariance type", meaning: "The constraint on $\\Sigma_j$: spherical, diagonal, tied, or full. Each is a different model with a different number of parameters and a different bias." }
    - { term: "Voronoi partition", meaning: "The regions induced by nearest-centroid assignment. Always convex, which is why k-means cannot produce a non-convex cluster." }
    - { term: "Gap statistic", meaning: "Compares the observed within-cluster dispersion to that of reference data with no cluster structure. A principled alternative to the elbow." }

  diagrams:
    - type: compare
      title: "k-means vs a Gaussian mixture"
      left_label: "k-means"
      left_points:
        - "Assumes identical spherical covariance — every cluster is a same-size ball"
        - "Hard assignment; an outlier is forced into some cluster"
        - "$O(nkd)$ per iteration, few iterations, always terminates"
        - "Cannot represent elongation or unequal sizes"
      right_label: "Gaussian mixture (EM)"
      right_points:
        - "Per-component covariance $\\Sigma_j$ — elongated, rotated, unequal"
        - "Soft responsibilities; a point in a gap can be improbable everywhere"
        - "$O(nkd^2)$ per iteration, more parameters, singular-Σ risk"
        - "Initialise from k-means to avoid bad local optima"
    - type: plot
      title: "Inertia always falls; silhouette peaks at the true k = 3"
      chart: "line"
      xLabel: "k"
      yLabel: "value"
      series:
        - name: "inertia (÷ 1000)"
          points:
            - { x: 2, y: 11.3396 }
            - { x: 3, y: 1.7863 }
            - { x: 4, y: 1.5803 }
            - { x: 5, y: 1.3790 }
            - { x: 6, y: 1.2383 }
        - name: "silhouette × 10"
          points:
            - { x: 2, y: 5.175 }
            - { x: 3, y: 7.661 }
            - { x: 4, y: 6.147 }
            - { x: 5, y: 4.61 }
            - { x: 6, y: 4.666 }
    - type: pipeline
      title: "The recipe that actually works"
      nodes:
        - label: "Standardise every feature"
          note: "z-scores, fit on the data you cluster"
          detail: "Squared Euclidean distance weights a feature by its variance. Unscaled, you cluster on whichever column has the largest units — a dollars column will dominate a years column by four orders of magnitude."
        - label: "Choose k by silhouette or BIC"
          note: "not by the elbow"
          detail: "Inertia is monotone in k, so an 'elbow' is a reading of a curve with no minimum. Silhouette peaked at 0.7661 at the true k=3 while inertia kept falling."
        - label: "Initialise with k-means++"
          note: "and still restart 10-20 times"
          detail: "Measured, k-means++ halved the inertia spread across 20 restarts (243.0 → 111.7) but did not eliminate it. Keep the best restart by inertia."
        - label: "Inspect the cluster shapes"
          note: "plot the covariance of each"
          detail: "If the clusters are elongated or unequal, k-means has imposed a shape. Switch to a GMM with full covariance, initialised from the k-means solution."
        - label: "Name each cluster in domain terms"
          note: "a cluster is not a result until it means something"
          detail: "A number in a column is not an insight. If you cannot describe the cluster to a stakeholder in one sentence, the clustering has not found anything they can use."
    - type: architecture
      title: "Where clustering sits in a real pipeline"
      nodes:
        - { id: raw, x: 0, y: 0, label: "Raw features", kind: client, detail: "Unscaled, possibly skewed. Log-transform heavy-tailed columns before standardising, or one column will own the distance." }
        - { id: scale, x: 1, y: 0, label: "Scale", kind: server, detail: "StandardScaler fitted on the clustering data. Fitting on all data including a later holdout is the leakage version of this bug." }
        - { id: km, x: 2, y: 0, label: "k-means / GMM", kind: model, detail: "k-means for speed and spherical clusters; GMM when shape matters. GMM initialised from k-means is the standard recipe." }
        - { id: labels, x: 2, y: 2, label: "Cluster assignment", kind: database, detail: "For a GMM keep the responsibilities, not just the argmax — the uncertainty is often the useful part." }
        - { id: prof, x: 3, y: 0, label: "Profile", kind: worker, detail: "Describe each cluster by its distinguishing features, not its centroid. The centroid of a mixed cluster describes nobody." }
        - { id: act, x: 3, y: 2, label: "Downstream use", kind: external, detail: "Segmentation, anomaly flagging, or as a feature for a supervised model. If it feeds a model, the clusterer must be fit inside the CV fold." }
      edges:
        - { from: raw, to: scale, label: "standardise" }
        - { from: scale, to: km }
        - { from: km, to: labels, label: "argmax / responsibilities" }
        - { from: labels, to: prof, label: "describe" }
        - { from: prof, to: act }
        - { from: km, to: act, label: "as a feature", style: "async" }
    - type: stack
      title: "What each k-selection method assumes"
      layers:
        - "Elbow on inertia — assumes a visible knee exists; inertia is monotone, so often none does"
        - "Silhouette — assumes convex, roughly equal-density clusters"
        - "BIC on a GMM — assumes the mixture model is correctly specified"
        - "Gap statistic — assumes a sensible reference distribution"
        - "Domain knowledge — assumes you know what a cluster should mean, which is usually the strongest assumption available"

  markdown: |
    ## The k-means identity worth memorising

    k-means is maximum likelihood under

    $$p(x) = \sum_{j=1}^{k} \pi_j \, \mathcal{N}(x; \mu_j, \sigma^2 I)$$

    in the limit $\sigma \to 0$, with $\pi_j$ uniform. Every awkward property of
    the algorithm is a consequence of that one line:

    | Consequence | Why |
    |---|---|
    | Clusters are spherical | $\Sigma = \sigma^2 I$ has no off-diagonals and one shared scale |
    | Clusters are equal size | every component shares the same $\sigma^2$ |
    | Assignment is hard | $\sigma \to 0$ makes responsibilities 0 or 1 |
    | Regions are convex | nearest-centroid assignment induces a Voronoi partition |
    | An outlier must join something | hard assignment has no "none of these" option |

    ## Why the elbow method cannot work

    Measured on three well-separated blobs ($n = 900$):

    | $k$ | Inertia | Silhouette |
    |---|---|---|
    | 2 | 11,339.58 | 0.5175 |
    | **3** | **1,786.34** | **0.7661** |
    | 4 | 1,580.26 | 0.6147 |
    | 5 | 1,378.98 | 0.4610 |
    | 6 | 1,238.27 | 0.4666 |

    Inertia falls at every step, and would reach exactly **0** at $k = n$. There
    is no minimum to find. The "elbow" is a human reading a slope change in a
    monotonically decreasing curve, and on real data the slope change is often
    a small kink indistinguishable from noise.

    Silhouette has a genuine maximum at the true $k = 3$. It costs $O(n^2)$ and
    it assumes convex clusters — so it is not free either — but it answers the
    question being asked, which inertia does not.

    ## The failure that no amount of tuning fixes

    Two blobs, genuinely separated in $x$ (centres near $x = 0$ and $x = 2$),
    each 8× more spread in $y$ than in $x$. k-means with $k = 2$ returned
    centroids at

    $$\mu_1 \approx (0.68,\,-6.98), \qquad \mu_2 \approx (0.71,\,5.66)$$

    Both centroids sit at essentially the **same $x$**. The algorithm cut the
    data along its long axis, so each resulting cluster is a mixture of both
    genuine groups. Silhouette: 0.5015.

    This is not an initialisation problem and more restarts will not fix it.
    The objective is being minimised correctly — it is the *model* that is
    wrong, because a spherical Gaussian cannot represent a 8:1 elongated blob
    with a single component.

    A GMM with full covariance does not have this failure mode. That is the
    entire reason to use one.

    ## Initialisation: measured, not asserted

    Twenty restarts at $k = 6$ on the blob data:

    | Initialisation | min | max | mean | spread |
    |---|---|---|---|---|
    | random | 1,179.30 | 1,422.26 | 1,279.55 | **242.96** |
    | k-means++ | 1,179.23 | 1,290.96 | 1,239.26 | **111.73** |

    k-means++ more than halves the spread. It does **not** eliminate it — the
    best random restart still beats the worst k-means++ restart. So the honest
    recipe is k-means++ *and* restarts, taking the best inertia.

    And note the convergence: on well-separated data, **3 iterations**. k-means
    is fast because it is simple, not because it is clever.

    ## Where the analogy breaks

    "Clustering finds structure" is the phrase to be suspicious of. Clustering
    finds structure **under a model**, and the model is a choice you made,
    usually by default. Two defensible choices — spherical versus full
    covariance — give different answers on the same data, and neither is wrong.

    Which means the output of a clustering run is not a fact about your data.
    It is a hypothesis, and the test of a hypothesis is whether the clusters
    predict something you did not cluster on.

    ## The longer version

    The remaining mechanisms, verbatim: why three iterations are usually enough,
    and why every cluster number is a claim about the data-generating process
    rather than a fact.

    ### Failure modes, in full

    - You will run k-means, get clean-looking clusters, and never learn that the algorithm imposed a shape on your data rather than finding one in it.
    - You will use the elbow method to choose $k$. Measured here, inertia falls monotonically from 11,339 at $k=2$ to 1,238 at $k=6$ — there is no elbow to find, and any 'elbow' you see is noise in a curve that only goes down.
    - You will cluster customers and get two groups split by a variable that happens to have large variance, not by the distinction you care about — because k-means minimises squared Euclidean distance, and variance is squared distance.
    - Interviewers ask 'when does k-means fail?' expecting the covariance argument, not the phrase 'it assumes spherical clusters'.

    ### The mechanisms, in full

    - **k-means is a Gaussian mixture with a fixed, shared covariance.** If you write the GMM likelihood with $\Sigma_j = \sigma^2 I$ for every $j$ and take the hard-assignment limit $\sigma \to 0$, the E-step becomes 'assign to the nearest centroid' and the M-step becomes 'set the centroid to the mean'. Every limitation of k-means follows from that one substitution, and knowing it tells you which data will break it.
    - **Inertia decreases monotonically in $k$, so it cannot choose $k$.** Measured on three well-separated blobs: 11,339.58 at $k=2$, 1,786.34 at $k=3$, 1,580.26 at $k=4$, 1,378.98 at $k=5$, 1,238.27 at $k=6$. Every added centroid can only reduce the sum of squared distances — at $k=n$ it reaches exactly 0. The 'elbow' is a heuristic for reading a curve that has no minimum, which is why it is unreliable and why silhouette is the better default.
    - **Silhouette does have a maximum, and it finds the right $k$.** Same data: 0.5175 at $k=2$, **0.7661 at $k=3$**, 0.6147 at $k=4$, 0.4610 at $k=5$, 0.4666 at $k=6$. Because silhouette measures separation relative to within-cluster spread rather than absolute distance, over-splitting is penalised instead of rewarded. It is not free — it costs $O(n^2)$ — but it answers the question inertia cannot.
    - **k-means splits elongated clusters along the wrong axis, and it is not subtle.** On two blobs that are genuinely separated in $x$ (centres at $x \approx 0$ and $x \approx 2$) but 8× more spread in $y$, k-means returned centroids at $y = -6.98$ and $y = +5.66$ with $x$ almost identical — it cut the data along its long axis, producing two clusters that are each a mixture of both true groups. Silhouette 0.5015, low for data with obvious structure.
    - **Initialisation changes the answer, and k-means++ only halves the problem.** Twenty restarts at $k=6$: random initialisation spanned inertia 1,179.30 to 1,422.26 (range 243.0); k-means++ spanned 1,179.23 to 1,290.96 (range 111.7). k-means++ samples the next centroid with probability proportional to $D^2$, the squared distance to the nearest chosen centroid, which avoids picking two centroids inside one blob — but it does not guarantee the global optimum, so restarts are still required in practice.
    - **The algorithm converges in surprisingly few steps, and that is the whole appeal.** On the well-separated blobs it converged in **3 iterations** from either initialisation, reaching the identical inertia of 1,786.34. Each iteration is $O(nkd)$ and monotone in the objective, so it always terminates — but it terminates at a *local* optimum, and the guarantee is only that the objective never increases.
    - **Scaling the features is not preprocessing, it is part of the model.** Because k-means minimises squared Euclidean distance, a feature measured in the thousands contributes a million times more to the objective than one measured in single digits. Standardising is not a nicety; without it you are clustering on whichever column happens to have the largest units.
    - **A Gaussian mixture fixes the two assumptions k-means bakes in.** Each component gets its own covariance $\Sigma_j$, so clusters can be elongated and differently sized, and assignments become soft responsibilities $\gamma_{ij}$ rather than hard labels. The cost is more parameters ($O(k d^2)$ instead of $O(kd)$), a real risk of singular covariances, and dependence on a good initialisation — which is why the standard recipe initialises a GMM from k-means.
    - **Density, not distance, is what a mixture actually models.** k-means assigns every point to some cluster no matter how far away it is; a GMM assigns a *probability*, so a point in a low-density gap can legitimately belong to no component strongly. That difference matters the moment your data has outliers or noise between clusters — the outlier that k-means forces into a cluster is one a GMM can call improbable.
    - **Every cluster number is a claim about the data generating process, and none of them is free.** Silhouette, BIC, gap statistic and elbow all encode different assumptions; agreement between them is evidence, disagreement is information. Reporting one number without saying what it assumes is the actual error, not choosing the wrong one.


  derivations:
    - title: "k-means is the hard-assignment limit of a shared-spherical GMM"
      latex: |
        Take the mixture $p(x) = \sum_j \pi_j \mathcal{N}(x;\mu_j,\sigma^2 I)$ with
        equal weights $\pi_j = 1/k$. The responsibility of component $j$ is
        $$\gamma_{ij} = \frac{\exp\left(-\|x_i-\mu_j\|^2 / 2\sigma^2\right)}{\sum_l \exp\left(-\|x_i-\mu_l\|^2 / 2\sigma^2\right)}.$$
        As $\sigma \to 0$, the largest term dominates exponentially, so
        $\gamma_{ij} \to 1$ for the nearest centroid and $0$ otherwise.
      prose: >-
        Taking the limit replaces the soft average with an argmin. That single
        step is the whole difference between EM and Lloyd's algorithm, and it is
        also where the outlier behaviour comes from: a hard argmin has no way to
        say "this point fits nothing".
    - title: "Why inertia is monotone in k"
      latex: |
        Let $C_k$ be the optimal $k$-centroid solution. Given an optimal
        $(k+1)$-solution, merging any two centroids and re-assigning produces a
        valid $k$-solution whose inertia is at least that of $C_k$. Conversely
        every $k$-solution is also a valid $(k+1)$-solution with one centroid
        unused, so
        $$\min_{C_{k+1}} \text{inertia} \le \min_{C_k} \text{inertia}.$$
      prose: >-
        The feasible set grows with k, so the minimum can only fall. At k = n
        each point is its own centroid and inertia is exactly 0. A quantity whose
        infimum is always attained by the most complex model cannot select a
        model; this is a general fact about unpenalised training loss, which is
        why BIC adds a parameter penalty.
    - title: "The k-means++ sampling distribution"
      latex: |
        With a set of chosen centroids $\\mathcal{C}$, let
        $$D(x) = \\min_{c \\in \\mathcal{C}} \\|x - c\\|.$$
        The next centroid is sampled from the data with probability
        $$P(x) = \frac{D(x)^2}{\sum_{x'} D(x')^2}.$$
      prose: >-
        Sampling proportional to squared distance makes it very unlikely to
        choose a second centroid inside an already-covered blob, which is
        exactly the failure of uniform random initialisation. Because the
        probability is zero for already-chosen points, it also cannot pick the
        same point twice.
    - title: "Silhouette as a relative-separation ratio"
      latex: |
        For point $i$ in cluster $A$: $a(i)$ is the mean distance to the other
        members of $A$, and $b(i) = \\min_{B \\ne A}$ of the mean distance to
        members of $B$. Then
        $$s(i) = \\frac{b(i) - a(i)}{\\max\\{a(i), b(i)\\}} \\in [-1, 1].$$
      prose: >-
        Dividing by the larger of the two makes the score scale-free, which is
        why it penalises over-splitting: splitting a good cluster reduces a and
        therefore reduces the numerator, so the score falls. Inertia rewards
        exactly that split, which is the precise mechanism by which the two
        metrics disagree.

  implementations:
    - language: python
      title: "Lloyd's algorithm with k-means++ initialisation"
      note: >-
        The wrong version of this uses `np.random.choice(n, k)` for
        initialisation and a single run. Measured, that spans an inertia range
        of 243 across 20 restarts at k=6 — the result you report depends on the
        seed, which is not a result. Also note that an empty cluster is possible:
        keeping the old centroid is a choice, and silently dropping the cluster
        changes k underneath you.
      code: |
        import numpy as np

        def kmeans_plus_plus(X, k, rng):
            """Sample k centroids with probability proportional to D^2."""
            n = X.shape[0]
            centers = [X[rng.integers(n)]]
            for _ in range(k - 1):
                d2 = np.min(
                    ((X[:, None, :] - np.array(centers)[None, :, :]) ** 2).sum(-1),
                    axis=1,
                )
                total = d2.sum()
                if total <= 0:            # all points already covered
                    centers.append(X[rng.integers(n)])
                    continue
                centers.append(X[rng.choice(n, p=d2 / total)])
            return np.array(centers)

        def kmeans(X, k, n_init=10, max_iter=100, seed=0):
            X = np.asarray(X, dtype=float)
            rng = np.random.default_rng(seed)
            best = None
            for _ in range(n_init):
                C = kmeans_plus_plus(X, k, rng)
                for _ in range(max_iter):
                    d = ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1)
                    labels = d.argmin(1)
                    newC = C.copy()
                    for j in range(k):
                        m = labels == j
                        if m.any():
                            newC[j] = X[m].mean(0)
                        # An empty cluster keeps its old centroid. Dropping it
                        # would silently change k.
                    if np.allclose(newC, C):
                        break
                    C = newC
                inertia = float(((X - C[labels]) ** 2).sum())
                if best is None or inertia < best[0]:
                    best = (inertia, C, labels)
            return best[1], best[2], best[0]

        def silhouette(X, labels):
            """Mean silhouette. O(n^2) -- sample for large n."""
            X = np.asarray(X, dtype=float)
            labels = np.asarray(labels)
            out = []
            for i in range(len(X)):
                d = np.linalg.norm(X - X[i], axis=1)
                own = labels == labels[i]
                own[i] = False
                if not own.any():
                    out.append(0.0)
                    continue
                a = d[own].mean()
                others = [
                    d[labels == j].mean()
                    for j in np.unique(labels)
                    if j != labels[i] and (labels == j).any()
                ]
                if not others:
                    out.append(0.0)
                    continue
                b = min(others)
                out.append((b - a) / max(a, b))
            return float(np.mean(out))
    - language: python
      title: "A Gaussian mixture with full covariance, from scratch"
      note: >-
        This is numerically WRONG as written for a component whose covariance
        becomes singular: `np.linalg.det` returns 0 and the log-density goes to
        -inf. Production code adds a small ridge to each covariance, or uses a
        Cholesky factorisation that fails loudly. Also, `logsumexp` is required
        — computing the responsibilities without it underflows for
        well-separated components.
      code: |
        import numpy as np
        from math import log

        def _log_gaussian(X, mu, Sigma):
            d = X.shape[1]
            L = np.linalg.cholesky(Sigma)
            diff = X - mu
            # Solve against L rather than inverting Sigma.
            sol = np.linalg.solve(L, diff.T)
            maha = (sol ** 2).sum(0)
            logdet = 2.0 * np.log(np.diag(L)).sum()
            return -0.5 * (maha + logdet + d * log(2 * np.pi))

        def gmm(X, k, n_iter=100, seed=0, reg=1e-6):
            X = np.asarray(X, dtype=float)
            n, d = X.shape
            rng = np.random.default_rng(seed)
            # Initialise from a random hard partition; in practice use k-means.
            resp = np.zeros((n, k))
            resp[np.arange(n), rng.integers(k, size=n)] = 1.0

            for _ in range(n_iter):
                # M-step
                Nk = resp.sum(0) + 1e-10
                weights = Nk / n
                means = (resp.T @ X) / Nk[:, None]
                covs = []
                for j in range(k):
                    diff = X - means[j]
                    covs.append((resp[:, j, None] * diff).T @ diff / Nk[j]
                                + reg * np.eye(d))

                # E-step
                logp = np.stack(
                    [np.log(weights[j]) + _log_gaussian(X, means[j], covs[j])
                     for j in range(k)],
                    axis=1,
                )
                m = logp.max(axis=1, keepdims=True)
                p = np.exp(logp - m)
                resp = p / p.sum(axis=1, keepdims=True)

            return weights, means, covs, resp

  checkpoints:
    - id: cp-1
      question: "Why can the elbow method fail even on data with obvious clusters?"
      answerKind: short_text
      hint: "What is the minimum of inertia as a function of $k$?"
      solution: >-
        Because inertia has no minimum — it is monotonically non-increasing in
        $k$ and reaches exactly 0 at $k = n$. Measured, it fell 11,339.58 →
        1,786.34 → 1,580.26 → 1,378.98 → 1,238.27 from $k=2$ to $k=6$ on data
        whose true $k$ is 3. The "elbow" is a slope change in a decaying curve,
        read by eye; on real data it is often indistinguishable from noise.
        Silhouette, which has a genuine maximum, peaked at 0.7661 at $k=3$.
    - id: cp-2
      question: "k-means returned two centroids with almost identical $x$ on data separated in $x$. Diagnose it."
      answerKind: short_text
      hint: "What shape does the k-means model assign to every cluster?"
      solution: >-
        The model is wrong, not the optimisation. k-means assumes every cluster
        is a sphere of the same radius ($\Sigma = \sigma^2 I$), so on data with
        8:1 elongation it minimises inertia by cutting along the long axis
        rather than separating the true groups. Measured, centroids were
        $(0.68, -6.98)$ and $(0.71, 5.66)$ — same $x$, opposite $y$. More
        restarts cannot fix this; use a GMM with full covariance.
    - id: cp-3
      question: "Why does scaling features change the clusters rather than just the numbers?"
      answerKind: short_text
      hint: "What does squared Euclidean distance do with a feature whose units are 1000× larger?"
      solution: >-
        Because the objective is squared Euclidean distance, a feature measured
        in thousands contributes a million times more per unit than one measured
        in single digits. Unscaled, the clustering is dominated by whichever
        column has the largest variance — often an artefact of units rather than
        meaning. Standardising is part of the model specification, not a
        preprocessing detail.
    - id: cp-4
      question: "k-means++ reduced the worst-case inertia but did not remove seeding dependence. What is the correct conclusion?"
      answerKind: short_text
      hint: "Look at the measured spread for each initialisation."
      solution: >-
        That k-means++ is a variance reduction, not a guarantee. Measured across
        20 restarts at $k=6$: random spanned 1,179.30–1,422.26 (range 243.0),
        k-means++ spanned 1,179.23–1,290.96 (range 111.7). The best random
        restart still beat the worst k-means++ restart, so the recipe is
        k-means++ **and** multiple restarts, keeping the best inertia.
    - id: cp-5
      question: "When is a soft assignment genuinely more useful than a hard one?"
      answerKind: short_text
      hint: "What does a hard assignment do with a point in a low-density gap?"
      solution: >-
        Whenever the data has points between clusters, or when the uncertainty
        is itself the signal. A hard assignment forces every point into a
        cluster — an outlier in a gap is confidently labelled with whichever
        centroid happens to be marginally nearer. Responsibilities express "60%
        component A, 40% component B", which is a true statement about an
        ambiguous point, and it lets downstream logic treat low-confidence
        assignments differently instead of silently trusting them.
    - id: cp-6
      question: "Your clusters look good on a plot. What single check most improves your confidence?"
      answerKind: short_text
      hint: "What was the clustering never asked to predict?"
      solution: >-
        Test whether the cluster label predicts something you did not cluster
        on. Clustering finds structure under a model you chose, so internal
        metrics only tell you the fit is coherent with that model. If the label
        carries no information about an independent outcome — retention,
        conversion, failure rate — it is a partition, not an insight.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        k-means is a specific probabilistic model wearing plain clothes: it is a
        mixture of identical spherical Gaussians with hard assignment. Once you
        know that, you can predict which data it will mangle — anything
        elongated, anything with unequal cluster sizes, anything with outliers
        between clusters.
      blocks:
        - kind: checklist
          body: |
            - k-means = GMM with shared spherical covariance, sigma → 0
            - Consequence: convex, equal-size, ball-shaped clusters
            - Inertia is monotone in k, so it cannot choose k
            - Silhouette has a maximum, so it can
            - Elongation is the failure that tuning cannot fix
      checkpoint: >-
        Given that k-means assumes a shared spherical covariance, which of these
        will it get wrong: (a) two equal round blobs, (b) one long thin blob
        beside one round one, (c) three blobs of very different sizes?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Two decisions: the model and the number of clusters. For the model, ask
        whether your clusters could plausibly be elongated or unequal — if yes,
        a full-covariance GMM. For $k$, use silhouette or BIC, and report which.
        Never use inertia alone.
      blocks:
        - kind: checklist
          body: |
            - Round, similar-size clusters → k-means, k-means++, restarts
            - Elongated or unequal → GMM with full covariance
            - Choosing k → silhouette (O(n²)) or BIC, not the elbow
            - Always → standardise first
            - Always → inspect the covariance / shape of each cluster
      checkpoint: >-
        Why does silhouette penalise splitting a good cluster while inertia
        rewards it? Which term in the formula does the work?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Lloyd's algorithm is ten lines. The parts people get wrong are
        initialisation, empty clusters, and scaling.
      blocks:
        - kind: pseudocode
          body: |
            standardise X

            best = None
            repeat n_init times:
                C = kmeans_plus_plus(X, k)          # D^2 sampling
                repeat until centroids stop moving:
                    labels = argmin_j ||x_i - C_j||^2
                    for each j: C_j = mean of points with label j
                        # empty cluster: keep the old centroid, do not drop it
                inertia = sum ||x_i - C_labels[i]||^2
                if inertia < best.inertia: best = (C, labels, inertia)

            return best
      checkpoint: >-
        Why is "keep the old centroid" the right choice for an empty cluster,
        rather than deleting that cluster?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Two derivations worth having: the hard-assignment limit, and why inertia
        cannot select $k$.
      blocks:
        - kind: math
          body: |
            **Hard-assignment limit.**
            $$\gamma_{ij} = \frac{\exp\left(-\|x_i-\mu_j\|^2/2\sigma^2\right)}{\sum_l \exp\left(-\|x_i-\mu_l\|^2/2\sigma^2\right)} \xrightarrow{\sigma \to 0} \mathbb{1}\left[j = \arg\min_l \|x_i-\mu_l\|^2\right]$$

            **Monotonicity of inertia.** The set of $k$-centroid configurations is
            contained in the set of $(k+1)$-centroid configurations (leave one
            unused), so
            $$\min_{C_{k+1}} \text{inertia} \le \min_{C_k} \text{inertia}.$$

            **Silhouette.**
            $$s(i) = \frac{b(i)-a(i)}{\max\{a(i),b(i)\}}$$
      checkpoint: >-
        In the monotonicity argument, the key step is that every k-solution is
        also a valid (k+1)-solution. Why does that make the minimum fall rather
        than rise?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete, honest clustering pipeline: scaled input, k-means++ with
        restarts, silhouette for model selection, and a GMM path for the shapes
        k-means cannot represent.
      blocks:
        - kind: warning
          body: >-
            The most valuable line in this code is the covariance inspection. If
            you skip it, you will not know whether k-means imposed a shape or
            found one.
        - kind: code
          language: python
          body: |
            import numpy as np

            def kmeans_plus_plus(X, k, rng):
                centers = [X[rng.integers(len(X))]]
                for _ in range(k - 1):
                    d2 = np.min(((X[:, None, :] - np.array(centers)[None]) ** 2).sum(-1), axis=1)
                    if d2.sum() <= 0:
                        centers.append(X[rng.integers(len(X))]); continue
                    centers.append(X[rng.choice(len(X), p=d2 / d2.sum())])
                return np.array(centers)

            def fit(X, k, n_init=20, seed=0):
                X = np.asarray(X, float)
                X = (X - X.mean(0)) / (X.std(0) + 1e-12)   # scaling is part of the model
                rng = np.random.default_rng(seed)
                best = None
                for _ in range(n_init):
                    C = kmeans_plus_plus(X, k, rng)
                    for _ in range(100):
                        labels = ((X[:, None] - C[None]) ** 2).sum(-1).argmin(1)
                        newC = np.array([X[labels == j].mean(0) if (labels == j).any() else C[j]
                                         for j in range(k)])
                        if np.allclose(newC, C): break
                        C = newC
                    inertia = float(((X - C[labels]) ** 2).sum())
                    if best is None or inertia < best[0]:
                        best = (inertia, C, labels)
                _, C, labels = best

                # Inspect the shapes: standard deviation per axis, per cluster.
                shapes = [
                    {**{"cluster": j, "n": int((labels == j).sum())},
                     **{f"sd_{i}": round(float(X[labels == j, i].std()), 3)
                        for i in range(X.shape[1])}}
                    for j in range(k)
                ]
                return {"centers": C, "labels": labels, "shapes": shapes}
      checkpoint: >-
        The `shapes` output reports per-axis standard deviation for each
        cluster. Describe the case where that inspection tells you to switch to a
        GMM, and the case where a large ratio is harmless.

  problems:
    - id: p-assign
      title: "Nearest-centroid assignment"
      difficulty: easy
      prompt: >-
        Implement `assign(X, centers)` returning a list of integer indices of the
        nearest centroid for each row of `X`, by **squared** Euclidean distance.
        On an exact tie, return the lower index.
      starter: |
        import numpy as np

        def assign(X, centers):
            # your implementation here
            pass
      language: python
      entry: assign
      testCases:
        - input: '[[[0,0],[1,1],[9,9]],[[0,0],[10,10]]]'
          expected: "[0, 0, 1]"
          mode: json
          tolerance: 1e-12
        - input: '[[[0,0],[4,0]],[[0,0],[8,0]]]'
          expected: "[0, 0]"
          mode: json
          tolerance: 1e-12
        - input: '[[[5,5]],[[0,0],[10,10]]]'
          expected: "[0]"
          mode: json
          tolerance: 1e-12
      solution: |
        import numpy as np

        def assign(X, centers):
            X = np.asarray(X, dtype=float)
            C = np.asarray(centers, dtype=float)
            # Squared distances; argmin returns the lowest index on a tie,
            # which is the stated convention.
            d2 = ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1)
            return [int(j) for j in d2.argmin(axis=1)]
      solutionExplanation: >-
        Assignment compares squared distances, not distances — the ordering is
        identical and it avoids a square root per pair. The third test case is an
        exact tie (the point is equidistant), and `argmin` resolves it to the
        lower index, which is the conventional choice because it makes the
        function deterministic rather than dependent on floating-point noise.
      complexity: "O(nkd) time, O(nk) space"
      tags: [kmeans, assignment]

    - id: p-kmeanspp-probs
      title: "k-means++ sampling probabilities"
      difficulty: medium
      prompt: >-
        Implement `plus_plus_probs(X, chosen_centers)` returning the probability
        vector that k-means++ uses to sample the next centroid:
        $p_i = D_i^2 / \\sum_j D_j^2$, where $D_i$ is the Euclidean distance from
        row $i$ to its nearest chosen centre. If the total is zero (every point
        is already a centroid), return all zeros.
      starter: |
        import numpy as np

        def plus_plus_probs(X, chosen_centers):
            # your implementation here
            pass
      language: python
      entry: plus_plus_probs
      testCases:
        - input: '[[[0],[1],[10]],[[0]]]'
          expected: "[0.0, 0.009900990099009901, 0.9900990099009901]"
          mode: json
          tolerance: 1e-12
        - input: '[[[0],[2]],[[0]]]'
          expected: "[0.0, 1.0]"
          mode: json
          tolerance: 1e-12
        - input: '[[[3],[3]],[[3]]]'
          expected: "[0.0, 0.0]"
          mode: json
          tolerance: 1e-12
      solution: |
        import numpy as np

        def plus_plus_probs(X, chosen_centers):
            X = np.asarray(X, dtype=float)
            C = np.asarray(chosen_centers, dtype=float)
            # Distance to the nearest chosen centre.
            D = np.sqrt(((X[:, None, :] - C[None, :, :]) ** 2).sum(-1)).min(axis=1)
            d2 = D ** 2
            total = d2.sum()
            if total <= 0:
                return [0.0 for _ in range(len(X))]
            return [float(v) for v in d2 / total]
      solutionExplanation: >-
        Sampling proportional to squared distance is what makes k-means++
        unlikely to pick two centroids inside the same blob: a point already
        close to a chosen centre has a small D and therefore almost no chance.
        The first test case shows the shape of it — the far point at 10 gets
        99% of the mass while the point at 1 gets under 1%. The zero-total case
        must be handled explicitly, because dividing by zero would produce NaN
        and silently corrupt the sampling distribution.
      complexity: "O(nkc) time, O(n) space"
      tags: [kmeans-plus-plus, initialisation]

    - id: p-inertia
      title: "Within-cluster sum of squares"
      difficulty: easy
      prompt: >-
        Implement `inertia(X, labels, centers)` returning
        $\\sum_i \\|x_i - c_{\\text{labels}[i]}\\|^2$ as a float.
      starter: |
        import numpy as np

        def inertia(X, labels, centers):
            # your implementation here
            pass
      language: python
      entry: inertia
      testCases:
        - input: '[[[0,0],[1,0],[9,9]],[0,0,1],[[0.5,0],[9,9]]]'
          expected: "0.5"
          mode: json
          tolerance: 1e-12
        - input: '[[[1,1]], [0], [[1,1]]]'
          expected: "0.0"
          mode: json
          tolerance: 1e-12
        - input: '[[[0,0],[2,0]], [0,0], [[1,0]]]'
          expected: "2.0"
          mode: json
          tolerance: 1e-12
      solution: |
        import numpy as np

        def inertia(X, labels, centers):
            X = np.asarray(X, dtype=float)
            C = np.asarray(centers, dtype=float)
            total = 0.0
            for i, lab in enumerate(labels):
                total += float(((X[i] - C[int(lab)]) ** 2).sum())
            return total
      solutionExplanation: >-
        Inertia is the objective k-means minimises, and it is worth computing by
        hand once to see why it is monotone in k: every point contributes a
        non-negative term, and adding a centroid can only reduce the distance
        for the points that switch to it. The third case gives 2.0 because each
        point is exactly 1 unit from the centre, so 1² + 1² = 2.
      complexity: "O(nd) time, O(1) space"
      tags: [kmeans, inertia]

  try_it: >-
    Run k-means for $k = 2$ through $6$ on three well-separated blobs and print
    both inertia and silhouette at every $k$. Inertia falls from 11,339 to 1,238
    with no elbow anywhere, while silhouette peaks at 0.7661 at $k = 3$ — that
    disagreement is the whole lesson about choosing $k$.
  interview_questions:
    - question: "What model does k-means implicitly assume?"
      level: mid
      key_points:
        - "It is a Gaussian mixture with a shared spherical covariance $\\Sigma_j = \\sigma^2 I$, taken to the hard-assignment limit $\\sigma \\to 0$."
        - "So every cluster is a ball of the same size, and the Voronoi partition that falls out is a consequence of that assumption rather than a discovery."
        - "Because the objective is squared Euclidean distance, a feature in the thousands contributes a million times more than one in single digits — scaling is part of the model."
        - "A GMM with a full covariance per component relaxes both assumptions at $O(k d^2)$ parameters instead of $O(kd)$."
      follow_up: "Your clusters are elongated and differ in size by 10×. What do you run, and what does it cost?"
    - question: "Inertia only ever decreases as $k$ grows. How do you choose $k$?"
      level: senior
      key_points:
        - "Inertia is monotone in $k$ by construction — every added centroid can only reduce the sum of squared distances, and at $k = n$ it reaches exactly zero."
        - "Measured on three blobs: 11,339.58 at $k = 2$ down to 1,238.27 at $k = 6$, a smooth curve with no elbow to find."
        - "Silhouette does have a maximum on the same data — 0.7661 at $k = 3$ — because it measures separation relative to within-cluster spread."
        - "BIC and the gap statistic encode different assumptions again, so report which one you used and what it assumes about cluster shape."
      follow_up: "Silhouette picks 3 and BIC picks 5. What does that disagreement tell you about the data?"
    - question: "Why does k-means cut an elongated cluster along the wrong axis?"
      level: mid
      key_points:
        - "Minimising squared Euclidean distance produces Voronoi cells that are convex and roughly isotropic — the boundary is equidistant, not density-aware."
        - "On two blobs separated in $x$ but 8× more spread in $y$, k-means returned centroids at $y = -6.98$ and $y = +5.66$ with almost identical $x$: it split along the long axis."
        - "The split reduces within-cluster squared distance, so the objective improves even though the partition is wrong for the task."
        - "The fix is a model with per-component covariance, or a transformation that makes the clusters spherical."
  common_mistakes:
    - "Choosing $k$ by the elbow on inertia, which falls monotonically from 11,339 to 1,238 across $k = 2\\ldots6$ with no elbow present."
    - "Skipping feature scaling, so one column measured in thousands dominates the objective by a factor of a million."
    - "Reporting a single initialisation: 20 random restarts at $k = 6$ spanned inertia 1,179.30 to 1,422.26, while k-means++ spanned 1,179.23 to 1,290.96."
  further_reading:
    - label: "Arthur & Vassilvitskii, k-means++: The Advantages of Careful Seeding (SODA 2007)"
    - label: "Rousseeuw, Silhouettes: A graphical aid to the interpretation and validation of cluster analysis (1987)"
