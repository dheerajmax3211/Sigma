id: decision-trees
slug: decision-trees
title: "Decision Trees: The Split Rule Barely Matters, the Stopping Rule Decides"
summary: >-
  Grow a classifier that asks axis-aligned yes/no questions, derive both
  impurity functions from first principles, and learn why the split criterion
  barely matters while the stopping rule decides everything.
kind: lesson
difficulty: medium
position: 5
estMinutes: 25
prerequisites: [information-theory, maximum-likelihood-bayesian]
phase: supervised-learning
tags: [decision-trees, cart, gini, entropy, information-gain, overfitting, pruning]

body:
  big_idea: >-
    A tree is a greedy sequence of axis-aligned questions fixed by two independent
    choices — impurity picks the question, and the stopping rule, not the split
    criterion, decides whether it generalises.

  problem:
    - "Your tree reports 100% training and 60% test accuracy, and the only knob anyone reaches for is \"more depth\", which lowers the second."
    - "Two libraries hand you different trees on the same data: scikit-learn defaults to Gini, C4.5 uses entropy, and they disagree on 23.25% of predictions."
    - "You inherit a model with 83 leaves fitted on 400 rows, and every explanation is a path a different sample would have replaced."

  analogy: |
    Twenty Questions works because a good question roughly halves what is left,
    and a tree automates exactly that: each candidate split is scored by how
    much label uncertainty it removes. The break is that a tree only asks "is
    feature $j \le t$" and never looks ahead — it takes the best question now
    even when a worse one would pay off two levels down.

  concept_points:
    - "**A tree is a greedy recursive partition, and greed is locally optimal but globally blind.** At each node it evaluates every (feature, threshold) pair and takes the largest drop. On 400 noisy-XOR points the best axis-aligned split gains only 0.0108 of Gini — pure noise — so the root split is arbitrary. Greedy induction cannot see that a second question pays after a useless first."
    - "**Entropy impurity is conditional entropy, so its gain is mutual information.** For a node with class proportions $p$ define $H(p) = -\\sum_k p_k \\log_2 p_k$; a split's score is $H(\\text{parent}) - \\sum_s \\frac{n_s}{n}H(\\text{child}_s) = H(Y) - H(Y\\mid\\text{split}) = I(Y;\\text{split})$. On a parent with counts $(1,1,2,2)$, $H = 1.9183$ bits, so no split can score above that. Entropy gain is in bits because it *is* bits."
    - "**Gini impurity is a variance, not an information measure.** $G = 1 - \\sum_k p_k^2 = \\sum_k p_k(1-p_k)$ is the probability that two independent draws from the node disagree, and for two classes $G = 2p(1-p) = 2\\operatorname{Var}(\\text{Bernoulli}(p))$. So $p=0.5 \\Rightarrow 0.5$, $p=0.1 \\Rightarrow 0.18$, $p=0.01 \\Rightarrow 0.0198$. A Gini split is a variance reduction; an entropy split is a likelihood ratio."
    - "**Entropy and Gini weight rare-class contamination differently.** $H/G$ is 5.71 at $p=0.001$, 2.61 at $p=0.1$ and exactly 2.00 at $p=0.5$, so entropy will spend a split isolating eleven rows out of a thousand and Gini will not. On parent $(1,1,2,2)$: splitting off the class-3 pair scores Gini **0.3056** against entropy **0.9183**; pairing classes scores Gini **0.2778** against entropy **1.0000**."
    - "**Impurity gain knows nothing about generalisation.** On 200 rows with coin-flip labels the tree grows to 52 leaves, reporting training error **0.0** and test error **0.5055**. Training error falls monotonically; test error is U-shaped: depth 3 gives 7 leaves, 0.2475 train and **0.31875** test; unbounded gives 83 leaves, 0.0 train and **0.39725** test. The last 76 leaves cost 7.85 points."
    - "**Cost-complexity pruning prices a leaf, and the price must come from data the tree did not see.** Minimise $R_\\alpha(T) = R(T) + \\alpha|T|$; collapsing the subtree with the smallest $\\alpha_t = (R(t)-R(T_t))/(|T_t|-1)$ gives a nested sequence. On 250 fit rows: $\\alpha=0$ gives 55 leaves and test error 0.35175; $\\alpha=0.0112$ gives 11 leaves and **0.304**; $\\alpha=0.0508$ gives 1 leaf and 0.50225."

  definitions:
    - term: "Impurity"
      meaning: >-
        A function of the label distribution inside a node that is zero when the
        node is pure and maximal when the classes are uniform. It is the quantity
        a split is scored against, so it defines what "better" means.
    - term: "Gini impurity"
      meaning: >-
        $1 - \sum_k p_k^2$, equivalently the probability that two independent
        draws from the node carry different labels. Binary case: $2p(1-p)$. A
        second-moment (variance) criterion, not an information measure.
    - term: "Entropy impurity"
      meaning: >-
        $H(p) = -\sum_k p_k \log_2 p_k$ in bits (nats with $\ln$). Capped at
        $\log_2 K$; interpreted as the number of bits needed to encode the label
        of a random row in the node.
    - term: "Information gain"
      meaning: >-
        Parent impurity minus the size-weighted mean child impurity. With entropy
        this equals the mutual information $I(Y; \text{split})$; with Gini it
        equals a variance reduction. The weights are essential: unweighted
        averaging overstates the gain by ~100× on a peel-off split.
    - term: "Split"
      meaning: >-
        A pair (feature $j$, threshold $t$) defining the half-spaces
        $x_j \le t$ and $x_j > t$. Axis-aligned by construction, which is what
        makes trees fast, scale-free, and unable to represent a diagonal boundary
        at any depth.
    - term: "Greedy induction"
      meaning: >-
        Choosing the best split at the current node without evaluating what it
        makes possible below. Produces a locally optimal, globally arbitrary tree
        — the mechanism behind the XOR failure and the reason ensembles work.
    - term: "CART"
      meaning: >-
        Classification and Regression Trees (Breiman et al., 1984): binary
        axis-aligned splits, Gini by default, cost-complexity pruning. The
        algorithm behind scikit-learn's `DecisionTreeClassifier` and the base
        learner of every tree ensemble.
    - term: "Pre-pruning"
      meaning: >-
        Stopping growth early: `max_depth`, `min_samples_leaf`,
        `min_samples_split`, `min_impurity_decrease`. Cheap, but it is early
        stopping — it can never discover that a split which looks useless now
        enables a good split two levels down.
    - term: "Cost-complexity pruning"
      meaning: >-
        Post-pruning by minimising $R(T) + \alpha|T|$ over nested subtrees, where
        $|T|$ is the leaf count. Equivalent to a penalised likelihood, i.e. a
        prior that charges $\alpha$ per leaf.
    - term: "ccp_alpha"
      meaning: >-
        The $\alpha$ in cost-complexity pruning — the price of one leaf in units
        of impurity. Chosen by cross-validation over the pruning path, not set by
        intuition; $\alpha = 0$ means "never prune".
    - term: "Instability"
      meaning: >-
        Small changes in the training sample produce structurally different
        trees. Measured: across 50 bootstraps the root feature agreed 52% of the
        time and test accuracy varied with standard deviation 0.0184. Instability
        is variance, not bias, which is exactly what bagging removes.
    - term: "Monotone invariance"
      meaning: >-
        Any strictly increasing transform of a feature leaves every split and
        every prediction unchanged, because only the ordering of values matters.
        Measured: scaling one feature by 1000 and shifting by 17 left predictions
        identical (threshold $-0.2853 \to -268.3137$). No scaling is needed —
        and no magnitude information is available either.

