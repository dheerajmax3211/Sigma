    - type: pipeline
      title: "How a split is actually chosen (the O(n log n) sweep)"
      nodes:
        - label: "For each feature j"
          note: "loop over columns, not over thresholds"
          detail: "A d-feature node costs d sorts. This is why tree depth is cheap and tree breadth is not."
        - label: "Sort the node's rows on x_j"
          note: "O(n log n) per feature"
          detail: "Sorting once per feature, then sweeping, costs O(n log n) per node. Re-evaluating impurity from scratch at every threshold would be O(n^2)."
        - label: "Accumulate class counts left to right"
          note: "running histogram"
          detail: "Maintain cumulative counts, so the left child's histogram is a prefix sum and the right child's is parent minus left. Constant work per threshold."
        - label: "Score every boundary between distinct values"
          note: "weighted gain"
          detail: "Skip thresholds where x_j is tied: they produce an empty or identical split. This is also where an unweighted child average silently ruins the sweep."
        - label: "Take the best (j, t), then recurse"
          note: "no backtracking"
          detail: "The choice is final for this node. Nothing records that a different split here might have been better two levels down — that is the greedy assumption, and it is not free."
        - label: "Stop when the rule fires"
          note: "depth, leaf size, or gain"
          detail: "Every stopping rule is a hyperparameter. It is the one that controls generalisation, and the split criterion does not constrain it at all."

  markdown: |
    ## A tree is a recursive partition, chosen greedily

    Given $n$ rows, $d$ features and a label $y$, a decision tree partitions the
    feature space into axis-aligned boxes. At each node it considers every
    feature $j$ and every threshold $t$, scores the split $x_j \le t$ by how much
    it reduces label impurity, keeps the best one, recurses on both halves, and
    stops when a rule fires.

    Two decisions are independent here: the **impurity function** decides which
    question looks best, and the **stopping rule** decides when to stop asking.
    Discussion is mostly about the first; performance is mostly the second.

    ## Entropy impurity is the conditional entropy you already have

    For a node with class proportions $p$:

    $$H(p) = -\sum_k p_k \log_2 p_k$$

    A split's score is the parent's impurity minus the size-weighted mean of the
    children's:

    $$\Delta = H(Y) - \sum_{s \in \{L,R\}} \frac{n_s}{n} H(Y \mid S = s)
             = H(Y) - H(Y \mid S) = I(Y; S)$$

    That last equality is not an analogy: the greedy entropy split is the split
    with the largest **mutual information** with the label, the same quantity
    defined in *Information Theory*, measured in bits because it is bits. On a
    parent with counts $(1,1,2,2)$, $H = 1.9183$, so no split can score above
    1.9183 and one scoring 0.9183 has removed 48% of the node's uncertainty.

    It is also a likelihood statement. A tree is a piecewise-constant
    multinomial model with one parameter vector per leaf; the maximised
    log-likelihood at a node is $\sum_k n_k \ln(n_k/n)$, so a split raises it by
    exactly $n \ln 2 \times \Delta_{\text{bits}}$, and twice that is the
    likelihood-ratio statistic $G^2$. That is *Maximum Likelihood and Bayesian
    Inference* applied to a model whose parameter count grows with the tree —
    precisely why that parameter count becomes the overfitting problem.

    | $p$ | entropy (bits) | Gini | misclassification | $H / G$ |
    |---|---|---|---|---|
    | 0.001 | 0.0114 | 0.0020 | 0.001 | 5.71 |
    | 0.01 | 0.0808 | 0.0198 | 0.01 | 4.08 |
    | 0.05 | 0.2864 | 0.0950 | 0.05 | 3.01 |
    | 0.10 | 0.4690 | 0.1800 | 0.10 | 2.61 |
    | 0.20 | 0.7219 | 0.3200 | 0.20 | 2.26 |
    | 0.30 | 0.8813 | 0.4200 | 0.30 | 2.10 |
    | 0.50 | 1.0000 | 0.5000 | 0.50 | 2.00 |

    ## Gini is a variance, and variance is a different question

    $$G = 1 - \sum_k p_k^2 = \sum_k p_k(1 - p_k)
        = \mathbb{P}(\text{two draws from this node disagree})$$

    For two classes this is $2p(1-p)$, twice the variance of a Bernoulli, so Gini
    gain is a **variance reduction** while entropy gain is a **likelihood ratio**.
    They are not two approximations of one thing.

    ## They rank splits differently, in six rows

    Parent counts $(1,1,2,2)$ over four classes: $H = 1.9183$ bits,
    $G = 0.7222$.

    | Split | Children | Gini gain | Entropy gain |
    |---|---|---|---|
    | A — isolate class 3 | $([0,0,0,2], [1,1,2,0])$ | **0.3056** | 0.9183 |
    | B — pair classes | $([0,1,0,2], [1,0,2,0])$ | 0.2778 | **1.0000** |

    Gini prefers A, entropy prefers B, and both are defensible: A buys one pure
    leaf, while B spreads the two size-2 classes and lets entropy charge that
    $1/3$ minority $0.918$ of its one-bit ceiling. The $H/G$ column above is the
    mechanism: 5.71 at $p = 0.001$ against 2.00 at $p = 0.5$.

    With **two classes** the folklore holds: enumerating every 2-class parent up
    to $n = 26$ and every binary split of it found **zero** rank inversions.
    Disagreement needs three classes. On real multi-class data the trees diverge
    anyway: 400 rows, 8 features, 3 informative, `min_samples_leaf = 5`, gave 47
    leaves under Gini and 48 under entropy, **23.25%** disagreement on 4,000 test
    predictions, and 0.651 versus 0.615 accuracy.

    ## The bug that makes every split look good

    Children's impurities must be weighted by $n_s/n$. Drop the weights and the
    criterion becomes "does any child look pure", regardless of size: on a
    balanced 100/100 node, splitting off one row scores **0.005018 bits**
    correctly and **0.500009 bits** unweighted, 99.6× too large. A pure child
    contributes 0 however small it is, so the unweighted tree peels off one row
    at a time and reports enormous progress.

    ## Overfitting is not a side effect — it is what the algorithm does

    Impurity gain has no term for generalisation, so a tree drives training
    impurity to zero on noise. 200 rows, 5 features, labels by coin flip: 52
    leaves, depth 18, training error **0.0**, test error **0.5055**.

    The same shape appears on data with real signal, less absurdly. 400 rows,
    8 features, 3 informative:

    | depth | leaves | train error | test error |
    |---|---|---|---|
    | 1 | 2 | 0.3700 | 0.3390 |
    | 3 | 7 | 0.2475 | **0.3188** |
    | 6 | 32 | 0.1700 | 0.3335 |
    | 9 | 63 | 0.0525 | 0.3685 |
    | 12 | 80 | 0.0075 | 0.3928 |
    | ∞ | 83 | 0.0000 | 0.3973 |

    The last 76 leaves buy 24.75 points of training accuracy and cost 7.85 points
    of test accuracy. Every one of those splits was locally justified.

    ## Stopping rules, and what they are worth

    Pre-pruning is early stopping: `max_depth`, `min_samples_leaf`,
    `min_impurity_decrease` — cheap, and unable to look ahead. A sweep on the
    same data: `min_samples_leaf = 1` gives 83 leaves and test error 0.39725,
    `= 20` gives 14 leaves and **0.3105**, `= 80` gives 3 leaves and 0.327 — so
    the curve is U-shaped in the hyperparameter too, and the leaf-size rule is
    something to tune rather than a way to avoid tuning.

    Post-pruning is better behaved because it prices the tree explicitly:

    $$R_\alpha(T) = R(T) + \alpha |T|, \qquad
      \alpha_t = \frac{R(t) - R(T_t)}{|T_t| - 1}$$

    Growing past the answer and collapsing the weakest link gives a nested
    sequence of subtrees, each optimal for an interval of $\alpha$. Measured on
    250 fit rows, 150 validation rows and 4,000 test rows: $\alpha = 0$ gives 55
    leaves and test error 0.35175; $\alpha = 0.0112$ gives 11 leaves and
    **0.304**; $\alpha = 0.0508$ gives 1 leaf and 0.50225. The validation set
    selected $\alpha = 0.0224$ — 4 leaves, test error 0.34225 — which is honest
    and is *not* the test-optimal choice.

    One trap: compute $R$ with **misclassification** error instead of impurity
    and every leaf of a grown tree is pure, so $R(T_t) = 0$ for every subtree,
    the weakest link is the root, and the 83-leaf tree collapses to a single leaf
    at $\alpha = 0.0060$.

    ## What actually to do

    Pick the criterion deliberately rather than by folklore: entropy if you
    believe the multinomial likelihood, Gini if you want a variance reduction.
    Never grow to purity — choose `min_samples_leaf` and `ccp_alpha` on held-out
    rows and report the number you chose them on, because training error is
    monotone in depth and useless for that decision. And remember that the tree is
    a variance machine: across 50 bootstraps the root feature agreed 52% of the
    time and test accuracy varied with sd 0.0184. That variance, not bias, is what
    bagging averages away — which is the whole idea of a random forest.

    ## The longer version

    The remaining mechanisms, verbatim: why entropy gain is a likelihood ratio,
    the folklore that Gini and entropy agree, the unweighted-average bug that is
    100× too large, and why pruning must not use misclassification error.

    ### Failure modes, in full

    - Your tree reports 100% training accuracy and 60% test accuracy, and the only knob anyone reaches for is "more depth" — which pins the first number at 100% and makes the second worse.
    - Two libraries hand you two different trees on the same data and neither is buggy: scikit-learn defaults to Gini, ID3 and C4.5 use entropy. On a 400-row, 8-feature problem the two trees disagreed on **23.25%** of 4,000 test predictions and differed by 3.65 points of accuracy.
    - You inherit a model with 83 leaves fitted on 400 rows, and every explanation you give a stakeholder is a path through a tree that a different sample would have replaced — across 50 bootstrap resamples, the root split chose feature 0 twenty-three times, feature 1 twenty-six times, and feature 2 once.
    - Someone asks why the pruned tree is "better" when it is wrong on 24.75% of the rows it was trained on and the unpruned one is wrong on none. The only honest answer is a held-out number, and you need to be able to produce it.
    - Random forests and gradient boosting — the two methods that actually win on tabular data — are refinements of this single algorithm, so a vague understanding of split selection becomes a vague understanding of everything downstream.

    ### The mechanisms, in full

    - **A tree is a greedy recursive partition, and greed is locally optimal but globally blind.** At each node it evaluates every (feature, threshold) pair and takes the one with the largest impurity drop, then recurses. On 400 noisy-XOR points the best single axis-aligned split achieves a Gini gain of only 0.0108 — pure noise — so the root split is essentially arbitrary; a depth-2 tree has 3 leaves and 49.5% test error, while the four-leaf rule "sign(x₁·x₂)" reaches 5.775%. Greedy induction cannot see that the second question only pays off after a first question that looks useless. This is the structural reason trees need ensembles: mediocre, decorrelated questions average into a good answer.
    - **Entropy impurity is conditional entropy, so its gain is mutual information — the same object you met in *Information Theory*.** For a node with class proportions $p$ define $H(p) = -\sum_k p_k \log_2 p_k$; a split's score is $H(\text{parent}) - \sum_s \frac{n_s}{n} H(\text{child}_s)$, which is by definition $H(Y) - H(Y \mid \text{split}) = I(Y; \text{split})$. On a parent with counts $(1,1,2,2)$, $H = 1.9183$ bits, so no split can ever score above 1.9183. Entropy gain is measured in bits because it *is* bits: the number of bits of label uncertainty the question removes, averaged over the node.
    - **Entropy gain is also a likelihood ratio, which is why it is the "right" criterion if you believe the model.** A tree is a piecewise-constant multinomial model with one parameter vector per leaf. The maximised log-likelihood of a node is $\sum_k n_k \ln(n_k/n)$, and the gain from splitting is exactly $n \ln 2 \times \mathrm{IG}_{\text{bits}}$. For $[6,6]$ split into $[6,0]$ and $[0,6]$: $\mathrm{IG} = 1$ bit, $n = 12$, so the likelihood-ratio statistic is $G^2 = 2 \cdot 12 \cdot \ln 2 = 16.6355$, matching $2[0 - 12\ln 0.5]$. This is the maximum-likelihood view from *Maximum Likelihood and Bayesian Inference* applied to a discrete model whose parameter count grows with the tree.
    - **Gini impurity is a variance, not an information measure.** $G = 1 - \sum_k p_k^2 = \sum_k p_k(1-p_k)$ is the probability that two independent draws from the node disagree, and for two classes $G = 2p(1-p) = 2\, \operatorname{Var}(\text{Bernoulli}(p))$. Numbers: $p = 0.5 \Rightarrow G = 0.5$; $p = 0.1 \Rightarrow G = 0.18$; $p = 0.01 \Rightarrow G = 0.0198$. So a Gini split is a variance reduction — the same second-moment quantity that appears in the Brier score — while an entropy split is a likelihood ratio. They are not two approximations of one thing; they are two different objectives that happen to coincide on easy problems.
    - **They weight rare-class contamination differently, and six rows are enough to make the rankings invert.** $H/G$ is 5.71 at $p = 0.001$, 2.61 at $p = 0.1$ and exactly 2.00 at $p = 0.5$, because $p \log(1/p)$ diverges as $p \to 0$ while $2p(1-p)$ is linear — so entropy will spend a split isolating eleven rows out of a thousand and Gini will not. Take parent counts $(1,1,2,2)$ over four classes: $H = 1.9183$ bits, $G = 0.7222$. Split A isolates class 3, $([0,0,0,2],[1,1,2,0])$, and scores Gini **0.3056** against entropy **0.9183**. Split B pairs classes, $([0,1,0,2],[1,0,2,0])$, and scores Gini **0.2778** against entropy **1.0000**. Gini prefers A, entropy prefers B, and neither is wrong: A buys one perfectly pure leaf, while B puts the two size-2 classes on opposite sides and entropy charges that $1/3$ minority $0.918$ of its one-bit ceiling.
    - **The folklore that they agree is a fact about binary problems, and their scales are not comparable anyway.** Enumerating every 2-class parent up to $n = 26$ and every binary split of each produced **zero rank inversions** between the two gains — but disagreement needs only three classes, and on real multi-class data the trees diverge: 400 rows, 8 features, 3 informative, `min_samples_leaf=5` gave 47 leaves under Gini and 48 under entropy, a **23.25%** disagreement on 4,000 test predictions and 0.651 versus 0.615 accuracy. Their ceilings differ too: $1 - 1/K$ versus $\log_2 K$ is 0.5 versus 1.0 at $K = 2$ but 0.9 versus 3.3219 at $K = 10$, so a raw gain of 0.3 is excellent in a 2-class node and weak in a 10-class one. Never compare raw gains across nodes of different arity.
    - **The split score must be a size-weighted average, and the unweighted version is a 100× error that always looks better.** On a balanced 100/100 node, the split that isolates a single row into its own leaf scores **0.005018 bits** when weighted correctly and **0.500009 bits** when the child impurities are averaged without weights — 99.6× too large, and larger than any real split in the tree. The bug is self-reinforcing: a pure child contributes 0 no matter how small it is, so the unweighted criterion always prefers to peel off one point at a time. Every correct implementation multiplies each child's impurity by $n_{\text{child}}/n$.
    - **Impurity gain knows nothing about generalisation, so a tree will drive training impurity to zero on pure noise.** 200 rows, 5 features, labels drawn by coin flip: the tree grows to 52 leaves and depth 18, reports training error **0.0** and test error **0.5055** — exactly the 0.5 you get by ignoring the features. Every split in that tree was locally justified: it reduced impurity. This is why "the split improved the criterion" is never evidence that the split is useful, and why an unconstrained tree is not a model but a lookup table with extra steps.
    - **Training error falls monotonically with depth; test error is U-shaped, and the gap is the overfitting you are buying.** On 400 rows (8 features, 3 informative) and 4,000 test rows: depth 3 gives 7 leaves with training error 0.2475 and test error **0.31875**; depth 12 gives 80 leaves with training error 0.0075 and test error 0.39275; unbounded depth gives 83 leaves, training error **0.0**, test error **0.39725**. The last 76 leaves buy 24.75 points of training accuracy and cost 7.85 points of test accuracy. That trade is the whole subject of stopping rules.
    - **Cost-complexity pruning prices a leaf, and that price must come from data the tree did not see.** Minimise $R_\alpha(T) = R(T) + \alpha |T|$ where $R$ is size-weighted impurity; collapsing the subtree with the smallest $\alpha_t = (R(t) - R(T_t))/(|T_t| - 1)$ gives a nested sequence of trees. Measured on 250 fit rows, 150 validation rows, 4,000 test rows: $\alpha = 0$ gives 55 leaves and test error 0.35175; $\alpha = 0.0112$ gives 11 leaves and test error **0.304**; $\alpha = 0.0508$ gives 1 leaf and 0.50225. The validation set picked $\alpha = 0.0224$ (4 leaves, test error 0.34225) — honest model selection, and *not* the test-optimal $\alpha$, which is the price you pay for not peeking. Use misclassification error instead of impurity in that formula and every pure leaf gives $R(T_t) = 0$, so the weakest link is the root and the 83-leaf tree collapses to 1 leaf in a single step at $\alpha = 0.0060$.


  derivations:
    - title: "A split's entropy gain is the mutual information between label and split"
      latex: |
        Let $S \in \{L, R\}$ be the split indicator, with $p_S = n_S/n$. Then

        $$H(Y \mid S) = \sum_{s} p_s \, H(Y \mid S = s)
                      = -\sum_{s}\sum_k p_s \, p_{k\mid s} \log_2 p_{k\mid s}$$

        and since $p_s p_{k \mid s} = p_{s,k}$,

        $$H(Y \mid S) = -\sum_{s,k} p_{s,k} \log_2 \frac{p_{s,k}}{p_s}$$

        Subtracting from $H(Y) = -\sum_k p_k \log_2 p_k$:

        $$H(Y) - H(Y \mid S)
          = \sum_{s,k} p_{s,k} \log_2 \frac{p_{s,k}}{p_s \, p_k}
          = I(Y; S)$$
      prose: >-
        The weighted average of child entropies is the conditional entropy
        H(Y | S), so impurity gain is exactly mutual information — the quantity
        from Information Theory, applied to a two-valued variable defined by the
        split. This is why the gain is bounded by H(Y) and why it is measured in
        bits: it is the expected number of bits of label uncertainty the question
        removes.

    - title: "Gini is twice a Bernoulli variance; entropy gain is a likelihood ratio"
      latex: |
        $$\text{Gini:}\quad G = 1 - \sum_k p_k^2 = \sum_k p_k (1 - p_k)
            = \mathbb{P}(\text{two iid draws differ})$$

        For $K = 2$ with $p_1 = p$: $G = 2p(1-p) = 2\,\operatorname{Var}(B)$ where
        $B \sim \text{Bernoulli}(p)$. So the Gini gain of a split is a drop in
        label variance, not a drop in log-likelihood.

        $$\text{Entropy:}\quad \ell = \sum_k n_k \ln(n_k/n) = -n \ln 2 \cdot H_{\text{bits}}$$

        Hence

        $$\Delta \ell = n \ln 2 \, \big(H_{\text{parent}} - H_{\text{children}}\big)
                     = n \ln 2 \, \mathrm{IG}_{\text{bits}}$$

        and twice that is the likelihood-ratio (G-test) statistic
        $G^2 = 2n \ln 2 \, \mathrm{IG}$.
      prose: >-
        The two criteria optimise different objects: one a second moment, the other
        a log-likelihood. That is the whole reason a six-row, four-class node can
        make them disagree about which split to take — they are not
        approximations of each other, and near p = 0 the log charges far more per
        contaminated row than the parabola does.

    - title: "Cost-complexity pruning and the weakest link"
      latex: |
        Define the size-weighted impurity risk of a subtree and the penalised
        objective

        $$R(T) = \sum_{\text{leaves } \ell \in T} \frac{n_\ell}{n} \,
                 \mathrm{impurity}(\ell), \qquad
          R_\alpha(T) = R(T) + \alpha |T|$$

        For an internal node $t$ with subtree $T_t$, collapsing $T_t$ to a single
        leaf changes the objective by

        $$\Delta(\alpha) = \big[R(t) + \alpha\big] - \big[R(T_t) + \alpha |T_t|\big]
                         = -\big[R(T_t) - R(t)\big] + \alpha\big(1 - |T_t|\big)$$

        which is negative — i.e. collapsing helps — exactly when

        $$\alpha \;\ge\; \alpha_t = \frac{R(t) - R(T_t)}{|T_t| - 1}.$$

        Repeatedly collapsing the smallest $\alpha_t$ yields a nested sequence of
        subtrees, and each is optimal for an interval of $\alpha$.
      prose: >-
        The penalty is a price per leaf, so pruning is a penalised likelihood —
        the same shape as the ridge and lasso penalties from Regularisation, and
        the same shape as a prior that charges for parameters in Maximum
        Likelihood and Bayesian Inference. It only works if R is impurity: with
        misclassification error every leaf of a fully grown tree is pure, so
        R(T_t) = 0 everywhere and the root is always the weakest link.

  implementations:
    - language: python
      title: "CART from scratch: weighted gain, depth and leaf-size limits"
      note: >-
        This is numerically wrong in three identifiable places. (1) Thresholds are
        midpoints between adjacent *training* values, so with float32 features two
        nearly-tied values can round to the same midpoint and produce a split that
        sends every row to one side — a zero-gain node that looks like a logic
        error. (2) `score > best_score + 1e-15` breaks ties by feature order, so
        permuting the columns changes the tree; the eps is there to stop float
        noise from doing it at random, not to make the result canonical.
        (3) `min_gain` is compared against a *per-sample* gain, so its sensible
        value depends on n and does not transfer between datasets.
      code: |
        import numpy as np

        def _counts(y, K):
            return np.bincount(y, minlength=K).astype(float)

        def entropy(c):
            n = c.sum()
            if n <= 0:
                return 0.0
            p = c[c > 0] / n
            return float(-(p * np.log2(p)).sum())

        def gini(c):
            n = c.sum()
            if n <= 0:
                return 0.0
            p = c / n
            return float(1.0 - (p ** 2).sum())

        IMPURITY = {"gini": gini, "entropy": entropy}

        class Node:
            __slots__ = ("feat", "thr", "left", "right", "proba", "n", "counts")
            def __init__(self):
                self.feat = self.thr = None
                self.left = self.right = None
                self.proba = None
                self.n = 0
                self.counts = None

        def best_split(X, y, K, phi, min_samples_leaf=1):
            """Exhaustive sweep over every feature and every between-value boundary.

            The cumsum trick is what makes this O(n log n) per feature instead of
            O(n^2): the left child's histogram is a prefix sum and the right
            child's is parent minus left, so each threshold costs O(K).
            """
            n, d = X.shape
            parent = _counts(y, K)
            base = phi(parent)
            best, best_score = None, -np.inf
            for f in range(d):
                order = np.argsort(X[:, f], kind="mergesort")
                xs, ys = X[order, f], y[order]
                # one-hot so cumsum gives per-class prefix counts
                oh = np.zeros((n, K))
                oh[np.arange(n), ys] = 1.0
                cum = np.cumsum(oh, axis=0)
                for i in range(min_samples_leaf - 1, n - min_samples_leaf):
                    if xs[i] == xs[i + 1]:
                        continue                      # no boundary between ties
                    nl = i + 1
                    cl = cum[i]
                    cr = parent - cl
                    # THE WEIGHTS ARE THE POINT. Dropping nl/n and (n-nl)/n
                    # inflates a peel-off split from 0.005 to 0.500 bits.
                    score = base - (nl / n) * phi(cl) - ((n - nl) / n) * phi(cr)
                    if score > best_score + 1e-15:     # ties -> lowest index feature
                        best_score, best = score, (f, 0.5 * (xs[i] + xs[i + 1]))
            return best, best_score

        def grow(X, y, K, criterion="gini", max_depth=None,
                 min_samples_leaf=1, min_gain=0.0, depth=0):
            phi = IMPURITY[criterion]
            node = Node()
            node.n = len(y)
            c = _counts(y, K)
            node.counts = c
            node.proba = c / c.sum()
            if (c > 0).sum() <= 1:                     # pure: nothing left to gain
                return node
            if max_depth is not None and depth >= max_depth:
                return node
            if node.n < 2 * min_samples_leaf:
                return node
            split, score = best_split(X, y, K, phi, min_samples_leaf)
            if split is None or score <= min_gain:
                return node
            f, thr = split
            mask = X[:, f] <= thr
            node.feat, node.thr = f, thr
            node.left = grow(X[mask], y[mask], K, criterion,
                             max_depth, min_samples_leaf, min_gain, depth + 1)
            node.right = grow(X[~mask], y[~mask], K, criterion,
                              max_depth, min_samples_leaf, min_gain, depth + 1)
            return node

        def predict_one(node, x):
            while node.feat is not None:
                node = node.left if x[node.feat] <= node.thr else node.right
            return int(np.argmax(node.proba))

        def predict(node, X):
            return np.array([predict_one(node, x) for x in X])

        def leaves(node):
            if node.feat is None:
                return 1
            return leaves(node.left) + leaves(node.right)

        # Measured on 200 rows with coin-flip labels, min_samples_leaf=1:
        #   leaves=52, depth=18, training error=0.0, test error=0.5055.
        # The split criterion was satisfied by every single one of those splits.

    - language: python
      title: "Cost-complexity pruning with a held-out alpha, and the trap it hides"
      note: >-
        This is numerically wrong if you build the path with **misclassification**
        error as R: every leaf of a fully grown tree is pure, so R(T_t) = 0 for
        every subtree, the root is always the weakest link, and the whole tree
        collapses in one step — measured, an 83-leaf tree went to 1 leaf at
        alpha = 0.0060. It is also statistically wrong if you pass the training
        rows as the selection set: alpha = 0 always wins, so the procedure
        silently returns the unpruned tree and looks like it did nothing.
      code: |
        import numpy as np

        def gini(c):
            n = c.sum()
            return 0.0 if n <= 0 else float(1.0 - ((c / n) ** 2).sum())

        def _walk(node, acc):
            acc.append(node)
            if node.feat is not None:
                _walk(node.left, acc)
                _walk(node.right, acc)
            return acc

        def _leaves(node):
            if node.feat is None:
                return 1
            return _leaves(node.left) + _leaves(node.right)

        def _annotate(node, lc, risk):
            """lc[id] = leaf count of subtree; risk[id] = n * impurity mass."""
            if node.feat is None:
                lc[id(node)] = 1
                risk[id(node)] = node.n * gini(node.counts)
                return
            _annotate(node.left, lc, risk)
            _annotate(node.right, lc, risk)
            lc[id(node)] = lc[id(node.left)] + lc[id(node.right)]
            risk[id(node)] = risk[id(node.left)] + risk[id(node.right)]

        def ccp_path(root, n, score_fn):
            """Nested subtrees for increasing alpha. score_fn(tree) -> held-out error."""
            path = [{"alpha": 0.0, "leaves": _leaves(root),
                     "score": score_fn(root)}]
            while True:
                internal = [x for x in _walk(root, []) if x.feat is not None]
                if not internal:
                    break
                lc, risk = {}, {}
                _annotate(root, lc, risk)
                weakest = None
                for nd in internal:
                    denom = lc[id(nd)] - 1
                    if denom <= 0:
                        continue
                    # R(t) - R(T_t) over the leaves removed, per sample.
                    a = (nd.n * gini(nd.counts) - risk[id(nd)]) / denom / n
                    if weakest is None or a < weakest[0]:
                        weakest = (a, nd)
                if weakest is None:
                    break
                a, nd = weakest
                nd.feat = nd.thr = nd.left = nd.right = None
                path.append({"alpha": float(a),
                             "leaves": _leaves(root),
                             "score": score_fn(root)})
            return path

        # Measured on 250 fit rows / 150 validation rows / 4,000 test rows:
        #   alpha=0       -> 55 leaves, test error 0.35175
        #   alpha=0.0112  -> 11 leaves, test error 0.30400
        #   alpha=0.0508  ->  1 leaf,  test error 0.50225
        # The validation set chose alpha=0.0224 (4 leaves, test 0.34225) --
        # honest, and not the test-optimal choice.

  checkpoints:
    - id: cp-1
      question: >-
        Parent counts are $(1,1,2,2)$. Split A gives Gini gain 0.3056 and entropy
        gain 0.9183; split B gives 0.2778 and 1.0000. Which criterion prefers
        which split, and why does the difference exist at all?
      answerKind: short_text
      hint: >-
        Look at what each child looks like. A produces one perfectly pure leaf; B
        splits the two size-2 classes apart.
      solution: >-
        Gini prefers A (0.3056 > 0.2778); entropy prefers B (1.0000 > 0.9183).
        A isolates class 3 into a pure two-row leaf and leaves the remaining four
        rows impure. B puts classes 1 and 3 on one side and 0 and 2 on the other,
        producing two children that are each $(1/3, 2/3)$ — and entropy charges
        that $1/3$ minority $0.918$ of its one-bit ceiling, so eliminating it is
        worth more to entropy than eliminating a class entirely is worth to Gini.
        The general form: $H/G$ is 5.71 at $p = 0.001$ and 2.00 at $p = 0.5$, so
        entropy systematically over-weights rare-class contamination.
    - id: cp-2
      question: >-
        Why must the child impurities be weighted by $n_s/n$, and what does an
        unweighted average actually optimise?
      answerKind: short_text
      hint: >-
        Consider a split that isolates one row into a pure leaf and keeps the
        other 199 rows impure.
      solution: >-
        Unweighted, a pure child contributes 0 regardless of how few rows it
        contains, so the score rewards *any* pure child. On a balanced 100/100
        node, the peel-off split scores 0.005018 bits weighted and 0.500009 bits
        unweighted — 99.6× too large, and larger than any real split in the tree.
        So an unweighted average does not measure uncertainty reduction at all; it
        measures "does one child look pure", which is trivially satisfiable by
        isolating a single row, and it produces a chain of one-row leaves.
    - id: cp-3
      question: >-
        Your tree has 83 leaves, training error 0.0 and test error 0.39725. A
        7-leaf tree has training error 0.2475 and test error 0.31875. Which is
        better, and by how much in each direction?
      answerKind: short_text
      hint: >-
        Compare both numbers, not just the one that improved.
      solution: >-
        The 7-leaf tree is better by 7.85 points of test error. The extra 76
        leaves bought 24.75 points of training accuracy and cost 7.85 points of
        test accuracy. Since the deployment number is the test number, the 83-leaf
        tree is strictly worse — every additional split was locally justified by
        an impurity reduction and none of them generalised. This is why training
        error is useless for choosing depth: it is monotone by construction.
    - id: cp-4
      question: >-
        You compute the cost-complexity path using misclassification error as
        $R$. What happens, and why?
      answerKind: short_text
      hint: >-
        What is the misclassification error of each leaf in a fully grown tree?
      solution: >-
        Every leaf is pure, so $R(T_t) = 0$ for every subtree, and
        $\alpha_t = (R(t) - 0)/(|T_t| - 1)$ is minimised at the root because the
        root has the largest denominator. The whole tree collapses to one leaf in
        a single step — measured, 83 leaves to 1 at $\alpha = 0.0060$. Use
        impurity (weighted Gini or entropy) as the risk instead: it stays positive
        inside impure subtrees and produces the graded sequence of subtrees you
        wanted.
    - id: cp-5
      question: >-
        Why can a depth-2 tree not learn XOR, when a depth-2 tree can represent
        any four-region partition?
      answerKind: short_text
      hint: >-
        The tree can represent it; the greedy procedure has to *find* it, and it
        only sees one split at a time.
      solution: >-
        Representation is not the problem. On symmetric XOR every axis-aligned
        cut has an *expected* gain of zero, so the argmax over the 399 candidate
        thresholds is pure noise — and noise-chasing picks an extreme one:
        measured, the winner was the corner cut $x_0 \le -0.9414$ with a gain of
        0.0108. The tree then spends its root on that cut. Measured: the depth-2
        tree has 3 leaves and 49.5% test error against a 49.3% majority baseline,
        and the data only becomes learnable at depth 6, where test error drops to
        0.0895. A non-greedy search would take a worse first split to enable a
        good second one; CART never does.
    - id: cp-6
      question: >-
        Two engineers train on the same 400 rows and get different trees, both
        with identical hyperparameters. Give two distinct mechanisms from this
        topic.
      answerKind: short_text
      hint: >-
        One is about the criterion; one is about the sample.
      solution: >-
        (a) Criterion: Gini and entropy rank splits differently as soon as there
        are three or more classes — measured, 23.25% of test predictions differed
        between the two trees. (b) Instability: the tree is a high-variance
        estimator, so a different bootstrap sample changes the root split; across
        50 resamples the root feature was feature 0 twenty-three times, feature 1
        twenty-six times and feature 2 once, with test accuracy varying with
        standard deviation 0.0184. A third mechanism is tie-breaking, which
        depends on feature order.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A split is a question with two answers. To score it you need three
        quantities: how uncertain the node was before, how uncertain each child is
        after, and how big each child is. The score is "before minus the
        size-weighted average of after". Nothing else about a tree — depth,
        pruning, ensembling — changes that sentence.
      blocks:
        - kind: checklist
          body: |
            - Impurity of a set of labels: zero when pure, maximal when uniform
            - Gain = parent impurity - weighted mean of child impurities
            - Weights are n_child / n_parent, and they are not optional
            - Entropy uses -p log2 p, so its unit is bits
            - Gini uses 1 - sum(p^2), so its unit is a probability
      checkpoint: >-
        If a split sends 1 row left and 199 right, and the left child is pure, is
        that a good split? What number would tell you, and what would it be?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Two of the three problems are single-node computations: an impurity
        function, and a gain that combines one parent with two children. The third
        needs a sweep: sort the feature once, walk the boundary between adjacent
        distinct values, and keep cumulative class counts so each candidate costs
        constant work. Sort once, sweep once — never recompute a histogram per
        threshold.
      blocks:
        - kind: checklist
          body: |
            - Impurity: normalise counts to proportions, then one sum
            - Gain: compute both child impurities, weight, subtract from parent
            - Threshold search: sort (value, label) pairs once
            - Carry left-side class counts forward as you sweep
            - Skip boundaries where the value does not change
            - Break ties toward the smaller threshold, and say so in the docstring
      checkpoint: >-
        Why is a single sort enough for a full threshold sweep, when there are n-1
        candidate thresholds?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The shape of all three functions, without syntax.
      blocks:
        - kind: pseudocode
          body: |
            gini(counts):
                n = sum of counts
                if n == 0: return 0
                return 1 - sum((c/n)^2 for c in counts)

            gain(parent, left, right):
                nl, nr, n = sums
                if nl == 0 or nr == 0: return 0        # no split happened
                return H(parent) - (nl/n)*H(left) - (nr/n)*H(right)

            best_threshold(x, y):
                pairs = sorted(zip(x, y))
                if fewer than 2 distinct x: return (none, 0)
                total1 = count of labels equal to 1
                left1 = left0 = 0
                best = (-1, none)
                for i in 0 .. n-2:
                    add pairs[i].label to the left counts
                    if pairs[i].x == pairs[i+1].x: continue
                    nl = left1 + left0; nr = n - nl
                    gl = gini([left1, left0]); gr = gini([total1-left1, total0-left0])
                    g  = gini([total1, total0]) - (nl/n)*gl - (nr/n)*gr
                    if g > best.gain: best = (midpoint, g)
                return best
      checkpoint: >-
        In the sweep, why must the left counts be updated *before* testing the
        boundary, rather than after?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Everything reduces to two closed forms and one weighting identity.
      blocks:
        - kind: math
          body: |
            **Binary Gini.** With $p$ the fraction of class 1:
            $$G = 1 - p^2 - (1-p)^2 = 2p - 2p^2 = 2p(1-p) = 2\operatorname{Var}(B)$$

            **Binary entropy.** $$H = -p\log_2 p - (1-p)\log_2(1-p)$$
            At $p = 0.5$: $H = 1$ bit, $G = 0.5$. At $p = 0.1$: $H = 0.4690$,
            $G = 0.18$. The ratio $H/G$ runs from 2.0 at $p=0.5$ to 5.71 at
            $p = 0.001$.

            **Weighted gain.** For children with sizes $n_L, n_R$ and $n = n_L+n_R$:
            $$\Delta = \phi\!\left(\frac{n_1}{n}\right)
                     - \frac{n_L}{n}\phi\!\left(\frac{n_{1L}}{n_L}\right)
                     - \frac{n_R}{n}\phi\!\left(\frac{n_{1R}}{n_R}\right)$$
            Dropping the two $n_s/n$ factors replaces an expectation over rows
            with an average over children, which is a different (and much larger)
            quantity: 0.500009 versus 0.005018 bits on a peel-off split.

            **Incremental counts.** After sorting, the left histogram is a prefix
            sum, so $n_{1L}$ and $n_{0L}$ update in $O(1)$ per boundary and
            $n_{1R} = n_1 - n_{1L}$. That is what makes the sweep $O(n\log n)$
            rather than $O(n^2)$.
      checkpoint: >-
        The two $n_s/n$ weights sum to 1. What goes wrong if you forget them —
        does the score get larger or smaller, and always?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        Complete implementations of all three, with the guards that matter and the
        measured values the tests expect.
      blocks:
        - kind: warning
          body: >-
            Attempt all three before reading. The one that catches people is the
            threshold sweep: updating the left counts after testing the boundary
            shifts every split by one row, and the answer looks almost right.
        - kind: code
          language: python
          body: |
            import math

            def gini_impurity(counts):
                n = 0.0
                sq = 0.0
                for c in counts:
                    v = float(c)
                    if v <= 0.0:
                        continue
                    n += v
                    sq += v * v
                if n <= 0.0:
                    return 0.0
                return 1.0 - sq / (n * n)

            def _entropy(counts):
                n = 0.0
                for c in counts:
                    v = float(c)
                    if v > 0.0:
                        n += v
                if n <= 0.0:
                    return 0.0
                h = 0.0
                for c in counts:
                    v = float(c)
                    if v > 0.0:
                        p = v / n
                        h -= p * math.log2(p)
                return h

            def information_gain(parent, left, right):
                n = sum(float(c) for c in parent if float(c) > 0.0)
                nl = sum(float(c) for c in left if float(c) > 0.0)
                nr = sum(float(c) for c in right if float(c) > 0.0)
                if n <= 0.0 or nl <= 0.0 or nr <= 0.0:
                    return 0.0
                return (_entropy(parent)
                        - (nl / n) * _entropy(left)
                        - (nr / n) * _entropy(right))

            def best_gini_threshold(x, y):
                n = len(x)
                order = sorted(range(n), key=lambda i: x[i])
                xs = [x[i] for i in order]
                ys = [y[i] for i in order]
                if n < 2 or len(set(xs)) < 2:
                    return [None, 0.0]
                total1 = float(sum(1 for lab in ys if lab == 1))
                total0 = n - total1
                left1 = left0 = 0.0
                best_gain, best_thr = -1.0, None
                for i in range(n - 1):
                    if ys[i] == 1:
                        left1 += 1.0
                    else:
                        left0 += 1.0
                    if xs[i] == xs[i + 1]:
                        continue
                    nl = left1 + left0
                    nr = n - nl
                    gl = 1.0 - ((left1 / nl) ** 2 + (left0 / nl) ** 2)
                    r1, r0 = total1 - left1, total0 - left0
                    gr = 1.0 - ((r1 / nr) ** 2 + (r0 / nr) ** 2)
                    gp = 1.0 - ((total1 / n) ** 2 + (total0 / n) ** 2)
                    gain = gp - (nl / n) * gl - (nr / n) * gr
                    if gain > best_gain + 1e-15:
                        best_gain = gain
                        best_thr = 0.5 * (xs[i] + xs[i + 1])
                return [float(best_thr), float(best_gain)]

            # Measured: gini_impurity([3,1,1]) -> 0.56
            #           information_gain([6,6],[5,1],[1,5]) -> 0.3499775783516459
            #           best_gini_threshold([1,2,3,4],[0,0,1,1]) -> [2.5, 0.5]
      checkpoint: >-
        `best_gini_threshold` returns the smallest threshold among ties because the
        improvement test is strict (`>`). What would `<` or `>=` change, and why
        does a tie even happen?

  problems:
    - id: p-gini-impurity
      title: "Gini impurity from class counts"
      difficulty: easy
      prompt: >-
        Implement `gini_impurity(counts)`, where `counts` is a sequence of
        non-negative per-class counts in one node. Return
        $1 - \sum_k (n_k/n)^2$ as a float, using only entries with $n_k > 0$.
        Return `0.0` for an empty sequence or one containing only zeros.
      starter: |
        def gini_impurity(counts):
            # your implementation here
            pass
      language: python
      entry: gini_impurity
      testCases:
        - input: "[[1, 1]]"
          expected: "0.5"
          mode: json
          tolerance: 1e-9
        - input: "[[4, 0]]"
          expected: "0.0"
          mode: json
          tolerance: 1e-9
        - input: "[[1, 1, 1, 1]]"
          expected: "0.75"
          mode: json
          tolerance: 1e-9
        - input: "[[3, 1, 1]]"
          expected: "0.56"
          mode: json
          tolerance: 1e-9
        - input: "[[]]"
          expected: "0.0"
          mode: json
          tolerance: 1e-9
      solution: |
        def gini_impurity(counts):
            n = 0.0
            sq = 0.0
            for c in counts:
                v = float(c)
                if v <= 0.0:
                    continue          # zero-count classes contribute nothing
                n += v
                sq += v * v
            if n <= 0.0:
                return 0.0            # empty node: define the impurity as 0
            return 1.0 - sq / (n * n)
      solutionExplanation: >-
        Sum the squares of the counts first and divide once by $n^2$; normalising
        each count separately is the same algebra but accumulates more rounding
        error. A zero entry is skipped rather than divided by, so an all-zero or
        empty input returns 0.0 instead of raising or producing nan. The three
        informative cases: `[1,1]` gives 0.5 (the maximum for two classes),
        `[4,0]` gives exactly 0.0, and `[3,1,1]` gives $1 - 11/25 = 0.56$ — note
        that this is *not* the same as the entropy of the same counts (1.3710
        bits), which is why the two criteria can disagree.
      complexity: "O(k) time and O(1) extra space for k classes"
      tags: [gini, impurity, decision-trees]

    - id: p-information-gain
      title: "Information gain of a split"
      difficulty: medium
      prompt: >-
        Implement `information_gain(parent, left, right)`. Each argument is a
        sequence of per-class counts. Return the entropy gain in bits:
        $H(\text{parent}) - \frac{n_L}{n}H(\text{left}) -
        \frac{n_R}{n}H(\text{right})$, with $H(c) = -\sum_k p_k \log_2 p_k$ over
        non-zero entries. If either child is empty, return `0.0` — no split
        happened.
      starter: |
        import math

        def information_gain(parent, left, right):
            # your implementation here
            pass
      language: python
      entry: information_gain
      testCases:
        - input: "[[6, 6], [6, 0], [0, 6]]"
          expected: "1.0"
          mode: json
          tolerance: 1e-9
        - input: "[[6, 6], [5, 1], [1, 5]]"
          expected: "0.3499775783516459"
          mode: json
          tolerance: 1e-9
        - input: "[[1, 1, 2, 2], [0, 0, 0, 2], [1, 1, 2, 0]]"
          expected: "0.9182958340544896"
          mode: json
          tolerance: 1e-9
        - input: "[[4, 4], [3, 1], [1, 3]]"
          expected: "0.1887218755408671"
          mode: json
          tolerance: 1e-9
        - input: "[[4, 4], [4, 4], [0, 0]]"
          expected: "0.0"
          mode: json
          tolerance: 1e-9
      solution: |
        import math

        def _entropy(counts):
            n = 0.0
            for c in counts:
                v = float(c)
                if v > 0.0:
                    n += v
            if n <= 0.0:
                return 0.0                 # 0 log 0 is 0 by convention
            h = 0.0
            for c in counts:
                v = float(c)
                if v > 0.0:
                    p = v / n
                    h -= p * math.log2(p)
            return h

        def information_gain(parent, left, right):
            n = sum(float(c) for c in parent if float(c) > 0.0)
            nl = sum(float(c) for c in left if float(c) > 0.0)
            nr = sum(float(c) for c in right if float(c) > 0.0)
            if n <= 0.0 or nl <= 0.0 or nr <= 0.0:
                return 0.0                 # a degenerate split gains nothing
            # The nl/n and nr/n factors are the whole point: without them the
            # peel-off split below scores 0.5 instead of 0.005.
            return (_entropy(parent)
                    - (nl / n) * _entropy(left)
                    - (nr / n) * _entropy(right))
      solutionExplanation: >-
        Weighted by size, the two child entropies average to the conditional
        entropy $H(Y \mid \text{split})$, so the gain is the mutual information
        between the label and the split — bounded below by 0 and above by
        $H(\text{parent})$. The first case is the ceiling: a perfectly separated
        12-row node gains exactly 1.0 bit. The second is the same 12-row parent
        with a near-miss split, 0.34998 bits. The last case is the guard that
        matters — an empty child means the "split" did not partition anything, and
        returning 0.0 rather than dividing by zero keeps a sweep over degenerate
        thresholds safe.
      complexity: "O(k) time and O(1) extra space per call, for k classes"
      tags: [entropy, information-gain, mutual-information]

    - id: p-best-threshold
      title: "Best Gini threshold on one feature"
      difficulty: hard
      prompt: >-
        Implement `best_gini_threshold(x, y)`. `x` is a list of feature values,
        `y` a list of binary labels (0 or 1), same length. Consider only
        thresholds at midpoints of adjacent *distinct* sorted values, and split as
        `x <= threshold`. Return `[threshold, gain]` where `gain` is the Gini gain
        of that split. Break ties by choosing the **smallest** threshold. If there
        are fewer than two distinct values in `x`, return `[None, 0.0]`.
      starter: |
        def best_gini_threshold(x, y):
            # your implementation here
            pass
      language: python
      entry: best_gini_threshold
      testCases:
        - input: "[[1, 2, 3, 4], [0, 0, 1, 1]]"
          expected: "[2.5, 0.5]"
          mode: json
          tolerance: 1e-9
        - input: "[[0, 0, 1, 1], [0, 0, 1, 1]]"
          expected: "[0.5, 0.5]"
          mode: json
          tolerance: 1e-9
        - input: "[[1, 2, 3, 4], [0, 0, 0, 0]]"
          expected: "[1.5, 0.0]"
          mode: json
          tolerance: 1e-9
        - input: "[[0.0, 1.0, 2.0, 3.0, 4.0], [0, 1, 1, 0, 1]]"
          expected: "[0.5, 0.17999999999999994]"
          mode: json
          tolerance: 1e-9
        - input: "[[5, 5, 5], [0, 1, 0]]"
          expected: "[null, 0.0]"
          mode: json
          tolerance: 1e-9
      solution: |
        def best_gini_threshold(x, y):
            n = len(x)
            order = sorted(range(n), key=lambda i: x[i])
            xs = [x[i] for i in order]
            ys = [y[i] for i in order]
            if n < 2 or len(set(xs)) < 2:
                return [None, 0.0]

            total1 = float(sum(1 for lab in ys if lab == 1))
            total0 = n - total1
            left1 = 0.0
            left0 = 0.0
            best_gain = -1.0
            best_thr = None

            for i in range(n - 1):
                # Add row i to the LEFT before testing the boundary after it.
                if ys[i] == 1:
                    left1 += 1.0
                else:
                    left0 += 1.0
                if xs[i] == xs[i + 1]:
                    continue          # no boundary inside a run of equal values

                nl = left1 + left0
                nr = n - nl
                gl = 1.0 - ((left1 / nl) ** 2 + (left0 / nl) ** 2)
                r1 = total1 - left1
                r0 = total0 - left0
                gr = 1.0 - ((r1 / nr) ** 2 + (r0 / nr) ** 2)
                gp = 1.0 - ((total1 / n) ** 2 + (total0 / n) ** 2)

                gain = gp - (nl / n) * gl - (nr / n) * gr
                if gain > best_gain + 1e-15:      # strict: ties keep the smaller threshold
                    best_gain = gain
                    best_thr = 0.5 * (xs[i] + xs[i + 1])

            if best_thr is None:
                return [None, 0.0]
            return [float(best_thr), float(best_gain)]
      solutionExplanation: >-
        One sort, one pass, constant work per boundary: the left histogram is a
        running prefix and the right histogram is the total minus the left, so the
        sweep is $O(n \log n)$ rather than $O(n^2)$. Two details change the answer.
        Adding row $i$ to the left *before* testing the boundary is what makes
        `x <= threshold` correct; doing it afterwards shifts every split by one row
        and looks almost right. Skipping equal adjacent values matters for real
        features with ties — the fourth case, `[0,0,1,1]` with labels `[0,0,1,1]`,
        has only one candidate boundary at 0.5, and returns a gain of exactly 0.5.
        The final case returns `[null, 0.0]` because a constant feature admits no
        split at all, which the caller must handle rather than silently getting a
        degenerate threshold.
      complexity: "O(n log n) time for sorting, O(n) extra space"
      tags: [gini, threshold-sweep, cart]

  try_it: >-
    Grow a tree to depth 3 and to depth 12 on 400 rows with 8 features of which 3
    are informative, and print training and test error for both. Depth 3 should
    give 7 leaves with 0.2475 and 0.31875; depth 12 should drive training error
    down while test error rises. Then switch the criterion from Gini to entropy
    and count how many predictions change.
  interview_questions:
    - question: "Entropy and Gini look like the same criterion. Where do they actually differ?"
      level: mid
      key_points:
        - "Gini is $1 - \\sum_k p_k^2 = 2p(1-p)$ for two classes — a variance, and the probability two draws disagree."
        - "Entropy gain is mutual information between split and label, so it is a likelihood ratio for a piecewise-constant multinomial model."
        - "Their ratio $H/G$ is 5.71 at $p = 0.001$ and exactly 2.00 at $p = 0.5$, so entropy spends splits isolating rare classes that Gini treats as noise."
        - "On binary problems the two agree in ranking, but three classes are enough to invert them, and on a 400-row problem the resulting trees disagreed on 23.25% of test predictions."
      follow_up: "You have 2% positives and care about them. Which criterion, and what else must you change?"
    - question: "Your tree reports 100% training accuracy and 60% test accuracy. What is the actual fix?"
      level: senior
      key_points:
        - "Impurity gain has no generalisation term — it will drive training impurity to zero on pure noise, reaching training error 0.0 and test error 0.5055 on coin-flip labels."
        - "The knob is the stopping rule, not the criterion: depth 3 gives 7 leaves at 0.31875 test error while depth 12 gives 80 leaves and worse."
        - "Cost-complexity pruning prices a leaf with $R_\\alpha(T) = R(T) + \\alpha|T|$, and $\\alpha$ must be chosen on data the tree did not see."
        - "So the answer is a validation-driven complexity budget, not more depth and not a different impurity."
      follow_up: "You have 400 rows. Is a single pruned tree or a small forest the better use of them, and why?"
    - question: "Why must a split score be a size-weighted average of child impurity?"
      level: mid
      key_points:
        - "The weighted score is conditional entropy $H(\\text{label} \\mid \\text{side})$, which is the quantity whose decrease is information gain."
        - "The unweighted average ignores child size, so isolating a single row into a pure leaf scores 0.500009 bits instead of 0.005018."
        - "Because the bug always makes scores look better, it survives every visual inspection — the trees just look unusually good."
        - "The same weighting question returns in gradient boosting, where the analogous quantities are hessian sums rather than row counts."
  common_mistakes:
    - "Reading 100% training accuracy as a good fit, when on coin-flip labels the tree reaches training error 0.0 and test error 0.5055."
    - "Using an unweighted child-impurity average, which scores isolating one row at 0.500009 bits against the correct 0.005018 and always looks like an improvement."
    - "Assuming Gini and entropy produce the same tree — on a 400-row, 8-feature problem they disagreed on 23.25% of 4,000 test predictions."
  further_reading:
    - label: "Breiman, Friedman, Olshen & Stone, Classification and Regression Trees (1984)"
    - label: "Quinlan, C4.5: Programs for Machine Learning (1993)"
