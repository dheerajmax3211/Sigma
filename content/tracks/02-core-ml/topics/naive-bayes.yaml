id: naive-bayes
slug: naive-bayes
title: "Naive Bayes: Right Ranking, Wrong Probabilities, One False Assumption"
summary: >-
  Build the classifier straight out of Bayes' theorem, keep it out of floating
  point underflow with log-space arithmetic, and understand precisely why a
  model resting on a false assumption still ranks documents correctly while its
  probabilities are fiction.
kind: lesson
difficulty: medium
position: 9
estMinutes: 22
prerequisites: [probability-distributions, information-theory]
phase: supervised-learning
tags:
  [naive-bayes, laplace-smoothing, bayes-theorem, text-classification, dirichlet,
   log-space, calibration, zero-frequency]

body:
  big_idea: >-
    Naive Bayes adds one deliberately false assumption — tokens are independent given
    the class — and it damages only what the model claims: the ranking survives while
    the probability becomes fiction.

  problem:
    - "Your spam filter marks an invoice as spam over one unseen word: the likelihood is exactly zero and 200 tokens cannot recover it."
    - "You multiply 300 likelihoods in float64, get `0.0` for every class, and ship a model that returns `nan` on any real document."
    - "A colleague sees $P(\\text{spam}) = 0.9999997$ on an ambiguous message and concludes the model is accurate. It is overconfident, which is a different property."

  analogy: |
    A judge cannot see the defendant and asks twelve specialists, each able to
    say how much more often their one clue appears for guilty defendants. The
    judge multiplies the twelve answers — that is Bayes' theorem, and if the
    specialists were truly independent the product would be a real probability.
    They are not: the handwriting expert read the documents expert's report, so
    the judge multiplies one piece of evidence twelve times and the verdict
    comes out certain.

  concept_points:
    - "**Bayes' theorem is not where the difficulty lives; the base rate is.** At 1% prevalence, a detector with 99% sensitivity and a 5% false-positive rate has precision of **16.7%** — five of every six alarms are false. The classifier behaves exactly as specified; \"99% sensitivity\" was never the number anyone wanted. Lessons that start with independence and skip the prior teach the easy half."
    - "**The independence assumption is a parameter-count argument, not a modelling claim.** A full joint over $V = 10{,}000$ binary features needs $2^{10000}-1 \\approx 10^{3010}$ numbers — more than the atoms in the observable universe. NB needs $V \\times C = 20{,}000$ for two classes: an unestimatable table replaced by one you can fill from 500 documents, paid for by asserting something false."
    - "**Multinomial NB is a nearest-KL-centroid classifier.** Because $\\log p(x\\mid c) = \\sum_w n_w \\log p(w\\mid c) = -N\\,H(\\hat p_x, p_c)$, maximising the class score minimises the cross-entropy — equivalently the KL divergence — between the document's empirical token distribution and the class's. The class you pick is the one whose code is cheapest for this document's tokens."
    - "**Document length is a temperature knob, and duplicating features changes nothing but confidence.** The score gap is $N$ times the per-token cross-entropy gap: one copy of `[\"good\", \"bad\"]` gives $P(\\text{pos}) = 0.5185$; ten copies 0.6774; a hundred 0.99940 — same argmax. Replicating each feature $k$ times left AUC at **0.8723** for all runs while log-loss rose from 0.916 to 8.623."
    - "**A zero count is a veto, not a small penalty.** One unseen token makes $p(w\\mid c) = 0$, so $\\log p = -\\infty$ and that class's posterior is exactly 0. With $V = 5{,}000$ and a 200-document, 50-token training set, about **13.5% of the vocabulary is unseen**, and **99.93%** of 50-token test documents contain at least one such type. Smoothing is not optional."
    - "**Laplace smoothing is a Dirichlet posterior mean, and its strength is $\\lambda = N/(N+K\\alpha)$.** The estimate shrinks toward uniform: $\\hat p = \\lambda\\hat p_{\\text{MLE}} + (1-\\lambda)(1/K)$. With $N = 2{,}000$ tokens, $V = 10{,}000$ and $\\alpha = 1$, $\\lambda = 0.167$ — **83% of the probability mass is the uniform prior**. With $\\alpha = 0.01$, $\\lambda = 0.952$. Add-one is not a neutral default."

  definitions:
    - term: "Naive Bayes"
      meaning: >-
        A generative classifier that models $p(x \mid c)$ as a product of
        per-feature terms and applies Bayes' theorem. "Naive" refers solely to
        the conditional-independence assumption, not to the arithmetic.
    - term: "Conditional independence assumption"
      meaning: >-
        $p(x_1, \dots, x_n \mid c) = \prod_i p(x_i \mid c)$ — features are
        assumed independent *within* each class. It is almost always false for
        text, and it is what makes the parameter count linear in $V$.
    - term: "Multinomial NB"
      meaning: >-
        The text variant: each class owns a distribution over the vocabulary,
        documents are bags of counted tokens, and the likelihood is the product
        of per-token probabilities. Counts, not presence, are what enter.
    - term: "Bernoulli NB"
      meaning: >-
        The binary variant: each vocabulary word is a Bernoulli feature, and
        absence is modelled explicitly with a $(1 - p)$ factor. On short
        documents it often beats multinomial NB, because penalising absence is
        real information.
    - term: "Gaussian NB"
      meaning: >-
        The continuous variant: $p(x_j \mid c) = \mathcal{N}(\mu_{jc},
        \sigma_{jc}^2)$ fitted per feature per class. Cheap and strong on small
        tabular problems; it assumes each feature is normal within a class,
        which is a different false assumption with different failure modes.
    - term: "Laplace smoothing (add-one)"
      meaning: >-
        Add 1 to every count before normalising:
        $\hat p(w \mid c) = (n_{wc} + 1)/(N_c + V)$. It is the posterior mean
        under a uniform Dirichlet prior.
    - term: "Lidstone smoothing"
      meaning: >-
        The generalisation with pseudocount $\alpha$ instead of 1:
        $(n_{wc} + \alpha)/(N_c + \alpha V)$. $\alpha < 1$ is the right default
        for large vocabularies; $\alpha \to 0$ recovers the MLE.
    - term: "Dirichlet prior"
      meaning: >-
        The conjugate prior for a categorical distribution. A
        $\mathrm{Dir}(\alpha, \dots, \alpha)$ prior over $K$ outcomes plus
        multinomial counts yields a $\mathrm{Dir}(n_1 + \alpha, \dots)$
        posterior whose mean is the smoothed estimate. Conjugacy is why
        smoothing is not a hack.
    - term: "Log-sum-exp"
      meaning: >-
        $\log \sum_i e^{x_i} = m + \log \sum_i e^{x_i - m}$ with
        $m = \max_i x_i$. The standard trick for normalising log-probabilities
        without overflow or underflow. Every NB implementation needs it.
    - term: "Calibration"
      meaning: >-
        Agreement between predicted probability and observed frequency: among
        documents scored 0.8, 80% should be positive. NB is typically badly
        calibrated and well ranked. Platt scaling (a logistic fit on the score)
        and isotonic regression are the standard repairs.

  diagrams:
    - type: compare
      title: "What the model assumes vs what a document is"
      left_label: "The assumption"
      left_points:
        - "Tokens are drawn independently given the class"
        - "$p(w_1, \\dots, w_n \\mid c) = \\prod_i p(w_i \\mid c)$"
        - "One multinomial per class — 10,000 numbers for a 10,000-word vocabulary"
        - "Every occurrence is fresh, independent evidence"
      right_label: "The document"
      right_points:
        - "Words cluster into topics; one predicts the next"
        - "The true joint over 10,000 binary features has $10^{3010}$ parameters"
        - "Adjacent tokens are near-duplicates — 'New' all but determines 'York'"
        - "One topic can emit 40 correlated tokens in a row"

    - type: architecture
      title: "Where a naive Bayes prediction actually comes from"
      nodes:
        - id: text
          x: 0
          y: 1
          label: "Raw document"
          kind: client
          detail: "Tokenise, lowercase, strip punctuation. The tokeniser is part of the model: changing it invalidates every count you have."
        - id: vocab
          x: 1
          y: 1
          label: "Vocabulary lookup"
          kind: server
          detail: "Map tokens to column indices. Out-of-vocabulary tokens are dropped here — and dropping is not the same as smoothing, which is the bug this diagram exists to expose."
        - id: counts
          x: 2
          y: 1
          label: "Count vector $n_w$"
          kind: storage
          detail: "A sparse vector of token counts. Multinomial NB only ever needs these counts, which is why training is a single pass."
        - id: table
          x: 3
          y: 1
          label: "log p(w | c) table"
          kind: model
          detail: "Row per class, column per vocabulary word, each entry (n_wc + α)/(N_c + αV). This table is the model; everything else is arithmetic."
        - id: score
          x: 3
          y: 3
          label: "Σ n_w log p + log π_c"
          kind: worker
          detail: "One dot product per class. Note that it scales linearly with document length — that is the temperature effect."
        - id: lse
          x: 2
          y: 3
          label: "log-sum-exp"
          kind: server
          detail: "Subtract the max before exponentiating. Without this, exp(-2000) is 0.0 and the normaliser is a division by zero."
        - id: argmax
          x: 1
          y: 3
          label: "argmax"
          kind: server
          detail: "The decision. Invariant to any monotone rescaling of the score, which is why duplicated features and length changes cannot move it."
        - id: calib
          x: 0
          y: 3
          label: "Calibrate (optional)"
          kind: model
          detail: "Platt or isotonic fit on a held-out split. Fit after training, never on the training set, and refit when the deployment prior moves."
      edges:
        - { from: text, to: vocab, label: "tokens" }
        - { from: vocab, to: counts, label: "indices" }
        - { from: counts, to: table, label: "sum n_w log p" }
        - { from: table, to: score, label: "per class" }
        - { from: score, to: lse, label: "joint log-probs" }
        - { from: lse, to: argmax, label: "posteriors" }
        - { from: argmax, to: calib, label: "score" }

    - type: plot
      title: "Smoothing has an optimum: test log-loss vs α (n = 200 documents)"
      chart: "line"
      xLabel: "log10 α"
      yLabel: "test log-loss (nats)"
      series:
        - name: "multinomial NB, 500-word vocabulary"
          points:
            - { x: -2, y: 1.651 }
            - { x: -1, y: 1.356 }
            - { x: 0, y: 0.916 }
            - { x: 1, y: 0.463 }
            - { x: 2, y: 0.618 }

    - type: plot
      title: "NB converges from 50 documents; logistic regression needs 500"
      chart: "line"
      xLabel: "training documents"
      yLabel: "test accuracy"
      series:
        - name: "naive Bayes"
          points:
            - { x: 50, y: 0.7498 }
            - { x: 200, y: 0.7500 }
            - { x: 1000, y: 0.7565 }
            - { x: 5000, y: 0.7590 }
        - name: "logistic regression"
          points:
            - { x: 50, y: 0.6750 }
            - { x: 200, y: 0.7518 }
            - { x: 1000, y: 0.7570 }
            - { x: 5000, y: 0.7518 }

    - type: graph
      title: "One false assumption, four consequences you have to handle"
      nodes:
        - { id: indep, label: "Conditional independence" }
        - { id: dup, label: "Correlated tokens double-counted" }
        - { id: conf, label: "Posteriors pinned near 0/1" }
        - { id: rank, label: "Ranking survives" }
        - { id: cal, label: "Calibration required" }
        - { id: zero, label: "Unseen token → p = 0" }
        - { id: smooth, label: "Laplace / Lidstone" }
