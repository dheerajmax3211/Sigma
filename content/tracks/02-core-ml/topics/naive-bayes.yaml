  markdown: |
    ## Bayes' theorem is the easy part

    For a document $x$ with token counts $n_w$ and a class $c$ with prior
    $\pi_c$:

    $$\log p(c \mid x) = \log \pi_c + \sum_{w} n_w \log p(w \mid c)
      - \log \sum_{c'} \exp\!\Big(\log \pi_{c'} + \sum_w n_w \log p(w \mid c')\Big)$$

    Three pieces: the prior, the evidence, and a normaliser that is identical
    for every class and therefore irrelevant to the decision. What survives is
    a **linear function of the count vector** — which is why naive Bayes is a
    linear classifier wearing a probabilistic costume, and why its weights and a
    logistic regression's weights are estimating the same object from different
    directions.

    The part that actually bites is the prior. In *Probability Distributions*
    you saw Bayes' theorem misbehave under a skewed base rate. The same
    arithmetic governs a spam filter. At 1% prevalence, a detector with 99%
    sensitivity and a 5% false-positive rate has a precision of **16.7%**. Five
    of every six alarms are wrong, and nothing about the classifier is broken.

    ## What the assumption buys

    A full joint distribution over $V = 10{,}000$ binary features has
    $2^{10000} - 1 \approx 10^{3010}$ free parameters. You will never estimate
    it, and no smoothing trick changes that. Assume independence given the
    class and the count collapses to $V \times C = 20{,}000$ for two classes —
    a table you can fill from a few hundred documents.

    That is the trade, stated honestly: **you replace an unestimatable table
    with an estimatable one by asserting something you know to be false.** The
    question is not whether the assumption holds. It is what breaks when it
    fails, and whether the breakage matters for your use.

    ## Log space is not an optimisation

    Multiply 300 per-token probabilities of $10^{-3}$ and the true value is
    $10^{-900}$. Float64 underflows at $2.2 \times 10^{-308}$, which is
    $\log = -708.4$; at $p = 10^{-3}$ that is **103 tokens** before the product
    is exactly `0.0`. The same document in log space is $-2072.3$, a perfectly
    ordinary number.

    So the entire computation lives in logs, and the normaliser becomes a
    log-sum-exp:

    $$\log p(c \mid x) = s_c - \Big(m + \log \sum_{c'} e^{s_{c'} - m}\Big),
      \qquad m = \max_{c'} s_{c'}$$

    Subtracting the max is not decoration. Without it, `exp(-2000)` is `0.0`
    and the normaliser is zero, so every posterior is `nan`.

    ## Smoothing is a prior, not a patch

    An unseen word gives $\hat p = 0$ and $\log \hat p = -\infty$. One such
    token zeroes the class, and with a 5,000-word vocabulary and 10,000 training
    tokens about 13.5% of types are unseen — so **99.9% of 50-token test
    documents contain at least one**. Without smoothing the model is not
    slightly fragile; it is unusable.

    Add $\alpha$ to every count:

    $$\hat p(w \mid c) = \frac{n_{wc} + \alpha}{N_c + \alpha V}$$

    This is not a fudge. It is the posterior mean under a
    $\mathrm{Dir}(\alpha, \dots, \alpha)$ prior, and it can be rewritten as a
    shrinkage estimator:

    $$\hat p = \lambda\, \hat p_{\text{MLE}} + (1 - \lambda)\frac{1}{V},
      \qquad \lambda = \frac{N_c}{N_c + \alpha V}$$

    Read $\lambda$. With $N_c = 2{,}000$ and $V = 10{,}000$, add-one gives
    $\lambda = 0.167$: **83% of the mass is the uniform prior**. Add-one is a
    strong prior masquerading as a neutral default, and on a large vocabulary
    it is usually too much. $\alpha = 0.01$ gives $\lambda = 0.952$.

    | $\alpha$ | 0.01 | 0.1 | 1 | 10 | 100 |
    |---|---|---|---|---|---|
    | test log-loss | 1.651 | 1.356 | 0.916 | **0.463** | 0.618 |

    The U-shape is real and the minimum moves with corpus size. Tune it.

    ## Why it works when the assumption is false

    Write the multinomial score for a document of length $N$ with empirical
    token distribution $\hat p_x(w) = n_w / N$:

    $$\sum_w n_w \log p(w \mid c) = N \sum_w \hat p_x(w) \log p(w \mid c)
      = -N \, H(\hat p_x,\, p_c)$$

    So maximising the class score is **minimising the cross-entropy** between
    the document's token distribution and the class's — equivalently, by the
    identity from *Information Theory*, minimising $D_{KL}(\hat p_x \,\|\, p_c)$
    because $H(\hat p_x)$ is the same for every class.

    Naive Bayes is a nearest-centroid classifier under KL divergence. And here
    is the point: **comparing two distributions does not require the sample to
    have been drawn independently.** Independence is what makes the score a
    *probability*. It is not what makes the *comparison* meaningful. Correlated
    tokens distort $\hat p_x$ — they make it lumpier than a true multinomial
    draw — but the class whose distribution is closest to that lumpy
    distribution is usually still the right class.

    What breaks is the number, because of the factor $N$. The score gap between
    two classes is $N$ times the per-token cross-entropy gap. Length is a
    temperature:

    | copies of `["good","bad"]` | 1 | 10 | 100 |
    |---|---|---|---|
    | $P(\text{pos})$ | 0.5185 | 0.6774 | **0.99940** |

    Identical document, identical decision, confidence spanning three orders of
    magnitude in odds. Duplicating every feature does the same thing: AUC stayed
    at **0.8723** across $k = 1, 2, 5, 10$ replications while log-loss climbed
    from 0.916 to 8.623. The classifier is stable; the probability is fiction.

    This is the rank-versus-calibration distinction, in its purest form. If you
    need an ordering — a queue, a triage list, an AUC — NB is fine. If you need
    a number to multiply by a cost, calibrate it first with Platt scaling or
    isotonic regression on a held-out split.

    ## Choosing the variant

    | Variant | Feature | Use when |
    |---|---|---|
    | Multinomial | token counts | documents longer than ~20 tokens |
    | Bernoulli | presence/absence | short documents, and absence is informative |
    | Gaussian | per-class normal | continuous tabular features |
    | Complement | counts from *other* classes | imbalanced text, few positives |

    Complement NB estimates each class's weights from the complement of that
    class, which normalises away the tendency of standard multinomial NB to
    over-weight the majority class. It is a one-line change that reliably helps
    on skewed text. And if you want the strongest cheap baseline on text, feed
    the NB log-count ratios to a logistic regression — the NBSVM trick — which
    keeps NB's low-variance feature weighting and LR's calibration.

    ## Where it belongs

    Naive Bayes is the model you fit in 40 lines, in one pass, on a laptop, and
    that reaches 0.75 accuracy on a task where a jointly-fitted linear model
    needs ten times the data to reach the same place. It is a baseline that
    frequently wins, a spam filter that has shipped in production for twenty
    years, and the cheapest way to find out whether your features carry any
    signal at all.

    It is not the model whose probabilities you forward to a pricing engine
    without checking.

    ## The longer version

    The remaining mechanisms, verbatim: the U-shaped loss curve in $\alpha$, the
    bias–variance argument for when NB beats logistic regression, and why the
    prior you ship must be the deployment prior.

    ### Failure modes, in full

    - Your spam filter scores 99% on the test set and then, in production, marks a legitimate invoice as spam because it contains one word the training data never saw. The likelihood for that class is exactly zero, the posterior is exactly zero, and no amount of evidence from the other 200 tokens can recover it.
    - You compute $p(w_1 \mid c)\,p(w_2 \mid c)\cdots p(w_{300} \mid c)$ in a float64 and get `0.0` for every class, then divide zero by zero and ship a model that returns `nan` on every document longer than a paragraph. The arithmetic was fine; the representation was not.
    - A colleague reads your NB output, sees $P(\text{spam}) = 0.9999997$ on a message that is genuinely ambiguous, and concludes the model is "extremely accurate". The model is not accurate; it is overconfident, and those are different properties measured by different numbers.
    - Someone asks why NB "works" when its central assumption is obviously false — words in a sentence are not independent draws from a bag. "It works in practice" is not an answer. The real answer involves the rank of the decision function versus the value of the probability, and it is the same distinction you need for ROC/AUC, threshold selection, and calibration.
    - You train on a balanced sample and deploy into a stream that is 1.5% positive. Every posterior is wrong by roughly 4.2 nats of log-odds, and retraining on the same data cannot fix it, because the defect is in the prior, not the likelihoods.

    ### The mechanisms, in full

    - **Bayes' theorem is not where the difficulty lives; the base rate is.** At 1% prevalence, a detector with 99% sensitivity and a 5% false-positive rate has a precision of **16.7%** — five of every six alarms are false. The classifier is behaving exactly as specified; the specification ("99% sensitivity") was never the number anyone wanted. Every NB lesson that starts with the independence assumption and skips the prior is teaching the easy half.
    - **The independence assumption is a parameter-count argument, not a modelling claim.** A full joint over $V = 10{,}000$ binary features needs $2^{10000} - 1 \approx 10^{3010}$ numbers — more than the number of atoms in the observable universe by a factor of $10^{2210}$. NB needs $V \times C = 20{,}000$ for two classes. That is the entire trade: you replace an unestimatable table with a table you can fill from 500 documents, and you pay for it by asserting something false.
    - **Multinomial NB is a nearest-KL-centroid classifier.** Because $\log p(x \mid c) = \sum_w n_w \log p(w \mid c) = -N\,H(\hat p_x, p_c)$, maximising the class score is minimising the cross-entropy — equivalently the KL divergence — between the document's empirical token distribution $\hat p_x$ and the class's token distribution. This is *Information Theory* applied to a document: the class you pick is the one whose code is cheapest for this document's tokens.
    - **Document length is a temperature knob.** The score gap between two classes is $N$ times the per-token cross-entropy gap. In the toy corpus below, one copy of the two-token document `["good", "bad"]` gives $P(\text{pos}) = 0.5185$ with a gap of 0.0742 nats; the same document repeated 10 times gives $0.6774$; repeated 100 times gives $0.99940$. Same argmax at every length, wildly different probability. Any NB confidence you read off a short document is a statement about word count.
    - **Duplicating every feature leaves the decision function exactly unchanged.** Measured on a synthetic corpus with perfectly correlated concept words: replicating each feature $k \in \{1, 2, 5, 10\}$ times left accuracy at 0.7550, 0.7552, 0.7562, 0.7565 (the drift is tie-breaking) and left AUC at **0.8723 for all four runs**, while log-loss rose from 0.916 to 1.745 to 4.315 to **8.623** and mean confidence from 0.945 to 0.9945. The classifier's opinion did not change. Only its certainty did. This is the cleanest available proof that ranking and calibration are separate properties.
    - **A zero count is a veto, not a small penalty.** One unseen token makes $p(w \mid c) = 0$, so $\log p = -\infty$ and the posterior for that class is exactly 0 — the other 200 tokens are multiplied into nothing. This is not a rare edge case: with $V = 5{,}000$ and a 200-document, 50-token training set, about **13.5% of the vocabulary is unseen** (676 of 5,000 types), and **99.93%** of 50-token test documents contain at least one of those unseen types. Without smoothing, essentially every test document is unclassifiable.
    - **Laplace smoothing is a Dirichlet posterior mean, and its strength is $\lambda = N/(N + K\alpha)$.** The estimate is a shrinkage estimator: $\hat p = \lambda \hat p_{\text{MLE}} + (1-\lambda)(1/K)$. With $N = 2{,}000$ tokens, $V = 10{,}000$ and $\alpha = 1$, $\lambda = 0.167$ — **83% of the probability mass is the uniform prior**, and the class distribution is nearly flat. With $\alpha = 0.01$, $\lambda = 0.952$ and the data dominates. Add-one is not a neutral default; on a large vocabulary it is a very strong prior.
    - **$\alpha$ has a U-shaped loss curve, and the optimum moves with corpus size.** Measured on the synthetic corpus at $n = 200$: $\alpha = 0.01$ gives test log-loss 1.651, $\alpha = 0.1$ gives 1.356, $\alpha = 1$ gives 0.916, $\alpha = 10$ gives **0.463**, and $\alpha = 100$ gives 0.618 — over-smoothed again. The best value here is ten, not one, because the corpus is tiny. Tuning $\alpha$ on a validation split is part of building the model, not a refinement of it.
    - **Bias–variance explains when NB beats logistic regression.** Measured accuracy on the same synthetic task: at $n = 50$ documents NB scores **0.7498** against LR's 0.6750; at $n = 5{,}000$ they tie at 0.7590 and 0.7518. NB is already at 0.7500 by $n = 200$ and barely moves afterwards — it converged from 50 samples. Its per-parameter estimate uses only class-$c$ counts, so the variance of each estimate is $O\!\left(1/n_c\right)$ with no interference between features. LR must disentangle correlated features jointly and needs an order of magnitude more data to catch up. High bias, low variance: the textbook small-$n$ win.
    - **The prior you ship must be the deployment prior.** Moving from a balanced training set to 1% prevalence is a shift of $\log(0.01/0.99) - \log(1) = -4.595$ nats in log-odds — a factor of 99 in odds, applied to every document. This is the same intercept correction that *Logistic Regression* describes; it is the same algebra, because it is the same Bayes factor. Fix it at inference time, not by resampling.


  derivations:
    - title: "From Bayes' theorem to a sum of logs"
      latex: |
        $$p(c \mid x) = \frac{\pi_c \, p(x \mid c)}{\sum_{c'} \pi_{c'} \, p(x \mid c')}$$
        Assume conditional independence, so that for a document of tokens
        $w_1, \dots, w_N$:
        $$p(x \mid c) = \prod_{i=1}^{N} p(w_i \mid c)$$
        Take logs:
        $$\log p(c \mid x) = \log \pi_c + \sum_{i=1}^{N} \log p(w_i \mid c)
          - \underbrace{\log \sum_{c'} \exp\!\Big(\log \pi_{c'} + \sum_i \log p(w_i \mid c')\Big)}_{\text{same for every } c}$$
      prose: >-
        The denominator does not depend on $c$, so a classifier can drop it
        entirely and compare $\log \pi_c + \sum_i \log p(w_i \mid c)$. The
        independence step is what turns a joint table into a sum — and it is
        also why the sum grows linearly with document length, which is the
        origin of every calibration problem in this topic.

    - title: "The score is minus N times a cross-entropy"
      latex: |
        Group the sum by distinct token type rather than by position. With
        $n_w$ the count of type $w$ and $N = \sum_w n_w$:
        $$\sum_{i=1}^{N} \log p(w_i \mid c) = \sum_{w} n_w \log p(w \mid c)
          = N \sum_w \frac{n_w}{N} \log p(w \mid c) = -N \, H(\hat p_x, p_c)$$
        where $\hat p_x(w) = n_w/N$ is the document's empirical distribution.
        Since $H(\hat p_x, p_c) = H(\hat p_x) + D_{KL}(\hat p_x \,\|\, p_c)$ and
        the first term is class-independent,
        $$\arg\max_c \big[\log \pi_c - N H(\hat p_x, p_c)\big]
          = \arg\min_c \big[D_{KL}(\hat p_x \,\|\, p_c) - \tfrac{1}{N}\log \pi_c\big]$$
      prose: >-
        Naive Bayes picks the class whose token distribution is closest to the
        document's, in KL divergence. That is why the false independence
        assumption does not destroy the ranking: KL comparison is a statement
        about two distributions, not about how the sample was drawn. It is also
        why length only rescales confidence — $N$ multiplies the whole gap.

    - title: "Laplace smoothing is a Dirichlet posterior mean"
      latex: |
        Put a symmetric Dirichlet prior on the class-$c$ word distribution:
        $$p \sim \mathrm{Dir}(\alpha, \dots, \alpha), \qquad
          p(p) \propto \prod_{w} p_w^{\alpha - 1}$$
        With multinomial counts $n_{wc}$ the posterior is
        $\mathrm{Dir}(n_{1c} + \alpha, \dots, n_{Vc} + \alpha)$, whose mean is
        $$\hat p(w \mid c) = \frac{n_{wc} + \alpha}{N_c + \alpha V}
          = \lambda \, \frac{n_{wc}}{N_c} + (1 - \lambda)\frac{1}{V},
          \qquad \lambda = \frac{N_c}{N_c + \alpha V}$$
        Bias and variance follow directly:
        $$\operatorname{Var}(\hat p) = \lambda^2 \operatorname{Var}(\hat p_{\text{MLE}}),
          \qquad \operatorname{Bias}(\hat p) = (1 - \lambda)\Big(\tfrac{1}{V} - p\Big)$$
      prose: >-
        Smoothing is conjugate Bayesian updating, not a hack: the pseudocount is
        the prior, and the prior's weight relative to the data is exactly
        lambda. At N_c = 2,000 and V = 10,000 with alpha = 1, lambda = 0.167, so
        the estimate is 83% prior and its bias is enormous — which is why
        add-one destroys accuracy on large vocabularies and why alpha has to be
        tuned rather than assumed.

  implementations:
    - language: python
      title: "Multinomial naive Bayes in log space, vectorised"
      note: >-
        This version is numerically correct: every likelihood is stored as a
        log, the normaliser is a stabilised log-sum-exp, and the smoothing
        constant is a parameter rather than a hard-coded 1. The remaining
        weakness is out-of-vocabulary tokens, which are silently dropped — that
        is NOT the same as smoothing, and on drifted text it is the main source
        of quiet accuracy loss. Rebuild the vocabulary on a schedule, or map
        rare tokens to an UNK column that is counted during training.
      code: |
        import numpy as np

        def train(docs, labels, alpha=1.0):
            """Fit a multinomial NB. Returns (classes, index, logp, logprior)."""
            classes = sorted(set(labels))
            vocab = sorted({w for d in docs for w in d})
            index = {w: i for i, w in enumerate(vocab)}
            cls_of = {c: i for i, c in enumerate(classes)}

            counts = np.zeros((len(classes), len(vocab)))
            docs_per_class = np.zeros(len(classes))
            for doc, y in zip(docs, labels):
                c = cls_of[y]
                docs_per_class[c] += 1
                for w in doc:
                    counts[c, index[w]] += 1

            # Laplace / Lidstone: alpha pseudocounts in every cell, including
            # the zeros. The denominator gets alpha * V, not alpha.
            logp = np.log(counts + alpha) - np.log(
                counts.sum(axis=1, keepdims=True) + alpha * len(vocab)
            )
            logprior = np.log(docs_per_class / docs_per_class.sum())
            return classes, index, logp, logprior

        def predict_log_proba(model, doc):
            """Posterior log-probabilities for one document."""
            classes, index, logp, logprior = model
            joint = logprior.copy()
            for w in doc:
                j = index.get(w)
                if j is not None:          # OOV tokens are dropped, not smoothed
                    joint += logp[:, j]

            # Stabilised log-sum-exp. Without the max subtraction this is 0/0
            # on any document longer than ~100 tokens.
            m = joint.max()
            return joint - (m + np.log(np.exp(joint - m).sum()))

        def predict(model, doc):
            classes = model[0]
            return classes[int(np.argmax(predict_log_proba(model, doc)))]

    - language: python
      title: "The version that looks right and is numerically wrong"
      note: >-
        THIS IMPLEMENTATION IS NUMERICALLY WRONG. It multiplies raw
        probabilities, so the joint likelihood underflows to exactly 0.0 for any
        document longer than about 100 tokens at typical per-token
        probabilities (float64 bottoms out at 2.2e-308, i.e. log = -708.4, and
        at p = 1e-3 that is 103 tokens). Once every class underflows, the
        normaliser is 0 and every posterior is nan. On short documents it
        produces plausible numbers, which is what makes it dangerous: it passes
        the unit test you wrote with three-word examples and fails silently in
        production on paragraphs.
      code: |
        import numpy as np

        def train_broken(docs, labels, alpha=1.0):
            classes = sorted(set(labels))
            vocab = sorted({w for d in docs for w in d})
            index = {w: i for i, w in enumerate(vocab)}
            counts = np.zeros((len(classes), len(vocab)))
            prior = np.zeros(len(classes))
            for doc, y in zip(docs, labels):
                c = classes.index(y)
                prior[c] += 1
                for w in doc:
                    counts[c, index[w]] += 1
            # Fine so far -- this part is correct.
            p = (counts + alpha) / (counts.sum(1, keepdims=True) + alpha * len(vocab))
            return classes, index, p, prior / prior.sum()

        def predict_broken(model, doc):
            classes, index, p, prior = model
            post = []
            for c in range(len(classes)):
                joint = prior[c]                      # a probability, not a log
                for w in doc:
                    j = index.get(w)
                    if j is not None:
                        joint *= p[c, j]              # <- underflows to 0.0
                post.append(joint)
            total = sum(post)                         # <- 0.0 for long documents
            return [x / total for x in post]          # <- 0/0 -> nan

  checkpoints:
    - id: cp-1
      question: >-
        With $V = 10{,}000$ and $N_c = 2{,}000$ tokens in a class, what fraction
        of the smoothed probability mass is the uniform prior when $\alpha = 1$?
        What about $\alpha = 0.01$?
      answerKind: short_text
      hint: "Compute $\\lambda = N_c/(N_c + \\alpha V)$; the prior's share is $1 - \\lambda$."
      solution: >-
        $\lambda = 2000/(2000 + 10000) = 0.167$, so **83.3%** of the mass is the
        uniform prior. With $\alpha = 0.01$, $\lambda = 2000/2100 = 0.952$ and
        the prior's share falls to 4.8%. Add-one on a 10,000-word vocabulary is
        not a mild correction — it is the dominant term.

    - id: cp-2
      question: >-
        A document of 300 tokens comes out with every class's joint likelihood
        equal to `0.0` and the code returns `nan`. What are the two bugs, and
        what is the smallest change that fixes both?
      answerKind: short_text
      hint: "One bug is representation, one is the normaliser. They have the same fix."
      solution: >-
        The product underflows ($\log$ of the true value is below $-708.4$, and
        $-2072$ for this document), and the normaliser then divides by zero.
        Both disappear if the entire computation is carried in logs: sum
        $\log p$ instead of multiplying $p$, and normalise with
        $m + \log\sum e^{s_c - m}$ where $m = \max_c s_c$. The max subtraction
        is required — a plain `exp` of a very negative log is still zero.

    - id: cp-3
      question: >-
        You replicate every feature in your dataset 10 times and retrain. What
        happens to accuracy, to AUC, and to log-loss, and why?
      answerKind: short_text
      hint: "Multiplying the count vector by $k$ multiplies the score gap by $k$. Is that a monotone transform?"
      solution: >-
        Accuracy is unchanged (measured: 0.7550 → 0.7565, the difference is
        tie-breaking) and AUC is *exactly* unchanged (0.8723 at $k = 1, 2, 5,
        10$), because scaling the count vector scales every class score by the
        same factor — a monotone transform, so the argmax and the ranking cannot
        move. Log-loss rises from 0.916 to 8.623 and mean confidence from 0.945
        to 0.9945, because the score gap also scales by $k$ and the softmax
        turns that into certainty.

    - id: cp-4
      question: >-
        Your NB reports $P(\text{spam}) = 0.9999$ on 12% of all traffic. What do
        you do before shipping that number to a downstream system that multiplies
        it by a dollar cost?
      answerKind: short_text
      hint: "Check the calibration curve, then ask what 12% at 0.9999 implies."
      solution: >-
        Calibrate it. If 12% of traffic scores 0.9999, the model's certainties
        are not probabilities — check the reliability curve: bin predictions and
        compare mean predicted probability to observed frequency. Fit Platt
        scaling (logistic regression on the log-odds score) or isotonic
        regression on a held-out split, and refit whenever the class prior
        moves. If you only need a ranking, skip calibration and use the score
        directly; do not mix the two.

    - id: cp-5
      question: >-
        You train on a balanced sample and deploy into a 2%-positive stream.
        What is the shift in log-odds, and where do you apply it?
      answerKind: short_text
      hint: "$\\log(\\pi_{\\text{new}}/\\pi_{\\text{old}})$."
      solution: >-
        $\log(0.02/0.98) - \log(0.5/0.5) = \log(0.02041) = -3.892$ nats, i.e. a
        factor of 49 in odds against the positive class. Apply it at inference
        by adding $\log \pi^{\text{new}}_c - \log \pi^{\text{train}}_c$ to each
        class score and renormalising. Retraining on the same likelihoods will
        not find it, because the likelihoods are correct — only the prior moved.

    - id: cp-6
      question: >-
        Why does naive Bayes beat logistic regression comfortably at 50 training
        documents and tie with it at 5,000?
      answerKind: short_text
      hint: "Think about how many parameters each model estimates from each document, and what the bias of each one is."
      solution: >-
        NB estimates each $p(w \mid c)$ from class-$c$ tokens alone: one number
        per cell, variance $O(1/n_c)$, no interference between features. That is
        very low variance and very high bias, so it is near its asymptote almost
        immediately (0.7498 at $n = 50$, 0.7500 at $n = 200$). LR estimates all
        10,000 weights jointly and must disentangle correlated features, so its
        variance is much higher and it needs an order of magnitude more data
        (0.6750 at $n = 50$, 0.7518 at $n = 200$, 0.7590 at $n = 5{,}000$). At
        large $n$ the bias dominates and the two converge; at small $n$ the
        variance dominates and NB wins.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A naive Bayes classifier is two objects: a distribution over words for
        each class, and a prior over classes. To classify a document you ask
        which class's word distribution makes this document look least
        surprising, then let the prior break ties when the evidence is weak.

        Two things go wrong when you build it. Multiplying many small numbers
        together produces zero long before it produces an answer, and any word
        your training data never saw contributes a factor of zero that wipes out
        every other word in the document. Neither problem is about the
        mathematics; both are about representation.
      blocks:
        - kind: checklist
          body: |
            - What the model is: per-class word distributions + a class prior
            - What it decides: argmax over classes of prior + evidence
            - What breaks first: the product underflows around document 100
            - What breaks second: one unseen word zeroes a whole class
            - What you must not do: read the output as a calibrated probability
      checkpoint: >-
        Before reading on — if a single unseen word can zero the entire
        likelihood of a class, is that a bug in your code or a consequence of
        the estimator? What would you have to change to make it impossible?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Reach for logs first, and for pseudocounts second. Logs are not a
        performance optimisation; they are the only representation in which a
        300-token document is representable at all. Pseudocounts are not a
        hack either — they are the posterior mean under a Dirichlet prior, which
        is why they are the right answer rather than a convenient one.

        Prefer Lidstone ($\alpha$ as a tunable, often 0.01-0.1 on text) over
        add-one. Add-one is a strong prior on a large vocabulary: with 10,000
        words and 2,000 training tokens it puts 83% of the mass on the uniform
        distribution.
      blocks:
        - kind: checklist
          body: |
            - Store log p(w|c), never p(w|c)
            - Normalise with log-sum-exp, subtracting the max first
            - Add alpha to every count, and alpha*V to every denominator
            - Tune alpha on a validation split; do not default to 1
            - Handle OOV explicitly — dropping is not smoothing
      checkpoint: >-
        Why does the denominator get $\alpha V$ rather than $\alpha$? What would
        go wrong with the distribution if you added $\alpha$ to the numerator
        only?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Two passes: one to count, one to score. Everything else is
        stabilisation.
      blocks:
        - kind: pseudocode
          body: |
            # ---- train ----
            classes = sorted(unique(labels))
            vocab   = sorted(unique(all tokens))
            counts[c][w] = number of times w appears in a class-c document
            N[c]         = sum over w of counts[c][w]
            n_docs[c]    = number of class-c documents

            logp[c][w]  = log( (counts[c][w] + alpha) / (N[c] + alpha * len(vocab)) )
            logprior[c] = log( n_docs[c] / n_docs_total )

            # ---- predict ----
            for each document:
                for each class c:
                    s[c] = logprior[c]
                    for each token w in document:
                        if w in vocab:  s[c] += logp[c][w]
                        else:           handle OOV explicitly
                m = max(s)
                logZ = m + log( sum( exp(s[c] - m) ) )
                posterior[c] = s[c] - logZ
                prediction   = argmax(s)
      checkpoint: >-
        Why is `m` subtracted before the `exp`, and why is it added back
        afterwards? Convince yourself the value is unchanged and only the
        floating-point behaviour differs.

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The three identities that make the implementation obvious: Bayes to a
        sum, the sum to a cross-entropy, and smoothing to a posterior mean.
      blocks:
        - kind: math
          body: |
            Bayes, then independence, then logs:
            $$\log p(c \mid x) = \log \pi_c + \sum_{i=1}^{N} \log p(w_i \mid c) - \log Z$$
            with $Z$ identical for every class and therefore droppable.

            Grouping by token type, with $n_w$ the count and $N = \sum_w n_w$:
            $$\sum_i \log p(w_i \mid c) = \sum_w n_w \log p(w \mid c) = -N\,H(\hat p_x, p_c)$$
            so the decision is a KL comparison:
            $$\arg\max_c \big[\log \pi_c - N H(\hat p_x, p_c)\big]
              = \arg\min_c \big[D_{KL}(\hat p_x \,\|\, p_c) - \tfrac{1}{N}\log \pi_c\big]$$

            Dirichlet posterior mean:
            $$\hat p(w \mid c) = \frac{n_{wc} + \alpha}{N_c + \alpha V}
              = \lambda \hat p_{\text{MLE}} + (1-\lambda)\frac{1}{V},
              \quad \lambda = \frac{N_c}{N_c + \alpha V}$$

            Log-sum-exp:
            $$\log \sum_c e^{s_c} = m + \log \sum_c e^{s_c - m}, \quad m = \max_c s_c$$
      checkpoint: >-
        The factor $N$ multiplies the cross-entropy gap. If you doubled the
        length of every document in your corpus, what would happen to accuracy,
        to AUC, and to log-loss?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete, correct multinomial NB with tunable smoothing, explicit OOV
        handling, and a calibrated decision path.
      blocks:
        - kind: warning
          body: >-
            Read this only after writing your own. The interesting part is not
            the counting loop — it is the three guards: the max subtraction in
            the normaliser, the $\alpha V$ in the denominator, and the explicit
            decision about out-of-vocabulary tokens.
        - kind: code
          language: python
          body: |
            import math

            def logsumexp(xs):
                m = max(xs)
                return m + math.log(sum(math.exp(x - m) for x in xs))

            def train(docs, labels, alpha=0.1):
                classes = sorted(set(labels))
                vocab = sorted({w for d in docs for w in d})
                V = len(vocab)

                counts = {c: {w: 0 for w in vocab} for c in classes}
                n_docs = {c: 0 for c in classes}
                for doc, y in zip(docs, labels):
                    n_docs[y] += 1
                    for w in doc:
                        counts[y][w] += 1

                totals = {c: sum(counts[c].values()) for c in classes}
                logp = {
                    c: {w: math.log((counts[c][w] + alpha) / (totals[c] + alpha * V))
                        for w in vocab}
                    for c in classes
                }
                n = sum(n_docs.values())
                logprior = {c: math.log(n_docs[c] / n) for c in classes}
                return classes, vocab, logp, logprior

            def predict_log_proba(model, doc, oov_logp=None):
                classes, vocab, logp, logprior = model
                joint = []
                for c in classes:
                    s = logprior[c]
                    for w in doc:
                        if w in logp[c]:
                            s += logp[c][w]
                        elif oov_logp is not None:
                            s += oov_logp            # explicit OOV model
                        # else: dropped, which biases toward shorter effective docs
                    joint.append(s)
                z = logsumexp(joint)
                return [s - z for s in joint]

            def correct_prior(log_post, train_priors, deploy_priors):
                """Move a posterior from the training prior to the deployment prior."""
                adj = [lp + math.log(t) - math.log(tr)
                       for lp, tr, t in zip(log_post, train_priors, deploy_priors)]
                z = logsumexp(adj)
                return [a - z for a in adj]
      checkpoint: >-
        `correct_prior` and the NB score are the same algebra applied at
        different times. Explain why shifting the prior after training is
        equivalent to having trained on the deployment distribution — and when
        that equivalence fails.

  problems:
    - id: p-smoothed-log-prob
      title: "The smoothed log-probability"
      difficulty: easy
      prompt: >-
        Implement `smoothed_log_prob(count, total, vocab_size, alpha)`, returning
        the natural log of the Lidstone-smoothed probability
        $\ln\!\big((\text{count} + \alpha)/(\text{total} + \alpha \cdot
        \text{vocab\_size})\big)$.

        `count` is the number of times a word occurred in this class, `total` is
        the number of tokens in this class, `vocab_size` is $V$, and `alpha` is
        the pseudocount. Use `math.log`. `alpha` may be 0.0, in which case the
        function should behave like the plain MLE (do not guard against it — the
        test cases never pass count = 0 with alpha = 0).
      starter: |
        import math

        def smoothed_log_prob(count, total, vocab_size, alpha):
            # your implementation here
            pass
      language: python
      entry: smoothed_log_prob
      testCases:
        - input: "[0, 2000, 20000, 1.0]"
          expected: "-9.998797732340453"
          mode: json
          tolerance: 1e-12
        - input: "[0, 2000, 20000, 0.01]"
          expected: "-12.301382825334498"
          mode: json
          tolerance: 1e-12
        - input: "[5, 100, 10, 1.0]"
          expected: "-2.908720896564361"
          mode: json
          tolerance: 1e-12
        - input: "[5, 100, 10, 0.0]"
          expected: "-2.995732273553991"
          mode: json
          tolerance: 1e-12
        - input: "[3, 10, 5, 0.1]"
          expected: "-1.219973145672377"
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def smoothed_log_prob(count, total, vocab_size, alpha):
            numerator = count + alpha
            denominator = total + alpha * vocab_size
            return math.log(numerator / denominator)
      solutionExplanation: >-
        The denominator is `total + alpha * vocab_size`, not `total + alpha`:
        you added `alpha` to each of the `vocab_size` cells, so the total mass
        added is `alpha * V`. Getting this wrong makes the distribution sum to
        more than 1 — which is invisible on a single word and fatal on a
        document. Note how much the pseudocount matters for an unseen word:
        alpha=1 gives -9.999, alpha=0.01 gives -12.301. That 2.30 nat difference
        is exactly ln(10), because both numerator and denominator scale.
      complexity: "O(1)"
      tags: [laplace-smoothing, log-space, lidstone]

    - id: p-nb-log-posteriors
      title: "Multinomial NB from scratch"
      difficulty: medium
      prompt: >-
        Implement `nb_log_posteriors(docs, labels, test_docs, alpha)`. Fit a
        multinomial naive Bayes on `docs` / `labels` with Lidstone smoothing
        `alpha`, then return, for each document in `test_docs`, a list of
        natural-log posterior probabilities — one entry per class, **in sorted
        class order**.

        Vocabulary is the sorted set of tokens appearing in `docs`. Class priors
        are the empirical document frequencies. Tokens in a test document that
        never appeared in training must still get the smoothed probability
        $\alpha/(N_c + \alpha V)$, because they are in neither class's counts —
        do not drop them, and do not crash.

        Each returned row must be normalised: `exp` of the entries sums to 1.
      starter: |
        import math

        def nb_log_posteriors(docs, labels, test_docs, alpha):
            # your implementation here
            pass
      language: python
      entry: nb_log_posteriors
      testCases:
        - input: >-
            {"docs": [["good","great","nice","good"],["good","nice","fine","good"],
            ["great","good","nice"],["bad","awful","poor"],
            ["bad","poor","terrible","bad"],["awful","bad","poor"]],
            "labels": ["pos","pos","pos","neg","neg","neg"],
            "test_docs": [["good"]], "alpha": 1.0}
          expected: "[[-1.8997481072921512, -0.1620558593343715]]"
          mode: json
          tolerance: 1e-9
        - input: >-
            {"docs": [["good","great","nice","good"],["good","nice","fine","good"],
            ["great","good","nice"],["bad","awful","poor"],
            ["bad","poor","terrible","bad"],["awful","bad","poor"]],
            "labels": ["pos","pos","pos","neg","neg","neg"],
            "test_docs": [["good","bad"], ["zzz"]], "alpha": 1.0}
          expected: "[[-0.730928545968931, -0.6567414317155276],
            [-0.6664789334777841, -0.7205461547480598]]"
          mode: json
          tolerance: 1e-9
        - input: >-
            {"docs": [["good","great","nice","good"],["good","nice","fine","good"],
            ["great","good","nice"],["bad","awful","poor"],
            ["bad","poor","terrible","bad"],["awful","bad","poor"]],
            "labels": ["pos","pos","pos","neg","neg","neg"],
            "test_docs": [["good"]], "alpha": 0.1}
          expected: "[[-3.8644693645841377, -0.021197129201256493]]"
          mode: json
          tolerance: 1e-9
      solution: |
        import math


        def _logsumexp(xs):
            m = max(xs)
            return m + math.log(sum(math.exp(x - m) for x in xs))


        def nb_log_posteriors(docs, labels, test_docs, alpha):
            classes = sorted(set(labels))
            vocab = sorted({w for d in docs for w in d})
            V = len(vocab)
            n_docs = len(docs)

            counts = {c: {w: 0 for w in vocab} for c in classes}
            docs_per_class = {c: 0 for c in classes}
            for doc, y in zip(docs, labels):
                docs_per_class[y] += 1
                for w in doc:
                    counts[y][w] += 1

            totals = {c: sum(counts[c].values()) for c in classes}

            out = []
            for doc in test_docs:
                joint = []
                for c in classes:
                    s = math.log(docs_per_class[c] / n_docs)
                    for w in doc:
                        # OOV words have count 0 in every class, which the
                        # smoothing turns into alpha/(N_c + alpha*V) rather
                        # than a hard zero.
                        s += math.log((counts[c].get(w, 0) + alpha) /
                                      (totals[c] + alpha * V))
                    joint.append(s)

                z = _logsumexp(joint)
                out.append([s - z for s in joint])
            return out
      solutionExplanation: >-
        The class order is `sorted(set(labels))`, which here is `["neg", "pos"]`
        — neg first, pos second. Every row sums to one in probability space by
        construction, because the log-sum-exp denominator is the common
        normaliser that Bayes' theorem contributes.

        `counts[c].get(w, 0)` is what makes an unseen token survivable: without
        it you get `math.log(0)` and a `ValueError`, and conceptually a veto.
        With alpha = 1 the same token still shifts the posterior by about
        ln(1/18) = -2.89 nats, which is a real penalty but not an annihilation —
        compare the `["zzz"]` case, where the document is one unseen token and
        the two classes come out at -0.666 and -0.721, a 0.05 nat gap driven
        almost entirely by the class prior.
      complexity: "O(N + M·V) time, O(C·V) space"
      tags: [naive-bayes, log-sum-exp, smoothing, text-classification]

    - id: p-prior-correction
      title: "Prior correction at inference time"
      difficulty: medium
      prompt: >-
        Implement `correct_prior(log_posterior, train_priors, target_priors)`.

        You are given a vector of natural-log posterior probabilities produced
        by a model trained under `train_priors`, plus the class priors of the
        stream you are actually deploying into. Return the log posteriors under
        the new prior, renormalised so `exp` of the result sums to 1.

        The rule is
        $\log p_{\text{new}}(c \mid x) = \log p_{\text{old}}(c \mid x)
        + \log \pi^{\text{new}}_c - \log \pi^{\text{old}}_c$, followed by
        log-sum-exp normalisation.
      starter: |
        import math

        def correct_prior(log_posterior, train_priors, target_priors):
            # your implementation here
            pass
      language: python
      entry: correct_prior
      testCases:
        - input: >-
            {"log_posterior": [-0.6931471805599453, -0.6931471805599453],
            "train_priors": [0.5, 0.5], "target_priors": [0.01, 0.99]}
          expected: "[-4.605170185988091, -0.010050335853501506]"
          mode: json
          tolerance: 1e-9
        - input: >-
            {"log_posterior": [-0.10536051565782628, -2.3025850929940455],
            "train_priors": [0.5, 0.5], "target_priors": [0.01, 0.99]}
          expected: "[-2.484906649788, -0.08701137698962991]"
          mode: json
          tolerance: 1e-9
        - input: >-
            {"log_posterior": [-0.35667494393873245, -1.2039728043259361],
            "train_priors": [0.7, 0.3], "target_priors": [0.5, 0.5]}
          expected: "[-0.6931471805599454, -0.6931471805599452]"
          mode: json
          tolerance: 1e-9
        - input: >-
            {"log_posterior": [0.0, 0.0], "train_priors": [0.5, 0.5],
            "target_priors": [0.25, 0.75]}
          expected: "[-1.3862943611198908, -0.287682072451781]"
          mode: json
          tolerance: 1e-9
      solution: |
        import math


        def _logsumexp(xs):
            m = max(xs)
            return m + math.log(sum(math.exp(x - m) for x in xs))


        def correct_prior(log_posterior, train_priors, target_priors):
            adjusted = [
                lp + math.log(target) - math.log(train)
                for lp, train, target in zip(log_posterior, train_priors, target_priors)
            ]
            z = _logsumexp(adjusted)
            return [a - z for a in adjusted]
      solutionExplanation: >-
        Dividing out the training prior recovers the likelihood (up to a
        constant), and multiplying by the target prior reapplies Bayes' theorem
        under the deployment distribution. The renormalisation is mandatory
        because the result is no longer a distribution after reweighting — case
        two is the interesting one: a 0.9 posterior under balanced priors becomes
        **0.9167** under a 1% prior, because the likelihood ratio of 9 is not
        large enough to survive odds of 1:99. Case three is the cancellation:
        reweighting from [0.7, 0.3] to uniform sends the posterior to exactly
        [0.5, 0.5], since the posterior *was* the prior times a likelihood ratio
        of 7:3 and the new prior is 1:1.
      complexity: "O(C) time, O(C) space"
      tags: [prior-shift, calibration, deployment, bayes]

  try_it: >-
    Score a two-token document (good, bad) under a multinomial NB and then score
    the same document repeated 10 times, comparing the log-odds gap between the
    two classes. The decision should not change and the confidence should — that
    gap is document length acting as a temperature knob.
  interview_questions:
    - question: "Why does a single unseen token zero out a class, and what exactly fixes it?"
      level: mid
      key_points:
        - "One unseen token makes $p(w \\mid c) = 0$, so $\\log p = -\\infty$ and the posterior for that class is exactly 0 — the other 200 tokens multiply into nothing."
        - "It is not exotic: with $V = 5{,}000$ and a 200-document, 50-token corpus, most vocabulary entries are unseen for a given class."
        - "Laplace smoothing adds $\\alpha$ to every count, which is the posterior mean under a symmetric Dirichlet prior."
        - "Its strength is $\\lambda = N/(N + K\\alpha)$: with $N = 2{,}000$, $V = 10{,}000$ and $\\alpha = 1$, $\\lambda = 0.167$ — 83% of the probability mass is spread uniformly."
      follow_up: "You sweep $\\alpha$ and the optimum moves with corpus size. Why, and where would you start on 50 documents?"
    - question: "When does naive Bayes beat logistic regression, and why?"
      level: senior
      key_points:
        - "At $n = 50$ documents NB scored 0.7498 against LR's 0.6750 — the independence assumption is wrong but it is a strong prior, so it wins with little data."
        - "NB is at 0.7500 by $n = 200$ and barely moves; LR keeps improving as data arrives, and the two meet around $n = 5{,}000$."
        - "The mechanism is bias–variance: NB has far fewer effective parameters, so its variance is low and its bias is the price it pays."
        - "It also helps that the decision boundary is often right even when the probabilities are badly calibrated — the ranking survives the wrong assumption."
      follow_up: "You need calibrated probabilities from NB. What do you change, and what evidence tells you it worked?"
    - question: "Why does document length change the confidence but not the decision?"
      level: mid
      key_points:
        - "The score gap between classes is $N$ times the per-token cross-entropy gap, so length multiplies whatever evidence the tokens carry."
        - "One copy of the two-token document gives $P(\\text{pos}) = 0.5185$ with a gap of 0.0742 nats; repeating it 10 times scales that gap without changing its sign."
        - "Ranking is therefore preserved while calibration is destroyed — a long document looks certain for reasons unrelated to its content."
        - "That is why the multinomial score is minus the document length times a cross-entropy, and why length normalisation is a modelling choice with consequences."
  common_mistakes:
    - "Shipping a prior estimated on a balanced corpus into 1% prevalence — a shift of $-4.595$ nats, a factor of 99 in odds, applied to every document."
    - "Multiplying 300 probabilities in float64 until every class reads 0.0 and the ratio is `nan`; work in log space with a log-sum-exp."
    - "Concluding naive Bayes is broken because its probabilities are overconfident, when the ranking is what it is actually good for."
  further_reading:
    - label: "Manning, Raghavan & Schütze, Introduction to Information Retrieval, Chapter 13"
    - label: "Domingos & Pazzani, On the Optimality of the Simple Bayesian Classifier under Zero-One Loss (Machine Learning, 1997)"
