      left_label: "The usual diagnosis"
      left_points:
        - "The model is biased toward the majority class"
        - "We need a balanced training set"
        - "Resampling will fix the accuracy"
        - "SMOTE adds information about the minority"
        - "Balanced accuracy is the honest metric"
      right_label: "What is actually wrong"
      right_points:
        - "The 0.5 threshold encodes a cost ratio nobody chose"
        - "Accuracy averages over 98.8% negatives"
        - "Resampling moves the intercept by log k — nothing else, for a linear model"
        - "SMOTE interpolates inside the hull; it cannot extend the minority region"
        - "Precision at the shipping threshold is the number that matters"
