id: imbalanced-data
slug: imbalanced-data
title: "Imbalance Is a Threshold Problem, and SMOTE Is a Detour"
summary: >-
  Learn why class imbalance is a threshold problem and a metric problem rather
  than a modelling problem — and why every resampling scheme, from random
  oversampling to SMOTE, is a way of paying for a threshold move you could have
  made directly, without adding a single bit of information.
kind: lesson
difficulty: medium
position: 13
estMinutes: 23
prerequisites: [model-evaluation]
phase: classical-models
tags: [imbalance, resampling, smote, class-weights, pr-auc, threshold, calibration]

body:
  big_idea: >-
    Imbalance does not damage the ranking — it damages the default threshold and the
    default metric, so every resampling scheme is an information-free detour to a
    threshold you could have moved directly.

  problem:
    - "You train at 1.22% prevalence, read the confusion matrix at threshold 0.5, and conclude the model is broken — the threshold was never chosen."
    - "You balance the training set, watch recall jump from 2% to 78%, and report it as improvement: the ranking never moved, only the cut point."
    - "Your team spends two weeks arguing SMOTE versus class weights, and the difference is 0.0008 AP — 0.069 standard deviations of the bootstrap noise."

  analogy: |
    A hiring pipeline: 1,200 applicants, 14 qualified. A consultant "fixes the
    imbalance" by photocopying each qualified CV eighty-five times, so the pile
    is half qualified. You have not met a single new candidate — only changed
    where you stop reading. SMOTE is the next consultant: average two finalists'
    CVs and you get a candidate with five years of each, worse at both than
    either.

  concept_points:
    - "**The ratio is not the problem; the threshold is.** At 1.22% prevalence a well-calibrated model at the default 0.5 flags 30 of 80,000 rows and catches 20 of 976 positives — recall 0.0205, precision 0.6667. Move the threshold to 0.0099 and the *same weights* catch 800 (recall 0.8197) at precision 0.0380. The 0.5 default claims a miss and a false alarm cost the same."
    - "**Class weights and random oversampling are the same intercept shift, and the shift is $\\log k$.** Weighting positives by the balancing ratio $k = 85.269$ moved the fitted intercept by 4.4431 against a predicted $\\log k = 4.4458$. The oversampled model at 0.5 must equal the unweighted model at $1/(1+k) = 0.01159$: measured 18,608 flagged with recall 0.7828 against 18,448 and 0.7797."
    - "**SMOTE cannot leave the convex hull, and multimodality makes it fabricate.** Every synthetic point is a convex combination of two real positives: all 116,844 synthetic points fell inside the minority's per-feature box, the furthest 1.0887 from any real positive. With two minority clusters 8.0 apart and $k=5$, 20.2% of 4,000 synthetic points landed in the empty gap. Filling interior gaps is not extending the region."
    - "**Never rebalance the evaluation set.** The same predictions, scored against test sets of increasing positive rate, give AP 0.1510 at 1.22%, 0.2716 at 3%, 0.8691 at 50% — while ROC-AUC stays at 0.8611, 0.8612, 0.8677. Rebalancing the test set changes the question from \"when I flag, am I right?\" to \"can I rank one positive against one negative?\" and keeps the old name."
    - "**Balancing asserts a specific cost ratio, and it is usually wrong.** A 50/50 training set says a miss costs $(1-\\pi)/\\pi \\approx 85$ times a false alarm. Measured: at 1:1 the balanced operating point cost 18,056 against 964 for the cost-optimal threshold (18.7× worse); at 100:1 it cost 39,044 against 37,865 (1.03×, nearly right); at 1000:1 it under-corrected by 3.30×."
    - "**Resampling destroys calibration, and the repair is one intercept.** A model fit on the 50/50 resample predicts a mean probability of 0.3080 on the natural test set whose true rate is 0.0122 — ECE 0.2958. The exact prior correction recovered a mean of 0.01217 and ECE 0.00048, ranking untouched. The naive rescale $p\\cdot\\pi_t/\\pi_s$ gives 0.00753, 38% low, because it is not a probability transform."

  definitions:
    - term: "Prevalence (base rate), $\\pi$"
      meaning: >-
        The fraction of positives in the population you will deploy on. It sets
        the constant-classifier accuracy $(1-\pi)$, caps attainable precision,
        and determines how large the threshold correction has to be.
    - term: "Resampling"
      meaning: >-
        Changing the class composition of the *training* set by duplicating
        rows (oversampling), deleting rows (undersampling), or synthesising
        rows. It changes the effective prior, never the information content.
    - term: "Random oversampling (ROS)"
      meaning: >-
        Duplicating minority rows until the classes are at the desired ratio.
        For any model with a likelihood, duplicating a row k times is identical
        to weighting it k, which for a logistic model is an intercept shift of
        log k.
    - term: "Random undersampling (RUS)"
      meaning: >-
        Deleting majority rows until the classes are at the desired ratio. It
        throws away real evidence, so it increases the variance of everything
        estimated about the majority class — including precision.
    - term: "SMOTE"
      meaning: >-
        Synthetic Minority Oversampling Technique. For each synthetic row, pick
        a real minority point, pick one of its k nearest minority neighbours,
        and take a uniform random point on the segment between them. The result
        lies in the convex hull of the minority class by construction.
    - term: "Class weight / `scale_pos_weight`"
      meaning: >-
        A per-class multiplier in the loss. For logistic regression it is an
        intercept shift; for trees and neural networks it also changes split
        selection and leaf values, so it is not a pure threshold move there.
    - term: "Effective prior"
      meaning: >-
        The positive rate the trained model's probabilities actually refer to —
        the resampled training rate, not the deployment rate. Every predicted
        probability is conditioned on it whether you intended that or not.
    - term: "Prior correction (intercept correction)"
      meaning: >-
        Multiplying the model's odds by $[\pi_t/(1-\pi_t)]/[\pi_s/(1-\pi_s)]$
        to move probabilities from the training prior $\pi_s$ to the deployment
        prior $\pi_t$. Exactly reverses the effect of resampling on calibration.
    - term: "Average precision (AP)"
      meaning: >-
        The step-wise area under the precision-recall curve,
        $\sum_n (R_n - R_{n-1}) P_n$. Prevalence-sensitive by construction, and
        the standard summary for rare-positive ranking.
    - term: "Cost-sensitive threshold"
      meaning: >-
        The threshold that minimises $c_{FN}\,\text{FN} + c_{FP}\,\text{FP}$.
        For calibrated probabilities it is exactly $c_{FP}/(c_{FN}+c_{FP})$,
        independent of prevalence.
    - term: "Effective number of samples"
      meaning: >-
        $ (1-\beta^{n})/(1-\beta)$ for a class with $n$ examples — a soft cap on
        how much a class should be up-weighted. Used to build class-balanced
        losses that do not over-weight a class that already has thousands of
        examples.
    - term: "Tomek link"
      meaning: >-
        A pair of nearest neighbours of opposite classes. Removing the majority
        member of each such pair cleans the boundary rather than rebalancing the
        classes — undersampling aimed at noise instead of at volume.

