id: regularisation
slug: regularisation
title: "A Penalty Is a Prior With a Price: Ridge, Lasso, Elastic Net"
summary: >-
  Turn a penalty into a prior you can defend, derive ridge as a spectral filter
  and lasso as a subgradient at a corner, and pick between them using numbers —
  degrees of freedom, the bias-variance curve, and the exact zeros each one can
  and cannot produce.
kind: lesson
difficulty: medium
position: 2
estMinutes: 26
prerequisites: [linear-regression, convexity]
phase: supervised-learning
tags: [regularisation, ridge, lasso, elastic-net, map, sparsity, bias-variance]

body:
  big_idea: >-
    A penalty is a prior with a price: ridge shrinks every singular direction by
    $\sigma_i^2/(\sigma_i^2+\lambda)$, lasso zeroes some outright, and the choice claims
    the truth is dense or sparse.

  problem:
    - "Your 30-row, 12-feature fit has test error 0.80, almost all variance; ridge at $\\lambda=3$ gets 0.58 from the same data."
    - "Two features correlated 0.994 give coefficients $+1.95$ and $-2.90$ with VIF 88: predictions fine, and \"which one does the work?\" has no answer."
    - "You have 400 features and 120 rows; lasso zeroes 380, you report the other 20 as \"the drivers\", and a bootstrap changes the list every time."

  analogy: |
    A compressor turns the whole signal down in proportion: a part at −20 dB and
    one at −3 dB both get reduced, and neither becomes silence. A noise gate has
    a threshold: anything below it is switched off completely. Ridge is the
    compressor — every coefficient scaled by $\sigma_i^2/(\sigma_i^2+\lambda)$,
    never zero. Lasso is the gate: below $\lambda$ the coefficient is exactly
    zero.

  concept_points:
    - "**A penalty is a prior, and $\\lambda$ is the exchange rate between the data and that belief.** Put $\\beta \\sim \\mathcal{N}(0,\\tau^2I)$ and the posterior mode is exactly ridge with $\\lambda = \\sigma^2/\\tau^2$. On standardised features, $\\lambda$ says how many times more plausible you find \"this coefficient is zero\" than the data does."
    - "**Ridge has a closed form, and it is a filter on singular directions.** With $X = U\\Sigma V^\\top$, the component along the $i$-th right singular vector is scaled by $\\sigma_i^2/(\\sigma_i^2+\\lambda)$. With singular values 18.54 and 0.991, $\\lambda=1$ gives factors 0.997 and 0.496; at $\\lambda=100$ they are 0.775 and 0.0097, and $\\kappa(X^\\top X+\\lambda I)$ falls from 350 to 4.39."
    - "**Degrees of freedom is a continuous count, and it is the number to report.** $\\operatorname{df}(\\lambda) = \\sum_i \\sigma_i^2/(\\sigma_i^2+\\lambda)$, running from $p$ at $\\lambda=0$ to 0. On a $30\\times12$ design that is 12.00 at $\\lambda=0$, 9.18 at 3, 6.77 at 10, 2.53 at 80. A 12-feature ridge model at $\\lambda=10$ has the complexity of a 6.8-parameter model, so counting features compares the wrong numbers."
    - "**Lasso is the subgradient at a corner, which is why it reaches exactly zero.** The coordinate condition is $0 \\in \\frac1n x_j^\\top(y-Xw) + \\lambda\\partial|w_j|$, and $\\partial|0| = [-1,1]$ is an interval, not a point. Solving gives $w_j = \\operatorname{sign}(\\rho_j)\\max(|\\rho_j|-\\lambda, 0)/\\|x_j\\|^2$. With $\\|x_j\\|^2/n = 1$ and $\\lambda=0.5$: 0.30 maps to 0, 0.70 to 0.20, 1.20 to 0.70. Those zeros are the exact minimiser."
    - "**$\\lambda$ is only meaningful relative to $\\lambda_{\\max}$.** $\\lambda_{\\max} = \\max_j|x_j^\\top y|/n$ is the smallest penalty that zeroes every coefficient, and it is a property of the data. On a 100-row, 10-feature design $\\lambda_{\\max} = 1.0881$; the nonzero count is 0 at $\\lambda_{\\max}$, 5 at $0.5\\lambda_{\\max}$, 9 at $0.02\\lambda_{\\max}$. A path reported as \"$\\lambda$ from 0.001 to 10\" is unreadable — quote $\\lambda/\\lambda_{\\max}$."
    - "**Standardise, and never penalise the intercept.** The penalty charges $\\lambda|\\beta_j|$ in units of $y$ per unit of $x_j$, so a feature measured in thousands is charged a thousandth as much per unit of real effect. On a 200-row design at $\\lambda=100$, the unit-scale coefficient keeps 68% of its OLS value and the 1000-scale one 98%; after standardising both sit at 64% and 65%."

  definitions:
    - term: Regularisation
      meaning: >-
        Adding a penalty — equivalently a prior — to a fitting objective so the
        estimator prefers simpler coefficient vectors. It buys variance
        reduction at the cost of bias, and the exchange rate is $\lambda$.
    - term: Penalty term ($\Omega$)
      meaning: >-
        The function added to the loss. $\frac{1}{2}\|\beta\|_2^2$ for ridge,
        $\|\beta\|_1$ for lasso,
        $\alpha\|\beta\|_1 + \frac{1-\alpha}{2}\|\beta\|_2^2$ for elastic net.
        Scaling conventions differ between libraries, which is why $\lambda$
        values are not portable.
    - term: Ridge regression
      meaning: >-
        Least squares plus an L2 penalty,
        $\frac{1}{2n}\|y - X\beta\|^2 + \frac{\lambda}{2}\|\beta\|_2^2$. Closed
        form $(X^\top X + \lambda I)^{-1}X^\top y$, unique for every
        $\lambda > 0$, and it never produces an exact zero.
    - term: Lasso
      meaning: >-
        Least squares plus an L1 penalty,
        $\frac{1}{2n}\|y - X\beta\|^2 + \lambda\|\beta\|_1$. The kink at zero
        produces sparse solutions; the problem is convex but not differentiable,
        so it needs subgradient or coordinate-descent methods.
    - term: Elastic net
      meaning: >-
        A convex combination of the two penalties. Strictly convex whenever
        $\lambda(1-\alpha) > 0$, so it is unique even with duplicated columns,
        and it spreads weight across correlated features instead of picking one.
    - term: Shrinkage factor
      meaning: >-
        For ridge, $\sigma_i^2/(\sigma_i^2+\lambda)$ — the multiplier applied to
        the solution's component along singular direction $i$. It depends on the
        design's spectrum, not on the size of the coefficient, which is why
        ridge is called linear shrinkage.
    - term: Soft-thresholding
      meaning: >-
        $S_\lambda(z) = \operatorname{sign}(z)\max(|z| - \lambda, 0)$. The exact
        lasso solution in the orthonormal-design case and the per-coordinate
        update in coordinate descent. It is continuous, so it shrinks and
        selects at the same time.
    - term: Subgradient ($\partial f$)
      meaning: >-
        The set of all slopes that support a convex function at a point. At the
        kink of $|x|$ it is the interval $[-1, 1]$, and the optimality condition
        $0 \in \partial f$ is what allows a lasso coefficient to sit exactly at
        zero.
    - term: Tuning parameter ($\lambda$)
      meaning: >-
        The strength of the penalty. In the Bayesian reading
        $\lambda = \sigma^2/\tau^2$: noise variance over prior variance, so a
        tighter prior means a larger $\lambda$. Reported without a scale it
        carries almost no information.
    - term: Lambda_max (λ_max)
      meaning: >-
        $\max_j |x_j^\top y|/n$, the smallest penalty for which every
        coefficient is exactly zero. Lasso and elastic-net paths are always
        quoted as fractions of it because it is the only scale-free anchor the
        data provides.
    - term: Effective degrees of freedom
      meaning: >-
        $\operatorname{tr}(H_\lambda)$ where $H_\lambda$ maps $y$ to fitted
        values. For ridge it is $\sum_i \sigma_i^2/(\sigma_i^2+\lambda)$; for
        lasso it is the number of nonzero coefficients. It is the parameter
        count to use in AIC, BIC and GCV.
    - term: MAP estimate
      meaning: >-
        The posterior mode: the parameter value maximising likelihood times
        prior. Ridge is the MAP estimate under a Gaussian prior on the
        coefficients, lasso under a Laplace prior, which is where the two
        penalties come from rather than being invented.
    - term: Laplace prior
      meaning: >-
        $p(\beta_j) \propto \exp(-|\beta_j|/b)$, a two-sided exponential with a
        sharp peak at zero. Its negative log is linear in $|\beta_j|$, which is
        the L1 penalty; the sharp peak is the probabilistic statement of
        "I expect many coefficients to be exactly zero".
    - term: Active set / support
      meaning: >-
        The indices with $w_j \neq 0$. For lasso this is the model's parameter
        count; for ridge the support is always everything, so the concept does
        not apply and reporting it is meaningless.
    - term: Standardisation
      meaning: >-
        Centring each column and dividing by its standard deviation, fitted on
        the training fold only. Mandatory before a penalty, because the penalty
        is charged in units of the column and two features on different scales
        are otherwise penalised unequally by construction.
    - term: Oracle property
      meaning: >-
        The asymptotic claim that an estimator selects the true support and then
        estimates the nonzero coefficients at the same rate as if the support
        were known. Lasso achieves it only under irrepresentability conditions
        that correlated features routinely violate, which is why "lasso found
        the true features" is not a safe claim on real data.

