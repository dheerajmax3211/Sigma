id: dimensionality-reduction
slug: dimensionality-reduction
title: "PCA, LDA, t-SNE: Choosing Which Structure to Throw Away"
summary: >-
  Choose the reduction that preserves what your task actually needs — variance
  (PCA), class separation (LDA), or neighbourhoods (t-SNE, UMAP) — and know
  which of the four is allowed to produce features a model trains on.
kind: lesson
difficulty: medium
position: 11
estMinutes: 23
prerequisites: [linear-algebra-foundations, clustering]
phase: classical-models
tags: [pca, lda, tsne, umap, svd, dimensionality-reduction, visualisation]

body:
  big_idea: >-
    Nothing is being reduced — you choose which structure to keep: PCA keeps variance,
    LDA keeps class separation, t-SNE keeps neighbourhoods, and the wrong choice deletes
    the signal your task needed.

  problem:
    - "You run PCA to two dimensions, see the classes overlap, and conclude there is no signal — a supervised projection on the same data separates them perfectly."
    - "You use t-SNE coordinates as features because the picture was beautiful. Refit the embedding and the score collapses to chance."
    - "Your \"keep 95% of the variance\" rule kept 43 of 50 columns, so the reduction you added for speed made the model slower."

  analogy: |
    A library has 5,000 books and you must summarise each on two pages. **PCA**
    keeps the two pages whose text varies most across the collection — which
    might be the copyright page and the printer's address. **LDA** keeps the two
    pages that best separate good books from bad. **t-SNE** draws a seating
    chart instead: books cited together sit together, and it says nothing about
    how far apart the shelves really are.

  concept_points:
    - "**PCA is the SVD of the centred matrix, and nothing else.** On a 600×50 three-class set the leading component holds 3.67% of the variance, the \"keep 95%\" rule retains 43 of 50 columns, and the participation ratio of the spectrum is 43.03. That is the whole story: this data has no low-dimensional *variance* profile, so PCA cannot shrink it without discarding most of it."
    - "**PCA never sees the labels, so its directions have no reason to be class-aware.** Take two 4-D classes separated by 1.0 along coordinate 1 while coordinate 2 carries within-class variance 4. The first principal component holds 54.97% of the variance, has a Fisher ratio of 0.00157, and delivers 51.0% 1-NN accuracy — chance. You found the direction of greatest variation, and it is noise."
    - "**Same target dimension, completely different information.** On the 600×50 set, 1-NN accuracy is 72.7% in the original 50 dimensions, 56.7% after PCA to 2, 82.3% after PCA to 10, and 100.0% after LDA to 2. PCA to 2 is *worse than doing nothing*, because the three class means lie on three orthogonal axes and two dimensions can carry at most two of them."
    - "**LDA is Fisher's criterion, and its rank is capped at $C-1$.** Maximise $w^\\top S_b w / w^\\top S_w w$; the optimum solves $S_w^{-1} S_b w = \\lambda w$, and for two classes $w \\propto S_w^{-1}(\\mu_1 - \\mu_0)$. Because $S_b$ is a sum of rank-one terms, three classes give 2 dimensions and ten give 9, whether you started from 50 columns or 768."
    - "**LDA breaks when $p$ approaches $n$, and the failure is silent.** With $n = 100$ samples, 4 real features and 200 pure-noise columns, LDA scored 53.1% on held-out data against 66.0% using only the 4 real features — the singular $S_w$ turned the extra columns into a discriminator fitted to noise. Shrink the scatter ($S_w + \\lambda I$) or reduce with PCA first."
    - "**t-SNE and UMAP are not feature transforms.** Three t-SNE runs on the same 600 points gave within-run 1-NN accuracies of 81.3%, 85.0% and 85.3%; trained on one and tested on another after Procrustes alignment, the classifier scored 48.3% and 57.7% against 33.3% chance. `TSNE` has no `transform` method, and the gaps are artefacts: a 5.87 : 1 input ratio came out 1.09 : 1."

  definitions:
    - term: Principal component
      meaning: >-
        A unit vector $w$ maximising $\operatorname{Var}(X w)$ for centred
        $X$, equivalently a right singular vector of $X_c$. Components are
        orthogonal and ordered by the variance they capture.
    - term: Explained variance ratio
      meaning: >-
        $\sigma_i^2 / \sum_j \sigma_j^2$ for the $i$-th singular value of the
        centred matrix. A statement about the spectrum of $X$, not about how
        useful the component is for any task.
    - term: Score (projection)
      meaning: >-
        $Z = X_c V_k$ — the $n \times k$ matrix of coordinates in the retained
        subspace. This is what you actually feed downstream.
    - term: Reconstruction error
      meaning: >-
        $\sqrt{\sum_{i>k} \sigma_i^2 / \sum_i \sigma_i^2}$, the relative
        Frobenius error of the best rank-$k$ approximation. Truncating the SVD
        attains it, by Eckart–Young; on the 600×50 set it is 0.964 at $k = 2$
        and 0.218 at $k = 43$.
    - term: Whitening
      meaning: >-
        Transforming to coordinates with identity covariance, $Z = X_c V
        \Lambda^{-1/2}$. Decorrelates *and* equalises variance, which is why it
        amplifies any direction whose eigenvalue is near zero.
    - term: Fisher's linear discriminant
      meaning: >-
        The direction $w$ maximising between-class over within-class projected
        scatter. For two classes $w \propto S_w^{-1}(\mu_1 - \mu_0)$; for $C$
        classes the solution set spans at most $C - 1$ dimensions.
    - term: Within-class scatter
      meaning: >-
        $S_w = \sum_c \sum_{i \in c} (x_i - \mu_c)(x_i - \mu_c)^\top$ — the
        pooled covariance, unnormalised. It is the matrix that goes singular
        when $p \ge n$.
    - term: Between-class scatter
      meaning: >-
        $S_b = \sum_c n_c (\mu_c - \mu)(\mu_c - \mu)^\top$ — how far the class
        means sit from the global mean, weighted by class size. Rank at most
        $C - 1$.
    - term: Perplexity
      meaning: >-
        $2^{H}$ where $H$ is the entropy of a point's neighbour distribution.
        t-SNE tunes each point's Gaussian width to hit a target entropy
        $\log(\text{perplexity})$; the default 30 corresponds to 3.40 nats.
    - term: Crowding problem
      meaning: >-
        In two dimensions there is not enough area to place all moderately
        distant neighbours at proportionate distances, so a faithful map
        collapses them. t-SNE's heavy-tailed kernel fixes it by allowing far
        points to be very far.
    - term: Neighbourhood preservation
      meaning: >-
        The mean fraction of a point's $k$ nearest neighbours in the input that
        remain among its $k$ nearest in the embedding. It is the honest metric
        for a visualisation, and the only claim a t-SNE plot supports.
    - term: Manifold hypothesis
      meaning: >-
        The assumption that high-dimensional observations concentrate near a
        low-dimensional manifold, so the intrinsic dimension is far below the
        ambient one. Every method in this topic is a bet on some version of it.
    - term: Kernel PCA
      meaning: >-
        PCA performed in an implicit feature space through the $n \times n$
        Gram matrix. It costs $O(n^2)$ memory — 80 GB at $n = 100{,}000$ in
        float64 — which is why it is a small-data method.

  diagrams:
    - type: compare
      title: "PCA and LDA on the same 600×50 data, both reduced to 2 dimensions"
      left_label: "PCA to 2 — preserves variance"
      left_points:
        - "Keeps 7.08% of the variance and 56.7% 1-NN accuracy"
        - "Worse than the 72.7% you get from not reducing at all"
        - "Never sees y; the three class axes are treated as three ordinary directions"
        - "One fit, then transform() applies to any future point"
      right_label: "LDA to 2 — preserves class separation"
      right_points:
        - "100.0% 1-NN accuracy in the same two dimensions"
        - "Rank capped at C − 1 = 2, so no third dimension exists to find"
        - "Needs labels, and needs Sw invertible — breaks at p ≥ n without shrinkage"
        - "Also has a genuine transform for held-out points"
    - type: plot
      title: "On this data, two components explain 7% of the variance"
      chart: "line"
      xLabel: "components kept, k"
      yLabel: "fraction (0–1)"
      series:
        - name: "cumulative variance explained"
          points:
            - { x: 1, y: 0.0367 }
            - { x: 2, y: 0.0708 }
            - { x: 5, y: 0.1671 }
            - { x: 10, y: 0.3124 }
            - { x: 20, y: 0.5574 }
            - { x: 43, y: 0.9525 }
            - { x: 49, y: 0.9974 }
        - name: "relative reconstruction error"
          points:
            - { x: 1, y: 0.9815 }
            - { x: 2, y: 0.9640 }
            - { x: 5, y: 0.9126 }
            - { x: 10, y: 0.8292 }
            - { x: 20, y: 0.6653 }
            - { x: 43, y: 0.2179 }
            - { x: 49, y: 0.0510 }
    - type: architecture
      title: "Where each method belongs in a pipeline"
      nodes:
        - { id: raw, x: 0, y: 1, label: "Raw features", kind: client, detail: "768 columns, mixed units. Every method below starts from the same matrix and is fitted on the training split only." }
        - { id: scale, x: 1, y: 1, label: "Standardise", kind: server, detail: "Fit the scaler on train and reuse it. Standardising changes which directions PCA finds — on the 4-D masked-discriminator data it flattened the spectrum from 0.550/0.178/0.144/0.129 to 0.263/0.260/0.249/0.228." }
        - { id: red, x: 2, y: 0, label: "PCA or LDA", kind: model, detail: "Supervised? Use LDA, at most C−1 dimensions. Unsupervised? Use PCA, and choose k by reconstruction error or validation. Both have a transform, so the serving path is the same call as training." }
        - { id: viz, x: 2, y: 2, label: "t-SNE / UMAP", kind: worker, detail: "Fitted once on a sample to answer a question about the data. Output goes to a figure. It does not go into the model, because there is no stable coordinate for a point that was not in the fit." }
        - { id: model, x: 3, y: 0, label: "Downstream model", kind: server, detail: "Classifier, clusterer, or ANN index. Gets the projected matrix and never sees the raw 768 columns." }
        - { id: figure, x: 3, y: 2, label: "A figure", kind: client, detail: "The end of the line. If you find yourself saving these coordinates to a feature table, the pipeline has just acquired a bug that will not reproduce." }
      edges:
        - { from: raw, to: scale, label: "fit on train" }
        - { from: scale, to: red, label: "transform" }
        - { from: scale, to: viz, label: "sample" }
        - { from: red, to: model, label: "k features" }
        - { from: viz, to: figure, label: "render" }
      caption: >-
        Two branches, one rule: the branch that produces features must have a
        transform that can be applied to a single unseen row. The other branch
        produces a picture.
    - type: pipeline
      title: "The protocol that keeps a reduction honest"
      nodes:
        - label: "Split before you reduce"
          note: "train / test, or fold by fold"
          detail: "Fitting a scaler or a PCA on train+test leaks the test set's covariance into training. Cross-validation does not fix this if the reduction happens outside the loop."
        - label: "Fit the reducer on train only"
          note: "pca.fit(X_train)"
          detail: "The reducer is a model with parameters — a mean, a set of directions, k of them. Its parameters must be estimated from training data alone."
        - label: "Transform both splits with that same object"
          note: "pca.transform(X_test)"
          detail: "Never refit on test. A different mean shifts every score, and the model sees a coordinate frame it was not trained in."
        - label: "Fit the downstream model on the scores"
          note: "clf.fit(Z_train, y_train)"
          detail: "The model's input width is now k. Any later change to k invalidates the fitted model."
        - label: "Report on transformed test scores"
          note: "clf.score(Z_test, y_test)"
          detail: "The only number that tells you whether the projection preserved what the classifier needed. A good training score with a bad test score is the signature of a supervised reducer overfitting."
    - type: compare
      title: "t-SNE and UMAP: same job, different machinery"
      left_label: "t-SNE"
      left_points:
        - "Student-t kernel with 1 degree of freedom in the plane"
        - "Minimises KL(P‖Q); the asymmetry is why gaps between clusters are free"
        - "Perplexity 30 by default — a local scale, not a global one"
        - "No transform() in sklearn: a new point has no defined coordinates"
      right_label: "UMAP"
      right_points:
        - "Fuzzy simplicial set over the k-NN graph, cross-entropy objective"
        - "n_neighbors=15 and min_dist=0.1 by default; both change the picture"
        - "Usually faster, and better at keeping some global shape"
        - "Has transform(), but it maps onto a fixed layout — approximation, not a projection"

  markdown: |
    ## Four methods, four answers to "what should survive?"

    Every reduction is lossy, so every method has to answer one question:
    *which structure must survive the compression?* The four methods in this
    topic disagree, and almost every production failure comes from using a
    method whose answer is not the answer your task needs.

    | Method | Preserves | Needs labels | Output dimension | Safe as features? |
    |---|---|---|---|---|
    | PCA | variance of X | no | any k up to min(n, p) | yes |
    | LDA | class separation | yes | at most C − 1 | yes, if regularised |
    | t-SNE | local neighbourhoods | no | 2 or 3 | no |
    | UMAP | local neighbourhoods, some global | no | 2 or 3 | no |

    The last column is the one people get wrong, and it is where most of this
    topic's words go.

    ## Experiment 1: variance is not signal

    Build two 4-D classes. Their means differ by 1.0 along coordinate 1, and
    coordinate 2 carries a within-class variance of 4 — four times the signal.
    Five hundred points per class, and the question is simply which single
    direction you would project onto.

    | Representation | Variance share | Fisher ratio | 1-NN accuracy |
    |---|---|---|---|
    | first principal component | 0.5497 | 0.0016 | 0.510 |
    | Fisher (LDA) direction | — | 0.5388 | 0.626 |
    | all four raw coordinates | — | — | 0.634 |

    The first row is the whole lesson. The direction that explains **55% of all
    variance** carries essentially no class information: its Fisher ratio is
    0.0016 and 1-NN on it is at chance. PCA did precisely what it promises. It
    promises variance, and you needed separation.

    ## Experiment 2: same dimension, different information

    Now a 600×50 set: three Gaussian classes whose means sit on three
    orthogonal axes, with small within-class spread, drowned in forty
    higher-variance noise columns.

    | Representation | Dimensions | Variance kept | 1-NN accuracy |
    |---|---|---|---|
    | raw | 50 | 100% | 0.727 |
    | PCA | 2 | 7.08% | 0.567 |
    | PCA | 10 | 31.2% | 0.823 |
    | LDA | 2 | — | 1.000 |

    Two things to notice. PCA to 2 is *worse than not reducing*: the three class
    means lie on three orthogonal axes and two dimensions can hold at most two
    of them, so one class becomes invisible. And LDA to the same two dimensions
    is perfect — on data where the first two principal components hold 7% of
    the variance.

    A reduction is not a neutral compression step. It is a decision about which
    directions get to survive, and that decision has an owner: your task.

    ## What PCA computes, and where it stops

    You derived this in *Linear Algebra Foundations*: maximise $w^\top X^\top X w$
    subject to $\lVert w \rVert = 1$, apply a Lagrange multiplier, and the
    stationary condition is $X^\top X w = \lambda w$. So the optimal direction
    is the top eigenvector of the scatter matrix, which is the top right
    singular vector of the centred data — PCA is truncated SVD, and truncation
    is optimal rather than merely convenient.

    What that derivation does **not** say is that the resulting direction is
    useful. It says the direction is the maximum of a particular quadratic
    form. Nothing in the objective mentions $y$, so no choice of preprocessing
    of $X$ alone can make PCA class-aware. Standardising the masked-discriminator
    data flattens its spectrum from 0.550/0.178/0.144/0.129 to
    0.263/0.260/0.249/0.228, and the top component still is not the class
    direction.

    Choosing $k$ is therefore a decision, not a formula. On the 600×50 set the
    95% rule keeps 43 of 50 columns, and the relative reconstruction error is
    still 0.218 — you have paid for a projection and kept a fifth of the error.
    Three better options: read the reconstruction-error curve, read the
    participation ratio (43.03 here, i.e. no low-dimensional structure at all),
    or choose $k$ by cross-validated downstream score. Only the third one knows
    what the task is.

    ## LDA, and its two hard limits

    LDA asks a different question: find the direction in which the class means
    are far apart *relative to* the within-class spread. With $S_w$ the pooled
    within-class scatter and $S_b$ the between-class scatter, maximise
    $w^\top S_b w / w^\top S_w w$. The stationarity condition is a generalised
    eigenproblem $S_b w = \lambda S_w w$, and in the two-class case it collapses
    to $w \propto S_w^{-1}(\mu_1 - \mu_0)$.

    Two limits follow immediately, and both bite in practice.

    **Rank.** $S_b$ is a sum of $C$ rank-one terms, but the class means are
    constrained to average to the global mean, so its rank is at most $C - 1$.
    Three classes give two dimensions; ten classes give nine, even if you
    started with 768. If you need more dimensions than that from a supervised
    projection, LDA cannot give them to you.

    **Singularity.** $S_w^{-1}$ stops existing when $p$ approaches $n$. With
    n = 100, 4 real features and 200 noise columns, LDA's held-out accuracy was
    53.1% against 66.0% for the 4 real features alone. The inverse amplified
    whatever random direction happened to have the smallest sample variance.
    The fixes are shrinkage ($S_w + \lambda I$, which bounds the smallest
    eigenvalue at $\lambda$) or a PCA projection first — and the $\lambda$ is a
    hyperparameter to validate, not a numerical afterthought.

    ## t-SNE and UMAP: instruments for looking

    t-SNE builds a Gaussian conditional distribution over neighbours in the
    input — each point gets its own width $\sigma_i$, tuned so the entropy hits
    $\log(\text{perplexity})$ — and a Student-t distribution in the plane, then
    minimises the KL divergence between them. UMAP builds a fuzzy topological
    representation of the k-NN graph and minimises a cross-entropy. Both are
    doing the same job: make neighbours neighbours, in two dimensions.

    They do it well. Measured 10-NN preservation on the 600×50 set was 0.239
    for t-SNE and 0.046 for PCA to 2 — a factor of five, and the reason a t-SNE
    picture looks so much more structured than a PCA scatter.

    Now the part that is not a defect but a design consequence. Because $q_{ij}$
    decays like $1/d^2$, pushing two clusters apart costs almost nothing in KL
    divergence. Three clusters spaced 5.87 : 1 apart in the input came out
    1.09 : 1 and 1.06 : 1 apart in two runs. PCA to 2 preserved 5.87 : 1
    exactly. In a t-SNE plot the *membership* of a cluster is real and its
    *size, shape, and distance from its neighbours* are artefacts.

    ## The failure mode that keeps shipping

    So: use the embedding as features. It scores well in the notebook, because
    within a single run the classes really are compact — 81.3%, 85.0% and 85.3%
    1-NN accuracy across three runs.

    Then production refits the embedding on new data, and the numbers are
    48.3% and 57.7% against a chance rate of 33.3%, measured after an optimal
    Procrustes alignment that removes rotation, reflection and scale. The two
    embeddings are not two views of one coordinate system; they are two
    different pictures of the same points.

    This is not a t-SNE bug report. It is the definition of the object:
    `sklearn.manifold.TSNE` has no `transform` method, so a point that was not
    in the fit has no coordinates at all. UMAP does expose `transform`, which
    makes the error easier to commit and no less wrong — it maps a new point
    onto a layout that was fixed by the old one.

    Three questions decide whether a reduction may enter a feature pipeline:

    1. Can I apply it to one unseen row? (PCA, LDA: yes. t-SNE: no. UMAP: only approximately.)
    2. Does it use labels, and did I fit it inside the split? (LDA needs both.)
    3. What does it preserve, and is that what the model needs?

    If any answer is unclear, the reduction belongs in a figure.

    ## How to choose

    - **Supervised, labels available, C classes:** LDA to at most C − 1
      dimensions, with shrinkage if $p$ is not small relative to $n$. If you
      need more dimensions than C − 1, you want a different model class, not a
      different projection.
    - **Unsupervised, features for a model:** PCA, $k$ chosen by
      cross-validated score or reconstruction error. Standardise first if the
      columns have different units — it changes the answer, so it is part of
      the model.
    - **A picture, or a hypothesis about cluster structure:** t-SNE at
      perplexity 30 on a sample, or UMAP at `n_neighbors=15`. Annotate colour
      by a variable you did not cluster on, and never quote a distance.
    - **Retrieval or clustering on high-dimensional vectors:** PCA to the
      intrinsic dimension, or whitening, as discussed in *Clustering*. This is
      the one place where the reduction genuinely restores the meaning of
      distance.

    ## The longer version

    The remaining mechanisms, verbatim: whitening as a distinct operation and
    where it produces `nan`, why t-SNE is excellent at the one thing it
    optimises, and what UMAP changes and does not.

    ### Failure modes, in full

    - You ran PCA to two dimensions to look at your classes, saw them overlap, and concluded the data had no signal — when a supervised projection to the same two dimensions separates them perfectly (56.7% versus 100.0% 1-NN accuracy on the same 600 points).
    - You used the t-SNE coordinates as features because the picture was beautiful and the notebook scored 0.85. Refit the embedding on the same data and that number collapses to chance, because the axes of a t-SNE plot are not a coordinate system.
    - Your 'keep 95% of the variance' rule kept 43 of 50 columns, so the reduction you added for speed made the model slower and changed nothing else.
    - You have 768-dimensional embeddings, 40,000 rows, and a latency budget. You need to know which of these four methods you can put in the serving path and which one belongs in a slide.
    - Interviewers ask 'PCA or t-SNE?' to find out whether you know that one is a linear map with a fixed transform and the other is a layout with no out-of-sample meaning at all.

    ### The mechanisms, in full

    - **PCA is the SVD of the centred matrix, and nothing else.** On a 600×50 three-class set the leading component holds 3.67% of the variance, the "keep 95%" rule retains 43 of the 50 columns, and the participation ratio of the spectrum is 43.03. That number is the whole story: this data has no low-dimensional *variance* profile, so PCA cannot make it smaller without discarding most of it.
    - **PCA never sees the labels, so its directions have no reason to be class-aware.** Take two 4-D classes whose means differ by 1.0 along coordinate 1 while coordinate 2 carries within-class variance 4. The first principal component holds 54.97% of all variance, has a Fisher ratio of 0.00157, and delivers 51.0% 1-NN accuracy — chance, on balanced data. You have correctly found the direction of greatest variation, and it is noise.
    - **Same target dimension, completely different information.** On the 600×50 set, 1-NN accuracy is 72.7% in the original 50 dimensions, 56.7% after PCA to 2, 82.3% after PCA to 10, and 100.0% after LDA to 2. PCA to 2 is *worse than doing nothing*, because the three class means lie on three orthogonal axes and two dimensions can carry at most two of them.
    - **LDA is Fisher's criterion, and its rank is capped at C − 1.** Maximise $w^\top S_b w / w^\top S_w w$; the optimum solves $S_w^{-1} S_b w = \lambda w$, and for two classes it is simply $w \propto S_w^{-1}(\mu_1 - \mu_0)$. Because $S_b$ is a sum of $C$ rank-one terms around one global mean, three classes give 2 usable dimensions and ten classes give 9, whether you started from 50 columns or 768.
    - **LDA breaks when p approaches n, and the failure is silent.** With n = 100 samples, 4 real features and 200 pure-noise columns added, LDA scored 53.1% on held-out data against 66.0% using only the 4 real features — the singular $S_w$ turned the extra columns into a discriminator fitted to noise. Shrink the scatter ($S_w + \lambda I$) or reduce with PCA first; in both cases $\lambda$ is part of the model, not a rounding detail.
    - **Whitening is a different operation from PCA.** PCA decorrelates and sorts; whitening additionally divides each component by its singular value so the output covariance is the identity. That division is where it fails: a 200×500 rank-deficient matrix produced covariance eigenvalues down to −2.93e−15 with 152 of them negative, while the SVD reported 199 genuinely non-zero singular values — and $1/\sqrt{\lambda}$ of a negative number is `nan`. Clip, regularise, or reduce to well below the rank first.
    - **t-SNE preserves neighbourhoods and is excellent at exactly that.** It matches a Gaussian conditional in the input (perplexity 30 means the neighbour distribution carries $\log 30 = 3.40$ nats of entropy) to a Student-t kernel in the plane. Measured 10-nearest-neighbour preservation was 0.239, against 0.046 for PCA to 2 — five times better at the one objective it optimises.
    - **The gaps between t-SNE clusters are not measurements.** Three clusters spaced 5.87 : 1 apart in the input came out 1.09 : 1 and 1.06 : 1 apart in two t-SNE runs, while PCA to 2 preserved the 5.87 : 1 ratio. Cluster sizes and inter-cluster distances are artefacts of perplexity and of the particular optimum reached. Read the membership; never measure the geometry.
    - **t-SNE and UMAP are not feature transforms.** Three t-SNE runs on the same 600 points gave within-run 1-NN accuracies of 81.3%, 85.0% and 85.3%; trained on one run and tested on another after an optimal Procrustes alignment, the same classifier scored 48.3% and 57.7% against a chance rate of 33.3%. `sklearn.manifold.TSNE` has no `transform` method at all, so there is no defined output for a point that was not in the fit.
    - **UMAP makes the same trade with better constants, and its `transform()` makes the mistake easier rather than safer.** It builds a fuzzy topological representation of the k-nearest-neighbour graph (defaults `n_neighbors=15`, `min_dist=0.1`) and optimises a cross-entropy instead of a KL divergence. Being faster and slightly better at global shape does not change what the output is: a layout whose axes have no units and no out-of-sample guarantee.


  derivations:
    - title: "Why the top-k subspace is optimal, not just the top-1 direction"
      latex: |
        Let $X_c \in \mathbb{R}^{n \times p}$ be centred, with scatter
        $\Sigma = \frac{1}{n-1} X_c^\top X_c$ and eigendecomposition
        $\Sigma = V \Lambda V^\top$, $\lambda_1 \ge \dots \ge \lambda_p \ge 0$.
        For any orthonormal set $W = [w_1 \dots w_k]$ the variance retained is
        $$ \operatorname{tr}(W^\top \Sigma W) = \sum_{j=1}^{k} w_j^\top \Sigma w_j .$$
        Write $W = V_k Q$ with $V_k = [v_1 \dots v_k]$ and $Q^\top Q = I_k$. Then
        $W^\top \Sigma W = Q^\top \Lambda_k Q$, so
        $$ \operatorname{tr}(W^\top \Sigma W) = \operatorname{tr}(\Lambda_k Q Q^\top) \le \operatorname{tr}(\Lambda_k)
           = \sum_{j=1}^{k} \lambda_j ,$$
        with equality at $Q = I$. The residual is
        $$ \sum_{j>k} \lambda_j = \frac{1}{n-1} \sum_{j>k} \sigma_j^2 ,$$
        which is the Eckart–Young error up to the constant $1/(n-1)$.
      prose: >-
        Greedy deflation — take the best direction, subtract it, repeat — is not
        a heuristic that happens to work: the span of the top k eigenvectors
        maximises retained variance over all k-dimensional subspaces. That is
        the Ky Fan inequality, and it is why "take the top k and stop" has no
        tuning knob. It also pins down what k means: it buys eigenvalue mass,
        and eigenvalue mass is variance, not information about y.
    - title: "Fisher's criterion is a generalised eigenproblem with rank C − 1"
      latex: |
        With $S_w = \sum_c \sum_{i \in c}(x_i - \mu_c)(x_i - \mu_c)^\top$ and
        $S_b = \sum_c n_c(\mu_c - \mu)(\mu_c - \mu)^\top$, maximise
        $$ J(w) = \frac{w^\top S_b w}{w^\top S_w w} .$$
        Setting the gradient to zero gives $S_b w = J(w)\, S_w w$, that is
        $$ S_w^{-1} S_b w = \lambda w .$$
        For two classes, $S_b = \frac{n_1 n_2}{n}(\mu_1 - \mu_0)(\mu_1 - \mu_0)^\top$
        has rank one, so there is exactly one non-zero eigenvector and
        $$ w \propto S_w^{-1}(\mu_1 - \mu_0) .$$
        In general $S_b$ is a sum of $C$ rank-one terms subject to
        $\sum_c n_c(\mu_c - \mu) = 0$, hence
        $$ \operatorname{rank}(S_b) \le C - 1 .$$
      prose: >-
        Two consequences fall out. First, LDA simply cannot return more than
        C − 1 dimensions, so "LDA to 50" on a 3-class problem is a request for
        47 dimensions of nothing. Second, $S_w^{-1} S_b$ is not symmetric even
        though both factors are, so you cannot hand it to `eigh`; either use a
        generalised solver, or whiten by $S_w^{-1/2}$ first so that the problem
        becomes symmetric — $S_w^{-1/2} S_b S_w^{-1/2}$ — which is the same
        trick, and the same numerical hazard, as whitening in PCA.
    - title: "The t-SNE gradient, and why cluster gaps are free"
      latex: |
        Input affinities are Gaussians with a per-point width:
        $$ p_{j|i} \propto \exp\!\left(-\frac{\lVert x_i - x_j \rVert^2}{2\sigma_i^2}\right),
           \qquad H(P_i) = \log(\text{perplexity}) .$$
        Embedding affinities use a Student-t kernel with one degree of freedom:
        $$ q_{ij} \propto \left(1 + \lVert y_i - y_j \rVert^2\right)^{-1} .$$
        Minimising $C = \operatorname{KL}(P \,\Vert\, Q) = \sum_{ij} p_{ij} \log \frac{p_{ij}}{q_{ij}}$
        gives
        $$ \frac{\partial C}{\partial y_i}
           = 4 \sum_j (p_{ij} - q_{ij}) \left(1 + \lVert y_i - y_j \rVert^2\right)^{-1} (y_i - y_j) .$$
      prose: >-
        The weight $(1 + d^2)^{-1}$ is the whole mechanism. A pair at distance 5
        is corrected 26 times less strongly than a pair at distance 0, so the
        optimisation spends its budget on local structure and lets global
        arrangement drift. And because $q \sim 1/d^2$ in the tail, separating
        two clusters barely changes the loss — which is why the gaps you see are
        whatever the optimiser happened to leave behind, not a measurement of
        how far apart the clusters are.

  implementations:
    - language: python
      title: "PCA from scratch — and the covariance route that returns nan"
      note: >-
        The SVD path is the one to keep. The covariance path is included because
        it is what most tutorials show and it is **numerically wrong** for p >= n
        or rank-deficient data: on a seeded 200x500 random matrix it produced
        covariance eigenvalues down to -2.93e-15 with 152 of them negative, so a
        whitening step computing 1/sqrt(eigenvalue) returns nan. It also squares the
        condition number, since eigenvalues of X^T X are sigma^2.
      code: |
        import numpy as np

        def pca_svd(X, k):
            """PCA via the SVD of the centred matrix. Returns (mean, comps, ratios, Z)."""
            X = np.asarray(X, dtype=float)
            mu = X.mean(axis=0)
            Xc = X - mu                       # centring is not optional
            U, S, Vt = np.linalg.svd(Xc, full_matrices=False)
            k = min(k, len(S))
            comps = Vt[:k]                    # (k, p) orthonormal rows
            total = float((S ** 2).sum())
            ratios = (S[:k] ** 2) / total if total > 0 else np.zeros(k)
            Z = Xc @ comps.T
            return mu, comps, ratios, Z

        def pca_covariance_UNSAFE(X, k):
            """The tutorial version. Fine on tall, well-conditioned data; nan otherwise."""
            X = np.asarray(X, dtype=float)
            mu = X.mean(axis=0)
            Xc = X - mu
            C = (Xc.T @ Xc) / (Xc.shape[0] - 1)   # squares the condition number
            vals, vecs = np.linalg.eigh(C)        # symmetric -> eigh, never eig
            order = np.argsort(vals)[::-1][:k]
            vals = vals[order]
            # vals can be slightly NEGATIVE from rounding when the matrix is
            # rank-deficient. np.sqrt(vals) is nan, and so is 1/np.sqrt(vals).
            comps = vecs[:, order].T
            return mu, comps, vals / vals.sum()

        def reconstruction_error(X, k):
            """Relative Frobenius error of the best rank-k approximation."""
            X = np.asarray(X, dtype=float)
            s = np.linalg.svd(X - X.mean(axis=0), compute_uv=False)
            total = float((s ** 2).sum())
            if total <= 0 or k >= len(s):
                return 0.0
            return float(np.sqrt(float((s[k:] ** 2).sum()) / total))

        if __name__ == "__main__":
            rng = np.random.default_rng(0)
            X = rng.normal(size=(200, 500))            # n < p: rank deficient
            Xc = X - X.mean(axis=0)
            # The full spectrum, not just the top k: this is where the damage shows.
            all_vals = np.linalg.eigvalsh(np.cov(Xc, rowvar=False))
            print("negative eigenvalues:", int((all_vals < 0).sum()))   # 152
            print("smallest:", float(all_vals.min()))                   # ~ -2.9e-15
            print("1/sqrt of the smallest:", 1.0 / np.sqrt(all_vals.min()))   # nan
            print("SVD rank:", int((np.linalg.svd(Xc, compute_uv=False) > 1e-12).sum()))  # 199
    - language: python
      title: "Fisher LDA from scratch, with the shrinkage that makes it usable"
      note: >-
        Without `shrinkage`, this is **numerically wrong** whenever p >= n or the
        features are collinear: S_w is singular, its inverse amplifies pure noise,
        and the direction it returns fits the sample rather than the classes (53.1%
        held-out accuracy versus 66.0% for the four real features on the p = 204,
        n = 100 experiment). The `pinv` fallback keeps it from crashing; it does
        not make it correct.
      code: |
        import numpy as np

        def fisher_lda(X, y, k=1, shrinkage=0.0):
            """Top-k Fisher directions. shrinkage > 0 is mandatory when p >= n."""
            X = np.asarray(X, dtype=float)
            y = np.asarray(y)
            classes = np.unique(y)
            p = X.shape[1]
            mu = X.mean(axis=0)
            Sw = np.zeros((p, p))
            Sb = np.zeros((p, p))
            for c in classes:
                Xc = X[y == c]
                Z = Xc - Xc.mean(axis=0)
                Sw += Z.T @ Z
                d = (Xc.mean(axis=0) - mu).reshape(-1, 1)
                Sb += len(Xc) * (d @ d.T)

            # Shrink toward the diagonal: bounds the smallest eigenvalue at
            # shrinkage * mean(diag(Sw)), so the inverse exists and is meaningful.
            if shrinkage > 0:
                Sw = (1.0 - shrinkage) * Sw + shrinkage * np.diag(np.diag(Sw))
                Sw += 1e-12 * np.eye(p)

            # Whiten by Sw^{-1/2} so the generalised problem becomes symmetric.
            vals, vecs = np.linalg.eigh(Sw)
            vals = np.maximum(vals, 0.0)
            inv_sqrt = np.where(vals > 0, 1.0 / np.sqrt(np.maximum(vals, 1e-300)), 0.0)
            W = (vecs * inv_sqrt) @ vecs.T          # = Sw^{-1/2}

            M = W @ Sb @ W                          # symmetric PSD, rank <= C-1
            ev, evec = np.linalg.eigh(M)
            order = np.argsort(ev)[::-1][:k]
            # Map back to the original feature space and normalise, so the
            # columns are directions rather than arbitrary-scaled vectors.
            D = W @ evec[:, order]                  # (p, k)
            return D / np.maximum(np.linalg.norm(D, axis=0, keepdims=True), 1e-12)

        def project(X, directions):
            X = np.asarray(X, dtype=float)
            return (X - X.mean(axis=0)) @ directions

        if __name__ == "__main__":
            rng = np.random.default_rng(0)
            X0 = rng.normal(size=(100, 4)) + np.array([0.0, 0, 0, 0])
            X1 = rng.normal(size=(100, 4)) + np.array([1.0, 0, 0, 0])
            X = np.vstack([X0, X1])
            y = np.r_[np.zeros(100, int), np.ones(100, int)]
            W = fisher_lda(X, y, k=1, shrinkage=0.01)
            print("direction:", np.round(W.ravel(), 4))

  checkpoints:
    - id: cp-same-dim
      question: >-
        On the same 600×50 data, PCA to 2 dimensions gives 56.7% 1-NN accuracy
        and LDA to 2 dimensions gives 100.0%. What does that difference tell you
        about the claim "PCA is a standard preprocessing step"?
      answerKind: short_text
      hint: >-
        Count how many class axes exist and how many dimensions each method was
        allowed to keep.
      solution: >-
        Both methods were given two dimensions. PCA chose them by variance, and
        the class means lie on three orthogonal axes, so two components can
        carry at most two of the three — one class becomes invisible, and the
        result (56.7%) is worse than not reducing at all (72.7%). LDA chose the
        two dimensions that maximise between-class over within-class scatter, so
        it kept the class structure and discarded the noise. "PCA as
        preprocessing" is a claim that the directions of greatest variance are
        also the directions that matter — sometimes true for images and
        embeddings, false here, and always an assumption rather than a default.
    - id: cp-tsne-paradox
      question: >-
        t-SNE preserves 10-nearest-neighbour structure five times better than
        PCA to 2 (0.239 versus 0.046), yet a classifier trained on one t-SNE run
        scores 48.3% on another run of the same points. Reconcile those two
        facts.
      answerKind: short_text
      hint: >-
        What exactly does the preservation metric measure, and what does a
        classifier need that a neighbourhood ranking does not provide?
      solution: >-
        Preservation only measures *who is near whom*. Every t-SNE run gets that
        right, so the metric is high and stable. A classifier needs a fixed
        coordinate frame: the same point must land at the same place across
        fits, and the axes must mean something. t-SNE's output is defined only up
        to rotation, reflection and scale, and different runs find genuinely
        different optima, so after the best possible alignment the residual is
        still most of the embedding's magnitude and the transfer accuracy falls
        to chance. High local fidelity and zero coordinate stability are
        compatible — that combination is exactly what "visualisation" means.
    - id: cp-lda-rank
      question: >-
        You have a 10-class problem and 768 features. You call an LDA
        implementation and ask for 50 components. What do you actually get, and
        why?
      answerKind: short_text
      hint: >-
        Look at the rank of the between-class scatter matrix, not at the number
        of features.
      solution: >-
        At most 9 meaningful directions. $S_b$ is a sum of 10 rank-one terms but
        the class means are constrained to average to the global mean, which
        removes one degree of freedom, so $\operatorname{rank}(S_b) \le C - 1 =
        9$. Beyond nine, the generalised eigenproblem has only zero eigenvalues
        and the "directions" are numerical leftovers. If you need 50 supervised
        dimensions, LDA is the wrong tool — use a model that learns a supervised
        embedding directly.
    - id: cp-lda-singular
      question: >-
        LDA scored 66.0% on 4 real features and 53.1% after you appended 200
        noise columns at n = 100. Explain the mechanism and name two fixes.
      answerKind: short_text
      hint: >-
        What is the rank of a p × p matrix built from 100 samples when p = 204?
      solution: >-
        $S_w$ is a sum of 204×204 outer products from 100 points, so its rank is
        at most 99 — it is singular, and the inverse does not exist. An
        implementation that inverts it anyway (or uses a pseudo-inverse) picks
        out the directions with the smallest sample variance, which in pure-noise
        columns are exactly the directions where the sample deviates most from
        the population. That direction is fitted to this sample and does not
        transfer, so held-out accuracy drops to near chance. Fixes: shrink
        ($S_w + \lambda I$, or shrink toward the diagonal, with $\lambda$
        validated), or project with PCA to well below the rank of $S_w$ first.
    - id: cp-choose-k
      question: >-
        Your 95%-variance rule keeps 43 of 50 columns and the relative
        reconstruction error is still 0.218. What are three better ways to
        choose k, and which one knows about your task?
      answerKind: short_text
      hint: >-
        Two of the three are properties of X alone. One is not.
      solution: >-
        (1) The reconstruction-error curve, $\sqrt{\sum_{i>k}\sigma_i^2 /
        \sum_i \sigma_i^2}$ — read where it drops, and accept an explicit error
        budget instead of a variance percentage. (2) The participation ratio,
        $(\sum \lambda_i)^2 / \sum \lambda_i^2$ — 43.03 on this data, which says
        there is no low-dimensional variance structure at all and warns you that
        no k will be satisfying. (3) Cross-validated downstream score: fit the
        reducer inside each fold, sweep k, and keep the k with the best held-out
        metric. Only the third knows what the task is, and only the third can
        tell you that a projection which looks bad by variance is good for the
        model.
    - id: cp-retrieval
      question: >-
        You must cut 768-dimensional embeddings down before building an ANN
        index. Which of the four methods, fitted on what data, and what do you
        check afterwards?
      answerKind: short_text
      hint: >-
        The serving path must be able to transform a single query vector.
      solution: >-
        PCA (or PCA plus whitening), fitted on the training/reference corpus
        only, then applied to queries with the same fitted object. t-SNE and
        UMAP are out: there is no stable transform, so a query would land
        somewhere unrelated to where the same vector landed at index time. LDA is
        out unless you have labels and genuinely want class separation rather
        than similarity. Afterwards, verify that distance discrimination
        improved — measure the spread of distances or the recall@k of exact
        search against the reduced representation, not just the explained
        variance.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Each of these four methods is a different answer to "what should survive
        the compression?" PCA keeps the directions along which the data varies
        most. LDA keeps the directions along which the labelled classes are most
        separated relative to their internal spread. t-SNE and UMAP keep the
        neighbour graph — who is close to whom — and are allowed to distort
        everything else to do it.

        Two of them produce a *projection*: a fixed matrix you can apply to any
        row, today or next year. Two of them produce a *layout*: an arrangement
        of the particular points you gave it, with no defined answer for a new
        point. That distinction, not accuracy, is what decides whether a method
        goes in the serving path.

        Before reading on: for each of the four, ask what would have to be true
        about your data for it to be the right choice. Then notice that only one
        of the four is allowed to look at your labels.
      blocks:
        - kind: checklist
          body: |
            - What does it preserve? variance / class separation / neighbours
            - Does it use y? PCA no, LDA yes, t-SNE and UMAP no
            - Can it transform an unseen row? PCA and LDA yes, t-SNE no
            - How many dimensions can it give? PCA up to rank, LDA at most C-1
            - What is the failure mode? noise directions / singular Sw / unstable layout
      checkpoint: >-
        You have labels, 12 classes, and 900 features. Which method gives you at
        most 11 dimensions, and what would you do if you needed 30?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Decide in this order, and stop at the first question that answers
        itself.

        **Is the output going to be used by a model, or looked at by a human?**
        If a human: t-SNE or UMAP, and the only claims you may make are about
        neighbourhoods. If a model: continue.

        **Do you have labels you trust?** If yes and the goal is classification,
        LDA — at most C − 1 dimensions, with shrinkage if p is not much smaller
        than n. If no, PCA.

        **How many dimensions do you need?** If more than C − 1, LDA cannot help
        you and PCA is the unsupervised default; if you need more than the rank
        of the data, no linear projection can help you.

        **Are the columns on comparable scales?** If not, standardise — and
        remember that standardising changes which directions PCA finds, so the
        scaler is part of the model and must be fitted inside the split.

        The one rule that overrides all of this: a reducer you cannot apply to a
        single unseen row is not a preprocessing step, whatever the library's
        API suggests.
      blocks:
        - kind: checklist
          body: |
            - Figure only -> t-SNE / UMAP, report membership not distances
            - Labels + classification -> LDA (C-1 max), shrink if p >= n
            - No labels + features -> PCA, k from validation
            - Distances matter downstream -> PCA or whitening, then re-measure spread
            - Need > C-1 supervised dims -> LDA is the wrong tool
      checkpoint: >-
        A colleague wants to run LDA on 40 classes to produce 100 features for a
        neural network. What do you tell them, and what do you suggest instead?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The structure of every honest reduction is the same: fit on train,
        transform both splits with the fitted object, and measure something
        downstream. The choice of method is a single line inside it.
      blocks:
        - kind: pseudocode
          body: |
            # 1. The protocol (this is the part people skip)
            X_train, X_test, y_train, y_test = split(X, y)
            scaler = fit_scaler(X_train)
            Xtr, Xte = scaler.transform(X_train), scaler.transform(X_test)

            reducer = fit_reducer(Xtr, y_train, method, k)   # method in {pca, lda}
            Ztr, Zte = reducer.transform(Xtr), reducer.transform(Xte)

            model = fit(Xtr=Ztr, y=y_train)
            report(score(model, Zte, y_test))

            # 2. Choosing k, honestly
            for k in candidate_ks:
                for fold in folds:                      # refit the scaler AND the reducer inside the fold
                    Ztr, Zva = fit_transform(...), transform(...)
                    record(score(fit(Ztr, y_tr), Zva, y_va))
                keep the k with the best mean validation score

            # 3. Deciding whether an embedding is a projection or a picture
            fit twice on the same data with different seeds
            align the two layouts (rotation + scale + reflection)
            if a classifier trained on one transfers to the other: it is a projection
            else: it is a picture, and it does not go in the pipeline

            # 4. Diagnosing a reduction that "did nothing"
            print cumulative explained variance, reconstruction error at k, participation ratio
      checkpoint: >-
        In step 1, why must the scaler be fitted on `X_train` rather than on
        `X`? Give the specific quantity that leaks if you get it wrong.
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The three derivations that decide the practical behaviour of these
        methods: why truncation is optimal, why LDA is capped, and why t-SNE's
        gaps carry no information.
      blocks:
        - kind: math
          body: |
            **PCA: the top-k subspace is optimal.** With
            $\Sigma = \frac{1}{n-1}X_c^\top X_c = V\Lambda V^\top$ and
            $W = V_k Q$ orthonormal,
            $$\operatorname{tr}(W^\top \Sigma W) = \operatorname{tr}(\Lambda_k Q Q^\top) \le \sum_{j\le k}\lambda_j$$
            with equality at $Q = I$. The residual is $\sum_{j>k}\lambda_j$, which is
            Eckart–Young's $\sqrt{\sum_{j>k}\sigma_j^2}$ up to the constant.

            **LDA: rank C − 1.** Maximising $w^\top S_b w / w^\top S_w w$ gives
            $S_w^{-1}S_b w = \lambda w$, and for two classes
            $w \propto S_w^{-1}(\mu_1-\mu_0)$. Since
            $S_b = \sum_c n_c(\mu_c-\mu)(\mu_c-\mu)^\top$ with
            $\sum_c n_c(\mu_c-\mu) = 0$, $\operatorname{rank}(S_b) \le C-1$.

            **t-SNE: why gaps are free.** With
            $q_{ij} \propto (1 + \lVert y_i - y_j\rVert^2)^{-1}$,
            $$\frac{\partial C}{\partial y_i} = 4\sum_j (p_{ij}-q_{ij})\left(1+\lVert y_i-y_j\rVert^2\right)^{-1}(y_i-y_j).$$
            The weight decays as $1/d^2$, so distant pairs exert almost no force and
            the loss barely changes when clusters are pulled apart.
      checkpoint: >-
        In the PCA derivation, where exactly does the assumption "the data is
        centred" enter, and what would the objective become if it were not?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete reducer with a transform, a k-selection routine, and the
        diagnostic that tells you whether an embedding is a projection or a
        picture.
      blocks:
        - kind: warning
          body: >-
            Read this only after writing your own. The interesting part is not
            the SVD call — it is the transform protocol and the stability check
            at the end, which is the thing that stops a t-SNE plot becoming a
            feature.
        - kind: code
          language: python
          body: |
            import numpy as np

            class PCA:
                """PCA with a genuine transform. Never forms X^T X."""
                def __init__(self, k):
                    self.k = k

                def fit(self, X):
                    X = np.asarray(X, dtype=float)
                    self.mu_ = X.mean(axis=0)
                    U, S, Vt = np.linalg.svd(X - self.mu_, full_matrices=False)
                    self.comps_ = Vt[: self.k]
                    total = float((S ** 2).sum())
                    self.ratios_ = (S[: self.k] ** 2) / total if total else np.zeros(self.k)
                    return self

                def transform(self, X, whiten=False):
                    Z = (np.asarray(X, dtype=float) - self.mu_) @ self.comps_.T
                    if whiten:
                        # scale by the singular values seen at fit time
                        Z = Z / np.maximum(self.scale_, 1e-12)
                    return Z

                def fit_transform(self, X, whiten=False):
                    self.fit(X)
                    Xc = np.asarray(X, dtype=float) - self.mu_
                    s = np.linalg.svd(Xc, compute_uv=False)[: self.k]
                    self.scale_ = s / np.sqrt(max(len(X) - 1, 1))
                    return self.transform(X, whiten=whiten)

            def choose_k(X, ks, max_rel_error=0.1):
                """Smallest k whose relative reconstruction error is acceptable."""
                X = np.asarray(X, dtype=float)
                s = np.linalg.svd(X - X.mean(axis=0), compute_uv=False)
                total = float((s ** 2).sum())
                for k in ks:
                    err = np.sqrt(float((s[k:] ** 2).sum()) / total) if k < len(s) else 0.0
                    if err <= max_rel_error:
                        return k, float(err)
                return ks[-1], float(np.sqrt(float((s[ks[-1]:] ** 2).sum()) / total))

            def preservation(X, Z, k=10):
                """Fraction of each point's k nearest neighbours kept by the embedding."""
                X = np.asarray(X, float); Z = np.asarray(Z, float)
                def nb(A):
                    d = ((A[:, None, :] - A[None, :, :]) ** 2).sum(-1)
                    np.fill_diagonal(d, np.inf)
                    return np.argsort(d, axis=1, kind="stable")[:, :k]
                a, b = nb(X), nb(Z)
                return float(np.mean([len(set(a[i]) & set(b[i])) / k for i in range(len(X))]))

            # The decision rule, in code:
            #   preservation(raw, PCA(k))  is a legitimate diagnostic.
            #   Using a t-SNE layout as X in a train/test split is not: there is
            #   no transform, so the "test" coordinates came from a different
            #   optimisation than the "train" ones.
      checkpoint: >-
        In the `PCA` class, why is the scale for whitening computed inside
        `fit_transform` rather than from the components? And what breaks in
        production if you compute it at serving time instead?

