id: feature-engineering-leakage
slug: feature-engineering-leakage
title: "Leakage Is a Bug in the Order of Your Pipeline, Not Your Features"
summary: >-
  Build features that will still exist when the model is scoring, and learn to
  find the ones that only exist because you computed them with information from
  the future — the failure that turns a validation score into a number you can
  never reproduce.
kind: lesson
difficulty: medium
position: 14
estMinutes: 23
prerequisites: [linear-regression, model-evaluation]
phase: classical-models
tags: [feature-engineering, leakage, validation, target-encoding, pipelines, train-serve-skew]

body:
  big_idea: >-
    A feature is real only if it can be computed at prediction time, so leakage is a bug
    in the order of the pipeline — split first, then fit every transform on the training
    slice.

  problem:
    - "You ship a churn model with 0.94 AUC offline that scores 0.61 in production, and only the future not having happened yet changed."
    - "You select 20 columns from 2,000 using all your labels, cross-validate, and report $R^2 = 0.35$ on data where features and target are independent."
    - "You target-encode a user ID, watch validation AUC hit 0.95, and ship a model whose only skill is remembering each user's own label."

  analogy: |
    A school photocopies the answer key onto the back of the exam by mistake.
    Every student scores 100%. The exam measured the photocopier, not the
    students — nobody cheated, the marking was correct, and only what the number
    *means* is wrong. A leaked feature is that answer key: available while
    training, absent when the model must answer a question nobody has answered.

  concept_points:
    - "**The admissibility test is a timestamp, not an intuition.** At time $t$, every input must be a function of information timestamped $\\le t$: *when this row was created, what did I actually know?* `days_until_next_purchase` is computable in your training table and missing for 100% of rows at serve time. Any feature whose definition mentions a future event is a label in disguise."
    - "**Fitting before the split leaks in proportion to what the fit uses.** On 400 rows, standardising with the full dataset mean and sd changed held-out $R^2$ by $1.1\\times10^{-16}$ — algebraically zero, because a linear fit is invariant to a global shift. The same fit applied to a selector or encoder, both of which read $y$, is worth hundreds of points."
    - "**Feature selection is where leakage is largest, because selection is a max over noise.** With $n=200$ rows and 2,000 columns independent of $y$, selecting the top 20 by $|\\text{corr}|$ on all labels and then cross-validating gives **$R^2 = 0.3495$**; reselecting inside each fold gives **$-0.2905$**. The best of 2,000 noise columns sits near $\\sqrt{2\\ln d/n} = 0.276$ purely by being the largest draw."
    - "**Target encoding leaks by construction, and smoothing does not fix it.** Replacing a category with its mean target means a row contributes to its own feature: with one row per category the encoding *is* the label, so AUC is exactly **1.0**. With two rows per category, full-data encoding gave AUC **0.9468** and out-of-fold encoding **0.6738**. The fix is out-of-fold means, smoothed toward the out-of-fold prior."
    - "**Group and temporal leakage: the unit of independence is not the row.** With 300 groups of 6 rows, predicting a row from its group's training mean scores $R^2 = 0.4101$ under random KFold and $-0.0098$ under GroupKFold — theory predicts 0.40 exactly. On 200 time-ordered rows, 1-NN on the row's time index alone scores **0.9769** under random KFold and **$-1.0470$** when tested on the tail."
    - "**One test catches every family: shuffle the labels and re-run the whole pipeline.** Permute $y$, refit *everything including selection and encoding*, and cross-validate. An honest pipeline must score at or below zero ($R^2 \\le 0$, AUC 0.5); a positive score is leakage, and its magnitude is the size of the problem. This would have caught the 0.3495 above before anyone looked at a model."

  definitions:
    - { term: "Leakage", meaning: "Any information in the training pipeline that will not be available at scoring time. It inflates the validation score and vanishes in production." }
    - { term: "Target leakage", meaning: "A feature that is a consequence of the label rather than a cause — a close date, a chargeback flag, a treatment applied after the outcome was known." }
    - { term: "Temporal leakage (look-ahead bias)", meaning: "Using information from after the prediction timestamp: centred windows, future aggregates, or a random split of time-ordered rows." }
    - { term: "Train/test contamination", meaning: "Fitting any transform — scaler, imputer, selector, encoder, resampler — on rows that will later be used for validation." }
    - { term: "Group leakage", meaning: "Rows that are not independent (same patient, user, device, session) landing on both sides of the split, so the model is scored on entities it has already memorised." }
    - { term: "Duplicate leakage", meaning: "Exact or near-exact copies of a row appearing in both train and test. Inflation is approximately f x (1 - clean R-squared), where f is the fraction of test rows with a twin in train." }
    - { term: "Target encoding", meaning: "Replacing a categorical value with the mean target of its rows. Powerful on high-cardinality features and leaky unless computed out-of-fold." }
    - { term: "Out-of-fold encoding", meaning: "Encoding each row using only rows from other folds. Guarantees a row's own label never enters its own feature." }
    - { term: "Pipeline", meaning: "An ordered contract in which every fit happens on training data and every transform is applied to both sides. In sklearn, a Pipeline inside cross_val_score enforces this mechanically." }
    - { term: "Train/serve skew", meaning: "The offline and online feature computations disagree. Same symptom as leakage, different cause, and it survives a perfectly clean split." }
    - { term: "Point-in-time correctness", meaning: "The property that a feature's value for a row reflects only what was known at that row's timestamp. The standard a feature store exists to enforce." }

  diagrams:
    - type: architecture
      title: "Where leakage enters a training pipeline"
      nodes:
        - { id: events, x: 0, y: 1, label: "Event log + labels", kind: database, detail: "Everything you are allowed to know, with timestamps. The label's timestamp is the boundary: nothing after it may enter a feature." }
        - { id: split, x: 1, y: 1, label: "Split first", kind: worker, detail: "By time for temporal data, by group for repeated entities, after deduplication. This step must happen before any fit." }
        - { id: fit, x: 2, y: 0, label: "Fit on train only", kind: server, detail: "Scaler, imputer, selector, target encoder, resampler. Each one learns parameters; those parameters must come from training rows alone." }
        - { id: fitall, x: 2, y: 2, label: "Fit on all rows", kind: external, detail: "The leak. It is one line of idiomatic code, usually written before the split existed, and it is invisible in the output." }
        - { id: model, x: 3, y: 0, label: "Model", kind: model, detail: "Sees only transformed training data. Same object applied to validation rows." }
        - { id: score, x: 3, y: 2, label: "Validation score", kind: client, detail: "Optimistic by an amount you cannot bound from the score alone. Only a shuffled-label run or a time-ordered holdout tells you the truth." }
      edges:
        - { from: events, to: split, label: "rows" }
        - { from: split, to: fit, label: "train slice" }
        - { from: split, to: fitall, label: "all rows", style: async }
        - { from: fit, to: model, label: "fitted transforms" }
        - { from: fitall, to: score, label: "contaminated", style: async }
        - { from: model, to: score, label: "predict" }
      caption: >-
        Both paths produce a number. Only one of them produces a number that will
        survive contact with next week's data.
    - type: compare
      title: "Fit before the split vs fit inside the fold"
      left_label: "Fit on all rows (leaky)"
      left_points:
        - "Selector sees every label, so it picks columns that correlate with validation labels"
        - "20 of 2,000 noise columns give CV R-squared 0.3495 on data with zero signal"
        - "Target encoding gives each row its own label: AUC 1.0 at one row per category"
        - "Code is shorter and reads more naturally, which is why it ships"
      right_label: "Fit inside the fold (honest)"
      right_points:
        - "Selector sees only training labels, so it picks the largest of 1,600 draws"
        - "Same pipeline reports R-squared -0.2905, which is the correct answer for noise"
        - "Out-of-fold encoding gives AUC 0.6738, which is real but modest skill"
        - "Code is one wrapper longer: a Pipeline, or a loop that refits per fold"
    - type: plot
      title: "The optimism grows with the number of choices (pure noise, n=200)"
      chart: line
      xLabel: "columns kept after selection"
      yLabel: "cross-validated R-squared"
      series:
        - name: "selected using all labels (leaky)"
          points:
            - { x: 1, y: 0.0259 }
            - { x: 2, y: 0.0673 }
            - { x: 5, y: 0.1858 }
            - { x: 10, y: 0.2295 }
            - { x: 20, y: 0.3495 }
            - { x: 40, y: 0.4324 }
        - name: "selected inside each fold (honest)"
          points:
            - { x: 1, y: -0.1545 }
            - { x: 2, y: -0.2379 }
            - { x: 5, y: -0.2201 }
            - { x: 10, y: -0.3527 }
            - { x: 20, y: -0.2905 }
            - { x: 40, y: -0.4629 }
    - type: pipeline
      title: "The twenty-minute leak audit"
      nodes:
        - label: "Walk the feature list with one question"
          note: "what did I know at this row's timestamp?"
          detail: "Any feature whose definition names a future event is out. This step alone finds most target and temporal leakage, and it needs no code."
        - label: "Shuffle the labels and re-run everything"
          note: "expect R-squared <= 0, AUC 0.5"
          detail: "Shuffle before the split, then rerun selection, encoding, fitting and scoring. A positive score is the size of your leak, in the units you report."
        - label: "Scan univariate AUC per feature"
          note: "anything above ~0.9 is suspect"
          detail: "Real single features rarely predict a rare event that well. A 0.99 is almost always the label, or a consequence of it."
        - label: "Check the split's independence"
          note: "groups, duplicates, time"
          detail: "Count test rows whose group appears in train, test rows with an exact twin in train, and whether the split respects time order. Three counts, three numbers to report."
        - label: "Replay one day of serving-time features"
          note: "catches skew the split cannot"
          detail: "Recompute features for a past day using the serving path and diff against the training table. Mismatched windows and timezones surface here, not in the score."
    - type: stack
      title: "Four levels at which a feature can be defined — and only one of them is safe"
      layers:
        - "Level 4: model-derived. A score from a model trained on the full history, used as an input to the next model. Leaks the label transitively unless that model was itself fit out-of-fold."
        - "Level 3: label-dependent transform. Target encoding, WOE, supervised binning. Safe only when fitted out-of-fold."
        - "Level 2: point-in-time aggregate. Sums, counts and windows ending at the row's timestamp. Safe, and the level most production features live at."
        - "Level 1: raw event attributes. Amount, channel, device. Always safe; never sufficient on their own."

  markdown: |
    ## The leak is in the pipeline, not the model

    *Evaluation* ended with a sentence worth building a topic on: **the evaluation
    set is part of the model.** Leakage is the mechanism by which that happens
    without anyone deliberately touching the test set. The model is fine. The
    feature matrix is fine. What is wrong is the *order* in which you computed
    things.

    Formally, a feature $x_j$ for a row with prediction timestamp $t$ is admissible
    if

    $$x_j = f(\mathcal{F}_t), \qquad \mathcal{F}_t = \{\text{events with timestamp} \le t\}$$

    Every family below is a violation of that one line. Target leakage uses events
    that only exist because the label happened. Temporal leakage uses
    $\mathcal{F}_{t+k}$. Preprocessing leakage uses $\mathcal{F}_T$ — the whole
    dataset — to compute a constant that then gets applied to a row at time $t$.
    Group and duplicate leakage do not violate the timestamp test on any single
    row; they violate the *independence* assumption that makes a validation split
    mean anything.

    ## Selection: manufacturing a signal that is not there

    The cleanest demonstration in this whole curriculum needs no data at all —
    only noise. Draw $n = 200$ rows and $d = 2{,}000$ columns, all independent of
    the target. Rank the columns by $|\text{corr}(x_j, y)|$, keep the best 20, and
    cross-validate.

    | columns kept | selected on all labels | selected inside each fold |
    |---|---|---|
    | 1 | 0.0259 | −0.1545 |
    | 2 | 0.0673 | −0.2379 |
    | 5 | 0.1858 | −0.2201 |
    | 10 | 0.2295 | −0.3527 |
    | 20 | **0.3495** | **−0.2905** |
    | 40 | 0.4324 | −0.4629 |

    Read the left column: a credible, monotonically improving model, built on
    columns that are independent of the target by construction. Read the right
    column: the same pipeline, honest, reporting that it is worse than predicting
    the mean — which is the correct answer.

    The mechanism is a maximum over noise. A single noise column has
    $\mathbb{E}|\rho| = \sqrt{2/(\pi n)}$, which is $0.0564$ at $n = 200$; the
    largest of $d$ such columns sits near $\sqrt{2\ln d / n} = 0.276$. You are not
    finding signal, you are reporting the extreme order statistic of $d$ draws.
    Selection is uniquely dangerous because it is the one transform that *chooses a
    column using the labels*, so it is the transform where "fit on everything"
    costs the most.

    ## Label-dependent transforms

    Target encoding replaces a category with the mean of its targets. That
    definition includes the row itself. With one row per category the encoding is
    the label and AUC is exactly 1.0; with two rows per category (500 users) the
    full-data encoding scored AUC 0.9468 while the out-of-fold version scored
    0.6738. The 0.27 difference is the row's own label coming back to it through a
    feature.

    The repair is a fold structure, not a smaller encoding:

    $$\text{enc}(i) = \frac{\sum_{j \in \text{other folds},\ c_j = c_i} y_j + m\,\bar{y}_{\text{other folds}}}{n_{c_i}^{\text{other}} + m}$$

    with $m$ a smoothing constant that pulls rare categories toward the prior. At
    $m = 0$ and a category with no rows outside the fold the expression is $0/0$,
    which is why the guard is not decorative.

    ## The split decides what the score means

    Three measurements, one lesson — a validation score is a statement about a
    *population*, and the split chooses the population:

    | family | reported | honest | what changed |
    |---|---|---|---|
    | group (300 groups × 6) | 0.4101 | −0.0098 | GroupKFold instead of KFold |
    | duplicates (20% copied) | 0.9410 | 0.9096 | dedupe before splitting |
    | temporal (1-NN on time index) | 0.9769 | −1.0470 | split at 80% instead of at random |

    The group number is predictable: with $m=5$ training rows per group and unit
    variances, the leaked model is estimating a group mean from five noisy
    observations, so

    $$R^2_{\text{leak}} = 1 - \frac{\sigma_e^2 + \sigma_e^2/m}{\sigma_g^2 + \sigma_e^2} = 1 - \frac{1 + 1/5}{2} = 0.40$$

    and the measurement is 0.4101. When a leak's size is predictable from the
    design, you are looking at a structural problem, not an unlucky sample.

    ## The rule, and how to enforce it

    One rule replaces the checklist:

    1. Split — by time if the rows have an order, by group if entities repeat,
       after deduplicating.
    2. Fit every transform on the training slice.
    3. Apply the *fitted* object to the validation slice.
    4. Fit the model, score, and never refit anything on the union.

    ```python
    from sklearn.pipeline import Pipeline
    from sklearn.model_selection import cross_val_score

    pipe = Pipeline([
        ("impute", SimpleImputer()),
        ("scale", StandardScaler()),
        ("select", SelectKBest(f_regression, k=20)),
        ("model", Ridge()),
    ])
    scores = cross_val_score(pipe, X, y, cv=TimeSeriesSplit(5))
    ```

    A `Pipeline` inside `cross_val_score` makes step 2 true by construction, which
    is why it is worth the extra line even when you think you do not need it. The
    failure mode is always the same shape: `pipe.fit_transform(X)` before the
    split, then `cross_val_score` on the already-transformed matrix. The estimator
    looks correct and the score is a fiction.

    ## What leakage is not

    Not every touch of the validation rows is fatal. A scaler fitted on all 400
    rows moved held-out $R^2$ by $1.1\times10^{-16}$ — algebraically zero, because
    a linear fit is invariant to a global shift and scale. The damage scales with
    how much of $y$ the transform reads and how many choices it makes: nothing for
    a scaler, a little for an imputer, everything for a selector or an encoder.

    This matters because the useful question is not "is this leakage?" but "how
    much, and in which direction?" A model that reports 0.94 where the problem
    permits 0.65 has a leak worth 0.29. A model that reports 0.66 where the problem
    permits 0.65 has a good week. Without the shuffle test and a time-ordered
    holdout you cannot tell those two apart, and that — not the AUC — is the actual
    risk in shipping.

    ## The longer version

    The remaining mechanisms, verbatim: the exact formula for duplicate leakage,
    how autocorrelation shrinks your effective sample size, and train/serve skew
    — the leak that survives a correct split.

    ### Failure modes, in full

    - You will ship a churn model with 0.94 AUC offline that scores 0.61 in production, and nobody will have changed the model, the data or the traffic — only the fact that in production the future has not happened yet.
    - You will select the 20 most predictive columns out of 2,000 candidate features using all your labels, cross-validate the result, and report $R^2 = 0.35$ on a dataset where the features and the target are independent by construction. The number is not a mistake in the code; every line is correct.
    - You will target-encode a high-cardinality user ID, watch validation AUC jump to 0.95, and ship a model whose only real skill is remembering each user's own label — which is exactly what the encoding gave it.
    - You will split time-ordered rows at random, let the model interpolate between a training point at $t-1$ and another at $t+1$, and report a score that no future data will ever reproduce.
    - Interviewers ask 'how do you detect leakage?' and expect a list of families plus a pipeline-ordering rule, not the word 'regularisation'.

    ### The mechanisms, in full

    - **The admissibility test is a timestamp, not an intuition.** For a row scored at time $t$, every input must be a function of information with timestamp $\le t$. Ask it per feature: *when this row was created, what did I actually know?* The clean case is `orders_last_30d` — computable at $t$ from events before $t$. The poisoned case is `days_until_next_purchase`, which is well defined in your training table and **missing for 100% of rows at serve time**; the column exists only because the future was in the file. Any feature whose definition mentions a future event is not a feature, it is a label in disguise.
    - **Target leakage: the feature is a downstream consequence of the label.** In a churn table, `account_closed_date` is non-null exactly when the customer churned; in fraud, `chargeback_filed` is non-null exactly when the transaction was fraud. A single such column takes a model to AUC 1.0 and teaches it nothing. The tell is a univariate AUC above roughly 0.9, or one coefficient that dominates the fit — the same diagnostic you would use in *Linear Regression* when a coefficient has the wrong sign. Deletion is the only fix; no transform rescues a column that is the label.
    - **Fitting before the split leaks in proportion to what the fit uses.** Measured on 400 rows: standardising with the mean and standard deviation of the *full* dataset changed held-out $R^2$ by $1.1 \times 10^{-16}$ — algebraically zero, because a linear fit is invariant to a global shift and scale. Now the same "fit on everything" applied to a selector or an encoder, both of which read $y$, is worth hundreds of points of $R^2$. The rule is therefore not "never touch the test set"; it is "anything that uses $y$, or that *chooses* a column, is fit inside the fold."
    - **Feature selection is where leakage is largest, because selection is a max over noise.** Take $n = 200$ rows and $2{,}000$ columns that are independent of $y$ by construction. Select the top 20 by $|\text{corr}|$ using every label, then run 5-fold CV on those 20: **$R^2 = 0.3495$**, with in-sample $R^2 = 0.4989$. Reselect inside each fold and the same pipeline reports **$-0.2905$**. Nothing about the model changed. The selected correlation was never signal: for a noise column $\mathbb{E}|\rho| = \sqrt{2/(\pi n)} = 0.0564$ (measured 0.0563), so the best of 2,000 columns sits near $\sqrt{2 \ln d / n} = 0.276$ (measured 0.238) purely by being the largest draw. The optimism also tracks how many columns you keep — 0.0259 at $k=1$, 0.1858 at $k=5$, 0.3495 at $k=20$, 0.4324 at $k=40$, with the honest pipeline between $-0.15$ and $-0.46$ throughout — which is the quantitative form of the lesson from *Evaluation* that a held-out set touched twenty times is no longer held out: each decision spends a little of the test set, and selecting over $d$ candidates spends it all at once.
    - **Target encoding leaks by construction, and smoothing does not fix it.** Replacing a category with the mean target of its rows means a row contributes to its own feature. With one row per category the encoding *is* the label, so AUC is exactly **1.0**. With two rows per category (500 users $\times$ 2), full-data encoding gave AUC **0.9468**; the same encoding computed out-of-fold gave **0.6738**. The gap is not model skill, it is the row's own label arriving through the back door. The fix is out-of-fold encoding — fold-wise means, with smoothing toward the out-of-fold prior so a category seen once does not get an extreme value.
    - **Group leakage: the unit of independence is not the row.** With 300 groups of 6 rows, $y$ = group effect + noise, predicting a row from its group's training mean scores **$R^2 = 0.4101$** under a random KFold and **$-0.0098$** under GroupKFold. The theory predicts the first number exactly: with $m = 5$ training rows per group and both variances 1, $R^2 = 1 - (1 + 1/5)/2 = 0.40$. Random CV was answering "can I predict another row of a patient I have already seen?" — deployment asks "a patient I have never seen". Same rows, different question, and the row count never told you which one you were answering.
    - **Duplicate leakage has an exact formula.** If a fraction $f$ of test rows has an exact twin in train, and the model scores those rows near-perfectly, the reported $R^2$ rises by $f(1 - R^2_{\text{clean}})$. Measured with 20% duplicated rows and a shuffled split: 31% of test rows had a twin, $R^2 = 0.9410$ against 0.9096 deduplicated — a gap of 0.0314 versus the predicted $0.31 \times 0.0904 = 0.0280$. The formula explains why duplicates are invisible on a model that already scores 0.91 and catastrophic on one that scores 0.2: the same $f$ is then worth $+0.25$.
    - **Temporal leakage: a random split turns the timestamp into an oracle.** Take 200 time-ordered rows and predict $y$ with 1-nearest-neighbour on the row's time index alone. Random KFold: **$R^2 = 0.9769$**. Split at 80% and test on the tail: **$-1.0470$**. The model is identical; the split decided whether it could see the neighbours of the point it was predicting. Separately, autocorrelation shrinks the information in your row count: $n$ rows carry $n(1-\rho)/(1+\rho)$ independent observations, so at $\rho = 0.9$, 1,000 rows are worth **52.6**, and the standard error of any estimate is $4.36\times$ larger than $n$ suggests (measured sd of the mean 0.3166 against a predicted 0.3162).
    - **One test catches every family: shuffle the labels and re-run the whole pipeline.** Permute $y$, refit *everything including selection and encoding*, and cross-validate. An honest pipeline must score at or below zero ($R^2 \le 0$, AUC 0.5); a positive score is leakage, and its magnitude is the size of the problem. This is the single check that would have caught the 0.3495 above before anyone looked at a model, and it is the first thing to run when a score looks too good. It fails only when the leak does not help the model — a leak the model cannot exploit is still a leak, but it will not show up here.
    - **Train/serve skew is leakage's twin, and it survives a correct split.** A feature can be perfectly admissible and still be computed differently in the batch job and in the serving path: a 30-day window measured in calendar days offline and in 720 hours online, a timezone applied in one place and not the other, a "last value" aggregate that means last-by-event-time offline and last-by-arrival online. The symptom is the same one-leak signature — offline 0.91, online 0.62, no error, no drift in the inputs you monitor. The fix is one implementation shared by both paths (a feature store, or literally the same function), plus logging the serving-time feature vector so you can diff its distribution against the training one.


  derivations:
    - title: "Why the best of d noise columns correlates at about sqrt(2 ln d / n)"
      latex: |
        Let $x_j$ be independent noise columns and $y$ independent noise, all with
        $n$ rows. The sample correlation satisfies
        $$\rho_j \approx \mathcal{N}\!\left(0, \tfrac{1}{n}\right), \qquad
          \mathbb{E}|\rho_j| = \sqrt{\frac{2}{\pi n}}.$$
        For $d$ independent draws the maximum concentrates near the $(1 - 1/d)$
        quantile of the normal, i.e. at $z \approx \sqrt{2 \ln d}$, so
        $$\max_j |\rho_j| \approx \sqrt{\frac{2 \ln d}{n}}.$$
        At $n = 200$, $d = 2000$: $\sqrt{2 \cdot 7.60 / 200} = 0.276$, against a
        measured maximum of $0.238$ and a measured mean of $0.0563$ versus the
        predicted $0.0564$.
      prose: >-
        Every column you add to the candidate pool raises the bar that noise alone
        can clear. Selecting the top-k is therefore guaranteed to produce positive
        in-sample correlation on a null dataset, and the size of that correlation
        grows with the log of the number of candidates — which is why wide feature
        stores are where leakage is found.
    - title: "The exact size of a group leak"
      latex: |
        Let $y_{gi} = g_g + \varepsilon_{gi}$ with $\operatorname{Var}(g) = \sigma_g^2$
        and $\operatorname{Var}(\varepsilon) = \sigma_e^2$. A model that predicts a
        test row by the training mean of its group uses
        $$\hat{y} = \bar{y}_{g,\text{train}} = g_g + \bar{\varepsilon}, \qquad
          \operatorname{Var}(\bar\varepsilon) = \sigma_e^2/m$$
        for $m$ training rows in the group. Then
        $$R^2 = 1 - \frac{\mathbb{E}[(y - \hat y)^2]}{\operatorname{Var}(y)}
               = 1 - \frac{\sigma_e^2 + \sigma_e^2/m}{\sigma_g^2 + \sigma_e^2}.$$
        With $\sigma_g^2 = \sigma_e^2 = 1$ and $m = 5$ this is $1 - 1.2/2 = 0.40$;
        measured, $0.4101$ under KFold and $-0.0098$ under GroupKFold.
      prose: >-
        The leak is worth exactly the reliability of the group mean: it is large
        when groups differ a lot relative to within-group noise, it grows as you add
        rows per group, and it is zero the moment the test group is unseen. That is
        why the honest number is not "smaller" — it is zero, and the gap between the
        two is entirely the question the split was answering.
    - title: "Autocorrelation shrinks your effective sample size"
      latex: |
        For a stationary AR(1) process with lag-one correlation $\rho$, the variance
        of the sample mean is
        $$\operatorname{Var}(\bar{y}) \approx \frac{\sigma^2}{n}\cdot\frac{1+\rho}{1-\rho},
          \qquad n_{\text{eff}} = n\,\frac{1-\rho}{1+\rho}.$$
        At $\rho = 0.9$: $n_{\text{eff}} = 1000 \times 0.1/1.9 = 52.6$, and the
        standard error is $\sqrt{19} = 4.36$ times larger than $n$ suggests.
        Simulated over 2,000 series of length 1,000: sd of the mean $0.3166$ against
        the predicted $0.3162$.
      prose: >-
        Rows that are adjacent in time are not independent observations, so a
        validation split that ignores time overstates both the amount of evidence
        you have and the precision of the score. The same arithmetic explains why a
        random split on a time series is optimistic even when no feature is
        future-dependent: the model is effectively trained on the neighbours of every
        test point.
  implementations:
    - language: python
      title: "A leak audit you can run before anyone looks at the model"
      note: >-
        Three checks in one pass: the shuffle test, a univariate scan, and the split's
        independence counts. **Numerically wrong for small n** — the null distribution
        of a shuffled-label score has standard deviation of order 1/sqrt(n_folds * n),
        so with 40 rows a shuffled R-squared of +0.15 is not evidence of anything. It is
        also blind to leaks the model does not exploit, and to train/serve skew, which
        has no representation in the training table at all.
      code: |
        import numpy as np

        def _r2(y, p):
            y = np.asarray(y, float); p = np.asarray(p, float)
            ss_res = float(((y - p) ** 2).sum())
            ss_tot = float(((y - y.mean()) ** 2).sum())
            return 1.0 - ss_res / ss_tot

        def _auc(y, s):
            y = np.asarray(y, int); s = np.asarray(s, float)
            order = np.argsort(s, kind="mergesort")
            ranks = np.empty(len(s), float)
            sv = s[order]; i = 0
            while i < len(sv):                      # average ranks for ties
                j = i
                while j + 1 < len(sv) and sv[j + 1] == sv[i]:
                    j += 1
                ranks[order[i:j + 1]] = (i + j) / 2.0 + 1.0
                i = j + 1
            n1 = int((y == 1).sum()); n0 = int((y == 0).sum())
            return float((ranks[y == 1].sum() - n1 * (n1 + 1) / 2.0) / (n1 * n0))

        def shuffled_label_score(fit_predict, X, y, n_folds=5, n_shuffles=20, seed=0):
            """Rerun the FULL pipeline on permuted labels.

            `fit_predict(X_tr, y_tr, X_te)` must do its own selection, encoding and
            scaling inside the call -- that is the point. Returns the mean score over
            shuffles; for R^2 it should be <= 0, for AUC it should be 0.5.
            """
            rng = np.random.default_rng(seed)
            n = len(y)
            folds = np.arange(n) % n_folds
            scores = []
            for _ in range(n_shuffles):
                y_perm = rng.permutation(y)
                pred = np.empty(n, float)
                for f in range(n_folds):
                    tr, te = folds != f, folds == f
                    pred[te] = fit_predict(X[tr], y_perm[tr], X[te])
                scores.append(_r2(y_perm, pred))
            return float(np.mean(scores)), float(np.std(scores))

        def univariate_scan(X, y, names=None):
            """Flag columns whose single-feature AUC is implausibly high."""
            X = np.asarray(X, float); y = np.asarray(y)
            out = []
            for j in range(X.shape[1]):
                s = _auc(y, X[:, j]) if len(np.unique(y)) == 2 else None
                out.append({"feature": names[j] if names else j, "auc": s})
            return sorted(
                [o for o in out if o["auc"] is not None],
                key=lambda o: -abs(o["auc"] - 0.5),
            )

        def split_independence(groups_train, groups_test, rows_train=None, rows_test=None):
            """Count the three ways a split can fail to be independent."""
            tr = set(groups_train)
            leaked = sum(1 for g in groups_test if g in tr)
            twin = None
            if rows_train is not None and rows_test is not None:
                seen = {tuple(r) for r in rows_train}
                twin = sum(1 for r in rows_test if tuple(r) in seen)
            return {
                "test_groups_seen_in_train": leaked,
                "test_rows_in_seen_group": leaked / max(1, len(groups_test)),
                "test_rows_with_exact_twin": twin,
            }
    - language: python
      title: "Out-of-fold target encoding, and the pipeline that makes it honest"
      note: >-
        **Numerically wrong in two places**, both deliberate to expose. First, when a
        category has exactly one row outside the fold and the target is binary, the
        encoding is 0 or 1 with no smoothing — a single flipped label moves the feature
        by a full unit, so `m` must be at least a few. Second, when the prior is computed
        per fold and the fold is tiny, the prior itself is noisy and the encoding can
        invert the ordering of two categories. Both failures shrink as `m` grows and as
        the fold grows, which is why the defaults here are `m >= 5`, not `m = 0`.
      code: |
        import numpy as np

        def oof_target_encode(categories, y, n_folds=5, m=5.0):
            """Encode every row with the mean target of OTHER folds only.

            This is the whole fix for target encoding: the row's own label never
            touches its own feature, and at serve time the encoding is the mean over
            all training rows of that category (fold structure is not needed then).
            """
            categories = np.asarray(categories)
            y = np.asarray(y, float)
            n = len(y)
            folds = np.arange(n) % n_folds
            enc = np.empty(n)
            for f in range(n_folds):
                out = folds != f
                prior = y[out].mean()
                for i in np.where(~out)[0]:
                    same = out & (categories == categories[i])
                    c = int(same.sum())
                    enc[i] = (y[same].sum() + m * prior) / (c + m) if c + m else prior
            return enc

        def make_pipeline(encoder_cols, numeric_cols):
            """One object that fits everything on the training slice. The ordering
            contract lives here, not in a code review."""
            from sklearn.compose import ColumnTransformer
            from sklearn.pipeline import Pipeline
            from sklearn.preprocessing import OneHotEncoder, StandardScaler
            from sklearn.impute import SimpleImputer
            from sklearn.linear_model import LogisticRegression

            pre = ColumnTransformer([
                ("num", Pipeline([("imp", SimpleImputer(strategy="median")),
                                  ("sc", StandardScaler())]), numeric_cols),
                ("cat", OneHotEncoder(handle_unknown="ignore", min_frequency=20), encoder_cols),
            ])
            return Pipeline([("pre", pre), ("clf", LogisticRegression(max_iter=1000))])

        # The leak, in one line, for contrast:
        #   X_enc = oof_target_encode(X["user_id"], y)      # uses ALL labels
        #   cross_val_score(clf, X_enc, y)                  # scores a fiction
        # The fix is not a better encoder -- it is calling the encoder inside the fold.

  checkpoints:
    - id: cp-1
      question: "Fitting a scaler on all 400 rows moved held-out R-squared by 1.1e-16, but fitting a selector on all 400 rows moved it by 0.35. Both are 'preprocessing before the split'. Why the enormous difference?"
      answerKind: short_text
      hint: "What does each transform read, and what does it do with what it reads?"
      solution: >-
        The scaler reads only $X$ and applies a shift and a scale. A linear model is
        invariant to a global shift and scale, so the leaked information cancels
        algebraically — hence $10^{-16}$, which is floating-point zero. The selector
        reads $y$ and makes a *choice* among columns; a column chosen because it
        correlates with validation labels carries those labels into the feature set.
        The rule follows: transforms that read only $X$ leak approximately nothing;
        transforms that read $y$ or that select leak in proportion to how many choices
        they make.
    - id: cp-2
      question: "Your churn model reports 0.94 AUC offline and 0.61 in production. Name the candidate causes and the one measurement that separates the biggest one from the rest."
      answerKind: short_text
      hint: "There are three families with the same signature: target leakage, temporal leakage, and train/serve skew."
      solution: >-
        Candidates: (1) a feature that is a consequence of churn, (2) a feature computed
        with post-hoc information or a random split of time-ordered rows, (3) train/serve
        skew where the offline and online computations differ, (4) genuine distribution
        shift. The separating measurement is a **time-ordered holdout plus a serving-time
        replay**: train on everything before a cut, evaluate on the tail, then recompute
        one past day's features through the serving path and diff them against the
        training table. If the time-ordered score is still 0.94 and the replay matches,
        the cause is drift, not leakage. If the time-ordered score collapses, it was
        temporal. If the replay mismatches, it was skew.
    - id: cp-3
      question: "Random KFold gives R-squared 0.41 and GroupKFold gives -0.01 on the same rows and the same model. Which number is the model's skill, and what was the random split measuring?"
      answerKind: short_text
      hint: "What is the population you will score in production — rows, or entities?"
      solution: >-
        -0.01 is the skill, if production scores entities the model has never seen. The
        random split was measuring "predict another row of a patient I already have five
        rows for", because the group's mean was estimated from rows on both sides. The
        arithmetic confirms it is structural, not luck: with $m=5$ rows per group and unit
        variances the leaked score is $1 - (1+1/5)/2 = 0.40$, matching the measured 0.4101.
        GroupKFold is not a pessimistic variant of KFold; it is a different question.
    - id: cp-4
      question: "You shuffle the labels, rerun the entire pipeline, and cross-validation reports R-squared 0.31 on a regression problem. What do you know, and what do you still not know?"
      answerKind: short_text
      hint: "The shuffled run has no signal by construction, so any positive score comes from somewhere other than the features."
      solution: >-
        You know the pipeline leaks, and roughly how much: 0.31 is the optimism floor at
        this sample size, so any real score must be discounted by at least that much. You
        do not know *which* step leaks — selection, encoding, an imputer, a resampler, or
        a duplicate-aware split that is not duplicate-aware. Bisect by disabling transforms
        one at a time and re-running the shuffle test; the step whose removal drops the
        score to zero is the leak. A caveat: a leak the model cannot exploit will not show
        up here, so a clean shuffle result is necessary, not sufficient.
    - id: cp-5
      question: "A daily series has lag-one autocorrelation 0.95. You have 2,000 days. How many independent observations do you effectively have, and what does that do to your confidence interval?"
      answerKind: short_text
      hint: "n_eff = n(1 - rho)/(1 + rho)."
      solution: >-
        $n_{\text{eff}} = 2000 \times 0.05/1.95 = 51.3$. The variance of any sample mean is
        inflated by $(1+\rho)/(1-\rho) = 39$, so the standard error is $\sqrt{39} = 6.24$
        times larger than $2{,}000$ rows suggests. Practical consequence: a validation score
        computed on 2,000 autocorrelated rows has the precision of roughly 50 rows, and a
        0.01 improvement between two models is noise.
    - id: cp-6
      question: "Your split is clean, the shuffled-label test returns -0.02, and every feature passes the timestamp test. Production still underperforms. What class of problem is left?"
      answerKind: short_text
      hint: "The feature is admissible. Is it the *same feature* in both paths?"
      solution: >-
        Train/serve skew. The feature exists at serve time but is computed differently:
        a 30-day window in calendar days offline versus 720 hours online, a timezone
        applied in the batch job only, a "most recent" aggregate ordered by event time
        offline and by arrival time online, or a default value that fires online but never
        appeared in training. Detect it by replaying a past day through the serving path
        and diffing the feature vectors row by row against the training table; fix it by
        sharing one implementation between both paths, which is what a feature store is for.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Leakage is a mismatch between the information you had when you computed a number
        and the information you will have when you use it. The model is almost never the
        culprit: the score is computed on data that was, in some indirect way, used to
        build the thing being scored. Because the code is idiomatic and the number is
        plausible, nothing looks wrong — which is why the diagnosis has to be structural
        rather than visual.
      blocks:
        - kind: checklist
          body: |
            - Ask per feature: what did I know at this row's timestamp?
            - Ask per transform: did it read y, or choose a column?
            - Ask per split: are the two sides independent, or do entities repeat?
            - Ask per score: what would this pipeline report on shuffled labels?
        - kind: warning
          body: >-
            "I never touched the test set deliberately" is not a defence. Most leakage is
            written before the split exists, by a helper function that seemed obviously
            correct at the time.
      checkpoint: >-
        Before reading on: if you shuffled the labels and your cross-validated score stayed
        at 0.3, what would that tell you about the features, and what would it *not* tell you?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Two tools, and they answer different questions. To *find* leakage, run the shuffle
        test: permute the labels, re-run the entire pipeline including selection and
        encoding, and require a score at or below zero. To *fix* leakage, reorder the
        pipeline: split first, then fit every transform on the training slice. Reach for
        the shuffle test before you reach for a better model — it is cheap, it needs no
        labels, and it is the only check that covers all five families at once.
      blocks:
        - kind: checklist
          body: |
            - Detection: shuffle labels -> rerun everything -> expect <= 0 (R2) or 0.5 (AUC)
            - Detection: univariate AUC per feature -> anything above ~0.9 is a suspect
            - Detection: count test rows whose group or exact row appears in train
            - Fix: split first, then fit; wrap the whole thing in a Pipeline
            - Fix: GroupKFold for repeated entities, time-ordered split for ordered rows
      checkpoint: >-
        Which of those five lines would have caught the 20-of-2,000-noise-columns result,
        and which would have caught a patient split across both sides?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The audit is four loops and the fix is a reordering. Neither is subtle once you
        have decided that the split comes first.
      blocks:
        - kind: pseudocode
          body: |
            # 1. Shuffle test
            for s in range(n_shuffles):
                y_perm = permute(y)
                pred = empty(n)
                for f in folds:
                    cols = select(X[train(f)], y_perm[train(f)], k)   # refit EVERYTHING
                    enc  = encode(X[train(f)], y_perm[train(f)])
                    model.fit(transform(X[train(f)], cols, enc), y_perm[train(f)])
                    pred[test(f)] = model.predict(transform(X[test(f)], cols, enc))
                scores.append(r2(y_perm, pred))
            assert mean(scores) <= 0

            # 2. The fix, as an ordering
            train, test = split(rows)          # by time, by group, after dedupe
            t = fit_transformer(train)         # scaler, imputer, encoder, selector
            model.fit(t(train), y_train)
            score(model, t(test), y_test)      # t was fit on train only

            # 3. Verify the fix
            re-run (1) with the new pipeline; it must now return <= 0
      checkpoint: >-
        In the pseudocode above, which single line is the difference between 0.3495 and
        -0.2905?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Leakage sizes are predictable, which is what separates a real diagnosis from a
        suspicious feeling. Four closed forms cover the families you will meet most.
      blocks:
        - kind: math
          body: |
            Selection over noise. For $n$ rows and $d$ independent noise columns,
            $$\rho_j \sim \mathcal{N}(0, 1/n), \quad \mathbb{E}|\rho_j| = \sqrt{2/(\pi n)},
              \quad \max_j|\rho_j| \approx \sqrt{2\ln d / n}.$$
            At $n=200$, $d=2000$: mean $0.0564$, max $0.276$ — measured $0.0563$ and $0.238$.

            Group leak. With $m$ training rows per group and variances $\sigma_g^2, \sigma_e^2$:
            $$R^2 = 1 - \frac{\sigma_e^2(1 + 1/m)}{\sigma_g^2 + \sigma_e^2}
                   = 1 - \frac{1.2}{2} = 0.40 \quad (\sigma_g^2=\sigma_e^2=1,\ m=5).$$

            Duplicates. For a fraction $f$ of test rows with an exact twin in train:
            $$R^2_{\text{reported}} = R^2_{\text{clean}} + f\,(1 - R^2_{\text{clean}}).$$

            Autocorrelation. For AR(1) with lag-one $\rho$:
            $$n_{\text{eff}} = n\frac{1-\rho}{1+\rho}, \qquad
              \operatorname{SE inflation} = \sqrt{\frac{1+\rho}{1-\rho}}.$$
      checkpoint: >-
        The group formula says the leak grows with $m$, the number of rows per group. Why
        does adding rows to a patient make the *leak* worse rather than the estimate better?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete audit and the pipeline ordering that makes its result hold. Read the
        audit first, predict what it will report on your own data, then run it.
      blocks:
        - kind: warning
          body: >-
            The shuffle test is necessary, not sufficient. It cannot see a leak the model
            does not exploit, and it cannot see train/serve skew at all, because skew lives
            outside the training table.
        - kind: code
          language: python
          body: |
            import numpy as np

            def r2(y, p):
                y = np.asarray(y, float); p = np.asarray(p, float)
                return 1.0 - ((y - p) ** 2).sum() / ((y - y.mean()) ** 2).sum()

            def corr(X, y):
                Xc = X - X.mean(0); yc = y - y.mean()
                den = np.linalg.norm(Xc, axis=0) * np.linalg.norm(yc)
                return np.abs(Xc.T @ yc / np.where(den == 0, 1e-12, den))

            def select(X, y, k):
                return np.argsort(-corr(X, y), kind="stable")[:k]

            def fit_predict(Xtr, ytr, Xte, k):
                """Everything is fit here, on the training slice only."""
                cols = select(Xtr, ytr, k)
                A = np.column_stack([np.ones(len(Xtr)), Xtr[:, cols]])
                beta, *_ = np.linalg.lstsq(A, ytr, rcond=None)
                return beta[0] + Xte[:, cols] @ beta[1:]

            def cv_r2(X, y, k, n_folds=5, leaky=False):
                X = np.asarray(X, float); y = np.asarray(y, float)
                n = len(y); folds = np.arange(n) % n_folds
                cols_all = select(X, y, k)          # <- the leak, if you keep this line
                pred = np.empty(n)
                for f in range(n_folds):
                    tr, te = folds != f, folds == f
                    if leaky:
                        A = np.column_stack([np.ones(tr.sum()), X[tr][:, cols_all]])
                        b, *_ = np.linalg.lstsq(A, y[tr], rcond=None)
                        pred[te] = b[0] + X[te][:, cols_all] @ b[1:]
                    else:
                        pred[te] = fit_predict(X[tr], y[tr], X[te], k)
                return r2(y, pred)

            # The three numbers that make the point, on pure noise:
            #   cv_r2(X, y, 20, leaky=True)   ->  0.3495
            #   cv_r2(X, y, 20, leaky=False)  -> -0.2905
            #   shuffled-label version of the honest pipeline -> <= 0, always

            def shuffle_test(fit_predict_one_fold, X, y, n_folds=5, seed=0):
                rng = np.random.default_rng(seed)
                y_perm = rng.permutation(y)
                n = len(y); folds = np.arange(n) % n_folds
                pred = np.empty(n)
                for f in range(n_folds):
                    tr, te = folds != f, folds == f
                    pred[te] = fit_predict_one_fold(X[tr], y_perm[tr], X[te])
                return r2(y_perm, pred)      # must be <= 0
      checkpoint: >-
        In `cv_r2`, the leak is one line — `cols_all` computed outside the fold. If you
        moved that line inside the loop and changed nothing else, which of the four
        derivation formulas would predict the size of the change?

  problems:
    - id: p-causal-rolling-mean
      title: "A feature that only looks backwards"
      difficulty: easy
      prompt: >-
        Implement `causal_rolling_mean(values, window)`. For each index `i`, return the
        mean of the `window` observations strictly *before* it — that is, of
        `values[max(0, i - window):i]` — so the result at `i` never depends on `values[i]`
        or anything after it. The first element is `None`, because no past exists yet.
        Return `None` for that position rather than 0.0: a fabricated zero is a value the
        model will learn from.
      starter: |
        def causal_rolling_mean(values, window):
            # your implementation here
            pass
      language: python
      entry: causal_rolling_mean
      testCases:
        - input: "[[1, 2, 3, 4], 2]"
          expected: "[null, 1.0, 1.5, 2.5]"
          mode: json
          tolerance: 1e-9
        - input: "[[5.0], 3]"
          expected: "[null]"
          mode: json
          tolerance: 1e-9
        - input: "[[1, 2, 3, 4, 5, 6], 3]"
          expected: "[null, 1.0, 1.5, 2.0, 3.0, 4.0]"
          mode: json
          tolerance: 1e-9
        - input: "[[2.0, 4.0, 6.0], 1]"
          expected: "[null, 2.0, 4.0]"
          mode: json
          tolerance: 1e-9
      solution: |
        def causal_rolling_mean(values, window):
            n = len(values)
            if n == 0:
                return []
            out = [None]
            for i in range(1, n):
                lo = max(0, i - window)
                chunk = values[lo:i]          # strictly before i
                out.append(sum(chunk) / len(chunk))
            return out
      solutionExplanation: >-
        The whole point is the slice `values[lo:i]`, which stops at `i` rather than
        `i + 1`. A centred window (`values[i-1:i+2]`) would be a better predictor and a
        lie: at prediction time on day `i` you do not have day `i + 1`. Note that the
        first `window - 1` values use a shorter history instead of a full window — that is
        the honest choice for a feature, and it is why `None` rather than 0.0 is returned
        at position 0: a zero is a real number the model will fit to.
      complexity: "O(n * window) time, O(n) space"
      tags: [feature-engineering, time-series, leakage]

    - id: p-oof-target-encode
      title: "Out-of-fold target encoding"
      difficulty: medium
      prompt: >-
        Implement `oof_target_encode(categories, targets, n_folds, smoothing)`. Assign
        row `i` to fold `i % n_folds`. For each row, compute the encoding from the rows in
        *other* folds only, using the smoothed mean

        `enc = (sum of those targets + smoothing * prior) / (count + smoothing)`

        where `prior` is the mean target of the other folds (not of all rows) and `count`
        is the number of other-fold rows sharing the row's category. If a category has no
        other-fold rows, the encoding is the prior. When `count + smoothing` is zero,
        return the prior. Return a list of floats, one per row.
      starter: |
        def oof_target_encode(categories, targets, n_folds, smoothing):
            # your implementation here
            pass
      language: python
      entry: oof_target_encode
      testCases:
        - input: '[["a", "a", "b", "c"], [1, 0, 1, 0], 2, 1]'
          expected: "[0.0, 1.0, 0.0, 1.0]"
          mode: json
          tolerance: 1e-9
        - input: '[["x", "x", "x", "y", "y", "y"], [1, 0, 1, 1, 0, 1], 3, 2]'
          expected: "[0.5, 1.0, 0.5, 0.5, 1.0, 0.5]"
          mode: json
          tolerance: 1e-9
        - input: '[["a", "a", "a", "a"], [1, 0, 0, 1], 2, 0]'
          expected: "[0.5, 0.5, 0.5, 0.5]"
          mode: json
          tolerance: 1e-9
        - input: '[["u", "v", "u", "v", "w"], [1.0, 0.0, 0.0, 1.0, 1.0], 3, 5]'
          expected: "[0.27777777777777773, 0.7222222222222222, 0.7916666666666666, 0.27777777777777773, 0.6666666666666666]"
          mode: json
          tolerance: 1e-9
      solution: |
        def oof_target_encode(categories, targets, n_folds, smoothing):
            n = len(categories)
            if n == 0:
                return []
            folds = [i % n_folds for i in range(n)]
            out = []
            for i in range(n):
                other = [j for j in range(n) if folds[j] != folds[i]]
                prior = sum(targets[j] for j in other) / len(other)
                match = [j for j in other if categories[j] == categories[i]]
                s = sum(targets[j] for j in match)
                c = len(match)
                denom = c + smoothing
                out.append(prior if denom == 0 else (s + smoothing * prior) / denom)
            return out
      solutionExplanation: >-
        The `other` list is the entire idea: it excludes every row in the current fold, so
        a row can never contribute to its own encoding. The prior is computed on the same
        excluded set, otherwise the prior carries a trace of the row's fold. Smoothing
        matters most where `count` is 0 or 1: with `smoothing = 0` an unseen category would
        divide by zero, and a category seen once would receive an extreme encoding that is
        one label away from flipping. The fourth case exercises smoothing at 5, which pulls
        the sparse `w` category toward the prior.
      complexity: "O(n^2) time, O(1) extra space per row"
      tags: [target-encoding, cross-validation, leakage]

    - id: p-leaky-selection-cv
      title: "Measure the leak you just wrote"
      difficulty: hard
      prompt: >-
        Implement `leaky_selection_cv_r2(X, y, k, n_folds)` returning
        `{"leaky": float, "honest": float}`.

        Assign row `i` to fold `i % n_folds` and compute two pooled out-of-fold $R^2$
        values on the same data. **Leaky**: rank columns by $|\text{corr}(x_j, y)|$
