      solution: |
        import numpy as np

        def _corr(X, y):
            Xc = X - X.mean(axis=0)
            yc = y - y.mean()
            denom = np.linalg.norm(Xc, axis=0) * np.linalg.norm(yc)
            denom = np.where(denom == 0.0, 1e-12, denom)
            return np.abs(Xc.T @ yc / denom)

        def _select(X, y, k):
            return np.argsort(-_corr(X, y), kind="stable")[:k]

        def _fit_predict(Xtr, ytr, Xte):
            A = np.column_stack([np.ones(len(Xtr)), Xtr])
            beta, *_ = np.linalg.lstsq(A, ytr, rcond=None)
            return beta[0] + Xte @ beta[1:]

        def _r2(y, p):
            ss_res = float(((y - p) ** 2).sum())
            ss_tot = float(((y - y.mean()) ** 2).sum())
            return 1.0 - ss_res / ss_tot

        def leaky_selection_cv_r2(X, y, k, n_folds):
            X = np.asarray(X, dtype=float)
            y = np.asarray(y, dtype=float)
            n = len(y)
            folds = np.arange(n) % n_folds
            cols_all = _select(X, y, k)
            pred_leak = np.empty(n)
            for f in range(n_folds):
                tr, te = folds != f, folds == f
                pred_leak[te] = _fit_predict(X[tr][:, cols_all], y[tr], X[te][:, cols_all])
            pred_hon = np.empty(n)
            for f in range(n_folds):
                tr, te = folds != f, folds == f
                cols = _select(X[tr], y[tr], k)
                pred_hon[te] = _fit_predict(X[tr][:, cols], y[tr], X[te][:, cols])
            return {"leaky": _r2(y, pred_leak), "honest": _r2(y, pred_hon)}
      solutionExplanation: >-
        The only difference between the two branches is *where* `_select` is called. In the
        leaky branch it is called once, outside the loop, on every row including the ones
        being scored; in the honest branch it is called inside, on training rows only. On
        the pure-noise case that single move is the difference between a reported
        $R^2 = 0.2153$ and $-0.3833$ — the leaky pipeline claims to explain 22% of the
        variance of a target that is independent of every column, while the honest one
        correctly reports worse-than-the-mean. On the signal case the two agree to three
        decimals (0.9550 vs 0.9552), which is the important negative control: a leak
        detector based on "validation is much higher than training" would see nothing
        wrong, because when there is real signal the leak adds almost nothing.
      complexity: "O(n_folds * n * d) time, O(n + d) space"
      tags: [feature-selection, cross-validation, leakage, numpy]

  try_it: >-
    Take 200 rows and 2,000 columns that are independent of $y$ by construction,
    select the top 20 by $|\text{corr}|$ using every label, then run 5-fold CV on
    those 20. You will report $R^2 = 0.3495$ on pure noise; now redo it with the
    selection inside each fold and watch the number collapse to zero.
  interview_questions:
    - question: "What is the admissibility test for a feature?"
      level: mid
      key_points:
        - "A timestamp, not an intuition: for a row scored at time $t$, every input must be a function of information with timestamp $\\le t$."
        - "Ask it per feature — when this row was created, what did I actually know? — because the test is about the moment of prediction, not about correlation."
        - "`orders_last_30d` is computable at $t$ from past events; `account_closed_date` is non-null exactly when the customer churned."
        - "The same test covers train/serve skew: a 30-day window in calendar days offline and 720 hours online passes admissibility and still breaks in production."
      follow_up: "A feature passes the timestamp test and the model still degrades in production. What else do you check?"
    - question: "Your pipeline reports $R^2 = 0.35$ on data where the features are independent of the target. How?"
      level: senior
      key_points:
        - "Feature selection is a maximum over noise: choosing the top 20 of 2,000 by $|\\text{corr}|$ using all labels guarantees the survivors look predictive."
        - "Measured: $R^2 = 0.3495$ in-sample, with the top-20 selection alone producing the entire effect on 200 rows."
        - "The fix is mechanical — selection, encoding, scaling and resampling all fit inside the training fold, never before the split."
        - "The one-test detector is to permute $y$ and re-run everything; an honest pipeline scores at or below zero, and a positive score sizes the leak."
      follow_up: "You move selection inside the fold and the score drops to 0.01. Was the original number a bug in the code?"
    - question: "Which split do you need, and when does a random KFold fail badly?"
      level: mid
      key_points:
        - "The unit of independence is not the row: with 300 groups of 6, predicting a row from its group's training mean scored $R^2 = 0.4101$ under KFold and $-0.0098$ under GroupKFold."
        - "Temporal data needs a time split: 1-NN on the time index alone scored $R^2 = 0.9769$ with random KFold and $-1.0470$ on a tail split."
        - "Duplicates leak by an exact formula: if a fraction $f$ of test rows has a twin in train, the reported $R^2$ rises by roughly $f(1 - R^2_{\\text{clean}})$."
        - "So the split is a claim about what varies independently at prediction time, and it must be chosen before any transform is fitted."
  common_mistakes:
    - "Selecting features on the full dataset then cross-validating, which produced $R^2 = 0.3495$ from 2,000 columns that were independent of the target."
    - "Target-encoding a category with one row per category, where the encoding is the label itself and AUC hits exactly 1.0."
    - "Blaming the split for everything: standardising before the split changed held-out $R^2$ by $1.1\\times10^{-16}$, while selection, target encoding and the split unit are the real leaks."
