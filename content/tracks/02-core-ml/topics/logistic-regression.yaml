      left_label: "Least squares on 0/1 labels"
      left_points:
        - "Costs (η − y)², so η = 6 with y = 1 is penalised 25 — it pays to be *less* confident"
        - "Unbounded output: a least-squares fit on 0/1 labels produced scores from −0.352 to 1.498"
