id: logistic-regression
slug: logistic-regression
title: "Logistic Regression: A Line on the Log-Odds, a Probability by Distance"
summary: >-
  Derive the classifier from cross-entropy, fit it with a handful of Newton
  steps, and read it as what it is — a hyperplane plus a distance-dependent
  probability that you can rescale without moving the line at all.
kind: lesson
difficulty: medium
position: 3
estMinutes: 26
prerequisites: [linear-regression, information-theory]
phase: supervised-learning
tags: [logistic-regression, classification, cross-entropy, irls, newton, decision-boundary, calibration, separation]

body:
  big_idea: >-
    Logistic regression is linear on the log-odds, not the probability, so it puts a
    hyperplane where evidence is even and reports confidence by distance — and you can
    rescale it without moving the line.

  problem:
    - "You ship a churn model on 3% positives. It reaches 97% accuracy by predicting \"stays\" for everyone, and the dashboard is green."
    - "You fit on a balanced sample and deploy into a 1.6% stream: every probability is off by 4.6 nats of log-odds, and retraining cannot fix the intercept."
    - "Your small dataset is perfectly separable, the loss falls to $1.6\\times10^{-18}$, and someone declares the model excellent while the weights double every iteration."

  analogy: |
    Football's offside rule is a straight line across the pitch, and how far
    offside a player is measures perpendicular to it: one metre beyond is one
    metre. $w$ is the goal-ward normal, $b$ slides the line, and $w^\top x + b >
    0$ is the call. A linesman has no notion of confidence, though — the
    steepness of the probability comes from $\|w\|$.

  concept_points:
    - "**The model is linear in the log-odds.** $\\log\\frac{p}{1-p} = w^\\top x + b$, so $p = \\sigma(\\eta)$: $\\sigma(2) = 0.8808$, $\\sigma(5) = 0.9933$. A coefficient of $\\ln 2$ multiplies the odds by 2.0 per unit. The trap is reading $w_j$ as a change in probability: since $dp/d\\eta = p(1-p)$, the same coefficient moves probability 25 times less at $p = 0.99$ than at $0.5$."
    - "**The loss is cross-entropy, which is exactly the Bernoulli negative log likelihood, and its floor is the entropy of the labels.** $L = \\frac1n\\sum_i[\\log(1+e^{\\eta_i}) - y_i\\eta_i]$. Measured floors: 10% positives gives 0.3251 nats $=$ 0.4690 bits; 1.58% gives 0.0812 nats. A loss that plateaus at the floor means the features are exhausted, not that the optimiser is stuck."
    - "**The gradient is $X^\\top(\\hat p - y)$ with no sigmoid factor left over, because $\\sigma'(\\eta) = p(1-p)$ cancels the $1/(p(1-p))$ from the logarithm.** Per sample it is bounded: $\\max|\\hat p - y| = 1.0$ however wrong the model is. The bound is per sample, not per parameter: a feature of magnitude 1000 makes the update a thousand times larger, which is why unscaled inputs diverge."
    - "**The Hessian is $X^\\top WX$ with $W = \\operatorname{diag}(\\hat p(1-\\hat p))$, so the problem is convex and Newton's method is iteratively reweighted least squares.** The Newton step solves $(X^\\top WX)\\delta = X^\\top(\\hat p - y)$ — linear regression's normal equation, reweighted each iteration. Measured: 5 iterations on a $300\\times2$ collinear design where gradient descent needs **55,483**."
    - "**Rescaling $w$ leaves the boundary where it is and changes every probability.** For any $c>0$ the boundary set is unchanged: accuracy stayed 0.835 at every $c \\in \\{0.25,...,10\\}$ while log-loss went $0.4754, 0.3790, 0.3327, 0.3963, 0.6331, 1.4504$. And under perfect separation there is no finite maximiser: scaling by $t$ drives the loss to zero as $t\\to\\infty$, so $\\|\\beta\\|$ ran to 66.36."
    - "**Calibration and discrimination are different properties, and only one survives a monotone transform.** Applying $p \\mapsto p^2$ leaves the ranking bit-identical — AUC $0.9263427109974425$ before and after — but raises log-loss from 0.3327 to 0.4074. The intercept is the calibration knob: training on a balanced sample and deploying at 1% means adding $\\log\\frac{0.01}{0.99} = -4.5951$. The 0.5 threshold is likewise a decision, not a property."

  definitions:
    - term: 'Log-odds (logit)'
      meaning: >-
        $\log\frac{p}{1-p}$, the scale on which logistic regression is linear.
        It maps $(0,1)$ onto the whole real line, which is why a linear model
        can be used for a probability without ever leaving the valid range.
    - term: 'Sigmoid (logistic function)'
      meaning: >-
        $\sigma(\eta) = 1/(1+e^{-\eta})$, the inverse of the logit. Smooth,
        monotone, bounded in $(0,1)$, with derivative $p(1-p)$ and maximum
        slope $0.25$ at $\eta = 0$.
    - term: 'Odds and odds ratio'
      meaning: >-
        Odds are $p/(1-p)$. A coefficient $w_j$ is an odds ratio
        $e^{w_j}$: the factor by which the odds multiply per unit of feature
        $j$, holding the others fixed. $w_j = \ln 2$ means a doubling.
    - term: 'Log loss (cross-entropy)'
      meaning: >-
        $-\frac1n\sum[y\log p + (1-y)\log(1-p)]$, in nats when the log is
        natural. Equal to the Bernoulli negative log likelihood, and equal to
        $H(y) + D_{KL}(y \,\|\, p)$ — which is why its floor is the label
        entropy.
    - term: 'Linear predictor ($\eta$)'
      meaning: >-
        $w^\top x + b$: the score before the link function. It is the quantity
        the model is linear in, the quantity the gradient is expressed through,
        and the quantity whose sign defines the decision boundary.
    - term: 'Decision boundary'
      meaning: >-
        The set $\{x : w^\top x + b = 0\}$, a hyperplane of dimension $p-1$
        with normal $w$. It is where the log-odds are even, so $p = 0.5$ there.
        Choosing a decision threshold other than $0.5$ moves the *decision*
        surface to a parallel hyperplane without changing the model at all.
    - term: 'Geometric margin'
      meaning: >-
        $|w^\top x + b| / \|w\|$, the perpendicular distance from a point to
        the boundary. Unlike the raw score, this *is* comparable across models,
        because it is invariant to rescaling $w$.
    - term: 'IRLS (iteratively reweighted least squares)'
      meaning: >-
        Newton's method applied to a GLM: at each iteration, solve a weighted
        least-squares problem whose weights are $\hat p(1-\hat p)$ and whose
        response is the working residual. Convergence is quadratic near the
        optimum, typically 5-8 iterations regardless of $n$.
    - term: 'Complete separation'
      meaning: >-
        The existence of a hyperplane with $y_i(w^\top x_i + b) > 0$ for all
        $i$. The likelihood has no finite maximiser, the fitted weights diverge,
        and the Hessian becomes singular. Quasi-complete separation is the same
        failure on a subset of points.
    - term: 'Calibration'
      meaning: >-
        The property that predicted probabilities match observed frequencies:
        among all cases scored $0.2$, about 20% should be positive. It is
        orthogonal to ranking quality — a monotone transform preserves AUC and
        destroys calibration.

