id: gradient-boosting
slug: gradient-boosting
title: "Gradient Boosting Is Gradient Descent With Trees as the Parameter"
summary: >-
  Build a boosted ensemble as functional gradient descent — each tree fits the
  negative gradient of the loss, each leaf is a solved Newton step, and the
  learning rate decides whether ten thousand small trees beat a hundred big
  ones.
kind: lesson
difficulty: hard
position: 7
estMinutes: 26
prerequisites: [decision-trees, gradient-descent-variants]
phase: supervised-learning
tags: [gradient-boosting, xgboost, lightgbm, functional-gradient-descent, newton-method, shrinkage, tabular]

body:
  big_idea: >-
    Gradient boosting is gradient descent in function space: each tree fits the negative
    gradient and each leaf is a solved Newton step, so shrinkage, not tree count,
    decides whether it generalises.

  problem:
    - "Your first XGBoost model beats the neural network on tabular data and you cannot say why, so when it loses you have only a grid."
    - "`learning_rate=0.1, n_estimators=10000` is folklore: on 2,000 rows depth-6 at `eta=0.3` scores 1.2597 test MSE, 1,000 stumps at `eta=0.1` score 1.0229."
    - "`min_child_weight=1` looks like \"one row per leaf\", but in a logistic model it means 5 rows at the start and 138 by round 300."

  analogy: |
    A committee correcting a draft. The first draft is the mean and is wrong
    everywhere. The second reviewer does not rewrite it — they write a note on
    how the draft is wrong in each region, and the editor merges 10% of that
    note. The third reads the *revised* draft. The note is the negative
    gradient, the reviewer is a tree, and the 10% is the learning rate.

  concept_points:
    - "**Boosting is gradient descent with functions in place of parameters.** The update is $F_m = F_{m-1} + \\nu f_m$, where $f_m$ is fitted to $-g_i = -\\partial L(y_i,F)/\\partial F$. For squared loss $g_i = F_{m-1}(x_i) - y_i$, so the negative gradient *is* the residual: \"fit the residuals\" is the gradient, not a heuristic. Because $f_m$ is a tree, each step is piecewise constant."
    - "**The leaf value is solved, not chosen: $w^\\star = -G/(H+\\lambda)$.** XGBoost minimises the second-order Taylor expansion inside each leaf, giving a closed form in the summed gradient $G$ and hessian $H$. For squared loss $h_i=1$ and $w^\\star$ is the mean residual; for logistic loss $h_i = p_i(1-p_i)$, a curvature-weighted mean that discounts confident rows."
    - "**The split gain is the CART criterion with the target swapped for the gradient.** $\\text{gain} = \\tfrac12[\\frac{G_L^2}{H_L+\\lambda} + \\frac{G_R^2}{H_R+\\lambda} - \\frac{G^2}{H+\\lambda}] - \\gamma$. With squared loss, $\\lambda = \\gamma = 0$ this is exactly half the SSE reduction CART maximises — verified over 2,000 random splits to $1.26\\times10^{-13}$. The impurity function did not change; the *target* did."
    - "**$\\lambda$, $\\gamma$ and `min_child_weight` are three different prices.** $\\gamma$ is charged once per split in gain units, exactly `min_impurity_decrease`; $\\lambda$ is charged continuously per leaf and enters both $w^\\star$ and the gain, so its bite scales as $1/(H+\\lambda)$: a leaf with $G=-5$, $H=3$ gives $w^\\star = 1.667$ at $\\lambda=0$ and 0.049 at $\\lambda=100$. `min_child_weight` is a hessian sum, not a row count."
    - "**$\\lambda$, $\\gamma$ and `min_child_weight` are three different prices.** $\\gamma$ is charged once per split in gain units — exactly `min_impurity_decrease`. $\\lambda$ is charged per leaf and enters both $w^\\star$ and the gain, so its bite scales as $1/(H+\\lambda)$: a leaf with $G=-5$, $H=3$ gives $w^\\star = 1.667$ at $\\lambda=0$ and 0.049 at $\\lambda=100$. `min_child_weight` is a hessian sum, not a row count."
    - "**Why 10,000 shallow trees beat 100 deep ones.** On 2,000 rows, 10,000 stumps at $\\nu=0.1$ reach test MSE **1.0990**; 100 depth-6 trees at $\\nu=1.0$ reach **1.9166**, 42.7% worse. The mechanism is variance: a depth-6 tree fits 62 leaves to about 32 rows each. And the failure: on $4x_0x_1 + 3|x_2-x_3|$ the stumps reach **4.9650** against a variance of 4.7364."

  definitions:
    - term: "Functional gradient descent"
      meaning: >-
        Gradient descent in which the variable being optimised is a function
        rather than a vector of parameters. Each step adds a new basis function
        (here, a tree) fitted to the negative gradient evaluated at the current
        function.
    - term: "Pseudo-residual"
      meaning: >-
        The negative gradient $-g_i = -\partial L(y_i, F(x_i))/\partial F$ used
        as the regression target for the next tree. For squared loss it equals
        $y_i - F(x_i)$, the ordinary residual; for logistic loss it equals
        $y_i - p_i$. The name exists because for most losses it is not a residual
        in the geometric sense.
    - term: "Shrinkage (learning_rate, eta)"
      meaning: >-
        The multiplier $\nu \in (0,1]$ applied to each tree before it is added.
        It scales the bias correction and the injected variance differently —
        bias decays as $(1-\nu)^M$, variance grows as $\nu^2 M$ — which is why
        lowering it requires more rounds and usually lowers the best achievable
        validation loss.
    - term: "Newton step / second-order leaf"
      meaning: >-
        The leaf value $w^\star = -G/(H+\lambda)$ obtained by minimising the
        second-order Taylor expansion of the loss inside the leaf. It replaces a
        chosen step size with a solved one, and it is the single largest
        difference between XGBoost and textbook residual boosting.
    - term: "Cover (hessian sum)"
      meaning: >-
        $H = \sum_i h_i$ over the rows in a node. It is the node's effective
        sample size: equal to the row count under squared loss, and at most
        $n/4$ under logistic loss. It is the quantity `min_child_weight`
        constrains and the denominator that shrinks each leaf value.
    - term: "min_child_weight"
      meaning: >-
        The minimum hessian sum a child must retain for a split to be accepted.
        Despite the name it is not a row count except under squared loss; on a
        converged logistic model one unit of cover can mean more than a hundred
        rows.
    - term: 'reg_lambda ($\lambda$)'
      meaning: >-
        L2 penalty on leaf weights, default 1 in XGBoost. It enters the
        denominator of the leaf value and of every gain term, so it shrinks small
        leaves hard and large leaves barely at all.
    - term: "gamma (min_split_loss)"
      meaning: >-
        The minimum gain a split must produce to be kept, default 0. It is a
        fixed price per split, structurally identical to `min_impurity_decrease`
        in scikit-learn's trees, and it is the cheapest way to stop a tree from
        growing leaves that each explain three rows.
    - term: "Base score"
      meaning: >-
        The constant $F_0$ the ensemble starts from — the mean of $y$ for
        regression, the log-odds of the base rate for classification. Every
        subsequent tree is fitted to the gradient at $F_0$, so a wrong base score
        costs rounds rather than correctness.
    - term: "Histogram binning"
      meaning: >-
        Replacing each feature's values with integer bin indices (255 bins by
        default in LightGBM, 256 in XGBoost's `hist`) so that split search
        iterates over bins rather than rows. It is the single biggest speed win
        in modern boosting and it makes the split grid coarser than the data.
    - term: "GOSS (Gradient-based One-Side Sampling)"
      meaning: >-
        LightGBM's sampling scheme: keep the top $a$ fraction of rows by gradient
        magnitude, sample a $b$ fraction of the remainder, and reweight the
        sampled part by $(1-a)/b$ so the gain estimate stays unbiased. Defaults
        $a = 0.2$, $b = 0.1$, so 30% of rows and a weight of 8.
    - term: "EFB (Exclusive Feature Bundling)"
      meaning: >-
        Bundling sparse features that are almost never non-zero together into a
        single column, turning an $O(n d)$ histogram build into $O(n d')$ with
        $d' \ll d$. Exact for mutually exclusive features, approximate otherwise.
    - term: "Leaf-wise growth"
      meaning: >-
        Growing the tree by repeatedly splitting whichever current leaf yields
        the largest gain, rather than splitting every leaf at a level. For a
        fixed leaf budget it reduces training loss much further and raises
        variance much further, and it removes depth as an implicit regulariser.
    - term: "Early stopping"
      meaning: >-
        Choosing the number of rounds by monitoring validation loss and stopping
        when it has not improved for `early_stopping_rounds`. Because $\nu$ and
        $M$ trade off, the number of rounds is a real hyperparameter and this is
        the only honest way to set it.

  diagrams:
    - type: pipeline
      title: "One boosting round, in the order the arithmetic happens"
      nodes:
        - label: "Compute the gradient"
          note: "g_i = dL/dF at the current prediction"
          detail: >-
            For squared loss this is F − y; for logistic loss it is p − y. This
            is the only place the choice of loss enters the algorithm, which is
            why changing the objective requires no change to the tree code.
        - label: "Grow a tree on (g, h)"
          note: "splits scored by the regularised gain"
          detail: >-
            Every candidate split is scored by
            0.5[G_L^2/(H_L+lam) + G_R^2/(H_R+lam) - G^2/(H+lam)] - gamma. With
            h = 1 and lam = 0 this is exactly half the SSE reduction a regression
            CART maximises.
        - label: "Solve each leaf value"
          note: "w* = -G/(H+lam)"
          detail: >-
            Not a mean — a curvature-weighted mean. As the model becomes
            confident, H falls, so w* grows for the same G. That is the mechanism
            behind both fast convergence and late-training instability.
        - label: "Shrink and add"
          note: "F <- F + nu*tree"
          detail: >-
            nu = 0.1 means each tree contributes a tenth of what it fitted. Bias
            decays as (1-nu)^M; variance grows as nu^2*M. The optimum round count
            scales as 1/nu.
        - label: "Stop on validation loss"
          note: "early_stopping_rounds"
          detail: >-
            Training loss is monotone in M by construction, so it cannot choose
            M. The validation curve has a minimum, and that minimum is the model
            you ship.

    - type: graph
      title: "The same algorithm, two vocabularies"
      nodes:
        - { id: param, label: "Parameter theta" }
        - { id: func, label: "Function F" }
        - { id: grad, label: "Gradient of the loss" }
        - { id: neggrad, label: "Negative gradient -g" }
        - { id: step, label: "Step eta*u" }
        - { id: tree, label: "Tree f_m" }
        - { id: lr, label: "Learning rate eta" }
        - { id: nu, label: "Shrinkage nu" }
      edges:
        - { from: param, to: func, label: "replace the object" }
        - { from: grad, to: neggrad, label: "flip the sign" }
        - { from: neggrad, to: tree, label: "fit a tree to it" }
        - { from: step, to: tree, label: "the step IS the tree" }
        - { from: lr, to: nu, label: "same role, same arithmetic" }
        - { from: func, to: neggrad, label: "evaluate here" }

    - type: plot
