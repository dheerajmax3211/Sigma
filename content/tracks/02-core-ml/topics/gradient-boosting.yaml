    - type: compare
      title: "Depth-wise (XGBoost default) vs leaf-wise (LightGBM default)"
      left_label: "Depth-wise: max_depth = 6, at most 63 leaves"
      left_points:
        - "Every leaf at a level is split, so the tree is balanced and depth bounds the interaction order"
        - 'Number of leaves is at most $2^{d}$; a depth-6 tree on 2,000 rows grows 62'
        - "Depth is a real regulariser: it caps variance per leaf"
        - "Splits that gain almost nothing are taken because a level is being filled"
      right_label: "Leaf-wise: num_leaves = 31, depth unlimited"
      right_points:
        - "Always split the single best leaf, so gain per leaf is much higher"
        - "31 leaves can be 30 levels deep — the same budget buys far lower training loss"
        - "No depth bound, so `min_data_in_leaf=20` is the thing preventing one-row leaves"
        - "Porting a tuned `max_depth` across libraries does not port the model"

    - type: compare
      title: "Choose the base learner by whether the truth is additive"
      left_label: "Additive target — shallow wins"
      left_points:
        - "10,000 stumps at nu = 0.1: test MSE **1.0990**"
        - "1,000 stumps: **1.0229**, the best result in the study"
        - "100 depth-6 trees at nu = 1.0: 1.9166"
        - 'Target: $3x_0 + 2\sin(4x_1) + 1.5x_2^2$'
      right_label: "Interaction target — shallow cannot represent it"
      right_points:
        - "10,000 stumps: **4.9650**, worse than predicting the mean (variance 4.7364)"
        - "100 depth-6 trees at nu = 0.1: 1.4419"
        - "1,000 depth-3 trees: **1.3570**"
        - 'Target: $4x_0x_1 + 3|x_2 - x_3|$'

  markdown: |
    ## The correction is a gradient

    Start with the model you already have, $F_{m-1}$, and ask what the loss says
    about it. The direction that reduces it is the negative derivative
    $g_i = \partial L(y_i, F(x_i))/\partial F$, so the next tree is fitted to
    $-g$, not to $y$:

    $$F_m(x) = F_{m-1}(x) + \nu\, f_m(x), \qquad
      f_m = \arg\min_{f} \sum_i \left(-g_i - f(x_i)\right)^2$$

    For squared loss $g_i = F(x_i) - y_i$, so $-g_i$ is the residual — the "fit
    the residuals" recipe is the special case everyone learns first. For
    logistic loss $g_i = p_i - y_i$, large where the model is confidently wrong
    and near zero where it is right. Nothing else depends on which loss you
    chose.

    This is the same update as *Gradient Descent Variants* with one substitution:
    the parameter vector $\theta$ has become the function $F$. Momentum averages
    past gradients; boosting adds a whole new function each step. So $\nu$ plays
    the role $\eta$ played there, and the same geometric series reappears: a
    repeated correction of size $\nu$ absorbs $1-(1-\nu)^M$ of the error, so
    $\nu = 0.1$ needs 22 rounds to absorb 90% of it.

    ## Why the leaf value is solved rather than chosen

    A tree is piecewise constant, so once the structure is fixed only the leaf
    values are free. Expand the loss to second order around the current
    prediction, for the rows in one leaf:

    $$L \approx \sum_{i \in \text{leaf}} \left[ g_i w + \tfrac{1}{2} h_i w^2
      \right] + \tfrac{1}{2}\lambda w^2$$

    with $h_i$ the second derivative of the loss with respect to the prediction
    and the last term the L2 penalty. Differentiate and set to zero:

    $$\frac{\partial}{\partial w} = G + (H + \lambda) w = 0
      \quad\Longrightarrow\quad w^\star = -\frac{G}{H+\lambda}$$

    This is one Newton step per leaf, and it is why there is no step size beyond
    $\nu$. For squared loss $h_i = 1$ and $w^\star$ is the mean residual. For
    logistic loss $h_i = p_i(1-p_i)$, so rows the model already gets right
    contribute almost nothing — the leaf value is a **curvature-weighted** mean.
    On the 2,000-row classification problem below, the mean hessian at round 1 is
    0.2003, so the effective sample size is 400.5 rows. An implementation that
    assumes $h=1$ therefore takes a step 4.99× too large.

    Substituting $w^\star$ back gives the leaf's optimal objective,
    $-\tfrac{1}{2}G^2/(H+\lambda)$, and the difference between the parent's value
    and the two children's is the split gain:

    $$\text{gain} = \tfrac{1}{2}\left[\frac{G_L^2}{H_L+\lambda} +
      \frac{G_R^2}{H_R+\lambda} - \frac{G^2}{H+\lambda}\right] - \gamma$$

    ## The split criterion did not change — the target did

    Set $h_i = 1$, $\lambda = 0$, $\gamma = 0$. Then

    $$\text{gain} = \tfrac{1}{2}\left[\frac{G_L^2}{n_L} +
      \frac{G_R^2}{n_R} - \frac{G^2}{n}\right]
      = \tfrac{1}{2}\left(\text{SSE}_{\text{parent}} -
      \text{SSE}_{\text{children}}\right)$$

    which is the criterion a regression CART maximises. Verified over 2,000
    random splits: maximum absolute difference $1.26\times10^{-13}$, i.e.
    floating-point zero.

    | quantity | value |
    |---|---|
    | residuals in the node | $[-1, -1, +1, +1]$ |
    | $G$, $H$ | $0$, $4$ |
    | $G_L$, $H_L$ | $-2$, $2$ |
    | $G_R$, $H_R$ | $+2$, $2$ |
    | XGBoost gain | $\tfrac12(4/2 + 4/2 - 0) = 2$ |
    | SSE parent to children | $4 \to 0$ |
    | half the SSE reduction | $2$ |

    So *Decision Trees*' impurity function — Gini as a variance, entropy as a
    likelihood ratio — is still there; what changed is that the thing being made
    pure is the gradient, not the label. With logistic loss the hessian enters
    and the criterion genuinely diverges from Gini: rows are weighted by
    $p(1-p)$, so a node of 100 confident rows counts as roughly 5 rows, while
    Gini would charge it 100.

    ## Shrinkage, and why ten thousand trees is not overfitting

    Two forces move in opposite directions as you add rounds. The bias falls
    geometrically, because each round corrects a fraction $\nu$ of what is left,
    while the variance rises linearly, because each tree injects its own noise
    scaled by $\nu$:

    $$\text{bias}_M \approx (1-\nu)^M \text{bias}_0 \approx e^{-\nu M}
      \text{bias}_0, \qquad \text{variance}_M \approx \nu^2 \sigma^2 M$$

    Minimising the sum over $M$ gives $M^\star \propto 1/\nu$, and the floor
    falls as $\nu$ falls — the whole reason small learning rates with many rounds
    win. Measured at depth 3:

    | $\nu$ | best round | test MSE there | test MSE at 1,000 |
    |---|---|---|---|
    | 1.0 | 10 | 1.3652 | 1.8554 |
    | 0.3 | 25 | 1.1108 | 1.3416 |
    | 0.1 | 100 | **1.0580** | 1.2056 |

    The optimum moved from round 25 to round 100 when $\nu$ fell by 3.3×, and the
    floor fell by 5%.

    Same 2,000 rows, same loss:

    | model | train MSE | test MSE |
    |---|---|---|
    | 10,000 stumps, $\nu = 0.1$ | 0.6652 | **1.0990** |
    | 1,000 stumps, $\nu = 0.1$ | 0.8256 | **1.0229** |
    | 100 depth-6, $\nu = 1.0$ | 0.0002 | 1.9166 |
    | 100 depth-6, $\nu = 0.1$ | 0.2261 | 1.1435 |

    The deep model drives training MSE to 0.0002 against a target variance of
    5.99, and is 42.7% worse on held-out data than a model with three times as
    many parameters. Each of its 62 leaves is a mean of 32 rows fitted at full
    strength, and nothing later can undo it: the gradient at those rows is
    already zero.

    | interaction target | train MSE | test MSE |
    |---|---|---|
    | 10,000 stumps, $\nu = 0.1$ | 3.0815 | 4.9650 |
    | target variance | — | 4.7364 |
    | 100 depth-6, $\nu = 0.1$ | 0.1436 | 1.4419 |
    | 1,000 depth-3, $\nu = 0.1$ | 0.1994 | **1.3570** |

    The stump model is worse than the constant mean. No number of additive
    axis-aligned steps produces $x_0x_1$; the bias never falls, however much
    variance you spend. This is the decision rule: **depth is interaction order,
    and shrinkage is the variance budget you spend on it.**

    ## What LightGBM actually changed

    XGBoost's contribution was the exact second-order objective, at
    $O(n \log n)$ per node. LightGBM made it affordable at $10^6$ rows and
    $10^3$ features, and each of its three ideas trades exactness for work.

    **Histogram binning.** Bucket each feature into 255 bins once, then search
    splits over bins. Candidate thresholds per feature drop from $n-1$ to 254 —
    at $n = 10^6$ a factor of 3,937 — and the histogram is built in one pass per
    node rather than a sort.

    **GOSS.** Keep the top 20% of rows by gradient, sample 10% of the rest, and
    reweight by $(1-0.2)/0.1 = 8$: 30% of the work for a nearly unbiased gain
    estimate.

    **EFB.** Sparse one-hot features are almost never non-zero together, so they
    can be packed into one column with no loss.

    The cost is resolution: a split finer than one bin does not exist, and
    `min_data_in_leaf=20` is doing regularisation that XGBoost's `max_depth=6`
    does. Leaf-wise growth compounds this — with `num_leaves=31` and
    `max_depth=-1`, the tree can be 30 levels deep, so the leaf count is the
    budget and the depth bound is gone.

    ## What to set, in order

    **$\nu$ first, then rounds**: start at 0.05–0.1 and let early stopping pick
    the count. **Depth by interaction order**: stumps at 2,000 rows, depth 6 at
    $10^5$. **`min_child_weight` in cover, not rows**, and `reg_lambda` near 1.

    ## The longer version

    The remaining mechanisms, verbatim: how depth sets interaction order and
    what row count can afford, and the three LightGBM approximations — histogram
    binning, GOSS, EFB — plus leaf-wise growth.

    ### Failure modes, in full

    - Your first XGBoost model beats the neural network it replaced on tabular data, and you cannot say why — so when it loses on the next dataset you have no diagnosis, only a hyperparameter grid.
    - `learning_rate=0.1, n_estimators=10000` is folklore you have copied from a blog post. It is also a specific claim about variance, and on 2,000 rows a depth-6 model at the default `eta=0.3` reaches **1.2597** test MSE while 1,000 stumps at `eta=0.1` reach **1.0229** — a 19% gap that no amount of grid search over `max_depth` recovers if you have the shrinkage wrong.
    - `min_child_weight=1` looks like "at least one row per leaf". In a logistic model it means five rows at the start of training and 138 rows by round 300 — and the parameter silently changes meaning as the model converges.
    - XGBoost and LightGBM produce different trees from identical data and identical hyperparameter names, because one grows depth-wise and the other leaf-wise, and `max_depth=6` and `num_leaves=31` do not describe the same object.
    - You need to explain to a reviewer why a 10,000-tree model is not overfitting when their 100-tree model is, and "gradient boosting is robust" is not an explanation.

    ### The mechanisms, in full

    - **Boosting is gradient descent with functions in place of parameters.** In *Gradient Descent Variants* the update was $\theta \leftarrow \theta - \eta \nabla L(\theta)$. Here the object being updated is the model: $F_m = F_{m-1} + \nu f_m$, where $f_m$ is fitted to the negative gradient $-g_i = -\partial L(y_i, F)/\partial F$ evaluated at $F_{m-1}$. For squared loss $g_i = F_{m-1}(x_i) - y_i$, so the negative gradient *is* the residual — "fit the residuals" is not a heuristic, it is the gradient. On 2,000 rows with a depth-3 base learner and $\nu = 0.1$, train MSE falls from the variance 5.99 to 0.73 in 100 rounds. The catch: because $f_m$ is a tree, the step is piecewise constant. A stump moves the prediction in exactly two values, so each round is a two-parameter descent step, not a full gradient step.
    - **The leaf value is solved, not chosen: $w^\star = -G/(H+\lambda)$.** A gradient-descent step needs a step size; XGBoost does not guess one. It minimises the second-order Taylor expansion of the loss inside each leaf, which has a closed-form minimiser in terms of the summed gradient $G = \sum_i g_i$ and summed hessian $H = \sum_i h_i$. For squared loss $h_i = 1$, so $w^\star$ is the mean residual. For logistic loss $h_i = p_i(1-p_i)$, so $w^\star$ is a **curvature-weighted** mean that discounts rows the model already classifies confidently. Numbers: on 2,000 rows at a 27.7% positive rate the mean hessian at round 1 is 0.2003, so $H = 400.5$ — the effective sample size is a fifth of the row count, and a first-order implementation that assumes $h=1$ takes a step 4.99× too large.
    - **The split gain is the tree criterion from *Decision Trees*, with the target swapped for the gradient.** XGBoost scores a candidate split by $$\text{gain} = \tfrac{1}{2}\left[\frac{G_L^2}{H_L+\lambda} + \frac{G_R^2}{H_R+\lambda} - \frac{G^2}{H+\lambda}\right] - \gamma.$$ With squared loss, $\lambda = 0$ and $\gamma = 0$ this is **exactly** half the reduction in sum of squared error that a regression CART maximises — verified over 2,000 random splits, maximum absolute difference $1.26 \times 10^{-13}$. So the impurity function did not change; the *target* did. Worked example: residuals $[-1,-1,+1,+1]$ split down the middle give $G_L = -2$, $H_L = 2$, $G_R = +2$, $H_R = 2$, so the gain is $\tfrac{1}{2}(2 + 2 - 0) = 2$, and the SSE falls from 4 to 0 — half of 4 is 2. The difference from Gini appears only through $h$: with logistic loss every row is weighted by its own curvature, so confident rows count less, while Gini charges every row equally.
    - **$\lambda$ and $\gamma$ are different prices and you need both.** $\gamma$ is charged **once per split**, in the same units as the gain, which makes it exactly `min_impurity_decrease` from *Decision Trees*: a split whose gain does not exceed $\gamma$ is refused. $\lambda$ is charged **continuously per leaf**, and it enters both the leaf value and the gain. Measured on a leaf with $G = -5$, $H = 3$: $w^\star$ is 1.667 at $\lambda = 0$, 1.25 at $\lambda = 1$, 0.385 at $\lambda = 10$ and 0.049 at $\lambda = 100$. On a leaf with $G = -300$, $H = 1000$ the same $\lambda = 10$ moves 0.300 to 0.297 — a 1% change. That asymmetry is the point: $\lambda$'s bite scales as $1/(H+\lambda)$, so it crushes three-row leaves and leaves thousand-row leaves alone.
    - **`min_child_weight` is a hessian sum, not a row count — the most consistently mis-set parameter in the library.** The constraint is $H_{\text{child}} \ge$ `min_child_weight`, and for squared loss $H = n$, which is why the documentation says "in linear regression this simply corresponds to the minimum number of instances". For anything else it is false. Measured on the 2,000-row logistic problem: cover is 400.5 in round 1 (4.99 rows per unit) and 14.5 by round 300 at $\nu = 1.0$ (138 rows per unit). The same `min_child_weight=1` is therefore 28× more conservative at the end of training than at the start, without anyone editing the config.
    - **Shrinkage $\nu$ is what makes the number of rounds a safe knob rather than a second capacity knob.** Each tree contributes $\nu$ times its fitted values, so the residual bias decays like $(1-\nu)^M \approx e^{-\nu M}$ while the variance injected grows like $\nu^2 M$. The two curves cross at an $M^\star$ that scales as $1/\nu$, and the floor of the U-curve falls with $\nu$. Measured on the additive target at depth 3: $\nu = 1.0$ bottoms at round 10 with test MSE 1.3652 and is still climbing at round 1,000 (1.8554); $\nu = 0.3$ bottoms at round 25 with 1.1108; $\nu = 0.1$ bottoms at round 100 with **1.0580**. A 3.3× smaller learning rate moved the optimum 4× later and lowered the floor — the empirical shape of $M^\star \propto 1/\nu$.
    - **Why 10,000 shallow trees beat 100 deep ones — and exactly when they stop.** Same 2,000 rows, same loss: 10,000 stumps at $\nu = 0.1$ reach test MSE **1.0990**; 100 depth-6 trees at $\nu = 1.0$ reach **1.9166**, 42.7% worse, despite the stumps carrying 20,000 leaf parameters against the deep model's 6,200. The mechanism is variance, not capacity: one depth-6 tree on this data has 62 leaves fitted to about 32 rows each, and at $\nu = 1$ all 62 noisy means are committed at full strength and never revisited. A stump commits two values at 10% strength; a wrong split is partly undone by later stumps, and the variance injected per round is $\nu^2\sigma^2$, not $\sigma^2$. Then the failure mode: on the interaction target ($4x_0x_1 + 3|x_2-x_3|$) the same 10,000 stumps reach **4.9650** against a target variance of 4.7364 — worse than the constant mean — because no sum of axis-aligned constants can represent a product. Depth 6 reaches 1.4419. "Shallow and many" is a bet that the truth is additive, and the bet is free only when it is true.
    - **Depth is interaction order, and the row count decides how much of it you can afford.** A tree of depth $d$ can express $d$-way interactions; a stump expresses none. That is why stumps dominate on the additive target (1.0229 at 1,000 rounds, the best number in the whole study) and lose to the mean on the interaction target. It is also why depth 3 beat depth 6 at the same learning rate once $n$ fell to 2,000: on the interaction target depth 3 reached 1.3570 and depth 6 reached 1.4419. XGBoost's default `max_depth=6` is a compromise tuned for datasets of $10^4$ to $10^6$ rows. It is not a law, and on 2,000 rows it is too deep.
    - **LightGBM buys its speed with three approximations, and each one changes what you should tune.** (1) *Histogram binning*: features are bucketed into `max_bin=255` bins, so a split search costs $O(255 \cdot d)$ per node instead of sorting $n$ values — for $n = 10^6$ and $d = 100$ the candidate thresholds per feature fall from 999,999 to 254, a factor of **3,937** — at the cost of being blind to any boundary finer than one bin. (2) *GOSS*: keep the top $a = 0.2$ of rows by $|g_i|$, sample $b = 0.1$ of the rest, and multiply the sampled part by $(1-a)/b = 8$; that is 30% of the rows for a nearly unbiased gain estimate. (3) *EFB*: bundle mutually exclusive sparse features into one column. The consequence is that `max_bin` and `min_data_in_leaf` (default 20) matter more than `max_depth` (default −1, i.e. unlimited).
    - **Leaf-wise growth makes `num_leaves`, not `max_depth`, the capacity knob.** Depth-wise growth splits every node at a level, so 31 leaves means depth 5 ($2^5 = 32$). Leaf-wise growth always splits the single leaf with the largest gain, so 31 leaves can be 30 levels deep — same leaf budget, much lower training loss, much higher variance per leaf, and no depth bound to stop it. Measured, a depth-6 tree on 2,000 rows has **62 leaves**; LightGBM's default 31 leaves is roughly half that capacity but can reach a depth XGBoost would never allow. This is why `min_data_in_leaf=20` is doing the job that `max_depth` does in XGBoost, and why porting a tuned XGBoost config to LightGBM by copying `max_depth` produces a different model.


  derivations:
    - title: "From the second-order expansion to the leaf value and the split gain"
      latex: |
        Fix a leaf containing a set $I$ of rows, and let the leaf's constant
        output be $w$. Around the current prediction $F_{m-1}(x_i)$ the loss is

        $$L \approx \sum_{i \in I}\left[L(y_i, F_{m-1}) + g_i w +
          \tfrac{1}{2}h_i w^2\right] + \tfrac{1}{2}\lambda w^2$$

        with $g_i = \partial_{F}L(y_i,F)$ and $h_i = \partial^2_{F}L(y_i,F)$
        evaluated at $F_{m-1}$. Dropping the constant and writing
        $G = \sum_{i \in I} g_i$, $H = \sum_{i \in I} h_i$:

        $$\hat{L}(w) = G w + \tfrac{1}{2}(H+\lambda)w^2$$

        Setting $\mathrm{d}\hat{L}/\mathrm{d}w = 0$ gives the optimal leaf value

        $$w^\star = -\frac{G}{H+\lambda}, \qquad
          \hat{L}(w^\star) = -\frac{1}{2}\frac{G^2}{H+\lambda}$$

        A split partitions $I$ into $I_L$ and $I_R$. The gain is the parent's
        optimal objective minus the children's, minus a price $\gamma$ per split:

        $$\text{gain} = \tfrac{1}{2}\left[\frac{G_L^2}{H_L+\lambda} +
          \frac{G_R^2}{H_R+\lambda} - \frac{G^2}{H+\lambda}\right] - \gamma$$

        and the split is accepted only if this is positive.
      prose: >-
        Every quantity in XGBoost's split search comes out of one Taylor
        expansion. The leaf value is where the quadratic bottoms out; the gain is
        how much lower the bottom is after splitting. $\lambda$ appears in both
        because it is part of the same quadratic, which is exactly why it
        shrinks small leaves (where $H$ is comparable to $\lambda$) and ignores
        large ones.
    - title: "With squared loss the gain is exactly half of CART's SSE reduction"
      latex: |
        For squared loss $L = \tfrac{1}{2}(y - F)^2$, so

        $$g_i = F - y_i = -r_i, \qquad h_i = 1$$

        where $r_i = y_i - F$ is the residual. Then $G = -\sum r_i$ and $H = n$,
        and the gain becomes

        $$\text{gain} = \tfrac{1}{2}\left[\frac{(\sum_{L} r)^2}{n_L} +
          \frac{(\sum_{R} r)^2}{n_R} - \frac{(\sum r)^2}{n}\right]$$

        Now compute the SSE of the residuals in the parent and in the children:

        $$\text{SSE}_{\text{parent}} = \sum_i r_i^2 - \frac{(\sum_i r_i)^2}{n},
          \qquad
          \text{SSE}_{\text{children}} = \sum_i r_i^2 -
          \frac{(\sum_L r)^2}{n_L} - \frac{(\sum_R r)^2}{n_R}$$

        Subtracting,

        $$\text{SSE}_{\text{parent}} - \text{SSE}_{\text{children}}
          = \frac{(\sum_L r)^2}{n_L} + \frac{(\sum_R r)^2}{n_R}
            - \frac{(\sum r)^2}{n}
          = 2\,\text{gain}$$

        so the gain is half the SSE reduction. The factor of 2 is inherited from
        the $\tfrac12$ in the loss, and it cancels in every argmax.
      prose: >-
        This is the formal statement that gradient boosting did not invent a new
        split criterion. It is the regression-tree variance reduction from
        Decision Trees, evaluated on residuals instead of labels, with a factor
        of two that never changes a ranking. The moment $h_i$ stops being 1 —
        logistic loss, Poisson, ranking — the criterion genuinely changes,
        because rows acquire different weights.
    - title: "Why the optimal number of rounds scales as 1/nu"
      latex: |
        Model the ensemble's error in one direction as a bias that each round
        removes a fraction $\nu$ of, plus noise injected by each tree:

        $$\text{MSE}(M) \approx c^2(1-\nu)^{2M} + \nu^2\sigma^2 M$$

        The first term is squared bias, decaying geometrically; the second is
        accumulated variance, growing linearly because the trees' errors are
        treated as independent. Differentiate with respect to $M$ and set to
        zero:

        $$\frac{\mathrm{d}}{\mathrm{d}M} = -2\ln\!\frac{1}{1-\nu}\,
          c^2(1-\nu)^{2M} + \nu^2\sigma^2 = 0$$

        $$\Longrightarrow\quad (1-\nu)^{2M^\star}
          = \frac{\nu^2\sigma^2}{2c^2\ln\frac{1}{1-\nu}}$$

        Taking logs, and using $\ln\frac{1}{1-\nu} \approx \nu$ for small $\nu$:

        $$M^\star = \frac{1}{2\ln\frac{1}{1-\nu}}
          \ln\frac{2c^2\ln\frac{1}{1-\nu}}{\nu^2\sigma^2}
          \;\approx\; \frac{1}{2\nu}\ln\frac{2c^2}{\nu\sigma^2}$$

        so $M^\star$ scales as $1/\nu$ up to a logarithm. Substituting $M^\star$
        back, the variance term at the optimum is
        $\nu^2\sigma^2 M^\star \approx \tfrac12 \nu\sigma^2 \ln(\cdot)$, so the
        floor of the U-curve is **linear in $\nu$**.
      prose: >-
        Two predictions, both testable. The best round count should scale
        inversely with the learning rate — measured, 25 rounds at nu = 0.3 and
        100 at nu = 0.1, a factor of 4 for a factor of 3.3. And the best
        achievable error should fall as nu falls — measured, 1.1108 at nu = 0.3
        against 1.0580 at nu = 0.1. At nu = 1 the bias term vanishes after one
        round ((1-1)^M = 0) and only the variance term survives, which is why
        that curve turns immediately and never comes back.

  implementations:
    - language: python
      title: "XGBoost's objective from scratch: hessians, lambda, gamma, and shrinkage"
      note: >-
        Numerically wrong in three places, all of them deliberate simplifications
        of the real library. (1) Splits are found by exact sorting of every
        feature at every node, so this will not reproduce LightGBM's histogram
        model — on 1e6 rows LightGBM considers 254 thresholds per feature and
        this considers every distinct value. (2) Missing values are not handled:
        `X[:, f] <= thr` sends `NaN` to the right child always, whereas XGBoost
        learns a default direction per split from the data. (3) The gain is
        compared with a strict `>` and no epsilon, so two splits whose gains
        differ by 1e-17 are decided by float noise, and permuting the columns can
        change the tree.
      code: |
        import numpy as np

        class Node:
            __slots__ = ("feat", "thr", "left", "right", "value")
            def __init__(self, value=0.0):
                self.feat = self.thr = None
                self.left = self.right = None
                self.value = value

        def best_split(X, g, h, lam, min_h):
            """Exhaustive sweep. Returns (feature, threshold), best_gain."""
            n, d = X.shape
            G, H = g.sum(), h.sum()
            base = G * G / (H + lam)
            best_gain, best = -np.inf, None
            for f in range(d):
                order = np.argsort(X[:, f], kind="mergesort")
                xs = X[order, f]
                # Prefix sums give both children's statistics in O(1) per
                # candidate: the right child is the total minus the left.
                GL = np.cumsum(g[order])[:-1]
                HL = np.cumsum(h[order])[:-1]
                GR, HR = G - GL, H - HL
                # A threshold only exists between two distinct values, and a
                # child below min_child_weight (a HESSIAN sum) is refused.
                valid = (xs[:-1] < xs[1:]) & (HL >= min_h) & (HR >= min_h)
                if not valid.any():
                    continue
                gains = 0.5 * (GL**2 / (HL + lam) + GR**2 / (HR + lam) - base)
                gains = np.where(valid, gains, -np.inf)
                j = int(np.argmax(gains))
                if gains[j] > best_gain:
                    best_gain = float(gains[j])
                    best = (f, 0.5 * (xs[j] + xs[j + 1]))
            return best, best_gain

        def grow(X, g, h, lam=1.0, gamma=0.0, max_depth=6, min_h=1e-6, depth=0):
            G, H = g.sum(), h.sum()
            denom = H + lam
            node = Node(value=float(-G / denom) if denom > 0 else 0.0)
            if depth >= max_depth or len(g) < 2:
                return node
            split, gain = best_split(X, g, h, lam, min_h)
            if split is None or gain <= gamma:      # gamma: the price of a split
                return node
            f, thr = split
            m = X[:, f] <= thr
            if m.all() or (~m).all():
                return node
            node.feat, node.thr = f, thr
            node.left = grow(X[m], g[m], h[m], lam, gamma, max_depth, min_h, depth + 1)
            node.right = grow(X[~m], g[~m], h[~m], lam, gamma, max_depth, min_h, depth + 1)
            return node

        def predict_tree(node, X):
            out = np.empty(len(X))
            stack = [(node, np.arange(len(X)))]
            while stack:
                nd, ix = stack.pop()
                if nd.feat is None:
                    out[ix] = nd.value
                    continue
                m = X[ix, nd.feat] <= nd.thr
                if m.any():
                    stack.append((nd.left, ix[m]))
                if (~m).any():
                    stack.append((nd.right, ix[~m]))
            return out

        def fit_gbdt(X, y, loss="squared", rounds=100, lr=0.1, lam=1.0,
                     gamma=0.0, max_depth=3, early_stop=None, X_val=None, y_val=None):
            """Functional gradient descent. Returns (F_train, F_val, best_round)."""
            if loss == "squared":
                F = np.full(len(y), float(np.mean(y)))
                def grad_hess(F, y):
                    return F - y, np.ones_like(F)          # h = 1 everywhere
                def metric(F, y):
                    return float(np.mean((y - F) ** 2))
            else:
                p0 = float(np.clip(np.mean(y), 1e-6, 1 - 1e-6))
                F = np.full(len(y), np.log(p0 / (1 - p0)))  # base score: log-odds
                def sig(z):
                    return 1.0 / (1.0 + np.exp(-z))
                def grad_hess(F, y):
                    p = sig(F)
                    return p - y, p * (1 - p)              # h = p(1-p): curvature
                def metric(F, y):
                    p = np.clip(sig(F), 1e-12, 1 - 1e-12)
                    return float(-np.mean(y * np.log(p) + (1 - y) * np.log(1 - p)))

            Fv = np.full(len(y_val), F[0]) if X_val is not None else None
            best, best_round, stale = np.inf, 0, 0
            for m in range(rounds):
                g, h = grad_hess(F, y)
                tree = grow(X, g, h, lam, gamma, max_depth)
                F = F + lr * predict_tree(tree, X)         # shrink, then add
                if X_val is not None:
                    Fv = Fv + lr * predict_tree(tree, X_val)
                    score = metric(Fv, y_val)
                    if score < best - 1e-12:
                        best, best_round, stale = score, m + 1, 0
                    else:
                        stale += 1
                        if early_stop and stale >= early_stop:
                            break
            return F, Fv, best_round

        # Measured, 2,000 rows / 8 features / additive target, depth 3, lam=1:
        #   nu=1.0: best test MSE 1.3652 at round 10, 1.8554 at round 1000
        #   nu=0.3: best test MSE 1.1108 at round 25
        #   nu=0.1: best test MSE 1.0580 at round 100
        # Classification, 2,000 rows at 27.7% positive, depth 3:
        #   nu=0.1: test logloss 0.4915 at round 100
        #   nu=1.0: test logloss 1.0667 at round 300 (train accuracy 1.0000)

    - language: python
      title: "Residual boosting: the version that is only right for squared loss"
      note: >-
        Numerically wrong for any loss other than squared error, and this is the
        most common from-scratch mistake. It hard-codes $h_i = 1$, so the leaf
        value is the *mean gradient* rather than the Newton step
        $-G/(H+\lambda)$. On the 2,000-row logistic problem the mean hessian at
        round 1 is 0.2003, so every step is 4.99× too large relative to the
        second-order solution — and the error is not a constant: as the model
        becomes confident the true $H$ falls from 400.5 to 14.5, so the same code
        keeps taking steps sized as if curvature were still 1. Measured
        consequence: at $\nu = 1.0$ this version reaches test logloss 0.5353 at
        round 300, where the Newton version has already blown up to 1.0667; at
        $\nu = 0.1$ it reaches 0.4984, where the Newton version peaks at 0.4915
        at round 100. Neither is uniformly better — which is the point: they are
        different estimators, and the first-order one has no curvature term to
        stabilise it.
      code: |
        import numpy as np

        def best_stump(X, r):
            """Split minimising the SSE of r -- i.e. assuming h = 1 for every row."""
            n, d = X.shape
            G = float(r.sum())
            best_gain, best = -np.inf, None
            for f in range(d):
                order = np.argsort(X[:, f], kind="mergesort")
                xs = X[order, f]
                GL = np.cumsum(r[order])[:-1]
                GR = G - GL
                nL = np.arange(1, n, dtype=float)
                nR = n - nL
                gains = np.where(xs[:-1] < xs[1:],
                                 GL**2 / nL + GR**2 / nR - G * G / n, -np.inf)
                j = int(np.argmax(gains))
                if gains[j] > best_gain:
                    best_gain = float(gains[j])
                    best = (f, 0.5 * (xs[j] + xs[j + 1]))
            return best, best_gain

        def boost_residuals(X, y, rounds=100, lr=0.1):
            """Gradient descent on squared loss only. Leaf value = mean residual.

            For logistic loss this is WRONG: the correct leaf is -G/(H+lam) with
            h = p(1-p), which is 5x larger at p = 0.5 and grows without bound as
            the model saturates. Here h is silently 1.
            """
            X = np.asarray(X, float)
            y = np.asarray(y, float)
            F = np.full(len(y), float(y.mean()))
            for _ in range(rounds):
                r = y - F                      # -g, only because loss is squared
                (f, thr), gain = best_stump(X, r)
                if not np.isfinite(gain) or gain <= 0.0:
                    break
                left = X[:, f] <= thr
                w = np.where(left, r[left].mean(), r[~left].mean())
                F = F + lr * w
            return F

        # On the classification set this function produces numbers that look
        # plausible and are not the XGBoost leaf: measured test logloss 0.5353
        # at round 300 with lr=1.0, against 0.4915 for the Newton version at
        # its best round.

  checkpoints:
    - id: cp-1
      question: >-
        A colleague implements boosting for logistic regression by fitting each
        tree to the residuals $y_i - p_i$ and setting each leaf to their mean.
        What exactly is wrong, and by what factor?
      answerKind: short_text
      hint: >-
        What is the second derivative of the logistic loss with respect to the
        prediction, and what does the leaf formula become if you assume it is 1?
      solution: >-
        The gradient is right — $y_i - p_i$ is $-g_i$ — but the leaf value is
        wrong. The second-order optimum is $w^\star = -G/(H+\lambda)$ with
        $h_i = p_i(1-p_i)$, and the code uses $H = n$ instead. The ratio is
        $n/\sum h_i = 1/\bar{h}$, which at a 27.7% positive rate is
        $1/0.2003 = 4.99$ — the step is five times too large. Worse, the error is
        not constant: $\bar h$ falls from 0.2003 to 0.0072 as the model saturates,
        so the same code takes steps that are 138× too large by round 300. That
        is exactly the regime where the measured Newton run diverges to test
        logloss 1.0667 at $\nu = 1$.
    - id: cp-2
      question: >-
        You set `min_child_weight=1` on a binary classifier with 2,000 rows.
        Roughly how many rows per leaf does that permit at the start of training,
        and at the end?
      answerKind: short_text
      hint: >-
        The constraint is on the hessian sum, and for logistic loss the hessian
        of a row is $p(1-p)$, which is at most 0.25.
      solution: >-
        It is not one row. At round 1 the mean hessian is 0.2003, so one unit of
        cover is 4.99 rows. By round 300 at $\nu = 1.0$ the mean hessian has
        fallen to 0.0072 and one unit of cover is 138 rows. The same setting is
        28× more conservative at the end of training than at the beginning,
        because cover measures curvature, not count. Set it in the units you
        mean: multiply the rows you want per leaf by the mean hessian, and
        re-check it after you change the learning rate.
