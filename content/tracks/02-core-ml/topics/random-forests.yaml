id: random-forests
slug: random-forests
title: "A Random Forest's Real Trick Is Disagreement, Not More Trees"
summary: >-
  Average bootstrapped trees to remove the variance you can measure, decorrelate
  them with feature subsampling to lower the floor that averaging cannot cross,
  and read the out-of-bag error as the noisy small-sample estimate it is.
kind: lesson
difficulty: medium
position: 6
estMinutes: 24
prerequisites: [decision-trees, randomness-and-reproducibility]
phase: supervised-learning
tags: [random-forests, bagging, ensembles, variance, oob, feature-importance]

body:
  big_idea: >-
    Averaging $B$ trees divides only the variance they do not share, so the error floors
    at $\rho\sigma^2$ — which means decorrelating the trees lowers it and adding more
    trees never will.

  problem:
    - "Your tree's test error moves two points with the seed, so you average 500 trees; it stops moving near 100, and you cannot say why."
    - "You quote out-of-bag error as held-out. It came from rows 37 trees judged without seeing, and it moves 2.8 points between seeds."
    - "`feature_importances_` ranks a random ID column above three real features: on pure noise a 200-level column gets 34.6% of the total importance."

  analogy: |
    Put twenty clinicians on one case. Give each a different 63% of the chart
    and let each see only a random third of the results before each call. Each
    is individually worse than one clinician with the whole file, but their
    mistakes differ, so a majority vote beats any of them. What the vote cannot
    fix is the error they all make — that shared blind spot is $\rho$.

  concept_points:
    - "**Bagging is bootstrap plus average, and the average is over predictions, not models.** Draw B bootstrap samples, fit one unpruned tree on each, and average their outputs — same split criterion, same stopping rule. On 300 rows with 6 features and 100 trees the variance across independent datasets fell from 0.6204 to 0.0912, an 85.3% reduction. Bagging is a variance-reduction operator, not a new model."
    - "**The variance of the average is $\\rho\\sigma^2 + (1-\\rho)\\sigma^2/B$, and the first term is a wall.** For B trees of variance $\\sigma^2$ with average pairwise error correlation $\\rho$, the shared part never averages away. Measured: $\\sigma^2 = 0.6204$, $\\rho = 0.1385$, so the floor is 0.0859 and the 100-tree ensemble sits at 0.0912 — 6.1% above a floor no additional tree will cross."
    - "**Bias has no $1/B$ in it, which is why the distinction matters.** Averaging divides only the terms that differ between trees; a bias every tree shares survives untouched. Measured: variance fell 0.6204 to 0.0912 while raw bias² went 0.1087 to 0.0863 — and that is Monte-Carlo noise, since $\\mathrm{Var}/R = 0.6204/40 = 0.0155$. Corrected, bias is 0.093 against 0.084: flat."
    - "**A random forest is bagging plus feature subsampling, and that only helps by lowering $\\rho$.** At every split, consider only a random subset of `mtry` features. On 30 features that are noisy copies of 3 latent signals: mtry=30 gave $\\sigma^2 = 1.8810$, $\\rho = 0.0599$, floor 0.1127; mtry=10 gave $\\sigma^2 = 1.9146$ (+1.8%), $\\rho = 0.0356$ (−40.7%), floor 0.0681, MSE −2.7%."
    - "**A random forest is bagging plus feature subsampling, and that only helps by lowering $\\rho$.** At every split, consider only a random subset of `mtry` features. On 30 features that are noisy copies of 3 signals: mtry=30 gave $\\sigma^2 = 1.8810$, $\\rho = 0.0599$, floor 0.1127; mtry=10 gave $\\sigma^2 = 1.9146$ (+1.8%), $\\rho = 0.0356$ (−40.7%), floor 0.0681, MSE −2.7%."
    - "**The out-of-bag error is free, nearly unbiased at large B, and noisy at every B.** Each row is out of bag for about $B/e = 36.8$ of 100 trees. But each voting tree saw 63% of the data, so it describes a smaller forest: paired on 12 seeds, OOB 0.4465 against test 0.4091 at B=10, and 0.3856 against 0.3810 at B=100."

  definitions:
    - term: "Bagging"
      meaning: >-
        Bootstrap aggregating: fit the same learner to B bootstrap resamples of
        the training set and average the predictions. Reduces variance only,
        and only the part of it that differs between resamples.
    - term: "Bootstrap sample"
      meaning: >-
        A sample of size n drawn from the n training rows with replacement.
        Contains about 63.2% of the distinct rows and duplicates the rest, which
        is what makes each tree slightly worse than one trained on everything.
    - term: "Out-of-bag (OOB)"
      meaning: >-
        For a given tree, the rows its bootstrap draw never picked — about 36.8%
        of the training set. Each row is out of bag for roughly $B/e$ trees, and
        those trees form its personal held-out ensemble.
    - term: "Rho (tree correlation)"
      meaning: >-
        The average pairwise correlation between two trees' errors. Equivalently
        the share of a single tree's variance that comes from the training
        sample rather than from the bootstrap draw — the share bagging cannot
        remove.
    - term: "Variance floor"
      meaning: >-
        $\rho\sigma^2$: the limit of the ensemble variance as $B \to \infty$.
        Not a small correction. At $\rho = 0.8$ it is 80% of a single tree's
        variance, so no number of trees gets you below four-fifths of where you
        started.
    - term: "mtry / max_features"
      meaning: >-
        How many features each split is allowed to consider. The only knob that
        changes $\rho$ directly. Defaults of $\sqrt{d}$ for classification and
        $d/3$ for regression are starting points, not laws — on 6 unique
        features they cost 54% of the MSE.
    - term: "Random forest"
      meaning: >-
        Bagging of deep trees plus per-split feature subsampling. The
        subsampling exists solely to decorrelate the trees; it does nothing for
        the bias and nothing for a single tree's accuracy.
    - term: "OOB error"
      meaning: >-
        The error of the OOB vote, one per training row. Free, nearly unbiased
        at large B, pessimistic at small B, and — being a training-set-sized
        estimate — carrying the binomial error of that size.
    - term: "MDI (mean decrease in impurity)"
      meaning: >-
        What `feature_importances_` returns: impurity reduction summed over the
        splits that used a feature, weighted by the rows reaching them, measured
        on training data. Biased toward high-cardinality features, including
        pure noise ones.
    - term: "Permutation importance"
      meaning: >-
        The drop in held-out score when one column's values are shuffled.
        Measured on data the model did not fit, so it can be zero — which is the
        property MDI lacks.
    - term: "Extremely randomised trees"
      meaning: >-
        Extra-trees: randomise the threshold as well as the feature at each
        split. Lower $\rho$ and lower variance, higher bias, and much faster,
        because no threshold sweep is needed. The same trade as mtry, pushed
        further.

