        - { from: mtry, to: rho, label: "less agreement" }
        - { from: mtry, to: sig, label: "weaker splits" }
        - { from: mtry, to: bias, label: "coarser fit" }
        - { from: rho, to: floor, label: "multiplies" }
        - { from: sig, to: floor, label: "multiplies" }
        - { from: floor, to: mse, label: "irreducible part" }
        - { from: bias, to: mse, label: "not divided by B" }
        - { from: b, to: mse, label: "only the (1-rho) part" }

  markdown: |
    ## The experiment that makes the floor visible

    Take 300 rows, 6 features, a regression target with known truth
    $f(x) = 3x_1 + 2\sin(2\pi x_2) + 1.5x_3x_4$ and Gaussian noise with
    $\sigma^2 = 0.25$. Draw 40 independent datasets, fit 100 bootstrap trees on
    each, and measure how much the ensemble's prediction moves between datasets.

    | B | measured variance | $\rho\sigma^2 + (1-\rho)\sigma^2/B$ |
    |---|---|---|
    | 1 | 0.6204 | 0.6204 |
    | 5 | 0.1911 | 0.1928 |
    | 10 | 0.1376 | 0.1394 |
    | 25 | 0.1058 | 0.1073 |
    | 50 | 0.0963 | 0.0966 |
    | 100 | 0.0912 | 0.0913 |

    Two numbers were fitted: $\sigma^2 = 0.6204$ and $\rho = 0.1385$. Everything
    else in the right-hand column is a prediction, and it lands within 1.3% at
    every B. That is the covariance identity in *Derivation 1*, and it sets the
    shape of every ensemble learning curve you will plot.

    The floor is $\rho\sigma^2 = 0.0859$. At B=100 you are at 0.0912, 6.1% above
    it. The remaining 400 trees of a 500-tree forest buy that 6.1% and no more.

    ## Where the floor comes from

    It is tempting to read $\rho$ as "how similar the trees are", as if it were
    a property of the algorithm. It is not. It is the share of a single tree's
    variance that comes from **the training sample** rather than from the
    bootstrap draw:

    $$\operatorname{Var}(f) = \underbrace{\mathbb{E}_D\big[\operatorname{Var}_{\text{boot}}(f \mid D)\big]}_{\text{averages away}}
                          + \underbrace{\operatorname{Var}_D\big(\mathbb{E}_{\text{boot}}[f \mid D]\big)}_{\text{does not}}$$

    Two bootstrap draws from the same dataset are independent given that
    dataset, so conditional on $D$ averaging B trees divides the variance by B
    exactly. What survives is the variation of the *bagged mean* across datasets
    — the part a bigger forest cannot touch, because every tree in it saw the
    same rows.

    This is the practical reframing: **bagging reduces the variance due to the
    randomness you injected; it cannot reduce the variance due to the data you
    happened to collect.** That is what $\rho\sigma^2$ measures, and the only way
    to shrink it is to make the trees less alike.

    ## Where the forest actually wins

    Feature subsampling answers "less alike", and its economics are narrow.
    Five measured configurations, 40 datasets each, 100 trees:

    | setting | $\sigma^2$ | $\rho$ | floor | Var at B=100 | bias² | MSE |
    |---|---|---|---|---|---|---|
    | bagging, 6 features | 0.6204 | 0.1385 | 0.0859 | 0.0912 | 0.0863 | **0.1752** |
    | mtry=2, 6 features | 1.2367 | 0.0423 | 0.0523 | 0.0637 | 0.2075 | 0.2696 |
    | bagging, 30 redundant | 1.8810 | 0.0599 | 0.1127 | 0.1303 | 0.9966 | 1.1236 |
    | mtry=10, 30 redundant | 1.9146 | 0.0356 | 0.0681 | 0.0866 | 1.0091 | **1.0936** |
    | mtry=3, 30 redundant | 2.0749 | 0.0170 | 0.0353 | 0.0558 | 1.0732 | 1.1276 |

    Read the middle rows. On redundant features, dropping from 30
    candidates to 10 cut $\rho$ by 40.7% and the floor by 39.6% while
    $\sigma^2$ rose by **1.8%** — because the features were copies of each
    other, so a tree that could only see a third of them was barely worse. That
    is the case mtry was invented for, and it is worth 2.7% of MSE.

    Read the top two rows. On six features each carrying something unique,
    dropping to 2 candidates did cut $\rho$ by 69% — but $\sigma^2$ doubled and
    bias² went up 140%. The floor fell and the model got 54% worse. The second
    diagram shows the same trap pushed further: mtry=3 on the redundant problem
    has the lowest floor of all and a worse MSE than mtry=10, because bias² is
    climbing faster than the floor falls.

    The bottom rows carry one more lesson: at mtry=10 the B=100 ensemble is 27.2%
    above its floor, at mtry=30 only 15.6%. Lower $\rho$ means you need **more**
    trees to reach the floor — $\rho$ is a smaller denominator in
    $(1-\rho)/(B\rho)$.

    ## Out of bag, and what it is worth

    Each bootstrap draw misses 36.8% of rows, so every row has a personal
    held-out set: the trees that never saw it. Average those and you have a free
    error estimate — of a forest whose voters each trained on 63% of the data.

    Paired measurements — same forests, different scored rows — on 12 seeds of
    300 rows:

    | B | test error | OOB error | gap |
    |---|---|---|---|
    | 1 | 0.4467 | 0.4594 | +0.0127 |
    | 10 | 0.4091 | 0.4465 | **+0.0373** |
    | 50 | 0.3864 | 0.4028 | +0.0164 |
    | 100 | 0.3810 | 0.3856 | +0.0045 |
    | 200 | 0.3789 | 0.3881 | +0.0091 |

    At B=100 the bias is 0.45 points. At B=10 it is 3.7 — the difference between
    a working model and a broken one.
    And at every B the per-seed standard deviation of that gap is about 0.028 —
    the binomial error of a 300-row estimate, $\sqrt{0.38 \cdot 0.62/300} =
    0.0280$. OOB does not escape the arithmetic of sample size, it just stops
    you from spending a fold to discover it.

    ## Why the trees are the cheap part

    Error against B, 10 seeds, 300 rows, 4,000 test rows:

    | B | 1 | 5 | 10 | 25 | 50 | 100 | 200 |
    |---|---|---|---|---|---|---|---|
    | bagging | 0.4411 | 0.4107 | 0.3998 | 0.3902 | 0.3874 | 0.3846 | 0.3834 |
    | forest, mtry=2 | 0.4457 | 0.4199 | 0.4059 | 0.3965 | 0.3861 | 0.3819 | 0.3788 |
    | single tree, all rows | 0.4407 | | | | | | |

    Note the first column. A single tree with mtry=2 is *worse* than a single
    tree on all the data (0.4457 against 0.4407), and one trained on a bootstrap
    sample is no better (0.4411). The ensemble does not start from a better
    place; it averages from the same one.

    From 50 trees to 200, a 4x increase in compute, buys 0.4 points; the first 50
    buy 5.4. That is the $1/B$ term doing what the formula says, and it is why
    `n_estimators` is the first hyperparameter people tune and the last one that
    matters.

    ## What to actually do

    1. **Measure $\rho$ before tuning anything.** Fit 100 trees, compute the
       ensemble variance at B = 5, 10, 25, 50, 100, and recover
       $\rho = (\mathrm{Var}_B - \sigma^2/B)/(\sigma^2(1-1/B))$. If $\rho\sigma^2$
       is within a few percent of your ensemble's variance you are at the floor,
       and more trees are waste; if it is not, more trees are the cheapest thing
       you can do.
    2. **Only reach for mtry when the features are redundant.** Fit one forest
       with mtry = d and one with a smaller value, and compare MSE, not $\rho$.
       Lower $\rho$ with a higher floor is a net loss, and the table above has
       three rows of it.
    3. **Never grow one seed's forest and quote its OOB error as a result.**
       Report the mean and standard deviation over at least five root seeds — the
       discipline *Randomness, Reproducibility, and Seeding* demands of any
       single-run metric.
    4. **Use permutation importance.** MDI cannot tell a 200-level noise column
       from a real feature; on pure noise it gave one 34.6%.

    ## The longer version

    The remaining mechanisms, verbatim: how to measure $\rho$ on your own
    forest, the algebra of how many trees is enough, the 36.8% the bootstrap
    throws away, and why `feature_importances_` is cardinality-biased.

    ### Failure modes, in full

    - Your tree's test error moves two points when you change the seed, so you average 500 trees, and the number stops moving somewhere around 100. You cannot say whether the last 400 were wasted or whether 100 was a lucky stopping point.
    - You quote the out-of-bag error as if it were a held-out number. It came from rows that 37 trees each judged without ever having seen, and it moves 2.8 points between seeds — more than most of the effects you are trying to measure.
    - You have `max_features=sqrt(d)` memorised as "the default". On a 6-feature problem the same idea cost 54% more MSE than plain bagging; on 30 redundant features it bought 2.7%. The rule is not wrong, it is conditional, and nobody told you on what.
    - `feature_importances_` ranks a random ID column above three real features. On pure noise it hands a 200-level column 34.6% of the total importance, because the statistic is computed on the data the trees grew on.
    - An interviewer asks why bagging cannot fix a biased learner, and the answer they want is the covariance identity — not "it reduces overfitting".

    ### The mechanisms, in full

    - **Bagging is bootstrap plus average, and the average is over predictions, not models.** Draw B bootstrap samples of the training rows, fit one unpruned tree on each, and average their outputs (or vote). Nothing else changes — same split criterion, same stopping rule, same features. On 300 rows with 6 features and 100 trees, the variance of the prediction across independent datasets fell from 0.6204 to 0.0912, an 85.3% reduction, and squared error against the true function fell from 0.7137 to 0.1752. That is the entire mechanism: bagging is not a new model, it is a variance-reduction operator applied to one.
    - **The variance of the average is $\rho\sigma^2 + (1-\rho)\sigma^2/B$, and the first term is a wall.** For B trees of variance $\sigma^2$ with average pairwise error correlation $\rho$, the shared part never averages away. Measured on that 300-row problem: $\sigma^2 = 0.6204$, $\rho = 0.1385$, so the floor is 0.0859 and the 100-tree ensemble sits at 0.0912 — 6.1% above a floor no additional tree will cross. Adding trees buys the $(1-\rho)\sigma^2/B$ term and nothing else.
    - **Rho is measurable, and measuring it is the whole design problem.** Fit T trees, measure the ensemble variance at several B, and solve $\rho = (\mathrm{Var}_B - \sigma^2/B)/(\sigma^2(1 - 1/B))$. Estimating it once at B=100 and then predicting the curve at other B reproduced the measured values to within 1.3%: 0.1928 against 0.1911 at B=5, 0.1394 against 0.1376 at B=10, 0.1073 against 0.1058 at B=25, 0.0966 against 0.0963 at B=50. Rho is not a metaphor for "the trees are similar"; it is a number you can read off your own forest, and it multiplies $\sigma^2$ to set the error you cannot train away.
    - **Bias has no $1/B$ in it, which is the whole reason the distinction matters.** Averaging divides only the terms that differ between trees; a bias every tree shares is identical in every term and survives the mean untouched. Measured: variance 0.6204 to 0.0912 (−85.3%) while raw bias² went 0.1087 to 0.0863. That second number is not a 20% bias reduction — a 40-replicate bias estimate of a *single* tree is inflated by $\mathrm{Var}/R = 0.620/40 = 0.0155$ of Monte-Carlo noise, so the corrected values are 0.093 and 0.084: flat. Variance fell by a factor of 6.8; bias moved by less than the error bar on its own measurement.
    - **A random forest is bagging plus feature subsampling, and that only helps by lowering rho.** At every split, consider only a random subset of mtry features. On 30 features that are noisy copies of 3 latent signals: mtry=30 gave $\sigma^2 = 1.8810$, $\rho = 0.0599$, floor 0.1127; mtry=10 gave $\sigma^2 = 1.9146$ (+1.8%), $\rho = 0.0356$ (−40.7%), floor 0.0681 (−39.6%), MSE 1.1236 to 1.0936 (−2.7%). Per-tree quality barely moved because the features were redundant — and that is exactly the condition under which decorrelation is free.
    - **mtry is a three-way trade and it can lose outright.** Shrinking mtry lowers $\rho$ but raises $\sigma^2$ and raises bias². On the 6-feature problem, mtry=2 cut $\rho$ from 0.1385 to 0.0423 and the floor from 0.0859 to 0.0523, yet $\sigma^2$ went 0.6204 to 1.2367 (+99.3%) and bias² 0.0863 to 0.2075 (+140.5%), so MSE rose 53.9%, from 0.1752 to 0.2696. Feature subsampling pays only when the features are redundant enough that dropping most of them costs little. Few features each carrying unique signal is the worst case for a random forest and the best case for plain bagging.
    - **The bootstrap throws away 36.8% of the rows per tree, on purpose.** Each tree sees $n$ draws with replacement, so the chance a given row is never drawn is $(1-1/n)^n \to 1/e$. At $n = 300$ that is 0.3673: 189 distinct rows, 111 out of bag. Every tree is therefore individually worse than a tree trained on everything — on 12 seeds, a single bootstrap tree scores 0.4467 against 0.4407 for a full-data tree, a 0.6-point penalty — and the 100-tree ensemble still reaches 0.3810, which is 6.6 points better than the tree that fed it, because 85% of a tree's variance is worth far more than 0.6 points of accuracy.
    - **The out-of-bag error is free, nearly unbiased at large B, and noisy at every B.** Each row is out of bag for the trees that never drew it, about $B/e = 36.8$ of 100, so you get a held-out estimate without holding anything out. But each voting tree saw 63% of the data, so the estimate belongs to a smaller forest than the one you built: paired measurements on 12 seeds of 300 rows give OOB 0.4465 against test 0.4091 at B=10 (+3.7 points), and 0.3856 against 0.3810 at B=100 (+0.45 points). The per-seed spread of that OOB-minus-test gap at B=100 is 0.0284, which is just the binomial error of a 300-row estimate (0.0280). OOB is not a better number than cross-validation; it is a free one.
    - **More trees is the cheapest knob and the least valuable past about 100.** The variance falls as $1/B$ and the error follows it until it flattens: 0.4411 at B=1, 0.4107 at 5, 0.3998 at 10, 0.3902 at 25, 0.3874 at 50, 0.3846 at 100, 0.3834 at 200. Quadrupling from 50 to 200 buys 0.4 points; the first 50 buy 5.4. The algebra makes it exact: at $\rho = 0.1385$, being within 10% of the floor needs $B = 63$ and being within 1% needs 623. Past that the knobs that matter are tree size, leaf size and mtry — the ones that move $\sigma^2$, $\rho$ or the bias, none of which is called `n_estimators`.
    - **Feature importance from `feature_importances_` is a training-set artefact and it is cardinality-biased.** It is the total impurity decrease each feature produced on the data the trees grew on. Take 1,000 rows with coin-flip labels — no signal whatsoever — and five pure-noise columns with 2, 5, 20, 60 and 200 distinct values. The forest assigns them 0.043, 0.097, 0.204, 0.310 and 0.346 of the total importance. More distinct values means more candidate thresholds means more chances to look useful. Use permutation importance on held-out rows, and quote its spread over repeats.


  derivations:
    - title: "The variance of an average of correlated trees"
      latex: |-
        Let $f_1, \dots, f_B$ be the predictions of B trees, each with variance
        $\sigma^2$ and with average pairwise correlation $\rho$. Then

        $$\operatorname{Var}\!\left(\frac{1}{B}\sum_{b=1}^{B} f_b\right)
          = \frac{1}{B^2}\left[\sum_{b=1}^{B}\operatorname{Var}(f_b)
            + \sum_{b \neq c}\operatorname{Cov}(f_b, f_c)\right]$$

        There are $B$ variance terms and $B(B-1)$ covariance terms, and
        $\operatorname{Cov}(f_b, f_c) = \rho\sigma^2$ by definition of $\rho$:

        $$= \frac{1}{B^2}\left[B\sigma^2 + B(B-1)\rho\sigma^2\right]
          = \frac{\sigma^2}{B} + \frac{B-1}{B}\rho\sigma^2
          = \rho\sigma^2 + (1-\rho)\frac{\sigma^2}{B}$$

        As $B \to \infty$ the second term vanishes and the first does not.
        Rearranged, the same identity recovers the correlation from one
        measurement, and prices the trees needed to get close to the floor:

        $$\rho = \frac{\operatorname{Var}_B - \sigma^2/B}{\sigma^2(1 - 1/B)},
          \qquad
          \frac{\operatorname{Var}_B - \rho\sigma^2}{\rho\sigma^2}
          = \frac{1-\rho}{B\rho}
          \;\le\;\varepsilon
          \;\Longrightarrow\;
          B \ge \frac{1-\rho}{\varepsilon\rho}$$

        At $\rho = 0.1385$: $\varepsilon = 0.10$ needs $B = 63$ and
        $\varepsilon = 0.01$ needs $B = 623$. At $\rho = 0.8$ the same two
        targets need 3 and 25 trees.
      prose: >-
        The whole topic is in the last line of the first block. The variance of
        the ensemble is a weighted mixture of two things: the variance every tree
        shares, which no amount of averaging touches, and the variance each tree
        contributes independently, which is divided by B. Setting B=100 with the
        measured rho = 0.1385 and sigma^2 = 0.6204 gives 0.086 + 0.005 = 0.091,
        and the measured value was 0.0912. The second block's last inequality
        runs in the counterintuitive direction: a lower rho needs *more* trees to
        converge, because more independent variance is left to average — at
        rho = 0.06 the 10% target needs 157 trees against 63 at rho = 0.1385. A
        well-decorrelated forest that still looks like it is improving at B=300
        is a sign the decorrelation worked, not that it is undertrained.
    - title: "Why rho is the between-dataset share of the variance"
      latex: |-
        Write the randomness of a tree as a pair: the training sample $D$, and
        the bootstrap draw $b$ given $D$. By the law of total variance,

        $$\operatorname{Var}(f) = \mathbb{E}_D\!\left[\operatorname{Var}_b(f \mid D)\right]
                                + \operatorname{Var}_D\!\left(\mathbb{E}_b[f \mid D]\right)$$

        Conditional on $D$, the B bootstrap draws are independent, so

        $$\operatorname{Var}\!\left(\bar f \,\middle|\, D\right) = \frac{1}{B}\operatorname{Var}_b(f \mid D)$$

        and therefore

        $$\operatorname{Var}(\bar f) = \frac{1}{B}\mathbb{E}_D\!\left[\operatorname{Var}_b(f \mid D)\right]
                                     + \operatorname{Var}_D\!\left(\mathbb{E}_b[f \mid D]\right)$$

        The first term is $\sigma^2(1-\rho)/B$ and the second is $\sigma^2\rho$,
        so $\rho$ is exactly the fraction of a single tree's variance that comes
        from the dataset rather than from the bootstrap.
      prose: >-
        Reproducibility and ensembling are the same accounting problem. A seed
        fixes the bootstrap stream; the dataset is the stream you cannot reseed.
        Bagging averages over the first and is helpless against the second, and
        this identity says precisely how much of the variance each one owns. It
        also explains the 63.2% penalty: a bootstrap tree is a different
        estimator from a full-data tree, so "bagging leaves bias alone" means it
        leaves the *bootstrap tree's* bias alone, not the full-data tree's.
    - title: "Why 63.2% of the rows survive a bootstrap"
      latex: |-
        A row is missing from a bootstrap sample when none of the $n$ draws
        picks it. Each draw misses with probability $1 - 1/n$, so

        $$P(\text{row } i \text{ is out of bag}) = \left(1 - \frac{1}{n}\right)^{n}
          \;\xrightarrow[n \to \infty]{}\; e^{-1} \approx 0.3679$$

        and the expected number of distinct rows is

        $$\mathbb{E}[\text{distinct}] = n\left[1 - \left(1 - \frac{1}{n}\right)^{n}\right]
          \;\to\; n(1 - e^{-1}) \approx 0.6321\,n$$

        At $n = 300$ the exact values are 0.3673 out of bag and 189 distinct
        rows. At $B = 100$ a row is out of bag for $100/e = 36.8$ trees.
      prose: >-
        Two consequences follow from one line of algebra. The 36.8% is what makes
        OOB estimation possible at all — it is a held-out set that costs no data.
        And the 63.2% is what makes each tree worse than a tree trained on
        everything, which is the price the ensemble pays up front: measured, 0.6
        points of accuracy per tree, bought back 6.6 points at B=100.

  implementations:
    - language: python
      title: "Bagging with an honest OOB count"
      note: >-
        Numerically wrong in three places. (1) `votes[i] / counts[i]`
        is only defined where the count is positive; drop the `counts > 0` mask
        and rows that were never out of bag silently vote for class 0, which
        biases the OOB error toward whichever class is more common. (2) The RNG
        is consumed
        once per tree in loop order, so adding a tree at the *front* changes
        every subsequent bootstrap — the consumption-path lesson from
        *Randomness, Reproducibility, and Seeding*: the loop order is part of
        the experiment's identity. (3) The number this returns is the error of a
        forest where each row is judged by only `B/e` trees — at B=10 that is
        3.7 points pessimistic, measured.
      code: |-
        import numpy as np
        from sklearn.tree import DecisionTreeClassifier

        def bagged_forest(X, y, X_test, n_trees=100, max_features=None, seed=0):
            """Bootstrap + vote, with out-of-bag bookkeeping.

            `max_features=None` means mtry = d (plain bagging).
            """
            X = np.asarray(X, float)
            y = np.asarray(y)
            X_test = np.asarray(X_test, float)
            n, d = X.shape
            K = int(y.max()) + 1
            rng = np.random.default_rng(seed)

            votes = np.zeros((n, K))          # out-of-bag votes per training row
            counts = np.zeros(n, dtype=int)   # how many trees were OOB for it
            test_proba = np.zeros((len(X_test), K))

            for b in range(n_trees):
                idx = rng.integers(0, n, n)          # the bootstrap draw
                in_bag = np.zeros(n, dtype=bool)
                in_bag[idx] = True
                oob = ~in_bag
                tree = DecisionTreeClassifier(
                    max_features=max_features,
                    random_state=int(rng.integers(1 << 31)),
                ).fit(X[idx], y[idx])
                test_proba += tree.predict_proba(X_test)
                # Only rows this tree never saw may vote on themselves.
                votes[oob] += tree.predict_proba(X[oob])
                counts[oob] += 1

            oob_rows = counts > 0
            oob_pred = votes[oob_rows].argmax(1)
            oob_error = float((oob_pred != y[oob_rows]).mean())
            return {
                "proba": test_proba / n_trees,
                "oob_error": oob_error,
                "oob_fraction": float(counts.mean() / n_trees),   # P(row is OOB)
            }

        # Measured on 300 rows, 8 features, 10 seeds, mtry=2:
        #   B=10  -> test 0.4091, oob 0.4465   (+3.7 points)
        #   B=100 -> test 0.3810, oob 0.3856   (+0.45 points)
    - language: python
      title: "The variance-floor diagnostic"
      note: >-
        Numerically wrong if you compute the correlation of the raw predictions
        across test points instead of around the per-point ensemble mean: for
        the forest above that gives 0.811 where the error correlation is 0.139,
        a 5.9x overstatement of the floor, because the raw correlation is
        dominated by the fact that every tree is fitting the same function. It
        is also wrong if you mix `ddof` conventions between the variance and the
        covariance terms, which shows up as a floor that misses by a few percent
        and looks like a fitting error.
      code: |-
        import numpy as np

        def variance_curve(P, budgets=(1, 5, 10, 25, 50, 100)):
            """P: (n_datasets, n_trees, n_points).

            Rows are independent datasets; within a row the trees are bootstrap
            fits on that dataset. Var_B is taken ACROSS DATASETS, never across
            test points -- the variance the formula describes is how much the
            ensemble's prediction moves when you recollect the data.
            """
            R, T, n_points = P.shape
            out = {}
            for B in budgets:
                ens = P[:, :B].mean(1)                      # (R, n_points)
                out[B] = float(ens.var(0, ddof=1).mean())    # across datasets
            # Total single-tree variance: pool datasets and trees, then average
            # over points. Using the within-dataset variance here instead
            # overstates rho by about 19%.
            sigma2 = float(P.reshape(R * T, n_points).var(0, ddof=1).mean())
            B = max(budgets)
            # Var_B = rho*sigma^2 + (1-rho)*sigma^2/B  ->  solve for rho
            rho = (out[B] - sigma2 / B) / (sigma2 * (1.0 - 1.0 / B))
            return {"var": out, "sigma2": sigma2, "rho": float(rho),
                    "floor": float(rho * sigma2)}

        def trees_for_floor(rho, frac=0.10):
            """Smallest B whose excess variance over the floor is <= frac."""
            return int(np.ceil((1.0 - rho) / (frac * rho)))

        # Measured, 6 features, 40 datasets, 100 trees:
        #   sigma2 = 0.6204   rho = 0.1385   floor = 0.0859
        #   Var(100) = 0.0912 -> 6.1% above the floor
        #   trees_for_floor(0.1385, 0.10) = 63

  checkpoints:
    - id: cp-1
      question: >-
        A bagged ensemble has $\sigma^2 = 0.62$ and $\rho = 0.14$. At B = 100,
        what fraction of the way from a single tree to the floor have you
        travelled, and how many trees would it take to be within 10% of the
        floor?
      answerKind: short_text
      hint: >-
        The floor is $\rho\sigma^2$ and the excess over it is
        $(1-\rho)/(B\rho)$.
      solution: >-
        The floor is $0.14 \times 0.62 = 0.0868$. At B=100 the excess is
        $(1-0.14)/(100 \times 0.14) = 0.0614$, so the ensemble variance is
        0.0921 — 6.1% above the floor, having already removed 85% of the
        single-tree variance. Within 10% needs
        $B \ge (1-0.14)/(0.10 \times 0.14) = 61.4$, so 62 trees. The measured
        values on real data were 0.6204, 0.1385, 0.0859 and 0.0912, which is the
        same arithmetic.
    - id: cp-2
      question: >-
        A colleague says the forest is underfitting and proposes 5,000 trees to
        fix the bias. What is wrong with the proposal, and what would you
        measure first?
      answerKind: short_text
      hint: >-
        Where does B appear in $\rho\sigma^2 + (1-\rho)\sigma^2/B$, and where
        does bias appear in the decomposition of MSE?
      solution: >-
        B appears only in the variance term, and only in the part multiplied by
        $(1-\rho)$. The decomposition is
        $\mathrm{MSE} = \mathrm{bias}^2 + \mathrm{Var} + \sigma^2_{\text{noise}}$,
        and nothing in the averaging step divides bias². If trees share a wrong
        structural assumption — an axis-aligned split that cannot represent the
        boundary, a feature that was never supplied — every tree in the forest
        makes that error identically and the average reproduces it exactly.
        Measure the learning curve out to B=200: if it is flat, you are at the
        floor and the remaining error is bias. Change the features, the tree
        geometry, or the model class; adding trees is inert.
    - id: cp-3
      question: >-
        Your OOB error is 0.386 on 300 training rows. How precisely do you know
        it, and what would you report instead?
      answerKind: short_text
      hint: >-
        It is an accuracy estimate from 300 examples. What is the standard error
        of a proportion at that size?
      solution: >-
        It is a 300-row estimate, so its binomial standard error is
        $\sqrt{0.386 \times 0.614/300} = 0.0280$, i.e. ±2.8 points at one
        standard error. Measured across 12 seeds, the OOB-minus-test gap's spread
        was 0.0284 — exactly that, which confirms it carries no extra information
        that would shrink it. Report the mean over at least five root seeds with
        that spread attached, and remember it is also biased: at B=100 it ran
        0.45 points pessimistic against the test error (0.3856 against 0.3810),
        and at B=10 it ran 3.7 points pessimistic.
    - id: cp-4
      question: >-
        Two problems: one has 30 features that are noisy copies of 3 latent
        signals, the other has 6 features each carrying something unique. Where
        does lowering mtry help, and what is the mechanism in each case?
      answerKind: short_text
      hint: >-
        Ask what dropping a feature costs the individual tree, and what it buys
        in agreement between trees.
      solution: >-
        It helps on the redundant problem and hurts on the unique one. On
        redundant features, a tree that can see only 10 of 30 candidates is
        barely worse — $\sigma^2$ moved 1.8810 to 1.9146, +1.8% — while $\rho$
        fell 0.0599 to 0.0356 (−40.7%) and the floor fell 39.6%, giving 2.7% off
        MSE. On unique features, cutting to mtry=2 doubled $\sigma^2$ (0.6204 to
        1.2367) and raised bias² by 140% (0.0863 to 0.2075), for a 54% MSE
        penalty — even though the floor also fell. The rule: subsampling pays
        when the features are interchangeable, and costs when each one is the
        only source of what it carries.
    - id: cp-5
      question: >-
        A single tree trained on 300 rows scores 0.4407. A single tree trained
        on a bootstrap sample scores 0.4467. Why would anyone use the worse one,
        and what does it buy?
      answerKind: short_text
      hint: >-
        Compare the variance of the two estimators, not just the means.
      solution: >-
        Because the bootstrap tree's 0.6-point accuracy penalty buys access to a
        distribution: 100 such trees, decorrelated, score 0.3810. The variance
        of the prediction across datasets falls from 0.6204 to 0.0912 — an 85.3%
        reduction — which is worth far more than the 0.6 points given up. This
        is also the honest statement of what bagging costs: it is not free
        lunch, it is a purchase of variance reduction at the price of a slightly
        weaker and slightly more biased base learner.
    - id: cp-6
      question: >-
        `feature_importances_` puts your `customer_id` column fourth of twenty,
        above two features you believe in. Is the model using it, and what
        should you do?
      answerKind: short_text
      hint: >-
        What is the statistic computed on, and how does the number of distinct
        values affect it?
      solution: >-
        Probably not — MDI is computed on the training data the trees grew on,
        and it grows mechanically with the number of distinct values, because
        more levels means more candidate thresholds means more opportunities to
        reduce impurity by chance. On 1,000 rows with coin-flip labels and five
        pure-noise columns of 2, 5, 20, 60 and 200 levels, a forest assigns them
        0.043, 0.097, 0.204, 0.310 and 0.346 of the total importance. Compute
        permutation importance on held-out rows instead: it can return zero, and
        for an ID column it will.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Averaging N noisy estimates removes the part of their error that differs
        between them and keeps the part they share. Every question in this topic
        is a version of "which part is which". The shared part is not a small
        correction — it is the thing that stops the curve, and it is why a second
        knob exists at all.
      blocks:
        - kind: checklist
          body: |-
            - Averaging divides only the variance that is independent across trees
            - The shared variance is rho * sigma^2, and B cannot touch it
            - Feature subsampling lowers rho; it pays only if the features are redundant
            - Bias is shared by construction, so no average divides it
            - A bootstrap sample holds 63.2% of the rows, so each tree is slightly worse
            - OOB error is free, biased at small B, and noisy at every B
      checkpoint: >-
        Before reading on: if you averaged 100 copies of the *same* tree, what
        would the variance of the average be, and what does that tell you about
        where the benefit of bagging comes from?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Three jobs, three tools. For the bootstrap you need the mask: a boolean
        of length n, set True at the drawn indices, because the out-of-bag count
        is what the mask counts and what no set-based shortcut gives you. For the
        correlation, `np.corrcoef` on the rows of the matrix already centres each
        tree internally — what it cannot do is ignore a constant row, so you
        filter those out first. For the floor it is a two-line rearrangement:
        solve for rho from one measurement, then multiply.
      blocks:
        - kind: checklist
          body: |-
            - Bootstrap: draw n indices, build a boolean mask, count True
            - Out-of-bag rows = n - distinct; never n - len(idx), which is always 0
            - Correlation: rows are trees; average the strict upper triangle of np.corrcoef
            - Drop zero-variance rows before correlating, or every pair with them is nan
            - Floor = rho * sigma^2, with rho solved from one measured Var_B
            - Excess over the floor = (1 - rho) / (B * rho)
      checkpoint: >-
        `np.corrcoef` centres each row internally, so why is the answer still
        wrong if you forget to drop a constant row — and what does the same
        oversight do to a floor computed from that correlation?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Three short routines. The one that catches people is the first:
        `n - len(idx)` is zero every time and it looks right, because the sample
        has exactly n entries by construction.
      blocks:
        - kind: pseudocode
          body: |-
            bootstrap_stats(n, seed):
                rng  = default_rng(seed)
                idx  = rng.integers(0, n, size=n)
                mask = boolean array of length n, all False
                mask[idx] = True
                unique = count of True in mask
                return [unique, n - unique, unique / n]

            mean_tree_correlation(trees):        # rows are trees
                drop every row whose standard deviation is ~0
                if fewer than 2 rows remain: return 0.0
                C = correlation matrix of the remaining rows
                return mean of the upper triangle (i < j)

            variance_floor_report(sigma2, rho, B):
                floor = rho * sigma2
                var   = floor + (1 - rho) * sigma2 / B
                return [var, floor, (1 - rho) / (B * rho)]
      checkpoint: >-
        In the first routine, why is the out-of-bag count `n - unique` rather
        than `n - len(idx)`?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Everything here is the same covariance identity, rearranged three ways.
      blocks:
        - kind: math
          body: |-
            **The floor.** With B trees of variance $\sigma^2$ and mean pairwise
            correlation $\rho$:

            $$\operatorname{Var}(\bar f) = \frac{1}{B^2}\left[B\sigma^2 + B(B-1)\rho\sigma^2\right]
              = \rho\sigma^2 + (1-\rho)\frac{\sigma^2}{B}$$

            **Recovering rho from one measurement.** Rearranged:

            $$\rho = \frac{\operatorname{Var}_B - \sigma^2/B}{\sigma^2\left(1 - 1/B\right)}$$

            **Trees to reach the floor.** The excess as a fraction of the floor:

            $$\frac{\operatorname{Var}_B - \rho\sigma^2}{\rho\sigma^2}
              = \frac{1-\rho}{B\rho}
              \;\le\; \varepsilon
              \quad\Longrightarrow\quad
              B \ge \frac{1-\rho}{\varepsilon\rho}$$

            **Bootstrap.** $\;P(\text{out of bag}) = (1-1/n)^n \to e^{-1} = 0.3679$.
      checkpoint: >-
        The three formulas share a symbol. Which one changes if you average
        probabilities instead of hard votes, and which one does not?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        All three routines, with the guards that decide whether the answers are
        right or merely close.
      blocks:
        - kind: warning
          body: >-
            Attempt all three first. The two failures that look like success are
            a correlation computed on raw predictions (0.81 instead of 0.14) and
            an out-of-bag count taken as n minus the sample size.
        - kind: code
          language: python
          body: |-
            import numpy as np

            def bootstrap_stats(n, seed):
                idx = np.random.default_rng(seed).integers(0, n, n)
                seen = np.zeros(n, dtype=bool)
                seen[idx] = True
                unique = int(seen.sum())
                return [unique, n - unique, unique / n]

            def mean_tree_correlation(trees):
                T = np.asarray(trees, dtype=float)
                if T.ndim != 2 or T.shape[0] < 2:
                    return 0.0
                T = T[T.std(1) > 1e-12]          # a constant tree has no correlation
                if T.shape[0] < 2:
                    return 0.0
                C = np.corrcoef(T)
                iu = np.triu_indices(C.shape[0], 1)
                return float(C[iu].mean())

            def variance_floor_report(sigma2, rho, b):
                floor = rho * sigma2
                var = floor + (1.0 - rho) * sigma2 / b
                return [var, floor, (1.0 - rho) / (b * rho)]

            # measured: bootstrap_stats(300, 0) -> [189, 111, 0.63]
            #           variance_floor_report(1.0, 0.8, 100)
            #               -> [0.802, 0.8, 0.0024999999999999996]
      checkpoint: >-
        `mean_tree_correlation` drops constant rows. What would `np.corrcoef`
        return for them, and why is dropping the right fix rather than adding an
        epsilon to the standard deviation?

