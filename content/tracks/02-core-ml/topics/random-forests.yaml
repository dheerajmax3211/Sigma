    - type: compare
      title: "Bagging and a random forest differ by one line of code and one quantity"
      left_label: "Bagging (mtry = d)"
      left_points:
        - "Every split sees every feature, so every tree finds the same dominant split"
        - "Nothing decorrelates them: rho is whatever the data imposes"
        - "Each tree is as good as it can be, and that is exactly the problem"
        - "Wins when features are few and each carries unique signal: 0.1752 MSE against 0.2696"
      right_label: "Random forest (mtry < d)"
      right_points:
        - "Each split sees a random subset, so trees disagree about the root"
        - "Rho falls: 0.0599 to 0.0356 on redundant features"
        - "Each tree is noisier and more biased, which is the price of the disagreement"
        - "Wins when features are redundant: 1.0936 MSE against 1.1236"
    - type: pipeline
      title: "Growing one forest, with the bookkeeping that makes OOB possible"
      nodes:
        - label: "One root seed, one stream per tree"
          note: "SeedSequence.spawn, not seed + i"
          detail: "The bootstrap draw is the experiment's unit of randomness. Deriving tree b's stream from a spawn key makes the whole forest reproducible from one integer and immune to a logging call that consumes a draw."
        - label: "Draw n indices with replacement"
          note: "63.2% distinct, 36.8% out of bag"
          detail: "Record the complement. This is the only record of which rows a tree is allowed to be judged on, and it costs one boolean mask per tree."
        - label: "Fit a deep tree, mtry features per split"
          note: "no pruning"
          detail: "Depth is left unbounded on purpose. Bagging pays for variance, and a shallow tree has little variance to sell; the decorrelation from mtry does the rest."
        - label: "Predict every row with the trees that never saw it"
          note: "OOB votes"
          detail: "Accumulate votes only where the mask is false, and count how many trees voted. A row with zero votes must be excluded, not silently given a zero vector."
        - label: "Average, or vote"
          note: "B predictions, one output"
          detail: "Regression averages; classification votes or averages probabilities. The variance formula applies to the averaged quantity, so averaging probabilities is the version the algebra describes."
        - label: "Report four numbers, not one"
          note: "test, OOB, rho, floor"
          detail: "A single error rate cannot tell you whether to add trees, add randomness, or change the tree. The four together can."
    - type: graph
      title: "One knob, four consequences, one number that decides"
      nodes:
        - { id: mtry, label: "mtry down" }
        - { id: rho, label: "rho down" }
        - { id: sig, label: "sigma^2 up" }
        - { id: bias, label: "bias^2 up" }
        - { id: floor, label: "floor rho*sigma^2" }
        - { id: mse, label: "MSE" }
        - { id: b, label: "B up" }
