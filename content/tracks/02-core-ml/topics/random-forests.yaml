          expected: "0.0"
          mode: json
          tolerance: 1e-12
      solution: |-
        import numpy as np

        def mean_tree_correlation(trees):
            T = np.asarray(trees, dtype=float)
            if T.ndim != 2 or T.shape[0] < 2:
                return 0.0
            T = T[T.std(1) > 1e-12]
            if T.shape[0] < 2:
                return 0.0
            C = np.corrcoef(T)
            iu = np.triu_indices(C.shape[0], 1)
            return float(C[iu].mean())
      solutionExplanation: >-
        This is rho, the quantity that multiplies sigma^2 and sets the floor
        no number of trees can cross. Two details decide whether it is right.
        First, the diagonal must be excluded: including it drags the mean toward
        1 and makes every forest look correlated. Second, constant rows must be
        dropped, because Pearson correlation divides by both standard
        deviations and returns nan for them — and a nan averaged into the result
        poisons the whole diagnostic, which then looks like a bug in the
        ensemble rather than in the measurement. The three-row case shows why
        both matter: dropping the constant first row leaves two proportional
        rows and returns exactly 1.0, where a naive implementation returns nan.
      complexity: "O(T^2 n) time for T trees and n observations"
      tags: [correlation, variance, diagnostics]

    - id: p-variance-floor
      title: "Ensemble variance and the distance to the floor"
      difficulty: medium
      prompt: >-
        Implement `variance_floor_report(sigma2, rho, b)`. Return
        `[var_b, floor, excess_fraction]` where
        $\mathrm{var\_b} = \rho\sigma^2 + (1-\rho)\sigma^2/b$,
        $\mathrm{floor} = \rho\sigma^2$, and the excess is
        $(\mathrm{var\_b} - \mathrm{floor})/\mathrm{floor}$, which simplifies to
        $(1-\rho)/(b\rho)$. All three are floats. `rho` is in $(0, 1]$ and `b`
        is a positive integer.
      starter: |-
        def variance_floor_report(sigma2, rho, b):
            # your implementation here
            pass
      language: python
      entry: variance_floor_report
      testCases:
        - input: "[1.0, 0.8, 100]"
          expected: "[0.802, 0.8, 0.0024999999999999996]"
          mode: json
          tolerance: 1e-12
        - input: "[1.0, 0.14, 100]"
          expected: "[0.1486, 0.14, 0.06142857142857142]"
          mode: json
          tolerance: 1e-12
        - input: "[0.5, 0.06, 50]"
          expected: "[0.0394, 0.03, 0.3133333333333333]"
          mode: json
          tolerance: 1e-12
        - input: "[2.0, 0.5, 10]"
          expected: "[1.1, 1.0, 0.1]"
          mode: json
          tolerance: 1e-12
      solution: |-
        def variance_floor_report(sigma2, rho, b):
            floor = rho * sigma2
            var = floor + (1.0 - rho) * sigma2 / b
            return [var, floor, (1.0 - rho) / (b * rho)]
      solutionExplanation: >-
        The third number is the one worth looking at. At rho = 0.8 and B = 100
        the ensemble is 0.25% above its floor — 100 trees is absurd
        overkill, and it is overkill because the floor is 80% of the way up.
        At rho = 0.14 it is 6.1% above, and at rho = 0.06 it is 31.3% above
        with only 50 trees: the better-decorrelated forest needs *more* trees to
        converge, not fewer, because there is more independent variance left to
        average. That inversion — lower correlation demands a bigger forest — is
        the practical content of the formula.
      complexity: "O(1) time, O(1) space"
      tags: [variance, bagging, floor]
  try_it: >-
    Fit a forest of 200 trees on 300 rows and record the out-of-bag error at
    $B = 1, 5, 10, 25, 50, 100, 200$. Then estimate $\rho$ from the measured
    ensemble variance at $B = 100$ and predict the curve at the other values
    before comparing — the prediction should land within a few thousandths.
  interview_questions:
    - question: "Why does averaging $B$ trees not drive the error to zero?"
      level: mid
      key_points:
        - "The variance of the average is $\\rho\\sigma^2 + (1-\\rho)\\sigma^2/B$: the shared component never averages away, so the floor is $\\rho\\sigma^2$."
        - "Measured on a 300-row problem, $\\sigma^2 = 0.6204$ and $\\rho = 0.1385$ give a floor of 0.0859, and the error curve flattens onto it."
        - "Bias has no $1/B$ in it at all, which is why bagging cannot fix an underfit model — the bias term is identical in every tree."
        - "So the design problem is lowering $\\rho$, not adding trees; that is what feature subsampling is for."
      follow_up: "How would you estimate $\\rho$ on a model you have already trained, without refitting?"
    - question: "Smaller `mtry` lowers correlation. Is it always better?"
      level: senior
      key_points:
        - "It is a three-way trade: reducing $m$ lowers $\\rho$ but raises $\\sigma^2$ and raises bias$^2$."
        - "On the 6-feature problem, `mtry=2` cut $\\rho$ from 0.1385 to 0.0423 and the floor from 0.0859 to 0.0523 — but $\\sigma^2$ rose 99.3% and bias$^2$ went 0.0863 to 0.2075."
        - "The floor improving does not mean the error improves, because the floor is only one of the terms you are moving."
        - "So `mtry` is tuned against a validation estimate of total error, not against $\\rho$ as a proxy."
      follow_up: "Your features are 30 noisy copies of 3 latent signals. What does that structure imply for `mtry`?"
    - question: "What is out-of-bag error, and what is it not?"
      level: mid
      key_points:
        - "Each tree draws $n$ rows with replacement, so a given row is missing from about $1/e = 36.8\\%$ of trees — 111 of 300 rows' worth at $n = 300$."
        - "That gives a held-out estimate for free, and it is nearly unbiased at large $B$ because each row is judged by roughly $B/e$ trees."
        - "It is noisy: it moved 2.8 points between seeds, more than most effects people are trying to measure."
        - "It is also not a clean test-set substitute, because each voting tree saw only 63% of the data — the estimate belongs to a smaller-forest model."
  common_mistakes:
    - "Quoting OOB error as a held-out number when it shifts 2.8 points between seeds — more than most of the effects being reported."
    - "Treating `feature_importances_` as causal: mean decrease in impurity is cardinality-biased and still ranks pure-noise columns."
    - "Adding trees past about 100 expecting gains, when quadrupling from 50 to 200 bought 0.4 points of error."
  further_reading:
    - label: "Breiman, Random Forests (Machine Learning, 2001)"
    - label: "Strobl, Boulesteix, Zeileis & Hothorn, Bias in random forest variable importance measures (BMC Bioinformatics, 2007)"
