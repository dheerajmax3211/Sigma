      solution: |-
        import numpy as np

        def bootstrap_stats(n, seed):
            idx = np.random.default_rng(seed).integers(0, n, n)
            seen = np.zeros(n, dtype=bool)
            seen[idx] = True
            unique = int(seen.sum())
            return [unique, n - unique, unique / n]
      solutionExplanation: >-
        The mask is the point. `n - unique` counts rows the draw never picked,
        which is the out-of-bag set — the rows a tree built on this sample is
        allowed to be judged on. Taking `n - len(idx)` instead gives zero every
        time, because the sample always has exactly n entries by construction;
        it is the most common way to write this function and get a plausible,
        useless answer. The expected values are 63.2% distinct: 189 of 300 at
        seed 0, 65 of 100 at seed 7. The `n = 1` case is the guard — one row,
        drawn once, is always its own sample and never out of bag.
      complexity: "O(n) time, O(n) space"
      tags: [bootstrap, out-of-bag, sampling]

