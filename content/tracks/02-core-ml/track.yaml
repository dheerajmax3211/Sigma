track:
  id: core-ml
  slug: core-ml
  title: "Core Machine Learning"
  subtitle: "Classical algorithms, their mathematics, and the numerical reality of making them work"
  description: >-
    The algorithms that defined ML before deep learning — and still dominate
    tabular data, time series, and production systems where interpretability,
    latency, or data size rule out neural networks. Every topic derives the
    method from first principles, exposes the numerical failure modes, and
    implements it from scratch.
  tier: 1
  color: "#f59e0b"
  sortOrder: 2
  outcomes:
    - "Derive linear and logistic regression from maximum likelihood, and diagnose when the normal equations fail."
    - "Implement decision trees, random forests, and gradient boosting from scratch, understanding exactly how the split criterion, bagging, and residual fitting interact."
    - "Formulate SVMs as constrained optimisation, derive the dual, and choose kernels by reasoning about the feature map."
    - "Build Naive Bayes with Laplace smoothing, and explain why it works despite its violated independence assumption."
    - "Evaluate models with bias–variance decomposition, ROC/PR curves, and calibration — and recognise when accuracy is the wrong metric."
    - "Recognise data leakage, feature engineering pitfalls, and the curse of dimensionality in real datasets."