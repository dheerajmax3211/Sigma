track:
  id: audio
  slug: audio
  title: "Audio and Speech"
  subtitle: "Codecs, synthesis, recognition, and full-duplex voice"
  description: >-
    Audio is the part of generative AI that most candidates skip, and it is the
    part interviewers use to find out whether you understand a signal rather
    than a benchmark. This track starts from the tokenisation problem — how do
    you turn a waveform into something a transformer can predict? — and ends at
    a duplex voice agent with a latency budget you can defend line by line.
  tier: 4
  color: "#1cd6ac"
  sortOrder: 8
  outcomes:
    - "Explain residual vector quantisation and why neural codecs beat a mel spectrogram for generation."
    - "Derive the token rate of an audio codec and the context it consumes at one second of speech."
    - "Compare CTC, RNN-transducer, and autoregressive ASR on alignment, latency, and streaming."
    - "Budget a full-duplex voice pipeline to a stated end-to-end latency and name what breaks first."
  topics: []
