          kind: server
          detail: "Ten seconds is 6,000 tokens; one minute is 36,000; one hour is 2.16 million and does not fit a 1M window."
        - id: dec
          x: 5
          y: 1
          label: "decoder to 24 kHz"
          kind: gpu
          detail: "Transposed convolutions back to 24,000 samples per second. Trained with multi-scale spectral and adversarial losses, not with sample-level MSE, because MSE averages phase and produces muffled output."
        - id: out
          x: 6
          y: 1
          label: "reconstructed waveform"
          kind: client
          detail: "6 kbps in, 384 kbps out: a 64x reconstruction. What is lost is not random — it is whatever the adversarial critic cannot hear."
      edges:
