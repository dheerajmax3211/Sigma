      latex: |
        With frame rate $f_r$, $N_q$ residual books and codebook size $K$:

        $$\text{tokens/s} = f_r N_q, \qquad
          R = f_r N_q \log_2 K \ \text{bit/s}.$$

        At $f_r = 75$ (24 kHz, hop 320), $N_q = 8$, $K = 1024$:

        $$\text{tokens/s} = 75 \times 8 = 600, \qquad
          R = 75 \times 8 \times 10 = 6{,}000\ \text{bit/s} = 6\ \text{kbps}.$$

        Holding $R$ fixed at 6 kbps and $f_r$ at 75 Hz gives 80 bits per frame,
        which is any pair satisfying $N_q \log_2 K = 80$: eight books of 1,024,
        five of 65,536, or sixteen of 32.
      prose: >-
        The two outputs answer different questions. Tokens per second is what the
        language model pays in context and sequential steps; bitrate is what the
        network pays in bandwidth. They move together only because both contain
        $N_q$: doubling the books doubles the token rate and doubles the bitrate,
        while doubling the codebook size raises the bitrate by one bit per frame
        and leaves the token rate alone. That asymmetry is the reason a codec
        tuned for a language model prefers more, smaller books — the token budget
        is already spent, so the extra bits are nearly free in context terms.

    - title: "Why residual quantisation converges geometrically"
      latex: |
        Let $r_0 = z$ and let stage $i$ choose $e^{(i)}$ so that the residual
        $r_i = r_{i-1} - e^{(i)}$ has energy
        $\| r_i \|^2 \le \rho \| r_{i-1} \|^2$ for some $\rho < 1$. Then

        $$\| r_{N_q} \|^2 \le \rho^{N_q} \| z \|^2,$$

        so the reconstruction error falls by $10 \log_{10} \rho$ dB per book. With
        $\rho = 0.5$ that is $-3.01$ dB per book and $-24.1$ dB after eight.
      prose: >-
        The bound is an idealisation: a real quantiser's residual ratio worsens as
        the residual becomes noise-like, because a codebook trained on the first
        residual is a poor fit for the eighth. That is why the perceptual return
        on books 5-8 is smaller than the curve suggests and why codecs at 24 kbps
        are not four times better than codecs at 6 kbps. The useful reading is
        qualitative and directional: bits spent on the first two books buy
        intelligibility, bits spent on the last two buy timbre and transients.

  implementations:
    - language: python
      title: "An RVQ in twenty lines, and the residual energy it actually leaves"
      note: >-
        This is a faithful toy and an unfaithful codec. The codebooks are random
        rather than trained, so the residual ratios below are much worse than a
        trained EnCodec's; what it demonstrates is the *shape* of the decay and
        the arithmetic of the rate. The one design choice worth copying is that
        each stage fits the residual of the previous stage and nothing else — an
        implementation that re-quantises the original vector at every stage
        produces eight codes that all describe the same coarse structure, and the
        decoder learns to ignore seven of them.
      code: |
        import numpy as np


        def rvq(x, books, K=1024, seed=0):
            """x: (n_frames, d). Returns codes (n_frames, n_books) and the residual."""
            rng = np.random.default_rng(seed)
            codebooks = [rng.normal(size=(K, x.shape[1])) for _ in books]
            residual = x.copy()
            codes = np.zeros((x.shape[0], len(books)), dtype=int)
            for i, cb in enumerate(codebooks):
                # nearest entry for every frame, in one (n, K) distance matrix
                d = ((residual[:, None, :] - cb[None, :, :]) ** 2).sum(-1)
                idx = d.argmin(1)
                codes[:, i] = idx
                residual = residual - cb[idx]
                print(f"book {i + 1}: residual energy {np.mean(residual ** 2):.4f}")
            return codes, residual


        if __name__ == "__main__":
            rng = np.random.default_rng(1)
            x = rng.normal(size=(75, 8))          # one second at 75 Hz, 8-d latent
            rvq(x, books=range(8))
            # 75 frames x 8 books = 600 tokens for one second
            # 75 x 8 x 10 bits = 6,000 bit/s = 6 kbps

  checkpoints:
    - id: cp-1
      question: >-
        A codec runs at 24 kHz with a 320-sample hop and sixteen 1,024-entry
        codebooks. What is its token rate, its bitrate, and how many tokens does a
        two-minute clip cost?
      answerKind: short_text
      hint: "Frame rate is sample rate over hop. Bitrate is frame rate times books times bits per book."
      solution: >-
        $24{,}000/320 = 75$ frames/s. Tokens: $75 \times 16 = 1{,}200$/s. Bitrate:
        $75 \times 16 \times 10 = 12{,}000$ bit/s = 12 kbps. Two minutes is
        $1{,}200 \times 120 = 144{,}000$ tokens — which is why a 12 kbps codec is
        a different product decision from a 6 kbps one, not a quality setting.

    - id: cp-2
      question: >-
        Your codec trains, sounds fine, and its 1,024-entry codebooks have a
        measured index entropy of 7.1 bits. What are you paying for, and what are
        you not getting?
      answerKind: short_text
      hint: "Nominal bits per code is log2 K. Compare with what the usage distribution actually carries."
      solution: >-
        Nominal is $\log_2 1024 = 10$ bits; actual is 7.1, so 2.9 bits per code
        per frame are wasted — 29% of the bitrate. At 75 Hz and 8 books that is
        $75 \times 8 \times 2.9 = 1{,}740$ bit/s of the 6 kbps stream carrying
        nothing. The cause is codebook collapse: a subset of entries wins every
        assignment and the rest are dead. The fixes are EMA codebook updates,
        restarting dead entries from encoder outputs, and reducing latent width.

    - id: cp-3
      question: >-
        Why can a mel spectrogram not simply be fed to a language model as tokens,
        given that it is thirteen times cheaper than a 6 kbps codec?
      answerKind: short_text
      hint: "Two separate objections: one about the type of the values, one about what analysis destroyed."
      solution: >-
        It is not thirteen times cheaper — it is thirteen times *larger*:
        8,000 values/s against 600 tokens/s. And the values are continuous
        floats, so there is no cross-entropy to train; you would need a regression
        or diffusion head. Finally the filterbank discarded phase, so any
        reconstruction is the vocoder's invention rather than the signal you
        conditioned on, which is fatal when the output must be the input.

  try_it: >-
    Compute the token rate and bitrate for three codecs: 24 kHz with hop 320 and
    8 books of 1,024; 16 kHz with hop 160 and 8 books of 1,024; and 44.1 kHz with
    hop 512 and 9 books of 1,024. Then compute how many seconds of each fit in a
    128k context, and check your answer against $128{,}000 / (f_r N_q)$.

  interview_questions:
    - question: "Why does an audio language model use 600 tokens per second instead of the 24,000 samples per second it is trying to produce?"
      level: mid
      key_points:
        - "Samples are high-entropy and phase-dominated; a codec's 10-bit code at 75 Hz is a denser description of what a listener hears."
        - "600 tokens/s is 40 times shorter than 24,000 samples/s, and it is discrete, so a transformer can train with cross-entropy."
        - "The rate is a product: frame rate times codebooks. A 320-sample hop at 24 kHz is 75 Hz; eight books gives 600."
        - "The compression is not free — the tokens carry 6 kbps against 384 kbps of PCM, a 64x reduction that is only acceptable because the loss is perceptual."
      follow_up: "What would change if the product needed 20 ms algorithmic latency rather than 200 ms?"
    - question: "Explain residual vector quantisation and why it is preferred to one large codebook."
      level: senior
      key_points:
        - "Each stage quantises the residual of the previous stage, so the rate is linear in the number of books and the distortion falls roughly geometrically."
        - "A single 20-bit codebook would need 1,048,576 entries, most of which would never be visited often enough to train; eight 10-bit books see 75 assignments per second each."
        - "The first book carries the coarse envelope and most of the energy; later books carry timbre, transients and noise-like detail."
        - "The cost is sequential depth: eight books means eight decisions per frame, which a language model must model as eight tokens rather than one."
      follow_up: "If the last two books contribute little, why does dropping them make speech sound worse rather than just quieter?"
    - question: "Your codec's nominal bitrate is 6 kbps but the measured index entropy says 4.8 kbps. Where did the rest go, and how would you find out?"
      level: senior
      key_points:
        - "Nominal is f_r times N_q times log2 K; actual is f_r times N_q times the entropy of the usage distribution, so a gap means unused codes."
        - "Codebook collapse: a few entries win every assignment, the rest are dead, and the decoder compensates by ignoring the codes."
        - "Diagnose by plotting the histogram of code usage per book and by measuring perplexity per book; a healthy 1,024-entry book is used in the hundreds."
        - "Fix with EMA updates, dead-code restarts, lower latent dimension, or a commitment weight that keeps the encoder from outrunning the codebook."
      follow_up: "Why does lowering the latent dimension help codebook usage rather than making the codec worse?"

  common_mistakes:
    - "Comparing a mel spectrogram with a codec by counting values and concluding the mel is cheaper — it is 8,000 values per second against 600 tokens, and it is not discrete."
    - "Flattening eight codebooks into one 8,192-way softmax and expecting the residual books to learn, when the first book already explains most of the energy."
    - "Quoting a codec's nominal bitrate without measuring its index entropy, then wondering why the promised quality does not arrive."
    - "Ignoring the encoder's receptive field when quoting latency: a non-causal convolution stack cannot emit a frame before it has seen the future."

  further_reading:
    - label: "Zeghidour, Luebs, Omran, Skoglund & Tagliasacchi, SoundStream: An End-to-End Neural Audio Codec (2021)"
    - label: "Défossez, Copet, Synnaeve & Adi, High Fidelity Neural Audio Compression (EnCodec, 2022)"
    - label: "Kumar et al., High-Fidelity Audio Compression with Improved RVQGAN (DAC, 2023)"
    - label: "van den Oord, Vinyals & Kavukcuoglu, Neural Discrete Representation Learning (VQ-VAE, 2017)"

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Separate three objects. The waveform is 24,000 numbers a second. The
        encoder's latent is 75 numbers a second. The codec's output is 8 codes per
        latent frame, each one an index into a 1,024-entry table. Every number in
        this topic is one of those three counts multiplied by another.
      blocks:
        - kind: checklist
          body: |
            - sample rate / hop = frames per second
            - frames per second x books = tokens per second
            - tokens per second x bits per code = bitrate
            - a codec is trained by reconstruction, so its codes keep what a decoder needs
        - kind: warning
          body: >-
            Do not start from the codec's name and look up its bitrate. Start from
            the hop and the number of books, and derive it. The published number is
            usually rounded and sometimes counts a side stream.
      checkpoint: >-
        If the hop were 160 instead of 320 at 24 kHz, which of the three counts
        changes, and by how much?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Work from the signal upward. Fix the sample rate, choose the hop from the
        shortest event you must represent, then choose the number of books from the
        bitrate you can afford, then check the token rate against the context you
        have. If the token rate is too high, raise the hop before you cut books:
        dropping books costs intelligibility, and raising the hop costs transient
        sharpness.
      blocks:
        - kind: checklist
          body: |
            - 24 kHz and hop 320: 75 Hz, 13.33 ms per frame
            - 8 books of 1,024: 80 bits per frame, 6 kbps, 600 tokens/s
            - 16 books: 12 kbps, 1,200 tokens/s
            - 32 books: 24 kbps, 2,400 tokens/s
            - 1M tokens of 600 tokens/s audio: 1,666 s, or 27.8 minutes
      checkpoint: >-
        Which change would you make first to fit a 30-minute conversation in a 1M
        window: halve the books, double the hop, or lower the sample rate?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Four steps: encode, quantise, dequantise, decode. The quantiser is a loop
        over books, each one a nearest-neighbour search on the residual.
      blocks:
        - kind: pseudocode
          body: |
            encode(x, hop=320):
                z = encoder(x)                  # (T/320, d)
                return z

            quantise(z, books):
                residual = z
                codes = []
                for cb in books:
                    idx = argmin_j || residual - cb[j] ||^2
                    codes.append(idx)
                    residual = residual - cb[idx]
                return codes                   # N_q x T/320 indices

            dequantise(codes, books):
                return sum(books[i][codes[i]] for i in range(len(books)))

            decode(zq):
                return decoder(zq)              # 24,000 samples per second

            # rate:   75 frames/s x 8 books            = 600 tokens/s
            # bitrate: 75 x 8 x log2(1024)              = 6,000 bit/s
      checkpoint: >-
        In `quantise`, what happens to the residual if `idx` is chosen from `z`
        rather than from `residual` on the second iteration?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Two derivations carry the topic: the rate identity, and the geometric
        decay of residual error.
      blocks:
        - kind: math
          body: |
            Rate. With frame rate $f_r$, $N_q$ books and codebook size $K$:

            $$\text{tokens/s} = f_r N_q, \qquad
              R = f_r N_q \log_2 K.$$

            At $f_r = 75$, $N_q = 8$, $K = 1024$:
            $75 \times 8 = 600$ tokens/s and $75 \times 8 \times 10 = 6{,}000$
            bit/s.

            Residual decay. With $r_i = r_{i-1} - e^{(i)}$ and
            $\| r_i \|^2 \le \rho \| r_{i-1} \|^2$:

            $$\| r_{N_q} \|^2 \le \rho^{N_q} \| z \|^2
              \quad\Longrightarrow\quad
              \text{error falls by } 10\log_{10}\rho \text{ dB per book.}$$

            At $\rho = 0.5$: $-3.01$ dB per book, $-24.1$ dB after eight.
      checkpoint: >-
        The decay bound assumes the same $\rho$ at every stage. Why does the real
        curve flatten, and what does that imply about where to spend the ninth
        book?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The rate table and the residual measurement, in one place, with the
        numbers the rest of the topic quotes.
      blocks:
        - kind: code
          language: python
          body: |
            def rate_table(sample_rate=24000, hop=320, books=(2, 4, 8, 16, 32), bits=10):
                fr = sample_rate / hop
                for n in books:
                    print(f"{n:2d} books: {fr * n:7.0f} tokens/s, "
                          f"{fr * n * bits:7.0f} bit/s")

            # 24000/320 = 75 frames/s
            # 8 books: 600 tokens/s, 75*8*10 = 6,000 bit/s
            # 1M tokens / 600 = 1,666.7 s = 27.8 minutes
      checkpoint: >-
        What does the table look like at 16 kHz and hop 160, and why is the
        tokens-per-second column exactly twice the 24 kHz/hop-320 column?
