    - type: compare
      title: "Mel spectrogram or learned codec as the interface to a generative model"
      left_label: "Mel spectrogram"
      left_points:
        - "Fixed analysis: 80 bins at a 10 ms hop is 8,000 values per second, thirteen times the codec's token count"
        - "Continuous floats, so generation needs a regression or a diffusion model rather than a softmax"
        - "Phase is discarded at analysis time and must be hallucinated by a vocoder"
        - "Perfectly aligned with human pitch perception, which is why it survives as a conditioning signal"
        - "No learned parameters, so no codebook collapse, no training instability, no bitrate ladder"
      right_label: "Learned codec (RVQ)"
