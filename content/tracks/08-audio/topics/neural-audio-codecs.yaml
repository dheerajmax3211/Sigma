  markdown: |
    ## The number that decides everything

    Audio arrives as a sequence of amplitudes. At 24 kHz, one second is 24,000
    numbers; at 16 bits each, that is $24{,}000 \times 16 = 384{,}000$ bits per
    second per channel, or 384 kbps. Stereo doubles it. None of that is a
    representation a transformer can predict, because the thing that makes a
    waveform a waveform — the phase of every partial — is high-entropy and
    perceptually almost irrelevant.

    So the first job in any audio model is to choose a shorter sequence that the
    decoder can still turn back into sound. There are two families of answer, and
    the difference between them is the whole topic.

    ## Analysis or learning

    A mel spectrogram is *analysis*: a short-time Fourier transform, a
    triangular filterbank on a perceptual frequency scale, a logarithm. It is
    fixed, parameter-free, and it throws away phase on purpose. With 80 bins and
    a 10 ms hop it produces $80 \times 100 = 8{,}000$ values per second. Those
    values are continuous floats, so a generative model over them must be a
    regression or a diffusion model, and because phase is gone, a vocoder has to
    invent it.

    A neural codec is *learning*: an encoder, a quantiser and a decoder trained
    together so that the quantised code is enough to rebuild the waveform. The
    decoder is the training signal, so the code keeps whatever the decoder needs
    — including the transient structure that a mel filterbank smears. What comes
    out is discrete, which means a transformer can put a cross-entropy over it.

    | property | mel spectrogram | neural codec |
    |---|---|---|
    | values or tokens per second | 8,000 | 600 at 75 Hz × 8 books |
    | type | continuous floats | discrete codes |
    | phase | discarded, must be invented | implicit in the code |
    | invertible | only with a vocoder | by construction |
    | parameters | none | encoder, codebook, decoder |

    ## VQ-VAE, and the gradient that does not exist

    Take an encoder $E$, a codebook $\{e_1, \dots, e_K\}$ and a decoder $D$. The
    forward pass is

    $$z_e = E(x), \qquad k = \arg\min_j \| z_e - e_j \|_2, \qquad
      \hat x = D(e_k).$$

    The argmin is piecewise constant. Its derivative is zero almost everywhere,
    so backpropagation through it would train nothing. The straight-through
    estimator replaces the backward pass with the identity: on the forward pass
    the decoder sees $e_k$, on the backward pass the encoder receives the
    gradient as if $e_k$ had been $z_e$. The loss makes that substitution
    honest:

    $$\mathcal{L} = \| x - \hat x \|^2
      + \| \operatorname{sg}[z_e] - e_k \|^2
      + \beta \| z_e - \operatorname{sg}[e_k] \|^2,$$

    where $\operatorname{sg}$ is stop-gradient. The second term moves the codebook
    toward the encoder; the third, with $\beta \approx 0.25$, stops the encoder
    from running away from the codebook. The first term is the only one that
    cares about audio.

    The characteristic failure is codebook collapse. If only 300 of 1,024 codes
    are ever chosen, the index entropy is $\log_2 300 = 8.23$ bits rather than
    10, so 17.7% of the bitrate buys nothing. Exponential-moving-average codebook
    updates, restarting dead codes from random encoder outputs, and lowering the
    latent width all help, and all of them are patches on the same problem: a
    hard nearest-neighbour assignment with no exploration.

    ## Residual quantisation: eight books instead of one big one

    A single 1,024-entry codebook at 10 bits per 13.33 ms frame is 750 bit/s and
    sounds like a cheap telephone. The fix is not a bigger codebook — it is a
    chain of small ones. Quantiser 1 codes $z$; quantiser 2 codes $z - e^{(1)}$;
    quantiser 8 codes what the seventh left over. If each stage removes a
    fraction $\rho$ of the remaining error energy, eight stages leave
    $\rho^8$. At $\rho = 0.5$ that is $0.0039$, a 24 dB improvement, and it is
    bought at exactly 8 × 10 = 80 bits per frame, or 6 kbps at 75 Hz.

    That is the whole design of SoundStream, EnCodec and DAC: a convolutional
    encoder with a strided hop, a stack of residual quantisers, and a decoder
    trained with reconstruction, multi-scale spectral and adversarial losses. The
    differences are the hop, the number of books and the codebook size. EnCodec
    at 24 kHz uses a 320-sample hop — 75 Hz — and offers 1.5, 3, 6, 12 and
    24 kbps as 2, 4, 8, 16 and 32 books of 1,024. The arithmetic is one line:
    $75 \times N_q \times 10$ bits per second.

    ## The token rate, derived twice

    Tokens per second is the frame rate times the number of books:

    $$f_r \times N_q = 75 \times 8 = 600 \ \text{tokens/s}.$$

    Bitrate is the same product with the codebook width:

    $$f_r \times N_q \times \log_2 K = 75 \times 8 \times 10 = 6{,}000 \ \text{bit/s}.$$

    Ten seconds is 6,000 tokens. One minute is 36,000. One hour is 2,160,000,
    which is more than twice a 1M-token window — a number worth remembering the
    next time someone proposes an hour-long audio transcript in a single prompt.

    Now compare with text. Speech at 150 words per minute is 2.5 words per
    second; at roughly 1.3 tokens per word that is 3.25 tokens per second, or 195
    per minute. The ratio is $600 / 3.25 = 185$. One second of audio costs as
    many tokens as 185 seconds of the words it contains.

    The 16 kHz variant is the same multiplication with a different hop. A
    320-sample hop at 16 kHz is 50 frames/s, so eight books is 400 tokens/s;
    a 160-sample hop is 100 frames/s and 800 tokens/s. Moving from 16 kHz to
    24 kHz at a fixed hop length is a 1.5× increase in token rate for a bandwidth
    extension above 8 kHz that mostly carries fricatives and air.

    ## What it costs a transformer

    A decoder-only model over codec tokens sees one token per codebook per frame.
    At 600 tokens/s, a 4,096-wide, 32-layer model in fp16 accumulates a KV cache
    of

    $$600 \times 32 \times 2 \times 4096 \times 2\ \text{B}
      = 314{,}572{,}800\ \text{B/s} \approx 315\ \text{MB/s},$$

    which is 18.9 GB per minute of audio. The same minute of *text* at 195
    tokens is 102 MB. The ratio is the same 185, and it is the reason audio
    models are sold on context length: context is not free, it is memory per
    second of speech.

    ## Where codecs break

    Three failures, in the order they bite. **Codebook collapse**: the entropy of
    the index falls below $\log_2 K$ and you pay for bits that carry nothing,
    which shows up as a model that is fluent and slightly muffled. **Book
    imbalance**: the first book explains most of the energy, so a flat
    cross-entropy over eight books spends its gradient on the easy one; the usual
    fix is a delay pattern or per-book loss weights. **Latency**: a non-causal
    encoder with a one-second receptive field cannot emit a frame until it has
    seen the future, and no amount of GPU makes that stream. If the product needs
    sub-200 ms responses, the codec's convolution stack is on the critical path
    before the language model is.

    ## The longer version

    ### The idea, stated at length

    A neural codec is a learned analysis-by-synthesis compressor: an encoder turns the waveform into a low-rate latent, residual vector quantisation turns each latent frame into a short stack of codebook indices, and a decoder is trained to rebuild the waveform from those indices — so the token sequence keeps exactly the information the decoder needs, and its length is $f_r \times N_q$ tokens per second, with $f_r = 75$ and $N_q = 8$ giving the 600 tokens a second that every audio language model budgets against.

    ### The analogy, in full

    Sending a photograph by description instead of by pixel. The first sentence gives the broad shapes; the second corrects the shapes; the third corrects the correction. Each sentence is drawn from a fixed palette of 1,024 stock phrases, so the whole message is a short list of palette indices rather than a grid of colours. With eight correction sentences per 13.3 ms frame, the message is 6 kbps and the listener can redraw something that looks like the photograph. Three things break in the analogy. The palette is not fixed — the encoder, the palette entries and the decoder are trained together, so the codes end up meaning whatever makes reconstruction easiest, which is why a code has no human-readable gloss. The quality criterion is not fidelity to pixels: codecs are trained with multi-scale spectral and adversarial losses, so they are allowed to be wrong in ways a pixel metric would punish and a listener would not notice. And the correction sentences are not independent: each one describes the *residual* left by the previous ones, so an error in the first sentence is inherited by all seven corrections rather than averaged away.

    ### Failure modes, in full

    - You have 24 kHz speech, a transformer, and no plan. Flattened samples are 24,000 tokens per second per channel, so a 30-second clip is 720,000 tokens before a single layer runs — more context than most text corpora need for a whole conversation, spent on half a minute of audio.
    - You compare a mel spectrogram to a neural codec by counting values and conclude the mel is cheaper, then discover your vocoder is inventing phase detail the model never predicted, and the artefact is audible on every sustained vowel.
    - You flatten eight codebooks into one 8,192-way softmax and train. The first book learns, the second learns slowly, the eighth barely moves — because the residual books carry small, high-entropy corrections and the loss is dominated by the coarse book that already explains most of the energy.
    - An interviewer asks why "eight codebooks at 75 Hz" is about 600 tokens a second and what that costs in a 128k context. If you cannot do the multiplication and then divide, you cannot defend a context budget, a streaming design, or a latency number.

    ### The mechanisms, in full

    - **The sample rate sets the raw bill, and the hop sets everything else.** 24 kHz mono at 16 bits is $24{,}000 \times 16 = 384{,}000$ bit/s, or 384 kbps; stereo doubles it to 768 kbps. A hop of 320 samples gives $24{,}000/320 = 75$ frames per second, one frame every 13.33 ms, and every downstream number follows from that: 75 frames/s times 8 codebooks is 600 tokens/s, and 600 tokens/s times 10 bits per code is 6,000 bit/s. The hop is also the shortest event the codec can place: a 5 ms plosive burst is narrower than one frame, so its onset is smeared across the frame boundary whatever the bitrate.
    - **A mel spectrogram is fixed analysis, not compression you can invert.** 80 mel bins at a 10 ms hop is $80 \times 100 = 8{,}000$ values per second — thirteen times the codec's 600 tokens — and those values are continuous floats, so a language model cannot put a cross-entropy over them. Worse, the mel filterbank discards phase entirely, so a vocoder must invent it; that is fine when the mel came from real audio and the vocoder is only asked to sound plausible, and it is not fine when you need the output to be the signal you conditioned on.
    - **VQ-VAE is a lookup table with a gradient smuggled through it.** The encoder emits $z_e(x)$, the quantiser replaces it with the nearest entry $e_k$ of a codebook of size $K$, and the decoder reconstructs from $e_k$. The nearest-neighbour argmin has no useful gradient, so training uses the straight-through estimator: forward passes the quantised vector, backward passes the gradient as if the quantiser were the identity. The loss is reconstruction plus $\| \operatorname{sg}[z_e] - e \|^2$ (pull the codebook toward the encoder) plus $\beta \| z_e - \operatorname{sg}[e] \|^2$ (keep the encoder from growing without bound), and $\beta$ around 0.25 is the original setting.
    - **Codebook collapse is the failure mode, and its symptom is a bitrate you pay for and do not use.** If 1,024 codes are available and only 300 are ever selected, the entropy of the index is $\log_2 300 = 8.23$ bits rather than 10, so 17.7% of the bits you budgeted carry nothing. The usual causes are a dead-code initialisation, a learning rate that lets a few codes win every batch, and a decoder strong enough to ignore the codes entirely. EMA codebook updates, random restarts of dead entries, and lower-dimensional latents are the standard fixes.
    - **Residual quantisation makes the rate linear and the distortion geometric.** The first quantiser codes the latent frame; the second codes what the first got wrong; the eighth codes what the seventh got wrong. Each stage adds $\log_2 K$ bits per frame and, if it removes a fraction $\rho$ of the remaining error energy, $N_q$ stages leave $\rho^{N_q}$ of it. With $\rho = 0.5$ and 8 books that is $0.5^8 = 0.0039$, a 24 dB reduction in error energy, which is why the first two books sound intelligible and the last two only add timbre and transients.
    - **The token rate is a multiplication you should be able to do out loud.** $75 \times 8 = 600$ tokens per second; a minute is $600 \times 60 = 36{,}000$ tokens; an hour is 2.16 million, which is larger than a 1M-token window. A 16 kHz codec with a 320-sample hop runs at 50 frames/s, so eight books give 400 tokens/s; halve the hop to 160 and the same eight books give 800 tokens/s. Text at 150 words per minute and 1.3 tokens per word is $150 \times 1.3 = 195$ tokens per minute, or 3.25 tokens/s — so speech at 600 tokens/s is 185 times the token rate of the words it contains.
    - **Codebook size and codebook count trade against each other at fixed bitrate, and they are not equivalent.** At 75 frames/s, 6 kbps is 80 bits per frame: eight books of 1,024 (8 × 10 bits), or five books of 65,536 (5 × 16 bits), or sixteen books of 32 (16 × 5 bits). Bigger books mean fewer sequential stages and lower decoding depth, but each code must be visited often enough to train, and a 65,536-entry book at 75 Hz sees 75 chances per second to be used, so most entries starve. More, smaller books are easier to train and cost more sequential steps — which is exactly the latency the downstream language model pays.
    - **Flattening the books into one vocabulary is legal and usually wrong.** Eight books of 1,024 give 8,192 possible ids, and one softmax over them costs $600 \times 8{,}192 = 4.9$ million logits per second of audio; a delay-pattern scheme keeps eight 1,024-way heads and predicts one book per step, costing $600 \times 1{,}024 = 614{,}400$ logits per second — an 8× saving — at the price that the model can no longer express the joint distribution of a frame's eight codes in one factorised draw.
    - **Latency is an architectural property, not a tuning knob.** A codec built from non-causal convolutions with a one-second receptive field cannot emit frame $t$ until it has seen audio after $t$; a causal codec with a one-frame lookahead emits it 13.3 ms late. The same 320-sample hop that fixed the token rate also fixes the algorithmic latency floor, which is why streaming voice systems quote a codec frame rather than a model depth.
