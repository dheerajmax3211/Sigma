id: neural-audio-codecs
slug: neural-audio-codecs
title: "Neural Audio Codecs: Turning a Waveform into Tokens"
summary: >-
  A waveform at 24 kHz is 24,000 numbers a second, which no transformer can
  predict; a learned codec with a 320-sample hop, eight residual quantisers and
  1024-entry codebooks compresses it to 600 tokens a second at 6 kbps, and that
  single multiplication — frame rate times codebooks — is the number every audio
  model is designed around.
kind: lesson
difficulty: medium
position: 1
estMinutes: 25
prerequisites: []

body:
  big_idea: >-
    A neural codec is a learned analysis-by-synthesis compressor: residual
    quantisation turns each latent frame into a stack of codebook indices, and
    75 frames/s × 8 books is the 600 tokens/s every audio model budgets.
  problem:
    - "You flatten samples: 24 kHz is 24,000 tokens per second per channel, so a 30-second clip is 720,000 tokens before a single layer runs."
    - "You conclude a mel spectrogram is cheaper, then find your vocoder inventing phase detail the model never predicted, audible on every sustained vowel."
    - "You flatten eight codebooks into one 8,192-way softmax: the first book learns, the second slowly, the eighth barely moves."
  analogy: >-
    Sending a photograph by description. The first sentence gives the broad
    shapes, the second corrects the shapes, the third corrects the correction.
    Each is drawn from a palette of 1,024 stock phrases, so the message is a
    short list of indices rather than a grid of colours — eight corrections
    per 13.3 ms frame is 6 kbps.
  concept_points:
    - "**The sample rate sets the raw bill, and the hop sets everything else.** 24 kHz mono at 16 bits is 384 kbps; a hop of 320 samples gives $24{,}000/320 = 75$ frames per second. From there: 75 x 8 codebooks is 600 tokens/s, and 600 x 10 bits is 6 kbps. The hop is the shortest placeable event, so a 5 ms plosive smears across the boundary."
    - "**A mel spectrogram is fixed analysis, not compression you can invert.** 80 mel bins at a 10 ms hop is $80 \\times 100 = 8{,}000$ values per second — thirteen times the codec's 600 tokens — and they are continuous floats, so no cross-entropy fits over them. The filterbank also discards phase, so a vocoder must invent it."
    - "**VQ-VAE is a lookup table with a gradient smuggled through it.** The quantiser replaces $z_e(x)$ with the nearest codebook entry $e_k$, and because the argmin has no useful gradient, training uses the straight-through estimator: forward passes the quantised vector, backward passes the gradient as if the quantiser were the identity. The loss adds $\\| \\operatorname{sg}[z_e] - e \\|^2$ and $\\beta \\| z_e - \\operatorname{sg}[e] \\|^2$, with $\\beta$ near 0.25."
    - "**Residual quantisation makes the rate linear and the distortion geometric.** The first quantiser codes the frame, the second codes what the first got wrong, the eighth what the seventh got wrong. Each adds $\\log_2 K$ bits per frame and, removing a fraction $\\rho$ of the remaining error energy, leaves $\\rho^{N_q}$ of it: with $\\rho = 0.5$ and 8 books that is $0.5^8 = 0.0039$ — a 24 dB reduction."
    - "**The token rate is a multiplication you should be able to do out loud.** $75 \\times 8 = 600$ tokens per second; a minute is 36,000; an hour is 2.16 million, larger than a 1M-token window. A 16 kHz codec with a 320-sample hop runs at 50 frames/s, so eight books give 400 tokens/s; halving the hop gives 800. Text is 3.25 tokens/s, so speech is 185 times faster."
    - "**Codebook size and codebook count trade at fixed bitrate, and they are not equivalent.** At 75 frames/s, 6 kbps is 80 bits per frame: eight books of 1,024, or five of 65,536, or sixteen of 32. Bigger books mean fewer sequential stages but each code must be visited often enough to train, and a 65,536-entry book at 75 Hz starves."
  definitions:
    - term: "Sampling rate"
      meaning: >-
        The number of amplitude measurements per second. 24 kHz means 24,000
        samples per second per channel; at 16 bits that is 384 kbps of raw PCM,
        and it is the ceiling every compression ratio in this topic is measured
        against.
    - term: "Hop (frame rate)"
      meaning: >-
        The number of samples between consecutive encoder outputs. A hop of 320
        at 24 kHz gives 75 frames per second, one frame every 13.33 ms, and it
        sets both the token rate and the shortest event the codec can localise.
    - term: "Mel spectrogram"
      meaning: >-
        A fixed time–frequency analysis: a short-time Fourier transform, a
        triangular filterbank on a perceptual frequency scale, and a logarithm.
        80 bins at a 10 ms hop is 8,000 values per second. It is invertible only
        up to phase, which is discarded, so reconstruction requires a vocoder.
    - term: "VQ-VAE"
      meaning: >-
        A variational autoencoder whose latent is replaced by the nearest entry
        of a learned codebook, trained with a reconstruction loss, a codebook
        loss and a commitment loss, and differentiated through a straight-through
        estimator. It is the structure every neural audio codec inherits.
    - term: "Codebook"
      meaning: >-
        The set of $K$ learned vectors a quantiser may choose from. Each choice
        costs $\log_2 K$ bits: 1,024 entries is 10 bits, 4,096 is 12, 65,536 is
        16. A codebook that is only partly used wastes the difference between
        $\log_2 K$ and the entropy of the actual usage distribution.
    - term: "Straight-through estimator"
      meaning: >-
        The identity function used as the backward pass of a non-differentiable
        forward op such as an argmin. Forward returns the quantised vector,
        backward copies the gradient unchanged, which is biased but stable and is
        why codecs train at all.
    - term: "Commitment loss"
      meaning: >-
        $\beta \| z_e - \operatorname{sg}[e] \|^2$, the term that stops the
        encoder from moving its output faster than the codebook can follow.
        Without it the encoder can encode information in the *scale* of $z_e$,
        which the quantiser then throws away.
    - term: "Residual vector quantisation (RVQ)"
      meaning: >-
        A cascade of $N_q$ quantisers where quantiser $i$ codes the residual left
        by quantisers $1 \dots i-1$. Rate grows linearly in $N_q$, distortion
        falls roughly geometrically, and the first book carries the coarse
        structure while later books carry detail.
    - term: "Codec bandwidth"
      meaning: >-
        The bitrate of the token stream, $f_r \times N_q \times \log_2 K$. EnCodec
        at 24 kHz, 75 Hz and eight 1,024-entry books is 6 kbps; sixteen books is
        12 kbps; thirty-two is 24 kbps.
    - term: "Semantic vs acoustic tokens"
      meaning: >-
        Semantic tokens come from a self-supervised model trained to predict
        masked units and carry linguistic content at a low rate; acoustic tokens
        come from a reconstruction codec and carry speaker, prosody and channel.
        Systems that need both run two token streams or one codec with more books.
    - term: "Delay pattern"
      meaning: >-
        A scheduling trick for multi-codebook language models: codebook $i$ is
        shifted $i-1$ frames later, so each autoregressive step predicts one
        codebook for one frame and the model never needs a joint 8,192-way
        softmax. It costs a constant $N_q - 1$ frames of latency.

