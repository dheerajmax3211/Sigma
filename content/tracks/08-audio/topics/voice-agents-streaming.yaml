    - id: cp-1
      question: >-
        Your pipeline's medians are 20, 200, 100, 40, 250, 150 and 40 ms. What is
        the end-to-end median, and what happens if you halve the LLM's TTFT?
      answerKind: short_text
      hint: "Add the terms first, then change one."
      solution: >-
        $20+200+100+40+250+150+40 = 800$ ms. Halving the LLM's 250 ms to 125 ms
        gives 675 ms — a 15.6% improvement for a doubling of LLM speed. The
        endpointing term at 200 ms is a larger and cheaper target, and moving ASR
        off the critical path with stable partials removes 100 ms without a model
        change at all.

    - id: cp-2
      question: >-
        Why does a fixed silence timeout fail in both directions, and what replaces
        it?
      answerKind: short_text
      hint: "Think about what silence means for a fast speaker versus a slow one."
      solution: >-
        Silence is not evidence that a thought is finished: a speaker pausing for
        breath at 450 ms is cut off by a 500 ms timer, and a speaker who has
        finished waits the full 500 ms. Raising the timeout protects the first and
        penalises the second. A semantic end-of-turn model reads the partial
        transcript and prosody — falling pitch, completed clause, pause relative to
        the speaker's own baseline — decides in about 200 ms, and is both faster and
        more accurate.

    - id: cp-3
      question: >-
        A speech-to-speech model removes 600 ms from the turn. Name two things it
        removes that are not latency.
      answerKind: short_text
      hint: "What did the text bottleneck let you do?"
      solution: >-
        The transcript and the per-stage control surfaces. Without a text
        intermediate you cannot run a tool call on the user's words without a
        separate head or auxiliary ASR, cannot apply a text guardrail before the
        answer becomes audio, cannot show captions, and cannot measure latency per
        stage — only end to end. It also removes the ability to make the agent wait
        longer before answering, because turn-taking is baked into the weights.

  try_it: >-
    Write your own seven-term budget with the medians you believe, add them, then
    multiply each by a tail factor you can defend from a real measurement. If the
    p95 exceeds 1.5 seconds, identify the two stages to overlap rather than the two
    to optimise, and say what rollback each overlap needs.

  interview_questions:
    - question: "Walk me through the latency budget for a voice agent that must respond in under 800 ms."
      level: senior
      key_points:
        - "Seven serial terms: capture and jitter 20, endpointing 200, ASR final 100, orchestration 40, LLM TTFT 250, TTS TTFA 150, playback 40 — summing to 800."
        - "Endpointing is the largest term and the only policy term, so it is the first place to look; a semantic turn detector at 200 ms beats a 500 ms silence timer on both latency and accuracy."
        - "Partials and speculative LLM starts overlap ASR with generation, moving the 100 ms off the critical path at the cost of a rollback path."
        - "The tail is the product: with per-stage p95 multipliers the same pipeline is 1.9 s at p95, so the design target is overlap and fewer serial stages, not a faster model."
      follow_up: "Which stage would you remove first if you could only remove one, and what would break?"
    - question: "How does barge-in work, and why does it usually fail in a real room?"
      level: senior
      key_points:
        - "The agent's own playback re-enters the microphone, so an adaptive echo canceller must subtract it before the VAD sees the signal."
        - "The residual echo sets the detection threshold; lowering the threshold to catch quiet speech makes the agent interrupt itself."
        - "Stopping playback is bounded by the playback buffer and the detector frame, so the buffer is a latency parameter, not just a smoothness one."
        - "Cancellation must propagate to the LLM and TTS in flight, and conversation state must be truncated to what the user actually heard."
      follow_up: "What is the difference between ducking and stopping, and when is ducking the better choice?"
    - question: "Why would you choose a speech-to-speech model over a cascade, and what do you give up?"
      level: senior
      key_points:
        - "It collapses four serial terms into one 80 ms frame plus a forward pass plus a vocoder chunk, roughly 140 ms against 740 ms."
        - "Turn-taking and backchannels are learned behaviours, so the agent can laugh, pause, or overlap without a text token for it."
        - "You give up the transcript, which is the surface for tool calls, guardrails, captions and per-stage metrics."
        - "You also give up controllability of turn-taking: you cannot make the model wait longer, because the decision lives in the weights."
      follow_up: "How would you add tool use to a speech-to-speech agent without reintroducing the full cascade?"

  common_mistakes:
    - "Reporting median end-to-end latency and calling it the budget, when the p95 is more than twice the median and is the number users remember."
    - "Tuning the LLM because it is the biggest single median, when endpointing plus ASR finalisation is 300 ms of policy and process that can be overlapped or improved for free."
    - "Sizing the TTS first chunk in sentences rather than milliseconds of audio, so a 40-character chunk costs 267 ms of compute before any sound plays."
    - "Stopping playback on barge-in without cancelling the LLM and truncating state, so the agent believes it said things the user never heard."

  further_reading:
    - label: "Défossez, Mazaré, Orsini & Royer, Moshi: a Speech-Text Foundation Model for Real-Time Dialogue (2024)"
    - label: "Stivers et al., Universals and Cultural Variation in Turn-Taking in Conversation (Science, 2009)"
    - label: "Borsos et al., AudioLM: a Language Modeling Approach to Audio Generation (2022)"
    - label: "Skantze, Turn-taking in Conversational Systems and Human-Robot Interaction: A Review (Computer Speech & Language, 2021)"

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A voice turn is a serial chain, and the user hears the end of the chain. Add
        the terms before optimising any of them. Then ask which terms can be
        overlapped, because overlapping is the only move that removes a term's
        latency rather than shrinking it.
      blocks:
        - kind: checklist
          body: |
            - capture 20, endpoint 200, ASR 100, orchestration 40, LLM 250, TTS 150, playback 40
            - median 800 ms; with tails, 1,895 ms
            - the largest term is a policy (endpointing), not a model
            - overlap ASR with the LLM using stable partials
      checkpoint: >-
        Which two adjacent terms would you overlap first, and what does the overlap
        require you to be able to undo?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Work from the user's ear backwards. The playback buffer and TTS TTFA are
        fixed by the vendor; the LLM TTFT is a prompt-length problem; the ASR final
        can be overlapped; the endpointing is a classifier you control. Fix them in
        that order, then measure p95 rather than mean.
      blocks:
        - kind: checklist
          body: |
            - playback + TTS TTFA: choose a streaming vendor and a small first chunk
            - LLM TTFT: shorten the prompt before shrinking the model
            - ASR final: start on a stable partial, roll back on revision
            - endpointing: replace the timer with a model, tuned for false-cut cost
      checkpoint: >-
        Which of those four changes needs a rollback path, and which is safe?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The turn loop, with the two cancellations that barge-in requires.
      blocks:
        - kind: pseudocode
          body: |
            on_frame(frame):
                if vad(frame) and agent_speaking:
                    barge_in()                  # stop playback, cancel, truncate
                if vad(frame):
                    partial = asr.push(frame)
                    if stable(partial):
                        llm.prime(partial)      # speculative prefill
                if endpoint_model(partial, prosody):
                    final = asr.finalize()
                    reply = llm.generate(final)
                    tts.stream(reply)

            barge_in():
                tts.stop(); llm.cancel()
                state.truncate_to_heard()       # not to generated
      checkpoint: >-
        Why is `state.truncate_to_heard()` different from `state.truncate_to_generated()`,
        and which one is correct after a barge-in?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The two sums: medians and tails, and the cascade-versus-duplex floor.
      blocks:
        - kind: math
          body: |
            $$M = \sum_i m_i = 20+200+100+40+250+150+40 = 800\ \text{ms},$$

            $$Q = \sum_i m_i \kappa_i = 30+600+200+80+625+300+60
              = 1{,}895\ \text{ms}.$$

            Cascade to first agent audio:
            $200+100+40+250+150 = 740$ ms.
            Duplex: $80+40+20 = 140$ ms.
            Ratio $740/140 = 5.3$.
      checkpoint: >-
        Summing p95s overstates the true end-to-end p95. Why is it still the right
        planning number?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The budget calculator and the chunk arithmetic, with the numbers the topic
        quotes.
      blocks:
        - kind: code
          language: python
          body: |
            stages = [("capture", 20, 1.5), ("endpoint", 200, 3.0),
                      ("asr", 100, 2.0), ("orch", 40, 2.0),
                      ("llm", 250, 2.5), ("tts", 150, 2.0), ("playback", 40, 1.5)]
            print(sum(m for _, m, _ in stages))          # 800
            print(sum(m * f for _, m, f in stages))      # 1895.0

            chars_per_s, rtf = 15.0, 0.1
            for chars in (6, 40):
                audio = chars / chars_per_s
                print(chars, round(audio, 3), round(audio * 1000 * rtf, 1))
            # 6 0.4 40.0   |   40 2.667 266.7
      checkpoint: >-
        If the TTS's RTF were 0.6 instead of 0.1, which line of the budget changes
        and which does not?
