  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        There are no frame labels, so every method has to invent a way to train
        without them. CTC sums over alignments and adds a blank. RNN-T sums over a
        grid and keeps a prediction network. Attention learns an alignment. Pick
        which one you are looking at by asking what its lattice is.
      blocks:
        - kind: checklist
          body: |
            - 100 frames per second at a 10 ms hop
            - CTC: T x (2U+1) states, blank separates repeats
            - RNN-T: T x (U+1) lattice, one joiner call per node
            - attention: no monotonic constraint, no streaming
            - WER: (S + D + I) / N, with N the reference word count
      checkpoint: >-
        Which of the three can emit a word before the sentence ends, and what
        property of its encoder makes that possible?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Decide latency first. If the product needs partials under 500 ms, the
        choice is a causal encoder with chunked attention and either CTC or RNN-T
        on top. If it needs the best transcript and can wait for a window, an
        attention encoder-decoder is the strongest option — and then guard it with
        a VAD so silence does not become a hallucination.
      blocks:
        - kind: checklist
          body: |
            - window 30 s -> 3,000 mel frames -> 1,500 positions
            - attention cost is positions squared: 1,500 squared = 2.25M per head per layer
            - chunk 320 ms = 32 frames; 2 s left context = 200 frames
            - CTC: one pass; RNN-T: 21,000 joiner calls for 1,000 frames x 21 tokens
      checkpoint: >-
        Which latency term does the lookahead belong to, and which one does the left
        context belong to?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Three decoders, one collapse. The collapse function is shared and it is four
        lines.
      blocks:
        - kind: pseudocode
          body: |
            collapse(path, blank):
                out = []
                prev = None
                for p in path:
                    if p != prev and p != blank:
                        out.append(p)
                    prev = p
                return out

            ctc_decode(logits):            # logits: T x (V+1)
                return collapse(argmax(logits, axis=1))

            rnnt_decode(h, predictor, joiner, max_u):
                u = 0; out = []
                for t in range(len(h)):
                    while u < max_u:
                        p = joiner(h[t], predictor(out))
                        if argmax(p) == blank: break
                        out.append(argmax(p)); u += 1
                return out
      checkpoint: >-
        In `rnnt_decode`, why can the inner loop emit several labels at one frame,
        and what does that imply about output timing?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The CTC forward recursion and the WER edit distance, both written out.
      blocks:
        - kind: math
          body: |
            CTC, over the extended label sequence
            $\ell = (\varnothing, y_1, \varnothing, \dots, y_U, \varnothing)$:

            $$\alpha_t(s) = \Big(\alpha_{t-1}(s) + \alpha_{t-1}(s-1)
              + [\ell_s \neq \varnothing \wedge \ell_s \neq \ell_{s-2}]\,
              \alpha_{t-1}(s-2)\Big) p(\ell_s \mid x_t).$$

            $$p(y \mid x) = \alpha_T(2U) + \alpha_T(2U+1).$$

            WER:

            $$d(i,j) = \min\{d(i-1,j)+1,\ d(i,j-1)+1,\
              d(i-1,j-1)+[r_i \neq h_j]\},$$

            $$\text{WER} = \frac{S + D + I}{N}.$$
      checkpoint: >-
        Why is the skip transition conditioned on the two labels being different,
        and what would break if it were unconditional?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        Collapse and WER, implemented and checked against the worked examples in the
        text.
      blocks:
        - kind: code
          language: python
          body: |
            def collapse(path, blank=0):
                out, prev = [], None
                for p in path:
                    if p != prev and p != blank:
                        out.append(p)
                    prev = p
                return out

            # collapse([1, 2, 3, 3, 4])          -> [1, 2, 3, 4]      "helo"
            # collapse([0,1,0,2,0,3,0,3,0,4,0])  -> [1, 2, 3, 3, 4]  "hello"

            def wer(ref, hyp):
                r, h = ref.split(), hyp.split()
                n, m = len(r), len(h)
                d = [[0] * (m + 1) for _ in range(n + 1)]
                for i in range(n + 1): d[i][0] = i
                for j in range(m + 1): d[0][j] = j
                for i in range(1, n + 1):
                    for j in range(1, m + 1):
                        d[i][j] = min(d[i-1][j] + 1, d[i][j-1] + 1,
                                      d[i-1][j-1] + (r[i-1] != h[j-1]))
                return d[n][m] / n

            # wer("the cat sat on the mat", "the cat sat on a mat")  -> 0.1667
            # wer("please call stella", "please call stella and ask her") -> 1.0
      checkpoint: >-
        The WER function returns edit distance over N. What does it return for an
        empty reference, and why is that case worth guarding?
  implementations:
    - language: python
      title: "CTC forward against brute force, and the collapse rule"
      note: >-
        Computes the CTC marginal for two labels over three frames with the forward algorithm and checks it against brute-force enumeration of all 27 paths, so the blank-skipping transition is verified rather than asserted. The collapse examples show why a repeated label needs a blank between its emissions, and the 3x3 shape is the only reason enumeration is possible: the real forward pass runs in log space over thousands of frames.
      code: |
        import itertools
        import numpy as np

        BLANK = 0


        def logsumexp(x):
            m = np.max(x)
            return -np.inf if not np.isfinite(m) else m + np.log(np.exp(x - m).sum())

        def ctc_logprob(logp, labels):
            ext = [BLANK]
            for y in labels:
                ext += [y, BLANK]
            T, S = len(logp), len(ext)
            a = np.full((T, S), -np.inf)
            a[0, 0] = logp[0, BLANK]
            if S > 1:
                a[0, 1] = logp[0, ext[1]]
            for t in range(1, T):
                for s in range(S):
                    opts = [a[t - 1, s]]
                    if s >= 1:
                        opts.append(a[t - 1, s - 1])
                    if s >= 2 and ext[s] != BLANK and ext[s] != ext[s - 2]:
                        opts.append(a[t - 1, s - 2])
                    a[t, s] = logsumexp(np.array(opts)) + logp[t, ext[s]]
            return logsumexp(a[T - 1, max(S - 2, 0):])

        def collapse(path):
            out, prev = [], None
            for p in path:
                if p != prev and p != BLANK:
                    out.append(int(p))
                prev = p
            return out


        def brute_force(logp, labels):
            total = -np.inf
            for path in itertools.product(range(logp.shape[1]), repeat=len(logp)):
                if collapse(path) == list(labels):
                    total = np.logaddexp(total, sum(logp[t, p] for t, p in enumerate(path)))
            return total

        def main():
            logp = np.log(np.array([[.6, .3, .1], [.1, .6, .3], [.6, .3, .1]]))
            labels = [1, 2]
            fwd, bf = ctc_logprob(logp, labels), brute_force(logp, labels)
            print(f"CTC forward log P = {fwd:.6f}; brute force = {bf:.6f}")
            print(f"collapse([1,1,0,2]) = {collapse([1, 1, 0, 2])}; "
                  f"[1,0,1,2] = {collapse([1, 0, 1, 2])}")

            assert abs(fwd - bf) < 1e-9
            assert collapse([1, 1, 0, 2]) == [1, 2] and collapse([1, 0, 1, 2]) == [1, 1, 2]
            assert collapse([2, 2, 0, 1]) == [2, 1]


        if __name__ == "__main__":
            main()
  problems:
    - id: asr-ctc-collapse
      title: "Apply the CTC collapse rule"
      difficulty: easy
      prompt: >-
        Merge consecutive repeated labels, then delete blanks (0). Return the resulting label
        sequence for a frame-level path.
      language: python
      entry: collapse
      testCases:
        - input: '{"path": [1, 1, 0, 2]}'
          expected: "[1, 2]"
          tolerance: 1e-6
        - input: '{"path": [1, 0, 1, 2]}'
          expected: "[1, 1, 2]"
          tolerance: 1e-6
        - input: '{"path": [0, 0, 3, 3, 0]}'
          expected: "[3]"
          tolerance: 1e-6
      solution: |
        def collapse(path, blank=0):
            out, prev = [], None
            for p in path:
                if p != prev and p != blank:
                    out.append(p)
                prev = p
            return out
      solutionExplanation: >-
        The repeated 1 merges to one, but two 1s separated by a blank stay separate. Without the
        blank, hello's double l is impossible to emit.
      tags: [asr, ctc]
