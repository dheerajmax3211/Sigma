    - type: compare
      title: "CTC and RNN-T: same lattice, different independence assumption"
      left_label: "CTC"
      left_points:
        - "Outputs are conditionally independent given the input: p(pi|x) factorises over frames"
        - "Forward-backward over T x (2U+1) states; one blank symbol separates repeated labels"
        - "Non-autoregressive at inference: one frame-synchronous pass, then collapse"
        - "No internal language model, so an external LM helps a lot — and is often mandatory"
        - "Streams trivially, because each frame's decision depends only on the encoder state"
      right_label: "RNN-T"
      right_points:
