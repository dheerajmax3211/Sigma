id: automatic-speech-recognition
slug: automatic-speech-recognition
title: "Automatic Speech Recognition: CTC, RNN-T, and Whisper"
summary: >-
  ASR is a sequence mapping with no alignment: 100 audio frames per second on one
  side, a few characters per second on the other, and no labels saying which frame
  produced which letter. CTC marginalises over every monotonic alignment and pays
  with conditional independence; RNN-T keeps a language model inside the lattice
  and pays with a two-dimensional search; Whisper attends over a fixed 30-second
  window and pays with latency and hallucination on silence.
kind: lesson
difficulty: medium
position: 3
estMinutes: 24
prerequisites: [speech-synthesis-tts]

body:
  big_idea: >-
    Every ASR architecture answers one question: how to train when nobody said
    which frame produced which character. CTC sums monotonic alignments, RNN-T
    a lattice with history, attention a soft alignment.
  problem:
    - "You have 100 frames per second and four characters, the transcript has no timestamps, and a plain cross-entropy over frames has nothing to train against."
    - "You build CTC, it trains, and its output is repeated letters and blanks: getting the collapse rule wrong turns \"hello\" into \"helo\" silently."
    - "You ship Whisper as streaming and the first partial arrives 30 s late: every input is padded to 30 s and encoded bidirectionally."
  analogy: >-
    Transcribing a meeting from a recording whose timestamps are lost. You
    know the words and the length, not where each word starts. CTC's answer is
    to consider every monotonic placement, score each, and sum — training the
    acoustic model so the total probability of all placements that spell the
    transcript goes up. It never commits to one alignment, which is why it
    needs a blank symbol.
  concept_points:
    - "**The frame rate sets the size of the problem.** 16 kHz audio with a 10 ms hop is 100 frames per second; a 30-second window is 3,000 frames, and one stride-2 convolution in the encoder halves that to 1,500 positions. Frame-synchronous decoders therefore make 100 decisions per second, most of which are \\\"nothing happened\\\" — which is what the CTC blank is for."
    - "**Whisper's encoder is a fixed 30-second, fully bidirectional transformer.** It takes 80 log-mel bins, pads or trims every input to 30 seconds, and produces 1,500 positions. Self-attention over 1,500 positions is $1{,}500^2 = 2.25$ million scores per head per layer; with 20 heads and 32 layers that is **1.44 billion scores** per window, 2.88 GB in fp16 if materialised — hence fused attention kernels."
    - "**Padding to 30 seconds makes cost independent of clip length.** A 2-second clip and a 30-second clip both run 1,500 encoder positions, so the short clip costs fifteen times its proportional share. For a voice agent sending 2-second utterances this is the largest avoidable compute cost in the stack, and the fix is a different model, not a shorter window."
    - "**CTC trains by marginalising, and marginalising buys conditional independence.** It maximises $\\log \\sum_{\\pi \\in \\mathcal{B}^{-1}(y)} p(\\pi \\mid x)$ with $p(\\pi \\mid x) = \\prod_t p(\\pi_t \\mid x)$: given the input, every frame's label is independent of every other frame's. That makes the sum tractable by forward-backward over $T \\times (2U+1)$ states, and it means the model has no internal language model."
    - "**The collapse rule is where CTC is implemented wrong.** Merge consecutive identical labels, then delete blanks. \\\"hello\\\" is $h, e, l, l, o$: the two $l$'s must be separated by a blank or they merge, so a valid path is $\\varnothing, h, \\varnothing, e, \\varnothing, l, \\varnothing, l, \\varnothing, o, \\varnothing$. Drop that blank and the same path decodes to \\\"helo\\\". The blank is a separator, not a pause."
    - "**RNN-T keeps history and pays in two dimensions.** The encoder emits $h_t$, a prediction network emits $g_u$ from previously emitted labels, and a joiner scores every pair at each lattice point $(t, u)$: 1,000 frames and 21 labels is **21,000 joiner evaluations**. Because the encoder can be causal and the prediction network needs only the past, RNN-T streams naturally, and seeing both sides calibrates it better than CTC."
  definitions:
    - term: "Log-mel spectrogram"
      meaning: >-
        The input representation: a mel filterbank applied to a short-time Fourier
        transform, then a logarithm. Whisper uses 80 bins (128 in large-v3) with a
        10 ms hop at 16 kHz, so 30 seconds is 3,000 frames before the encoder's
        stride-2 convolution halves it to 1,500 positions.
    - term: "CTC (connectionist temporal classification)"
      meaning: >-
        A loss that marginalises over all monotonic alignments between frames and
        labels by introducing a blank symbol and summing path probabilities with a
        forward-backward recursion. It is non-autoregressive at inference and
        assumes conditional independence across frames.
    - term: "Blank token"
      meaning: >-
        The extra output symbol that means "no label here". It absorbs the majority
        of frames, separates repeated labels during collapse, and is the reason a
        frame-synchronous model can emit nothing at all.
    - term: "Collapse function"
      meaning: >-
        The deterministic map from a frame-level path to a label sequence: merge
        consecutive duplicates, then remove blanks. Every CTC decoder ends with it,
        and every CTC bug starts with it.
    - term: "Conditional independence"
      meaning: >-
        The assumption that $p(\pi \mid x) = \prod_t p(\pi_t \mid x)$ — frame
        labels are independent given the acoustics. It makes CTC's sum tractable
        and removes any internal language model, which is why CTC output benefits so
        much from an external LM.
    - term: "RNN-Transducer (RNN-T)"
      meaning: >-
        An architecture with an encoder, a prediction network over previous labels,
        and a joiner that scores every (frame, label) pair. It defines a
        distribution over monotonic alignments on a 2-D lattice, streams with a
        causal encoder, and is the default for on-device dictation.
    - term: "Prediction network"
      meaning: >-
        The label-side recurrent (or transformer) stack in an RNN-T. It plays the
        role of an internal language model: it turns the labels emitted so far into
        a vector the joiner can combine with the encoder state.
    - term: "Joiner"
      meaning: >-
        The small network that combines encoder state $h_t$ and prediction state
        $g_u$ into a distribution over the vocabulary plus blank. It is evaluated
        once per lattice point, which is what makes RNN-T training memory-hungry.
    - term: "Cross-attention"
      meaning: >-
        Decoder-to-encoder attention in a seq2seq ASR model. Unlike CTC's implicit
        alignment it is learned and unconstrained, so it can skip, revisit, or
        attend to padding — the mechanism behind hallucination on silence.
    - term: "Word error rate (WER)"
      meaning: >-
        $(S + D + I)/N$ over words, computed from the minimum-edit-distance
        alignment. A few percent on clean read speech, and substantially worse on
        accented, noisy or domain-shifted audio — which is why the corpus matters
        more than the second decimal place.
    - term: "Chunked attention"
      meaning: >-
        An attention mask that limits each position to a fixed left context and a
        small right lookahead, so the encoder can run incrementally. Chunk size
        sets the latency floor, left context sets the compute, lookahead sets the
        accuracy on coarticulated sounds.
    - term: "Timestamp tokens"
      meaning: >-
        Special vocabulary entries that mark time in Whisper's output, letting one
        decoder produce both text and alignment. They are what makes long-form
        transcription possible without a separate aligner.

