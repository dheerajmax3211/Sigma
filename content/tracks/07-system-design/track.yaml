track:
  id: staff
  slug: staff
  title: "Staff and Principal MLE"
  subtitle: "System design, capacity arithmetic, and the decisions that survive an interview"
  description: >-
    The round that separates a senior candidate from a staff one: given a vague
    problem, produce a defensible architecture with numbers attached. Every
    topic here is a decision record — the constraint, the alternatives that were
    rejected, the arithmetic that chose between them, and the failure mode that
    shows up at 10x scale.
  tier: 5
  color: "#f97316"
  sortOrder: 7
  outcomes:
    - "Run the repeated system-design framework: clarify, bound, size, draw, then defend."
    - "Estimate QPS, storage, bandwidth, and node count from stated assumptions, and show the arithmetic."
    - "Choose between retrieval, ranking, and serving architectures using measured tradeoffs rather than preference."
    - "Explain how a frontier model is trained and served, including the parallelism strategy and its communication cost."
    - "Identify the first bottleneck at 10x scale and name the mitigation before being asked."
topics: []
