  implementations:
    - language: python
      title: "Why one dot product cannot express a conjunction"
      note: >-
        A text encoder turns the query red car into one vector that weights the adjective more than the noun. The dot product then prefers a red truck because redness dominates, while a late-interaction score that keeps the attributes separate (the minimum of the two matches) returns the red car. This is the alignment-versus-ordering distinction the case study insists on; the vectors are illustrative, not a trained CLIP.
      code: |
        import numpy as np

        DIM = 16
        # (name, redness, car-ness): a caption is a conjunction of two attributes.
        ITEMS = [
            ("red car", 1.0, 1.0),
            ("red truck", 2.2, 0.2),
            ("blue car", -1.8, 1.0),
            ("blue truck", -2.0, -0.2),
            ("green car", -0.2, 1.1),
            ("green truck", -0.1, -1.2),
        ]
        RERANK_FLOPS_PER_PAIR = 2 * 0.3e9 * 288


        def embed(redness, carness, rng):
            v = np.zeros(DIM)
            v[0], v[1] = redness, carness
            v[2:] = rng.normal(scale=0.02, size=DIM - 2)
            return v / np.linalg.norm(v)


        def main():
            rng = np.random.default_rng(0)
            images = [embed(r, c, rng) for _, r, c in ITEMS]
            query = embed(1.0, 0.4, rng)          # "red car": the text tower weights "red" more

            dot = [float(query @ im) for im in images]
            # Late interaction keeps the attributes separate instead of summing them:
            # score = min(redness match, car-ness match).
            conj = [min(im[0], im[1]) for im in images]
            dot_top = ITEMS[int(np.argmax(dot))][0]
            conj_top = ITEMS[int(np.argmax(conj))][0]
            print(f"single dot-product top-1: {dot_top}")
            print(f"attribute conjunction top-1: {conj_top}")

            ms = 100 * RERANK_FLOPS_PER_PAIR / 400e12 * 1e3
            print(f"rerank 100 pairs: {ms:.1f} ms of a 60 ms budget")
            print(f"index: 500M x 512 x 4 B = {500e6*512*4/1e12:.2f} TB fp32, "
                  f"{500e6*64/1e9:.0f} GB as PQ-64")

            assert dot_top == "red truck"        # redness overwhelms the conjunction
            assert conj_top == "red car"
            assert ms < 60
            assert abs(RERANK_FLOPS_PER_PAIR - 172.8e9) < 1


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-multimodal-cosine
      title: "Cosine score of one attribute vector"
      difficulty: easy
      prompt: >-
        Return the cosine similarity between an image vector `(redness, carness)` and a text
        query vector `(q_red, q_car)`. Use it to compare the red car (1.0, 1.0) with the red
        truck (2.2, 0.2) for the query (1.0, 0.4).
      language: python
      entry: cosine_score
      testCases:
        - input: '{"redness": 1.0, "carness": 1.0}'
          expected: "0.919145"
          tolerance: 1e-6
        - input: '{"redness": 2.2, "carness": 0.2}'
          expected: "0.958288"
          tolerance: 1e-6
      solution: |
        import math

        def cosine_score(redness, carness, q_red=1.0, q_car=0.4):
            return (redness * q_red + carness * q_car) / (
                math.hypot(redness, carness) * math.hypot(q_red, q_car))
      solutionExplanation: >-
        The truck scores higher because the query weights redness, which is the single-vector
        conjunction failure. Keeping the attributes separate and taking the minimum returns the
        car.
      tags: [retrieval, multimodal]
