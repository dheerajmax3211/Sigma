  interview_questions:
    - question: "Why not use a single joint index for text and images?"
      level: senior
      key_points:
        - "A text query cannot return a passage, so scanning the 800M-vector text index is pure waste: partitioning cuts the dominant path from 1.3e9 to 5e8 codes, 62% less work."
        - "Text embeddings cluster more tightly than image embeddings, so a joint index can fill the shortlist with near-duplicate captions before any image appears."
        - "Separate indexes allow different refresh cadences: images rebuild daily, text needs 15-minute upserts."
        - "The cost is asymmetric utilisation — the text index is 1.6x larger and gets a fifth of the traffic — which has to be planned rather than discovered."
      follow_up: "How would you handle a query that genuinely mixes modalities, like 'find images and passages about this'?"
    - question: "Walk me through the cost of reranking the top 100."
      level: staff
      key_points:
        - "A 0.3B cross-encoder over a 288-token pair is 2 x 3e8 x 288 = 173 GFLOP, or 0.43 ms at 400 TFLOP/s."
        - "One hundred pairs is 43 ms of GPU time per query, 29% of a 150 ms budget and the largest single stage."
        - "At 6,944 peak qps that is 300 GPUs, so the fleet is linear in both pairs and rate and independent of index size."
        - "A 60 ms budget affords 139 pairs, which is why 'rerank the top 1,000' implies a 432 ms stage and 3,000 GPUs."
      follow_up: "What measurement would convince you that 50 pairs is enough?"
    - question: "Your dual encoder has great recall but bad ordering on compositional queries. What do you do?"
      level: staff
      key_points:
        - "A dot product compresses a whole caption into one vector, so conjunction and negation are not representable — this is structural, not a training deficiency."
        - "The fix is a fusion reranker that sees text and image jointly over a shortlist, which is why the two-stage architecture is standard."
        - "Reranking cannot recover an item missing from the shortlist, so recall depth and rerank depth are separate budgets."
        - "If composition dominates traffic, the rerank stage deserves more of the 150 ms and a wider shortlist; if it is rare, dual-encoder ordering is enough."
      follow_up: "What would you do differently for negation, which even cross-encoders handle poorly?"
    - question: "Recall drops from 0.90 to 0.62 on mobile traffic. Is that an index problem?"
      level: senior
      key_points:
        - "Almost certainly not: phone images are compressed, rotated, and cropped, so the image tower's embeddings are out of distribution."
        - "The index returns the nearest vectors it has; if the query vector is in the wrong region, the nearest neighbours are meaningless."
        - "Mitigate by augmenting training with the real capture pipeline and monitoring embedding norm and neighbour-distance distributions per client type."
        - "Measure recall per segment against brute force, because the aggregate number hides exactly this failure."
      follow_up: "How would you detect this before a user report, using only production telemetry?"
  common_mistakes:
    - "Indexing text and images in one space and scanning 1.3B vectors per query when the target modality holds 500M."
    - "Reranking the top 1,000 because it sounds thorough: 432 ms of GPU time and 3,000 GPUs at peak."
    - "Reporting one aggregate recall number across query types, hiding the direction where the encoder is out of distribution."
    - "Training with large in-batch negatives without filtering true matches, then wondering why alignment plateaus."
