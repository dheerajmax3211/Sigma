  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        An index is a bet about which bytes you can afford to keep. Full vectors
        plus a graph is the most accurate and the most expensive; compressed codes
        are the cheapest and the least accurate; keeping the graph in RAM and the
        vectors on disk is the middle. Pick the bet, then pay for the recall you
        gave up.
      blocks:
        - kind: checklist
          body: |
            - Raw bytes = vectors x dims x bytes
            - Graph bytes = vectors x M x 4
            - Code bytes = vectors x m
            - Scan bytes = nprobe x (N / nlist) x code size
            - Cluster p99 grows with shard count
      checkpoint: >-
        Which of those five numbers would you quote first to someone who asked
        "will this fit", and why?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Fix the recall target, then the memory budget, then the latency budget.
        A recall target of 0.9 permits compression plus rerank; 0.99 does not.
        Once the family is chosen, shard for memory and check the tail, because
        the scatter-gather will cost you more p99 than the index does.
      blocks:
        - kind: warning
          body: >-
            Do not benchmark index libraries on a million vectors and extrapolate.
            Build cost, recall and memory all change with N in ways that a
            million-vector test cannot show, and the build is memory-latency bound
            in a way that only appears at scale.
      checkpoint: >-
        Your recall target is 0.99 and your RAM budget is two nodes. What are your
        three honest options?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Size, then scan, then shard.
      blocks:
        - kind: pseudocode
          body: |
            raw   = N * d * 4
            hnsw  = N * (d*1 + M*4)
            ivfpq = N * (m + 8)
            scan  = nprobe * (N/nlist) * (m+8)
            nodes = ceil(index_bytes / usable_ram)
            p99_cluster ~ per_shard_p99 at (1 - 0.99**shards)
            build = N * hops * d * b / random_bw
      checkpoint: >-
        Which line would change most if the vectors were 256-dimensional instead
        of 768, and which would not change at all?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Memory per family, scan bandwidth, and tail amplification.
      blocks:
        - kind: math
          body: |
            **Memory.**
            $$M_{\text{HNSW}} = N(d b_v + 4M), \quad M_{\text{PQ}} = N(m + 8)$$

            **Scan bytes.**
            $$B = n_{\text{probe}}\frac{N}{n_{\text{list}}}(m+8)$$

            **Tail.**
            $$P(\text{any shard} > \text{p99}) = 1 - 0.99^{S}$$
      checkpoint: >-
        Compute the scan bytes at nprobe=32, nlist=262,144, m=96. Do you get about
        11.7 MB?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The two-node IVF-PQ design with a rerank, and the nine-node HNSW it
        competes with.
      blocks:
        - kind: code
          language: python
          body: |
            N, d, m, nlist, nprobe, M = 1e9, 768, 96, 262144, 32, 16
            raw   = N*d*4
            hnsw  = N*(d*1 + M*4) + N*8
            ivf   = N*(m + 8) + nlist*d*4
            scan  = nprobe * (N/nlist) * (m+8)
            print(round(raw/1e12,2), round(hnsw/1e9,0), round(ivf/1e9,0),
                  round(scan/1e6,1), round(1-0.99**9,3))
      checkpoint: >-
        The printed tail probability is for nine shards. What is it for two, and
        does that change your sharding decision?
  implementations:
    - language: python
      title: "A product quantizer with measured recall and a rerank"
      note: >-
        Trains eight 16-centroid codebooks on 2,000 synthetic vectors, encodes each to 8 bytes, and ranks with asymmetric distance tables. PQ recall@10 is 0.25 at this deliberately coarse setting; rescoring the top 100 with exact vectors restores 1.00. The 16x ratio is smaller than the case study's 29.5x because m=8 and K=16 here, chosen so the snippet trains in under a second.
      code: |
        import numpy as np

        N, D, M, K, NQ, TOPK, RERANK = 2_000, 32, 8, 16, 50, 10, 100


        def kmeans(x, k, iters=8, seed=0):
            rng = np.random.default_rng(seed)
            c = x[rng.choice(len(x), k, replace=False)].copy()
            for _ in range(iters):
                lab = np.argmin(((x[:, None, :] - c[None]) ** 2).sum(-1), axis=1)
                c = np.stack([x[lab == j].mean(0) if np.any(lab == j) else c[j]
                              for j in range(k)])
            return c


        def encode(x, books):
            sub = x.reshape(len(x), len(books), -1)
            return np.stack([np.argmin(((sub[:, i, None] - cb) ** 2).sum(-1), axis=1)
                             for i, cb in enumerate(books)], axis=1)


        def adc(queries, codes, books):
            """Asymmetric distance: one lookup table per query, then m lookups."""
            m = len(books)
            sub = np.asarray(queries).reshape(len(queries), m, -1)
            out = []
            for qi in range(len(queries)):
                tables = np.stack([((cb - sub[qi, i]) ** 2).sum(1)
                                   for i, cb in enumerate(books)])
                out.append(tables[np.arange(m)[None, :], codes].sum(1))
            return np.stack(out)


        def main():
            rng = np.random.default_rng(1)
            centers = rng.normal(size=(20, D))
            x = centers[rng.integers(0, 20, N)] + rng.normal(scale=0.5, size=(N, D))
            q = centers[rng.integers(0, 20, NQ)] + rng.normal(scale=0.5, size=(NQ, D))
            books = [kmeans(x.reshape(N, M, -1)[:, i], K, seed=i) for i in range(M)]
            codes = encode(x, books)
            print(f"bytes/vector: {M} vs {D*4} raw ({D*4/M:.0f}x compression)")

            exact = np.argsort(((q[:, None] - x[None]) ** 2).sum(-1), axis=1)[:, :TOPK]
            approx = np.argsort(adc(q, codes, books), axis=1)
            short = approx[:, :RERANK]
            d = ((q[:, None, :] - x[short]) ** 2).sum(-1)
            reranked = np.take_along_axis(short, np.argsort(d, axis=1)[:, :TOPK], axis=1)

            def recall(ids):
                return float(np.mean([len(set(a) & set(b)) / TOPK for a, b in zip(ids, exact)]))

            print(f"recall@10 PQ-ADC: {recall(approx[:, :TOPK]):.2f}; "
                  f"after rerank {RERANK}: {recall(reranked):.2f}")
            assert recall(reranked) > recall(approx[:, :TOPK]) and recall(reranked) > 0.95


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-vector-pq-ratio
      title: "Compression ratio of a product quantizer"
      difficulty: easy
      prompt: >-
        A vector of `dim` float32 values is encoded as `m` bytes, one per subquantiser. Return
        the compression ratio against raw float32.
      language: python
      entry: compression_ratio
      testCases:
        - input: '{}'
          expected: "16"
          tolerance: 1e-6
        - input: '{"dim": 768, "m": 96}'
          expected: "32"
          tolerance: 1e-6
      solution: |
        def compression_ratio(dim=32, m=8, bytes_per=4):
            return dim * bytes_per / m
      solutionExplanation: >-
        32 dims * 4 bytes / 8 codes = 16x. The case study's 768 dims and 96 codes give 32x, the
        difference between 2 TB and 96 GB.
      tags: [vector-search, quantization]
