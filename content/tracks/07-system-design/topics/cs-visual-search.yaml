          tolerance: 1e-6
      solution: |
        def scan_mb(n=1e9, nlist=65536, nprobe=64, code_bytes=64):
            return nprobe * (n / nlist) * code_bytes / 1e6
      solutionExplanation: >-
        64 probes over 15,259 vectors at 64 bytes is 62.5 MB. The same probe against fp32 would
        be 8x larger, which is the entire argument for codes.
