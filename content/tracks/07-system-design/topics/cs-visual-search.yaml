  interview_questions:
    - question: "Why can you not just brute-force a billion vectors?"
      level: senior
      key_points:
        - "One query reads 2.048 TB of fp32 vectors; at 3.35 TB/s that is 611 ms before any arithmetic."
        - "At 5,787 mean queries per second the cluster would need 11.9 PB/s of bandwidth, which is not a hardware configuration that exists."
        - "IVF-PQ scans 62.5 MB by touching 64 of 65,536 lists — a factor of roughly 32,000 fewer bytes."
        - "The bottleneck in image retrieval is memory bandwidth, not FLOPs, which is why compression is the primary lever."
      follow_up: "What does that tell you about the relative value of a faster GPU versus a better quantiser?"
    - question: "You need 0.97 recall@10. Walk me through what that costs."
      level: staff
      key_points:
        - "Recall is bought with nprobe, and bytes scanned rise linearly: 64 to 128 probes doubles the 62.5 MB per query."
        - "At 17,361 peak qps, doubling scan bytes means doubling shards from 16 to 32, which also worsens fan-out tail latency."
        - "Reranking more candidates is cheap and fixes ordering, but cannot recover a neighbour that was never in a scanned list."
        - "The durable fix is encoder quality on query-like images, which requires re-embedding a billion images and a full rebuild."
      follow_up: "How would you measure recall continuously in production without running brute force on live traffic?"
    - question: "Why is p99 worse than your per-shard p99 suggests?"
      level: staff
      key_points:
        - "With 16 independent shards each exceeding p99 with probability 0.01, at least one does so with probability 1 - 0.99^16 = 0.148."
        - "The query waits for the slowest shard, so fan-out p99 is roughly a single shard's p99.9."
        - "Retries amplify the problem by adding load precisely when a shard is already slow."
        - "Mitigations are hedged requests to replicas, per-shard deadlines with partial results, or fewer larger shards."
      follow_up: "What is the cost of hedging, and when would you turn it off?"
    - question: "How do you handle ten million new images a day without a nightly outage?"
      level: senior
      key_points:
        - "1e7 inserts/day is 116/s: assign to the nearest existing centroid, append the code, keep fp16 vectors on NVMe."
        - "Deletes become tombstones filtered at merge time, which costs scan bandwidth and grows over time."
        - "Rebuild into a shadow index and swap atomically; the trigger is list-size skew and tombstone ratio, not the calendar."
        - "A full rebuild needs roughly 2x index memory or a disk-resident shadow, which must be in the capacity plan from day one."
      follow_up: "What metric tells you a rebuild is urgent rather than merely due?"
  common_mistakes:
    - "Sizing the index in vectors rather than bytes: 1e9 x 512 x 4 B is 2.05 TB, and the cluster you drew cannot hold it."
    - "Choosing HNSW for recall and then discovering the graph adds ~128 B per vector that does not compress."
    - "Measuring recall@10 on the queries used to tune nprobe, then shipping a number that production does not reproduce."
    - "Sharding for capacity when the constraint is aggregate scan bandwidth: 1.09 TB/s at peak, 68 GB/s per shard."
