  implementations:
    - language: python
      title: "Scan bytes and tail amplification across sixteen shards"
      note: >-
        PQ-64 is 64 GB for a billion vectors and a 64-list probe reads 62.5 MB, which at 17,361 QPS is 1.09 TB/s cluster-wide. The latency simulation draws lognormal shard service times with a 5 ms mean and shows the cluster p99 is the p99 of the maximum, about 1.21x a single shard's p99. It assumes independent shards; a shared bottleneck would couple them.
      code: |
        import numpy as np

        N, D, PQ_BYTES, NLIST, NPROBE = 1_000_000_000, 512, 64, 65_536, 64
        SHARDS, QPS, READ_GBPS = 16, 17_361, 200


        def index_bytes():
            return {"fp32": N * D * 4, "int8": N * D, "pq": N * PQ_BYTES}


        def scan_bytes(nlist=NLIST, nprobe=NPROBE, code_bytes=PQ_BYTES):
            return nprobe * (N / nlist) * code_bytes


        def shard_latency(seed=3, shards=SHARDS):
            """Lognormal shard service times; the cluster waits for the slowest shard."""
            rng = np.random.default_rng(seed)
            n, sigma = 20_000, 0.22
            mu = np.log(5e-3) - 0.5 * sigma**2          # 5 ms mean
            lat = rng.lognormal(mu, sigma, size=(n, shards))
            return np.percentile(lat, 99, axis=0), np.percentile(lat.max(1), 99)


        def main():
            b = index_bytes()
            print(f"index: fp32 {b['fp32']/1e12:.2f} TB; int8 {b['int8']/1e9:.0f} GB; "
                  f"PQ-64 {b['pq']/1e9:.0f} GB")

            s = scan_bytes()
            print(f"scan: {s/1e6:.1f} MB/query -> {s*QPS/1e12:.2f} TB/s cluster-wide; "
                  f"{s/READ_GBPS/1e9*1e3:.2f} ms on one node")

            per_shard, cluster = shard_latency()
            print(f"p99 per shard ~{per_shard.mean()*1e3:.1f} ms; cluster p99 "
                  f"~{cluster*1e3:.1f} ms ({cluster/per_shard.mean():.2f}x tail amplification)")

            assert b["fp32"] == 2.048e12 and b["pq"] == 64e9
            assert abs(s / 1e6 - 62.5) < 0.1
            assert cluster > per_shard.mean()
            assert 8 < cluster * 1e3 < 15


        if __name__ == "__main__":
            main()
