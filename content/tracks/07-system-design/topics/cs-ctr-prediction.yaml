          body: |
            - 1e9 x 64 x 4 x 3 = 768 GB, not "a billion parameters"
            - Dense network is 800 KFLOP: irrelevant to capacity
            - 256 KB per request x 69,444 rps = 17.8 GB/s of gathers
            - Hot namespace on one shard = 1.39e7 lookups/s
            - Auction needs calibrated pCTR, not just good ranking
      checkpoint: >-
        If you halve the embedding dimension from 64 to 32, what happens to shard
        count and to gather bandwidth, and what do you lose?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Start from impressions per second, then table bytes, then per-shard
        traffic, then the latency waterfall. Only after those four numbers agree
        should you pick DLRM or DCN-v2 — both fit inside the same 12 ms.
      blocks:
        - kind: checklist
          body: |
            - Impressions/day to rps, then multiply by peak factor
            - Table bytes = rows x dim x 4, tripled for Adam
            - Per-shard load = namespace share x rps x lookups
            - Waterfall must sum under p99 with room for queueing
            - Calibration monitored per segment, hourly
      checkpoint: >-
        Where does the design break first if traffic doubles but the catalogue of
        feature IDs stays fixed?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The capacity model and the serving path in about fifteen lines.
      blocks:
        - kind: pseudocode
          body: |
            rps      = impressions_per_day / 86400
            peak     = rps * peak_factor
            table_b  = n_ids * dim * 4 * 3           # Adam moments
            shards   = ceil(table_b / gpu_bytes)
            gather   = peak * lookups * dim * 4      # bytes/s
            hot      = namespace_share * peak * lookups

            score(request):
              ids, dense = resolve(request)            # 8 ms
              vecs       = gather(ids, shards)         # 12 ms with net
              logit      = dcn_v2(vecs, dense)
              p          = calibrate(sigmoid(logit), segment)
              return p                                 # auction multiplies by value
      checkpoint: >-
        Which line changes if the product team asks for 64-dimensional embeddings
        instead of 32, and by how much?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Three results worth memorising: table bytes, gather bandwidth, hot-shard
        ratio.
      blocks:
        - kind: math
          body: |
            **Table.** $M = 3ndb$. At $n=10^9$, $d=64$, $b=4$: 768 GB.

            **Gather.** $B = Rkdb$. At $R=69{,}444$, $k=10^3$: 17.8 GB/s.

            **Hot shard.** $\text{ratio} = fS$. At $f=0.2$, $S=12$: 2.4x the
            average shard.

            **Dense FLOPs.** $(13d + d^2 + d \cdot 256 + 256)\times 2$ with
            $d=512$: 800,256 FLOP/example, 55.6 GFLOP/s at peak.
      checkpoint: >-
        Why does the hot-shard ratio get worse as you add shards, and what does
        that imply for the placement policy?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The capacity model, the placement rule, and the calibration gate.
      blocks:
        - kind: warning
          body: >-
            The most common failure is sizing on parameters and then discovering
            that 768 GB of state does not fit the fleet you provisioned. The
            second most common is shipping on AUC and losing money on a 20%
            calibration bias.
        - kind: code
          language: python
          body: |
            import math

            def capacity(n_ids=1e9, dim=64, bytes_per=4, gpu_gb=80,
                         impressions=2e9, peak=3.0, lookups=1000):
                rps = impressions / 86400
                table_gb = n_ids * dim * bytes_per * 3 / 1e9
                return {
                    "mean_rps": rps,
                    "peak_rps": rps * peak,
                    "table_gb": table_gb,
                    "shards": math.ceil(table_gb / gpu_gb),
                    "gather_gbs": rps * peak * lookups * dim * bytes_per / 1e9,
                }
      checkpoint: >-
        At 12 shards the model costs 768 GB of state. What is the bill if you
        keep three replicas of every shard for availability?
  try_it: >-
    Compute the table in bytes, not parameters: 1e9 IDs x 64 dims x 4 bytes is
    256 GB, and Adam's two moments make it 768 GB — 9.6 devices of 80 GB, so 12
    shards of 64 GB. Then multiply 1,000 lookups x 64 x 4 bytes by 69,444 peak
    rps and check whether 17.8 GB/s is a cluster problem or a single-shard
    problem. It is the second, and the arithmetic that shows it is one line.
  interview_questions:
    - question: "You have a billion features and a 30 ms budget. Where does the time actually go?"
      level: staff
      key_points:
        - "Feature fetch 8 ms, gather plus DCN-v2 plus MLP 12 ms, network 4 ms, auction and calibration 3 ms, 3 ms slack — 30 ms total, so there is no room for a retry."
        - "Dense compute is 800,256 FLOP per example, about 55.6 GFLOP/s at peak: 0.014% of one device, so the network architecture is not a performance decision."
        - "The table is 768 GB with optimizer state, so at least ten 80 GB devices; twelve shards of 64 GB gives headroom and lets one fail."
        - "Because the slack is 3 ms, the fleet runs near 50% utilisation — queueing at 90% would add several times the service time at p99."
      follow_up: "If the product team wants 128-dimensional embeddings, what breaks first and what would you trade to keep the SLO?"
    - question: "Your AUC improved but revenue per impression fell. How is that possible?"
      level: senior
      key_points:
        - "The auction bids pCTR times value and charges second price, so the level of the prediction sets the price paid, not just the ranking."
        - "A model predicting 1.2% where the truth is 1.0% wins the same auctions and overpays 20% per click; AUC is invariant to that bias."
        - "Calibration must be fit per traffic segment on a held-out time window, because a global isotonic fit is dominated by the largest segment."
        - "Monitor the predicted-to-observed ratio hourly with a 5% alert and gate rollouts on calibration error as well as ranking metrics."
      follow_up: "How would you separate a calibration bug from a genuine change in user behaviour?"
    - question: "One shard is at 90% network utilisation and the others are at 30%. What happened?"
      level: staff
      key_points:
        - "Hash partitioning balances row count but not heat: a 24-value namespace like hour-of-day lands entirely on one shard and carries a large share of every request."
        - "At 20% of 69,444 peak rps that is 1.39e7 lookups/s on one machine, and p99 is set by the hottest shard rather than the average."
        - "The ratio worsens as shard count grows (f times S), so subdividing the table makes the imbalance relatively worse."
        - "Mitigate by replicating low-cardinality namespaces read-only and hashing only the long tail; add per-shard request budgets so one namespace cannot own the link."
      follow_up: "What consistency problem does replicating an embedding row introduce for streaming updates?"
    - question: "Why is online learning worth its complexity here, and what does it cost?"
      level: senior
      key_points:
        - "A nightly retrain scores a morning campaign launch with a model that has never seen its ID, which is a systematic cold-start hole in the first hours of every launch."
        - "Sparse updates bound the write path: a 65,536-example batch touches at most 6.6e7 rows against 1e9, so write volume tracks distinct IDs, not table size."
        - "The cost is consistency: asynchronous updates let readers see half-applied rows and let a straggler's gradient land minutes late."
        - "Versioned snapshots restore reproducibility at the price of doubling memory during the switch — 768 GB to 1.5 TB."
      follow_up: "Which would you choose for a system already at p99 29 ms, and what would you measure to know you were wrong?"
  common_mistakes:
    - "Sizing by parameter count instead of bytes: 1e9 features x 64 dims is 256 GB of serving state and 768 GB with Adam, which is 9.6 devices, not one."
    - "Optimising the dense network when it is 800 KFLOP per example — 0.014% of a device — while the gather path decides p99."
    - "Shipping on AUC alone to an auction that multiplies pCTR by value, where a 20% overprediction is a 20% overpayment per click."
    - "Hash-partitioning everything and then wondering why one shard times out: heat follows the namespace, not the hash."
