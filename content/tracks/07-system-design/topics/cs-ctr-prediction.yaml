  implementations:
    - language: python
      title: "Embedding bytes, gather bandwidth, and Platt calibration"
      note: >-
        The table is 256 GB and Adam state triples it; the gather is 17.8 GB/s at peak, so the model is a memory system with a small network attached. The calibration half fits Platt scaling by Newton steps on synthetic logits whose true CTR sits 0.8 logits below the raw score: mean predicted CTR moves from 0.498 to the actual 0.363. It is a toy calibration set, not a substitute for isotonic fitting on a held-out window.
      code: |
        import numpy as np

        N_FEATURES, DIM, BYTES = 1_000_000_000, 64, 4
        LOOKUPS, RPS_PEAK, RPS_MEAN = 1_000, 69_444, 23_000


        def state_bytes(n=N_FEATURES, d=DIM, b=BYTES):
            """Parameters, fp32 master copy and two Adam moments: 16 bytes per parameter."""
            table = n * d * b
            return table, 3 * table


        def gather_gbps(lookups=LOOKUPS, d=DIM, b=BYTES, rps=RPS_PEAK):
            return lookups * d * b * rps / 1e9


        def fit_platt(logits, y, iters=50):
            """Platt scaling: p = sigmoid(a*logit + b), fitted by Newton steps."""
            a, b = 1.0, 0.0
            for _ in range(iters):
                p = 1.0 / (1.0 + np.exp(-(a * logits + b)))
                w = p * (1 - p) + 1e-12
                grad = np.array([np.sum((p - y) * logits), np.sum(p - y)])
                hess = np.array([[np.sum(w * logits**2), np.sum(w * logits)],
                                 [np.sum(w * logits), np.sum(w)]])
                step = np.linalg.solve(hess + 1e-9 * np.eye(2), grad)
                a, b = a - step[0], b - step[1]
            return a, b


        def main():
            table, total = state_bytes()
            print(f"embedding table: {table/1e9:.0f} GB; with Adam state: {total/1e9:.0f} GB")
            print(f"gather at peak: {gather_gbps():.1f} GB/s; "
                  f"at mean: {gather_gbps(rps=RPS_MEAN):.1f} GB/s")

            # A model that overpredicts; calibration must remove the bias.
            rng = np.random.default_rng(7)
            logits = rng.normal(0.0, 1.5, 20_000)
            true_p = 1 / (1 + np.exp(-(logits - 0.8)))
            y = rng.random(logits.size) < true_p
            raw = 1 / (1 + np.exp(-logits))
            a, b = fit_platt(logits, y)
            cal = 1 / (1 + np.exp(-(a * logits + b)))
            print(f"mean predicted CTR raw={raw.mean():.3f} "
                  f"calibrated={cal.mean():.3f} actual={y.mean():.3f}")

            assert total == 3 * table and table == 256e9
            assert abs(gather_gbps() - 17.8) < 0.1
            assert abs(cal.mean() - y.mean()) < 0.01
            assert abs(raw.mean() - y.mean()) > 0.05


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-ctr-embedding-state
      title: "Size the embedding state"
      difficulty: easy
      prompt: >-
        A feature table has `features` rows of `dim` float32 values. Adam keeps a parameter copy
        and two moments, so the total state is three times the table. Return the total in GB.
      language: python
      entry: total_state_gb
      testCases:
        - input: '{}'
          expected: "768"
          tolerance: 1e-6
        - input: '{"features": 1000000000, "dim": 16}'
          expected: "192"
          tolerance: 1e-6
      solution: |
        def total_state_gb(features=1_000_000_000, dim=64):
            return features * dim * 4 * 3 / 1e9
      solutionExplanation: >-
        1e9 * 64 * 4 = 256 GB for the table; three copies is 768 GB, the number that forces
        sharding before any model code is written.
      tags: [memory, embeddings]
