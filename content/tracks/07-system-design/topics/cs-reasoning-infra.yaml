        - kind: checklist
          body: |
            - p1 by difficulty band, not in aggregate
            - Verifier accuracy in and out of distribution
            - Mode per band: single, best-of-n, or search
            - Cache budget sets batch; bandwidth sets latency
            - Cost attribution per component from day one
      checkpoint: >-
        If the verifier is only 60% accurate, what is best-of-16 actually buying?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The routing decision and the decode loop.
      blocks:
        - kind: pseudocode
          body: |
            def mode(p1, n_max=16, verifier_acc=0.9):
                if p1 >= 1 / n_max: return "single"     # sampling cannot pay
                return "best_of_n" if verifier_acc > 0.7 else "single"

            def solve(prompt, budget):
                cands = [generate(prompt, max_tokens=budget.tokens)
                         for _ in range(budget.n)]
                scores = [verify(c) for c in cands]     # 0.38 s each
                return cands[argmax(scores)]

            # decode: one token per 9.55 ms per sequence, regardless of batch
      checkpoint: >-
        Where does the budget go if the verifier is step-level rather than
        final-answer?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Three results: decode rate, cache per token, break-even n.
      blocks:
        - kind: math
          body: |
            **Decode.** $\tau = Nb/(kB)$; 32e9 x 2 / (2 x 3.35e12) = 9.55 ms.

            **Cache.** $m = 2LH_{kv}db$ = 262,144 B per token.

            **Break-even.** $p_n > np_1$ and $p_n \le 1$ imply $n < 1/p_1$.
      checkpoint: >-
        At p1 = 0.05, what is the largest n that can break even, and what does
        that say about a fixed budget of 32 samples?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The capacity model, the routing rule, and the cost report.
      blocks:
        - kind: warning
          body: >-
            The classic mistake is shipping best-of-n because it improved a demo,
            on a benchmark whose pass@1 was already high. Compute cost per solved
            problem before and after, per difficulty band, or you are buying
            variance rather than accuracy.
        - kind: code
          language: python
          body: |
            def attempt_gpu_s(tokens=8000, params=32e9, tp=2, bw=3.35e12):
                per_tok = params * 2 / (tp * bw)
                return tokens * per_tok * tp          # wall x devices

            def cost_per_solve(p, n, gpu_s, usd_per_h=2.5):
                return n * gpu_s / p / 3600 * usd_per_h

            def breakeven_ok(p1, pn, n):
                return pn > n * p1
      checkpoint: >-
        Your p1 is 0.3 and someone proposes n=8. What do you tell them, with
        numbers?
