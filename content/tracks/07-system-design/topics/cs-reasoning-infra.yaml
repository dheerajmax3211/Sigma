  implementations:
    - language: python
      title: "Decode latency, verifier cost, and best-of-n break-even"
      note: >-
        Decode is weight bytes over bandwidth, so TP=2 gives 9.55 ms/token and TP=4 halves it; 8,000 tokens is 76 s at TP=2. Best-of-n raises pass@n but cost per solved problem rises with n, because independent samples can never satisfy p_n > n*p_1. The verifier pass is 0.38 s, 6% of a 6.4 GPU-second attempt, which is why full-solution reranking is cheap and step-level search is not.
      code: |
        PARAMS_B, BYTES, BW_TBPS, TP = 32e9, 2, 3.35, 2
        TOKENS, ATTEMPT_GPU_S = 8_000, 6.4
        VERIFIER_PARAMS, VERIFIER_TFLOPS = 7e9, 300e12


        def token_ms(tp=TP):
            """Bandwidth-bound decode: each device reads its shard of the weights."""
            return (PARAMS_B * BYTES / tp) / (BW_TBPS * 1e12) * 1e3


        def attempt_seconds(tokens=TOKENS, tp=TP):
            return token_ms(tp) * tokens / 1e3


        def pass_at_n(p1, n):
            """Independent samples: 1 - (1 - p1)^n."""
            return 1 - (1 - p1) ** n


        def cost_per_solve(p1, n, verifier=0.0):
            return n * (1.0 + verifier) / pass_at_n(p1, n)


        def main():
            print(f"decode: {token_ms():.2f} ms/token; 8,000 tokens: {attempt_seconds():.1f} s")
            print(f"TP=4: {token_ms(tp=4):.2f} ms/token; {attempt_seconds(tp=4):.1f} s")

            kv = 2 * 64 * 8 * 128 * 2
            print(f"KV per token: {kv/1024:.0f} KiB; 8,000 tokens: {kv*8000/2**30:.1f} GiB")

            ver = 2 * VERIFIER_PARAMS * 8_192 / VERIFIER_TFLOPS
            print(f"full-solution verifier pass: {ver:.2f} s ({ver/ATTEMPT_GPU_S:.0%} of an attempt)")

            p1 = 0.42
            for n in (1, 4, 16):
                print(f"n={n:2d} pass@{n}={pass_at_n(p1, n):.3f} "
                      f"cost/solve={cost_per_solve(p1, n):.2f}x")

            assert abs(token_ms() - 9.55) < 0.05
            assert abs(attempt_seconds() - 76.4) < 0.2
            assert abs(kv / 1024 - 256) < 1
            assert cost_per_solve(p1, 16) > cost_per_solve(p1, 1)
            assert pass_at_n(p1, 16) < 16 * p1


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-reasoning-best-of-n
      title: "Cost per solved problem under best-of-n"
      difficulty: easy
      prompt: >-
        With independent samples, pass@n is `1 - (1-p1)**n`. Return the cost per solved problem
        in units of one attempt, sampling `n` times and paying `verifier` extra per sample.
      language: python
      entry: cost_per_solve
      testCases:
