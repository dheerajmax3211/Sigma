        - input: '{"p1": 0.5, "n": 1}'
          expected: "2.0"
          tolerance: 1e-6
        - input: '{"p1": 0.5, "n": 2}'
          expected: "2.666667"
          tolerance: 1e-6
      solution: |
        def cost_per_solve(p1=0.42, n=16, verifier=0.0):
            return n * (1.0 + verifier) / (1 - (1 - p1) ** n)
      solutionExplanation: >-
        At p1 = 0.42, best-of-16 solves almost everything but costs 16 attempts per solve
        against 2.38 for one sample. Sampling cannot beat pass@1 on cost per solve.
