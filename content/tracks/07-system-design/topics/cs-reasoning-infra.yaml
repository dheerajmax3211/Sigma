  interview_questions:
    - question: "Why does batching not improve the latency of a single reasoning request?"
      level: senior
      key_points:
        - "Decode reads the whole weight matrix per token, so a 32B model at TP 2 reads 32 GB per device per token: 9.55 ms at 3.35 TB/s."
        - "Batching amortises that read across sequences, raising aggregate throughput to 2,512 tokens/s at batch 24, but each sequence still advances one token per 9.55 ms."
        - "So 8,000 tokens is 76 s at any batch size; latency is improved by more tensor parallelism, a smaller model, or speculative decoding."
        - "Moving from TP 2 to TP 4 halves the per-device read and halves latency to 38 s, at double the GPUs per replica."
      follow_up: "What does that imply about mixing interactive and batch traffic on the same pool?"
    - question: "When is best-of-16 worth 16x the compute?"
      level: staff
      key_points:
        - "Cost per solved problem is n c / p_n against c / p_1, so sampling wins only when p_n > n p_1."
        - "Since p_n <= 1, that requires p_1 < 1/n — below 6.25% for n = 16."
        - "At p_1 = 0.42 a perfect verifier gives p_16 = 0.9998 against the 6.72 needed, so the ratio is 6.72x; at p_1 = 0.02 it falls to 1.16x."
        - "The implication is per-difficulty routing: spend samples on the hard tail, single-shot the easy head."
      follow_up: "How would you build the difficulty router, and what data would it need?"
    - question: "Your verifier bill is bigger than your generation bill. How?"
      level: staff
      key_points:
        - "A full-solution PRM pass over 8,192 tokens is 115 TFLOP, about 0.38 s — only 6% of a 6.4 GPU-second attempt."
        - "Step-level scoring of 40 prefixes averaging 4,000 tokens is 160,000 tokens, 19.5x the work, or 7.5 GPU-s per candidate."
        - "Across sixteen candidates that is 120 GPU-s of verification against 102 GPU-s of generation."
        - "Mitigations: score only top-k, use exact answer checking for math, cache scores for shared prefixes, and report the split per request."
      follow_up: "Where would you put the verifier in the request path, and what does that do to p99?"
    - question: "How much KV cache does one 8,000-token request need, and why does it matter?"
      level: senior
      key_points:
        - "With 64 layers, 8 GQA KV heads and head dim 128 in fp16, a token is 2 x 64 x 8 x 128 x 2 = 262,144 bytes, or 256 KiB."
        - "8,000 tokens is 2 GiB per sequence; 24 sequences is 48 GiB, which is the memory left after 32 GB of weights per device."
        - "Batch size is set by cache, not by compute, which is why long-context traces collapse throughput."
        - "GQA from 64 to 8 KV heads is an 8x reduction and is what makes long reasoning servable at all."
      follow_up: "What would you do when a request needs 32,000 tokens and the cache cannot fit it alongside the batch?"
  common_mistakes:
    - "Shipping best-of-n because a demo improved, without checking that pass@1 was low enough for sampling to beat it on cost per solve."
    - "Sizing the batch from FLOPs when the binding constraint is 2 GiB of KV cache per 8,000-token sequence."
    - "Using step-level PRM scoring everywhere: 19.5x the verifier work, which can exceed the generation bill outright."
    - "Expecting batching to fix latency — it improves throughput only, because decode is bandwidth-bound per token."
