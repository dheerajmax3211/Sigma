  interview_questions:
    - question: "What does point-in-time correctness mean, and how do you test it?"
      level: senior
      key_points:
        - "Each training row must join feature values as of the label's event timestamp, never the entity's latest value."
        - "A 30-day count joined 7 days late is inflated by 7/30 = 23%, and the inflation depends on the delay relative to the window, not on the event rate."
        - "The failure is silent: offline metrics improve while production degrades, because the feature does not exist in that form at serving time."
        - "Test by reconstruction replay — rebuild a production request's vector offline at its timestamp and diff it byte for byte."
      follow_up: "Where do late-arriving labels fit into that scheme, and what timestamp do you join on?"
    - question: "480 GB of features and the cluster needs 3.4 TB. Why?"
      level: senior
      key_points:
        - "Per-field encoding carries bookkeeping far larger than the value: roughly 48 bytes around an 8-byte counter."
        - "300 fields per entity x 200M entities x 56 bytes is 3.36 TB, a 6.7x ratio over the 480 GB payload."
        - "One blob per entity is about 500 GB with keys, one GET, and atomic upserts — strictly better when the model reads all features."
        - "A hybrid keeps the bulk in a blob and puts fast-moving counters in a small side hash, at the cost of a merge at serving time."
      follow_up: "When would you deliberately pay the 6.7x and use field-per-feature?"
    - question: "How fresh should features be, and what does that cost?"
      level: staff
      key_points:
        - "Freshness is per feature view: batch 24 h at the cost of a warehouse query, micro-batch 15 min, streaming 65 s worst case with a stateful job."
        - "A 60 s window with a 5 s watermark is a 65 s worst case, and that is the number the model owner needs, not 'real time'."
        - "Streaming every feature multiplies platform cost by an order of magnitude for features whose value does not decay in seconds."
        - "The trade is measured, not assumed: compare offline AUC with a stale version of the feature against the fresh one."
      follow_up: "How would you prove a feature's value actually decays in seconds rather than days?"
    - question: "You need to keep two years of history for reproducibility. What does it cost, and is there a better way?"
      level: staff
      key_points:
        - "480 GB per daily snapshot x 730 days is 350 TB, or 1.05 PB with three replicas, about 24,200 USD/month at 23 USD per TB-month."
        - "Retention and replication are the two multiplicative levers, and both are budget decisions rather than technical defaults."
        - "A raw event log plus recompute is typically far smaller and answers questions materialised snapshots cannot."
        - "Recompute cost scales with events, not entities — 200M users x 30 events/month x 24 months is 1.4e11 events, which is days of cluster time per backfill."
      follow_up: "What would you keep if you could only keep one: the log or the snapshots?"
  common_mistakes:
    - "Sizing the online store from payload bytes: 480 GB becomes 3.36 TB with per-field encoding, a 6.7x surprise on the first invoice."
    - "Joining training labels to the entity's latest feature values, which inflates a 30-day count by 23% and makes offline AUC a fiction."
    - "Assigning one freshness number to the whole store, then either overpaying for streaming features that do not need it or lying about the ones that do."
    - "Writing daily snapshots before deciding retention, then discovering two years of history costs 350 TB."
