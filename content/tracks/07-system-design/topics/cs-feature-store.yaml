  implementations:
    - language: python
      title: "A point-in-time join, and what reading latest costs"
      note: >-
        The join is an as-of merge via searchsorted, which is what a feature store does when it is correct. A label at day 29 sees 2,900 events; the serving path reads day 36 and reports 3,600, a 24% inflation that becomes leakage in training. The byte counts compare one blob per entity with per-field bookkeeping, the 500 GB versus 3.36 TB trade in the case study.
      code: |
        import numpy as np

        USERS, FEATURES, BYTES = 200_000_000, 300, 8


        def online_bytes(users=USERS, feats=FEATURES, b=BYTES):
            payload = users * feats * b
            blob = payload * 1.04                      # one serialised row per entity
            hashed = payload + users * feats * 48      # per-field bookkeeping
            return payload, blob, hashed


        def point_in_time_join(event_times, event_values, label_times):
            """As-of join: latest event at or before each label timestamp."""
            order = np.argsort(event_times, kind="stable")
            t, v = event_times[order], event_values[order]
            idx = np.searchsorted(t, label_times, side="right") - 1
            return np.where(idx >= 0, v[np.clip(idx, 0, len(v) - 1)], 0.0)


        def main():
            payload, blob, hashed = online_bytes()
            print(f"online payload: {payload/1e9:.0f} GB; blob {blob/1e9:.0f} GB; "
                  f"hash fields {hashed/1e12:.2f} TB")

            # A 30-day event count, snapshotted daily. Labels land at day 29, 34, 39.
            days = np.arange(48.0)
            counts = days * 100.0
            label_t = np.array([29.0, 34.0, 39.0])
            asof = point_in_time_join(days, counts, label_t)
            # The serving path reads the CURRENT value: seven days fresher than the label.
            latest = counts[(label_t + 7).astype(int)]
            inflation = (latest - asof) / asof
            print(f"as-of counts: {asof.tolist()}; latest-value join: {latest.tolist()}")
            print(f"inflation from reading latest: {[round(x, 3) for x in inflation.tolist()]}")

            assert payload == 480e9
            assert abs(blob / 1e9 - 499.2) < 1
            assert hashed > 3e12
            assert np.all(asof == counts[label_t.astype(int)])
            assert 0.23 < inflation[0] < 0.25


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-feature-store-asof
      title: "As-of join by hand"
      difficulty: easy
      prompt: >-
        Given sorted event `times` and `values`, return the value of the latest event at or
        before `t`, or 0.0 if no event has happened yet. This is the join that makes a training
        row point-in-time correct.
      language: python
      entry: asof_value
      testCases:
        - input: '{"times": [0, 1, 2], "values": [10, 20, 30], "t": 1.5}'
          expected: "20"
          tolerance: 1e-6
        - input: '{"times": [0, 1, 2], "values": [10, 20, 30], "t": -1}'
          expected: "0.0"
          tolerance: 1e-6
        - input: '{"times": [0, 1, 2], "values": [10, 20, 30], "t": 2}'
          expected: "30"
          tolerance: 1e-6
      solution: |
        def asof_value(times, values, t):
            best = 0.0
            for ts, v in zip(times, values):
                if ts <= t:
                    best = v
            return best
      solutionExplanation: >-
        Scanning for the largest timestamp at or before t is the as-of semantics. Reading the
        last value unconditionally is what inflates a feature by the gap between label and
        snapshot.
      tags: [feature-store, correctness]
