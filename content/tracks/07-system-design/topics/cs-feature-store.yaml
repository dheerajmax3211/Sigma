      title: "Full Solution"
      content: >-
        The platform shape plus the two tests that keep it honest.
      blocks:
        - kind: warning
          body: >-
            The failure mode is silence. Nothing errors when the join sees the
            future or when the stream and batch windows differ by a boundary
            condition; the model simply performs worse and everyone blames the
            model.
        - kind: code
          language: python
          body: |
            def online_bytes(entities=200e6, features=300, value_b=8,
                             field_overhead_b=48, key_b=100, layout="blob"):
                if layout == "blob":
                    return entities * (features * value_b + key_b)
                return entities * features * (value_b + field_overhead_b)

            def history_tb(snapshot_gb=480, days=730, replicas=3):
                return snapshot_gb * days * replicas / 1000

            def leakage(delta_days, window_days):
                return delta_days / window_days
