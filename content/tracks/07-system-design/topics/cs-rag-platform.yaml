  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Three numbers decide this design: how many chunks the corpus becomes,
        how many bytes each chunk costs in each index, and how many FLOPs one
        reranked candidate costs. Everything else is addition.
      blocks:
        - kind: checklist
          body: |
            - Chunks = tokens / stride
            - Vectors = chunks x dims x bytes
            - Graph = chunks x M x 4 bytes
            - Postings = chunks x unique terms x 4 bytes
            - Rerank = 2 x params x tokens per candidate
      checkpoint: >-
        Which of those five grows if you halve the chunk size, and which one stays
        the same?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Size the index first because it is binary: it fits a node or it does not.
        Then size the reranker because it is linear in candidates and is the only
        quality knob with a per-query cost. The generator is last and largest, and
        the only thing that makes it smaller is not calling it.
      blocks:
        - kind: warning
          body: >-
            Do not start with the LLM. Starting there produces a design where
            retrieval is an afterthought, and the failure mode is confident answers
            from the wrong three chunks — which no amount of generation quality
            fixes.
      checkpoint: >-
        If retrieval returns the wrong eight chunks, does a better generator help?
        What does that imply about where to spend the next engineering month?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Chunk, index, retrieve twice, fuse, rerank, generate.
      blocks:
        - kind: pseudocode
          body: |
            chunks = tokens / (L - overlap)
            vec_bytes = chunks * dims * b
            graph = chunks * M * 4
            postings = chunks * terms * 4
            for q in queries:
                dense = ann(enc(q), k=100, ef=64)
                lex   = bm25(q, k=100)
                cand  = rrf(dense, lex)[:50]
                ranked= cross_encoder(q, cand)     # 0.6 ms per pair
                answer= llm(ranked[:8])            # 202 ms prefill
      checkpoint: >-
        Which line would you instrument first to distinguish a retrieval bug from
        a generation bug?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Chunk count, index bytes, and rerank cost.
      blocks:
        - kind: math
          body: |
            **Chunks.**
            $$N_c = \frac{N_d T_d}{L - L_o}$$

            **Index bytes.**
            $$M = N_c\,(d\,b_v + M_g\,4) + N_c\,T_u\,4$$

            **Rerank FLOPs per query.**
            $$F = 2\,N_p\,L_{\text{pair}}\,k$$
      checkpoint: >-
        Plug in 1e6 documents, 8,000 tokens, 512/64 chunking, 1,024 dims and 1 byte
        per value. Do you get 17.9M chunks and 20.6 GB?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The 31 GB hybrid index with a 9-GPU reranker and a 60-GPU generator.
      blocks:
        - kind: code
          language: python
          body: |
            docs, tok_per_doc = 1e6, 8000
            L, ov, dims, M = 512, 64, 1024, 32
            chunks = docs * tok_per_doc / (L - ov)
            vec    = chunks * dims * 1          # int8
            graph  = chunks * M * 4
            bm25   = chunks * 150 * 4
            rerank = 2 * 22e6 * 512
            gpus   = 300 * 50 * rerank / (125e12 * 0.30)
            gen    = 300 * 2 * 8e9 * 5000 / (989e12 * 0.40)
            print(round(chunks/1e6,1), round((vec+graph)/1e9,1),
                  round(bm25/1e9,1), round(gpus,1), round(gen))
      checkpoint: >-
        The generator count assumes 5,000 prompt tokens. What happens to it if
        you cut the top-8 chunks to top-4, and what does that do to answer quality?
  implementations:
    - language: python
      title: "Chunk arithmetic, hybrid RRF, and reranker cost"
      note: >-
        The chunk count is tokens divided by stride, not by chunk size: 512-token chunks with 64 overlap give 17.86M chunks, and the span function proves every token is covered. Reciprocal rank fusion of BM25 and dense rankings reaches recall@5 of 1.0 where the individual retrievers get 0.6 and 0.4. The reranker estimate assumes 22M parameters, a 512-token pair, and 30% of a 125 TFLOP/s GPU.
      code: |
        import numpy as np

        TOKENS, CHUNK, OVERLAP = 8e9, 512, 64
        DIM, CROSS_ENCODER_PARAMS = 1_024, 22e6


        def chunk_count(tokens=TOKENS, chunk=CHUNK, overlap=OVERLAP):
            """Stride is chunk minus overlap, so the count is tokens / stride."""
            return int(np.ceil(tokens / (chunk - overlap)))


        def chunk_spans(n_tokens, chunk=CHUNK, overlap=OVERLAP):
            stride = chunk - overlap
            return [(s, min(s + chunk, n_tokens))
                    for s in range(0, max(n_tokens - overlap, 1), stride)]


        def rrf(rankings, k=60):
            """Reciprocal rank fusion: score(d) = sum 1 / (k + rank)."""
            scores = {}
            for ranking in rankings:
                for rank, doc in enumerate(ranking, start=1):
                    scores[doc] = scores.get(doc, 0.0) + 1.0 / (k + rank)
            return sorted(scores, key=lambda d: -scores[d])


        def main():
            n = chunk_count()
            spans = chunk_spans(10_000)
            covered = np.zeros(10_000, bool)
            for a, b in spans:
                covered[a:b] = True
            print(f"chunks for 8e9 tokens: {n:,}; all tokens covered: {covered.all()}")
            print(f"int8 vectors: {n*DIM/1e9:.1f} GB; HNSW links: {n*32*4/1e9:.1f} GB")

            flops = 2 * CROSS_ENCODER_PARAMS * 512
            print(f"rerank: {flops/1e12:.2f} TFLOP/pair -> "
                  f"{flops/(0.30*125e12)*1e3:.2f} ms/pair; "
                  f"{300*50*flops/(0.30*125e12):.0f} GPUs at 300 QPS x 50 pairs")

            # Hybrid retrieval: BM25 misses a paraphrase, dense misses an exact ID.
            truth = {0, 1, 2, 3, 4}
            bm25 = [0, 1, 2, 9, 8, 3, 4]
            dense = [3, 4, 5, 6, 7, 0, 1, 2]
            fused = rrf([bm25, dense])[:5]
            print(f"recall@5 bm25={len(truth & set(bm25[:5]))/5:.1f} "
                  f"dense={len(truth & set(dense[:5]))/5:.1f} "
                  f"fused={len(truth & set(fused))/5:.1f}")

            assert n == 17_857_143
            assert len(spans) == 23 and covered.all()
            assert len(truth & set(fused)) == 5
            assert len(truth & set(bm25[:5])) < 5


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-rag-chunk-count
      title: "Chunk count is tokens over stride"
      difficulty: easy
      prompt: >-
        Return the number of chunks for `tokens` with `chunk`-token windows and `overlap` tokens
        of overlap. The stride is chunk minus overlap, so the last partial chunk counts.
      language: python
      entry: chunk_count
      testCases:
        - input: '{}'
          expected: "17857143"
          tolerance: 1e-6
        - input: '{"tokens": 10000}'
          expected: "23"
          tolerance: 1e-6
      solution: |
        import math

        def chunk_count(tokens=8e9, chunk=512, overlap=64):
            return math.ceil(tokens / (chunk - overlap))
      solutionExplanation: >-
        8e9 / 448 = 17.86M, not 15.6M. Dividing by 512 ignores the overlap and understates
        vector memory by 15%.
      tags: [rag, capacity]
