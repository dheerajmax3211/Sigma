  interview_questions:
    - question: "Estimate the GPU cost of a five-second 720p clip."
      level: staff
      key_points:
        - "Latent tokens: (1280/8) x (720/8) = 14,400 per frame, 30 latent frames, 432,000 tokens; patch 2 gives 108,000."
        - "Per-step FLOPs are 2 x params x tokens: 2 x 2e9 x 1.08e5 = 432 TFLOP, about 1.08 s at 400 TFLOP/s effective."
        - "Fifty steps with classifier-free guidance is 100 passes, so 108 GPU-seconds, or 0.075 USD at 2.50 USD per GPU-hour."
        - "The 2x from CFG is a product decision with a quality justification and a doubled bill."
      follow_up: "What would you change first to halve that, and what quality evidence would you need?"
    - question: "Why can you not use full 3D attention over the latent grid?"
      level: senior
      key_points:
        - "At 108,000 tokens the score tensor is 1.17e10 entries, 23.3 GB per head per layer in fp16."
        - "Across 16 heads and 28 layers the workspace is terabytes, far beyond 80 GB of HBM per device."
        - "Factorising into spatial attention within frames (3,600 tokens) and temporal attention across 30 frames turns one impossible matrix into two small ones."
        - "The cost is expressiveness: long-range fine-grained spatio-temporal dependencies, which appear as drift in occlusion and reappearance."
      follow_up: "What quality failure would make you pay for windowed 3D attention instead?"
    - question: "You add a 1080p premium tier. What actually gets more expensive?"
      level: staff
      key_points:
        - "Tokens go 108,000 to 243,000, a 2.25x rise, so per-step FLOPs rise 2.25x and per-clip time goes 108 s to 243 s."
        - "Attention entries rise 5.06x, which shows up as memory pressure, smaller batches, and a worse p99 rather than as a clean linear cost."
        - "Pricing at 2.25x covers the arithmetic and not the tail; you need headroom for the quadratic term and a token cap at admission."
        - "A 720p generation plus learned upscaling is a cheaper premium tier at roughly 1.1x cost, with a quality ceiling you have to measure."
      follow_up: "Where would you set the duration cap, and what does it cost per second of video?"
    - question: "Utilisation is 40% and the interactive queue is growing. What is wrong?"
      level: senior
      key_points:
        - "Step-synchronous batching couples lifetimes, so a batch runs until its longest member finishes and short requests waste their slots."
        - "A 50-step request and a 20-step request in the same batch waste 30 steps of the short one's capacity."
        - "Continuous batching at step granularity keeps the batch full instead of coherent, which recovers utilisation under mixed step counts."
        - "It needs paged latent buffers and careful state management, and admission control should cap steps per request rather than let the scheduler absorb them."
      follow_up: "What does paged state cost in memory, and how does that interact with 1080p?"
  common_mistakes:
    - "Extrapolating from image diffusion by token count alone, ignoring that attention is quadratic in tokens and 108,000 squared is 23.3 GB per head per layer."
    - "Treating classifier-free guidance as free quality: it doubles the forward passes, so 50 steps is 100 step-equivalents and 108 s per clip."
    - "Pricing a 1080p tier at the 2.25x token ratio when attention entries grow 5.06x and the tail latency grows with them."
    - "Batching statically and losing 60% of utilisation to the longest request in the batch."
