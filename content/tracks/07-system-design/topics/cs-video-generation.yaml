  implementations:
    - language: python
      title: "Video token count, step FLOPs, and the attention bill"
      note: >-
        Patchification turns 432,000 latent tokens into 108,000, and 2ND gives 432 TFLOP per denoising pass. Full 3D attention at that length is 23.3 GB of scores per head per layer, the arithmetic reason attention is factorised. Fifty steps with classifier-free guidance cost 108 s; a 20-step distilled student costs 21.6 s, the 5x the case study sells.
      code: |
        W, H, FPS, SECONDS = 1280, 720, 24, 5
        VAE_STRIDE, TEMPORAL, PATCH = 8, 4, 2
        PARAMS, STEPS, CFG, TFLOPS = 2e9, 50, 2, 400e12


        def latent_tokens(w=W, h=H, fps=FPS, seconds=SECONDS, patch=PATCH):
            per_frame = (w // VAE_STRIDE // patch) * (h // VAE_STRIDE // patch)
            frames = seconds * fps // TEMPORAL
            return per_frame, frames, per_frame * frames


        def step_flops(tokens, params=PARAMS):
            return 2 * params * tokens


        def attention_bytes(tokens, heads=16, layers=28, dtype=2):
            per_head = tokens * tokens * dtype
            return per_head, per_head * heads * layers


        def main():
            per_frame, frames, tokens = latent_tokens()
            print(f"latent grid: {per_frame:,} tokens/frame x {frames} frames = {tokens:,}")
            fl = step_flops(tokens)
            print(f"per denoising pass: {fl/1e12:.0f} TFLOP; {fl/TFLOPS:.2f} s at 400 TFLOP/s")

            one_head, all_heads = attention_bytes(tokens)
            print(f"attention scores: {one_head/1e9:.1f} GB per head; "
                  f"{all_heads/1e12:.1f} TB for 16 heads x 28 layers")

            cfg = fl * STEPS * CFG / TFLOPS
            distilled = fl * 20 / TFLOPS
            print(f"50-step CFG clip: {cfg:.1f} s; 20-step distilled: {distilled:.1f} s "
                  f"({cfg/distilled:.1f}x cheaper)")

            assert (per_frame, frames, tokens) == (3_600, 30, 108_000)
            assert abs(fl / 1e12 - 432) < 1
            assert abs(one_head / 1e9 - 23.3) < 0.1
            assert 100 < cfg < 115
            assert abs(cfg / distilled - 5) < 0.01


        if __name__ == "__main__":
            main()
  problems:
    - id: cs-video-latent-tokens
      title: "Latent tokens after patching"
      difficulty: easy
      prompt: >-
        Return the number of latent tokens in a clip: the VAE downsamples by `vae`, the DiT
        patch by `patch`, and time by `temporal`. Frames are `seconds * fps` before temporal
        compression.
      language: python
      entry: latent_tokens
      testCases:
        - input: '{}'
          expected: "108000"
          tolerance: 1e-6
        - input: '{"seconds": 2}'
          expected: "43200"
          tolerance: 1e-6
      solution: |
        def latent_tokens(w=1280, h=720, seconds=5, fps=24, patch=2, vae=8, temporal=4):
            per_frame = (w // vae // patch) * (h // vae // patch)
            return per_frame * (seconds * fps // temporal)
      solutionExplanation: >-
        80 x 45 patches over 30 latent frames is 108,000 tokens. The 4x patch reduction is what
        keeps a per-step pass inside one GPU.
      tags: [video, diffusion]
