track:
  id: transformers
  slug: transformers
  title: "Transformers and Generative AI"
  subtitle: "Attention, the block, and the engineering that makes a language model serve"
  description: >-
    The architecture that took over: attention as a differentiable lookup, the
    block that stacks it with an MLP, and then the whole ladder from
    tokenisation to KV caches, fine-tuning, and quantisation. Every topic
    derives the mechanism, measures its cost in FLOPs and bytes, and shows the
    failure mode that the diagram leaves out.
  tier: 3
  color: "#8b5cf6"
  sortOrder: 4
  outcomes:
    - "Derive scaled dot-product attention from a dictionary lookup, and explain why the divisor is exactly 1/sqrt(d_k)."
    - "Implement causal attention that masks before the normalisation, and diagnose the leak when it does not."
    - "Budget a context window in FLOPs and bytes, and recognise when a kernel is bound by memory rather than arithmetic."
    - "Explain multi-head and multi-query attention as a bandwidth decision, not only a modelling one."
    - "Place positional encoding, normalisation, and residual scaling in the block, and say what each one fixes."
    - "Fine-tune, quantise, and serve a transformer with a cost model rather than a guess."
topics: []
