      description: >-
        Set the batch and the context and read three numbers: bytes per step
        (weights plus batch times cache), intensity (2N B over those bytes), and
        the intensity ceiling 2N over the cache. The ceiling does not move with
        batch, which is the reason the curve flattens and the reason a faster
        GPU does not fix decode.
      params:
