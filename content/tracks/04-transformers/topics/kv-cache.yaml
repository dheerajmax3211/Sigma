  try_it: >-
    Compute the KV cache for a 7B with 32 layers, 32 KV heads, $d_{\text{head}} = 128$ in fp16 at
    4k and at 128k, then divide one 80 GiB card's free memory by it. You should get 512 KiB per
    token and 33 sequences at 4k against 1 at 128k.
  interview_questions:
    - question: 'Derive the bytes per token in the KV cache and explain why d_model does not appear in the formula.'
      level: mid
      key_points:
        - 'The formula is 2 * L * n_kv * d_head * bytes: two tensors, every layer, every key/value head, per token.'
        - 'For 32 layers, 32 KV heads, d_head 128 and fp16 that is 524,288 bytes, or 512 KiB per token, which is 16 KiB per token per layer.'
        - 'd_model is already the product n_kv * d_head, so it enters only through those two factors and writing it separately double-counts.'
        - 'Grouped-query attention divides the cache by the group count: 8 KV heads give 128 KiB per token, and one KV head gives 16 KiB.'
    - question: 'Batching 32 requests gives about 6x throughput, not 32x. Explain the ceiling.'
      level: senior
      key_points:
        - 'Decode intensity is I(B) = 2N / (N b / B + C), with the weights amortised across the batch and the cache not.'
        - 'It rises from 0.87 FLOP/byte at B = 1 to 5.42 at B = 32 and then flattens at 2N/C = 6.52 for 7B MHA at 4k.'
        - 'The ridge point is 295 FLOP/byte, so even at large batch the step stays memory-bound and the cache dominates the bytes.'
        - 'The asymptote is a division over cache bytes: 13.04 GiB of weights leaves 66.96 GiB, which is 33 sequences at 4k, 4 at 32k and 1 at 128k.'
      follow_up: 'If batching is capped by cache bytes rather than by weights, what does that imply about how a serving system should schedule requests of different lengths?'
    - question: 'Prefill and decode are different machines. Give both intensities and say what each optimisation buys.'
      level: mid
      key_points:
        - 'Prefill runs at about 4,096 FLOP/byte and is compute-bound; decode runs at 0.87 and is bandwidth-bound, a ratio of 4,700x.'
        - 'Prefilling 4,096 tokens is 57.34 TFLOP against 14 GB of weights read once, about 193 ms at 30% MFU.'
        - 'Decoding the same tokens one at a time costs 18.4 s, because each step moves the weights and the whole cache for one token of arithmetic.'
        - 'So prefill optimises FLOPs (fusion, tensor cores, larger tiles) and decode optimises bytes (quantisation, smaller cache, batching).'
  common_mistakes:
    - 'Recomputing the cached prefix each step, which costs Theta(m n^2) instead of Theta(n^2 + mn): 2,545.6 TFLOP against 4.98 TFLOP, a ratio of 511x.'
    - 'Forgetting the position offset when appending to a cached sequence, so every shape stays valid and the output is silently wrong.'
    - 'Sizing the server by parameter count instead of cache bytes, then finding that one 128k sequence needs 64 GiB of an 80 GiB card.'
