          expected: "[[1.0, 2.0, 3.2235174086607583, 4.670552225982275], [0.5, -1.5, 3.206930070754902, 0.5]]"
          mode: json
          tolerance: 1e-09
      solution: |
        import numpy as np

        def norm_block(x, W1, W2, gamma, beta, eps, placement):
            x = np.asarray(x, dtype=np.float64)
            W1 = np.asarray(W1, dtype=np.float64)
            W2 = np.asarray(W2, dtype=np.float64)
            g = np.asarray(gamma, dtype=np.float64)
            b = np.asarray(beta, dtype=np.float64)

            def ln(a):
                mu = a.mean(axis=-1, keepdims=True)
                var = a.var(axis=-1, keepdims=True)
                return (a - mu) / np.sqrt(var + eps) * g + b

            def f(u):
                return np.maximum(u @ W1.T, 0.0) @ W2.T

            if placement == "pre":
                return (x + f(ln(x))).tolist()
            return ln(x + f(x)).tolist()
      solutionExplanation: >-
        The whole problem is one parenthesis. With `W2` zero the branch is zero:
        pre-norm returns `x + 0` exactly — the first case comes back bit-identical
        to the input, max shift 0.0 — while post-norm returns `LN(x + 0)`,
        which re-centres and rescales the stream and moves the first row by 2.658
        in absolute value. That is the identity path, and it is the property the
        residual connection exists to provide. The third and fourth cases pin the
        ordering with a live branch: pre-norm normalises before the sublayer and
        adds the result to the raw `x`, post-norm adds first and normalises the
        sum, and the two disagree on every element. The fifth case changes only
        eps, from 1e-5 to 1e-3, and moves the third element by 8.8e-5 — small,
        but it is the difference between `sqrt(var + eps)` and `sqrt(var) + eps`
        that would move it much further, and it is why the case exists. Note the
        gain is ones and the bias zeros throughout, so any error in the placement
        shows up as a shift in the values rather than being absorbed by the
        affine parameters.
      complexity: "O(n d h) time for the two matmuls, O(n d) extra space"
      tags: [pre-norm, post-norm, identity-path, residual-stream, layer-norm]

  visualizers:
    - id: vs-norm-axis
      kind: tensor
      title: "One token, three axes"
      description: >-
        Send the same token through a feature-axis norm and a batch-axis norm
        while changing what else is in the batch. The feature-axis statistic
        does not move (0.0); the batch-axis statistic moves by up to 2.4038, and
        adding padding to a neighbouring sequence moves it by 1.2643.
      params:
        d_model: 768
        batch_sizes: [1, 2, 8, 64]
        sequences: [12, 7, 4]
        show_drift: true


  try_it: >-
    Pad three sequences of length 12, 7 and 4 to a common length of 12 and measure how far the
    12-token sequence's own representation moves under BatchNorm versus LayerNorm. BatchNorm
    shifts it by 1.2643; LayerNorm moves it by exactly 0.0.
  interview_questions:
    - question: 'Why do transformers normalise per token rather than per batch?'
      level: mid
      key_points:
        - 'The reduction runs over the 768 features of one token, so nothing crosses the batch or the sequence axis.'
        - 'Perturb one other sequence in the batch by +1.0 and this token LayerNorm output moves by exactly 0.0 while its BatchNorm output does not.'
        - 'Padding is the argument that settles it, because a pad is a future token from the statistic point of view: at lengths 12, 7 and 4 padded to 12, BatchNorm shifts the 12-token representation by 1.2643.'
        - 'It also carries no running state, so train and eval are the same function and batch size 1 works.'
    - question: 'Pre-norm or post-norm at depth 48 — what breaks, and what does pre-norm cost you?'
      level: senior
      key_points:
        - 'Only pre-norm keeps an identity path: zero the block output projection and pre-norm returns its input with a measured max shift of 0.0 and a gradient ratio g_0/g_L of 1.000000.'
        - 'Post-norm computes LN(x + f(x)), which puts the LayerNorm Jacobian on the skip route and gives no exact identity.'
        - 'Pre-norm cost is accumulation: the stream grows 1.35x, 1.63x and 2.07x at depths 12, 24 and 48, and 6.56x in the depth-24 unit-scale measurement.'
        - 'That accumulation is why a final LayerNorm is mandatory: without it the unembedding sees a stream 6.56x its expected scale and the logits inherit the factor.'
      follow_up: 'If the stream grows as sqrt(1 + L alpha^2), how would you set the branch scale to keep the final norm near 1?'
    - question: 'What does RMSNorm drop, and why does it still stabilise training?'
      level: mid
      key_points:
        - 'RMS(x) = (sigma/rho) LN(x) + (mu/rho) gamma, with rho the root mean square and sigma/rho at most 1.'
        - 'It drops the mean subtraction and the bias, keeping the division by the root mean square.'
        - 'The stabilising property is invariance to the weight scale, and rho delivers it exactly as sigma does.'
        - 'What the mean subtraction removes is a rank-one component, so the price is a shift in the token representation rather than a loss of stability, and it costs one reduction instead of two.'
  common_mistakes:
    - 'Porting BatchNorm into a transformer, where padding shifts a sequence own representation by 1.2643 and batch size 8 turns the loss into noise.'
    - 'Putting epsilon outside the square root, which changes the realised gain from 0.9535 to 0.9990 at sigma = 1e-2 and destroys the cap at 1/sqrt(eps).'
    - 'Dropping the final LayerNorm after a pre-norm stack, so the unembedding sees a stream 6.56x the scale it expects.'
  further_reading:
    - label: "Ba, Kiros & Hinton, Layer Normalization (2016)"
    - label: "Zhang & Sennrich, Root Mean Square Layer Normalization (NeurIPS 2019)"
