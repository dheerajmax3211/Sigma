id: mixture-of-experts
slug: mixture-of-experts
title: "Mixture of Experts: Routing, Capacity, and Sparsity"
summary: >-
  Replace the block's single FFN with E experts and a router that sends each
  token to k of them, then price the bargain: parameters scale with E, per-token
  arithmetic with k, all E experts stay resident in memory, capacity factors
  decide which tokens get computed at all, and the router collapses to five dead
  experts in fifty steps unless a load-balancing loss is calibrated against the
  task gradient rather than copied from a paper.
kind: lesson
difficulty: expert
position: 13
estMinutes: 30
prerequisites: [transformer-block, mlp-from-scratch]
phase: attention-core
tags: [mixture-of-experts, routing, top-k, load-balancing, expert-collapse, capacity-factor, token-dropping, expert-parallelism, all-to-all, conditional-computation, mistral, mixtral, switch-transformer]

body:
  big_idea: >-
    An MoE swaps one FFN for $E$ of them plus a router that activates $k$ per
    token: parameters grow with $E$, arithmetic with $k$, and the trade pays
    only if the router spreads load.

  problem:
    - >-
      You replicate the FFN eight times: VRAM goes 14 GB to 95 GB, throughput
      is flat, and loss improves less than a width bump.
    - >-
      Three days in, five of eight experts receive zero tokens and zero
      gradient: a 3-expert model with 5 experts' worth of memory.
    - >-
      You set capacity factor 1.0 and 6.4% of tokens are silently discarded;
      at 1.25 it is 0.2%, and a collapsed router needs 2.83.

  analogy: |
    A hospital with eight specialists and one triage desk. Every patient is
    seen by two, but all eight specialists are on the payroll whether or not
    anyone walks into their office. The triage nurse is evaluated only on how
    well the two she picked treated the patient, and nothing in her review
    mentions the queue, so she keeps sending everyone to whoever did well last
    week.

  concept_points:
    - >-
      **Routing is a linear map, a softmax, and a hard selection, and only the softmax carries gradient.**
      With $z = W_g x$, $p = \operatorname{softmax}(z)$ and
      $a = \operatorname{TopK}(p)$, the layer computes
      $y = \sum_{i \in a} p_i f_i(x)$; the selection is piecewise constant, so
      $\partial a/\partial W_g = 0$ almost everywhere. At init the measured
      routing entropy is **2.991 bits** against $\log_2 8 = 3.000$.
    - >-
      **The load-balancing loss is a proxy for a quantity that has no gradient, and the product is the trick.**
      $L_{\text{aux}} = \alpha E \sum_i f_i P_i$ with $f_i$ the fraction of
      assignments and $P_i$ the mean router probability. At $f = P = 1/E$ it
      is exactly **1.0000**; at total collapse **8.0000**. Measured: 1.000 at
      init, 1.013 balanced, **2.349** with five dead. Using $E\sum_i f_i^2$
      instead has exactly zero gradient.
    - >-
      **Without an aux loss, five of eight experts are dead by step 100 and never come back.**
      On a 512-token batch, 8 linear experts, top-1, 600 steps: load entropy
      falls from **2.950** bits to **1.723** at step 50 and **1.572** at step
      100, then never moves. Final counts `[0, 0, 167, 0, 0, 181, 164, 0]`.
      Rich-get-richer: a dead expert produces no gradient to revive it.
    - >-
      **Alpha is not a constant; it is the ratio between two gradients, and the published default can be 349x too weak.**
      At init, mean $|\partial L_{\text{task}}/\partial z| = 8.2\times10^{-2}$
      against $2.35\times10^{-4}$ for the aux term at $\alpha = 0.01$ —
      **349:1**. The measurements are a step function: $\alpha=0.01$ leaves
      1.584 bits with 5 dead, 0.1 gives 2.377 with 2 dead, 0.5 gives **2.981**
      with 8 alive and max share **0.158**.
    - >-
      **Parameters scale with $E$, FLOPs with $k$, and the gap is the entire point.**
      At $d = 768$, $d_{ff} = 3072$ a dense block is **7,080,960** parameters;
      with $E=8$, $k=2$ the block is **40,111,104** total (5.66x) and
      **11,799,552** active (1.67x), because attention and norms are shared.
      Experts are **94.11%** of the block. Mixtral shape: **47.38B** total,
      **13.55B** active — 0.286.
    - >-
      **Every expert is resident, so eight times the parameters costs eight times the memory for twice the arithmetic.**
      47.38B in fp16 is **94.75 GB** against **27.11 GB** active — 6.77x a 7B
      dense model's 14.0 GB. One Mixtral expert is **352.3 MB**, so fetching
      it over PCIe 4.0 x16 costs **14.1 ms**; a batch-1 step needs 64 of
      those, 22.5 GB and 0.90 s per token.

  definitions:
    - term: "Router (gate)"
      meaning: >-
        The matrix $W_g \in \mathbb{R}^{E \times d}$ that turns a token's hidden
        state into $E$ logits, plus the softmax that makes them a distribution
        and the top-k that makes them a decision. It is the only trained
        component whose job is selection, and at 8 experts and $d = 4096$ it is
        32,768 parameters — 0.00007% of a 47B model, deciding where 100% of the
        compute goes.
    - term: "Top-k routing"
      meaning: >-
        Each token is sent to the $k$ experts with the highest router
        probability and its output is the probability-weighted sum of their
        outputs. $k = 1$ is Switch (one expert, FLOPs equal to a dense model of
        the same width); $k = 2$ is GShard and Mixtral (twice the FFN FLOPs,
        smoother gradients, better quality per parameter).
    - term: "Load-balancing loss (aux loss)"
      meaning: >-
        $\alpha E \sum_i f_i P_i$, where $f_i$ is the hard assignment fraction
        and $P_i$ the mean soft probability for expert $i$. Bounded below by 1 at
        a uniform router and above by $E$ at total collapse. It is an auxiliary
        objective, not a constraint: it can be outvoted by the task gradient, and
        usually is at the coefficient people copy.
    - term: "Expert collapse"
      meaning: >-
        The router converging to a distribution concentrated on a few experts,
        leaving the rest with zero assignments and therefore exactly zero
        gradient. Experts have no assigned speciality — at initialisation all $E$
        are near-identical, so the specialisation that appears is whatever the
        router's noise plus the data produced. Measured here: load entropy 2.950
        bits to 1.584 bits within 100 steps, five of eight experts at zero, no
        recovery in 6,000 steps at alpha = 0.01.
    - term: "Load entropy"
      meaning: >-
        $-\sum_i f_i \log_2 f_i$ over the assignment distribution, in bits, with
        a ceiling of $\log_2 E$. Three bits for 8 experts when balanced, 1.584
        when three experts share everything. It is the single number to log
        during MoE training; a falling curve is collapse in progress.
    - term: "Capacity factor (CF)"
      meaning: >-
        The multiplier in $C = \lfloor \mathrm{CF} \cdot kT / E \rfloor$, the
        number of token slots each expert is given. It exists so the per-expert
        matmul has a static shape; the cost is that any excess is dropped and any
        shortfall is wasted allocation. 1.0 is no slack, 1.25 is the common
        training default, 2.0 is what people reach for after a collapse.
    - term: "Token dropping"
      meaning: >-
        Discarding the assignments beyond capacity. A dropped token is not
        removed from the sequence: the block's residual carries it through
        unchanged, so the layer is an identity for that token. Dropping is a
        silent quality regression, not an error.
    - term: "Active vs total parameters"
      meaning: >-
        Total counts every expert; active counts only the $k$ used per token plus
        the shared dense parts. 47.38B total against 13.55B active for an
        8-expert, top-2 model at $d = 4096$ — the ratio that decides whether the
        memory bill is payable.
    - term: "Expert parallelism (EP)"
      meaning: >-
        Placing different experts on different devices so each rank holds $E/N$
        of them. It shards the parameter memory that made the model unloadable,
        and it introduces the two all-to-all passes per layer that make the layer
        a distributed synchronisation problem.
    - term: "All-to-all"
      meaning: >-
        The collective where every rank sends a different buffer to every other
        rank — the transpose of a matmul's data flow. Dispatch sends tokens to
        the ranks owning their experts, combine sends the results back. Two per
        layer, so 64 per forward pass at 32 layers.

  diagrams:
    - type: architecture
      title: "One MoE layer: the FFN is replicated, everything else is untouched"
      nodes:
        - { id: x, x: 0, y: 0, label: "x  (n, d)", kind: client, detail: "The residual stream entering the layer. Every token in it is routed independently; nothing about the router sees the other tokens." }
        - { id: router, x: 1, y: 0, label: "Router  W_g  (E, d)", kind: worker, detail: "32,768 parameters at E=8 and d=4096 — 0.00007% of a 47B model, and it decides where 100% of the layer's compute goes. Logits come out as (n, E)." }
        - { id: topk, x: 2, y: 0, label: "softmax + top-k", kind: worker, detail: "Softmax makes a distribution; top-k keeps k of it. The selection is piecewise constant, so gradient reaches the router only through the kept probabilities, never through the choice." }
        - { id: cap, x: 3, y: 0, label: "capacity + dispatch", kind: queue, detail: "Each expert gets floor(CF * k * n / E) slots. Overflow is dropped: the token keeps its residual and skips the experts. This is also where the first all-to-all happens under expert parallelism." }
        - { id: ex, x: 3, y: 1, label: "E experts, E ranks", kind: gpu, detail: "Each expert is a full FFN: at d=4096, ff=14336 that is 3 x 4096 x 14336 = 176,160,768 parameters, 352.3 MB in fp16, and all E of them stay resident all the time." }
        - { id: comb, x: 2, y: 1, label: "combine (all-to-all)", kind: queue, detail: "The second collective per layer: every rank ships its experts' outputs back to the ranks that own the tokens. 268.4 MB per layer at 8,192 tokens." }
        - { id: sum, x: 1, y: 1, label: "weighted sum of experts", kind: server, detail: "Weighted sum over the k selected experts, using the router probabilities as weights. No parameters here; k=1 makes this a scalar multiply." }
        - { id: out, x: 0, y: 1, label: "x + moe(x)", kind: external, detail: "The residual add, identical to the dense block's. A token that was dropped at this layer leaves with x unchanged — the layer is an identity for it." }
      edges:
        - { from: x, to: router, label: "read" }
        - { from: router, to: topk, label: "logits (n, E)" }
        - { from: topk, to: cap, label: "k indices + probs" }
        - { from: cap, to: ex, label: "dispatch", style: async }
        - { from: ex, to: comb, label: "expert outputs", style: async }
        - { from: comb, to: sum, label: "gathered" }
        - { from: sum, to: out, label: "update" }
        - { from: x, to: out, label: "identity, 0 params" }
      caption: "Everything except the FFN is the block you already have. The two async edges are the only ones that cross a device boundary, and they are where expert parallelism lives."

    - type: pipeline
      title: "One token through the layer, with the decision made at each step"
      nodes:
        - label: "x_t  (d)"
          note: "one token, one row"
          detail: "Routing is per token. Batch it as (n, d) and every row makes its own decision, which is why the load is a property of the batch, not of the model."
        - label: "router logits  (E numbers)"
          note: "E logits, 8 numbers"
          detail: "At init with W_g ~ N(0, 0.02^2), logit std is 0.113 over E=8 — the router has no opinion yet and the tokens land nearly uniformly."
        - label: "p = softmax(z)"
          note: "per-token entropy 2.991 of 3.000 bits at init"
          detail: "Nearly uniform at initialisation. After training with a balanced load the per-token entropy falls to 1.624 bits: the router becomes confident about a token while the load stays spread. Per-token confidence is good; load concentration is not."
        - label: "top-k  ->  k experts"
          note: "k=1 Switch, k=2 Mixtral"
          detail: "The selection has no gradient. What has a gradient is p_i, and it enters the output as a multiplier."
        - label: "capacity check"
          note: "C = floor(CF * k * n / E)"
          detail: "If the expert is full, this assignment is dropped. Measured: 62.5% of assignments dropped at CF=1.0 under a collapsed router, 0.0% at CF=1.25 under a balanced one."
        - label: "expert FFN  d -> ff -> d"
          note: "k x 2 d ff MACs per token"
          detail: "The only arithmetic that scales with k. At d=768, ff=3072, k=2 that is 9,437,184 MACs against the dense block's 4,718,592."
        - label: "weighted sum + residual"
          note: "x + weighted sum"
          detail: "A dropped token contributes nothing and the residual carries it: the layer is the identity for that token."
      caption: "Five of the seven steps are bookkeeping and one is arithmetic. That ratio is why MoE kernels are dispatch code with a matmul in the middle."

