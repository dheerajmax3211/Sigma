  try_it: >-
    Run eight experts with top-1 routing and no auxiliary loss for 100 steps on a 512-token
    batch, recording the load entropy each step. It should fall from 2.950 bits to 1.572 and
    never recover, with five of the eight experts never seeing another token.
  interview_questions:
    - question: 'Why does the router need a load-balancing loss at all?'
      level: mid
      key_points:
        - 'TopK is a piecewise-constant selection, so no gradient flows through the choice itself; only the softmax weights carry gradient.'
        - 'Nothing in the task loss penalises imbalance, so the router is free to collapse and does.'
        - 'The auxiliary loss L_aux = alpha * E * sum_i f_i P_i is a differentiable proxy built from the assignment fraction f_i and the mean probability P_i.'
        - 'It evaluates to exactly 1 at uniform load, so it is a relative measure of collapse rather than an absolute penalty.'
    - question: 'You replicate the FFN eight times, get more VRAM, unchanged throughput and a smaller gain than a width bump. What did you actually buy?'
      level: senior
      key_points:
        - 'Parameters scale with E, FLOPs with k: at d = 768 and d_ff = 3072 the dense block is 7,080,960 parameters, the E = 8 k = 2 block is 40,111,104 total and 11,799,552 active.'
        - 'That is 5.66x the parameters for 1.67x the arithmetic, because attention and the norms are replicated too.'
        - 'Every expert stays resident, so 47.38B parameters in fp16 is 94.75 GB of weights against 27.11 GB of active set, a factor of 3.50.'
        - 'You bought capacity, not throughput, and the question is whether your loss was parameter-limited or compute-limited.'
      follow_up: 'Why is the parameter-to-active ratio 3.50 rather than 8, and what does the difference tell you about where the non-expert parameters are?'
    - question: 'What does a capacity factor do, and what happens to a token that does not fit?'
      level: mid
      key_points:
        - 'C = floor(CF * k * T / E) positions per expert, allocated whether or not the router fills them, which is what turns a ragged computation into a dense matmul.'
        - 'On the collapsed load [0, 0, 167, 0, 0, 181, 164, 0] with T = 512 and E = 8, a capacity factor of 1.0 caps each expert far below what the hot ones received.'
        - 'A dropped token is not lost: with the residual it computes x_{l+1} = x_l, so the block is the identity for that token at that layer.'
        - 'That is why dropping degrades quietly instead of crashing and never appears in the loss curve as a spike.'
      follow_up: 'If a dropped token skips the layer entirely, why does the loss not show a step change when the drop rate rises?'
  common_mistakes:
    - 'Copying alpha = 0.01 from a paper without checking it against the task gradient, where the measured ratio made it 349x too weak.'
    - 'Reading a better loss after adding experts as evidence of more compute, when per-token FLOPs grew 1.67x while resident memory grew 8x.'
    - 'Moving to eight GPUs with expert parallelism and expecting a speedup, when each layer adds two all-to-all passes and 64 global barriers per forward.'
  further_reading:
    - label: "Shazeer, Mirhoseini, Maziarz, Davis, Le, Hinton & Dean, Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (ICLR 2017)"
    - label: "Fedus, Zoph & Shazeer, Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity (JMLR 2022)"
