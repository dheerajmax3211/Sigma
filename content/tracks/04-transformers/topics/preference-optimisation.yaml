id: preference-optimisation
slug: preference-optimisation
title: "Preference Optimization: RLHF and DPO"
summary: >-
  Turn pairwise human judgements into a policy, and see why the KL penalty is
  not a detail — it is the only thing standing between you and a point mass on
  the highest-scoring response.
kind: lesson
difficulty: expert
position: 11
estMinutes: 20
prerequisites: [fine-tuning-lora, information-theory]
phase: alignment
tags: [rlhf, dpo, bradley-terry, kl-divergence, alignment]

body:
  big_idea: >-
    A preference dataset gives no rewards, only"A beats B". Bradley-Terry
    turns comparisons into a reward up to a constant, and every alignment
    method then maximises it while staying close to the reference policy.

  problem:
    - >-
      You optimise against a reward model and outputs get worse while measured
      reward climbs: the model is being exploited and you removed the KL term.
    - >-
      You report pairwise accuracy rising with data, but it saturates near
      0.755 because the ceiling is label noise, while the reward estimate
      keeps sharpening.
    - >-
      You set beta large and the model barely moves; small and it becomes
      deterministic — the small-beta limit has KL exactly $\ln 8$.

  analogy: |
    A wine judge gives only comparisons: "this one is better than that one".
    Enough comparisons fit a single axis of quality, but only up to a
    constant, because nobody states an absolute score. Then you use the
    ranking to decide what to serve: serve only the top wine and the bar has
    one bottle on it. KL keeps the shelf stocked in proportion to quality.

  concept_points:
    - >-
      **Bradley-Terry turns comparisons into a reward, up to a constant.**
      $P(y=1 \mid x_1, x_2) = \sigma((r(x_1) - r(x_2))/\tau)$: only
      differences appear, so adding a constant leaves the likelihood unchanged
      and the reward's absolute scale is meaningless until $\tau$ is fixed.
      Measured on 8 actions, the fit recovers the ranking with correlation
      **0.9988** and RMSE **0.0238** at 5,000 comparisons, but 0.9456 / 0.1758
      at 50.
    - >-
      **Pairwise accuracy saturates; the reward estimate does not.** From 50
      to 5,000 comparisons, RMSE falls **7.4x** (0.1758 to 0.0238) while
      pairwise accuracy stays flat at **0.7556, 0.7429, 0.7543, 0.7582**. The
      ceiling is the label noise( $\tau = 0.5$), not the dataset size: even a
      perfect reward model cannot predict a coin-flip preference. Reporting
      accuracy as evidence that more data helps is misleading.
    - >-
      **The KL-regularised optimum has a closed form, and it is a softmax over the reward.**
      Maximising $\mathbb{E}_{p}[r] - \beta\,\mathrm{KL}(p\|p_{\text{ref}})$
      gives $p^\star(a) \propto p_{\text{ref}}(a)\exp(r(a)/\beta)$ exactly.
      Measured over 8 actions with a uniform reference: $\beta = 0.25$ yields
      true reward **0.7374** at KL **0.7993**; $\beta = 1.0$ yields 0.4237 at
      KL 0.0943. Alignment is choosing a point on that curve.
    - >-
      **Small beta collapses to a point mass, and the limit is exactly $\ln n$.**
      At $\beta = 0.01$ the policy puts probability **1.000** on the best
      action and its KL against the uniform reference is **2.0794**, which is
      $\ln 8$ to four decimals. This is the endpoint RLHF walks toward if the
      KL term is dropped, and why "reward went up" and "quality went up"
      differ.
    - >-
      **DPO is the same optimum with the reward substituted out.** Since
      $r(a) = \beta\log(p^\star(a)/p_{\text{ref}}(a)) + C$ at the optimum,
      feeding that back into Bradley-Terry gives a loss in the policy alone —
      no reward model, no sampling loop. Verified numerically: reconstructing
      the implicit reward as $\beta\log(p/p_{\text{ref}})$ reproduces the
      fitted reward to **$2.22\times10^{-16}$** maximum absolute error,
      correlation 1.0000000000.
    - >-
      **Beta is a KL budget, and it is the only knob that matters at fixed data.**
      Doubling $\beta$ from 0.25 to 0.5 cuts KL from **0.7993 to 0.3079**
      (2.6x) and drops true reward from **0.7374 to 0.5694**. No setting gives
      both. Beta is a business decision about how far from the reference model
      you will travel, expressed in nats, not a hyperparameter to tune for
      reward.

  definitions:
    - { term: "Bradley-Terry model", meaning: "A pairwise comparison model where $P(i \\succ j) = \\sigma((r_i - r_j)/\\tau)$. Identifies rewards only up to an additive constant." }
    - { term: "Reward model", meaning: "A network trained by BT maximum likelihood to score responses. Used as the objective in RLHF." }
    - { term: "Reference policy", meaning: "The frozen policy (usually the SFT model) that the KL penalty is measured against. Defines what 'staying close' means." }
    - { term: "KL penalty", meaning: "$\\beta \\, \\mathrm{KL}(p \\| p_{\\text{ref}})$, added to the reward objective. Bounds how far the policy can travel; without it the optimum is a point mass." }
    - { term: "Beta", meaning: "The KL coefficient. Inverse temperature on the reward. Small beta means aggressive optimisation and high KL." }
    - { term: "DPO", meaning: "Direct Preference Optimisation: a classification loss on preference pairs that has the KL-regularised optimum as its solution, with no explicit reward model." }
    - { term: "Implicit reward", meaning: "$\\beta \\log(p(y)/p_{\\text{ref}}(y))$ — the reward implied by a policy under the DPO reparameterisation." }
    - { term: "KTO", meaning: "Kahneman-Tversky Optimisation: uses unpaired binary feedback with a prospect-theory utility instead of pairs." }
    - { term: "ORPO", meaning: "Odds-Ratio Preference Optimisation: adds a preference penalty to SFT, needing no reference model." }
    - { term: "Over-optimisation", meaning: "Proxy reward rising while true quality falls, as the policy exploits regions where the reward model is wrong." }
    - { term: "Pairwise accuracy", meaning: "Fraction of held-out pairs the model ranks correctly. Saturates at the label-noise ceiling." }
    - { term: "Pointwise reward", meaning: "An absolute score. BT cannot produce one without an anchor — only differences are identified." }

  diagrams:
