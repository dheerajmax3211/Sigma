id: fine-tuning-lora
slug: fine-tuning-lora
title: "Fine-Tuning: Full, LoRA, QLoRA, Prefix, and Adapter"
summary: >-
  Fine-tuning changes a model's function without changing most of its weights: a
  rank-r update added to six matrices per layer touches 0.59% of a 7B model's
  parameters, and the engineering is deciding which matrices, at what rank, at
  what precision, and whether the update has to survive being merged back into
  the base. Measured here on a 2-layer transformer fine-tuned on three tasks:
  rank 1 to 4 buys a 60x loss reduction and rank 8 to 64 buys 2.5x, attention
  adapters fit a re-routing task to 0.0033 nats while MLP adapters sit at 3.13,
  and a 4-bit base costs 3.9x less memory for no measurable accuracy.
kind: lesson
difficulty: expert
position: 10
estMinutes: 34
prerequisites: [pretraining-objectives, optimisation-in-practice]
phase: "adaptation"
tags:
  - fine-tuning
  - lora
  - qlora
  - peft
  - low-rank
  - nf4
  - quantisation
  - adapters
  - prefix-tuning
  - merging
  - catastrophic-forgetting

body:
  big_idea: >-
    A fine-tune only has to change the model's function, and a rank- $r$
    update to a few weight matrices changes it enough while touching a
    fraction of a percent of the parameters.

  problem:
    - >-
      Full fine-tuning needs 16 bytes of state per parameter — 100.4 GiB
      before an activation — which does not fit on eight 80 GB cards.
    - >-
      You ship a fine-tuned 7B that can no longer do arithmetic, and eleven
      variants at 12.6 GiB each is 151 GiB for one product surface.
    - >-
      You merge the adapter and the outputs are wrong, because the merge
      scaled by $\alpha$ instead of $\alpha/r$: eight times too large.

  analogy: |
    A road atlas has 400 pages. Instead of reprinting it, you lay tracing
    paper over each page and draw the corrections: this bridge is closed, that
    junction is now a roundabout. The atlas underneath is untouched; your copy
    is atlas plus one sheet per page. The sheets start blank, which is what
    initialising $B$ at zero buys.

  concept_points:
    - >-
      **The update is a product of two thin matrices, so its rank is bounded by $r$ and its bill is $r(d+k)$ rather than $dk$.**
      For $d \times k$ weights you train $B \in \mathbb{R}^{d \times r}$ and
      $A \in \mathbb{R}^{r \times k}$, adding $\Delta W = \frac{\alpha}{r}BA$.
      On a 7B with $d = 4096$: $r=4$ gives 9,994,240 parameters (0.1483%),
      $r=8$ 19,988,480 (**0.2966%**), $r=16$ 39,976,960 (0.5932%), $r=64$
      159,907,840 (2.3730%).
    - >-
      **Initialising $B = 0$ makes step zero an exact no-op, and it also makes $A$'s gradient exactly zero for one step.**
      Measured, the loss before and after attaching the adapter is 13.733208
      against 13.733208, with max logit change exactly **0.000e+00**. The
      gradient to $A$ is $\frac{\alpha}{r}B^\top\partial L/\partial W'$ =
      **0.0**, while $B$ gets 0.1907, so only $B$ moves first. Initialise
      **both** factors at zero and the adapter is dead forever.
    - >-
      **$\alpha/r$ is a scale on the update, not a schedule, and it does not commute with the learning rate.**
      At fixed $r=8$, lr $=5\times10^{-3}$, 200 steps: $\alpha=2$ reaches
      2.5208, $\alpha=8$ 1.5590, $\alpha=32$ **0.0355**, $\alpha=128$
      **3.4400** — against $\ln 32 = 3.4657$, so the largest scale has
      flattened the model to uniform. Five runs at constant
      $\text{scale} \times \text{lr}$ gave 3.4322 down to 0.0011.
    - >-
      **Rank has a knee, and past the knee the parameters are wasted.** Same
      task, 800 steps, $\alpha = 2r$ so scale is fixed: $r=1$ gives 0.0510
      nats (1,792 parameters), $r=2$ 0.0041, $r=4$ 0.00085, $r=8$ 0.00085,
      $r=16$ **0.00038**, $r=64$ 0.00034. The first two doublings buy 60x, the
      last three 2.5x. A full fine-tune's top 8 singular values hold **79.5%**
      of the update's energy on this task.
    - >-
      **Placement is a property of the change the task requires, not of LoRA.**
      At $r=8$, $\alpha=16$, 800 steps on a base scoring 13.73 nats: a
      *re-routing* task is fitted by attention adapters alone (0.0033) against
      **3.1251** for MLP adapters alone — MLP-only is **6,430x** worse. A
      *relabelling* task is fitted by either (0.0035 attention, 0.0054 MLP,
      0.0015 all). A task needing both moves under neither group.
    - >-
      **The merge is where the $\alpha/r$ convention either survives or breaks silently.**
      Serving folds the adapter in because
      $(W + \frac{\alpha}{r}BA)x = Wx + \frac{\alpha}{r}B(Ax)$: measured,
      factorised and merged paths agree to **4.796e-14** absolute in float64.
      Merge with scale $\alpha$ instead of $\alpha/r$ — 8x too large at $r=8$
      — and held-out loss goes from 0.001934 to **3.9646** (2,050x) with a max
      logit change of 18.22. Nothing raises.

  definitions:
    - term: "LoRA (low-rank adaptation)"
      meaning: >-
        Freezing $W$ and training two small matrices $B$ ($d \times r$) and $A$
        ($r \times k$) whose product, scaled by $\alpha/r$, is added to $W$. The
        parameter count is $r(d+k)$ instead of $dk$ and the update's rank is at
        most $r$; the point is that the frozen base can be shared across many
        adapters and the adapter can be merged away at serving time.
    - term: "Rank r"
      meaning: >-
        The inner dimension of the adapter, and therefore the maximum rank of
        $\Delta W$ — the number of independent directions the fine-tune is
        allowed to move the layer in. Measured here: $r = 1$ already reaches
        0.9989 accuracy on a relabelling task, the re-routing task's loss stops
        improving between 4 and 8, and $r = 64$ is still not enough for a task
        that needs a two-token arithmetic table.
    - term: "alpha (lora_alpha)"
      meaning: >-
        A scalar with no parameters that divides by $r$ and multiplies the
        low-rank term, so the update is $(\alpha/r)BA$. It exists so that
        changing $r$ does not force you to retune the learning rate; setting
        $\alpha = 2r$ holds the scale at 2. It is the only part of the adapter
        that lives purely in code, which is why it is the part a merge script
        gets wrong.
    - term: "Delta W"
      meaning: >-
        The additive update $\frac{\alpha}{r}BA$ to a frozen weight matrix.
        Low-rank by construction, but not necessarily small: measured at 66.5%
        of the adapted matrices' combined Frobenius norm for an adapter that
        solved the routing task.
    - term: "Adapter"
      meaning: >-
        Any small trainable module attached to a frozen base. LoRA's adapter is
        a parallel low-rank branch that can be merged; a Houlsby adapter layer
        is a serial bottleneck MLP that cannot. "Adapter" alone does not tell
        you which, and the difference decides your inference cost.
    - term: "QLoRA"
      meaning: >-
        LoRA on a base quantised to 4-bit NF4, with the adapters kept in bf16
        and gradients computed through a dequantised copy of each block. The
        base is frozen and never updated, so the quantisation error is fixed
        rather than accumulated — which is why 4-bit weights work here but not
        in full fine-tuning.
    - term: "NF4 (4-bit NormalFloat)"
      meaning: >-
        A 16-entry codebook whose levels are quantiles of a standard normal, so
        that each level is equally likely for normally distributed weights.
        Stored as 4-bit indices plus one absmax scale per block of 64. Measured
        against uniform int4 on Gaussian weights it is 1.060x closer; with 1%
        of weights at 10 sigma it is 1.472x closer, which is the case the
        codebook exists for.
    - term: "Double quantisation"
      meaning: >-
        Quantising the absmax constants themselves, in blocks of 256, with
        8-bit values and one fp32 scale per block. The absmax goes from 0.5 bits
        per weight to 0.127, so the format goes from 4.5 bits to 4.127 — 0.5625
        to 0.5159 bytes per parameter, an 8.3% saving on the weight bytes.
    - term: "Merged weights"
      meaning: >-
        $W' = W + \frac{\alpha}{r}BA$, materialised so the adapter disappears
        from the forward pass. Algebraically exact, numerically exact to
        3.2e-15 relative in float64 and 1.1e-06 in float32 (measured), and
        irreversible: after merging you can no longer separate the adapter from
        the base to serve a second task.
    - term: "Prefix tuning"
      meaning: >-
        Learning $p$ key/value vectors per layer and prepending them to every
        attention call, so the "prompt" is trained rather than written.
        2,621,440 parameters at $p = 10$ on a 32-layer 7B (0.0389%), but it
        consumes $p$ context positions, costs 5.0 MiB of KV cache per sequence,
        and cannot be merged.
    - term: "Adapter layer (Houlsby)"
      meaning: >-
        A bottleneck MLP — down-project to $r$, nonlinearity, up-project back to
        $d$ — inserted in series after attention and after the FFN, with a
        residual. 4,194,304 parameters at $r = 16$ on a 32-layer 7B (0.0622%),
        but it adds depth to the network, so its latency is paid on every token
        and it cannot be folded into an existing weight.
    - term: "Catastrophic forgetting"
      meaning: >-
        The loss of pretrained capability that accompanies full fine-tuning,
        because every weight is free to move. LoRA does not abolish it — a
        rank-8 update at 66% of the base's norm can still change every
        prediction — but it bounds the update's rank and leaves the base
        untouched as an artefact you can always go back to.

  diagrams:
    - type: architecture
      title: "Where the adapter sits, and what the merge removes"
      nodes:
        - id: x
          x: 0
          y: 1
          label: "hidden state x"
          kind: model
          detail: "One token's residual stream, 4096 floats. Every adapted matrix in the block reads from this same vector, which is why the adapters compose additively rather than in series."
        - id: w
          x: 1
          y: 0
          label: "frozen W"
          kind: storage
          detail: "4096 x 4096, 16.7M parameters, bf16, never updated and never in the optimizer. This is the object that gets shared across every adapter you train."
        - id: b
          x: 1
          y: 2
          label: "B: 4096 x r"
          kind: model
          detail: "Initialised to zero, so the branch contributes nothing at step 0. Its gradient at step 0 is the only non-zero one in the adapter, which is why it moves first."
        - id: a
          x: 2
          y: 2
          label: "A: r x 4096"
          kind: model
          detail: "Initialised randomly at 1/sqrt(d) and frozen for exactly one step, because its gradient is proportional to B. Rank r is the whole budget: A and B together hold r(d+k) numbers."
        - id: sum
          x: 3
          y: 1
          label: "Wx + (alpha/r) B(Ax)"
          kind: server
          detail: "The merge replaces this node with a single matrix W' = W + (alpha/r) BA, at which point the branch and its two matmuls disappear. Measured agreement between the two forms: 3.2e-15 relative in float64."
      edges:
        - from: x
          to: w
          label: "x"
        - from: x
          to: b
          label: "x (same vector)"
        - from: b
          to: a
          label: "r floats"
        - from: w
          to: sum
          label: "dk"
        - from: a
          to: sum
          label: "scaled by alpha/r"
      caption: "The adapter is a parallel branch, not an inserted layer. That is the structural reason it can be merged: both paths are linear in x, so they add — which is exactly what a prefix or a bottleneck adapter cannot do."

    - type: plot
      title: "Rank against held-out loss at a fixed alpha/r scale of 2"
      chart: line
      xLabel: "rank r"
      yLabel: "held-out loss, nats"
      series:
