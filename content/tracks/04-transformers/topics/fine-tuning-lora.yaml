          points:
            - { x: 1, y: 0.050967 }
            - { x: 2, y: 0.004107 }
            - { x: 4, y: 0.000847 }
            - { x: 8, y: 0.000853 }
            - { x: 16, y: 0.000383 }
            - { x: 32, y: 0.000360 }
            - { x: 64, y: 0.000345 }
        - name: "relabelling task (all six matrices)"
          points:
            - { x: 1, y: 0.082869 }
            - { x: 2, y: 0.010616 }
            - { x: 4, y: 0.003123 }
            - { x: 8, y: 0.001624 }
            - { x: 16, y: 0.000787 }
            - { x: 32, y: 0.000461 }
            - { x: 64, y: 0.000270 }
      caption: "Same steps, same data, alpha = 2r so the scale is constant and rank is the only variable. r = 1 to 4 buys 60x; r = 8 to 64 buys 2.5x for 8x the parameters. The parameters go 1,792 to 114,688 across the axis."

    - type: plot
      title: "Which matrices, on three tasks with different requirements"
      chart: bar
      xLabel: "adapted matrices (1 = attention only, 2 = MLP only, 3 = all six)"
      yLabel: "log10 of held-out loss (lower is better)"
      series:
        - name: "re-routing task"
          points:
            - { x: 1, y: -2.487 }
            - { x: 2, y: 0.495 }
            - { x: 3, y: -3.313 }
        - name: "relabelling task"
          points:
            - { x: 1, y: -2.457 }
            - { x: 2, y: -2.266 }
            - { x: 3, y: -2.821 }
