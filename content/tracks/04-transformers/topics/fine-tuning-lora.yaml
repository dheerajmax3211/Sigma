      latex: |
        Write the frozen weight as $W \in \mathbb{R}^{d \times k}$ and the update
        as a product of two factors with a shared inner dimension:

        $$\Delta W = \frac{\alpha}{r}BA, \qquad
          B \in \mathbb{R}^{d \times r}, \quad A \in \mathbb{R}^{r \times k}.$$

        By the rank inequality
        $\operatorname{rank}(XY) \le \min(\operatorname{rank}X,
        \operatorname{rank}Y)$, and since $B$ has at most $r$ columns and $A$ at
        most $r$ rows,

        $$\operatorname{rank}(\Delta W) \le r .$$

        The parameter count is the number of entries in the two factors,

        $$N_{\text{LoRA}} = dr + rk = r(d+k), \qquad N_{\text{full}} = dk,$$

        so the fraction of one layer's weights that becomes trainable is

        $$\frac{N_{\text{LoRA}}}{N_{\text{full}}}
          = \frac{r(d+k)}{dk} = r\left(\frac{1}{d} + \frac{1}{k}\right).$$

        For $d = k = 4096$ and $r = 8$ that is
        $8 \times (1/4096 + 1/4096) = 0.0039$; for an MLP matrix with
        $d = 4096$, $k = 11008$ and $r = 8$ it is 0.0026, so the MLP matrices
        are cheaper per parameter than the square attention matrices. Summing
        over the 7B's 32 layers — four $4096 \times 4096$ and three
        $4096 \times 11008$ per layer — gives 19,988,480 parameters at $r = 8$,
        which is 0.2966% of 6,738,713,856.
      prose: >-
        The rank is the only thing that constrains the *shape* of the update;
        the parameter count is what that rank costs at the layer's dimensions.
        The two are often conflated, which is how "0.6% of the parameters" gets
        quoted for ranks that differ by 16x.

    - title: "Why B is zeroed and A is not: the gradient at the origin"
      latex: |
        Let $W' = W + \frac{\alpha}{r}BA$ and let
        $G = \partial L/\partial W'$ be the gradient with respect to the
        effective matrix, which is what the backward pass produces anyway. By
        the chain rule,

        $$\frac{\partial L}{\partial B}
            = \frac{\alpha}{r}\,G A^{\top}, \qquad
          \frac{\partial L}{\partial A}
            = \frac{\alpha}{r}\,B^{\top} G .$$

        Evaluate at the initialisation $B = 0$, $A = A_0 \ne 0$:

        $$\left.\frac{\partial L}{\partial B}\right|_{B=0}
            = \frac{\alpha}{r}G A_0^{\top} \ne 0, \qquad
          \left.\frac{\partial L}{\partial A}\right|_{B=0}
            = \frac{\alpha}{r}\cdot 0 \cdot G = 0 .$$

        So the first update is $\Delta B_1 \ne 0$, $\Delta A_1 = 0$, and the
        adapter's first non-zero contribution is
        $\frac{\alpha}{r}\Delta B_1 A_0$ — rank at most $r$, built from a random
        $A_0$ and a gradient-informed $B$. If instead $A_0 = 0$ the roles swap,
        and if *both* are zero,

        $$\frac{\partial L}{\partial B} = \frac{\alpha}{r}G \cdot 0 = 0,
          \qquad \frac{\partial L}{\partial A} = \frac{\alpha}{r}\cdot 0 \cdot G = 0,$$

        both gradients vanish identically and the pair is a fixed point of
        gradient descent for every learning rate. Measured on this rig:
        $|g_A| = 0.0$ and $|g_B| = 0.0$ exactly, against 0.1907 for $B$ at the
        standard initialisation.
      prose: >-
        The asymmetry is not a convention; it is what makes the adapter a no-op
        at step 0 while still being trainable. Zeroing both factors makes the
        origin an absorbing state, and the failure is silent because the loss
        curve is flat and looks like a learning-rate problem.

    - title: "The merge is an identity, and float32 tells you how exact"
      latex: |
        Both paths are linear in the input, so

        $$Wx + \frac{\alpha}{r}B(Ax)
            = \left(W + \frac{\alpha}{r}BA\right)x .$$

        The left side costs $dk + r(d+k)$ multiply-adds and keeps the adapter
        separate; the right side costs $dk$ and has no adapter. Writing
        $s = \alpha/r$ and $\Delta W = sBA$, the two floating-point evaluations
        differ only by association order, so the error is bounded by the
        rounding of the intermediate products:

        $$\left\| (W + \Delta W)x - (Wx + \Delta W x) \right\|
          \lesssim \varepsilon_{\text{mach}} \,
          \left( \|W\| \, \|x\| + s\,\|B\| \, \|A\| \, \|x\| \right),$$

        with $\varepsilon_{\text{mach}} \approx 2.2\times10^{-16}$ in float64
        and $1.2\times10^{-7}$ in float32. Measured over 1,024 sequences:
        3.236e-15 relative in float64 and 1.144e-06 in float32 — inside the
        bound, and four orders of magnitude below the ~1e-6 the topic claims.
        The convention is the fragile part: using $\alpha$ instead of
        $\alpha/r$ changes $\Delta W$ by a factor of $r$, which is not a
        rounding error but a different model.
      prose: >-
        Merging is exact enough that "does the merged model match the adapter"
        is a one-line test you should run before shipping, and the test that
        matters is the one the algebra cannot do for you: whether the scale you
        merged with is the scale you trained with.

  implementations:
    - language: python
      title: "A LoRA layer: exact accounting, the B = 0 init, the split forward, and the merge"
      note: >-
        Correct, and deliberately explicit about the three things that go wrong:
        the parameter count ($r(d+k)$ per matrix, summed over the matrices you
        actually chose — which is why a fraction is meaningless without the
        module list), the initialisation (B exactly zero, A random, never both),
        and the merge scale. It reproduces this topic's merge measurement: the
        factorised and merged paths agree to about 2e-16 relative in float64 and
        1e-7 in float32, and the `audit` function is the one-line test that
        catches the $\alpha$ convention. The one simplification is that it
        operates on a single matrix rather than a whole block, which changes
        nothing about the arithmetic.
      code: |
        import numpy as np


        class LoRALinear:
            """A frozen W with a trainable rank-r branch, and a merge."""

            def __init__(self, W, r, alpha, rng):
                self.W = W.copy()
                d, k = W.shape
                self.r, self.alpha = r, alpha
                # A random, B exactly zero: the branch is the zero matrix, so
                # the layer is the pretrained layer until the first step runs.
                self.A = rng.normal(0.0, 1.0 / np.sqrt(d), (r, k))
                self.B = np.zeros((d, r))

            @property
            def scale(self):
                return self.alpha / self.r

            def delta(self):
                return self.scale * (self.B @ self.A)

            def forward(self, x):
                """x @ W + scale * (x @ B) @ A   -- never materialises delta."""
                return x @ self.W + self.scale * ((x @ self.B) @ self.A)

            def merged(self):
                """W + scale * B @ A, materialised. Algebraically identical."""
                return self.W + self.delta()

            def forward_merged(self, x):
                return x @ self.merged()

            def n_trainable(self):
                return self.A.size + self.B.size


        def lora_param_count(shapes, r, base_params):
            """r(d+k) per matrix, and the fraction of the whole model."""
            trainable = sum(r * (d + k) for d, k in shapes)
            return {"trainable": trainable, "fraction": trainable / base_params}


        # measured on the rig: max relative difference between forward() and
        # forward_merged() over 1024 sequences
        #   float64 -> 3.236e-15      float32 -> 1.144e-06
        print(lora_param_count([(4096, 4096)] * 4 + [(4096, 11008)] * 3, 8,
                               6_738_713_856))

