          points:
            - { x: 1, y: 0.540 }
            - { x: 2, y: 0.540 }
            - { x: 3, y: 0.517 }
      caption: "r = 8, alpha = 16, 800 steps, batch 128, two seeds. Raw losses: re-routing 0.0033 / 3.1251 / 0.00049; relabelling 0.0035 / 0.0054 / 0.0015; arithmetic 3.4682 / 3.4666 / 3.2861 against a base of 14.32. The relabelling task is the one where placement does not matter, and the reason is that a 32-token relabel is a linear map on 64-dimensional embeddings."

    - type: compare
      title: "Full fine-tuning, LoRA, and QLoRA on the same 7B"
      left_label: "Full fine-tuning: every parameter, 16 bytes of state each"
      left_points:
        - "100.41 GiB of weights, gradients, fp32 master copy and two Adam moments, before any activation"
        - "One model per task: 12 variants is 151 GiB of bf16 weights to host"
        - "Measured on this rig's hardest task: 0.0434 nats, the best number any method reached"
        - "Every weight is free to move, so pretrained capability is not protected"
        - "No merge step, because there is nothing separate to merge"
      right_label: "LoRA and QLoRA: 0.59% of the parameters at r = 16"
      right_points:
        - "12.92 GiB for LoRA on a bf16 base; 3.61 GiB for QLoRA on an NF4 base"
        - "One base plus 76.25 MiB per adapter at r = 16, so 100 tasks is 7.45 GiB of adapters"
        - "Measured: 0.00038 on re-routing against full FT's 0.00153; 0.179 against 0.0434 on the arithmetic task"
        - "The base is frozen, so the worst case is a bad adapter, not a damaged base"
        - "Mergeable: measured agreement 3.2e-15 in float64, 1.1e-06 in float32"
      caption: "The trade is not quality against memory; it is rank against everything you can no longer express. Compared at 800 steps and batch 128 on identical data, with lr 5e-3 for the adapters and 2e-3 for full fine-tuning — matched on tokens and steps, not on tuning. Two of three tasks favoured the adapter; the third needed a computation the base could not express at rank 8."

    - type: pipeline
      title: "One adapter, from a frozen checkpoint to a merged model"
      nodes:
        - label: "Load the base in the serving dtype"
          note: "bf16, or NF4 if memory is the binding constraint"
          detail: "Freeze everything: no gradients, no optimizer state, no fp32 master copy. This single decision is where 16 bytes per parameter becomes 2."
        - label: "Choose the matrices"
          note: "all six per layer, or attention only at 4x the rank for the same bill"
          detail: "Measured: attention-only fits a re-routing task to 0.0033 and cannot fit a two-token arithmetic task at all. All-linear is the safe default until you have measured otherwise."
        - label: "Attach A and B"
          note: "A random at 1/sqrt(d), B exactly zero"
          detail: "B = 0 makes step 0 an exact no-op and zeroes A's gradient for one step. Both zero is a dead adapter with two exactly-zero gradients."
        - label: "Train adapters only"
          note: "alpha = 2r, lr 5e-3 here, cosine over 800 steps"
          detail: "The effective scale on the update is alpha/r times the Adam step in B. Keeping the product constant across ranks is not the same as keeping the behaviour constant: at a fixed product of 0.04, five alpha/lr pairs ranged from 0.0011 to 3.4322."
        - label: "Evaluate on held-out data"
          note: "report the loss, the accuracy, and the rank that produced them"
          detail: "Rank 1 to 4 bought 60x here and rank 8 to 64 bought 2.5x, so the number you quote has to carry its rank or it means nothing."
        - label: "Merge, or keep the adapter separate"
          note: "merge for one task, keep separate for many"
          detail: "Merging is exact to 3.2e-15 relative in float64. Merging with alpha instead of alpha/r multiplies the update by r and took this topic's loss from 0.0019 to 3.9646."
      caption: "Every step has a number that can go wrong silently. The two that fail without an exception are the matrix choice (it just trains badly) and the merge scale (it just produces a different model)."

  markdown: |
    ## The update is a product

    A fine-tune wants to change $W$ by some $\Delta W$. LoRA's assumption is that
    the $\Delta W$ a fine-tune needs is low-rank, so it parameterises the update
    as a product of two thin matrices:

    $$\Delta W = \frac{\alpha}{r}BA, \qquad B \in \mathbb{R}^{d \times r},
      \quad A \in \mathbb{R}^{r \times k}, \qquad
      \operatorname{rank}(\Delta W) \le \min(\operatorname{rank}B,
      \operatorname{rank}A) \le r .$$

    The forward pass never materialises $\Delta W$:

    $$h = Wx + \frac{\alpha}{r}B(Ax),$$

    which costs $dk$ multiply-adds for the frozen path and $r(d+k)$ for the
    branch — 0.39% extra at $r = 8$ on a $4096 \times 4096$ matrix. The parameter
    bill is the same $r(d+k)$, so for a Llama-shaped 7B with $d = 4096$,
    32 layers, $d_{ff} = 11008$ and 6,738,713,856 parameters:

    | rank | attention only ($q,k,v,o$) | % of 7B | all linear (+ MLP) | % of 7B |
    |---|---|---|---|---|
    | 4 | 4,194,304 | 0.0622% | 9,994,240 | 0.1483% |
    | 8 | 8,388,608 | 0.1245% | 19,988,480 | 0.2966% |
    | 16 | 16,777,216 | 0.2490% | 39,976,960 | 0.5932% |
    | 64 | 67,108,864 | 0.9959% | 159,907,840 | 2.3730% |

    The oft-quoted "0.6% of the parameters" is the right-hand column at
    $r = 16$: every linear layer. The same 40.0M parameters is approximately
    $r = 38$ on attention alone, and a table that quotes the fraction without
    the rank and the module list is quoting a coincidence.

    ## Initialisation: why $B = 0$

    At $B = 0$ the branch contributes the zero matrix, so step 0 *is* the
    pretrained model. Measured on this rig: loss 13.733208 before attaching the
    adapter and 13.733208 after, with a maximum change in any logit of exactly
    0.000e+00.

    The gradients explain why the asymmetry is deliberate:

    $$\frac{\partial L}{\partial B} = \frac{\alpha}{r}\,
      \frac{\partial L}{\partial W'}A^{\top}, \qquad
      \frac{\partial L}{\partial A} = \frac{\alpha}{r}\,
      B^{\top}\frac{\partial L}{\partial W'}.$$

    At $B = 0$ the second is exactly zero, so $A$ cannot move on step 1 while
    $B$ moves with gradient 0.1907 (measured); from step 2 both move. Zeroing
    *both* factors kills both gradients — measured 0.0 and 0.0 — so the origin
    is an absorbing state, which is why "initialise everything to zero so it
    starts neutral" produces a module that trains forever and changes nothing.

    ## alpha, r, and the learning rate

    $\alpha$ has no parameters. It exists so that changing $r$ does not change
    the size of the update, and $\alpha = 2r$ holds the scale at 2 regardless of
    rank. Measured at fixed $r = 8$, lr $= 5\times10^{-3}$, 200 steps:

    | alpha | scale alpha/r | held-out loss | accuracy |
    |---|---|---|---|
    | 2 | 0.25 | 2.5208 | 0.367 |
    | 8 | 1.0 | 1.5590 | 0.595 |
    | 32 | 4.0 | 0.0355 | 0.992 |
    | 128 | 16.0 | 3.4400 | 0.068 |

    The last row is the useful one: 3.4400 is $\ln 32 = 3.4657$ to within 0.026
    nats, so the largest scale did not train faster — it flattened the model to
    the uniform distribution. And $(\alpha, \text{lr})$ are not interchangeable
    even at constant product: five runs with
    $\text{scale} \times \text{lr} = 0.04$ gave 3.4322, 3.4244, 2.8752, 0.0079
    and 0.0011 as the scale moved from 1 to 16 and the lr fell to compensate.
    Adam normalises the gradient, so the lr sets the step in $B$ while
    $\alpha/r$ scales the product $BA$; moving the scale into the lr unbalances
    the factorisation.

    ## Which matrices

    | task | attention only | MLP only | all six |
    |---|---|---|---|
    | re-routing (attend 15-t instead of t-8) | 0.0033 | 3.1251 | **0.00049** |
    | relabelling (fixed permutation of tokens) | 0.0035 | 0.0054 | **0.0015** |
    | two-token arithmetic (retrieve two, add mod 32) | 3.4682 | 3.4666 | **3.2861** |

    The base model scores 13.73, 14.32 and 15.21 nats on those three tasks
    before any adapter is attached. Every run above is $r = 8$, $\alpha = 16$,
    800 steps, batch 128, two seeds. The relabelling row explains the folklore:
    mapping 32 embedding vectors onto 32 others is a linear map with 2,048
    constraints and 4,096 free parameters in a single output projection, so it
    needs no MLP and no rank — MLP-only lands at 0.0054, within 3.5x of the
    best. The arithmetic task needs a computation the base's features do not
    contain, and neither group alone moves it. The routing row is where
    placement is not a matter of taste: MLP-only is 6,430x worse than
    all-linear.

    ## Rank is a capacity ceiling

    On the arithmetic task, the $r = 8$ adapter sits at 3.4548, 3.4680, 3.4690
    and 3.4683 for lr $= 2\times10^{-3}, 2\times10^{-2}, 5\times10^{-2},
    2\times10^{-1}$ — a 100x range that moves the loss by 0.014 nats. At
    $r = 64$, same steps, same lr $= 2\times10^{-3}$, it reaches 0.1793
    (accuracy 0.9745); full fine-tuning reaches 0.0434. That is a rank ceiling
    demonstrated by *failing* to move it with the learning rate, which is the
    only way to tell the two apart.

    But the ceiling is task-specific: on re-routing LoRA at $r = 16$ reaches
    0.00038 against full fine-tuning's 0.00153, and on relabelling 0.00079
    against 0.00097 — same steps and batch, but lr $5\times10^{-3}$ against
    $2\times10^{-3}$, so matched on tokens and steps rather than on tuning. Both
    generalisations — "LoRA matches full FT" and "LoRA cannot learn algorithms"
    — are wrong as stated.

    ## Memory, and what QLoRA's 4 bits buy

    NF4 stores 4-bit indices plus one fp32 absmax per 64 weights — 4.5 bits,
    or 0.5159 bytes once the absmax is itself double-quantised, against 2.0 for
    bf16 and 4.0 for fp32. On the 7B that is 3.24 GiB against 12.55 and 25.10.
    Total training memory is 100.41 GiB for a full fine-tune at 16 bytes per
    parameter, 12.92 GiB for LoRA on a bf16 base and 3.61 GiB for QLoRA — the
    frozen base is 97% of LoRA's bill, and the adapter's gradients and optimizer
    state are the other 0.37 GiB.

    The quality side, measured: the same adapter, same 800 steps, on an NF4 base
    against a float64 base gave 0.000463/0.000451 and 0.000877/0.000545 on
    re-routing, 0.001632/0.001431 and 0.001581/0.001559 on relabelling — up to
    61% more nats on a number whose absolute value is 5e-4, with accuracy
    1.0000 against 0.9999 in the worst run.

    ## Merging

    $$(W + \frac{\alpha}{r}BA)x = Wx + \frac{\alpha}{r}B(Ax)$$

    is an identity, so a merged model is not an approximation. Measured over
    1,024 sequences: 3.236e-15 relative in float64 and 1.144e-06 in float32 —
    association order, not algebra. The failure mode is the convention:
    merging with $\alpha$ instead of $\alpha/r$ multiplies the update by $r$,
    and at $r = 8$ that took the held-out loss from 0.001934 to 3.9646.

    ## Why the other methods cannot do that

    Prefix tuning learns $2Lpd$ parameters — 2,621,440 at $p = 10$ on this 7B,
    0.0389% — and prepends them to every attention call. It is *cheaper* than
    LoRA at $r = 16$ (0.5932%) and it cannot be merged: the prefix occupies
    context, costs 5.0 MiB of KV cache per sequence (160 MiB at batch 32), and
    every request pays for it. A Houlsby adapter layer learns
    $2Ldr = 4,194,304$ (0.0622%) in series, so it adds depth and its latency is
    permanent. LoRA's branch is parallel and linear, which is the only reason
    merging is possible — and that structural property, not the parameter count,
    is what you are buying.

    ## Where this leaves you

    Two links back. The checkpoint is the one *Pretraining Objectives* produced,
    and its loss is a token-weighted mean — which is why 40,000 examples can
    move the model so far. The optimiser is the one *Optimisation in Practice*
    assembled: the schedule, the warmup and the clip apply unchanged, but
    $s_t = \min(1, c/\|g_t\|)$ now scales a gradient that exists on 0.6% of the
    parameters, so $\sum_t \eta_t s_t$ is spent on the adapter while the base
    receives nothing — and $\alpha/r$ is a fourth factor, invisible to the
    optimizer, that rescales the whole update.

    ## The longer version

    A fine-tune only has to change the model's function, and a rank-r update to
    a handful of weight matrices changes it enough while touching a fraction of
    a percent of the parameters — so the questions that decide whether the run
    works are which matrices you adapt, at what rank, at what precision, and
    whether the update survives being merged back into the base.

    A road atlas has 400 pages. Instead of reprinting it, you lay tracing paper
    over each page and draw the corrections: this bridge is closed, that
    junction is now a roundabout. The atlas underneath is untouched and still
    sells to everyone else; your copy is atlas plus one sheet per page. The
    sheets start blank, which is what initialising B at zero buys — on day one
    your copy is exactly the shop copy, so nothing you had is lost before
    training starts.

    Two things follow. A sheet can only shift what is already printed, so a
    correction that needs a road the atlas does not have cannot be drawn: you
    can reroute traffic (attention) but you cannot add a city. And the sheets
    are shared by every reader, so one correction applies to everyone — LoRA
    has no per-example switch.

    The analogy breaks on magnitude. Tracing paper is a thin, faint layer; a
    rank-r update is not small at all. The adapter in this topic that took a
    held-out loss from 13.73 to 0.0033 nats ended up with a Frobenius norm of
    66.5% of the weights it was added to. What LoRA constrains is the rank of
    the correction, not its size — and a rank-8 matrix at 66% of the norm is
    still a rank-8 matrix.

    ### What goes wrong

    - You have eight 80 GB cards for a weekend and a 7B model. Full
      fine-tuning needs 16 bytes of state per parameter — 100.4 GiB before a
      single activation — so the run does not fit, and the blog post that says
      "just use LoRA" does not tell you which matrices, which rank, or what to
      do about the fact that the loss plateaus at 0.9.
    - You ship a fine-tuned 7B, and it can no longer do the arithmetic it
      could do last week. You have also been asked for eleven more variants of
      it, and 12 models x 12.6 GiB of bf16 weights is 151 GiB of GPU memory
      for one product surface.
    - Your adapter trains, you merge it, and the merged model's outputs are
      wrong. Nothing raised an exception, the shapes all match, and the merge
      was one line — so you conclude the adapter was bad, when the merge was
      scaling by alpha instead of alpha/r and the update is eight times too
      large at r = 8.
    - Somebody says "raise the rank" because the loss is stuck. You have no
      measurement that separates a rank ceiling from a learning-rate problem,
      and on this topic's own hard task those two answers differ by a factor
      of 19 in loss — with the learning-rate answer being wrong at every value
      from 2e-3 to 2e-1.
    - You are asked whether QLoRA's 4-bit base costs quality. The only
      evidence anyone has is a benchmark table from a vendor, and the number
      that would settle it — held-out loss of the same adapter on a 4-bit base
      against a bf16 base, same steps, same data — was never run.

    ### The full treatment

    **The update is a product of two thin matrices, so its rank is bounded by
    $r$ and its bill is $r(d+k)$ rather than $dk$.** For a weight $W$ of shape
    $d \times k$, LoRA trains $B \in \mathbb{R}^{d \times r}$ and
    $A \in \mathbb{R}^{r \times k}$ and adds
    $\Delta W = \frac{\alpha}{r}BA$, whose rank is at most $r$ by construction.
    The parameter count is $r(d+k)$, so the fraction of a layer's weights you
    touch is $r(1/d + 1/k)$ — for $d = k = 4096$ that is 0.39% at $r = 8$.
    On a Llama-shaped 7B ($d = 4096$, 32 layers, $d_{ff} = 11008$, 32,000-token
    vocabulary, untied embeddings, exactly 6,738,713,856 parameters) the
    arithmetic is: $r = 4$ gives 9,994,240 parameters (0.1483%), $r = 8$ gives
    19,988,480 (0.2966%), $r = 16$ gives 39,976,960 (0.5932%), $r = 64$ gives
    159,907,840 (2.3730%), and $r = 1$ costs 0.0371%. Attention-only is 42% of
    those numbers — 0.2490% at $r = 16$ — and the trap is the headline
    "0.6% of the parameters", which is $r = 16$ on every linear layer,
    approximately $r = 38$ on attention alone, or $r = 4$ on attention for a
    different model. A
    parameter fraction without the rank and the module list is not a number
    you can act on.

    **Initialising $B = 0$ makes step zero an exact no-op, and it also makes
    $A$'s gradient exactly zero for one step.** With $\Delta W = BA$ at
    $B = 0$, the adapter's contribution is the zero matrix, so the model at
    step 0 is the pretrained model bit for bit: measured on this rig, the
    loss before and after attaching the adapter is 13.733208 against
    13.733208, and the maximum change in any logit is 0.000e+00 — not 1e-16,
    exactly zero. The gradient with respect to $A$ is
    $\frac{\alpha}{r}B^{\top}\partial L/\partial W'$, which is exactly 0.0 at
    $B = 0$, while the gradient with respect to $B$ is 0.1907. So the first
    step moves only $B$; $A$ starts moving on step 2, when $B$ is no longer
    zero. The mirror choice is just as valid — $A = 0$ freezes $B$ for a step
    (measured: $|g_A| = 0.1066$, $|g_B| = 0.0$) — but initialising **both**
    factors at zero is a dead adapter: both gradients are exactly 0.0 and the
    adapter can never leave the origin, measured. The other trap is going the
    other way and initialising both factors randomly "so it isn't dead": it
    isn't dead, it is alive before training, which is worse. Measured, that
    moves logits by 19.29 against a mean absolute logit of 2.02 — you have
    thrown away the pretrained function at step 0 and are now training a
    randomly initialised 7B from a bad starting point.

    **$\alpha/r$ is a scale on the update, not a schedule, and it does not
    commute with the learning rate.** The forward pass multiplies the
    low-rank term by $\alpha/r$, so at $r = 8$ with $\alpha = 16$ the update
    is scaled by 2 and at $\alpha = 128$ by 16. Measured at fixed
    $r = 8$, fixed lr $= 5\times10^{-3}$, 200 steps, on the re-routing task:
    $\alpha = 2$ reaches loss 2.5208 (accuracy 0.367), $\alpha = 8$ reaches
    1.5590 (0.595), $\alpha = 32$ reaches 0.0355 (0.992), and $\alpha = 128$
    reaches 3.4400 (0.068) — against $\ln 32 = 3.4657$, so the largest scale
    has not learned faster, it has flattened the model to the uniform
    distribution. The interesting part is that $(\alpha, \text{lr})$ are not
    interchangeable even at constant product: five runs with
    $\text{scale} \times \text{lr} = 0.04$ gave 3.4322 at $(\alpha = 8,
    \text{lr} = 0.04)$, 3.4244 at $(16, 0.02)$, 2.8752 at $(32, 0.01)$,
    0.0079 at $(64, 0.005)$ and 0.0011 at $(128, 0.0025)$. Adam normalises the
    gradient, so lr sets the step in $B$ directly while $\alpha/r$ scales the
    product $BA$; a large $\alpha$ with a small lr keeps $B$ small and the
    factorisation balanced, and a small $\alpha$ with a large lr makes $B$
    huge and $A$'s gradient unstable. The trap is treating "raise alpha" as
    "train faster" and then tuning the lr against it — you are adjusting two
    factors of one product with opposite effects on the balance.

    **Rank has a knee, and past the knee the parameters are wasted.** Same
    task, same steps (800), same data, $\alpha = 2r$ so the scale is fixed at
    2 and rank is the only variable: $r = 1$ gives 0.0510 nats with 1,792
    adapter parameters, $r = 2$ gives 0.0041 (3,584), $r = 4$ gives 0.00085
    (7,168), $r = 8$ gives 0.00085 (14,336), $r = 16$ gives 0.00038 (28,672),
    $r = 32$ gives 0.00036 (57,344), $r = 64$ gives 0.00034 (114,688). The
    gains per doubling are 12.4x, 4.8x, 0.99x, 2.2x, 1.06x, 1.04x: the first
    two doublings buy 60x and the last three buy 2.5x. That curve is
    not arbitrary, because the thing LoRA is approximating has a measured
    spectrum — take a full fine-tune's $\Delta W$ and the top 8 singular
    values hold 79.5% of its squared Frobenius energy on this task (66.0% at
    top-4, 90.9% at top-16), and 63.8% on the relabelling task. The trap is
    that energy concentration does not predict the rank you need: the
    relabelling task has the flattest spectrum of the three (top-8 at 63.8%)
    and is solved perfectly at $r = 4$, because the residual energy lives in
    directions the task does not use. Measure the rank, do not read it off a
    spectrum.

    **Placement is a property of the change the task requires, not of LoRA —
    and the three cases are measurably different.** Each run below is $r = 8$,
    $\alpha = 16$, 800 steps, batch 128, two seeds, on a base model that
    scores 13.73 / 14.32 / 15.21 nats on the three tasks. A *re-routing* task
    (the copy offset moves from 8 back to 15 minus the position, so attention
    must look somewhere else) is fitted by attention adapters alone: 0.0033
    nats against 3.1251 for MLP adapters alone and 0.00049 for all six
    matrices — MLP-only is 6,430x worse than all-linear. A *relabelling* task
    (a fixed permutation of the output vocabulary) is fitted by either:
    0.0035 attention-only, 0.0054 MLP-only, 0.0015 all — because mapping 32
    embedding vectors to 32 other vectors is a linear map with 2,048
    constraints and 4,096 free parameters in one output projection, so no MLP
    is needed. A task that needs *both* (retrieve two tokens and add them
    mod 32) moves under neither group alone — 3.468 and 3.467, against a base
    of 14.32 — and only all-linear makes progress (3.286, still descending at
    step 800). The trap is "adapt attention, that is where the knowledge is":
    measured, attention-only costs 6.7x on the routing task, 6,430x if you
    pick the MLP instead, and nothing at all on the task that needs both.

    **LoRA's update is low-rank, not small.** The converged $r = 8$ adapter
    that took the routing task from 13.73 nats to 0.0033 has a Frobenius norm
    of 66.5% of the eight matrices it was added to, and per matrix the ratio
    runs from 32.8% ($W_v$ in layer 1) to 95.8% ($W_q$ in layer 0). It is not
    a slow build-up either: the ratio is 2.8% after one step, 12.2% after
    five, 44.3% after twenty and 61.4% after a hundred, so the adapter reaches
    two-thirds of its final size by step 20 and the remaining 780 steps refine
    its direction. The trap is the inference "the perturbation is small, so
    it cannot cause forgetting" — the perturbation is small in *rank*. A
    rank-8 matrix at 66% of the norm moves the function as far as it likes
    within 8 directions, and that is enough to change every prediction the
    model makes.

    **QLoRA's 4-bit base is a memory trade, and the memory trade is real while
    the quality trade sits inside the noise at this scale.** NF4 stores 4-bit
    codes plus
    one 32-bit absmax per 64-weight block: 4 + 32/64 = 4.5 bits = 0.5625
    bytes per parameter, or 0.5159 with the absmax itself double-quantised.
    On the 6,738,713,856-parameter model that is 3.53 GiB, or 3.24 GiB with
    double quantisation, against 12.55 GiB in bf16 — a 3.9x reduction on the
    weights and 3.58x on total training memory (3.61 GiB against 12.92 GiB
    for 16-bit LoRA). Quality, measured by fine-tuning the same $r = 8$
    adapter for the same 800 steps on a float64 base and an NF4 base: 0.000451
    against 0.000463 and 0.000545 against 0.000877 on the routing task, 0.001431
    against 0.001632 and 0.001559 against 0.001581 on the relabelling task —
    up to 61% more nats on a loss whose absolute value is 5e-4, with held-out
    accuracy 1.0000 against 0.9999 in the worst case. The trap is twofold:
    people quote the memory win as if it were free, and they forget that the
    gradient flows through a *dequantised copy* of the base, so the base never
    receives an update — unfreeze it and the next step's quantisation silently
    discards what you just learned.

    **The merge is where the $\alpha/r$ convention either survives or breaks
    silently.** Serving can fold the adapter into the base because
    $(W + \frac{\alpha}{r}BA)x = Wx + \frac{\alpha}{r}B(Ax)$ exactly, so a
    merged model has the same shape, the same FLOPs and no adapter at
    inference. Measured on 1,024 held-out sequences, the factorised path and
    the merged path agree to 4.796e-14 absolute (3.236e-15 relative) in
    float64 and 1.696e-05 absolute (1.144e-06 relative) in float32 — the
    difference is association order, not algebra. Now the failure: take the
    same trained adapter and merge it with scale $\alpha$ instead of
    $\alpha/r$, which at $r = 8$ is 8x too large, and the held-out loss goes
    from 0.001934 to 3.9646 (2,050x) with a maximum logit change of 18.22
    against a mean absolute logit of 1.85. Nothing raises, the shapes match,
    and the model is destroyed. The trap is that $\alpha$ has no parameters:
    it is the one part of the adapter that lives only in your code, so it is
    the one part that the checkpoint, the merge script and the serving stack
    can each get wrong independently.

    **Rank is a capacity ceiling, and the way to prove it is to sweep the
    learning rate and watch nothing happen.** On the two-token arithmetic task
    the adapter at $r = 8$ sits at 3.4548 / 3.4680 / 3.4690 / 3.4683 for
    lr = 2e-3, 2e-2, 5e-2 and 2e-1 — a 100x learning-rate range that moves
    the loss by 0.014 nats. At $r = 64$, same steps, same data, same
    lr = 2e-3, it reaches 0.1793 with 0.9745 accuracy; at lr = 2e-2 the same
    adapter collapses to 3.4712. Full fine-tuning reaches 0.0434. So the gap
    is rank, and the learning rate cannot close it in either direction. But
    the ceiling is task-specific, and honestly so: on the routing task LoRA
    at $r = 16$ reaches 0.00038 against full fine-tuning's 0.00153, and on the
    relabelling task 0.00079 against 0.00097 — the adapter *beat* full
    fine-tuning on two of three tasks at 0.6% of the parameters. The budgets
    are the same 800 steps and batch 128 with identical data, but the
    adapters ran at lr $5\times10^{-3}$ and full fine-tuning at
    $2\times10^{-3}$, so that comparison is matched on tokens and steps and
    not on tuning, and it should be read as "LoRA is not obviously worse
    here", not as a controlled win. The trap is
    generalising either result: "LoRA matches full FT" and "LoRA cannot learn
    algorithms" are both false, and which one you get depends on whether the
    task needs a computation the base's features cannot express at rank $r$.

    **Prefix tuning and adapter layers spend a similar parameter budget on a
    very different bill.** Prefix tuning learns $p$ key/value vectors per
    layer: $2Lpd = 2,621,440$ parameters at $p = 10$, $L = 32$, $d = 4096$
    (0.0389% of the 7B) — smaller than LoRA's 0.5932% at $r = 16$. Adapter
    layers learn a bottleneck $d \to r \to d$ per sublayer:
    $2Ldr = 4,194,304$ at $r = 16$ (0.0622%). Both are cheaper than LoRA on
    the training bill and both are more expensive on the serving bill, because
    neither can be merged: the prefix occupies 10 of your context slots and
    costs $2Lpd \times 2$ bytes of KV cache per sequence — 5.0 MiB at this
    configuration, 160 MiB at batch 32 — while the adapter layer adds depth,
    so every token pays its two matmuls forever. LoRA's rank-$r$ term can be
    folded into $W$ and then costs nothing. The trap is comparing methods by
    parameter count alone; the parameter count is the training-time bill and
    the inference bill is a separate column.


