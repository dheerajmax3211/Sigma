      hint: >-
        Write out both index sequences for n_kv = 8, n_rep = 4 and compare them
        position by position.
      solution: >-
        `repeat` gives query head h the key/value head h // 4 — contiguous
        groups {0,1,2,3} -> 0, {4,5,6,7} -> 1, and so on. `tile` gives query head
        h the key/value head h % 8 — strided groups {0,8,16,24} -> 0,
        {1,9,17,25} -> 1. Comparing the two index sequences position by
        position, 28 of 32 heads (87.5%) read a different key/value head than
        the checkpoint intends. Nothing raises, because both mappings produce a
        valid (32, n, d) tensor, the softmax still normalises, and the output is
        still a convex combination — the layer is simply computing a different
        function, and the loss curve shows a small unexplained gap rather than
        an error. The regression test is n_kv == n_q: with n_rep = 1 both
        expansions must be the identity.
    - id: cp-5
      question: >-
        At initialisation, every head in an eight-head layer attends to about
        313 of 512 positions and two heads' weight rows differ by a total
        variation distance of 0.52. What does that license you to conclude about
        head specialisation, and what does it not?
      answerKind: short_text
