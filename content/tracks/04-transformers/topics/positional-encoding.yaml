  markdown: |
    ## Order is nowhere in the architecture

    Attention computes, for each query row, a convex combination of value rows.
    A convex combination is a sum, and a sum does not know which term came
    first. Formally, for any permutation matrix $P$,

    $$\operatorname{Attn}(PX) = P\,\operatorname{Attn}(X),$$

    measured at $2.2\times10^{-16}$ on an 8-token, 16-wide example. So "dog
    bites man" and "man bites dog" are the same input to the layer, and the only
    reason a trained model separates them is that the rows it received were
    already different: token $i$ was paired with a position code $e_i$ before it
    arrived.

    Position is therefore not a feature of attention. It is a feature of the
    representation attention is handed, or of the rotation applied to queries and
    keys inside it. Every scheme in production is one of four:

    | family | intervenes at | parameters | relative by construction |
    |---|---|---|---|
    | learned absolute | $x_i \leftarrow x_i + e_i$ | $n_{ctx}d$ | no |
    | sinusoidal absolute | $x_i \leftarrow x_i + PE_i$ | 0 | only before $W_Q,W_K$ |
    | RoPE | $q_i \leftarrow R_iq_i$, $k_j \leftarrow R_jk_j$ | 0 | yes |
    | ALiBi | $s_{ij} \leftarrow s_{ij} - m_h(i-j)$ | 0 | yes |

    ## The sinusoidal clock

    With $d$ even, $i = 0,\ldots,d/2-1$ and

    $$\omega_i = 10000^{-2i/d},\qquad
      PE_{(p,2i)} = \sin(p\omega_i),\qquad
      PE_{(p,2i+1)} = \cos(p\omega_i).$$

    Each pair sits on the unit circle, so advancing $p$ by $k$ rotates pair $i$
    by $k\omega_i$, and $PE_{p+k} = R_kPE_p$ with $R_k$ block-diagonal over
    planes. Measured $\|PE_{p+k} - R_kPE_p\|_\infty = 4.9\times10^{-14}$ at
    $k=1$ and $6.8\times10^{-13}$ at $k=5000$, with $R_k^\top R_k = I$ to
    $2.2\times10^{-16}$. Because $R_k$ is orthogonal, the inner product depends
    on the offset alone:

    $$PE_p^\top PE_{p+k} = \sum_i \cos(k\omega_i).$$

    At $d=64$ that sum is the whole story:

    | offset $k$ | 1 | 2 | 7 | 64 | 1024 | 4096 | 16384 |
    |---|---|---|---|---|---|---|---|
    | $PE_p^\top PE_{p+k}$ | 30.917 | 28.304 | 23.264 | 13.906 | 8.414 | 0.112 | -9.168 |
    | spread over 1000 positions | 1.7e-13 | 3.3e-13 | 2.5e-13 | 2.9e-13 | — | 9.4e-13 | 3.1e-12 |

    Thirty-two is the maximum ($\|PE_p\|^2 = 32.0$ exactly), and everything below
    it is a damped oscillation: the score is negative at 16,384. "The encoding
    encodes distance" holds for about one wavelength of the slowest band and is
    false beyond it.

    The ladder has to be geometric because the requirement is constant *relative*
    resolution: 32 bands covering 6.28 to 47,117 tokens is a factor of 7,500, so
    the spacing is multiplicative, $\lambda_{i+1}/\lambda_i = 10000^{2/d} =
    1.33352$ at $d=64$ — a constant 0.125 in $\log_{10}$ per band, which is the
    straight line in the plot above. A linear ladder with the same finest
    wavelength would stop at 207 tokens.

    ### The first linear map destroys it

    This is the fact that decides the architecture. Take the exact identity above
    and apply random $W_Q$, $W_K$:

    | | $k=7$ | $k=64$ |
    |---|---|---|
    | mean $\langle W_QPE_p, W_KPE_{p+k}\rangle$ | 2.326 | 3.642 |
    | spread across $p$ | **17.795** | **20.290** |

    A dense map mixes all $d/2$ frequencies into every output coordinate, and
    mixed coordinates no longer form rotation orbits. A sinusoidal model can
    recover relative position only by learning to un-mix its own encoding. RoPE
    puts the rotation *after* the projection, so nothing learned sits between the
    rotation and the inner product.

    ## Learned absolute embeddings

    One `nn.Embedding(n_ctx, d)`: rows are free parameters, nothing ties row $p$
    to row $p+1$, and training only ever visits positions below $n_{ctx}$.

    | config | parameters | bf16 |
    |---|---|---|
    | GPT-2, 1024 x 768 | 786,432 | 1.5 MiB |
    | 32768 x 8192 | 268,435,456 | 0.5 GiB |
    | 131072 x 8192 | 1,073,741,824 | 2.0 GiB |

    At 128k that is a billion parameters spent on "where", and position 131,072
    does not exist. Extending the table does not help: the score is bilinear in
    $(e_i,e_j)$, so an offset preference is a property of the pair, and fresh
    rows at $\mathcal{N}(0,0.02)$ carry no relation to the rows before them.

    ## RoPE

    Project as usual, then rotate each $q$ and $k$ in $d/2$ planes:

    $$q'_m = R_mq,\qquad k'_n = R_nk,\qquad
      {q'}_m^\top{k'}_n = q^\top R_m^\top R_nk = q^\top R_{n-m}k.$$

    Measured: $4.360102627621$ at $(0,7)$, $(100,107)$, $(5000,5007)$ and
    $(13,20)$ — four absolute positions, one number, spread $1.4\times10^{-12}$.
    Per band, with $e_i$ the energy of $q$ in plane $i$ and $q=k$, $\|q\|=1$,

    $$\text{sim}(k) = \sum_i e_i\cos(k\omega_i),\qquad \sum_i e_i = 1,$$

    a weighted sum of cosines: 1.000 at 0, 0.986 at 1, 0.858 at 4, 0.725 at 16,
    0.409 at 64, 0.292 at 1024, -0.307 at 2048. High-frequency planes give a head
    local order, low-frequency planes give it reach — a decomposition a single
    ALiBi slope cannot express.

    Two traps. **Never rotate $V$**: a rotated value is expressed in a
    position-dependent basis with nothing to cancel it. **Match the pairing
    convention**: the paper interleaves $(2i,2i+1)$, most kernels split halves
    $(i,i+d/2)$; either is correct, but $Q$ and $K$ must use the same one.
    Rotating $Q$ only leaves a score that depends on the query's absolute index
    and never on the offset: $0.979$, $-0.609$, $-2.330$ for $m = 0, 100, 5000$
    against the same $K$.

    ## ALiBi

    $$\operatorname{score}_{ij} = \frac{q_i^\top k_j}{\sqrt{d_k}} - m_h(i-j),
      \qquad m_h = 2^{-8h/H}.$$

    At $H=8$ the slopes are $0.5,\ldots,0.0039$ and the one-nat windows are
    $2,4,\ldots,256$ tokens: a 128x ladder of receptive fields from one formula,
    no parameters, so an 8x context needs none. The cost is that the prior is
    fixed — no head's slope is a function of the data. The window is also partly
    a dtype fact: at $n=2048$ in float32 the $m=0.5$ head keeps 195.7 non-zero
    weights per row on average (948.0 in float64), because
    $\exp(-0.5\cdot4096)$ underflows at $\ln(1.4\times10^{-45}) = -103.28$.

    ## Why RoPE won

    | property | learned | sinusoidal | RoPE | ALiBi |
    |---|---|---|---|---|
    | parameters | $n_{ctx}d$ | 0 | 0 | 0 |
    | relative after $W_Q,W_K$ | no | no (17.8) | yes (1e-12) | yes |
    | distance prior | learned | oscillation | yes | linear, fixed |
    | extrapolates | no | badly | with scaling | by construction |
    | linear attention | yes | yes | **no** | yes |

    The last row is the honest cost: the rotation is position-dependent, so the
    score is not separable as $\phi(q)^\top\psi(k)$ and the kernel trick behind
    $O(n)$ linear attention is unavailable. Every other row is why LLaMA, PaLM,
    Mistral, Qwen and DeepSeek use it anyway, at 0.018% extra FLOPs.

    ## Where long context breaks

    At $n=4L$ the fraction of causal pairs with offset greater than the training
    length is **56.24%** (at $L=4096$, of 134,225,920 pairs) — most of the matrix
    is extrapolation. And the band budget shrinks: bands whose wavelength still
    exceeds twice the offset number $(d/2)(1-\log_{\theta}(k/\pi))$, which at
    $d=64$, base 10000 gives 11 of 32 at 1024, 7 at 4096, 0 at 32768 — 2.41 bands
    lost per doubling. Bands that have wrapped carry local order and nothing
    else, so at long offset the score is dominated by a few slow planes whose
    phases were never trained.

    The fixes are answers to "which bands do you sacrifice". Position
    interpolation divides every position by the scale factor, pulling offsets
    back into range and losing local resolution everywhere. NTK-aware scaling
    raises the base: at $d=128$, 10,000 to 500,000 moves $\lambda_{\max}$ from
    54,410 to 2,559,196 and raises the count of bands resolving 4,096 from 14 of
    64 to 29 of 64. YaRN interpolates per band and adds an attention temperature.
    *Long Context* derives each one; the point to carry out of here is that the
    failure is a frequency-budget statement.

    ## The longer version

    Attention is a weighted average over a *set*, so it is permutation-
    equivariant by construction and order must be injected as a property of the
    vectors — and the only injection that stays relative after every learned
    projection is a rotation, because $R_m^\top R_n = R_{n-m}$ depends on the
    difference of the two positions and not on either one alone.

    Give every musician in an orchestra a clock. A learned position table is a
    hand-written seating chart: one line per seat, memorised, and it ends at the
    last row of the hall. The sinusoidal encoding is a clock with 32 hands
    running at rates spaced by a constant factor — the fastest completes a turn
    every 6.3 beats, the slowest every 47,117 — so reading all 32 hands gives
    the time, and the *difference* between two readings gives the interval
    between two notes.

    RoPE is the same clock, bolted to the question and the label rather than to
    the musician: you rotate the query by its own clock angle and the key by
    its own, and the comparison then sees only the angle between them, which is
    the interval. ALiBi throws the clock away and simply charges a linearly
    increasing fee for distance.

    Where it breaks: clocks alias. A hand that has gone round 652 times cannot
    tell you which turn you are on, and every hand is read with finite
    precision. The sinusoidal clock is also read *before* the musicians are
    handed their instruments — one transposition by a learned matrix and the
    interval information is gone, which is exactly why RoPE moved the clock
    onto the question and the label.

    ### What goes wrong

    - You shuffle a prompt and the model's answer changes, but nothing you can
      point at in the architecture has an opinion about order. Attention is a
      sum over tokens; a sum does not know which term came first. If you
      cannot say *where* order enters, you cannot debug the case where it
      fails to.
    - You copy the sinusoidal encoding out of the paper because it is six
      lines of NumPy, it works, and you never find out that its
      relative-position property is destroyed by the first learned $W_Q$ and
      $W_K$ it passes through — measured below as a score spread of 17.8
      across positions at a *fixed* offset.
    - You use a learned position table because it is one `nn.Embedding` line,
      then your fine-tuning set turns out to have 4096-token documents and the
      table has 1024 rows. There is no row 1024. There is no interpolation
      scheme that invents one.
    - Someone tells you RoPE "encodes relative position" and you read the code
      and find a rotation by an *absolute* position index. Both statements are
      true, and the reason is one line of linear algebra that also tells you
      why the rotation must be applied after the projection rather than to the
      input embedding.
    - You ship a 32k-context model and retrieval collapses past 8k.
      "Positional encoding" is the first suspect and the last thing anyone
      measures, because the failure is not a shape error — it is 56% of your
      attention matrix living at offsets the model never trained on.

    ### The full treatment

    **Attention is permutation-equivariant, and that is a theorem rather than
    a tendency.** Permute the rows of $X$ and every score row permutes with
    them, so the output permutes identically: measured
    $\max|\operatorname{Attn}(\pi X) - \pi\operatorname{Attn}(X)| = 2.2\times
    10^{-16}$ on an 8-token, 16-wide example. Adding a position vector does
    not change that theorem — permute the tokens *together with* their
    position rows and the output still permutes (measured $8.9\times10^{-16}$).
    What changes is the input: "dog at slot 0, man at slot 1" and "man at
    slot 0, dog at slot 1" are now different matrices, and the output differs
    by $\| \cdot \|_F = 2.70$. The trap is believing position makes attention
    order-aware. It makes the *data* order-aware; attention stays a sum.

    **The sinusoidal encoding is a rotation orbit, which is why its inner
    product sees only the offset.** With
    $\omega_i = 10000^{-2i/d}$ and pairs
    $(\sin p\omega_i, \cos p\omega_i)$, advancing the position by $k$ is a
    rotation of each 2D pair by $k\omega_i$: measured
    $\|PE_{p+k} - R_k PE_p\|_\infty = 4.9\times10^{-14}$ at $k=1$ and
    $6.8\times10^{-13}$ at $k=5000$, with $R_k$ orthogonal to $2.2\times
    10^{-16}$ and $\det R_k = 1.000000000$. Therefore
    $PE_p^\top PE_{p+k} = \sum_i \cos(k\omega_i)$, which does not contain $p$:
    at $d=64$ and $k=7$ the value is $23.264326$ for $p=0$, for $p=997$ and
    for $p=1999$, with a spread of $2.5\times10^{-13}$ over 1000 positions.
    The trap is thinking this survives the model. It is a property of the
    encoding matrix, not of the network.

    **The first learned projection destroys the relative structure, and that
    is the whole reason RoPE exists.** Apply random $W_Q$ and $W_K$ to the
    sinusoidal codes and score $W_Q PE_p$ against $W_K PE_{p+7}$: the mean is
    $2.326$ and the spread across $p$ is $17.795$ — a relative spread of
    7.65x the mean, because a dense linear map mixes coordinates across
    frequency pairs and there is no reason for the mixed coordinates to keep
    a clean rotation. At $k=64$ the spread is $20.290$ against a mean of
    $3.642$. So a sinusoidal model *can* represent relative position only by
    learning to un-mix what the encoding did — capacity spent undoing an
    encoding choice. RoPE applies the rotation *after* $W_Q$ and $W_K$, so no
    linear map can ever be applied between the rotation and the inner
    product, and the invariance is structural.

    **The frequencies are geometric, and the similarity profile they buy is a
    damped oscillation.** 32 bands must cover offsets from 6.28 tokens to
    47,117 — a factor of 7,500 — so the spacing has to be multiplicative:
    $\lambda_{i+1}/\lambda_i = 10000^{2/d} = 1.33352$ at $d=64$, a constant
    0.125 in $\log_{10}$ per band, measured as $\lambda_0 = 6.283$,
    $\lambda_1 = 8.379$, $\lambda_{31} = 47{,}117.2$. A linear ladder with the
    same finest wavelength would stop at 207 tokens and say nothing about a
    4,000-token offset. What the ladder buys is a profile that decays locally
    and then oscillates: the normalised inner product is $0.966$ at offset 1,
    $0.701$ at 8, $0.435$ at 64, $0.263$ at 1024 — then $-0.040$ at 2048 and
    $-9.168/32 = -0.287$ at 16,384, so identical content 16k tokens apart
    scores *negative*. The trap is treating the base as a hyperparameter:
    10000 is a *range* choice, and changing it slides the whole ladder without
    changing its shape.

    **A learned absolute table is $n_{ctx} \times d$ free parameters with
    nothing tying row $p$ to row $p+1$.** GPT-2's is $1024 \times 768 =
    786{,}432$ parameters — small. At 32k context and $d=8192$ it is
    $268{,}435{,}456$ (0.5 GiB in bf16) and at 128k it is $1{,}073{,}741{,}824$
    (2.0 GiB) — a parameter block that exists only to say "where", and that
    has to be re-learned rather than extended. The boundary is hard: position
    131,072 raises an index error, and there is no row to interpolate toward.
    The trap is the phrase "just extend the table": new rows start at
    $\mathcal{N}(0, 0.02)$ with no relation to their neighbours, and since the
    score is a bilinear form in $(e_i, e_j)$, any offset preference lives in
    the *pair* — so the model must relearn the whole geometry, not one row.

    **RoPE rotates Q and K by their own positions, and the inner product
    collapses to a function of $n-m$.** With $q'_m = R_m q$ and
    $k'_n = R_n k$ and $R$ block-diagonal over $d/2$ planes,
    ${q'}_m^\top {k'}_n = q^\top R_m^\top R_n k = q^\top R_{n-m} k$. Measured:
    a single $q,k$ pair scores $4.360102627621$ at $(m,n) = (0,7)$, $(100,107)$,
    $(5000,5007)$ and $(13,20)$ — four different absolute positions, one
    number, spread $1.4\times10^{-12}$. Nothing is learned, nothing is added
    to the embedding, and the rotation costs $3d$ multiply-adds per token
    against attention's $4nd$: $0.018\%$ of the layer at $n=4096$, $d=64$.
    Two traps. Never rotate $V$ — a rotated value vector is a value vector in
    a different basis, and the output projection would have to un-rotate it
    per position. And the pairing convention (interleaved $(2i, 2i+1)$ versus
    split-half $(i, i+d/2)$) is a fixed permutation of coordinates: either is
    correct, but $Q$ and $K$ must use the *same* one or the score is garbage
    that still has the right shape.

    **RoPE's per-band view is the useful mental model: the score is a weighted
    sum of cosines.** Write $e_i$ for the energy of $q$ in plane $i$; for
    $q = k$ with $\|q\| = 1$ the self-similarity is
    $\sum_i e_i \cos((n-m)\omega_i)$ with $\sum_i e_i = 1$. Measured on a unit
    vector at $d=64$: $1.000$ at offset 0, $0.986$ at 1, $0.858$ at 4, $0.725$
    at 16, $0.409$ at 64, $0.292$ at 1024, $-0.307$ at 2048. The oscillations
    are not noise — they are the individual bands beating against each other,
    and they mean a head that wants "recent" must learn to weight the
    high-frequency planes while a head that wants "same topic, anywhere" reads
    the low-frequency ones. That separation is what ALiBi cannot express,
    because a single slope is one fixed prior for the whole head.

    **ALiBi buys extrapolation with a prior instead of a parameter.**
    $\operatorname{score}_{ij} = q_i^\top k_j/\sqrt{d_k} - m_h(i-j)$ with
    $m_h = 2^{-8h/H}$ geometric across heads. At $H=8$ the slopes run
    $0.5, 0.25, \ldots, 0.0039$, and the distance at which the penalty reaches
    one nat runs $2, 4, 8, \ldots, 256$ tokens — a 128x ladder of receptive
    fields from one formula and zero parameters. Because $-m(i-j)$ is defined
    at every distance, an 8x context needs no new parameters at all. The
    measured price is that the window is partly a *dtype* fact: at $n=2048$
    in float32, the $m=0.5$ head has on average **195.7** non-zero weights per
    row (max 210), because $\exp(-0.5 \cdot 4096)$ underflows at the float32
    subnormal floor $\ln(1.4\times10^{-45}) = -103.28$; the same head in
    float64 keeps **948.0**. And a fixed linear prior cannot be reshaped by
    data: if no head's slope covers 400 tokens, nothing in the model can
    attend 400 tokens back with a preference.

    **RoPE won on four measurable properties and lost on one.**
    (i) Zero parameters, against 786,432 for GPT-2's table and 268M at 32k
    context. (ii) Exact relative invariance that no learned projection can
    break — spread $10^{-12}$, against a sinusoidal spread of $17.8$ after one
    random $W_Q,W_K$. (iii) A distance-decaying similarity prior for free,
    $0.986$ at offset 1 falling to $0.292$ at 1024. (iv) It composes with any
    $W_Q, W_K$, including grouped-query and multi-query attention, because it
    is a per-token rotation of already-projected vectors. The loss: the
    rotation is position-dependent, so the score is no longer separable as
    $\phi(q)^\top\psi(k)$ — RoPE is incompatible with the kernel trick that
    makes linear attention $O(n)$. That is why linear-attention and
    state-space hybrids use their own schemes (decay, convolution, or no
    encoding at all) rather than RoPE.

    **Long context fails at a computable place: 4x the training length puts
    56.24% of the causal attention matrix at unseen offsets, and starves the
    low-frequency bands.** For $n = 4L$, the fraction of causal pairs with
    $i-j > L$ is $56.24\%$ at $L=4096$ (of 134,225,920 pairs) — a majority of
    the matrix is extrapolation. Simultaneously, the number of RoPE bands
    whose wavelength still exceeds twice the offset falls as
    $(d/2)(1 - \log_{\text{base}}(k/\pi))$: at $d=64$, base 10000, that is 11
    of 32 bands at 1024, 7 at 4096, 0 at 32768 — 2.41 bands lost per doubling
    of the offset. A band whose wavelength is shorter than the offset has
    wrapped many times, so it carries local order and nothing else. Position
    interpolation divides all positions by the scale factor and pulls every
    offset back into the trained range at the cost of local resolution;
    NTK-aware scaling raises the base instead, which stretches the slow bands
    while leaving the fast ones alone — measured for $d=128$: base 10000 gives
    $\lambda_{\max} = 54{,}410$ and 14 of 64 bands resolving 4096, base
    500,000 gives $\lambda_{\max} = 2{,}559{,}196$ and 29 of 64 resolving the
    same offset, and 12 of 64 still resolving 131,072.

