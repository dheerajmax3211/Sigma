id: positional-encoding
slug: positional-encoding
title: "Positional Encoding: Absolute, Relative, and RoPE"
summary: >-
  Attention sees a bag of vectors, so order has to be written into the vectors
  themselves — and the only version of that signal which survives every learned
  projection is a rotation of queries and keys, because the angle between two
  rotated vectors depends on the difference of their positions and nothing
  else. Derive the sinusoidal clock, measure a learned table failing to leave
  its training range, build RoPE's block-diagonal rotation, price ALiBi's
  linear prior, and find the exact place where long-context extrapolation
  breaks.
kind: lesson
difficulty: medium
position: 3
estMinutes: 29
prerequisites: [attention-from-first-principles]
phase: attention-core
tags: [positional-encoding, rope, alibi, sinusoidal, relative-position, long-context, extrapolation, transformers]

body:
  big_idea: >-
    Attention averages over a set, so order must be injected into the vectors
    — and the only injection that stays relative after every learned
    projection is a rotation, since $R_m^\top R_n = R_{n-m}$.

  problem:
    - >-
      You shuffle a prompt and the answer changes, and nothing you can point
      at in the architecture has an opinion about order.
    - >-
      You copy the sinusoidal encoding and never learn that its relative
      property dies at the first learned $W_Q,W_K$: a score spread of 17.8.
    - >-
      You ship a 32k-context model and retrieval collapses past 8k, with 56%
      of the attention matrix at offsets the model never trained on.

  analogy: |
    Give every musician in an orchestra a clock. A learned table is a
    hand-written seating chart that ends at the last row. The sinusoidal
    encoding is a clock with 32 hands running at geometrically spaced rates,
    so reading all of them gives the time and the difference gives the
    interval. RoPE bolts the clock to the question and the label rather than
    to the musician.

  concept_points:
    - >-
      **Attention is permutation-equivariant, and that is a theorem rather than a tendency.**
      Permute the rows of $X$ and every score row permutes with them: measured
      $\max|\operatorname{Attn}(\pi X) - \pi\operatorname{Attn}(X)| = 2.2\times10^{-16}$
      on 8 tokens. Adding a position vector does not change the theorem —
      permute tokens with their position rows and the output still permutes(
      $8.9\times10^{-16}$); the *data* becomes order-aware, attention stays a
      sum.
    - >-
      **The sinusoidal encoding is a rotation orbit, which is why its inner product sees only the offset.**
      With $\omega_i = 10000^{-2i/d}$, advancing by $k$ rotates each 2D pair
      by $k\omega_i$: $\|PE_{p+k} - R_k PE_p\|_\infty = 4.9\times10^{-14}$.
      Hence $PE_p^\top PE_{p+k} = \sum_i \cos(k\omega_i)$, which contains no
      $p$: at $d=64$, $k=7$ it is **23.264326** for $p=0$, 997 and 1999,
      spread $2.5\times10^{-13}$.
    - >-
      **The first learned projection destroys the relative structure, and that is why RoPE exists.**
      Apply random $W_Q,W_K$ to sinusoidal codes and score $W_Q PE_p$ against
      $W_K PE_{p+7}$: the mean is **2.326** and the spread across $p$ is
      **17.795**, rising to 20.290 against 3.642 at $k=64$. RoPE rotates
      *after* $W_Q$ and $W_K$, so no linear map sits between the rotation and
      the inner product.
    - >-
      **A learned absolute table is $n_{ctx} \times d$ free parameters with nothing tying row $p$ to row $p+1$.**
      GPT-2's is $1024 \times 768 = 786{,}432$; at 32k context and $d=8192$ it
      is $268{,}435{,}456$ (0.5 GiB in bf16). The boundary is hard: position
      131,072 raises an index error, and there is no row to interpolate
      toward, because any offset preference lives in the *pair* $(e_i, e_j)$.
    - >-
      **RoPE rotates Q and K by their own positions, and the inner product collapses to a function of $n-m$.**
      With $q'_m = R_m q$, $k'_n = R_n k$:
      ${q'}_m^\top {k'}_n = q^\top R_{n-m} k$. A single pair scores
      **4.360102627621** at $(m,n) = (0,7)$, $(100,107)$, $(5000,5007)$ and
      $(13,20)$ — spread $1.4\times10^{-12}$. The rotation costs $3d$
      multiply-adds against attention's $4nd$: **0.018%** of the layer at
      $n=4096$. Never rotate $V$.
    - >-
      **Long context fails at a computable place: 4x the training length puts 56.24% of the causal attention matrix at unseen offsets.**
      For $n = 4L$ the fraction of causal pairs with $i-j > L$ is **56.24%**
      at $L=4096$. Meanwhile the RoPE bands whose wavelength still exceeds
      twice the offset fall to **11 of 32** at 1024, **7** at 4096 and **0**
      at 32768.

  definitions:
    - term: "Positional encoding"
      meaning: >-
        Any signal added to, or applied to, a token's representation so that the
        model can tell positions apart. It is necessary only because attention
        is a sum over a set; a recurrent layer gets order from its recurrence.
    - term: "Permutation equivariance"
      meaning: >-
        $f(\pi X) = \pi f(X)$ for every permutation $\pi$. Attention has it
        exactly (measured $2.2\times10^{-16}$), which means attention can never
        manufacture order — it can only consume a representation that already
        contains it.
    - term: "Absolute encoding"
      meaning: >-
        A code that identifies a position by itself: $PE_p$ depends on $p$ only.
        Both the sinusoidal encoding and a learned table are absolute, and both
        require the model to learn what to do with the code.
    - term: "Relative encoding"
      meaning: >-
        A scheme in which the score depends on $i-j$ and not on $i$ or $j$
        separately. RoPE and ALiBi are relative by construction; an absolute
        encoding can only become relative after the model learns to subtract.
    - term: "Frequency band / wavelength"
      meaning: >-
        One 2D plane of the encoding, rotating at $\omega_i$ with wavelength
        $\lambda_i = 2\pi/\omega_i$. At $d=64$, base 10000, the 32 bands run from
        6.283 to 47,117 tokens, spaced by a constant factor of 1.33352.
    - term: "Base ($\theta$)"
      meaning: >-
        The constant in $\omega_i = \theta^{-2i/d}$. It sets the *range* of the
        ladder, not its shape: 10000 is the original Transformer value, and
        long-context models raise it (LLaMA-3 uses 500,000) to stretch the slow
        bands without touching the fast ones.
    - term: "Rotary position embedding (RoPE)"
      meaning: >-
        A per-position rotation applied to $Q$ and $K$ after projection, in
        $d/2$ disjoint 2D planes: $q'_m = R_m q$, $k'_n = R_n k$. The inner
        product becomes $q^\top R_{n-m} k$, so relative position is exact and
        costs no parameters.
    - term: "ALiBi"
      meaning: >-
        Attention with Linear Biases: add $-m_h(i-j)$ to the score, with one
        geometric slope per head and no learned parameters. It encodes a fixed
        prior — the further away, the less it matters — rather than a code.
    - term: "Context extrapolation"
      meaning: >-
        Evaluating at a sequence length beyond the training length. It is not
        one problem but three: parameters that do not exist (learned tables),
        phases that were never trained (RoPE and sinusoidal), and a bias shape
        that may or may not be defined at range (ALiBi is).
    - term: "Aliasing"
      meaning: >-
        Two positions producing the same code for a band because their phases
        differ by a whole turn: $p$ and $p + \lambda_i$ are indistinguishable to
        band $i$. Aliasing is per-band, which is why a long-context model can
        still tell 100 tokens from 101 while confusing 40,000 from 40,500.

  diagrams:
    - type: architecture
      title: "Three families, three injection points: input embedding, Q/K, and the score"
      nodes:
        - { id: x, x: 0, y: 1, label: "tokens X (n, d_model)", kind: client, detail: "One row per token. Nothing in this matrix knows the order the rows arrived in." }
        - { id: pe, x: 0, y: 0, label: "position table or formula", kind: storage, detail: "Learned: n_ctx x d parameters, 786,432 for GPT-2, and no row exists past the last one. Sinusoidal: zero parameters, a rotation orbit of a fixed vector." }
        - { id: add, x: 1, y: 0, label: "X + PE_p (absolute)", kind: model, detail: "Intervenes BEFORE the projection. The relative structure of the sinusoidal code does not survive W_Q and W_K: measured score spread 17.8 at a fixed offset." }
        - { id: proj, x: 1, y: 1, label: "W_Q, W_K, W_V", kind: storage, detail: "Three learned matrices. In RoPE models the position signal never touches these, which is exactly why RoPE's invariance is structural." }
        - { id: qkv, x: 2, y: 1, label: "Q, K, V", kind: model, detail: "Q and K share d_k because they are dotted; V is unconstrained and must NOT be rotated." }
        - { id: rot, x: 2, y: 0, label: "rotate Q and K (RoPE)", kind: worker, detail: "d/2 planes rotated by m*omega_i. Then q_m . k_n = q . R_(n-m) k: measured 4.360102627621 for four different absolute position pairs at offset 7." }
        - { id: bias, x: 2, y: 2, label: "ALiBi bias -m_h(i-j)", kind: worker, detail: "No parameters, no code: a linear fee for distance, added to the score. Slopes 2^(-8h/H) give a 128x ladder of windows at H=8." }
        - { id: score, x: 3, y: 1, label: "S = QK'/sqrt(d_k) + bias", kind: server, detail: "The only place all three families meet. Absolute changed the inputs, RoPE changed Q and K, ALiBi changes the score itself." }
        - { id: out, x: 3, y: 2, label: "softmax, then P V", kind: client, detail: "Order has now been baked into which keys each query prefers. The mixture itself is still order-blind." }
      edges:
        - { from: x, to: add, label: "same X" }
        - { from: pe, to: add, label: "one vector per position" }
        - { from: add, to: proj, label: "n x d" }
        - { from: proj, to: qkv, label: "project" }
        - { from: qkv, to: rot, label: "Q and K only" }
        - { from: qkv, to: bias, label: "scores", style: async }
        - { from: rot, to: score, label: "relative by construction" }
        - { from: bias, to: score, label: "prior, not a code" }
        - { from: score, to: out, label: "weights" }

