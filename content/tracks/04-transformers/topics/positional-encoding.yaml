        The construction is not a clever guess — it is the unique way to make
        $d/2$ independent 2D codes whose comparison depends only on the
        difference of the positions, because "advance by $k$" has to be an
        orthogonal map that composes ($R_{k_1}R_{k_2} = R_{k_1+k_2}$) and the
        only orientation-preserving maps in 2D that compose this way are
        rotations. What the derivation also shows is
        the limit: the property belongs to the *code*, and the moment a learned
        matrix is inserted between the code and the inner product it is gone —
        measured as a score spread of 17.795 across positions at a fixed offset
        of 7.
    - title: "RoPE: rotating Q and K turns the score into a function of n - m"
      latex: |
        Let $R_m \in \mathbb{R}^{d\times d}$ be block-diagonal with $d/2$ blocks

        $$R_m^{(i)} = \begin{bmatrix} \cos m\omega_i & -\sin m\omega_i \cr
                                      \sin m\omega_i & \cos m\omega_i \end{bmatrix},
          \qquad \omega_i = \theta^{-2i/d},$$

        acting on coordinates $(2i, 2i+1)$. Each block is orthogonal and
        $R_m^\top R_n = R_{n-m}$, because rotations in a plane compose by adding
        angles. Applying the rotation after projection:

        $${q'}_m^\top {k'}_n = (R_m q)^\top (R_n k) = q^\top R_m^\top R_n k
          = q^\top R_{n-m}\, k.$$

        The right-hand side contains $n-m$ and no other function of the
        positions. Expanding over planes, with $e_i$ the energy of $q$ in plane
        $i$:

        $$q^\top R_{k} k = \sum_i \Big[(q_{2i}k_{2i} + q_{2i+1}k_{2i+1})\cos(k\omega_i)
          + (q_{2i+1}k_{2i} - q_{2i}k_{2i+1})\sin(k\omega_i)\Big],$$

        and when $q = k$ the sine terms vanish and the score is
        $\sum_i e_i\cos(k\omega_i)$. Measured: $4.360102627621$ at offset 7 for
        $(m,n) \in \{(0,7),(100,107),(5000,5007),(13,20)\}$, spread
        $1.4\times10^{-12}$; the self-similarity profile runs $1.000, 0.986,
        0.858, 0.725, 0.409, 0.292$ at offsets $0, 1, 4, 16, 64, 1024$.
      prose: >-
        The asymmetry is the point. $R_m$ acts on $Q$ and $R_n$ acts on $K$; the
        inner product can only see their product $R_m^\top R_n = R_{n-m}$, which
        is why an *absolute* rotation produces an *exact* relative score. It also
        explains the two constraints: rotating $V$ would leave the value in a
        position-dependent basis with nothing to cancel it, and using different
        pairing conventions for $Q$ and $K$ means the two rotations act on
        different coordinate systems, so their product is not a rotation at all
        and the score silently depends on absolute position again.
    - title: "The band budget: how many frequencies can resolve an offset"
      latex: |
        Band $i$ has wavelength $\lambda_i = 2\pi\theta^{2i/d}$, so
        $\log\lambda_i$ is affine in $i$ with slope $(2/d)\log\theta$ — a
        geometric ladder. A band can still locate an offset $k$ only while its
        wavelength exceeds a small multiple of it; take $\lambda_i > 2k$:

        $$2\pi\theta^{2i/d} > 2k
          \iff \frac{2i}{d}\log\theta > \log\frac{k}{\pi}
          \iff i > \frac{d}{2}\cdot\frac{\log(k/\pi)}{\log\theta}.$$

        So the number of usable bands is

        $$N(k) = \frac{d}{2}\left(1 - \log_\theta \frac{k}{\pi}\right),$$

        and it falls linearly in $\log k$ at a rate of
        $\frac{d}{2}\log_\theta 2$ bands per doubling: $2.41$ at $d=64$,
        $\theta=10^4$; $3.38$ at $d=128$, $\theta=5\times10^5$. Measured against
        the count: 11 of 32 at $k=1024$, 7 of 32 at 4096, 0 of 32 at 32,768;
        and for $d=128,\theta=5\times10^5$: 29 of 64 at 4096, 18 of 64 at
        32,768, 12 of 64 at 131,072.
      prose: >-
        This is the long-context problem stated as arithmetic rather than
        anecdote. Doubling the context costs a fixed number of bands, and the
        cost per doubling is set by two knobs: wider heads buy more bands
        (linear in $d$) and a larger base buys a slower ladder (inverse in
        $\log\theta$). Position interpolation attacks it by shrinking every
        $k$, which pulls offsets back into range but multiplies every wavelength
        by the same factor and therefore destroys local resolution; NTK-aware
        scaling raises $\theta$, which stretches the slow bands while leaving the
        fast ones where they were. Neither creates information; both choose
        which end of the ladder to sacrifice.

  implementations:
    - language: python
      title: "Sinusoidal encoding and RoPE, with the two invariances checked numerically"
      note: >-
        Correct forward code, and deliberately incomplete: it has no backward
        pass, it materialises the full $n \times n$ angle matrix when the cache
        is rebuilt, and it uses the interleaved pairing convention rather than
        the split-half one most fused kernels use. The diagnostics are the point
        — run it and you should see the sinusoidal offset spread near $10^{-13}$
        and the RoPE agreement near $10^{-13}$ too, which is float64 rounding
        rather than a property of the formulas.
      code: |
        import numpy as np

        def sinusoidal(n, d, base=10000.0):
            """(n, d) with pairs (sin p w_i, cos p w_i). d must be even."""
            assert d % 2 == 0
            i = np.arange(0, d, 2, dtype=np.float64)
            omega = base ** (-i / d)                 # geometric ladder
            ang = np.arange(n, dtype=np.float64)[:, None] * omega[None, :]
            pe = np.zeros((n, d))
            pe[:, 0::2] = np.sin(ang)
            pe[:, 1::2] = np.cos(ang)
            return pe

        def rope(x, positions, base=10000.0):
            """Rotate each row of x by its own position. x is (n, d), d even."""
            x = np.asarray(x, dtype=np.float64)
            n, d = x.shape
            assert d % 2 == 0 and len(positions) == n
            i = np.arange(0, d, 2, dtype=np.float64)
            omega = base ** (-i / d)
            ang = np.asarray(positions, dtype=np.float64)[:, None] * omega[None, :]
            c, s = np.cos(ang), np.sin(ang)
            x1, x2 = x[:, 0::2], x[:, 1::2]      # the two halves of each plane
            out = np.empty_like(x)
            out[:, 0::2] = x1 * c - x2 * s       # 2x2 rotation, per plane
            out[:, 1::2] = x1 * s + x2 * c
            return out

        if __name__ == "__main__":
            d = 64
            pe = sinusoidal(20000, d)
            print("norm^2 per row   ", (pe ** 2).sum(1).min())        # 31.999999999999993

            # 1. sinusoidal: the dot product does not depend on p
            vals = np.array([pe[p] @ pe[p + 7] for p in range(1000)])
            print("dot(p, p+7)      ", vals.mean(), "spread", vals.max() - vals.min())
            # 23.264326..., spread ~2.5e-13

            # 2. RoPE: the score depends only on n - m
            rng = np.random.default_rng(1)
            q = rng.standard_normal(d)
            k = rng.standard_normal(d)
            for m in (0, 100, 5000):
                print("rope offset 7 at m=%5d" % m,
                      rope(q[None], [m])[0] @ rope(k[None], [m + 7])[0])
            # 4.360102627621 three times, agreeing to ~1e-13

            # 3. rotation preserves the norm, so RoPE cannot blow up the logits
            print("norm preserved   ", np.allclose(
                np.linalg.norm(rope(pe, np.arange(len(pe))), axis=1),
                np.linalg.norm(pe, axis=1)))
    - language: python
      title: "Three RoPE implementations that look right and are numerically WRONG"
      note: >-
        All three are **wrong**, and none of them raises, NaNs, or changes a
        shape — which is why they survive code review. The reference point is
        the correct score at offset 7 for this $q,k$ pair: 4.360103.
        `rope_elementwise` drops the pair mixing, so each coordinate is scaled by
        its own cosine: the same fixed offset gives 5.406896 at $m=0$, 2.181995
        at $m=100$, $-0.158443$ at $m=5000$ and 4.141890 at $m=13$, and the row
        norm has fallen from 6.865 to 5.232 by $m=1000$ because a cosine is not a
        rotation. `rope_query_only` rotates just $Q$, so against a fixed $K$ the
        score runs 0.9787, $-0.6091$, $-2.3302$ for $m = 0, 100, 5000$ — the
        offset never enters.
        `rope_after_softmax` rotates the attention *weights*, and their row sums
        leave 1 by 0.483 because a probability row is not a set of 2D vector
        pairs.
      code: |
        import numpy as np

        def omega(d, base=10000.0):
            return base ** (-np.arange(0, d, 2, dtype=np.float64) / d)

        def rotate(x, positions, base=10000.0):
            """The correct rotation, used here only as a reference."""
            x = np.asarray(x, dtype=np.float64)
            ang = np.asarray(positions, dtype=np.float64)[:, None] * omega(x.shape[-1], base)[None, :]
            c, s = np.cos(ang), np.sin(ang)
            a, b = x[..., 0::2], x[..., 1::2]
            out = np.empty_like(x)
            out[..., 0::2] = a * c - b * s
            out[..., 1::2] = a * s + b * c
            return out

        def rope_elementwise(x, positions, base=10000.0):
            """WRONG: cos/sin applied per coordinate. No pair is ever mixed."""
            d = x.shape[-1]
            om = base ** (-np.arange(d, dtype=np.float64) / d)   # and the wrong exponent
            return x * np.cos(np.asarray(positions, dtype=np.float64)[:, None] * om[None, :])

        def rope_query_only(Q, K, m):
            """WRONG: K is never rotated, so the score sees absolute m."""
            return rotate(Q, m) @ np.asarray(K, dtype=np.float64).T

        def rope_after_softmax(P, positions):
            """WRONG: rotating probabilities is not a positional encoding."""
            return rotate(P, positions)

        if __name__ == "__main__":
            q, k = np.random.default_rng(1).standard_normal((2, 64))
            print("correct, offset 7  ", rotate(q[None], [0])[0] @ rotate(k[None], [7])[0])
            # 4.360102627620691

            for m in (0, 100, 5000, 13):
                bad = rope_elementwise(q[None], [m])[0]
                print("elementwise m=%5d %+0.6f" % (m, bad @ rope_elementwise(k[None], [m + 7])[0]))
            # +5.406896, +2.181995, -0.158443, +4.141890 : one offset, four answers

            print("norm m=0 vs m=1000 ",
                  np.linalg.norm(rope_elementwise(q[None], [0])),
                  np.linalg.norm(rope_elementwise(q[None], [1000])))
            # 6.865009 5.231773 : a scaling, not a rotation

            print("Q-only, K fixed    ", [float(rotate(q[None], [m])[0] @ k) for m in (0, 100, 5000)])
            # [0.9787279149302046, -0.6090963653222081, -2.330212991914685]

            P = np.random.default_rng(0).random((8, 8))
            P = P / P.sum(1, keepdims=True)
            print("row sum error      ", np.abs(rope_after_softmax(P, np.arange(8)).sum(1) - 1).max())
            # 0.48294580850970026 : a weighted average it is no longer

