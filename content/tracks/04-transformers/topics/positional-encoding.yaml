    - title: "Sinusoidal encoding is a rotation, so its inner product depends only on the offset"
      latex: |
        Write one 2D plane of the encoding at position $p$ as
        $u_p = (\sin p\omega,\ \cos p\omega)^\top$. The addition formulas give

        $$u_{p+k} = \begin{bmatrix} \cos k\omega & \sin k\omega \cr
                                   -\sin k\omega & \cos k\omega \end{bmatrix} u_p
                 = R(k\omega)\, u_p .$$

        $R$ is orthogonal, $R^\top R = I$, so stacking the $d/2$ planes into a
        block-diagonal $R_k$ preserves norms and gives $PE_{p+k} = R_k PE_p$.
        Now the inner product:

        $$PE_p^\top PE_{p+k}
          = \sum_i \Big[\sin(p\omega_i)\sin((p+k)\omega_i)
                     + \cos(p\omega_i)\cos((p+k)\omega_i)\Big]
          = \sum_i \cos(k\omega_i),$$

        using $\cos(a-b) = \cos a\cos b + \sin a\sin b$ with $a = (p+k)\omega_i$
        and $b = p\omega_i$. Every $p$ cancels. Measured at $d=64$: the value is
        $23.264326$ at $k=7$ for $p = 0, 997, 1999$, with a spread of
        $2.5\times10^{-13}$ over a thousand positions; the rotation identity
        itself is exact to $4.9\times10^{-14}$ at $k=1$ and $6.8\times10^{-13}$
        at $k=5000$.
