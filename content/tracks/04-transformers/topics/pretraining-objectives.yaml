id: pretraining-objectives
slug: pretraining-objectives
title: "Pretraining Objectives: LM, MLM, and Prefix LM"
summary: >-
  A base model is trained by one scalar: the mean negative log-probability of
  the next token over a packed stream of tokens, and every decision around it -
  packing, tokeniser, vocabulary, data mix, model size - only changes which
  tokens that mean is taken over. This topic derives that loss, measures the
  same text at 4.2157 nats per word-token and 1.7076 nats per byte-token with
  perplexities of 67.74 and 5.52 that rank the two models in the opposite order
  to bits per character, and prices causal LM against masked and prefix LM on
  25,398 identical held-out targets.
kind: lesson
difficulty: expert
position: 9
estMinutes: 29
prerequisites: [transformer-block, decoding-strategies]
phase: "pretraining"
tags:
  - pretraining
  - causal-lm
  - masked-lm
  - prefix-lm
  - cross-entropy
  - perplexity
  - packing
  - scaling-laws
  - chinchilla
  - data-mixture
  - tokeniser

body:
  big_idea: >-
    A base model is trained by one scalar — mean next-token cross-entropy over
    a packed stream — and every choice about documents, tokeniser, vocabulary
    and size decides which tokens that mean counts.

  problem:
    - >-
      Your script prints "loss: 3.42" and you cannot say whether it is good:
      the baseline is $\ln V$ and the denominator is not printed.
    - >-
      A vendor reports perplexity 1.9 on Hindi and 18.7 on English and
      concludes Hindi is better; their tokeniser spends 12.6 tokens on a word.
    - >-
      You pack documents into 2,048-token windows and validation rises a tenth
      of a nat, because the first token now follows an unrelated document.

  analogy: |
    A proofreader paid by the word. Every text is read one word at a time with
    the rest covered, and they are paid for the average guess — so a 629-word
    document contributes 629 guesses and a 26-word one contributes 26, and the
    long document outvotes the short one 24 to 1. Nobody decided that; it fell
    out of paying per word.

  concept_points:
    - >-
      **The loss is a sum over positions divided by the number of positions, and the denominator is the whole story.**
      A document of length $T$ contributes $T$ times: the token-weighted mean
      is **4.2157** nats and the average of per-document means **4.3228** —
      67.74 against 75.40 perplexity from nothing but the choice of average.
      The longest 10% of documents hold **22.70%** of the tokens.
    - >-
      **Per-token loss only means something next to the tokeniser that produced the tokens.**
      Same prose, one architecture family: word-level (V = 2,000) gives 4.2157
      nats and ppl 67.74, character-level (V = 136) gives 1.6302 and **5.11**,
      byte-level (V = 257) gives 1.7076 and 5.52. Perplexity spans **13.27x**
      while bits per character spans **1.74x**.
    - >-
      **Perplexity is a compression ratio, so across languages it measures fertility.**
      Since $\operatorname{ppl} = 2^{b}$ and bits per token is bits per
      character times characters per token, a tokeniser emitting 12.6 tokens
      per word reports a tiny number for identical information. At 2.474
      bits/character, a byte tokeniser reports 5.56, English BPE at 4.55
      chars/token reports **2,447**, and Hindi BPE at 0.38 reports **1.92**.
    - >-
      **The three objectives are one measurement apart, and the numbers are not comparable.**
      Same architecture (435,473 parameters, six context slots), corpus, 6,000
      steps and 25,398 held-out targets: causal **4.2632** nats (ppl 71.04),
      15%-masked **3.5296** (ppl 34.11), 50%-prefix **4.1342** (ppl 62.44).
      The masked model is a factor of 2.08 better in perplexity without being
      better — two of its six context slots are to the *right* of the target.
    - >-
      **Masking trades labels for passes at a fixed exchange rate of 1/0.15.**
      A causal pass over a 2,048-token window yields **2,047** predictions
      (the shift drops one); a 15%-masked pass yields **307** — 245.8 with a
      mask token, 30.7 random and 30.7 left alone under the 80/10/10 rule.
      Equal gradient signals therefore cost **6.67** masked passes per causal
      pass, and that ratio, not the loss, is the honest comparison.
    - >-
      **Packing removes the padding and pays in document boundaries.** One
      document per 2,048-token sequence wastes **95.74%** of every batch as
      padding; packing the same 3,063 documents into 131 windows wastes
      **0.41%** but puts 23.4 documents in each window. The cost: a document's
      first token scores 3.3024 nats with its own start token in front and
      **6.2664** with the previous document's last three.

  definitions:
    - term: "Causal language modelling"
      meaning: >-
        Predicting each token from the tokens before it only, so the joint
        probability factorises as a product of conditionals and one pass over a
        document yields T-1 training targets. It is the only objective of the
        three that can be sampled from directly, which is why it became the
        default the moment models were asked to generate.
    - term: "Teacher forcing"
      meaning: >-
        Conditioning each prediction on the *true* previous tokens rather than
        the model's own, which is what makes the T-1 targets computable in one
        parallel pass. It creates the train/test mismatch that decoding has to
        live with: at generation time the model conditions on its own output,
        and an error at position 3 is not in the training distribution at
        position 4.
    - term: "Negative log-likelihood (NLL)"
      meaning: >-
        $-\log p_\theta(x_t \mid x_{<t})$, the loss for one position, in nats
        because the log is natural. It is zero for a perfect prediction with
        probability 1 and unbounded for a confident mistake, and the mean of it
        over positions is the training loss.
    - term: "Perplexity"
      meaning: >-
        $\exp$ of the mean NLL per token, interpreted as the effective number of
        equally likely choices at each position. It is a compression ratio, not
        a quality score: ppl 67.74 means 6.08 bits per token, and how impressive
        that is depends entirely on how many characters a token carries.
    - term: "Bits per character (BPC)"
      meaning: >-
        Bits per token divided by characters per token. It is the only
        tokeniser-independent version of the loss on a fixed text, and the only
        one that can be compared across languages reasonably - not perfectly,
        because the byte content of a character differs by script.
    - term: "Fertility"
      meaning: >-
        Tokens per word for a given tokeniser and language. Measured elsewhere
        in this track as 1.19 for English and 12.58 for Hindi with the same
        English-trained vocabulary, which is a 10.6x difference in how many
        predictions the same content costs.
    - term: "Packing"
      meaning: >-
        Concatenating documents end to end and cutting the stream into fixed
        windows, so that no position is padding. It removes 95.74% waste at a
        2,048-token window and creates document boundaries inside windows -
        23.4 per window here - which is why the end-of-document token is part of
        the objective rather than a formatting detail.
    - term: "Document boundary (EOS)"
      meaning: >-
        The token that separates two documents in a packed stream. Without it
        the first token of a document is conditioned on the previous document,
        measured here as 2.964 nats of damage on exactly the positions where it
        matters most.
    - term: "Masked language modelling (MLM)"
      meaning: >-
        Replacing a fraction of tokens with a mask and predicting them from both
        sides. The 80/10/10 rule uses a mask token 80% of the time, a random
        token 10% and the true token 10%, so that the model cannot learn to
        ignore the mask symbol; at 15% and a 2,048-token window that is 245.8
        masked, 30.7 random and 30.7 unchanged positions per pass.
    - term: "Prefix LM"
      meaning: >-
        A causal model whose first $p$ positions attend bidirectionally and
        whose remaining positions attend causally, so the objective can be
        conditioned on a long prompt and still generate. It costs the clean
        factorisation - the bidirectional half is not a valid likelihood - which
        is why it survives mainly in encoder-decoder and infilling systems.
    - term: "Tokens per parameter"
      meaning: >-
        $D/N$, the single number that says whether a run is data-limited or
        parameter-limited. Everything published is 20-2,000; this topic's toy
        model is 0.52, which is why its fitted exponents are 2.8x and 4.4x
        steeper than the published 0.28 and 0.34.

  diagrams:
    - type: pipeline
      title: "One pretraining step, and where each number in this topic enters"
      nodes:
        - label: "Corpus of documents"
          note: "3,063 paragraphs, 267,194 tokens, 1.12M characters"
          detail: "The unit is a document, because the objective is per token but the data arrives per document. Everything downstream - packing, filtering, mixture weights - is a decision about how those two units are reconciled."
        - label: "Filter and deduplicate"
          note: "44.24% of documents are under 64 tokens"
          detail: "A length filter is a reweighting, not a cleanup: those small documents are a quarter of the tokens. Deduplication removes repeated tokens from the denominator, which changes the average every other token is compared against."
        - label: "Tokenise"
          note: "V = 2,000 words, or 136 characters, or 257 bytes"
          detail: "The vocabulary sets the number of predictions per document, the uniform baseline ln V, and 7.52% of targets land on the unknown token at V = 2,000."
        - label: "Pack into windows"
          note: "131 windows of 2,048, 23.4 documents each"
          detail: "Packing removes the 95.74% padding that one-document-per-sequence would waste. It also creates the boundaries that the end-of-document token exists to mark."
        - label: "Shift by one and score"
          note: "T-1 predictions per window"
          detail: "Logits at position t score token t+1. Getting this shift wrong - scoring a token against itself - gives a loss that looks excellent and a model that learns to copy, which is the single most common silent bug in a from-scratch implementation."
        - label: "Mean cross-entropy"
          note: "4.2157 nats per token on held-out documents"
          detail: "The mean is over every counted position in the batch. Divide by documents instead of tokens and the same weights read 4.3228 - a 0.107-nat difference that no architecture change at this scale would produce."
        - label: "Backward and update"
          note: "one step per batch"
          detail: "The gradient is the mean of per-position gradients, so a document with 629 tokens contributes 24 times the gradient of one with 26. That is the same weighting as the loss, expressed in the update instead of the report."
      caption: "Every box changes the loss without touching the loss function. That is the topic: the objective is four lines, and the engineering is deciding which tokens it is computed over."

