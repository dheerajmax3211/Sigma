            - { x: 1.0, y: 2.0625 }
            - { x: 1.5, y: 5.4034 }
            - { x: 2.0, y: 8.5676 }
            - { x: 3.0, y: 10.3025 }
            - { x: 10.0, y: 10.8039 }
        - name: "row entropy 4.48 nats at T=1"
          points:
            - { x: 0.1, y: 0.0012 }
            - { x: 0.3, y: 0.2675 }
            - { x: 0.5, y: 0.9329 }
            - { x: 0.7, y: 1.9243 }
            - { x: 1.0, y: 4.4833 }
            - { x: 1.5, y: 8.8591 }
            - { x: 2.0, y: 10.1379 }
            - { x: 3.0, y: 10.6342 }
            - { x: 10.0, y: 10.8148 }
        - name: "row entropy 7.57 nats at T=1"
          points:
            - { x: 0.1, y: 0.0080 }
            - { x: 0.3, y: 0.5301 }
            - { x: 0.5, y: 1.6373 }
            - { x: 0.7, y: 3.5574 }
            - { x: 1.0, y: 7.5659 }
            - { x: 1.5, y: 10.0741 }
            - { x: 2.0, y: 10.5336 }
            - { x: 3.0, y: 10.7317 }
            - { x: 10.0, y: 10.8192 }
      caption: "All three curves end at ln V = 10.8249 nats, which is the uniform distribution: at high temperature the row you started from stops mattering. The flat row is already at 7.57 of 10.82 nats, so it has little room left to be flattened."

    - type: plot
      title: "Beam width against the gap to the exact best sequence, 24 tokens"
      chart: line
      xLabel: "beam width k"
      yLabel: "nats below the exact best sequence"
      series:
        - name: "corpus trigram, V = 200, n = 24"
          points:
            - { x: 1, y: 39.6512 }
            - { x: 2, y: 31.8404 }
            - { x: 4, y: 26.2846 }
            - { x: 8, y: 0.0 }
            - { x: 16, y: 0.0 }
            - { x: 32, y: 0.0 }
            - { x: 64, y: 0.0 }
            - { x: 200, y: 0.0 }
      caption: "The curve reaching zero at k = 8 is a property of this model's mode, not of beam search: the optimum is a fixed point, so a wide enough beam cannot miss it. On a real model the same curve decays slowly and never reaches zero."

    - type: compare
      title: "Choosing between maximising likelihood and sampling it"
      left_label: "Beam search (maximise the sum)"
      left_points:
        - "Returns the highest-probability sequence it can find: -20.1726 against greedy's -59.8239 over 24 tokens"
        - "Deterministic: the same prompt gives the same output every time"
        - "The optimum is a cycle - 'at' repeated 24 times, distinct-2 = 0.0435"
        - "Costs k times the compute and k times the memory per step"
        - "Use it when the answer is nearly unique: translation, speech, OCR, constrained formats"
      right_label: "Sampling (draw from the row)"
      right_points:
        - "Returns a typical sequence: 3,000 samples averaged -4.4340 per token, 86.2 nats below the mode"
        - "Stochastic: two runs differ, which is a feature when you want variety"
        - "Diversity is real - distinct-2 = 0.9967 against the mode's 0.0435"
        - "Costs one forward pass per token, the same as greedy"
        - "Use it when many answers are acceptable: open-ended text, dialogue, brainstorming"

    - type: architecture
      title: "Speculative decoding: one target pass, several accepted tokens"
      nodes:
        - id: ctx
          x: 0
          y: 0
          label: "Context"
          kind: client
          detail: "The prompt plus everything generated so far. Both models read the same context, so the draft can be run eagerly without touching the target."
        - id: draft
          x: 1
          y: 0
          label: "Draft model"
          kind: gpu
          detail: "A small model - the same family at a quarter of the width, or a distilled head. It proposes gamma tokens autoregressively at a fraction of the target's cost per token, and its distribution q is what the acceptance test compares against."
        - id: target
          x: 2
          y: 0
          label: "Target model"
          kind: model
          detail: "Scores all gamma draft tokens in a single forward pass, which is the whole point: those gamma positions are verified for the price of one position, because the pass is bandwidth-bound rather than compute-bound."
        - id: accept
          x: 3
          y: 0
          label: "Accept or reject"
          kind: worker
          detail: "For each position, accept with probability min(1, p/q). On the first rejection, sample from the normalised max(0, p - q) and start over; if all gamma survive, take one bonus token from p. That residual step is what keeps the output distribution identical to the target's."
      edges:
        - from: ctx
          to: draft
          label: "gamma proposals"
        - from: draft
          to: target
          label: "verify in one pass"
        - from: target
          to: accept
          label: "p and q per position"
        - from: accept
          to: draft
          label: "accepted plus one, repeat"
          style: async
      caption: "The loop runs until the stop token or the token budget. Acceptance rate alpha caps the speedup at 1/(1-alpha) tokens per target pass, so a draft that agrees 55% of the time is worth 2.22x and no more."

  markdown: |
    ## The model does not produce text

    A decoder-only transformer maps token ids to a matrix of logits, one row per
    position. Nothing in the architecture chooses a token; a policy reads the
    last row, writes one id, appends it, and runs again. Every option on a
    sampling playground is a different policy over the same rows:

    $$p_\theta(y_t \mid y_{<t}) = \operatorname{softmax}(z_t), \qquad
      \hat{y} = \operatorname*{arg\,max}_{y_{1:n}} \; f\big(p_\theta(y_{1:n})\big).$$

    Greedy takes the argmax of each row. Beam search takes
    $f = \log p_\theta(y_{1:n})$. Sampling takes $f$ to be "draw once from $p$".
    Temperature and truncation change $p$ before any of those rules see it.
    Since the model costs one forward pass per token either way, the decoder
    adds $O(V)$ work per position and decides everything about the output.

    ## Greedy and beam: two search algorithms

    Greedy is $O(V)$ per token and deterministic. Beam search keeps the $k$
    best partial sequences at each step, scored by

    $$s(y_{1:t}) = \sum_{i=1}^{t} \log p_\theta(y_i \mid y_{<i}),$$

    and extends each by every vocabulary entry, costing $O(kVn)$ instead of the
    $O(V^n)$ of exact search. It is Viterbi over a state space truncated to $k$
    paths, which tells you when it is exact: when $k$ is at least the number of
    distinct states, $V$ for a bigram model or $V^2$ for a trigram, because the
    DP merges prefixes that share a state and beam search does not.

    Measured on a word-level trigram trained on 93,140 words of this project's
    own prose (200-token vocabulary, 61.51% coverage), over 24 tokens:

    | beam width | log-probability | gap to exact best | per token |
    |---|---|---|---|
    | 1 (greedy) | -59.8239 | 39.6512 | -2.4927 |
    | 2 | -52.0130 | 31.8404 | -2.1672 |
    | 4 | -46.4572 | 26.2846 | -1.9357 |
    | 8 | -20.1726 | 0.0000 | -0.8405 |
    | 200 (= V, exact) | -20.1726 | 0.0000 | -0.8405 |

    The gap reaching zero at $k = 8$ is not evidence that beam search works; it
    is evidence about the landscape. There is a second problem in the same
    table: the score is a sum, so it always prefers shorter sequences. Measured,
    beam(8)'s best 4-token sequence scores -5.6662 (-1.4166 per token) and its
    best 24-token sequence scores -20.1726 (-0.8405 per token), so raw sums rank
    the short one higher and per-token averages rank the long one higher. Both
    are artefacts: per-token likelihood improves as the model settles into its
    loop, so a length penalty is a hyperparameter that chooses which degenerate
    answer you get, not a correction.

    ## The maximiser is a cycle

    In a finite-order model with a unique argmax transition, the greedy path is
    eventually periodic: the state space is finite, so the path revisits a state
    and repeats. The MAP path is not forced to be periodic in the same way, but
    it is pulled to the same place: the DP's best-predecessor relation is a
    function on states, so a state whose best continuation is itself absorbs the
    path. On the model above the exact MAP of 24 tokens is
    "at" twenty-four times, with $p(\text{at} \mid \text{at},\text{at}) = 0.4842$
    and distinct-2 of 0.0435, while greedy finds "the is the same the same ...".
    Both are loops; they differ in which loop. That is why beam search produces
    dull text: not a weak search - it is exact here - but a maximiser whose
    maximiser is a loop.

    ## The mode is not a sample

    Let $H$ be the per-token entropy of the sequence distribution. Then

    $$\mathbb{E}_{y \sim p}\left[-\tfrac{1}{n}\log p(y)\right] = H,
      \qquad -\tfrac{1}{n}\log p(\hat{y}) \le H,$$

    because an average is at most the maximum. A sampled sequence sits at $H$
    nats per token; the mode sits at $H_{\min}$. Measured: the MAP is at -0.8405
    per token, 3,000 samples average -4.4340, and the gap of 3.5935 nats per
    token is 86.2 nats over 24 tokens, so the mode is $e^{86.2} \approx
    3.7\times10^{37}$ times more probable than a typical sample. Its own
    probability is $1.73\times10^{-9}$; none of the 3,000 samples came within 5
    nats of it, and the best was 39.5 nats short. Distinct-2 over the same runs:
    0.0435 for the mode, 0.1739 greedy, 0.4348 at beam 4, 0.9967 for samples.
    Higher probability buys lower diversity, monotonically - which is the trade.
    For translation the mode is the right target; for open-ended generation a
    repeated phrase is not an answer, and that is why production chat models
    sample.

    ## Temperature

    $$p_i(T) = \frac{\exp(z_i/T)}{\sum_j \exp(z_j/T)},$$

    which preserves the ranking - a zero-probability token stays at zero - and
    changes entropy monotonically. With $\beta = 1/T$,

    $$H(\beta) = \log Z - \beta\langle z\rangle,
      \qquad \frac{dH}{d\beta} = -\beta\operatorname{Var}_p(z),
      \qquad \frac{dH}{dT} = \frac{\operatorname{Var}_p(z)}{T^3} \ge 0.$$

    The slope is not a free parameter. Measured on a 50,257-token row of entropy
    4.4833 nats, the finite difference at $T = 1$ is 10.82606 and
    $\operatorname{Var}/T^3$ is 10.82606; at $T = 2$ both are 0.44580. The limits
    are 0 at $T \to 0$ (0.0012 nats at $T = 0.1$) and $\ln V$ at
    $T \to \infty$ (10.8148 against $\ln 50{,}257 = 10.8249$ at $T = 10$).

    | T | row of 2.06 nats | row of 4.48 nats | row of 7.57 nats |
    |---|---|---|---|
    | 0.3 | 0.0930 | 0.2675 | 0.5301 |
    | 0.7 | 0.9556 | 1.9243 | 3.5574 |
    | 1.0 | 2.0625 | 4.4833 | 7.5659 |
    | 1.5 | 5.4034 | 8.8591 | 10.0741 |
    | 3.0 | 10.3025 | 10.6342 | 10.7317 |

    Two things the word "creativity" hides. Temperature is a single global
    rescaling, so it cannot sharpen the head while leaving the tail alone:
    going from 1.0 to 1.5 on the middle row adds 4.38 nats, most of the distance
    to uniform. And on these rows - power laws, $p_i \propto (i+1)^{-s}$ -
    tempering is exactly $s \mapsto s/T$, which is why the columns are shifted
    copies of each other. That self-similarity is an artefact of the power law;
    on a real row with a distinct head, most of the added entropy lands in the
    tail.

    ## Top-k and top-p

    Top-$k$ keeps the $k$ largest probabilities, so the count is fixed and the
    mass is whatever the row gives it. Top-$p$ keeps the smallest set of largest
    probabilities whose cumulative mass reaches $p$, so the mass is fixed and
    the count is whatever the row requires.

    | row entropy at T = 1 | mass kept by k = 10 | tokens kept by p = 0.9 | max probability |
    |---|---|---|---|
    | 2.0625 nats | 0.8989 | 11 | 0.5313 |
    | 4.4833 nats | 0.6012 | 523 | 0.2630 |
    | 7.5659 nats | 0.2569 | 16,070 | 0.0877 |

    Ten candidates hold 90% of the mass on one row and 26% on another; 90% of
    the mass takes 11 tokens on one row and 16,070 on another. That is the
    argument for top-$p$, and also its failure mode: on a flat row it truncates
    nothing, and at $p = 0.5$ on the peaked row it keeps one token, which is
    greedy. Top-$k$ fails the other way, by keeping ten candidates when ten
    candidates are the whole distribution.

    The order of operations is usually stated without an order. Both rules keep
    a rank prefix and temperature is monotone, so the set that survives is the
    same in either order and only the threshold moves. Measured on the middle
    row: a nucleus of 523 tokens taken at $T = 1$ carries 0.99704 of the mass at
    $T = 0.7$, while the nucleus taken at $T = 0.7$ has 9 tokens and carries
    0.90. The two distributions differ by 0.3% in top probability (0.556446
    against 0.554797) - close enough that one token will not show it, far enough
    that you asked for 90% and got 99.7%. Truncate the row you are going to
    sample from.

    ## Penalties

    A repetition penalty acts on logits, not probabilities, so its sign matters.
    The rule that works is asymmetric:

    $$\tilde z_i = z_i/\theta \ \text{ if } z_i > 0,
      \qquad \tilde z_i = \theta z_i \ \text{ if } z_i \le 0 .$$

    With log-probabilities, all negative, that multiplies by $\theta$ and
    suppresses. Measured on a row with $p(\text{top}) = 0.199290$: $\theta = 1.2$
    gives 0.152731, a 23% reduction, while the naive symmetric "divide
    everything" gives 0.245658, a 23% increase. The frequency penalty keeps
    counting: subtracting $\lambda$ per occurrence takes the same token to
    0.083882 after one use and 0.012240 after three at $\lambda = 1$.

    Both are blunt because repetition is not a defect: in the corpus, 13.90% of
    positions repeat a token from the previous four and 5.28% from the previous
    two, and English needs "the" and "of" to recur. A penalty strong enough to
    stop a loop is strong enough to damage the sentences that are not loops.

    ## Speculative decoding

    Decoding is memory-bandwidth-bound: one pass reads every weight to produce
    one token. A draft model proposes $\gamma$ tokens, the target scores all
    $\gamma$ positions at once, and each proposal $x$ survives with probability

    $$\min\left(1, \frac{p(x)}{q(x)}\right),$$

    with the first rejection sampling from the normalised $\max(0, p - q)$. That
    residual is the proof that the output is distributed exactly as the target.
    With $\alpha = \sum_i \min(p_i, q_i) = 1 - \mathrm{TV}(p,q)$ the expected
    tokens per pass is

    $$\mathbb{E}[\text{tokens}] = \frac{1 - \alpha^{\gamma+1}}{1-\alpha},
      \qquad \text{limit } \frac{1}{1-\alpha}.$$

    Measured on an eight-outcome target with $\alpha = 0.5500$: 1.5500 tokens
    per pass at $\gamma = 1$, 2.1104 at $\gamma = 4$, 2.2120 at $\gamma = 8$
    against a limit of 2.2222 - and 1.5513, 2.1042, 2.2003 by simulation. Total
    variation from the target was 0.0029 for the exact scheme and 0.1026 for the
    naive variant that resamples from $p$ instead of the residual, with token 0
    arriving at 0.2656 where the target says 0.4000: a 35x difference in
    distribution error for a change that looks like an implementation detail.

    ## Choosing

    | situation | policy | why |
    |---|---|---|
    | translation, speech, OCR, structured output | beam 4-8, length-normalised | the answer is nearly unique; the mode is the right target |
    | chat, open-ended writing | top-p 0.9-0.95, T 0.7-1.0 | you want a typical sequence, not the mode |
    | code against a fixed API | T 0.2, top-p 0.95 | confident rows; truncation does little, temperature does the work |
    | long-form, loops | top-p 0.95 plus a small frequency penalty | a repetition penalty alone damages ordinary prose |
    | latency-bound with a small model available | speculative decoding, gamma 4-8 | 2x tokens per pass at the same distribution |

    One link back to *The Full Transformer Block*: a decode step is
    bandwidth-bound because it streams $12Ld^2 + 2Vd$ parameters to produce one
    token, so a pass that verifies $\gamma$ positions costs almost the same as a
    pass that produces one - which is the whole of speculative decoding. One link
    back to *Tokenisation*: $V$ sets both the cost of the softmax you are
    truncating and the number of candidates the rules choose among, so the same
    vocabulary decision that prices a document also prices a token of choice.

    ## The longer version

    A language model outputs one probability row per position; decoding is a
    separate policy that chooses which sequence to take from that row, and every
    knob you have seen on a playground - greedy, beam, temperature, top-k, top-p,
    penalties - is a different answer to "which sequence do you want", not a
    different model.

    A hill walker choosing a route with a popularity score on every path. Greedy
    takes the most popular next path at every junction. Beam search carries k
    itineraries at once and keeps the k with the highest total popularity,
    dropping the rest at every junction. Sampling rolls a die weighted by
    popularity.

    The mapping is exact for the mechanics: the score is a log-probability, the
    itinerary is a token sequence, and beam's k is its width. The analogy breaks
    at the one place that matters. A walker has a destination, so "the most
    popular route" is a proxy for a good route. A language model has no
    destination: the popularity score is the model's own belief about the next
    step, and the most popular *total* is achieved by walking in a circle
    between two junctions that like each other. That is not a failure of the
    walker; it is the objective, and it is why the best-scoring itinerary is the
    worst answer to "write me a paragraph".

    ### What goes wrong

    - Your product ships with temperature 0.7, top-p 0.9 and a repetition
      penalty of 1.2 because that is what the README said. On some prompts the
      output is a loop, on others it is word salad, and when a customer asks
      why the same prompt gives different answers twice you have no answer
      that distinguishes "the model is uncertain" from "we are rolling dice".
    - You are asked to make a summariser more faithful and someone proposes
      beam search, because beam search "maximises the probability of the
      output". That is true, and it is the reason the summaries get worse: the
      highest-probability continuation of a language model is a repeated
      phrase, measurable at probability 1.7e-9 for a 24-token sequence, which
      no sampler will ever draw.
    - Latency is the binding constraint and the fix on the table is a smaller
      model, which costs quality. Speculative decoding gets the same 2.1x from
      the same weights by spending cheap draft tokens and verifying them in
      one pass - but only if the acceptance step is implemented with the
      residual distribution, and the naive version quietly changes what the
      model says.
    - A user reports that turning the repetition penalty up made repetition
      worse. You check and they are right, because their serving stack divides
      every logit by the penalty and all the logits are negative, so the
      "penalty" multiplies the repeated token's probability by 1.23 instead of
      dividing it.
    - Somebody asks what temperature 1.0 means and you realise you cannot say.
      The honest answer is a number: on a row of entropy 4.48 nats, moving
      from 1.0 to 1.5 raises entropy to 8.86 nats, which is most of the way to
      the 10.82-nat uniform distribution over a 50,257-token vocabulary.

    ### The full treatment

    **Greedy decoding is a fixed-point machine, not a cheap approximation to
    the best sequence.** Take the argmax at every step and the state stops
    moving: on a word-level trigram trained on this project's own 93,140 words
    of prose (200-token vocabulary), greedy over 24 tokens returns "the is the
    same the same the same ..." at a total log-probability of -59.8239, while
    the exact best sequence scores -20.1726. The gap is 39.65 nats, or 1.65
    nats per token - a factor of e^1.65 = 5.2 in probability per token, paid on
    every token, forever. The trap is believing greedy and beam-1 are "the
    same model without search": they are the same policy, and the policy has a
    fixed point that is usually not the mode.

    **Beam search is Viterbi with a width limit, so its guarantee is only
    relative to k.** Keep the k best prefixes at each step and extend each by
    every token: cost is O(k V n) instead of V^n, and the algorithm is exact
    only when k is at least the number of distinct states - V for a first-order
    model, V^2 for the trigram used here - because the DP merges prefixes that
    share a state and beam search keeps them separate. Measured at n = 24: gap
    to the exact MAP is 39.65 nats at k = 1, 31.84 at k = 2, 26.28 at k = 4 and
    0.00 at k = 8, and at k = V = 200 it reproduces the DP's answer to the
    digit. The trap is reading "beam 8 found the exact optimum" as
    evidence that beam search is good - it found a fixed point that any wide
    enough beam cannot miss, which is the opposite of a hard search problem.

    **The maximiser of sequence likelihood is a cycle, and a cycle is not a
    sample.** In a finite-order model with a unique argmax transition the
    greedy path is eventually periodic: the state space is finite, so the path
    revisits a state and repeats from there. The MAP path is not forced to be
    periodic in the same way - a state can be entered with different amounts
    of horizon left - but it is pulled to the same place, because the DP's
    best-predecessor relation is a function on states and any state whose best
    continuation is itself is absorbing. Measured, the exact MAP of 24 tokens
    is "at" repeated 24 times, with
    p(at | at, at) = 0.4842 and distinct-2 = 0.0435 (one distinct bigram in
    23), against distinct-2 = 0.9967 for samples of the same model. That
    sequence is also unreachable by sampling: the typical log-probability is
    -nH, so the mode sits at least H - H_min nats per token above the
    sequences the model actually generates. Measured, the MAP scores -0.8405
    per token against -4.4340 for the average of 3,000 samples, a gap of 86.2
    nats over 24 tokens, so the mode is e^86.2 = 3.7e37 times more probable
    than a typical sample; zero of the 3,000 came within 5 nats of it, and its
    own probability is 1.73e-9, so you would need 5.8e8 draws to expect it
    once. The trap is treating this as a bug in the model or in the sampler:
    it is the objective being satisfied, and it is why sampling beats beam
    search on open-ended prompts - lower probability is what being typical
    looks like, and a maximiser deliberately returns something atypical.

    **Beam search is also length-biased, and the usual fix changes the
    ranking.** Summing log-probabilities always prefers shorter sequences, so
    raw-sum search over lengths returns the shortest candidate. Normalising by
    length (or by ((5+n)/6)^alpha, the GNMT form) removes the bias but not the
    problem: measured, beam(8)'s best sequence scores -5.6662 at n = 4
    (-1.4166 per token) and -20.1726 at n = 24 (-0.8405 per token), so the
    model's per-token likelihood *improves* with length, because once it enters
    the loop every further token is cheap. Per-token normalisation therefore
    prefers the longest loop, and raw sum prefers the shortest prefix. Neither
    number measures quality, which is the trap: a length penalty is a
    hyperparameter that decides which degenerate answer you get.

    **Temperature is a monotone reparametrisation whose entropy slope is
    Var(z)/T^3.** With p_i proportional to exp(z_i/T), entropy rises
    monotonically from 0 at T -> 0 to ln V at T -> infinity, and the local
    slope is the variance of the logits under the tempered distribution
    divided by T^3. Measured on a 50,257-token row of entropy 4.4833 nats:
    0.0012 nats at T = 0.1, 0.9329 at 0.5, 4.4833 at 1.0, 8.8591 at 1.5,
    10.6342 at 3.0 and 10.8148 at 10.0 against ln 50,257 = 10.8249; the finite
    difference of H at T = 1 is 10.82606 and Var/T^3 is 10.82606. The trap is
    the word "creativity": temperature does not add information, it rescales
    the whole row, so it flattens the head and the tail together and can turn a
    confident answer into a coin flip between 500 tokens.

    **Top-k fixes a count, so the mass it keeps is a property of the data.**
    Keeping the k largest probabilities always keeps exactly k tokens; what
    varies is how much of the distribution those k carry. Measured at k = 10
    over three rows of the same 50,257-token vocabulary: 0.8989 of the mass at
    entropy 2.0625 nats, 0.6012 at 4.4833 nats, 0.2569 at 7.5659 nats. The trap
    is picking k once: at 10 on the peaked row you have effectively gone
    greedy (89.9% of the mass in 10 candidates), and on the flat row you have
    truncated almost nothing.

    **Top-p fixes a mass, so the count it keeps is a property of the data - and
    that is both the fix and the new failure.** The nucleus is the smallest set
    of highest-probability tokens whose mass reaches p. Measured at p = 0.9 on
    the same three rows: 11 tokens, 523 tokens and 16,070 tokens - a 1,460x
    swing in the size of the candidate set for the same knob setting. It adapts
    where top-k cannot, and it fails where top-k is safe: on the flat row p =
    0.9 retains 32% of the vocabulary and truncates essentially nothing, while
    on the peaked row p = 0.5 retains exactly 1 token, which is greedy with
    extra steps. The trap is believing top-p is strictly better than top-k; it
    moves the failure from the flat regime to the peaked one.

    **Temperature and truncation commute on the set and not on the mass,
    because both rules keep a rank prefix and temperature cannot reorder
    candidates.** Measured on the entropy-4.4833 row: a nucleus of 523 tokens
    taken at T = 1 carries 0.99704 of the mass once you sample at T = 0.7,
    whereas the nucleus taken at T = 0.7 has 9 tokens and carries 0.90. The
    resulting top-token probability differs by 0.3% (0.556446 against
    0.554797), so the two orders are almost the same distribution - but you
    asked for 90% and got 99.7%, and you are carrying 523 slots instead of 9.
    The trap is a rule stated without an order: "top-p 0.9 at temperature 0.7"
    means truncate the tempered row.

    **Repetition penalties are logit arithmetic, and getting the sign wrong
    turns the penalty into a bonus.** The correct rule divides positive logits
    and multiplies negative ones by theta; with log-probabilities, which are
    all negative, that suppresses the repeated token. Measured on a row with
    p(top) = 0.199290: theta = 1.2 gives 0.152731 with the correct rule and
    0.245658 with a plain "divide everything" - a 23% *increase* in the
    probability of the token you meant to punish, plus entropy falling from
    5.4034 to 5.1775 instead of rising. And the penalty fires often: in the
    corpus, the next token repeats one of the previous four in 13.90% of
    positions, so a penalty large enough to stop loops also distorts the
    ordinary repetition that English requires.

    **Speculative decoding is a latency trick that leaves the distribution
    exactly unchanged, provided the rejection step samples the residual.** A
    draft model proposes gamma tokens, the target scores all of them in one
    forward pass, and each proposal survives with probability min(1, p/q); on
    rejection you sample from the normalised max(0, p - q), which is what makes
    the output distribution identical to sampling the target. Measured with
    alpha = 0.5500: 1.5500 tokens per target evaluation at gamma = 1, 2.1104 at
    gamma = 4 and 2.2120 at gamma = 8, against 1.5513, 2.1042 and 2.2003
    measured by simulation; total variation from the target is 0.0029 for the
    exact scheme and 0.1026 for the naive "resample from p" version, which
    gives token 0 probability 0.2656 where the target says 0.4000. The trap is
    that alpha caps everything: the limit is 1/(1-alpha) = 2.2222 tokens per
    pass, so gamma = 8 buys 4.8% over gamma = 4 and gamma = 32 buys nothing.


