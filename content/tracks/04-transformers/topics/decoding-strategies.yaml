    - title: "Temperature's entropy slope is Var(z)/T^3"
      latex: |
        With $p_i(T) = e^{z_i/T}/Z(T)$ and $\beta = 1/T$,

        $$H(\beta) = -\sum_i p_i \log p_i = \log Z(\beta) - \beta\,\langle z\rangle .$$

        Differentiating term by term, using
        $\partial_\beta \log Z = \langle z \rangle$ and
        $\partial_\beta \langle z\rangle = \operatorname{Var}_p(z)$,

        $$\frac{dH}{d\beta}
          = \langle z\rangle - \langle z\rangle - \beta\,\operatorname{Var}_p(z)
          = -\beta\,\operatorname{Var}_p(z).$$

        Since $d\beta/dT = -1/T^2$,

        $$\frac{dH}{dT} = \frac{\operatorname{Var}_p(z)}{T^{3}} \;\ge\; 0 ,$$

        so entropy increases with temperature everywhere, at a rate set by how
        spread the logits are under the current distribution. The two limits
        follow: as $T \to 0$ every mass concentrates on the argmax and
        $H \to 0$; as $T \to \infty$ the row becomes uniform and
        $H \to \log V$. Measured on a 50,257-token row of entropy 4.4833 nats,
        the finite difference at $T=1$ is $10.82606$ and
        $\operatorname{Var}/T^3 = 10.82606$; at $T = 2$ both are $0.44580$.
      prose: >-
        The slope is not a free parameter: it is the variance of the logits under
        the distribution you are sampling from, divided by the cube of the
        temperature. That is why temperature is a blunt instrument near T = 1 on
        a confident row - variance is large there, so a small change in T moves
        entropy a long way - and why it does almost nothing on a row that is
        already flat, where the variance has nowhere to come from.

    - title: "The typical sequence sits H nats per token below the mode"
      latex: |
        For a sequence of length $n$ drawn from the model,

        $$\mathbb{E}\left[-\frac{1}{n}\log p(y)\right]
          = \frac{1}{n}\sum_{t=1}^{n} H\left(p(\cdot \mid y_{<t})\right) = H,$$

        so a typical sequence has log-probability about $-nH$. For the mode
        $\hat y$,

        $$-\frac{1}{n}\log p(\hat y) = H_{\min} \le H,$$

        because an average of $-\log p$ over the distribution cannot exceed its
        maximum. The gap is therefore at least $H - H_{\min}$ nats per token, and
        the probability ratio between the mode and a typical sequence is

        $$\frac{p(\hat y)}{p(y_{\text{typ}})}
          \approx e^{\,n(H - H_{\min})}.$$

        Measured on the corpus trigram at $n = 24$: $H_{\min} = 0.8405$ nats per
        token for the MAP, $-4.4340$ for the average of 3,000 samples, a gap of
        $3.5935$ per token and $86.2$ nats in total, so the mode is
        $e^{86.2} \approx 3.7\times10^{37}$ times more probable than a typical
        sample. Its own probability is $1.73\times10^{-9}$.
      prose: >-
        This is the quantitative version of "beam search output is dull". A
        maximiser is not a sampler: it returns the point of highest density,
        which for a distribution over $V^n$ sequences is exponentially far from
        where the distribution actually lives. Sampling a mode of probability
        1.7e-9 would take 5.8e8 draws to see once, which is exactly what you
        observe when a beam-search summary repeats a phrase no sampler ever
        produces.

    - title: "Speculative decoding: (1 - alpha^(gamma+1)) / (1 - alpha) tokens per pass"
      latex: |
        A draft token is accepted with probability
        $\min(1, p(x)/q(x))$, so the probability that it survives is

        $$\alpha = \sum_x q(x)\,\min\left(1, \frac{p(x)}{q(x)}\right)
          = \sum_x \min\big(p(x), q(x)\big) = 1 - \mathrm{TV}(p, q).$$

        The first proposal survives with probability $\alpha$; the second only
        if the first did, so it survives with $\alpha^2$; and so on. The expected
        number accepted is

        $$\sum_{i=1}^{\gamma} \alpha^{\,i-1}
          = \frac{1 - \alpha^{\gamma}}{1 - \alpha},$$

        and if all $\gamma$ survive, the target emits one more token for free
        (probability $\alpha^{\gamma}$), giving

        $$\mathbb{E}[\text{tokens per pass}]
          = \frac{1 - \alpha^{\gamma+1}}{1-\alpha}
          \;\xrightarrow[\gamma \to \infty]{}\; \frac{1}{1-\alpha}.$$

        At $\alpha = 0.5500$: 1.5500 for $\gamma = 1$, 2.1104 for $\gamma = 4$,
        2.2120 for $\gamma = 8$, limit 2.2222. Simulation gives 1.5513, 2.1042
        and 2.2003.
      prose: >-
        The formula is the whole engineering argument. Speedup is governed by
        alpha, which is a property of how well the draft approximates the target,
        and it saturates geometrically in gamma: at alpha = 0.55, four draft
        tokens recover 95% of the available speedup and eight recover 99.5%, so
        a larger gamma buys nothing while costing more draft compute and more
        wasted target compute on rejection. A draft model at alpha = 0.9 would be
        worth 10x per pass; at alpha = 0.3 it is worth 1.43x and not worth the
        complexity.

