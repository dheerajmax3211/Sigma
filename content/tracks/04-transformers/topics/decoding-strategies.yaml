        On the corpus trigram, the exact best 24-token sequence is "at" repeated
        24 times, scoring -0.8405 per token with distinct-2 of 0.0435, while
        3,000 samples average -4.4340 per token with distinct-2 of 0.9967. The
        mode is 86.2 nats better and 3.7e37 times more probable than a typical
        sample, and its own probability is 1.73e-9, so no sampler would ever
        draw it and no sample comes within 5 nats of it. Both facts have the same
        cause: beam search is finding the mode, and for a finite-order model the
        mode is a cycle: in a finite state space the greedy path must revisit a
        state and repeat, and the DP is pulled to the same kind of fixed point
        because the best-continuation relation is a function of the state. The beam scores are higher and the
        text is worse because the objective is sequence likelihood, which rewards
        repetition once the model is confident. For an open-ended summary the
        right target is a typical sequence, so sample; reserve beam search for
        tasks where the answer is nearly unique.
    - id: cp-topk-vs-topp
      question: >-
        You ship top-k = 40 at temperature 1.0. On some prompts the output is
        repetitive; on others it drifts off-topic into rare tokens. One change
        fixes both, and it is not temperature. What is it, and why can one knob
        fix two opposite failures?
      answerKind: short_text
      hint: >-
        Compute what fraction of the mass 40 candidates hold when the row's
        entropy is 2 nats, and when it is 7.5 nats.
      solution: >-
        Switch to top-p. A count of candidates means a data-dependent mass: at
        k = 10 measured over three rows of the same 50,257-token vocabulary, the
        kept mass is 0.8989 at entropy 2.0625 nats, 0.6012 at 4.4833 and 0.2569
        at 7.5659. Forty candidates on a peaked row is essentially the whole
        distribution - hence repetition, because the sampler has no alternative
        mass to escape into - and forty candidates on a flat row is a tiny slice
        of a long tail, so the sampler is drawing from an artificially sharpened
        distribution and lands on rare tokens that the model only weakly prefers.
        Top-p holds the mass fixed at 0.9 and lets the count move: measured, 11
        tokens on the peaked row and 16,070 on the flat one. That is why one knob
        fixes both: the failure was never the size of the candidate set, it was
        that the candidate set had nothing to do with the shape of the row. The
        cost is that top-p has its own failure mode - at p = 0.9 on a very flat
        row it keeps 32% of the vocabulary and truncates almost nothing - so on
        a flat row you still need temperature to do the work.
    - id: cp-temperature-entropy
      question: >-
        A colleague wants "temperature 1.3 for creativity" and asks what it does.
        Give the mechanism, the number for a specific row, and the two limits.
      answerKind: short_text
      hint: >-
        Temperature divides logits. What does dividing by a scalar do to the
        ranking, and what does it do to the entropy?
      solution: >-
        It divides every logit by T before the softmax, so the ranking cannot
        change - a token with probability zero stays at zero - and only the
        spread changes. Entropy rises monotonically with slope Var(z)/T^3, so the
        effect depends on the row: measured on a 50,257-token row of entropy
        4.4833 nats, T = 1.3 gives 7.5659 nats and T = 1.5 gives 8.8591, against
        ln 50,257 = 10.8249 for uniform. The limits are H -> 0 at T -> 0
        (measured 0.0012 nats at T = 0.1) and H -> ln V at T -> infinity
        (10.8148 at T = 10.0). So "creativity 1.3" means a specific measurable
        amount of added uncertainty, not a change in what the model knows - and
        on a row that is already at 7.5 of 10.8 nats, the same setting buys much
        less than it does on a confident row.
    - id: cp-penalty-sign
      question: >-
        A serving stack applies a repetition penalty of 1.2 by dividing every
        logit for a repeated token by 1.2, and reports that repetition got worse.
        Why, and what should the code do?
      answerKind: short_text
      hint: >-
        Look at the sign of the logits. What happens to a negative number when
        you divide it by 1.2?
      solution: >-
        Logits at a typical position are negative - if they are log-probabilities
        they are all negative by construction - and dividing a negative number by
        1.2 makes it larger, so the repeated token's probability goes up.
        Measured on a row with p(top) = 0.199290: the naive divide gives 0.245658
        at theta = 1.2, a 23% increase, while the correct asymmetric rule
        (divide positive logits, multiply negative ones) gives 0.152731, a 23%
        decrease. The naive version also lowers entropy from 5.4034 to 5.1775
        instead of raising it, because it sharpens the row around the tokens it
        did not touch. The fix is the branch: `z = z / theta if z > 0 else z *
        theta`. Note that centring the logits first (subtracting the max) makes
        them all non-positive and turns the naive rule into a global sharpen, so
        the sign convention has to be part of the contract, not an afterthought.
    - id: cp-spec-gamma
      question: >-
        Your draft model accepts 55% of proposals. You can afford any gamma. What
        gamma do you choose, what speedup do you get, and what would make the
        answer different?
      answerKind: short_text
      hint: >-
        The expected tokens per pass is (1 - alpha^(gamma+1))/(1 - alpha). Take
        the limit and see how fast gamma gets there.
      solution: >-
        At alpha = 0.5500 the limit is 1/(1-alpha) = 2.2222 tokens per target
        pass. Gamma = 1 gives 1.5500, gamma = 4 gives 2.1104 (95% of the limit),
        gamma = 8 gives 2.2120 (99.5%) and gamma = 32 is 2.2222 to four decimals
        - while costing 32 draft tokens and, on rejection, wasting up to 31
        verified positions. So gamma = 4 or 5: beyond that the extra draft
        compute is pure overhead. What changes the answer is alpha, not gamma: a
        draft at alpha = 0.9 would be worth 10x, and at alpha = 0.3 it is worth
        1.43x and not worth the second model. The other consideration is that
        acceptance is not uniform across positions - it is high on predictable
        text and low where the target is uncertain - so the effective alpha on
        real text is lower than a single-row measurement suggests.
    - id: cp-order
      question: >-
        Your config says top-p 0.9, temperature 0.7. In one implementation the
        truncation runs on the untempered row and the temperature is applied to
        what survives; in the other the row is tempered first. Which is right,
        and how different are the answers?
      answerKind: short_text
      hint: >-
        Both rules keep a rank prefix. Can multiplying by a positive scalar
        change the order of two numbers?
      solution: >-
        Temper first, then truncate, because the p you set is a statement about
        the distribution you are about to sample from. The two orders cannot
        change *which* tokens survive - temperature is monotone, so it never
        reorders candidates, and both rules keep a rank prefix - but they change
        how many. Measured on the entropy-4.4833 row: a nucleus of 523 tokens
        taken at T = 1 carries 0.99704 of the mass once you sample at T = 0.7,
        while the nucleus taken at T = 0.7 has 9 tokens carrying 0.90. The
        resulting distributions differ by only 0.3% in their top probability
        (0.556446 against 0.554797), so a single token will not tell you which
        one you have; but you asked for 90% and got 99.7%, and over a long
        generation that is the difference between a controlled tail and an
        uncontrolled one. The practical rule: apply penalties, then temperature,
        then truncation, then draw.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        The model gives you a probability for every token in the vocabulary, at
        every position, and nothing else. Decoding is the separate policy that
        turns those rows into one sequence. Two families exist and they are not
        variations of each other: search policies (greedy, beam) pick the
        sequence with the highest score, and sampling policies (top-k, top-p,
        temperature) draw a sequence from a modified distribution.

        The distinction that matters is that a maximiser and a sampler return
        different *kinds* of object. A maximiser returns the single most probable
        sequence, which for a language model is a repeated phrase, because the
        most probable continuation of a confident model is more of itself. A
        sampler returns a sequence from the typical set, which is where all the
        probability mass actually is. Neither is wrong; they answer different
        questions, and choosing the wrong one is the most common decoding bug in
        production.
      blocks:
        - kind: checklist
          body: |
            - The model produces logits; the decoder produces tokens
            - Greedy and beam maximise a score; sampling draws from a distribution
            - Beam search is exact only at a width equal to the state count, and costs k times as much
            - The mode of a finite-order model is a cycle
            - Temperature rescales the row and cannot reorder it
            - Top-k fixes a count, top-p fixes a mass
            - Penalties are logit arithmetic, and their sign matters
            - Speculative decoding changes latency and not the distribution
      checkpoint: >-
        Before reading on: if the highest-probability sequence is a repeated
        phrase, is that a bug in the model, a bug in the search, or neither?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        There are three separate questions and each has its own instrument.
        "What does this policy optimise?" is answered by computing the score of
        the sequence it returns and comparing it to the exact best sequence - on
        a small model you can compute the exact best by dynamic programming, and
        the gap is the measurement. "How much choice does the sampler have?" is
        answered by the entropy of the row and by the mass the truncation keeps,
        not by the value of k or p. "Why is the output looping?" is answered by
        looking at the row at the position where it loops - not by changing the
        sampler and hoping.

        Choose the direction by the question: search questions get an exact
        reference computed by DP, sampler questions get entropy and retained
        mass, and quality questions get diversity statistics like distinct-2,
        because likelihood and quality are not the same axis.
      blocks:
        - kind: checklist
          body: |
            - Score a sequence by summing its log-probabilities; compare to the DP optimum
            - Compare policies by distinct-2 and by per-token log-probability, never by one alone
            - Characterise a row by its entropy, not by its maximum
            - Characterise a truncation by the mass it keeps, not the count it keeps
            - Check the sign of every logit transform on a negative logit
            - For speculative decoding, measure alpha before choosing gamma
      checkpoint: >-
        Which instrument would you reach for to explain why top-k = 40 gives
        repetitive output on one prompt and off-topic output on another, and
        which to explain why beam-8 beats greedy on a translation benchmark?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Every policy in this topic is four lines around a softmax, and the search
        policies differ only in what they keep between steps.
      blocks:
        - kind: pseudocode
          body: |
            # one sampling step, in the order that matters
            z = logits
            apply penalties to z        # divide positives, multiply negatives
            z = z / T                   # monotone: ranking unchanged
            p = softmax(z)
            if top_k: keep the k largest by p, ties by index
            if top_p: keep the smallest prefix (by p) whose cumulative mass >= p
            p = p / sum(p over kept)    # renormalise, or the CDF is wrong
            return the first kept index whose cumulative p exceeds u

            # beam search
            beams = the k best single tokens by log p
            repeat n-1 times:
                candidates = every beam extended by every token, score summed
                beams = the k best candidates        # no merging of equal states
            return the best beam

            # exact best sequence (the reference beam search is approximating)
            dp[state] = best score of any prefix ending in that state
            dp_new[next_state] = max over predecessors of dp[state] + log p
            backtrack from the best final state

            # speculative decoding, one round
            propose gamma tokens from q; score all gamma with p in one pass
            for each position: accept with probability min(1, p(x)/q(x))
            on first rejection: sample from normalise(max(0, p - q)), stop
            if none rejected: append one token sampled from p
      checkpoint: >-
        The beam-search loop and the exact DP both keep "the best k things", but
        one of them is allowed to be exact at k = V and the other is exact at
        k = V too. Why does the DP need V x V states for a trigram model while
        beam search needs only k sequences?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Three relations do all the work: the entropy slope of temperature, the
        typical-set gap that makes the mode atypical, and the geometric
        acceptance sum that caps speculative decoding.
      blocks:
        - kind: math
          body: |
            Temperature. With $\beta = 1/T$ and
            $H = \log Z - \beta\langle z\rangle$,

            $$\frac{dH}{d\beta} = -\beta\,\operatorname{Var}_p(z),
              \qquad \frac{d\beta}{dT} = -\frac{1}{T^2},
              \qquad \frac{dH}{dT} = \frac{\operatorname{Var}_p(z)}{T^3},$$

            so entropy rises monotonically, from $0$ at $T \to 0$ to $\log V$ at
            $T \to \infty$. Measured at $T = 1$ on a row of entropy 4.4833 nats:
            finite difference $10.82606$, $\operatorname{Var}/T^3 = 10.82606$.

            Typical set. A sampled sequence has
            $\mathbb{E}[-\tfrac{1}{n}\log p] = H$, and the mode has
            $-\tfrac{1}{n}\log p \le H$ because an average cannot exceed a
            maximum, so the mode is at least $H - H_{\min}$ nats per token above
            the typical set. Measured at $n = 24$: $0.8405$ against $4.4340$ per
            token, a gap of $3.5935$ per token and $86.2$ nats in total, so the
            mode is $e^{86.2}$ times more probable and has probability
            $1.73\times10^{-9}$.

            Speculative decoding. With
            $\alpha = \sum_x \min(p(x), q(x))$ the $i$-th proposal survives with
            probability $\alpha^{i}$, so

            $$\mathbb{E}[\text{tokens}] = \sum_{i=1}^{\gamma}\alpha^{i-1}
              + \alpha^{\gamma} = \frac{1-\alpha^{\gamma+1}}{1-\alpha}
              \;\to\; \frac{1}{1-\alpha}.$$

            At $\alpha = 0.5500$: $1.5500$, $2.1104$, $2.2120$ for
            $\gamma = 1, 4, 8$, against a limit of $2.2222$.
      checkpoint: >-
        The entropy slope contains no model term at all - only the variance of
        the logits under the tempered distribution. Which of the three relations
        would change if the vocabulary were ten times larger, and which would
        not?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A decoder that is correct by construction: penalties on logits, then
        temperature, then truncation, then one uniform draw against the
        renormalised CDF - plus the exact reference you need to check a search
        policy against.
      blocks:
        - kind: warning
          body: >-
            Four things break implementations and none of them raise. Dividing a
            negative logit by a penalty above one increases the repeated token's
            probability by 23% at theta = 1.2. Truncating before temperature
            keeps 523 tokens where 9 would do, so the p you set is not the mass
            you keep. Renormalising before the truncation instead of after makes
            the CDF sum to less than one, so the last candidate absorbs the
            remainder. And a speculative sampler that resamples from p instead of
            from max(0, p - q) on rejection is biased by 0.1026 in total
            variation at gamma = 1 and 0.1504 at gamma = 4 - invisible in the
            text, wrong in the distribution.
        - kind: code
          language: python
          body: |
            import math


            def decode_row(logits, temperature=1.0, top_k=0, top_p=1.0, u=0.5,
                           banned=(), theta=1.0):
                z = list(logits)
                for i in banned:                      # repetition penalty
                    z[i] = z[i] / theta if z[i] > 0 else z[i] * theta
                z = [x / temperature for x in z]
                m = max(z)
                e = [math.exp(x - m) for x in z]
                s = sum(e)
                p = [x / s for x in e]
                order = sorted(range(len(p)), key=lambda i: (-p[i], i))
                if top_k:
                    order = order[:top_k]
                if top_p < 1.0:
                    keep, c = [], 0.0
                    for i in order:
                        keep.append(i)
                        c += p[i]
                        if c >= top_p:
                            break
                    order = keep
                tot = sum(p[i] for i in order)
                run = 0.0
                for i in sorted(order):
                    run += p[i] / tot
                    if u < run:
                        return i, tot, len(order)
                return max(order), tot, len(order)


            def exact_best(start_logp, trans_logp):
                """Exact MAP by DP over the previous token; trans_logp[t][i][j]."""
                V = len(start_logp)
                dp = [(start_logp[i], (i,)) for i in range(V)]
                for M in trans_logp:
                    cand = [(sc + M[sq[-1]][j], sq + (j,))
                            for sc, sq in dp for j in range(V)]
                    cand.sort(key=lambda t: (-t[0], t[1]))
                    dp = cand[:V]
                return dp[0]
      checkpoint: >-
        `exact_best` keeps V candidates per step, which makes it exact for a
        first-order model and wrong for a second-order one. What is the smallest
        number of candidates that keeps it exact for a trigram, and why is that
        the same number that makes beam search exact?

  problems:
    - id: p-sample-token
      title: "One sampling step, with both truncation rules"
      difficulty: medium
      prompt: >-
        Implement `sample_token(logits, temperature, top_k, top_p, u)` returning
        a dict with `index` (the sampled token), `kept` (how many candidates
        survived truncation) and `prob` (the sampled token's probability after
        renormalisation). Apply the stages in this order: divide every logit by
        `temperature`; softmax; if `top_k > 0` keep the `top_k` largest
        probabilities, breaking ties by smaller index; if `top_p < 1.0` keep the
        smallest prefix of that ranking whose cumulative probability is greater
        than or equal to `top_p`, always keeping at least one token; renormalise
        over the kept set. Then walk the kept indices in ascending index order,
        accumulating renormalised probability, and return the first index whose
        cumulative sum is strictly greater than `u` (return the largest kept
        index if no sum exceeds `u`). `top_k = 0` means no top-k truncation and
        `top_p = 1.0` means no top-p truncation. Use `math.exp` and a max-shift
        so the softmax is stable.
      starter: |
        import math

        def sample_token(logits, temperature=1.0, top_k=0, top_p=1.0, u=0.5):
            # your implementation here
            pass
      language: python
      entry: sample_token
      testCases:
        - input: '{"logits": [1.0, 1.0, 1.0, 1.0], "temperature": 1.0, "top_k": 0, "top_p": 1.0, "u": 0.3}'
          expected: '{"index": 1, "kept": 4, "prob": 0.25}'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [2.0, 1.0, 0.0, -1.0], "temperature": 0.5, "top_k": 0, "top_p": 1.0, "u": 0.9}'
          expected: '{"index": 1, "kept": 4, "prob": 0.11705891323853294}'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [2.0, 1.0, 0.0, -1.0], "temperature": 1.0, "top_k": 2, "top_p": 1.0, "u": 0.6}'
          expected: '{"index": 0, "kept": 2, "prob": 0.7310585786300049}'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [2.0, 1.0, 0.0, -1.0], "temperature": 2.0, "top_k": 0, "top_p": 0.8, "u": 0.5}'
          expected: '{"index": 0, "kept": 3, "prob": 0.506480391055654}'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [3.0, 2.0, 1.0, 0.0, -1.0], "temperature": 0.7, "top_k": 3, "top_p": 0.9, "u": 0.0}'
          expected: '{"index": 0, "kept": 2, "prob": 0.8066786301976913}'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [0.0, 0.0, 0.0], "temperature": 1.0, "top_k": 0, "top_p": 0.5, "u": 0.99}'
          expected: '{"index": 1, "kept": 2, "prob": 0.5}'
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def sample_token(logits, temperature=1.0, top_k=0, top_p=1.0, u=0.5):
            z = [float(x) / temperature for x in logits]
            m = max(z)
            e = [math.exp(x - m) for x in z]
            s = sum(e)
            p = [x / s for x in e]
            order = sorted(range(len(p)), key=lambda i: (-p[i], i))
            if top_k and top_k > 0:
                order = order[:int(top_k)]
            if top_p < 1.0:
                keep, c = [], 0.0
                for i in order:
                    keep.append(i)
                    c += p[i]
                    if c >= top_p:
                        break
                order = keep
            kept = len(order)
            tot = sum(p[i] for i in order)
            run, chosen = 0.0, order[0]
            for i in sorted(order):
                run += p[i] / tot
                if u < run:
                    chosen = i
                    break
            else:
                chosen = max(order)
            return {"index": chosen, "kept": kept, "prob": p[chosen] / tot}
      solutionExplanation: >-
        The fourth case is the one that separates a correct implementation from a
        plausible one. At temperature 2.0 the logits become [1.0, 0.5, 0.0,
        -0.5], giving probabilities 0.4551, 0.2760, 0.1674, 0.1015; top-p 0.8
        accumulates to 0.4551 then 0.7311 then 0.8985, so it stops at three
        tokens and renormalises by 0.8985, which moves the top token from 0.4551
        to 0.5065. An implementation that renormalises before truncating gets
        0.4551 and no truncation at all. The fifth case shows the composition of
        the two rules: top-k 3 keeps three candidates, then top-p 0.9 cuts that
        to two, because at temperature 0.7 the top three carry 0.9870 of the
        mass and the first two already carry 0.9433. The last case is the
        degenerate one that catches an inclusive comparison: with three uniform
        tokens and top-p 0.5, the prefix stops after two tokens at 0.6667, and
        with u = 0.99 the walk returns index 1 because the cumulative after index
        0 is only 0.5. The first case is the pure-CDF check: uniform over four
        tokens, u = 0.3 lands on index 1. Note that the ordering by (-p, i) is
        load-bearing: with ties broken by index, `kept` is reproducible, and
        without it the answer for a uniform row depends on the sort's stability.
      complexity: "O(V log V) time for the sort, O(V) space"
      tags: [sampling, top-k, top-p, temperature, inverse-cdf]

    - id: p-beam-vs-greedy
      title: "Beam search, and the exact answer it is approximating"
      difficulty: medium
      prompt: >-
        Implement `beam_search(start_logp, trans_logp, beam)` for a first-order
        model. `start_logp[i]` is the log-probability of starting with token i.
        `trans_logp[t][i][j]` is the log-probability of token j at step t+1 given
        token i at step t, so the output length is `1 + len(trans_logp)`. Keep
        the `beam` best prefixes at each step, scored by the sum of their
        log-probabilities, extending every kept prefix by every token; break
        ties by the lexicographically smallest sequence. Return a dict with
        `sequence` (list of token indices) and `score` (the summed
        log-probability, a float). With `beam` greater than or equal to the
        vocabulary size the result must equal the exact best sequence.
      starter: |
        def beam_search(start_logp, trans_logp, beam=3):
            # your implementation here
            pass
      language: python
      entry: beam_search
      testCases:
        - input: '{"start_logp": [0.0, -1.0, -2.0], "trans_logp": [[[-0.1, -2.0, -3.0], [-1.0, -0.2, -2.0], [-2.0, -1.0, -0.3]]], "beam": 1}'
          expected: '{"sequence": [0, 0], "score": -0.1}'
          mode: json
          tolerance: 1e-12
        - input: '{"start_logp": [0.0, -1.0, -2.0], "trans_logp": [[[-0.1, -2.0, -3.0], [-1.0, -0.2, -2.0], [-2.0, -1.0, -0.3]]], "beam": 3}'
          expected: '{"sequence": [0, 0], "score": -0.1}'
          mode: json
          tolerance: 1e-12
        - input: '{"start_logp": [0.0, -0.3], "trans_logp": [[[-1.0, -1.0], [-0.05, -0.1]], [[-1.0, -1.0], [-0.05, -0.1]]], "beam": 1}'
          expected: '{"sequence": [0, 0, 0], "score": -2.0}'
          mode: json
          tolerance: 1e-12
        - input: '{"start_logp": [0.0, -0.3], "trans_logp": [[[-1.0, -1.0], [-0.05, -0.1]], [[-1.0, -1.0], [-0.05, -0.1]]], "beam": 2}'
          expected: '{"sequence": [1, 1, 0], "score": -0.45000000000000007}'
          mode: json
          tolerance: 1e-12
        - input: '{"start_logp": [-0.5, -0.5, -2.0], "trans_logp": [[[-0.01, -3.0, -3.0], [-0.01, -3.0, -3.0], [-3.0, -3.0, -0.01]]], "beam": 2}'
          expected: '{"sequence": [0, 0], "score": -0.51}'
          mode: json
          tolerance: 1e-12
      solution: |
        def beam_search(start_logp, trans_logp, beam=3):
            V = len(start_logp)
            seqs = [(float(start_logp[i]), (i,)) for i in range(V)]
            seqs.sort(key=lambda t: (-t[0], t[1]))
            seqs = seqs[:beam]
            for M in trans_logp:
                cand = []
                for sc, sq in seqs:
                    for j in range(V):
                        cand.append((sc + float(M[sq[-1]][j]), sq + (j,)))
                cand.sort(key=lambda t: (-t[0], t[1]))
                seqs = cand[:beam]
            sc, sq = seqs[0]
            return {"sequence": list(sq), "score": sc}
      solutionExplanation: >-
        Cases three and four are the point of the problem. Greedy takes token 0
        first, because 0.0 beats -0.3, and then every continuation from token 0
        costs -1.0, giving -2.0 for three tokens. A beam of two keeps both the
        -1.0 prefix [0, 0] and the -0.35 prefix [1, 0], and at the next step the
        branch from token 1 costs -0.05 instead of -1.0, so it overtakes: [1, 1,
        0] at -0.45 against greedy's -2.0. That is a 1.55-nat win bought by
        paying the 0.3-nat entry fee, which is exactly what a widened beam can do
        and a greedy policy cannot. Case five is the tie-breaking rule: two
        prefixes score -0.51 and both start at 0.5, so the lexicographically
        smaller sequence wins, and an implementation that sorts by score alone
        will return whichever the sort happened to leave first. Case two is the
        exactness check: with beam = 3 = V the result must match the DP optimum,
        and it does. Note that the score is a sum, so the model with the -1.0
        rows prefers two tokens to three; that is the length bias, and it is why
        production beam search divides by a length penalty before comparing
        candidates of different lengths.
      complexity: "O(n k V log(kV)) time, O(kV) space"
      tags: [beam-search, viterbi, greedy, search]

    - id: p-entropy-curve
      title: "Entropy against temperature"
      difficulty: easy
      prompt: >-
        Implement `entropy_curve(logits, temperatures)` returning a list of
        entropies in nats, one per temperature, of `softmax(logits / T)`. Use
        `math.log` and skip zero-probability terms. The answer for a list of
        equal logits must be independent of the temperature, and the answer for
        any row must approach `log(V)` as the temperature grows.
      starter: |
        import math

        def entropy_curve(logits, temperatures):
            # your implementation here
            pass
      language: python
      entry: entropy_curve
      testCases:
        - input: '{"logits": [0.0, 0.0, 0.0, 0.0], "temperatures": [0.5, 1.0, 2.0]}'
          expected: '[1.3862943611198906, 1.3862943611198906, 1.3862943611198906]'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [2.0, 1.0, 0.0, -1.0], "temperatures": [0.1, 1.0, 10.0]}'
          expected: '[0.0004994208704672029, 0.9475369639754255, 1.380070811244773]'
          mode: json
          tolerance: 1e-12
        - input: '{"logits": [0.0, 10.0], "temperatures": [0.25, 1.0, 4.0]}'
          expected: '[1.6993417021166355e-16, 0.0004993775862411646, 0.26853518434565843]'
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def entropy_curve(logits, temperatures):
            out = []
            for T in temperatures:
                z = [float(x) / T for x in logits]
                m = max(z)
                e = [math.exp(x - m) for x in z]
                s = sum(e)
                p = [x / s for x in e]
                out.append(-sum(q * math.log(q) for q in p if q > 0))
            return out
      solutionExplanation: >-
        The first case is the invariance check: a uniform row has entropy log 4 =
        1.3862943611198906 at every temperature, because dividing equal logits by
        T leaves them equal - temperature can only change the spread, and there
        is no spread to change. The second case shows the two limits: at T = 0.1
        the row is essentially a one-hot and entropy is 0.0005 nats; at T = 10 it
        is 1.3801 against log 4 = 1.3863, so it has recovered 99.6% of the way to
        uniform. The third case is the numerical trap: with logits [0.0, 10.0]
        and T = 0.25 the gap is 40 nats, so the smaller probability is
        4.2e-18 and its contribution to the entropy is 1.7e-16 - representable,
        but only because the max-shift keeps `exp(-40)` from underflowing to zero
        first. Without the shift, `exp(z)` for z = 40 is fine but the ratio is
        computed as a difference of two huge numbers; with a larger gap the
        answer silently becomes 0.0 instead of a tiny positive number, and you
        cannot tell a maximally confident row from an underflow.
      complexity: "O(len(temperatures) x len(logits))"
      tags: [temperature, entropy, softmax, numerics]


  try_it: >-
    Take one logits row from any model and compute its entropy at temperature 1.0, 1.5 and 0.7.
    On a 50,257-token row starting at 4.48 nats you should reach 8.86 at 1.5 — if your number is
    far off, you are tempering probabilities instead of logits.
  interview_questions:
    - question: 'What is wrong with greedy decoding as a way to get the most likely sequence?'
      level: mid
      key_points:
        - 'It is a fixed-point machine rather than a search: the argmax state stops moving, which is why greedy output loops on a small model.'
        - 'In a finite-order model with a unique argmax transition the greedy path is eventually periodic, so it revisits a state and repeats from there.'
        - 'The MAP sequence is not the greedy sequence, and the gap is not small: the maximiser of sequence likelihood is itself a repeated phrase in the measurement here.'
        - 'Beam search widens the search but its guarantee is only relative to k, exact only when k covers the number of distinct states.'
    - question: 'You ship temperature 0.7, top-p 0.9 and a repetition penalty of 1.2, and some prompts loop. Which knob do you touch first, and how do you know it helped?'
      level: senior
      key_points:
        - 'Top-p fixes a mass, so the nucleus size is a property of the row: 11, 523 and 16,070 tokens at p = 0.9 across three rows of the same vocabulary.'
        - 'Top-k fixes a count, so the mass it keeps varies instead: 0.8989 at k = 10 on one row.'
        - 'A repetition penalty is logit arithmetic with a sign convention: divide positive logits and multiply negative ones, and getting it backwards turns the penalty into a bonus.'
        - 'Measure entropy and n-gram repetition rate before and after the change, so the claim is about the distribution rather than about one prompt.'
      follow_up: 'Temperature and top-p commute on the set and not on the mass. What exactly does that mean for the order you apply them in?'
    - question: 'Does temperature commute with top-p? Give the number.'
      level: mid
      key_points:
        - 'Both rules keep a rank prefix, and temperature is monotone, so it cannot reorder candidates and the set survives unchanged.'
        - 'The mass does not survive: a 523-token nucleus taken at T = 1 carries 0.99704 of the mass once you sample at T = 0.7.'
        - 'So truncating before tempering and tempering before truncating give the same tokens with different probabilities.'
        - 'The practical consequence is that a pipeline tuned at one temperature changes behaviour when you move the temperature, even though the truncation setting did not move.'
  common_mistakes:
    - 'Assuming a higher temperature means better output, when it raises entropy from 4.48 to 8.86 nats at 1.5 on the way to the 10.82-nat uniform limit.'
    - 'Getting the repetition-penalty sign backwards on log-probabilities, which are all negative, so multiplying them rewards exactly the repetition you meant to suppress.'
    - 'Comparing decoding runs at different top-p without noticing the nucleus size moves by 1,460x across rows, so the comparison is measuring the data, not the setting.'
  further_reading:
    - label: "Holtzman, Buys, Du, Forbes & Choi, The Curious Case of Neural Text Degeneration (ICLR 2020)"
    - label: "Leviathan, Kalman & Matias, Fast Inference from Transformers via Speculative Decoding (ICML 2023)"
