    - language: python
      title: "A complete sampler: penalties, temperature, top-k, top-p, inverse CDF"
      note: >-
        Correct, and written to make the order of operations explicit, because
        that order is where most implementations differ. It also prints the
        retention table the topic turns on: on a 50,257-token Zipf row of entropy
        4.4833 nats, top-k = 10 keeps 60.12% of the mass while top-p = 0.9 keeps
        523 tokens, and on a row of entropy 2.0625 nats the same two settings
        keep 89.89% and 11 tokens. The one deliberate simplification is that the
        repetition penalty is applied to the raw logits before temperature, which
        is what HuggingFace does; applying it after the softmax is a different
        transformation and does not match the reference numbers here.
      code: |
        import math

        V = 50257
        LOGITS = [math.log((i + 1) ** -1.3) for i in range(V)]   # a Zipf row, logits = log p


        def softmax(z, T=1.0):
            z = [x / T for x in z]
            m = max(z)
            e = [math.exp(x - m) for x in z]
            s = sum(e)
            return [x / s for x in e]


        def entropy(p):
            return -sum(q * math.log(q) for q in p if q > 0)


        def topk(p, k):
            idx = sorted(range(len(p)), key=lambda i: (-p[i], i))[:k]
            return idx


        def topp(p, thr):
            idx, c = [], 0.0
            for i in sorted(range(len(p)), key=lambda i: (-p[i], i)):
                idx.append(i)
                c += p[i]
                if c >= thr:
                    break
            return idx


        def draw(p, idx, u):
            tot = sum(p[i] for i in idx)
            run = 0.0
            for i in sorted(idx):
                run += p[i] / tot
                if u < run:
                    return i
            return max(idx)


        p = softmax(LOGITS, 1.0)
        print(f"entropy {entropy(p):.4f} nats, ln V {math.log(V):.4f}")
        for k in (10, 50):
            idx = topk(p, k)
            print(f"  top-k {k:3d}: {len(idx):5d} tokens, mass {sum(p[i] for i in idx):.6f}")
        for thr in (0.5, 0.9, 0.95):
            idx = topp(p, thr)
            print(f"  top-p {thr:.2f}: {len(idx):5d} tokens, mass {sum(p[i] for i in idx):.6f}")
        for T in (0.5, 0.7, 1.0, 1.5):
            q = softmax(LOGITS, T)
            print(f"  T {T:4.2f}: entropy {entropy(q):7.4f}, p90 nucleus {len(topp(q, 0.9))}")

        # entropy 4.4833 nats, ln V 10.8249
        #   top-k  10:    10 tokens, mass 0.601162
        #   top-k  50:    50 tokens, mass 0.763785
        #   top-p 0.50:     5 tokens, mass 0.508685
        #   top-p 0.90:   523 tokens, mass 0.900064
        #   top-p 0.95:  2476 tokens, mass 0.950001
        #   T 0.50: entropy  0.9329, p90 nucleus 3
        #   T 0.70: entropy  1.9243, p90 nucleus 9
        #   T 1.00: entropy  4.4833, p90 nucleus 523
        #   T 1.50: entropy  8.8591, p90 nucleus 27294

    - language: python
      title: "Speculative sampling: the residual correction, and the version without it"
      note: >-
        The `naive` branch is numerically WRONG: it accepts with the same
        probability but, on rejection, resamples from the target distribution
        `p` instead of from the residual `max(0, p - q)`. That is a bias, not an
        approximation - the accepted tokens are then a mixture that over-weights
        the region where the draft is too confident, and the output distribution
        is no longer `p`. Measured against the target over 200,000 tokens on an
        8-outcome pair with alpha = 0.5500, total variation is 0.0029 for the
        exact scheme (the sampling-noise floor) and 0.1026 for the naive one at
        gamma = 1, rising to 0.1504 at gamma = 4 - the bias compounds with the
        number of proposals, because every rejected round is a chance to inject
        one. Token 0 lands at 0.2656 against a target of 0.4000, a 34% deficit on
        the most likely token, and no amount of reading fluent output would
        reveal it. Both branches share the acceptance probability and the draft,
        so the only difference is the four lines inside the else.
      code: |
        import random
        import numpy as np

        P = np.array([0.40, 0.25, 0.15, 0.08, 0.05, 0.03, 0.02, 0.02])
        Q = np.array([0.08, 0.12, 0.22, 0.20, 0.16, 0.10, 0.07, 0.05])


        def exact(p, q, gamma, rng):
            """Correct: on rejection, sample the residual max(0, p - q)."""
            out = []
            for _ in range(gamma):
                x = rng.choice(len(q), p=q)
                if rng.random() < min(1.0, p[x] / q[x]):
                    out.append(x)
                else:
                    r = np.maximum(p - q, 0.0)
                    out.append(int(rng.choice(len(p), p=r / r.sum())))
                    return out
            out.append(int(rng.choice(len(p), p=p)))     # bonus token
            return out


        def naive(p, q, gamma, rng):
            """WRONG: resamples from p instead of from the residual."""
            out = []
            for _ in range(gamma):
                x = rng.choice(len(q), p=q)
                if rng.random() < min(1.0, p[x] / q[x]):
                    out.append(x)
                else:
                    out.append(int(rng.choice(len(p), p=p)))   # <- the bug
                    return out
            out.append(int(rng.choice(len(p), p=p)))
            return out


        def tv(fn, p, q, gamma, n=200000, seed=0):
            rng = np.random.default_rng(seed)
            c = np.zeros(len(p))
            got = 0
            while got < n:
                for x in fn(p, q, gamma, rng):
                    c[x] += 1
                    got += 1
            return 0.5 * np.abs(c / got - p).sum(), got


        alpha = float(np.minimum(P, Q).sum())
        print(f"alpha = {alpha:.4f}, TV(p,q) = {1 - alpha:.4f}, limit 1/(1-alpha) = {1/(1-alpha):.4f}")
        for g in (1, 2, 4, 8):
            print(f"  gamma {g}: formula {(1 - alpha**(g+1)) / (1 - alpha):.4f} tokens per pass")
        for g in (1, 4):
            a, _ = tv(exact, P, Q, g)
            b, n = tv(naive, P, Q, g)
            print(f"  gamma {g}: TV(exact) {a:.4f}   TV(naive) {b:.4f}   n = {n}")

        # alpha = 0.5500, TV(p,q) = 0.4500, limit 1/(1-alpha) = 2.2222
        #   gamma 1: formula 1.5500 tokens per pass
        #   gamma 2: formula 1.8525
        #   gamma 4: formula 2.1104
        #   gamma 8: formula 2.2120
        #   gamma 1: TV(exact) 0.0029   TV(naive) 0.1026
        #   gamma 4: TV(exact) 0.0011   TV(naive) 0.1504
        #   naive empirical:  [0.2656 0.2341 0.2142 0.1137 0.0719 0.0429 0.0288 0.0289]
        #   target:           [0.40   0.25   0.15   0.08   0.05   0.03   0.02   0.02]

