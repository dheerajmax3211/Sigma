id: decoding-strategies
slug: decoding-strategies
title: "Decoding: Greedy, Beam, Top-k, Top-p, and Temperature"
summary: >-
  Turn a logits row into a sequence: what greedy and beam search actually
  optimise, why the maximiser of sequence likelihood is a repeated phrase with
  probability 1.7e-9, how temperature moves entropy by a measurable amount, why
  top-k keeps a count and top-p keeps a mass, and how speculative decoding buys
  latency without changing the distribution.
kind: lesson
difficulty: hard
position: 7
estMinutes: 33
prerequisites: [transformer-block, tokenisation]
phase: decoding
tags:
  - decoding
  - greedy
  - beam-search
  - temperature
  - top-k
  - top-p
  - nucleus-sampling
  - entropy
  - repetition-penalty
  - speculative-decoding
  - typical-set
  - sampling

body:
  big_idea: >-
    A language model outputs one probability row per position; decoding is a
    separate policy choosing which sequence to take from it, so each knob
    answers "which sequence do you want", not "which model".

  problem:
    - >-
      You ship temperature 0.7, top-p 0.9 and penalty 1.2 because the README
      said so, and cannot explain why a prompt answers differently twice.
    - >-
      You propose beam search to make summaries faithful, when the
      highest-probability continuation is a repeated phrase at 1.7e-9 that no
      sampler would ever draw.
    - >-
      A user says raising the repetition penalty made repetition worse, and
      they are right: your stack divides negative logits, multiplying that
      token's probability.

  analogy: |
    A hill walker choosing a route with a popularity score on every path.
    Greedy takes the most popular next path at each junction; beam search
    carries k itineraries and keeps the k with the highest total; sampling
    rolls a die weighted by popularity. But a walker has a destination. A
    language model does not, so the most popular *total* is achieved by
    walking in a circle.

  concept_points:
    - >-
      **Greedy decoding is a fixed-point machine, not a cheap approximation to the best sequence.**
      On a word-level trigram over 93,140 words, greedy over 24 tokens returns
      "the is the same the same the same …" at a total log-probability of
      **-59.8239**, while the exact best sequence scores **-20.1726**. The gap
      is 39.65 nats, or 1.65 nats per token — a factor of $e^{1.65} = 5.2$ in
      probability, on every token.
    - >-
      **Beam search is Viterbi with a width limit, so its guarantee is only relative to $k$.**
      Each step keeps the $k$ best prefixes and extends each by every token:
      $O(kVn)$ instead of $V^n$. At $n = 24$ the gap to the exact MAP is
      **39.65** nats at $k=1$, **31.84** at 2, **26.28** at 4 and **0.00** at
      8 — it found a fixed point any wide enough beam cannot miss.
    - >-
      **The maximiser of sequence likelihood is a cycle, and a cycle is not a sample.**
      The exact 24-token MAP is "at" repeated 24 times, with
      $p(\text{at}\mid\text{at},\text{at}) = 0.4842$ and distinct-2 **0.0435**,
      against **0.9967** for samples. The MAP scores -0.8405 per token against
      -4.4340 for the average of 3,000 samples — 86.2 nats over 24 tokens, so
      the mode is $3.7\times10^{37}$ times more probable than a typical
      sample.
    - >-
      **Temperature is a monotone reparametrisation whose entropy slope is $\operatorname{Var}(z)/T^3$.**
      Measured on a 50,257-token row: entropy is 0.9329 nats at $T=0.5$,
      **4.4833** at 1.0, **8.8591** at 1.5 and 10.8148 at 10.0, against
      $\ln 50{,}257 = 10.8249$. Temperature adds no information — it rescales
      the whole row, flattening the head and the tail together, so a confident
      answer becomes a coin flip between 500 tokens.
    - >-
      **Top-k fixes a count, so the mass it keeps is a property of the data; top-p fixes a mass, so the count is.**
      At $k=10$ over three rows of one vocabulary the mass retained is
      **0.8989**, **0.6012** and **0.2569** — greedy on the peaked row, barely
      a truncation on the flat one. At $p=0.9$ the same three rows keep **11**,
      **523** and **16,070** tokens: a **1,460x** swing for one setting.
    - >-
      **Speculative decoding leaves the distribution exactly unchanged, provided the rejection step samples the residual.**
      A draft proposes $\gamma$ tokens, the target scores them in one pass,
      and each survives with probability $\min(1, p/q)$; on rejection you
      sample from the normalised $\max(0, p-q)$. Measured at $\alpha = 0.5500$:
      **2.1104** tokens per target evaluation at $\gamma=4$; total variation
      from the target is **0.0029** for the exact scheme and **0.1026** for
      naive resampling.

  definitions:
    - term: "Logit row"
      meaning: >-
        The V numbers a transformer emits at one position, before the softmax.
        Only differences matter for the softmax: adding a constant to every logit
        leaves the distribution unchanged, which is why logits and
        log-probabilities are interchangeable inputs to temperature and to
        truncation. The penalties are the exception - they branch on the sign of
        the logit, so they are not shift-invariant, and a row of log-probabilities
        behaves differently from the same row shifted to zero.
    - term: "Greedy decoding"
      meaning: >-
        Take the argmax of the row at every step. Deterministic, O(V) per token,
        and the T -> 0 limit of sampling. Its failure is structural rather than
        statistical: it can only ever follow one path, so a locally best token
        that leads into a loop is never reconsidered.
    - term: "Beam search"
      meaning: >-
        Keep the k highest-scoring partial sequences at every step, scored by the
        sum of their log-probabilities, and extend each by every vocabulary
        entry. It is Viterbi with the state space truncated to k paths: exact
        only at a width equal to the state count (V for a first-order model,
        V^2 for a trigram), and O(k V n) rather than O(V^n).
    - term: "Beam width"
      meaning: >-
        The k of beam search. It buys probability, not diversity: all k beams are
        candidates for one output, and the returned sequence is one of them. A
        width of 1 is greedy; exactness needs a width equal to the number of
        distinct states - V for a first-order model, V^2 for a trigram.
    - term: "Length normalisation"
      meaning: >-
        Dividing the beam score by a function of length - n, or ((5+n)/6)^alpha
        as in GNMT - so that sequences of different lengths are comparable. It
        fixes the raw-sum bias toward short outputs and introduces a preference
        for whatever length the penalty favours, which is a modelling choice, not
        a correction.
    - term: "Temperature"
      meaning: >-
        A scalar T that divides the logits before the softmax. T < 1 sharpens,
        T > 1 flattens, and the ranking of tokens never changes, so temperature
        can only reweight candidates - it can never make an impossible token
        possible. Entropy rises monotonically with T, with slope Var(z)/T^3.
    - term: "Top-k sampling"
      meaning: >-
        Truncate to the k highest-probability tokens, renormalise, sample. Keeps
        a fixed number of candidates and therefore a data-dependent fraction of
        the probability mass.
    - term: "Nucleus (top-p) sampling"
      meaning: >-
        Truncate to the smallest set of highest-probability tokens whose
        cumulative mass reaches p, renormalise, sample. Keeps a fixed mass and
        therefore a data-dependent number of candidates - 11 to 16,070 across
        three rows of the same vocabulary at p = 0.9.
    - term: "Min-p sampling"
      meaning: >-
        Truncate to tokens whose probability is at least a fraction of the
        maximum probability. It is a relative threshold, so it keeps more
        candidates when the row is flat and fewer when it is peaked, without
        needing the cumulative sum; it is the newest of the three rules and
        behaves like a temperature-aware top-p.
    - term: "Typical set"
      meaning: >-
        The sequences whose per-token log-probability is near the entropy H: the
        ones a sampler actually produces. Its existence is why the mode is a bad
        answer - the mode has log-probability at least H per token above the
        typical set, so it is exponentially unlikely to be drawn.
    - term: "Repetition penalty"
      meaning: >-
        A logit transformation applied to tokens already in the context: divide
        positive logits by theta, multiply negative ones by theta. The asymmetry
        exists because logits can have either sign; applying it symmetrically
        with a negative logit rewards repetition.
    - term: "Frequency penalty"
      meaning: >-
        Subtracting lambda times the token's count in the context from its logit,
        so the penalty grows with each use instead of saturating after the first.
        Measured: p falls from 0.199290 to 0.083882 after one occurrence and to
        0.012240 after three, at lambda = 1.
    - term: "Speculative decoding"
      meaning: >-
        Draft gamma tokens with a cheap model, score all gamma in one pass of the
        target, accept each with probability min(1, p/q) and on rejection sample
        from max(0, p - q). The output distribution is identical to sampling the
        target; the saving is that one target pass can yield several tokens.
    - term: "Acceptance rate"
      meaning: >-
        alpha = sum_i min(p_i, q_i) = 1 - TV(p, q), the probability that a single
        draft token survives verification. It caps the speedup at 1/(1-alpha)
        tokens per target pass, so alpha is the only number that matters when
        choosing a draft model.

  diagrams:
    - type: pipeline
      title: "One decode step: five stages, and only the last one is random"
      nodes:
        - label: "Logits, one row of V numbers"
          note: "V = 50,257 for a typical vocabulary"
          detail: "Produced by the final unembedding from the residual stream at this position. Everything in this diagram is O(V) work on a row that the model has already computed: the decoder is cheap, and the consequences are not."
        - label: "Penalties: adjust logits"
          note: "repetition and frequency"
          detail: "Applied to the raw logits before any other stage. Divide positive logits and multiply negative ones by theta, or subtract lambda times the count. The multiplicative form commutes with temperature and the additive form does not - subtracting lambda after dividing by T is a different row - so pick an order and keep it identical at training and serving time."
        - label: "Temperature: divide by T"
          note: "ranking unchanged, spread changed"
          detail: "T below 1 sharpens the row, above 1 flattens it. Because dividing by a positive scalar is monotone, temperature can never change which token is most likely - only how much of the mass it holds."
        - label: "Truncate: top-k or top-p"
          note: "a count or a mass, never both"
          detail: "Top-k keeps k candidates and whatever mass they carry; top-p keeps whatever count reaches the mass. Both keep a rank prefix, which is why they commute with temperature on the set of survivors and not on the threshold."
        - label: "Renormalise and draw"
          note: "inverse CDF on one uniform"
          detail: "Divide by the kept mass so the candidates sum to one, then walk the cumulative distribution with a single uniform draw u. This is the only place randomness enters, and it is why the same prompt gives different answers."
        - label: "Append and feed back"
          note: "n forward passes for n tokens"
          detail: "The token becomes part of the context for the next step, which is the only feedback in the system and the reason a decoding loop costs one forward pass per token without a cache."
      caption: "The arguments are about stages two to four. All three preserve the ranking of tokens, so none of them can invent a candidate the model did not already prefer: stage five only decides how much of the tail you are willing to draw from."

    - type: plot
      title: "Entropy against temperature for three rows of the same 50,257-token vocabulary"
      chart: line
      xLabel: "temperature T"
      yLabel: "entropy of the tempered row, nats"
      series:
