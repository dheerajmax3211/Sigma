          expected: "[[-0.7806184519535058, 1.7247119584537713, 4.468309161838006, 1.9185241357024432], [3.463069293255238, 2.874662399675571, -0.4741750521781986, 0.3942949863848702]]"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def preln_block(X, P, n_heads):
            X = np.asarray(X, dtype=np.float64)
            g = {k: np.asarray(v, dtype=np.float64) for k, v in P.items()}
            n, d = X.shape
            h = int(n_heads)
            dh = d // h
            eps = 1e-5

            def ln(x, gamma, beta):
                mu = x.mean(axis=-1, keepdims=True)
                var = x.var(axis=-1, keepdims=True)
                return gamma * (x - mu) / np.sqrt(var + eps) + beta

            def split(A):
                return A.reshape(n, h, dh).transpose(1, 0, 2)

            def merge(A):
                return A.transpose(1, 0, 2).reshape(n, h * dh)

            a = ln(X, g["g1"], g["b1"])
            Q, K, V = (split(a @ g[w].T) for w in ("Wq", "Wk", "Wv"))
            S = Q @ np.transpose(K, (0, 2, 1)) / np.sqrt(dh)
            S = S - S.max(axis=-1, keepdims=True)
            E = np.exp(S)
            A = E / E.sum(axis=-1, keepdims=True)
            x1 = X + merge(A @ V) @ g["Wo"].T
            m = ln(x1, g["g2"], g["b2"])
            Z = m @ g["W1"].T
            H = 0.5 * Z * (1.0 + np.tanh(np.sqrt(2.0 / np.pi) * (Z + 0.044715 * Z ** 3)))
            return (x1 + H @ g["W2"].T).tolist()
      solutionExplanation: >-
        Every failure mode of this problem is a placement, not a formula. The
        first case has a single token, so every softmax row is exactly 1 and the
        attention sublayer reduces to $W_V^\top W_O^\top = I$ applied to the
        *normalised* input: the block returns $x + \operatorname{LN}(x)$ plus
        the MLP term. If your answer differs there, the bug is in the residual
        placement — you replaced $x$ instead of adding to it, or you normalised
        the stream rather than a copy of it. The second case is
        where head splitting shows up: `Wk` reverses the features, so head 0
        (features 0-1) and head 1 (features 2-3) compute different score
        matrices, and a split by stride instead of by contiguous block gives a
        different answer with identical shapes. The third case puts non-unit
        `g1` and non-zero `b1` in, which is the only case that distinguishes
        normalising before the sublayer from normalising after the add: post-LN
        differs from pre-LN by 57% in relative Frobenius norm on the same
        weights. The GELU must be the tanh approximation as written — the exact
        erf form is a different function at the 1e-3 level, which is far outside
        the tolerance.
      complexity: "O(n^2 d + n d d_ff) time, O(n^2 h) space for the score matrices"
      tags: [transformer-block, pre-norm, residual, gelu, forward-pass]

  visualizers:
    - id: vs-block-cost
      kind: computation_graph
      title: "One block: parameters, FLOPs, and bytes in the same picture"
      description: >-
        Move the width, the expansion factor, and the context length and watch
        three numbers move at different rates: parameters as 12 d^2, per-token
        multiply-adds as 12 d^2 + 2 n d, and bytes per decode step as
        2 L (12 d^2) + 2 L n_kv d_head n. At 768 wide the attention term
        overtakes the weight term at 4,608 tokens; at 4096 wide, at 19,200.
      params:
        d_model: 768
        n_heads: 12
        expansion: 4
        n_layers: 12
        contexts: [1024, 4608, 8192, 32768, 131072]
    - id: vs-residual-stream
      kind: tensor
      title: "The stream grows: twelve blocks of additive writes"
      description: >-
        Each block writes a fraction of the stream's norm back into it, and the
        writes are nearly orthogonal, so the norm grows by 1.105x per block at
        initialisation — 3.30x over twelve blocks. Remove the writes and the
        composed Jacobian's smallest singular value falls from 3.8e-2 to 7.4e-13.
      params:
        d_model: 768
        n_blocks: 12
        write_ratio: 0.55
        show_jacobian: true


  try_it: >-
    Count the parameters of one 768-wide block by hand — four attention projections at $4d^2$,
    two MLP matrices at $4d^2$ each, plus biases — and check the total against 7,080,960. Then
    set $d = 4096$ and confirm the block is 201,342,976, 28.4x the 768-wide one.
  interview_questions:
    - question: 'Where do a block parameters go, and why is the MLP two thirds of them?'
      level: mid
      key_points:
        - 'Attention is 4d^2 = 2,359,296 and the MLP 8d^2 = 4,718,592 at d = 768, a ratio of exactly 2.0.'
        - 'That makes the MLP 66.64% of block parameters, and nothing forces d_ff = 4d.'
        - 'What the 4 buys is a fixed 2:1 split between per-token nonlinear capacity and per-token mixing.'
        - 'The split is why MoE can sparsify the FFN alone and still touch two thirds of the parameters.'
    - question: 'Prefill is compute-bound and decode is bandwidth-bound on the same block. Give both numbers and say what each optimisation buys.'
      level: senior
      key_points:
        - 'Prefilling 1,024 tokens costs 212.6 GFLOP at about 1,206 FLOP/byte, which is 0.72 ms at 30% MFU on an H100.'
        - 'Decoding one token at 1,024 context costs 0.208 GFLOP but moves 284.9 MB, three orders of magnitude lower intensity.'
        - 'So prefill optimises FLOPs: fusion, larger tiles, tensor-core utilisation.'
        - 'Decode optimises bytes: quantised weights, a smaller KV cache, and batching to amortise the weight read.'
      follow_up: 'At what batch size does decode stop being bandwidth-bound for this block, and does that number depend on context length?'
    - question: 'Why does the residual stream grow, and what does that force you to add?'
      level: mid
      key_points:
        - 'The stream is never normalised: each sublayer writes additively into it and the writes are nearly orthogonal, with a measured cosine of 0.014.'
        - 'Each write is a fraction of the stream norm, 0.20 for attention and 0.54 for the MLP at d = 768 at initialisation.'
        - 'The measured growth is 3.30x across twelve blocks, so the norm depends on depth.'
        - 'That is why a final LayerNorm is mandatory before the unembedding: otherwise the logits inherit a depth-dependent scale.'
  common_mistakes:
    - 'Skipping the final LayerNorm because pre-norm keeps each block stable, then feeding a stream grown 3.3x to the unembedding.'
    - 'Following the original paper post-norm diagram, which puts a normalisation on the identity path and forces warmup and clipping at twelve layers.'
    - 'Sizing decode by parameter count, when the LM head alone is 77.2 MB of the 284.9 MB moved per token at 1,024 context.'
