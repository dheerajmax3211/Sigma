id: transformer-block
slug: transformer-block
title: "The Full Transformer Block"
summary: >-
  Assemble attention, normalisation, and position into the object a language
  model actually repeats, then price it: 7,080,960 parameters and 12d^2 + 2nd
  multiply-adds per token, an MLP that is two thirds of the block, a residual
  stream that grows 3.3x across twelve layers, and a KV cache that turns decode
  into a bandwidth problem instead of an arithmetic one.
kind: lesson
difficulty: hard
position: 5
estMinutes: 24
prerequisites: [multi-head-attention, normalisation-layers, positional-encoding]
phase: attention-core
tags: [transformer-block, residual-stream, pre-norm, swiglu, mlp, flops, parameter-count, kv-cache, prefill, decoding, scaling]

body:
  big_idea: >-
    A transformer block is two pre-normalised sublayers writing additively
    into one unnormalised residual stream, and every cost — parameters, FLOPs
    per token, bytes per decode step — follows from that wiring plus the
    width.

  problem:
    - >-
      Every shape fits, the loss falls, and the logits are wrong by three
      because the final norm is missing and the stream grew 3.0x.
    - >-
      Somebody asks how many parameters one layer has and you answer
      "attention" — it is 33% of the block, and the MLP is 67%.
    - >-
      Prefill does 1,024 tokens in 0.7 ms and decode does them in 87 ms, and
      nothing in the FLOP count explains a 121x gap.

  analogy: |
    A factory line with one conveyor belt. Every station reads the belt,
    computes a correction, and adds it back; no station replaces what is on
    it. The attention station moves material between positions, the MLP works
    on each item where it sits, and the belt accumulates every correction.
    After twelve stations the load is 3.3x what it was at the door, so there
    is a final inspection.

  concept_points:
    - >-
      **The block is two sublayers joined by two additions, and the additions carry no parameters.**
      At $d_{\text{model}} = 768$, 12 heads, $d_{ff} = 3072$: attention
      **2,359,296**, MLP **4,718,592**, two LayerNorms **3,072**, block
      **7,080,960**. Twelve blocks are 84,971,520; with a
      $50{,}257 \times 768$ embedding the model is **123,568,896** — GPT-2
      small's 124M to within 0.4%. Attention is a third of it; the two adds
      have no weights at all.
    - >-
      **The MLP is exactly twice the attention, and that ratio is the only real argument for the 4x expansion.**
      $4d^2$ against $8d^2$ is exactly **2.0**, making the MLP **66.64%** of
      block parameters. SwiGLU's gate adds a third matrix, so at $d_{ff} = 4d$
      the MLP costs $12d^2$ — **50% over** (7,077,888 against 4,718,592).
      LLaMA sets $d_{ff} = \tfrac{8}{3}d$: at $d = 4096$, 11,008, which is
      **0.78% over** the $8d^2$ budget.
    - >-
      **Per token a block costs $12d^2 + 2nd$ multiply-adds, and the crossover is exactly $n = 6d$.**
      Four projections at $4d^2$ plus the MLP at $8d^2$ give **7,077,888**
      MACs; the attention matmuls add $2nd$. Equal at $n = 6d = 4{,}608$, so
      at 8,192 the attention term is **1.78x** the weight term and at 131,072
      it is **28.4x**.
    - >-
      **The residual stream is never normalised, so its norm grows — 3.30x across twelve blocks.**
      Each sublayer writes a fraction of the stream's norm (0.20 attention,
      0.54 MLP at $d=768$) and the writes are nearly orthogonal (cosine
      **0.014**), so norms add in quadrature: 222.0 to 732.8. Deleting the
      final norm multiplies the logit scale by 2.999 and moves max softmax
      from **0.3214 to 0.7809**.
    - >-
      **The additive path is a Jacobian of $I + J_f$, which is why very deep stacks train at all.**
      Measured over twelve random blocks, the smallest singular value of the
      composed Jacobian is **3.84e-2** with the additions and **7.36e-13**
      without; condition numbers **232** and **2.3e12**. One block's Jacobian
      has $\sigma_{\max} = 1.89$, $\sigma_{\min} = 0.22$, while its sublayer
      alone has $\sigma_{\min} = 4.2e-3$.
    - >-
      **Prefill is compute-bound and decode is bandwidth-bound, and both are the same block.**
      Prefilling 1,024 tokens costs 212.6 GFLOP at 1,206 FLOP/byte: 0.72 ms at
      30% MFU. Decoding one token at 1,024 context costs 0.208 GFLOP but moves
      **284.9 MB** — **0.73 FLOP/byte**, 85 microseconds at 3.35 TB/s. The
      same 1,024 tokens take 0.72 ms in prefill and 87 ms decoded: **121x**.

  definitions:
    - term: "Transformer block"
      meaning: >-
        The repeated unit of a language model: a multi-head attention sublayer
        and a position-wise MLP, each preceded by a LayerNorm and followed by an
        additive residual write. It preserves shape, so the same block can be
        stacked L times; at 768 wide and 4x expansion it is 7,080,960
        parameters.
    - term: "Residual stream"
      meaning: >-
        The width-$d_{\text{model}}$ vector that flows through the whole stack
        and is only ever added to. It is the block's communication bus: every
        sublayer reads a normalised copy of it and writes an update back. Its
        norm grows with depth (3.30x over twelve blocks at init).
    - term: "Sublayer"
      meaning: >-
        One of the block's two functions — attention or the MLP — together with
        the norm that precedes it and the addition that follows it. A sublayer
        is where parameters live; the additions are where information persists.
    - term: "Pre-norm (pre-LN)"
      meaning: >-
        Normalising the *input* to a sublayer and adding the unnormalised
        output back: $x + f(\operatorname{LN}(x))$. The identity path carries no
        normalisation, which keeps gradients well conditioned; it requires one
        final norm before the unembedding because the stream is unnormalised.
    - term: "Post-norm (post-LN)"
      meaning: >-
        The original paper's arrangement: $x \leftarrow
        \operatorname{LN}(x + f(x))$. The norm sits on the residual path, so
        every block rescales the identity. It trains, but it needs learning-rate
        warmup at depth, and its output RMS is pinned to 1 by construction,
        which measured a three times smaller logit spread than pre-LN on the
        same weights.
    - term: "Final norm (ln_f)"
      meaning: >-
        The single LayerNorm applied after the last block, before the
        unembedding. It exists only because pre-LN never normalised the stream.
        Delete it and the logit scale becomes the stream RMS — 2.999 in the
        measured case — which sharpens the softmax by 2.4x, moving mean max
        probability from 0.3214 to 0.7809.
    - term: "Expansion factor"
      meaning: >-
        $d_{ff}/d_{\text{model}}$, the MLP's hidden width relative to the
        stream. Four is a convention that makes the MLP exactly twice the
        attention's parameter count; SwiGLU models use 8/3 to restore the same
        budget after paying for the gate.
    - term: "SwiGLU"
      meaning: >-
        A gated MLP: $\operatorname{Swish}(xW_1^\top) \odot (xW_3^\top)$
        projected back by $W_2$. Three matrices instead of two, so the same
        parameter budget forces $d_{ff} = \tfrac{8}{3}d$ — 11,008 at
        $d = 4096$, which is 0.78% over the 8d^2 budget.
    - term: "Block parameter count"
      meaning: >-
        $12d^2 + 4d$ for a bias-free pre-LN block at 4x expansion: $4d^2$
        attention, $8d^2$ MLP, $4d$ for two LayerNorms. It is independent of
        head count and of context length, which is why it is the unit scaling
        laws are written in.
    - term: "Prefill"
      meaning: >-
        Processing the prompt: all $n$ tokens at once, one pass, high arithmetic
        intensity (~1,206 FLOP/byte at $n = 1024$), compute-bound. It fills the
        KV cache and produces the first logits.
    - term: "Decode"
      meaning: >-
        Generating one token at a time, each step re-reading every weight and
        the whole cache. Arithmetic intensity collapses to 0.73 FLOP/byte at
        1,024 context, so the step time is bytes divided by bandwidth, not FLOPs
        divided by throughput.
    - term: "Arithmetic intensity"
      meaning: >-
        FLOPs performed per byte moved from memory. Compared against the
        hardware's ridge point (295 FLOP/byte for an H100 at fp16), it says
        whether a kernel is limited by the tensor cores or by HBM. One block
        sits on both sides of that line depending on whether it is prefilling or
        decoding.

  diagrams:
    - type: architecture
      title: "The block: two normalised sublayers writing into one unnormalised stream"
      nodes:
        - { id: x, x: 0, y: 1, label: "x  (n, 768)", kind: client, detail: "The residual stream. Never normalised in place, never replaced — only added to. Everything downstream is this vector plus a sum of updates." }
        - { id: ln1, x: 1, y: 0, label: "LayerNorm 1", kind: worker, detail: "1,536 parameters (gamma and beta over 768 features). Reads a copy of x; the stream itself is untouched, which is what keeps the identity path clean." }
        - { id: attn, x: 2, y: 0, label: "Multi-head attention", kind: model, detail: "2,359,296 parameters: W_Q, W_K, W_V, W_O at 768 x 768, or 589,824 each. The only operation in the block that moves information between positions." }
        - { id: add1, x: 3, y: 0, label: "x = x + attn", kind: server, detail: "Elementwise addition, zero parameters. This one line is why the block Jacobian is I + J_f and why the smallest singular value stays at 3.8e-2 instead of 7.4e-13." }
        - { id: ln2, x: 1, y: 2, label: "LayerNorm 2", kind: worker, detail: "The second 1,536-parameter norm, reading the post-attention stream — which is already larger than the input was." }
        - { id: mlp, x: 2, y: 2, label: "MLP  768 -> 3072 -> 768", kind: gpu, detail: "4,718,592 parameters, two thirds of the block. Applied to each token independently: no position can influence another here." }
        - { id: add2, x: 3, y: 2, label: "x = x + mlp", kind: server, detail: "Second residual write. After twelve blocks the stream norm is 3.30x its input norm, which is what the final norm exists to absorb." }
        - { id: out, x: 3, y: 3, label: "next block  (n, 768)", kind: external, detail: "Same shape it started as. Shape preservation is what makes the block stackable and what makes depth a free variable." }
      edges:
        - { from: x, to: ln1, label: "normalised copy" }
        - { from: ln1, to: attn, label: "read" }
        - { from: attn, to: add1, label: "update" }
        - { from: x, to: add1, label: "identity, 0 params" }
        - { from: add1, to: ln2, label: "stream" }
        - { from: ln2, to: mlp, label: "read" }
        - { from: mlp, to: add2, label: "update" }
        - { from: add1, to: add2, label: "identity" }
        - { from: add2, to: out, label: "repeat x L" }
      caption: "Read the two horizontal arrows on the right: they are the only paths that survive depth. Every parameter in the diagram is inside a box the identity path bypasses."

    - type: pipeline
      title: "One forward pass, with the shape and the cost at each step"
      nodes:
        - label: "x  (n, 768)"
          note: "the stream"
          detail: "Frobenius norm 222.0 for a 64-token batch at initialisation, growing 1.105x per block."
        - label: "LN1: (n, 768)"
          note: "1,536 params, per-token statistics"
          detail: "Mean and variance over the 768 features of each row, then a learned affine. eps = 1e-5. This is the normalisation-layer topic applied to the block's input."
        - label: "Q, K, V, attn  (n, 768)"
          note: "2,359,296 MACs per token"
          detail: "Four 768 x 768 matmuls: three projections and W_O. The score and value products add 2nd more, which is 1,536n — the only term that grows with context."
        - label: "x1 = x + attn"
          note: "0 params"
          detail: "The update is 0.20 of the stream norm at init and nearly orthogonal to it, so the stream grows by addition in quadrature."
        - label: "LN2: (n, 768)"
          note: "1,536 params"
          detail: "Reads the post-attention stream. Its input is already bigger than block input, which is why the stream cannot be left unnormalised at the end."
        - label: "MLP: (n, 3072) -> (n, 768)"
          note: "4,718,592 MACs per token"
          detail: "Up-projection to 4d, GELU, down-projection. Two thirds of the block's parameters, none of its cross-token mixing."
        - label: "y = x1 + mlp  (n, 768)"
          note: "0 params; hand to block l+1"
          detail: "After twelve of these, one final LayerNorm and the unembedding turn the stream into logits."
      caption: "Two of the seven stages cost anything, and their costs differ by exactly 2:1 — which is the whole parameter story of the block."

    - type: compare
      title: "The same block in two regimes: prefill and decode (768 wide, 12 layers, 1,024-token context)"
      left_label: "Prefill: all n tokens at once"
      left_points:
        - "1,024 tokens: 212.6 GFLOP in a single pass"
        - "About 1,206 FLOP per byte moved — 4x above the 295 ridge point"
        - "0.215 ms at 989 TFLOP/s peak; 0.72 ms at 30% MFU"
        - "Tensor cores busy; every kernel is a matmul over the whole sequence"
        - "Cost per prompt token falls as the prompt grows, because the weights are read once"
      right_label: "Decode: one token at a time"
      right_points:
        - "1 token: 0.208 GFLOP and 284.9 MB moved"
        - "0.73 FLOP per byte — 400x below the ridge point"
        - "85.0 microseconds per step at 3.35 TB/s; ceiling 11,759 tokens/s at batch 1"
        - "Tensor cores idle; the kernel is a memory copy of weights plus cache"
        - "1,024 tokens decoded: 87 ms against 0.72 ms prefilled — 121x"

    - type: plot
      title: "Multiply-adds per token in one block: a constant, plus a term that grows with context"
      chart: line
      xLabel: "context length (tokens)"
      yLabel: "MACs per token (millions)"
