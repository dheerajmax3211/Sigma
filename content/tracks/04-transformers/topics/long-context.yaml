id: long-context
slug: long-context
title: "Long Context: Sliding Window, RoPE Scaling, and YaRN"
summary: >-
  A context window is a frequency budget, not a number you configure: at 128
  dimensions and base 10,000 only 14 of RoPE's 64 bands can still resolve an
  offset of 4,096 tokens and none can resolve 32,768, which is why the attention
  score stops being a function of distance past the trained length. This topic
  measures that collapse, prices the four ways out — sliding windows, position
  interpolation, NTK-aware base scaling and YaRN — and separates extending a
  window from actually using it.
kind: lesson
difficulty: expert
position: 14
estMinutes: 29
prerequisites: [positional-encoding, kv-cache]
phase: attention-core
tags:
  [long-context, rope-scaling, position-interpolation, ntk-aware, yarn, yarn,
   sliding-window, effective-context, lost-in-the-middle, extrapolation,
   frequency-bands, transformers]

body:
  big_idea: >-
    Long context is two problems: past the training length the positional code
    runs out of bands, and even with the window back, a softmax over 128k keys
    has no reason to read the middle.

  problem:
    - >-
      You set the scaling factor to 32 and the model gets worse: fluent, on
      topic, and wrong on every answer in the middle.
    - >-
      128k of KV cache on a 7B with 32 KV heads is 64 GiB: one user per 80 GiB
      card, at batch 1.
    - >-
      Your needle-in-a-haystack eval reports 98% and users still complain,
      because NIAH measures one sentence, not the ten pages around it.

  analogy: |
    A radio receiver with 64 tuned circuits. The fastest rings every 6.3 units
    of distance, the slowest every 54,410: to say how far back something
    happened you read the whole bank and compare phases. Training at 4,096
    units means 18 circuits never completed a single swing in front of the
    calibration rig.

  concept_points:
    - >-
      **A context window is a frequency budget, and at $d = 128$ the budget is 14 bands.**
      The ladder $\lambda_i = 2\pi\theta^{2i/d}$ runs from 6.283 to 54,410
      tokens, and bands whose wavelength still exceeds twice an offset $k$
      number **14** at $k = 4{,}096$, **4** at 16,384 and **0** at 32,768.
      `max_position_embeddings` is an output of the ladder, not a setting.
    - >-
      **28.1% of the ladder never completes one turn at a 4k training length.**
      At $L = 4{,}096$, 18 of 64 bands have $\lambda_i > L$; the slowest
      covers 27.1 degrees of its cycle across the whole training set — 0.0753
      turns. At $L = 32{,}768$ only 4 bands remain. For a quarter of the
      ladder the model saw a quarter of a period.
    - >-
      **What degrades is not the score's magnitude but its meaning — it scrambles rather than fades.**
      With uniform band energies $r(\delta)$ is **0.620338** at offset 16,
      **0.204441** at 1,024, crosses zero at 1,706 and reaches **-0.052853**
      at 4,096. Beyond $L$ it is stationary noise: mean -0.0055, standard
      deviation **0.0836**, and zero offsets above 0.3 between 4k and 128k.
    - >-
      **The per-query distribution over offsets is invariant to sequence length, to seven digits.**
      With $\beta = 20$ and a target 16 tokens back, the mass on it is
      **0.000288** at $n = 4{,}096$ and **0.000288** at $n = 131{,}072$. What
      changes is the company: at 128k, **93.85%** of causal pairs sit beyond a
      4,096 training length.
    - >-
      **Sliding-window attention caps the offset instead of stretching the ladder.**
      With $w = 4{,}096$ and 32 layers no attention op sees an offset above
      4,096, so no scaling method is needed and the cache is bounded at
      **2.00 GiB** per sequence instead of 64.0 GiB at 128k. The price is
      hopping: spanning $n$ tokens needs $n/w$ layers — 32 hops for 128k.
    - >-
      **Every stretch trades range against local resolution, and the three methods differ in where.**
      Position interpolation divides offsets by $s$, so adjacent-token
      contrast falls by $s^2$: **976x** at $s=32$ ($r(0)-r(1)$ from
      $2.979\times10^{-2}$ to $3.050\times10^{-5}$). NTK-aware scaling raises
      the base to **338,096.9**, buying 10 bands above 131,072 at a 24%
      contrast cost. YaRN decides per band: 21 untouched, 25 ramped, 18
      divided, buying **14** bands for **0.06%** contrast.

  definitions:
    - term: "Frequency budget"
      meaning: >-
        The number of RoPE bands whose wavelength still exceeds twice the offset
        you care about. At $d = 128$, base 10,000 it is 14 at 4,096 tokens, 4 at
        16,384 and 0 at 32,768; it falls by 4.82 bands per doubling.
    - term: 'Wavelength (lambda_i)'
      meaning: >-
        $2\pi/\omega_i = 2\pi\theta^{2i/d}$, the distance over which band $i$
        returns to the same phase. The ladder is geometric — 6.283 to 54,410 in
        64 steps of 1.1548 at $d = 128$ — because resolution has to be constant
        in relative terms.
    - term: "Aliasing (near-recurrence)"
      meaning: >-
        Two offsets producing nearly the same score because their phases line up
        again across many bands. It is why the maximum score beyond the trained
        length *grows* with the window (0.2054 at 4k-8k to 0.3479 at 256k-512k)
        instead of decaying: an almost-periodic function returns arbitrarily
        close to any value, given enough chances.
    - term: "Positional resolution"
      meaning: >-
        How much the score changes per token of offset: $r(\delta) - r(\delta+1)$.
        It is $2.979\times10^{-2}$ at $\delta = 0$ for a uniform-energy head at
        $d = 128$ and falls to $3.050\times10^{-5}$ after position interpolation
        with $s = 32$. Resolution, not range, is what PI spends.
    - term: "Position interpolation (PI)"
      meaning: >-
        Replacing position $p$ with $p/s$ so that every offset lands inside the
        trained range. The score becomes $r(\delta/s)$: range grows by $s$,
        local contrast falls by $s^2$ — 976x measured at $s = 32$ — because the
        profile is even in $\delta$ and its leading term is second order.
    - term: "NTK-aware scaling"
      meaning: >-
        Raising the RoPE base to $\theta\, s^{d/(d-2)}$ instead of dividing
        positions. It stretches the slow bands (which carry range) more than the
        fast ones (which carry resolution), but it is still one global constant,
        so the fast bands move too.
    - term: "YaRN"
      meaning: >-
        Yet another RoPE extension: a per-band interpolation factor, 0 on the
        fastest bands and 1 on the slowest, ramped linearly between two rotation
        thresholds, plus an attention temperature. It preserves short-range
        contrast to 0.06% while lifting $r(4{,}096)$ from $-0.053$ to $+0.225$.
    - term: "Correction range"
      meaning: >-
        The band indices where YaRN's ramp runs, computed by inverting a rotation
        count: band $i$ turns $L/\lambda_i$ times inside the original context,
        so the band that turns $\beta$ times sits at
        $i = (d/2)\log_\theta(L/2\pi\beta)$. $\beta_{\text{fast}} = 32$ and
        $\beta_{\text{slow}} = 1$ give bands 20 to 46 at $d = 128$, $L = 4{,}096$.
    - term: "Attention temperature (mscale)"
      meaning: >-
        YaRN's second component: every logit is multiplied by
        $0.1\ln s + 1$, which is 1.346574 at $s = 32$. Stretching wavelengths
        flattens the attention distribution, and this puts the sharpness back —
        entropy over 4,096 keys falls from 1.106 to 0.820 nats.
    - term: "Sliding-window attention"
      meaning: >-
        Masking attention to the last $w$ positions. It removes long offsets from
        the problem entirely rather than encoding them, bounds the KV cache at
        $w$ tokens (2.00 GiB at $w = 4{,}096$ instead of 64.0 GiB at 128k) and
        makes information travel by layer-hopping, $n/w$ hops end to end.
    - term: "Effective context length"
      meaning: >-
        The length at which a model still performs, as opposed to the length it
        accepts. RULER found that of 17 models claiming 32k or more, about half
        hold quality at 32k; the rest degrade before their advertised limit.
    - term: "Lost in the middle"
      meaning: >-
        The U-shaped accuracy curve over the position of relevant information:
        best at the start, worst in the middle, partly recovered at the end.
        75.8% / 53.8% / 63.2% for GPT-3.5-Turbo on 20 documents, with the middle
        below the 56.1% closed-book baseline.

