id: matrix-calculus
slug: matrix-calculus
title: "Matrix Calculus: The Gradient You Can Derive From Its Shape Alone"
summary: >-
  Derive the gradient, Jacobian, and Hessian of any expression you will meet in
  a training loop — by shape rather than by memory — and know exactly when the
  second derivative is worth its cost and when it is a 4-terabyte mistake.
kind: lesson
difficulty: medium
position: 3
estMinutes: 24
prerequisites: [linear-algebra-foundations, vectors-and-geometry]
phase: mathematical-foundations
tags: [matrix-calculus, jacobian, hessian, autodiff, backpropagation, curvature]

body:
  big_idea: >-
    A derivative is a linear map with a shape — $m$ outputs against $n$ inputs is an
    $m \times n$ matrix — so tracking shapes and writing differentials turns
    backpropagation into bookkeeping.

  problem:
    - "Every blog post disagrees about where the transpose goes — half use numerator layout, half denominator, and none say which."
    - "The commonest bug in a hand-written layer is a transpose that silently broadcasts: `(d,)` joins `(n, d)` and the loss still falls."
    - "The Hessian of a $10^6$-parameter model has $10^{12}$ entries, 4 TB in float32, so the skill is knowing which product you need."

  analogy: |
    A derivative is the currency-exchange board at an airport: your input space
    has $n$ currencies, your output space $m$, and the board is an $m \times n$
    table whose entry $(i,j)$ says how much output $i$ you get per unit of input
    $j$. Composing two functions multiplies the boards, and the inner currencies
    must cancel.

  concept_points:
    - "**The derivative's shape is the whole story.** For $f:\\mathbb{R}^n \\to \\mathbb{R}^m$ the derivative is the linear map $J$ in $f(x+\\Delta) \\approx f(x) + J\\Delta$, with $J \\in \\mathbb{R}^{m\\times n}$. A $512\\times768$ layer has 393,216 Jacobian entries, and a scalar loss's gradient with respect to its weight has exactly that weight's shape."
    - "**Two layout conventions, one tie-breaker.** Numerator layout writes $\\partial y/\\partial x$ with shape $(\\dim y, \\dim x)$; denominator layout is its transpose, and both appear in print unlabelled. The tie-breaker is the differential: write $dy = W\\,dx$ for $y = Wx$ and the Jacobian is $W$, shape 768 × 512, with nothing to guess. That is why `torch.autograd.functional.jacobian` returns `(*out, *in)`."
    - "**Four rules generate every formula, and one is order.** Linearity, product, chain, and non-commutativity: $d(AX) = A\\,dX$ but $d(XA) = dX\\,A$. For $f(x) = \\tfrac12 x^\\top A x$ without assuming symmetry, $df = \\tfrac12 x^\\top(A^\\top + A)\\,dx$; assume symmetry and you get $Ax$, which is 45° off and 1.41× too long when the skew part is nonzero."
    - "**The chain rule is a product of Jacobians, and backprop evaluates it right-to-left.** $J_{g\\circ f}(x) = J_g(f(x))J_f(x)$, inner dimensions cancelling like units. Forward mode (a JVP) produces one *column* per pass, so a full Jacobian costs $n$ passes; reverse mode (a VJP) produces one *row*, so it costs $m$. For a scalar loss on $10^9$ parameters that is one pass against a billion."
    - "**Elementwise functions have diagonal Jacobians, so never build them.** For $y = \\tanh(z)$ applied elementwise, $J = \\operatorname{diag}(1-y^2)$: at $z = (0,1,2)$ that is $\\operatorname{diag}(1.000, 0.420, 0.071)$, and for a 4096-wide layer a 16.7-million-entry matrix with 4,096 nonzeros. You multiply elementwise instead — and the diagonality vanishes the moment the op mixes coordinates."
    - "**The only Hessian you ever build is a Hessian-vector product.** $Hv = \\nabla(v^\\top \\nabla f)$: the scalar $v^\\top\\nabla f$ has gradient exactly $Hv$, so one extra reverse pass gives curvature at 2–4× the cost of a gradient and $O(n)$ memory. Truncated Newton, trust-region, conjugate gradient and every sharpness estimate run on this. Building $H$ for $10^6$ parameters would be $10^{12}$ entries, 4 TB in float32."

  definitions:
    - term: "Gradient"
      meaning: >-
        For $f:\mathbb{R}^n \to \mathbb{R}$, the vector $\nabla f$ of first
        partial derivatives, with the same shape as the input. It points in the
        direction of steepest ascent, and its negative is the descent direction.
    - term: "Jacobian"
      meaning: >-
        For $f:\mathbb{R}^n \to \mathbb{R}^m$, the $m \times n$ matrix
        $J_{ij} = \partial f_i/\partial x_j$ of first partial derivatives. It is
        the best linear approximation to $f$ at a point:
        $f(x+\Delta) \approx f(x) + J\Delta$.
    - term: "Hessian"
      meaning: >-
        For a scalar $f$, the $n \times n$ symmetric matrix of second partial
        derivatives $H_{ij} = \partial^2 f/\partial x_i \partial x_j$. It is the
        Jacobian of the gradient, and its eigenvalues are the curvatures of the
        loss surface along its eigenvector directions.
    - term: "Differential"
      meaning: >-
        The linear part of the change in a function,
        $df = \sum_i (\partial f/\partial x_i)\,dx_i$, written without choosing a
        layout. Manipulating $df$ into the form $\operatorname{tr}(G^\top dX)$
        and reading off $G$ is the most reliable way to derive a matrix
        derivative.
    - term: "Numerator layout"
      meaning: >-
        The convention in which $\partial y/\partial x$ has shape
        $(\dim y, \dim x)$ — output rows, input columns. Denominator layout is
        its transpose. PyTorch's `jacobian` and most ML papers use numerator
        layout; most statistics texts use denominator layout.
    - term: "JVP (Jacobian-vector product)"
      meaning: >-
        $J v$ — one column of the Jacobian, computed in a single forward-mode
        pass at roughly the cost of one function evaluation. What you want when
        the input dimension is small, or when you need a directional derivative.
    - term: "VJP (vector-Jacobian product)"
      meaning: >-
        $v^\top J$ — one row of the Jacobian, computed in a single reverse-mode
        pass at 2–4× the cost of a forward pass, given stored activations. What
        `backward()` computes, and what makes training a 10^9-parameter model
        possible.
    - term: "Hessian-vector product"
      meaning: >-
        $Hv = \nabla(v^\top \nabla f)$, available for one extra reverse pass
        without ever forming $H$. The primitive behind truncated Newton,
        trust-region optimisation, and Lanczos curvature estimation.
    - term: "Gauss–Newton approximation"
      meaning: >-
        $H \approx J^\top J$ for a least-squares loss, obtained by dropping the
        residual-weighted second-derivative term $\sum_i r_i \nabla^2 r_i$. It
        is always positive semidefinite, which is why it is safe to use as a
        preconditioner even when the true Hessian is indefinite.
    - term: "Gradient checking"
      meaning: >-
        Comparing an analytic derivative against a finite-difference estimate to
        catch sign, transpose, and reduction errors. Central differences with
        $h \approx 10^{-5}$ reach about $10^{-11}$ accuracy in float64; the pass
        threshold should be $10^{-7}$ relative, not $10^{-15}$.
    - term: "Curvature"
      meaning: >-
        The second-order sensitivity of a function along a direction: the
        Rayleigh quotient $v^\top H v / v^\top v$. Large positive curvature means
        a narrow valley and a learning-rate ceiling; near-zero curvature means a
        plateau; negative curvature means a descent direction the gradient does
        not reveal.

  diagrams:
    - type: compare
      title: "Forward mode versus reverse mode: the same Jacobian, wildly different cost"
      left_label: "Forward mode (JVP, $Jv$)"
      left_points:
        - "One pass gives one column of $J$"
        - "Full Jacobian costs $n$ passes — one per input dimension"
        - "A scalar loss on $10^9$ parameters needs $10^9$ passes"
        - "Memory stays $O(1)$ above the primal computation"
        - "Wins when $n$ is small: directional derivatives, ODE sensitivities, RNN checkpointing"
      right_label: "Reverse mode (VJP, $v^\\top J$)"
      right_points:
        - "One pass gives one row of $J$"
        - "Full Jacobian costs $m$ passes — one per output dimension"
        - "A scalar loss on $10^9$ parameters needs one pass, at 2–4× forward cost"
        - "Must retain or recompute activations — memory is the real bill"
        - "Wins when $m$ is small, which is every training loop ever written"
    - type: plot
      title: "The finite-difference U-curve: why 1e-8 is the wrong step and 1e-12 is worse"
      chart: line
      xLabel: "−log10(step size h)"
      yLabel: "absolute error in d/dx sin(x) at x = 0.7"
      series:
        - name: "central difference"
          points:
            - { x: 1, y: 0.001274 }
            - { x: 2, y: 0.00001275 }
            - { x: 3, y: 0.0000001275 }
