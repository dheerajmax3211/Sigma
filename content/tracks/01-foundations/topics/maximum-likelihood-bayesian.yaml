    - type: architecture
      title: "Where each object in this topic lives"
      caption: >-
        Both routes consume the same likelihood. The only difference is whether
        the prior multiplies in before or after you take the maximum — and what
        you are allowed to report afterwards.
      nodes:
        - { id: data, x: 0, y: 1, label: "Sample x1..xn", kind: client, detail: "Fixed. The likelihood is a function of the parameter with these values held constant — swap the data and it is a different function." }
        - { id: prior, x: 0, y: 3, label: "Prior p(theta)", kind: external, detail: "Optional, and the only place genuine prior knowledge enters. Its width sets how many pseudo-observations it is worth." }
        - { id: lik, x: 1, y: 1, label: "Log-likelihood", kind: model, detail: "A sum, never a product. This single object feeds both branches below." }
        - { id: mle, x: 2, y: 0, label: "Score = 0 gives theta-hat", kind: worker, detail: "Solve the score equation. Closed form for exponential families; Newton or IRLS when it is not." }
        - { id: post, x: 2, y: 2, label: "Posterior: prior x likelihood", kind: model, detail: "Conjugate families give this in closed form; otherwise you need MCMC or a variational approximation." }
        - { id: hess, x: 3, y: 0, label: "Hessian gives se and CI", kind: server, detail: "The negative Hessian at the estimate, inverted. The same matrix as the Fisher information, evaluated rather than expected." }
        - { id: pred, x: 3, y: 2, label: "Posterior predictive", kind: server, detail: "Integrate the parameter out. This is the distribution you should actually forecast with — it is wider than the plug-in prediction, and correctly so." }
