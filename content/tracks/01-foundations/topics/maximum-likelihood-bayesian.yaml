id: maximum-likelihood-bayesian
slug: maximum-likelihood-bayesian
title: "A Likelihood Is Not a Probability: MLE, Priors, and Error Bars"
summary: >-
  Turn a model plus data into a defensible estimate — with a standard error
  attached — by deriving the MLE, reading its uncertainty off the curvature of
  the log-likelihood, and knowing when to multiply by a prior instead.
kind: lesson
difficulty: medium
position: 7
estMinutes: 25
prerequisites: [probability-distributions, matrix-calculus]
phase: mathematical-foundations
tags: [statistics, maximum-likelihood, bayesian, fisher-information, map, regularisation, uncertainty]

body:
  big_idea: >-
    A likelihood is a function of the parameter, not a distribution over it: MLE asks
    which value makes the sample most probable, Bayes multiplies in prior belief, and
    curvature hands you the error bar.

  problem:
    - "Your model outputs a conversion probability of 0.73 and a reviewer asks how sure you are. \"The loss went down\" is not a number."
    - "You add weight decay because a tutorial said to, and cannot say what $\\lambda$ means or why it equals a Gaussian prior nobody set."
    - "Your logistic regression hits perfect separation, weights climb to 30 and keep going, and the optimiser reports \"converged\" at gradient $10^{-12}$."

  analogy: |
    A thermometer in a room. Maximum likelihood asks which true temperature
    would make these readings most probable: it reads only the instrument's
    error model and returns one number. Bayesian inference asks what to believe
    now, given the readings and the fact that you knew this room was not a
    freezer. The prior is that knowledge; the posterior is the compromise.

  concept_points:
    - "**A likelihood is a function of the parameter, and you always work with its log.** For 7 heads in 10 flips, $L(0.7) = 2.22\\times10^{-3}$ against $L(0.5) = 9.77\\times10^{-4}$: the sample is 2.28 times more probable under 0.7. That is a probability of the *sample*, not of $\\theta$ — $\\int L(\\theta)\\,d\\theta$ has no meaning. The product underflows, so sum logs: $-6.1086$ against $-6.9315$."
    - "**The score is the gradient of the log-likelihood, and it is a sum over examples.** $\\ell'(\\theta) = \\sum_i \\partial \\ln p(x_i\\mid\\theta)/\\partial\\theta$, zero at the MLE: for the coin, $k/\\theta - (n-k)/(1-\\theta) = 0$ gives $\\hat\\theta = k/n = 0.7$. For Gaussian linear regression $\\nabla_w\\ell = \\sigma^{-2}X^\\top(y-Xw)$, and setting it to zero gives the normal equations $X^\\top Xw = X^\\top y$."
    - "**Fisher information is the curvature of the log-likelihood and the variance of the score.** $I(\\theta) = -\\mathbb{E}[\\ell''(\\theta)] = \\operatorname{Var}[\\ell'(\\theta)]$. For Bernoulli, $I_1 = 1/(\\theta(1-\\theta))$, so at $\\theta = 0.7$, $n = 10$: $I = 47.62$ and $\\mathrm{se} = 1/\\sqrt{47.62} = 0.1449$. The Wald interval $[0.416, 0.984]$ against the exact $[0.390, 0.891]$ — symmetric, too wide, and it overshoots."
    - "**Bayes multiplies the likelihood by a prior, and conjugacy makes the arithmetic exact.** $p(\\theta\\mid x) \\propto p(x\\mid\\theta)p(\\theta)$. With Beta$(a,b)$ and $k$ heads in $n$ flips the posterior is Beta$(a+k,\\,b+n-k)$: the prior contributes $a+b$ virtual flips. Beta(1,1) plus 7/10 gives Beta(8,4) — mean 0.667, mode 0.700, sd 0.131. Beta(10,10), worth 20 flips, gives 17/30 and a mean of 0.567."
    - "**MAP is penalised maximum likelihood; the penalty is the negative log prior.** A Gaussian prior $N(0,\\tau^2)$ with noise variance $\\sigma^2$ is ridge with $\\lambda = \\sigma^2/\\tau^2$; a Laplace prior is the lasso. With $x=1$, $y=5$, $\\sigma=\\tau=1$ the MLE is 5.0 and the MAP estimate 2.5. Trap: MAP is a *mode*, so it is not invariant to reparameterisation."
    - "**Maximum likelihood fails structurally when the model cannot be identified.** With perfectly separable logistic data the likelihood approaches 1 as $\\|w\\| \\to \\infty$ and never attains it: on four separable points, fifty Newton steps reach $\\|w\\| = 99.7$ and $\\ell = -3.7\\times10^{-22}$ — converged, meaningless. The same shape appears when $n < d$, in Gaussian mixtures, and wherever two parameters appear only as a product."

  definitions:
    - term: "Likelihood"
      meaning: >-
        $L(\theta) = \prod_i p(x_i \mid \theta)$, read as a function of $\theta$
        with the data held fixed. It is not a probability distribution over
        $\theta$ and does not integrate to 1.
    - term: "Fisher information"
      meaning: >-
        $I(\theta) = -\mathbb{E}[\ell''(\theta)] =
        \operatorname{Var}[\ell'(\theta)]$. The curvature of the log-likelihood:
        how sharply the data pin down the parameter. Additive over independent
        observations.
    - term: "Prior"
      meaning: >-
        $p(\theta)$, a distribution over the parameter reflecting what you
        believed before seeing the data. Its width is a statement about how much
        you are willing to be moved.
    - term: "Posterior"
      meaning: >-
        $p(\theta \mid x) \propto p(x \mid \theta)p(\theta)$, the distribution
        over the parameter after seeing the data. Everything Bayesian — point
        estimates, intervals, predictions — is a summary of this object.
    - term: "Conjugate prior"
      meaning: >-
        A prior whose posterior stays in the same family as the prior: Beta with
        Binomial, Normal with Normal, Dirichlet with Categorical, Gamma with
        Poisson. Conjugacy is a bookkeeping convenience, not a modelling
        assumption.
    - term: "MAP estimate"
      meaning: >-
        The mode of the posterior, $\arg\max_\theta [\ell(\theta) + \ln
        p(\theta)]$. Equal to penalised maximum likelihood, and equal to the
        posterior mean only when the posterior is symmetric.
    - term: "Credible interval"
      meaning: >-
        An interval $[a,b]$ with $P(\theta \in [a,b] \mid x) = 0.95$ under the
        posterior. This is the statement people mistakenly read into a
        confidence interval; it requires a prior to exist.
    - term: "Shrinkage"
      meaning: >-
        Pulling an estimate toward a prior value, with a weight set by the
        relative precision of prior and data. The posterior mean is the canonical
        shrinkage estimator; ridge regression is its MAP counterpart.
    - term: "Laplace approximation"
      meaning: >-
        Approximating a posterior by a Gaussian centred at its mode with
        covariance the inverse negative Hessian. Cheap, accurate when the
        posterior is roughly symmetric, and wrong at boundaries.
    - term: "Separation"
      meaning: >-
        A property of a classification dataset where some hyperplane perfectly
        splits the classes. The logistic likelihood then has no finite maximiser:
        the weights diverge and the fitted probabilities go to 0 and 1.

