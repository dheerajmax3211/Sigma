    - type: compare
      title: "Two questions, one likelihood"
      left_label: "Maximum likelihood"
      left_points:
        - "One number per parameter, plus a standard error from the curvature"
        - "No prior: the data speak alone — and at $n = 10$ they whisper"
        - >-
          Answers: which $\theta$ makes this sample most probable?
        - "Breaks when the likelihood is flat, separated, or multimodal"
      right_label: "Bayesian inference"
      right_points:
        - >-
          A whole distribution over $\theta$: uncertainty is the answer, not an
          add-on
        - >-
          Prior × likelihood, normalised; the prior is worth $a+b$
          pseudo-observations
        - "Answers: what should I believe now, and what will I see next?"
        - >-
          Breaks when the prior is confidently wrong or the posterior is
          intractable
