id: learning-rate-schedules
slug: learning-rate-schedules
title: "Warmup, Decay, Batch Size: One Budget, Three Ways to Spend It"
summary: >-
  Choose the peak learning rate, the shape it decays along, and the batch size
  as one decision rather than three — and predict from the schedule's area and
  the first step's length whether a run will converge, plateau, or die in its
  first hundred steps.
kind: lesson
difficulty: medium
position: 10
estMinutes: 26
prerequisites: [gradient-descent-variants]
phase: mathematical-foundations
tags: [optimization, learning-rate, cosine-decay, warmup, batch-size, training]

body:
  big_idea: >-
    What the optimizer integrates is $\sum_t \eta_t$, not the peak rate, so peak, decay
    shape and batch size are one decision — and warmup exists only to stop the first
    step being the largest.

  problem:
    - "Your run holds 1e-3 and the loss stops at 0.031 — the noise floor of a constant step, which is linear in the learning rate."
    - "You move from one GPU to 32, scale the batch 32×, keep the learning rate, and get 32× fewer steps making 32× less progress."
    - "You delete the 2,000-step warmup because it was wasting steps, and the loss spikes at step 30 and never recovers."

  analogy: |
    Landing an aircraft: you descend fast while you still have distance to
    spend, then flare and slow to touchdown so the wheels meet the ground
    gently. Speed is the learning rate; the distance covered is the budget, not
    the speed you started at. Warmup is the configuration phase — gear and flaps
    extended gradually, at a rate the airframe tolerates.

  concept_points:
    - "**A constant learning rate cannot converge, only orbit.** On $\\tfrac12\\lambda\\theta^2$ with gradient noise $\\sigma^2$ the excess loss settles at $\\eta\\sigma^2/(2(2-\\eta\\lambda))$, about $\\eta\\sigma^2/4$ for small $\\eta\\lambda$: with $\\lambda=1$, $\\sigma=1$, $\\eta=0.1$ the floor is **0.0263** and 400 seeds average 0.0268, flat from step 200. The floor is linear in $\\eta$."
    - "**What the model experiences is the sum, not the peak.** Total movement is $\\sum_t \\eta_t = \\eta_{\\max}T\\cdot\\overline{\\text{shape}}$. At $\\eta_{\\max}=10^{-3}$ over 1,000 steps: constant gives **1.000**, cosine-to-zero **0.5005**, 10× step decay **0.5275** — the same peak with cosine travels half as far. An $\\eta_{\\max}$ copied between recipes is not the same hyperparameter twice."
    - "**Cosine decay front-loads the budget.** The first half of a cosine run consumes $\\tfrac12 + \\tfrac1\\pi = \\mathbf{81.83\\%}$ of the area; half is gone by $t=0.265T$ and three quarters by $0.44T$. Discrete at $T=1000$: 19.8% in the first 10% of steps, 47.5% by 25%. The claim that cosine buys a long fine-tuning tail is backwards about where the time goes."
    - "**Warmup exists because Adam's first step is already full length.** Bias correction makes step 1 exactly $\\eta\\operatorname{sign}(g_1)$ — length $\\eta$ in *every* coordinate, from one batch. At the linear-scaling rate for batch 8192, $\\eta = 3.2$ against $\\sigma_w = 0.02$: one step moves each weight **160** standard deviations. The condition is $\\eta/T_w \\le \\sigma_w$, so $T_w \\ge 160$; the published recipe used 780."
    - "**Linear scaling, $\\eta \\propto B$, holds movement per epoch constant.** A pass of $N$ examples at batch $B$ is $N/B$ steps of size $\\eta\\bar g$, so fixing that means $\\eta$ grows with $B$: $256 \\to 8192$ is $0.1 \\to 3.2$. The derivation assumes the gradient is unchanged across sub-batches, which fails at large rates — hence warmup, and the rule breaks near $B = 8\\text{k}$–$32\\text{k}$."
    - "**Bias correction fixes the first moment and says nothing about the second.** For an EMA with $\\beta_2$ the relative standard deviation of $\\hat v$ is $\\sqrt{\\kappa\\frac{1-\\beta_2}{1+\\beta_2}\\frac{1+\\beta_2^t}{1-\\beta_2^t}}$ with $\\kappa = 2$ for Gaussian gradients: **141%** at $t=1$, 14.1% at $t=100$, 3.16% asymptotically. Since the update divides by $\\sqrt{\\hat v}$, step-length error is half that."

  definitions:
    - term: "Learning-rate schedule"
      meaning: >-
        A function $\eta_t$ mapping optimizer step to step size. It is defined
        by a peak $\eta_{\max}$, a floor $\eta_{\min}$, a horizon $T$, and a
        shape. Any three of those four numbers determine the fourth's effect on
        the run, which is why they cannot be tuned independently.
    - term: "Schedule budget"
      meaning: >-
        $\mathcal{B} = \sum_{t=0}^{T-1}\eta_t$, the area under the schedule. It
        is the total parameter movement the run has available, in the same units
        as $\theta$. A cosine from $10^{-3}$ to zero over 1000 steps has
        $\mathcal{B} = 0.5005$; the constant schedule with the same peak has
        $\mathcal{B} = 1.000$.
    - term: "Warmup"
      meaning: >-
        A ramp applied before the main schedule, usually linear,
        $\eta_t = \eta_{\max}\,t/T_w$. Its job is to keep the first steps small
        while the optimizer's state and the initialisation are both bad. The
        design rule is $T_w \gtrsim \eta_{\max}/\sigma_w$, where $\sigma_w$ is
        the weight scale at initialisation.
    - term: "Cosine decay"
      meaning: >-
        $\eta_t = \eta_{\min} + \tfrac12(\eta_{\max}-\eta_{\min})
        \left(1+\cos\frac{\pi t}{T}\right)$. Zero slope at both ends, area
        $T(\eta_{\max}+\eta_{\min})/2 + (\eta_{\max}-\eta_{\min})/2$, and 81.83%
        of that area spent in the first half of training.
    - term: "Step decay"
      meaning: >-
        Multiplying the rate by a constant factor at fixed milestones, e.g. ×0.1
        at 50% and 75% of training. Its area, relative to a constant schedule at
        the same peak, is the weighted average of the plateaus — 0.5275 for the
        cuts above, against cosine's 0.5005.
    - term: "Inverse-time decay"
      meaning: >-
        $\eta_t = \eta_0/(1+t/\tau)$, the schedule that satisfies the
        Robbins–Monro conditions exactly. Its problem is arithmetic: with
        $\eta_0$ tuned for a constant run, it decays so fast that the run stops
        moving long before the horizon. Measured at $\eta_0 = 0.1$, $T=2000$, it
        ended at loss 0.0608 — *worse* than the constant-rate floor of 0.0268.
    - term: "Linear scaling rule"
      meaning: >-
        $\eta \propto B$. Holds the total parameter movement per epoch constant
        when the batch changes, on the assumption that the gradients of the
        sub-batches it replaces are interchangeable. Valid only while the weights
        barely move within the accumulation window, which is why it is paired
        with warmup.
    - term: "Square-root scaling rule"
      meaning: >-
        $\eta \propto \sqrt{B}$. Holds the per-step parameter noise
        $\eta^2\sigma^2/B$ constant instead of the per-epoch movement. The
        conservative choice when linear scaling diverges; it is what you fall back
        to as you approach the critical batch size.
    - term: "Critical batch size"
      meaning: >-
        $B_{\text{noise}} = \operatorname{tr}(\Sigma)/\|G\|^2$ for per-sample
        gradient covariance $\Sigma$ and true gradient $G$: the batch at which the
        gradient's noise equals its signal. Below it, doubling the batch and the
        rate buys real speedup; above it, extra batch buys almost nothing.
    - term: "One-cycle policy"
      meaning: >-
        A schedule that ramps linearly *up* to a peak (often 3–10× the
        constant-rate optimum), then decays below it for the last stretch. It
        works because the area, not the peak, is what the model integrates — and
        because the up-ramp doubles as warmup.
    - term: "Effective step size"
      meaning: >-
        $\eta_t\|u_t\|$ in parameter units, where $u_t$ is the optimizer's
        normalised update direction. For Adam $|u_i| \le 1$, so the effective
        step is at most $\eta_t$ per coordinate; for SGD it is $\eta_t\|g_t\|$
        and inherits the gradient's scale.
    - term: "Half-ulp floor"
      meaning: >-
        The smallest increment that survives being added to a number:
        $\tfrac12\operatorname{ulp}(\theta)$, roughly $\epsilon|\theta|/2$, which
        is $5.96\times10^{-8}$ for $|\theta|=1$ in fp32. Updates smaller than
        this are rounded away, which is what happens to the tail of an aggressive
        decay in a low-precision dtype.

