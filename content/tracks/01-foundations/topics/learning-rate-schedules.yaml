    - type: compare
      title: "Linear vs √B scaling: two rules, two invariants"
      left_label: "η ∝ B (linear)"
      left_points:
        - "Invariant: parameter movement per epoch, η·(N/B)·ḡ"
        - "B ×32 ⇒ η ×32: 0.1 → 3.2 at batch 8192"
        - "Aggressive: assumes the k sub-batches share one gradient"
        - "Requires warmup, because the first step is now huge"
        - "Validated to B = 8192 on ImageNet with 5 epochs of warmup (780 steps)"
      right_label: "η ∝ √B (square root)"
      right_points:
        - "Invariant: noise injected per step, η²σ²/B"
        - "B ×32 ⇒ η ×5.66: 0.1 → 0.566 at batch 8192"
        - "Conservative: always stable, never as fast"
        - "Needs much less warmup for the same batch"
