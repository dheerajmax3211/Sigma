    - type: compare
      title: "The theorem vs. the folklore that replaced it"
      left_label: "What the CLT actually says"
      left_points:
        - "The standardized sum converges in distribution to N(0,1)"
        - "The CDF error is O(1/√n), with the constant set by the third moment"
        - "Finite variance is required; without it nothing converges"
        - "Convergence in distribution says nothing about your tails at finite n"
      right_label: "What gets repeated in standups"
      right_points:
        - "\"The data is normal, so ±1.96σ is a 95% interval\""
        - "\"n > 30 is enough\" — regardless of the distribution"
        - "\"A 6σ outlier is impossible\" — while 1M rows/day expects 0.002 of them"
        - "\"σ/√n works on any array\" — including a Cauchy sample"
    - type: architecture
      title: "Where uncertainty actually enters a decision"
      nodes:
        - { id: raw, x: 0, y: 1, label: "n observations", kind: client, detail: "The data is not the uncertainty. A single dataset has one mean; the error bar is a claim about the other datasets you did not get." }
        - { id: est, x: 1, y: 1, label: "Estimator", kind: server, detail: "Mean, rate, quantile, AUC. Each has its own sampling distribution and its own standard error — there is no such thing as 'the' error bar for a model." }
        - { id: samp, x: 2, y: 1, label: "Sampling distribution", kind: model, detail: "The object everyone skips. The CLT gives it in closed form when variance is finite; the bootstrap gives it empirically when it is not — and it is not a cure for an undefined mean." }
        - { id: ci, x: 3, y: 1, label: "Interval at 1 − α", kind: worker, detail: "A quantile of the sampling distribution. Its width scales as 1/√n, so precision is bought in square roots: 4x the data, half the width." }
        - { id: guard, x: 1, y: 3, label: "Tail check", kind: external, detail: "Skewness, kurtosis, and a plot of the running mean. If the running mean has not settled, no interval built on σ/√n means anything." }
        - { id: boot, x: 2, y: 3, label: "Bootstrap", kind: worker, detail: "Resample with replacement. It agrees with σ/√n on well-behaved data and reproduces the heavy tail on bad data — which is useful information, not a fix." }
        - { id: decision, x: 3, y: 3, label: "Ship / don't ship", kind: client, detail: "The only place the interval earns its keep: comparing an effect against a threshold that has a cost." }
      edges:
        - { from: raw, to: est, label: "summarise" }
        - { from: est, to: samp, label: "CLT" }
        - { from: samp, to: ci, label: "quantiles" }
        - { from: ci, to: decision, label: "compare" }
        - { from: raw, to: guard, label: "check tails", style: "async" }
        - { from: guard, to: boot, label: "if doubtful" }
        - { from: boot, to: ci, label: "empirical quantiles", style: "async" }
      caption: >-
        The sampling distribution is the node people delete from the diagram, and
        it is the only one that explains why the same estimator on the same data
        can have a narrow interval or a useless one depending on the tail.

  markdown: |
    ## The number you reported is not the number they asked for

    You computed a mean from 1,000 rows: revenue of 42 dollars per user. Someone
    asks how sure you are. "Pretty sure" is not an answer, and repeating "42" is
    not an answer either. The answer is a distribution — the distribution of the
    mean across hypothetical repeats of the same experiment. That object is the
    **sampling distribution**, and every confidence interval, p-value, and error
    bar in the rest of this curriculum is a quantile of it.

    The central limit theorem is why that distribution is usually Gaussian. It is
    also specific about when it is not, and that half of the theorem is the half
    that gets dropped.

    ## Three functions and one primitive

    A distribution is described by a PMF (discrete) or a PDF (continuous), and by
    its CDF. Only the CDF is universal. The PDF is a density: it can exceed 1 and
    it means nothing until you integrate it over an interval.

    | Distribution | Mean | Variance | Where you meet it |
    |---|---|---|---|
    | Bernoulli(p) | p | p(1−p) | one click, one label |
    | Binomial(n,p) | np | np(1−p) | successes in n trials |
    | Poisson(λ) | λ | λ | counts per interval; variance equals mean |
    | Uniform(a,b) | (a+b)/2 | (b−a)²/12 | seeding, quantisation error |
    | Exponential(λ) | 1/λ | 1/λ² | waiting times; sd equals mean |
    | Gaussian(μ,σ²) | μ | σ² | sums, noise, the CLT limit |
    | χ²(d) | d | 2d | squared norm of a d-vector |
    | Student-t(ν) | 0 | ν/(ν−2) | a mean with an estimated variance |
    | Cauchy | undefined | undefined | a ratio of two normals; the counterexample |

    The Poisson row is worth staring at: its variance equals its mean, so a count
    of 100 per minute has a standard deviation of 10 — 10%. Scale to 10,000 per
    minute and the relative noise drops to 1%. That is the CLT doing its work
    inside a single distribution family.

    ## Why averages concentrate

    For iid $X_i$ with variance $\sigma^2$:

    $$\operatorname{Var}(\bar X) = \frac{1}{n^2}\sum_{i=1}^n \operatorname{Var}(X_i) = \frac{n\sigma^2}{n^2} = \frac{\sigma^2}{n}$$

    The numerator grows like $n$; the denominator grows like $n^2$. That single
    mismatch is the engine of every error bar in machine learning. It is also why
    doubling a dataset is worth less than people expect, and why the fourth
    decimal place of a benchmark is usually noise: at $n = 10{,}000$ the standard
    error is 1% of $\sigma$, and at $n = 100$ it is 10%.

    ## The theorem, with its error term

    Let $Z_n = \sqrt{n}(\bar X - \mu)/\sigma$. Then $Z_n \Rightarrow
    \mathcal{N}(0,1)$, and Berry–Esseen quantifies the gap:

    $$\sup_x \left| P(Z_n \le x) - \Phi(x) \right| \le \frac{0.4748\,\rho}{\sigma^3\sqrt{n}}, \qquad \rho = E\lvert X-\mu \rvert^3$$

    The bound is loose by roughly a factor of twenty in practice, but its *shape*
    is right: the error is $1/\sqrt{n}$ and it is proportional to skewness. That
    is why a symmetric distribution converges fast and an exponential does not.

    Measured against exact distributions:

    | n | Bernoulli(0.5) | Exponential(1) |
    |---|---|---|
    | 4 | 0.0062 | 0.0667 |
    | 16 | 0.0017 | 0.0333 |
    | 30 | 0.0009 | 0.0243 |
    | 100 | 0.0003 | 0.0133 |

    At $n = 30$ the exponential's CDF is still two percentage points away from
    the Gaussian in places. A symmetric 95% interval happens to be well
    calibrated there — the skew pushes one tail up and the other down, and the
    two errors cancel at the 2.5% points — but the underlying interval is
    asymmetric, so any one-sided statement built on it is wrong by that margin.

    ## Where it stops being true

    Finite variance is not a formality. A standard Cauchy has no mean, and the
    mean of $n$ Cauchy draws is standard Cauchy for every $n$. Ten thousand
    samples leave $P(\lvert \bar X \rvert > 10) = 6.35\%$, the same as one sample. The
    bootstrap does not rescue you: it faithfully reproduces the heavy tail and
    returns a standard error of about 1.5, which is honest about the noise but
    says nothing useful about a quantity that never settles.

    Log-normal is the interesting middle case: finite variance, so the CLT does
    apply, but with $\sigma = 1$ the skewness is $6.18$ and the excess kurtosis is
    $110.9$. The standardized mean still has skewness $1.13$ at $n = 30$ and
    $0.20$ at $n = 1000$. If your revenue metric is log-normal, "we have 30
    samples per arm" is not a sample size, it is a hope.

    ## The multivariate version is the geometry you already have

    In *Vectors and the Geometry of High-Dimensional Space* the concentration of
    $\|x\|$ around $\sqrt{d}$ looked like a geometric curiosity. It is the CLT:
    $\|x\|^2 = \sum_i x_i^2$ is a sum of $d$ iid $\chi^2_1$ variables, so
    $\|x\|^2 \approx \mathcal{N}(d, 2d)$ — mean $d$, standard deviation
    $\sqrt{2d}$, relative spread $1/\sqrt{2d}$. At $d = 768$ that is a 2.6% band
    around radius $27.7$, exactly the shell you measured.

    The same shift of viewpoint turns the covariance matrix into a metric.
    Whitening is $\Sigma^{-1/2}$, the inverse square root you built when you
    reduced a correlated cloud to a sphere; in probability language it maps
    $\mathcal{N}(\mu, \Sigma)$ to $\mathcal{N}(0, I)$ and turns squared
    Mahalanobis distance into a $\chi^2_d$ statistic. That is what makes
    $d^2 = 5.991$ — not $1.96$ — the 95% contour of a two-dimensional Gaussian.

    ## The recipe

    1. Compute the estimator and its standard error, and say which is which.
    2. Check the approximation: skewness, a plot of the running mean, and the tail
       index if the data is money or durations.
    3. If the check passes, use normal quantiles. If it fails, bootstrap — and if
       the running mean has not settled, report that instead of an interval.
    4. Translate into the units of the decision. An interval that is not compared
       against a cost is decoration.

    ## The longer version

    The remaining mechanisms, verbatim: the CDF as the object that always
    exists, why the Gaussian is the maximum-entropy default, and the
    multivariate Gaussian as the geometry topic with a metric attached.

    ### Failure modes, in full

    - Your A/B test says variant B converts 2% better. You have 10,000 users per arm. You need to know whether that is a result or a rounding artefact, and "it looks higher" is not an answer anyone will accept in a launch review.
    - Your minibatch loss curve is so noisy that you cannot tell whether the change you made an hour ago helped. The noise is not a property of the model, it is $\sigma/\sqrt{B}$, and knowing that tells you exactly what batch size to buy.
    - Your anomaly detector alerts at 4-sigma. You ship it, and it fires three times a day on healthy traffic. Either the distributional assumption is wrong or your threshold arithmetic is, and those are different bugs with different fixes.
    - You report "mean revenue 42 dollars, standard deviation 18 dollars" as though it were an error bar, and every stakeholder reads it as the uncertainty on the mean. It is 30 times too wide — and the direction of the error makes you look less certain than you are.
    - An interviewer asks why $n = 30$ is the magic number. "Central limit theorem" is the answer of someone who has read a blog post; the real answer involves skewness, the third moment, and the fact that the number is folklore rather than a theorem.

    ### The mechanisms, in full

    - **A distribution is a promise about frequencies, and the CDF is the object that always exists.** The PDF is probability per unit of $x$, not a probability: $\mathcal{N}(0, 0.01)$ has density $3.989$ at zero, which is perfectly legal because you must integrate over an interval to get a probability. The CDF $F(x) = P(X \le x)$ is monotone, bounded in $[0,1]$, and exists for discrete, continuous, and mixed distributions alike — Glivenko–Cantelli says the empirical CDF converges to it uniformly at rate $1/\sqrt{n}$ with *no* assumption on the variance. Trap: comparing densities across models whose scales differ, as though a bigger density meant a more probable outcome.
    - **Expectation is linear with no assumptions; variance is linear only under independence.** $E[X+Y] = E[X] + E[Y]$ always, but $\operatorname{Var}(X+Y) = \operatorname{Var}X + \operatorname{Var}Y + 2\operatorname{Cov}(X,Y)$. Two assets with $\sigma = 20\%$ each and correlation $0.6$ have portfolio standard deviation $\sqrt{0.04 + 0.04 + 2(0.6)(0.04)} = 35.8\%$, not the $28.3\%$ you get by pretending they are independent. Trap: "the errors are independent" is an assumption to be checked, and the whole difference between a correct and an overconfident error bar lives in that covariance term.
    - **The mean's variance falls as $\sigma^2/n$, so its standard deviation falls as $\sigma/\sqrt{n}$ — the single rate in this topic worth memorising.** With $\sigma = 15$ and $n = 100$ the standard error is $1.5$; to reach $0.5$ you need $n = 900$, nine times the data for a third of the width. The same algebra governs mini-batch gradients: noise is $\sigma/\sqrt{B}$, so going from batch 32 to 256 divides it by $\sqrt{8} = 2.83$, not by 8. Trap: "four times the data halves the error" is correct, and "four times the data quarters it" is the version people actually use when they budget an experiment.
    - **The CLT says the standardized sum converges to $\mathcal{N}(0,1)$, and it says how fast: CDF error is $O(1/\sqrt{n})$ and is governed by the third moment.** Berry–Esseen: $\sup_x \lvert F_n(x) - \Phi(x) \rvert \le 0.4748\,\rho/(\sigma^3\sqrt{n})$ with $\rho = E\lvert X-\mu \rvert^3$. Measured against the exact binomial CDF: $0.0062$ at $n = 4$, $0.00165$ at $n = 16$, $0.00027$ at $n = 100$ — roughly a halving every time $n$ quadruples. Trap: "the sum is normal" is false at every finite $n$; only the standardized CDF converges, and convergence in distribution says nothing about how thick the tails still are at your sample size.
    - **The shape converges through the cumulants: skewness of the standardized sum is $\gamma_1/\sqrt{n}$ and excess kurtosis is $\gamma_2/n$.** For an exponential, $\gamma_1 = 2$ and $\gamma_2 = 6$, so at $n = 30$ the standardized mean still carries skewness $0.365$ and excess kurtosis $0.2$; at $n = 1000$ those are $0.063$ and $0.006$. A log-normal with $\sigma = 1$ has $\gamma_1 = 6.18$ and $\gamma_2 = 110.9$, so at $n = 30$ its mean's skewness is $6.18/\sqrt{30} = 1.13$ — as skewed as a single exponential, which is to say the Gaussian approximation is not yet doing any work. Trap: the "$n = 30$" folklore is calibrated on symmetric, light-tailed examples; revenue, session lengths, and counts are none of those.
    - **The Gaussian is the maximum-entropy distribution with a given mean and variance, which is why it is the default — not because your data is normal.** $H = \tfrac{1}{2}\log(2\pi e \sigma^2)$, so $\sigma = 1$ gives $1.4189$ nats $= 2.047$ bits, and every other distribution with variance 1 has strictly less entropy. Assuming normality is therefore a claim that you know the first two moments and nothing else — principled as a minimal commitment, dangerous as an assertion about the tails. Trap: a QQ plot that looks "roughly straight" at $n = 200$ cannot separate a Gaussian from a $t_5$, and the difference between those two lives precisely at the 4σ point where your anomaly budget lives.
    - **The tail is not linear, and every intuition calibrated at 2σ fails at 5σ.** Two-sided Gaussian mass: $4.55\%$ beyond 2σ, $0.27\%$ beyond 3σ, $6.3\times10^{-5}$ beyond 4σ, $5.7\times10^{-7}$ beyond 5σ, $2.0\times10^{-9}$ beyond 6σ. Per million rows you expect 63 flags at 4σ, 0.57 at 5σ, and 0.002 at 6σ. Trap: extrapolating "2σ is 5%, so 4σ is 2.5%" — the true value is 400 times smaller; and treating a 3-event day at 5σ as proof of a broken model when the expected count is 0.57 per million rows and you have a million rows per day.
    - **The CLT's hypothesis is finite variance, and losing it is not a technicality.** For a standard Cauchy, the mean of $n$ samples is standard Cauchy for *every* $n$: averaging 10,000 of them leaves $P(\lvert \bar X \rvert > 10) = 6.35\%$, identical to a single draw, and the sample mean wanders as far as one observation does. Anything with a Pareto tail index $\alpha \le 2$ — incomes, file sizes, viral counts, some training losses — behaves the same way. Trap: computing $\sigma/\sqrt{n}$ on such data yields a small, confident, meaningless interval; the diagnostic is to plot the running mean and watch whether it settles.
    - **The multivariate Gaussian is the geometry from *Vectors and the Geometry of High-Dimensional Space* with a metric attached.** $p(x) \propto \exp(-\tfrac{1}{2}(x-\mu)^\top \Sigma^{-1}(x-\mu))$, so its level sets are the ellipsoids of that quadratic form. For $\Sigma = [[4,3],[3,4]]$ the eigenvalues are 7 and 1, so the 1σ contour has semi-axes $2.646$ and $1.0$ along $(1,1)/\sqrt{2}$ — a long thin ellipse, not a circle. Squared Mahalanobis distance is $\chi^2_d$, so the 95% contour in two dimensions sits at $d^2 = 5.991$, not at $1.96$. Whitening, the $\Sigma^{-1/2}$ you built in the previous topic, is exactly the change of variables that maps this to $\mathcal{N}(0, I)$. Trap: ranking points by Euclidean distance to $\mu$ in raw coordinates, which over-flags the long axis and under-flags the short one.
    - **Standard deviation describes the data; standard error describes the estimate, and confusing them overstates your precision by $\sqrt{n}$.** With $n = 10{,}000$ and $\sigma = 1$ the standard error is $0.01$, so a difference of $0.02$ between two groups is 2 SE and plausibly real; with $n = 100$ the standard error is $0.1$ and the same difference is 0.2 SE, which is noise. In an A/B test with a 10% baseline and $10{,}000$ users per arm, the standard error of the difference is $\sqrt{2(0.1)(0.9)/10000} = 0.424$ percentage points, so a 2% relative lift (0.2 points) is $z = 0.47$ — invisible. Trap: quoting $\sigma$ as the error bar of a mean, which at $n = 10{,}000$ is wrong by a factor of 100.


  derivations:
    - title: "Why the standard error is σ/√n"
      latex: |
        For iid $X_1, \dots, X_n$ with $\operatorname{Var}(X_i) = \sigma^2$,
        bilinearity of covariance gives
        $$\operatorname{Var}\!\left(\frac{1}{n}\sum_{i=1}^n X_i\right)
          = \frac{1}{n^2}\sum_{i=1}^n \operatorname{Var}(X_i)
          + \frac{1}{n^2}\sum_{i \ne j}\operatorname{Cov}(X_i, X_j).$$
        Independence kills the second sum, leaving
        $$\operatorname{Var}(\bar X) = \frac{n\sigma^2}{n^2} = \frac{\sigma^2}{n},
          \qquad \operatorname{sd}(\bar X) = \frac{\sigma}{\sqrt{n}}.$$
      prose: >-
        The $n^2$ in the denominator is the entire content: the variance of a sum
        grows linearly in $n$, but you divide by $n$ to get the mean, and the
        square of that division is quadratic. Drop independence and the cross
        terms come back, which is why correlated observations give an effective
        sample size smaller than the row count.
    - title: "Where the 1/√(2π) in the Gaussian comes from"
      latex: |
        Let $I = \int_{-\infty}^{\infty} e^{-x^2/2}\,dx$. Then
        $$I^2 = \int_{-\infty}^{\infty}\!\int_{-\infty}^{\infty}
          e^{-(x^2+y^2)/2}\,dx\,dy
          = \int_0^{2\pi}\!\int_0^{\infty} e^{-r^2/2}\,r\,dr\,d\theta
          = 2\pi \left[-e^{-r^2/2}\right]_0^{\infty} = 2\pi.$$
        So $I = \sqrt{2\pi}$ and $\frac{1}{\sqrt{2\pi}} e^{-x^2/2}$ integrates to 1.
      prose: >-
        The constant is not a convention — it is the circumference of the circle
        showing up because $x^2 + y^2$ is a radius. That is also why the
        multivariate normal's normaliser involves $\det \Sigma$: the linear map
        that turns a sphere into the covariance ellipsoid scales volume by
        $|\det \Sigma|^{1/2}$.
    - title: "Why skewness decays as 1/√n and kurtosis as 1/n"
      latex: |
        Cumulants are additive over independent variables, so for
        $S_n = \sum_{i=1}^n X_i$ we have $\kappa_r(S_n) = n\,\kappa_r(X)$. The
        standardized variable $Z_n = (S_n - n\mu)/(\sigma\sqrt{n})$ scales
        cumulants by $(\sigma\sqrt{n})^{-r}$, hence
        $$\kappa_r(Z_n) = \frac{n\,\kappa_r(X)}{\sigma^r n^{r/2}}
          = \frac{\kappa_r(X)}{\sigma^r\, n^{(r-2)/2}}.$$
        For $r = 3$ that is $\gamma_1/\sqrt{n}$; for $r = 4$ it is $\gamma_2/n$.
      prose: >-
        Every cumulant above the second decays, and the third decays slowest.
        That is why skewness — not variance — sets the pace at which a sum starts
        looking Gaussian, and why a distribution with $\gamma_1 = 6$ needs
        roughly $3600\times$ the data of one with $\gamma_1 = 0.1$ to reach the
        same skewness in its mean.

  implementations:
    - language: python
      title: "Densities in log space, and a check of the 68–95–99.7 rule"
      note: >-
        The naive version of this is numerically wrong, not merely slower: the
        PDF at $x = 40$ underflows to exactly 0.0 in float64, so a
        product-based likelihood returns $-\infty$ and a product-based acceptance
        ratio returns 0/0. Work in logs and add, never multiply. The empirical
        check at the bottom is the honest way to confirm a sampler produces what
        it claims.
      code: |
        import math
        import numpy as np

        def normal_logpdf(x, mu=0.0, sigma=1.0):
            """log N(x; mu, sigma^2), stable for |x - mu| >> sigma.

            At x = 40 under the standard normal this returns -800.9189, while
            exp(-800) underflows to 0.0 -- so a likelihood built as a product of
            pdfs is exactly zero and its log is -inf. Always accumulate logs.
            """
            z = (x - mu) / sigma
            return -0.5 * z * z - math.log(sigma) - 0.5 * math.log(2.0 * math.pi)

        def normal_cdf(x, mu=0.0, sigma=1.0):
            """Phi((x - mu)/sigma) via erf, accurate to about 1e-16."""
            return 0.5 * (1.0 + math.erf((x - mu) / (sigma * math.sqrt(2.0))))

        def coverage_check(n=200_000, seed=0):
            """Confirm a sampler reproduces 68.27 / 95.45 / 99.73 percent."""
            rng = np.random.default_rng(seed)
            x = rng.normal(3.0, 2.0, n)
            return [(k, float(np.mean(np.abs(x - 3.0) <= k * 2.0)),
                     2 * normal_cdf(k) - 1) for k in (1, 2, 3)]

        # 1 sigma: 0.682 vs 0.683 | 2 sigma: 0.9545 vs 0.9545 | 3 sigma: 0.9971 vs 0.9973
    - language: python
      title: "Measuring the CLT's error, and a bootstrap that tells the truth"
      note: >-
        The first function is exact — no simulation — because the sum of $n$
        Bernoulli(p) variables is binomial and its CDF is a finite sum. The
        second is numerically misleading in a specific and instructive way: on
        Cauchy data it returns a standard error of about 1.5 for the mean of 500
        samples, exactly as wide as a single observation. It is not broken; the
        mean is.
      code: |
        import math
        import numpy as np

        def clt_sup_error(n, p=0.5):
            """sup_x |F_n(x) - Phi(x)| for the standardized binomial mean.

            Exact, via the binomial CDF with a continuity correction: ~0.0017 at
            n=16 and ~0.0003 at n=100 for p=0.5.
            """
            mu, sd = n * p, math.sqrt(n * p * (1.0 - p))
            cdf, worst = 0.0, 0.0
            for k in range(n + 1):
                cdf += math.comb(n, k) * p ** k * (1.0 - p) ** (n - k)
                x = (k + 0.5 - mu) / sd          # continuity correction
                worst = max(worst, abs(cdf - 0.5 * (1.0 + math.erf(x / math.sqrt(2.0)))))
            return worst

        def bootstrap_se(x, n_boot=2000, seed=0):
            """Standard error of the mean by resampling. No CLT required."""
            rng = np.random.default_rng(seed)
            x = np.asarray(x, dtype=float)
            idx = rng.integers(0, x.size, size=(n_boot, x.size))
            return float(x[idx].mean(axis=1).std(ddof=1))

        # On N(0,1) data with n=500: bootstrap 0.0407 vs sigma/sqrt(n) 0.0409.
        # On standard Cauchy with n=500: bootstrap ~1.49, the same as one draw.

  checkpoints:
    - id: cp-1
      question: "You have $\\sigma = 15$ and $n = 100$. What is the standard error, and how many samples do you need to halve it?"
      answerKind: short_text
      hint: "The standard error goes as $1/\\sqrt{n}$, so halving it needs four times the data."
      solution: >-
        $15/\sqrt{100} = 1.5$. To reach $0.75$ you need $n = 400$, because
        $\sqrt{400} = 20$ and $15/20 = 0.75$. Precision is bought in square
        roots: 4x the data for 2x the precision, 100x the data for 10x.
    - id: cp-2
      question: "Your anomaly detector fires at 4.5σ on a million-row table and flags 3 rows. Is the model broken?"
      answerKind: short_text
      hint: "Compute the expected count under the null before interpreting the count you saw."
      solution: >-
        Two-sided Gaussian mass beyond 4.5σ is $6.8\times10^{-6}$, so a million
        rows should produce about $6.8$ flags. Three is *below* expectation —
        this is not evidence of anything, and certainly not of a broken model.
        The same table at 5σ would expect $0.57$ flags, and 3 there would be a
        2% event: worth a look, not a rewrite.
    - id: cp-3
      question: "Why is the mean of 10,000 Cauchy samples no more precise than a single sample?"
      answerKind: short_text
      hint: "The CLT needs a finite variance. What happens to the characteristic function of the mean when the variance does not exist?"
      solution: >-
        A standard Cauchy has no finite mean or variance, so the CLT's hypothesis
        fails outright. The characteristic function of the mean of $n$ draws is
        $e^{-|t|}$, the same as one draw's, so the sample mean is standard Cauchy
        for every $n$: $P(\lvert \bar X \rvert > 10) = 6.35\%$ at $n = 10{,}000$ exactly as
        at $n = 1$. Averaging does nothing at all.
    - id: cp-4
      question: "For $\\Sigma = [[4, 3], [3, 4]]$, describe the 1σ contour. Where does Euclidean distance to the mean mislead you?"
      answerKind: short_text
      hint: "Eigendecompose the covariance: the semi-axes are the square roots of the eigenvalues, along the eigenvectors."
      solution: >-
        Eigenvalues 7 and 1, along $(1,1)/\sqrt{2}$ and $(1,-1)/\sqrt{2}$. The
        1σ contour is an ellipse with semi-axes $\sqrt{7} = 2.646$ and $1$, so
        it is nearly three times longer than it is wide. Euclidean distance treats
        a point 2.5 units out along the long axis (Mahalanobis $2.5/2.646 = 0.94$)
        as more extreme than a point 1.5 units out along the short axis
        (Mahalanobis $1.5$), which is backwards.
    - id: cp-5
      question: "A colleague reports mean revenue of 42 dollars with a standard deviation of 18 dollars, at n = 1,000. What is the actual uncertainty on the mean, and by how much is the report wrong?"
      answerKind: short_text
      hint: "Divide by $\\sqrt{n}$, then compare the two numbers."
      solution: >-
        The standard error is $18/\sqrt{1000} = 0.57$, so the honest statement is
        $42 \pm 1.1$ at 95%. The reported $\pm 18$ is 32 times too wide. This is
        the most common error in applied statistics because both numbers carry the
        word "standard" and only one of them shrinks when you collect more data.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A number computed from a sample is itself random. The object you are
        missing is the *sampling distribution* — what that number would look like
        across repeated experiments. The CLT says it is approximately Gaussian
        when the underlying variance is finite, with a width that shrinks as
        $1/\sqrt{n}$. Everything else in this topic is either a way to compute
        that width or a way to check whether the Gaussian shape is a fair
        description.
      blocks:
        - kind: checklist
          body: |
            - The estimate is one draw from the sampling distribution
            - Its width is the standard error, not the standard deviation
            - Width shrinks as 1/sqrt(n) — precision is bought in square roots
            - The Gaussian shape is an approximation whose error is O(1/sqrt(n))
            - The approximation is governed by skewness and dies with infinite variance
      checkpoint: >-
        Before reading on: if you doubled your sample and the reported error bar
        fell by a factor of four, what would that tell you about which quantity
        was being reported?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Three steps, in this order, and the third is the one people skip. First
        compute the estimator and its standard error. Second compute the sample
        skewness (or just look at a histogram) to see whether the normal
        approximation has any business being used at this $n$. Third, if the shape
        is doubtful, bootstrap the estimator instead of trusting the formula — and
        if the bootstrap interval is dominated by one or two points, the answer is
        "the mean is not a stable summary", not a wider interval.
      blocks:
        - kind: checklist
          body: |
            - Estimate: the statistic, in the units of the decision
            - Standard error: sigma/sqrt(n) for a mean, sqrt(p(1-p)/n) for a rate
            - Shape check: skewness, histogram, running mean
            - Interval: normal quantiles if the shape check passes, bootstrap if not
            - Sanity: does the interval width scale as 1/sqrt(n) when you subsample?
      checkpoint: >-
        Why is a *bootstrap* the right second tool rather than a bigger sample?
        What does the bootstrap give you that more data would not, at least not
        this week?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The whole procedure is a dozen lines. Writing it out makes clear that
        there is no step at which "assume normality" is free.
      blocks:
        - kind: pseudocode
          body: |
            def summarise(x):
                n      = len(x)
                mean   = sum(x) / n
                sigma  = sqrt(sum((xi - mean)^2 for xi in x) / (n - 1))
                se     = sigma / sqrt(n)                 # Bessel: n-1 above

                skew   = mean((xi - mean)^3 for xi in x) / sigma^3

                if abs(skew) < 0.5 and n >= 30:
                    lo, hi = mean - 1.96 * se, mean + 1.96 * se
                else:
                    lo, hi = percentile(bootstrap_means(x, 2000), [2.5, 97.5])

                return mean, se, (lo, hi), skew
      checkpoint: >-
        The threshold `abs(skew) < 0.5` is a judgement call, not a theorem. What
        would you look at to decide whether it is the right threshold for your
        data?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Two pieces of algebra carry the whole topic: why the standard error is
        $\sigma/\sqrt{n}$, and why the shape converges at the rate it does.
      blocks:
        - kind: math
          body: |
            Independence removes the cross terms in the variance of a sum:
            $$\operatorname{Var}(\bar X) = \frac{1}{n^2}\sum_i \operatorname{Var}(X_i) = \frac{\sigma^2}{n},
              \qquad \operatorname{se} = \frac{\sigma}{\sqrt{n}}.$$

            Cumulants add over independent variables, so
            $\kappa_r(S_n) = n\kappa_r(X)$, and standardizing divides by
            $(\sigma\sqrt{n})^r$:
            $$\kappa_r(Z_n) = \frac{\kappa_r(X)}{\sigma^r n^{(r-2)/2}}
              \;\Rightarrow\; \text{skew}(Z_n) = \frac{\gamma_1}{\sqrt{n}}, \quad
              \text{exkurt}(Z_n) = \frac{\gamma_2}{n}.$$

            Berry–Esseen converts the third moment into a uniform bound:
            $$\sup_x \lvert F_n(x) - \Phi(x) \rvert \le \frac{0.4748\,E\lvert X-\mu \rvert^3}{\sigma^3\sqrt{n}}.$$
      checkpoint: >-
        The bound depends on $E\lvert X-\mu \rvert^3/\sigma^3$, which is scale-free. What does
        that tell you about whether standardising your data changes how quickly
        the CLT applies?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete summariser: estimate, standard error, shape check, and an
        interval that knows which regime it is in.
      blocks:
        - kind: warning
          body: >-
            Read the shape check before the interval. A tight interval around a
            meaningless centre is the most damaging output in statistics, because
            it looks like precision.
        - kind: code
          language: python
          body: |
            import math
            import numpy as np

            def summarise(x, n_boot=2000, seed=0):
                x = np.asarray(x, dtype=float)
                n = x.size
                mean = float(x.mean())
                sigma = float(x.std(ddof=1))          # Bessel's correction
                se = sigma / math.sqrt(n)

                z = (x - mean) / sigma
                skew = float(np.mean(z ** 3))
                exkurt = float(np.mean(z ** 4) - 3.0)

                method = "normal"
                if n < 30 or abs(skew) > 0.5:
                    method = "bootstrap"
                    rng = np.random.default_rng(seed)
                    idx = rng.integers(0, n, size=(n_boot, n))
                    means = x[idx].mean(axis=1)
                    lo, hi = np.percentile(means, [2.5, 97.5])
                else:
                    lo, hi = mean - 1.96 * se, mean + 1.96 * se

                # A running mean that has not settled invalidates every number
                # above it. Subsample the prefix means rather than all n of them.
                step = max(1, n // 20)
                running = np.array([x[:i].mean() for i in range(step, n + 1, step)])

                return {
                    "mean": mean, "se": se, "ci": (float(lo), float(hi)),
                    "skew": skew, "exkurt": exkurt, "method": method,
                    "running_spread": float(running.max() - running.min()),
                }
      checkpoint: >-
        `running_spread` is a crude stationarity check: the range of the running
        mean over the sample. For a well-behaved mean it shrinks as $1/\sqrt{n}$;
        for a Cauchy it stays flat. What would you do with a metric whose running
        mean does not shrink?

  problems:
    - id: p-log-likelihood
      title: "Gaussian log-likelihood without underflow"
      difficulty: easy
      prompt: >-
        Implement `log_likelihood(xs, mu, sigma)` returning the total log density
        $\sum_i \log \mathcal{N}(x_i; \mu, \sigma^2)$. Return `0.0` for an empty
        list, and raise `ValueError` if `sigma <= 0`. It must stay finite for
        values far from the mean — `[40.0, -40.0]` is a test case, and a
        product-of-densities implementation returns `-inf` there because
        $\exp(-800)$ underflows to zero in float64.
      starter: |
        import math

        def log_likelihood(xs, mu, sigma):
            # your implementation here
            pass
      language: python
      entry: log_likelihood
      testCases:
        - input: '{"xs": [0.0, 1.0, -1.0], "mu": 0.0, "sigma": 1.0}'
          expected: "-3.756815599614018"
          mode: json
          tolerance: 1e-12
        - input: '{"xs": [2.0, 4.0], "mu": 3.0, "sigma": 2.0}'
          expected: "-3.474171427529236"
          mode: json
          tolerance: 1e-12
        - input: '{"xs": [0.0], "mu": 0.0, "sigma": 10.0}'
          expected: "-3.2215236261987186"
          mode: json
          tolerance: 1e-12
        - input: '{"xs": [40.0, -40.0], "mu": 0.0, "sigma": 1.0}'
          expected: "-1601.8378770664094"
          mode: json
          tolerance: 1e-12
        - input: '{"xs": [], "mu": 0.0, "sigma": 1.0}'
          expected: "0.0"
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def log_likelihood(xs, mu, sigma):
            if sigma <= 0:
                raise ValueError("sigma must be positive")
            n = len(xs)
            if n == 0:
                return 0.0
            # log N(x) = -log(sigma) - 0.5*log(2*pi) - (x-mu)^2 / (2*sigma^2)
            const = -math.log(sigma) - 0.5 * math.log(2.0 * math.pi)
            sq = sum((float(x) - mu) ** 2 for x in xs)
            return const * n - sq / (2.0 * sigma * sigma)
      solutionExplanation: >-
        Adding logs replaces a product of densities, so the result stays finite
        where the product underflows: at $x = 40$ the density is $e^{-800.9}$,
        which is exactly 0.0 in float64, while its log is $-800.9189$ and sums
        fine. The constant term is factored out of the loop because it is
        identical for every observation — at $n = 100{,}000$ that is 100,000
        avoided `log` calls. The guards are not decoration: a zero `sigma` divides
        by zero, and an empty list has no density to multiply, so the conventional
        answer is 0.0, the log of an empty product.
      complexity: "O(n) time, O(1) space"
      tags: [gaussian, log-likelihood, numerical-stability]

    - id: p-kl-gaussians
      title: "KL divergence between two univariate Gaussians"
      difficulty: medium
      prompt: >-
        Implement `kl_gaussians(mu1, sigma1, mu2, sigma2)` returning
        $D_{\mathrm{KL}}(\mathcal{N}_1 \,\|\, \mathcal{N}_2)$ in nats. Use the
        closed form — there is no integral to approximate:
        $\log\frac{\sigma_2}{\sigma_1} + \frac{\sigma_1^2 + (\mu_1-\mu_2)^2}{2\sigma_2^2} - \frac{1}{2}$.
        The result must be 0.0 when the two distributions are identical, and
        should never be negative for valid inputs.
      starter: |
        import math

        def kl_gaussians(mu1, sigma1, mu2, sigma2):
            # your implementation here
            pass
      language: python
      entry: kl_gaussians
      testCases:
        - input: '{"mu1": 0.0, "sigma1": 1.0, "mu2": 0.0, "sigma2": 1.0}'
          expected: "0.0"
          mode: json
          tolerance: 1e-12
        - input: '{"mu1": 0.0, "sigma1": 1.0, "mu2": 1.0, "sigma2": 1.0}'
          expected: "0.5"
          mode: json
          tolerance: 1e-12
        - input: '{"mu1": 0.0, "sigma1": 1.0, "mu2": 0.0, "sigma2": 2.0}'
          expected: "0.3181471805599453"
          mode: json
          tolerance: 1e-12
        - input: '{"mu1": 1.0, "sigma1": 2.0, "mu2": 0.0, "sigma2": 1.0}'
          expected: "1.3068528194400546"
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def kl_gaussians(mu1, sigma1, mu2, sigma2):
            if sigma1 <= 0 or sigma2 <= 0:
                raise ValueError("sigmas must be positive")
            return (math.log(sigma2 / sigma1)
                    + (sigma1 * sigma1 + (mu1 - mu2) ** 2) / (2.0 * sigma2 * sigma2)
                    - 0.5)
      solutionExplanation: >-
        Two Gaussians differing only by a shift of one standard deviation are 0.5
        nats apart. Widening the second from $\sigma = 1$ to $\sigma = 2$ at the
        same mean costs $\log 2 - 0.375 = 0.318$ nats, because KL charges for mass
        the first distribution puts where the second has little. The asymmetry is
        the point: this measures the cost of encoding samples from
        $\mathcal{N}_1$ with a code built for $\mathcal{N}_2$, so swapping the
        arguments changes the answer. The result depends only on the mean
        difference, which is why adding a constant to both means changes nothing.
      complexity: "O(1) time, O(1) space"
      tags: [gaussian, kl-divergence, information-theory]

    - id: p-sample-size
      title: "How many samples buy a given margin"
      difficulty: medium
      prompt: >-
        Implement `n_for_margin(margin, sigma, z)` returning the smallest integer
        $n$ such that the standard error $z\sigma/\sqrt{n}$ is at most `margin`,
        i.e. $n = \lceil (z\sigma/\text{margin})^2 \rceil$. Round *up* — a margin
        is a hard requirement, so 384.16 needs 385 samples — and return at least
        1. Guard against floating-point representation error before taking the
        ceiling.
      starter: |
        import math

        def n_for_margin(margin, sigma, z):
            # your implementation here
            pass
      language: python
      entry: n_for_margin
      testCases:
        - input: '{"margin": 1.0, "sigma": 10.0, "z": 1.96}'
          expected: "385"
          mode: json
          tolerance: 1e-12
        - input: '{"margin": 0.1, "sigma": 15.0, "z": 1.96}'
          expected: "86436"
          mode: json
          tolerance: 1e-12
        - input: '{"margin": 2.0, "sigma": 10.0, "z": 1.0}'
          expected: "25"
          mode: json
          tolerance: 1e-12
        - input: '{"margin": 0.5, "sigma": 1.0, "z": 2.576}'
          expected: "27"
          mode: json
          tolerance: 1e-12
      solution: |
        import math

        def n_for_margin(margin, sigma, z):
            if margin <= 0 or sigma <= 0:
                raise ValueError("margin and sigma must be positive")
            raw = (z * sigma / margin) ** 2
            # The subtractive guard is deliberate: (1.96*15/0.1)**2 evaluates to
            # 86435.99999999997, so a bare ceil can land one sample off when the
            # true requirement is an exact integer.
            return max(1, math.ceil(raw - 1e-9))
      solutionExplanation: >-
        Inverting the standard error is the most useful arithmetic in experimental
        design: measuring a mean to within 0.1 with $\sigma = 15$ at 95%
        confidence needs $n = (1.96 \times 15 / 0.1)^2 = 86{,}436$, which is why
        precise estimates are a budget question rather than a technical one. Two
        details are load-bearing. The ceiling is not optional — 384.16 samples do
        not exist, and rounding down silently fails the requirement. And the
        $10^{-9}$ guard matters because float64 evaluates
        $(1.96 \times 15/0.1)^2$ as `86435.99999999997`; a bare `ceil` gets the
        right answer here, but the same expression can land just above an integer
        and cost you one sample in the other direction. One extra sample is cheap;
        an off-by-one in a power calculation is not.
      complexity: "O(1) time, O(1) space"
      tags: [sample-size, standard-error, power]

  try_it: >-
    Draw 10,000 samples from an exponential (skewness 2) and compute the skewness
    of the standardised mean at $n = 30$ and $n = 1000$ — you should see about
    $0.365$ and $0.063$, which is $2/\sqrt{n}$. Then look up the two-sided Gaussian
    tail mass beyond $2\sigma$ and $5\sigma$ and compare your memory with
    $4.55\%$ and $5.7 \times 10^{-7}$.
  interview_questions:
    - question: "Why is the standard error $\\sigma/\\sqrt{n}$ and not $\\sigma/n$?"
      level: mid
      key_points:
        - "Independence makes variances add, so $\\operatorname{Var}(\\bar X) = \\sigma^2/n$ and the standard deviation — the thing you report — is $\\sigma/\\sqrt{n}$."
        - "It is a square-root law: with $\\sigma = 15$, $n = 100$ gives a standard error of 1.5, and reaching 0.5 needs $n = 900$ — nine times the data for a third of the width."
        - "The standard deviation describes the data; the standard error describes the estimate, and confusing them overstates precision by $\\sqrt{n}$."
        - "Four times the data buys half the interval, which is why small gains in precision are expensive and A/B test durations are set by arithmetic, not patience."
      follow_up: "Your metric is a ratio of two random quantities, not a mean. What happens to the $1/\\sqrt{n}$ rate?"
    - question: "A colleague wants to average 10,000 samples from a Cauchy distribution and quote a confidence interval from the CLT. What is wrong?"
      level: senior
      key_points:
        - "The CLT's hypothesis is finite variance; the Cauchy has none, so there is no $\\sigma$ to put in the denominator and no $1/\\sqrt{n}$ contraction."
        - "The mean of $n$ standard Cauchy draws is standard Cauchy for every $n$: averaging 10,000 leaves $P(|\\bar X| > 10) = 6.35\\%$, identical to a single draw."
        - "Berry–Esseen quantifies the Gaussian approximation error as $0.4748\\rho/(\\sigma^3\\sqrt{n})$ with $\\rho = E|X-\\mu|^3$, so an infinite third moment gives no bound at all."
        - "The diagnostic is empirical: heavy tails in a log-log survival plot, or a bootstrap interval that does not shrink as $n$ grows."
      follow_up: "Which estimator would you use instead, and what does it converge to for a Cauchy?"
    - question: "For $\\Sigma = [[4, 3], [3, 4]]$, what do the eigenvalues tell you about the shape of the Gaussian?"
      level: mid
      key_points:
        - "The eigenvalues 7 and 1 are the variances along the eigenvector directions, so the level sets are ellipses with axis ratio $\\sqrt{7}$."
        - "The condition number $\\lambda_{\\max}/\\lambda_{\\min} = 7$ is the elongation, which is why sampling or inverting in that basis is well behaved while doing it in the original coordinates is not."
        - "Mahalanobis distance $(x-\\mu)^\\top\\Sigma^{-1}(x-\\mu)$ is the coordinate system in which the ellipsoid becomes a unit ball."
        - "The Gaussian is the maximum-entropy distribution with that mean and covariance — $H = \\tfrac12\\log(2\\pi e\\,\\sigma^2)$, so at $\\sigma = 1$ it is 1.4189 nats — which is why it is the default rather than a claim about your data."
  common_mistakes:
    - "Quoting the sample standard deviation as the standard error of the mean, overstating precision by $\\sqrt{n}$ — a factor of 100 at $n = 10{,}000$."
    - "Applying 2σ intuition at 5σ: the two-sided mass falls from 4.55% to $5.7\\times10^{-7}$, so tail behaviour calibrated on a handful of outliers is wrong by orders of magnitude."
    - "Assuming a large enough sample rescues any average, when the CLT's finite-variance hypothesis is what makes the sample size matter in the first place."
