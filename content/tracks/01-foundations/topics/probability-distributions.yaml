id: probability-distributions
slug: probability-distributions
title: "Why Averages Turn Gaussian, and the Cases Where They Do Not"
summary: >-
  Turn a single number computed from a sample into a distribution you can
  defend — knowing exactly how fast averages concentrate, where the Gaussian
  approximation stops being true, and how much data buys how much precision.
kind: lesson
difficulty: medium
position: 5
estMinutes: 23
prerequisites: [vectors-and-geometry]
phase: mathematical-foundations
tags: [probability, distributions, central-limit-theorem, uncertainty, gaussian]

body:
  big_idea: >-
    An average of independent draws is almost Gaussian at rate $1/\sqrt{n}$, with error
    set by skewness and finite variance — which is what turns one noisy measurement into
    a defensible error bar.

  problem:
    - "Your A/B test says B converts 2% better on 10,000 users per arm, and \"it looks higher\" will not survive a launch review."
    - "Your minibatch loss is too noisy to tell whether an hour-old change helped. The noise is $\\sigma/\\sqrt{B}$, which tells you what batch size to buy."
    - "Your 4$\\sigma$ anomaly detector fires three times a day on healthy traffic: the distributional assumption or the threshold arithmetic is wrong."

  analogy: |
    A Galton board is the theorem made physical. Each peg is one Bernoulli draw;
    row after row adds more, and the pile settles into a bell, each extra row
    narrowing the relative spread by $\sqrt{2}$. Each peg is a source of
    independent noise — a user, a batch, a measurement — the bin is your sample
    mean, and the bell's width is the standard error.

  concept_points:
    - "**Expectation is linear with no assumptions; variance only adds under independence.** $E[X+Y] = E[X]+E[Y]$ always, but $\\operatorname{Var}(X+Y) = \\operatorname{Var}X + \\operatorname{Var}Y + 2\\operatorname{Cov}(X,Y)$. Two assets with $\\sigma = 20\\%$ each and correlation $0.6$ have portfolio sd $\\sqrt{0.04+0.04+2(0.6)(0.04)} = 35.8\\%$, not $28.3\\%$. The difference between a correct and an overconfident error bar lives in that covariance term."
    - "**The mean's variance falls as $\\sigma^2/n$, so its standard deviation falls as $\\sigma/\\sqrt{n}$.** With $\\sigma = 15$ and $n = 100$ the standard error is 1.5; reaching 0.5 needs $n = 900$ — nine times the data for a third of the width. Mini-batch gradients obey the same algebra: batch 32 to 256 divides noise by $\\sqrt{8} = 2.83$, not 8."
    - "**The CLT says the standardized sum converges to $\\mathcal{N}(0,1)$, and how fast: CDF error is $O(1/\\sqrt{n})$, governed by the third moment.** Berry–Esseen gives $\\sup_x|F_n(x) - \\Phi(x)| \\le 0.4748\\rho/(\\sigma^3\\sqrt{n})$. Measured against the exact binomial: $0.0062$ at $n=4$, $0.00165$ at $n=16$, $0.00027$ at $n=100$ — halving each time $n$ quadruples."
    - "**The shape converges through the cumulants: skewness of the standardized sum is $\\gamma_1/\\sqrt{n}$ and excess kurtosis is $\\gamma_2/n$.** For an exponential ($\\gamma_1 = 2$, $\\gamma_2 = 6$) the mean at $n=30$ still carries skewness $0.365$. A log-normal with $\\sigma=1$ has $\\gamma_1 = 6.18$, so at $n=30$ its skewness is $1.13$ — as skewed as one exponential."
    - "**The tail is not linear, and every intuition calibrated at 2σ fails at 5σ.** Two-sided Gaussian mass: $4.55\\%$ beyond 2σ, $0.27\\%$ beyond 3σ, $6.3\\times10^{-5}$ beyond 4σ, $5.7\\times10^{-7}$ beyond 5σ. Per million rows you expect 63 flags at 4σ and 0.57 at 5σ. \"2σ is 5%, so 4σ is 2.5%\" is wrong by a factor of 400."
    - "**The CLT's hypothesis is finite variance, and losing it is not a technicality.** For a standard Cauchy the mean of $n$ samples is standard Cauchy for *every* $n$: averaging 10,000 leaves $P(|\\bar X| > 10) = 6.35\\%$, identical to a single draw. Anything with Pareto tail index $\\alpha \\le 2$ — incomes, file sizes — behaves the same, and $\\sigma/\\sqrt{n}$ becomes a meaningless interval."

  definitions:
    - term: "Random variable"
      meaning: >-
        A function from outcomes to numbers. What matters is not the outcome but
        the induced distribution over values, which is all any estimator ever
        sees.
    - term: "PMF / PDF"
      meaning: >-
        Probability mass function for discrete variables (a probability per
        value); probability density function for continuous ones (a probability
        per unit of $x$, which may exceed 1). Both integrate or sum to 1.
    - term: "CDF"
      meaning: >-
        $F(x) = P(X \le x)$. The universal description: it exists for every
        distribution, is monotone and right-continuous, and its empirical version
        converges uniformly at $1/\sqrt{n}$ without any moment assumption.
    - term: "iid"
      meaning: >-
        Independent and identically distributed. Independence gives you
        $\operatorname{Var}(\sum X_i) = \sum \operatorname{Var}(X_i)$;
        identical distribution gives you one $\sigma$ to reason with. Both are
        assumptions, and the first one is the one that quietly fails in practice.
    - term: "Standard error"
      meaning: >-
        The standard deviation of an estimator's sampling distribution. For a
        mean of $n$ iid draws it is $\sigma/\sqrt{n}$, estimated by
        $s/\sqrt{n}$. It shrinks with data; $\sigma$ does not.
    - term: "Central limit theorem"
      meaning: >-
        For iid $X_i$ with mean $\mu$ and finite variance $\sigma^2$,
        $\sqrt{n}(\bar X - \mu)/\sigma$ converges in distribution to
        $\mathcal{N}(0,1)$, with CDF error $O(1/\sqrt{n})$.
    - term: "Berry–Esseen bound"
      meaning: >-
        A non-asymptotic rate: $\sup_x \lvert F_n(x) - \Phi(x) \rvert \le
        0.4748\,E\lvert X-\mu \rvert^3/(\sigma^3\sqrt{n})$. Honest but pessimistic — it
        needs roughly twenty times the sample size that practice does.
    - term: "Skewness"
      meaning: >-
        $\gamma_1 = E[(X-\mu)^3]/\sigma^3$, the standardized third moment. It is
        the leading term in the CLT's error, and it decays as $\gamma_1/\sqrt{n}$
        under averaging.
    - term: "Excess kurtosis"
      meaning: >-
        $\gamma_2 = E[(X-\mu)^4]/\sigma^4 - 3$, zero for a Gaussian. It controls
        how much of the tail survives averaging, decays as $\gamma_2/n$, and is
        the reason a heavy-tailed sample mean needs orders of magnitude more data
        than a symmetric one.
    - term: "Heavy tail"
      meaning: >-
        A distribution whose tail decays slower than exponentially — Pareto with
        index $\alpha$, Cauchy, log-normal. When $\alpha \le 2$ the variance is
        infinite, and the CLT does not apply at any sample size.
    - term: "Mahalanobis distance"
      meaning: >-
        $d(x) = \sqrt{(x-\mu)^\top \Sigma^{-1} (x-\mu)}$: Euclidean distance
        after whitening. Its square is $\chi^2_d$ for Gaussian data, which is
        what turns a contour into a calibrated probability.
    - term: "Bessel's correction"
      meaning: >-
        Dividing by $n-1$ instead of $n$ when estimating variance, because the
        deviations are measured from the sample mean, which has already absorbed
        one degree of freedom. Without it, $E[s^2] = \sigma^2 (n-1)/n$.
    - term: "Sampling distribution"
      meaning: >-
        The distribution of an estimator over repeated samples of size $n$. It is
        a property of the *procedure*, not of your dataset, and it is the thing
        an error bar is a summary of.

