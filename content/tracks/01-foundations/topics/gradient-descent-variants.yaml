id: gradient-descent-variants
slug: gradient-descent-variants
title: "Momentum, RMSprop, Adam: One Update Rule, Two Choices"
summary: >-
  Read any optimizer in one line of code, predict from the hyperparameters alone
  whether it will converge, oscillate, or stall — and diagnose the four failure
  modes that account for almost every "my training diverged" ticket.
kind: lesson
difficulty: medium
position: 9
estMinutes: 22
prerequisites: [convexity, matrix-calculus]
phase: mathematical-foundations
tags: [optimization, sgd, momentum, rmsprop, adam, adamw, lion, preconditioning, training]

body:
  big_idea: >-
    Every optimiser is $\theta \leftarrow \theta-\eta u_t$; the only differences are how
    $u_t$ averages the past and whether it divides by the gradient's own scale — and
    momentum buys $\sqrt{\kappa}$, never curvature.

  problem:
    - "You inherit a script that diverges at step 3,000, and your only opinion is a learning rate someone read in a blog post."
    - "Adam works on everything until a fine-tune plateaus, an embedding table decays to zero, or one bad batch costs 9,000 steps. One root cause."
    - "A 7B model in fp32 needs 26.1 GiB for weights, 26.1 for gradients, 52.2 for Adam state — half of that bill is a choice."

  analogy: |
    Think of a ball rolling down a valley. Plain gradient descent is a ball in
    thick honey: it moves immediately and stops the moment the slope flattens.
    Momentum gives the ball mass, so it carries speed through bumps and
    overshoots narrow valleys; RMSprop gives every axis its own brake, so a
    steep wall does not launch it sideways. Adam does both.

  concept_points:
    - "**One line, two knobs.** SGD: $u_t = g_t$. Momentum: $u_t = v_t$, $v_t = \\beta v_{t-1} + g_t$. RMSprop: $u_t = g_t/(\\sqrt{s_t}+\\epsilon)$. Adam: $u_t = \\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)$. Only two decisions separate them — how much past is averaged, and whether the step divides by the gradient's own scale."
    - "**Momentum is an EMA with steady-state gain $1/(1-\\beta)$.** A constant gradient $g$ drives $v_t \\to g/(1-\\beta)$, so the step is $\\eta/(1-\\beta)$ — exactly $10\\times$ at $\\beta=0.9$. Add `momentum=0.9` to a working recipe, keep `lr`, and the run blows up. The same average cuts gradient noise by $\\sqrt{(1-\\beta)/(1+\\beta)} = 0.229$, a $4.36\\times$ reduction."
    - "**Momentum buys $\\sqrt{\\kappa}$, not $\\kappa$.** On $\\tfrac12 x^\\top A x$ with $\\kappa = 10^4$, plain GD contracts by $0.9998$ and needs **69,078** steps; heavy-ball with $\\beta^\\star = 0.9608$ contracts by $0.9802$ and needs **691**. Momentum at $\\kappa = 10^4$ costs what plain GD costs at $\\kappa = 10^2$, for one extra tensor."
    - "**Adaptive methods turn the step into a length, not a multiple.** Cauchy–Schwarz gives $|\\hat m_i| \\le \\sqrt{\\hat v_i}$, so $|u_i| \\le 1$: each coordinate moves at most $\\eta$ per step. But the step cannot shrink either — as $g \\to 0$ the ratio stays at $\\pm 1$ until $\\epsilon$ takes over, so RMSprop with $\\eta L = 1$ orbits the optimum forever."
    - "**Bias correction is exactly $1-\\beta^t$, and it only matters at the start.** With $m_0 = 0$, $\\mathbb{E}[m_t] = (1-\\beta^t)\\mathbb{E}[g]$; at $t=1$ the raw step is ten times too small, so Adam's first update is exactly $\\eta\\operatorname{sign}(g)$. The $\\beta_2$ factor is slow: $1-0.999^t$ reaches only $0.632$ at $t=1000$."
    - "**Decoupled weight decay is not L2, and the difference is a factor of $\\sqrt{\\hat v}$.** Adding $\\lambda\\theta$ to the gradient and dividing by $\\sqrt{\\hat v}$ means a parameter with large historical gradients decays *less*: at $\\lambda = 0.01$ a weight with $|g| = 10^{-3}$ sees decay equal to 100% of its gradient, one at $|g| = 1$ sees 0.1%."

  definitions:
    - term: "Learning rate ($\\eta$)"
      meaning: >-
        The scale of the step. In SGD it multiplies the gradient, so its
        meaning depends on gradient magnitude. In Adam and Lion it is
        approximately a distance in parameter space per step, which is why the
        two are not interchangeable at the same numeric value.
    - term: "Heavy-ball momentum"
      meaning: >-
        Polyak's rule $v_t = \beta v_{t-1} + g_t$, $\theta \leftarrow \theta -
        \eta v_t$. The gradient is accumulated rather than applied, so the step
        depends on the recent history of gradients, not just the current one.
    - term: "Exponential moving average (EMA)"
      meaning: >-
        $y_t = \beta y_{t-1} + (1-\beta)x_t$, a running average whose weight on
        an observation $k$ steps old is $\beta^k$. Its effective memory is
        $1/(1-\beta)$ steps: 10 at $\beta = 0.9$, 1000 at $\beta = 0.999$.
    - term: "Second moment"
      meaning: >-
        The running average of squared gradients, $s_t = \beta_2 s_{t-1} +
        (1-\beta_2)g_t^2$, elementwise. Its square root is a per-coordinate
        estimate of gradient scale, and dividing by it is what makes a method
        adaptive.
    - term: "Bias correction"
      meaning: >-
        Dividing a zero-initialised EMA by $1-\beta^t$ so that its expectation
        equals the quantity being averaged. Without it, both of Adam's state
        variables start at zero and the first several steps are far too small.
    - term: "Diagonal preconditioner"
      meaning: >-
        Any update of the form $\theta \leftarrow \theta - \eta D^{-1} g$ with
        $D$ diagonal and positive. SGD has $D = I$, RMSprop and Adam have
        $D = \operatorname{diag}(\sqrt{\hat v}) + \epsilon I$, Lion effectively
        has $D = \operatorname{diag}(|g|)$. None of them can rotate.
    - term: "Epsilon ($\\epsilon$)"
      meaning: >-
        A numerical floor added to the denominator, $10^{-8}$ by default. It
        prevents division by zero and, less obviously, caps the maximum possible
        step: below $|g| \approx \epsilon$ the update scales linearly with the
        gradient again.
    - term: "Decoupled weight decay (AdamW)"
      meaning: >-
        Subtracting $\eta\lambda\theta$ from the parameter directly instead of
        adding $\lambda\theta$ to the gradient. The two differ whenever the
        update is normalised, because the coupled form is divided by
        $\sqrt{\hat v}$ and the decoupled form is not.
    - term: "Sign-based optimizer"
      meaning: >-
        A method whose update is $\pm\eta$ per coordinate, discarding gradient
        magnitude entirely (Lion, and signSGD before it). The update is bounded
        by $\eta$, so it is robust to spikes but cannot settle smoothly.
    - term: "Update-to-weight ratio"
      meaning: >-
        $\\|\\Delta\theta\\| / \\|\\theta\\|$ per layer, the practical diagnostic
        for whether the learning rate is sane. Healthy values sit near
        $10^{-3}$; a layer at $10^{-1}$ is about to diverge and one at $10^{-6}$
        has stopped learning.
    - term: "Gradient noise scale"
      meaning: >-
        $B_{\text{noise}} = \operatorname{tr}(\Sigma)/\\|G\\|^2$ for gradient
        covariance $\Sigma$ and true gradient $G$: the batch size at which
        gradient noise equals the signal. Below it, doubling the batch lets you
        raise the learning rate; above it, you are buying nothing.

