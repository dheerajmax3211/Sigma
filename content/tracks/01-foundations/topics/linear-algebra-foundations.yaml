  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Every decomposition in this module answers one question: **how do I make
        this matrix cheaper to act on?**

        A general $A \in \mathbb{R}^{n\times n}$ costs $O(n^2)$ per
        matrix-vector product and has no exploitable structure. If $A$ were
        diagonal, the same product would cost $O(n)$ — you would just scale
        each coordinate. So every factorisation here is a way of writing $A$
        as a product where one factor is diagonal (or triangular), and paying
        the $O(n^2)$ cost only once to change coordinates.

        That reframing gives you the whole map:
        - **Eigen-decomposition** $A = Q\Lambda Q^\top$ — works when $A$ is
          symmetric; $Q$ is a rotation, $\Lambda$ only scales.
        - **SVD** $A = U\Sigma V^\top$ — works for *any* matrix; $U$ and $V$ are
          rotations, $\Sigma$ only scales. It is the general case, and the
          eigen-decomposition is a special case of it.
        - **Cholesky** $A = LL^\top$ — works when $A$ is positive definite, and
          is the cheapest way to solve $Ax = b$.

        The thing to hold onto: the singular values $\sigma_i$ are *not*
        arbitrary. They are the eigenvalues of $A^\top A$ under a square
        root. That single fact is why PCA, the Eckart–Young theorem, and the
        condition number of a layer are all the same statement in different
        clothes.

        Before going further, be able to answer this in one sentence: *what
        problem does the SVD solve that the eigen-decomposition cannot?*
      blocks:
        - kind: math
          body: |
            $$A = U\Sigma V^\top,\qquad \Sigma = \operatorname{diag}(\sigma_1,\dots,\sigma_r)$$
            $$A^\top A = V\Sigma^2 V^\top \qquad\Longrightarrow\qquad \sigma_i^2 = \lambda_i(A^\top A)$$
      checkpoint: >-
        In one sentence: what is the single property of a matrix that decides
        whether you can eigendecompose it, and what do you fall back to when
        that property fails?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Now pick the technique. There are only four questions, and each has
        one right answer:

        **"I want to understand what a matrix does to directions."**
        → Find the eigen-decomposition. If $A$ is symmetric, use
        `numpy.linalg.eigh` (never `eig` — it returns arbitrary complex
        eigenvalues for symmetric input and does not guarantee orthogonality).
        If $A$ is not symmetric, look at $A^\top A$ instead: its eigenvectors
        are the right singular vectors.

        **"I want the best low-rank approximation."**
        → SVD, then truncate. Eckart–Young guarantees
        $\|A - A_k\|_F = \sqrt{\sum_{i>k}\sigma_i^2}$, and truncating the SVD
        *is* the best rank-$k$ approximation. There is no search involved.

        **"I want to project data onto its principal directions."**
        → PCA via SVD. Do **not** go through the covariance matrix: `PCA(covariance_eigh)`
        forms $X^\top X$, which squares the condition number and destroys
        small-variance directions on ill-conditioned data. Use
        `PCA(svd_solver='full')`.

        **"I want to solve $Ax = b$ and $A$ is symmetric positive definite."**
        → Cholesky: $A = LL^\top$, then forward/back substitution. $O(n^3)$ but
        with a constant roughly half of LU's, and it is numerically stable.

        A useful decision rule: **if you are not sure whether the matrix is
        symmetric, use the SVD.** It is always valid, always returns
        non-negative singular values, and its cost is the same order. The
        eigen-decomposition is the specialisation, not the general case.

        Two things to avoid, both of which look like micro-optimisations and
        are not:
        1. Forming $X^\top X$ to "save time" before an SVD. It costs an extra
           $O(np^2)$ and destroys accuracy.
        2. Explicitly inverting a matrix. `np.linalg.inv` is almost never what
           you want — solve the system instead. Inversion is numerically
           unstable and slower than a factorisation you then solve against.
      blocks:
        - kind: checklist
          body: |
            - Symmetric? → `eigh(A)`
            - Not sure / non-square / want low-rank? → `svd(A)`
            - SPD and solving a system? → `cholesky(A)`, then solve
            - Feature matrix for PCA? → `svd(X)`, never `X.T @ X`
            - Need `A⁻¹b`? → Solve. Never invert.
      checkpoint: >-
        You have a design matrix `X` of shape `(20000, 500)` whose columns have
        wildly different scales. Which single call do you make to get the
        principal components, and which one do you explicitly avoid?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Here are the three skeletons you will write by hand. Get the structure
        right first; the syntax is easy.

        **Power iteration** (dominant eigenpair of a symmetric matrix):

        ```
        v ← arbitrary unit vector
        λ ← 0
        repeat:
            w ← A · v                 # one matrix-vector product
            if ‖w‖ ≈ 0: stop         # A is essentially zero
            v ← w / ‖w‖              # renormalise
            λ_new ← vᵀ A v           # Rayleigh quotient
            if |λ_new − λ| < tol: break
            λ ← λ_new
        return (v, λ)
        ```

        Note the invariant: after each step, `v` is a unit vector and `λ` is
        its Rayleigh quotient, so `λ` is always an *estimate* of an eigenvalue
        of `A` even when `v` is not yet an eigenvector.

        **SVD-based PCA:**

        ```
        μ ← column_means(X)              # centring is not optional
        Xc ← X − μ
        (U, S, Vt) ← svd(Xc)
        components ← Vt[0:k]              # rows are the principal directions
        ratios ← S[0:k]² / sum(S²)
        return (μ, components, ratios)
        ```

        **Ridge regression without inverting:**

        ```
        A ← [ X ; √λ · I ]               # stack √λ·I rows underneath X
        b ← [ y ; 0 ]
        w ← least_squares_solve(A, b)     # never form (XᵀX + λI)⁻¹
        return w
        ```

        The ridge trick is worth internalising: appending $\sqrt{\lambda}I$
        to $X$ and $\mathbf{0}$ to $y$ produces a least-squares problem whose
        normal equations are *exactly* the ridge equations. You get the
        answer without ever forming or inverting the penalised Gram matrix.
      blocks:
        - kind: pseudocode
          body: |
            function power_iteration(A, tol):
                v ← unit_vector(dim(A))
                λ ← 0
                while true:
                    w ← A · v
                    if ‖w‖ < ε: return (0, 0)
                    v ← w / ‖w‖
                    λ_new ← vᵀ A v
                    if |λ_new − λ| < tol: return (v, λ_new)
                    λ ← λ_new
      checkpoint: >-
        In the power-iteration skeleton, why do we compute the Rayleigh
        quotient `vᵀAv` *after* renormalising `v` rather than reusing `‖w‖`?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        **Where the SVD comes from.** Start from $A^\top A$. It is symmetric
        positive semi-definite, because for any $x$,
        $x^\top A^\top A x = \|Ax\|^2 \ge 0$. By the spectral theorem it has
        an orthonormal eigenbasis:
        $$
        A^\top A = V\Lambda V^\top,\qquad \lambda_i \ge 0
        $$
        Now multiply the eigenvector equation by $A$:
        $$
        A(A^\top A v_i) = \lambda_i (A v_i)
        $$
        and since $A^\top A v_i = \lambda_i v_i$, the left side is
        $\lambda_i A v_i$. So $Av_i$ is an eigenvector of $AA^\top$ with
        eigenvalue $\lambda_i$. Define
        $$
        u_i = \frac{Av_i}{\sigma_i}, \qquad \sigma_i = \sqrt{\lambda_i}
        $$
        (well-defined whenever $\sigma_i > 0$). Then $Av_i = \sigma_i u_i$, and
        reconstructing $A$ in the right singular basis gives
        $$
        A = \sum_{i=1}^{r}\sigma_i u_i v_i^\top = U\Sigma V^\top
        $$
        **The null space falls out for free:** the eigenvectors of $A^\top A$
        with $\lambda_i = 0$ span $\ker(A)$, so the right singular vectors
        with zero singular value are exactly the directions $A$ destroys.

        **Where PCA comes from.** Maximise the variance of the projection
        $Xw$ subject to $\|w\| = 1$:
        $$
        \max_{w^\top w=1} w^\top X^\top X w
        $$
        Lagrange multipliers:
        $$
        \nabla_w\left(w^\top X^\top X w - \lambda(w^\top w - 1)\right) = 0
        \quad\Longrightarrow\quad
        X^\top X w = \lambda w
        $$
        So the optimal direction is the top eigenvector of $X^\top X$ — and by
        the result above, that is precisely the top right singular vector of
        $X$. **PCA *is* truncated SVD.** The only difference is which
        computation you do first, and the SVD version never forms $X^\top X$.

        **Why that matters numerically.** The eigenvalues of $X^\top X$ are
        $\sigma_i^2$. If $X$ has $\sigma_1 = 1$ and $\sigma_2 = 10^{-8}$, then
        $X^\top X$ has eigenvalues $1$ and $10^{-16}$ — the square of the
        smallest singular value is at the edge of double precision
        ($\epsilon \approx 2.2\times10^{-16}$). The corresponding eigenvector
        is numerical noise. The SVD route works with $\sigma_i$ directly, so
        its relative error stays around $\epsilon$ instead of
        $\epsilon/\sigma_i^2$.

        **Where ridge comes from.** The normal equations are
        $(X^\top X)w = X^\top y$, whose matrix has condition number
        $\kappa(X)^2$ — note the square. Ridge replaces it with
        $X^\top X + \lambda I$, whose eigenvalues are $\sigma_i^2 + \lambda$,
        all at least $\lambda$:
        $$
        \kappa(X^\top X + \lambda I)
          = \frac{\sigma_{\max}^2 + \lambda}{\sigma_{\min}^2 + \lambda}
        $$
        Bounded and well-behaved. Ridge regularises the *numerics of the
        solve* as much as it regularises the estimator — which is why adding
        $\lambda$ can fix a fit that diverges even when you expect no
        overfitting.
      blocks:
        - kind: math
          body: |
            $$\sigma_i^2 = \lambda_i(A^\top A)$$
            $$\max_{w^\top w = 1} w^\top X^\top X w \quad\Longrightarrow\quad X^\top X w = \lambda w$$
            $$\kappa(X^\top X) = \kappa(X)^2 \qquad \text{(note the square)}$$
      checkpoint: >-
        A matrix $X$ has singular values $1$ and $10^{-8}$. Compute the
        condition number of $X^\top X$, then of $X^\top X + 10^{-12}I$. What
        does the second number tell you about whether ridge can rescue this
        system?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        Here is a complete, from-scratch implementation. Note what it does
        *not* do: it never forms $X^\top X$, and it never inverts a matrix.

        ```python
        import numpy as np

        def power_iteration(A, n_iter=1000, tol=1e-12):
            \"\"\"Dominant eigenpair of a symmetric matrix, computed from scratch.\"\"\"
            A = np.asarray(A, dtype=float)
            n = A.shape[0]
            v = np.ones(n) / np.sqrt(n)      # deterministic start
            lam = 0.0
            for _ in range(n_iter):
                w = A @ v
                norm = np.linalg.norm(w)
                if norm < 1e-300:            # A is essentially zero
                    return np.zeros(n), 0.0
                v = w / norm
                lam_new = float(v @ A @ v)   # Rayleigh quotient
                if abs(lam_new - lam) < tol:
                    return v, lam_new
                lam = lam_new
            return v, lam

        def pca_svd(X, k):
            \"\"\"PCA via SVD. Never forms X.T @ X.\"\"\"
            X = np.asarray(X, dtype=float)
            mu = X.mean(axis=0)
            Xc = X - mu
            U, S, Vt = np.linalg.svd(Xc, full_matrices=False)
            components = Vt[:k]
            total = float((S ** 2).sum())
            ratios = [(float(s) ** 2 / total if total > 0 else 0.0) for s in S[:k]]
            return mu, components, ratios

        def ridge_solve(X, y, lam):
            \"\"\"Ridge regression without forming (X.T X + lam I) or inverting it.\"\"\"
            X = np.asarray(X, dtype=float)
            y = np.asarray(y, dtype=float)
            p = X.shape[1]
            A = np.vstack([X, np.sqrt(lam) * np.eye(p)])
            b = np.concatenate([y, np.zeros(p)])
            w, *_ = np.linalg.lstsq(A, b, rcond=None)
            return w

        def cholesky(A, tol=1e-12):
            \"\"\"A = L L^T via the outer-product form.\"\"\"
            A = np.asarray(A, dtype=float)
            n = A.shape[0]
            L = np.zeros_like(A)
            for i in range(n):
                for j in range(i + 1):
                    s = A[i, j] - L[i, :j] @ L[j, :j]
                    if i == j:
                        if s <= tol:
                            raise np.linalg.LinAlgError("matrix is not positive definite")
                        L[i, j] = np.sqrt(s)
                    else:
                        L[i, j] = s / L[j, j]
            return L
        ```

        **How to use each one:**

        - `power_iteration` — use it when you need only the top few
          eigenpairs of a *large* symmetric matrix and an exact SVD is too
          expensive. It converges at a rate governed by the spectral gap
          $\lambda_2/\lambda_1$; if the top two eigenvalues are close, use
          `eigh` instead.

        - `pca_svd` — this is the one you will use most. Its numerical
          advantage over the covariance route is not subtle: it is the
          difference between a correct component and noise on
          ill-conditioned data.

        - `ridge_solve` — note that `np.linalg.lstsq` is SVD-based under the
          hood, so the whole path avoids forming $X^\top X$ entirely. For
          large problems, prefer solving the ridge system directly with
          `scipy.linalg.solve` on the augmented matrix or with a Cholesky
          factorisation of $X^\top X + \lambda I$ when $p$ is small.

        - `cholesky` — the explicit loops are $O(n^3)$ with a terrible
          constant; use `np.linalg.cholesky` in production and keep this
          version for understanding the recursion
          $L_{ij} = \frac{A_{ij} - \sum_{k<j}L_{ik}L_{jk}}{L_{jj}}$.

        **One last caution.** Every complexity claim about *your* code should
        come from the AST profiler, not from your intuition — that is exactly
        the discipline the profiler exists to impose. Run the analysis, read
        the derivation, and only then decide whether the code is good enough.
      blocks:
        - kind: warning
          body: >-
            A reference implementation is only useful after you have attempted
            the problem. Reveal this tier only after you have written
            something — even something wrong — and can say why it fails.
      checkpoint: >-
        Close this answer. Re-implement `pca_svd` and `ridge_solve` from
        memory in under five minutes. Which one is harder to recall correctly,
        and what does that tell you about which one you should reach for
        reflexively?

  problems:
    - id: pca-on-rank-deficient
      title: "PCA of a rank-deficient matrix"
      difficulty: medium
      language: python
      entry: solve
      prompt: >-
        Given a data matrix `X` of shape `(n, p)` (already centred), compute the
        top-`k` principal components using the SVD, and return the explained
        variance ratio for each. Because the data may be rank-deficient, use
        the SVD rather than the covariance matrix — forming `X.T @ X` squares
        the condition number and destroys small-variance directions.

        Return a list of `k` floats: the ratio of variance explained by each
        component, in descending order.
      starter: |
        import numpy as np

        def solve(X, k):
            # X: numpy array of shape (n, p), already centred.
            # Return: list of k floats (explained variance ratios).
            pass
      testCases:
        - input: "[[[1.0, 2.0], [2.0, 1.0], [3.0, 0.0], [4.0, -1.0]], 1]"
          expected: "[1.0]"
          mode: json
          tolerance: 0.000001
        - input: "[[[1.0, 2.0], [2.0, 1.0], [3.0, 0.0], [4.0, -1.0]], 2]"
          expected: "[1.0, 0.0]"
          mode: json
          tolerance: 0.000001
      solution: |
        import numpy as np

        def solve(X, k):
            X = np.asarray(X, dtype=float)
            # Centring is mandatory: uncentred PCA finds the direction of the
            # mean, not the direction of maximum variance.
            mu = X.mean(axis=0)
            Xc = X - mu
            # SVD of the centred data: never form X.T @ X.
            U, S, Vt = np.linalg.svd(Xc, full_matrices=False)
            var = S ** 2
            total = var.sum()
            if total <= 0:
                return [0.0] * k
            ratios = var / total
            return [float(r) for r in ratios[:k]]
      solutionExplanation: >-
        The explained variance ratio for component $i$ is
        $\sigma_i^2 / \sum_j \sigma_j^2$, because $\sigma_i^2$ are the
        eigenvalues of $X^\top X$. Taking them straight from the SVD avoids
        the squaring of the condition number that the covariance route incurs.
        For the test data the columns are perfectly anti-correlated, so all
        the variance is in one direction and the second ratio is exactly zero.
      complexity: "O(n p min(n, p))"
      tags: ["linear-algebra", "pca", "svd"]

    - id: solve-least-squares-ridge
      title: "Ridge regression via the normal equations"
      difficulty: medium
      language: python
      entry: solve
      prompt: >-
        Solve ridge regression
        $\hat{w} = (X^\top X + \lambda I)^{-1} X^\top y$ for a design matrix
        `X` of shape `(n, p)` and target `y` of shape `(n,)`.

        Compute it in a numerically stable way: form the augmented system
        `[X; sqrt(lambda) I]` and solve the least-squares problem, rather than
        explicitly inverting `X.T @ X + lambda * I`.

        Return the coefficient vector as a list of `p` floats.
      starter: |
        import numpy as np

        def solve(X, y, lam):
            # X: (n, p), y: (n,), lam: float
            # Return: list of p floats.
            pass
      testCases:
        - input: "[[[1.0, 1.0], [1.0, 2.0], [1.0, 3.0]], [1.0, 2.0, 3.0], 0.0]"
          expected: "[0.0, 1.0]"
          mode: json
          tolerance: 0.000001
        - input: "[[[1.0, 1.0], [1.0, 2.0], [1.0, 3.0]], [1.0, 2.0, 3.0], 1.0]"
          expected: "[0.25, 0.8333333333333334]"
          mode: json
          tolerance: 0.000001
      solution: |
        import numpy as np

        def solve(X, y, lam):
            X = np.asarray(X, dtype=float)
            y = np.asarray(y, dtype=float)
            p = X.shape[1]
            A = np.vstack([X, np.sqrt(lam) * np.eye(p)])
            b = np.concatenate([y, np.zeros(p)])
            w, *_ = np.linalg.lstsq(A, b, rcond=None)
            return [float(v) for v in w]
      solutionExplanation: >-
        Appending $\sqrt{\lambda} I$ rows and $\mathbf{0}$ targets to $X$ and $y$
        yields a least-squares problem whose normal equations are exactly
        $(X^\top X + \lambda I)w = X^\top y$. Using `lstsq` (which is
        SVD-based under the hood) avoids forming and inverting the normal
        equations, which squares the condition number. With $\lambda = 0$ the
        ordinary least-squares fit is recovered.
      complexity: "O(n p^2)"
      tags: ["linear-algebra", "ridge", "regularisation"]

    - id: power-iteration-dominant
      title: "Dominant eigenpair by power iteration"
      difficulty: easy
      language: python
      entry: solve
      prompt: >-
        Given a symmetric matrix `A` as a list of lists, use power iteration to
        find the dominant eigenvalue: repeatedly multiply a starting vector by
        `A` and renormalise, until the Rayleigh quotient stops changing.

        Return the dominant eigenvalue as a float.
      starter: |
        import numpy as np

        def solve(A, n_iter=1000, tol=1e-12):
            # A: list of lists (symmetric). Return: float eigenvalue.
            pass
      testCases:
        - input: "[[[2.0, 1.0], [1.0, 2.0]], 1000, 1e-12]"
          expected: "3.0"
          mode: json
          tolerance: 0.000001
        - input: "[[[4.0, 0.0], [0.0, 1.0]], 1000, 1e-12]"
          expected: "4.0"
          mode: json
          tolerance: 0.000001
      solution: |
        import numpy as np

        def solve(A, n_iter=1000, tol=1e-12):
            A = np.asarray(A, dtype=float)
            n = A.shape[0]
            v = np.ones(n) / np.sqrt(n)
            lam = 0.0
            for _ in range(n_iter):
                w = A @ v
                norm = np.linalg.norm(w)
                if norm < 1e-300:
                    return 0.0
                v = w / norm
                lam_new = float(v @ A @ v)
                if abs(lam_new - lam) < tol:
                    return lam_new
                lam = lam_new
            return lam
      solutionExplanation: >-
        Each iteration multiplies by $A$, so the component of $v$ along the
        eigenvector with the largest $|\lambda|$ grows fastest relative to the
        others. After normalisation the vector converges to that eigenvector,
        and the Rayleigh quotient $v^\top A v$ converges to its eigenvalue.
        For the symmetric matrix $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ the
        eigenvalues are $1$ and $3$, so the dominant one is $3$.
      complexity: "O(n_iter * n^2)"
      tags: ["linear-algebra", "eigenvalues", "iterative"]

  try_it: >-
    Take a design matrix with singular values $\sigma = (1, 10^{-8})$ and work out
    $\kappa(X)$ and $\kappa(X^\top X)$ by hand before touching a keyboard, then
    check both with `numpy.linalg.cond`. State how many of float64's 15.7 digits
    survive a solve through the Gram matrix, and which of `eigh`, `svd` or
    `cholesky` you would call on that matrix and why.
  interview_questions:
    - question: "Why do you reach for `numpy.linalg.eigh` rather than `eig` on a symmetric matrix?"
      level: mid
      key_points:
        - "`eigh` is guaranteed to return real eigenvalues and an orthonormal eigenvector basis; `eig` makes neither promise and can return a complex dtype."
        - "It exploits the symmetry — roughly half the flops and a smaller backward error than the general routine."
        - "Orthonormality is what makes the reconstruction $A = Q\\Lambda Q^\\top$ usable: without it you cannot project onto the eigenvectors and read off components."
        - "For an indefinite symmetric matrix the eigenvalues are signed, so if you want singular values you still need `svd` or `abs(eigvals)`."
      follow_up: "A is symmetric but only positive semi-definite. Which routine, and what changes about the condition number you report?"
    - question: "You are given a $50{,}000 \\times 2{,}000$ design matrix and asked for its top 10 components. Form $X^\\top X$ or take the SVD of $X$? Defend the choice numerically."
      level: senior
      key_points:
        - "$\\kappa(X^\\top X) = \\kappa(X)^2$, so a design with $\\kappa(X) = 10^4$ becomes $10^8$ and loses 8 of the 15.7 float64 digits before you start."
        - "The Gram matrix costs $O(np^2)$ and the SVD of $X$ also costs $O(np^2)$, so the square buys no asymptotic time — only lost accuracy."
        - "For $k \\ll p$ a randomised SVD gets a rank-10 basis in $O(npk)$ and never forms either dense factor."
        - "The rank-$k$ truncation is Eckart–Young optimal, so the cheap route produces the same best approximation, not a worse heuristic."
      follow_up: "What does randomised SVD assume about the spectrum, and which single number would you look at to decide it is safe here?"
    - question: "What does the Eckart–Young theorem actually licence you to claim about a truncated SVD?"
      level: mid
      key_points:
        - "Truncating to $k$ singular values is the best rank-$k$ approximation in both the Frobenius and the spectral norm — there is no search and no tuning."
        - "The Frobenius error is exactly $\\sqrt{\\sum_{i>k} \\sigma_i^2}$ and the spectral error is $\\sigma_{k+1}$."
        - "PCA is this statement applied to the centred data matrix, which is why 'explained variance' and 'reconstruction error' are the same number."
        - "It says nothing about whether rank $k$ is enough for your task — that is a question about the labels, which the SVD never saw."
  common_mistakes:
    - "Calling `np.linalg.inv` to solve $Ax = b$: slower than factor-and-solve, less accurate, and it returns `inf`/`nan` on a singular matrix instead of raising."
    - "Using `eig` on a symmetric matrix, assuming the eigenvectors are orthonormal, then projecting and getting a reconstruction that does not match."
    - "Comparing the smallest eigenvalue of $X^\\top X$ against a tolerance meant for singular values — the tolerance lives on $\\sigma_i$, not $\\sigma_i^2$."
  further_reading:
    - label: "Trefethen & Bau, Numerical Linear Algebra, Lectures 4–5 and 25"
    - label: "Golub & Van Loan, Matrix Computations, 4th edition, Chapters 2 and 5"
