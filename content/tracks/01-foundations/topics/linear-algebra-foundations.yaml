    - id: cp-vector-shape
      question: >-
        You write `y = W @ x` where `W` is `(128, 64)` and `x` is `(64,)`.
        What is the shape of `y`, and what would it be if `x` were `(64, 1)`?
      answerKind: short_text
      solution: >-
        `(128,)` and `(128, 1)` respectively. The second is almost never
        intended — reshaping to `(64,)` is the fix. This is the single most
        common silent shape bug in NumPy code.
      hint: >-
        Matrix-matrix multiplication contracts the last axis of the left
        operand with the first axis of the right.

    - id: cp-power-iteration
      question: >-
        Why does power iteration converge to the eigenvector of the largest
        eigenvalue, and what happens when the two largest eigenvalues are
        nearly equal?
      answerKind: short_text
      solution: >-
        Each iteration multiplies by $A$, so a component along $v_i$ is scaled
        by $\lambda_i^k$. After normalisation the largest $|\lambda_i|$
        dominates. When the top two are nearly equal, the convergence rate
        (governed by $\lambda_2/\lambda_1$) is slow — this is the spectral gap
        problem, and it is the numerical reason PCA components can be unstable.
      hint: >-
        Write $v_0$ in the eigenbasis and apply $A$ repeatedly.

    - id: cp-pca-vs-svd
      question: >-
        When would using `eigh(cov(X))` give a materially different (and worse)
        answer than `svd(X)`?
      answerKind: short_text
      solution: >-
        When $X$ is ill-conditioned. The covariance route forms $X^\top X$,
        squaring the condition number, so directions with tiny variance get
        destroyed by floating-point error. The SVD route never forms $X^\top X$
        and keeps relative accuracy in the small singular values.
      hint: >-
        Think about what matrix each method actually computes.

    - id: cp-ridge-spectral
      question: >-
        Ridge regression adds $\lambda I$ to $X^\top X$. What does it do to the
        eigenvalues, and what does that fix?
      answerKind: short_text
      solution: >-
        Eigenvalues become $\sigma_i^2 + \lambda$, all at least $\lambda$, so the
        condition number becomes bounded. It fixes the numerical conditioning
        of the normal equations, not just the statistical bias.
      hint: >-
        Write the eigenvalues of $X^\top X$ in terms of $\sigma_i$.

    - id: cp-null-space
      question: >-
        Your regression model has a null direction in its design matrix. What
        does that mean about the model, and why might it be a fairness problem?
      answerKind: short_text
      solution: >-
        The model cannot distinguish inputs differing along that direction — the
        information is destroyed. If the null direction correlates with a
        protected attribute, the model is structurally unable to treat
        individuals differently along it.
      hint: >-
        The null space is spanned by the zero singular vectors.

