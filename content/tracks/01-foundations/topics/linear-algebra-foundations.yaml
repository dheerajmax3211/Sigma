id: linear-algebra-foundations
slug: linear-algebra-foundations
title: "Linear Algebra: Four Decompositions, One Coordinate Change"
summary: >-
  Vectors, matrices, and the four decompositions that every modern ML system is
  built on. This module derives eigendecomposition and SVD from scratch, shows
  exactly why PCA is a special case of SVD, and connects each idea to a
  concrete failure mode you will meet in production.
kind: lesson
difficulty: intro
position: 1
estMinutes: 32
prerequisites: []
body:
  summary: >-
    Most ML curricula teach linear algebra as a checklist of formulas. That
    approach fails because the formulas are not what you need in practice — you
    need the *reason* each decomposition exists and the failure mode each one
    causes. This module derives everything from the spectral theorem outward.

  big_idea: >-
    Every decomposition is one move — change coordinates until the matrix is trivial to
    act on — and the right choice follows from a single fact: symmetric, positive
    definite, or neither.

  problem:
    - "A matrix lands on your desk: `eig`, `svd` or `cholesky`? A formula list gives no way to choose, and the wrong choice costs stability."
    - "Nearly every scaling bug traces to forming $X^\\top X$ instead of taking an SVD, which silently squares your condition number."
    - "Every layer of a neural network is a matrix operation, so this is not academic — it is the layer you are optimising."

  analogy: |
    A matrix is a machine that pushes on a vector. A decomposition finds new
    rulers — a coordinate system — in which the machine only stretches, never
    mixes, so it scales each new direction by its own factor. The catch: not
    every machine admits this. SVD is the general instrument; the
    eigen-decomposition is the one for symmetric machines.

  concept_points:
    - "**The reason every decomposition exists is to make a matrix cheap to act on.** A dense $n \\times n$ matrix costs $O(n^2)$ per matrix-vector product; if it were diagonal the same product would cost $O(n)$ — one scale per coordinate. Every factorisation writes $A$ as a product whose expensive part changes coordinates and whose cheap part only scales."
    - "**$\\sigma_i^2 = \\lambda_i(A^\\top A)$ is the load-bearing fact of the whole module.** Singular values are the square roots of the eigenvalues of $A^\\top A$. PCA, the Eckart–Young theorem, and the condition number of a network layer are all that one statement in different clothes."
    - "**Use `eigh`, never `eig`, on a symmetric matrix.** `numpy.linalg.eig` makes no orthogonality guarantee, so its eigenvectors may not form an orthonormal basis; `eigh` exploits the symmetry and returns real eigenvalues with orthonormal eigenvectors. Cholesky is the cheap solve for SPD input — half of LU's constant — and it fails on a negative pivot, which is correct behaviour."
    - "**Forming $X^\\top X$ before an SVD is the most common numerical mistake in ML.** It squares the condition number: if $X$ has $\\sigma_1 = 1$ and $\\sigma_2 = 10^{-8}$, then $X^\\top X$ has eigenvalues $1$ and $10^{-16}$ — at the edge of double precision, with an eigenvector that is noise. The SVD route keeps relative error near $\\epsilon$."
    - "**The best rank-$k$ approximation needs no search.** Truncating the SVD *is* the Eckart–Young optimal solution, with error $\\sqrt{\\sum_{i>k}\\sigma_i^2}$. There is no optimisation problem to solve and no approximation quality to tune — which is why PCA is a truncation, not a training loop."
    - "**Condition number is the number that predicts your error.** A backward-stable algorithm can still return a wildly wrong answer when the problem is ill-conditioned: relative error in the output is bounded by $\\kappa(A)\\cdot\\epsilon$. Know your data's condition number before trusting a result, and never invert a matrix where you could solve against a factorisation."

  definitions:
    - { term: "Eigenvalue", meaning: "A scalar $\\lambda$ such that $Av = \\lambda v$ for some non-zero vector $v$. It is the factor by which $A$ stretches one particular direction." }
    - { term: "Eigenvector", meaning: "A non-zero vector $v$ with $Av = \\lambda v$. For a symmetric matrix, the eigenvectors of distinct eigenvalues are orthogonal and form an orthonormal basis." }
    - { term: "Singular value", meaning: "The square root of an eigenvalue of $A^\\top A$: $\\sigma_i = \\sqrt{\\lambda_i(A^\\top A)}$. Always real and non-negative, unlike eigenvalues, which may be negative or complex." }
    - { term: "Orthogonal matrix", meaning: "A matrix $Q$ with $Q^\\top Q = I$. It preserves lengths and angles — a pure rotation or reflection. The $Q$ in an eigendecomposition is orthogonal." }
    - { term: "Singular vectors", meaning: "The left and right singular vectors, $u_i$ and $v_i$, with $Av_i = \\sigma_i u_i$. For a square symmetric positive definite matrix these coincide with the eigenvectors." }
    - { term: "Condition number", meaning: "$\\kappa(A) = \\sigma_{\\max}/\\sigma_{\\min}$. The factor by which the input must be perturbed to explain the error in the output." }
    - { term: "Cholesky decomposition", meaning: "$A = LL^\\top$ for symmetric positive definite $A$, with $L$ lower triangular. Exists if and only if $A$ is positive definite." }
    - { term: "Rank", meaning: "The dimension of the column space — the number of linearly independent directions in $A$. The rank of $A$ equals the number of non-zero singular values." }
    - { term: "Power iteration", meaning: "An iterative method for the dominant eigenpair: repeatedly multiply by $A$ and renormalise. Converges at a rate set by the spectral gap $\\lambda_2/\\lambda_1$." }
    - { term: "Rayleigh quotient", meaning: "$v^\\top A v$ for unit $v$. It is an estimate of an eigenvalue of $A$ even when $v$ is not yet an eigenvector, and it is maximised exactly at the eigenvectors." }

  diagrams:
    - type: compare
      title: "Which decomposition do I reach for?"
      left_label: "Symmetric / SPD matrix"
      left_points:
        - "Need the eigen-directions → `eigh(A)` (never `eig`)"
        - "Need to solve $Ax = b$ → `cholesky(A)`, then forward/back substitution"
        - "Want the best low-rank approximation → still take the SVD; it is valid for any matrix"
      right_label: "Anything else"
      right_points:
        - "Square, non-symmetric → `svd(A)`; the singular values are always well-behaved"
        - "Rectangular → `svd(A)`; use `full_matrices=False` to avoid the huge $U$"
        - "Ill-conditioned → `svd(A)`, and never form $A^\\top A$ on the way there"
    - type: architecture
      title: "Where each decomposition lives in a training pipeline"
      nodes:
        - { id: data, x: 0, y: 1, label: "Raw data", kind: client, detail: "The raw matrix $X$ of shape $(n, p)$. Nothing has been assumed about its conditioning yet." }
        - { id: center, x: 1, y: 1, label: "Centring", kind: server, detail: "Subtract the column means. Not optional: uncentred PCA finds the direction of the mean, not the direction of maximum variance." }
        - { id: svd, x: 2, y: 1, label: "SVD", kind: model, detail: "$X_c = U\\Sigma V^\\top$. This single call gives you the principal components, the explained variance, and the rank of the data." }
        - { id: pca, x: 3, y: 0, label: "Components $V_k$", kind: database, detail: "The top $k$ right singular vectors. Each is a unit-norm direction in feature space." }
        - { id: var, x: 3, y: 2, label: "Explained variance", kind: cache, detail: "$\\sigma_i^2 / \\sum_j \\sigma_j^2$. Deciding $k$ is choosing how much variance to discard — a judgement call, not a formula." }
        - { id: proj, x: 4, y: 1, label: "Projection $X_cV_k$", kind: server, detail: "The reduced representation. Everything downstream now operates in $k$ dimensions instead of $p$." }
      edges:
        - { from: data, to: center, label: "subtract mean" }
        - { from: center, to: svd }
        - { from: svd, to: pca, label: "V[:, :k]" }
        - { from: svd, to: var, label: "S²" }
        - { from: pca, to: proj, label: "× V_k" }
    - type: pipeline
      title: "The order of operations that keeps your numerics honest"
      nodes:
        - label: "Centre the data"
          note: "Xc = X - X.mean(axis=0)"
          detail: "Skipping this makes PCA find the mean direction rather than the maximum-variance direction. It is the single most common PCA bug."
        - label: "Take the SVD of Xc"
          note: "U, S, Vt = np.linalg.svd(Xc, full_matrices=False)"
          detail: "Never `svd(X.T @ X)`. The Gram matrix costs an extra O(np²) and squares your condition number."
        - label: "Read the singular values"
          note: "S is already sorted descending"
          detail: "The spectrum tells you the numerical rank and the explained-variance profile in one glance — no separate variance computation needed."
        - label: "Truncate"
          note: "k components → Vt[:k]"
          detail: "Truncation IS the optimal rank-k approximation. There is no search to run."
        - label: "Project"
          note: "Z = Xc @ Vt[:k].T"
          detail: "The reduced matrix. From here, everything downstream is cheaper and better conditioned."
    - type: stack
      title: "The four layers of the problem, bottom to top"
      layers:
        - "Numerics: how accurately can this even be computed in float64?"
        - "Conditioning: how much does a small input error move the answer?"
        - "Structure: is the matrix symmetric? positive definite? rank-deficient?"
        - "Choice: which decomposition do I therefore reach for?"
    - type: graph
      title: "One fact, five consequences"
      nodes:
        - { id: fact, label: "σ² = λ(AᵀA)" }
        - { id: pca, label: "PCA" }
        - { id: ey, label: "Eckart–Young" }
        - { id: cond, label: "Condition number" }
        - { id: "null", label: "Null space" }
        - { id: ridge, label: "Ridge spectrum" }
      edges:
        - { from: fact, to: pca, label: "top eigenvector" }
        - { from: fact, to: ey, label: "truncation is optimal" }
        - { from: fact, to: cond, label: "κ = σmax/σmin" }
        - { from: fact, to: "null", label: "zero eigenvalues" }
        - { from: fact, to: ridge, label: "eigenvalues σ²+λ" }
    - type: cycle
      title: "How power iteration converges"
      steps:
        - "Multiply: w = A · v"
        - "Renormalise: v = w / ‖w‖"
        - "Estimate: λ = vᵀAv (Rayleigh quotient)"
        - "Check the gap: |λ_new − λ| < tol?"
        - "Repeat — convergence rate is set by λ₂/λ₁"
    - type: plot
      title: "Condition number explodes when you square the matrix"
      chart: "line"
      xLabel: "σ₂ / σ₁"
      yLabel: "κ(AᵀA) relative to κ(A)"
      series:
        - name: "κ(XᵀX) = κ(X)²"
          points:
            - { x: 0.1, y: 1.0 }
            - { x: 0.2, y: 4.0 }
            - { x: 0.4, y: 16.0 }
            - { x: 0.6, y: 36.0 }
            - { x: 0.8, y: 64.0 }
            - { x: 1.0, y: 100.0 }
        - name: "κ(X) — unchanged"
          points:
            - { x: 0.1, y: 10.0 }
            - { x: 0.2, y: 10.0 }
            - { x: 0.4, y: 10.0 }
            - { x: 0.6, y: 10.0 }
            - { x: 0.8, y: 10.0 }
            - { x: 1.0, y: 10.0 }

  markdown: |
    ## Why this module is longer than it needs to be

    You will meet four decompositions in this module: eigen-decomposition, the
    singular value decomposition, the Cholesky factorization, and PCA. The
    temptation is to memorise each as a formula. Resist it. Each one exists to
    solve a specific problem, and if you understand the problem, the formula is
    recoverable.

    The unifying thread is this: **all of them are ways of making a matrix
    easier to act on.**

    - A general matrix $A \in \mathbb{R}^{n \times n}$ is expensive to work
      with: multiplying by it is $O(n^2)$, and it has no structure to exploit.
    - If $A$ were diagonal, acting on it would be $O(n)$ — just scale each
      coordinate.
    - So every decomposition here asks: *can I write this matrix as a product
      of simpler matrices, one of which is diagonal or triangular?*

    ## 1. Vectors: the data structure of ML

    A vector $v \in \mathbb{R}^n$ is a column of $n$ reals. You will meet three
    kinds, and conflating them causes real bugs:

    | Kind | Shape | What it means | Example |
    |---|---|---|---|
    | **Column** | $n \times 1$ | a single data point | one image's pixels |
    | **Row** | $1 \times n$ | a feature description | "this sample is 3 tall" |
    | **Batch (row-major)** | $B \times n$ | many points stacked | a minibatch |

    In code (NumPy), the distinction is the difference between `v` of shape
    `(n,)` and `v` of shape `(n, 1)`. This is not pedantry. Broadcasting
    semantics differ: `A @ v` with `v` shape `(n,)` gives shape `(m,)`, but with
    `v` shape `(n, 1)` gives shape `(m, 1)`. The second is almost never what you
    want in a forward pass, and the resulting bug is silent.

    ### The three operations that matter

    **Dot product.** $u \cdot v = \sum_{i} u_i v_i$. Geometrically it is
    $\|u\|\|v\|\cos\theta$, so it measures alignment. In ML it is how a neuron
    measures agreement between an input and a weight vector — and the sign
    tells you whether the activation is excitatory or inhibitory.

    **Norm.** $\|v\|_2 = \sqrt{v \cdot v}$. The Euclidean norm. Also important:
    $\|v\|_1 = \sum_i |v_i|$, and the *infinity norm* $\|v\|_\infty =
    \max_i |v_i|$. These are not interchangeable, and the difference matters for
    robustness (see §7).

    **Cosine similarity.**
    $$
    \cos(\theta) = \frac{u \cdot v}{\|u\|_2 \|v\|_2}
    $$
    Scale-invariant: it ignores magnitude and keeps only direction. This is
    exactly why retrieval systems and recommendation engines use it — a query
    and a document of very different lengths should still be comparable.

    ### Span, rank, and why dimensionality matters

    The **span** of a set of vectors is the set of all linear combinations of
    them. The **rank** of a matrix is the dimension of its column space (equal
    to the dimension of its row space — a theorem worth knowing, since it means
    you never have to check both).

    Rank deficiency is not an edge case in ML; it is the norm. Consider the
    famous Anscombe's quartet: four datasets with identical means, variances,
    and linear regression lines, wildly different plots. Three are linear with
    different noise; one is a curve with a single influential outlier. A
    dataset can be full-rank and still be nothing but noise.

    Concretely, in ML rank deficiency shows up as:
    - **Perfectly collinear features.** Two features where one is a linear
      combination of others. The design matrix $X$ becomes singular, $X^\top X$
      is singular, and the normal equations break.
    - **More features than samples.** $n < p$, so $X$ has rank at most $n < p$.
      You cannot uniquely recover $p$ coefficients. This is why regularisation
      and dimensionality reduction exist at all.

    ## 2. Matrices and the four factorisations

    A matrix $A \in \mathbb{R}^{m \times n}$ is a linear map
    $\mathbb{R}^n \to \mathbb{R}^m$. Composition of maps is matrix
    multiplication; that is the entire reason matrix multiplication is
    associative and non-commutative.

    ### 2.1 LU decomposition — Gaussian elimination, packaged

    Every invertible square matrix factors as $A = LU$ (or $PA = LU$ with
    partial pivoting). $L$ is lower triangular, $U$ is upper triangular.

    Why you care: solving $Ax = b$ becomes forward and back substitution, each
    $O(n^2)$ instead of $O(n^3)$ for inversion. This is the workhorse of
    numerical linear algebra, and it is what `scipy.linalg.lu_factor` gives you.

    ### 2.2 Cholesky decomposition — positive definite matrices

    If $A$ is symmetric positive definite (SPD), then
    $$
    A = LL^\top
    $$
    with $L$ lower triangular and having positive diagonal.

    **Derivation sketch.** Assume $A = LL^\top$ and match entries:
    $A_{ij} = \sum_{k \le \min(i,j)} L_{ik}L_{jk}$. For $i \ge j$ this gives
    the forward recursion
    $$
    L_{ij} = \frac{A_{ij} - \sum_{k<j} L_{ik}L_{jk}}{L_{jj}},
    \qquad
    L_{jj} = \sqrt{A_{jj} - \sum_{k<j} L_{jk}^2}
    $$
    with $L_{ii} = \sqrt{A_{ii}}$ on the diagonal.

    **Why you care.** Cholesky is $O(n^3)$ but with a tiny constant, roughly
    half the cost of LU, and it is *numerically stable* — guaranteed for SPD
    matrices. It appears in:
    - **Gaussian processes**: the kernel matrix $K$ is SPD, and the predictive
      distribution requires solving $K\alpha = y$ and computing
      $\log\det K = 2\sum_i \log L_{ii}$.
    - **Sampling from Gaussians**: if $\Sigma = LL^\top$ then $z = L\epsilon$
      with $\epsilon \sim \mathcal{N}(0, I)$ gives $z \sim \mathcal{N}(0, \Sigma)$.
    - **Newton's method in optimisation**: the Hessian of a log-likelihood is
      often SPD, and the Newton update is $H^{-1}g$, computed by Cholesky.

    ## 3. Spectral theory — eigenvalues and eigenvectors

    ### The definition and the geometric meaning

    $v \in \mathbb{R}^n$ is an **eigenvector** of $A$ with **eigenvalue**
    $\lambda$ if
    $$
    Av = \lambda v, \qquad v \neq 0
    $$

    Read it geometrically: $A$ acts on $v$ by stretching it by $\lambda$ (and
    flipping its sign if $\lambda < 0$). If $|\lambda| > 1$ it stretches;
    if $|\lambda| < 1$ it contracts; if $\lambda = 1$ it is a fixed direction;
    if $\lambda = 0$ the vector is annihilated.

    ### Deriving the characteristic polynomial

    $Av = \lambda v$ rearranges to $(A - \lambda I)v = 0$. A non-trivial
    solution $v \neq 0$ exists exactly when the matrix is singular:
    $$
    \det(A - \lambda I) = 0
    $$
    This is the **characteristic equation**. Its roots are the eigenvalues.

    Worked example, $A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$:
    $$
    \det(A - \lambda I) = (2-\lambda)^2 - 1 = \lambda^2 - 4\lambda + 3
      = (\lambda - 1)(\lambda - 3)
    $$
    So $\lambda_1 = 1$, $\lambda_2 = 3$.

    For $\lambda = 3$: $(A - 3I)v = 0$ gives $-v_1 + v_2 = 0$, so
    $v_1 = v_2$, and $v_1 = (1, 1)^\top$.
    For $\lambda = 1$: $(A - I)v = 0$ gives $v_1 + v_2 = 0$, so
    $v_1 = (1, -1)^\top$.

    Check: $A(1,1)^\top = (3, 3)^\top = 3 \cdot (1,1)^\top$ ✓.

    ### The spectral theorem

    **Theorem.** $A$ is real symmetric ($A^\top = A$) if and only if it has an
    orthonormal basis of eigenvectors. Equivalently, there exists an orthogonal
    matrix $Q$ and a diagonal matrix $\Lambda$ with
    $$
    A = Q\Lambda Q^\top
    $$

    This is the single most important theorem in applied linear algebra,
    because it says: *a symmetric matrix is just a rotation into a coordinate
    system where it does nothing but scale each axis.*

    **Proof sketch.** If $Av_i = \lambda_i v_i$ and the $v_i$ form a basis,
    then $A = V\Lambda V^{-1}$ (expand $A$ in the eigenbasis). For symmetric
    $A$, different eigenvectors are orthogonal: $v_i^\top v_j \neq 0$ implies
    $\lambda_i = \lambda_j$, so we can choose an orthonormal basis, $V^{-1} =
    V^\top$, giving $A = V\Lambda V^\top$.

    ### Why symmetry shows up everywhere in ML

    Nearly every matrix you will differentiate against in a loss is symmetric,
    because it came from $X^\top X$, $WW^\top$, or $K = XX^\top$:

    | Matrix | Origin | Symmetric? |
    |---|---|---|
    | $X^\top X$ (Gram / $X^\top X$ matrix) | any design matrix | yes |
    | $W^\top W$ | any weight matrix | yes |
    | $WW^\top$ | any weight matrix | yes |
    | $K$ (RBF kernel) | Gaussian kernel | yes (PSD) |
    | $H$ (Hessian of a log-likelihood) | smooth objective | often |

    This is not a coincidence — it is a consequence of $B^\top A B$ being
    symmetric when $A$ is. It is why you can use `eigh` and not `eig`, and why
    the covariance matrix is always symmetric.

    ### Power iteration — and why it is the whole story of PCA training

    You rarely need *all* eigenvectors. You usually need the top one or two.
    Power iteration finds the dominant eigenpair:
    $$
    v_{k+1} = \frac{Av_k}{\|Av_k\|_2}
    $$
    Starting from a random $v_0$, this converges to the eigenvector of the
    largest-magnitude eigenvalue.

    **Why it converges.** Write $v_0 = \sum_i c_i v_i$ in the eigenbasis. Then
    $A^k v_0 = \sum_i c_i \lambda_i^k v_i$, and after normalisation the terms
    with largest $|\lambda_i|$ dominate. Convergence rate depends on the ratio
    $|\lambda_2| / |\lambda_1|$ — a *spectral gap*. When the gap is small,
    convergence is slow, which is exactly the ill-conditioning that makes PCA
    unstable in practice.

    ### Condition number — the number that tells you when to distrust a result

    For an SPD matrix, the condition number in the 2-norm is
    $$
    \kappa_2(A) = \frac{\sigma_{\max}}{\sigma_{\min}}
    $$
    where $\sigma$ are the singular values. It measures how much the output
    can be amplified relative to the input.

    - $\kappa = 1$: perfectly conditioned (orthogonal matrices).
    - $\kappa$ large: small input perturbations produce large output
      perturbations.

    **This is the number to watch when you normalise features, and the reason
    ridge regression exists.** In the normal equations $X^\top X w = X^\top y$,
    the condition number of $X^\top X$ is $\kappa(X)^2$ — squaring the
    condition number. Ridge regression adds $\lambda I$:
    $$
    (X^\top X + \lambda I)w = X^\top y
    $$
    whose eigenvalues are $\sigma_i^2 + \lambda$, all at least $\lambda$. The
    condition number collapses to $\frac{\sigma_{\max}^2 + \lambda}{\sigma_{\min}^2
    + \lambda}$, which is bounded and well-behaved for $\lambda > 0$. Ridge
    does not "improve" the model; it makes the *numerics* of solving the
    system well-posed.

    ## 4. The singular value decomposition

    ### Definition

    Every real $m \times n$ matrix $A$ has an SVD
    $$
    A = U\Sigma V^\top
    $$
    where $U \in \mathbb{R}^{m \times m}$ and $V \in \mathbb{R}^{n \times n}$ are
    orthogonal, and $\Sigma \in \mathbb{R}^{m \times n}$ is diagonal with
    non-negative entries $\sigma_1 \ge \sigma_2 \ge \cdots \ge \sigma_r > 0$,
    with $r = \operatorname{rank}(A)$.

    ### Deriving SVD from the eigendecomposition of $A^\top A$

    This is worth doing carefully, because it reveals what SVD *is*.

    Consider $A^\top A$. It is symmetric positive semi-definite (for any $x$,
    $x^\top A^\top A x = \|Ax\|^2 \ge 0$). By the spectral theorem:
    $$
    A^\top A = V\Lambda V^\top
    $$

    Take the eigenvector equation $A^\top A v_i = \lambda_i v_i$. Multiply by
    $A$:
    $$
    A(A^\top A v_i) = \lambda_i (Av_i)
    $$
    and note $A^\top A v_i = \lambda_i v_i$ implies $A^\top(Av_i) = \lambda_i v_i$,
    so $Av_i$ is an eigenvector of $AA^\top$ with eigenvalue $\lambda_i$.

    Define $u_i = Av_i / \sigma_i$ where $\sigma_i = \sqrt{\lambda_i}$. Then
    $Av_i = \sigma_i u_i$, and substituting:
    $$
    AA^\top \left(\frac{Av_i}{\sigma_i}\right) = \lambda_i \frac{Av_i}{\sigma_i}
    \quad\Longrightarrow\quad
    AA^\top u_i = \lambda_i u_i = \sigma_i^2 u_i
    $$
    So $u_i$ is an eigenvector of $AA^\top$.

    Now reconstruct $A$. Since $Av_i = \sigma_i u_i$, we have $A = \sum_i
    \sigma_i u_i v_i^\top$, which is exactly $A = U\Sigma V^\top$ with
    $U = [u_1 \dots u_r]$, $\Sigma = \operatorname{diag}(\sigma_1 \dots
    \sigma_r)$, $V = [v_1 \dots v_r]$.

    **Key structural fact:** the right singular vectors $v_i$ are eigenvectors of
    $A^\top A$, and the left singular vectors $u_i$ are eigenvectors of
    $AA^\top$.

    ### The four fundamental subspaces

    This is the payoff of the derivation:

    | Subspace | Definition | Dimension |
    |---|---|---|
    | Column space | $\operatorname{span}(A)$ | $r$ |
    | Row space | $\operatorname{span}(A^\top)$ | $r$ |
    | Null space | $\ker(A)$, $Ax = 0$ | $n - r$ |
    | Left null space | $\ker(A^\top)$ | $m - r$ |

    - **Row space** is spanned by the left singular vectors $u_1 \dots u_r$.
    - **Column space** is spanned by the right singular vectors $v_1 \dots v_r$.
    - **Null space** is spanned by $v_{r+1} \dots v_n$ — the right singular
      vectors with *zero* singular value. These are the directions that $A$
      destroys.
    - **Left null space** is spanned by $u_{r+1} \dots u_m$.

    The orthogonal complements are related:
    $$
    \operatorname{col}(A) = \operatorname{row}(A)^\perp,
    \qquad
    \operatorname{null}(A) = \operatorname{row}(A)^\perp
    $$

    **ML significance.** The null space of $X$ is the space of input
    perturbations that leave the predictions unchanged. If your model has a
    null direction, then it cannot distinguish two inputs that differ along
    it — a genuine loss of information, and sometimes a fairness problem.

    ### SVD as the best rank-$k$ approximation

    **Eckart–Young theorem.** The best rank-$k$ approximation to $A$ in the
    Frobenius norm is $A_k = U_k \Sigma_k V_k^\top$, with
    $$
    \|A - A_k\|_F = \sqrt{\sum_{i>k} \sigma_i^2}
    $$

    The proof is a one-line argument: any rank-$k$ matrix $B$ has
    $B = \tilde{U}\tilde{\Sigma}\tilde{V}^\top$ with $k$ non-zero singular
    values, and
    $$
    \|A - B\|_F^2 = \sum_{i=1}^{k}(\sigma_i - \tilde{\sigma}_i)^2 + \sum_{i>k}\sigma_i^2 + \text{(extra terms)} \ge \sum_{i>k}\sigma_i^2
    $$
    with equality precisely when $B$ keeps the top-$k$ components.

    **This is the theoretical justification for truncated SVD** — the
    low-rank approximation you use in LSA, in LoRA, and in almost every
    "compress the weights" trick.

    ### SVD vs. eigendecomposition — when to use which

    | | Eigen-decomposition | SVD |
    |---|---|---|
    | Requires | Square, and (for real results) symmetric | Any $m \times n$ |
    | Eigenvalues | Can be complex, can be negative | Singular values always $\ge 0$ |
    | Condition number | Needs symmetric/positive-definite | Always available |
    | Cost | $O(n^3)$ | $O(mn\min(m,n))$ |
    | Use when | The matrix is SPD and you want a spectral view | You want robustness, or a non-square matrix |

    ## 5. PCA, derived properly

    ### The problem PCA solves

    Given centred data $X \in \mathbb{R}^{n \times p}$ ($n$ samples, $p$
    features), find the direction $w \in \mathbb{R}^p$ (unit norm) that
    captures the most variance in the projected data $Xw$.

    The variance of the projection is
    $$
    \operatorname{Var}(Xw) = w^\top X^\top X w
    $$
    (using $\|Xw\|^2 = w^\top X^\top X w$, and since $w$ is unit norm the
    squared norm equals the variance).

    So we solve
    $$
    \max_{w^\top w = 1} w^\top (X^\top X) w
    $$

    ### The Lagrange multiplier solution

    The constraint is enforced with a multiplier $\lambda$:
    $$
    \mathcal{L}(w, \lambda) = w^\top X^\top X w - \lambda(w^\top w - 1)
    $$
    Differentiate and set to zero:
    $$
    \frac{\partial \mathcal{L}}{\partial w} = 2X^\top X w - 2\lambda w = 0
    $$
    hence
    $$
    X^\top X w = \lambda w
    $$

    **This is the eigenvector equation for $X^\top X$.** So the optimal $w$ is
    the top eigenvector of $X^\top X$, and the maximum variance achieved is
    $\lambda$ — the corresponding eigenvalue.

    ### Why PCA is a special case of SVD

    Since $X^\top X$ is symmetric PSD, write $X^\top X = V\Sigma^2 V^\top$. Then
    for a unit vector $w$:
    $$
    w^\top X^\top X w = \sum_{i=1}^{p} \sigma_i^2 (v_i^\top w)^2
    $$
    With $\sum_i (v_i^\top w)^2 = 1$, this is maximised by putting all the weight
    on the largest $\sigma_i$. So the top eigenvector of $X^\top X$ is $v_1$,
    the top right singular vector of $X$.

    **Therefore: PCA via SVD is identical to PCA via $X^\top X$ — but
    numerically far better.**

    Here is why. The "covariance" route requires forming $X^\top X$, which
    *squares* the condition number. If $X$ has singular values
    $\sigma_1 = 1$ and $\sigma_2 = 10^{-8}$, then $X^\top X$ has eigenvalues
    $1$ and $10^{-16}$ — at the edge of double precision. The eigenvector for
    the tiny direction is numerically garbage.

    The SVD route never forms $X^\top X$. It works with $\sigma_i$ directly, so
    the relative error in $\sigma_2$ is about $\epsilon$, not
    $\epsilon/\sigma_2^2$.

    **Practical consequence:** always use `sklearn.decomposition.PCA(svd_solver='full')`
    or `np.linalg.svd`, never the `covariance_eigh` solver, on ill-conditioned
    data. This is not a micro-optimisation; it is the difference between a
    correct answer and numerical noise.

    ### Centring is not optional

    PCA finds directions of maximum variance. If you forget to centre $X$, the
    first principal component will point along the *mean*, not along the
    variation. Concretely: a dataset where feature 2 is `feature 1 + 100`
    (perfectly correlated, shifted) has essentially no variance structure of
    its own, and uncentred PCA will happily return the mean vector as the
    "principal direction".

    ### The projection and reconstruction

    - Scores (projected data): $Z = X V_k$
    - Reconstruction: $\hat{X} = Z V_k^\top = X V_k V_k^\top$
    - Explained variance ratio for component $i$:
      $$
      \frac{\sigma_i^2}{\sum_j \sigma_j^2}
      $$

    ## 6. Putting it together: the geometry of a linear layer

    A dense layer computes $y = Wx + b$ with $W \in \mathbb{R}^{m \times n}$.

    - The **singular values of $W$** determine how the layer transforms
      directions. Directions aligned with the top singular vectors are
      amplified; those aligned with the bottom are suppressed.
    - The **condition number $\kappa(W)$** determines how much a perturbation
      in $x$ is amplified. $\kappa(W) \approx 1$ means the layer is
      well-conditioned.
    - **Layer normalisation** rescales activations to control exactly this
      scale mismatch — it is a direct response to the spectral properties of
      the weight matrix.

    This is the bridge between linear algebra and practice: modern networks are
    not just stacking linear maps, they are stacking maps whose *spectra* you
    must keep under control.

    ## 7. Numerical reality: what actually breaks

    Everything above assumes exact arithmetic. In floating point:

    | Symptom | Cause | Mitigation |
    |---|---|---|
    | `LinAlgError: Eigenvalues did not converge` | ill-conditioned matrix | scale features; add ridge $\lambda I$ |
    | PCA components with tiny variance but huge weights | $X^\top X$ squared the condition number | use SVD, not covariance |
    | Negative variances from `np.var` | catastrophic cancellation | use a stable algorithm (Welford) |
    | Exploding gradients | $\prod W^{(l)}$ amplifies if $\sigma_{\max}(W) > 1$ | normalisation layers, careful init |
    | Vanishing gradients | $\sigma_{\min}$ shrinks layer over layer | residual connections, ReLU-family |

    **A concrete failure worth internalising.** Consider a layer with
    $W = 0.9 I$ repeated 50 times. Each layer scales a signal by 0.9, so the
    output is scaled by $0.9^{50} \approx 0.005$ — the signal nearly vanishes.
    Now $W = 1.1 I$ repeated 50 times: $1.1^{50} \approx 117$. The signal
    explodes. Neither layer has an eigenvalue outside $[0.9, 1.1]$ — each is
    "close to identity" — yet 50 layers amplify by 117×. This is the spectral
    reason why deep networks need normalisation, and why "keep the weights
    near 1" is a genuinely dangerous heuristic on its own.

    ## The longer version

    The remaining statements, verbatim: why inverting a matrix is the wrong
    reflex, and how ridge regularises the numerics of the solve rather than only
    the estimator.

    ### Failure modes, in full

    - You will be handed a matrix and asked what to do with it. `eig`? `svd`? `cholesky`? A formula list gives you no way to choose, and choosing wrong costs you accuracy or numerical stability.
    - Nearly every scaling bug in production ML traces back to forming $X^\top X$ when you should have taken an SVD, which silently squares your condition number.
    - Interviewers ask "why SVD?" and "why not eig?" because the answer reveals whether you understand the machinery or have memorised a list.
    - Every layer of a neural network is a matrix operation. The mathematics here is not academic — it is the layer you are optimising.

    ### The mechanisms, in full

    - **The reason every decomposition exists is to make a matrix cheap to act on.** A dense $n \times n$ matrix costs $O(n^2)$ per matrix-vector product. If it were diagonal, the same product would cost $O(n)$ — one scale per coordinate. Every factorisation writes $A$ as a product whose expensive part changes coordinates and whose cheap part only scales.
    - **$\sigma_i^2 = \lambda_i(A^\top A)$ is the load-bearing fact of the whole module.** The singular values are the square roots of the eigenvalues of $A^\top A$. PCA, the Eckart–Young theorem, and the condition number of a network layer are all this one statement in different clothes.
    - **Use `eigh`, never `eig`, on a symmetric matrix.** `numpy.linalg.eig` returns arbitrary complex eigenvalues for symmetric input and makes no orthogonality guarantee, so the eigenvectors it returns may not form an orthonormal basis. `eigh` exploits the symmetry and returns real eigenvalues with orthonormal eigenvectors.
    - **Forming $X^\top X$ to save time before an SVD is the most common numerical mistake in ML.** It squares the condition number: if $X$ has $\sigma_1 = 1$ and $\sigma_2 = 10^{-8}$, then $X^\top X$ has eigenvalues $1$ and $10^{-16}$ — the second is at the edge of double precision and its eigenvector is numerical noise. The SVD route works with $\sigma_i$ directly and keeps relative error near $\epsilon$.
    - **Never invert a matrix.** `np.linalg.inv` is almost never what you want: it is numerically unstable, it is slower than factorising and solving against the factorisation, and inverting a singular matrix produces inf and nan rather than an error you would notice.
    - **Ridge regularises the numerics of the solve, not just the estimator.** The normal equations have matrix $X^\top X$ with condition number $\kappa(X)^2$ — note the square. Ridge replaces it with $X^\top X + \lambda I$, whose eigenvalues are all at least $\lambda$, so adding $\lambda$ can fix a fit that diverges even when you expect no overfitting.
    - **The best rank-$k$ approximation needs no search.** Truncating the SVD *is* the Eckart–Young optimal solution, with error $\sqrt{\sum_{i>k}\sigma_i^2}$. There is no optimisation problem to solve and no approximation quality to tune.
    - **Cholesky is the cheap, stable way to solve a system — but only for symmetric positive definite matrices.** It costs roughly half of LU's constant factor. Attempt it on a matrix that is merely symmetric and it will fail on a negative pivot, which is the correct behaviour.
    - **Condition number is the number that predicts your error.** A backward-stable algorithm can still produce a wildly wrong answer when the problem is ill-conditioned: relative error in the output is bounded by $\kappa(A) \cdot \epsilon$. Know your data's condition number before trusting a result.


