  implementations:
    - language: python
      title: "Eigendecomposition and SVD from scratch (NumPy)"
      note: >-
        Written without `np.linalg.eig` or `np.linalg.svd` for the
        eigendecomposition path, so the mechanism is visible. The power
        iteration is the implementation you would actually use in training.
      code: |
        import numpy as np

        def power_iteration(A, n_iter=1000, tol=1e-12):
            """Find the dominant eigenpair of a symmetric matrix."""
            n = A.shape[0]
            v = np.ones(n) / np.sqrt(n)          # deterministic start
            lam = 0.0
            for _ in range(n_iter):
                w = A @ v
                norm = np.linalg.norm(w)
                if norm < 1e-300:                # degenerate: A is ~zero
                    return np.zeros(n), 0.0
                v_next = w / norm
                lam_next = float(v_next @ A @ v_next)
                if abs(lam_next - lam) < tol:
                    return v_next, lam_next
                v, lam = v_next, lam_next
            return v, lam

        def power_iteration_deflation(A, k, **kw):
            """Top-k eigenpairs via deflated power iteration."""
            A = A.copy()
            vectors, values = [], []
            for _ in range(k):
                v, lam = power_iteration(A, **kw)
                if lam < 1e-12:
                    break
                vectors.append(v)
                values.append(lam)
                # Deflate: remove this direction from the operator.
                A = A - lam * np.outer(v, v)
            return np.array(values), np.array(vectors).T

        def gram_spectrum(X):
            """Eigenvalues of X^T X, computed stably via SVD."""
            # singular values of X == sqrt(eigenvalues of X^T X)
            sigma = np.linalg.svd(X, compute_uv=False)
            return sigma ** 2

        def pca_svd(X, k):
            """PCA via SVD. Returns (mean, components, explained_variance_ratio)."""
            mu = X.mean(axis=0)
            Xc = X - mu
            U, S, Vt = np.linalg.svd(Xc, full_matrices=False)
            components = Vt[:k]                       # (k, p)
            total = (S ** 2).sum()
            ratios = (S[:k] ** 2) / total if total > 0 else np.zeros(k)
            return mu, components, ratios

        def pca_covariance(X, k):
            """PCA via the covariance matrix. Numerically inferior -- see notes."""
            mu = X.mean(axis=0)
            Xc = X - mu
            C = (Xc.T @ Xc) / (Xc.shape[0] - 1)
            vals, vecs = np.linalg.eigh(C)           # symmetric -> eigh
            order = np.argsort(vals)[::-1][:k]
            return mu, vecs[:, order].T, vals[order] / vals.sum()

        # ── Demo ────────────────────────────────────────────────────────────
        if __name__ == "__main__":
            # A matrix with a near-degenerate spectrum: the covariance route
            # loses the small direction, the SVD route keeps it.
            rng = np.random.default_rng(0)
            X = rng.normal(size=(200, 3)) @ np.diag([1.0, 1e-4, 1e-4])

            mu, comps, ratios = pca_svd(X, 3)
            print("SVD      ratios:", np.round(ratios, 6))

            mu2, comps2, ratios2 = pca_covariance(X, 3)
            print("covariance ratios:", np.round(ratios2, 6))
            print("max |component difference|:",
                  np.abs(comps - comps2).max())

    - language: python
      title: "Cholesky, and sampling from a multivariate Gaussian"
      note: >-
        Cholesky is $O(n^3/3)$ flops versus $O(n^3)$ for LU, and is
        numerically stable for SPD matrices. The
        `log_det` trick — summing log-diagonals rather than forming the
        determinant — is the standard way to get a Gaussian log-density without
        overflow.
      code: |
        import numpy as np

        def cholesky(A, tol=1e-12):
            """Cholesky decomposition A = L L^T by the outer-product form."""
            A = np.asarray(A, dtype=float)
            n = A.shape[0]
            L = np.zeros_like(A)
            for i in range(n):
                for j in range(i + 1):
                    s = A[i, j] - L[i, :j] @ L[j, :j]
                    if i == j:
                        if s <= tol:
                            raise np.linalg.LinAlgError(
                                "Matrix is not positive definite "
                                f"(leading minor {i} is {s:.3e})"
                            )
                        L[i, j] = np.sqrt(s)
                    else:
                        L[i, j] = s / L[j, j]
            return L

        def sample_gaussian(mu, Sigma, n=1000, rng=None):
            """Draw from N(mu, Sigma) via the Cholesky factor."""
            rng = rng or np.random.default_rng(0)
            L = cholesky(Sigma)
            z = rng.standard_normal((n, len(mu)))
            return mu + z @ L.T

        def gaussian_logpdf(x, mu, Sigma):
            """Log-density of N(mu, Sigma) without forming det(Sigma)."""
            d = len(mu)
            L = cholesky(Sigma)
            diff = x - mu
            # Solve L y = diff (forward substitution).
            y = np.zeros(d)
            for i in range(d):
                y[i] = (diff[i] - L[i, :i] @ y[:i]) / L[i, i]
            quad = y @ y
            log_det = 2.0 * np.sum(np.log(np.diag(L)))
            return -0.5 * (d * np.log(2 * np.pi) + log_det + quad)

        if __name__ == "__main__":
            Sigma = np.array([[2.0, 0.8, 0.3],
                              [0.8, 1.5, 0.2],
                              [0.3, 0.2, 1.0]])
            L = cholesky(Sigma)
            print("L L^T matches Sigma:",
                  np.allclose(L @ L.T, Sigma))

            mu = np.zeros(3)
            draws = sample_gaussian(mu, Sigma, n=200_000)
            print("empirical mean :", np.round(draws.mean(axis=0), 3))
            print("empirical cov  :\n", np.round(np.cov(draws.T), 3))
            print("logpdf at zero :", round(gaussian_logpdf(np.zeros(3), mu, Sigma), 4))

