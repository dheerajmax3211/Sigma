  try_it: >-
    Sample 1,000 standard Gaussian vectors at $d = 2$ and again at $d = 768$, then
    compute the empirical standard deviation of pairwise cosine similarity in each
    case. You should land near $0.705$ and $0.036$ — the $1/\sqrt{d}$ prediction —
    and the gap between those two numbers is the whole curse of dimensionality in
    one line of numpy.
  interview_questions:
    - question: "k-NN degrades in high dimensions even with a million rows. Why, and what is the mechanism?"
      level: mid
      key_points:
        - "The neighbourhood radius grows as $r_k = (k/(n V_d))^{1/d}$; at $n = 10^4$, $k = 10$ the 10th neighbour is 94.6% as far as a random stranger at $d = 1000$."
        - "Distances concentrate — the relative spread of pairwise distances falls as $1/\\sqrt{d}$ — so 'nearest' stops being a meaningful ordering."
        - "The data requirement is exponential: keeping a 10-point ball of radius 0.1 needs $3.9\\times10^{22}$ points at $d = 20$."
        - "The rate is $n^{-2/(d+2)}$, so halving the error needs $2^{(d+2)/2}$ times the data — at $d = 10$ that is 64×."
      follow_up: "Cover–Hart says 1-NN is within twice the Bayes error. Where exactly does that guarantee stop applying?"
    - question: "A 768-dimensional embedding index returns results that look random. What do you check, in order?"
      level: senior
      key_points:
        - "Whether the metric is cosine or Euclidean: at $d = 768$ the norm is $\\approx\\sqrt{d} = 27.70$ with a 2.6% spread, so raw distance is dominated by magnitude rather than direction."
        - "L2-normalise and re-measure — the norm term is what concentrates, and dividing it out restores most of the contrast."
        - "Estimate the intrinsic dimension (Levina–Bickel MLE or the participation ratio of the spectrum); a 512-d face embedding usually has an intrinsic dimension in the tens."
        - "Reduce to that intrinsic dimension with PCA, or reweight per coordinate, before concluding the embeddings carry no signal."
      follow_up: "After L2 normalisation the ranking barely changes. What does that tell you about where the failure actually sits?"
    - question: "What is the difference between intrinsic and ambient dimension, and how would you estimate the former?"
      level: mid
      key_points:
        - "Ambient dimension is the number of stored coordinates; intrinsic dimension is the number of directions the data actually varies along."
        - "The Levina–Bickel MLE uses the $k$ nearest distances $T_1 < \\dots < T_k$ per point and averages a log-ratio estimate over the dataset."
        - "The participation ratio $(\\sum \\lambda_i)^2 / \\sum \\lambda_i^2$ of the covariance spectrum is the cheap linear proxy."
        - "Every rate in this topic — $n^{-2/(d+2)}$, $1/\\sqrt{d}$ — is governed by the intrinsic dimension, which is why the practical fixes work at all."
  common_mistakes:
    - "Reading a cosine score of 0.05 as evidence of relatedness at $d = 768$, where unrelated pairs already average 0 with standard deviation $0.036$."
    - "Comparing raw Euclidean distances without normalising, so the norm term — not the direction you meant to compare — dominates the score."
    - "Assuming a ball of radius $r$ still covers a useful fraction of the space: the inscribed sphere is 0.249% of the cube at $d = 10$ and effectively zero by $d = 20$."
  further_reading:
    - label: "Vershynin, High-Dimensional Probability: An Introduction with Applications in Data Science"
    - label: "Beyer, Goldstein, Ramakrishnan & Shaft, When Is 'Nearest Neighbor' Meaningful? (ICDT 1999)"
