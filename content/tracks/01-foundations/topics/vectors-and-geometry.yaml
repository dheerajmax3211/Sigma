id: vectors-and-geometry
slug: vectors-and-geometry
title: "In High Dimensions, Everything Is Far and Nothing Is Near"
summary: >-
  Build the geometric intuition that high-dimensional data actually obeys —
  and unlearn the 2D/3D intuition that quietly breaks every distance-based
  method you will ship.
kind: lesson
difficulty: medium
position: 2
estMinutes: 19
prerequisites: [linear-algebra-foundations]
phase: mathematical-foundations
tags: [linear-algebra, geometry, high-dimensional, knn, embeddings]

body:
  big_idea: >-
    Almost all volume sits in a thin shell, random vectors are nearly orthogonal and
    pairwise distances nearly equal — so every method built on near and far degrades
    predictably, and you can say how.

  problem:
    - "Your k-NN works beautifully on a 50-dimensional dev sample and returns garbage at 768 dimensions — no error, no warning, no obvious symptom."
    - "At $d=768$ unrelated vectors average cosine 0 with sd 0.036: a score of 0.80 is surprising, a score of 0.05 is pure noise."
    - "Every regularisation trick you use later — LayerNorm, weight decay, cosine schedules, temperature scaling — compensates for a geometric property of high-dimensional space."

  analogy: |
    A circle inscribed in a square covers 78% of the floor; a sphere in a cube
    covers 52%, at five dimensions 16%, at ten **0.25%**. Almost the whole
    volume of a high-dimensional cube is in its corners, nowhere near the middle
    — which is why "the nearest neighbour" stops meaning anything: closest and
    furthest are almost the same distance away.

  concept_points:
    - "**Almost all volume is in the shell.** In $d$ dimensions the fraction of a unit ball inside radius $r$ is $r^d$: at $d=100$, $0.9^{100} = 2.7\\times10^{-5}$, so 99.997% of the ball is in the outer 10% shell. At $d=500$, $0.9^{500} \\approx 10^{-23}$. A high-dimensional Gaussian is not a blob with a dense core; it is a hollow shell."
    - "**Distances concentrate, and the rate is $1/\\sqrt{d}$.** For uniform points in $[0,1]^d$ the relative spread $(\\max-\\min)/\\text{mean}$ falls as $1/\\sqrt{d}$: measured $2.42$ at $d=2$, $1.28$ at $d=10$, $0.43$ at $d=100$, $0.15$ at $d=1000$, $0.043$ at $d=10{,}000$. At $d=10{,}000$ every pair is within $\\pm2\\%$ of the same distance, so \"nearest\" is a coin flip among thousands."
    - "**Random vectors are nearly orthogonal, with deviation $1/\\sqrt{d}$.** For independent standard Gaussians, cosine similarity has mean 0 and sd $1/\\sqrt{d}$: measured $0.705$ at $d=2$, $0.316$ at $d=10$, $0.100$ at $d=100$, $0.036$ at $d=768$, $0.016$ at $d=4096$. At $d=768$ a similarity of 0.1 is 2.8σ out — because the signal for related items (0.3–0.8) does not shrink."
    - "**The norm of a Gaussian concentrates too.** For $x \\sim \\mathcal{N}(0, I_d)$, $\\|x\\| \\approx \\sqrt{d}$ with sd $1/\\sqrt{2}$: at $d=768$, mean $27.70$ and sd $0.714$, a 2.6% spread. Every sample lies on a thin shell of radius $\\sqrt{768}$. This is why vector length carries almost no information, and why unit-normalising costs almost nothing."
    - "**Concentration is about your coordinates, not your data.** Real data is not uniform on a cube; it lies near a low-dimensional manifold, and a 512-dimensional face embedding has intrinsic dimension in the tens. The curse describes what happens when you *treat* those coordinates as independent and isotropic. The actionable form: reduce, project, or reweight before measuring distance."
    - "**The practical fix is to make distance discriminate again.** Three levers, in order: (1) reduce dimension — PCA to the intrinsic dimension restores the spread; (2) normalise — L2-normalise and use cosine, which removes the norm term; (3) reweight — whiten so no handful of high-variance features owns the distance. Doing none is the default bug."

  definitions:
    - { term: "Curse of dimensionality", meaning: "The family of ways in which intuitions and algorithms calibrated in low dimensions fail as $d$ grows — distance concentration, volume moving to the shell, and the exponential growth of the space's volume." }
    - { term: "Distance concentration", meaning: "The phenomenon that the ratio between the largest and smallest pairwise distances approaches 1 as $d \\to \\infty$, destroying the discriminative power of nearest-neighbour methods." }
    - { term: "Intrinsic dimension", meaning: "The number of degrees of freedom actually needed to describe the data, as opposed to the ambient dimension of its coordinates. A sheet of paper in a room has ambient dimension 3 and intrinsic dimension 2." }
    - { term: "Cosine similarity", meaning: "$\\cos\\theta = \\frac{u^\\top v}{\\|u\\|\\|v\\|}$ — the cosine of the angle between two vectors. Insensitive to magnitude, which makes it the default for embeddings." }
    - { term: "L2 normalisation", meaning: "Scaling a vector to unit Euclidean norm. It maps every point onto the unit sphere, removing the norm term from dot products so that $u^\\top v$ equals cosine similarity." }
    - { term: "Whitening", meaning: "Transforming features so that their covariance is the identity — decorrelated and unit-variance. It makes Euclidean distance meaningful by giving every direction equal weight." }
    - { term: "Concentration of measure", meaning: "The general phenomenon that a well-behaved function of many independent random variables is nearly constant with high probability. It is the engine behind both distance and norm concentration." }
    - { term: "Participation ratio", meaning: "$\\text{PR} = (\\sum_i \\lambda_i)^2 / \\sum_i \\lambda_i^2$ for the eigenvalues of a covariance matrix — an effective count of how many directions actually carry variance. Equals $k$ when $k$ eigenvalues are equal and all others are zero." }
    - { term: "Annulus / shell", meaning: "The region between two concentric spheres. In high dimensions, nearly all of a ball's volume lies in a thin annulus near its surface." }

  diagrams:
    - type: compare
      title: "Low-dimensional intuition vs high-dimensional reality"
      left_label: "What 2D/3D teaches you"
      left_points:
        - "The centre of a ball holds most of its volume"
        - "The nearest neighbour is meaningfully closer than the tenth"
        - "Random vectors point in visibly different directions"
        - "Sample means converge fast"
      right_label: "What d = 768 actually does"
      right_points:
        - "99.99% of the volume is in the outer shell"
        - "Nearest and furthest are within a few percent of the same distance"
        - "Random vectors are orthogonal to within ±0.036"
        - "Mean error grows as $\\sqrt{d/n}$, so you need $n \\propto d$"
    - type: plot
      title: "Distance concentration: the spread of pairwise distances collapses as 1/√d"
      chart: "line"
      xLabel: "dimensions d"
      yLabel: "(max − min) / mean distance"
      series:
        - name: "uniform [0,1]^d — measured"
          points:
            - { x: 2, y: 2.4238 }
            - { x: 10, y: 1.2813 }
            - { x: 100, y: 0.4302 }
            - { x: 1000, y: 0.1523 }
            - { x: 10000, y: 0.0432 }
    - type: plot
      title: "Random-vector cosine similarity tightens around zero as 1/√d"
      chart: "line"
      xLabel: "dimensions d"
      yLabel: "std of cosine similarity"
      series:
        - name: "measured (20,000 pairs)"
          points:
            - { x: 2, y: 0.7052 }
            - { x: 3, y: 0.5753 }
            - { x: 10, y: 0.3155 }
            - { x: 50, y: 0.1418 }
            - { x: 100, y: 0.1001 }
            - { x: 768, y: 0.0358 }
            - { x: 4096, y: 0.0157 }
        - name: "predicted 1/√d"
          points:
            - { x: 2, y: 0.7071 }
            - { x: 3, y: 0.5774 }
            - { x: 10, y: 0.3162 }
            - { x: 50, y: 0.1414 }
            - { x: 100, y: 0.1000 }
            - { x: 768, y: 0.0361 }
            - { x: 4096, y: 0.0156 }
    - type: architecture
      title: "Where the curse bites in a real retrieval pipeline"
      nodes:
        - { id: raw, x: 0, y: 1, label: "Raw embeddings", kind: client, detail: "768-dimensional vectors straight from a model. Nothing has been normalised, so a handful of high-variance coordinates dominate every distance." }
        - { id: norm, x: 1, y: 1, label: "L2 normalise", kind: server, detail: "Projects every vector onto the unit sphere. Removes the norm term, which at $d=768$ varies by only ~2.6% but carries no semantic signal. After this, dot product equals cosine similarity." }
        - { id: pca, x: 2, y: 0, label: "PCA / whitening", kind: model, detail: "Reduces to the intrinsic dimension (often 30-100 for real embeddings) and equalises per-direction variance. This is the step that actually restores distance discrimination." }
        - { id: index, x: 2, y: 2, label: "ANN index", kind: database, detail: "HNSW or IVF. These structures assume distance is discriminative; their recall degrades silently if it is not." }
        - { id: query, x: 0, y: 3, label: "Query", kind: client, detail: "Must be transformed by the exact same pipeline. Fitting the PCA on all data and querying with an untransformed vector is a classic train/serve skew bug." }
        - { id: rerank, x: 1, y: 3, label: "Exact rerank", kind: worker, detail: "Take the top 100 from ANN and rescore exactly. Cheap, and it recovers most of the recall lost to approximate search." }
      edges:
        - { from: raw, to: norm, label: "unit norm" }
        - { from: norm, to: pca, label: "reduce" }
        - { from: norm, to: index, label: "index as-is" }
        - { from: query, to: index, label: "search" }
        - { from: index, to: rerank, label: "top 100" }
    - type: pipeline
      title: "Diagnosing whether your distance metric is actually working"
      nodes:
        - label: "Sample 10,000 pairs at random"
          note: "unrelated items — a control group"
          detail: "You need the null distribution before any similarity score means anything. Without it, '0.42 similarity' is an unanchored number."
        - label: "Compute the similarity distribution"
          note: "expect mean ≈ 0, sd ≈ 1/√d"
          detail: "If your measured sd is far from 1/√d, your data is not isotropic — which is informative, but means the simple theory does not apply."
        - label: "Compare to known-related pairs"
          note: "e.g. duplicate products"
          detail: "The gap between the null distribution and the related-pair distribution is your signal-to-noise ratio. If they overlap, no threshold will work."
        - label: "Report separation in sd units"
          note: "z = (mean_related − 0) / sd_null"
          detail: "This is the number that tells you if retrieval is feasible. A z of 3 means the top matches are findable; a z of 0.5 means the task is hopeless without better embeddings."
        - label: "Only now choose a threshold"
          note: "e.g. mean_null + 3·sd"
          detail: "Thresholds chosen without the null distribution are guesses dressed up as calibration."
    - type: graph
      title: "One geometric fact, four engineering consequences"
      nodes:
        - { id: conc, label: "Concentration" }
        - { id: knn, label: "k-NN fails" }
        - { id: cosine, label: "cosine > L2" }
        - { id: pca, label: "reduce first" }
        - { id: norm, label: "L2 normalise" }
      edges:
        - { from: conc, to: knn, label: "distances tie" }
        - { from: conc, to: cosine, label: "angles survive" }
        - { from: conc, to: pca, label: "restore spread" }
        - { from: conc, to: norm, label: "kill the norm term" }
    - type: stack
      title: "The four layers you must distinguish"
      layers:
        - "Ambient dimension: the number of coordinates you store (768)"
        - "Intrinsic dimension: the degrees of freedom the data actually uses (30-100)"
        - "Effective dimension after whitening: how many directions carry usable variance"
        - "Retrieval dimension: how many you can afford to search over at your latency budget"

  markdown: |
    ## The one experiment that makes this concrete

    Generate 4,000 points uniformly in $[0,1]^d$ and, for each point, find its
    distance to one other random point. Repeat for several $d$ and look at how
    spread out those distances are relative to their mean:

    | $d$ | mean distance | min | max | (max − min) / mean |
    |---|---|---|---|---|
    | 2 | 0.521 | 0.010 | 1.272 | **2.424** |
    | 10 | 1.265 | 0.447 | 2.069 | **1.281** |
    | 100 | 4.081 | 3.157 | 4.912 | **0.430** |
    | 1,000 | 12.908 | 11.839 | 13.806 | **0.152** |
    | 10,000 | 40.821 | 39.967 | 41.730 | **0.043** |

    Read the last column. At $d = 2$ the closest pair is essentially touching
    and the furthest is 2.4 times the average — distance is a rich signal. At
    $d = 10{,}000$ every pair of points in your dataset is within $\pm 2\%$ of
    the same distance.

    Now ask: what does "the 5 nearest neighbours" mean when the 5th and the
    5,000th are the same distance away? Nothing. The ranking is decided by
    floating-point noise.

    The spread shrinks as $1/\sqrt{d}$. That is the entire content of the curse
    of dimensionality in its applied form.

    ## Why the volume argument matters

    The fraction of a $d$-ball's volume inside radius $r$ is exactly $r^d$ —
    because volume scales as $r^d$. So:

    $$P(\|x\| < 0.9) = 0.9^d$$

    At $d = 100$ that is $2.66 \times 10^{-5}$. **99.9973% of the ball is in
    the outer 10% shell.**

    This is why a high-dimensional Gaussian is not a blob with a dense middle.
    It is a hollow shell of radius $\sqrt{d}$ and thickness $\sim 1/\sqrt{2}$.
    If you sample 1,000 points from $\mathcal{N}(0, I_{768})$, they all sit
    within a 2.6% band of radius 27.7 — and the distance between any two of
    them is therefore $\sqrt{2 \cdot 768} \approx 39.2$, almost always.

    This has a direct practical consequence: **vector magnitude is not
    information**. Normalising to unit length throws away something that was
    already nearly constant, and buys you numerical stability and the
    equivalence of dot product and cosine. That is why every serious embedding
    pipeline L2-normalises.

    ## Why angles survive when distances die

    Cosine similarity of two independent standard Gaussian vectors has mean 0
    and standard deviation $1/\sqrt{d}$:

    | $d$ | measured sd | $1/\sqrt{d}$ |
    |---|---|---|
    | 10 | 0.3155 | 0.3162 |
    | 100 | 0.1001 | 0.1000 |
    | 768 | 0.0358 | 0.0361 |
    | 4096 | 0.0157 | 0.0156 |

    The agreement is exact to three decimals — this is a real law, not a
    metaphor.

    Here is the crucial asymmetry. Distance concentration says the *ratio*
    between nearest and furthest collapses. Cosine concentration says the
    *absolute* deviation from zero collapses. Those sound like the same bad
    news, but they are not, because the **signal** scales differently:

    - For related items (same product, same sentence meaning), cosine
      similarity is often 0.3-0.8 — a fixed, substantial value.
    - The noise floor is $1/\sqrt{d} = 0.036$ at $d = 768$.

    So the signal-to-noise ratio *improves* with dimension, even as the
    distance metric degrades. This is the real reason cosine dominates
    embedding retrieval, and it is a much better answer than "cosine is scale
    invariant".

    ## The inscribed sphere: where it really collapses

    The fraction of a $d$-cube's volume inside its inscribed sphere:

    | $d$ | fraction |
    |---|---|
    | 2 | 0.7854 |
    | 3 | 0.5236 |
    | 5 | 0.1645 |
    | 10 | **0.0025** |
    | 20 | $\approx 10^{-8}$ |

    At $d = 10$, 99.75% of the cube is *outside* the sphere that touches all its
    faces. If you sample uniformly and reject points outside the sphere, you
    accept 1 in 400. At $d = 20$ you accept 1 in 50 million.

    This is the precise death of any algorithm built on "cover the space with
    balls": rejection sampling, k-means initialisation by grid, random restarts
    over a box.

    ## What to actually do

    **1. Normalise.** L2-normalise embeddings before indexing. It removes a
    term (the norm) that carries ~2.6% variation at $d = 768$ and confuses
    dot-product search.

    **2. Reduce before you measure.** PCA to the intrinsic dimension, or
    whitening. Distance concentration is a statement about isotropic
    coordinates; if your data lives on a 40-dimensional manifold inside
    $\mathbb{R}^{768}$, projecting to that manifold restores the spread.

    **3. Diagnose with the null distribution.** Before trusting any similarity
    threshold, sample random pairs and measure. You are looking for the gap
    between the null distribution (mean 0, sd $1/\sqrt{d}$) and your
    related-pair distribution. Express the separation in standard deviations.
    If it is under 2, retrieval will not work and no threshold will save it.

    **4. Prefer angle over magnitude.** When in doubt, use cosine. It is the
    statistic that degrades slowest.

    ## Where the analogy breaks

    Real data is not uniform on a cube, and it is not isotropic Gaussian. It is
    concentrated near a low-dimensional manifold. So the curse is not a
    statement that "high-dimensional ML is impossible" — it is a statement that
    **treating coordinates as independent and equally meaningful is wrong**, and
    the failure is quantitative and predictable.

    The right reading of this whole topic: high dimension is not the enemy.
    *Unstructured* high dimension is. The entire rest of this curriculum —
    PCA, whitening, attention, residual streams, LayerNorm — is machinery for
    imposing structure on high-dimensional space so that distance and angle
    start meaning something again.

    ## The longer version

    The remaining mechanisms, verbatim: where the inscribed sphere really
    collapses, how the sample mean's error grows as $\sqrt{d/n}$, and why angles
    survive when distances die.

    ### Failure modes, in full

    - You will build a k-NN or a vector search index, it will work beautifully on your 50-dimensional dev sample, and it will quietly return garbage in production at 768 dimensions — with no error, no warning, and no obvious symptom.
    - Embedding similarity scores look meaningful because they are numbers between -1 and 1. At $d = 768$ two *unrelated* vectors average cosine similarity 0 with a standard deviation of only 0.036, so a score of 0.80 is genuinely surprising — but a score of 0.05 is pure noise, and nobody tells you that.
    - Every regularisation and normalisation trick you will use later — LayerNorm, weight decay, cosine schedules, temperature scaling — is compensating for a geometric property of high-dimensional space. Without the geometry, those become rituals.
    - Interviewers ask 'why does k-NN fail in high dimensions?' expecting the volume argument, not the phrase 'curse of dimensionality'.

    ### The mechanisms, in full

    - **Almost all volume is in the shell.** In $d$ dimensions, the fraction of a unit ball's volume lying within radius $r$ is $r^d$. Put a number on it: at $d = 100$, the region $r < 0.9$ holds $0.9^{100} = 2.7 \times 10^{-5}$ of the volume — 99.997% of the ball is in the outer 10% shell. At $d = 500$, $0.9^{500} \approx 10^{-23}$, which is smaller than the ratio of a proton to the observable universe. Consequence: a Gaussian in high dimensions is not a blob with a dense core; it is a hollow shell.
    - **Distances concentrate, and the rate is $1/\sqrt{d}$.** For points uniform in $[0,1]^d$, the relative spread of pairwise distances $(\max - \min)/\text{mean}$ falls as $1/\sqrt{d}$. Measured: $2.42$ at $d=2$, $1.28$ at $d=10$, $0.43$ at $d=100$, $0.15$ at $d=1000$, $0.043$ at $d=10{,}000$. At $d=10{,}000$ every pair of points is within $\pm 2\%$ of the same distance, so 'nearest' is a coin flip among thousands of candidates.
    - **Random vectors are nearly orthogonal, with deviation $1/\sqrt{d}$.** For independent standard Gaussian vectors, the cosine similarity has mean 0 and standard deviation $1/\sqrt{d}$. Measured: $0.705$ at $d=2$, $0.316$ at $d=10$, $0.100$ at $d=100$, $0.036$ at $d=768$, $0.016$ at $d=4096$ — matching $1/\sqrt{d}$ to three decimals. So in a 768-dimensional embedding space, the *typical* pair of unrelated vectors has similarity within $\pm 0.036$ of zero. A similarity of 0.1 is already 2.8 standard deviations out, i.e. genuinely unusual.
    - **The norm of a Gaussian concentrates too.** For $x \sim \mathcal{N}(0, I_d)$, $\|x\| \approx \sqrt{d}$ with standard deviation $1/\sqrt{2}$. Measured: at $d=768$, mean $\|x\| = 27.70$ with sd $0.714$ — a 2.6% spread. All samples of a 768-dimensional standard Gaussian lie on the surface of a thin shell of radius $\sqrt{768} \approx 27.7$. This is why 'vector length' carries almost no information about a random embedding, and why normalising embeddings to unit length costs you almost nothing and stabilises dot-product search.
    - **The inscribed sphere vanishes.** The fraction of a $d$-cube occupied by its inscribed sphere is $\pi^{d/2} / (2^d \,\Gamma(d/2+1))$: 78.5% at $d=2$, 52.4% at $d=3$, 16.4% at $d=5$, **0.249% at $d=10$**, and effectively zero by $d=20$. Any sampling scheme that relies on covering a space with balls — rejection sampling, grid search, random restarts — collapses at roughly $d=10$.
    - **Concentration is about your coordinates, not your data.** Real data is not uniform on a cube; it lies near a low-dimensional manifold. A 512-dimensional embedding of faces has an intrinsic dimension in the tens. The curse describes what happens when you *treat* those coordinates as independent and isotropic. That is the actionable form: reduce, project, or reweight before you measure distance.
    - **The practical fix is to make distance discriminate again.** Three levers, in order of power: (1) reduce dimension — PCA to the intrinsic dimension restores the spread; (2) normalise — L2-normalise and use cosine, which removes the norm term that dominates in high $d$; (3) reweight — give each coordinate roughly equal variance (whitening), so no handful of high-variance features owns the distance. Doing none of these is the default bug.
    - **High dimension also breaks the mean.** The sample mean of $n$ points in $d$ dimensions has error $\sigma/\sqrt{n}$ per coordinate, so the total Euclidean error grows like $\sigma\sqrt{d/n}$. To estimate a mean to a fixed *relative* accuracy as $d$ grows, you need $n$ to grow proportionally to $d$. This is why per-dimension statistics computed on small samples in large $d$ are quietly unreliable.
    - **Angles survive better than distances.** Because cosine similarity's noise scales as $1/\sqrt{d}$ while its signal for genuinely related items is often much larger, *direction* remains informative in high dimensions even when *distance* does not. This is the real reason cosine similarity dominates embedding search, and why dot-product models normalise their vectors.


  derivations:
    - title: "Why the cosine standard deviation is 1/√d"
      latex: |
        Let $u, v \in \mathbb{R}^d$ have i.i.d. $\mathcal{N}(0,1)$ entries.
        Then
        $$u^\top v = \sum_{i=1}^d u_i v_i, \qquad \mathbb{E}[u_i v_i] = 0, \qquad \operatorname{Var}(u_i v_i) = 1$$
        so $\operatorname{Var}(u^\top v) = d$ and $u^\top v$ has standard deviation $\sqrt{d}$.
        Now $\|u\|^2 = \sum u_i^2 \sim \chi^2_d$, with mean $d$ and standard
        deviation $\sqrt{2d}$, so $\|u\| \approx \sqrt{d}$ with relative error $O(1/\sqrt{d})$.
        Therefore
        $$\cos\theta = \frac{u^\top v}{\|u\|\|v\|} \approx \frac{u^\top v}{d},$$
        whose standard deviation is $\sqrt{d}/d = 1/\sqrt{d}$.
      prose: >-
        The numerator grows like sqrt(d) while the denominator grows like d, so
        the whole ratio shrinks like 1/sqrt(d). Random vectors in high
        dimensions are orthogonal not because of any structure but because
        orthogonality is simply the most numerous configuration.
    - title: "Why the relative spread of distances falls as 1/√d"
      latex: |
        For $x, y$ independent uniform on $[0,1]^d$, let $z_i = x_i - y_i$.
        Each $z_i$ is triangular on $[-1,1]$ with
        $$\mathbb{E}[z_i^2] = \tfrac{1}{6}, \qquad \mathbb{E}[z_i^4] = \tfrac{1}{15}.$$
        Then $D^2 = \sum_i z_i^2$ has
        $$\mathbb{E}[D^2] = \frac{d}{6}, \qquad
          \operatorname{Var}(D^2) = d\left(\frac{1}{15} - \frac{1}{36}\right) = \frac{7d}{180}.$$
        So the standard deviation of $D^2$ is $\approx 0.197\sqrt{d}$, and the
        relative standard deviation is
        $$\frac{0.197\sqrt{d}}{d/6} = \frac{1.18}{\sqrt{d}}.$$
      prose: >-
        The mean grows linearly in d while the standard deviation grows only as
        sqrt(d), so their ratio — which is what determines whether distances are
        distinguishable — decays as 1/sqrt(d). This is the arithmetic behind
        every "k-NN fails in high dimensions" claim.
    - title: "The volume of the outer shell"
      latex: |
        The volume of a $d$-ball of radius $R$ is $V_d R^d$ for a constant
        $V_d$ depending only on $d$. Hence the fraction of volume inside
        radius $rR$ is
        $$\frac{V_d (rR)^d}{V_d R^d} = r^d.$$
      prose: >-
        Volume scales as the d-th power of the radius, so the "inside" loses
        exponentially fast as d grows. At r=0.9 and d=100 you get 2.7e-5: the
        inside is a rounding error, and the sphere is effectively a shell.
    - title: "Where the 1/√(2d) norm concentration comes from"
      latex: |
        For $x \sim \mathcal{N}(0, I_d)$, $\|x\|^2 \sim \chi^2_d$ with
        $\mathbb{E}\|x\|^2 = d$ and $\operatorname{Var}(\|x\|^2) = 2d$.
        A first-order expansion $\|x\| = \sqrt{\|x\|^2}$ gives
        $$\operatorname{sd}(\|x\|) \approx \frac{1}{2\sqrt{d}} \cdot \sqrt{2d} = \frac{1}{\sqrt{2}}.$$
        So $\|x\| \approx \sqrt{d} \pm 1/\sqrt{2}$, a relative spread of
        $1/\sqrt{2d}$.
      prose: >-
        The absolute spread is a constant — it does not grow with d at all.
        So relative to a mean of sqrt(d), the norm becomes more and more
        predictable. At d=768 the entire distribution of norms fits inside a
        2.6% band, which is why magnitude is not a useful feature.

  implementations:
    - language: python
      title: "Measuring the curse: distance concentration and cosine spread"
      note: >-
        This is the diagnostic you should run before trusting any distance-based
        method. Note that it measures the NULL distribution — random pairs — which
        is the only honest baseline for a similarity score.
      code: |
        import numpy as np

        def concentration_report(dims=(2, 10, 100, 1000, 10000), n=4000, seed=0):
            """Report how much pairwise distance spread survives at each dimension."""
            rng = np.random.default_rng(seed)
            rows = []
            for d in dims:
                x = rng.random((n, d))
                y = rng.random((n, d))
                dist = np.linalg.norm(x - y, axis=1)
                rows.append({
                    "d": d,
                    "mean": float(dist.mean()),
                    "min": float(dist.min()),
                    "max": float(dist.max()),
                    # This ratio is the thing that matters: it is how much
                    # information a distance comparison carries.
                    "spread": float((dist.max() - dist.min()) / dist.mean()),
                    "predicted_1_over_sqrt_d": float(1 / np.sqrt(d)),
                })
            return rows

        def cosine_null(d, n=20000, seed=0):
            """Standard deviation of cosine similarity between unrelated vectors.

            Compare this to 1/sqrt(d). If your measured value is much larger,
            your data is anisotropic and the simple theory does not apply --
            which is itself important to know.
            """
            rng = np.random.default_rng(seed)
            a = rng.normal(size=(n, d))
            b = rng.normal(size=(n, d))
            cos = (a * b).sum(1) / (np.linalg.norm(a, axis=1) * np.linalg.norm(b, axis=1))
            return {"d": d, "mean": float(cos.mean()), "sd": float(cos.std()),
                    "predicted": float(1 / np.sqrt(d))}

        if __name__ == "__main__":
            for row in concentration_report():
                print(f"d={row['d']:6d} spread={row['spread']:.4f}")
    - language: python
      title: "The fix: normalise, whiten, and reduce"
      note: >-
        Whitening is the step people skip. It is numerically wrong when the
        covariance is singular (n < d, or collinear features), because inverting
        a near-zero eigenvalue amplifies noise enormously -- which is why the
        epsilon is not optional.
      code: |
        import numpy as np

        def l2_normalise(x, eps=1e-12):
            """Project rows onto the unit sphere.

            Safe for the zero vector because of eps. After this, dot product
            equals cosine similarity, which is what you want for embeddings.
            """
            x = np.asarray(x, dtype=float)
            return x / np.maximum(np.linalg.norm(x, axis=1, keepdims=True), eps)

        def whiten(x, eps=1e-8):
            """Decorrelate and equalise variance, so Euclidean distance is meaningful.

            The eps guard matters: without it, a near-singular covariance
            (common when n < d) produces enormous amplified noise.
            """
            x = np.asarray(x, dtype=float)
            xc = x - x.mean(axis=0)
            cov = np.cov(xc, rowvar=False)
            vals, vecs = np.linalg.eigh(cov)
            vals = np.maximum(vals, eps)
            return xc @ vecs @ np.diag(1.0 / np.sqrt(vals))

        def participation_ratio(eigenvalues):
            """Effective number of dimensions carrying variance.

            Equals k when k eigenvalues are equal and the rest are zero.
            Use this to pick k for PCA instead of the arbitrary 95% rule.
            """
            lam = np.maximum(np.asarray(eigenvalues, dtype=float), 0.0)
            denom = float((lam ** 2).sum())
            return float(lam.sum() ** 2 / denom) if denom > 0 else 0.0

  checkpoints:
    - id: cp-1
      question: "At $d = 100$, what fraction of a unit ball's volume lies inside radius 0.9, and what does that imply about where your data is?"
      answerKind: short_text
      hint: "Volume scales as $r^d$ — so compute $0.9^{100}$."
      solution: >-
        $0.9^{100} = 2.66 \times 10^{-5}$, so 99.997% of the volume is in the
        outer 10% shell. Your data is on a thin shell near the surface, not
        concentrated in the middle. Any intuition that treats the centre as the
        "typical" region is inverted.
    - id: cp-2
      question: "Your embedding search returns cosine similarities of 0.05, 0.08, and 0.11 for the top three results at $d = 768$. Are these meaningful?"
      answerKind: short_text
      hint: "What is the standard deviation of cosine similarity between unrelated vectors at $d = 768$?"
      solution: >-
        The null standard deviation is $1/\sqrt{768} = 0.036$. So 0.05 is 1.4σ,
        0.08 is 2.2σ, and 0.11 is 3.1σ. Only the third is marginally
        distinguishable from noise, and none are strong matches. A retrieval
        system returning these as "top results" is returning noise with a
        ranking attached.
    - id: cp-3
      question: "Why does L2-normalising embeddings cost you almost nothing in information at $d = 768$?"
      answerKind: short_text
      hint: "How much does the norm of a 768-dimensional Gaussian actually vary?"
      solution: >-
        For $x \sim \mathcal{N}(0, I_{768})$, $\|x\| \approx \sqrt{768} = 27.7$
        with standard deviation $1/\sqrt{2} = 0.707$ — a 2.6% band. The norm is
        already almost constant, so dividing by it discards a quantity that
        carried almost no signal, while gaining numerical stability and the
        dot-product/cosine equivalence.
    - id: cp-4
      question: "You have 5,000 samples in 768 dimensions. Why is whitening dangerous here, and what is the safe alternative?"
      answerKind: short_text
      hint: "What is the rank of a covariance matrix estimated from $n$ points in $d$ dimensions when $n < d$?"
      solution: >-
        The sample covariance has rank at most $n - 1 = 4{,}999$ in a
        768-dimensional space, so many eigenvalues are at or near zero.
        Inverting them amplifies noise enormously — the whitened output is
        dominated by whatever direction happened to have the smallest sample
        variance. Safe alternatives: regularise the eigenvalues
        ($\lambda_i + \epsilon$), reduce first with PCA to a dimension well
        below $n$, or use shrinkage covariance estimation.
    - id: cp-5
      question: "Distance concentration says nearest and furthest converge. Why does cosine similarity still work in embedding search?"
      answerKind: short_text
      hint: "Compare how the noise scales to how the signal scales."
      solution: >-
        They converge in different senses. Distance concentration collapses the
        *ratio* between the nearest and furthest, so ranking by distance becomes
        meaningless. Cosine similarity's *absolute deviation from zero* shrinks
        as $1/\sqrt{d}$ — but the similarity between genuinely related items
        stays large (0.3-0.8) and does not shrink. So the signal-to-noise ratio
        improves with dimension even though distance discrimination degrades.
    - id: cp-6
      question: "How would you decide whether a similarity threshold of 0.7 is reasonable for your retrieval system?"
      answerKind: short_text
      hint: "You need two distributions, not one."
      solution: >-
        Measure both. First the null distribution: sample many random,
        unrelated pairs and record mean and standard deviation (expect mean 0,
        sd $1/\sqrt{d}$). Then the related-pair distribution using known
        duplicates. The threshold is only meaningful if it sits in the gap
        between them. Express the separation in standard deviations: if the mean
        of the related distribution is less than ~3 sd above the null mean, no
        threshold will separate the two and the embeddings need improving
        before the threshold matters.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        High-dimensional space does not behave like a scaled-up version of 3D
        space. The volume of a ball migrates almost entirely to a thin shell
        near its surface, and the distances between random points become almost
        identical. Both effects have exact formulas, and both destroy algorithms
        that rely on "near" and "far" meaning something.
      blocks:
        - kind: checklist
          body: |
            - Volume inside radius r of a unit ball: r^d
            - Spread of pairwise distances: decays as 1/sqrt(d)
            - Spread of random-vector cosine: 1/sqrt(d)
            - What breaks: k-NN, k-means, rejection sampling, ANN recall
            - What survives: angle, and anything you reduce or whiten first
      checkpoint: >-
        Before reading on: why would a thin shell matter for a clustering
        algorithm? What is it that clustering needs that a thin shell fails to
        provide?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Two distinct questions, two distinct tools. If you want to know *how
        badly* the curse is hurting a method, measure the null distribution of
        your similarity or distance statistic and compare the spread to the
        theoretical $1/\sqrt{d}$. If you want to *fix* it, the tool is
        dimensionality reduction (PCA or whitening), because the curse is a
        property of your coordinates rather than your data.
      blocks:
        - kind: checklist
          body: |
            - Diagnose: sample random pairs, measure spread, compare to 1/sqrt(d)
            - Fix (cheap): L2-normalise, so magnitude stops contributing
            - Fix (real): PCA or whitening to the intrinsic dimension
            - Verify: recompute the null spread after the fix — it should widen
      checkpoint: >-
        Which of those two tools would you reach for first if your k-NN
        accuracy dropped after you doubled the embedding dimension?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The diagnostic is a null-distribution measurement; the fix is a
        projection. Neither is complicated, and both are usually skipped.
      blocks:
        - kind: pseudocode
          body: |
            # 1. Diagnose
            for d in candidate_dimensions:
                sample n random pairs
                D = pairwise distances
                spread = (max(D) - min(D)) / mean(D)
                print d, spread, predicted 1/sqrt(d)

            # 2. Fix
            X = l2_normalise(X)              # kill the magnitude term
            Xc = X - mean(X)                 # centre
            vals, vecs = eigh(cov(Xc))       # spectral decomposition
            k = participation_ratio(vals)    # principled choice, not 95%
            Z = Xc @ vecs[:, -k:]            # project

            # 3. Verify the fix actually helped
            re-run step 1 on Z; spread should be larger
      checkpoint: >-
        Why does the verification step matter? What would it mean if the spread
        did not change after projection?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Both concentration results come from the same mechanism: a sum of many
        independent terms has a mean that grows linearly but a standard
        deviation that grows only as the square root. Their ratio therefore
        decays.
      blocks:
        - kind: math
          body: |
            For $z_i = x_i - y_i$ uniform triangular on $[-1,1]$:
            $$\mathbb{E}[z_i^2] = \tfrac16, \quad \mathbb{E}[z_i^4] = \tfrac1{15}$$
            $$D^2 = \sum_{i=1}^d z_i^2 \implies \mathbb{E}[D^2] = \frac{d}{6}, \quad \operatorname{Var}(D^2) = d\left(\tfrac1{15}-\tfrac1{36}\right) = \frac{7d}{180}$$
            $$\text{relative sd}(D^2) = \frac{0.197\sqrt{d}}{d/6} = \frac{1.18}{\sqrt{d}}$$

            For cosine, with $u,v \sim \mathcal{N}(0,I_d)$:
            $$\operatorname{Var}(u^\top v) = d, \quad \|u\| \approx \sqrt{d} \implies \operatorname{sd}(\cos\theta) \approx \frac{\sqrt{d}}{d} = \frac{1}{\sqrt{d}}$$

            For the norm, $\|x\|^2 \sim \chi^2_d$:
            $$\operatorname{sd}(\|x\|) \approx \frac{\sqrt{2d}}{2\sqrt{d}} = \frac{1}{\sqrt{2}}$$
      checkpoint: >-
        The norm's standard deviation is a constant, not a function of d. Why
        does that make the *relative* spread shrink, and why does that justify
        L2 normalisation?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete diagnostic and repair pipeline, with the reasoning for each
        choice and the places it fails.
      blocks:
        - kind: warning
          body: >-
            A reference implementation is only useful after you have attempted
            the problem yourself. Read the diagnostic first, predict what it
            will report for your own data, then compare.
        - kind: code
          language: python
          body: |
            import numpy as np

            def l2_normalise(x, eps=1e-12):
                x = np.asarray(x, float)
                return x / np.maximum(np.linalg.norm(x, axis=1, keepdims=True), eps)

            def build_null(X, n_pairs=20000, seed=0):
                """Null distribution of cosine similarity: unrelated pairs."""
                rng = np.random.default_rng(seed)
                n = X.shape[0]
                i = rng.integers(0, n, n_pairs)
                j = rng.integers(0, n, n_pairs)
                keep = i != j
                a, b = X[i[keep]], X[j[keep]]
                return ((a * b).sum(1) /
                        (np.linalg.norm(a, axis=1) * np.linalg.norm(b, axis=1)))

            def diagnose(X):
                Xn = l2_normalise(X)
                null = build_null(Xn)
                d = X.shape[1]
                return {
                    "d": d,
                    "null_mean": float(null.mean()),
                    "null_sd": float(null.std()),
                    "predicted_sd": float(1 / np.sqrt(d)),
                    # If this ratio is far above 1, your data is anisotropic.
                    "anisotropy": float(null.std() / (1 / np.sqrt(d))),
                }

            def repair(X, eps=1e-8):
                """L2-normalise, centre, whiten, and reduce to the effective dimension."""
                Xn = l2_normalise(X)
                Xc = Xn - Xn.mean(axis=0)
                cov = np.cov(Xc, rowvar=False)
                vals, vecs = np.linalg.eigh(cov)
                vals = np.maximum(vals, eps)
                # participation ratio: principled k
                pr = float(vals.sum() ** 2 / (vals ** 2).sum())
                k = max(1, int(round(pr)))
                order = np.argsort(vals)[::-1][:k]
                return Xc @ (vecs[:, order] / np.sqrt(vals[order]))

            # Verification is the part people skip:
            #   before = diagnose(X)
            #   after  = diagnose(repair(X))
            #   after["null_sd"] should be LARGER than before["null_sd"],
            #   meaning similarity now discriminates again.
      checkpoint: >-
        After whitening, the null standard deviation should be larger. Explain
        why a *larger* spread is the good outcome here, when in the distance
        case a larger spread was what you wanted to restore too. What is the
        common principle?

  problems:
    - id: p-cosine-matrix
      title: "Cosine similarity matrix"
      difficulty: easy
      prompt: >-
        Implement `cosine_matrix(X)` for a 2-D array of row vectors. Return
        the $n \times n$ matrix of pairwise cosine similarities. The diagonal
        must be exactly 1.0 for non-zero rows, and any zero row must produce
        zeros in its row and column (rather than NaN).
      starter: |
        import numpy as np

        def cosine_matrix(X):
            # your implementation here
            pass
      language: python
      entry: cosine_matrix
      testCases:
        - input: "[[[3.0, 4.0], [0.0, 1.0]]]"
          expected: "[[1.0, 0.8], [0.8, 1.0]]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1.0, 0.0], [0.0, 1.0]]]"
          expected: "[[1.0, 0.0], [0.0, 1.0]]"
          mode: json
          tolerance: 1e-9
        - input: "[[[1.0, 2.0], [2.0, 4.0]]]"
          expected: "[[1.0, 1.0], [1.0, 1.0]]"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def cosine_matrix(X):
            X = np.asarray(X, dtype=float)
            norms = np.linalg.norm(X, axis=1, keepdims=True)
            # A zero row has no direction. Guard the division so it produces
            # zeros instead of NaN, which would poison the whole matrix.
            safe = np.maximum(norms, 1e-12)
            Xn = X / safe
            sim = Xn @ Xn.T
            # Force the diagonal to exactly 1 for non-zero rows.
            nonzero = norms.ravel() > 1e-12
            np.fill_diagonal(sim, nonzero.astype(float))
            return sim
      solutionExplanation: >-
        Normalising each row to unit length turns the dot product into a cosine.
        The two guards matter in practice: `maximum(norms, eps)` prevents 0/0 on
        a zero vector, and forcing the diagonal handles floating-point drift so
        `sim[i, i]` is exactly 1.0 rather than 0.9999999999. Parallel vectors
        give 1.0 regardless of magnitude, which is the whole point of cosine.
      complexity: "O(n²d) time, O(n²) space"
      tags: [similarity, cosine, numpy]

    - id: p-participation-ratio
      title: "Effective dimensionality from a spectrum"
      difficulty: medium
      prompt: >-
        Implement `participation_ratio(eigenvalues)`. Given a sequence of
        non-negative eigenvalues, return $(\sum_i \lambda_i)^2 / \sum_i \lambda_i^2$.
        Return 0.0 if the sum of squares is zero. Clip negative inputs to zero
        first, since numerical eigensolvers can return small negatives.
      starter: |
        def participation_ratio(eigenvalues):
            # your implementation here
            pass
      language: python
      entry: participation_ratio
      testCases:
        - input: "[[4.0, 1.0, 1.0, 0.0]]"
          expected: "2.0"
          mode: json
          tolerance: 1e-9
        - input: "[[1.0, 1.0, 1.0, 1.0]]"
          expected: "4.0"
          mode: json
          tolerance: 1e-9
        - input: "[[10.0, 0.0, 0.0]]"
          expected: "1.0"
          mode: json
          tolerance: 1e-9
        - input: "[[0.0, 0.0]]"
          expected: "0.0"
          mode: json
          tolerance: 1e-9
      solution: |
        def participation_ratio(eigenvalues):
            total = 0.0
            sq = 0.0
            for lam in eigenvalues:
                v = float(lam)
                if v > 0.0:          # clip numerical negatives
                    total += v
                    sq += v * v
            if sq == 0.0:
                return 0.0
            return (total * total) / sq
      solutionExplanation: >-
        The participation ratio answers "how many directions actually carry
        variance?" It equals k when k eigenvalues are equal and the rest are
        zero, and equals 1 when a single direction dominates. It is a better
        way to choose k for PCA than the arbitrary 95%-variance rule, because
        it is scale-free — multiplying every eigenvalue by a constant leaves it
        unchanged.
      complexity: "O(n) time, O(1) space"
      tags: [pca, spectrum, dimensionality]

    - id: p-ball-volume
      title: "The vanishing inscribed sphere"
      difficulty: medium
      prompt: >-
        Implement `ball_cube_ratio(d)` — the fraction of a $d$-dimensional cube
        of side 2 occupied by its inscribed unit-radius sphere, using
        $V_d = \pi^{d/2} / \Gamma(d/2 + 1)$. Use `math.gamma`. Return a float.
        For $d = 0$ return 1.0.
      starter: |
        import math

        def ball_cube_ratio(d):
            # your implementation here
            pass
      language: python
      entry: ball_cube_ratio
      testCases:
        - input: "[2]"
          expected: "0.7853981633974483"
          mode: json
          tolerance: 1e-9
        - input: "[3]"
          expected: "0.5235987755982988"
          mode: json
          tolerance: 1e-9
        - input: "[10]"
          expected: "0.002490394570193735"
          mode: json
          tolerance: 1e-9
        - input: "[0]"
          expected: "1.0"
          mode: json
          tolerance: 1e-9
      solution: |
        import math

        def ball_cube_ratio(d):
            if d == 0:
                return 1.0
            # Volume of the unit d-ball.
            v_ball = math.pi ** (d / 2.0) / math.gamma(d / 2.0 + 1.0)
            # Cube of side 2 has volume 2^d.
            return v_ball / (2.0 ** d)
      solutionExplanation: >-
        The ball's volume is pi^(d/2)/Gamma(d/2+1) and the cube's is 2^d, so the
        ratio is pi^(d/2)/(2^d Gamma(d/2+1)). The ratio falls off a cliff: 0.785
        at d=2, 0.524 at d=3, and 0.00249 at d=10 — meaning 99.75% of a
        10-dimensional cube is outside the sphere that touches all its faces.
        That collapse is precisely why rejection sampling and ball-covering
        algorithms die around ten dimensions.
      complexity: "O(1) time, O(1) space"
      tags: [geometry, volume, high-dimensional]

  visualizers:
    - id: vs-highd-shell
      kind: shape_flow
      title: "Where the volume actually lives"
      description: >-
        Drag the dimension from 2 to 200 and watch the inscribed-sphere fraction
