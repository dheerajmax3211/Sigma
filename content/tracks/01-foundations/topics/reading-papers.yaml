id: reading-papers
slug: reading-papers
title: "Read the Claim, Not the Abstract: A Three-Pass Method"
summary: >-
  Read a paper in three passes with a defined output at each one, build a
  claim–evidence table from its figures and ablations, and reproduce one link
  of its argument — so you can say what the paper actually established rather
  than what its abstract asserts.
kind: lesson
difficulty: medium
position: 14
estMinutes: 23
prerequisites: [linear-algebra-foundations, probability-distributions]
phase: mathematical-foundations
tags: [research, reading, evaluation, reproducibility, methodology]

body:
  big_idea: >-
    A paper is an argument, not a report, so reading it means rebuilding the chain from
    claim to experiment to number — and reproducing one link of it yourself before
    believing the abstract.

  problem:
    - "You have forty papers before Thursday's reading group and no method for deciding which five matter, so you finish none of them."
    - "You implement a method, land three points below the reported number, and cannot tell whether you erred or the number was never reproducible."
    - "You cite a result, someone asks what the baseline was tuned to, and you read only the abstract and the architecture diagram."

  analogy: |
    Buying a house, you do three inspections at three prices. You drive past it:
    two minutes, and most houses lose you there. You walk through with the
    agent: twenty minutes, and you learn the layout and which walls are
    load-bearing. You pay a surveyor: half a day, and only the surveyor opens
    the floorboards. The drive-past is pass 1, the walk-through pass 2, the
    surveyor pass 3.

  concept_points:
    - "**Three passes, three different questions.** Pass 1 is ten minutes on title, abstract, intro, headings, conclusions and figures; its only output is a decision plus one sentence. Pass 2 is an hour on the argument — figures and tables in detail — producing a three-sentence summary. Pass 3 is four to five hours of virtual reimplementation, and its output is what the paper omits."
    - "**Read the figures before the method.** For each figure, write four things: the x-axis, the y-axis, what the error bars represent (std over seeds? over examples? nothing?), and the baseline tuning budget — if you cannot fill all four, you have not read it. \"± std over 3 seeds\" gives a standard error of $\\sigma/\\sqrt{3} = 0.58\\sigma$, so \"exceeds the std\" is a 1.7σ claim."
    - "**Build the claim–evidence table, one row per abstract claim.** Columns: the claim quoted from the abstract, the experiment that tests it, the metric, whether any experiment *isolates* it by removing exactly the proposed component, and the confounds. A typical abstract makes four to six claims, and one or two have no isolating experiment — which means you cannot attribute them."
    - "**The ablation table is the paper; the headline table is the advertisement.** A contribution is what changes when you remove the thing, with everything else held fixed — and that is where papers cheat, by changing parameter count alongside the component. If removing component A costs 0.3 points and run-to-run sd is 0.4 points, A is a tuning detail, not a contribution."
    - "**Baselines are the weakest link, and re-tuning them erases headline gains.** Melis et al. (ICLR 2018) showed a tuned LSTM matched or beat the reported state of the art; Lucic et al. (NeurIPS 2018) gave every GAN variant the same tuning budget and found no consistent winner. The question is not \"what is the baseline\" but \"did it get the same search, epochs and preprocessing\"."
    - "**Significance is usually absent, and you can compute it in your head.** For $n$ examples at accuracy $p$ the standard error of a difference is roughly $\\sqrt{2p(1-p)/n}$: at $n=10{,}000$, $p=0.90$ that is 0.42 points, so the 95% floor is 0.83 points. A reported 0.4-point gain is a 0.95σ event — a coin landing slightly off-centre, printed to one decimal place."

  definitions:
    - term: "Claim"
      meaning: >-
        A sentence that asserts something checkable — "X beats Y", "removing Z
        costs 1.2 BLEU". Distinct from a contribution ("we introduce Z"), which
        asserts only that an artifact exists.
    - term: "Contribution list"
      meaning: >-
        The bulleted list at the end of the introduction. It is the authors'
        own index of what they believe they did, and the correct checklist to
        hold the experiments against.
    - term: "Baseline"
      meaning: >-
        The method you must beat for the claim to mean anything. Its tuning
        budget, epoch count and preprocessing are the four things to check
        before believing any comparison against it.
    - term: "Ablation study"
      meaning: >-
        An experiment that removes one component from the full system and
        reports the change. It is the only experiment that attributes a result
        to a component; everything else shows only that the whole system works.
    - term: "Isolating experiment"
      meaning: >-
        An ablation in which exactly one thing changes. If removing a component
        also changes the parameter count, the training time or the data, the
        experiment is confounded and attributes nothing.
    - term: "Error bar"
      meaning: >-
        The interval drawn on a figure. It means nothing until you know what it
        is: std over seeds, std over examples, standard error of the mean, or a
        confidence interval are four different quantities differing by factors
        of $\sqrt{n}$.
    - term: "Seed variance"
      meaning: >-
        The run-to-run spread of a metric caused by initialisation, data order
        and nondeterminism. In deep learning it is routinely comparable to the
        reported improvements, and it is the first thing to look for and the
        first thing that is missing.
    - term: "Test-set contamination"
      meaning: >-
        Any use of the test set in a decision — hyperparameter choice, early
        stopping, model selection, prompt tuning. It converts the reported
        number from an estimate into a maximum over the configurations you
        tried.
    - term: "Reproducibility checklist"
      meaning: >-
        Joelle Pineau's itemised list of what a paper must report to be
        reproducible: code, data, splits, seeds, the full hyperparameter search
        space, compute, and the exact evaluation code. The frequent failures are
        the search space and the number of seeds, not the code.
    - term: "Appendix"
      meaning: >-
        Where the thing you need actually lives. Dataset statistics, the full
        ablation, the hyperparameters, the failure cases, and the limitation the
        main text omitted. A pass-2 reading that never opens it is a reading of
        the marketing.

  diagrams:
    - type: pipeline
      title: "The three-pass protocol — each pass answers a different question"
      nodes:
        - label: "Pass 1 — triage"
          note: "5–10 min"
          detail: "Title, abstract, introduction, headings, conclusions, figures. Output: one sentence stating the claim, and the question pass 2 must answer. Decision: continue or stop."
        - label: "Decide: continue?"
          note: "reject ~80%"
          detail: "Stopping here is the normal outcome and costs six minutes. A literature scan that runs pass 2 on everything is a literature scan that finishes nothing."
        - label: "Pass 2 — the argument"
          note: "45–60 min"
          detail: "Figures and tables first, then method, then related work. No proofs. Output: a three-sentence summary with the evidence attached, specific enough to be challenged."
        - label: "Build the claim–evidence table"
          note: "one row per claim"
          detail: "Claim, experiment, metric, isolating or not, confounds. The rows that come out empty are the paper's soft spots and your reading list."
        - label: "Pass 3 — reproduce one link"
          note: "4–5 h"
          detail: "Pick the smallest checkable claim and reimplement it from the description. Output: the list of things the paper does not tell you, which is where the real understanding is."
    - type: compare
      title: "Two legitimate readings, two different jobs"
      left_label: "Reading to cite (pass 2)"
      left_points:
        - "45–60 minutes, once"
        - "You need the claim, the setting it holds in, and the caveat"
        - "Output: one paragraph with a number and its table reference"
        - "The appendix stays closed; the repo is not cloned"
        - "Success: you can answer 'what was the baseline tuned to?'"
      right_label: "Reading to build on (pass 3)"
      right_points:
        - "4–5 hours, plus whatever the reimplementation costs"
        - "You need every detail, including the ones the paper omits"
        - "Output: code that matches one reported number or explains why not"
        - "You live in the appendix, the repo and the issue tracker"
        - "Success: your number is inside the paper's own noise"
    - type: mermaid
      title: "How deep does this paper need to be read?"
      code: |
        flowchart TD
          A[Paper in your queue] --> B{Does the abstract name<br/>a checkable claim?}
          B -- No --> C[One-line note.<br/>Do not read further.]
          B -- Yes --> D{Is it load-bearing for<br/>something you will build?}
          D -- No --> E[Pass 1 only.<br/>One sentence plus the caveat.]
          D -- Yes --> F[Pass 2.<br/>Build the claim-evidence table.]
          F --> G{Does any experiment<br/>isolate the claim?}
          G -- No --> H[Cite with the caveat,<br/>or drop the citation.]
          G -- Yes --> I{Is the gap larger than<br/>seed noise and 2 standard errors?}
          I -- No --> H
          I -- Yes --> J[Pass 3.<br/>Reproduce one link.]
    - type: pipeline
      title: "The reproduction ladder — three rungs, three different tests"
      nodes:
        - label: "Rung (a): run the released code"
          note: "tests the artifact"
          detail: "Cheapest, and the one everybody means by 'reproducible'. A stale README fails here without telling you anything about the science."
        - label: "Rung (b): reimplement one component from the text"
          note: "tests the description"
          detail: "The honest rung. If you cannot match the number from the description alone, the paper is under-specified in a way that matters to anyone building on it."
        - label: "Rung (c): reimplement small, check the trend"
          note: "tests the claim"
          detail: "Absolute numbers will not transfer to a smaller scale; the ordering and the shape of the curve should. If the trend inverts, the claim was about a regime, not about the method."
    - type: stack
      title: "From the sentence in the abstract down to what actually happened"
      layers:
        - "Abstract: 'improving over the existing best results, including ensembles, by over 2 BLEU'"
        - "Contribution list: four components, of which the experiments vary three"
        - "Experiment: Table 2, one row, one test set, one decoding configuration"
        - "Number: 28.4 BLEU, a single training run, no variance reported"
        - "Substrate: 3.5 days on 8 P100s, one hyperparameter configuration, chosen on dev"

  markdown: |
    ## A paper you think you have already read

    Take *Attention Is All You Need* (Vaswani et al., 2017). Most people have
    read the abstract and looked at the diagram. Run the method on it and watch
    what the abstract did not tell you.

    ### Pass 1 — six minutes, one sentence

    Read the title, abstract, Figure 1, Table 2, the section headings and the
    conclusion. Do not open Section 3.

    The abstract gives four numbers — 28.4 BLEU on WMT 2014 English–German, 41.8
    on English–French, 3.5 days, eight GPUs — and one comparative claim:
    improving over the existing best results, *including ensembles*, by over 2
    BLEU. The output of pass 1 is a sentence and a decision:

    > Claim: a sequence model built only from attention matches or beats the best
    > recurrent and convolutional translation systems at lower training cost.
    > Continue: yes — I need to know whether the multi-head structure is
    > load-bearing.

    That last clause is the whole point of the pass. Pass 1 does not produce a
    summary; it produces the question that pass 2 must answer.

    ### Pass 2 — the argument, and Table 3

    Table 2 compares against published numbers. ConvS2S ensemble: 26.36 BLEU
    English–German at $7.7 \times 10^{19}$ FLOPs. Transformer (big): 28.4 at
    $2.3 \times 10^{19}$. Read the cost column carefully — the paper defines it
    as training time × number of GPUs × an assumed sustained TFLOPS, so it
    counts one final training run and not the cost of finding the configuration.
    For the baselines that search was paid in their own papers; for the
    Transformer it was paid in unpublished experiments. The comparison is
    genuinely favourable and it is still not an equal-budget comparison, and no
    paper's is.

    Table 3 is where the paper actually argues. Base model: 25.8 BLEU on
    newstest2013 dev, no checkpoint averaging.

    | Variation | BLEU (dev) | Δ vs base | Params |
    |---|---|---|---|
    | base (8 heads, $d_k = 64$) | 25.8 | — | 65M |
    | 1 head | 24.9 | −0.9 | 65M |
    | 32 heads, $d_k = 16$ | 25.4 | −0.4 | 65M |
    | $d_{\text{model}} = 1024$ | 26.0 | +0.2 | 168M |
    | dropout 0.0 | 24.6 | −1.2 | 65M |
    | learned positional embeddings | 25.7 | −0.1 | 65M |

    Three things fall out that are not in the abstract.

    **The largest effect in the table is dropout**, not attention. Removing it
    costs 1.2 BLEU; the entire multi-head mechanism is worth 0.9.

    **Width buys 0.2 BLEU for 2.6× the parameters.** That is a bad trade, the
    paper reports it honestly in a table, and the abstract does not mention it.

    **Sinusoidal versus learned positional encoding is 0.1 BLEU** — inside any
    plausible noise. The paper says so and gives a *different* reason for the
    choice: extrapolation to sequences longer than those seen in training. That
    is a well-behaved paper. The ablation does not support the choice, and the
    authors tell you the support comes from somewhere else.

    Now answer the question pass 1 produced. Is multi-head load-bearing? The
    answer is 0.9 BLEU on a 25.8 baseline, from one run, with no variance
    reported anywhere in the table. If run-to-run standard deviation were 0.5
    BLEU — unremarkable for a system at this scale — that gap is 1.8σ. That is
    suggestive, not established. You now know something the abstract could not
    tell you: the paper's central architectural claim rests on a single number
    in a table with no error bars.

    ### Pass 3 — reproduce one link

    Pick the smallest checkable claim. Here it is Section 3.2.1, footnote 4:
    assume the components of $q$ and $k$ are independent with mean 0 and
    variance 1, and then $q \cdot k$ has mean 0 and variance $d_k$. That is the
    justification for dividing by $\sqrt{d_k}$, and it is two lines from the
    variance of a sum of independent terms — the same identity you used in
    *Probability Distributions*:

    $$\operatorname{Var}\left(\sum_{i=1}^{d_k} q_i k_i\right) = \sum_{i=1}^{d_k} \operatorname{Var}(q_i k_i) = d_k.$$

    So the logits have standard deviation $\sqrt{d_k}$: 8 at $d_k = 64$, 16 at
    $d_k = 256$. Push logits with standard deviation 8 through a softmax over
    ten keys and the largest weight averages 0.87 — the distribution is nearly
    one-hot, and a one-hot softmax has derivative near zero. With the scaling it
    averages 0.32, close to the uniform value of 0.10 per key. Both numbers come
    out of fifteen lines of NumPy, and the second one is the reason the
    architecture trains at all.

    Rung (b) of the ladder — reimplement from the description alone — is what
    you just did. Rung (a) would have been `pip install` and a stale README.
    Rung (c) would be training a small translation model and checking that the
    BLEU-versus-heads curve is hump-shaped rather than monotone.

    ### What the method bought you

    Four statements you can now defend, none of which is in the abstract:

    - the architecture's headline ablation is 0.9 BLEU, single run, no variance;
    - dropout matters more than the attention pattern (1.2 vs 0.9 BLEU);
    - the compute comparison counts final training runs, not equal tuning budgets;
    - the $1/\sqrt{d_k}$ choice is exactly justified and numerically checkable.

    Write those four lines in your notes with the table references. That is a
    pass-3 understanding of one paper for about two hours, and it is the whole
    difference between citing a paper and having read one.

    ## The longer version

    The remaining mechanisms, verbatim: the five C's of pass 1, the three-rung
    reproduction ladder, the unstated assumptions every paper carries, and the
    triage arithmetic that makes the six-minute decision the expensive one.

    ### Failure modes, in full

    - You have forty papers to get through before Thursday's reading group and no method for deciding which five matter, so you read them in the order they were sent and finish none of them.
    - You implement a method from a paper, land three points below the reported number, and have no way to tell whether you made an error or the number was never reproducible — so you spend a week debugging your own correct code.
    - You cite a result in a design doc, someone asks what the baseline was tuned to, and the honest answer is that you do not know because you read the abstract and the architecture diagram.
    - A reviewer asks why you did not compare against the obvious prior method; the paper's related-work section dismissed it in half a clause, and you took that as an answer.
    - You have to decide, this quarter, whether a technique is worth building on. The decision is reversible only at the cost of the quarter.

    ### The mechanisms, in full

    - **Three passes, three different questions.** Pass 1 takes five to ten minutes on the title, abstract, introduction, section headings, conclusions, and figures, and its only output is a decision plus one sentence: *should I continue, and what question would pass 2 have to answer?* Pass 2 takes about an hour on the argument — figures and tables in detail, method in outline, proofs skipped — and its output is a three-sentence summary with the evidence attached, specific enough that a colleague could challenge it. Pass 3 takes four to five hours and is a virtual reimplementation: you reconstruct each result as if you were the author, and the output is the list of things the paper does not tell you. This is Keshav's method (ACM SIGCOMM CCR, 2007), and the time budgets are the whole point: they are short enough that you will actually do pass 1 on forty papers.
    - **Pass 1 has one job, and it is rejection.** The five C's — Category, Context, Correctness, Contributions, Clarity — are all answerable from the abstract, the introduction's last paragraph, the headings, and the conclusion. If you cannot state the contribution in one sentence without using the word "novel", the paper has not stated it, and that is information about the paper rather than about you. A useful calibration: of forty papers pulled by a keyword search, roughly eight survive pass 1, and two of those survive pass 2. The trap is treating a well-written abstract as evidence; every abstract is written to sound supported, including the ones whose result did not replicate.
    - **Read the figures before the method.** In empirical ML papers the whole claim usually lives in one or two figures. For each figure write down four things: what is on the x-axis, what is on the y-axis, what the error bars represent (std over seeds? std over examples? standard error of the mean? nothing at all?), and what tuning budget the baseline received. If you cannot fill in all four, you have not read the figure. Concrete: a caption saying "± std over 3 seeds" gives a standard error of the mean of $\sigma/\sqrt{3} = 0.58\sigma$, so a gap that "exceeds the std" is only a 1.7σ statement about the mean, not a 2σ one. The trap is reading the method first: you will spend forty minutes on details the figure already told you were irrelevant.
    - **Build the claim–evidence table, one row per abstract claim.** Columns: the claim quoted from the abstract, the experiment that tests it, the metric, whether any experiment *isolates* it (removes exactly the proposed component and nothing else), and the confounds. A typical abstract makes four to six claims, and one or two of them will have no experiment that isolates them — the claim is true only jointly with everything else in the system, which means you cannot attribute it. The trap is accepting "we conduct extensive experiments" as coverage; extensiveness is a count, not an argument.
    - **The ablation table is the paper; the headline table is the advertisement.** A contribution is what changes when you remove the thing. A well-formed ablation has one row per removal from the full system, with everything else held fixed — and "held fixed" is where papers cheat, by changing the parameter count at the same time as the component. Concrete: if removing component A costs 0.3 points and the run-to-run standard deviation is 0.4 points, A is a tuning detail, not a contribution, and you should write that in your notes. The trap is reading the "full model" row and the state-of-the-art comparison as if they were the ablation; they are the demo.
    - **Baselines are the weakest link, and re-tuning them erases headline gains.** Two named results make this concrete. Melis, Dyer and Blunsom (ICLR 2018), *On the State of the Art of Evaluation in Neural Language Models*, showed that a standard LSTM with a properly tuned hyperparameter search matched or beat the architectures that had been reported as state of the art on PTB and WikiText-2 — the differences were mostly in the tuning budget. Lucic et al. (NeurIPS 2018), *Are GANs Created Equal?*, gave every GAN variant the same compute budget for tuning and random restarts and found no evidence that any of them consistently beat the original non-saturating GAN. The question to ask of any table is therefore not "what is the baseline" but "did the baseline get the same search, the same epochs, and the same preprocessing".
    - **Significance is usually absent, and you can compute it in your head.** For a test set of $n$ examples at accuracy $p$, the standard error of a difference of two accuracies is roughly $\sqrt{2p(1-p)/n}$. At $n = 10{,}000$ and $p = 0.90$ that is 0.42 percentage points, so the 95% detection floor is $1.96 \times 0.42 = 0.83$ points. A reported 0.4-point gain on ten thousand examples is a 0.95σ event: it is not a finding, it is a coin landing slightly off-centre. The paired test (McNemar) is tighter because both systems see the same examples, but papers almost never publish the per-example predictions you would need. The trap is reading "improves by 0.4%" as a result because it is printed to one decimal place.
    - **Reproduction is a ladder with three rungs, and they test different things.** Rung (a): run the released code and reproduce one reported number — this tests the artifact. Rung (b): reimplement one component from the description alone and match a reported number — this tests the description, and it is the rung where most papers fail, because the text omits a detail that turns out to matter. Rung (c): reimplement at small scale and check the *trend* rather than the absolute number — this tests the claim. Most "reproducibility crisis" anecdotes are about rung (a) failing because a README is stale, which is the least interesting failure. The trap is treating a broken repository as evidence that the science is wrong, or a working repository as evidence that it is right.
    - **Every paper has an unstated assumption; it is usually about the distribution.** The recurring candidates: examples are i.i.d.; the test distribution equals the deployment distribution; the metric is a proxy for the goal; the test set was not used for model selection; the baseline was tuned as hard as the proposal. Concrete proxies that quietly disagree: BLEU versus human judgement, perplexity versus downstream accuracy, accuracy versus calibration. If hyperparameters were selected on the test set over $k$ configurations, the reported number is a maximum over $k$ noisy estimates and is optimistically biased by roughly the size of that noise — with 20 configurations and a standard error of 0.4 points, you can manufacture half a point of "improvement" from selection alone.
    - **Triage is arithmetic, and the note is what you keep.** A 60-paper survey at six minutes of pass 1 each is six hours; if eight survive, another seven hours of pass 2; if two survive, eight hours of pass 3 — about twenty-one hours in total, dominated by pass 3. That is why the six-minute decision is the expensive one: every paper you advance commits four future hours, every paper you stop commits six minutes. The artifact of the decision is a note written in the paper's own numbers — "Table 3, row (A): 1 head = 24.9 vs 8 heads = 25.8 on newstest2013 dev, single run, no variance reported" is citable in six months; "shows attention is better" is not. Three lines: the number, the table it came from, the caveat.


  derivations:
    - title: "Why a 0.4-point gain on 10,000 examples is not a finding"
      latex: |
        For a test set of $n$ examples and accuracy $p$, the estimator
        $\hat p = \frac{1}{n}\sum_i \mathbb{1}[y_i = \hat y_i]$ is an average of
        $n$ Bernoulli variables, so
        $$\operatorname{Var}(\hat p) = \frac{p(1-p)}{n}.$$
        The difference of two accuracies measured on the same $n$ examples has
        standard error at most
        $$\operatorname{SE}(\hat p_a - \hat p_b) \approx \sqrt{\frac{p_a(1-p_a)}{n} + \frac{p_b(1-p_b)}{n}} ,$$
        which at $n = 10{,}000$ and $p \approx 0.90$ evaluates to
        $$\sqrt{2 \cdot \frac{0.9 \times 0.1}{10^4}} = 0.00424 ,$$
        i.e. 0.42 percentage points. The 95% detection floor is
        $1.96 \times 0.42 = 0.83$ points.
      prose: >-
        A 0.4-point gain is 0.95 standard errors, so the honest summary is
        "indistinguishable from sampling noise on this test set" rather than
        "improves by 0.4%". The bound is conservative because the two systems
        see the same examples and their errors are correlated; the correct
        paired test is McNemar's, which uses only the examples where the two
        disagree. Papers rarely publish the per-example predictions that would
        let you run it, so the unpaired bound is what you have — and it is
        enough to reject most sub-point claims.
    - title: "Why the gain must be compared to seed noise, not to zero"
      latex: |
        Suppose each configuration is run with $k$ seeds and reports the mean
        $\bar x$. Then $\operatorname{sd}(\bar x) = \sigma/\sqrt{k}$, and the
        difference of two independently-run configurations has
        $$\operatorname{sd}(\bar x_a - \bar x_b) = \sigma\sqrt{\frac{2}{k}} .$$
        At $k = 3$ this is $0.816\,\sigma$; detecting the difference at two
        standard deviations therefore requires a gap of
        $$2 \times 0.816\,\sigma = 1.63\,\sigma .$$
        With $\sigma = 0.5$ BLEU that is a gap of 0.82 BLEU.
      prose: >-
        This is why "we ran three seeds and took the best" is not evidence, and
        why a 0.9-BLEU ablation with no reported $\sigma$ is an unresolved
        question rather than a result: at a plausible $\sigma$ of 0.5 it is
        1.8σ, and at 0.8 it is 1.1σ. The same arithmetic applies to your own
        experiments, which is the useful part — it tells you how many seeds you
        need before a comparison is worth running at all.

  implementations:
    - language: python
      title: "A claim–evidence ledger"
      note: >-
        This turns a paper you have read into a table you can act on. It is
        deliberately not automatic: `isolates` is a judgement you make, and the
        code only enforces that you made it. It cannot tell you whether an
        experiment is *valid* — only whether the paper connects a claim to an
        experiment at all, which is the failure it catches.
      code: |
        """Build a claim-evidence ledger from a paper you have read.

        A record is a dict:
            {"claims": [{"id": "c1", "text": "8 heads beat 1 head"}, ...],
             "experiments": [{"id": "e1", "addresses": ["c1"], "isolates": ["c1"],
                              "confounds": ["single_seed"]}, ...]}

        `isolates` is the field that matters. An experiment isolates a claim when
        removing exactly the thing the claim is about is the only change. An
        experiment that merely contains the component does not isolate it.
        """


        def ledger(paper):
            claims = paper["claims"]
            experiments = paper["experiments"]
            rows = []
            for c in claims:
                cid = c["id"]
                addressed = [e for e in experiments if cid in e.get("addresses", [])]
                clean = [e for e in addressed
                         if cid in e.get("isolates", []) and not e.get("confounds")]
                isolating = [e for e in addressed if cid in e.get("isolates", [])]
                if not addressed:
                    status, why = "untested", "no experiment addresses this claim"
                elif clean:
                    status, why = "supported", f"isolated by {clean[0]['id']}"
                elif isolating:
                    status = "confounded"
                    why = f"isolated by {isolating[0]['id']} but carries {isolating[0]['confounds'][0]}"
                else:
                    status, why = "unattributed", "only measured jointly with other changes"
                rows.append({"claim": cid, "text": c["text"], "status": status, "why": why})
            return rows


        def render(rows):
            width = max((len(r["claim"]) for r in rows), default=4)
            lines = []
            for r in rows:
                lines.append(f"{r['claim']:<{width}}  {r['status']:<12}  {r['text']}")
                lines.append(f"{'':<{width}}  {'':<12}  -> {r['why']}")
            counts = {}
            for r in rows:
                counts[r["status"]] = counts.get(r["status"], 0) + 1
            lines.append("")
            lines.append("  ".join(f"{k}={v}" for k, v in sorted(counts.items())))
            return "\n".join(lines)


        if __name__ == "__main__":
            paper = {
                "claims": [
                    {"id": "c1", "text": "multi-head beats single-head"},
                    {"id": "c2", "text": "pretraining helps at low data"},
                    {"id": "c3", "text": "scales to 1B parameters"},
                    {"id": "c4", "text": "works in 10 languages"},
                ],
                "experiments": [
                    {"id": "T3-A", "addresses": ["c1"], "isolates": ["c1"], "confounds": []},
                    {"id": "T3-C", "addresses": ["c2"], "isolates": ["c2"],
                     "confounds": ["baseline_untuned"]},
                    {"id": "T5", "addresses": ["c3"], "isolates": [], "confounds": []},
                ],
            }
            print(render(ledger(paper)))
    - language: python
      title: "The six things that block reproduction"
      note: >-
        Not the thirty-item checklist — the six items whose absence means you
        cannot reproduce the number even with the code in hand. It is wrong in
        one specific way: it scores presence, not quality. A released repository
        that does not run counts as released here, so read the two lists as a
        prompt for what to look for, not as a verdict.
      code: |
        """Score a paper against the parts of the reproducibility checklist that
        actually block reproduction.
        """

        BLOCKING = [
            ("code_released", "Training/eval code is public and runnable"),
            ("data_available", "Every dataset is obtainable, including splits"),
            ("seeds_reported", "Number of seeds and their values are stated"),
            ("hyperparameters", "Full search space, not just the chosen values"),
            ("compute_reported", "Hardware, wall-clock, and number of runs"),
            ("eval_code", "The exact metric implementation is provided"),
        ]

        SUPPORTING = [
            ("variance_reported", "Mean and spread over seeds are reported"),
            ("ablations", "Each proposed component is removed in isolation"),
            ("baselines_tuned", "Baselines got a comparable tuning budget"),
            ("negative_results", "Settings where the method fails are reported"),
        ]


        def audit(paper, keys=BLOCKING):
            missing = [{"item": k, "why": d} for k, d in keys if not paper.get(k)]
            present = len(keys) - len(missing)
            return {"score": present / len(keys), "missing": missing,
                    "reproducible": not missing}


        def report(paper):
            blocking = audit(paper, BLOCKING)
            supporting = audit(paper, SUPPORTING)
            out = [f"blocking completeness: {blocking['score']:.0%}",
                   f"reporting quality:     {supporting['score']:.0%}", ""]
            if blocking["reproducible"]:
                out.append("Rung (a) is available: re-run and match one number.")
            else:
                out.append("Rung (a) is not available. Blockers:")
                for m in blocking["missing"]:
                    out.append(f"  - {m['item']}: {m['why']}")
                out.append("Fall back to rung (b): reimplement one component from the text.")
            if supporting["missing"]:
                out.append("")
                out.append("The claim is weaker than it looks because:")
                for m in supporting["missing"]:
                    out.append(f"  - {m['item']}: {m['why']}")
            return "\n".join(out)


        if __name__ == "__main__":
            paper = {"code_released": True, "data_available": True,
                     "seeds_reported": False, "hyperparameters": False,
                     "compute_reported": True, "eval_code": True,
                     "variance_reported": False, "ablations": True,
                     "baselines_tuned": False, "negative_results": False}
            print(report(paper))

  checkpoints:
    - id: cp-1
      question: "You have six minutes and a paper. What must you be able to say at the end of them, and what must you not have done?"
      answerKind: short_text
      hint: "The output of pass 1 is a decision plus one sentence — not a summary."
      solution: >-
        You must be able to state the paper's claim in one sentence without the
        word "novel", and name the question pass 2 would have to answer. You
        must not have read the method: at six minutes you cannot evaluate it,
        and reading it first anchors you on the authors' framing before you know
        what the claim is. The five C's — category, context, correctness,
        contributions, clarity — are all answerable from the abstract,
        introduction, headings, figures and conclusion.
    - id: cp-2
      question: "A paper reports 71.2% against a 70.8% baseline on a 5,000-example test set, with std 0.3 over three seeds. Is the gain real?"
      answerKind: short_text
      hint: "Two separate quantities: the sampling error of the metric and the run-to-run error of the mean. Both are of order 0.9 and 0.25 points respectively."
      solution: >-
        No, not on this evidence. Sampling: $\sqrt{2 \cdot 0.71 \cdot 0.29/5000} = 0.91$
        percentage points, so a 0.4-point gap is 0.44σ. Run-to-run: the standard
        error of a 3-seed mean is $0.3/\sqrt{3} = 0.17$ points, and the
        difference of two such means has sd $0.17\sqrt{2} = 0.24$ points, so the
        gap is 1.6σ there. Combined, the gap is about 0.43σ. To resolve a
        0.4-point difference against that noise you would need roughly 43 runs
        per configuration. The honest note says "0.4 points, inside noise on
        this test set and this seed count".
    - id: cp-3
      question: "Table 3 shows that removing component B costs 0.2 BLEU and the paper reports no seed variance. What goes in your notes?"
      answerKind: short_text
      hint: "What would the gap have to exceed for the ablation to attribute anything?"
      solution: >-
        "B: 0.2 BLEU, no variance reported — not attributable." A difference of
        two 3-seed means has sd $0.82\sigma$, so at a plausible
        $\sigma = 0.5$ BLEU the gap is 0.5σ and is indistinguishable from
        retraining. You are not entitled to say B does not matter; you are
        entitled to say the paper did not show that it does. That distinction is
        the whole of the claim–evidence table.
    - id: cp-4
      question: "Why is re-running the authors' repository the weakest rung of the reproduction ladder?"
      answerKind: short_text
      hint: "What does each rung test — the artifact, the description, or the claim?"
      solution: >-
        Because it tests the artifact, not the science. A repository that runs
        proves someone once had a working configuration; a repository that does
        not run proves the release was neglected, which says nothing about
        whether the method works. Rung (b) is the informative one: reimplement
        from the description alone and try to match the number. If you cannot,
        the paper is under-specified in exactly the way that matters to anyone
        building on it — and that is a finding about the paper, not about you.
    - id: cp-5
      question: "A paper selects its learning rate, dropout and number of layers on the test split, over 20 configurations. What is the reported number?"
      answerKind: short_text
      hint: "It is not an unbiased estimate of anything. What is it a maximum of?"
      solution: >-
        It is a maximum over 20 noisy estimates, so it is optimistically biased
        by roughly the size of that noise — with a standard error of 0.4 points,
        selecting the best of 20 buys you something like half a point for free.
        The test split has become a validation split and is no longer held out.
        The correct reading is "this number is an upper bound obtained after
        model selection", and the paper is not reproducible from the reported
        protocol because the selection is part of the protocol.
    - id: cp-6
      question: "You have sixty candidate papers and twenty hours. Sketch the budget, and say which decision carries the cost."
      answerKind: short_text
      hint: "The pass times are 6 minutes, 50 minutes and 4 hours. Which stage does the total?"
      solution: >-
        Pass 1 on all sixty: $60 \times 6$ min = 6 hours. Suppose eight survive:
        $8 \times 50$ min ≈ 7 hours. Suppose two survive: $2 \times 4$ h = 8
        hours. Total ≈ 21 hours. Pass 3 dominates the total, which is why the
        six-minute decision is the expensive one — every paper you advance
        commits four future hours, and every paper you stop commits six minutes.
        Triage is not a shortcut around the reading; it is where the reading is
        actually decided.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        A paper is an argument with a shape: a claim, an experiment offered as
        evidence, and a number produced by that experiment. The gap between the
        claim and the number is where all the interesting failure lives, and it
        is invisible if you read the paper as a report rather than as an
        argument. The method is to make that gap explicit — in writing, in a
        table — at three increasing levels of cost, and to stop as soon as the
        level of cost exceeds the value of the answer to you.
      blocks:
        - kind: checklist
          body: |
            - Pass 1 asks: should I keep reading, and what would pass 2 have to answer?
            - Pass 2 asks: what is the claim, what is the evidence, does the evidence isolate the claim?
            - Pass 3 asks: can I rebuild one link of this from the description alone?
            - Every pass has an output you could show someone else. If it doesn't, you skimmed.
      checkpoint: >-
        Before reading on: which of the three passes would tell you whether the
        baseline was tuned as hard as the proposed method, and why not the other
        two?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        For the triage task, reach for the three-pass structure and a hard time
        box — the box is the mechanism, not a suggestion. For the judgement
        task, reach for the claim–evidence table rather than prose notes,
        because a table forces you to name the experiment that isolates each
        claim and the empty cells are the finding. For the "should I build on
        this" task, reach for the cheapest reproduction that could fail: the
        smallest checkable claim in the paper, reimplemented from the text. Do
        not reach for the reproduction first — it is four hours, and most
        papers do not deserve it.
      blocks:
        - kind: checklist
          body: |
            - Deciding whether to read: pass 1, six minutes, hard stop.
            - Deciding whether to cite: pass 2 plus the claim-evidence table.
            - Deciding whether to build: pass 3 on the smallest checkable claim.
            - Never start at pass 3; the ordering exists because the cost ratio is 1:8:40.
      checkpoint: >-
        You are choosing between two papers to build on. Which single artefact
        from pass 2 would most change your choice, and why is it not the
        headline result?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The whole method is three loops over the same document at three
        different depths, plus one table. The discipline is in what you are
        allowed to write down at each depth.
      blocks:
        - kind: pseudocode
          body: |
            # Pass 1 -- six minutes
            read title, abstract, intro's last paragraph, headings, conclusion, figures
            write: CLAIM = one sentence, no adjectives
            write: QUESTION = what pass 2 must answer
            decide: stop or continue        # stopping is the common case

            # Pass 2 -- fifty minutes
            for each figure/table:
                note axes, metric, what the error bars are, baseline's tuning budget
            for each claim in the abstract:
                row = (claim, experiment, metric, isolates?, confounds?)
            read related work last, looking for the competitor mentioned in one clause

            # Pass 3 -- four hours
            pick the smallest claim that is checkable with arithmetic or 50 lines
            reimplement from the description only   # do not open the repo yet
            compare against the reported number
            write: WHAT THE PAPER DOES NOT TELL YOU
      checkpoint: >-
        In the pass-2 loop, why is "isolates?" a separate column from
        "experiment"? What kind of paper produces a full column of "no"?
    - tier: 4
      key: derivation
      title: "The arithmetic of judging support"
      content: >-
        Two quantities decide whether a reported improvement is a finding: the
        sampling error of the metric on the test set, and the run-to-run error
        of the mean over seeds. Both are one-line variance computations, and
        both are usually larger than the reported gap.
      blocks:
        - kind: math
          body: |
            Sampling error of an accuracy difference on $n$ examples:
            $$\operatorname{SE} \approx \sqrt{\frac{p_a(1-p_a)}{n} + \frac{p_b(1-p_b)}{n}}$$
            At $n = 10{,}000$, $p \approx 0.9$: $\operatorname{SE} = 0.0042$, so the
            95% floor is $1.96 \times 0.0042 = 0.0083$ — 0.83 points.

            Run-to-run error of a difference of $k$-seed means:
            $$\operatorname{sd}(\bar x_a - \bar x_b) = \sigma\sqrt{2/k}$$
            At $k = 3$: $0.82\sigma$. Two-sigma detection therefore needs a gap of
            $1.63\sigma$; at $\sigma = 0.5$ BLEU that is 0.82 BLEU.

            Combined, for independent sources:
            $$\operatorname{sd}_{\text{total}} = \sqrt{\operatorname{SE}^2 + 2\sigma^2/k}$$
      checkpoint: >-
        A paper reports a 0.6-point gain with three seeds and a std of 0.4, on a
        2,000-example test set at 80% accuracy. Work out both terms. Which one
        dominates, and what does that tell you to ask the authors for?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The complete method, as a procedure you can run this afternoon, plus the
        two scripts that make the output durable.
      blocks:
        - kind: warning
          body: >-
            The failure mode of this method is performing it. A claim–evidence
            table built after you have already decided to cite the paper is
            theatre. Fill the table in before you write the citation, and leave
            the empty cells empty.
        - kind: checklist
          body: |
            Pass 1 (6 min): claim in one sentence; the question pass 2 must answer; stop/continue.
            Pass 2 (50 min):
              - every figure: axes, metric, error-bar meaning, baseline budget
              - claim-evidence table with an "isolates?" column
              - related work read last, for the competitor dismissed in one clause
              - appendix skimmed for the ablation the main text compressed
            Pass 3 (4 h):
              - smallest checkable claim, reimplemented from the text
              - record what the paper does not tell you
            Note (3 lines): number, table/figure reference, one caveat.
        - kind: code
          language: python
          body: |
            # The note format that survives six months. Three lines, no prose.
            #
            #   CLAIM:   8 heads vs 1 head, +0.9 BLEU (Table 3, row A, newstest2013 dev)
            #   EVIDENCE: single run, no variance reported; dev set, no checkpoint averaging
            #   VERDICT:  suggestive; would need sigma < 0.45 BLEU to reach 2 sigma
            #
            # Everything else you write about a paper is commentary. This is the
            # part you can defend in a review six months from now.

            def note(claim, number, source, caveat, verdict):
                return (f"CLAIM:    {claim}, {number} ({source})\n"
                        f"EVIDENCE: {caveat}\n"
                        f"VERDICT:  {verdict}")
      checkpoint: >-
        Look at the note format above. Which line would you be unable to fill in
        for the last paper you read, and what does that missing line tell you
        about how you read it?

  problems:
    - id: p-extract-claims
      title: "Pull the checkable claims out of an abstract"
      difficulty: medium
      prompt: >-
        Implement `extract_claims(abstract)`. Split the text into sentences, then
        return only the sentences that make a checkable claim, in order.


        A sentence is a **claim** if it contains at least one marker from a fixed
        vocabulary, or at least one **result magnitude**.


        Markers are matched case-insensitively as whole words: `achieves`,
        `exceeds`, `improves`, `increases`, `matches`, `outperforms`, `reduces`,
        `state-of-the-art`, `we demonstrate`, `we find`, `we observe`,
        `we prove`, `we show`. Note that `we propose` is deliberately **not** a
        marker: a proposal asserts that an artifact exists, not that anything is
        true.


        A result magnitude is a number immediately followed (after optional
        spaces) by one of `%`, `×`, `x`, `BLEU`, `points`, `pp`, `F1`,
        `perplexity`. A bare number such as a year, a dataset size written
        `12,000`, or a GPU count is not a result magnitude.


        Sentence splitting: a sentence ends at `.`, `!` or `?` followed by
        whitespace or the end of the text — except when the token ending in the
        period is one of the abbreviations `e.g.`, `i.e.`, `et al.`, `vs.`,
        `fig.`, `eq.`, `cf.`, `resp.`, `approx.`.


        Return a dict:

        ```

        {"n_sentences": <int>,
         "claims": [{"text": <whitespace-normalised sentence>,
                     "markers": <sorted, deduplicated list of matched markers>,
                     "numbers": <list of floats, in order of appearance>}, ...]}

        ```

        Normalise every sentence with single spaces and no leading or trailing
        whitespace. If no sentence is a claim, return an empty `claims` list.
      starter: |
        import re

        ABBREV = {"e.g.", "i.e.", "et al.", "vs.", "fig.", "eq.", "cf.", "resp.", "approx."}
        MARKERS = [
            "achieves", "exceeds", "improves", "increases", "matches", "outperforms",
            "reduces", "state-of-the-art", "we demonstrate", "we find", "we observe",
            "we prove", "we show",
        ]


        def extract_claims(abstract):
            # your implementation here
            pass
      language: python
      entry: extract_claims
      testCases:
        - input: '["Scaling Attention improves accuracy by 2.4% over the baseline. We show that the gain holds at all depths. The model was trained on 8 GPUs."]'
          expected: '{"n_sentences": 3, "claims": [{"text": "Scaling Attention improves accuracy by 2.4% over the baseline.", "markers": ["improves"], "numbers": [2.4]}, {"text": "We show that the gain holds at all depths.", "markers": ["we show"], "numbers": []}]}'
          mode: json
          tolerance: 1e-9
        - input: '["We propose SparseGate. It reduces latency by 31% at equal accuracy, e.g. on ResNet-50. The effect persists on ImageNet."]'
          expected: '{"n_sentences": 3, "claims": [{"text": "It reduces latency by 31% at equal accuracy, e.g. on ResNet-50.", "markers": ["reduces"], "numbers": [31.0]}]}'
          mode: json
          tolerance: 1e-9
        - input: '["Our method reaches 78.2% top-1 and improves over the prior state-of-the-art by 1.9 points. Gains are largest in low-data regimes (2x fewer labels)."]'
          expected: '{"n_sentences": 2, "claims": [{"text": "Our method reaches 78.2% top-1 and improves over the prior state-of-the-art by 1.9 points.", "markers": ["improves", "state-of-the-art"], "numbers": [78.2, 1.9]}, {"text": "Gains are largest in low-data regimes (2x fewer labels).", "markers": [], "numbers": [2.0]}]}'
          mode: json
          tolerance: 1e-9
        - input: '["We describe a dataset of 12,000 images collected over three years. The data was annotated by five graduate students."]'
          expected: '{"n_sentences": 2, "claims": []}'
          mode: json
          tolerance: 1e-9
      solution: |
        import re

        ABBREV = {"e.g.", "i.e.", "et al.", "vs.", "fig.", "eq.", "cf.", "resp.", "approx."}
        MARKERS = [
            "achieves", "exceeds", "improves", "increases", "matches", "outperforms",
            "reduces", "state-of-the-art", "we demonstrate", "we find", "we observe",
            "we prove", "we show",
        ]
        UNIT_RE = re.compile(r"(\d+(?:\.\d+)?)\s*(%|×|x|BLEU|points|pp|F1|perplexity)")


        def _sentences(text):
            out, start, i = [], 0, 0
            while i < len(text):
                ch = text[i]
                if ch in ".!?" and (i + 1 == len(text) or text[i + 1].isspace()):
                    token = text[start:i + 1].lower().rsplit(" ", 1)[-1]
                    if ch == "." and token in ABBREV:
                        i += 1
                        continue
                    out.append(text[start:i + 1])
                    start = i + 1
                    while start < len(text) and text[start].isspace():
                        start += 1
                    i = start
                    continue
                i += 1
            if start < len(text):
                out.append(text[start:])
            return [" ".join(s.split()) for s in out if s.strip()]


        def extract_claims(abstract):
            sents = _sentences(abstract)
            claims = []
            for s in sents:
                low = s.lower()
                marks = sorted({m for m in MARKERS
                                if re.search(r"\b" + re.escape(m) + r"\b", low)})
                nums = [float(m.group(1)) for m in UNIT_RE.finditer(s)]
                if marks or nums:
                    claims.append({"text": s, "markers": marks, "numbers": nums})
            return {"n_sentences": len(sents), "claims": claims}
      solutionExplanation: >-
        Three details carry the exercise. Abbreviations must be checked before
        splitting, or "e.g." silently cuts a sentence in half and the number
        attached to it disappears. Markers must be matched with word
        boundaries, because "matches" is a substring of "mismatches" and
        "state-of-the-art" would otherwise be unreachable through a naive
        tokenisation. And magnitudes require a unit: "2.4%" and "1.9 points"
        are results, while "12,000 images" and "8 GPUs" are context — the
        distinction between a quantity and a result is the whole skill.
      complexity: "O(len(abstract) × |MARKERS|) time, O(sentences) space"
      tags: [text-parsing, claims, reading]

    - id: p-assess-gain
      title: "Is the reported gain larger than the noise?"
      difficulty: medium
      prompt: >-
        Implement `assess_gain(n, baseline, method, seed_sd=0.0)`. `n` is the
        number of test examples; `baseline` and `method` are accuracies as
        proportions in $[0, 1]$; `seed_sd` is the reported run-to-run standard
        deviation of the metric (same scale), or 0 if the paper does not report
        one.


        Compute:

        - `gap = method - baseline`
        - `se = sqrt(baseline*(1-baseline)/n + method*(1-method)/n)` — the
          unpaired two-proportion standard error, which is conservative for a
          shared test set
        - `z = gap / se`
        - `seed_z = gap / seed_sd` if `seed_sd > 0`, else `None`

        Then classify:

        - `"noise"` if `seed_sd > 0` and `gap <= seed_sd` — the gain is smaller
          than the run-to-run spread
        - `"marginal"` if `z < 1.96`
        - `"supported"` otherwise

        Return `{"gap", "se", "z", "seed_z", "verdict"}`.
      starter: |
        import math


        def assess_gain(n, baseline, method, seed_sd=0.0):
            # your implementation here
            pass
      language: python
      entry: assess_gain
      testCases:
        - input: '[10000, 0.900, 0.904, 0.005]'
          expected: '{"gap": 0.004, "se": 0.004204568943423332, "z": 0.9513460366149282, "seed_z": 0.8, "verdict": "noise"}'
          mode: json
          tolerance: 1e-6
        - input: '[10000, 0.900, 0.912, 0.002]'
          expected: '{"gap": 0.012, "se": 0.004126208913760911, "z": 2.9082385915991793, "seed_z": 6.0, "verdict": "supported"}'
          mode: json
          tolerance: 1e-6
        - input: '[1000, 0.900, 0.904, 0.001]'
          expected: '{"gap": 0.004, "se": 0.01329601444042537, "z": 0.30084203186771163, "seed_z": 4.0, "verdict": "marginal"}'
          mode: json
          tolerance: 1e-6
        - input: '[50000, 0.900, 0.901, 0.0]'
          expected: '{"gap": 0.001, "se": 0.0018931402483704158, "z": 0.5282228830435487, "seed_z": null, "verdict": "marginal"}'
          mode: json
          tolerance: 1e-6
      solution: |
        import math


        def assess_gain(n, baseline, method, seed_sd=0.0):
            gap = float(method) - float(baseline)
            # Unpaired two-proportion standard error. Conservative for a shared
            # test set; the honest paired test is McNemar's.
            se = math.sqrt(baseline * (1.0 - baseline) / n + method * (1.0 - method) / n)
            z = gap / se if se > 0 else float("inf")
            seed_z = gap / float(seed_sd) if seed_sd and seed_sd > 0 else None
            if seed_sd and seed_sd > 0 and gap <= seed_sd:
                verdict = "noise"
            elif z < 1.96:
                verdict = "marginal"
            else:
                verdict = "supported"
            return {"gap": gap, "se": se, "z": z, "seed_z": seed_z, "verdict": verdict}
      solutionExplanation: >-
        The order of the two tests matters. Seed noise is checked first because
        it is a floor: if the gain is smaller than the run-to-run standard
        deviation, no amount of test-set arithmetic rescues it — the two systems
        are the same system measured twice. Only then does the sampling error
        decide between "marginal" and "supported". The seed_z value is reported
        even when the verdict is already decided, because it is the number you
        quote: "the gain is 1.8 seed standard deviations" is a sentence a
        reviewer can act on, and "p = 0.04" from a test you did not run is not.
      complexity: "O(1)"
      tags: [statistics, significance, evaluation]

    - id: p-support-matrix
      title: "Turn a paper's claims into a support matrix"
      difficulty: easy
      prompt: >-
        Implement `support_matrix(claims, experiments)`. `claims` is a list of
        `{"id", "text"}` records. `experiments` is a list of
        `{"id", "addresses", "isolates", "confounds"}` records, where
        `addresses` lists the claim ids the experiment touches, `isolates` lists
        the claim ids it isolates cleanly, and `confounds` is a list of strings
        naming anything else that changed.


        Assign each claim exactly one status, checking in this order:

        1. `"untested"` — no experiment lists the claim in `addresses`.
        2. `"supported"` — some addressing experiment lists the claim in
           `isolates` **and** has no confounds.
        3. `"confounded"` — some addressing experiment lists the claim in
           `isolates`, but every such experiment has at least one confound.
        4. `"unattributed"` otherwise.

        Return `{"rows": [{"claim": id, "status": status}, ...]}` in the input
        order of `claims`, plus `"counts"`: a dict with all four statuses as
        keys, including the ones that are zero.
      starter: |
        def support_matrix(claims, experiments):
            # your implementation here
            pass
      language: python
      entry: support_matrix
      testCases:
        - input: |
            [[{"id": "c1", "text": "8 heads beat 1 head"},
              {"id": "c2", "text": "pretraining helps"},
              {"id": "c3", "text": "scales to 1B"},
              {"id": "c4", "text": "works in 10 languages"}],
             [{"id": "e1", "addresses": ["c1", "c2"], "isolates": ["c1"], "confounds": []},
              {"id": "e2", "addresses": ["c2"], "isolates": ["c2"], "confounds": ["baseline_untuned"]},
              {"id": "e3", "addresses": ["c3"], "isolates": [], "confounds": []},
              {"id": "e4", "addresses": ["c1"], "isolates": ["c1"], "confounds": ["single_seed"]}]]
          expected: '{"rows": [{"claim": "c1", "status": "supported"}, {"claim": "c2", "status": "confounded"}, {"claim": "c3", "status": "unattributed"}, {"claim": "c4", "status": "untested"}], "counts": {"supported": 1, "confounded": 1, "unattributed": 1, "untested": 1}}'
          mode: json
          tolerance: 1e-9
        - input: |
            [[{"id": "c1", "text": "a"}],
             [{"id": "e1", "addresses": ["c1"], "isolates": ["c1"], "confounds": ["single_seed"]}]]
          expected: '{"rows": [{"claim": "c1", "status": "confounded"}], "counts": {"supported": 0, "confounded": 1, "unattributed": 0, "untested": 0}}'
          mode: json
          tolerance: 1e-9
        - input: '[[] , [{"id": "e1", "addresses": ["c9"], "isolates": ["c9"], "confounds": []}]]'
          expected: '{"rows": [], "counts": {"supported": 0, "confounded": 0, "unattributed": 0, "untested": 0}}'
          mode: json
          tolerance: 1e-9
      solution: |
        def support_matrix(claims, experiments):
            rows = []
            counts = {"supported": 0, "confounded": 0, "unattributed": 0, "untested": 0}
            for c in claims:
                cid = c["id"]
                addressed = [e for e in experiments if cid in e.get("addresses", [])]
                if not addressed:
                    status = "untested"
                elif any(cid in e.get("isolates", []) and not e.get("confounds")
                         for e in addressed):
                    status = "supported"
                elif any(cid in e.get("isolates", []) for e in addressed):
                    status = "confounded"
                else:
                    status = "unattributed"
                rows.append({"claim": cid, "status": status})
                counts[status] += 1
            return {"rows": rows, "counts": counts}
      solutionExplanation: >-
        The precedence is the content. "Untested" comes first because a claim no
        experiment touches cannot be rescued by another experiment that happens
        to mention it. "Supported" requires one *clean* isolating experiment,
        not a majority: a single confounded run does not contaminate a separate
        clean one, which is why the test is `any(clean)` rather than
        `all(clean)`. And the distinction between "confounded" and
        "unattributed" is the one that changes what you write: a confounded
        claim was measured but not attributed, while an unattributed claim was
        never separated from the rest of the system at all.
      complexity: "O(claims × experiments) time, O(claims) space"
      tags: [claims, ablation, reading]

  visualizers:
    - id: vs-pass-budget
      kind: shape_flow
      title: "Where the reading time goes"
      description: >-
        Drag the number of candidate papers and watch the budget shift from
        pass 1 to pass 3. The total is dominated by the few papers that survive,
        which is why the six-minute decision is the one worth being careful
        about.
      params:
        pass1Minutes: 6
        pass2Minutes: 50
        pass3Minutes: 240
        survival: [0.2, 0.25]

  try_it: >-
    Take one paper from your queue and run pass 1 against a six-minute timer:
    title, abstract, introduction, section headings, conclusions, figures, and
    nothing else. Write one sentence naming its contribution and one question
    pass 2 would have to answer — if the sentence needs the word "novel", the
    paper failed pass 1 and you should stop reading it.
  interview_questions:
    - question: "What are the three passes for, and what does each one produce?"
      level: mid
      key_points:
        - "Pass 1 is five to ten minutes on title, abstract, intro, headings, conclusions and figures, and its only output is a continue/stop decision plus one question."
        - "Pass 2 takes about an hour and produces the claim–evidence table: each abstract claim, the experiment that tests it, the metric, and whether anything isolates it."
        - "Pass 3 is four to five hours and means reimplementing one component from the description alone to see whether a reported number is reproducible from the text."
        - "The passes are a triage funnel, not a reading order — most papers should die in pass 1, which is why the six-minute decision is the one that matters."
      follow_up: "You have 40 papers and 20 hours. How many survive each pass, and which pass dominates the budget?"
    - question: "A paper reports a 1.2-point gain over its baseline. What do you check before believing it?"
      level: senior
      key_points:
        - "Statistical significance: the standard error of a difference of two accuracies is roughly $\\sqrt{2p(1-p)/n}$, which is 0.42 percentage points at $n = 10{,}000$ and $p = 0.90$ — so the 95% detection floor is about 0.83 points."
        - "Whether the error bars are over seeds, over examples, or absent — a gain inside seed variance is not a gain."
        - "Whether the baseline was tuned as hard as the proposed method; Melis, Dyer and Blunsom (ICLR 2018) showed a properly tuned LSTM matching the then-state of the art."
        - "Whether an ablation isolates the claimed component, or whether the headline number comes from the whole system changing at once."
      follow_up: "The gain is significant and the ablation holds. What is the remaining threat to the claim?"
    - question: "How do you tell an ablation from a headline table?"
      level: mid
      key_points:
        - "An ablation removes exactly one component from the full system with everything else held fixed, so the delta is attributable."
        - "A headline table varies the entire configuration between rows — architecture, tuning budget, data and compute — so it can advertise but cannot explain."
        - "The check is whether the removed component's row also holds parameter count and training budget fixed; papers often quietly change both."
        - "If removing the proposed component does not hurt, the contribution is unsupported no matter how good the headline number is."
  common_mistakes:
    - "Reading the headline table as evidence for the mechanism — it varies everything at once, and only the ablation isolates the contribution."
    - "Comparing against a baseline you did not re-tune, which is how a well-tuned standard model quietly matches a state-of-the-art result."
    - "Quoting a gain without its error bar, so a difference smaller than the seed spread is reported as a finding."
  further_reading:
    - label: "Keshav, How to Read a Paper (ACM SIGCOMM Computer Communication Review, 2007)"
    - label: "Melis, Dyer & Blunsom, On the State of the Art of Evaluation in Neural Language Models (ICLR 2018)"
