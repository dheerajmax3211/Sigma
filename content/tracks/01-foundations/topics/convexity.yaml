id: convexity
slug: convexity
title: "Convexity: One Basin, and a Hessian That Predicts Your Step Size"
summary: >-
  Certify that a loss has one bottom instead of many, read a Hessian's spectrum
  as a description of the landscape, and predict — before you run a single step
  — how many iterations gradient descent will need and what learning rate will
  blow it up.
kind: lesson
difficulty: medium
position: 8
estMinutes: 27
prerequisites: [matrix-calculus]
phase: mathematical-foundations
tags: [convexity, optimization, hessian, condition-number, gradient-descent, duality, subgradient]

body:
  big_idea: >-
    A convex loss lies above every tangent plane, so a zero gradient is the global
    answer — and the Hessian's eigenvalue ratio fixes both your step size and your step
    count.

  problem:
    - "Your loss flattens at $10^{-3}$ and you call it convergence: at $\\kappa = 10^4$ gradient descent needs **69,078** steps, and you stopped at 2,000."
    - "Raising the rate from 0.01 to 0.1 gives NaN: the ceiling is $2/L$, and at $\\eta=0.021$ with $L=100$ iterates grow 10% per step."
    - "Why ridge, not OLS, with 400 features and 300 rows? Because $X^\\top X$ is singular — a 100-dimensional flat direction and no unique minimiser."

  analogy: |
    A convex loss is a bowl: a marble released anywhere ends at the same bottom,
    and "the gradient is zero here" is a proof of optimality rather than a hope.
    The bowl's shape also sets the trip length — if it is 100 times steeper
    along one axis, the marble sloshes sideways while barely advancing.

  concept_points:
    - "**Convexity is a chord condition; its first-order form is a certificate.** For differentiable $f$: $f(y) \\ge f(x) + \\nabla f(x)^\\top(y-x)$ — the tangent plane is a *global* floor. On $f(x)=x^2$ at $x=3$ the tangent predicts $51$ at $y=10$ against a true $100$: wrong by 49 in the safe direction. So $\\nabla f(x)=0$ proves global optimality, with no restarts."
    - "**The second-order test is a PSD Hessian at every point.** For $f(x) = x^4 - 3x^2$, $f''(x) = 12x^2 - 6$ is negative until $|x| = 0.7071$, so $f$ is not convex and has two minima at $\\pm 1.2247$ with $f = -2.25$. For $x^4$, $f''(0)=0$ and it is still convex: a zero eigenvalue is not evidence against."
    - "**Two constants bracket the Hessian, and only their ratio matters.** $mI \\preceq \\nabla^2 f \\preceq LI$, with $L = \\lambda_{\\max}(X^\\top X)$ and $m = \\lambda_{\\min}(X^\\top X)$ for least squares, so $\\kappa = L/m$ is the squared condition number. Collinear features with eigenvalues $1$ and $10^{-6}$ give $\\kappa = 10^6$: hard in exactly one direction."
    - "**$\\kappa$ sets the iteration count, linearly.** With $\\eta = 2/(L+m)$ the error contracts by $\\rho = (\\kappa-1)/(\\kappa+1)$ per step, so $10^{-6}$ takes **1** step at $\\kappa=1$, **69** at $10$, **691** at $100$, **6,908** at $1{,}000$, **69,078** at $10^4$. Each factor of ten in $\\kappa$ costs a factor of ten in steps."
    - "**The same $\\kappa$ sets the step ceiling, and the marginal case never converges.** With $L=100$, $m=1$: at $\\eta=0.019$ the stiff factor is $-0.9$ (oscillating decay), at $\\eta=0.02$ exactly $-1$ (oscillates forever), at $\\eta=0.021$ it is $-1.1$ and 290 steps carry the error from $10^{-9}$ to $10^{3}$."
    - "**Structured operations preserve convexity, so certificates are done on paper.** Non-negative sums, pointwise maxima, affine composition, partial minimisation and convex non-decreasing outer functions all keep it — which is why the hinge SVM and logistic regression are convex QPs. The trap is monotonicity: $e^{-x^2}$ applies a convex decreasing function to $x^2$ and is **not** convex."

  definitions:
    - term: "Convex set"
      meaning: >-
        A set $C$ with $\theta x + (1-\theta)y \in C$ for all $x, y \in C$ and
        $\theta \in [0,1]$ — it contains every segment between its points.
    - term: "Convex function"
      meaning: >-
        $f$ with $f(\theta x + (1-\theta)y) \le \theta f(x) + (1-\theta)f(y)$
        on a convex domain. Equivalently, the epigraph is a convex set.
    - term: "Epigraph"
      meaning: >-
        $\operatorname{epi} f = \{(x,t) : f(x) \le t\}$, the region above the
        graph. $f$ is convex exactly when this region is a convex set, which is
        the cleanest way to see why pointwise maxima preserve convexity.
    - term: "First-order condition"
      meaning: >-
        $f(y) \ge f(x) + \nabla f(x)^\top(y-x)$ for all $x, y$ — the tangent
        plane is a global underestimator. This is the condition that makes a
        zero gradient a proof of global optimality.
    - term: "Strong convexity modulus"
      meaning: >-
        The largest $m$ with $f(y) \ge f(x) + \nabla f(x)^\top(y-x) +
        \tfrac{m}{2}\|y-x\|^2$; equivalently $mI \preceq \nabla^2 f$. It bounds
        how flat the flattest direction can be, so $m > 0$ forbids long flat
        valleys.
    - term: "Smoothness constant"
      meaning: >-
        The smallest $L$ with $\|\nabla f(x) - \nabla f(y)\| \le L\|x-y\|$;
        equivalently $\nabla^2 f \preceq LI$. It caps the maximum stable
        gradient step at $2/L$.
    - term: "Condition number"
      meaning: >-
        $\kappa = L/m = \lambda_{\max}(\nabla^2 f)/\lambda_{\min}(\nabla^2 f)$.
        Gradient descent contracts by $(\kappa-1)/(\kappa+1)$ per step, so
        $\kappa$ is the single number that predicts wall-clock training time.
    - term: "Subdifferential"
      meaning: >-
        $\partial f(x) = \{g : f(y) \ge f(x) + g^\top(y-x) \ \forall y\}$, the
        set of supporting slopes. At a kink it is an interval: $\partial|x|$ at
        $0$ is $[-1,1]$. Optimality is $0 \in \partial f(x)$.
    - term: "Soft-thresholding"
      meaning: >-
        $S_\tau(z) = \operatorname{sign}(z)\max(|z| - \tau, 0)$, the proximal
        operator of $\tau|z|$. It is the exact coordinate solution of the Lasso,
        and it returns exact zeros for $|z| \le \tau$.
    - term: "Jensen's inequality"
      meaning: >-
        $f(\mathbb{E}X) \le \mathbb{E}f(X)$ for convex $f$ (reversed for
        concave). It generates $\mathrm{KL} \ge 0$, the ELBO, and every
        evidence lower bound in variational inference.
    - term: "Lagrangian and dual function"
      meaning: >-
        $L(x,\lambda) = f(x) + \lambda^\top g(x)$ for constraints
        $g(x) \le 0$, and $d(\lambda) = \inf_x L(x,\lambda)$. For $\lambda \ge 0$
        the dual is always a lower bound on the primal optimum.
    - term: "Slater's condition"
      meaning: >-
        A convex problem has an strictly feasible point ($g(x) < 0$). It is the
        usual sufficient condition for strong duality — zero duality gap.
    - term: "Polyak–Łojasiewicz condition"
      meaning: >-
        $\|\nabla f(x)\|^2 \ge 2m(f(x) - f^\star)$ for all $x$. Weaker than
        strong convexity and does not imply a unique minimiser, but it is enough
        for gradient descent to converge linearly.
    - term: "Strict saddle point"
      meaning: >-
        A stationary point whose Hessian has at least one strictly negative
        eigenvalue. Gradient descent escapes it in time polynomial in
        $1/|\lambda_{\min}|$; it is the generic critical point in high
        dimensions, not the exception.

  diagrams:
    - type: compare
      title: "What convexity buys, and what it costs"
      left_label: "Convex problem"
      left_points:
        - "Every stationary point is the global optimum — no restarts, no seed sensitivity"
        - "The gap to the optimum is bounded by the gradient norm: a certificate you can print"
        - "Iteration count is predictable: about κ/2 · log(1/ε)"
        - "Duality is exact under Slater, so you get a matching lower bound"
        - "Regularisation is easy to reason about: λI makes m ≥ λ > 0"
      right_label: "Non-convex problem"
      right_points:
        - "Stationary points may be saddles (2⁻ᵈ of them at dimension d) or local minima"
        - "No certificate — you cannot distinguish 'converged' from 'stuck'"
        - "Only local rates, and only near a point that happens to be nice"
        - "Duality gives a lower bound with a gap that may never close"
        - "What still works: noise, momentum, overparameterisation, PL-type structure"
    - type: plot
      title: "Same problem, three condition numbers: log₁₀ relative error per iteration"
      chart: "line"
      xLabel: "iteration"
      yLabel: "log₁₀ (relative error in the A-norm)"
      series:
        - name: "κ = 1 (one step)"
          points:
            - { x: 0, y: 0.0 }
            - { x: 1, y: -16.0 }
            - { x: 400, y: -16.0 }
        - name: "κ = 10 (69 steps to 1e-6)"
          points:
            - { x: 0, y: 0.0 }
            - { x: 10, y: -0.8715 }
            - { x: 25, y: -2.1788 }
            - { x: 50, y: -4.3575 }
            - { x: 100, y: -8.715 }
            - { x: 200, y: -16.0 }
        - name: "κ = 100 (691 steps to 1e-6)"
          points:
            - { x: 0, y: 0.0 }
            - { x: 10, y: -0.0869 }
            - { x: 25, y: -0.2172 }
            - { x: 50, y: -0.4343 }
            - { x: 100, y: -0.8686 }
            - { x: 200, y: -1.7372 }
            - { x: 400, y: -3.4745 }
            - { x: 700, y: -6.0803 }
    - type: plot
      title: "A bowl and an egg carton: two 1-D slices of a loss"
      chart: "line"
      xLabel: "parameter"
      yLabel: "loss"
      series:
        - name: "x² − 2 (convex: one bottom)"
          points:
            - { x: -2.0, y: 2.0 }
            - { x: -1.6, y: 0.56 }
            - { x: -1.2, y: -0.56 }
            - { x: -0.8, y: -1.36 }
            - { x: -0.4, y: -1.84 }
            - { x: 0.0, y: -2.0 }
            - { x: 0.4, y: -1.84 }
            - { x: 0.8, y: -1.36 }
            - { x: 1.2, y: -0.56 }
            - { x: 1.6, y: 0.56 }
            - { x: 2.0, y: 2.0 }
        - name: "x⁴ − 3x² (non-convex: two minima at ±1.2247)"
          points:
            - { x: -2.0, y: 4.0 }
            - { x: -1.6, y: -1.126 }
            - { x: -1.2, y: -2.246 }
            - { x: -0.8, y: -1.51 }
            - { x: -0.4, y: -0.454 }
            - { x: 0.0, y: 0.0 }
            - { x: 0.4, y: -0.454 }
            - { x: 0.8, y: -1.51 }
            - { x: 1.2, y: -2.246 }
            - { x: 1.6, y: -1.126 }
            - { x: 2.0, y: 4.0 }
    - type: architecture
      title: "Where curvature decisions are made in a training loop"
      caption: >-
        Convexity is decided at the loss, not at the optimiser. Everything to the
        right of the loss node is a consequence of the spectrum it produced.
      nodes:
        - id: loss
          x: 0
          y: 1
          label: "Loss construction"
          kind: model
          detail: >-
            The only place a convexity certificate can be earned. Non-negative
            sums, pointwise maxima and affine composition preserve convexity;
            anything that divides by a parameter, or composes a convex loss with
            a non-monotone map, destroys it here.
        - id: hess
          x: 1
          y: 0
          label: "Curvature probe"
          kind: server
          detail: >-
            Hessian-vector products via two backward passes, or power iteration
            on the Hessian to estimate λ_max. Count negative eigenvalues on a
            few checkpoints: that count is your saddle detector.
        - id: grad
          x: 1
          y: 2
          label: "Gradient check"
          kind: server
          detail: >-
            Finite differences on a random projection. Cheap, and the only thing
            that catches a wrong hand-derived gradient before it costs you a
            week of training.
        - id: step
          x: 2
          y: 1
          label: "Step and preconditioner"
          kind: worker
          detail: >-
            η must stay below 2/L. If κ is large, the step is set by L while the
            progress is set by m — that asymmetry is what a preconditioner
            (Adam, K-FAC, Newton) repairs by rescaling each direction.
        - id: update
          x: 3
          y: 1
          label: "Update"
          kind: server
          detail: >-
            One step of x ← x − ηM⁻¹∇f. With M = I this is SGD; with M = ∇²f it
            is Newton, which removes κ entirely and costs O(d³).
      edges:
        - { from: loss, to: hess, label: "∇²f" }
        - { from: loss, to: grad, label: "∇f" }
        - { from: hess, to: step, label: "L, m, κ" }
        - { from: grad, to: step, label: "‖∇f‖" }
        - { from: step, to: update, label: "η, M⁻¹" }
    - type: mermaid
      title: "A decision procedure for 'is this loss convex?'"
      code: |
        flowchart TD
          A[Write the loss as f of the parameters] --> B{Sum of terms with<br/>non-negative weights?}
          B -- no --> Z[No certificate from composition]
          B -- yes --> C{Each term affine in the<br/>parameters at the inner layer?}
          C -- no --> Z
          C -- yes --> D[Convex on paper]
          D --> E{Hessian PSD at sampled<br/>points, within tolerance?}
          E -- yes --> F[Stationary point is global<br/>step below 2/L<br/>expect kappa log 1/eps]
          E -- no --> G[Either the algebra or<br/>the numerics is wrong]
          Z --> H{Still convex in a<br/>subset, e.g. last layer?}
          H -- yes --> I[Solve the head exactly,<br/>train the trunk by descent]
          H -- no --> J[No certificate. Use noise,<br/>momentum, trust region]

  markdown: |
    ## The definition that pays rent

    A function $f: \mathbb{R}^d \to \mathbb{R}$ is convex when, for all $x, y$
    in its domain and every $\theta \in [0,1]$,

    $$f(\theta x + (1-\theta)y) \le \theta f(x) + (1-\theta) f(y).$$

    Geometrically: the straight chord between two points on the graph never dips
    below the graph. For a differentiable function this is equivalent to

    $$f(y) \ge f(x) + \nabla f(x)^\top (y - x),$$

    which says the tangent plane at any point is a **global** underestimator.
    Everything in this topic follows from that line. It is the same gradient you
    built in *Matrix Calculus* — the row vector of partials — and the same
    Hessian; convexity adds a constraint on the Hessian's spectrum.

    ## What the Hessian's eigenvalues tell you

    The second-order test is $\nabla^2 f(x) \succeq 0$ for every $x$ in the
    domain. Read the spectrum as a description of the local geometry:

    | Hessian spectrum | geometry | consequence for gradient descent |
    |---|---|---|
    | all $\lambda_i > 0$ | bowl, unique bottom | converges; rate set by $\kappa$ |
    | all $\lambda_i \ge 0$, some $= 0$ | trough, a flat direction | minimiser is a set; the iterate drifts forever along the flat direction |
    | mixed signs | saddle | escapes generically, but stalls while $\lvert\lambda_{\min}\rvert$ is small |
    | all $\lambda_i < 0$ | dome | diverges — the gradient points uphill |

    The test is *local* at each point and *global* in its quantifier: one point
    with a negative eigenvalue kills convexity for the whole function. Take

    $$f(x) = x^4 - 3x^2, \qquad f''(x) = 12x^2 - 6.$$

    $f''$ is negative on $(-0.7071, 0.7071)$, so $f$ is not convex. It has two
    local minima at $x = \pm 1.2247$ with $f = -2.25$, separated by a local
    maximum at $0$ with $f''(0) = -6$. Gradient descent from $x = 0.1$ and from
    $x = -0.1$ lands in different basins. That is the real cost of non-convexity:
    not a worse value, but an answer that depends on the seed.

    ## The one number that decides your training time

    For twice-differentiable $f$, write

    $$m I \preceq \nabla^2 f(x) \preceq L I \ \ \text{for all } x,
      \qquad \kappa = \frac{L}{m}.$$

    $m$ is how curved the flattest direction is, $L$ how curved the steepest is,
    and $\kappa$ their ratio. With the optimal fixed step $\eta = 2/(L+m)$,
    gradient descent contracts the error by

    $$\rho = \frac{\kappa - 1}{\kappa + 1}$$

    per iteration, so $10^{-6}$ relative accuracy takes
    $\lceil \ln(10^6) / \ln((\kappa+1)/(\kappa-1)) \rceil$ steps. Measured on
    $f(x) = \tfrac12(x_1^2 + \kappa x_2^2)$, the prediction is exact to the step:

    | $\kappa$ | $\eta^\star = 2/(L+m)$ | $\rho$ | steps to $10^{-6}$ |
    |---|---|---|---|
    | 1 | 1.0000 | 0.0000 | 1 |
    | 10 | 0.1818 | 0.8182 | 69 |
    | 100 | 0.0198 | 0.9802 | 691 |
    | 1,000 | 0.0020 | 0.9980 | 6,908 |
    | 10,000 | 0.0002 | 0.9998 | 69,078 |
    | 1,000,000 | 0.000002 | 0.999998 | 6,907,756 |

    The growth is linear in $\kappa$, not logarithmic. Ten times the conditioning
    is ten times the wall clock, which is why a run that "just needs more steps"
    usually needs a different algorithm instead.

    ## Why the step ceiling is exactly 2/L

    On a quadratic, $x_{k+1} = (I - \eta A)x_k$, so each eigen-direction is
    multiplied by $1 - \eta\lambda_i$. Stability requires
    $|1 - \eta\lambda_i| < 1$ for the largest $\lambda_i = L$, giving
    $\eta < 2/L$. The behaviour at the boundary is worth knowing because it is
    what a diverging run looks like from inside:

    | $\eta$ (with $L = 100$) | factor on the stiff direction | what you see |
    |---|---|---|
    | 0.019 | $-0.90$ | zig-zag that decays |
    | 0.020 | $-1.00$ | oscillation forever; loss never falls |
    | 0.021 | $-1.10$ | oscillation growing 10% per step |

    At $\eta = 0.021$ the error grows by $1.1$ per step: 290 steps carry it from
    $10^{-9}$ to $10^{3}$. The sawtooth you see just before a loss explodes is
    this factor crossing $-1$.

    ## Convexity you get for free

    Most convexity certificates are algebraic, not numerical. These operations
    preserve it:

    | operation | example | why it survives |
    |---|---|---|
    | non-negative weighted sum | $\lambda\|w\|_1 + \tfrac12\|y - Xw\|^2$ | the defining inequality is pointwise, so it adds |
    | pointwise maximum | $\max(0, 1 - y\,w^\top x)$ | a max of affine functions is a supremum of underestimators |
    | affine composition | $f(Ax + b)$ | affine maps carry chords to chords exactly |
    | partial minimisation | $\inf_z f(x, z)$ | projection of a convex epigraph is convex |
    | convex, non-decreasing outer | $\log(1 + e^{-z})$ composed with affine $z$ | monotonicity passes the inequality through |

    Logistic regression's convexity lives entirely in the last row:
    $-\log \sigma(z) = \log(1 + e^{-z})$ is convex and non-decreasing in $z$,
    and $z = -y\,w^\top x$ is affine in $w$. Delete the monotonicity and the
    argument dies — $e^{-x^2}$ is a convex decreasing function applied to a
    convex function and is not convex.

    ## Where convexity runs out

    Neural losses are not convex, and pretending otherwise produces bad
    engineering. But the failure mode is not what the 2-D pictures suggest. For
    a random Gaussian landscape in $d$ dimensions, the probability that a
    critical point is a local minimum is $2^{-d}$: at $d = 100$ that is
    $7.9 \times 10^{-31}$. The landscape is overwhelmingly saddles, and saddles
    with even one negative direction are escaped by gradient descent.

    Two consequences follow. First, "stuck in a bad local minimum" is a rare
    diagnosis; "stuck because $m$ is tiny and $\kappa$ is huge" is a common one,
    and it has a different fix (preconditioning, schedules, normalisation) from
    the one people reach for (random restarts). Second, the useful generalisation
    of strong convexity is not "nearly convex" but the Polyak–Łojasiewicz
    condition $\|\nabla f\|^2 \ge 2m(f - f^\star)$, which gives the same linear
    rate without implying a unique minimiser.

    ## What to do

    **1. Certify before you optimise.** Write the loss, check the five
    operations above, and you usually know on paper whether the problem is
    convex. If it is, stop worrying about seeds.

    **2. Measure $L$, not the loss.** A power iteration on Hessian-vector
    products gives $\lambda_{\max}$ in a few dozen backward passes. Set
    $\eta = 1/L$ and you will not diverge; set $\eta = 2/(L+m)$ and you get the
    optimal worst case.

    **3. Attack $\kappa$, not the iteration count.** Ridge with $\lambda$
    replaces $(L, m)$ by $(L + \lambda, m + \lambda)$: with $L = 1$,
    $m = 10^{-6}$ and $\lambda = 0.01$, $\kappa$ drops from $10^6$ to $101$ and
    the step budget falls from 6.9 million to 698. Preconditioning is the same
    trick applied per-direction instead of uniformly.

    **4. Distinguish the two failure modes before fixing either.** A flat loss
    with a small gradient is a plateau; a flat loss with a large gradient is a
    saddle or a bad step size. They look identical on a loss curve and have
    nothing in common as bugs.

    ## The longer version

    The remaining mechanisms, verbatim: subgradients and the origin of sparsity,
    Jensen's inequality and variational bounds, Lagrangian duality, and the
    non-convex case that deep learning actually lives in.

    ### Failure modes, in full

    - Your loss flattens at $10^{-3}$ and you conclude the model has converged. On a quadratic with $\kappa = 10^4$ gradient descent needs **69,078** steps to reach $10^{-6}$ relative error — you stopped at step 2,000 and called a plateau what was actually a slow eigenvalue.
    - You raise the learning rate from 0.01 to 0.1 because the loss was falling faster, and it becomes NaN. The ceiling is $2/L$ and it is not advice: at $\eta = 0.021$ on a problem with $L = 100$ the iterates grow by a factor of 1.1 per step, so 290 steps carry the error from $10^{-9}$ to $10^{3}$.
    - Someone asks whether the model is stuck in a bad local minimum. Without the Hessian you can only speculate; with it you can say whether the stationary point is a minimum (all eigenvalues $\ge 0$), a saddle (some $< 0$), or a flat direction (an eigenvalue $\approx 0$ that will absorb thousands of steps).
    - A reviewer asks why you use ridge rather than OLS with 400 features and 300 rows. "Regularisation" is not an answer. The true statement is that $X^\top X$ is singular, so the problem has a 100-dimensional flat direction and no unique minimiser; adding $\lambda I$ makes $m = \lambda > 0$, the problem strongly convex, and the answer unique.
    - Interviewers ask "is softmax cross-entropy convex?" and want the two-part answer — convex in the logits, not convex in the weights of a two-layer network — plus which of those two facts justifies which algorithm.

    ### The mechanisms, in full

    - **Convexity is a chord condition, and its first-order form is a certificate.** For all $x, y$ and $\theta \in [0,1]$, $f(\theta x + (1-\theta)y) \le \theta f(x) + (1-\theta) f(y)$: the straight line between two points on the graph never dips below the graph. For differentiable $f$ this is equivalent to $f(y) \ge f(x) + \nabla f(x)^\top(y-x)$ — the tangent plane is a *global* floor, not a local approximation. Check it on $f(x) = x^2$ at $x = 3$: the tangent is $9 + 6(y-3)$, which predicts $51$ at $y = 10$ against a true value of $100$. Being wrong by 49 in the safe direction is the whole point. Consequence: $\nabla f(x) = 0$ implies $x$ is a global minimiser, with no second-order check and no restarts. The trap: this form needs differentiability. $f(x) = |x|$ is convex and has no gradient at $0$, which is why subgradients exist.
    - **The second-order test is a PSD Hessian at every point, and "at every point" is what makes it a test rather than a definition.** $f$ is convex on a convex domain exactly when $\nabla^2 f(x) \succeq 0$ for all $x$ in that domain. Test $f(x) = x^4 - 3x^2$: $f''(x) = 12x^2 - 6$, which is $-6$ at the origin and stays negative until $|x| = 0.7071$. So $f$ is not convex, and indeed it has two local minima at $x = \pm 1.2247$ with $f = -2.25$ separated by a local maximum at $0$. Two nearby starting points end in different basins. Now test $f(x) = x^4$: $f''(0) = 0$, and the function is still convex — a semidefinite Hessian is enough, so a single zero eigenvalue is not evidence against convexity. A *sign change* is. The trap is domain: $f(x) = 1/x$ has $f'' = 2/x^3 > 0$ on $x > 0$ and $< 0$ on $x < 0$, so "convex" is always a statement about an interval, never about a formula.
    - **Two constants bracket the Hessian, and only their ratio matters.** $mI \preceq \nabla^2 f(x) \preceq LI$ for all $x$, where $m$ is the strong-convexity modulus and $L$ the smoothness constant. For least squares, $L = \lambda_{\max}(X^\top X)$ and $m = \lambda_{\min}(X^\top X)$, so $\kappa = L/m$ is the squared condition number of the design matrix. If your features are collinear with eigenvalues $1$ and $10^{-6}$, then $\kappa = 10^6$ and the problem is not "hard", it is *specifically* hard in one direction. This is the number that predicts training time; the number of parameters, the loss value and the dataset size do not. The trap: $L$ is a property of the *loss*, not of the optimiser, and it changes when you change the loss scale — multiplying the loss by 100 multiplies $L$ by 100 and divides the maximum stable step by 100.
    - **$\kappa$ sets the iteration count, and it is linear, not logarithmic.** With the optimal fixed step $\eta = 2/(L+m)$, gradient descent contracts the error by $\rho = (\kappa-1)/(\kappa+1)$ per step, so reaching $10^{-6}$ takes $\lceil \ln(10^6)/\ln((\kappa+1)/(\kappa-1)) \rceil$ steps. Measured on $\tfrac12(x_1^2 + \kappa x_2^2)$: **1** step at $\kappa = 1$, **69** at $\kappa = 10$, **691** at $\kappa = 100$, **6,908** at $\kappa = 1{,}000$, **69,078** at $\kappa = 10^4$ and **6.9 million** at $\kappa = 10^6$. Each factor of ten in $\kappa$ costs a factor of ten in steps. That is why "just train longer" is a strategy with a very short reach, and why preconditioning is worth its cost.
    - **The same $\kappa$ sets the step ceiling, and the marginal case never converges.** Gradient descent on a quadratic is stable only for $\eta < 2/L$. Take $L = 100$, $m = 1$. At $\eta = 0.019$ the $y$-factor is $1 - 1.9 = -0.9$: it oscillates while decaying. At $\eta = 0.02$ exactly, the factor is $-1.0$ and the iterate oscillates forever at constant amplitude — the loss never decreases, it just alternates. At $\eta = 0.021$ the factor is $-1.1$ and the error grows 10% per step, so 290 steps take it from $10^{-9}$ to $10^{3}$. This is also why the loss curve of a diverging run looks like a sawtooth before it looks like a bomb: the oscillation is the $-\lambda$ eigenvalue overshooting, the bomb comes later.
    - **Convexity is preserved by exactly the operations you compose models from, so most certificates are done on paper, not by a Hessian.** Non-negative weighted sums keep it ($\lambda\|w\|_1 + \tfrac12\|y-Xw\|^2$ is convex). Pointwise maxima keep it: the hinge $\max(0, 1 - y\,w^\top x)$ is a max of affine functions, hence convex, hence the linear SVM is a convex QP with a global optimum. Affine composition keeps it: $f(Ax+b)$. Partial minimisation keeps it: $\inf_z f(x,z)$ is convex in $x$. Composition with a convex *non-decreasing* outer function keeps it, which is why $\log(1+e^{-z})$ composed with the affine $z = -y\,w^\top x$ makes logistic regression convex. The trap is the direction of monotonicity: $e^{-x^2}$ is $e^{-u}$ (convex, decreasing) applied to $u = x^2$ (convex) and is **not** convex — it is the Gaussian bump, concave near zero.
    - **At a corner the gradient does not exist and the optimality condition becomes $0 \in \partial f$, which is where sparsity comes from.** The subdifferential of $|x|$ at $0$ is the whole interval $[-1,1]$, because every slope between $-1$ and $+1$ supports the graph there. For $f(w) = \tfrac12\|y-Xw\|^2 + \lambda\|w\|_1$ the coordinate-wise condition is $0 \in \|x_j\|^2(w_j - z_j) + \lambda\,\partial|w_j|$, and solving it gives the soft-threshold $w_j = \operatorname{sign}(z_j)\max(|z_j| - \lambda/\|x_j\|^2, 0)$. With $\lambda/\|x_j\|^2 = 0.5$: a signal $z_j = 0.3$ maps to exactly $0$, while $z_j = 1.2$ maps to $0.7$. The interval at the kink *absorbs* small gradients entirely, which is why Lasso produces exact zeros and ridge only produces small numbers. The trap: this is not "shrink to near zero and threshold at the end" — the zero is the exact solution of the optimisation, and thresholding a ridge solution afterwards gives a different (worse) estimator.
    - **Jensen's inequality is the same inequality applied to expectations, and it is where every variational bound comes from.** For convex $f$, $f(\mathbb{E}X) \le \mathbb{E}f(X)$. Take $\log$ (concave, so the inequality flips) and $X$ uniform on $\{1, 4\}$: $\mathbb{E}\log X = 0.6931$ while $\log \mathbb{E}X = \log 2.5 = 0.9163$ — a gap of $0.2231$. That gap is the entire content of $\mathrm{KL}(p\|q) \ge 0$ (apply Jensen to $-\log$ of a density ratio), of the ELBO being a *lower* bound on log-evidence, and of perplexity being a lower bound on true entropy. The trap: the bound is only as tight as the variance of $X$ — for a point mass the gap is zero, and a variational family that collapses to a point mass gets a tight bound on a useless approximation.
    - **Duality turns a constrained problem into a lower bound you can check while the optimiser runs.** With $L(x,\lambda) = f(x) + \lambda^\top g(x)$ and $\lambda \ge 0$, every $\lambda$ gives $d(\lambda) = \inf_x L(x,\lambda) \le p^\star$, because for feasible $x$ the penalty term is non-positive. That is weak duality, and it holds always, convex or not. Convexity plus Slater's condition upgrades it to strong duality ($\sup_\lambda d(\lambda) = p^\star$), which is what makes the SVM dual, the LP dual and the Wasserstein dual exact rather than merely suggestive. Concrete: minimise $x^2$ subject to $x \ge 1$. The primal optimum is $1$ at $x = 1$; the dual is $\max_{\lambda \ge 0} (\lambda - \lambda^2/4) = 1$ at $\lambda = 2$. The gap is zero, and the dual value is a certificate that no feasible point can beat $1$.
    - **Non-convex training works because bad minima are rare and saddles are not, and the thing that actually slows you down is still $\kappa$.** For a random Gaussian landscape in $d$ dimensions the probability that a critical point is a local minimum is $2^{-d}$ — $7.9 \times 10^{-31}$ at $d = 100$ — so the egg carton is overwhelmingly saddles, and gradient noise rolls through them. For a two-layer *linear* network every local minimum is global, so depth alone does not create bad minima. Where convexity is genuinely absent, the useful substitute is the Polyak–Łojasiewicz condition $\|\nabla f\|^2 \ge 2m(f - f^\star)$, which restores linear convergence without convexity. The trap is misdiagnosis: a training run that stalls at a high loss is far more often ill-conditioned (a small $m$, large $\kappa$) than trapped in a spurious minimum, and the fix is a preconditioner or a schedule, not a restart.


  derivations:
    - title: "Convexity implies the tangent plane is a global floor"
      latex: |
        For $\theta \in (0,1]$, apply the chord condition to the points $x$ and
        $y$, evaluated at $x + \theta(y-x)$:
        $$f(x + \theta(y-x)) \le (1-\theta)f(x) + \theta f(y).$$
        Subtract $f(x)$ from both sides and divide by $\theta$:
        $$\frac{f(x + \theta(y-x)) - f(x)}{\theta} \le f(y) - f(x).$$
        Let $\theta \downarrow 0$. The left side is the directional derivative
        $\nabla f(x)^\top (y-x)$, so
        $$\nabla f(x)^\top (y-x) \le f(y) - f(x).$$
        Setting $\nabla f(x) = 0$ leaves $f(y) \ge f(x)$ for every $y$ in the
        domain.
      prose: >-
        The limit of secant slopes is the tangent slope, and the chord condition
        bounds every secant by $f(y) - f(x)$. Passing to the limit gives a
        tangent plane that sits below the whole function, so a zero gradient is
        a certificate of global optimality rather than a local statement. No
        second-order check, no restart, no seed.
    - title: "The contraction rate is (κ−1)/(κ+1)"
      latex: |
        Let $f(x) = \tfrac12 x^\top A x$ with $0 \prec mI \preceq A \preceq LI$
        and $x_{k+1} = x_k - \eta\nabla f(x_k) = (I - \eta A)x_k$. In the
        $A$-norm $\|z\|_A^2 = z^\top A z$,
        $$\|x_{k+1}\|_A^2 = x_k^\top (I-\eta A)A(I-\eta A)x_k
          = \sum_i (1-\eta\lambda_i)^2 \lambda_i [x_k]_i^2 .$$
        Every eigen-direction is multiplied by $|1-\eta\lambda_i|$, so
        $$\|x_{k+1}\|_A \le \rho\|x_k\|_A, \qquad
          \rho = \max_i |1-\eta\lambda_i| = \max(|1-\eta m|,\,|1-\eta L|).$$
        Minimising over $\eta$ balances the two extremes:
        $1-\eta m = -(1-\eta L)$ gives $\eta^\star = 2/(L+m)$ and
        $$\rho = \frac{L-m}{L+m} = \frac{\kappa-1}{\kappa+1},
          \qquad k \approx \frac{\ln(1/\epsilon)}{\ln\rho} \approx
          \frac{\kappa}{2}\ln\frac{1}{\epsilon}.$$
      prose: >-
        The slowest direction is the flattest one and the step size is capped by
        the steepest one, so progress is governed entirely by the ratio. The
        approximation at the end uses $\ln\rho = \ln(1 - 2/(\kappa+1)) \approx
        -2/\kappa$, which is why the step count is linear in the condition
        number. At $\kappa = 100$: $\rho = 0.9802$ and
        $\ln(10^6)/\ln(0.9802) = 691$ steps, which is what the experiment
        measured.
    - title: "Subgradient optimality gives soft-thresholding, and therefore sparsity"
      latex: |
        The Lasso problem is
        $\min_w \tfrac12\|y - Xw\|^2 + \lambda\|w\|_1$. Fix every coordinate but
        $j$ and let $z_j$ be the value the quadratic alone would choose. The
        objective restricted to $w_j$ is
        $$\phi(w_j) = \tfrac12\|x_j\|^2 (w_j - z_j)^2 + \lambda|w_j| +
          \text{const}.$$
        Optimality is $0 \in \partial\phi$, i.e.
        $$0 \in \|x_j\|^2(w_j - z_j) + \lambda\,\partial|w_j|,
          \qquad
          \partial|w_j| =
          \begin{cases}\{+1\} & w_j > 0\\ [-1,1] & w_j = 0\\ \{-1\} & w_j < 0\end{cases}$$
        Solving, with $\tau = \lambda/\|x_j\|^2$:
        $$w_j = \operatorname{sign}(z_j)\max(|z_j| - \tau,\,0).$$
      prose: >-
        When $|z_j| \le \tau$ the required slope $\|x_j\|^2 z_j/\lambda$ lies
        inside $[-1,1]$, the kink absorbs the entire gradient, and the solution
        is exactly zero. That is the mechanism behind Lasso sparsity: not a
        threshold applied afterwards to a shrunken estimate, but the exact
        solution of a non-differentiable objective. With $\tau = 0.5$,
        $z_j = 0.3$ gives $0$ and $z_j = 1.2$ gives $0.7$.
    - title: "Every dual value is a lower bound"
      latex: |
        Consider $\min_x f(x)$ subject to $g(x) \le 0$, with
        $L(x,\lambda) = f(x) + \lambda^\top g(x)$ and $\lambda \ge 0$. For any
        feasible $x$, $g(x) \le 0$ and $\lambda \ge 0$ imply
        $\lambda^\top g(x) \le 0$, hence
        $$L(x,\lambda) \le f(x).$$
        Taking the infimum over $x$ and then evaluating at the primal optimum
        $x^\star$:
        $$d(\lambda) = \inf_x L(x,\lambda) \le L(x^\star,\lambda) \le f(x^\star) = p^\star.$$
      prose: >-
        The penalty term can only push the Lagrangian down at a feasible point,
        so its infimum is a bound any feasible solution must beat. This holds
        for every $\lambda \ge 0$ and every problem, convex or not — convexity
        is only needed to guarantee the bound is *achieved*. On
        $\min x^2$ s.t. $x \ge 1$, the dual $\max_{\lambda\ge0}(\lambda -
        \lambda^2/4)$ peaks at $\lambda = 2$ with value $1$, exactly the primal
        optimum: no gap, and a certificate you can print while the optimiser
        runs.

  implementations:
    - language: python
      title: "Classifying a point by the spectrum of its Hessian"
      note: >-
        Numerically wrong in two specific ways. The central-difference Hessian
        has truncation error $O(\epsilon^2)$ and roundoff error
        $O(\text{machine-eps}/\epsilon^2)$, so $\epsilon = 10^{-4}$ is a
        compromise and $\epsilon = 10^{-8}$ returns pure noise. And the verdict
        is scale-dependent: multiply $f$ by $10^{-9}$ and every eigenvalue
        becomes "zero". Always compare eigenvalues to
        $\max(1, |\lambda|_{\max})$, never to a fixed constant.
      code: |
        import numpy as np

        def curvature_report(f, x, eps=1e-4, rel_tol=1e-8):
            """Classify a point by the eigenvalues of its finite-difference Hessian.

            Returns counts of negative / zero / positive eigenvalues and a
            verdict. Cost is 2d^2 function evaluations, so this is a debugging
            tool for small parameter counts, not a training-loop component.
            """
            x = np.asarray(x, dtype=float)
            d = x.size
            H = np.zeros((d, d))
            for i in range(d):
                for j in range(d):
                    ei = np.zeros(d); ei[i] = eps
                    ej = np.zeros(d); ej[j] = eps
                    H[i, j] = (
                        f(x + ei + ej) - f(x + ei - ej)
                        - f(x - ei + ej) + f(x - ei - ej)
                    ) / (4.0 * eps * eps)

            # Finite differences never produce an exactly symmetric matrix;
            # eigvalsh would silently read only one triangle.
            H = 0.5 * (H + H.T)

            lam = np.linalg.eigvalsh(H)
            scale = max(1.0, float(np.abs(lam).max()))
            thresh = rel_tol * scale

            neg = int((lam < -thresh).sum())
            zero = int((np.abs(lam) <= thresh).sum())
            pos = d - neg - zero

            if neg:
                verdict = "saddle"       # at least one ascent direction
            elif zero:
                verdict = "flat"         # PSD but not PD: minimiser is a set
            else:
                verdict = "strict minimum"

            return {"eigvals": lam.tolist(), "neg": neg, "zero": zero,
                    "pos": pos, "verdict": verdict}
    - language: python
      title: "The step budget, and Newton as the thing that deletes κ"
      note: >-
        `gd_quadratic` is numerically wrong when $m = 0$: the optimal step
        $2/(L+m)$ degenerates to $2/L$ and the "contraction" it reports is
        meaningless because the error along the flat direction never contracts.
        `clipped_newton` is wrong in a more interesting way — see its docstring.
      code: |
        import numpy as np

        def spectral_constants(A):
            """(L, m) for f(x) = 0.5 x^T A x with A symmetric."""
            lam = np.linalg.eigvalsh(0.5 * (A + A.T))
            return float(lam.max()), float(max(lam.min(), 0.0))

        def gd_quadratic(A, b, iters=1000, eta=None):
            """Gradient descent on 0.5 x^T A x - b^T x.

            Returns the iterate, the loss history, and the theoretical number
            of steps needed to reach 1e-6 relative error in the A-norm.
            """
            A = np.asarray(A, float); b = np.asarray(b, float)
            L, m = spectral_constants(A)
            if eta is None:
                eta = 2.0 / (L + m) if m > 0 else 1.0 / L
            kappa = L / m if m > 0 else float("inf")

            x = np.zeros_like(b)
            hist = []
            for _ in range(iters):
                x = x - eta * (A @ x - b)
                hist.append(float(0.5 * x @ A @ x - b @ x))

            if np.isfinite(kappa) and kappa > 1:
                steps = int(np.ceil(np.log(1e6) / np.log((kappa + 1) / (kappa - 1))))
            else:
                steps = 1
            return x, hist, {"L": L, "m": m, "kappa": kappa,
                             "eta": eta, "steps_to_1e6": steps}

        def clipped_newton(A, b, iters=20, floor=1e-3):
            """Newton with the Hessian's eigenvalues floored at `floor`.

            This converges in ONE step on a convex quadratic. It is WRONG on a
            non-convex objective: flooring a negative eigenvalue turns an
            ascent direction into a tiny descent one, so the method crawls
            along the negative-curvature direction towards a saddle instead of
            following it to the boundary. A trust region or a line search is
            the correct repair; eigenvalue clipping only makes the *step*
            well-defined, it does not make the *problem* convex.
            """
            A = np.asarray(A, float); b = np.asarray(b, float)
            lam, V = np.linalg.eigh(0.5 * (A + A.T))
            lam = np.maximum(lam, floor)
            A_reg = V @ np.diag(lam) @ V.T
            return np.linalg.solve(A_reg, b)

  checkpoints:
    - id: cp-1
      question: >-
        $f(x) = x^4$ has $f''(0) = 0$. Does that make it non-convex? And what
        does the same test say about $f(x) = x^3$, which also has $f''(0) = 0$?
      answerKind: short_text
      hint: "The test quantifies over all $x$, not over one point."
      solution: >-
        $f''(x) = 12x^2 \ge 0$ everywhere, so the Hessian is positive
        semidefinite at every point and $x^4$ is convex. A semidefinite Hessian
        is enough; positive *definite* is not required. $x^3$ has
        $f''(x) = 6x$, which is negative for $x < 0$ and positive for $x > 0$ —
        a sign change, so $x^3$ is neither convex nor concave. The lesson is that
        a zero eigenvalue tells you nothing on its own; what matters is whether
        the spectrum ever goes negative, and whether it stays negative.
    - id: cp-2
      question: >-
        A quadratic loss has $L = 8$ and $m = 2$. What is the largest learning
        rate that does not diverge, what is the optimal one, and how many steps
        to $10^{-3}$ relative error?
      answerKind: short_text
      hint: "The ceiling is $2/L$; the optimum is $2/(L+m)$; the rate is $(\\kappa-1)/(\\kappa+1)$."
      solution: >-
        $\kappa = L/m = 4$. Stability needs $\eta < 2/L = 0.25$; at exactly
        $0.25$ the stiff direction oscillates with factor $-1$ and never
        decays. The optimal step is $2/(L+m) = 2/10 = 0.2$, giving
        $\rho = (\kappa-1)/(\kappa+1) = 3/5 = 0.6$ per step. Steps to
        $10^{-3}$: $\ln(10^{-3})/\ln(0.6) = 6.908/0.5108 = 13.5$, so 14 steps.
        Note that the stability ceiling and the optimal step are different
        numbers, and the ceiling is the one that produces a sawtooth.
    - id: cp-3
      question: >-
        Logistic regression's loss is convex in the weights. Why does that
        argument fail for a two-layer network with a logistic hidden layer?
      answerKind: short_text
      hint: "Which of the convexity-preserving operations does the second layer break?"
      solution: >-
        For logistic regression the loss is $\log(1 + e^{-z})$ with
        $z = -y\,w^\top x$: a convex non-decreasing outer function composed with
        an affine map, which preserves convexity. In a two-layer network the
        loss is $g(W_2 \phi(W_1 x))$; as a function of $W_1$ the inner map
        $W_1 \mapsto W_2\phi(W_1 x)$ is not affine, and $\phi$ is applied
        elementwise *before* the final linear map, so the composition is a
        product of parameters. Concretely, the Hessian with respect to $W_1$ has
        negative eigenvalues near $W_1 = 0$ — the dead-unit saddle. Convexity
        survives in the last layer only, which is why the head can be solved
        exactly while the trunk cannot.
    - id: cp-4
      question: >-
        In a Lasso with $\lambda/\|x_j\|^2 = 0.5$, the unpenalised coordinate
        solution is $z_j = 0.3$. What is $w_j$, and why is it exactly zero
        rather than merely small?
      answerKind: short_text
      hint: "What is the subdifferential of $\\lambda|w_j|$ at $w_j = 0$?"
      solution: >-
        $w_j = 0$ exactly. At the kink the penalty's subdifferential is
        $[-0.5, 0.5]$, and the quadratic's gradient there is
        $0.5(0 - 0.3) = -0.15$, so the optimality condition
        $0 \in -0.15 + [-0.5, 0.5]$ holds because $0.15$ lies inside the
        interval. The kink absorbs the whole gradient, so nothing pushes the
        coordinate off zero and the exact solution sits at the
        non-differentiable point. For $z_j = 1.2$ the required slope $0.6$
        exceeds $0.5$, the kink can no longer absorb it, and
        $w_j = 1.2 - 0.5 = 0.7$.
    - id: cp-5
      question: >-
        Your least-squares Hessian has eigenvalues $1$ and $10^{-6}$, so
        $\kappa = 10^6$. Adding ridge with $\lambda = 0.01$ changes the spectrum
        to $1.01$ and $0.010001$. What does that do to the step budget, and why
        is this a better fix than training longer?
      answerKind: short_text
      hint: "Recompute $\\kappa$, then use $\\ln(10^6)/\\ln((\\kappa+1)/(\\kappa-1))$."
      solution: >-
        $\kappa$ falls from $10^6$ to $1.01/0.010001 = 101$. The budget goes
        from 6,907,756 steps to $\ln(10^6)/\ln(102/100) = 698$ — four orders of
        magnitude. Training longer cannot fix $\kappa$ because the contraction
        factor is fixed by the ratio, not by the budget: you would need
        $10^4\times$ the steps to gain one more order of accuracy. Regularisation
        changes the *problem*; the schedule only changes how long you spend on
        it.
    - id: cp-6
      question: >-
        A checkpoint has zero gradient but two Hessian eigenvalues of $-0.4$ and
        $+3.1$. Is it a local minimum? What happens if you keep training?
      answerKind: short_text
      hint: "One negative eigenvalue is enough to define a descent direction."
      solution: >-
        It is a strict saddle, not a minimum. The eigenvector for $-0.4$ is a
        direction in which the loss *decreases*, so it is a descent direction
        despite the gradient being zero to numerical precision. Gradient descent
        will escape it, but the escape time scales with
        $1/|\lambda_{\min}| = 2.5$ and with the logarithm of the noise
        perpendicular to the stable manifold — if the iterate starts almost
        exactly on it, you can sit there for a long time. In practice this is
        what "training restarted and suddenly improved" usually is: not a better
        basin, but an escaped saddle.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Convexity is a global property, not a local one, and that is the whole
        reason it is useful. A function is convex when the straight line between
        any two of its points lies above it — which forces the tangent plane at
        every point to lie below it, which in turn makes "the gradient is zero
        here" a proof rather than a hint. The practical question is never
        "is it convex?" in the abstract; it is "which of the operations I used
        to build this loss preserve the property, and where did I break it?"
      blocks:
        - kind: checklist
          body: |
            - Convexity is inherited: sums with positive weights, maxima, affine maps, partial minimisation
            - Convexity is destroyed: dividing by a parameter, composing with a non-monotone map, a negative weight
            - The Hessian is the local witness; one negative eigenvalue anywhere is a counterexample
            - The condition number is the practical consequence: it sets both the step ceiling and the step count
            - Convexity is sufficient for optimisation to be easy, not necessary
      checkpoint: >-
        Before reading further: name a loss you have used that is convex, and
        say precisely which operation in its construction would have to change
        for it to stop being convex.
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Two separate jobs, two separate tools. To *classify* a point — minimum,
        saddle, or flat — you need the signs of the Hessian's eigenvalues, which
        finite differences or Hessian-vector products give you. To *predict cost*
        you need the two extreme eigenvalues, because their ratio is the only
        thing the convergence rate depends on. Reaching for a Hessian when you
        want a step budget is overkill; reaching for a loss curve when you want
        to know whether you are stuck is not enough information.
      blocks:
        - kind: checklist
          body: |
            - Classify a point: count negative eigenvalues (relative tolerance, not absolute)
            - Predict cost: kappa = lambda_max / lambda_min, steps ~ (kappa/2) ln(1/eps)
            - Choose a step: eta below 2/L, optimal at 2/(L+m)
            - Fix conditioning: ridge shifts both ends by lambda, preconditioners rescale per-direction
            - Prove convexity: composition rules on paper, Hessian check as confirmation
      checkpoint: >-
        Which of these five would you do first on a 100-million-parameter
        transformer, and which would you never attempt? Why does the answer
        change with dimension?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        The procedure is a loop of cheap probes around an expensive training
        run, not a full Hessian. Estimate the extreme eigenvalues, convert them
        into a step size and a step budget, then check whether the budget is
        acceptable before spending it.
      blocks:
        - kind: pseudocode
          body: |
            # 1. Spectral probe (Hessian-vector products, no Hessian materialised)
            for k in range(n_probe):
                v = random_unit_vector(d)
                Hv = grad(lambda: dot(grad(f, x), v))   # one extra backward
                lam_max_est = max(lam_max_est, dot(v, Hv))
                lam_min_est = min(lam_min_est, dot(v, Hv))

            # 2. Convert to the two numbers that matter
            kappa = lam_max_est / lam_min_est
            eta_ceiling = 2 / lam_max_est
            eta_optimal = 2 / (lam_max_est + lam_min_est)
            steps_to_eps = ceil(ln(1/eps) / ln((kappa+1)/(kappa-1)))

            # 3. Decide: is the budget acceptable?
            if steps_to_eps > budget:
                regularise (add lambda I) or precondition (divide by curvature)
            else:
                train with eta_optimal

            # 4. Verify the model of the problem, do not trust it
            measure the actual loss decrease per step and compare to rho
      checkpoint: >-
        Step 1 samples random directions rather than computing eigenvectors.
        What does that give you, and what does it systematically miss — think
        about a Hessian with one large negative eigenvalue and a thousand small
        positive ones.
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The convergence rate comes from diagonalising the quadratic and watching
        each eigen-direction shrink by its own factor. The slowest factor
        dominates, the step size is constrained by the fastest, and the ratio
        between them is the only quantity left standing.
      blocks:
        - kind: math
          body: |
            For $f(x) = \tfrac12 x^\top A x$ with
            $mI \preceq A \preceq LI$ and $x_{k+1} = (I - \eta A)x_k$:

            $$\|x_{k+1}\|_A^2 = \sum_i (1-\eta\lambda_i)^2 \lambda_i [x_k]_i^2$$

            $$\rho(\eta) = \max_i |1 - \eta\lambda_i|
              = \max(|1-\eta m|,\, |1-\eta L|)$$

            Balancing the extremes, $1-\eta m = -(1-\eta L)$, gives

            $$\eta^\star = \frac{2}{L+m}, \qquad
              \rho = \frac{L-m}{L+m} = \frac{\kappa-1}{\kappa+1}$$

            and therefore

            $$k \;\ge\; \frac{\ln(1/\epsilon)}{\ln \rho}
              \;\approx\; \frac{\kappa}{2}\ln\frac{1}{\epsilon}.$$

            The stability limit is separate: $|1-\eta L| < 1 \Rightarrow \eta < 2/L$.
      checkpoint: >-
        The bound says the step count is linear in $\kappa$ while the accuracy
        is only logarithmic in $\epsilon$. Which of those two dependencies
        explains why "train longer" is usually the wrong fix, and which explains
        why "train to lower loss" is usually cheap once $\kappa$ is small?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete probe-and-decide routine, with the places where each step is
        dishonest.
      blocks:
        - kind: warning
          body: >-
            The spectral probe below estimates extremes from random directions.
            It is a lower bound on $\lambda_{\max}$ and an upper bound on
            $\lambda_{\min}$ — it never overestimates $\kappa$, so it is
            optimistic in exactly the direction that hurts. Run it long enough
            that the estimate stops moving, and treat the result as a floor on
            the difficulty.
        - kind: code
          language: python
          body: |
            import numpy as np

            def spectral_probe(hvp, d, n_probe=200, seed=0):
                """Estimate (lambda_max, lambda_min) from Hessian-vector products.

                `hvp(v)` must return H @ v. Never forms H.
                """
                rng = np.random.default_rng(seed)
                hi, lo = -np.inf, np.inf
                for _ in range(n_probe):
                    v = rng.normal(size=d)
                    v /= np.linalg.norm(v)
                    Hv = hvp(v)
                    r = float(v @ Hv)          # Rayleigh quotient
                    hi, lo = max(hi, r), min(lo, r)
                return hi, lo

            def step_budget(lam_max, lam_min, eps=1e-6):
                """Optimal step, contraction factor, and steps to eps accuracy."""
                if lam_min <= 0:
                    return {"kappa": float("inf"), "eta": 1.0 / lam_max,
                            "rho": 1.0, "steps": None,
                            "verdict": "not strongly convex: no rate guarantee"}
                kappa = lam_max / lam_min
                rho = (kappa - 1) / (kappa + 1)
                steps = int(np.ceil(np.log(1.0 / eps) / np.log(rho))) if kappa > 1 else 1
                return {"kappa": kappa, "eta": 2.0 / (lam_max + lam_min),
                        "rho": rho, "steps": steps,
                        "verdict": "convex" if steps < 1e5 else "precondition first"}

            def ridge_conditioning(lam_max, lam_min, lam):
                """What adding lambda*I does to the conditioning.

                This is the cheapest fix available and it is exact: both ends
                shift by lambda, so kappa -> (lam_max+lam)/(lam_min+lam).
                """
                before = lam_max / lam_min if lam_min > 0 else float("inf")
                after = (lam_max + lam) / (lam_min + lam)
                return {"before": before, "after": after,
                        "speedup": before / after}
      checkpoint: >-
        Ridge reduces $\kappa$ by shrinking the *ratio*, and it does so by
        raising the floor rather than lowering the ceiling. Explain why that
        necessarily makes the optimal step smaller in absolute terms even though
        it makes the convergence faster in relative terms.

  problems:
    - id: p-condition-number
      title: "Condition number from the spectrum"
      difficulty: easy
      prompt: >-
        Implement `solve(A)` for a symmetric positive semidefinite matrix: return
        the condition number $\kappa = \lambda_{\max}/\lambda_{\min}$ as a float.
        If the smallest eigenvalue is not meaningfully positive — define that as
        $\lambda_{\min} \le 10^{-12}\lambda_{\max}$ — return `float("inf")`,
        because the problem has a flat direction and no finite rate guarantee.
        Clip tiny negative eigenvalues, which `eigvalsh` returns for a matrix
        that is PSD in exact arithmetic.
      starter: |
        import numpy as np

        def solve(A):
            # your implementation here
            pass
      language: python
      entry: solve
      testCases:
        - input: "[[[2.0, 0.0], [0.0, 8.0]]]"
          expected: "4.0"
          mode: json
          tolerance: 1e-9
        - input: "[[[1.0, 0.0], [0.0, 1.0]]]"
          expected: "1.0"
          mode: json
          tolerance: 1e-9
        - input: "[[[4.0, 2.0], [2.0, 4.0]]]"
          expected: "3.0"
          mode: json
          tolerance: 1e-9
        - input: "[[[1.0, 1.0], [1.0, 1.0]]]"
          expected: "Infinity"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def solve(A):
            A = np.asarray(A, dtype=float)
            # Symmetrise: eigvalsh reads one triangle only, so an asymmetric
            # input would be silently half-ignored.
            A = 0.5 * (A + A.T)
            lam = np.linalg.eigvalsh(A)
            lam_max = float(lam.max())
            lam_min = float(max(lam.min(), 0.0))   # clip numerical negatives
            if lam_max <= 0.0:
                return float("inf")
            if lam_min <= 1e-12 * lam_max:
                return float("inf")
            return lam_max / lam_min
      solutionExplanation: >-
        The condition number is the ratio of the extreme eigenvalues, and it is
        the number that sets both the largest stable step ($2/\lambda_{\max}$)
        and the iteration count
        ($\ln(1/\epsilon)/\ln((\kappa+1)/(\kappa-1))$). The two guards are the
        substance of the problem: `eigvalsh` on a rank-deficient matrix returns
        eigenvalues like $-3\times10^{-17}$ that are numerically zero, and
        dividing by those gives a huge finite number instead of the honest
        answer, which is "unbounded". Symmetrising first matters because
        `eigvalsh` only reads the lower triangle. For $[[4,2],[2,4]]$ the
        eigenvalues are $6$ and $2$, giving $\kappa = 3$.
      complexity: "O(n³) time for the eigendecomposition, O(n²) space"
      tags: [hessian, conditioning, eigenvalues, numpy]

    - id: p-step-budget
      title: "Predicting the step budget"
      difficulty: medium
      prompt: >-
        Implement `solve(kappa, tol)` returning the number of gradient-descent
        iterations needed to reduce the error in the $A$-norm to a relative
        `tol`, for a quadratic with condition number `kappa`, using the optimal
        fixed step. Use the bound
        $\lceil \ln(1/\text{tol}) / \ln((\kappa+1)/(\kappa-1)) \rceil$ and return
        an integer. For `kappa == 1` return 1 — one step is exact.
      starter: |
        import math

        def solve(kappa, tol):
            # your implementation here
            pass
      language: python
      entry: solve
      testCases:
        - input: "[100.0, 1e-6]"
          expected: "691"
          mode: json
          tolerance: 1e-9
        - input: "[10.0, 1e-6]"
          expected: "69"
          mode: json
          tolerance: 1e-9
        - input: "[1000.0, 1e-9]"
          expected: "10362"
          mode: json
          tolerance: 1e-9
        - input: "[1.0, 1e-6]"
          expected: "1"
          mode: json
          tolerance: 1e-9
      solution: |
        import math

        def solve(kappa, tol):
            kappa = float(kappa)
            tol = float(tol)
            if kappa <= 1.0:
                return 1
            rho = (kappa - 1.0) / (kappa + 1.0)
            if rho <= 0.0:
                return 1
            # ln(1/tol) is positive for tol < 1; express the denominator as
            # ln(1/rho) = ln((kappa+1)/(kappa-1)) so both logs are positive.
            steps = math.log(1.0 / tol) / math.log(1.0 / rho)
            return int(math.ceil(steps))
      solutionExplanation: >-
        The contraction factor per iteration is $\rho = (\kappa-1)/(\kappa+1)$,
        so after $k$ steps the relative error is at most $\rho^k$; setting
        $\rho^k \le \text{tol}$ and solving gives
        $k = \ln(\text{tol})/\ln\rho = \ln(1/\text{tol})/\ln(1/\rho)$. Because
        $\ln\rho \approx -2/\kappa$, the count is roughly
        $\tfrac{\kappa}{2}\ln(1/\text{tol})$: 691 at $\kappa=100$ and
        $10^{-6}$, 6,908 at $\kappa = 1000$, 69,078 at $\kappa = 10^4$. The
        `kappa <= 1` branch matters because the formula divides by zero at
        $\kappa = 1$, which is the case where a single step is exact.
      complexity: "O(1) time, O(1) space"
      tags: [gradient-descent, convergence-rate, condition-number]

    - id: p-soft-threshold
      title: "Soft-thresholding as Lasso's exact solution"
      difficulty: medium
      prompt: >-
        Implement `solve(z, lam)` returning the soft-threshold
        $S_\lambda(z) = \operatorname{sign}(z)\max(|z| - \lambda, 0)$. This is
        the exact minimiser of $\tfrac12(w - z)^2 + \lambda|w|$, and therefore
        the coordinate update of the Lasso. Return `0.0` (not `-0.0`, and not a
        tiny number) when $|z| \le \lambda$.
      starter: |
        import math

        def solve(z, lam):
            # your implementation here
            pass
      language: python
      entry: solve
      testCases:
        - input: "[0.3, 0.5]"
          expected: "0.0"
          mode: json
          tolerance: 1e-12
        - input: "[1.2, 0.5]"
          expected: "0.7"
          mode: json
          tolerance: 1e-9
        - input: "[-0.9, 0.5]"
          expected: "-0.4"
          mode: json
          tolerance: 1e-9
        - input: "[0.5, 0.5]"
          expected: "0.0"
          mode: json
          tolerance: 1e-12
      solution: |
        def solve(z, lam):
            z = float(z)
            lam = float(lam)
            if abs(z) <= lam:
                # The subdifferential at zero is [-lam, lam]; any gradient in
                # that range is absorbed by the kink, so the exact answer is 0.
                return 0.0
            return (1.0 if z > 0 else -1.0) * (abs(z) - lam)
      solutionExplanation: >-
        The objective $\tfrac12(w-z)^2 + \lambda|w|$ has a kink at zero, and its
        subdifferential there is $[-\lambda, \lambda]$. Optimality requires
        $0 \in (w - z) + \lambda\partial|w|$; at $w = 0$ that reads
        $z \in [-\lambda, \lambda]$, which is satisfied by every $|z| \le
        \lambda$. So the minimiser is exactly zero on that whole interval — not
        approximately zero, and not a limit. Outside it, the smooth stationarity
        condition $w - z + \lambda\,\text{sign}(w) = 0$ gives
        $w = z - \lambda\,\text{sign}(z)$. That discontinuity in the derivative
        is the entire reason $\ell_1$ regularisation produces sparse solutions
        while $\ell_2$ only shrinks.
      complexity: "O(1) time, O(1) space"
      tags: [lasso, subgradient, sparsity, proximal]

  visualizers:
    - id: vs-loss-surface
      kind: loss_surface
      title: "Bowl or egg carton?"
      description: >-
        Drag the curvature ratio from 1 to 1000 and watch the descent path
        stretch into a zig-zag across the stiff axis while barely moving along
        the flat one. The counter under the plot is the predicted step count,
        $\ln(10^6)/\ln((\kappa+1)/(\kappa-1))$.
      params:
        minKappa: 1
        maxKappa: 1000
        eps: 1e-6
        mode: "quadratic-gd"

  try_it: >-
    Evaluate $f''(x)$ for $f(x) = x^4 - 3x^2$ at $x = 0$ and at $x = 2$: you get
    $-6$ and $42$, and the first number is why a single Hessian check cannot
    certify convexity. Then take a quadratic with $m = 1$, $L = 100$ and compute
    the contraction factor and the step count to $10^{-6}$ relative error at
    $\kappa = 10^4$, and check your answer against 69,078.
  interview_questions:
    - question: "What does convexity actually buy you that a small gradient does not?"
      level: mid
      key_points:
        - "Every stationary point is a global minimum, so solving $\\nabla f(x) = 0$ finishes the problem instead of finding a candidate."
        - "The first-order condition $f(y) \\ge f(x) + \\nabla f(x)^\\top(y-x)$ is a checkable certificate for the point you are standing on."
        - "A small gradient at a non-convex point certifies nothing — it may be a saddle, a local minimum, or the shoulder of a plateau."
        - "Convexity is preserved by non-negative weighted sums and pointwise maxima, so most model losses are certified on paper rather than by a Hessian."
      follow_up: "Which common loss is convex in its parameters but not in the inputs, and why does that distinction matter for generalisation?"
    - question: "Your loss flattens at $10^{-3}$. How do you tell a genuine plateau from one slow eigenvalue?"
      level: senior
      key_points:
        - "Compute $\\kappa = L/m$ from the Hessian spectrum: convergence takes about $\\kappa \\ln(1/\\epsilon)/2$ steps, and at $\\kappa = 10^4$ reaching $10^{-6}$ needs 69,078."
        - "Check the gradient norm rather than the loss: a slow eigen-direction leaves a small but non-vanishing gradient, while a true minimum drives it to zero."
        - "Estimate $\\lambda_{\\max}$ and $\\lambda_{\\min}$ with a few power iterations or Hessian-vector products — the ratio is the diagnosis and the cost forecast."
        - "The fixes change the spectrum: momentum gives $\\sqrt{\\kappa}$, preconditioning rescales the axes, and a schedule only changes the step size."
      follow_up: "You cannot afford Hessian-vector products on a 7B model. What proxy tells you the same thing?"
    - question: "With $L = 100$, why does $\\eta = 0.021$ diverge when $\\eta = 0.019$ converges?"
      level: mid
      key_points:
        - "On a quadratic the per-step factor along the steepest direction is $1 - \\eta L$, so stability requires $\\eta < 2/L = 0.02$."
        - "At $\\eta = 0.019$ the factor is $-0.9$: it oscillates while decaying. At $\\eta = 0.021$ it is $-1.1$ and the error grows 10% per step."
        - "Growth is exponential, not gradual: 290 steps carry the error from $10^{-9}$ to $10^{3}$, which is why the run looks fine and then is not."
        - "At $\\eta = 2/L$ exactly the factor is $-1$ and the iterate oscillates forever without decaying — the marginal case never converges."
  common_mistakes:
    - "Declaring convergence because the loss stopped moving, when a condition number of $10^4$ means the slow direction is still travelling."
    - "Raising the learning rate past $2/L$ and treating the NaN as a data problem — the divergence is predicted by the step size, not by the batch."
    - "Testing convexity from the Hessian at one point: $f(x) = x^4 - 3x^2$ looks convex at $x = 2$ and is not at $x = 0$, and the definition quantifies over the whole domain."
  further_reading:
    - label: "Boyd & Vandenberghe, Convex Optimization"
      url: "https://web.stanford.edu/~boyd/cvxbook/"
    - label: "Nesterov, Introductory Lectures on Convex Optimization"
