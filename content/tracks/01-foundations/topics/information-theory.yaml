id: information-theory
slug: information-theory
title: "Cross-Entropy Is a Bit Count: Entropy, KL Divergence, Perplexity"
summary: >-
  Learn why cross-entropy is the loss function for every classifier, what KL
  divergence actually measures, and how to read a perplexity number without
  guessing.
kind: lesson
difficulty: medium
position: 6
estMinutes: 18
prerequisites: [probability-distributions]
phase: mathematical-foundations
tags: [information-theory, entropy, kl-divergence, cross-entropy, loss]

body:
  big_idea: >-
    Cross-entropy counts the bits a model needs to encode reality, so minimising it
    charges exactly for the extra cost of believing the wrong distribution — and
    perplexity is that count exponentiated.

  problem:
    - "You will use `F.cross_entropy` a thousand times without knowing why it beats MSE, or why a plateau or a NaN is information-theoretic."
    - "Cross-entropy and KL differ by $H(P)$, which is why the loss never reaches zero: it floors at the data's own entropy."
    - "A perplexity of 15.6 means \"as uncertain as a uniform choice over 50,257 tokens\" — that translation is what makes an LM eval number interpretable."

  analogy: |
    You must send weather messages and pay per bit. If rain is 90% likely, a
    code where "rain" is short and "no rain" long costs about 0.47 bits — the
    **entropy**. Design that code believing 50/50 and you pay 1.0 bit; the extra
    0.53 is the **KL divergence**. Cross-entropy is the total bill.

  concept_points:
    - "**Entropy is the floor on your loss, set by the data.** For a Bernoulli with $p=0.9$, $H = 0.469$ bits; at $p=0.99$, $0.0808$; at $p=1$, $0$. A classifier on a 90/10 task cannot get below 0.469 bits of cross-entropy however good it is — if the loss plateaus there, the model is done, not broken."
    - "**Cross-entropy = entropy + KL, exactly.** For $P = [0.9, 0.1]$, $H(P) = 0.4690$; against $Q = [0.8, 0.2]$, $D_{KL} = 0.0529$ and cross-entropy $= 0.5219$. Since $H(P)$ does not depend on parameters, $\\nabla_\\theta \\text{CE} = \\nabla_\\theta D_{KL}$: minimising one minimises the other, and the loss floors at $H(P)$ rather than at zero."
    - "**KL is a divergence, not a distance, because it is asymmetric.** $D_{KL}([0.9,0.1] \\| [0.5,0.5]) = 0.5310$ but $D_{KL}([0.5,0.5] \\| [0.9,0.1]) = 0.7370$. Forward KL penalises $Q$ placing near-zero mass where $P$ has mass (mode-covering); reverse KL penalises mass where $P$ has none (mode-seeking). That is the difference between VI and expectation propagation."
    - "**Label smoothing makes the target's entropy non-zero.** With 10 classes and $\\epsilon = 0.1$ the smoothed target has $H = 0.7218$ bits, up from $0$. Against a perfectly confident one-hot model the cross-entropy is **infinite**, because $\\log 0 = -\\infty$. Smoothing caps how confident the model can profitably become."
    - "**Perplexity is $2^{\\text{cross-entropy}}$ in bits — the effective vocabulary size.** Cross-entropy 0.693 → 1.62, 8.0 → 256. A uniform distribution over $k$ classes has perplexity exactly $k$: for 50,257 tokens that is 15.617 bits, so a model reporting perplexity 15.6 is no better than uniform guessing."
    - "**MSE on classification is the wrong cost, not merely slower.** Cross-entropy's gradient with respect to the logits is $\\hat p - p$: bounded, and zero exactly when the prediction is right. MSE through a sigmoid carries a factor $\\sigma'(z) \\le 0.25$, so gradients **vanish** precisely when the model is confidently wrong."

  definitions:
    - { term: "Entropy $H(P)$", meaning: "The expected surprise of a distribution: $-\\sum_i p_i \\log p_i$. The minimum number of bits needed to encode samples from $P$." }
    - { term: "Cross-entropy $H(P,Q)$", meaning: "$-\\sum_i p_i \\log q_i$. The cost of encoding samples from $P$ using a code designed for $Q$. Equals $H(P) + D_{KL}(P\\|Q)$." }
    - { term: "KL divergence $D_{KL}(P\\|Q)$", meaning: "The extra bits from using $Q$ when the truth is $P$: $\\sum_i p_i \\log(p_i/q_i)$. Non-negative, zero iff $P = Q$, and **not symmetric**." }
    - { term: "Perplexity", meaning: "$2^{H}$ in bits, or $e^{H}$ in nats — the effective number of equally likely choices. A uniform distribution over $k$ options has perplexity exactly $k$." }
    - { term: "Mutual information $I(X;Y)$", meaning: "$H(X) - H(X|Y)$ — how many bits knowing $Y$ saves you about $X$. Zero iff $X$ and $Y$ are independent." }
    - { term: "Jensen's inequality", meaning: "$\\mathbb{E}[f(X)] \\le f(\\mathbb{E}[X])$ for concave $f$. Applied to $\\log$, it proves KL divergence is non-negative." }
    - { term: "Bit / nat", meaning: "Units of information. One bit is one binary decision; one nat is the same quantity using natural log. 1 nat = 1.4427 bits." }
    - { term: "Label smoothing", meaning: "Replacing the one-hot target with $(1-\\epsilon)$ on the true class and $\\epsilon/K$ on the rest. It sets a floor on achievable loss and discourages extreme confidence." }
    - { term: "Temperature", meaning: "A divisor applied to logits before softmax. $T \\to 0$ sharpens toward argmax (entropy → 0); $T \\to \\infty$ flattens toward uniform (entropy → $\\log K$)." }
    - { term: "Mode covering vs mode seeking", meaning: "Forward KL $D_{KL}(P\\|Q)$ forces $Q$ to cover all of $P$'s mass; reverse KL $D_{KL}(Q\\|P)$ lets $Q$ collapse onto one mode. The direction you optimise changes the model you get." }

  diagrams:
    - type: compare
      title: "Cross-entropy vs MSE for classification"
      left_label: "Cross-entropy"
      left_points:
        - "Gradient w.r.t. logits is $\\hat{p} - p$ — bounded and well-scaled"
        - "Penalises confident wrong answers without bound"
        - "Floors at $H(P)$, typically 0.1-1.0 bits"
      right_label: "MSE through sigmoid"
      right_points:
        - "Gradient carries $\\sigma'(z) \\le 0.25$, vanishing when confident"
        - "Vanishes when the model is confidently WRONG"
        - "Penalty saturates at 1.0, so no signal to correct"
    - type: plot
      title: "Binary entropy peaks at p = 0.5 and collapses at the edges"
      chart: "line"
      xLabel: "p"
      yLabel: "H(p) in bits"
      series:
