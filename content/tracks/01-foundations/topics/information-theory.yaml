    - type: plot
      title: "KL grows fast when Q contradicts P"
      chart: "bar"
      xLabel: "Q's probability on the true class (P = 0.9)"
      yLabel: "D_KL(P||Q) in bits"
      series:
        - name: "KL"
          points:
            - { x: 0.1, y: 2.5359 }
            - { x: 0.5, y: 0.531 }
            - { x: 0.8, y: 0.0529 }
            - { x: 0.9, y: 0.0 }
    - type: pipeline
      title: "How a cross-entropy loss is actually computed"
      nodes:
        - label: "Logits z"
          note: "raw scores, one per class"
          detail: "Unbounded real numbers. Nothing here is a probability yet, which is why numerically stable loss implementations take logits rather than probabilities."
        - label: "Log-softmax"
          note: "z - logsumexp(z)"
          detail: "Subtracting the max before exponentiating is what prevents overflow. Doing softmax then log is numerically worse — it can produce log(0) = -inf for a small probability."
        - label: "Gather the true class"
          note: "-log p[target]"
          detail: "Only one term of the sum matters per example, because the target is one-hot. This is why cross-entropy is cheap: O(K) not O(K²)."
        - label: "Average over the batch"
          note: "mean, not sum"
          detail: "Averaging makes the loss independent of batch size, which is required for a learning rate to transfer across batch sizes."
        - label: "Backward"
          note: "grad = (softmax(z) - onehot) / N"
          detail: "The clean gradient is the reason cross-entropy pairs with softmax. It is bounded in [-1, 1], so no gradient clipping is needed at the output layer."
    - type: mermaid
      title: "The relationship, in one picture"
      code: |
        flowchart LR
          P["True distribution P"] --> H["H(P)<br/>entropy<br/>0.469 bits"]
          P --> KL["D_KL(P||Q)<br/>your mistake<br/>0.531 bits"]
          Q["Model Q"] --> KL
          H --> CE["Cross-entropy<br/>0.469 + 0.531<br/>= 1.000 bits"]
          KL --> CE
          CE --> L["The number<br/>you minimise"]
    - type: stack
      title: "What a perplexity number is actually telling you"
      layers:
        - "Perplexity = 2^(cross-entropy in bits)"
        - "= the effective number of equally likely choices"
        - "Uniform over a 50,257-token vocabulary: 15.617 bits, perplexity 50,257"
        - "Perplexity 15.6 means the model is no better than uniform guessing"
        - "A useful LM is typically in the single digits to low tens"

  markdown: |
    ## The identity that explains everything

    $$H(P,Q) = H(P) + D_{KL}(P\|Q)$$

    Cross-entropy splits into two terms. The first depends only on the data. The
    second depends on how wrong your model is. **Only the second can be
    reduced by training.**

    Here is the identity verified numerically for $P = [0.9, 0.1]$:

    | Model $Q$ | $H(P)$ | $D_{KL}(P\|Q)$ | Cross-entropy | $H + D_{KL}$ |
    |---|---|---|---|---|
    | $[0.9, 0.1]$ — correct | 0.4690 | 0.0000 | 0.4690 | 0.4690 |
    | $[0.8, 0.2]$ | 0.4690 | 0.0529 | 0.5219 | 0.5219 |
    | $[0.5, 0.5]$ | 0.4690 | 0.5310 | 1.0000 | 1.0000 |
    | $[0.1, 0.9]$ — inverted | 0.4690 | 2.5359 | 3.0049 | 3.0049 |

    The fourth column always equals the fifth. That is not a coincidence or an
    approximation — it is what the definition means.

    Two consequences worth internalising:

    **Your loss has a floor, and it is not zero.** For 90/10 classes, a perfect
    model reports 0.469 bits forever. A team watching for the loss to approach
    zero will wait forever, and may "fix" a working model.

    **The gradient only cares about the KL part.** Since $H(P)$ has no
    parameters, $\nabla_\theta \text{CE} = \nabla_\theta D_{KL}$. Minimising
    cross-entropy *is* minimising KL divergence — which is why the two are used
    interchangeably in papers even though they are different quantities.

    ## Why KL is not a distance

    A distance must be symmetric. KL is not:

    $$D_{KL}([0.9,0.1] \,\|\, [0.5,0.5]) = 0.5310$$
    $$D_{KL}([0.5,0.5] \,\|\, [0.9,0.1]) = 0.7370$$

    Same two distributions, different answers. The asymmetry is not a bug — it
    encodes two genuinely different penalties.

    - **Forward KL, $D_{KL}(P\|Q)$**: infinite wherever $P > 0$ but $Q = 0$.
      So $Q$ must put mass *everywhere* $P$ does. This is **mode-covering**: a
      Gaussian fit to a bimodal $P$ will stretch to span both modes rather than
      pick one.
    - **Reverse KL, $D_{KL}(Q\|P)$**: infinite wherever $Q > 0$ but $P = 0$.
      So $Q$ must not put mass where $P$ has none. This is **mode-seeking**: the
      same fit will collapse onto a single mode.

    This is the entire practical difference between variational inference
    (reverse KL, tends to under-estimate uncertainty) and expectation
    propagation (forward KL, tends to over-estimate it).

    ## Label smoothing, and the infinite loss

    Standard cross-entropy with a one-hot target has $H(P) = 0$, so a perfect
    model reaches 0. Label smoothing replaces the target with

    $$p_i = \begin{cases} 1 - \epsilon + \epsilon/K & i = \text{target} \\ \epsilon/K & \text{otherwise} \end{cases}$$

    For $K = 10$, $\epsilon = 0.1$: the target entropy is now **0.7218 bits**
    instead of 0. And the consequences are larger than they look:

    | Model | Cross-entropy against the smoothed target |
    |---|---|
    | Uniform ($1/K$ everywhere) | 3.3219 bits |
    | Perfectly confident one-hot | **infinite** |

    The one-hot model assigns probability exactly 0 to the eight non-target
    classes, and $\log 0 = -\infty$. So smoothing does not merely raise the
    floor — it makes *extreme confidence actively catastrophic*. That is the
    mechanism by which it regularises: the model can no longer profit from
    pushing a logit to infinity.

    ## Perplexity, translated

    $$\text{perplexity} = 2^{\text{cross-entropy in bits}} = e^{\text{cross-entropy in nats}}$$

    | Cross-entropy (bits) | Perplexity | Reads as |
    |---|---|---|
    | 0.693 | 1.62 | nearly certain |
    | 1.0 | 2.00 | a coin flip |
    | 4.0 | 16.0 | one of 16 plausible tokens |
    | 8.0 | 256 | one of 256 |
    | 15.617 | 50,257 | uniform over a GPT-2 vocabulary — useless |

    The last row is the one to remember. A 50,257-token model that reports
    perplexity 15.6 has learned **nothing**; that is the score of a uniform
    distribution. The number only means something against that baseline.

    ## Where the analogy breaks

    "Entropy is the bits needed to encode" assumes you know $P$ exactly. In
    practice you have a finite sample, so your estimate of $H(P)$ is biased
    **downward** — with $n$ samples over $K$ categories, the plug-in entropy
    estimator is biased low by roughly $(K-1)/(2n \ln 2)$ bits. With $K = 1000$
    and $n = 1000$, that is a bias of about 0.72 bits, which is larger than most
    of the differences you are trying to measure.

    This is why reported perplexities on small evaluation sets are optimistic,
    and why the correction matters before you compare two models.

    ## The longer version

    The remaining mechanisms, verbatim: mutual information as dependence rather
    than correlation, maximum entropy, and the bits-versus-nats unit trap that
    produces silent factor-of-1.44 errors.

    ### Failure modes, in full

    - You will use `F.cross_entropy` a thousand times without knowing why it beats MSE on classification. When a model plateaus, or a loss goes to NaN, or label smoothing behaves strangely, the reason is information-theoretic.
    - Cross-entropy and KL divergence differ by a constant — $H(P)$ — so minimising one minimises the other. Knowing which is which tells you why the loss is **never zero** even for a perfect model: it bottoms out at the data's own entropy.
    - A perplexity of 15.6 looks meaningless until you know it means 'the model is as uncertain as a uniform choice over 50,257 tokens.' That single translation is what makes a language-model eval number interpretable.
    - KL divergence is not symmetric. Measured on the same pair: $D_{KL}(P\|Q) = 0.531$ but $D_{KL}(Q\|P) = 0.737$. Which direction you use determines whether your model is penalised for ignoring the truth or for inventing things — the difference between a mode-covering and a mode-seeking model.

    ### The mechanisms, in full

    - **Entropy is the floor on your loss, and it is set by the data, not the model.** For a Bernoulli with $p = 0.9$, $H = 0.469$ bits. At $p = 0.99$, $H = 0.0808$ bits. At $p = 1.0$, $H = 0$. Measured on a fair coin: exactly 1.0 bit. So a classifier on a task with 90/10 class balance cannot get below 0.469 bits of cross-entropy no matter how good it is — and if your loss plateaus there, the model is done, not broken.
    - **Cross-entropy = entropy + KL, exactly.** Measured for $P = [0.9, 0.1]$: $H(P) = 0.4690$; against $Q = [0.8, 0.2]$, $D_{KL} = 0.0529$ and cross-entropy $= 0.5219 = 0.4690 + 0.0529$. Against $Q = [0.5, 0.5]$: $D_{KL} = 0.5310$, cross-entropy $= 1.0000$. The identity is not approximate — it defines the relationship.
    - **Minimising cross-entropy and minimising KL are the same optimisation, which is why the loss never reaches zero.** Since $H(P)$ does not depend on the model parameters, $\nabla_\theta \text{CE} = \nabla_\theta D_{KL}$. The reported loss floors at $H(P)$ — 0.469 bits in the 90/10 case — and a team that expects it to approach 0 will spend a week chasing a bug that does not exist.
    - **KL is a divergence, not a distance, because it is asymmetric.** Measured: $D_{KL}([0.9,0.1] \| [0.5,0.5]) = 0.5310$ but $D_{KL}([0.5,0.5] \| [0.9,0.1]) = 0.7370$. Forward KL heavily penalises $Q$ placing near-zero mass where $P$ has mass (mode-covering); reverse KL heavily penalises $Q$ placing mass where $P$ has none (mode-seeking). This is the whole difference between VI and expectation propagation.
    - **Label smoothing makes the target's entropy non-zero, and that changes the loss floor.** With 10 classes and $\epsilon = 0.1$, the smoothed target has $H = 0.7218$ bits, up from 0. Against a perfectly confident one-hot model the cross-entropy is **infinite**, because $\log 0 = -\infty$. Against a uniform model it is 3.3219 bits. Smoothing is therefore not a small perturbation — it caps how confident the model can profitably become.
    - **Perplexity is just $2^{\text{cross-entropy}}$ in bits, and it is the effective vocabulary size.** Measured: CE 0.693 → 1.62, CE 1.0 → 2.00, CE 8.0 → 256. A uniform distribution over $k$ classes has $H = \log_2 k$ and perplexity exactly $k$ — for a 50,257-token vocabulary that is 15.617 bits. A model reporting perplexity 15.6 is no better than uniform guessing.
    - **MSE on classification is not merely slower, it is the wrong cost.** Cross-entropy's gradient with respect to the logits is $\hat{p} - p$, which is bounded and vanishes exactly when the prediction is right. MSE through a sigmoid introduces a factor $\sigma'(z) \le 0.25$, so gradients **vanish** precisely when the model is confidently wrong — the opposite of what you want.
    - **Mutual information measures dependence, not correlation, and it catches relationships Pearson cannot.** Measured on binned Gaussians: $\rho = 0 \Rightarrow \text{MI} = 0.0011$ bits, $\rho = 0.5 \Rightarrow 0.1843$, $\rho = 0.9 \Rightarrow 0.9443$, $\rho = 0.99 \Rightarrow 1.6749$. Unlike correlation it is zero if and only if the variables are independent, so it detects the $y = x^2$ case that correlation misses entirely.
    - **Entropy is maximised by the uniform distribution, given the support.** That single fact generates maximum-entropy modelling, why a softmax with temperature → ∞ converges to uniform, and why adding an entropy bonus to a policy-gradient loss encourages exploration. The bonus is literally paying the agent to keep its options open.
    - **Bits versus nats is a unit change, and losing track of it produces silent factor-of-1.44 errors.** $\log_2$ gives bits, $\ln$ gives nats, $1 \text{ nat} = 1/\ln 2 = 1.4427$ bits. PyTorch's `cross_entropy` uses nats. A perplexity computed as $e^{\text{loss}}$ on a nats loss is correct; $2^{\text{loss}}$ on the same loss is wrong by a factor of $\ln 2$.


  derivations:
    - title: "Cross-entropy = entropy + KL"
      latex: |
        $$H(P,Q) = -\\sum_i p_i \\log q_i$$
        Add and subtract $\\sum_i p_i \\log p_i$:
        $$H(P,Q) = -\\sum_i p_i \\log p_i + \\sum_i p_i \\log p_i - \\sum_i p_i \\log q_i$$
        $$= H(P) + \\sum_i p_i \\log \\frac{p_i}{q_i} = H(P) + D_{KL}(P\\|Q)$$
      prose: >-
        The cross-entropy of a model is the data's own entropy plus the price of
        the model being wrong. Since only the second term involves the
        parameters, gradient descent on cross-entropy is gradient descent on KL.
    - title: "KL divergence is non-negative (Gibbs' inequality)"
      latex: |
        $$D_{KL}(P\\|Q) = \\sum_i p_i \\log \\frac{p_i}{q_i} = -\\sum_i p_i \\log \\frac{q_i}{p_i} \\ge -\\log \\sum_i p_i \\frac{q_i}{p_i} = -\\log 1 = 0$$
        where the inequality is Jensen's, applied to the concave $\\log$.
      prose: >-
        The step that does the work is moving the expectation inside the log,
        which is only valid because log is concave. Equality holds exactly when
        q_i/p_i is constant, i.e. when P equals Q. This is also why
        cross-entropy is minimised by the true distribution: any other Q adds a
        non-negative penalty.
    - title: "The gradient of cross-entropy through softmax"
      latex: |
        With logits $z$, $\\hat{p} = \\operatorname{softmax}(z)$ and one-hot
        target $y$:
        $$L = -\\sum_i y_i \\log \\hat{p}_i$$
        $$\\frac{\\partial L}{\\partial z_j} = \\hat{p}_j - y_j$$
      prose: >-
        The softmax Jacobian and the log cancel almost completely, leaving the
        prediction minus the target. This is why the gradient is bounded in
        [-1, 1] regardless of how wrong the model is, and why softmax +
        cross-entropy is the numerically and optimisation-wise correct pairing.
    - title: "Why MSE through a sigmoid vanishes when confidently wrong"
      latex: |
        With $p = \\sigma(z)$ and target $y \\in \\{0,1\\}$:
        $$L_{\\text{MSE}} = \\tfrac12 (\\sigma(z) - y)^2$$
        $$\\frac{\\partial L}{\\partial z} = (\\sigma(z) - y)\\,\\sigma'(z) = (\\sigma(z)-y)\\,\\sigma(z)(1-\\sigma(z))$$
        As $z \\to -\\infty$ with $y = 1$ (confidently wrong), $\\sigma(z) \\to 0$,
        so $\\sigma'(z) \\to 0$ and the gradient vanishes.
      prose: >-
        The model is maximally wrong and receives no signal to correct itself.
        Cross-entropy has no such factor: its gradient is p - y = -1 in that
        same limit, the largest possible correction. This is the concrete reason
        MSE is the wrong loss for classification, beyond any argument about
        convexity.

  implementations:
    - language: python
      title: "Entropy, KL, and cross-entropy from definitions, numerically safe"
      note: >-
        Never compute `log(softmax(z))` directly — softmax can underflow to 0 and
        log(0) is -inf. Use log-softmax, which subtracts the max first. The
        `p > 0` masks matter: the convention is that 0 log 0 = 0, and including
        those terms produces nan instead.
      code: |
        import numpy as np

        def entropy_bits(p):
            """Shannon entropy in bits. 0 log 0 is defined as 0."""
            p = np.asarray(p, dtype=float)
            p = p[p > 0]
            return float(-(p * np.log2(p)).sum())

        def kl_bits(p, q):
            """D_KL(P||Q) in bits. Infinite if Q has a zero where P does not."""
            p = np.asarray(p, dtype=float)
            q = np.asarray(q, dtype=float)
            mask = p > 0
            if np.any(q[mask] <= 0):
                return float("inf")
            return float((p[mask] * np.log2(p[mask] / q[mask])).sum())

        def cross_entropy_bits(p, q):
            p = np.asarray(p, dtype=float)
            q = np.asarray(q, dtype=float)
            mask = p > 0
            if np.any(q[mask] <= 0):
                return float("inf")
            return float(-(p[mask] * np.log2(q[mask])).sum())

        def log_softmax(z):
            """Numerically stable log(softmax(z)).

            Subtracting the max prevents overflow in exp(). Doing
            np.log(softmax(z)) instead fails for very negative logits.
            """
            z = np.asarray(z, dtype=float)
            m = z.max(axis=-1, keepdims=True)
            return z - m - np.log(np.exp(z - m).sum(axis=-1, keepdims=True))

        def perplexity_from_bits(ce_bits):
            return float(2.0 ** ce_bits)

        def perplexity_from_nats(ce_nats):
            # PyTorch's cross_entropy returns NATS. Using 2** here is wrong by
            # a factor of ln 2.
            return float(np.exp(ce_nats))
    - language: python
      title: "Mutual information, which catches what correlation misses"
      note: >-
        This binned estimator is biased upward by the binning; more bins means
        more bias. It is fine for comparing dependence qualitatively, not for
        reporting an absolute number. A proper estimator uses k-nearest-
        neighbour distances (the Kraskov estimator).
      code: |
        import numpy as np

        def mutual_information_bits(x, y, bins=10):
            """Binned estimate of I(X;Y) in bits."""
            x = np.asarray(x, float)
            y = np.asarray(y, float)
            # Rank-based binning so bin choice does not depend on scale.
            xb = np.clip((np.argsort(np.argsort(x)) * bins // len(x)), 0, bins - 1)
            yb = np.clip((np.argsort(np.argsort(y)) * bins // len(y)), 0, bins - 1)
            joint = np.zeros((bins, bins))
            np.add.at(joint, (xb, yb), 1)
            joint /= joint.sum()
            px = joint.sum(axis=1, keepdims=True)
            py = joint.sum(axis=0, keepdims=True)
            with np.errstate(divide="ignore", invalid="ignore"):
                terms = np.where(joint > 0, joint * np.log2(joint / (px * py)), 0.0)
            return float(terms.sum())

        # y = x^2 is deterministically dependent but has correlation 0.
        # MI catches it; Pearson does not.
        # rng = np.random.default_rng(0)
        # x = rng.normal(size=20000); y = x**2
        # np.corrcoef(x, y)[0, 1]  ->  ~0.0
        # mutual_information_bits(x, y)  ->  clearly > 0

  checkpoints:
    - id: cp-1
      question: "A binary classifier on 90/10 data reports cross-entropy 0.469 bits and stops improving. Is the model broken?"
      answerKind: short_text
      hint: "What is the entropy of a Bernoulli with $p = 0.9$?"
      solution: >-
        No. $H(0.9) = 0.469$ bits, so the model has reached the theoretical
        floor set by the data's own entropy. Cross-entropy cannot go below
        $H(P)$ unless the task is deterministic. If you expected it to approach
        zero, you were expecting a perfect predictor on an inherently uncertain
        label — which no model can provide.
    - id: cp-2
      question: "Why is $D_{KL}(P\\|Q) \\ne D_{KL}(Q\\|P)$, and which direction produces a mode-seeking fit?"
      answerKind: short_text
      hint: "Which direction blows up when Q has a zero where P has mass?"
      solution: >-
        Forward KL penalises $Q = 0$ wherever $P > 0$, so $Q$ is forced to cover
        all of $P$'s mass — mode-covering. Reverse KL, $D_{KL}(Q\|P)$, penalises
        $Q > 0$ wherever $P = 0$, which allows $Q$ to ignore modes $P$ has and
        collapse onto a single one — mode-seeking. Measured on the same pair the
        two values were 0.5310 and 0.7370.
    - id: cp-3
      question: "With $K = 10$ and $\\epsilon = 0.1$, why can cross-entropy against a perfectly confident one-hot model be infinite?"
      answerKind: short_text
      hint: "What probability does a one-hot model assign to the eight non-target classes, and what is $\\log 0$?"
      solution: >-
        A one-hot model assigns exactly 0 to the non-target classes, while the
        smoothed target assigns $\\epsilon/K = 0.01$ to each. The loss includes
        $-0.01 \\log 0 = +\\infty$ for each of the eight. So label smoothing does
        not merely set a floor — it makes unbounded confidence catastrophically
        penalised, which is precisely how it regularises.
    - id: cp-4
      question: "Your language model reports perplexity 15.6 on a 50,257-token vocabulary. What does that tell you?"
      answerKind: short_text
      hint: "Convert perplexity back to bits and compare to $\\log_2 50257$."
      solution: >-
        $\\log_2 15.6 = 3.96$ bits. A uniform distribution over 50,257 tokens has
        $\\log_2 50257 = 15.617$ bits, i.e. perplexity 50,257. So a perplexity of
        15.6 corresponds to... careful: perplexity 15.6 is far BETTER than
        50,257. To read it as "uniform over $k$", it means the model is as
        uncertain as a uniform choice over about 16 options — a small effective
        candidate set out of 50,257. The baseline to compare against is 50,257,
        not 15.6; getting this backwards is a common and expensive misreading.
    - id: cp-5
      question: "Why does cross-entropy give a better gradient than MSE for a confidently wrong classification?"
      answerKind: short_text
      hint: "Compare the two gradients in the limit where the prediction is confidently wrong."
      solution: >-
        MSE through a sigmoid has gradient $(\\sigma(z)-y)\\sigma'(z)$, and
        $\\sigma'(z) = \\sigma(z)(1-\\sigma(z)) \\to 0$ when the model is
        confidently wrong — so the correction signal vanishes exactly when it is
        most needed. Cross-entropy's gradient with respect to the logits is
        $\\hat{p} - y$, which is $-1$ in that limit: the largest possible
        correction, bounded in $[-1, 1]$ everywhere.
    - id: cp-6
      question: "You compute perplexity as $2^{\\text{loss}}$ and get 4.1, but the paper reports 2.8. What went wrong?"
      answerKind: short_text
      hint: "What unit does PyTorch's `cross_entropy` return?"
      solution: >-
        PyTorch returns **nats**, not bits. $2^{2.8} = 6.96$ and $e^{2.8} = 16.4$,
        so if the paper's 2.8 is bits then $2^{2.8} = 6.96$; if you applied
        $2^{\\text{nats}}$ to a nats loss you inflated the result by
        $2^{\\text{ce}} / e^{\\text{ce}} = (2/e)^{\\text{ce}}$. Use
        $e^{\\text{loss}}$ for nats, $2^{\\text{loss}}$ for bits, and convert
        first with $1\\text{ nat} = 1.4427$ bits.

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Information theory prices uncertainty in bits. Entropy is the price of
        the data. Cross-entropy is the price of your model on that data. The gap
        between them is the price of being wrong, and it is the only part
        training can reduce.
      blocks:
        - kind: checklist
          body: |
            - Entropy H(P): bits needed to encode the truth
            - Cross-entropy H(P,Q): bits using your model's code
            - Gap D_KL(P||Q): the cost of your mistake, always >= 0
            - H(P,Q) = H(P) + D_KL exactly, not approximately
            - Only D_KL depends on the model, so only it can be optimised
      checkpoint: >-
        If the data is 90/10 and your model is perfect, what loss does it
        report? Why is it not zero?
    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Two separate questions. "How good is my model?" is answered by
        cross-entropy — or equivalently by KL, since they differ by a constant.
        "How uncertain is my data?" is answered by entropy alone, and it sets
        the floor you should compare against.
      blocks:
        - kind: checklist
          body: |
            - Measuring model quality → cross-entropy (or perplexity)
            - Measuring the irreducible floor → entropy of the label distribution
            - Measuring dependence between variables → mutual information
            - Choosing a divergence direction → forward for coverage, reverse for mode-seeking
      checkpoint: >-
        You have two models with cross-entropies 0.6 and 0.5 bits on a dataset
        whose label entropy is 0.45. Which is meaningfully better, and by how
        much in "excess bits"?
    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Everything follows from two sums, and both need the same numerical care:
        mask zero probabilities, and use log-softmax rather than log-of-softmax.
      blocks:
        - kind: pseudocode
          body: |
            entropy(p):
                return -sum(p_i * log2(p_i) for p_i > 0)

            cross_entropy(p, q):
                return -sum(p_i * log2(q_i) for p_i > 0)

            kl(p, q):
                return cross_entropy(p, q) - entropy(p)
                # equivalently sum(p_i * log2(p_i / q_i))

            # from logits, stably:
            log_softmax(z):
                m = max(z)
                return z - m - log(sum(exp(z - m)))
            ce_from_logits(z, target):
                return -log_softmax(z)[target]

            perplexity(loss_bits):   return 2 ** loss_bits
            perplexity(loss_nats):   return exp(loss_nats)
      checkpoint: >-
        Why does the KL implementation subtract entropy rather than summing the
        ratio directly? Both are valid — what does each form make obvious?
    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The two results worth being able to derive from memory are the split of
        cross-entropy and the gradient through softmax.
      blocks:
        - kind: math
          body: |
            **Split:**
            $$H(P,Q) = -\\sum_i p_i\\log q_i = -\\sum_i p_i\\log p_i + \\sum_i p_i\\log\\frac{p_i}{q_i} = H(P) + D_{KL}(P\\|Q)$$

            **Non-negativity (Gibbs):**
            $$D_{KL}(P\\|Q) = -\\sum_i p_i\\log\\frac{q_i}{p_i} \\ge -\\log\\sum_i p_i\\frac{q_i}{p_i} = -\\log 1 = 0$$
            (Jensen, using concavity of log.)

            **Gradient through softmax:**
            $$L = -\\sum_i y_i \\log\\hat p_i, \\quad \\hat p = \\mathrm{softmax}(z)$$
            $$\\frac{\\partial L}{\\partial z_j} = \\hat p_j - y_j$$

            **MSE vanishes when wrong:**
            $$\\frac{\\partial}{\\partial z}\\tfrac12(\\sigma(z)-y)^2 = (\\sigma(z)-y)\\,\\sigma(z)(1-\\sigma(z)) \\to 0$$
      checkpoint: >-
        In the Gibbs derivation, the inequality step requires log to be concave.
        What would the corresponding statement be for a convex function, and why
        does that make Jensen unusable here?
    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        A complete, numerically safe implementation with the reasoning for each
        guard.
      blocks:
        - kind: warning
          body: >-
            Attempt the implementation first. The two guards that matter —
            masking zero probabilities and using log-softmax — are exactly the
            ones people omit because they only fail on edge cases.
        - kind: code
          language: python
          body: |
            import numpy as np

            def entropy_bits(p):
                p = np.asarray(p, float)
                p = p[p > 0]                      # 0 log 0 := 0
                return float(-(p * np.log2(p)).sum())

            def kl_bits(p, q):
                p, q = np.asarray(p, float), np.asarray(q, float)
                m = p > 0
                if np.any(q[m] <= 0):
                    return float("inf")           # support mismatch
                return float((p[m] * np.log2(p[m] / q[m])).sum())

            def cross_entropy_bits(p, q):
                p, q = np.asarray(p, float), np.asarray(q, float)
                m = p > 0
                if np.any(q[m] <= 0):
                    return float("inf")
                return float(-(p[m] * np.log2(q[m])).sum())

            def log_softmax(z):
                z = np.asarray(z, float)
                m = z.max(axis=-1, keepdims=True)
                return z - m - np.log(np.exp(z - m).sum(axis=-1, keepdims=True))

            def ce_from_logits(z, target):
                return float(-log_softmax(z)[target])

            def perplexity(ce, unit="bits"):
                return float(2.0 ** ce if unit == "bits" else np.exp(ce))

            # Verification of the identity on real numbers:
            #   P = [0.9, 0.1], Q = [0.5, 0.5]
            #   entropy_bits(P)                 -> 0.4690
            #   kl_bits(P, Q)                   -> 0.5310
            #   cross_entropy_bits(P, Q)        -> 1.0000
            #   entropy + kl                    -> 1.0000   (identity holds exactly)
      checkpoint: >-
        The implementation returns `inf` for a support mismatch rather than a
        large finite number. Argue for and against that choice: which is more
        useful when debugging a training run?

  problems:
    - id: p-entropy
      title: "Shannon entropy in bits"
      difficulty: easy
      prompt: >-
        Implement `entropy_bits(p)` returning $-\\sum_i p_i \\log_2 p_i$ over the
        non-zero entries only (0 log 0 is 0 by convention). Return 0.0 for an
        empty sequence or one containing only zeros.
      starter: |
        import numpy as np

        def entropy_bits(p):
            # your implementation here
            pass
      language: python
      entry: entropy_bits
      testCases:
        - input: "[[0.5, 0.5]]"
          expected: "1.0"
          mode: json
          tolerance: 1e-9
        - input: "[[1.0, 0.0]]"
          expected: "0.0"
          mode: json
          tolerance: 1e-9
        - input: "[[0.25, 0.25, 0.25, 0.25]]"
          expected: "2.0"
          mode: json
          tolerance: 1e-9
        - input: "[[0.9, 0.1]]"
          expected: "0.4689955935892812"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def entropy_bits(p):
            p = np.asarray(p, dtype=float)
            p = p[p > 0]
            if p.size == 0:
                return 0.0
            return float(-(p * np.log2(p)).sum())
      solutionExplanation: >-
        Entropy is the expected surprise. A fair coin gives exactly 1 bit; a
        certain outcome gives 0; four equiprobable outcomes give exactly 2 bits.
        The `p > 0` mask implements the convention that 0 log 0 = 0, which is the
        correct limit (p log p -> 0 as p -> 0). Without it, a zero entry
        produces 0 * -inf = nan and poisons the sum.
      complexity: "O(n) time, O(n) space"
      tags: [entropy, information-theory]

    - id: p-kl
      title: "KL divergence in bits"
      difficulty: medium
      prompt: >-
        Implement `kl_bits(p, q)` returning $D_{KL}(P\|Q) = \\sum_i p_i \\log_2(p_i/q_i)$
        over indices where $p_i > 0$. Return `float('inf')` if any such index has
        $q_i \\le 0$ (the divergence is infinite when Q assigns no mass where P has some).
      starter: |
        import numpy as np

        def kl_bits(p, q):
            # your implementation here
            pass
      language: python
      entry: kl_bits
      testCases:
        - input: "[[0.9, 0.1], [0.9, 0.1]]"
          expected: "0.0"
          mode: json
          tolerance: 1e-9
        - input: "[[0.9, 0.1], [0.5, 0.5]]"
          expected: "0.5310044064107189"
          mode: json
          tolerance: 1e-9
        - input: "[[0.5, 0.5], [0.9, 0.1]]"
          expected: "0.7369655941662062"
          mode: json
          tolerance: 1e-9
        - input: "[[0.9, 0.1], [1.0, 0.0]]"
          expected: "Infinity"
          mode: json
          tolerance: 1e-9
      solution: |
        import numpy as np

        def kl_bits(p, q):
            p = np.asarray(p, dtype=float)
            q = np.asarray(q, dtype=float)
            mask = p > 0
            if np.any(q[mask] <= 0):
                return float("inf")
            return float((p[mask] * np.log2(p[mask] / q[mask])).sum())
      solutionExplanation: >-
        The third and fourth test cases are the point. Identical distributions
        give 0; and swapping the arguments changes the answer (0.5310 vs
        0.7370), which is exactly why KL is called a divergence and not a
        distance. The support-mismatch case returns infinity because
        log(p/0) diverges — representing that honestly as inf is better than
        returning a large finite number that looks like a normal result.
      complexity: "O(n) time, O(n) space"
      tags: [kl-divergence, information-theory]

    - id: p-perplexity
      title: "Perplexity from cross-entropy"
      difficulty: easy
      prompt: >-
        Implement `perplexity(ce, unit)`. When `unit` is `"bits"` return
        $2^{\\text{ce}}$; when `unit` is `"nats"` return $e^{\\text{ce}}$. Default
        the unit to `"bits"`.
      starter: |
        import math

        def perplexity(ce, unit="bits"):
            # your implementation here
            pass
      language: python
      entry: perplexity
      testCases:
        - input: "[1.0, \"bits\"]"
          expected: "2.0"
          mode: json
          tolerance: 1e-9
        - input: "[0.0, \"bits\"]"
          expected: "1.0"
          mode: json
          tolerance: 1e-9
        - input: "[1.0, \"nats\"]"
          expected: "2.718281828459045"
          mode: json
          tolerance: 1e-9
        - input: "[16.0, \"bits\"]"
          expected: "65536.0"
          mode: json
          tolerance: 1e-9
      solution: |
        import math

        def perplexity(ce, unit="bits"):
            ce = float(ce)
            if unit == "nats":
                return float(math.exp(ce))
            return float(2.0 ** ce)
      solutionExplanation: >-
        Perplexity is the exponential of the cross-entropy, with the base
        matching the log base used to compute it. The fourth case is the one
        worth remembering: log2(50257) = 15.617 bits, so a uniform distribution
        over a GPT-2 vocabulary has perplexity exactly 50,257. That is the
        baseline any language model must beat, and it is why a reported
        perplexity in the teens on such a vocabulary is not impressive on its
        own — the number only means something relative to 50,257.
      complexity: "O(1) time, O(1) space"
      tags: [perplexity, language-models]

  try_it: >-
    For $P = [0.9, 0.1]$ and $Q = [0.8, 0.2]$, compute $H(P)$, $D_{KL}(P\|Q)$ and
    the cross-entropy by hand and check that $0.5219 = 0.4690 + 0.0529$ holds to
    four decimals. Then repeat with $Q = [0.5, 0.5]$ and explain why the
    cross-entropy lands on exactly 1.0000 bit.
  interview_questions:
    - question: "Cross-entropy loss never reaches zero, even for a perfect model. Why not?"
      level: mid
      key_points:
        - "Cross-entropy decomposes exactly as $H(P) + D_{KL}(P\\|Q)$, so the minimum over $Q$ is $H(P)$ — the data's own entropy — not zero."
        - "For a 90/10 label distribution that floor is 0.469 bits; at 99/1 it is 0.0808 bits; only a deterministic label reaches zero."
        - "Since $H(P)$ does not depend on the parameters, $\\nabla_\\theta \\text{CE} = \\nabla_\\theta D_{KL}$ — minimising one minimises the other."
        - "Label smoothing raises the floor on purpose: with 10 classes and $\\epsilon = 0.1$ the target entropy is 0.7218 bits, so a run that 'should' reach zero cannot."
      follow_up: "Your loss sits below that floor. What are the two candidate explanations, and how do you tell them apart?"
    - question: "You suspect a nats-versus-bits bug in a language model's reported perplexity. How do you confirm it?"
      level: senior
      key_points:
        - "$\\log_2$ gives bits and $\\ln$ gives nats, with $1$ nat $= 1/\\ln 2 = 1.4427$ bits; PyTorch's `cross_entropy` returns nats."
        - "Perplexity is $e^{\\text{CE}}$ for a nats loss and $2^{\\text{CE}}$ for a bits loss; using the wrong base misreports by a factor of $2^{0.4427\\,\\text{CE}}$."
        - "The sanity anchor is a uniform distribution over $k$ classes: $H = \\log_2 k$ bits and perplexity exactly $k$, so a 50,257-token vocabulary gives 15.617 bits."
        - "The check that settles it: a trained model's perplexity must be below the vocabulary size, so a value above $k$ cannot be right in either unit."
      follow_up: "A model reports perplexity 12 on a 50,257-token vocabulary. Is that plausible, and what conversion would you apply?"
    - question: "Why is forward KL mode-covering and reverse KL mode-seeking?"
      level: mid
      key_points:
        - "$D_{KL}(P\\|Q)$ puts a large penalty where $P > 0$ and $Q \\approx 0$, so $Q$ must spread mass over every mode of $P$."
        - "$D_{KL}(Q\\|P)$ penalises $Q > 0$ where $P \\approx 0$, so $Q$ prefers to commit to a single mode rather than cover the gap between two."
        - "The asymmetry is measurable: $D_{KL}([0.9,0.1]\\|[0.5,0.5]) = 0.5310$ against $D_{KL}([0.5,0.5]\\|[0.9,0.1]) = 0.7370$."
        - "This is why maximum likelihood (forward KL to the empirical distribution) hedges across modes while variational inference with a unimodal $Q$ collapses onto one."
  common_mistakes:
    - "Reading a loss of 0.0 as a perfect model on labels with 0.469 bits of entropy — a floor that low means a leak or a `log(0)`, not accuracy."
    - "Computing perplexity as $2^{\\text{loss}}$ on a nats-valued cross-entropy, which silently changes the unit and understates the effective vocabulary."
    - "Assuming MSE through a sigmoid is merely slower than cross-entropy: the $\\sigma'(z) \\le 0.25$ factor kills the gradient exactly when the model is confidently wrong."
  further_reading:
    - label: "Cover & Thomas, Elements of Information Theory, Chapters 2 and 5"
    - label: "MacKay, Information Theory, Inference, and Learning Algorithms"
