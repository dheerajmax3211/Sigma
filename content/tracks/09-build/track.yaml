track:
  id: build
  slug: build
  title: "Build From Scratch"
  subtitle: "Six systems you implement yourself, with milestones that fail loudly"
  description: >-
    Reading about an algorithm and implementing it are different skills, and
    only one of them survives a live coding screen. Each project here starts
    from a working skeleton, states the milestone tests that must pass, and
    ends with a reference implementation you can compare against — including
    the parts that are easy to get subtly wrong.
  tier: 5
  color: "#f97316"
  sortOrder: 9
  outcomes:
    - "Implement multi-head attention, RMSNorm, and SwiGLU, and generate tokens autoregressively."
    - "Build a LoRA adapter and prove the low-rank update matches a full fine-tune on a toy task."
    - "Build a RAG pipeline with chunking, an IVF-PQ index, and cross-encoder reranking."
    - "Implement a paged KV cache with block tables and continuous batching."
    - "Build a tool-calling agent loop with retries, idempotency, and a deterministic evaluator."
    - "Implement DDIM and Euler flow-matching samplers with classifier-free guidance."
  topics: []
