  implementations:
    - language: python
      title: "Reference solution"
      note: >-
        The cache and the scheduler, in about 90 lines. Correct, with three
        deliberate simplifications. (1) `gather` concatenates the blocks before
        the einsum, so M2 is exactly 0.0; a real kernel reads block by block and
        the difference becomes float32 summation noise, not zero — do not use the
        equality as a correctness test for a fused kernel. (2) The decode step
        writes zero vectors because the model is out of scope; the scheduler, the
        allocator and the table are the subjects. (3) `reserve` allocates the
        whole prompt+generation up front, which is the conservative policy: it
        makes admission exact and costs at most one block of slack per sequence.
        A production scheduler reserves the prompt and grows the table during
        decode, with a preemption path for the case where the free list empties.
      code: |
        import numpy as np


        class PagedCache:
            """Blocks of `block` slots; each sequence has a table of physical ids."""

            def __init__(self, n_blocks, block=16, H=2, dh=32):
                self.block, self.H, self.dh = block, H, dh
                self.K = np.zeros((n_blocks, block, H, dh))
                self.V = np.zeros((n_blocks, block, H, dh))
                self.free = list(range(n_blocks))
                self.tables, self.lens = {}, {}

            def blocks_for(self, n):
                return -(-n // self.block)

            def reserve(self, seq, n):
                """Allocate the whole table up front: append-only, no growth surprises."""
                need = self.blocks_for(n)
                if seq in self.tables or len(self.free) < need:
                    return False
                self.tables[seq] = [self.free.pop(0) for _ in range(need)]
                self.lens[seq] = 0
                return True

            def append(self, seq, k, v):
                pos, tab = self.lens[seq], self.tables[seq]
                if pos // self.block >= len(tab):
                    raise MemoryError("block table exhausted")
                self.K[tab[pos // self.block], pos % self.block] = k
                self.V[tab[pos // self.block], pos % self.block] = v
                self.lens[seq] = pos + 1

            def gather(self, seq):
                tab, n = self.tables[seq], self.lens[seq]
                return (np.concatenate([self.K[b] for b in tab])[:n],
                        np.concatenate([self.V[b] for b in tab])[:n])

            def release(self, seq):
                self.free.extend(self.tables.pop(seq))
                self.lens.pop(seq)

            def attention(self, seq, q):
                K, V = self.gather(seq)
                s = np.einsum("thd,shd->hts", q, K) / np.sqrt(self.dh)
                s -= s.max(-1, keepdims=True)
                p = np.exp(s)
                p /= p.sum(-1, keepdims=True)
                return np.einsum("hts,shd->thd", p, V)


        def dense_attention(K, V, q, dh):
            s = np.einsum("thd,shd->hts", q, K) / np.sqrt(dh)
            s -= s.max(-1, keepdims=True)
            p = np.exp(s)
            p /= p.sum(-1, keepdims=True)
            return np.einsum("hts,shd->thd", p, V)


        class Scheduler:
            """Release, then admit, then decode: the order matters for M4."""

            def __init__(self, cache):
                self.cache, self.waiting, self.running, self.log = cache, [], {}, []

            def submit(self, seq, prompt, gen):
                self.waiting.append((seq, prompt, gen))

            def step(self):
                admitted, done = [], []
                for req in list(self.waiting):
                    seq, prompt, gen = req
                    if self.cache.reserve(seq, prompt + gen):
                        self.waiting.remove(req)
                        self.running[seq] = [0, gen]
                        admitted.append(seq)
                for seq, st in self.running.items():
                    c = self.cache
                    c.append(seq, np.zeros((c.H, c.dh)), np.zeros((c.H, c.dh)))
                    st[0] += 1
                    if st[0] >= st[1]:
                        done.append(seq)
                for seq in done:
                    self.cache.release(seq)
                    del self.running[seq]
                self.log.append((admitted, done, len(self.running), len(self.cache.free)))
                return admitted, done


        if __name__ == "__main__":
            rng = np.random.default_rng(0)
            c = PagedCache(8)
            c.reserve("a", 40)
            for _ in range(40):
                c.append("a", rng.normal(size=(2, 32)), rng.normal(size=(2, 32)))
            q = rng.normal(size=(40, 2, 32))
            K, V = c.gather("a")
            print("M1", c.tables["a"], len(c.tables["a"]) * 16)
            print("M2", np.abs(c.attention("a", q) - dense_attention(K, V, q, 32)).max())
            lens = np.random.default_rng(1).integers(1, 65, 500)
            res = np.ceil(lens / 16) * 16
            print("M3", res.sum(), (res.sum() - lens.sum()) / res.sum())
            s = Scheduler(PagedCache(8))
            s.submit("r0", 40, 3)
            s.submit("r1", 40, 5)
            s.submit("r2", 40, 4)
            for t in range(4):
                print("M4 step", t, s.step())

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Stop thinking of a sequence's cache as an array and start thinking of it
        as a list of pages plus a table. The table is the sequence; the pages are
        interchangeable. Once that is true, memory can be handed back in fixed
        units, and a scheduler can hand those units to a different request in the
        middle of a batch.
      blocks:
        - kind: checklist
          body: |
            - What is the unit of allocation, and who owns it?
            - Where is the logical-to-physical mapping stored, and in what order?
            - What happens to a block when its sequence finishes?
            - What has to be true for a new request to be admitted right now?
        - kind: warning
          body: >-
            "Paged" is not a kernel optimisation. If you cannot say which array
            holds the mapping and what its entries mean, the rest is guesswork.
      checkpoint: >-
        If a sequence of 40 tokens holds 3 blocks, how many of its 48 slots are
        carrying information, and where does the waste live?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Build the cache before the scheduler, and test it against a dense cache
        with exactly the same numbers. Then build the scheduler on top, with the
        step order release → admit → decode. The order is not stylistic: it is
        what lets a freed block be reused in the same step.
      blocks:
        - kind: checklist
          body: |
            - cache: free list, tables, lengths, K and V arrays.
            - append: write at `pos % block` in `table[pos // block]`.
            - gather: concatenate the table's blocks and slice to length.
            - attention: identically to the dense version.
            - scheduler: release finished, admit waiting while blocks allow, decode the rest.
        - kind: warning
          body: >-
            Test with a sequence that fills a block exactly and one that spills by
            a single token. Off-by-one errors at the boundary are the whole bug
            surface.
      checkpoint: >-
        Which milestone fails if admission runs before release, and why?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Two data structures and one loop. The cache is a free list plus a dict of
        tables; the scheduler is a while-loop over the step.
      blocks:
        - kind: pseudocode
          body: |
            reserve(seq, n):
                need = ceil(n / block)
                if free.count < need: return False
                table[seq] = [free.pop() for _ in range(need)]
                length[seq] = 0

            append(seq, k, v):
                pos = length[seq]; b = table[seq][pos // block]
                K[b, pos % block] = k; V[b, pos % block] = v
                length[seq] += 1

            step():
                for seq in finished: release(seq)
                for req in waiting:
                    if reserve(req): running.add(req)
                for seq in running:
                    append(seq, decode_one(seq))
                    if done(seq): finished.add(seq)
      checkpoint: >-
        Why is `release` before `admit` in `step`, and how would you detect the
        bug if it were not?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        The fragmentation bound is a ceiling function, and the concurrency bound
        is a floor. Both are one line, and both are checkable before you run
        anything.
      blocks:
        - kind: math
          body: |
            Reserved slots for length $L$ at block $B$:
            $R(L) = \lceil L/B \rceil B$, so waste
            $W(L) = R(L) - L = (B - L \bmod B) \bmod B \in [0, B-1]$.

            Over $n$ sequences: $\sum W_i \le n(B-1)$. At $B = 16$, $n = 500$:
            at most 7,500 slots, measured 3,918.

            Concurrency with $M$ blocks and $k$ blocks per request:
            $\lfloor M/k \rfloor$. At $M = 8$, $k = 3$: 2.

            KV bytes per token: $2 \cdot L_{layers} \cdot H_{kv} \cdot d_h \cdot \text{bytes}$.
            At 32 layers, 8 KV heads, $d_h = 128$, fp16:
            $2 \cdot 32 \cdot 8 \cdot 128 \cdot 2 = 131{,}072$ B = 128 KB.
      checkpoint: >-
        Which of the two bounds changes if sequences arrive with wildly different
        lengths, and which does not?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The reference cache and scheduler are below. Read the step order and the
        reservation policy first; those are the two decisions the rest of the
        code is built around.
      blocks:
        - kind: warning
          body: >-
            The test that catches the most bugs is a sequence that frees a block
            and a later sequence that reuses it. If the table is rebuilt in
            allocation order, the second sequence's attention silently reads the
            first sequence's positions.
      checkpoint: >-
        What is the smallest sequence that forces a block reuse, and what would
        you assert about its table?

  checkpoints:
    - id: cp-1
      question: >-
        A sequence of 200 tokens runs at block_size 16. How many blocks, how many
        wasted slots, and what is the waste fraction?
      answerKind: short_text
      hint: "200 = 12 × 16 + 8."
      solution: >-
        $\lceil 200/16 \rceil = 13$ blocks, 208 slots, 8 wasted — 8/208 = 3.85%.
        The waste is always the distance to the next multiple of 16, so it is
        highest for short sequences and negligible for long ones.
    - id: cp-2
      question: >-
        Why does paged attention give exactly the same output as dense attention
        in this implementation, while a real kernel gives 1e-6?
      answerKind: short_text
      hint: "What does the implementation do before the einsum?"
      solution: >-
        `gather` concatenates the blocks into a contiguous array and then runs
        the same einsum, so the operations and their order are identical and the
        result is bit-identical. A fused kernel accumulates over blocks in a
        different order and keeps a running max, so the floating-point summation
        order changes and the result differs at float32 rounding, about $10^{-6}$.
    - id: cp-3
      question: >-
        With 8 blocks and requests needing 3 each, a fourth request arrives while
        two are running. What are the scheduler's options, and which is correct?
      answerKind: short_text
      hint: "Two free blocks, three needed."
      solution: >-
        It can wait (leave the request queued until a block frees), preempt a
        running sequence (swap its KV out and admit the new one), or admit
        partially by growing the table during decode. Waiting is correct when
        latency is not critical; preemption is what a production scheduler does
        under memory pressure, at the cost of recomputation or a swap. Admitting
        without the blocks is not an option.
    - id: cp-4
      question: >-
        Why is the block table's size in bytes negligible, and what does that
        imply for choosing block size?
      answerKind: short_text
      hint: "4 bytes per block against 128 KB per token."
      solution: >-
        A table entry is 4 bytes and covers 16 tokens, so the table costs
        0.25 bytes per token against 131,072 bytes of KV. Block size is therefore
        chosen for fragmentation and kernel efficiency, not table size: smaller
        blocks reduce the expected waste $(B-1)/2$ but increase the number of
        gather operations and table entries. At 16, the table is 0.0002% of the
        KV footprint.

