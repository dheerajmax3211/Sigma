    Implement the cache, then run four experiments and record each number:
    `block_size` at 8, 16, 32 and 64 with the waste fraction and the block-table
    bytes; a 1-token sequence at each block size; three requests with generation
    lengths 1, 10 and 2 under static and continuous batching, counting idle slots;
    and a shared 100-token prefix across four sequences with refcounted blocks,
    measuring the bytes saved. The last one is the extension that turns this into
    a serving engine.
  interview_questions:
    - question: "What does PagedAttention actually solve, and what does it cost?"
      level: senior
      key_points:
        - "It replaces a contiguous per-request KV reservation with fixed-size blocks plus a per-sequence block table, eliminating external fragmentation and bounding internal waste to one block per sequence."
        - "The cost is one indirection per block in the attention kernel and a block-table-aware gather, plus 4 bytes per block for the table."
        - "It does not make the arithmetic faster; it makes the cache allocatable, which is what allows a larger batch and continuous batching."
        - "The memory numbers are the point: 128 KB per token for a 32-layer, 8-KV-head model, so a 4,096-token request is 512 MB and 40 requests do not fit."
      follow_up: "Why does the block table have to be append-only, and what breaks if you compact it?"
    - question: "Explain continuous batching. Why does static batching waste GPU time?"
      level: mid
      key_points:
        - "Static batching runs a fixed set of requests to completion, so a sequence that finishes early holds its KV slots and its batch position idle until the longest finishes."
        - "Continuous batching re-decides the batch every decode step: finished sequences leave and release blocks, waiting ones are admitted if the free list can cover them."
        - "The requirement is a paged cache, because a batch whose composition changes needs per-sequence memory that can be freed at block granularity."
        - "The gain is utilisation on mixed-length workloads; on a homogeneous saturated batch there is little to gain and some scheduler overhead to lose."
      follow_up: "What happens to a running sequence if the free list empties mid-decode, and what are the three options?"
    - question: "Your paged attention differs from the dense reference by 4e-3. Is that acceptable, and how do you find the cause?"
      level: mid
      key_points:
        - "No: a concatenating implementation should be bit-identical, and a fused kernel differs at float32 summation order, about 1e-6."
        - "Check the block table's logical order first — allocation order and write order diverge after the first reuse."
        - "Check the truncation to sequence length: gathering whole blocks without slicing to `lens[seq]` attends over stale slots from a previous sequence."
        - "Check the mask: a paged decode usually attends to all previous positions, so a mask built for a fresh prefill is wrong."
      follow_up: "How would you write a regression test that catches the stale-slot bug with a one-token sequence?"
    - question: "How would you extend this to share a prompt prefix across eight samples?"
      level: senior
      key_points:
        - "Refcount each physical block and let several block tables point at the same ids for the shared prefix."
        - "On append to a block with refcount > 1, copy it first (copy-on-write), decrement the old block's count, and write to the copy."
        - "Release decrements rather than frees, so the last sequence to drop a shared block returns it to the free list."
        - "The saving is the prompt's KV per extra sample: 2,000 tokens × 128 KB = 256 MB per copy avoided."
      follow_up: "What does copy-on-write do to the fragmentation bound, and why?"
  common_mistakes:
    - "Ordering the block table by allocation instead of by write order, so a reused block appears in the wrong position after the first free."
    - "Gathering whole blocks without truncating to the sequence length, so attention reads stale slots from a previous request."
    - "Growing the block table during decode without counting the growth in the admission test, then running out of blocks mid-step."
    - "Assuming a paged kernel must differ numerically from a dense one; the arithmetic is the same and only the summation order changes."
    - "Reserving `max_seq_len` per request and calling it paging, which keeps the 92.7% waste and adds the table."
