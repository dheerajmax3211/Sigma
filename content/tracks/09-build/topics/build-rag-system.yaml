    - label: "Karpukhin et al., Dense Passage Retrieval for Open-Domain Question Answering (EMNLP 2020)"
    - label: "Nogueira & Cho, Passage Re-ranking with BERT (2019)"
    - label: "Lewis et al., Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (NeurIPS 2020)"

  implementations:
    - language: python
      title: "Reference solution"
      note: >-
        The whole stack in about 90 lines, with one simplification worth naming:
        `rerank` is a lexical cross-encoder stand-in — IDF-weighted token overlap
        — rather than a transformer. That is deliberate, because the milestone is
        about the *shape* of the two-stage design, and a real cross-encoder would
        hide the recall arithmetic behind a model download. Two numerical notes:
        `pq_lut` drops the $\|q\|^2$ term because it is common to every candidate
        and cannot change a ranking, and `search` re-scores the 50-candidate pool
        with exact dot products, which is why its recall is 0.99 rather than the
        0.7 a pure-PQ ranking would give. k-means is eight iterations of Lloyd's
        algorithm from a random sample; on 2,000 points that is enough, and on
        10M you would use a mini-batch variant or the Faiss implementation.
      code: |
        import numpy as np


        def chunk(tokens, size=200, overlap=50):
            """Starts every size-overlap tokens; the final chunk may be short."""
            return [tokens[s:s + size] for s in range(0, max(len(tokens) - overlap, 1), size - overlap)]


        def nn(X, C):
            """Nearest centroid per row: one GEMM, no Python loop over points."""
            return ((X * X).sum(1)[:, None] - 2 * X @ C.T + (C * C).sum(1)).argmin(1)


        def kmeans(X, k, iters=8, seed=0):
            C = X[np.random.default_rng(seed).choice(len(X), k, replace=False)].copy()
            for _ in range(iters):
                a = nn(X, C)
                C = np.array([X[a == j].mean(0) if (a == j).any() else C[j] for j in range(k)])
            return C


        def train_pq(X, m=8, nbits=8, seed=0):
            """m codebooks of 2^nbits centroids, one per d/m-dimensional subspace."""
            sub = X.shape[1] // m
            return [kmeans(X[:, i * sub:(i + 1) * sub], 2 ** nbits, seed=seed + i) for i in range(m)]


        def pq_encode(X, cents):
            sub = X.shape[1] // len(cents)
            return np.stack([nn(X[:, i * sub:(i + 1) * sub], C) for i, C in enumerate(cents)], 1).astype(np.uint8)


        def pq_lut(q, cents):
            """(m, 2^nbits) of ||c||^2 - 2 q.c; the ||q||^2 term is common, so dropped."""
            sub = len(q) // len(cents)
            return np.stack([(C * C).sum(1) - 2 * C @ q[i * sub:(i + 1) * sub] for i, C in enumerate(cents)])


        def index_bytes(n, m=8, d=128, nbits=8, nlist=64):
            """Codes + 4-byte ids + PQ codebooks + coarse centroids, in bytes."""
            return n * (m + 4) + (2 ** nbits) * m * (d // m) * 4 + nlist * d * 4


        class IVF:
            def __init__(self, X, nlist=64, m=8, nbits=8, seed=0):
                self.X, self.m, self.nlist = X, m, nlist
                self.C = kmeans(X, nlist, seed=seed)
                self.assign = nn(X, self.C)
                self.cents = train_pq(X, m, nbits, seed + 1)
                self.codes = pq_encode(X, self.cents)

            def search(self, q, k=10, nprobe=8, pool=50):
                cells = np.argsort((self.C * self.C).sum(1) - 2 * self.C @ q)[:nprobe]
                cand = np.where(np.isin(self.assign, cells))[0]
                L = pq_lut(q, self.cents)
                approx = L[np.arange(self.m)[None, :], self.codes[cand]].sum(1)
                short = cand[np.argsort(approx)[:pool]]
                return short[np.argsort(-(self.X[short] @ q))][:k], len(cand)


        def rerank(q_tokens, cand, doc_sets, idf, k=10):
            """Cross-encoder stand-in: reads the pair, so a rare shared token wins."""
            score = np.array([sum(idf[t] for t in q_tokens if t in doc_sets[c]) for c in cand])
            return cand[np.argsort(-score)[:k]]


        def corpus(n=2000, ncl=40, d=128, vocab=2600, seed=0):
            rng = np.random.default_rng(seed)
            topic, serial = rng.integers(0, 500, (ncl, 8)), 600 + np.arange(n)
            E = rng.normal(size=(vocab, d))
            E /= np.linalg.norm(E, axis=1, keepdims=True)
            cl = rng.integers(0, ncl, n)
            docs = [np.concatenate([rng.choice(topic[cl[i]], 55), rng.integers(0, 500, 5), [serial[i]]]) for i in range(n)]
            emb = lambda t: (lambda v: v / np.linalg.norm(v))(E[np.unique(t)].mean(0))
            return np.array([emb(t) for t in docs]), docs, E, topic, cl, serial, emb


        if __name__ == "__main__":
            X, docs, E, topic, cl, serial, emb = corpus()
            ix, sets = IVF(X), [set(d.tolist()) for d in docs]
            df = np.zeros(E.shape[0])
            for s in sets:
                df[list(s)] += 1
            idf, rng = np.log(len(docs) / (1 + df)), np.random.default_rng(5)
            ann, bi, pool, re = [], [], [], []
            for _ in range(100):
                i = rng.integers(len(docs))
                q = np.concatenate([rng.choice(topic[cl[i]], 30), rng.integers(0, 500, 3), [serial[i]]])
                qv = emb(q)
                truth = set(np.argsort(-(X @ qv))[:10].tolist())
                got, _ = ix.search(qv)
                ann.append(len(set(got.tolist()) & truth) / 10)
                order = np.argsort(-(X @ qv))
                bi.append(int(i in order[:10]))
                pool.append(int(i in order[:50]))
                re.append(int(i in rerank(set(q.tolist()), order[:50], sets, idf)))
            print(f"ann {np.mean(ann):.3f}  bi {np.mean(bi):.3f}  pool {np.mean(pool):.3f}  rerank {np.mean(re):.3f}")
            print(f"bytes {index_bytes(2000)}  ratio {2000 * 128 * 4 / index_bytes(2000):.2f}")

  hints:
    - tier: 1
      key: concept
      title: "Concept"
      content: >-
        Retrieval is a funnel, and every stage has a recall number. Chunking
        decides what can be found at all; the index decides what is cheap to
        find; the reranker decides what wins. If the answer is not in the pool,
        the reranker never sees it, so measure the pool before you tune anything
        downstream.
      blocks:
        - kind: checklist
          body: |
            - What unit is a chunk measured in, and what is the stride?
            - What is the candidate pool, and how is it produced?
            - Which stage reads the query and the document together?
            - Which number would you report to prove the index works?
        - kind: warning
          body: >-
            A RAG demo that answers three questions proves nothing. The corpus
            needs a known gold chunk per query before any of these numbers exist.
      checkpoint: >-
        If the reranker is perfect and the pool recall is 0.6, what is the
        end-to-end recall ceiling?

    - tier: 2
      key: direction
      title: "Direction"
      content: >-
        Build the funnel bottom-up and measure each stage in isolation: chunk
        arithmetic first, then exact search (the oracle), then the approximate
        index against it, then the reranker against the pool. Every comparison is
        against the stage immediately upstream, never against the final answer.
      blocks:
        - kind: checklist
          body: |
            - chunk: count, lengths, and the exact overlap between neighbours.
            - exact search: brute-force dot products, the ground truth for recall.
            - IVF: nprobe cells, candidate count, recall against exact.
            - PQ: bytes, and the ADC score against the exact score.
            - rerank: pool recall first, then rerank recall.
        - kind: warning
          body: >-
            Recall@10 against exact search is not the same as answer accuracy.
            Keep the two separate or you will tune the embedder when the
            chunker is at fault.
      checkpoint: >-
        Which stage's recall can you measure without any labels at all?

    - tier: 3
      key: pseudocode
      title: "Pseudocode"
      content: >-
        Two passes: one builds the index, one answers a query. The query pass is
        four lines, and every line is a different recall budget.
      blocks:
        - kind: pseudocode
          body: |
            # build
            for each document: chunks = window(tokens, size, stride=size-overlap)
            X = [embed(c) for c in chunks]
            coarse = kmeans(X, nlist); assign = nearest(coarse, X)
            books  = [kmeans(X[:, i*sub:(i+1)*sub], 256) for i in range(m)]
            codes  = [nearest(books[i], X_sub_i) for i in range(m)]

            # query
            cells = argsort(distance(q, coarse))[:nprobe]
            cand  = vectors whose assign is in cells
            lut   = [[||c||^2 - 2 q_i.c for c in books[i]] for i in range(m)]
            approx = sum(lut[i][codes[cand, i]] for i in range(m))
            pool  = cand[argsort(approx)[:50]]
            final = rerank(q_tokens, pool, docs)[:10]
      checkpoint: >-
        Why is the lookup table computed per query rather than per vector?

    - tier: 4
      key: derivation
      title: "Derivation"
      content: >-
        Three formulas cover the whole design: the chunk count, the byte count,
        and the expected recall of a random retriever.
      blocks:
        - kind: math
          body: |
            Chunks for $n$ tokens: starts at $0, s, 2s, \dots$ with
            $s = \text{size} - \text{overlap}$, so
            $n_{chunks} = \lceil (n - \text{overlap})/s \rceil$. For $n = 1000$,
            size 200, overlap 50: $\lceil 950/150 \rceil = 7$.

            Bytes: $N(m+4) + 2^{b} m (d/m) 4 + n_{list} d \cdot 4$. At
            $N=2000, m=8, d=128, b=8, n_{list}=64$ that is
            $24{,}000 + 131{,}072 + 32{,}768 = 187{,}840$.

            Random recall@k: expected overlap between a fixed truth set of size
            $k$ and a random draw of size $k$ from $N$ is $k^2/N$, so
            $k^2/(kN) = k/N = 10/2000 = 0.005$.
      checkpoint: >-
        At what $N$ do the PQ codes overtake the codebooks in bytes, and why
        does that number not depend on $d$?

    - tier: 5
      key: solution
      title: "Full Solution"
      content: >-
        The reference implementation is below. It is the whole funnel, plus a
        synthetic corpus so every number in the milestones can be reproduced.
      blocks:
        - kind: warning
          body: >-
            The bug that costs the most time is not in the index: it is computing
            the query embedding with a different normalisation than the corpus.
            Assert `np.linalg.norm(q) == 1` at the query boundary.
      checkpoint: >-
        Which single line would you delete to turn this into a pure-PQ retriever,
        and how much recall would you lose?

  checkpoints:
    - id: cp-1
      question: >-
        A 4,000-token document is chunked at size 200 with overlap 50. How many
        chunks, and how many tokens are stored?
      answerKind: short_text
      hint: "Stride is 150; the last chunk may be short."
      solution: >-
        $\lceil (4000-50)/150 \rceil = \lceil 26.33 \rceil = 27$ chunks. The
        stored token count is $26 \times 200 + 1 \times 50 = 5{,}250$ (the last
        chunk is 50 tokens), a 1.31× factor, approaching the asymptotic
        $200/150 = 1.33$.
    - id: cp-2
      question: >-
        Why is the PQ compression ratio 5.45× at 2,000 vectors when the codes
        themselves are 64× smaller?
      answerKind: short_text
      hint: "Add the codebooks and the coarse centroids to the numerator and denominator."
      solution: >-
        The codes are 24,000 bytes against 1,024,000 raw, but the index also
        stores 131,072 bytes of PQ codebooks and 32,768 bytes of coarse
        centroids, so the total is 187,840 and the ratio is 5.45×. The codebooks
        are a fixed cost: at 10M vectors, the index is 120 MB of codes plus 164
        KB of tables, and the ratio approaches the asymptotic 64×.
    - id: cp-3
      question: >-
        Your reranker improves nDCG@10 from 0.61 to 0.78 but answer accuracy is
        unchanged. What are the two most likely explanations?
      answerKind: short_text
      hint: "One is about the generator, one is about which documents matter."
      solution: >-
        Either the generator was already answering correctly from the documents
        it had (nDCG measures order, accuracy measures whether the answer is
        present at all), or the questions that fail do so because the gold
        document is not in the pool, so reordering the pool cannot help. Check
        pool recall and the fraction of failures where the answer is absent from
        the top 10 entirely.
    - id: cp-4
      question: >-
        nprobe=8 scans 318 of 2,000 vectors. Why 318 and not 250?
      answerKind: short_text
      hint: "How are vectors distributed across IVF cells?"
      solution: >-
        $8/64 = 12.5\%$ of 2,000 is 250, but IVF cells follow the data
        distribution: the synthetic corpus has 40 dense clusters mapped onto 64
        cells, so the eight nearest cells to a query are above-average size.
        The expected count is $N \sum_{c \in \text{probed}} n_c/N$, which is not
        $N \cdot n_{probe}/n_{list}$ unless the cells are equal-sized.

