id: score-based-matching
slug: score-based-matching
title: "Score-Based Matching and SDEs"
summary: >-
  A score model learns the gradient of the log-density, so the partition function
  cancels out of the objective and out of the network's job. That one vector field
  gives you denoising score matching (a regression on the noise you already
  predict), Tweedie's denoiser, Anderson's reverse SDE (whose Euler step is
  DDPM), and the probability-flow ODE (whose first-order integrator is DDIM).
kind: lesson
difficulty: hard
position: 4
estMinutes: 29
prerequisites: [diffusion-models, matrix-calculus]
phase: vision-foundations
tags:
  - score-matching
  - score-function
  - sde
  - probability-flow-ode
  - tweedie
  - denoising-score-matching
  - langevin
  - likelihood
  - ddim
  - sampler

body:
  big_idea: >-
    A diffusion model learns the gradient of the log-density, not the density:
    the normaliser becomes irrelevant, the sampler is a choice of integrator,
    and noise prediction is score matching in other units.

  problem:
    - >-
      You inherit a noise-predicting checkpoint and a paper written in scores,
      with the opposite sign and an unexplained square root.
    - >-
      Your normaliser is an integral over 12,288 dimensions, and "the gradient
      kills the partition function" moves the difficulty into a Jacobian trace
      you cannot afford.
    - >-
      You want to condition on an inpainting mask and every recipe says "add a
      term to the score", without saying why addition is right.

  analogy: |
    A hiker in fog with an altimeter that reads slope and nothing else. At
    every point they feel which way is uphill in probability and how steep,
    which is enough to walk to a summit — no map, no idea how many summits
    exist, no idea how tall. Sampling is that walk backwards, with a shove at
    every step so the hiker does not wedge against a wall.

  concept_points:
    - >-
      **The score is a vector field, and the partition function is a constant as far as it is concerned.**
      With $p = \tilde p/Z$ and $Z$ free of $x$,
      $\nabla\log p = \nabla\log\tilde p$. Scaling the density by $10^{-30}$
      moves $\log p$ by **-69.078** and leaves all 12,288 derivatives fixed.
      But the field's scale is not free: for a Gaussian
      $s = \Sigma^{-1}(x-\mu)$ gives **-100** at $\sigma = 0.01$.
    - >-
      **Deleting $Z$ does not make the objective computable, because the gradient of a density you cannot evaluate is still a density you cannot evaluate.**
      Hyvärinen's integration by parts gives
      $\mathbb{E}_p[\tfrac12\|s_\theta\|^2 + \operatorname{tr}\nabla_x s_\theta]$
      — no $Z$, but a trace over a $12{,}288 \times 12{,}288$ Jacobian. A
      Hutchinson estimator has relative standard deviation $\sqrt{2/d}$:
      measured **1.272%** at $d = 12{,}288$ against 1.276% predicted, and
      every probe is another backward pass.
    - >-
      **Denoising score matching replaces the trace with a regression whose target you can write down in one line.**
      Conditioning on a clean $x_0$, the kernel's score is
      $-(x_t-\sqrt{\bar\alpha_t}x_0)/(1-\bar\alpha_t)$ — no $\theta$ in it, no
      network needed. Regressing on it is exact:
      $\mathbb{E}_{q(x_t\mid x_0)}[\nabla\log q(x_t\mid x_0)\mid x_t] = \nabla\log p_t(x_t)$,
      checked by quadrature on a two-mode mixture over 1001 grid points to
      **$3.3\times10^{-6}$**. One target, zero extra backward passes.
    - >-
      **The VP kernel turns the conversion into a square root: $\epsilon_\theta = -\sqrt{1-\bar\alpha_t}\,s_\theta$.**
      With $x_t = \sqrt{\bar\alpha_t}x_0 + \sqrt{1-\bar\alpha_t}\epsilon$ the
      conditional score is $-\epsilon/\sqrt{1-\bar\alpha_t}$, so the score
      target is the noise target divided by $\sigma_t$. At $t=1$ that divisor
      is **0.010000** and the score target's standard deviation is **100.0**;
      at $t=1000$ it is 0.999980 and 1.0000 — a 100x spread in the units the
      network emits.
    - >-
      **The two losses are one loss under a per-timestep weight, and that weight is the whole design space.**
      Pointwise,
      $\|\epsilon-\epsilon_\theta\|^2 = (1-\bar\alpha_t)\|s-s_\theta\|^2$, so
      plain noise MSE *is* denoising score matching with weight
      $(1-\bar\alpha_t)$: **$1.000\times10^{-4}$** at $t=1$ to **0.999960** at
      $t=1000$. Over the linear schedule that weight sums to **724.49** rather
      than 1000, and the first hundred steps carry 3.704 against the last
      hundred's 99.988 — a 27.0x asymmetry.
    - >-
      **Scores add, which is why conditioning is one line and why guidance works at all.**
      $\nabla\log p(x\mid y) = \nabla\log p(x) + \nabla\log p(y\mid x)$; for a
      linear Gaussian measurement $y = Ax + \sigma_n n$ the second term is
      $\frac{1}{\sigma_n^2}A^\top(y-Ax)$ — no classifier, no retraining.
      Measured with $\sigma_n = 0.05$, that term's magnitude is **480.0**
      where the prior's whole score is 0.745: a 645x ratio.

  definitions:
    - term: "Score function"
      meaning: >-
        $s(x) = \nabla_x \log p(x)$, the gradient of the log-density with respect
        to the state. It is a vector field of the same shape as $x$, it is
        undefined where $p = 0$, and it is invariant to any constant rescaling of
        $p$ because the gradient kills the normaliser.
    - term: "Explicit score matching"
      meaning: >-
        Hyvärinen's objective $\mathbb{E}_p[\tfrac12\|s_\theta\|^2 +
        \operatorname{tr}\nabla_x s_\theta]$, which removes the partition function
        by integrating by parts but replaces it with the trace of the network's
        Jacobian — $d$ numbers per example, estimated by Hutchinson probes.
    - term: "Denoising score matching"
      meaning: >-
        The objective $\mathbb{E}_{x_0}\mathbb{E}_{q(x_t\mid x_0)}
        \|s_\theta(x_t,t) - \nabla_{x_t}\log q(x_t\mid x_0)\|^2$. It needs no
        trace and no normaliser, its target is closed-form for a Gaussian kernel,
        and it has the same minimiser as explicit score matching because the two
        differ by a constant that contains no parameters.
    - term: "Tweedie's formula"
      meaning: >-
        $\mathbb{E}[x_0\mid x_t] = (x_t + \sigma_t^2\,\nabla\log p_t)/\sqrt{\bar\alpha_t}$,
        with $\sigma_t^2 = 1-\bar\alpha_t$. It converts a score into the
        minimum-mean-squared-error denoised estimate, which is the identity that
        makes "the network predicts noise" and "the network is a denoiser" the
        same statement.
    - term: "Partition function"
      meaning: >-
        $Z = \int \tilde p(x)\,dx$, the normaliser. It is the reason maximum
        likelihood is intractable for an unnormalised model, and it is exactly
        what the score deletes: $\nabla\log p = \nabla\log\tilde p$ pointwise,
        with no integration anywhere.
    - term: "VP-SDE"
      meaning: >-
        The variance-preserving forward process $dx = -\tfrac12\beta(t)x\,dt +
        \sqrt{\beta(t)}\,dw$ on $t\in[0,1]$. Its marginals are
        $\mathcal{N}(\sqrt{\bar\alpha_t}x_0, (1-\bar\alpha_t)I)$ with
        $\bar\alpha_t = e^{-\int_0^t\beta}$, which is the continuous limit of the
        discrete schedule from *Diffusion Models*.
    - term: "Reverse-time SDE"
      meaning: >-
        Anderson's time reversal, $dx = [f - g^2\nabla\log p_t]\,dt +
        g\,d\bar w$, run with a negative time step. It has the same marginals as
        the forward process, traversed in the opposite direction, and it is the
        object DDPM's ancestor sampler discretises.
    - term: "Probability-flow ODE"
      meaning: >-
        $\frac{dx}{dt} = f - \tfrac12 g^2\nabla\log p_t$. Same marginals, no
        noise, deterministic and invertible map. It is what DDIM integrates, and
        it is the only one of the two that supports exact likelihoods via the
        instantaneous change of variables.
    - term: "NFE"
      meaning: >-
        Number of function evaluations — how many times the network is called to
        produce one sample. The honest unit for comparing samplers, because a
        Heun step costs two calls and an Euler step costs one; a 20-step Heun
        sampler and a 40-step Euler sampler are the only fair comparison.
    - term: "Predictor-corrector"
      meaning: >-
        A sampler that alternates one step of a numerical SDE or ODE solver (the
        predictor) with one or more Langevin steps at fixed $t$ (the corrector),
        $x \leftarrow x + \epsilon s_\theta(x,t) + \sqrt{2\epsilon}\,z$. The
        corrector pulls the sample back onto the correct marginal, and it has its
        own step-size bias: stationary variance
        $2\epsilon/(1-(1-\epsilon/v)^2)$, which is $+3.16\%$ in standard deviation
        at $\epsilon = 0.5$ and $v = 4$.

