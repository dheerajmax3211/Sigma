    - type: compare
      title: "Reverse SDE or probability-flow ODE: same marginals, different price"
      left_label: "Reverse-time SDE"
      left_points:
        - "Drift 0.5 b x + b s: the score term carries the full g^2"
        - "Fresh noise every step, so two runs from the same start differ"
        - "Euler-Maruyama at 10 steps is 4.019% high in std; 0.410% at 100"
        - "Its discretisation error is random and partly self-correcting, which is why correctors help"
        - "Correct the drift error with Langevin steps at fixed t, at the cost of one call each"
        - "No likelihood: the map is not invertible"
      right_label: "Probability-flow ODE"
      right_points:
