        - "Euler at 10 steps is 4.593% low in std; Heun at 20 calls is 0.971% low"
        - "Error is a smooth bias, so a higher-order solver attacks it directly"
        - "Integrates with any ODE solver: Euler, Heun, RK45, all reusing one score network"
