track:
  id: vision
  slug: vision
  title: "Vision and Multimodal Models"
  subtitle: "Patches, priors, and the cost of looking at every pixel twice"
  description: >-
    How images became tokens. The track starts by cutting a picture into
    patches and showing that the patch embedding is a strided convolution, then
    follows the consequences: a positional table that carries the entire
    spatial prior, an attention matrix that grows with the square of the token
    count, and a model whose accuracy depends on pretraining scale rather than
    on architecture. From there: contrastive pretraining, diffusion, and the
    fusion architectures that put text and pixels in one sequence.
  tier: 4
  color: "#f59e0b"
  sortOrder: 5
  outcomes:
    - "Cut an image into patches, embed them with a single shared matrix, and show that the result is identical to a convolution with stride equal to the kernel."
    - "Price a vision transformer in tokens rather than pixels, and say at which resolution the attention matrix stops being a rounding error."
    - "Explain what the missing locality prior costs, with the measured data-efficiency gap between convolutional and patch-based models."
    - "Choose between a class token and pooled readout, and between absolute and interpolated position, on structural grounds rather than fashion."
    - "Read a vision or multimodal paper and identify which prior it added back, and what it paid for it."
  topics: []
