# Outline for the 8-week AI Software Engineer path. Input to scripts/generate-deck.ts.
# status: done = hand-written gold deck. Everything else is a draft target.
# ideas = the three things the learner must be able to say afterwards.
# hands_on = the lab/action the deck must contain (something to drag or run).
- { id: numbers-and-functions, week: 1, title: Numbers, functions and graphs, status: done,
    goal: Read f(x) and a graph without fear,
    ideas: [a function is a machine with an input and an output, a graph is every input paired with its output, the symbols f x y and the parentheses mean],
    hands_on: curve lab with a slider for x and a live y, formula: "y = m x + b" }
- { id: vectors-and-dot-product, week: 1, title: Vectors and the dot product, status: done }
- { id: matrices-as-machines, week: 1, title: Matrices as machines, status: done,
    goal: Multiply a matrix by a vector and know why,
    ideas: [a matrix turns one vector into another, each output is a dot product of a row with the input, a layer of a neural net is exactly this],
    hands_on: vectors lab where sliders edit a 2x2 matrix and the output arrow moves, formula: "y = W x" }
- { id: probability-basics, week: 1, title: Probability in plain words, status: done,
    goal: Compute a probability and read P(A|B),
    ideas: [probability is a number from 0 to 1, conditional means given that we know, models output probabilities over choices],
    hands_on: bars lab of outcome counts with sliders, formula: "P(A|B) = P(A and B) / P(B)" }
- { id: mean-variance-normal, week: 1, title: Mean, spread and the bell curve, status: done,
    goal: Summarise data with mean and standard deviation,
    ideas: [mean is the balance point, standard deviation is typical distance from it, normalising data puts features on one scale],
    hands_on: curve lab of a bell curve with mean and spread sliders, formula: "z = (x - mu) / sigma" }
- { id: python-for-ml-basics, week: 1, title: Python you need for ML, status: done,
    goal: Read and write 20 lines of Python,
    ideas: [variables lists and dicts, loops and functions, comprehension and f-strings],
    hands_on: code cards plus a flow view of one script running, formula: none (use reveal-free code cards and one check) }
- { id: numpy-arrays, week: 1, title: NumPy arrays and shapes, status: done,
    goal: Predict the shape of a NumPy result,
    ideas: [an array is a grid of numbers with a shape, operations apply to every element at once, broadcasting stretches a small array to fit],
    hands_on: bars lab showing elementwise ops, code card, formula: "shape (n, m) @ (m, k) = (n, k)" }

- { id: pandas-basics, week: 2, title: "pandas for data work", status: done }
- { id: git-and-terminal, week: 2, title: Git and the terminal, status: done,
    goal: Commit, branch and push without fear,
    ideas: [a commit is a saved snapshot, a branch is a movable label, push and pull sync with a remote],
    hands_on: flow view of add commit push with a stage slider, code cards of the 8 commands you use daily }
- { id: pytest-and-ci, week: 2, title: "Tests and continuous integration", status: done }
- { id: http-and-rest, week: 2, title: HTTP and REST APIs, status: done,
    goal: Read a request and response and design an endpoint,
    ideas: [a request has a method URL headers and body, status codes tell you what happened, REST means nouns in URLs and verbs as methods],
    hands_on: flow view of request to server to database to response, code cards of curl and fetch }
- { id: sql-select-join, week: 2, title: SQL select and join, status: done,
    goal: Answer a question with SELECT WHERE and JOIN,
    ideas: [a table is rows and columns, WHERE filters and SELECT picks columns, JOIN matches rows across tables by a key],
    hands_on: bars lab of rows kept as a filter slider moves, code cards }
- { id: linear-regression, week: 2, title: Fitting a line to data, status: done,
    goal: Explain what training a model means using a line,
    ideas: [a model is a rule with adjustable numbers, loss is how wrong the rule is on the data, training means adjusting to cut the loss],
    hands_on: curve or vectors lab where slope and intercept sliders fit points with a live loss, formula: "MSE = mean((y - yhat)^2)" }
- { id: gradient-descent, week: 2, title: Slope and gradient descent, status: done }
- { id: overfitting-and-validation, week: 2, title: Overfitting and validation, status: done,
    goal: Tell memorising from learning,
    ideas: [a model can memorise training data, a held-out validation set shows real performance, regularisation and more data reduce overfitting],
    hands_on: curve lab where a complexity slider moves train and validation error }
- { id: classification-and-logistic, week: 2, title: Classification and the sigmoid, status: done,
    goal: Turn a score into a probability and a yes or no,
    ideas: [sigmoid squashes any number into 0 to 1, a threshold turns a probability into a decision, precision and recall measure different mistakes],
    hands_on: curve lab of the sigmoid with a threshold slider, formula: "sigmoid(z) = 1 / (1 + e^-z)" }

- { id: neurons-and-layers, week: 3, title: Neurons and layers, status: done,
    goal: Compute a small network by hand,
    ideas: [a neuron is a dot product plus a bias then an activation, layers stack neurons, nonlinearity is what makes depth useful],
    hands_on: chain view with sliders on weights, formula: "a = relu(w . x + b)" }
- { id: backpropagation, week: 3, title: Backpropagation, status: done }
- { id: pytorch-first-model, week: 3, title: Your first PyTorch model, status: done,
    goal: Read a 20-line training loop,
    ideas: [tensors are NumPy arrays that track gradients, the loop is forward then loss then backward then step, optimizer.step applies gradient descent],
    hands_on: code cards of the loop plus an action lab that shows loss falling per step }
- { id: embeddings-and-cosine-similarity, week: 3, title: Embeddings and cosine similarity, status: done }
- { id: attention-intuition, week: 3, title: Attention in plain words, status: done,
    goal: Explain what attention computes,
    ideas: [each word asks a question query and offers a label key, similarity of query and key decides how much of each value to take, the output is a weighted average],
    hands_on: bars lab of attention weights from a query slider, formula: "softmax(q . k / sqrt(d))" }
- { id: transformer-block, week: 3, title: The transformer block, status: done,
    goal: Draw a transformer block from memory,
    ideas: [attention mixes information between tokens, a feed-forward layer processes each token, residual connections and normalisation keep training stable],
    hands_on: flow view of the block with a layers slider and parameter count }

- { id: llm-apis-and-tokens, week: 4, title: LLM APIs and tokens, status: done,
    goal: Call an LLM API and estimate its cost,
    ideas: [text becomes tokens and you pay per token, messages have roles system user assistant, temperature changes randomness],
    hands_on: bars lab of cost against prompt size, code card of a first API call, formula: "cost = tokens x price" }
- { id: prompting-and-structured-output, week: 4, title: Prompting and structured output, status: done,
    goal: Get reliable JSON out of a model,
    ideas: [be specific and show examples, ask for a schema and validate it, retry on invalid output],
    hands_on: code cards of a prompt and a validator, flow view of generate then validate then retry }
- { id: tool-calling, week: 4, title: Tool calling, status: done,
    goal: Let a model call your function,
    ideas: [you describe tools with a JSON schema, the model replies with which tool and arguments, you run it and send the result back],
    hands_on: flow view of the tool-call round trip, code card }
- { id: streaming-responses, week: 4, title: Streaming responses, status: done,
    goal: Show tokens as they arrive,
    ideas: [streaming sends chunks as they are generated, the UI appends them, you must handle cancel and errors mid-stream],
    hands_on: flow view with a speed slider, code card of an SSE reader }
- { id: fastapi-backend, week: 4, title: "A Python backend with FastAPI", status: done }
- { id: typescript-essentials, week: 4, title: TypeScript essentials, status: done,
    goal: Read and write typed functions and objects,
    ideas: [types describe the shape of data, interfaces and unions model real cases, the compiler catches mistakes before you run],
    hands_on: code cards and a check question set }

- { id: rag-pipeline, week: 5, title: A RAG pipeline end to end, status: done }
- { id: chunking-strategies, week: 5, title: Chunking strategies, status: done,
    goal: Choose chunk size and overlap on purpose,
    ideas: [too big blurs meaning and too small loses context, overlap protects sentences cut at the edge, split on structure before size],
    hands_on: bars lab of chunk count and fit as size and overlap sliders move, formula: "chunks = ceil((words - overlap) / (size - overlap))" }
- { id: vector-search-and-indexes, week: 5, title: Vector search and indexes, status: done,
    goal: Explain exact versus approximate search,
    ideas: [exact search compares against everything, approximate indexes trade a little accuracy for speed, you pick by data size and latency],
    hands_on: bars lab of comparisons against data size for flat versus indexed search }
- { id: rag-evaluation, week: 5, title: Evaluating RAG, status: done,
    goal: Measure whether retrieval and answers are good,
    ideas: [test retrieval and generation separately, recall at k asks whether the right chunk was in the top k, a small labelled question set beats gut feel],
    hands_on: bars lab of recall as k changes, formula: "recall@k = found / relevant" }
- { id: nextjs-api-and-streaming-ui, week: 5, title: Next.js API routes and a streaming UI, status: done,
    goal: Build a chat page backed by an API route,
    ideas: [a route handler runs on the server and hides your key, the client reads the stream and updates state, server components fetch data before render],
    hands_on: flow view of browser to route to LLM and back, code cards }

- { id: agent-loop, week: 6, title: The agent loop, status: done,
    goal: Explain how an agent decides and acts,
    ideas: [loop of think then act then observe, tools are the actions it can take, you must cap steps and cost],
    hands_on: flow view stepping through a loop with a max-steps slider }
- { id: mcp-servers, week: 6, title: MCP servers, status: done,
    goal: Expose a tool to any AI app,
    ideas: [MCP is a standard way to offer tools and data, a server lists tools and a client calls them, one server works with many clients],
    hands_on: flow view of client and server, code card of a tiny server }
- { id: agent-memory-and-guardrails, week: 6, title: Agent memory and guardrails, status: done,
    goal: Keep an agent useful and safe,
    ideas: [short-term memory is the context and long-term memory is a store, validate every tool input and output, require approval for risky actions],
    hands_on: flow view with a risk slider deciding auto or ask-user }
- { id: postgres-and-pgvector, week: 6, title: Postgres and pgvector, status: done,
    goal: Store and search embeddings in Postgres,
    ideas: [Postgres holds your normal data and vectors together, an index speeds nearest-neighbour search, filters and vectors combine in one query],
    hands_on: code cards of table index and query }
- { id: evals-and-tracing, week: 6, title: Evals and tracing, status: done,
    goal: Know whether a change made your app better,
    ideas: [an eval is a fixed set of cases with expected behaviour, a trace records each step of one run, run evals before every release],
    hands_on: bars lab of pass rate before and after a change, formula: "pass rate = passed / total" }

- { id: docker-basics, week: 7, title: Docker basics, status: done,
    goal: Package an app into an image and run it,
    ideas: [an image is a frozen recipe and a container is a running copy, a Dockerfile lists the steps, ports and volumes connect it to the world],
    hands_on: flow view of build to image to container, code card of a Dockerfile }
- { id: cloud-deploy, week: 7, title: "Deploy to the cloud", status: done }
- { id: auth-and-sessions, week: 7, title: Auth and sessions, status: done,
    goal: Explain how login stays logged in,
    ideas: [hash passwords and never store them plain, a session or token proves who you are on each request, protect routes on the server not just the UI],
    hands_on: flow view of login cookie and request }
- { id: caching-and-queues, week: 7, title: Caching and queues, status: done,
    goal: Make slow work fast or background,
    ideas: [a cache remembers answers you already computed, a queue moves slow work out of the request, both need a plan for stale data and retries],
    hands_on: bars lab of latency against cache hit rate, formula: "avg = hit x fast + (1 - hit) x slow" }
- { id: cost-and-latency, week: 7, title: Cost and latency for AI apps, status: done,
    goal: Estimate and cut the bill,
    ideas: [cost scales with tokens in and out, caching and smaller models cut cost, streaming makes slow answers feel fast],
    hands_on: bars lab of monthly cost against users and prompt size }
- { id: system-design-ai-app, week: 7, title: Designing an AI app, status: done,
    goal: Sketch a RAG chat product with real numbers,
    ideas: [start from requirements and users, estimate load and cost before choosing parts, name the failure points],
    hands_on: flow view with users slider driving capacity numbers }

- { id: capstone-brief, week: 8, title: Your capstone project, status: done,
    goal: Pick and scope a portfolio project,
    ideas: [one real user problem, a RAG or agent core with tests and an eval, a deployed demo and a short write-up],
    hands_on: story and checklist-style mistakes cards }
- { id: dsa-patterns, week: 8, title: DSA patterns, status: done,
    goal: Recognise two-pointer sliding-window and hash-map problems,
    ideas: [match the problem shape to a pattern, state the complexity, write the brute force first],
    hands_on: bars lab of operations against input size for n and n squared, formula: "O(n) versus O(n^2)" }
- { id: resume-bullets, week: 8, title: Resume bullets that get calls, status: done,
    goal: Write 5 strong project bullets,
    ideas: [action plus what plus measured result, show numbers from your eval, name the stack in plain words],
    hands_on: check cards comparing weak and strong bullets }
- { id: mock-interview-drills, week: 8, title: Mock interview drills, status: done,
    goal: Answer common AI engineer questions out loud,
    ideas: [explain a concept in 60 seconds, walk through your project's trade-offs, say when you do not know and how you would find out],
    hands_on: check cards of typical questions }

