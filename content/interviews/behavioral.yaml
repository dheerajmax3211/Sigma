- id: iv-beh-ownership
  kind: behavioral
  level: senior
  title: "Tell me about a project you owned end to end"
  prompt: >-
    Describe a project where you were the owner: from problem definition
    through design, delivery and the outcome six months later.
  reference_topics: []
  stages:
    - id: situation
      question: "What was the problem, and why was it yours to solve?"
      intent: >-
        Tests whether the candidate can state a problem crisply and distinguish
        ownership from participation.
      hint: >-
        A strong answer names a specific problem with a measurable cost and says
        plainly why they, rather than someone else, owned it. Vagueness about the
        problem is the most common weakness.
      criteria:
        - id: specific
          label: "names a specific problem with concrete context"
          weight: 3
          patterns: ["we had|the problem|users|cost|latency|revenue|specific"]
        - id: ownership
          label: "states their role and why they owned it"
          weight: 3
          patterns: ["i owned|i led|my responsib|i was accountable|i decided"]
        - id: stakes
          label: "quantifies why it mattered"
          weight: 2
          patterns: ["percent|million|hours|cost|impact|measured"]
    - id: action
      question: "What did you decide that someone else would have decided differently?"
      intent: >-
        Probes judgement rather than activity. A list of tasks is not an answer.
      hint: >-
        Look for a real fork in the road: a tradeoff they chose, an option they
        rejected and why. Candidates who describe only what the team did have not
        answered the question.
      criteria:
        - id: decision
          label: "names a specific decision they made"
          weight: 3
          patterns: ["i decided|i chose|i proposed|we chose|decision"]
        - id: alternative
          label: "explains the alternative and why it lost"
          weight: 3
          patterns: ["instead|alternative|rejected|considered|rather than"]
        - id: tradeoff
          label: "states the tradeoff in cost or risk terms"
          weight: 2
          patterns: ["tradeoff|cost|risk|slower|expensive|cheaper"]
    - id: impact
      question: "What happened, and how do you know?"
      intent: >-
        Probes measurement and honesty about results, including partial ones.
      hint: >-
        A strong answer gives a number and says how it was measured, and is honest
        if the result was mixed. Claiming an unqualified success for a complex
        project reads as unreliable.
      criteria:
        - id: number
          label: "gives a measurable outcome"
          weight: 3
          patterns: ["percent|reduced|increased|from|to|metric"]
        - id: measured
          label: "says how the result was measured"
          weight: 2
          patterns: ["measured|dashboard|experiment|metric|tracked"]
        - id: honest
          label: "acknowledges what did not work"
          weight: 2
          patterns: ["did not|shortfall|mixed|partially|failed|missed"]
    - id: reflection
      question: "What would you do differently now?"
      intent: >-
        Probes learning that is specific to this project rather than a generic
        platitude.
      hint: >-
        The answer should name a concrete change: a decision made later, a signal
        missed, a stakeholder engaged too late. Generic lessons mean the reflection
        is rehearsed.
      criteria:
        - id: concrete
          label: "names a specific thing they would change"
          weight: 3
          patterns: ["would have|should have|earlier|differently|next time"]
        - id: why
          label: "explains what the change would have prevented"
          weight: 2
          patterns: ["because|would have avoided|prevented|saved|reduced"]
        - id: applied
          label: "says whether they applied the lesson since"
          weight: 1
          patterns: ["since then|applied|changed how|later|now i"]
- id: iv-beh-incident-debug
  kind: behavioral
  level: mid
  title: "Debug a production incident under pressure"
  prompt: >-
    Tell me about a production incident you debugged. Walk me through the first
    thirty minutes.
  reference_topics: []
  stages:
    - id: situation
      question: "What was the symptom, and how did you learn about it?"
      intent: >-
        Probes whether they start from a symptom and a detection path, not from a
        solution.
      hint: >-
        A good answer separates the symptom users saw from the cause they later
        found, and says how the incident was detected — an alert, a customer, or a
        colleague noticing.
      criteria:
        - id: symptom
          label: "describes the observable symptom"
          weight: 3
          patterns: ["users|error|latency|timeout|symptom|saw"]
        - id: detection
          label: "says how it was detected"
          weight: 2
          patterns: ["alert|paged|monitor|customer|reported|dashboard"]
        - id: severity
          label: "states the blast radius or severity"
          weight: 2
          patterns: ["percent|all users|region|severity|impact|how many"]
    - id: action
      question: "What did you check first, and why that?"
      intent: >-
        Probes a hypothesis-driven process rather than random poking.
      hint: >-
        The strong answer names the first hypothesis, the cheapest check that would
        confirm or kill it, and what the result told them. Random log reading is the
        weak version.
      criteria:
        - id: hypothesis
          label: "states a first hypothesis"
          weight: 3
          patterns: ["suspected|hypothesis|thought|because|likely"]
        - id: check
          label: "names the check that confirmed or eliminated it"
          weight: 3
          patterns: ["checked|looked at|metric|log|trace|query"]
        - id: ruled
          label: "says what they ruled out"
          weight: 2
          patterns: ["ruled out|eliminated|not the|unlikely|excluded"]
    - id: mitigate
      question: "What did you do to stop the bleeding, before you understood the cause?"
      intent: >-
        Mitigation before diagnosis is the operational skill; waiting to understand
        is a failure.
      hint: >-
        The right move is usually to stop the harm — roll back, shed traffic, fail
        over — and then diagnose. Candidates who insist on root-causing first while
        users suffer are showing inexperience.
      criteria:
        - id: mitigate
          label: "took a mitigation action before full understanding"
          weight: 3
          patterns: ["rollback|revert|failover|shed|disable|restart"]
        - id: order
          label: "explains mitigation before diagnosis"
          weight: 2
          patterns: ["first|before|then|stop the bleeding|mitigate"]
        - id: risk
          label: "considers the risk of the mitigation itself"
          weight: 1
          patterns: ["risk|side effect|might|careful|verify"]
    - id: reflection
      question: "What changed afterwards so it cannot happen again?"
      intent: >-
        Probes whether they close the loop with a systemic fix rather than a
        promise to be careful.
      hint: >-
        Look for a concrete change: an alert, a test, a guardrail, a runbook. Being
        more careful is not a systemic fix.
      criteria:
        - id: fix
          label: "names a concrete preventive change"
          weight: 3
          patterns: ["added|alert|test|guardrail|runbook|automated"]
        - id: systemic
          label: "the fix is systemic, not personal vigilance"
          weight: 2
          patterns: ["systemic|process|check|pipeline|prevents"]
        - id: verify
          label: "verified the fix would have caught it"
          weight: 1
          patterns: ["verified|reproduced|tested|confirmed|simulated"]
- id: iv-beh-disagreement
  kind: behavioral
  level: senior
  title: "Disagree with a senior engineer"
  prompt: >-
    Tell me about a time you disagreed with a senior engineer or your manager on
    a technical decision. What did you do?
  reference_topics: []
  stages:
    - id: situation
      question: "What was the disagreement actually about?"
      intent: >-
        Probes whether they can state both positions fairly.
      hint: >-
        A strong answer states the other person's position in a way they would
        accept, then states their own. A caricature of the opposition signals the
        candidate was not listening.
      criteria:
        - id: both
          label: "states both positions fairly"
          weight: 3
          patterns: ["they thought|their view|my view|argued|position"]
        - id: technical
          label: "frames it as a technical tradeoff, not a personality clash"
          weight: 2
          patterns: ["tradeoff|because|design|cost|risk|technical"]
        - id: stakes
          label: "explains why the decision mattered"
          weight: 2
          patterns: ["mattered|impact|would have|cost|risk|users"]
    - id: action
      question: "How did you raise it, and what evidence did you bring?"
      intent: >-
        Probes influence through evidence and the escalation norms.
      hint: >-
        The strong version brings data or a prototype rather than an opinion, raises
        it directly and privately first, and escalates only if the decision is
        genuinely wrong and the stakes justify it.
      criteria:
        - id: evidence
          label: "brought data, a prototype, or a written argument"
          weight: 3
          patterns: ["data|benchmark|prototype|wrote|document|evidence"]
        - id: direct
          label: "raised it directly with the person first"
          weight: 2
          patterns: ["talked|directly|one on one|raised|asked"]
        - id: escalate
          label: "escalated appropriately, or explains why they did not"
          weight: 2
          patterns: ["escalat|did not escalate|manager|decision maker|skip"]
    - id: impact
      question: "What was the outcome, and what if you had been wrong?"
      intent: >-
        Probes intellectual honesty and whether they can hold a position without
        certainty.
      hint: >-
        The best answers describe what would have changed their mind, and admit when
        they were in fact wrong. A candidate who has never lost a disagreement is
        either not candid or not listening.
      criteria:
        - id: outcome
          label: "states the outcome clearly"
          weight: 2
          patterns: ["we went with|outcome|decided|shipped|changed"]
        - id: humility
          label: "says what would have changed their mind"
          weight: 3
          patterns: ["would have changed|if|convinced|wrong|concede"]
        - id: relationship
          label: "preserved the working relationship"
          weight: 1
          patterns: ["relationship|still|trust|respect|worked with"]
    - id: reflection
      question: "What did you learn about disagreeing well?"
      intent: >-
        Probes a generalisable principle rather than a slogan.
      hint: >-
        Look for a principle grounded in the story: disagree on the decision, not the
        person; commit once decided; make the disagreement cheap to resolve with
        evidence.
      criteria:
        - id: principle
          label: "states a principle derived from the story"
          weight: 3
          patterns: ["learned|principle|now i|believe|rule"]
        - id: commit
          label: "commits to the decision once it is made"
          weight: 2
          patterns: ["disagree and commit|commit|moved on|supported"]
        - id: cheap
          label: "makes disagreement cheap, e.g. through written proposals"
          weight: 1
          patterns: ["written|proposal|document|early|cheap|fast"]
- id: iv-beh-postmortem
  kind: behavioral
  level: staff
  title: "Run a blameless incident review"
  prompt: >-
    You ran the review after a significant outage. What did the review find, and
    what changed?
  reference_topics: []
  stages:
    - id: situation
      question: "How did you frame the review so people would be honest?"
      intent: >-
        Probes whether blamelessness was operationalised, not just declared.
      hint: >-
        Blameless is a method: you ask what made the action seem reasonable at the
        time, and you write the timeline before assigning causes. Declaring
        blamelessness and then asking who deployed is not blameless.
      criteria:
        - id: framing
          label: "states how they set the tone and rules"
          weight: 3
          patterns: ["blameless|no blame|tone|ground rules|honest"]
        - id: timeline
          label: "built a factual timeline first"
          weight: 2
          patterns: ["timeline|sequence|facts|what happened|chronolog"]
        - id: context
          label: "asks why the action seemed right at the time"
          weight: 2
          patterns: ["seemed|at the time|context|reasonable|why"]
    - id: action
      question: "What was the actual cause, and how deep did you go?"
      intent: >-
        Probes the distinction between trigger and cause, and whether they stopped
        at human error.
      hint: >-
        The strong answer separates the trigger from the contributing conditions:
        the deploy was the trigger, but the missing canary and the shared credential
        were the causes. Stopping at human error ends the analysis too early.
      criteria:
        - id: trigger
          label: "separates the trigger from contributing causes"
          weight: 3
          patterns: ["trigger|contributing|root cause|underlying|conditions"]
        - id: systemic
          label: "goes beyond individual error"
          weight: 3
          patterns: ["process|system|missing|guardrail|assumption|design"]
        - id: evidence
          label: "supports the cause with evidence"
          weight: 2
          patterns: ["logs|metrics|evidence|showed|confirmed|trace"]
    - id: impact
      question: "What actions came out of it, and did they stick?"
      intent: >-
        Probes follow-through, which is where most postmortems fail.
      hint: >-
        The test is whether the actions were specific, owned and completed. A list of
        twelve vague action items with no owner is a ritual, not a fix.
      criteria:
        - id: actions
          label: "names specific actions with owners"
          weight: 3
          patterns: ["action|owner|assigned|ticket|completed"]
        - id: stuck
          label: "says which ones actually shipped"
          weight: 2
          patterns: ["shipped|completed|done|still open|followed"]
        - id: measure
          label: "measures whether recurrence dropped"
          weight: 1
          patterns: ["recur|again|since|measure|rate"]
- id: iv-beh-deadline-scope
  kind: behavioral
  level: mid
  title: "Ship on a deadline by cutting scope"
  prompt: >-
    Tell me about a time you had to ship by a fixed date. What did you cut, and
    how did you decide?
  reference_topics: []
  stages:
    - id: situation
      question: "What was fixed: the date, the scope, or both?"
      intent: >-
        Probes whether they understand that something must give and can name it.
      hint: >-
        A strong answer says which constraint was truly immovable — a launch, a
        contract, a regulation — and which was negotiable. Pretending all three are
        fixed is how teams work unsustainable hours.
      criteria:
        - id: constraint
          label: "names the immovable constraint"
          weight: 3
          patterns: ["date|launch|contract|deadline|could not move"]
        - id: negotiable
          label: "identifies what could move"
          weight: 2
          patterns: ["scope|cut|negotiat|reduce|defer"]
        - id: stakes
          label: "explains the cost of missing the date"
          weight: 2
          patterns: ["cost|penalty|revenue|customer|commitment"]
    - id: action
      question: "How did you decide what to cut?"
      intent: >-
        Probes prioritisation by user value and reversibility, not by what was
        easiest.
      hint: >-
        Cut by value to the user and by reversibility: ship the thin slice that
        proves the value, defer the parts you can add without a migration. Cutting
        the hardest part usually means cutting the value.
      criteria:
        - id: value
          label: "prioritises by user value"
          weight: 3
          patterns: ["value|users|core|essential|must have"]
        - id: reversible
          label: "prefers reversible cuts"
          weight: 2
          patterns: ["reversib|add later|behind a flag|incremental|defer"]
        - id: consult
          label: "consulted the stakeholders who owned the requirement"
          weight: 2
          patterns: ["stakeholder|product|asked|customer|agreed"]
    - id: impact
      question: "What shipped, and what did the cuts cost later?"
      intent: >-
        Probes honesty about technical debt created by the cut.
      hint: >-
        The strong answer says what shipped, what was deferred, and what the deferral
        cost in rework. Claiming the cut had no cost is not credible.
      criteria:
        - id: shipped
          label: "states what actually shipped"
          weight: 2
          patterns: ["shipped|delivered|launched|released"]
        - id: debt
          label: "names the cost of the cuts later"
          weight: 3
          patterns: ["debt|rework|later|cost|had to redo"]
        - id: followup
          label: "says whether the deferred work was completed"
          weight: 1
          patterns: ["followed up|completed|deferred|backlog|next"]
- id: iv-beh-influence
  kind: behavioral
  level: senior
  title: "Influence a decision without authority"
  prompt: >-
    Tell me about a time you changed a decision you had no authority over.
  reference_topics: []
  stages:
    - id: situation
      question: "Who owned the decision, and why did you care?"
      intent: >-
        Probes the map of influence: who decides, who advises, who blocks.
      hint: >-
        A strong answer names the actual decision maker and their incentives, and
        says why the outcome mattered to the candidate's own work.
      criteria:
        - id: owner
          label: "identifies who owned the decision"
          weight: 3
          patterns: ["owned|decision maker|team|manager|they decided"]
        - id: incentives
          label: "understands their incentives"
          weight: 3
          patterns: ["incentive|goal|pressure|worried|motivation"]
        - id: stake
          label: "explains why it mattered to them"
          weight: 1
          patterns: ["my work|affected|downstream|because|impact"]
    - id: action
      question: "What did you do to change their mind?"
      intent: >-
        Probes the method: a small demonstration, a shared metric, or a pilot.
      hint: >-
        The reliable method is to make the cost visible in the other team's terms —
        a demo, a shared dashboard, a small pilot — rather than arguing from
        principle.
      criteria:
        - id: demo
          label: "built a demo, prototype or pilot"
          weight: 3
          patterns: ["demo|prototype|pilot|proof|experiment|spike"]
        - id: theirterms
          label: "framed the argument in their terms"
          weight: 3
          patterns: ["their|for them|saved|their metric|cost to them"]
        - id: ally
          label: "found an ally or built coalitions"
          weight: 1
          patterns: ["ally|support|champion|other team|coalition"]
    - id: impact
      question: "Did the decision change, and what did it cost you?"
      intent: >-
        Probes persistence and the price of influence.
      hint: >-
        Long influence campaigns cost time and political capital; the strong answer
        says how long it took and whether it was worth it.
      criteria:
        - id: changed
          label: "states whether the decision changed"
          weight: 2
          patterns: ["changed|adopted|agreed|switched|did not"]
        - id: duration
          label: "says how long it took"
          weight: 2
          patterns: ["weeks|months|time|took|iterat"]
        - id: cost
          label: "acknowledges the cost of the effort"
          weight: 1
          patterns: ["cost|capital|time|effort|worth"]
- id: iv-beh-mentoring
  kind: behavioral
  level: senior
  title: "Mentor an engineer who is struggling"
  prompt: >-
    Tell me about someone you mentored who was not progressing. What did you do,
    and what happened?
  reference_topics: []
  stages:
    - id: situation
      question: "What was the actual problem, as distinct from the symptom?"
      intent: >-
        Probes diagnosis: skill gap, unclear expectations, motivation, or context.
      hint: >-
        The strong answer distinguishes a skill gap from unclear expectations. The
        most common mentoring mistake is teaching skills when the person needed the
        definition of done.
      criteria:
        - id: diagnosis
          label: "identifies a specific cause, not a general label"
          weight: 3
          patterns: ["skill|expectation|unclear|motivation|context|gap"]
        - id: evidence
          label: "cites observable behaviour"
          weight: 2
          patterns: ["noticed|observed|reviews|missed|feedback"]
        - id: stakes
          label: "explains the impact on the team"
          weight: 1
          patterns: ["team|delivery|quality|impact|affected"]
    - id: action
      question: "What did you change about how you worked with them?"
      intent: >-
        Probes concrete interventions rather than encouragement.
      hint: >-
        Concrete interventions: smaller scoped tasks with explicit done criteria, pair
        sessions, reviews with one focus at a time. Saying "I gave them more support"
        is not an intervention.
      criteria:
        - id: concrete
          label: "names a specific intervention"
          weight: 3
          patterns: ["pair|smaller|scoped|check in|review|shadow"]
        - id: cadence
          label: "sets a cadence"
          weight: 2
          patterns: ["weekly|daily|regular|every|schedule"]
        - id: feedback
          label: "gave direct, specific feedback"
          weight: 2
          patterns: ["feedback|told them|direct|specific|honest"]
    - id: impact
      question: "What was the outcome, and what if it had not worked?"
      intent: >-
        Probes honesty about failure and the willingness to escalate performance
        issues.
      hint: >-
        Not every mentoring story ends in promotion. The strong answer is honest
        about a poor outcome and says what they would have done differently, or that
        they escalated to a formal process.
      criteria:
        - id: outcome
          label: "states the outcome honestly"
          weight: 3
          patterns: ["improved|did not|left|moved|promotion|outcome"]
        - id: escalation
          label: "knows when to escalate to a performance process"
          weight: 2
          patterns: ["escalat|manager|formal|process|hr"]
        - id: reflection
          label: "says what they learned about mentoring"
          weight: 2
          patterns: ["learned|should have|earlier|differently|realis"]
- id: iv-beh-failure
  kind: behavioral
  level: mid
  title: "Tell me about a project that failed"
  prompt: >-
    Describe a project you worked on that failed. What was your part in it?
  reference_topics: []
  stages:
    - id: situation
      question: "What was the project supposed to achieve?"
      intent: >-
        Probes whether they can state the goal and the failure without deflecting.
      hint: >-
        A strong answer states the intended outcome and the actual outcome side by
        side, without blaming circumstances before describing what happened.
      criteria:
        - id: goal
          label: "states what success would have looked like"
          weight: 2
          patterns: ["goal|supposed to|success|intended|aimed"]
        - id: actual
          label: "states what actually happened"
          weight: 3
          patterns: ["failed|did not|shut down|cancelled|canceled|never"]
        - id: scale
          label: "gives the scale: time, people, money"
          weight: 1
          patterns: ["months|people|team|budget|time"]
    - id: action
      question: "What did you do when you saw it going wrong?"
      intent: >-
        Probes agency: did they raise it, and with what evidence.
      hint: >-
        Look for the moment they noticed and what they did with it. Silence until the
        end is the common failure; the strong answer names the signal they saw and
        the escalation they attempted.
      criteria:
        - id: noticed
          label: "names the signal they noticed"
          weight: 3
          patterns: ["noticed|saw|signal|metric|early|realis"]
        - id: raised
          label: "raised it with someone"
          weight: 3
          patterns: ["raised|told|flagged|escalat|warned"]
        - id: tried
          label: "attempted a concrete correction"
          weight: 2
          patterns: ["tried|proposed|changed|pivot|reduce scope"]
    - id: reflection
      question: "What was your own contribution to the failure?"
      intent: >-
        The core of the question: ownership without self-flagellation.
      hint: >-
        A strong answer names something they personally got wrong — a missed signal, a
        design choice, an assumption — and what they changed afterwards. Blaming the
        organisation entirely dodges the question.
      criteria:
        - id: own
          label: "names their own contribution"
          weight: 3
          patterns: ["i|my|missed|assumed|should have|my mistake"]
        - id: specific
          label: "is specific about what they got wrong"
          weight: 3
          patterns: ["assumption|estimate|design|did not|ignored"]
        - id: changed
          label: "says what they changed afterwards"
          weight: 2
          patterns: ["since then|now i|changed|adopted|check"]
- id: iv-beh-ambiguity
  kind: behavioral
  level: senior
  title: "Deliver on an ambiguous requirement"
  prompt: >-
    Tell me about a time you were given a vague goal and had to turn it into
    something concrete.
  reference_topics: []
  stages:
    - id: situation
      question: "What was actually asked of you?"
      intent: >-
        Probes whether they can quote the ambiguity rather than retrofitting
        clarity.
      hint: >-
        The strong answer quotes the original request and says what made it
        ambiguous: an undefined user, an unstated metric, or conflicting owners.
      criteria:
        - id: vague
          label: "quotes the vague request or goal"
          weight: 3
          patterns: ["asked|goal|they wanted|request|vague|unclear"]
        - id: gap
          label: "names what was undefined"
          weight: 3
          patterns: ["undefined|unclear|no metric|who|which users|missing"]
        - id: stakes
          label: "explains why it could not be deferred"
          weight: 1
          patterns: ["deadline|blocked|needed|waiting|impact"]
    - id: action
      question: "How did you make it concrete?"
      intent: >-
        Probes the move from ambiguity to a testable definition.
      hint: >-
        The reliable move is to write down a definition of done with a measurable
        target, take it to the requester, and get an explicit yes. Guessing and
        building is the common failure.
      criteria:
        - id: define
          label: "wrote a concrete definition of done"
          weight: 3
          patterns: ["defined|wrote|spec|document|definition of done"]
        - id: confirm
          label: "confirmed it with the requester"
          weight: 3
          patterns: ["confirmed|agreed|reviewed with|sign off|asked them"]
        - id: slice
          label: "split it into a first deliverable"
          weight: 2
          patterns: ["first|slice|phase|smallest|increment"]
    - id: impact
      question: "What did you build, and was it what they wanted?"
      intent: >-
        Probes the risk that the clarification itself was wrong.
      hint: >-
        A strong answer says what shipped and whether the requester's reaction
        confirmed the interpretation — and what they did when it did not.
      criteria:
        - id: shipped
          label: "states what was delivered"
          weight: 2
          patterns: ["shipped|built|delivered|released|launched"]
        - id: reaction
          label: "says whether it matched expectations"
          weight: 3
          patterns: ["they were|matched|wanted|surprised|changed"]
        - id: adjust
          label: "describes adjusting after feedback"
          weight: 2
          patterns: ["adjusted|iterated|changed|feedback|second"]
    - id: reflection
      question: "How do you handle ambiguity now?"
      intent: >-
        Probes a repeatable method rather than a personality trait.
      hint: >-
        Look for a method: write the assumptions, state the metric, timebox the
        exploration, check in early. Tolerance for ambiguity is not a method.
      criteria:
        - id: method
          label: "describes a repeatable approach"
          weight: 3
          patterns: ["assumption|write|timebox|check in|early|method"]
        - id: cost
          label: "knows the cost of over-clarifying"
          weight: 2
          patterns: ["too long|delay|over|analysis|paralysis|fast"]
        - id: example
          label: "grounds it in the story"
          weight: 1
          patterns: ["this|that|since|example|same"]
- id: iv-beh-cross-team
  kind: behavioral
  level: staff
  title: "Resolve a cross-team conflict"
  prompt: >-
    Two teams disagree about who owns a shared API and it is blocking delivery.
    Tell me about a time you resolved something like this.
  reference_topics: []
  stages:
    - id: situation
      question: "What was the disagreement really about?"
      intent: >-
        Probes whether they see the interests underneath the stated positions.
      hint: >-
        Stated positions are about ownership; the underlying interests are usually
        release cadence, on-call burden, or roadmap credit. Naming the interest is
        what makes a solution possible.
      criteria:
        - id: positions
          label: "states each team's position"
          weight: 2
          patterns: ["wanted|argued|said|position|each team"]
        - id: interests
          label: "identifies the underlying interests"
          weight: 3
          patterns: ["because|worried|incentive|on call|cadence|roadmap"]
        - id: cost
          label: "quantifies the delivery impact"
          weight: 2
          patterns: ["blocked|weeks|slip|delay|cost"]
    - id: action
      question: "What did you do to break the deadlock?"
      intent: >-
        Probes structure: a written proposal, explicit decision rights, or an
        escalation with options.
      hint: >-
        The staff-level move is to write down the options with their costs, name who
        decides, and get a decision. Running more meetings without a decision rule
        just moves the deadlock.
      criteria:
        - id: options
          label: "laid out options with tradeoffs"
          weight: 3
          patterns: ["options|alternatives|tradeoff|compared|proposal"]
        - id: decision
          label: "identified who decides, or escalated with a recommendation"
          weight: 3
          patterns: ["decider|who decides|escalat|recommend|owner"]
        - id: written
          label: "made it written so it could be reviewed"
          weight: 2
          patterns: ["wrote|document|doc|written|shared"]
    - id: impact
      question: "What was the resolution, and did it hold?"
      intent: >-
        Probes durability: a decision that keeps being relitigated is not resolved.
      hint: >-
        A resolution holds when the decision rule is explicit and the cost is
        accepted by both sides. Reopening it every quarter means the interests were
        never addressed.
      criteria:
        - id: resolution
          label: "states the decision that was made"
          weight: 2
          patterns: ["decided|agreed|went with|resolution|chose"]
        - id: durable
          label: "says whether it held over time"
          weight: 3
          patterns: ["held|still|reopened|stuck|since"]
        - id: relationship
          label: "preserved the working relationship"
          weight: 1
          patterns: ["relationship|trust|later|worked together|respect"]
    - id: reflection
      question: "What would you do earlier next time?"
      intent: >-
        Probes prevention: ambiguity in ownership is cheaper to fix before it blocks.
      hint: >-
        The lesson is usually to establish decision rights and a shared interface
        contract before the dependency becomes critical.
      criteria:
        - id: earlier
          label: "names something to do earlier"
          weight: 3
          patterns: ["earlier|upfront|before|preempt|at the start"]
        - id: contract
          label: "mentions an interface contract or ownership charter"
          weight: 2
          patterns: ["contract|charter|ownership|interface|sla"]
        - id: generalise
          label: "generalises beyond this case"
          weight: 1
          patterns: ["generally|pattern|other teams|now i|always"]
- id: iv-beh-oncall
  kind: behavioral
  level: staff
  title: "Fix an unsustainable on-call rotation"
  prompt: >-
    Your team's on-call is burning people out. Tell me about a time you changed
    an operational process.
  reference_topics: []
  stages:
    - id: situation
      question: "What was the evidence that it was unsustainable?"
      intent: >-
        Probes whether they argue from data rather than vibes.
      hint: >-
        The strong answer brings numbers: pages per shift, night pages, the share
        that were actionable, and attrition or sick days. Without numbers, the
        complaint is easy to dismiss.
      criteria:
        - id: data
          label: "cites page volume or toil data"
          weight: 3
          patterns: ["pages|per shift|per week|volume|how many"]
        - id: night
          label: "distinguishes out-of-hours pages"
          weight: 2
          patterns: ["night|out of hours|3 a.m|weekend|sleep"]
        - id: human
          label: "names the human cost, with evidence"
          weight: 2
          patterns: ["burnout|attrition|left|sick|morale"]
    - id: action
      question: "What did you change first, and why that?"
      intent: >-
        Probes prioritisation: alert quality before headcount.
      hint: >-
        The first fix is usually alert quality, because most pages are noise or
        duplicates. Adding people to a noisy rotation spreads the pain without
        reducing it.
      criteria:
        - id: alerts
          label: "attacked alert quality first"
          weight: 3
          patterns: ["alert|noise|actionable|threshold|dedup"]
        - id: priority
          label: "explains the ordering of fixes"
          weight: 2
          patterns: ["first|because|biggest|highest|impact"]
        - id: automation
          label: "automated or removed toil"
          weight: 2
          patterns: ["automat|runbook|self heal|script|remove"]
    - id: impact
      question: "What changed in the numbers?"
      intent: >-
        Probes measurement of the operational change.
      hint: >-
        The measurable outcome is pages per shift, actionable share, and time to
        acknowledge. A morale claim without numbers is weaker.
      criteria:
        - id: beforeafter
          label: "gives before and after numbers"
          weight: 3
          patterns: ["before|after|from|to|reduced"]
        - id: actionable
          label: "measures the actionable share"
          weight: 2
          patterns: ["actionable|percent|share|ratio|noise"]
        - id: sustain
          label: "says how it was sustained"
          weight: 1
          patterns: ["review|weekly|ongoing|kept|sustain"]
    - id: reflection
      question: "What did you learn about operational change?"
      intent: >-
        Probes a principle about incentives and ownership.
      hint: >-
        The lesson is usually that the team creating the pages must feel them, or
        that alert review needs a standing owner. Process changes without an owner
        decay.
      criteria:
        - id: principle
          label: "states a principle about operations"
          weight: 3
          patterns: ["learned|principle|owner|incentive|who feels"]
        - id: decay
          label: "notes that process changes decay without an owner"
          weight: 2
          patterns: ["decay|regress|drift|without|owner"]
        - id: applied
          label: "applied it to another team or system"
          weight: 1
          patterns: ["other team|elsewhere|applied|reused|now"]
- id: iv-beh-saying-no
  kind: behavioral
  level: senior
  title: "Say no to a stakeholder"
  prompt: >-
    Tell me about a time you pushed back on a request from a senior stakeholder.
  reference_topics: []
  stages:
    - id: situation
      question: "What was requested, and by whom?"
      intent: >-
        Probes clarity about power dynamics and the actual ask.
      hint: >-
        A strong answer names the stakeholder's level, what they asked for, and the
        deadline they wanted. Vagueness about who asked suggests the story is
        sanitised.
      criteria:
        - id: request
          label: "states the specific request"
          weight: 3
          patterns: ["asked|wanted|requested|deadline|by"]
        - id: power
          label: "names the stakeholder's position relative to them"
          weight: 2
          patterns: ["vp|director|executive|senior|my manager|leader"]
        - id: reason
          label: "explains why the request was problematic"
          weight: 3
          patterns: ["would|risk|cost|unsafe|debt|could not"]
    - id: action
      question: "How did you say no without damaging the relationship?"
      intent: >-
        Probes the shape of a good refusal: what you can do instead.
      hint: >-
        The strong refusal offers an alternative and names the cost of the original
        ask. A flat no without options is technically correct and organisationally
        useless.
      criteria:
        - id: alternative
          label: "offered an alternative or a smaller version"
          weight: 3
          patterns: ["offered|alternative|instead|smaller|phase"]
        - id: cost
          label: "made the cost of the request explicit"
          weight: 3
          patterns: ["cost|would take|tradeoff|delay|break"]
        - id: respect
          label: "kept it about the work, not the person"
          weight: 1
          patterns: ["respect|understand|appreciate|not personal|their goal"]
    - id: impact
      question: "What happened, and what would you have done if they insisted?"
      intent: >-
        Probes the escalation path when the no is overruled.
      hint: >-
        The strong answer says whether the stakeholder accepted it, and that if
        overruled they would escalate their objection in writing and then commit.
      criteria:
        - id: outcome
          label: "states whether the request was dropped or changed"
          weight: 2
          patterns: ["agreed|accepted|dropped|changed|insisted"]
        - id: overruled
          label: "has a plan for being overruled"
          weight: 3
          patterns: ["in writing|escalat|documented|commit|disagree and commit"]
        - id: relationship
          label: "preserved the relationship"
          weight: 1
          patterns: ["trust|later|relationship|still|worked"]
- id: iv-beh-migration
  kind: behavioral
  level: staff
  title: "Migrate a legacy system"
  prompt: >-
    Tell me about a migration you led off a legacy system. How did you keep it
    safe?
  reference_topics: []
  stages:
    - id: situation
      question: "What made the legacy system hard to leave?"
      intent: >-
        Probes the real constraints: undocumented behaviour, data, dependents.
      hint: >-
        The strong answer names the specific coupling — undocumented behaviour
        relied on by other teams, data that cannot be dual-written, or a schema
        nobody owns.
      criteria:
        - id: coupling
          label: "names the specific coupling or risk"
          weight: 3
          patterns: ["undocumented|depend|callers|data|schema|nobody"]
        - id: size
          label: "gives the scale of the system and its users"
          weight: 2
          patterns: ["requests|users|tables|lines|services|how many"]
        - id: why
          label: "explains why the migration was necessary"
          weight: 1
          patterns: ["cost|risk|end of life|scal|security|maintain"]
    - id: action
      question: "What was the migration strategy?"
      intent: >-
        Probes incremental migration with dual writes and shadow reads rather than a
        big bang.
      hint: >-
        The safe pattern is strangle: route a slice of traffic to the new system,
        dual-write, compare results, then widen. A big-bang cutover on a critical
        system is a gamble, not a plan.
      criteria:
        - id: incremental
          label: "incremental or strangle migration"
          weight: 3
          patterns: ["incremental|strangle|slice|gradual|piece by piece"]
        - id: dual
          label: "dual writes or shadow reads for verification"
          weight: 3
          patterns: ["dual write|shadow|compare|both|mirror"]
        - id: rollback
          label: "a rollback path at every stage"
          weight: 2
          patterns: ["rollback|revert|fallback|switch back|flag"]
    - id: impact
      question: "What nearly went wrong, and how did you catch it?"
      intent: >-
        Probes the value of verification rather than luck.
      hint: >-
        The strong answer names a discrepancy that shadow reads surfaced before
        users saw it, which is the entire justification for the comparison step.
      criteria:
        - id: near
          label: "names a near miss or discrepancy"
          weight: 3
          patterns: ["discrepan|difference|almost|caught|mismatch"]
        - id: caught
          label: "explains how it was detected"
          weight: 2
          patterns: ["comparison|shadow|alert|test|reconciliation"]
        - id: fixed
          label: "says what was fixed before cutover"
          weight: 2
          patterns: ["fixed|corrected|before|resolved|patched"]
    - id: reflection
      question: "What would you do differently on the next migration?"
      intent: >-
        Probes transferable judgement about scope and decommissioning.
      hint: >-
        The common lesson is that decommissioning the old system is the hard part:
        without a deadline and an owner, it runs forever and you pay for two.
      criteria:
        - id: decommission
          label: "names decommissioning as the hard part"
          weight: 3
          patterns: ["decommission|turn off|shut down|old system|retire"]
        - id: deadline
          label: "would set a deadline or owner"
          weight: 2
          patterns: ["deadline|owner|date|accountab|force"]
        - id: earlier
          label: "names something to start earlier"
          weight: 1
          patterns: ["earlier|sooner|upfront|before|start"]
- id: iv-beh-strategy
  kind: behavioral
  level: principal
  title: "Set a one-year technical strategy"
  prompt: >-
    Describe a technical strategy you set for an organisation. What did you
    choose to do, and what did you choose not to do?
  reference_topics: []
  stages:
    - id: situation
      question: "What was the state of the organisation, and why was a strategy needed?"
      intent: >-
        Probes whether they start from a diagnosis or from a wish list.
      hint: >-
        A real strategy starts from a diagnosis of the constraint — delivery speed,
        reliability, cost, or a capability the business needs — and says why the
        current trajectory fails.
      criteria:
        - id: diagnosis
          label: "states the constraint the organisation faced"
          weight: 3
          patterns: ["constraint|bottleneck|problem|slowing|cost|reliab"]
        - id: evidence
          label: "supports the diagnosis with evidence"
          weight: 3
          patterns: ["data|metric|measured|incidents|trend|survey"]
        - id: stakes
          label: "explains the cost of doing nothing"
          weight: 2
          patterns: ["would|cost|risk|lose|fall behind|continue"]
    - id: action
      question: "What did you choose, and what did you explicitly not do?"
      intent: >-
        A strategy without exclusions is a list of aspirations.
      hint: >-
        The principal signal is the exclusions: what they deliberately stopped or
        declined, and who they told. Saying yes to everything is the absence of
        strategy.
      criteria:
        - id: bets
          label: "names a small number of explicit bets"
          weight: 3
          patterns: ["bet|invest|priority|focus|three|two"]
        - id: notdoing
          label: "names what they chose not to do"
          weight: 3
          patterns: ["not do|stopped|declined|depriorit|said no|excluded"]
        - id: sequencing
          label: "sequences the work"
          weight: 2
          patterns: ["first|then|phase|sequence|order"]
    - id: adoption
      question: "How did you get the organisation to follow it?"
      intent: >-
        Probes adoption: strategy is a communication and incentive problem.
      hint: >-
        A strategy lands when it is translated into team-level goals, resourcing and
        metrics, and when leaders repeat it. A document nobody's roadmap reflects is
        not a strategy.
      criteria:
        - id: alignment
          label: "translated it into team goals or roadmaps"
          weight: 3
          patterns: ["roadmap|goals|teams|aligned|okr|plan"]
        - id: resourcing
          label: "moved people or budget behind it"
          weight: 2
          patterns: ["budget|headcount|staff|resourc|invest"]
        - id: comms
          label: "communicated it repeatedly"
          weight: 1
          patterns: ["communicat|repeated|all hands|wrote|presented"]
    - id: impact
      question: "How do you know it worked, and what did you get wrong?"
      intent: >-
        Probes measurement over a year and honesty about the misses.
      hint: >-
        The strong answer gives a metric that moved and names a bet that did not pay
        off, with the correction they made. A strategy story with no misses is
        marketing.
      criteria:
        - id: metric
          label: "gives a metric that moved"
          weight: 3
          patterns: ["metric|improved|reduced|percent|from to"]
        - id: miss
          label: "names a bet that did not pay off"
          weight: 3
          patterns: ["did not|wrong|miss|failed|overestimated"]
        - id: adjust
          label: "describes adjusting the strategy"
          weight: 2
          patterns: ["adjusted|changed|pivoted|corrected|dropped"]
- id: iv-beh-ethics
  kind: behavioral
  level: principal
  title: "Ship a model you believe is unsafe"
  prompt: >-
    Tell me about a time you were asked to ship something you believed was
    harmful or unsafe. What did you do?
  reference_topics: []
  stages:
    - id: situation
      question: "What was the harm you were worried about, and how concrete was it?"
      intent: >-
        Probes whether the concern was evidence-based or a vague discomfort.
      hint: >-
        A credible answer names the affected population, the mechanism of harm, and
        the evidence — an eval, a user report, an incident in a similar system.
      criteria:
        - id: harm
          label: "names the specific harm and who it affects"
          weight: 3
          patterns: ["harm|affected|users|bias|unsafe|misinformation"]
        - id: mechanism
          label: "explains how the harm would occur"
          weight: 3
          patterns: ["because|would|when|mechanism|lead to"]
        - id: evidence
          label: "cites evidence rather than intuition"
          weight: 2
          patterns: ["eval|test|data|report|evidence|measured"]
    - id: action
      question: "Who did you raise it with, and in what form?"
      intent: >-
        Probes the escalation path and the quality of the argument.
      hint: >-
        The strong answer puts the concern in writing with options and costs, raises
        it with the decision maker and the responsible function, and proposes a
        mitigation rather than only objecting.
      criteria:
        - id: raised
          label: "raised it with the right people"
          weight: 3
          patterns: ["raised|told|escalat|legal|policy|leadership"]
        - id: written
          label: "put the concern in writing"
          weight: 2
          patterns: ["wrote|document|memo|email|written"]
        - id: options
          label: "proposed mitigations or alternatives"
          weight: 3
          patterns: ["mitigat|alternative|guardrail|limit|delay|scope"]
    - id: impact
      question: "What was the outcome, and what did it cost you personally?"
      intent: >-
        Probes whether the story is real and whether they accept the cost of
        dissent.
      hint: >-
        The strong answer says what changed — a delay, a guardrail, a limitation —
        and is honest about the personal cost. A story where everyone agreed
        immediately is probably incomplete.
      criteria:
        - id: outcome
          label: "states what changed as a result"
          weight: 3
          patterns: ["delayed|guardrail|limited|changed|shipped with|blocked"]
        - id: cost
          label: "acknowledges the personal cost"
          weight: 2
          patterns: ["cost|pushback|tension|relationship|risk to me"]
        - id: alternative
          label: "says what they would have done if overruled"
          weight: 2
          patterns: ["if they|would have|refuse|escalate|leave|document"]
    - id: reflection
      question: "What is your rule for when to escalate versus when to accept the decision?"
      intent: >-
        Probes judgement about thresholds rather than absolutism.
      hint: >-
        The mature answer distinguishes reversible harm from irreversible harm, and
        reserves escalation for the latter, while documenting the former.
      criteria:
        - id: threshold
          label: "states a threshold for escalation"
          weight: 3
          patterns: ["irreversib|severe|threshold|when|line"]
        - id: reversible
          label: "distinguishes reversible from irreversible harm"
          weight: 3
          patterns: ["reversib|undo|recover|permanent|cannot"]
        - id: humility
          label: "allows that they might be wrong"
          weight: 1
          patterns: ["might be wrong|uncertain|listen|evidence|change my mind"]
