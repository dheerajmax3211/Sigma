- id: iv-ml-rag-enterprise
  kind: ml_system
  level: senior
  title: "Design RAG over enterprise documents"
  prompt: >-
    Design a retrieval-augmented assistant over 20 million internal documents:
    permissions, freshness, citations, and an answer in three seconds.
  reference_topics: [long-context, tokenisation, model-serving]
  stages:
    - id: clarify
      question: "What has to be retrieved before you can even discuss the model?"
      intent: >-
        The candidate must establish that retrieval quality, permissions and
        freshness dominate model choice.
      hint: >-
        Ask about permission filtering and document freshness first. A perfect
        model citing a document the user cannot open is worse than no answer.
      criteria:
        - id: perms
          label: "asks how document permissions are enforced at retrieval time"
          weight: 3
          patterns: ["permission|acl|access control|entitle|authoris|authoriz"]
        - id: freshness
          label: "asks the ingestion cadence and how updated documents are re-indexed"
          weight: 2
          patterns: ["fresh|update|reindex|sync|cadence"]
        - id: corpus
          label: "asks the document mix: length, tables, PDFs, images"
          weight: 1
          patterns: ["pdf|table|scanned|length|document type"]
    - id: core
      question: "Walk the pipeline from query to cited answer."
      intent: >-
        Expect chunking, hybrid retrieval, reranking, then generation with
        citations, and the reason each step exists.
      hint: >-
        Chunk with overlap, retrieve by both dense and lexical signals, rerank the
        top fifty to ten, then generate with the chunk ids attached so the citation
        is verifiable rather than decorative.
      criteria:
        - id: chunk
          label: "a chunking strategy with size and overlap stated"
          weight: 2
          patterns: ["chunk|split|overlap|window|segment"]
        - id: hybrid
          label: "hybrid retrieval: dense plus lexical"
          weight: 3
          patterns: ["hybrid|bm25|lexical|keyword|sparse|dense"]
        - id: rerank
          label: "a reranker before generation"
          weight: 2
          patterns: ["rerank|cross encoder|second stage|reorder"]
        - id: cite
          label: "citations tied to chunk ids, not free text"
          weight: 2
          patterns: ["citation|cite|source|chunk id|quote"]
    - id: scale
      question: "A user asks something the corpus cannot answer. What does your system do?"
      intent: >-
        Probes abstention, which is the failure mode that erodes trust.
      hint: >-
        The system must be able to say it does not know, which needs a retrieval
        confidence signal and a refusal path — not a prompt instruction alone.
      criteria:
        - id: abstain
          label: "an explicit abstention path when retrieval is weak"
          weight: 3
          patterns: ["abstain|refuse|do not know|insufficient|no answer"]
        - id: threshold
          label: "a retrieval score threshold or judge decides"
          weight: 2
          patterns: ["threshold|score|confidence|judge|classifier"]
        - id: fallback
          label: "offers adjacent documents or a clarifying question"
          weight: 1
          patterns: ["clarify|suggest|related|adjacent|fallback"]
- id: iv-ml-rag-eval
  kind: ml_system
  level: staff
  title: "Evaluate a RAG system"
  prompt: >-
    You ship a RAG assistant and the team argues about whether it is good.
    Design the evaluation that settles it.
  reference_topics: [model-evaluation, information-theory]
  stages:
    - id: clarify
      question: "What is the failure you are trying to catch?"
      intent: >-
        Retrieval failure and generation failure need separate measurement.
      hint: >-
        Separate the two: did the right passage get retrieved, and did the model
        use it correctly. A single end-to-end score cannot tell you which to fix.
      criteria:
        - id: separate
          label: "separates retrieval quality from generation quality"
          weight: 3
          patterns: ["retrieval|generation|two parts|separate|decompose"]
        - id: use
          label: "asks what the product actually cares about"
          weight: 2
          patterns: ["user|task|success|downstream|business"]
        - id: data
          label: "asks where labelled questions come from"
          weight: 1
          patterns: ["labelled|labeled|golden|dataset|annotat"]
    - id: core
      question: "How do you measure retrieval and generation separately?"
      intent: >-
        Expect recall at k and MRR or nDCG for retrieval, and groundedness plus
        answer correctness for generation.
      hint: >-
        Retrieval is measured with recall at k against known supporting passages;
        generation with groundedness and correctness, judged against those
        passages. Without the gold passages, both collapse into opinion.
      criteria:
        - id: retrieval
          label: "recall at k, MRR or nDCG for retrieval"
          weight: 3
          patterns: ["recall at|mrr|ndcg|precision at|hit rate"]
        - id: grounded
          label: "groundedness or faithfulness of the answer to the passages"
          weight: 2
          patterns: ["grounded|faithful|attribut|supported by|hallucinat"]
        - id: judge
          label: "an LLM judge with a rubric, validated against human labels"
          weight: 2
          patterns: ["judge|rubric|human|agree|calibrat"]
    - id: scale
      question: "Your judge says 92 percent. Why might that number be wrong?"
      intent: >-
        Probes judge bias, position effects, and the need for a human-labelled
        calibration set.
      hint: >-
        Judges are biased toward long answers, toward the first option, and toward
        their own model family. You need a human-labelled set to measure the
        judge's agreement before trusting its rate.
      criteria:
        - id: bias
          label: "names judge biases: length, position, self preference"
          weight: 3
          patterns: ["bias|length|position|order|self preference|verbose"]
        - id: calibrate
          label: "measures judge agreement against human labels"
          weight: 3
          patterns: ["agreement|kappa|correlation|human label|calibrat"]
        - id: sample
          label: "keeps a continuously refreshed evaluation set"
          weight: 1
          patterns: ["refresh|sample|new questions|drift|update"]
- id: iv-ml-llm-serving-kv
  kind: ml_system
  level: senior
  title: "Sizing the KV cache for a 70B model"
  prompt: >-
    You are serving a 70B decoder-only model. Walk me through how many
    concurrent 8k-token sessions one 8xH100 node can hold.
  reference_topics: [kv-cache, kv-cache-quantisation, model-serving]
  stages:
    - id: clarify
      question: "Start with the KV cache size per token. What do you need to know?"
      intent: >-
        Tests whether the candidate can decompose the problem before computing.
      hint: >-
        Bytes per token is two times layers times KV heads times head dimension
        times bytes per element; ask for the layer count, the GQA ratio and the
        precision before multiplying.
      criteria:
        - id: inputs
          label: "names layers, KV heads, head dim and precision"
          weight: 3
          patterns: ["layer|head|dimension|precision|fp16|fp8|bf16"]
        - id: factor
          label: "knows it is a factor of two for keys and values"
          weight: 2
          patterns: ["two|both|key and value|k and v|factor of 2"]
        - id: formula
          label: "writes the per-token formula before substituting numbers"
          weight: 2
          patterns: ["formula|per token|bytes|multiply|equation"]
    - id: core
      question: "Do the arithmetic out loud for 70B with GQA."
      intent: >-
        Expect roughly 0.3 to 0.6 MB per token depending on GQA and precision,
        and a sanity check of the answer.
      hint: >-
        With 80 layers, 8 KV heads, head dim 128 and fp16 you get about 320 KB per
        token, so an 8k session is roughly 2.6 GB; with 64 heads without GQA it
        would be eight times that.
      criteria:
        - id: arith
          label: "substitutes concrete numbers and gets a per-token figure"
          weight: 3
          patterns: ["kb|mb|gigabyte|per token|bytes"]
        - id: gqa
          label: "explains that GQA divides the cache by the head ratio"
          weight: 3
          patterns: ["gqa|grouped query|kv head|ratio|shrink"]
        - id: session
          label: "multiplies by 8k and compares against 80 GB"
          weight: 2
          patterns: ["8k|8000|session|80 gb|hbm|capacity"]
    - id: scale
      question: "What does that imply for batch size, throughput and cost per token?"
      intent: >-
        Probes the memory wall: weights plus cache, decode bound by bandwidth, and
        the resulting tradeoff between batch and context.
      hint: >-
        Weights take about 140 GB in fp16, so the node is already sharded across
        8 GPUs; the cache then competes with batch, and decode is bandwidth-bound
        so larger batches amortise weight reads but not cache reads.
      criteria:
        - id: weights
          label: "subtracts the weight footprint before sizing the cache"
          weight: 3
          patterns: ["weights|140|parameters|footprint|subtract"]
        - id: bandwidth
          label: "identifies decode as memory-bandwidth bound"
          weight: 2
          patterns: ["bandwidth|memory bound|roofline|arithmetic intensity"]
        - id: tradeoff
          label: "states the context-length versus batch-size tradeoff"
          weight: 2
          patterns: ["tradeoff|batch size|concurren|fewer|longer context"]
- id: iv-ml-continuous-batching
  kind: ml_system
  level: senior
  title: "Design a continuous batching scheduler"
  prompt: >-
    Design the request scheduler for an LLM inference server. Requests arrive
    with wildly different prompt and output lengths.
  reference_topics: [continuous-batching, model-serving, kv-cache]
  stages:
    - id: clarify
      question: "What are the objectives and the constraints?"
      intent: >-
        Throughput and tail latency conflict, and the candidate must pick.
      hint: >-
        Ask whether the SLO is throughput or p99 latency. Continuous batching
        maximises throughput by filling the batch, which directly hurts the tail
        for requests that arrive mid-batch.
      criteria:
        - id: objective
          label: "asks whether throughput or tail latency is the SLO"
          weight: 3
          patterns: ["throughput|latency|p99|slo|objective"]
        - id: lengths
          label: "asks the prompt and output length distributions"
          weight: 2
          patterns: ["prompt length|output length|distribution|long|short"]
        - id: memory
          label: "asks the KV cache memory budget"
          weight: 1
          patterns: ["kv cache|memory|budget|hbm|capacity"]
    - id: core
      question: "How does the scheduler decide what to run next?"
      intent: >-
        Expect iteration-level scheduling: admit and evict per decode step, not
        per request.
      hint: >-
        The scheduler runs one decode step at a time and can admit a new request
        or evict a finished one at every step. That is the whole idea — batching
        at iteration granularity, not request granularity.
      criteria:
        - id: iteration
          label: "iteration-level scheduling, admitting per decode step"
          weight: 3
          patterns: ["iteration|per step|token step|admit|evict"]
        - id: paged
          label: "paged or block-based KV allocation to avoid fragmentation"
          weight: 2
          patterns: ["paged|page|block|fragment|allocat"]
        - id: preempt
          label: "preemption or recomputation when memory runs out"
          weight: 2
          patterns: ["preempt|evict|swap|recompute|reclaim"]
    - id: scale
      question: "A long 32k prompt arrives while 64 short requests are decoding. What happens to them?"
      intent: >-
        Probes the fairness and interference between prefill and decode.
      hint: >-
        A 32k prefill monopolises the GPU and stalls every decode step, so
        production systems chunk the prefill and interleave it, or reserve a
        separate pool for long prompts.
      criteria:
        - id: interference
          label: "identifies prefill starving decode"
          weight: 3
          patterns: ["prefill|starve|stall|block|interfere"]
        - id: chunk
          label: "chunked prefill interleaved with decode steps"
          weight: 3
          patterns: ["chunk|split|interleave|piggyback|slice"]
        - id: pool
          label: "separate pools or queues by length class"
          weight: 1
          patterns: ["pool|separate queue|class|tier|isolat"]
- id: iv-ml-speculative-serving
  kind: ml_system
  level: staff
  title: "Deploy speculative decoding"
  prompt: >-
    You want to cut LLM latency with speculative decoding. Design the
    deployment and tell me when it will not help.
  reference_topics: [speculative-decoding, model-serving, kv-cache]
  stages:
    - id: clarify
      question: "What is the draft model, and what is the acceptance rate?"
      intent: >-
        Speculation only pays when acceptance is high and the draft is cheap.
      hint: >-
        Ask for the expected acceptance rate. Below roughly 60 percent the extra
        draft cost outweighs the saved steps, and the win disappears.
      criteria:
        - id: accept
          label: "asks the acceptance rate and treats it as the key number"
          weight: 3
          patterns: ["acceptance|accept rate|hit rate|match"]
        - id: draft
          label: "asks whether the draft is a smaller model, n-gram, or Medusa head"
          weight: 2
          patterns: ["draft|smaller model|ngram|medusa|eagle|head"]
        - id: workload
          label: "asks the task type: code and structured output accept more"
          weight: 2
          patterns: ["code|structured|json|summar|open ended|creative"]
    - id: core
      question: "Walk the verify step. What must stay exact?"
      intent: >-
        The output distribution must be unchanged; verification is not best-of-n.
      hint: >-
        The target model verifies all drafted tokens in one forward pass and
        accepts a prefix; rejected tokens are resampled from the corrected
        distribution so the output remains distributed as the target model.
      criteria:
        - id: verify
          label: "one forward pass verifies several drafted tokens"
          weight: 3
          patterns: ["verify|forward pass|parallel|all at once|batch"]
        - id: exact
          label: "the output distribution is preserved, not approximated"
          weight: 3
          patterns: ["exact|same distribution|lossless|unchanged|rejection sampling"]
        - id: prefix
          label: "accepts the longest correct prefix and resamples the rest"
          weight: 2
          patterns: ["prefix|longest|reject|resample|fallback"]
    - id: scale
      question: "When does speculation make latency worse?"
      intent: >-
        Probes the regime where the win inverts: low acceptance, high batch,
        memory-bound decode.
      hint: >-
        At high batch sizes the decode step is already amortised, so the extra
        draft compute buys little; with low acceptance you pay for tokens you
        throw away.
      criteria:
        - id: batch
          label: "high batch utilisation reduces the benefit"
          weight: 3
          patterns: ["batch|saturated|already|amortis|amortiz"]
        - id: lowaccept
          label: "low acceptance means wasted compute"
          weight: 2
          patterns: ["low acceptance|wasted|throw away|discard|overhead"]
        - id: memory
          label: "the draft model costs memory that could hold KV cache"
          weight: 1
          patterns: ["memory|kv cache|compete|footprint|evict"]
- id: iv-ml-lora-multitenant
  kind: ml_system
  level: senior
  title: "Serve 200 fine-tunes of one base model"
  prompt: >-
    Two hundred customers each want their own fine-tuned model. Design the
    serving system so they share GPUs without a per-customer cluster.
  reference_topics: [fine-tuning-lora, model-serving, quantisation]
  stages:
    - id: clarify
      question: "How different are the fine-tunes, and how much traffic does each get?"
      intent: >-
        Traffic skew decides whether you can keep adapters resident.
      hint: >-
        Ask the traffic distribution. Two hundred adapters with one hot tenant at
        80 percent of traffic is a caching problem; uniform traffic is a
        scheduling problem.
      criteria:
        - id: traffic
          label: "asks the per-tenant traffic distribution"
          weight: 3
          patterns: ["traffic|distribution|skew|hot|per tenant"]
        - id: method
          label: "asks whether fine-tunes are full weights or adapters"
          weight: 2
          patterns: ["lora|adapter|full fine tune|full weight|peft"]
        - id: isolation
          label: "asks whether tenants require isolation guarantees"
          weight: 1
          patterns: ["isolat|noisy|guarantee|dedicated|compliance"]
    - id: core
      question: "How do many adapters share one base model in memory?"
      intent: >-
        Expect one resident base plus adapter swapping or batched multi-adapter
        kernels.
      hint: >-
        Keep the base weights resident once, load adapters into a small pool, and
        either swap per batch or use a kernel that applies different adapters to
        different rows of the batch.
      criteria:
        - id: base
          label: "one shared base model in memory"
          weight: 3
          patterns: ["shared base|one base|resident|single copy"]
        - id: swap
          label: "adapter pool with load and eviction"
          weight: 2
          patterns: ["swap|load|evict|pool|cache adapter"]
        - id: batched
          label: "multi-adapter batching or per-row adapter selection"
          weight: 2
          patterns: ["multi adapter|per row|batched|mixed batch|punica"]
    - id: scale
      question: "A tenant sends one request every hour. What does that cost you?"
      intent: >-
        Probes cold-start cost and whether the design accounts for the long tail.
      hint: >-
        Loading an adapter per cold request is cheap only if the adapter is small;
        the long tail means you cannot keep all two hundred resident, so the policy
        is a cache with a load cost you must measure.
      criteria:
        - id: coldstart
          label: "names the adapter load cost on a cold request"
          weight: 3
          patterns: ["cold|load time|cold start|first request|miss"]
        - id: cache
          label: "an LRU or popularity cache for adapters"
          weight: 2
          patterns: ["lru|popularity|cache|evict|tier"]
        - id: tier
          label: "tiers: resident for hot tenants, on-demand for the tail"
          weight: 1
          patterns: ["tier|hot|cold|on demand|separate pool"]
- id: iv-ml-training-cluster
  kind: ml_system
  level: staff
  title: "Run a 512-GPU training cluster"
  prompt: >-
    Design the platform that runs multi-week training jobs on 512 GPUs: job
    scheduling, fault tolerance, and checkpointing.
  reference_topics: [data-parallelism, fsdp-zero, optimisation-in-practice]
  stages:
    - id: clarify
      question: "What fails in a multi-week run that does not fail in a benchmark?"
      intent: >-
        At this scale failure is routine, not exceptional, and the candidate must
        start there.
      hint: >-
        With hundreds of GPUs, some component fails every few hours, so the
        question is not whether a job restarts but how much progress a restart
        costs.
      criteria:
        - id: failure
          label: "treats hardware failure as routine at this scale"
          weight: 3
          patterns: ["fail|mtbf|routine|every few hours|failure rate"]
        - id: overhead
          label: "asks the checkpoint interval and acceptable lost work"
          weight: 2
          patterns: ["checkpoint|interval|lost work|restart|overhead"]
        - id: topology
          label: "asks the interconnect: NVLink, InfiniBand, and topology"
          weight: 1
          patterns: ["nvlink|infiniband|topology|interconnect|fabric"]
    - id: core
      question: "How do you make a restart cheap?"
      intent: >-
        Expect asynchronous sharded checkpointing, elastic restart, and health
        checks that quarantine bad nodes.
      hint: >-
        Synchronous checkpoints stall the whole job; sharded asynchronous
        checkpointing writes in the background. Restart must also replace the bad
        node rather than waiting for it.
      criteria:
        - id: async
          label: "asynchronous or sharded checkpointing"
          weight: 3
          patterns: ["async|sharded|background|overlap|distributed checkpoint"]
        - id: replace
          label: "failed nodes are replaced and the job rejoins"
          weight: 3
          patterns: ["replace|spare|quarantine|rejoin|elastic"]
        - id: health
          label: "proactive health checks during the run"
          weight: 1
          patterns: ["health|monitor|probe|ecc|xid"]
    - id: scale
      question: "The loss spikes at step 40,000 and does not recover. What do you do?"
      intent: >-
        Probes the operational playbook: rollback to a checkpoint, inspect data,
        and the temptation to keep going.
      hint: >-
        The first move is a checkpoint rollback with a different data shard order,
        because a bad batch is more likely than a bad optimiser state. Continuing
        to train through a spike is how a model is ruined.
      criteria:
        - id: rollback
          label: "rolls back to a checkpoint rather than waiting it out"
          weight: 3
          patterns: ["rollback|revert|resume from|checkpoint|rewind"]
        - id: data
          label: "suspects the data first, and changes shard order or skips the batch"
          weight: 3
          patterns: ["data|batch|shard|corrupt|outlier"]
        - id: compare
          label: "compares against a smaller-scale run to isolate the cause"
          weight: 1
          patterns: ["smaller|scale down|reproduce|ablation|control"]
- id: iv-ml-parallelism-plan
  kind: ml_system
  level: principal
  title: "Choose a parallelism plan for a 400B model"
  prompt: >-
    You must train a 400B-parameter model on 2,048 GPUs with 80 GB each. Choose
    the parallelism and defend the arithmetic.
  reference_topics: [tensor-parallelism, pipeline-parallelism, fsdp-zero, mixture-of-experts]
  stages:
    - id: clarify
      question: "What is the memory budget per GPU before you choose anything?"
      intent: >-
        The principal candidate starts from the memory equation, not from a known
        recipe.
      hint: >-
        Weights, gradients, optimiser state and activations each have a size. In
        mixed precision with Adam, states dominate at roughly sixteen bytes per
        parameter before activations.
      criteria:
        - id: bytes
          label: "states bytes per parameter for weights, gradients and optimiser state"
          weight: 3
          patterns: ["bytes per parameter|16|optimiser state|optimizer state|mixed precision"]
        - id: budget
          label: "converts 400B parameters into a total footprint"
          weight: 2
          patterns: ["400b|parameters|terabyte|footprint|total memory"]
        - id: activations
          label: "includes activations and their dependence on sequence length and batch"
          weight: 2
          patterns: ["activation|sequence length|batch|recompute|checkpointing"]
    - id: core
      question: "Which parallelism goes where, and why not the others?"
      intent: >-
        Expect tensor parallelism within a node, pipeline across nodes, and data
        or sharded data parallel for the rest.
      hint: >-
        Tensor parallelism needs the fastest links, so it stays inside a node;
        pipeline parallelism crosses nodes and costs bubbles; ZeRO or FSDP shards
        what remains. Each has a reason.
      criteria:
        - id: tp
          label: "tensor parallelism constrained to NVLink domains"
          weight: 3
          patterns: ["tensor parallel|nvlink|within node|intra node"]
        - id: pp
          label: "pipeline parallelism across nodes, with bubble cost"
          weight: 2
          patterns: ["pipeline|bubble|stage|across node|microbatch"]
        - id: fsdp
          label: "data or sharded data parallel for the remainder"
          weight: 2
          patterns: ["data parallel|fsdp|zero|shard|replicat"]
    - id: scale
      question: "What is the weakest link: compute, memory, or communication?"
      intent: >-
        Probes the roofline and the communication volume each parallelism choice
        imposes.
      hint: >-
        Tensor parallelism all-reduces on every layer, so it is communication
        heavy; pipeline is lighter but idles on bubbles. At this scale the network
        usually wins, not the FLOPs.
      criteria:
        - id: comms
          label: "quantifies communication volume per step for the chosen plan"
          weight: 3
          patterns: ["all reduce|communication|bandwidth|volume|collective"]
        - id: bubble
          label: "accounts for pipeline bubbles in utilisation"
          weight: 2
          patterns: ["bubble|idle|utilisation|utilization|efficiency"]
        - id: mfu
          label: "measures achieved model FLOPs utilisation"
          weight: 1
          patterns: ["mfu|flops utilisation|utilization|efficiency|throughput"]
- id: iv-ml-feature-store
  kind: ml_system
  level: senior
  title: "Design a feature store"
  prompt: >-
    Design a feature store used by both training pipelines and online serving,
    where the same feature must mean the same thing in both.
  reference_topics: [feature-engineering-leakage, time-series, model-serving]
  stages:
    - id: clarify
      question: "What is the failure you are preventing?"
      intent: >-
        Training-serving skew is the reason a feature store exists; say it.
      hint: >-
        The failure is train-serve skew: a feature computed one way offline and
        another way online, producing a model that scores well and behaves badly.
      criteria:
        - id: skew
          label: "names training-serving skew as the core problem"
          weight: 3
          patterns: ["skew|train serve|offline online|inconsisten|drift"]
        - id: latency
          label: "asks the online lookup latency budget"
          weight: 2
          patterns: ["latency|p99|milliseconds|online|budget"]
        - id: freshness
          label: "asks the freshness requirement per feature"
          weight: 1
          patterns: ["fresh|streaming|batch|update|realtime"]
    - id: core
      question: "How do offline and online computation stay identical?"
      intent: >-
        Expect one transformation definition executed in two engines, or a stream
        that writes both.
      hint: >-
        The definition must exist once and be executed by both paths, with a
        shared library or SQL dialect. Two hand-written implementations will
        diverge, and you will find out in production.
      criteria:
        - id: shared
          label: "one transformation definition shared by both paths"
          weight: 3
          patterns: ["shared|single definition|same code|one definition|library"]
        - id: dual
          label: "a streaming job writes both the offline table and the online store"
          weight: 2
          patterns: ["stream|dual write|both|kafka|same job"]
        - id: pointintime
          label: "point-in-time correct joins for training"
          weight: 3
          patterns: ["point in time|as of|temporal|no leakage|timestamp join"]
    - id: scale
      question: "A feature changes definition. What happens to the models already trained on it?"
      intent: >-
        Probes versioning of feature definitions and backward compatibility.
      hint: >-
        Feature definitions must be versioned, and a change is a new feature, not
        an edit. In-place edits silently invalidate every model trained on the old
        semantics.
      criteria:
        - id: version
          label: "versions the feature definition rather than editing in place"
          weight: 3
          patterns: ["version|new feature|immutable|backward|deprecat"]
        - id: backfill
          label: "backfills or recomputes history for the new version"
          weight: 2
          patterns: ["backfill|recompute|replay|historical|regenerate"]
        - id: migrate
          label: "a migration path for consumers, with both versions served"
          weight: 1
          patterns: ["migrat|both versions|dual serve|deprecat|cutover"]
- id: iv-ml-recsys
  kind: ml_system
  level: staff
  title: "Design a short-video recommendation system"
  prompt: >-
    Design the recommendation system behind a short-video feed: what to show
    next, for 500M users, with a feed that must feel responsive.
  reference_topics: [cs-tiktok-recommendation, model-evaluation, contrastive-learning-clip]
  stages:
    - id: clarify
      question: "What is the objective, and what is the cost of a bad recommendation?"
      intent: >-
        The objective is multi-sided: watch time, retention, creator fairness.
      hint: >-
        Ask whether the target is watch time, completion rate, or long-term
        retention. Optimising clicks in a feed of infinite scroll reliably
        degrades both watch time and retention.
      criteria:
        - id: objective
          label: "asks which objective: watch time, completion, retention"
          weight: 3
          patterns: ["watch time|completion|retention|engagement|objective"]
        - id: cost
          label: "asks what a bad recommendation costs the product"
          weight: 2
          patterns: ["bad|harm|churn|report|skip|cost"]
        - id: coldstart
          label: "raises new users and new creators"
          weight: 1
          patterns: ["cold start|new user|new creator|exploration|fresh"]
    - id: core
      question: "Describe the funnel from millions of videos to one slate."
      intent: >-
        Expect retrieval, ranking, and re-ranking with distinct models and
        latencies.
      hint: >-
        Retrieval narrows millions to thousands with a cheap model, ranking scores
        hundreds with a heavy model, and re-ranking enforces diversity and policy.
        Each stage has its own latency budget.
      criteria:
        - id: retrieval
          label: "a retrieval stage with an embedding or ANN index"
          weight: 3
          patterns: ["retrieval|candidate|ann|embedding|two tower|recall"]
        - id: ranking
          label: "a ranking model over a few hundred candidates"
          weight: 3
          patterns: ["rank|scor|model|feature|heavy"]
        - id: rerank
          label: "a re-ranking stage for diversity and policy"
          weight: 2
          patterns: ["re rank|diversity|dedup|policy|slate"]
    - id: scale
      question: "How do you evaluate a new ranker before shipping it to 500M users?"
      intent: >-
        Probes offline metrics, counterfactual evaluation, and the gap between
        offline and online.
      hint: >-
        Offline metrics on logged data are biased by the old policy, so you need
        interleaving or a small online experiment. Offline wins frequently fail
        online.
      criteria:
        - id: offline
          label: "offline metrics with their bias acknowledged"
          weight: 2
          patterns: ["offline|auc|ndcg|metric|logged"]
        - id: bias
          label: "names the feedback-loop or position bias"
          weight: 3
          patterns: ["bias|feedback loop|position|confound|counterfactual"]
        - id: online
          label: "interleaving or a small A/B test before full launch"
          weight: 2
          patterns: ["interleav|a b test|experiment|holdout|canary"]
- id: iv-ml-two-tower
  kind: ml_system
  level: senior
  title: "Design a two-tower retrieval model"
  prompt: >-
    Design the retrieval model for a recommendation system: given a user,
    return a thousand plausible items from ten million.
  reference_topics: [contrastive-learning-clip, vectors-and-geometry, knn-curse-dimensionality]
  stages:
    - id: clarify
      question: "What can the item tower see, and what can the user tower see?"
      intent: >-
        The constraint is that item embeddings must be precomputable; anything
        user-specific cannot enter the item tower.
      hint: >-
        The item tower may only use features known at indexing time, because item
        embeddings are precomputed. Any cross-feature between user and item moves
        to the ranking stage.
      criteria:
        - id: constraint
          label: "states that item embeddings must be precomputable"
          weight: 3
          patterns: ["precompute|index time|offline|item tower|independent"]
        - id: cross
          label: "explains that user-item cross features belong in ranking"
          weight: 3
          patterns: ["cross|interaction|ranking stage|not in retrieval|pairwise"]
        - id: negatives
          label: "asks how negatives are sampled"
          weight: 1
          patterns: ["negative|sample|hard negative|in batch"]
    - id: core
      question: "How is it trained, and what loss?"
      intent: >-
        Expect a contrastive or sampled-softmax loss with in-batch negatives, and
        a discussion of false negatives.
      hint: >-
        In-batch negatives make training cheap but introduce false negatives when
        a sampled item is actually relevant. Sampled softmax with a correction, or
        hard negative mining, is the refinement.
      criteria:
        - id: loss
          label: "contrastive or sampled softmax objective"
          weight: 3
          patterns: ["contrastive|softmax|triplet|log loss|sampled"]
        - id: inbatch
          label: "in-batch negatives and their bias"
          weight: 3
          patterns: ["in batch|batch negative|false negative|bias|popularity"]
        - id: hard
          label: "hard negative mining"
          weight: 2
          patterns: ["hard negative|mine|difficult|ann negative"]
    - id: scale
      question: "How do you serve ten million item vectors at low latency?"
      intent: >-
        Probes ANN index choice, refresh cadence, and recall loss.
      hint: >-
        An approximate index such as HNSW or IVF-PQ trades recall for latency, so
        you must measure recall at k against exact search, and decide how often
        the index is rebuilt as items change.
      criteria:
        - id: ann
          label: "an ANN index with the recall and latency tradeoff stated"
          weight: 3
          patterns: ["hnsw|ivf|pq|ann|approximate|recall"]
        - id: refresh
          label: "index refresh cadence for new and changed items"
          weight: 2
          patterns: ["refresh|rebuild|incremental|update|stale"]
        - id: shard
          label: "shards the index across nodes"
          weight: 1
          patterns: ["shard|partition|distribute|replica|node"]
- id: iv-ml-search-ranking
  kind: ml_system
  level: senior
  title: "Build a learning-to-rank stage for search"
  prompt: >-
    Your search returns relevant documents but in a poor order. Design the
    ranking stage that fixes it.
  reference_topics: [model-evaluation, gradient-boosting, information-theory]
  stages:
    - id: clarify
      question: "What signal tells you the current order is bad?"
      intent: >-
        Relevance labels, clicks, and judgments are different signals with
        different biases.
      hint: >-
        Clicks are biased by position and by what was shown, so a ranker trained
        on raw clicks learns to reproduce the old ranking. Ask what judgments or
        debiasing exist.
      criteria:
        - id: signal
          label: "asks what relevance signal exists: clicks, labels, judgments"
          weight: 3
          patterns: ["click|label|judgment|judgement|relevance|human"]
        - id: bias
          label: "names position bias in click data"
          weight: 3
          patterns: ["position bias|bias|exam|impression|propensity"]
        - id: metric
          label: "asks which metric the product cares about"
          weight: 1
          patterns: ["ndcg|mrr|map|metric|success"]
    - id: core
      question: "Pointwise, pairwise, or listwise? Choose and justify."
      intent: >-
        Expect listwise or pairwise for ranking quality, with a note that
        pointwise is simpler but ignores relative order.
      hint: >-
        Listwise losses optimise the metric directly, which is why LambdaMART
        style objectives win; pointwise regression treats each document
        independently and cannot express that only the order matters.
      criteria:
        - id: choice
          label: "picks a learning-to-rank formulation explicitly"
          weight: 3
          patterns: ["pointwise|pairwise|listwise|lambdamart|lambda|objective"]
        - id: why
          label: "explains why the order matters more than the absolute score"
          weight: 2
          patterns: ["order|relative|rank|absolute|scale"]
        - id: features
          label: "names features: query-document match, freshness, authority"
          weight: 2
          patterns: ["bm25|match|freshness|authority|click|feature"]
    - id: scale
      question: "Offline nDCG improves but online engagement drops. What happened?"
      intent: >-
        Probes the offline-online gap: distribution shift, metric mismatch, and
        the presentation of results.
      hint: >-
        Offline nDCG is computed on the old distribution with old features; if the
        new ranker surfaces documents that were never shown, it is optimising a
        region with no labels. Also check that the metric matches the product goal.
      criteria:
        - id: shift
          label: "identifies distribution shift or unseen documents"
          weight: 3
          patterns: ["distribution|shift|unseen|never shown|coverage"]
        - id: metric
          label: "questions whether nDCG matches the product objective"
          weight: 2
          patterns: ["metric|objective|proxy|does not match|mismatch"]
        - id: debug
          label: "proposes examining the changed queries or an interleaving test"
          weight: 1
          patterns: ["interleav|slice|segment|inspect|analyse|analyze"]
- id: iv-ml-ctr
  kind: ml_system
  level: senior
  title: "Predict click-through rate for ads"
  prompt: >-
    Design the CTR prediction system for a display ad exchange: 2M requests a
    second, 10 ms budget, and calibration matters because bids depend on it.
  reference_topics: [gradient-boosting, model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "Why is calibration different from ranking here?"
      intent: >-
        Bids are computed from the predicted probability, so a rank-preserving
        miscalibration still loses money.
      hint: >-
        AUC only measures order; the auction multiplies the probability by a bid,
        so a model that ranks perfectly but predicts twice the true rate
        overbids on every impression.
      criteria:
        - id: calibration
          label: "distinguishes calibration from ranking"
          weight: 3
          patterns: ["calibrat|probability|auc|rank|bid"]
        - id: latency
          label: "confirms the 10 ms budget and what it excludes"
          weight: 2
          patterns: ["10 ms|latency|budget|tight|real time"]
        - id: sparsity
          label: "asks about click sparsity and negative sampling"
          weight: 1
          patterns: ["sparse|rare|negative|imbalance|ctr low"]
    - id: core
      question: "Which model and which features?"
      intent: >-
        Expect a sparse-feature model — GBDT, FM, or a deep model with embeddings
        — plus behavioural and context features.
      hint: >-
        The signal is in high-cardinality categorical crosses: user, ad, context.
        Either hashed embeddings with a deep model or GBDT on target statistics
        works, but the encoding of those crosses is the decision.
      criteria:
        - id: model
          label: "names a model suited to sparse high-cardinality features"
          weight: 3
          patterns: ["gbdt|xgboost|lightgbm|fm|deep|embedding|dcn"]
        - id: features
          label: "names behavioural and context features, not just IDs"
          weight: 2
          patterns: ["history|behaviour|behavior|context|time of day|device"]
        - id: encoding
          label: "explains how categorical features are encoded"
          weight: 2
          patterns: ["hash|embedding|one hot|target encod|label encod"]
    - id: scale
      question: "The model is retrained hourly on logged impressions. What goes wrong?"
      intent: >-
        Probes feedback loops and selective labels: you only observe clicks on
        ads you showed.
      hint: >-
        You never see what would have happened for the ads you did not show, so the
        model inherits the logging policy's bias and stops exploring. The fix is
        exploration traffic or inverse propensity weighting.
      criteria:
        - id: loop
          label: "identifies the feedback loop from the logging policy"
          weight: 3
          patterns: ["feedback|loop|policy|only see|selective|logged"]
        - id: explore
          label: "reserves exploration traffic or uses propensity weighting"
          weight: 3
          patterns: ["explor|epsilon|propensity|inverse|random traffic"]
        - id: drift
          label: "monitors calibration drift as the auction changes"
          weight: 1
          patterns: ["drift|calibrat|monitor|recalibrat|shift"]
- id: iv-ml-credit-risk
  kind: ml_system
  level: mid
  title: "Put a credit risk model into production"
  prompt: >-
    A lender wants a model that decides loan approvals. Design the system, the
    model, and the monitoring.
  reference_topics: [logistic-regression, model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "What are the regulatory and fairness constraints?"
      intent: >-
        In lending, explainability and adverse action reasons are legal
        requirements, not preferences.
      hint: >-
        Ask whether the lender must give a reason for a decline and whether the
        model must be explainable to a regulator. That constrains you to
        interpretable models or explanations with validated fidelity.
      criteria:
        - id: regulatory
          label: "asks about explainability and adverse action requirements"
          weight: 3
          patterns: ["regulat|explain|adverse action|reason|audit"]
        - id: fairness
          label: "asks about protected attributes and fairness testing"
          weight: 2
          patterns: ["fair|protected|discriminat|bias|group"]
        - id: horizon
          label: "asks the default horizon and label definition"
          weight: 2
          patterns: ["default|horizon|90 days|label|delinquen"]
    - id: core
      question: "Which model, and how do you set the threshold?"
      intent: >-
        Expect a regularised logistic regression or a monotonic GBDT, with a
        threshold from the expected-cost calculation.
      hint: >-
        The threshold is an economics decision: approve when expected profit
        exceeds expected loss. Choosing a threshold by accuracy is the classic
        error.
      criteria:
        - id: model
          label: "an interpretable model, or a constrained GBDT with explanations"
          weight: 2
          patterns: ["logistic|gbdt|monotonic|interpret|scorecard"]
        - id: threshold
          label: "threshold derived from expected cost or profit"
          weight: 3
          patterns: ["threshold|expected loss|profit|cost|cut off"]
        - id: calibration
          label: "the probability must be calibrated to price the loan"
          weight: 2
          patterns: ["calibrat|probability|odds|pd|reliab"]
    - id: scale
      question: "The default rate doubles in a recession. How does your system notice, and what does it do?"
      intent: >-
        Probes label delay and the difference between input drift and outcome
        drift.
      hint: >-
        Defaults take months to mature, so outcome monitoring lags. You watch
        early indicators — delinquency, input distributions, approval mix — and
        have a pre-agreed policy for tightening thresholds rather than retraining
        blindly.
      criteria:
        - id: delay
          label: "names the label delay as the core monitoring problem"
          weight: 3
          patterns: ["delay|mature|months|later|lag"]
        - id: early
          label: "uses early indicators or input drift as a proxy"
          weight: 2
          patterns: ["early|delinquen|input drift|proxy|leading"]
        - id: policy
          label: "has a pre-agreed action: tighten thresholds, do not silently retrain"
          weight: 2
          patterns: ["tighten|policy|action|threshold|manual review"]
- id: iv-ml-churn
  kind: ml_system
  level: junior
  title: "Build a churn prediction model"
  prompt: >-
    Build a model that predicts which subscribers will cancel next month, so
    the retention team can intervene.
  reference_topics: [logistic-regression, imbalanced-data, model-evaluation]
  stages:
    - id: clarify
      question: "What is churn, and what will the team do with the prediction?"
      intent: >-
        The action determines the required precision and the useful horizon.
      hint: >-
        Ask how churn is defined — voluntary cancel, non-renewal, inactivity —
        and what the retention team can do. A prediction nobody can act on is a
        dashboard, not a model.
      criteria:
        - id: definition
          label: "asks how churn is defined"
          weight: 3
          patterns: ["cancel|non renewal|inactive|definition|what counts"]
        - id: action
          label: "asks what intervention the prediction enables"
          weight: 2
          patterns: ["action|intervene|offer|retention|campaign"]
        - id: horizon
          label: "asks the prediction horizon"
          weight: 2
          patterns: ["horizon|next month|30 days|window|when"]
    - id: core
      question: "Which features and which baseline?"
      intent: >-
        Expect a simple baseline first, and behavioural features over
        demographics.
      hint: >-
        Start with a logistic regression on usage features and beat it before
        reaching for a GBDT. The features that matter are trend features —
        declining logins, failed payments, support tickets — not demographics.
      criteria:
        - id: baseline
          label: "establishes a simple baseline first"
          weight: 2
          patterns: ["baseline|logistic|simple|start|benchmark"]
        - id: features
          label: "behavioural and trend features rather than demographics"
          weight: 3
          patterns: ["usage|login|trend|decline|support|payment fail"]
        - id: windows
          label: "defines feature windows without leaking the outcome"
          weight: 2
          patterns: ["window|leak|future|before the label|observation"]
    - id: scale
      question: "Precision is 0.2 at the threshold you chose. Is that good?"
      intent: >-
        Probes whether the candidate connects the metric to the base rate and the
        intervention budget.
      hint: >-
        With a five percent base rate, 0.2 precision is four times lift and may be
        excellent; what matters is how many true churners you catch within the
        team's capacity to act.
      criteria:
        - id: baserate
          label: "compares against the base rate or lift"
          weight: 3
          patterns: ["base rate|lift|prior|prevalence|compared to"]
        - id: capacity
          label: "ties the threshold to the intervention capacity"
          weight: 2
          patterns: ["capacity|budget|how many|top k|team can"]
        - id: tradeoff
          label: "discusses the precision-recall tradeoff explicitly"
          weight: 1
          patterns: ["precision|recall|tradeoff|threshold|curve"]
- id: iv-ml-demand-forecast
  kind: ml_system
  level: senior
  title: "Forecast demand across 50,000 SKUs"
  prompt: >-
    Design demand forecasting for a retailer: 50,000 products, daily forecasts,
    promotions and stockouts in the history.
  reference_topics: [time-series, gradient-boosting, model-evaluation]
  stages:
    - id: clarify
      question: "What decision does the forecast feed?"
      intent: >-
        Replenishment needs a distributional forecast and asymmetric costs, not a
        point estimate.
      hint: >-
        Ask whether the forecast drives ordering, staffing or pricing. Ordering
        needs a quantile because understocking and overstocking cost differently,
        so a mean forecast is the wrong target.
      criteria:
        - id: decision
          label: "asks what decision the forecast feeds"
          weight: 3
          patterns: ["replenish|order|staff|pricing|inventory|decision"]
        - id: asymmetry
          label: "raises asymmetric costs of over and under forecasting"
          weight: 3
          patterns: ["asymmetr|understock|overstock|stockout|cost of"]
        - id: horizon
          label: "asks the horizon and granularity"
          weight: 1
          patterns: ["horizon|daily|weekly|granularity|how far"]
    - id: core
      question: "Which model, and how do you handle 50,000 intermittent series?"
      intent: >-
        Expect a global model with covariates rather than 50,000 per-series fits.
      hint: >-
        Per-series models cannot learn across products and fail on the long tail
        of intermittent sellers. A single global model with product embeddings and
        calendar features shares strength.
      criteria:
        - id: global
          label: "a global model across series rather than one per SKU"
          weight: 3
          patterns: ["global|pooled|cross learning|single model|shared"]
        - id: covariates
          label: "calendar, price and promotion covariates"
          weight: 2
          patterns: ["calendar|holiday|price|promotion|event"]
        - id: intermittent
          label: "handles intermittent or zero-inflated demand"
          weight: 2
          patterns: ["intermittent|zero|sparse|croston|long tail"]
    - id: scale
      question: "Promotions and stockouts corrupt your history. What do you do about it?"
      intent: >-
        Probes causal correction: stockouts censor demand, promotions inflate it.
      hint: >-
        A stockout means the demand you observed is a lower bound, not the demand
        that existed. You either exclude those periods, model censoring, or
        reconstruct lost sales, and you flag promotion periods explicitly.
      criteria:
        - id: censoring
          label: "recognises stockouts censor demand"
          weight: 3
          patterns: ["censor|lower bound|lost sales|unobserved|stockout"]
        - id: promo
          label: "separates promotional lift from baseline"
          weight: 2
          patterns: ["promotion|lift|baseline|flag|dummy"]
        - id: eval
          label: "evaluates on a period with clean history, or with backtesting"
          weight: 1
          patterns: ["backtest|holdout|clean|evaluate|rolling"]
- id: iv-ml-eta
  kind: ml_system
  level: mid
  title: "Predict delivery ETA"
  prompt: >-
    Predict the arrival time of a food delivery order at the moment it is
    placed, and keep updating it as the order progresses.
  reference_topics: [time-series, gradient-boosting, feature-engineering-leakage]
  stages:
    - id: clarify
      question: "What is the target, and when is it known?"
      intent: >-
        The target is a duration with a censoring problem, and the prediction time
        defines which features are legal.
      hint: >-
        Ask whether you predict total duration or remaining time, and at which
        moment. Features must be those available at that moment; restaurant prep
        time observed later is leakage.
      criteria:
        - id: target
          label: "asks whether the target is total or remaining duration"
          weight: 3
          patterns: ["remaining|total|duration|time to|target"]
        - id: moment
          label: "pins the prediction moment and the features available then"
          weight: 3
          patterns: ["at order|at placement|moment|available|when"]
        - id: leakage
          label: "raises leakage from post-hoc information"
          weight: 2
          patterns: ["leak|future|not known|after the fact|post hoc"]
    - id: core
      question: "How do you model the components of the trip?"
      intent: >-
        Expect decomposition into prep, pickup and travel, or a single model with
        component features.
      hint: >-
        Decomposing into restaurant prep, courier pickup and travel lets you use
        different signals for each, and makes the error diagnosable. A single
        black-box regression hides which leg is wrong.
      criteria:
        - id: decompose
          label: "decomposes prep, pickup and travel"
          weight: 3
          patterns: ["prep|pickup|travel|leg|component|decompos"]
        - id: model
          label: "a gradient-boosted or comparable model on those features"
          weight: 2
          patterns: ["gradient boost|gbdt|xgboost|lightgbm|regression|model"]
        - id: traffic
          label: "uses traffic and time-of-day signal for travel"
          weight: 1
          patterns: ["traffic|time of day|rush|route|distance"]
    - id: scale
      question: "How do you report accuracy, given that a late order matters far more than an early one?"
      intent: >-
        Probes quantile loss and asymmetric evaluation rather than MAE.
      hint: >-
        MAE treats early and late equally, which is wrong for a promise. Predict a
        quantile or evaluate the percentage of orders later than promised.
      criteria:
        - id: asymmetric
          label: "uses an asymmetric or quantile objective"
          weight: 3
          patterns: ["quantile|asymmetr|pinball|late|penalty"]
        - id: metric
          label: "reports the share of orders later than promised"
          weight: 2
          patterns: ["late|promise|percent|share|breach"]
        - id: update
          label: "updates the estimate as the order progresses"
          weight: 1
          patterns: ["update|recompute|as it progresses|live|refresh"]
- id: iv-ml-moderation
  kind: ml_system
  level: staff
  title: "Design content moderation at scale"
  prompt: >-
    Design moderation for a platform with 500M daily posts: text, images and
    video, with a small human review team and legal obligations.
  reference_topics: [multimodal-fusion, model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "What are the policy categories, and what is the cost of each error?"
      intent: >-
        Moderation is a cost-asymmetry problem with legal categories, not a
        single accuracy number.
      hint: >-
        Ask for the policy taxonomy and the cost of a false negative versus a false
        positive per category. Child safety and spam live at opposite ends of that
        tradeoff.
      criteria:
        - id: policy
          label: "asks for the policy categories and their definitions"
          weight: 3
          patterns: ["policy|categor|taxonomy|definition|class"]
        - id: cost
          label: "asks the cost asymmetry per category"
          weight: 3
          patterns: ["false positive|false negative|cost|asymmetr|harm"]
        - id: legal
          label: "identifies legal or regulatory reporting obligations"
          weight: 2
          patterns: ["legal|regulat|report|law|compliance"]
    - id: core
      question: "Describe the classification stack and the human in the loop."
      intent: >-
        Expect a cascade: cheap classifiers for everything, expensive models for
        the ambiguous band, humans for the rest.
      hint: >-
        No single model is affordable at 500M posts a day, so you cascade: a cheap
        first-pass classifier, a heavier multimodal model on the uncertain band,
        and human review where the model is unsure or the consequence is severe.
      criteria:
        - id: cascade
          label: "a cascade of models by cost and confidence"
          weight: 3
          patterns: ["cascade|tier|first pass|second stage|cheap|expensive"]
        - id: multimodal
          label: "separate handling for text, image and video"
          weight: 2
          patterns: ["text|image|video|multimodal|audio"]
        - id: human
          label: "human review for the ambiguous band, with a queue and SLA"
          weight: 2
          patterns: ["human|review|queue|escalat|manual"]
    - id: scale
      question: "Your false positive rate is one percent. Why is that a disaster?"
      intent: >-
        Probes the arithmetic of 500M posts and the experience of wrongful
        removal.
      hint: >-
        One percent of 500M is five million wrongly actioned posts a day, which is
        both a user revolt and a regulatory event. The threshold must come from
        the harm of each error, not from an aggregate rate.
      criteria:
        - id: arithmetic
          label: "multiplies the rate by volume"
          weight: 3
          patterns: ["million|500|volume|per day|arithmetic"]
        - id: threshold
          label: "sets thresholds per category from error costs"
          weight: 2
          patterns: ["threshold|per category|cost|calibrat"]
        - id: appeal
          label: "an appeal or restoration path for wrongful actions"
          weight: 2
          patterns: ["appeal|restore|revers|contest|review"]
- id: iv-ml-spam-adversarial
  kind: ml_system
  level: senior
  title: "Defend against adversarial spam"
  prompt: >-
    Design spam detection for a messaging platform where attackers adapt
    weekly and false positives silence real users.
  reference_topics: [imbalanced-data, model-evaluation, feature-engineering-leakage]
  stages:
    - id: clarify
      question: "Who is the adversary, and what do they control?"
      intent: >-
        The candidate must model the attacker's levers: accounts, content,
        timing, and the feedback they get from your detector.
      hint: >-
        Attackers can create accounts, vary text, and probe your filter until
        something passes. Ask what they control and whether they see your
        decisions, because that determines whether the problem is supervised
        classification at all.
      criteria:
        - id: adversary
          label: "asks what the attacker controls"
          weight: 3
          patterns: ["attacker|adversar|control|create accounts|probe"]
        - id: feedback
          label: "considers whether attackers observe your decisions"
          weight: 2
          patterns: ["feedback|observe|learn|probe|adapt"]
        - id: cost
          label: "asks the cost of blocking a legitimate user"
          weight: 2
          patterns: ["false positive|legitimate|silenc|cost|block"]
    - id: core
      question: "What features survive an adversary who reads your last model?"
      intent: >-
        Probes graph and behavioural features, which are expensive to fake.
      hint: >-
        Text features are cheap to change; account age, graph structure, device
        fingerprints and sending velocity are not. The durable signal is behaviour
        and relationships, not keywords.
      criteria:
        - id: graph
          label: "graph and relationship features"
          weight: 3
          patterns: ["graph|network|neighbour|neighbor|cluster|link"]
        - id: behaviour
          label: "behavioural features: velocity, device, account age"
          weight: 3
          patterns: ["velocity|device|account age|behaviour|behavior|rate"]
        - id: text
          label: "acknowledges text features are the easiest to evade"
          weight: 2
          patterns: ["text|keyword|evade|easy|change|paraphras"]
    - id: scale
      question: "Your detector blocks a campaign and the next one is written to evade it. What is the process?"
      intent: >-
        Probes the operational loop: fast retraining, analyst feedback, and
        defence in depth.
      hint: >-
        The answer is a loop, not a model: analyst labels feed a fast retrain, and
        you layer cheap rules, rate limits and identity checks so a model bypass
        is not a free pass.
      criteria:
        - id: loop
          label: "a fast retraining loop fed by analyst labels"
          weight: 3
          patterns: ["retrain|loop|label|analyst|fast|daily"]
        - id: layers
          label: "defence in depth: rules, rate limits, identity checks"
          weight: 3
          patterns: ["layer|rule|rate limit|identity|defence|defense"]
        - id: monitor
          label: "monitors precision on a human-audited sample"
          weight: 1
          patterns: ["precision|audit|sample|review|monitor"]
- id: iv-ml-cold-start
  kind: ml_system
  level: mid
  title: "Solve recommendation cold start"
  prompt: >-
    A new user opens the app with no history, and a new creator has no
    engagement data. What do you show and how do you learn?
  reference_topics: [contrastive-learning-clip, clustering, cs-tiktok-recommendation]
  stages:
    - id: clarify
      question: "What signal exists for a brand-new user?"
      intent: >-
        Context is not history: device, locale, time, and referral source are
        available immediately.
      hint: >-
        Ask what is known at first launch: locale, device, install source,
        approximate location, and the onboarding choices. Those are weaker than
        history but far better than nothing.
      criteria:
        - id: context
          label: "names context signals available at first launch"
          weight: 3
          patterns: ["locale|device|location|install|referral|context"]
        - id: onboarding
          label: "asks about onboarding preference capture"
          weight: 2
          patterns: ["onboarding|interest|picks|survey|selection"]
        - id: exploration
          label: "treats the first sessions as exploration"
          weight: 1
          patterns: ["explor|learn|first session|bandit|diversity"]
    - id: core
      question: "How do you rank items with no interaction history?"
      intent: >-
        Expect content-based similarity and popularity priors, blended with
        exploration.
      hint: >-
        Use content embeddings so a new item can be scored by similarity to
        things the user has engaged with, and fall back to demographic or
        popularity priors with forced exploration.
      criteria:
        - id: content
          label: "content or metadata embeddings for new items"
          weight: 3
          patterns: ["content|metadata|embedding|similarity|text|image"]
        - id: prior
          label: "popularity or cohort priors as a fallback"
          weight: 2
          patterns: ["popularity|prior|cohort|demographic|fallback"]
        - id: explore
          label: "explicit exploration to gather signal"
          weight: 2
          patterns: ["explor|bandit|thompson|epsilon|diversity"]
    - id: scale
      question: "How do you know cold start is working, when those users are a small slice?"
      intent: >-
        Probes slicing and the metric that matters: early retention, not CTR.
      hint: >-
        Measure retention in the first sessions by cohort, not aggregate CTR; new
        users are a small slice, so an aggregate improvement can hide a
        regression that costs you the cohort forever.
      criteria:
        - id: slice
          label: "evaluates on the cold-start cohort specifically"
          weight: 3
          patterns: ["cohort|slice|new user|segment|cold"]
        - id: retention
          label: "uses early retention rather than click rate"
          weight: 3
          patterns: ["retention|return|d1|day 1|churn"]
        - id: size
          label: "notes the statistical power problem of a small cohort"
          weight: 1
          patterns: ["power|sample size|small|significan|variance"]
- id: iv-ml-vector-search
  kind: ml_system
  level: senior
  title: "Choose a vector index for a billion embeddings"
  prompt: >-
    You have one billion 768-dimensional embeddings and need top-100 search in
    20 ms with high recall. Choose and justify the index.
  reference_topics: [knn-curse-dimensionality, vectors-and-geometry, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "What recall do you actually need, and what is the update rate?"
      intent: >-
        Recall and mutation rate decide between graph, IVF, and quantised indexes.
      hint: >-
        Ask for the recall target and whether the corpus is mostly static. A
        read-only index can be heavily quantised and rebuilt; a constantly
        updated one cannot.
      criteria:
        - id: recall
          label: "asks the recall target rather than assuming exact search"
          weight: 3
          patterns: ["recall|exact|approximate|accuracy|how good"]
        - id: updates
          label: "asks the insert and delete rate"
          weight: 3
          patterns: ["update|insert|delete|mutation|churn|static"]
        - id: memory
          label: "asks the memory budget"
          weight: 1
          patterns: ["memory|ram|budget|gb|cost"]
    - id: core
      question: "Compare HNSW and IVF-PQ for this workload."
      intent: >-
        Expect graph for recall and latency, IVF-PQ for memory, and the tradeoff
        stated.
      hint: >-
        HNSW gives the best recall at low latency but costs memory for the graph;
        IVF-PQ compresses vectors hard and loses recall. At a billion points the
        memory bill usually decides.
      criteria:
        - id: hnsw
          label: "HNSW graph, with its memory cost"
          weight: 3
          patterns: ["hnsw|graph|navigable|memory|edges"]
        - id: ivfpq
          label: "IVF with product quantisation, with its recall loss"
          weight: 3
          patterns: ["ivf|pq|product quantis|product quantiz|cluster|compress"]
        - id: tradeoff
          label: "states the explicit memory against recall tradeoff"
          weight: 2
          patterns: ["tradeoff|memory|recall|latency|versus|vs"]
    - id: scale
      question: "How do you serve this across machines and keep recall honest?"
      intent: >-
        Probes sharding strategy and measuring recall against exact search.
      hint: >-
        Shard by vector id and merge top-k across shards; measure recall at k on a
        held-out set against exact search, because an ANN index silently returns
        worse neighbours as the data drifts.
      criteria:
        - id: shard
          label: "shards by vector id with a merge of top-k"
          weight: 2
          patterns: ["shard|partition|merge|top k|fan out"]
        - id: measure
          label: "measures recall against exact search on a sample"
          weight: 3
          patterns: ["recall|exact|ground truth|measure|sample"]
        - id: drift
          label: "reindexes or rebuilds as the distribution changes"
          weight: 1
          patterns: ["rebuild|reindex|drift|refresh|stale"]
- id: iv-ml-vector-sharding
  kind: ml_system
  level: staff
  title: "Operate a vector database at 10B vectors"
  prompt: >-
    Design the storage and replication layer for a vector database with ten
    billion vectors, frequent deletes, and strict freshness.
  reference_topics: [knn-curse-dimensionality, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "What does a delete mean, and how fresh must a query be?"
      intent: >-
        Deletes are the hard part of vector indexes; they cannot be done in place
        cheaply.
      hint: >-
        A graph index cannot remove a node without breaking its edges, so deletes
        are tombstones plus periodic rebuild. Ask how fresh a query must be after
        an insert or delete.
      criteria:
        - id: delete
          label: "asks what deletion means semantically"
          weight: 3
          patterns: ["delete|remove|tombstone|rebuild|compact"]
        - id: freshness
          label: "asks the freshness requirement after a write"
          weight: 3
          patterns: ["fresh|visible|immediate|lag|seconds"]
        - id: consistency
          label: "asks whether a query may miss a just-written vector"
          weight: 1
          patterns: ["read your writes|miss|consisten|stale|eventual"]
    - id: core
      question: "How is a shard built and mutated?"
      intent: >-
        Expect immutable segments plus a mutable overlay, similar to an LSM.
      hint: >-
        The pattern is immutable indexed segments plus a small mutable buffer;
        queries scan the buffer and the segments, and compaction merges them. That
        is how you get inserts without rebuilding a billion-node graph.
      criteria:
        - id: segment
          label: "immutable segments with a mutable overlay"
          weight: 3
          patterns: ["segment|immutable|overlay|buffer|lsm"]
        - id: compact
          label: "compaction merges segments and drops tombstones"
          weight: 2
          patterns: ["compact|merge|rebuild|drop tombstone|garbage"]
        - id: query
          label: "queries scan the overlay and merge results"
          weight: 2
          patterns: ["scan|merge|both|overlay|union"]
    - id: scale
      question: "A compaction runs while serving queries. What does a user see?"
      intent: >-
        Probes resource isolation and latency spikes during maintenance.
      hint: >-
        Compaction competes for IO and CPU, so p99 spikes unless it is throttled
        and run against a replica. Users should not be able to tell that
        maintenance happened.
      criteria:
        - id: throttle
          label: "throttles compaction against a latency signal"
          weight: 3
          patterns: ["throttle|limit|background|low priority|pace"]
        - id: replica
          label: "runs maintenance on a replica or off the serving path"
          weight: 2
          patterns: ["replica|offline|separate|shadow|drain"]
        - id: spike
          label: "expects and monitors the p99 spike"
          weight: 1
          patterns: ["p99|spike|latency|monitor|tail"]
- id: iv-ml-model-registry
  kind: ml_system
  level: mid
  title: "Design a model registry and release process"
  prompt: >-
    Design how a trained model becomes a served model: versioning, promotion,
    rollback, and reproducibility.
  reference_topics: [randomness-and-reproducibility, model-serving]
  stages:
    - id: clarify
      question: "What must be reproducible about a model?"
      intent: >-
        The artefact is weights plus code plus data plus config, not a pickle.
      hint: >-
        Ask whether you must reproduce a prediction from six months ago. That
        forces you to version the code, the feature definitions, and the
        preprocessing, not just the weights.
      criteria:
        - id: reproduce
          label: "asks what must be reproducible later"
          weight: 3
          patterns: ["reproduc|audit|six months|predict|historic"]
        - id: artefact
          label: "asks what an artefact contains beyond weights"
          weight: 2
          patterns: ["preprocess|tokenis|tokeniz|code|config|environment"]
        - id: approval
          label: "asks who approves a promotion to production"
          weight: 1
          patterns: ["approv|sign off|who|review|gate"]
    - id: core
      question: "Describe the lifecycle from a training run to production traffic."
      intent: >-
        Expect a registry with immutable versions, staged promotion, and a
        recorded evaluation.
      hint: >-
        Each run registers an immutable version with its metrics, data snapshot
        and code commit; promotion moves it through staging and canary with the
        evidence attached. A mutable model path is how you lose track of what is
        serving.
      criteria:
        - id: immutable
          label: "immutable versioned artefacts"
          weight: 3
          patterns: ["immutable|version|hash|artifact|snapshot"]
        - id: metadata
          label: "metrics, data snapshot and code commit stored with the model"
          weight: 3
          patterns: ["metric|commit|data snapshot|lineage|metadata"]
        - id: stage
          label: "staged promotion through staging and canary"
          weight: 2
          patterns: ["staging|canary|promote|stage|rollout"]
    - id: scale
      question: "A model in production is producing bad predictions. Walk me through the rollback."
      intent: >-
        Probes detection, the rollback mechanism, and whether rollback is fast and
        rehearsed.
      hint: >-
        Rollback must be a pointer change to the previous immutable version,
        measured in seconds, and it must also revert the feature pipeline if the
        regression came from data rather than weights.
      criteria:
        - id: pointer
          label: "rollback by repointing to the previous version"
          weight: 3
          patterns: ["pointer|repoint|swap|previous version|instant"]
        - id: speed
          label: "states the rollback time target"
          weight: 2
          patterns: ["seconds|minutes|fast|target|sla"]
        - id: data
          label: "considers that the cause may be data or features, not the model"
          weight: 2
          patterns: ["data|feature|pipeline|upstream|not the model"]
- id: iv-ml-ab-platform
  kind: ml_system
  level: senior
  title: "Design an experimentation platform"
  prompt: >-
    Design the A/B platform used by 200 teams: assignment, guardrail metrics,
    and the discipline to stop a bad test early.
  reference_topics: [model-evaluation, probability-distributions]
  stages:
    - id: clarify
      question: "What is the randomisation unit, and what is the metric of record?"
      intent: >-
        Unit choice determines contamination, and the metric must be agreed before
        the test.
      hint: >-
        Ask whether you randomise by user, session, or device. Randomising at the
        wrong unit leaks treatment across arms and inflates false positives.
      criteria:
        - id: unit
          label: "asks the randomisation unit and why"
          weight: 3
          patterns: ["randomis|randomiz|unit|user|session|device"]
        - id: metric
          label: "asks the primary metric and its definition before launch"
          weight: 3
          patterns: ["primary metric|metric of record|definition|success|kpi"]
        - id: power
          label: "asks the expected effect size and required sample"
          weight: 2
          patterns: ["power|effect size|sample size|mde|duration"]
    - id: core
      question: "How is a user assigned, deterministically and consistently?"
      intent: >-
        Expect a hash of experiment key and unit id into buckets, with a stable
        salt.
      hint: >-
        Assignment is a hash of experiment id and unit id, so it is deterministic
        and needs no lookup. A random draw per request puts the same user in both
        arms.
      criteria:
        - id: hash
          label: "deterministic hashing of experiment key and unit id"
          weight: 3
          patterns: ["hash|deterministic|bucket|salt|consistent"]
        - id: stable
          label: "sticky assignment for the duration of the test"
          weight: 2
          patterns: ["sticky|stable|same arm|persist|consistent"]
        - id: exposure
          label: "logs exposure at the moment the treatment is applied"
          weight: 2
          patterns: ["exposure|log|when shown|trigger|assignment event"]
    - id: scale
      question: "A guardrail metric degrades after two days. Do you stop the test?"
      intent: >-
        Probes sequential testing and the multiple-comparisons trap of peeking.
      hint: >-
        Peeking at a fixed-horizon test inflates false positives, so if you want to
        stop early you must use a sequential or Bayesian design that is valid under
        continuous monitoring.
      criteria:
        - id: peeking
          label: "names the peeking problem"
          weight: 3
          patterns: ["peek|look|multiple comparison|alpha|false positive|inflate"]
        - id: sequential
          label: "uses a sequential or always-valid method"
          weight: 3
          patterns: ["sequential|always valid|bayesian|group sequential|alpha spending"]
        - id: guardrail
          label: "distinguishes guardrail metrics from the primary metric"
          weight: 2
          patterns: ["guardrail|safety|secondary|primary|stop"]
- id: iv-ml-guardrail-metrics
  kind: ml_system
  level: staff
  title: "Choose guardrail metrics for a model launch"
  prompt: >-
    You are launching a new ranking model. Define the guardrail metrics that
    would make you stop the launch, and the thresholds.
  reference_topics: [model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "What could this model break that ranking metrics would not show?"
      intent: >-
        Guardrails exist to catch harms the primary metric is blind to.
      hint: >-
        A better ranker can raise engagement while degrading diversity,
        freshness, creator income, or latency. Guardrails name those second-order
        effects before the launch, not after.
      criteria:
        - id: blind
          label: "names harms the primary metric cannot see"
          weight: 3
          patterns: ["latency|diversity|freshness|fairness|revenue|creator"]
        - id: stakeholders
          label: "identifies who is affected beyond the user"
          weight: 2
          patterns: ["creator|seller|advertiser|stakeholder|supply"]
        - id: baseline
          label: "asks for the pre-launch baseline of each guardrail"
          weight: 1
          patterns: ["baseline|current|before|measure first|control"]
    - id: core
      question: "How do you set a threshold that is neither noise nor negligence?"
      intent: >-
        Thresholds come from historical variance and from the cost of the harm.
      hint: >-
        Derive the threshold from the metric's normal day-to-day variance plus the
        cost of the harm, and pre-register it. A threshold chosen after seeing the
        data is not a guardrail.
      criteria:
        - id: variance
          label: "uses historical variance to set the band"
          weight: 3
          patterns: ["variance|noise|standard deviation|historical|band"]
        - id: preregister
          label: "pre-registers thresholds before the launch"
          weight: 3
          patterns: ["pre register|before|written|agreed|upfront"]
        - id: cost
          label: "connects the threshold to the cost of the harm"
          weight: 2
          patterns: ["cost|harm|impact|severity|tolerate"]
    - id: scale
      question: "The primary metric is up four percent and one guardrail is down two. What now?"
      intent: >-
        Probes the judgement call and whether the candidate has a decision rule.
      hint: >-
        You need a pre-agreed rule — which metric is a hard stop and which is a
        tradeoff to escalate. Improvising under pressure is how guardrails get
        ignored.
      criteria:
        - id: rule
          label: "has a pre-agreed hard-stop versus tradeoff classification"
          weight: 3
          patterns: ["hard stop|block|tradeoff|escalat|rule"]
        - id: segment
          label: "checks whether the harm is concentrated in a segment"
          weight: 2
          patterns: ["segment|slice|cohort|concentrat|which users"]
        - id: ship
          label: "considers a partial rollout to bound the harm"
          weight: 1
          patterns: ["partial|percentage|rollback|bounded|hold"]
- id: iv-ml-online-eval
  kind: ml_system
  level: senior
  title: "Evaluate a model online without harming users"
  prompt: >-
    You cannot A/B test a risky change to a safety classifier on all traffic.
    Design the online evaluation.
  reference_topics: [model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "What is the risk, and who bears it?"
      intent: >-
        The design question is which population can safely carry the experiment.
      hint: >-
        Ask what the worst outcome is and whether any population can absorb it.
        If not, you evaluate offline plus shadow, and only then a small guarded
        slice.
      criteria:
        - id: risk
          label: "asks the worst-case harm and its reversibility"
          weight: 3
          patterns: ["harm|worst|risk|reversib|irreversib"]
        - id: population
          label: "asks which population can safely carry the test"
          weight: 2
          patterns: ["population|traffic|slice|which users|carry"]
        - id: ethics
          label: "raises consent or review for experiments on safety"
          weight: 1
          patterns: ["consent|review|ethic|committee|approval"]
    - id: core
      question: "Shadow, canary, or interleave? Choose."
      intent: >-
        Expect shadow for zero-user-impact measurement, then a small canary.
      hint: >-
        Shadow mode runs the new model on live traffic without acting on its
        output, which measures disagreement for free. A canary then exposes a tiny
        fraction with a kill switch.
      criteria:
        - id: shadow
          label: "shadow mode that logs predictions without acting"
          weight: 3
          patterns: ["shadow|log only|not act|observe|dark launch"]
        - id: canary
          label: "a small canary with a kill switch"
          weight: 2
          patterns: ["canary|small|percentage|kill switch|guard"]
        - id: disagreement
          label: "measures disagreement rate between old and new"
          weight: 2
          patterns: ["disagree|difference|compare|delta|flip"]
    - id: scale
      question: "Shadow shows a five percent disagreement. Is that good or bad?"
      intent: >-
        Probes whether the candidate asks which direction the disagreements go.
      hint: >-
        Disagreement alone says nothing. You need to know how many are new
        correct catches versus new false positives, which requires labels on a
        sample of the disagreements.
      criteria:
        - id: direction
          label: "asks which direction the disagreements go"
          weight: 3
          patterns: ["direction|which way|false positive|false negative|catch"]
        - id: label
          label: "labels a sample of the disagreements"
          weight: 3
          patterns: ["label|sample|review|adjudicat|audit"]
        - id: base
          label: "compares against the base rate of positives"
          weight: 1
          patterns: ["base rate|prevalence|how many|proportion|rate"]
- id: iv-ml-drift
  kind: ml_system
  level: senior
  title: "Detect and respond to model drift"
  prompt: >-
    Your production model's inputs are drifting. Design the monitoring and tell
    me what you would actually do about it.
  reference_topics: [model-evaluation, time-series, feature-engineering-leakage]
  stages:
    - id: clarify
      question: "Which drift matters: input, prediction, or outcome?"
      intent: >-
        The three are different signals with different detection lags.
      hint: >-
        Input drift is detectable immediately, prediction drift in a day, outcome
        drift only when labels arrive. Say which one you are monitoring and how
        fast it can be seen.
      criteria:
        - id: kinds
          label: "distinguishes input, prediction and outcome drift"
          weight: 3
          patterns: ["input|covariate|prediction|output|concept|label"]
        - id: lag
          label: "names the detection lag for each"
          weight: 2
          patterns: ["lag|delay|immediate|when labels|days"]
        - id: baseline
          label: "asks what the reference distribution is"
          weight: 2
          patterns: ["reference|baseline|training|window|compare to"]
    - id: core
      question: "How do you detect it, and how do you avoid alert fatigue?"
      intent: >-
        Expect a distribution test per feature plus a performance proxy, with
        thresholds tied to impact.
      hint: >-
        Per-feature tests such as PSI or KS catch shifts, but alerting on every
        feature produces noise. Alert on the features the model actually depends
        on, and on a performance proxy you can compute without labels.
      criteria:
        - id: test
          label: "a distribution test such as PSI, KS or KL"
          weight: 3
          patterns: ["psi|ks|kolmogorov|kl|divergence|chi square"]
        - id: importance
          label: "weights alerts by feature importance"
          weight: 3
          patterns: ["importance|impact|which feature|weight|contribution"]
        - id: proxy
          label: "a label-free performance proxy"
          weight: 2
          patterns: ["proxy|without labels|surrogate|confidence|calibrat"]
    - id: scale
      question: "Input drift is confirmed. Do you retrain?"
      intent: >-
        Probes the discipline not to retrain reflexively, and to check whether the
        drift is a pipeline bug.
      hint: >-
        First check whether it is a logging or pipeline bug rather than real
        drift, then whether the drift affects decisions. Retraining on a broken
        feature amplifies the problem.
      criteria:
        - id: bug
          label: "rules out a logging or pipeline bug first"
          weight: 3
          patterns: ["bug|pipeline|logging|upstream|schema|broken"]
        - id: impact
          label: "checks whether the drift changes decisions or performance"
          weight: 2
          patterns: ["decision|performance|impact|matter|affect"]
        - id: retrain
          label: "retrains with a backtest and a rollback plan, not blindly"
          weight: 2
          patterns: ["retrain|backtest|validate|rollback|shadow"]
- id: iv-ml-data-quality
  kind: ml_system
  level: mid
  title: "Guard training data quality"
  prompt: >-
    Design the checks that stop bad data from reaching a training run, given
    that 40 upstream teams emit tables you do not control.
  reference_topics: [feature-engineering-leakage, randomness-and-reproducibility]
  stages:
    - id: clarify
      question: "What does bad data look like here, and how would you know?"
      intent: >-
        The candidate must enumerate failure classes: schema, freshness, nulls,
        distribution, duplication, label errors.
      hint: >-
        Ask what failure modes have actually occurred before. Most teams know
        their top three and building checks from those beats a generic framework.
      criteria:
        - id: classes
          label: "enumerates failure classes: schema, nulls, freshness, distribution"
          weight: 3
          patterns: ["schema|null|fresh|distribution|duplicate|range"]
        - id: history
          label: "asks what has failed before"
          weight: 2
          patterns: ["before|previous|incident|history|happened"]
        - id: contract
          label: "asks whether upstream has a contract or SLA"
          weight: 1
          patterns: ["contract|sla|owner|guarantee|agreement"]
    - id: core
      question: "Where do the checks live, and what happens when one fails?"
      intent: >-
        Expect checks at the boundary, a hard gate before training, and a quarantine.
      hint: >-
        Checks at ingestion catch it once; checks in each consumer catch it
        everywhere. A failing check must block the training run, not log a warning
        nobody reads.
      criteria:
        - id: gate
          label: "a hard gate that blocks the training run"
          weight: 3
          patterns: ["gate|block|fail|stop|refuse"]
        - id: boundary
          label: "validation at the ingestion boundary and at the consumer"
          weight: 2
          patterns: ["ingest|boundary|upstream|consumer|both"]
        - id: quarantine
          label: "bad partitions quarantined rather than silently dropped"
          weight: 2
          patterns: ["quarantine|isolat|park|dead letter|hold"]
    - id: scale
      question: "A team ships a column with a new unit. How do you catch it before a model is trained?"
      intent: >-
        Probes statistical checks, not just schema checks, and the value of
        profiling.
      hint: >-
        Schema checks pass when a column changes from dollars to cents. Only a
        distribution or range check on the values catches it, which is why you
        profile every numeric column.
      criteria:
        - id: statistical
          label: "statistical checks on values, not just schema"
          weight: 3
          patterns: ["distribution|range|mean|quantile|profile|statistic"]
        - id: units
          label: "gives the units or magnitude example"
          weight: 2
          patterns: ["unit|magnitude|scale|dollars|cents|factor"]
        - id: alert
          label: "alerts the owning team, not just the training team"
          weight: 1
          patterns: ["owner|alert|notify|escalat|team"]
- id: iv-ml-labeling
  kind: ml_system
  level: mid
  title: "Design a labelling pipeline"
  prompt: >-
    You need 500k labelled examples for a new classifier. Design the labelling
    operation, its quality control, and its cost model.
  reference_topics: [model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "What accuracy does the label need, and what does an error cost?"
      intent: >-
        Label quality is a budget decision tied to the model's use.
      hint: >-
        Ask how accurate a label must be. Labels at 85 percent agreement cap your
        model's achievable quality, so spending on label quality is usually
        cheaper than spending on model capacity.
      criteria:
        - id: quality
          label: "asks the required label accuracy"
          weight: 3
          patterns: ["accuracy|agreement|quality|how good|error rate"]
        - id: cost
          label: "asks the cost per label and the total budget"
          weight: 2
          patterns: ["cost|budget|price|per label|total"]
        - id: use
          label: "asks how the model will be used, to judge the needed quality"
          weight: 1
          patterns: ["use|downstream|decision|risk|impact"]
    - id: core
      question: "How do you keep labelers consistent with each other?"
      intent: >-
        Expect a guideline, gold questions, overlap, and measured agreement.
      hint: >-
        A written guideline plus gold questions embedded in the queue plus
        overlapping assignments gives you inter-annotator agreement, which is the
        only evidence the labels mean anything.
      criteria:
        - id: guideline
          label: "a written guideline with examples and edge cases"
          weight: 2
          patterns: ["guideline|rubric|example|edge case|definition"]
        - id: overlap
          label: "overlapping assignments to measure agreement"
          weight: 3
          patterns: ["overlap|redundant|double label|agreement|kappa"]
        - id: gold
          label: "gold questions to detect drift in a labeler"
          weight: 2
          patterns: ["gold|seed|known answer|audit|test question"]
    - id: scale
      question: "Halfway through, agreement drops from 0.9 to 0.6. What happened and what do you do?"
      intent: >-
        Probes the diagnosis: guideline ambiguity, task drift, or a bad batch.
      hint: >-
        A drop in agreement usually means the guideline does not cover a case the
        data started producing. You inspect the disagreements, amend the
        guideline, and relabel the affected batch.
      criteria:
        - id: inspect
          label: "inspects the disagreement set directly"
          weight: 3
          patterns: ["inspect|review|look at|disagree|sample"]
        - id: ambiguity
          label: "suspects guideline ambiguity or a new data case"
          weight: 3
          patterns: ["ambigu|guideline|unclear|new case|edge"]
        - id: relabel
          label: "amends the guideline and relabels the affected batch"
          weight: 1
          patterns: ["amend|update|relabel|rework|fix"]
- id: iv-ml-active-learning
  kind: ml_system
  level: senior
  title: "Design an active learning loop"
  prompt: >-
    Labelling is expensive and you have a stream of unlabelled data. Design the
    loop that picks what to label next.
  reference_topics: [model-evaluation, imbalanced-data]
  stages:
    - id: clarify
      question: "What is the labelling budget, and what does the model do with uncertainty?"
      intent: >-
        Active learning only pays if the selection is better than random and the
        budget is binding.
      hint: >-
        Ask how many labels per week the team can produce. If the budget is not
        binding, active learning is a distraction; if it is, selection quality is
        the whole return.
      criteria:
        - id: budget
          label: "asks the labelling budget per cycle"
          weight: 3
          patterns: ["budget|per week|how many|capacity|labels"]
        - id: goal
          label: "asks what the model is for and which errors matter"
          weight: 2
          patterns: ["goal|error|use|decision|which mistakes"]
        - id: pool
          label: "asks whether the unlabelled pool is representative"
          weight: 1
          patterns: ["pool|represent|unlabelled|unlabeled|stream"]
    - id: core
      question: "Which acquisition function, and why not just take the most uncertain?"
      intent: >-
        Expect uncertainty plus diversity, and awareness of the bias uncertainty
        sampling introduces.
      hint: >-
        Pure uncertainty sampling picks clusters of near-duplicates and ignores
        the decision boundary in regions the model is confidently wrong about.
        Diversity or core-set selection fixes the redundancy.
      criteria:
        - id: uncertainty
          label: "uncertainty or entropy as one signal"
          weight: 2
          patterns: ["uncertain|entropy|margin|confidence|probability"]
        - id: diversity
          label: "diversity or core-set selection"
          weight: 3
          patterns: ["divers|core set|cluster|coverage|redundan"]
        - id: bias
          label: "notes that the selected set becomes a biased training distribution"
          weight: 3
          patterns: ["bias|distribution|skew|not represent|shift"]
    - id: scale
      question: "After three rounds the model stops improving. What went wrong?"
      intent: >-
        Probes the classic failure: the loop only samples one region and the
        labels stop being informative.
      hint: >-
        The loop has collapsed onto one region, so the model sees only what it is
        already unsure about. You need a random sample in the mix to keep the
        distribution honest and to detect regressions elsewhere.
      criteria:
        - id: collapse
          label: "identifies selection collapse into one region"
          weight: 3
          patterns: ["collapse|same region|narrow|concentrat|only"]
        - id: random
          label: "mixes in random samples to keep coverage"
          weight: 3
          patterns: ["random|uniform|baseline sample|mix|explor"]
        - id: eval
          label: "holds out a fixed evaluation set that is never selected from"
          weight: 1
          patterns: ["holdout|evaluation set|fixed|separate|never train"]
- id: iv-ml-sft-pipeline
  kind: ml_system
  level: senior
  title: "Build a supervised fine-tuning pipeline"
  prompt: >-
    Design the pipeline that turns raw product logs into a fine-tuned assistant,
    run monthly, with a reproducible result.
  reference_topics: [fine-tuning-lora, pretraining-objectives, randomness-and-reproducibility]
  stages:
    - id: clarify
      question: "What data is allowed into training, and what must be excluded?"
      intent: >-
        PII, licensed content and user consent are constraints before any modelling.
      hint: >-
        Ask what cannot be trained on: personal data, deleted content, licensed
        corpora. A pipeline that cannot answer this is a legal incident waiting for
        a launch.
      criteria:
        - id: pii
          label: "asks about PII and deletion obligations"
          weight: 3
          patterns: ["pii|personal|delete|consent|privacy|redact"]
        - id: licence
          label: "asks about licensing of the source data"
          weight: 2
          patterns: ["licen|terms|copyright|permitted|contract"]
        - id: quality
          label: "asks what makes an example good"
          weight: 2
          patterns: ["quality|good|filter|curat|criteria"]
    - id: core
      question: "Walk from raw logs to a training mixture."
      intent: >-
        Expect filtering, deduplication, conversion to the chat format, and a
        deliberate mixture with weights.
      hint: >-
        The mixture is the model's behaviour. You need dedup, quality filtering,
        and explicit weights per task type, all recorded so the run is
        reproducible.
      criteria:
        - id: dedup
          label: "deduplication at document or example level"
          weight: 2
          patterns: ["dedup|duplicate|near duplicate|minhash|hash"]
        - id: format
          label: "conversion to a chat or instruction format with a template"
          weight: 2
          patterns: ["chat template|format|instruction|prompt|response"]
        - id: mixture
          label: "explicit task mixture weights"
          weight: 3
          patterns: ["mixture|weight|proportion|ratio|sampling"]
    - id: scale
      question: "The model gets better on the training distribution and worse on general chat. Why?"
      intent: >-
        Probes catastrophic forgetting and the need for replay or a data mix.
      hint: >-
        Narrow fine-tuning overwrites general capability. The fix is a mixture that
        keeps a share of general instruction data, plus evaluation on the general
        benchmarks you care about.
      criteria:
        - id: forgetting
          label: "names catastrophic forgetting"
          weight: 3
          patterns: ["forget|catastroph|overfit|narrow|degrad"]
        - id: replay
          label: "replays general instruction data in the mixture"
          weight: 3
          patterns: ["replay|general data|mix|retain|include"]
        - id: eval
          label: "evaluates on general benchmarks alongside the target task"
          weight: 1
          patterns: ["benchmark|general|regression|both|evaluate"]
- id: iv-ml-rlhf-platform
  kind: ml_system
  level: staff
  title: "Design a preference data and RLHF platform"
  prompt: >-
    Design the platform that collects human preferences and runs alignment
    training: data collection, reward modelling, and the training loop.
  reference_topics: [preference-optimisation, fine-tuning-lora, model-evaluation]
  stages:
    - id: clarify
      question: "What behaviour are you trying to change, and how will you know it changed?"
      intent: >-
        The candidate must define the target behaviour and its measurement before
        designing the loop.
      hint: >-
        Ask which behaviour is misaligned and what a win looks like, because RLHF
        optimises whatever the raters reward, including things you did not intend.
      criteria:
        - id: behaviour
          label: "asks which behaviour is the target"
          weight: 3
          patterns: ["behaviour|behavior|target|harmful|helpful|what change"]
        - id: measure
          label: "asks how the improvement is measured"
          weight: 2
          patterns: ["measure|evaluate|win rate|benchmark|judge"]
        - id: rater
          label: "asks who the raters are and how they are trained"
          weight: 2
          patterns: ["rater|annotator|human|contractor|guideline"]
    - id: core
      question: "Reward model plus PPO, or DPO? What are the failure modes of each?"
      intent: >-
        Expect awareness of reward hacking and of DPO's off-policy limitations.
      hint: >-
        A learned reward model can be gamed, which is reward hacking; DPO avoids
        the reward model but is sensitive to preference data quality and can
        overfit the chosen responses.
      criteria:
        - id: reward
          label: "a reward model trained on pairwise preferences"
          weight: 3
          patterns: ["reward model|rm|pairwise|preference|bradley terry"]
        - id: hacking
          label: "names reward hacking and the KL constraint"
          weight: 3
          patterns: ["hack|game|exploit|kl|penalty|divergence"]
        - id: dpo
          label: "compares with DPO or a direct preference objective"
          weight: 2
          patterns: ["dpo|direct preference|ipo|kto|orpo"]
    - id: scale
      question: "The reward model scores 0.9 on your test set but the policy gets worse. What happened?"
      intent: >-
        Probes distribution shift between reward-model training and policy outputs.
      hint: >-
        The policy moved off the reward model's training distribution, so the RM is
        extrapolating. You need fresh preferences on policy samples each round, not
        a frozen RM.
      criteria:
        - id: shift
          label: "identifies distribution shift in the reward model"
          weight: 3
          patterns: ["distribution|shift|off policy|extrapolat|unseen"]
        - id: refresh
          label: "collects fresh preferences on current policy outputs"
          weight: 3
          patterns: ["refresh|new data|current policy|recollect|iterat"]
        - id: guard
          label: "holds a fixed human evaluation as the real arbiter"
          weight: 1
          patterns: ["human eval|holdout|arbiter|manual|independent"]
- id: iv-ml-llm-eval
  kind: ml_system
  level: staff
  title: "Build an evaluation harness for an LLM product"
  prompt: >-
    Design the evaluation suite that decides whether a new model version ships
    for a customer-support assistant.
  reference_topics: [model-evaluation, information-theory, imbalanced-data]
  stages:
    - id: clarify
      question: "What does a good answer look like for this product?"
      intent: >-
        The rubric is product-specific: correctness, policy compliance, tone, and
        escalation behaviour.
      hint: >-
        Ask what the support team considers a good interaction, including when the
        assistant should escalate to a human. Escalation is a first-class outcome,
        not a failure.
      criteria:
        - id: rubric
          label: "asks for the dimensions of a good answer"
          weight: 3
          patterns: ["rubric|dimension|correct|tone|policy|criteria"]
        - id: escalation
          label: "treats escalation to a human as an outcome"
          weight: 2
          patterns: ["escalat|hand off|human|refuse|transfer"]
        - id: harm
          label: "asks which errors are unacceptable"
          weight: 2
          patterns: ["unacceptable|harm|critical|must not|severity"]
    - id: core
      question: "How do you build a suite that stays honest as the model changes?"
      intent: >-
        Expect a versioned dataset, per-dimension scoring, and contamination
        control.
      hint: >-
        A fixed, versioned evaluation set with per-dimension scores and a private
        holdout prevents both silent regressions and training on the test set.
      criteria:
        - id: versioned
          label: "versioned evaluation data with change history"
          weight: 2
          patterns: ["version|dataset|change|history|maintain"]
        - id: perdim
          label: "per-dimension scoring rather than one number"
          weight: 3
          patterns: ["per dimension|separate|breakdown|each|axis"]
        - id: holdout
          label: "a private holdout to prevent contamination"
          weight: 3
          patterns: ["holdout|private|contaminat|not shared|leak"]
    - id: scale
      question: "The suite passes, but users complain. What is missing?"
      intent: >-
        Probes coverage of real traffic and the difference between benchmark and
        product.
      hint: >-
        The suite covers what you thought of, not what users do. You need samples
        drawn from real traffic, including the long tail, and a process to turn
        complaints into cases.
      criteria:
        - id: traffic
          label: "samples from real traffic, not synthetic only"
          weight: 3
          patterns: ["real traffic|logged|sample|production|actual"]
        - id: longtail
          label: "covers the long tail and rare intents"
          weight: 2
          patterns: ["long tail|rare|edge|uncommon|minority"]
        - id: feedback
          label: "a loop from complaints to new cases"
          weight: 2
          patterns: ["complaint|feedback|add case|regression|ticket"]
- id: iv-ml-prompt-registry
  kind: ml_system
  level: mid
  title: "Manage prompts like code"
  prompt: >-
    Your team edits prompts in a shared document and breaks production weekly.
    Design the system that fixes that.
  reference_topics: [model-serving, model-evaluation]
  stages:
    - id: clarify
      question: "What breaks when a prompt changes?"
      intent: >-
        Prompts are code with a distribution of inputs, so they need tests and
        versioning.
      hint: >-
        Ask what a prompt change can break: format, tool calls, refusal behaviour,
        token cost. Those are the regression tests, and they do not exist yet.
      criteria:
        - id: breakage
          label: "asks what a prompt change can break"
          weight: 3
          patterns: ["format|tool|refus|json|cost|break"]
        - id: ownership
          label: "asks who owns and approves a prompt"
          weight: 2
          patterns: ["owner|approv|review|who|responsib"]
        - id: volume
          label: "asks how many prompts and how often they change"
          weight: 1
          patterns: ["how many|volume|frequency|change|prompts"]
    - id: core
      question: "What does the deployment path look like?"
      intent: >-
        Expect prompts as versioned artefacts, evaluated before promotion, with
        rollback.
      hint: >-
        A prompt is a versioned artefact with an evaluation suite attached, and
        promotion runs that suite. Editing in a shared document has no version, no
        test and no rollback.
      criteria:
        - id: version
          label: "prompts versioned with an id and history"
          weight: 3
          patterns: ["version|id|history|immutable|registry"]
        - id: eval
          label: "an evaluation suite runs before promotion"
          weight: 3
          patterns: ["eval|test|suite|regression|before deploy"]
        - id: rollback
          label: "instant rollback to the previous prompt version"
          weight: 2
          patterns: ["rollback|revert|previous|undo|pin"]
    - id: scale
      question: "A prompt change helps on your test set and hurts in production. Why?"
      intent: >-
        Probes test-set overfitting to a small sample and the value of online
        evidence.
      hint: >-
        Prompts overfit a handful of examples quickly. You need a larger,
        traffic-derived set and a canary, because prompt changes have
        second-order effects on latency and refusal that a small set will not show.
      criteria:
        - id: overfit
          label: "names overfitting to a small test set"
          weight: 3
          patterns: ["overfit|small|few examples|sample|memoris"]
        - id: canary
          label: "canary or online check before full rollout"
          weight: 2
          patterns: ["canary|online|a b|rollout|gradual"]
        - id: secondorder
          label: "checks latency, cost and refusal rate, not just quality"
          weight: 2
          patterns: ["latency|cost|token|refus|side effect"]
- id: iv-ml-agent-tools
  kind: ml_system
  level: senior
  title: "Make an LLM agent's tool calls reliable"
  prompt: >-
    Your agent calls internal APIs to complete tasks. In production, one in
    five runs fails. Design the system that fixes it.
  reference_topics: [model-serving, model-evaluation, long-context]
  stages:
    - id: clarify
      question: "What does failure look like, and where does it originate?"
      intent: >-
        The candidate must separate model errors from tool errors and from task
        ambiguity.
      hint: >-
        Classify the failures before fixing them: wrong tool, malformed arguments,
        tool error, or a task that was never well specified. Each has a different
        remedy.
      criteria:
        - id: classify
          label: "classifies failure modes rather than treating them as one"
          weight: 3
          patterns: ["classif|taxonomy|which|wrong tool|malformed|ambiguous"]
        - id: ground
          label: "asks whether the tool schema is unambiguous"
          weight: 2
          patterns: ["schema|description|ambiguous|documentation|contract"]
        - id: observe
          label: "asks what traces exist today"
          weight: 1
          patterns: ["trace|log|observab|span|record"]
    - id: core
      question: "How do you make a tool call correct and recoverable?"
      intent: >-
        Expect strict schemas, validation, retries with feedback, and idempotency.
      hint: >-
        Validate arguments against the schema before calling, return structured
        errors the model can act on, and make write operations idempotent so a
        retry is safe.
      criteria:
        - id: schema
          label: "strict schemas with validation before the call"
          weight: 3
          patterns: ["schema|validat|json schema|strict|type"]
        - id: error
          label: "structured error messages fed back to the model"
          weight: 2
          patterns: ["error|feedback|message|retry|tell the model"]
        - id: idempotent
          label: "idempotency keys for side-effecting tools"
          weight: 2
          patterns: ["idempot|dedup|key|safe retry|exactly once"]
    - id: scale
      question: "The agent loops, calling the same tool forever. What stops it?"
      intent: >-
        Probes step limits, loop detection, and budget enforcement.
      hint: >-
        A hard step budget plus detection of repeated identical calls ends the
        loop; without it, an agent can burn a customer's entire token budget in
        minutes.
      criteria:
        - id: budget
          label: "a hard step or token budget per run"
          weight: 3
          patterns: ["budget|limit|max steps|cap|timeout"]
        - id: loop
          label: "detects repeated identical calls"
          weight: 3
          patterns: ["loop|repeat|same call|cycle|detect"]
        - id: escalate
          label: "escalates to a human or a fallback path on exhaustion"
          weight: 1
          patterns: ["escalat|fallback|human|give up|graceful"]
- id: iv-ml-agent-memory
  kind: ml_system
  level: senior
  title: "Design memory for a long-running agent"
  prompt: >-
    An agent handles multi-day tasks and must remember decisions across
    sessions. Design its memory, given a finite context window.
  reference_topics: [long-context, kv-cache, tokenisation]
  stages:
    - id: clarify
      question: "What must be remembered exactly, and what may be summarised?"
      intent: >-
        Exact recall and gist are different stores with different costs.
      hint: >-
        Ask which facts are contractual — identifiers, amounts, preferences — and
        which are narrative. Exact facts go in structured storage; narrative can
        be summarised.
      criteria:
        - id: exact
          label: "separates exact facts from narrative context"
          weight: 3
          patterns: ["exact|fact|structured|narrative|summar"]
        - id: horizon
          label: "asks how long memory must persist"
          weight: 2
          patterns: ["how long|persist|days|sessions|retention"]
        - id: privacy
          label: "asks what may be stored about the user"
          weight: 1
          patterns: ["privacy|pii|store|delete|consent"]
    - id: core
      question: "What are the memory tiers, and how is each retrieved?"
      intent: >-
        Expect a working context, a retrieved store, and a durable profile.
      hint: >-
        Three tiers: the current context window, a retrieval store of past
        interactions, and a small structured profile of durable facts. Retrieval
        supplies the middle tier; summarisation compresses what no longer fits.
      criteria:
        - id: tiers
          label: "names distinct tiers: context, retrieval store, durable profile"
          weight: 3
          patterns: ["tier|context window|retrieval|profile|short term|long term"]
        - id: retrieve
          label: "retrieval by relevance into the context"
          weight: 2
          patterns: ["retriev|search|embedding|relevance|recall"]
        - id: summarise
          label: "summarisation or compaction of old turns"
          weight: 2
          patterns: ["summar|compact|condense|compress|roll up"]
    - id: scale
      question: "The agent confidently recalls something the user never said. How do you prevent that?"
      intent: >-
        Probes memory provenance and the danger of summarised memory being treated
        as fact.
      hint: >-
        Every memory needs a source and a timestamp, and the agent should quote
        the source rather than assert the memory. Summaries must be marked as
        summaries, not evidence.
      criteria:
        - id: provenance
          label: "each memory records its source and time"
          weight: 3
          patterns: ["source|provenance|timestamp|cite|origin"]
        - id: summarised
          label: "distinguishes summarised memory from recorded fact"
          weight: 3
          patterns: ["summar|derived|mark|confidence|not fact"]
        - id: verify
          label: "verifies against the store before asserting"
          weight: 1
          patterns: ["verify|check|lookup|confirm|ground"]
- id: iv-ml-pii-redaction
  kind: ml_system
  level: mid
  title: "Design a PII redaction service"
  prompt: >-
    Design a service that redacts personal data from text before it reaches a
    third-party model API, at 5,000 requests a second.
  reference_topics: [model-evaluation, information-theory]
  stages:
    - id: clarify
      question: "What counts as PII here, and what happens if you miss some?"
      intent: >-
        The definition and the failure cost decide between rules, a model, and a
        human.
      hint: >-
        Ask for the definition: names, emails, card numbers, addresses, health
        data. Missing a card number is a compliance event, over-redacting makes the
        product useless, and those costs differ.
      criteria:
        - id: definition
          label: "asks for the PII categories in scope"
          weight: 3
          patterns: ["categor|what counts|name|email|card|address|definition"]
        - id: cost
          label: "asks the cost of a miss versus over-redaction"
          weight: 3
          patterns: ["miss|false negative|over redact|false positive|cost"]
        - id: latency
          label: "confirms the latency budget"
          weight: 1
          patterns: ["latency|5,000|per second|budget|throughput"]
    - id: core
      question: "Which detector, and where in the pipeline does it sit?"
      intent: >-
        Expect a layered approach: deterministic patterns for structured PII, a
        model for names and context.
      hint: >-
        Card numbers, emails and phone numbers are regex-detectable and should be;
        names and addresses need a model. One approach for both is either
        inaccurate or slow.
      criteria:
        - id: layered
          label: "patterns for structured PII plus a model for names"
          weight: 3
          patterns: ["regex|pattern|rule|model|ner|classifier|hybrid"]
        - id: placement
          label: "redaction before the text leaves the trust boundary"
          weight: 3
          patterns: ["before|boundary|egress|prior to|upstream"]
        - id: replace
          label: "replacement strategy: masking, tokenising, or removal"
          weight: 1
          patterns: ["mask|redact|replace|token|remove|placeholder"]
    - id: scale
      question: "How do you measure whether it works, when you cannot look at the data?"
      intent: >-
        Probes synthetic test sets, audit sampling under governance, and recall
        measurement.
      hint: >-
        You measure recall on a labelled sample held under the same governance as
        production data, and you track the rate at which downstream systems still
        see PII. You cannot improve what you cannot measure.
      criteria:
        - id: recall
          label: "measures recall on a labelled sample"
          weight: 3
          patterns: ["recall|measure|labelled|sample|test set"]
        - id: governance
          label: "keeps the audit sample under the same access controls"
          weight: 2
          patterns: ["governance|access|restricted|audit|permission"]
        - id: downstream
          label: "checks downstream for residual PII"
          weight: 2
          patterns: ["downstream|residual|leak|scan|detect"]
- id: iv-ml-semantic-cache
  kind: ml_system
  level: mid
  title: "Design a semantic cache for an LLM API"
  prompt: >-
    Design a cache that returns a previous answer when a new query means the
    same thing, to cut cost on a support assistant.
  reference_topics: [vectors-and-geometry, model-serving, information-theory]
  stages:
    - id: clarify
      question: "When is a cached answer still correct?"
      intent: >-
        Similarity is not equivalence, and staleness is the real risk.
      hint: >-
        Ask what makes an answer time-sensitive. Two identical questions asked
        before and after a policy change need different answers, so the cache key
        needs a version or a TTL.
      criteria:
        - id: staleness
          label: "asks how quickly answers go stale"
          weight: 3
          patterns: ["stale|ttl|expire|change|update|fresh"]
        - id: correctness
          label: "distinguishes semantic similarity from answer equivalence"
          weight: 3
          patterns: ["similar|equivalent|same meaning|not equal|threshold"]
        - id: scope
          label: "asks whether answers are user-specific"
          weight: 1
          patterns: ["per user|personal|scope|tenant|shared"]
    - id: core
      question: "How do you decide a hit?"
      intent: >-
        Expect an embedding lookup with a similarity threshold, and the tradeoff of
        that threshold.
      hint: >-
        A high threshold keeps precision and loses hits; a low one returns
        plausible but wrong answers. The threshold should be set from measured
        answer-equivalence, not from intuition.
      criteria:
        - id: embed
          label: "embeds the query and searches a vector index"
          weight: 3
          patterns: ["embedding|vector|ann|index|similarity"]
        - id: threshold
          label: "uses a similarity threshold tuned for answer equivalence"
          weight: 3
          patterns: ["threshold|cut off|tuned|calibrat|score"]
        - id: guard
          label: "verifies the hit before returning, e.g. a judge or exact match"
          weight: 2
          patterns: ["verify|judge|check|rerank|confirm"]
    - id: scale
      question: "The cache hit rate is 40 percent and the complaints are up. What do you change?"
      intent: >-
        Probes the precision-recall tradeoff and segmenting by query class.
      hint: >-
        The threshold is too loose, or the cache is serving across intents that
        look similar. Raise the threshold, scope the cache per intent, and keep
        exact-match caching for the safe high-volume queries.
      criteria:
        - id: threshold
          label: "raises the threshold or narrows the cache"
          weight: 3
          patterns: ["threshold|raise|tighten|narrow|stricter"]
        - id: segment
          label: "scopes the cache by intent or query class"
          weight: 2
          patterns: ["intent|class|segment|scope|category"]
        - id: exact
          label: "keeps exact-match caching for safe queries"
          weight: 1
          patterns: ["exact match|literal|hash|safe|deterministic"]
- id: iv-ml-batch-inference
  kind: ml_system
  level: senior
  title: "Design an offline batch scoring pipeline"
  prompt: >-
    Score 500M users with a model nightly, finish before 6 a.m., and make the
    scores available to serving with a known timestamp.
  reference_topics: [data-parallelism, model-serving, feature-engineering-leakage]
  stages:
    - id: clarify
      question: "What is the deadline, and what happens if a partition is late?"
      intent: >-
        The SLA and the lateness policy decide the architecture.
      hint: >-
        Ask what happens if an upstream partition arrives at 4 a.m. You need a
        policy — score with stale features and mark the timestamp, or skip and
        flag — decided in advance.
      criteria:
        - id: deadline
          label: "asks the deadline and the data arrival time"
          weight: 3
          patterns: ["deadline|6 a.m|when|arrival|window"]
        - id: late
          label: "asks the policy for late or missing partitions"
          weight: 3
          patterns: ["late|missing|partition|fallback|skip"]
        - id: freshness
          label: "asks the acceptable age of a score at serving time"
          weight: 1
          patterns: ["age|stale|timestamp|fresh|how old"]
    - id: core
      question: "How do you make 500M predictions finish in the window?"
      intent: >-
        Expect partitioned batch inference with the model loaded once per worker,
        and the bottleneck measured rather than assumed.
      hint: >-
        Partition by user id, load the model once per worker, stream batches
        rather than holding the dataset, and write partitioned output. The
        bottleneck is usually feature joins, not inference.
      criteria:
        - id: partition
          label: "partitioned parallel scoring"
          weight: 2
          patterns: ["partition|shard|parallel|distribute|worker"]
        - id: stream
          label: "streaming batches rather than loading everything"
          weight: 2
          patterns: ["stream|batch|chunk|iterator|memory"]
        - id: bottleneck
          label: "identifies the feature join as the likely bottleneck"
          weight: 3
          patterns: ["join|feature|io|shuffle|bottleneck|cost"]
    - id: scale
      question: "Serving must not read a half-written score table. How do you publish atomically?"
      intent: >-
        Probes the publish step: write to a new partition, then swap a pointer.
      hint: >-
        Write the new scores to a fresh partition, validate the row count and
        distribution, then flip a pointer or alias. Writing in place exposes
        serving to a half-scored population.
      criteria:
        - id: atomic
          label: "writes to a new partition and swaps a pointer"
          weight: 3
          patterns: ["new partition|swap|pointer|alias|atomic publish"]
        - id: validate
          label: "validates row counts and distribution before publishing"
          weight: 2
          patterns: ["validate|count|distribution|check|sanity"]
        - id: timestamp
          label: "exposes the score timestamp to consumers"
          weight: 1
          patterns: ["timestamp|as of|version|metadata|freshness"]
- id: iv-ml-gpu-capacity
  kind: ml_system
  level: staff
  title: "Plan GPU capacity for an inference service"
  prompt: >-
    You must commit to a GPU reservation for the next year. Justify the number,
    and design what happens when demand exceeds it.
  reference_topics: [inference-cost-model, model-serving, continuous-batching]
  stages:
    - id: clarify
      question: "What drives GPU demand: tokens, requests, or peak concurrency?"
      intent: >-
        Capacity is a function of tokens and batching efficiency, not request count.
      hint: >-
        Ask for tokens per second and the output length distribution. A request
        with 4k output tokens costs a hundred times one with 40, and request
        counts hide that.
      criteria:
        - id: driver
          label: "asks for tokens, not just requests"
          weight: 3
          patterns: ["token|output length|per second|volume|distribution"]
        - id: peak
          label: "asks the peak-to-average ratio"
          weight: 2
          patterns: ["peak|average|ratio|burst|diurnal"]
        - id: slo
          label: "asks the latency SLO that constrains batching"
          weight: 2
          patterns: ["slo|latency|p99|ttft|budget"]
    - id: core
      question: "How do you convert tokens per second into GPUs?"
      intent: >-
        Expect a measured throughput per GPU at the target batch and sequence
        length, then a division with headroom.
      hint: >-
        Measure tokens per second per GPU under your real batching and sequence
        mix, then divide. Quoting a vendor's peak number without the sequence
        length is how reservations come out three times too small.
      criteria:
        - id: measure
          label: "uses measured throughput at the real batch and sequence length"
          weight: 3
          patterns: ["measure|benchmark|throughput|real|batch"]
        - id: headroom
          label: "adds headroom for peaks and failure"
          weight: 2
          patterns: ["headroom|buffer|margin|failover|spare"]
        - id: efficiency
          label: "accounts for batching efficiency and memory limits"
          weight: 2
          patterns: ["batching|efficiency|memory|kv cache|utilisation|utilization"]
    - id: scale
      question: "Demand doubles in three months. What is your overflow plan?"
      intent: >-
        Probes burst capacity, provider fallback, and degradation policy.
      hint: >-
        You need a burst tier from a provider, a queue for non-interactive work,
        and a defined degradation — shorter outputs, lower priority queues — rather
        than letting latency collapse for everyone.
      criteria:
        - id: burst
          label: "burst capacity from a provider or spot instances"
          weight: 3
          patterns: ["burst|overflow|spot|provider|elastic"]
        - id: queue
          label: "queues non-interactive work separately"
          weight: 2
          patterns: ["queue|batch|async|priority|tier"]
        - id: degrade
          label: "defines a degradation policy"
          weight: 2
          patterns: ["degrade|shed|shorter|lower quality|limit"]
- id: iv-ml-model-routing
  kind: ml_system
  level: senior
  title: "Route requests across models by cost and quality"
  prompt: >-
    You have a small cheap model and a large expensive one. Design the router
    that sends each request to the cheapest model that will do the job.
  reference_topics: [model-serving, model-evaluation, inference-cost-model]
  stages:
    - id: clarify
      question: "What does doing the job mean, and how do you know before answering?"
      intent: >-
        The router needs a signal at request time, not after the fact.
      hint: >-
        Ask what quality bar applies and whether you can predict difficulty from
        the prompt. If you cannot predict before generating, the router is guessing.
      criteria:
        - id: quality
          label: "asks how quality is judged per request"
          weight: 3
          patterns: ["quality|bar|correct|accept|judge|threshold"]
        - id: signal
          label: "asks what signal is available before generation"
          weight: 3
          patterns: ["before|predict|classif|difficulty|prompt length|feature"]
        - id: cost
          label: "asks the cost ratio between the models"
          weight: 1
          patterns: ["cost|price|ratio|expensive|cheap"]
    - id: core
      question: "How does the router decide, and what happens when it is wrong?"
      intent: >-
        Expect a difficulty classifier or a cascade with a verifier, plus escalation.
      hint: >-
        Either a classifier predicts difficulty up front, or the small model
        answers and a verifier decides whether to escalate. The cascade is usually
        more accurate because it judges the actual answer.
      criteria:
        - id: classifier
          label: "a difficulty classifier or heuristic router"
          weight: 2
          patterns: ["classifier|difficulty|heuristic|predict|route"]
        - id: cascade
          label: "a cascade with verification and escalation"
          weight: 3
          patterns: ["cascade|escalat|verif|fallback|small first"]
        - id: verifier
          label: "a verifier that is cheaper than the large model"
          weight: 3
          patterns: ["verif|judge|check|cheap|confidence"]
    - id: scale
      question: "The cheap model answers 70 percent of traffic. What is your actual cost saving?"
      intent: >-
        Probes the arithmetic including the verifier and the escalation overhead.
      hint: >-
        The saving is not 70 percent: you pay the cheap model on everything and the
        expensive model on 30 percent, plus the verifier on all of it. Do that sum
        before claiming a win.
      criteria:
        - id: arithmetic
          label: "computes cost including the verifier and escalations"
          weight: 3
          patterns: ["verifier|both|all traffic|plus|arithmetic|total cost"]
        - id: quality
          label: "checks that quality did not degrade on the routed slice"
          weight: 3
          patterns: ["quality|degrad|regression|evaluate|compare"]
        - id: drift
          label: "monitors the routing distribution as traffic changes"
          weight: 1
          patterns: ["drift|distribution|monitor|shift|retrain"]
- id: iv-ml-asr-streaming
  kind: ml_system
  level: senior
  title: "Design streaming speech recognition"
  prompt: >-
    Design live transcription for calls: words appear as they are spoken, with
    speaker labels and a searchable transcript afterwards.
  reference_topics: [recurrent-architectures, model-serving, time-series]
  stages:
    - id: clarify
      question: "What latency is acceptable, and what happens when the model revises itself?"
      intent: >-
        Streaming ASR must display partial results that later change; the UX has to
        allow for that.
      hint: >-
        Ask whether the transcript can be revised on screen. A streaming model
        emits unstable partials, so the interface must tolerate text changing
        under the reader.
      criteria:
        - id: latency
          label: "asks the acceptable partial-result latency"
          weight: 3
          patterns: ["latency|partial|delay|milliseconds|real time"]
        - id: revision
          label: "raises the instability of partial transcripts"
          weight: 3
          patterns: ["revis|unstable|change|correct|amend|partial"]
        - id: accuracy
          label: "asks the accuracy bar and the domain vocabulary"
          weight: 1
          patterns: ["accuracy|wer|vocabulary|domain|names"]
    - id: core
      question: "How does audio become words in near real time?"
      intent: >-
        Expect chunked audio, a streaming model with state, and endpointing.
      hint: >-
        Audio is chunked into frames, the model keeps state across chunks, and an
        endpointing model decides when a sentence ended. Without endpointing the
        transcript never punctuates.
      criteria:
        - id: chunk
          label: "chunked audio frames with model state carried across"
          weight: 3
          patterns: ["chunk|frame|window|state|stream"]
        - id: endpoint
          label: "endpointing or voice activity detection"
          weight: 3
          patterns: ["endpoint|vad|silence|turn|pause"]
        - id: decode
          label: "a decoding strategy that balances latency and accuracy"
          weight: 2
          patterns: ["beam|greedy|decode|lookahead|latency"]
    - id: scale
      question: "The call has two speakers and heavy background noise. What changes?"
      intent: >-
        Probes diarisation, denoising, and the cost of running more models per stream.
      hint: >-
        Diarisation adds a second model per stream and speaker-attributed output,
        and noise demands enhancement before recognition. Both multiply the compute
        per concurrent call.
      criteria:
        - id: diarise
          label: "speaker diarisation with attributed output"
          weight: 3
          patterns: ["diaris|diariz|speaker|who spoke|attribut"]
        - id: noise
          label: "noise suppression or enhancement before recognition"
          weight: 2
          patterns: ["noise|suppress|enhance|denois|filter"]
        - id: compute
          label: "accounts for the extra compute per concurrent stream"
          weight: 2
          patterns: ["compute|gpu|concurrent|cost|capacity"]
- id: iv-ml-ocr-pipeline
  kind: ml_system
  level: mid
  title: "Design a document extraction pipeline"
  prompt: >-
    Design the pipeline that turns scanned invoices into structured fields:
    vendor, date, line items, and total, for 2M documents a day.
  reference_topics: [document-understanding, multimodal-fusion, model-evaluation]
  stages:
    - id: clarify
      question: "What accuracy is good enough, and what does a wrong total cost?"
      intent: >-
        Field-level accuracy matters, and the total is not equal to the line items
        in importance.
      hint: >-
        Ask for per-field accuracy requirements. A wrong vendor name is an
        annoyance; a wrong total is a payment error, so the total needs a separate
        verification path.
      criteria:
        - id: field
          label: "asks accuracy requirements per field, not overall"
          weight: 3
          patterns: ["per field|field|accuracy|which field|tolerance"]
        - id: cost
          label: "asks what a wrong extraction costs downstream"
          weight: 2
          patterns: ["wrong|cost|payment|error|consequence"]
        - id: variety
          label: "asks the document variety and languages"
          weight: 2
          patterns: ["variety|template|scanned|language|handwrit"]
    - id: core
      question: "How does a document become structured fields?"
      intent: >-
        Expect layout analysis, OCR or a vision model, then field extraction, then
        validation.
      hint: >-
        The order is layout and OCR, then extraction against a schema, then
        arithmetic and cross-field validation. Validation is what catches the
        model's plausible but wrong total.
      criteria:
        - id: layout
          label: "layout analysis or OCR before extraction"
          weight: 3
          patterns: ["layout|ocr|vision|parse|region|detect"]
        - id: extract
          label: "schema-constrained extraction"
          weight: 3
          patterns: ["schema|field|extract|json|structured|prompt"]
        - id: validate
          label: "cross-field or arithmetic validation"
          weight: 3
          patterns: ["validat|sum|arithmetic|total|reconcil|consisten"]
    - id: scale
      question: "A new vendor format appears and extraction quality collapses. What is your process?"
      intent: >-
        Probes monitoring per template and the human-in-the-loop fallback.
      hint: >-
        You need per-document-type monitoring so the collapse is visible, a
        confidence threshold that routes low-confidence documents to humans, and a
        fast path to add a template.
      criteria:
        - id: monitor
          label: "monitors accuracy per document type or vendor"
          weight: 3
          patterns: ["per type|per vendor|slice|monitor|segment"]
        - id: threshold
          label: "routes low-confidence documents to human review"
          weight: 3
          patterns: ["confidence|threshold|human|review|queue"]
        - id: template
          label: "a fast path to add a new template or example"
          weight: 1
          patterns: ["template|add|example|few shot|onboard"]
- id: iv-ml-bandits
  kind: ml_system
  level: staff
  title: "Use a bandit for homepage promotion"
  prompt: >-
    You must choose which of twenty promotions to show each visitor, and learn
    while doing it. Design the approach and tell me when a bandit is the wrong
    tool.
  reference_topics: [probability-distributions, model-evaluation]
  stages:
    - id: clarify
      question: "What is the reward, and how delayed is it?"
      intent: >-
        A bandit needs a reward you can attribute to the decision, quickly.
      hint: >-
        Ask what the reward is and how long until it is observed. A purchase
        observed two weeks later is a bad bandit reward; a click is a good one.
      criteria:
        - id: reward
          label: "asks the reward definition"
          weight: 3
          patterns: ["reward|click|conversion|objective|metric"]
        - id: delay
          label: "asks the delay between action and reward"
          weight: 3
          patterns: ["delay|when|observed|later|attribut"]
        - id: context
          label: "asks whether context is available to personalise"
          weight: 1
          patterns: ["context|feature|user|segment|personal"]
    - id: core
      question: "Thompson sampling, UCB, or epsilon-greedy? Choose with the reasoning."
      intent: >-
        Expect a contextual method if context exists, and a reason for the
        exploration schedule.
      hint: >-
        Thompson sampling handles uncertainty naturally and is easy to explain;
        epsilon-greedy wastes exploration on arms you already know are bad. With
        context, use a contextual variant rather than a global arm.
      criteria:
        - id: method
          label: "chooses a specific algorithm with reasoning"
          weight: 3
          patterns: ["thompson|ucb|epsilon|greedy|linucb|contextual"]
        - id: explore
          label: "explains the exploration and exploitation balance"
          weight: 2
          patterns: ["explor|exploit|uncertainty|tradeoff|regret"]
        - id: context
          label: "uses context when it exists"
          weight: 2
          patterns: ["context|feature|per user|segment|personal"]
    - id: scale
      question: "When is an A/B test the better choice than a bandit?"
      intent: >-
        Probes the conditions where bandits fail: non-stationarity, interference,
        and the need for clean causal estimates.
      hint: >-
        If you need an unbiased measurement of each arm, a bandit's adaptive
        allocation biases the estimate. Non-stationary rewards and interference
        between arms also break the assumptions.
      criteria:
        - id: measurement
          label: "names the bias a bandit introduces into effect estimates"
          weight: 3
          patterns: ["bias|estimate|measure|clean|unbiased|adaptive"]
        - id: stationary
          label: "raises non-stationarity"
          weight: 2
          patterns: ["non stationary|drift|seasonal|change|shift"]
        - id: interference
          label: "raises interference between arms or long-term effects"
          weight: 2
          patterns: ["interfere|spillover|long term|between arms|cannibal"]
- id: iv-ml-monitoring
  kind: ml_system
  level: mid
  title: "Design model monitoring dashboards"
  prompt: >-
    Design the monitoring an on-call engineer actually uses for a deployed
    model. What do they see at 3 a.m.?
  reference_topics: [model-evaluation, time-series]
  stages:
    - id: clarify
      question: "What does the on-call engineer need to decide in the first five minutes?"
      intent: >-
        Monitoring exists to support a decision: is the model broken, and should we
        roll back.
      hint: >-
        The first question is whether the problem is the model, the data, or the
        infrastructure. The dashboard should answer that, not display forty charts.
      criteria:
        - id: decision
          label: "asks what decision the dashboard supports"
          weight: 3
          patterns: ["decision|do|rollback|action|first"]
        - id: scope
          label: "asks who is on call and what they can do"
          weight: 2
          patterns: ["on call|who|runbook|access|escalat"]
        - id: sources
          label: "asks what signals already exist"
          weight: 1
          patterns: ["signal|metric|log|trace|existing"]
    - id: core
      question: "Which few metrics belong at the top?"
      intent: >-
        Expect request rate, error rate, latency, and a model-quality proxy,
        segmented by model version.
      hint: >-
        Top line is traffic, errors, latency and a quality proxy, all segmented by
        model version. Without the version dimension you cannot tell whether a
        deploy caused the change.
      criteria:
        - id: golden
          label: "traffic, errors, latency as the base layer"
          weight: 2
          patterns: ["traffic|error|latency|rate|golden"]
        - id: quality
          label: "a model-quality proxy available without labels"
          weight: 3
          patterns: ["quality|proxy|confidence|distribution|drift"]
        - id: version
          label: "segmented by model version or deploy"
          weight: 3
          patterns: ["version|deploy|release|segment|by model"]
    - id: scale
      question: "An alert fires at 3 a.m. It says latency is up. What is missing from that alert?"
      intent: >-
        Probes alert quality: link to the runbook, the version, and the blast radius.
      hint: >-
        An alert without a version, a runbook link and a blast radius forces the
        engineer to investigate from zero. Good alerts say what changed and what to
        do.
      criteria:
        - id: context
          label: "the alert carries version, scope and a runbook link"
          weight: 3
          patterns: ["runbook|version|scope|link|context"]
        - id: action
          label: "the alert names a first action"
          weight: 2
          patterns: ["action|first step|rollback|check|do this"]
        - id: noise
          label: "alerts are few enough to be trusted"
          weight: 2
          patterns: ["noise|fatigue|actionable|few|threshold"]
