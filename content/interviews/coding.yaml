      criteria:
        - id: goal
          label: "states the variance-preservation goal"
          weight: 3
          patterns: ["variance|preserve|constant|signal|depth"]
        - id: fan
          label: "names fan in and fan out"
          weight: 2
          patterns: ["fan in|fan out|number of inputs|connections"]
        - id: failure
          label: "names vanishing or exploding signals"
          weight: 2
          patterns: ["vanish|explod|shrink|grow|exponential"]
    - id: approach
      question: "Write the initialiser for a ReLU layer and for a linear layer."
      intent: >-
        Expect Kaiming with a factor of two for ReLU, Xavier for symmetric
        activations.
      hint: >-
        ReLU zeroes half the activations, so Kaiming uses twice the Xavier variance.
        Using Xavier on a deep ReLU network halves the variance per layer.
      criteria:
        - id: kaiming
          label: "Kaiming or He initialisation for ReLU"
          weight: 3
          patterns: ["kaiming|he init|relu|factor of two|2 over"]
        - id: xavier
          label: "Xavier or Glorot for symmetric activations"
          weight: 2
          patterns: ["xavier|glorot|tanh|symmetric|linear"]
        - id: formula
          label: "writes the standard deviation formula"
          weight: 2
          patterns: ["sqrt|standard deviation|2 over fan|variance|formula"]
    - id: numerics
      question: "Why does initialisation still matter when you have LayerNorm and residual connections?"
      intent: >-
        Probes depth scaling: residual branches need scaled init to keep the sum
        stable.
      hint: >-
        Residual sums grow with depth, so deeper models scale down the branch
        initialisation — for example by one over the square root of the number of
        layers — to keep the accumulated variance bounded.
      criteria:
        - id: residual
          label: "residual sums accumulate variance with depth"
          weight: 3
          patterns: ["residual|sum|accumulat|depth|grow"]
        - id: scale
          label: "scales branch init by depth"
          weight: 3
          patterns: ["scale|one over|sqrt|layer count|depth"]
        - id: norm
          label: "notes that LayerNorm bounds activations but not initial gradients"
          weight: 1
          patterns: ["layernorm|norm|bound|gradient|still"]
- id: iv-code-dropout
  kind: coding
  level: junior
  title: "Implement inverted dropout"
  prompt: >-
    Implement dropout for training and inference. Explain the difference between
    inverted dropout and the original formulation.
  reference_topics: [regularisation, regularisation-in-practice, gradient-stability]
  stages:
    - id: clarify
      question: "What must the expected value of the output be?"
      intent: >-
        The expectation must be unchanged between train and eval, which is what
        inverted dropout achieves.
      hint: >-
        Dropout must not change the expected activation, otherwise the network sees
        a different scale at inference and its predictions shift.
      criteria:
        - id: expectation
          label: "states the expectation-preservation requirement"
          weight: 3
          patterns: ["expect|mean|average|scale|unchanged"]
        - id: train
          label: "training drops units stochastically"
          weight: 2
          patterns: ["train|drop|zero|mask|random"]
        - id: eval
          label: "inference is the identity"
          weight: 2
          patterns: ["eval|inference|test|identity|no dropout"]
    - id: approach
      question: "Write it. Where does the division by keep probability go?"
      intent: >-
        In inverted dropout you scale during training, so inference does nothing.
      hint: >-
        Divide the surviving activations by the keep probability during training,
        so at inference you pass the tensor through unchanged.
      criteria:
        - id: mask
          label: "samples a Bernoulli mask"
          weight: 2
          patterns: ["bernoulli|mask|random|uniform|sample"]
        - id: divide
          label: "divides by the keep probability during training"
          weight: 3
          patterns: ["divide|scale|1 minus p|keep prob|inverted"]
        - id: inference
          label: "no scaling at inference"
          weight: 2
          patterns: ["no scale|identity|inference|nothing|pass through"]
    - id: edge
      question: "Dropout at inference is left on. What do you observe?"
      intent: >-
        Probes the symptom: noisy, degraded predictions that look like a broken
        model.
      hint: >-
        Leaving dropout on makes predictions stochastic and lower variance in the
        wrong way; the symptom is a model that is accurate on average and unstable
        per call.
      criteria:
        - id: noisy
          label: "predictions become stochastic"
          weight: 3
          patterns: ["random|noisy|unstable|stochastic|vary"]
        - id: degraded
          label: "accuracy degrades because scaling is wrong"
          weight: 2
          patterns: ["degrad|worse|lower|accuracy|scale"]
        - id: detect
          label: "detects it by comparing train and eval mode outputs"
          weight: 1
          patterns: ["compare|train eval|mode|reproduce|toggle"]
- id: iv-code-softmax-jacobian
  kind: coding
  level: staff
  title: "Derive the softmax Jacobian"
  prompt: >-
    Derive the Jacobian of softmax and use it to explain why softmax plus
    cross-entropy has a clean gradient.
  reference_topics: [matrix-calculus, information-theory, backpropagation]
  stages:
    - id: clarify
      question: "What is the shape of the Jacobian for a vector of length n?"
      intent: >-
        It is n by n, not a vector — the derivative of every output with respect to
        every input.
      hint: >-
        The Jacobian is n by n, diagonal minus an outer product. Saying it is a
        vector reveals a misunderstanding of the multivariate derivative.
      criteria:
        - id: shape
          label: "states the n by n shape"
          weight: 3
          patterns: ["n by n|matrix|jacobian|square|dimension"]
        - id: entries
          label: "diagonal entries are p i times one minus p i"
          weight: 3
          patterns: ["diagonal|p i|one minus|off diagonal"]
        - id: outer
          label: "off-diagonal entries are minus p i p j"
          weight: 2
          patterns: ["minus|product|off diagonal|p i p j"]
    - id: approach
      question: "Derive it. Where does the outer product come from?"
      intent: >-
        Probes the quotient rule on p i equals exp z i over the sum.
      hint: >-
        Differentiating the ratio gives a diagonal term from the numerator and a
        rank-one term from the denominator, which is exactly the outer product of p
        with itself.
      criteria:
        - id: quotient
          label: "applies the quotient rule to the softmax ratio"
          weight: 3
          patterns: ["quotient|ratio|derivative|differentiat|chain"]
        - id: rankone
          label: "the correction term is rank one"
          weight: 3
          patterns: ["rank one|outer|p p transpose|outer product"]
        - id: identity
          label: "writes the compact form diag p minus p p transpose"
          weight: 2
          patterns: ["diag|minus|compact|form|expression"]
    - id: numerics
      question: "Why is softmax followed by cross-entropy better than a separate softmax and log?"
      intent: >-
        Probes the cancellation of the Jacobian and the numerical stability of the
        fused form.
      hint: >-
        The Jacobian contracts with the cross-entropy gradient to give p minus y, so
        the fused form avoids both the matrix and the log of a probability that may
        be zero.
      criteria:
        - id: cancel
          label: "the Jacobian contracts to p minus y"
          weight: 3
          patterns: ["cancel|contract|simplif|p minus y|reduces"]
        - id: stable
          label: "avoids the log of a possibly zero probability"
          weight: 2
          patterns: ["log|zero|inf|stable|underflow"]
        - id: cost
          label: "avoids materialising the n by n matrix"
          weight: 1
          patterns: ["matrix|n by n|memory|materialis|cost"]
- id: iv-code-knn
  kind: coding
  level: mid
  title: "Implement k-nearest-neighbour search"
  prompt: >-
    Implement k-NN search over one million vectors and fifty thousand queries.
    Start brute force, then make it fast.
  reference_topics: [knn-curse-dimensionality, vectors-and-geometry, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "What is the distance, and how exact must the answer be?"
      intent: >-
        Exactness decides between brute force and an approximate index.
      hint: >-
        Ask whether approximate neighbours are acceptable and what recall is needed.
        Exact search over a million vectors per query is a full scan, which may be
        fine offline and impossible at serving latency.
      criteria:
        - id: metric
          label: "asks which distance metric"
          weight: 2
          patterns: ["distance|metric|cosine|euclidean|l2|dot"]
        - id: exact
          label: "asks whether approximate results are acceptable"
          weight: 3
          patterns: ["exact|approximate|recall|acceptable|ann"]
        - id: scale
          label: "does the arithmetic for the brute-force cost"
          weight: 2
          patterns: ["million|50,000|per query|operations|cost"]
    - id: approach
      question: "Write the brute-force version. How do you keep the top k?"
      intent: >-
        Expect a batched distance computation and a heap or partition for top-k.
      hint: >-
        Compute distances in a matrix operation across the batch, then keep the top
        k with a heap or an argpartition. A Python loop per vector is the wrong
        answer at this scale.
      criteria:
        - id: batch
          label: "computes distances with matrix operations"
          weight: 3
          patterns: ["batch|matrix|vectoris|vectoriz|broadcast"]
        - id: topk
          label: "keeps the top k with a heap or partition"
          weight: 2
          patterns: ["heap|partition|argpartition|top k|sort"]
        - id: norm
          label: "expands the squared distance correctly"
          weight: 2
          patterns: ["norm|squared|expand|a squared|dot product"]
    - id: efficiency
      question: "The corpus grows to a hundred million. What changes?"
      intent: >-
        Probes ANN indexing and the curse of dimensionality.
      hint: >-
        Brute force stops being viable, so you move to an approximate index, accept
        a recall target, and measure it. In high dimensions, tree indexes degrade to
        linear scans.
      criteria:
        - id: ann
          label: "introduces an approximate index"
          weight: 3
          patterns: ["hnsw|ivf|ann|approximate|index"]
        - id: curse
          label: "names the curse of dimensionality"
          weight: 2
          patterns: ["curse|dimension|high dimensional|degrade|linear scan"]
        - id: recall
          label: "measures recall against exact search"
          weight: 2
          patterns: ["recall|measure|ground truth|compare|exact"]
- id: iv-code-kmeans
  kind: coding
  level: mid
  title: "Implement k-means with k-means++"
  prompt: >-
    Implement k-means clustering, including a sensible initialisation, and say
    when it will fail.
  reference_topics: [clustering, dimensionality-reduction, vectors-and-geometry]
  stages:
    - id: clarify
      question: "What is the objective, and what stops the loop?"
      intent: >-
        The objective is within-cluster sum of squares; convergence is assignment
        stability or a centroid shift threshold.
      hint: >-
        The objective is the sum of squared distances to the assigned centroid, and
        the loop stops when assignments stop changing or the shift falls below a
        tolerance.
      criteria:
        - id: objective
          label: "states within-cluster sum of squares"
          weight: 3
          patterns: ["sum of squares|inertia|within cluster|distance|objective"]
        - id: stop
          label: "defines a convergence criterion"
          weight: 2
          patterns: ["converge|stable|tolerance|shift|max iterations"]
        - id: update
          label: "alternates assignment and centroid update"
          weight: 2
          patterns: ["assign|update|alternate|iterate|mean"]
    - id: approach
      question: "Write the loop. Why is random initialisation a problem, and what replaces it?"
      intent: >-
        Probes k-means++ and the local-minimum problem.
      hint: >-
        Random seeds can place two centroids in one cluster and none in another,
        which converges to a bad local minimum. k-means++ samples each next centroid
        with probability proportional to squared distance.
      criteria:
        - id: plusplus
          label: "k-means++ samples proportional to squared distance"
          weight: 3
          patterns: ["kmeans plus plus|plus plus|proportional|squared distance|d squared"]
        - id: local
          label: "names the local minimum problem"
          weight: 2
          patterns: ["local minimum|bad init|converge|suboptimal|random"]
        - id: restarts
          label: "multiple restarts with the best inertia"
          weight: 1
          patterns: ["restart|n init|best|lowest inertia|multiple"]
    - id: edge
      question: "One cluster ends up empty. What does your implementation do?"
      intent: >-
        Probes degenerate handling: reassign the empty centroid or drop it.
      hint: >-
        An empty cluster means a centroid with no points, so its mean is undefined.
        Reinitialise it to the farthest point, or drop the cluster and report k
        minus one.
      criteria:
        - id: empty
          label: "identifies the undefined mean for an empty cluster"
          weight: 3
          patterns: ["empty|no points|undefined|division|nan"]
        - id: handle
          label: "reassigns to the farthest point or drops it"
          weight: 3
          patterns: ["reassign|farthest|drop|remove|reinitialis"]
        - id: k
          label: "notes that k becomes effectively smaller"
          weight: 1
          patterns: ["k|smaller|fewer|effective|degenerate"]
- id: iv-code-tree-split
  kind: coding
  level: senior
  title: "Implement a decision tree split search"
  prompt: >-
    Implement the best-split search for a decision tree on a numeric feature,
    with a Gini criterion. It must scale to a million rows.
  reference_topics: [decision-trees, gradient-boosting, information-theory]
  stages:
    - id: clarify
      question: "How many candidate thresholds are there, and how do you choose among them?"
      intent: >-
        Every midpoint between sorted distinct values is a candidate, which is why
        sorting once matters.
      hint: >-
        Sort the feature once, then sweep the sorted order accumulating class counts,
        so all thresholds are evaluated in one pass rather than one sort per
        candidate.
      criteria:
        - id: candidates
          label: "identifies midpoints between sorted values as candidates"
          weight: 3
          patterns: ["sort|midpoint|threshold|candidate|between"]
        - id: sweep
          label: "a single sweep accumulates counts"
          weight: 3
          patterns: ["sweep|accumulate|prefix|cumulative|one pass"]
        - id: criterion
          label: "uses Gini or entropy as the impurity measure"
          weight: 2
          patterns: ["gini|entropy|impurity|information gain"]
    - id: approach
      question: "Write the split evaluation. What are the running sums?"
      intent: >-
        Expect left and right class counts, updated incrementally, with impurity
        computed from them.
      hint: >-
        Keep the total class counts, then move one row at a time from right to left,
        updating both histograms. Recomputing the impurity from scratch at each
        threshold is the slow version.
      criteria:
        - id: counts
          label: "maintains left and right class counts"
          weight: 3
          patterns: ["count|histogram|left|right|class"]
        - id: incremental
          label: "updates them incrementally"
          weight: 3
          patterns: ["incremental|update|move|add|subtract"]
        - id: impurity
          label: "computes weighted impurity of the two children"
          weight: 2
          patterns: ["weighted|impurity|child|gini|sum"]
    - id: efficiency
      question: "Million rows, thousand features. What dominates the time?"
      intent: >-
        Probes the sort per feature and the histogram approach for large data.
      hint: >-
        Sorting every feature is the dominant cost at order n log n per feature, and
        for very large data you switch to histogram binning, which trades exact
        splits for a fixed number of bins.
      criteria:
        - id: sort
          label: "sorting dominates at order n log n per feature"
          weight: 3
          patterns: ["sort|n log n|dominant|per feature|cost"]
        - id: histogram
          label: "histogram binning for large data"
          weight: 3
          patterns: ["histogram|bin|bucket|quantile|approx"]
        - id: subsample
          label: "subsampling or feature sampling reduces the work"
          weight: 1
          patterns: ["subsample|sample|feature subset|random|reduce"]
- id: iv-code-logreg-sgd
  kind: coding
  level: junior
  title: "Implement logistic regression with SGD"
  prompt: >-
