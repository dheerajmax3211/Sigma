- id: iv-code-reservoir
  kind: coding
  level: mid
  title: "Implement reservoir sampling"
  prompt: >-
    You see an unbounded stream and must keep a uniform sample of k items
    without knowing the length. Implement it and prove it is uniform.
  reference_topics: [probability-distributions, randomness-and-reproducibility, information-theory]
  stages:
    - id: clarify
      question: "What does uniform mean here, and why can you not know the length?"
      intent: >-
        Uniform means every item seen so far has probability k over n of being in the
        reservoir.
      hint: >-
        The invariant is that after n items, each item is retained with probability k
        over n. Stating the invariant is the first half of the proof.
      criteria:
        - id: uniform
          label: "states probability k over n"
          weight: 3
          patterns: ["k over n|k divided|probability|uniform|each item"]
        - id: stream
          label: "the length is unknown and the stream is single pass"
          weight: 2
          patterns: ["unknown|stream|single pass|cannot store|unbounded"]
        - id: invariant
          label: "states an invariant to maintain"
          weight: 2
          patterns: ["invariant|maintain|after n|induction|holds"]
    - id: approach
      question: "Write algorithm R. Why does item n get replaced with probability k over n?"
      intent: >-
        Probes the replacement rule: accept the n-th item with probability k over n,
        then replace a uniformly chosen slot.
      hint: >-
        For the n-th item, draw j uniformly from one to n; if j is at most k, replace
        slot j. That gives each item exactly k over n.
      criteria:
        - id: rule
          label: "accepts the n-th item with probability k over n"
          weight: 3
          patterns: ["k over n|probability|accept|random|j"]
        - id: replace
          label: "replaces a uniformly chosen slot"
          weight: 3
          patterns: ["replace|slot|uniform|random index|swap"]
        - id: proof
          label: "gives the induction argument"
          weight: 2
          patterns: ["induction|proof|by induction|assume|therefore"]
    - id: efficiency
      question: "A billion items arrive. Is the one-in-n draw per item a problem?"
      intent: >-
        Probes the cost of randomness and the skip-based optimisation.
      hint: >-
        A random draw per item is fine but unnecessary; you can sample the gap to the
        next accepted item from a geometric distribution and skip ahead, which
        matters when the stream is huge and items are expensive to touch.
      criteria:
        - id: skip
          label: "skipping with a geometric or gap distribution"
          weight: 3
          patterns: ["skip|geometric|gap|jump|next"]
        - id: cost
          label: "the per-item draw is a constant cost"
          weight: 2
          patterns: ["constant|per item|cheap|o n|linear"]
        - id: seed
          label: "seeding makes the sample reproducible"
          weight: 1
          patterns: ["seed|reproduc|deterministic|rng|random state"]
- id: iv-code-bloom
  kind: coding
  level: senior
  title: "Implement a Bloom filter"
  prompt: >-
    Implement a Bloom filter: add and membership test, with a stated false
    positive rate. Size it for one percent false positives at ten million keys.
  reference_topics: [probability-distributions, information-theory, randomness-and-reproducibility]
  stages:
    - id: clarify
      question: "What error is allowed, and in which direction?"
      intent: >-
        Bloom filters have false positives but never false negatives.
      hint: >-
        A Bloom filter can say present when absent, never absent when present. That
        asymmetry is the contract, and it is why it cannot be used for deletion
        without counting.
      criteria:
        - id: direction
          label: "no false negatives, only false positives"
          weight: 3
          patterns: ["false positive|no false negative|never|one sided|asymmetr"]
        - id: rate
          label: "targets a stated false positive rate"
          weight: 2
          patterns: ["rate|one percent|0.01|target|probability"]
        - id: delete
          label: "notes that deletion is not supported"
          weight: 2
          patterns: ["delete|remove|cannot|counting|unsupported"]
    - id: approach
      question: "Write it. How do you size the bit array and choose the number of hashes?"
      intent: >-
        Expect m equals minus n ln p over ln two squared, and k equals m over n ln
        two.
      hint: >-
        The optimal bit count is minus n log p divided by log two squared, and the
        optimal hash count is m over n times log two. Both follow from the false
        positive formula.
      criteria:
        - id: size
          label: "derives or states the bit array size from n and p"
          weight: 3
          patterns: ["minus n log|bits per|array size|m equals|formula"]
        - id: hashes
          label: "optimal hash count is m over n times log two"
          weight: 3
          patterns: ["hash count|k equals|log two|optimal|number of hashes"]
        - id: set
          label: "sets and tests k bits"
          weight: 2
          patterns: ["set|test|bit|index|check"]
    - id: efficiency
      question: "Ten million keys at one percent. How much memory, and how do you hash?"
      intent: >-
        Probes the arithmetic: about 9.6 bits per key, roughly 12 MB, and double
        hashing instead of k independent hashes.
      hint: >-
        At one percent you need about 9.6 bits per key, so roughly 12 MB for ten
        million keys. Deriving k indices from two hashes avoids computing k hashes.
      criteria:
        - id: memory
          label: "computes bits per key and total memory"
          weight: 3
          patterns: ["bits per key|9.6|megabyte|mb|memory"]
        - id: double
          label: "derives indices by double hashing"
          weight: 2
          patterns: ["double hash|two hashes|derive|combine|kirsch"]
        - id: arith
          label: "shows the substitution rather than quoting a result"
          weight: 2
          patterns: ["substitute|arithmetic|compute|calculate|plug"]
- id: iv-code-lru
  kind: coding
  level: mid
  title: "Implement an LRU cache"
  prompt: >-
    Implement an LRU cache with get and put in constant time, with a capacity.
    Then explain what breaks under concurrency.
  reference_topics: [system-design-foundations, computation-graphs]
  stages:
    - id: clarify
      question: "What operations must be constant time, and what is evicted?"
      intent: >-
        Both get and put must be constant, which requires a hash map plus a
        doubly-linked list.
      hint: >-
        A hash map gives lookup, but you also need to move a node to the front and
        remove the tail in constant time, which is a doubly-linked list. An array
        makes one of those linear.
      criteria:
        - id: ops
          label: "get and put are both constant time"
          weight: 3
          patterns: ["constant|o 1|both|get|put"]
        - id: structures
          label: "hash map plus doubly-linked list"
          weight: 3
          patterns: ["hash map|dictionary|doubly|linked list|two structures"]
        - id: evict
          label: "evicts the least recently used entry"
          weight: 2
          patterns: ["least recently|tail|lru|evict|oldest"]
    - id: approach
      question: "Write get and put. What happens on a hit?"
      intent: >-
        A hit must move the node to the front, which is the part candidates forget.
      hint: >-
        On a hit you unlink the node and push it to the front; on a put to an
        existing key you do the same, and on a new key you may need to evict the
        tail. Forgetting the move makes it a FIFO.
      criteria:
        - id: move
          label: "moves the accessed node to the front"
          weight: 3
          patterns: ["move|front|most recent|unlink|reorder"]
        - id: insert
          label: "inserts new entries at the front"
          weight: 2
          patterns: ["insert|front|push|head|new"]
        - id: remove
          label: "removes the tail node and its map entry on eviction"
          weight: 2
          patterns: ["tail|remove|delete|evict|capacity"]
    - id: concurrency
      question: "Two threads hit the same key. What goes wrong, and how do you fix it?"
      intent: >-
        Probes lock granularity and the classic cure: shard the cache by key.
      hint: >-
        The list pointers are shared mutable state, so concurrent hits corrupt the
        list. A single lock serialises everything; sharding by key with a lock per
        shard keeps most of the parallelism.
      criteria:
        - id: race
          label: "identifies the race on the list pointers"
          weight: 3
          patterns: ["race|corrupt|thread|pointer|concurrent"]
        - id: shard
          label: "shards by key with a lock per shard"
          weight: 3
          patterns: ["shard|stripe|lock per|partition|segment"]
        - id: lockfree
          label: "mentions an approximate or lock-free alternative"
          weight: 1
          patterns: ["lock free|approximate|clock|atomic|cas"]
- id: iv-code-consistent-hash
  kind: coding
  level: senior
  title: "Implement consistent hashing with virtual nodes"
  prompt: >-
    Implement a consistent hash ring that maps keys to nodes, minimises
    remapping when a node joins or leaves, and balances load.
  reference_topics: [system-design-foundations, probability-distributions]
  stages:
    - id: clarify
      question: "What must happen to keys when a node is added?"
      intent: >-
        Only the keys that belonged to the added node's arc should move, roughly one
        over n of them.
      hint: >-
        Adding a node must move only the keys in its arc, about one over n of the
        total. A modulo hash moves almost everything, which is the problem being
        solved.
      criteria:
        - id: movement
          label: "only one over n of keys move"
          weight: 3
          patterns: ["one over n|fraction|only|move|1/n"]
        - id: modulo
          label: "contrasts with modulo hashing"
          weight: 2
          patterns: ["modulo|mod|everything|remap|naive"]
        - id: ring
          label: "describes keys and nodes on a shared ring"
          weight: 2
          patterns: ["ring|circle|hash space|arc|clockwise"]
    - id: approach
      question: "Write the lookup and the join operation. Where do virtual nodes fit?"
      intent: >-
        Expect multiple hashes per node to smooth the distribution, and a sorted
        structure for lookup.
      hint: >-
        One point per node gives a lumpy distribution; replicating each node across
        many points on the ring evens it out. Lookup is a binary search on the
        sorted ring.
      criteria:
        - id: vnodes
          label: "multiple virtual nodes per physical node"
          weight: 3
          patterns: ["virtual|replica|multiple points|vnodes|many"]
        - id: lookup
          label: "binary search for the next point on the ring"
          weight: 2
          patterns: ["binary search|sorted|next|bisect|successor"]
        - id: join
          label: "join moves only the affected ranges"
          weight: 2
          patterns: ["join|add|move|range|reassign"]
    - id: efficiency
      question: "How many virtual nodes do you need, and what does the variance look like?"
      intent: >-
        Probes the standard deviation of load and the cost of more points.
      hint: >-
        With one point per node the load standard deviation is comparable to the
        mean; a few hundred virtual nodes per physical node brings it down to a few
        percent, at the cost of a larger ring and slower lookup.
      criteria:
        - id: variance
          label: "quantifies load variance"
          weight: 3
          patterns: ["variance|standard deviation|spread|balance|percent"]
        - id: count
          label: "states a virtual node count or range"
          weight: 2
          patterns: ["hundred|100|200|thousand|count"]
        - id: tradeoff
          label: "states the memory and lookup cost"
          weight: 2
          patterns: ["cost|memory|slower|larger|tradeoff"]
- id: iv-code-token-bucket
  kind: coding
  level: mid
  title: "Implement a token bucket rate limiter"
  prompt: >-
    Implement a token bucket: capacity, refill rate, and an allow call. It must
    be correct under a clock that does not advance uniformly.
  reference_topics: [system-design-foundations, randomness-and-reproducibility]
  stages:
    - id: clarify
      question: "What do capacity and refill rate mean in user terms?"
      intent: >-
        Capacity is burst size, refill is sustained rate; conflating them is the
        common error.
      hint: >-
        Capacity is how large a burst you tolerate, refill rate is the sustained
        requests per second. Choosing capacity equal to the rate forbids any burst.
      criteria:
        - id: capacity
          label: "capacity bounds the burst"
          weight: 3
          patterns: ["burst|capacity|bucket size|how many at once"]
        - id: rate
          label: "refill rate is the sustained rate"
          weight: 3
          patterns: ["refill|sustained|per second|rate|steady"]
        - id: semantics
          label: "asks whether a rejected request consumes a token"
          weight: 1
          patterns: ["reject|consume|charge|deny|fail"]
    - id: approach
      question: "Write allow. How do you avoid a background refill thread?"
      intent: >-
        Expect lazy refill computed from elapsed time, not a timer.
      hint: >-
        Store the last refill timestamp and compute tokens as elapsed time times rate,
        capped at capacity. A timer per bucket does not scale to a million keys.
      criteria:
        - id: lazy
          label: "lazy refill from elapsed time"
          weight: 3
          patterns: ["elapsed|timestamp|lazy|compute|since"]
        - id: cap
          label: "caps tokens at capacity"
          weight: 2
          patterns: ["cap|minimum|capacity|max|clamp"]
        - id: allow
          label: "allows only if a token is available, and decrements"
          weight: 2
          patterns: ["allow|decrement|available|subtract|permit"]
    - id: concurrency
      question: "A thousand servers share one bucket. What is the design?"
      intent: >-
        Probes the atomicity of the read-modify-write and the local-versus-central
        tradeoff.
      hint: >-
        The read-modify-write must be atomic, which means a Lua script or a
        conditional update in the shared store. A local bucket per server lets the
        fleet exceed the limit by the server count.
      criteria:
        - id: atomic
          label: "atomic update in a shared store"
          weight: 3
          patterns: ["atomic|lua|compare and swap|transaction|conditional"]
        - id: local
          label: "local buckets admit over-admission proportional to the fleet"
          weight: 3
          patterns: ["local|per node|fleet|over admit|multiply"]
        - id: clock
          label: "uses a monotonic clock, not wall time"
          weight: 2
          patterns: ["monotonic|clock|wall|skew|drift"]
- id: iv-code-welford
  kind: coding
  level: senior
  title: "Compute streaming mean and variance"
  prompt: >-
    Implement running mean and variance over a stream of floats, in one pass,
    without storing the values.
  reference_topics: [probability-distributions, numerical-linear-algebra, time-series]
  stages:
    - id: clarify
      question: "What is the naive one-pass formula, and what is wrong with it?"
      intent: >-
        Probes catastrophic cancellation in sum of squares minus square of sum.
      hint: >-
        The naive form subtracts two large nearly equal numbers, so precision is
        destroyed when the mean is large relative to the variance. That is the whole
        motivation.
      criteria:
        - id: naive
          label: "names the sum of squares formula"
          weight: 2
          patterns: ["sum of squares|e x squared|naive|formula|one pass"]
        - id: cancellation
          label: "names catastrophic cancellation"
          weight: 3
          patterns: ["cancel|precision|catastroph|subtract|large"]
        - id: why
          label: "explains when it fails: large mean, small variance"
          weight: 2
          patterns: ["large mean|small variance|close|relative|when"]
    - id: approach
      question: "Write Welford's update. What are the two accumulators?"
      intent: >-
        Expect a running mean and a running sum of squared deviations, updated with
        the delta.
      hint: >-
        Keep the count, the mean, and the sum of squared deviations. Each new value
        updates the mean by delta over n and the deviation sum by delta times the new
        delta.
      criteria:
        - id: state
          label: "count, mean and sum of squared deviations"
          weight: 3
          patterns: ["count|mean|deviation|m2|sum of squares|state"]
        - id: update
          label: "updates with the delta and the new delta"
          weight: 3
          patterns: ["delta|update|increment|difference|new"]
        - id: variance
          label: "variance is the deviation sum over n or n minus one"
          weight: 2
          patterns: ["divide|n minus one|variance|sample|population"]
    - id: numerics
      question: "How does this behave in fp16, and what would you change?"
      intent: >-
        Probes precision: accumulate in fp32 or fp64, and the limits of the method.
      hint: >-
        fp16 cannot represent the deviation sum for long streams, so you accumulate
        in fp32 at minimum. For very long streams, pairwise or block merging keeps
        the error bounded.
      criteria:
        - id: precision
          label: "accumulates in higher precision"
          weight: 3
          patterns: ["fp32|float32|double|higher precision|accumulat"]
        - id: overflow
          label: "notes overflow or loss in fp16"
          weight: 2
          patterns: ["overflow|fp16|half|lose|range"]
        - id: merge
          label: "parallel or block merging of statistics"
          weight: 2
          patterns: ["merge|parallel|combine|block|chunk"]
- id: iv-code-moe-router
  kind: coding
  level: staff
  title: "Implement a top-2 mixture-of-experts router"
  prompt: >-
    Implement the router for a mixture-of-experts layer: gate logits, top-2
    selection, normalised weights, and the capacity limit.
  reference_topics: [mixture-of-experts, transformer-block, sequence-expert-parallelism]
  stages:
    - id: clarify
      question: "What does the router produce, and what constraint does capacity add?"
      intent: >-
        The router produces expert indices and weights; capacity limits how many
        tokens each expert may take.
      hint: >-
        The router emits top-k expert indices and their weights per token, and the
        capacity factor caps tokens per expert, which forces some tokens to be
        dropped or rerouted.
      criteria:
        - id: output
          label: "expert indices and weights per token"
          weight: 3
          patterns: ["index|weight|expert|per token|top k"]
        - id: capacity
          label: "capacity factor limits tokens per expert"
          weight: 3
          patterns: ["capacity|factor|limit|drop|overflow"]
        - id: load
          label: "asks about load balancing"
          weight: 2
          patterns: ["load balanc|balance|uniform|auxiliary|distribution"]
    - id: approach
      question: "Write the routing. How are the two weights normalised?"
      intent: >-
        Expect softmax over the selected logits, so the two weights sum to one.
      hint: >-
        Take the top two logits, softmax over just those two, and scale each expert's
        output by its weight. Normalising over all experts instead changes the scale
        of the layer.
      criteria:
        - id: top2
          label: "selects the top two logits"
          weight: 3
          patterns: ["top two|top 2|topk|argmax|highest"]
        - id: norm
          label: "softmax over the selected logits only"
          weight: 3
          patterns: ["softmax|normalis|normaliz|sum to one|selected"]
        - id: combine
          label: "combines the expert outputs weighted"
          weight: 2
          patterns: ["weighted|combine|sum|scale|output"]
    - id: scale
      question: "The router collapses onto two experts. What is the failure and the fix?"
      intent: >-
        Probes load-balancing loss and the collapse failure mode.
      hint: >-
        Without a balancing signal the router sends everything to a few experts,
        wasting capacity and starving the rest. An auxiliary load-balancing loss or
        a capacity-aware assignment fixes it.
      criteria:
        - id: collapse
          label: "names expert collapse"
          weight: 3
          patterns: ["collapse|all tokens|few experts|starve|imbalance"]
        - id: aux
          label: "an auxiliary load-balancing loss"
          weight: 3
          patterns: ["auxiliary|aux loss|balance loss|penalty|coefficient"]
        - id: jitter
          label: "noise or jitter during training for exploration"
          weight: 1
          patterns: ["noise|jitter|explor|random|stochastic"]
- id: iv-code-spec-verify
  kind: coding
  level: staff
  title: "Implement the speculative decoding verify step"
  prompt: >-
    Implement verification for speculative decoding: a draft model proposes k
    tokens, the target model scores them in one pass, and you must accept a
    prefix without changing the output distribution.
  reference_topics: [speculative-decoding, decoding-strategies, kv-cache]
  stages:
    - id: clarify
      question: "What exactly must be preserved, and what does the target model return?"
      intent: >-
        The requirement is distributional equivalence, not similarity; the target
        returns logits for every drafted position plus one extra.
      hint: >-
        The output must be distributed exactly as if the target model had generated
        alone. That means the target must score every drafted position in one
        forward pass, which is why you pass k plus one positions.
      criteria:
        - id: preserve
          label: "the output distribution must be unchanged"
          weight: 3
          patterns: ["distribution|exact|equivalent|same|unchanged"]
        - id: logits
          label: "the target scores all drafted positions in one pass"
          weight: 3
          patterns: ["logits|score|forward|one pass|all positions"]
        - id: extra
          label: "needs one extra position for the rejection sample"
          weight: 2
          patterns: ["extra|k plus one|one more|bonus|additional"]
    - id: approach
      question: "Write the accept-reject loop. When do you stop accepting?"
      intent: >-
        Expect comparison against a uniform draw, acceptance while the draw is below
        the probability ratio, and resampling at the first rejection.
      hint: >-
        For each position, accept if a uniform draw is below the ratio of target to
        draft probability, and stop at the first rejection; then sample from the
        residual distribution at that position.
      criteria:
        - id: ratio
          label: "compares a uniform draw against the probability ratio"
          weight: 3
          patterns: ["uniform|random|ratio|probability|compare"]
        - id: stop
          label: "stops at the first rejection"
          weight: 2
          patterns: ["first|stop|break|reject|until"]
        - id: residual
          label: "samples from the residual distribution, not the target"
          weight: 3
          patterns: ["residual|corrected|normalis|difference|max of zero"]
    - id: numerics
      question: "The draft and target are in different precisions. What breaks?"
      intent: >-
        Probes the sensitivity of the ratio test to numerical noise and the need for
        a shared precision in the comparison.
      hint: >-
        The acceptance test compares probabilities, so a small precision difference
        changes the accept rate and, worse, biases the output. Compare in fp32 even
        if the forward pass is fp16.
      criteria:
        - id: precision
          label: "compares probabilities in fp32"
          weight: 3
          patterns: ["fp32|float32|precision|upcast|compare in"]
        - id: bias
          label: "notes that a biased test changes the output distribution"
          weight: 3
          patterns: ["bias|distribution|change|skew|not exact"]
        - id: rate
          label: "notes the accept rate moves with the tolerance"
          weight: 1
          patterns: ["accept rate|tolerance|threshold|sensitive|moves"]
