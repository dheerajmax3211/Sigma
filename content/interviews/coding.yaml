- id: iv-code-attention
  kind: coding
  level: senior
  title: "Implement scaled dot-product attention"
  prompt: >-
    Implement scaled dot-product attention from scratch: given Q, K and V
    tensors, return the attended output. Handle a causal mask and explain the
    shapes.
  reference_topics: [attention-from-first-principles, multi-head-attention, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "Before writing code, state the shapes and what the mask must do."
      intent: >-
        Shape discipline is the first skill; most bugs here are transposes.
      hint: >-
        Q is batch by heads by query length by head dim, K is the same with key
        length, and the scores are query length by key length. Transposing K is
        the step people skip.
      criteria:
        - id: shapes
          label: "states the shapes of Q, K, V and the score matrix"
          weight: 3
          patterns: ["batch|shape|dimension|query length|key length"]
        - id: transpose
          label: "transposes K for the matmul"
          weight: 2
          patterns: ["transpose|k transpose|swap|k t|matmul"]
        - id: mask
          label: "describes the causal mask as negative infinity before softmax"
          weight: 3
          patterns: ["mask|causal|negative infinity|upper triangular|future"]
    - id: approach
      question: "Write the forward pass. Talk me through each line."
      intent: >-
        Expect scale, scores, mask, softmax, then the value matmul.
      hint: >-
        The order is scores equals Q K transpose divided by the square root of the
        head dimension, mask, softmax over the last axis, then multiply by V.
      criteria:
        - id: scale
          label: "divides by the square root of the head dimension"
          weight: 3
          patterns: ["sqrt|square root|scale|divide|head dim"]
        - id: softmax
          label: "softmax over the key axis"
          weight: 2
          patterns: ["softmax|normalis|normaliz|exp|last axis"]
        - id: value
          label: "multiplies the probabilities by V"
          weight: 2
          patterns: ["matmul|multiply|times v|weighted sum|value"]
    - id: numerics
      question: "Why divide by the square root of the head dimension, and what breaks in fp16?"
      intent: >-
        Tests whether the scaling is understood as variance control, not folklore.
      hint: >-
        The dot product of independent unit-variance vectors has variance equal to
        the dimension, so dividing by its square root keeps the logits at unit
        scale; without it softmax saturates and gradients vanish.
      criteria:
        - id: variance
          label: "explains the variance argument for the scale"
          weight: 3
          patterns: ["variance|scale|unit|grow|magnitude"]
        - id: saturate
          label: "names softmax saturation and vanishing gradients"
          weight: 2
          patterns: ["saturat|vanish|gradient|peaky|one hot"]
        - id: fp16
          label: "notes overflow in fp16 and the need to accumulate in fp32"
          weight: 2
          patterns: ["fp16|overflow|float32|fp32|accumulat|precision"]
    - id: efficiency
      question: "The sequence is 32k tokens. What is the cost, and how do you make it tractable?"
      intent: >-
        Probes the quadratic memory of the score matrix and the flash-attention
        answer.
      hint: >-
        The score matrix is n squared in memory, which is 4 GB per head at 32k in
        fp16. Flash attention tiles the computation so the matrix is never
        materialised.
      criteria:
        - id: quadratic
          label: "states the quadratic time and memory in sequence length"
          weight: 3
          patterns: ["quadratic|n squared|n2|o n|sequence length"]
        - id: flash
          label: "tiling or flash attention avoids materialising the matrix"
          weight: 3
          patterns: ["flash|tile|fused|block|never materialis|never materializ"]
        - id: memory
          label: "quantifies the memory at this length"
          weight: 1
          patterns: ["gb|memory|bytes|32k|per head"]
- id: iv-code-mha
  kind: coding
  level: senior
  title: "Implement multi-head attention"
  prompt: >-
    Implement multi-head attention from a single input tensor: project into
    heads, attend, concatenate, and project out. No nn.MultiheadAttention.
  reference_topics: [multi-head-attention, attention-from-first-principles, transformer-block]
  stages:
    - id: clarify
      question: "What are the projection shapes, and how do heads split?"
      intent: >-
        The head split is a reshape, and the projection width must equal heads
        times head dimension.
      hint: >-
        One projection to three times the model dimension, then reshape into heads
        by head dimension. The reshape, not a loop over heads, is the implementation.
      criteria:
        - id: projections
          label: "three linear projections to model dimension"
          weight: 2
          patterns: ["qkv|three|projection|linear|weight"]
        - id: split
          label: "reshapes into heads rather than looping"
          weight: 3
          patterns: ["reshape|view|split|head dim|unfold"]
        - id: concat
          label: "concatenates heads and applies the output projection"
          weight: 2
          patterns: ["concat|stack|merge|output projection|wo"]
    - id: approach
      question: "Write it. Where does the head dimension go in the tensor?"
      intent: >-
        Expect batch, heads, sequence, head dim, and a transpose into that layout.
      hint: >-
        The layout is batch by heads by sequence by head dim. Getting the sequence
        and head axes the wrong way round produces attention across the wrong
        dimension and a model that trains but learns nothing.
      criteria:
        - id: layout
          label: "batch, heads, sequence, head dim layout"
          weight: 3
          patterns: ["batch|head|sequence|layout|permute"]
        - id: perhead
          label: "attention computed independently per head"
          weight: 2
          patterns: ["each head|per head|independent|parallel"]
        - id: back
          label: "transposes back before the output projection"
          weight: 2
          patterns: ["transpose|permute|reshape back|contiguous"]
    - id: numerics
      question: "What does head dimension do to the scale, and why not use one big head?"
      intent: >-
        Probes the representational argument: multiple heads attend to different
        relations.
      hint: >-
        The scale uses the head dimension, not the model dimension. Multiple heads
        let the model attend to several relations at once; one big head has the
        same parameter count but a single attention pattern.
      criteria:
        - id: scale
          label: "scales by the head dimension"
          weight: 3
          patterns: ["head dim|per head|sqrt|scale"]
        - id: why
          label: "explains the representational benefit of multiple heads"
          weight: 2
          patterns: ["different|relation|subspace|pattern|multiple"]
        - id: params
          label: "notes the parameter count is unchanged"
          weight: 1
          patterns: ["parameter|same|count|cost|equivalent"]
- id: iv-code-layernorm
  kind: coding
  level: mid
  title: "Implement LayerNorm forward and backward"
  prompt: >-
    Implement LayerNorm over the last dimension, including the backward pass.
    It must be numerically stable in fp16.
  reference_topics: [normalisation-layers, batchnorm-layernorm, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "Which dimensions are normalised, and what is learned?"
      intent: >-
        LayerNorm normalises across features per token, not across the batch —
        that is the whole distinction from BatchNorm.
      hint: >-
        Statistics are computed over the feature dimension for each token
        independently, so batch size does not affect the result. Scale and shift
        are learned per feature.
      criteria:
        - id: axis
          label: "normalises over the feature dimension per example"
          weight: 3
          patterns: ["feature|last dim|per token|per example|not batch"]
        - id: params
          label: "learned scale and shift per feature"
          weight: 2
          patterns: ["gamma|scale|beta|shift|learned"]
        - id: epsilon
          label: "uses epsilon inside the square root for stability"
          weight: 2
          patterns: ["epsilon|eps|small|variance|stability"]
    - id: approach
      question: "Write the forward pass. Then explain the backward pass."
      intent: >-
        Expect mean, variance, normalise, scale, shift; and a backward that passes
        through the mean and variance.
      hint: >-
        The backward is not just a scale: because the mean and variance depend on
        all inputs, the gradient has terms for both. Skipping them is the classic
        wrong answer.
      criteria:
        - id: forward
          label: "mean, variance, normalise, then affine"
          weight: 2
          patterns: ["mean|average|variance|normalis|normaliz|affine"]
        - id: backward
          label: "backward accounts for the mean and variance terms"
          weight: 3
          patterns: ["backward|gradient|chain|mean term|variance term"]
        - id: reduce
          label: "the reduction is over the feature axis in both passes"
          weight: 1
          patterns: ["reduce|sum|axis|feature"]
    - id: numerics
      question: "Why compute variance as E of x squared minus E of x squared, or why not?"
      intent: >-
        Probes catastrophic cancellation and the two-pass versus one-pass tradeoff.
      hint: >-
        That one-pass form cancels catastrophically when the mean is large relative
        to the variance. The two-pass version, or Welford, is safer at the cost of
        another read.
      criteria:
        - id: cancellation
          label: "names catastrophic cancellation"
          weight: 3
          patterns: ["cancellation|cancel|precision|subtract|catastroph"]
        - id: welford
          label: "offers Welford or a two-pass alternative"
          weight: 3
          patterns: ["welford|two pass|streaming|online|stable"]
        - id: fp16
          label: "accumulates statistics in fp32"
          weight: 2
          patterns: ["fp32|float32|accumulat|upcast|precision"]
- id: iv-code-batchnorm
  kind: coding
  level: mid
  title: "Implement BatchNorm and explain train versus eval"
  prompt: >-
    Implement BatchNorm for a 2D tensor. The same code must behave differently
    in training and evaluation, and you must say why.
  reference_topics: [batchnorm-layernorm, normalisation-layers, regularisation]
  stages:
    - id: clarify
      question: "What statistics are used in each mode?"
      intent: >-
        Train uses batch statistics and updates running estimates; eval uses the
        running estimates.
      hint: >-
        In training you normalise by the current batch and update a running mean
        and variance with momentum; in evaluation you use those running values, so
        the output does not depend on the batch.
      criteria:
        - id: train
          label: "training uses batch statistics"
          weight: 3
          patterns: ["batch|current|train|statistic"]
        - id: running
          label: "running estimates updated with momentum"
          weight: 3
          patterns: ["running|moving|momentum|ema|estimate"]
        - id: eval
          label: "evaluation uses the running statistics"
          weight: 3
          patterns: ["eval|inference|test|running|frozen"]
    - id: approach
      question: "Write the forward pass for both modes, and the update rule."
      intent: >-
        Expect per-channel mean and variance over batch and spatial dims, and a
        momentum update.
      hint: >-
        The reduction is over batch and spatial dimensions per channel, and the
        running update is a moving average with momentum — not a replacement.
      criteria:
        - id: reduce
          label: "reduces over batch and spatial dimensions per channel"
          weight: 3
          patterns: ["channel|per channel|batch|spatial|reduce"]
        - id: update
          label: "running update is a moving average"
          weight: 2
          patterns: ["momentum|moving average|ema|blend|update"]
        - id: affine
          label: "applies learned gamma and beta after normalising"
          weight: 1
          patterns: ["gamma|beta|scale|shift|affine"]
    - id: numerics
      question: "Why does BatchNorm behave badly with batch size one, and what does that tell you?"
      intent: >-
        Probes the dependence on batch statistics and the reason LayerNorm or GroupNorm
        exists.
      hint: >-
        With a batch of one the variance is zero and the normalisation divides by
        epsilon, which destroys the signal. That dependence on batch size is why
        transformers use LayerNorm.
      criteria:
        - id: batchone
          label: "variance collapses with a batch of one"
          weight: 3
          patterns: ["batch of one|batch size 1|variance zero|degenerate|collapse"]
        - id: alternative
          label: "names LayerNorm or GroupNorm as the batch-independent alternative"
          weight: 3
          patterns: ["layernorm|layer norm|group norm|instance norm|batch independent"]
        - id: bias
          label: "notes the train-eval discrepancy when batches differ"
          weight: 1
          patterns: ["train eval|discrepan|mismatch|different|skew"]
- id: iv-code-backprop-mlp
  kind: coding
  level: senior
  title: "Backpropagate through a two-layer MLP by hand"
  prompt: >-
    Given a two-layer network with ReLU and mean squared error, derive and
    implement the gradients without an autograd library.
  reference_topics: [backpropagation, autograd-engine, computation-graphs]
  stages:
    - id: clarify
      question: "Write the forward pass symbolically before differentiating."
      intent: >-
        A candidate who jumps to gradients without the forward graph will lose a
        term.
      hint: >-
        Write z1 equals x W1 plus b1, a1 equals relu of z1, z2 equals a1 W2 plus b2,
        and the loss. Every gradient is a local derivative times an upstream one.
      criteria:
        - id: forward
          label: "writes the forward equations with shapes"
          weight: 3
          patterns: ["z1|a1|z2|forward|equation"]
        - id: chain
          label: "describes the chain rule through each op"
          weight: 3
          patterns: ["chain|local|upstream|backward|derivative"]
        - id: shapes
          label: "keeps shapes consistent for each gradient"
          weight: 1
          patterns: ["shape|dimension|transpose|matches"]
    - id: approach
      question: "Derive the gradient for W1. Where does the ReLU mask enter?"
      intent: >-
        Probes the ordering: loss gradient, then W2, then through ReLU, then W1.
      hint: >-
        The ReLU derivative is a zero-one mask on z1 greater than zero, applied to
        the upstream gradient before it reaches W1. Forget the mask and the network
        becomes linear.
      criteria:
        - id: order
          label: "backpropagates from the loss through layer two first"
          weight: 3
          patterns: ["output|last layer|w2|reverse|backward order"]
        - id: relu
          label: "the ReLU gradient is a zero-one mask"
          weight: 3
          patterns: ["mask|zero|greater than zero|indicator|relu derivative"]
        - id: w1
          label: "W1 gradient is the input transpose times the upstream gradient"
          weight: 2
          patterns: ["transpose|input|outer|a1|x t|matmul"]
    - id: numerics
      question: "The loss becomes NaN after a few hundred steps. What do you check?"
      intent: >-
        Probes practical debugging: learning rate, exploding gradients, log of zero,
        division by zero.
      hint: >-
        Check the learning rate first, then gradient norms per layer, then whether
        any log or division produced an infinity. A single NaN propagates through
        every parameter on the next step.
      criteria:
        - id: lr
          label: "checks the learning rate first"
          weight: 2
          patterns: ["learning rate|step size|too large|lr"]
        - id: norm
          label: "inspects per-layer gradient norms"
          weight: 3
          patterns: ["gradient norm|norm|explod|per layer|clip"]
        - id: source
          label: "looks for log of zero or division by zero"
          weight: 2
          patterns: ["log|division|zero|inf|sqrt"]
- id: iv-code-crossentropy
  kind: coding
  level: mid
  title: "Implement cross-entropy loss stably"
  prompt: >-
    Implement softmax cross-entropy for a batch of logits and integer labels.
    It must not overflow and it must produce a correct gradient.
  reference_topics: [information-theory, probability-distributions, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "What is the loss mathematically, and where does it break numerically?"
      intent: >-
        The loss is negative log of the probability of the correct class, and the
        naive form exponentiates large logits.
      hint: >-
        The loss for one example is minus the log of softmax at the true class,
        which equals logsumexp of the logits minus the logit of the true class — a
        form that never exponentiates a large number alone.
      criteria:
        - id: formula
          label: "states minus log of the correct-class probability"
          weight: 3
          patterns: ["negative log|minus log|log prob|correct class|nll"]
        - id: break
          label: "names overflow in the naive exp"
          weight: 3
          patterns: ["overflow|exp|inf|large|naive"]
        - id: logsumexp
          label: "uses logsumexp or the max-shifted form"
          weight: 3
          patterns: ["logsumexp|log sum exp|subtract max|shift|stable"]
    - id: approach
      question: "Write the function. What is the gradient with respect to the logits?"
      intent: >-
        The gradient is softmax minus the one-hot label, divided by the batch —
        simple, and worth knowing cold.
      hint: >-
        The gradient is softmax of the logits minus the one-hot target, averaged
        over the batch. It is the cleanest gradient in deep learning and you should
        be able to state it without deriving.
      criteria:
        - id: grad
          label: "gradient is softmax minus one-hot"
          weight: 3
          patterns: ["softmax minus|minus one hot|p minus y|difference"]
        - id: batch
          label: "averages or sums over the batch consistently"
          weight: 1
          patterns: ["mean|average|sum|batch|divide"]
        - id: impl
          label: "gathers the true-class logit rather than a full matmul"
          weight: 2
          patterns: ["gather|index|select|true class|label"]
    - id: numerics
      question: "A label is out of range. What does your code do?"
      intent: >-
        Probes input validation and the failure mode of silent negative indexing.
      hint: >-
        Python negative indexing means an out-of-range label silently selects the
        wrong class and trains the model on a lie. Validate the range explicitly.
      criteria:
        - id: validate
          label: "validates labels against the number of classes"
          weight: 3
          patterns: ["validat|range|check|assert|bound"]
        - id: negative
          label: "names negative indexing as a silent failure"
          weight: 2
          patterns: ["negative|wrap|silent|wrong class|python"]
        - id: raise
          label: "raises rather than clamping"
          weight: 1
          patterns: ["raise|error|exception|fail|reject"]
- id: iv-code-kv-decode
  kind: coding
  level: senior
  title: "Implement the KV cache for one decode step"
  prompt: >-
    Implement autoregressive decoding with a KV cache: the first call is a
    prefill over the prompt, and each later call processes one token. Explain
    what changes between the two.
  reference_topics: [kv-cache, transformer-block, attention-from-first-principles]
  stages:
    - id: clarify
      question: "What is stored in the cache, and what is its shape?"
      intent: >-
        The cache holds K and V per layer per head for every past position.
      hint: >-
        The cache is two tensors per layer, each batch by heads by past length by
        head dim, grown by concatenation or written into a preallocated buffer at
        the current position.
      criteria:
        - id: contents
          label: "stores K and V per layer, not the queries"
          weight: 3
          patterns: ["key|value|k and v|per layer|cache"]
        - id: shape
          label: "states the cache shape including past length"
          weight: 2
          patterns: ["shape|past|length|head|batch"]
        - id: grow
          label: "appends rather than recomputing"
          weight: 2
          patterns: ["append|concat|write|grow|update"]
    - id: approach
      question: "Write the decode step. How does attention differ from prefill?"
      intent: >-
        Probing: one query attends to n keys, so there is no causal mask needed and
        the score matrix is a vector.
      hint: >-
        In decode the query has length one, so scores are one by past length and no
        mask is needed — every cached position is in the past by construction.
      criteria:
        - id: single
          label: "query length of one during decode"
          weight: 3
          patterns: ["one token|length one|single|query|step"]
        - id: nomask
          label: "no causal mask needed because all cached positions are past"
          weight: 3
          patterns: ["no mask|mask not|unnecessary|all past|already"]
        - id: concat
          label: "concatenates the new key and value before attention"
          weight: 2
          patterns: ["concat|append|new key|update cache|insert"]
    - id: efficiency
      question: "Where does the time actually go in decode, and why is it not the matmuls?"
      intent: >-
        Probes memory-bandwidth-bound decoding and arithmetic intensity.
      hint: >-
        Each decode step reads the whole cache and every weight to produce one
        token, so it is bandwidth-bound; that is why batching helps and why the
        cache size limits concurrency.
      criteria:
        - id: bandwidth
          label: "identifies memory bandwidth as the limit"
          weight: 3
          patterns: ["bandwidth|memory bound|arithmetic intensity|read"]
        - id: batch
          label: "batching amortises the weight reads"
          weight: 2
          patterns: ["batch|amortis|amortiz|share|concurren"]
        - id: capacity
          label: "cache size caps the batch"
          weight: 2
          patterns: ["capacity|limit|memory|how many|batch size"]
- id: iv-code-bpe-train
  kind: coding
  level: staff
  title: "Train a byte-pair encoding tokenizer"
  prompt: >-
    Implement BPE training: given a corpus, learn merges until the vocabulary
    reaches a target size, and explain what you are optimising.
  reference_topics: [tokenisation, information-theory, long-context]
  stages:
    - id: clarify
      question: "What is the starting alphabet, and what counts as a word?"
      intent: >-
        Pre-tokenisation and the initial vocabulary decide everything downstream.
      hint: >-
        Start from bytes or characters, pre-split on whitespace or a regex, and
        count word frequencies once. Training on raw characters without
        pre-tokenisation learns merges across word boundaries.
      criteria:
        - id: alphabet
          label: "starts from bytes or characters"
          weight: 2
          patterns: ["byte|character|char|alphabet|initial"]
        - id: pretokenise
          label: "pre-tokenises on whitespace or a pattern"
          weight: 3
          patterns: ["pre token|whitespace|split|regex|word boundary"]
        - id: counts
          label: "counts word frequencies rather than iterating the raw corpus"
          weight: 2
          patterns: ["frequency|count|unique word|dict|corpus"]
    - id: approach
      question: "Describe the merge loop and its data structures."
      intent: >-
        Expect pair counts, the most frequent pair, a merge applied everywhere, and
        an efficient index rather than rescanning.
      hint: >-
        Repeatedly take the most frequent adjacent pair, record the merge, apply it
        to every word, and update counts. Rescanning the corpus per merge is
        quadratic; maintaining pair counts incrementally is the real implementation.
      criteria:
        - id: pair
          label: "selects the most frequent adjacent pair"
          weight: 3
          patterns: ["most frequent|pair|count|argmax|merge"]
        - id: apply
          label: "applies the merge to all occurrences"
          weight: 2
          patterns: ["apply|all|replace|every|update"]
        - id: incremental
          label: "updates counts incrementally rather than rescanning"
          weight: 3
          patterns: ["incremental|update|index|avoid rescan|efficient"]
    - id: scale
      question: "How do you train on 500 GB without holding the corpus in memory?"
      intent: >-
        Probes counting passes, external sorting, and the observation that word
        frequencies are the sufficient statistic.
      hint: >-
        The corpus is only needed for the first counting pass. After that you train
        on the vocabulary of unique words and their frequencies, which is orders of
        magnitude smaller.
      criteria:
        - id: vocab
          label: "trains on unique words and frequencies, not raw text"
          weight: 3
          patterns: ["unique|vocabulary|frequency|sufficient|shrink"]
        - id: passes
          label: "a counting pass followed by in-memory training"
          weight: 2
          patterns: ["pass|count|first|then|stream"]
        - id: external
          label: "external sort or sharded counting if the vocabulary does not fit"
          weight: 2
          patterns: ["external|shard|map reduce|disk|partition"]
- id: iv-code-bpe-encode
  kind: coding
  level: mid
  title: "Implement BPE encoding with merge ranks"
  prompt: >-
    Given a learned merge list, implement encoding: split text into tokens using
    the merges in the order they were learned.
  reference_topics: [tokenisation, long-context]
  stages:
    - id: clarify
      question: "Why does merge order matter?"
      intent: >-
        Ranks resolve conflicts: the earlier merge wins when two are possible.
      hint: >-
        The merge list is ordered, and applying the lowest-rank merge first is what
        makes encoding deterministic and identical to training. An unordered set of
        merges gives a different tokenisation.
      criteria:
        - id: order
          label: "merge order or rank determines precedence"
          weight: 3
          patterns: ["order|rank|priority|first|sequence"]
        - id: deterministic
          label: "encoding must match training"
          weight: 2
          patterns: ["deterministic|same as training|consistent|match"]
        - id: pretokenise
          label: "applies the same pre-tokenisation as training"
          weight: 2
          patterns: ["pre token|split|same|whitespace|boundary"]
    - id: approach
      question: "Write the loop. What is its complexity if implemented naively?"
      intent: >-
        Expect repeated scans for the best pair and an O(n squared) naive cost.
      hint: >-
        The naive version scans for the lowest-ranked adjacent pair and merges,
        repeating until no pair applies, which is quadratic in the number of
        symbols. A heap or a rank-indexed lookup makes it near linear.
      criteria:
        - id: loop
          label: "repeatedly finds the best applicable pair"
          weight: 3
          patterns: ["loop|repeat|best pair|lowest|while"]
        - id: naive
          label: "states the naive quadratic cost"
          weight: 2
          patterns: ["quadratic|n squared|o n|naive|rescan"]
        - id: optimise
          label: "mentions a heap or cached ranks"
          weight: 2
          patterns: ["heap|priority queue|cache|index|lookup"]
    - id: edge
      question: "What happens to a byte sequence that never appears in training?"
      intent: >-
        Probes the byte fallback, which is what makes a tokenizer lossless.
      hint: >-
        A byte-level tokenizer can always fall back to individual bytes, so no input
        is unrepresentable. A word-level tokenizer needs an unknown token and
        silently loses information.
      criteria:
        - id: fallback
          label: "falls back to bytes or characters"
          weight: 3
          patterns: ["byte|fallback|unknown|char|individual"]
        - id: lossless
