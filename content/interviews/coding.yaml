- id: iv-code-sampling
  kind: coding
  level: mid
  title: "Implement temperature, top-k and nucleus sampling"
  prompt: >-
    Implement token sampling from logits with temperature, top-k and top-p, in
    that order, and be precise about what each does.
  reference_topics: [decoding-strategies, probability-distributions, information-theory]
  stages:
    - id: clarify
      question: "What does each parameter do to the distribution?"
      intent: >-
        Temperature rescales logits, top-k truncates by count, top-p truncates by
        cumulative mass.
      hint: >-
        Temperature divides the logits before softmax, which reshapes the
        distribution; top-k keeps k tokens; top-p keeps the smallest set whose
        cumulative probability exceeds p.
      criteria:
        - id: temp
          label: "temperature divides logits before softmax"
          weight: 3
          patterns: ["divide|scale|logit|before softmax|temperature"]
        - id: topk
          label: "top-k keeps the k highest-probability tokens"
          weight: 2
          patterns: ["top k|k highest|keep|truncat|count"]
        - id: topp
          label: "top-p keeps the smallest set above cumulative p"
          weight: 3
          patterns: ["cumulative|nucleus|smallest set|mass|top p"]
    - id: approach
      question: "Write the sampling function. What order do the operations go in?"
      intent: >-
        Order matters: temperature, then top-k, then top-p, then renormalise, then
        sample.
      hint: >-
        Apply temperature first, then mask with top-k, then compute the cumulative
        distribution for top-p, renormalise over what survives, and sample from that.
        Sampling before truncation gives a different distribution.
      criteria:
        - id: order
          label: "applies the operations in a defined order"
          weight: 3
          patterns: ["order|first|then|after|sequence"]
        - id: renormalise
          label: "renormalises after truncation"
          weight: 3
          patterns: ["renormalis|renormaliz|normalize|rescale|sum to one"]
        - id: mask
          label: "masks with negative infinity rather than zero"
          weight: 2
          patterns: ["negative infinity|minus inf|mask|zero out"]
    - id: edge
      question: "Temperature is zero. What should happen, and what does your code do?"
      intent: >-
        Probes the division-by-zero case and the greedy limit.
      hint: >-
        Temperature zero means greedy decoding, but dividing by zero produces NaN.
        Handle it as a special case rather than letting the softmax explode.
      criteria:
        - id: greedy
          label: "temperature zero means greedy or argmax"
          weight: 3
          patterns: ["greedy|argmax|deterministic|highest"]
        - id: divide
          label: "guards against division by zero"
          weight: 3
          patterns: ["divide by zero|nan|guard|special case|epsilon"]
        - id: toppzero
          label: "notes that top-p of zero or one is degenerate"
          weight: 1
          patterns: ["zero|one|degenerate|all|single"]
- id: iv-code-beam
  kind: coding
  level: senior
  title: "Implement beam search"
  prompt: >-
    Implement beam search decoding with a length penalty. Explain the difference
    between a beam and a best-first search.
  reference_topics: [decoding-strategies, information-theory, optimisation-in-practice]
  stages:
    - id: clarify
      question: "What is kept per step, and how is a finished sequence handled?"
      intent: >-
        The beam holds k partial hypotheses with scores; finished ones leave the
        beam and are collected.
      hint: >-
        Each step expands every hypothesis in the beam, keeps the top k by
        cumulative log probability, and moves completed sequences to a separate
        list so they stop consuming beam slots.
      criteria:
        - id: beam
          label: "keeps the top k partial hypotheses"
          weight: 3
          patterns: ["beam|top k|hypothes|partial|keep"]
        - id: expand
          label: "expands all candidates and prunes to k"
          weight: 2
          patterns: ["expand|all|prune|top|select"]
        - id: finished
          label: "finished sequences leave the beam"
          weight: 2
          patterns: ["finish|complete|end|eos|separate"]
    - id: approach
      question: "Write the step. How do you handle scores of different lengths?"
      intent: >-
        Probes the length penalty, since log probabilities decrease with length.
      hint: >-
        Cumulative log probability penalises longer sequences, so you divide by a
        length penalty before comparing. Without it, beam search prefers short
        outputs.
      criteria:
        - id: score
          label: "cumulative log probability as the score"
          weight: 2
          patterns: ["log prob|cumulative|sum|score|probability"]
        - id: penalty
          label: "a length penalty normalises the score"
          weight: 3
          patterns: ["length penalty|length normalis|length normalization|divide by length"]
        - id: compare
          label: "compares hypotheses on the penalised score"
          weight: 1
          patterns: ["compare|rank|score|normalis|normaliz"]
    - id: efficiency
      question: "Beam width 8 at 4k tokens. What does that cost?"
      intent: >-
        Probes the linear factor in beam width on memory and compute, and why wide
        beams are impractical for long generation.
      hint: >-
        Beam width multiplies the decode work and the KV cache by eight, and
        because the beam cannot be trivially batched across divergent prefixes it
        also fragments memory.
      criteria:
        - id: cost
          label: "beam width multiplies compute and cache"
          weight: 3
          patterns: ["multiply|times|factor|8|cache"]
        - id: memory
          label: "the KV cache grows with the beam"
          weight: 2
          patterns: ["kv cache|memory|grow|per hypothesis"]
        - id: quality
          label: "notes that beam search is not better for open-ended text"
          weight: 2
          patterns: ["open ended|creative|diversity|repetitive|not better"]
- id: iv-code-conv2d
  kind: coding
  level: mid
  title: "Implement 2D convolution"
  prompt: >-
    Implement a 2D convolution from scratch with stride and padding. No library
    convolution calls.
  reference_topics: [convolutions, pooling-and-shape-algebra, cnn-architectures]
  stages:
    - id: clarify
      question: "Write the output shape formula before writing code."
      intent: >-
        The formula is the specification, and off-by-one errors live here.
      hint: >-
        Output size is input plus twice padding minus kernel, divided by stride,
        plus one, floored. Every dimension check follows from it.
      criteria:
        - id: formula
          label: "states the output shape formula"
          weight: 3
          patterns: ["output size|formula|padding|stride|kernel"]
        - id: floor
          label: "floors the result and handles remainders"
          weight: 2
          patterns: ["floor|integer|round|remainder|truncate"]
        - id: channels
          label: "handles input and output channels"
          weight: 2
          patterns: ["channel|depth|in channel|out channel"]
    - id: approach
      question: "Write the naive version. How many loops, and in what order?"
      intent: >-
        Expect six loops: batch, out channel, out row, out column, kernel row,
        kernel column, with a channel sum.
      hint: >-
        The loops are batch, output channel, output row, output column, then the
        reduction over input channel and the kernel window. Loop order determines
        cache behaviour, which matters later.
      criteria:
        - id: loops
          label: "names the loop nest and the reduction"
          weight: 3
          patterns: ["loop|nest|reduction|sum|window"]
        - id: bias
          label: "adds bias after the reduction"
          weight: 1
          patterns: ["bias|add|offset"]
        - id: bounds
          label: "handles out-of-bounds with zero padding"
          weight: 2
          patterns: ["padding|zero|bounds|skip|clamp"]
    - id: efficiency
      question: "The naive version is too slow. What are the standard transformations?"
      intent: >-
        Probes im2col, FFT, Winograd, and the memory-for-speed trade.
      hint: >-
        im2col turns the convolution into a matrix multiply at the cost of
        duplicating input data, which is why it is fast but memory hungry; Winograd
        reduces multiplications for small kernels.
      criteria:
        - id: im2col
          label: "im2col or a direct matrix multiply formulation"
          weight: 3
          patterns: ["im2col|unfold|matrix multiply|gemm|lowering"]
        - id: tradeoff
          label: "states the memory cost of im2col"
          weight: 2
          patterns: ["memory|duplicate|expand|cost|overhead"]
        - id: winograd
          label: "mentions Winograd or FFT for small or large kernels"
          weight: 2
          patterns: ["winograd|fft|transform|algorithm"]
- id: iv-code-im2col
  kind: coding
  level: senior
  title: "Implement im2col and a matrix-multiply convolution"
  prompt: >-
    Implement im2col: turn a 4D input and a kernel into a matrix so convolution
    becomes one matmul. Then explain when this is worse than direct convolution.
  reference_topics: [convolutions, custom-kernels-triton, pooling-and-shape-algebra]
  stages:
    - id: clarify
      question: "What is the shape of the matrix you produce, and why?"
      intent: >-
        im2col expands each receptive field into a column: channels times kernel
        area by output positions.
      hint: >-
        The output is channels times kernel height times kernel width by the number
        of output positions, so the weight matrix is out channels by that first
        dimension.
      criteria:
        - id: shape
          label: "states the expanded matrix shape"
          weight: 3
          patterns: ["channel|kernel|output position|shape|rows|columns"]
        - id: weight
          label: "reshapes the kernel to match"
          weight: 2
          patterns: ["weight|reshape|flatten|kernel matrix"]
        - id: result
          label: "the matmul yields output positions by out channels"
          weight: 2
          patterns: ["matmul|result|output|out channel|gemm"]
    - id: approach
      question: "Write the gather. How much memory does it use for a large activation?"
      intent: >-
        Probes duplication factor: each input element is copied up to kernel area
        times.
      hint: >-
        Every element is replicated once per kernel position that touches it, so
        the expansion is roughly kernel area times the input size. At 3 by 3 that
        is nine times the activation memory.
      criteria:
        - id: gather
          label: "writes the nested loop or advanced indexing gather"
          weight: 3
          patterns: ["gather|index|loop|copy|stride"]
        - id: duplicate
          label: "states the duplication factor"
          weight: 3
          patterns: ["duplicate|replicat|times|kernel area|factor"]
        - id: memory
          label: "quantifies the memory blow-up"
          weight: 2
          patterns: ["memory|blow|9x|nine|gb|cost"]
    - id: efficiency
      question: "When is direct convolution better than im2col?"
      intent: >-
        Probes the regime: small channels, depthwise convolution, memory-bound
        inference.
      hint: >-
        Depthwise convolution has one channel per group, so im2col produces a tall
        skinny matrix with almost no arithmetic intensity — direct or a dedicated
        kernel wins.
      criteria:
        - id: depthwise
          label: "depthwise or grouped convolution is a poor fit"
          weight: 3
          patterns: ["depthwise|grouped|per channel|group|separable"]
        - id: intensity
          label: "low arithmetic intensity or memory-bound cases"
          weight: 2
          patterns: ["arithmetic intensity|memory bound|bandwidth|small"]
        - id: fused
          label: "fused kernels avoid the materialised buffer"
          weight: 2
          patterns: ["fused|triton|on the fly|avoid materialis|avoid materializ"]
- id: iv-code-adam
  kind: coding
  level: mid
  title: "Implement Adam and explain the bias correction"
  prompt: >-
    Implement Adam from scratch, including the bias correction. Explain what
    breaks if you drop it.
  reference_topics: [gradient-descent-variants, optimisation-in-practice, random-forests]
  stages:
    - id: clarify
      question: "What state does Adam keep per parameter?"
      intent: >-
        Two moment estimates per parameter, plus the step count.
      hint: >-
        Adam keeps a first moment and a second moment per parameter, both
        exponential moving averages, plus a global step counter used for the
        correction.
      criteria:
        - id: state
          label: "first and second moment per parameter"
          weight: 3
          patterns: ["first moment|second moment|m and v|moving average|state"]
        - id: hyper
          label: "names beta one, beta two and epsilon"
          weight: 2
          patterns: ["beta|beta1|beta2|epsilon|eps"]
        - id: step
          label: "tracks the step count for the correction"
          weight: 2
          patterns: ["step|iteration|t|count"]
    - id: approach
      question: "Write the update. Where exactly does the bias correction go?"
      intent: >-
        Expect m hat equals m over one minus beta one to the t, and the same for v,
        before the update.
      hint: >-
        Both moments start at zero, so early estimates are biased toward zero;
        dividing by one minus beta to the t corrects them, and the correction
        matters most in the first few steps.
      criteria:
        - id: update
          label: "writes the moment updates and the parameter update"
          weight: 3
          patterns: ["update|m equals|v equals|subtract|learning rate"]
        - id: correction
          label: "divides by one minus beta to the power t"
          weight: 3
          patterns: ["one minus|bias correction|power t|divide|correct"]
        - id: order
          label: "correction applied before the update, not after"
          weight: 1
          patterns: ["before|then|order|first"]
    - id: numerics
      question: "What happens without bias correction in the first ten steps?"
      intent: >-
        Probes the effect: tiny effective step sizes early, which matters for
        fine-tuning and short runs.
      hint: >-
        Both moments are near zero, so the ratio is small and unstable; the first
        steps are far smaller than intended, which is visible when you fine-tune
        for a few hundred steps.
      criteria:
        - id: small
          label: "steps are much smaller early on"
          weight: 3
          patterns: ["small|tiny|slow|underestimat|early"]
        - id: unstable
          label: "the ratio is unstable when the second moment is near zero"
          weight: 2
          patterns: ["unstable|division|near zero|noise|ratio"]
        - id: context
          label: "matters most for short runs or fine-tuning"
          weight: 1
          patterns: ["short|few steps|fine tun|warmup|beginning"]
- id: iv-code-lr-schedule
  kind: coding
  level: junior
  title: "Implement a warmup plus cosine learning rate schedule"
  prompt: >-
    Implement a learning rate schedule: linear warmup for the first thousand
    steps, then cosine decay to ten percent of the peak.
  reference_topics: [learning-rate-schedules, optimisation-in-practice, gradient-descent-variants]
  stages:
    - id: clarify
      question: "What are the endpoints and what is the shape between them?"
      intent: >-
        Warmup ramps from near zero to the peak; cosine decays from the peak to a
        floor.
      hint: >-
        State the peak, the floor, the warmup length and the total steps. A schedule
        missing any of these cannot be implemented unambiguously.
      criteria:
        - id: endpoints
          label: "states peak, floor and total steps"
          weight: 3
          patterns: ["peak|max|floor|minimum|total steps"]
        - id: warmup
          label: "warmup ramps linearly to the peak"
          weight: 2
          patterns: ["warmup|ramp|linear|first"]
        - id: decay
          label: "cosine decay after warmup"
          weight: 2
          patterns: ["cosine|decay|anneal|schedule"]
    - id: approach
      question: "Write the function of step. Why warm up at all?"
      intent: >-
        Probes the reason: large early updates with uncalibrated moments destabilise
        training.
      hint: >-
        Early gradients are noisy and the optimiser state is uncalibrated, so a
        full-size step can diverge; warmup lets the moments settle before the
        learning rate reaches its peak.
      criteria:
        - id: formula
          label: "writes the piecewise formula"
          weight: 3
          patterns: ["if|piecewise|step|formula|min"]
        - id: reason
          label: "explains why warmup stabilises training"
          weight: 3
          patterns: ["stabil|diverge|noisy|moment|calibrat|large step"]
        - id: floor
          label: "clamps at the floor rather than reaching zero"
          weight: 1
          patterns: ["clamp|floor|minimum|not zero|ten percent"]
    - id: edge
      question: "Training resumes from a checkpoint at step 40,000. What must the schedule know?"
      intent: >-
        Probes statefulness: the schedule is a function of the global step, not a
        counter in memory.
      hint: >-
        The schedule must be a pure function of the global step, and that step must
        be checkpointed. A local counter restarts warmup and destroys the run.
      criteria:
        - id: global
          label: "schedule keyed on the global step"
          weight: 3
          patterns: ["global step|absolute|step count|function of"]
        - id: checkpoint
          label: "the step is saved and restored with the checkpoint"
          weight: 3
          patterns: ["checkpoint|save|restore|resume|state"]
        - id: bug
          label: "a local counter would restart warmup"
          weight: 1
          patterns: ["restart|local|counter|reset|wrong"]
- id: iv-code-matmul
  kind: coding
  level: junior
  title: "Implement blocked matrix multiplication"
  prompt: >-
    Implement matrix multiplication. Then make it faster without using a BLAS
    library, and explain why your change helps.
  reference_topics: [linear-algebra-foundations, custom-kernels-triton, numerical-linear-algebra]
  stages:
    - id: clarify
      question: "What are the shapes, and what is the naive complexity?"
      intent: >-
        m by k times k by n, with two times m n k floating point operations.
      hint: >-
        The naive triple loop is order m n k, and the inner loop over k is the one
        that should be contiguous for cache behaviour.
      criteria:
        - id: shapes
          label: "states the shapes and the compatibility condition"
          weight: 2
          patterns: ["m by k|k by n|inner dimension|shape|match"]
        - id: flops
          label: "states the operation count"
          weight: 2
          patterns: ["m n k|flop|operations|cubic|times"]
        - id: order
          label: "identifies loop order as the performance lever"
          weight: 2
          patterns: ["loop order|order|stride|contiguous|cache"]
    - id: approach
      question: "Write the naive version, then the blocked version."
      intent: >-
        Expect tiling into cache-sized blocks so reused data stays in cache.
      hint: >-
        Blocking processes a tile of the output at a time so the corresponding rows
        and columns are reused from cache instead of streaming from memory on every
        multiply.
      criteria:
        - id: naive
          label: "writes the triple loop correctly"
          weight: 2
          patterns: ["triple|three loops|for|accumulate"]
        - id: block
          label: "tiles the loops into cache-sized blocks"
          weight: 3
          patterns: ["block|tile|panel|chunk|cache size"]
        - id: why
          label: "explains reuse and cache residency"
          weight: 3
          patterns: ["reuse|cache|resident|locality|bandwidth"]
    - id: efficiency
      question: "What is the actual limit at large sizes: FLOPs or memory?"
      intent: >-
        Probes the roofline: matmul is compute-bound only when tiled well.
      hint: >-
        A well-tiled matmul is compute-bound, but the naive version is memory-bound
        because every multiply reloads operands. The ratio of FLOPs to bytes is the
        arithmetic intensity.
      criteria:
        - id: roofline
          label: "uses the arithmetic intensity or roofline argument"
          weight: 3
          patterns: ["arithmetic intensity|roofline|flop per byte|ratio"]
        - id: bound
          label: "distinguishes compute-bound from memory-bound"
          weight: 2
          patterns: ["compute bound|memory bound|bandwidth|limit"]
        - id: simd
          label: "mentions vectorisation or the tensor cores"
          weight: 1
          patterns: ["simd|vector|tensor core|fma|instruction"]
- id: iv-code-causal-mask
  kind: coding
