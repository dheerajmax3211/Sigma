  stages:
    - id: clarify
      question: "What is the model output, and what loss?"
      intent: >-
        A sigmoid of a linear score, with binary cross-entropy.
      hint: >-
        The model is sigmoid of w transpose x plus b, and the loss is binary
        cross-entropy, which is convex in the parameters.
      criteria:
        - id: model
          label: "sigmoid of a linear function"
          weight: 2
          patterns: ["sigmoid|logistic|linear|w transpose|dot"]
        - id: loss
          label: "binary cross-entropy"
          weight: 3
          patterns: ["cross entropy|log loss|binary|negative log"]
        - id: convex
          label: "notes the loss is convex"
          weight: 1
          patterns: ["convex|global minimum|unique|no local"]
    - id: approach
      question: "Write the update. What is the gradient?"
      intent: >-
        The gradient is the average of predicted minus actual times x.
      hint: >-
        The gradient with respect to w is the mean of predicted minus true label
        times x. It is the same form as linear regression with a different
        link, which is worth noticing.
      criteria:
        - id: grad
          label: "gradient is prediction minus label times x"
          weight: 3
