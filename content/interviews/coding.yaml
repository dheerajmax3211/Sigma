          patterns: ["guard|finite|small negative|exclude|safe"]
- id: iv-code-rope
  kind: coding
  level: senior
  title: "Implement rotary position embeddings"
  prompt: >-
    Implement RoPE: rotate query and key vectors by an angle that depends on
    position. Explain why rotation encodes relative position.
  reference_topics: [positional-encoding, attention-from-first-principles, long-context]
  stages:
    - id: clarify
      question: "Which tensors are rotated, and which are not?"
      intent: >-
        Queries and keys are rotated; values are not, because only the dot product
        matters for position.
      hint: >-
        RoPE rotates Q and K before the dot product and leaves V untouched. Rotating
        V would change the output content rather than the position signal.
      criteria:
        - id: which
          label: "rotates queries and keys, not values"
          weight: 3
          patterns: ["query|key|not value|q and k|only"]
        - id: where
          label: "applies before the attention dot product"
          weight: 2
          patterns: ["before|dot product|attention|score"]
        - id: dims
          label: "rotates pairs of dimensions"
          weight: 2
          patterns: ["pair|two dimensions|even odd|half|split"]
    - id: approach
      question: "Write the rotation. What are the frequencies?"
      intent: >-
        Expect theta to the power of negative two i over d, applied per dimension
        pair.
      hint: >-
        The frequency for pair i is theta to the negative two i over the head
        dimension, with theta typically ten thousand, so low dimensions rotate fast
        and high dimensions slowly.
      criteria:
        - id: freq
          label: "states the frequency formula with theta"
          weight: 3
          patterns: ["theta|frequency|10000|power|exponent"]
        - id: rotate
          label: "writes the cosine and sine rotation"
          weight: 3
          patterns: ["cos|sin|rotate|rotation matrix|angle"]
        - id: position
          label: "the angle is position times frequency"
          weight: 2
          patterns: ["position|pos|times|multiply|angle"]
    - id: numerics
      question: "Why does the dot product depend only on the relative offset?"
      intent: >-
        The key insight: rotation by the difference of positions leaves the dot
        product invariant to absolute position.
      hint: >-
        Rotating q at position m and k at position n, their dot product depends on
        the rotation by m minus n because rotations compose and the inner product is
        invariant under a common rotation.
      criteria:
        - id: relative
          label: "dot product depends on the difference of positions"
          weight: 3
          patterns: ["relative|difference|offset|m minus n|distance"]
        - id: compose
          label: "uses the composition or invariance of rotations"
          weight: 3
          patterns: ["compose|invariant|rotation|orthogonal|angle addition"]
        - id: extrapolate
          label: "notes the long-context extrapolation issue"
          weight: 1
          patterns: ["extrapolat|long context|out of range|scale|interpolat"]
- id: iv-code-init
  kind: coding
  level: mid
  title: "Implement Kaiming and Xavier initialisation"
  prompt: >-
    Implement weight initialisation for a deep network. Choose the scheme per
    layer type and justify the variance arithmetic.
  reference_topics: [gradient-stability, residual-connections, normalisation-layers]
  stages:
    - id: clarify
      question: "What are you trying to preserve as the signal passes through layers?"
      intent: >-
        The goal is constant variance of activations and gradients across depth.
