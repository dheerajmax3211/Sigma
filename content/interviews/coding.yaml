        - id: batch
          label: "distinguishes full-batch from stochastic updates"
          weight: 2
          patterns: ["stochastic|mini batch|per sample|full batch|sgd"]
    - id: numerics
      question: "Your loss prints NaN after a few epochs. What happened?"
      intent: >-
        Probes the log of a saturated sigmoid and the divergence from a large
