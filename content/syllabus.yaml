    to a convolution with stride equal to the kernel.
  - Price a vision transformer in tokens rather than pixels, and say at which resolution the attention
    matrix stops being a rounding error.
  - Explain what the missing locality prior costs, with the measured data-efficiency gap between convolutional
    and patch-based models.
