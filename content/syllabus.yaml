version: 1
tracks:
- id: foundations
  title: Foundations
  slug: foundations
  tier: 0
  sortOrder: 1
  outcomes:
  - Reason about vectors, matrices, and linear maps geometrically, and compute with eigenvalues, SVD,
    and orthogonal projections.
  - Apply matrix calculus to derive gradients and Jacobians by shape, including the vector-Jacobian product.
  - Recognise when a numerical result is wrong because of conditioning, and choose a stable algorithm.
  - Model uncertainty with distributions, likelihoods, and Bayes' rule, and read a posterior honestly.
  - Quantify information with entropy, KL divergence, and mutual information, and explain why cross-entropy
    is the training loss.
  - Test convexity, form the dual, and use a KKT certificate to prove optimality.
  - Implement gradient descent variants and diagnose the floor set by the largest eigenvalue.
  - Design a learning rate schedule, size warmup, and reason about batch size and noise scale.
  - Compute backpropagation by hand for a multi-layer network and verify it against a finite difference.
  - Measure per-layer gradient gain and fix vanishing or exploding gradients.
  - Make experiments reproducible with explicit seeding, and read a paper's claims critically against
    its results.
  topics:
  - id: linear-algebra-foundations
    pos: 1
    prereq: []
    title: "Linear Algebra: Four Decompositions, One Coordinate Change"
  - id: vectors-and-geometry
    pos: 2
    prereq:
    - linear-algebra-foundations
    title: In High Dimensions, Everything Is Far and Nothing Is Near
  - id: matrix-calculus
    pos: 3
    prereq:
    - linear-algebra-foundations
    - vectors-and-geometry
    title: "Matrix Calculus: The Gradient You Can Derive From Its Shape Alone"
  - id: numerical-linear-algebra
    pos: 4
    prereq:
