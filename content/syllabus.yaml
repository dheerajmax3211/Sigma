- id: core-ml
  title: Core Machine Learning
  slug: core-ml
  tier: 1
  sortOrder: 2
  outcomes:
  - Derive linear and logistic regression from maximum likelihood, and diagnose when the normal equations
    fail.
  - Implement decision trees, random forests, and gradient boosting from scratch, understanding exactly
    how the split criterion, bagging, and residual fitting interact.
  - Formulate SVMs as constrained optimisation, derive the dual, and choose kernels by reasoning about
    the feature map.
  - Build Naive Bayes with Laplace smoothing, and explain why it works despite its violated independence
    assumption.
  - Evaluate models with bias–variance decomposition, ROC/PR curves, and calibration — and recognise when
    accuracy is the wrong metric.
  - Recognise data leakage, feature engineering pitfalls, and the curse of dimensionality in real datasets.
