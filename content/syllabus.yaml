- id: distributed
  title: Distributed Systems, MLOps, and Inference
  slug: distributed
  tier: 5
  sortOrder: 6
  outcomes:
  - Split a batch across workers and explain why the averaged gradient is exactly the gradient of the
    larger batch, not an approximation of it.
  - 'Price a synchronisation step in bytes: 2(N-1)/N times the model size per rank for a ring all-reduce,
    and why that number stops growing with worker count.'
  - Choose a bucket size from the launch latency and the step time, and say what bucketing does and does
    not save.
  - Decide between a parameter server and a collective on bandwidth, latency, and failure behaviour rather
    than on fashion.
  - Predict scaling efficiency from tokens per accelerator per step, and diagnose whether a slow job needs
    more bandwidth or a larger batch.
