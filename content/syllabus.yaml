  tier: 3
  sortOrder: 4
  outcomes:
  - Derive scaled dot-product attention from a dictionary lookup, and explain why the divisor is exactly
    1/sqrt(d_k).
  - Implement causal attention that masks before the normalisation, and diagnose the leak when it does
    not.
  - Budget a context window in FLOPs and bytes, and recognise when a kernel is bound by memory rather
    than arithmetic.
  - Explain multi-head and multi-query attention as a bandwidth decision, not only a modelling one.
  - Place positional encoding, normalisation, and residual scaling in the block, and say what each one
    fixes.
  - Fine-tune, quantise, and serve a transformer with a cost model rather than a guess.
