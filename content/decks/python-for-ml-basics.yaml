id: python-for-ml-basics
title: Python you need for ML
order: 6
minutes: 9
params:
  - { id: n, label: "loop to n", min: 1, max: 10, step: 1, init: 5 }
  - { id: k, label: "multiply by", min: 1, max: 5, step: 1, init: 2 }
derived:
  - { id: total, expr: n * (n + 1) / 2 }
  - { id: scaled, expr: total * k }
cards:
  - kind: story
    kicker: Start here
    title: A program is a recipe
    body:
      - A Python program is a list of steps, read from the top down, like a recipe. Each step either stores something, repeats something or makes a choice.
      - "You do not need all of Python. Four ideas cover most ML code: **variables**, **lists and dictionaries**, **loops** and **functions**."
    callout: Read code line by line, top to bottom, and say what each line does.

  - kind: code
    kicker: Variables and containers
    title: Names, lists and dictionaries
    intro: A variable is a name for a value. A list keeps values in order. A dictionary looks values up by a label.
    lang: python
    code: |
      price = 9.5                 # a variable
      scores = [70, 85, 92]       # a list, counted from 0
      person = {"name": "Asha", "age": 28}   # a dictionary

      print(scores[0])            # 70, the first item
      print(person["name"])       # Asha
      scores.append(60)           # now 4 items
    note: Lists count from 0, so the first item is scores[0], not scores[1].

  - kind: lab
    kicker: See it first
    title: What a loop does
    intro: A loop repeats a step. Slide **n** and watch the running total grow as the loop adds 1, then 2, then 3, up to n.
    view:
      type: flow
      stages:
        - { label: "for i in range(1, n + 1)", note: "i takes the values 1 up to {n}", color: "#38bdf8" }
        - { label: "total += i", note: "adds each i: the total ends at **{total}**", color: "#a78bfa" }
        - { label: "result = total * k", note: "multiplied by {k} gives **{scaled}**", color: "#1cd6ac" }
    sliders: [n, k]
    outro: "The loop added every number from 1 to {n}, so total = **{total}**. Times {k} is {scaled}."

  - kind: code
    kicker: Loops and functions
    title: Package the loop as a function
    intro: A function is a named recipe you can reuse. The `def` line gives it a name and inputs, and `return` hands back the answer.
    lang: python
    code: |
      def total_up_to(n):
          total = 0
          for i in range(1, n + 1):
              total += i
          return total

      answer = total_up_to(5)
      print(f"The total is {answer}")   # The total is 15
    note: The indented lines belong to the function. Indentation is how Python knows what is inside what.

  - kind: check
    kicker: Check yourself
    title: Read a list comprehension
    question: "What does `[x * 2 for x in [1, 2, 3]]` produce?"
    options:
      - { text: "[2, 4, 6]", correct: true, why: "It builds a new list by taking each x in turn and doubling it." }
      - { text: "[1, 2, 3, 1, 2, 3]", why: "That is repeating the list, not doubling each item." }
      - { text: "6", why: "A comprehension builds a list, not a single sum." }

  - kind: code
    kicker: Shortcuts you will see everywhere
    title: Comprehensions and unpacking
    intro: ML code loves one-line loops. This keeps only the passing scores and doubles them.
    lang: python
    code: |
      scores = [70, 85, 92, 40]
      passed = [s * 2 for s in scores if s >= 60]   # [140, 170, 184]

      x, y = (3, 4)               # unpack two values at once
      for i, s in enumerate(scores):   # index and item together
          print(i, s)
    note: A comprehension is a loop and a filter written on one line. Read it left to right.

  - kind: practice
    kicker: Your turn
    title: "Write a mean function"
    intro: "Write `mean(xs)` that returns the average of a list of numbers. Use a loop or `sum` and `len`. This is the first thing every ML metric does."
    entry: mean
    starter: |
      def mean(xs):
          # return the average of xs
          pass
    solution: |
      def mean(xs):
          return sum(xs) / len(xs)
    tests:
      - { input: "[[1,2,3]]", expected: "2.0" }
      - { input: "[[10]]", expected: "10.0" }
      - { input: "[[2,4,6,8]]", expected: "5.0" }
    hint: "Add everything up, then divide by how many there are."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Counting from 0.** A list with 4 items has indexes 0 to 3. Asking for index 4 is an error."
      - "**Indentation matters.** Lines that should be inside a loop or function must be indented the same amount."
      - "**`=` is not `==`.** One equals sign stores a value. Two equals signs compare two values."
    next: { label: "Next: NumPy arrays and shapes", href: /learn/numpy-arrays }
