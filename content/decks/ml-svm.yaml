id: "ml-svm"
title: "Support vector machines"
minutes: 13
order: 506
params:
  - { id: "w", label: "size of the weights", min: 0.5, max: 5, step: 0.1, init: 1 }
derived:
  - { id: "margin", expr: "2 / w" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "The widest street between two classes"
    body:
      - "Many lines can split two classes. A **support vector machine** picks the one with the widest empty street, the **margin**, between them."
      - "Only the points touching the street edges matter. These are the **support vectors**. Move any other point and the line stays put."
    callout: "A wide margin is a bet that the line will generalise."
  - kind: "lab"
    kicker: "See it"
    title: "Margin and weights"
    intro: "The margin equals 2 divided by the size of the weight vector. Small weights mean a wide street. **Drag the weights.**"
    view:
      type: "bars"
      max: 4
      items:
        - { label: "margin width", value: "margin", color: "#1cd6ac" }
        - { label: "margin when weights are 1", value: "2", color: "#38bdf8" }
    sliders:
      - "w"
    outro: "Weights of size {w} give a margin of **{margin}**. Training shrinks the weights while keeping points on the right side."
  - kind: "code"
    kicker: "Write it"
    title: "Hinge loss and a kernel"
    intro: "A point on the right side beyond the margin costs nothing. Inside the margin or wrong costs more."
    lang: "python"
    code: |
      import math

      def hinge(y, score):
          return max(0, 1 - y * score)

      assert hinge(1, 2) == 0
      assert hinge(1, 0.5) == 0.5
      assert hinge(-1, 0.5) == 1.5

      def rbf(a, b, gamma):
          d2 = sum((x - y) ** 2 for x, y in zip(a, b))
          return math.exp(-gamma * d2)

      assert rbf([1, 2], [1, 2], 1.0) == 1.0
      assert rbf([0], [3], 1.0) < 0.001
    note: "A kernel lets the machine separate curved data as if it were straight, without building new features."
  - kind: "lab"
    kicker: "Memorise"
    title: "The C dial"
    intro: "One number trades street width against mistakes."
    view:
      type: "flow"
      stages:
        - { label: "Small C", note: "Wide margin. Tolerates mistakes. Smoother.", color: "#38bdf8" }
        - { label: "Large C", note: "Narrow margin. Punishes every mistake. Can overfit.", color: "#ef4444" }
        - { label: "Scale first", note: "Features must be scaled or one dominates.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Support vectors"
    question: "You delete a training point far from the margin. What happens to the SVM?"
    options:
      - { text: "Nothing changes", correct: true, why: "Only support vectors define the boundary." }
      - { text: "The line moves a lot", why: "Far points have no influence." }
      - { text: "Training fails", why: "No." }
      - { text: "The margin doubles", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "When to use"
    question: "On large tabular data today, what usually beats an SVM?"
    options:
      - { text: "Gradient boosted trees", correct: true, why: "They scale and score better. SVMs shine on small, clean, high dimensional data." }
      - { text: "Naive Bayes", why: "Not generally." }
      - { text: "k nearest neighbours", why: "Not generally." }
      - { text: "Nothing", why: "Boosting does." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Not scaling features.** The kernel distances break."
      - "**Huge datasets.** Training grows quickly with rows."
      - "**Skipping tuning of C and gamma.** Search both."
    next: { label: "Next: clustering", href: "/learn/ml-clustering" }
