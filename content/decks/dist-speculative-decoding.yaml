id: "dist-speculative-decoding"
title: "Speculative decoding"
minutes: 14
order: 808
params:
  - { id: "a", label: "chance the big model agrees with each guess", min: 0.1, max: 0.95, step: 0.05, init: 0.7 }
  - { id: "k", label: "tokens guessed per round", min: 1, max: 8, step: 1, init: 4 }
derived:
  - { id: "tok", expr: "(1 - a ^ (k + 1)) / (1 - a)" }
  - { id: "speed", expr: "tok / (1 + k * 0.1)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Guess cheap, check once"
    body:
      - "A big model generates one token per pass, and each pass is slow because it reads all the weights. **Speculative decoding** lets a small draft model guess several tokens ahead."
      - "The big model then checks all the guesses in a single pass. It keeps the guesses that match what it would have said, plus one token of its own. The output is exactly what the big model would have produced."
    callout: "Same answers, fewer slow passes."
  - kind: "lab"
    kicker: "See it"
    title: "How much faster"
    intro: "The draft costs a tenth of the big model per token. **Drag how often they agree and how far to guess.**"
    view:
      type: "bars"
      max: 8
      items:
        - { label: "tokens gained per big pass", value: "tok", color: "#1cd6ac" }
        - { label: "speed-up over plain decoding", value: "speed", color: "#f97316" }
    sliders:
      - "a"
      - "k"
    outro: "With agreement {a} and {k} guesses, each big pass yields **{tok}** tokens, a **{speed} times** speed-up after paying for the draft."
  - kind: "code"
    kicker: "Write it"
    title: "Verify the guesses"
    intro: "Keep the longest agreeing prefix, then add the big model's own token."
    lang: "python"
    code: |
      def accept(draft, target):
          n = 0
          while n < len(draft) and draft[n] == target[n]:
              n += 1
          return target[:n + 1]                       # matches, plus the correction

      assert accept([1, 2, 3, 4], [1, 2, 9, 4]) == [1, 2, 9]
      assert accept([1, 2, 3, 4], [1, 2, 3, 4, 7]) == [1, 2, 3, 4, 7]
      assert accept([5], [6, 0]) == [6]               # always at least one token

      def expected_tokens(a, k):
          return (1 - a ** (k + 1)) / (1 - a)

      assert abs(expected_tokens(0.7, 4) - 2.7731) < 1e-3
      assert expected_tokens(0.9, 4) > expected_tokens(0.5, 4)
    note: "Even when every guess is wrong you still get one correct token, so it never loses accuracy."
  - kind: "lab"
    kicker: "Memorise"
    title: "What makes it work"
    intro: "Three conditions."
    view:
      type: "flow"
      stages:
        - { label: "Good draft", note: "A small model that agrees often.", color: "#1cd6ac" }
        - { label: "Cheap draft", note: "Much faster than the big model.", color: "#38bdf8" }
        - { label: "Memory-bound target", note: "Checking many tokens costs about the same as one.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Quality"
    question: "Does speculative decoding change the big model's output?"
    options:
      - { text: "No, it gives the same distribution", correct: true, why: "Guesses are only kept when they match." }
      - { text: "Yes, it is a bit worse", why: "The check guarantees equality." }
      - { text: "Yes, it is better", why: "No." }
      - { text: "Only for short outputs", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Agreement"
    question: "The draft agrees with the big model rarely. What happens?"
    options:
      - { text: "The speed-up shrinks, maybe below one", correct: true, why: "You pay for the draft and gain little." }
      - { text: "It crashes", why: "No." }
      - { text: "Quality drops", why: "It stays." }
      - { text: "Nothing changes", why: "Speed changes." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**A draft from a different family.** Agreement is low."
      - "**Guessing too far ahead.** Later guesses rarely survive."
      - "**Forgetting the draft's memory.** It needs a cache too."
    next: { label: "Next: the inference cost model", href: "/learn/dist-inference-cost" }
