id: cloud-deploy
title: "Deploy to the cloud"
order: 40
minutes: 18
params:
  - { id: hours, label: "hours it runs a month", min: 0, max: 730, step: 10, init: 730 }
  - { id: rate, label: "dollars per hour", min: 0.01, max: 0.5, step: 0.01, init: 0.05 }
derived:
  - { id: always, expr: "730 * rate" }
  - { id: used, expr: "hours * rate" }
cards:
  - kind: story
    kicker: Lesson
    title: "From laptop to a link"
    body:
      - "Until now your app ran on your machine. To share it, you run it on someone else's computer that stays on."
      - "A **container** packages your app. A **platform** runs it, gives it a URL and restarts it if it crashes. You will practise **cost**, **scaling** and **health**."

  - kind: lab
    kicker: See it first
    title: "Pay for what runs"
    intro: "A server that is always on costs a full month. One that scales to zero costs only the hours used. **Drag the sliders.**"
    view:
      type: bars
      max: 400
      items:
        - { label: "always on, dollars", value: always, color: "#ef4444" }
        - { label: "hours used only, dollars", value: used, color: "#1cd6ac" }
    sliders: [hours, rate]
    outro: "Always on costs **{always}** dollars. Running {hours} hours costs **{used}**. Scale to zero suits a demo, always on suits a busy app."

  - kind: code
    kicker: In code
    title: "The three settings that matter"
    intro: "Most platforms ask for the same things. Here they are as a small config."
    lang: python
    code: |
      config = {
          'image': 'myapp:1.0',
          'port': 8000,
          'env': {'MODEL_KEY': 'set in the platform, never in git'},
          'min_instances': 0,
          'max_instances': 4,
      }
      print(config['max_instances'])
    note: "Secrets go in the platform settings, not in the image."

  - kind: practice
    kicker: Your turn
    title: "Monthly cost"
    intro: "Write `monthly_cost(hours, rate)` returning the cost, rounded to 2 places."
    entry: monthly_cost
    starter: |
      def monthly_cost(hours, rate):
          pass
    solution: |
      def monthly_cost(hours, rate):
          return round(hours * rate, 2)
    tests:
      - { input: "[730, 0.05]", expected: "36.5" }
      - { input: "[100, 0.1]", expected: "10.0" }
      - { input: "[0, 0.5]", expected: "0.0" }
    hint: "Hours times the hourly price."

  - kind: practice
    kicker: Your turn
    title: "How many instances"
    intro: "Write `instances(load, per_instance, lo, hi)`: enough instances to carry `load`, rounded up, but never fewer than `lo` or more than `hi`."
    entry: instances
    starter: |
      def instances(load, per_instance, lo, hi):
          pass
    solution: |
      def instances(load, per_instance, lo, hi):
          n = -(-load // per_instance)
          return max(lo, min(hi, n))
    tests:
      - { input: "[100, 30, 1, 10]", expected: "4" }
      - { input: "[0, 30, 1, 10]", expected: "1" }
      - { input: "[900, 30, 1, 4]", expected: "4" }
    hint: "Divide and round up, then clamp between the limits."

  - kind: practice
    kicker: Your turn
    title: "Healthy or not"
    intro: "A platform restarts an app if its checks fail. Write `healthy(checks)` where `checks` is a list of true or false. Return true when at least 2 of the last 3 passed."
    entry: healthy
    starter: |
      def healthy(checks):
          pass
    solution: |
      def healthy(checks):
          return sum(checks[-3:]) >= 2
    tests:
      - { input: "[[true, true, false]]", expected: "true" }
      - { input: "[[false, false, true]]", expected: "false" }
      - { input: "[[true]]", expected: "false" }
    hint: "Look only at the last three results."

  - kind: check
    kicker: Check yourself
    title: "Where the key lives"
    question: "Where should your model API key be stored for a deployed app?"
    options:
      - { text: "In the platform's secret settings", correct: true, why: "It is injected at run time and never enters git." }
      - { text: "In the code, in a constant", why: "Anyone with the repo gets it." }
      - { text: "In the Docker image", why: "Image layers can be pulled and read." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Secrets in git.** Rotate any key that was ever pushed."
      - "**No health check.** A hung app keeps getting traffic."
      - "**Always on for a demo.** Scale to zero and save the bill."
    next: { label: "Back to all lessons", href: "/learn" }
