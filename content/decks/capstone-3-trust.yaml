id: capstone-3-trust
title: "DocChat stage 3: cite and evaluate"
order: 1103
minutes: 18
params:
  - { id: cases, label: "eval questions", min: 20, max: 200, step: 20, init: 40 }
  - { id: rate, label: "percent right", min: 50, max: 100, step: 5, init: 80 }
derived:
  - { id: ok, expr: "round(cases * rate / 100)" }
  - { id: bad, expr: "cases - ok" }
cards:
  - kind: story
    kicker: "Capstone, week 6"
    title: "Make it trustworthy"
    body:
      - "A chat app that sounds sure but is wrong is worse than none. Stage 3 forces answers to cite their sources and measures how often it is right."
      - "**Stage 3**: build the prompt with numbered sources, check that citations are real, and compute a pass rate over a fixed set of questions."

  - kind: lab
    kicker: See it first
    title: "What a pass rate tells you"
    intro: "An eval is a fixed list of questions with known answers. **Drag the sliders** to see how many failures hide behind a good-looking rate."
    view:
      type: bars
      max: 200
      items:
        - { label: "questions passed", value: ok, color: "#1cd6ac" }
        - { label: "questions failed", value: bad, color: "#ef4444" }
    sliders: [cases, rate]
    outro: "{rate} percent of {cases} questions is **{ok}** passed and **{bad}** failed. Read the failures, since they show what to fix next."

  - kind: code
    kicker: Starter code
    title: "The project so far"
    intro: "Add the prompt builder to `docchat.py`. Numbered sources let the model, and you, point at evidence."
    lang: python
    code: |
      def build_prompt(question, chunks):
          lines = ["Answer using only the sources. Cite like [1]."]
          lines += [f"[{i + 1}] {c}" for i, c in enumerate(chunks)]
          lines.append(f"Question: {question}")
          return "\n".join(lines)

      print(build_prompt("Who wrote it?", ["Ada wrote it."]))
    note: "The tasks below check the answer that comes back."

  - kind: practice
    kicker: Add this to your project
    title: "Check the citations"
    intro: "Write `cited_ok(answer, n_sources)`. It is true when the answer cites at least one source like `[2]` and every citation number is between 1 and `n_sources`."
    entry: cited_ok
    starter: |
      def cited_ok(answer, n_sources):
          pass
    solution: |
      def cited_ok(answer, n_sources):
          import re
          nums = [int(x) for x in re.findall(r'\[(\d+)\]', answer)]
          return bool(nums) and all(1 <= n <= n_sources for n in nums)
    tests:
      - { input: "[\"See [1] and [2]\",2]", expected: "true" }
      - { input: "[\"See [3]\",2]", expected: "false" }
      - { input: "[\"no cite\",2]", expected: "false" }
      - { input: "[\"[0]\",2]", expected: "false" }
    hint: "Find every number inside square brackets, then check each range."

  - kind: practice
    kicker: Add this to your project
    title: "Score the eval"
    intro: "Write `pass_rate(results)` for a list of true or false eval outcomes. Return the share that passed, rounded to 2 places, or 0.0 for an empty list."
    entry: pass_rate
    starter: |
      def pass_rate(results):
          pass
    solution: |
      def pass_rate(results):
          return round(sum(results) / len(results), 2) if results else 0.0
    tests:
      - { input: "[[true,true,false,true]]", expected: "0.75" }
      - { input: "[[]]", expected: "0.0" }
      - { input: "[[false]]", expected: "0.0" }
      - { input: "[[true,false,false]]", expected: "0.33" }
    hint: "Count the trues and divide by the length."

  - kind: check
    kicker: Check yourself
    title: "Reading an eval"
    question: "Your pass rate rose from 70 to 80 percent, but you changed the eval questions too. What can you say?"
    options:
      - { text: "Nothing reliable, since the test changed", correct: true, why: "Compare on the same fixed questions or the numbers mean nothing." }
      - { text: "The app improved by 10 points", why: "A different test set makes the two numbers incomparable." }
      - { text: "The eval is now perfect", why: "No eval is perfect, and 80 percent still means failures to read." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Trusting invented citations.** Check that [n] points at a real source."
      - "**Changing the eval to look better.** Keep the question list fixed and add to it."
      - "**Quoting only the rate.** Keep the failed cases and read them."
    next: { label: "Next: stage 4", href: "/learn/capstone-4-ship" }
