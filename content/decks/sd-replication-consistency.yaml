id: "sd-replication-consistency"
title: "Replication and consistency"
minutes: 14
order: 602
params:
  - { id: "W", label: "replicas that must confirm a write", min: 1, max: 5, step: 1, init: 2 }
  - { id: "R", label: "replicas read", min: 1, max: 5, step: 1, init: 2 }
derived:
  - { id: "sum", expr: "W + R" }
  - { id: "need", expr: "3 + 1" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Copies cost you agreement"
    body:
      - "To survive failures, data is kept on several machines, called **replicas**. Now two replicas can briefly disagree, and a reader might see old data."
      - "You choose a trade. Wait for more replicas and answers are fresher and slower. Wait for fewer and they are quick and sometimes stale. This is the heart of the **CAP** trade-off."
    callout: "During a network split you can keep answering or stay correct. You cannot do both."
  - kind: "lab"
    kicker: "See it"
    title: "The quorum rule"
    intro: "With 3 replicas, a read sees the latest write whenever replicas written plus replicas read exceed 3. **Drag both.**"
    view:
      type: "bars"
      max: 10
      items:
        - { label: "write count plus read count", value: "sum", color: "#f97316" }
        - { label: "needed to be sure of fresh data", value: "need", color: "#1cd6ac" }
    sliders:
      - "W"
      - "R"
    outro: "You wrote to {W} and read {R}, so the total is **{sum}** against the **{need}** needed. Below that, a read can miss the newest value."
  - kind: "code"
    kicker: "Write it"
    title: "A quorum read"
    intro: "Each replica holds a value and a version. Read from R of them and take the highest version."
    lang: "python"
    code: |
      def quorum_ok(n, w, r):
          return w + r > n

      def read(replicas, r):
          seen = replicas[:r]
          return max(seen, key=lambda v: v[1])[0]

      assert quorum_ok(3, 2, 2) is True
      assert quorum_ok(3, 1, 1) is False

      # replica 0 missed the latest write
      replicas = [("old", 1), ("new", 2), ("new", 2)]
      assert read(replicas[1:], 2) == "new"
      assert read(replicas, 1) == "old"
    note: "With W plus R above N, any read set overlaps any write set by at least one replica."
  - kind: "lab"
    kicker: "Memorise"
    title: "Pick by need"
    intro: "Different data deserves different guarantees."
    view:
      type: "flow"
      stages:
        - { label: "Strong", note: "Money, stock counts, locks. Pay for it in latency.", color: "#ef4444" }
        - { label: "Eventual", note: "Likes, feeds, caches. Fast and slightly stale.", color: "#1cd6ac" }
        - { label: "Read your writes", note: "A user sees their own change at once. Often enough.", color: "#38bdf8" }
  - kind: "check"
    kicker: "Your turn"
    title: "Stale read"
    question: "A user posts, refreshes, and their post is missing. What happened?"
    options:
      - { text: "The read hit a replica that had not yet got the write", correct: true, why: "Replication lag. Read from the leader or use read your writes." }
      - { text: "The database lost the post", why: "It is probably just late." }
      - { text: "The cache is full", why: "Not the usual cause." }
      - { text: "The post was too long", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Quorum maths"
    question: "N is 5, W is 3, R is 3. Is a read guaranteed to see the latest write?"
    options:
      - { text: "Yes, 3 plus 3 is more than 5", correct: true, why: "The sets must overlap." }
      - { text: "No", why: "They overlap." }
      - { text: "Only if W is 5", why: "Not needed." }
      - { text: "Only with a leader", why: "Not needed." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Assuming a replica is current.** Always ask how stale it can be."
      - "**Strong everywhere.** It is slow and costly. Use it where it matters."
      - "**Ignoring failure modes.** Plan for a split network."
    next: { label: "Next: rate limiting", href: "/learn/sd-rate-limiting" }
