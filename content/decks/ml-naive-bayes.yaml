id: "ml-naive-bayes"
title: "Naive Bayes"
minutes: 12
order: 505
params:
  - { id: "p", label: "chance a message is spam before reading it", min: 0.05, max: 0.95, step: 0.05, init: 0.3 }
derived:
  - { id: "post", expr: "100 * p * 0.8 / (p * 0.8 + (1 - p) * 0.1)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Bayes rule with a shortcut"
    body:
      - "**Bayes rule** turns what you know before reading, the **prior**, and how likely the evidence is under each class, the **likelihood**, into an updated belief, the **posterior**."
      - "**Naive** Bayes assumes the features are independent given the class. That is rarely true, but it lets you multiply simple counts. It works surprisingly well for text."
    callout: "Fast, needs little data, and a strong first baseline for text."
  - kind: "lab"
    kicker: "See it"
    title: "A word changes the odds"
    intro: "Say the word offer appears in 80 percent of spam and 10 percent of normal mail. **Drag the prior.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "chance of spam after seeing the word", value: "post", color: "#f97316" }
        - { label: "chance before seeing it", value: "p * 100", color: "#38bdf8" }
    sliders:
      - "p"
    outro: "Starting from {p}, seeing the word lifts the chance of spam to **{post} percent**. A strong word moves a weak prior a long way."
  - kind: "code"
    kicker: "Write it"
    title: "Multiply the likelihoods"
    intro: "With independence, the posterior is the prior times each word likelihood, then scaled to sum to 1."
    lang: "python"
    code: |
      def posterior(prior, like_spam, like_ham):
          s, h = prior, 1 - prior
          for a in like_spam:
              s *= a
          for b in like_ham:
              h *= b
          return s / (s + h)

      assert abs(posterior(0.5, [0.8], [0.1]) - 8 / 9) < 1e-9
      assert abs(posterior(0.5, [0.8, 0.6], [0.1, 0.2]) - 0.96) < 1e-9

      # add one to every count so unseen words never give zero
      def smooth(count, total, vocab):
          return (count + 1) / (total + vocab)

      assert smooth(0, 10, 5) > 0
    note: "Real code adds logs instead of multiplying, to avoid numbers too small for the computer."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where it fits"
    intro: "Know its strength and its trap."
    view:
      type: "flow"
      stages:
        - { label: "Good for", note: "Spam, topic labels, quick baselines.", color: "#1cd6ac" }
        - { label: "Trap", note: "Correlated words are counted twice, so probabilities are overconfident.", color: "#ef4444" }
        - { label: "Rank not trust", note: "Use the order of scores, not the exact percentages.", color: "#38bdf8" }
  - kind: "check"
    kicker: "Your turn"
    title: "Zero count"
    question: "A word never appeared in spam in training. Without smoothing, what goes wrong?"
    options:
      - { text: "The spam score becomes zero whenever that word appears", correct: true, why: "One zero wipes out the whole product." }
      - { text: "Nothing", why: "A single zero kills it." }
      - { text: "The word is ignored", why: "It forces the score to zero." }
      - { text: "The prior changes", why: "It does not." }
  - kind: "check"
    kicker: "Practice"
    title: "The naive part"
    question: "What is naive about naive Bayes?"
    options:
      - { text: "It assumes features are independent given the class", correct: true, why: "That is what lets it multiply per feature." }
      - { text: "It ignores the prior", why: "It uses it." }
      - { text: "It uses no data", why: "It uses counts." }
      - { text: "It only handles two classes", why: "It handles many." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**No smoothing.** Unseen words zero out the score."
      - "**Trusting the probabilities.** They are usually too extreme."
      - "**Multiplying without logs.** Numbers underflow."
    next: { label: "Next: support vector machines", href: "/learn/ml-svm" }
