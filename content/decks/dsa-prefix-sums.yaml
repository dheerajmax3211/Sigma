id: dsa-prefix-sums
title: "Prefix sums"
minutes: 14
order: 106
params:
  - { id: s, label: "step", min: 0, max: 5, step: 1, init: 0 }
  - { id: q, label: "queries q", min: 1, max: 1000, step: 1, init: 500 }
derived:
  - { id: run, expr: "pick(s, 3, 4, 8, 9, 14, 23)" }
cards:
  - kind: story
    kicker: Start here
    title: "A running total you build once"
    body:
      - "Imagine someone asks, many times, for the sum of items from position i to position j. Adding them up each time is slow."
      - "Build one **running total** array first. Then any range sum is one subtraction: the total up to j minus the total before i."
    callout: "Clue words: sum of a range, many queries, subarray equals k."

  - kind: lab
    kicker: See it
    title: "Building the running total"
    intro: "Each prefix cell holds the sum of everything up to and including that position. **Drag the step.**"
    view:
      type: array
      cells: [3, 1, 4, 1, 5, 9]
      frames:
        - ["3", "?", "?", "?", "?", "?"]
        - ["3", "4", "?", "?", "?", "?"]
        - ["3", "4", "8", "?", "?", "?"]
        - ["3", "4", "8", "9", "?", "?"]
        - ["3", "4", "8", "9", "14", "?"]
        - ["3", "4", "8", "9", "14", "23"]
      frame: s
      pointers:
        - { label: "adding", at: s, color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Running total after index 0 is **3**."
      - "3 + 1 = **4**."
      - "4 + 4 = **8**."
      - "8 + 1 = **9**."
      - "9 + 5 = **14**."
      - "14 + 9 = **23**. So the prefix array is 3, 4, 8, 9, 14, 23."
    saysAt: s

  - kind: formula
    kicker: The trick
    title: "Range sum in one step"
    tex: "\\text{sum}(i..j) = P_j - P_{i-1}"
    say: "The sum from i to j equals the total up to j, minus the total just before i."
    symbols:
      - { tex: "P_j", means: "Prefix total up to and including index j." }
      - { tex: "P_{i-1}", means: "Prefix total just before index i. Use 0 when i is 0." }
      - { tex: "i..j", means: "The range from index i to index j, both included." }
    verify:
      - { expr: "23 - 8", equals: 15 }

  - kind: code
    kicker: Write it
    title: "Prefix sum with a leading zero"
    intro: "A leading 0 means index 0 needs no special case: `P[i]` is the sum of the first i items."
    lang: python
    code: |
      def build(a):
          P = [0]
          for x in a:
              P.append(P[-1] + x)
          return P

      def range_sum(P, i, j):          # inclusive i..j
          return P[j + 1] - P[i]

      P = build([3, 1, 4, 1, 5, 9])
      assert P == [0, 3, 4, 8, 9, 14, 23]
      assert range_sum(P, 2, 4) == 4 + 1 + 5
      assert range_sum(P, 0, 5) == 23
    note: "Build costs O(n) once. Every query after that is O(1)."

  - kind: lab
    kicker: What it saves
    title: "Many queries"
    intro: "Without a prefix array every query may walk n items. With one, each query is a subtraction. **Drag q.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "re-add each time", value: "q * 1000", color: "#ef4444" }
        - { label: "prefix sums", value: "q + 1000", color: "#1cd6ac" }
    sliders: [q]
    outro: "For an array of 1000 items and {q} queries, re-adding is about {q} times 1000 steps. Prefix sums need 1000 once plus {q}."

  - kind: check
    kicker: Your turn
    title: "Compute one"
    question: "P = [0, 3, 4, 8, 9, 14, 23]. What is the sum of items at indexes 1 to 3?"
    options:
      - { text: "5", why: "That is 9 - 4 using the wrong cells." }
      - { text: "6", correct: true, why: "Items 1, 4, 1 add to 6. Also P[4] - P[1] = 9 - 3 = 6." }
      - { text: "9", why: "That is P[4] alone, which starts from index 0." }
      - { text: "8", why: "That is P[3]." }

  - kind: code
    kicker: Hash map meets prefix
    title: "Subarray sum equals k"
    intro: "A run from i to j sums to k exactly when the prefix before it equals the current prefix minus k. Count how often each prefix appeared."
    lang: python
    code: |
      def count_subarrays(a, k):
          seen = {0: 1}          # prefix 0 appeared once, before anything
          cur = total = 0
          for x in a:
              cur += x
              total += seen.get(cur - k, 0)
              seen[cur] = seen.get(cur, 0) + 1
          return total

      assert count_subarrays([1, 1, 1], 2) == 2
      assert count_subarrays([1, 2, 3], 3) == 2
      assert count_subarrays([1, -1, 0], 0) == 3
    note: "O(n). It also works with negative numbers, which sliding window cannot handle."

  - kind: code
    kicker: 2D
    title: "Prefix sums on a grid"
    intro: "Same idea in two directions. Each cell holds the sum of the rectangle from the top left corner to that cell."
    lang: python
    code: |
      def build2d(g):
          R, C = len(g), len(g[0])
          P = [[0] * (C + 1) for _ in range(R + 1)]
          for r in range(R):
              for c in range(C):
                  P[r+1][c+1] = g[r][c] + P[r][c+1] + P[r+1][c] - P[r][c]
          return P

      def rect(P, r1, c1, r2, c2):     # inclusive corners
          return P[r2+1][c2+1] - P[r1][c2+1] - P[r2+1][c1] + P[r1][c1]

      P = build2d([[1, 2], [3, 4]])
      assert rect(P, 0, 0, 1, 1) == 10
      assert rect(P, 1, 0, 1, 1) == 7
    note: "Add the two neighbours, subtract the overlap once. Query is the same shape in reverse."

  - kind: check
    kicker: Practice
    title: "When to use it"
    question: "The array never changes, and you must answer 100,000 range-sum questions. Best approach?"
    options:
      - { text: "Loop over each range", why: "Up to n steps per query." }
      - { text: "Build a prefix array once", correct: true, why: "O(n) build, then O(1) per query." }
      - { text: "Sort the array", why: "Sorting loses positions." }
      - { text: "Use a stack", why: "Not related." }

  - kind: practice
    kicker: Your turn
    title: "Range sum"
    intro: "Write `range_sums(nums, queries)` where each query is `[l, r]` (inclusive). Return the sum of `nums[l..r]` for every query. Build prefix sums once so each query is O(1)."
    entry: range_sums
    starter: |
      def range_sums(nums, queries):
          pass
    solution: |
      def range_sums(nums, queries):
          pre = [0]
          for x in nums:
              pre.append(pre[-1] + x)
          return [pre[r + 1] - pre[l] for l, r in queries]
    tests:
      - { input: "[[1,2,3,4],[[0,3],[1,2],[2,2]]]", expected: "[10,5,3]" }
      - { input: "[[5],[[0,0]]]", expected: "[5]" }
    hint: "pre[i] is the sum of the first i numbers. The answer is pre[r+1] minus pre[l]."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Off by one at the left end.** Use a leading 0 so `P[j+1] - P[i]` always works."
      - "**Array changes between queries.** Prefix sums go stale. You would need a Fenwick tree."
      - "**Forgetting `seen = {0: 1}`.** Runs starting at index 0 would be missed."
      - "**Overflow thinking.** Python integers are unlimited, but in other languages use a bigger type."
    next: { label: "Next: stacks", href: /learn/dsa-stacks }
