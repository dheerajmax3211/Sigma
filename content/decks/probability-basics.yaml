id: probability-basics
title: Probability in plain words
order: 4
minutes: 9
params:
  - { id: nSpam, label: "spam emails (of 100)", min: 0, max: 100, step: 5, init: 40 }
  - { id: pFS, label: "% of spam with 'free'", min: 0, max: 100, step: 5, init: 75 }
  - { id: pFH, label: "% of normal mail with 'free'", min: 0, max: 100, step: 5, init: 10 }
derived:
  - { id: pSpam, expr: nSpam / 100 }
  - { id: ham, expr: 100 - nSpam }
  - { id: spamFree, expr: nSpam * pFS / 100 }
  - { id: hamFree, expr: ham * pFH / 100 }
  - { id: freeAll, expr: spamFree + hamFree }
  - { id: pAB, expr: spamFree / 100 }
  - { id: pB, expr: freeAll / 100 }
  - { id: pgf, expr: "pAB / max(pB, 0.0001)" }
cards:
  - kind: story
    kicker: Start here
    title: Probability is a count out of a crowd
    body:
      - Flip a coin many times and about half come up heads. We say the probability of heads is 0.5. A probability is how many times something happens out of all the times it could.
      - It is always a number from **0** (never) to **1** (always). Models use probabilities everywhere, for example "how likely is this email spam?"
    callout: Probability = favourable cases ÷ all cases.

  - kind: lab
    kicker: See it first
    title: Spam out of 100 emails
    intro: Imagine 100 emails. Slide how many are spam and see the chance that a random email is spam.
    view:
      type: bars
      max: 100
      items:
        - { label: spam, value: nSpam, color: "#f97316" }
        - { label: not spam, value: ham, color: "#38bdf8" }
    sliders: [nSpam]
    outro: "{nSpam} of 100 are spam, so the probability a random email is spam is **{pSpam}**."

  - kind: formula
    kicker: Read the formula
    title: The basic rule
    tex: "P(A) = \\frac{\\text{cases where A happens}}{\\text{all cases}}"
    say: Count how often the thing happens and divide by the total. The letter P stands for probability and A is the event you care about.
    verify:
      - { expr: pSpam, equals: 0.4, tol: 0.001 }
      - { expr: "40 / 100", equals: 0.4, tol: 0.001 }
    symbols:
      - { tex: "P(A)", means: "the probability of A, read “P of A”", value: pSpam }
      - { tex: "A", means: "an event, such as “this email is spam”" }
      - { tex: "\\text{all cases}", means: every email we are looking at, value: "100" }

  - kind: lab
    kicker: The key idea
    title: What if we already know a word?
    intro: Spam often contains the word "free". Of the emails that contain "free", how many are spam? Change the three sliders and watch the answer.
    view:
      type: bars
      items:
        - { label: "spam with 'free'", value: spamFree, color: "#f97316" }
        - { label: "normal mail with 'free'", value: hamFree, color: "#38bdf8" }
    sliders: [nSpam, pFS, pFH]
    outro: "Of the {freeAll} emails containing “free”, {spamFree} are spam. So P(spam given free) = **{pgf}**."

  - kind: formula
    kicker: Read the formula
    title: Conditional probability
    tex: "P(A \\mid B) = \\frac{P(A \\text{ and } B)}{P(B)}"
    say: "The bar | means “given that”. Restrict attention to only the cases where B is true, then ask how often A is true among them."
    verify:
      - { expr: pgf, equals: 0.8333, tol: 0.001 }
      - { expr: "30 / 36", equals: 0.8333, tol: 0.001 }
    symbols:
      - { tex: "P(A \\mid B)", means: "chance of spam, given the email has “free”", value: pgf }
      - { tex: "P(A \\text{ and } B)", means: share of all emails that are spam and contain “free”, value: pAB }
      - { tex: "P(B)", means: share of all emails that contain “free”, value: pB }

  - kind: check
    kicker: Check yourself
    title: Read a conditional
    question: 20 emails contain the word "free". 15 of those are spam. What is P(spam given free)?
    options:
      - { text: "0.75", correct: true, why: "Among the 20 that contain the word, 15 are spam: 15 ÷ 20 = 0.75." }
      - { text: "0.15", why: "That divides by 100 instead of by the 20 emails that contain the word." }
      - { text: "0.25", why: "That is the share that are not spam, 5 ÷ 20." }

  - kind: practice
    kicker: Your turn
    title: "Chance of at least one"
    intro: "Write `at_least_one(p, n)`: the chance that an event with chance `p` happens at least once in `n` independent tries. Round to 4 places."
    entry: at_least_one
    starter: |
      def at_least_one(p, n):
          pass
    solution: |
      def at_least_one(p, n):
          return round(1 - (1 - p) ** n, 4)
    tests:
      - { input: "[0.5, 1]", expected: "0.5" }
      - { input: "[0.5, 3]", expected: "0.875" }
      - { input: "[0.1, 10]", expected: "0.6513" }
    hint: "It is easier to find the chance it never happens, then take that away from 1."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**P(A given B) is not P(B given A).** Most spam may contain “free” without most “free” mail being spam. Always ask which group you are dividing by."
      - "**Probabilities over all outcomes add to 1.** If spam is 0.4, then not-spam must be 0.6."
      - "**A model's 0.7 is not “70% sure”.** It is a score that behaves like a probability only if the model was checked against real counts."
    next: { label: "Next: mean, spread and the bell curve", href: /learn/mean-variance-normal }
