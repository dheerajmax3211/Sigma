id: dsa-recursion
title: "Recursion"
minutes: 15
order: 112
params:
  - { id: s, label: "step", min: 0, max: 7, step: 1, init: 0 }
  - { id: n, label: "n", min: 1, max: 20, step: 1, init: 10 }
derived:
  - { id: naive, expr: "1.618 ^ n" }
  - { id: memo, expr: "2 * n - 1" }
  - { id: top, expr: "pick(s, 0, 1, 2, 3, 2, 1, 0, 0)" }
cards:
  - kind: story
    kicker: Start here
    title: "Solve it by solving a smaller copy"
    body:
      - "A recursive function calls itself on a **smaller** version of the problem, and stops when the problem is tiny enough to answer directly."
      - "Two parts every time: the **base case** (when to stop) and the **recursive case** (how to shrink). Trust the smaller call to be right, then build on it."
    callout: "Clue words: tree, nested, all combinations, divide the problem, 'defined in terms of itself'."

  - kind: lab
    kicker: See it
    title: "The call stack for factorial of 4"
    intro: "4! means 4 × 3 × 2 × 1. Each call waits for a smaller call. When the smallest answers, they all answer back. **Drag the step.**"
    view:
      type: array
      cells: ["", "", "", ""]
      frames:
        - ["fact(4)", "", "", ""]
        - ["fact(4)", "fact(3)", "", ""]
        - ["fact(4)", "fact(3)", "fact(2)", ""]
        - ["fact(4)", "fact(3)", "fact(2)", "fact(1)"]
        - ["fact(4)", "fact(3)", "fact(2)", "1"]
        - ["fact(4)", "fact(3)", "2", ""]
        - ["fact(4)", "6", "", ""]
        - ["24", "", "", ""]
      frame: s
      pointers:
        - { label: "running", at: top, color: "#1cd6ac" }
    sliders: [s]
    says:
      - "fact(4) starts. It needs fact(3) first, so it waits."
      - "fact(3) starts and waits for fact(2)."
      - "fact(2) starts and waits for fact(1)."
      - "fact(1) is the **base case**. It answers 1 without calling anything."
      - "fact(2) receives 1, computes 2 times 1 = 2."
      - "fact(3) receives 2, computes 3 times 2 = 6."
      - "fact(4) receives 6, computes 4 times 6 = 24."
      - "Done. The stack is back to one answer: 24."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Factorial and sum"
    intro: "Always write the base case first. Then make sure each call moves **toward** it."
    lang: python
    code: |
      def fact(n):
          if n <= 1:                 # base case
              return 1
          return n * fact(n - 1)     # smaller problem

      def total(a):
          if not a:
              return 0
          return a[0] + total(a[1:])

      assert fact(4) == 24 and fact(1) == 1
      assert total([1, 2, 3, 4]) == 10
      assert total([]) == 0
    note: "Depth is n here. Python stops around 1000 calls deep, so very deep recursion needs a loop."

  - kind: check
    kicker: Your turn
    title: "The missing base case"
    question: "What happens if `fact` has no base case?"
    options:
      - { text: "It returns 0", why: "It never returns at all." }
      - { text: "It keeps calling itself until Python raises RecursionError", correct: true, why: "Each call adds a stack entry, and there is a limit." }
      - { text: "It becomes a loop that ends by itself", why: "Nothing ever stops it." }
      - { text: "It works for positive n", why: "It fails for every n, because n never reaches a stop." }

  - kind: lab
    kicker: The trap
    title: "Naive Fibonacci repeats work"
    intro: "fib(n) = fib(n-1) + fib(n-2). Written naively, the same small values are recomputed over and over. **Drag n.**"
    view:
      type: bars
      max: 20000
      items:
        - { label: "naive calls (about 1.6 to the n)", value: naive, color: "#ef4444" }
        - { label: "with memory (about 2n)", value: memo, color: "#1cd6ac" }
    sliders: [n]
    outro: "At n = {n}, the naive version makes roughly **{naive}** calls. Remembering answers makes only about {memo}."

  - kind: code
    kicker: Write it
    title: "Memoization"
    intro: "**Memoize** means save each answer the first time and reuse it. `functools.cache` does it in one line."
    lang: python
    code: |
      from functools import cache

      @cache
      def fib(n):
          if n < 2:
              return n
          return fib(n - 1) + fib(n - 2)

      assert fib(10) == 55
      assert fib(80) == 23416728348467685     # instant, naive would never finish

      def fib_loop(n):
          a, b = 0, 1
          for _ in range(n):
              a, b = b, a + b
          return a

      assert fib_loop(80) == fib(80)
    note: "Memoization is the bridge to dynamic programming, which you meet later in this track."

  - kind: code
    kicker: Branching
    title: "All subsets"
    intro: "For each item you have two choices: leave it or take it. That is a recursive tree of 2 to the n branches."
    lang: python
    code: |
      def subsets(a):
          out = []
          def go(i, cur):
              if i == len(a):
                  out.append(cur[:])
                  return
              go(i + 1, cur)               # skip a[i]
              cur.append(a[i])
              go(i + 1, cur)               # take a[i]
              cur.pop()                    # undo
          go(0, [])
          return out

      r = subsets([1, 2, 3])
      assert len(r) == 8
      assert [1, 3] in r and [] in r and [1, 2, 3] in r
    note: "The take, recurse, undo shape is called backtracking. Copy `cur[:]` when saving or later changes will edit it."

  - kind: check
    kicker: Practice
    title: "Count the calls"
    question: "A function calls itself twice on inputs of half the size and does O(n) extra work. Which time fits?"
    options:
      - { text: "O(n log n)", correct: true, why: "log n levels, about n work at each level. Merge sort has this shape." }
      - { text: "O(n squared)", why: "That needs more work per level." }
      - { text: "O(log n)", why: "Both halves are processed, not one." }
      - { text: "O(2 to the n)", why: "That is when the input only shrinks by 1." }

  - kind: practice
    kicker: Your turn
    title: "Power set size by recursion"
    intro: "Write `power(base, exp)` recursively. A call with `exp` of 0 returns 1. Otherwise it uses the answer for `exp - 1`."
    entry: power
    starter: |
      def power(base, exp):
          pass
    solution: |
      def power(base, exp):
          if exp == 0:
              return 1
          return base * power(base, exp - 1)
    tests:
      - { input: "[2,10]", expected: "1024" }
      - { input: "[5,0]", expected: "1" }
      - { input: "[3,3]", expected: "27" }
    hint: "Name the base case first, then trust the smaller call."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**No progress.** Each call must move toward the base case."
      - "**Slicing in recursion.** `a[1:]` copies the list every time. Pass an index instead."
      - "**Forgetting to return.** `fact(n - 1)` without `return` gives None."
      - "**Saving the same list.** Append `cur[:]`, not `cur`, when collecting results."
    next: { label: "Next: binary trees", href: /learn/dsa-binary-trees }
