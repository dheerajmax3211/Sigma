id: "vis-document-understanding"
title: "Document understanding and OCR checks"
minutes: 13
order: 910
params:
  - { id: "c", label: "character error rate (percent)", min: 0, max: 20, step: 1, init: 3 }
derived:
  - { id: "ok", expr: "100 * (1 - c / 100) ^ 10" }
  - { id: "bad", expr: "100 - ok" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Invoices, forms, receipts"
    body:
      - "A big share of real work is reading documents. The usual pipeline starts with **OCR**, which turns pixels into text and positions. Then **layout** understanding, which tells a title from a table cell, then **extraction** of the fields you care about."
      - "Newer models read the page image directly. Either way, errors are routine, so a good system **validates** every field with cheap rules."
    callout: "Trust the extraction only after the checks pass."
  - kind: "lab"
    kicker: "See it"
    title: "Small errors, big problems"
    intro: "An invoice number has 10 characters. If each is misread at some rate, the whole field is wrong more often than you expect. **Drag the error rate.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "fields read fully right (percent)", value: "ok", color: "#1cd6ac" }
        - { label: "fields with a mistake (percent)", value: "bad", color: "#ef4444" }
    sliders:
      - "c"
    outro: "At a {c} percent character error rate, **{bad} percent** of 10 character fields contain a mistake."
  - kind: "code"
    kicker: "Write it"
    title: "Validate with arithmetic"
    intro: "Line items must add up to the total."
    lang: "python"
    code: |
      import re

      def parse_money(s):
          m = re.fullmatch(r"(\d+)\.(\d{2})", s.strip())
          if not m:
              return None
          return int(m.group(1)) * 100 + int(m.group(2))      # cents, avoids float error

      def total_ok(items, total):
          t = parse_money(total)
          return t is not None and sum(parse_money(i) for i in items) == t

      assert parse_money("14.75") == 1475
      assert parse_money("14,75") is None
      assert total_ok(["10.50", "4.25"], "14.75")
      assert not total_ok(["10.50", "4.25"], "14.15")         # OCR misread caught
    note: "Other cheap checks: date formats, check digits, known vendor names, and ranges."
  - kind: "lab"
    kicker: "Memorise"
    title: "A reliable pipeline"
    intro: "Where each safeguard goes."
    view:
      type: "flow"
      stages:
        - { label: "Read", note: "OCR or a vision model gives text and boxes.", color: "#38bdf8" }
        - { label: "Extract", note: "Pull the fields into a fixed schema.", color: "#1cd6ac" }
        - { label: "Validate", note: "Arithmetic, formats and lookups.", color: "#f97316" }
        - { label: "Review", note: "Low confidence or failed checks go to a person.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why validate"
    question: "Why add rule checks after extraction?"
    options:
      - { text: "Read errors are common and rules catch many of them", correct: true, why: "Cheap and effective." }
      - { text: "Models never err", why: "They do." }
      - { text: "It makes OCR faster", why: "No." }
      - { text: "It removes layout", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Money"
    question: "Why store money as whole cents?"
    options:
      - { text: "Floating point can add tiny errors", correct: true, why: "Integers are exact." }
      - { text: "Cents are shorter", why: "Not the reason." }
      - { text: "It is required by OCR", why: "No." }
      - { text: "It saves memory", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Trusting a confident but wrong read.** Validate."
      - "**No human review path.** Some pages will fail."
      - "**Only testing clean scans.** Try phone photos and skew."
    next: { label: "Back to all lessons", href: "/learn" }
