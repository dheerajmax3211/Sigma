id: "vis-classifier-free-guidance"
title: "Classifier-free guidance"
minutes: 14
order: 909
params:
  - { id: "w", label: "guidance scale", min: 0, max: 15, step: 0.5, init: 7.5 }
derived:
  - { id: "push", expr: "w * 6" }
  - { id: "div", expr: "100 / (1 + w)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Turn up the prompt"
    body:
      - "A text-to-image model predicts noise given a prompt. **Classifier-free guidance** also asks it for the noise with an empty prompt, then pushes past the empty one toward the prompt. The rule is: unconditional plus scale times the difference between conditional and unconditional."
      - "A higher scale follows the prompt more closely but gives less variety and can look oversaturated. Typical values are 5 to 10."
    callout: "One dial between creative and obedient."
  - kind: "lab"
    kicker: "See it"
    title: "The dial"
    intro: "Here the prompted guess is 0.6 above the empty one. **Drag the scale.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "push toward the prompt (times 10)", value: "push", color: "#f97316" }
        - { label: "variety left (percent)", value: "div", color: "#38bdf8" }
    sliders:
      - "w"
    outro: "At scale {w} the push is **{push}** and variety falls to **{div} percent**. Zero ignores the prompt and one is the plain conditional model."
  - kind: "code"
    kicker: "Write it"
    title: "The guidance rule"
    intro: "Two predictions, one blend."
    lang: "python"
    code: |
      def guided(cond, uncond, w):
          return [u + w * (c - u) for c, u in zip(cond, uncond)]

      cond = [0.8, 0.1]
      uncond = [0.2, 0.1]

      near = lambda a, b: all(abs(x - y) < 1e-9 for x, y in zip(a, b))
      assert near(guided(cond, uncond, 0), uncond)
      assert near(guided(cond, uncond, 1), cond)
      assert near(guided(cond, uncond, 3), [2.0, 0.1])
    note: "Training randomly drops the prompt, about one time in ten, so one network learns both."
  - kind: "lab"
    kicker: "Memorise"
    title: "What you pay"
    intro: "Each step needs two predictions."
    view:
      type: "flow"
      stages:
        - { label: "Conditional", note: "Prediction with your prompt.", color: "#1cd6ac" }
        - { label: "Unconditional", note: "Prediction with an empty prompt.", color: "#38bdf8" }
        - { label: "Blend", note: "Push away from empty toward the prompt.", color: "#f97316" }
        - { label: "Cost", note: "Twice the compute per step, often batched.", color: "#ef4444" }
  - kind: "check"
    kicker: "Your turn"
    title: "Scale 1"
    question: "What does a guidance scale of 1 give?"
    options:
      - { text: "The plain prompted prediction", correct: true, why: "No extra push." }
      - { text: "Pure noise", why: "No." }
      - { text: "The empty prompt", why: "That is zero." }
      - { text: "A crash", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Too high"
    question: "A scale of 30 usually gives?"
    options:
      - { text: "Oversaturated, less varied images", correct: true, why: "The push is too strong." }
      - { text: "Better detail always", why: "No." }
      - { text: "Faster sampling", why: "No." }
      - { text: "Blank images", why: "Not usually." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Maxing the scale for obedience.** Quality drops."
      - "**Forgetting the doubled cost.**"
      - "**A vague prompt and a high scale.** You amplify the vagueness."
    next: { label: "Next: reading documents", href: "/learn/vis-document-understanding" }
