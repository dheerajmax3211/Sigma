id: http-and-rest
title: HTTP and REST APIs
order: 11
minutes: 9
params:
  - { id: limit, label: "items requested (limit)", min: 1, max: 15, step: 1, init: 5 }
  - { id: total, label: "rows in the database", min: 1, max: 20, step: 1, init: 12 }
derived:
  - { id: returned, expr: "min(limit, total)" }
  - { id: bytes, expr: "returned * 120" }
cards:
  - kind: story
    kicker: Start here
    title: A request is an order, a response is the dish
    body:
      - "At a restaurant you give an order to a waiter. The kitchen cooks and the waiter brings the dish back. **HTTP** is the written format for those orders and dishes."
      - "Every web page, app and AI API you will use works this way: one message out, one message back."
    callout: "Request out, response back. That is all HTTP is."

  - kind: lab
    kicker: See it first
    title: Follow one request
    intro: "The client asks for some products, the server asks the database, and the response carries them back. **Drag** the limit and the number of rows."
    view:
      type: flow
      stages:
        - { label: "1. Request", note: "client sends **GET /products?limit={limit}**", color: "#38bdf8" }
        - { label: "2. Server", note: "checks the method and path, then runs your code", color: "#a78bfa" }
        - { label: "3. Database", note: "holds {total} rows and hands back **{returned}**", color: "#f59e0b" }
        - { label: "4. Response", note: "**200 OK** with {returned} products, about {bytes} bytes", color: "#1cd6ac" }
    sliders: [limit, total]
    outro: "Asking for {limit} when {total} exist returns **{returned}**. Fewer items means a smaller response."

  - kind: code
    kicker: Read it
    title: Read a request with curl
    intro: "`curl` sends a request from the terminal. The **method** says what to do, the **URL** says on what, and the **body** carries data."
    lang: bash
    code: |
      # GET: read data (no body)
      curl "https://api.example.com/products?limit=5"

      # POST: create something, with JSON in the body
      curl -X POST https://api.example.com/products \
        -H "Content-Type: application/json" \
        -d '{"name": "Notebook", "price": 5}'
    note: "The `-H` line is a **header**: an extra fact about the request, such as the format of the body."

  - kind: story
    kicker: Status codes
    title: The first digit tells you who to blame
    body:
      - "**2xx** means it worked, like 200 OK or 201 Created. **4xx** means the client made a mistake, like 400 bad input, 401 not signed in or 404 not found."
      - "**5xx** means the server failed, like 500 internal error. The same request might work later."
    callout: "2xx fine, 4xx you, 5xx them."

  - kind: check
    kicker: Check yourself
    title: Pick the status code
    question: "A client asks for /products/999 and no such product exists. Which status should the server send?"
    options:
      - { text: "404 Not Found", correct: true, why: "The path makes sense, but the thing it names does not exist." }
      - { text: "500 Internal Server Error", why: "500 means the server crashed or has a bug, not that an item is missing." }
      - { text: "200 OK", why: "200 means success. A missing item should say so." }

  - kind: code
    kicker: In code
    title: Call an API from JavaScript
    intro: "`fetch` does the same job inside code. Wait for the response, check it worked, then read the JSON body."
    lang: javascript
    code: |
      const res = await fetch("/api/products?limit=5");
      if (!res.ok) throw new Error(`Request failed: ${res.status}`);
      const products = await res.json();   // the body as a JS object
      console.log(products.length);
    note: "`res.ok` is true for any 2xx status. Check it before you use the data."

  - kind: check
    kicker: Check yourself
    title: Design the endpoint
    question: "You want to delete user 42. Which request follows REST?"
    options:
      - { text: "DELETE /users/42", correct: true, why: "The URL names the thing, a noun. The method says the action, a verb." }
      - { text: "GET /deleteUser?id=42", why: "The verb is hidden in the URL, and GET must never change data." }
      - { text: "POST /doDeleteUser", why: "This invents a verb path and does not say which user." }

  - kind: practice
    kicker: Your turn
    title: "Pick the status"
    intro: "Write `status(method, found, valid)` for a tiny API. Return 400 if `valid` is false, else 404 if `found` is false, else 201 for POST and 200 for anything else."
    entry: status
    starter: |
      def status(method, found, valid):
          pass
    solution: |
      def status(method, found, valid):
          if not valid:
              return 400
          if not found:
              return 404
          return 201 if method == 'POST' else 200
    tests:
      - { input: "[\"GET\", true, true]", expected: "200" }
      - { input: "[\"POST\", true, true]", expected: "201" }
      - { input: "[\"GET\", false, true]", expected: "404" }
      - { input: "[\"GET\", true, false]", expected: "400" }
    hint: "Check the cheapest failure first."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Treating 200 as always good.** Some APIs return 200 with an error message inside. Read the body too."
      - "**Changing data with GET.** GET must only read. Browsers and crawlers call it freely."
      - "**Forgetting the Content-Type header.** Without it the server may not understand your JSON body."
    next: { label: "Next: SQL select and join", href: /learn/sql-select-join }
