id: "ml-clustering"
title: "Clustering with k-means"
minutes: 13
order: 507
params:
  - { id: "k", label: "number of clusters", min: 1, max: 10, step: 1, init: 3 }
derived:
  - { id: "i", expr: "100 * 0.4 ^ (min(k, 3) - 1) * 0.95 ^ max(0, k - 3)" }
  - { id: "ip", expr: "100 * 0.4 ^ (min(max(k - 1, 1), 3) - 1) * 0.95 ^ max(0, max(k - 1, 1) - 3)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Finding groups without labels"
    body:
      - "**Clustering** finds groups in data that has no labels. **k-means** is the classic method: pick k centres, give each point to its nearest centre, move each centre to the average of its points, and repeat."
      - "It stops when nothing moves. You must choose k yourself, and the answer depends on where the centres start."
    callout: "Use it to explore, segment customers or compress, not as a source of truth."
  - kind: "lab"
    kicker: "See it"
    title: "Choosing k: the elbow"
    intro: "Total squared distance to the centres, the **inertia**, always falls as k grows. The useful k is where the drop slows. Here the data truly has 3 groups. **Drag k.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "inertia with k clusters", value: "i", color: "#f97316" }
        - { label: "inertia with one fewer", value: "ip", color: "#38bdf8" }
    sliders:
      - "k"
    outro: "At k equal to {k} inertia is **{i}**, against {ip} with one fewer. Beyond 3 the gains are tiny. That bend is the elbow."
  - kind: "code"
    kicker: "Write it"
    title: "One round of k-means"
    intro: "Assign, then update. Repeat until the centres stop moving."
    lang: "python"
    code: |
      def assign(xs, cs):
          return [min(range(len(cs)), key=lambda j: abs(x - cs[j])) for x in xs]

      def update(xs, labels, k):
          out = []
          for j in range(k):
              mine = [x for x, l in zip(xs, labels) if l == j]
              out.append(sum(mine) / len(mine))
          return out

      xs = [1, 2, 3, 10, 11, 12]
      labels = assign(xs, [1, 10])
      assert labels == [0, 0, 0, 1, 1, 1]
      assert update(xs, labels, 2) == [2, 11]
    note: "Run it several times from different starts and keep the lowest inertia."
  - kind: "lab"
    kicker: "Memorise"
    title: "Beyond k-means"
    intro: "It assumes round, similar-sized groups."
    view:
      type: "flow"
      stages:
        - { label: "k-means", note: "Fast. Round clusters. Needs k.", color: "#38bdf8" }
        - { label: "DBSCAN", note: "Finds dense blobs of any shape. Marks outliers.", color: "#1cd6ac" }
        - { label: "Hierarchical", note: "Builds a tree of merges. Cut where you like.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Scaling"
    question: "Clustering on age and income without scaling. What happens?"
    options:
      - { text: "Income decides the clusters", correct: true, why: "Distance is dominated by the larger numbers." }
      - { text: "Age decides them", why: "Income has bigger values." }
      - { text: "It fails to run", why: "It runs, badly." }
      - { text: "Nothing changes", why: "It changes a lot." }
  - kind: "check"
    kicker: "Practice"
    title: "Bad start"
    question: "Two runs of k-means give different clusters. Why?"
    options:
      - { text: "Random starting centres can land in different local optima", correct: true, why: "Use several restarts or k-means plus plus." }
      - { text: "The data changed", why: "It is the same data." }
      - { text: "It is a bug", why: "It is expected." }
      - { text: "k is too large", why: "Not the cause." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Picking k by inertia alone.** It always falls."
      - "**Not scaling.** One feature dominates."
      - "**Believing the clusters are real.** Check them against something you know."
    next: { label: "Next: PCA", href: "/learn/ml-pca" }
