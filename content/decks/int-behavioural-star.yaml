id: int-behavioural-star
title: "Behavioural answers with STAR"
minutes: 14
order: 202
params:
  - { id: sec, label: "seconds", min: 60, max: 180, step: 10, init: 120 }
derived:
  - { id: s1, expr: "round(sec * 0.1)" }
  - { id: s2, expr: "round(sec * 0.1)" }
  - { id: s3, expr: "round(sec * 0.5)" }
  - { id: s4, expr: "round(sec * 0.3)" }
cards:
  - kind: story
    kicker: Start here
    title: "A story, not a lecture"
    body:
      - "'Tell me about a time when...' is the most common behavioural question. The interviewer wants a **real example** that shows how you act."
      - "**STAR** keeps the story short: **S**ituation, **T**ask, **A**ction, **R**esult. Most people spend too long on the setup and rush the part that matters."
    callout: "The interviewer scores what YOU did. Say 'I', not 'we', for your own actions."

  - kind: lab
    kicker: See it
    title: "Where the time goes"
    intro: "Aim for two minutes. Action is half the answer, the result is almost a third. **Drag the total time.**"
    view:
      type: bars
      max: 90
      items:
        - { label: "Situation", value: s1, color: "#38bdf8" }
        - { label: "Task", value: s2, color: "#1cd6ac" }
        - { label: "Action", value: s3, color: "#f97316" }
        - { label: "Result", value: s4, color: "#a78bfa" }
    sliders: [sec]
    outro: "In {sec} seconds: {s1} for the situation, {s2} for the task, **{s3} for what you did**, {s4} for the result."

  - kind: code
    kicker: Worked example
    title: "A full STAR answer"
    intro: "Question: tell me about a time something went wrong. Notice the **numbers** in the result."
    lang: text
    code: |
      S: Our model-serving API started timing out during a launch.
      T: I was on call and had to restore it before the evening traffic peak.
      A: I checked the dashboards and found requests queuing behind one slow
         model load. I moved loading to start-up, added a cache for repeat
         inputs and wrote a load test so we could prove the fix.
      R: p95 latency dropped from 4.1 s to 0.6 s. We handled the launch with
         no further incidents, and the load test now runs on every release.
    note: "Roughly 120 words spoken. The result has two numbers and a lasting change."

  - kind: lab
    kicker: Build yours
    title: "Seven stories cover almost everything"
    intro: "Prepare a small bank of stories. One story can answer several questions if you shift the emphasis."
    view:
      type: flow
      stages:
        - { label: "Conflict", note: "A disagreement you resolved well.", color: "#ef4444" }
        - { label: "Failure", note: "A mistake you owned and fixed.", color: "#f97316" }
        - { label: "Leadership", note: "You led without being the boss.", color: "#facc15" }
        - { label: "Deadline", note: "A tight timeline and a hard trade-off.", color: "#1cd6ac" }
        - { label: "Learning", note: "Something new you picked up fast.", color: "#38bdf8" }
        - { label: "Impact", note: "Your proudest measurable result.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Fix the weak answer"
    question: "'We built a recommender and it worked well. The team was great.' What is missing?"
    options:
      - { text: "What you did and a measurable result", correct: true, why: "Without your own actions and numbers, the interviewer has nothing to score." }
      - { text: "A longer introduction", why: "Setup is the part people already overdo." }
      - { text: "More praise for the team", why: "It adds nothing to your evaluation." }
      - { text: "A joke", why: "Not the gap." }

  - kind: check
    kicker: Practice
    title: "Failure question"
    question: "'Tell me about a failure.' Which approach scores best?"
    options:
      - { text: "A real mistake, how you fixed it and what you now do differently", correct: true, why: "It shows honesty, ownership and growth." }
      - { text: "A fake failure that is really a strength", why: "Interviewers spot this immediately." }
      - { text: "Blame a teammate", why: "It signals you avoid ownership." }
      - { text: "Say you have never failed", why: "It signals low self-awareness." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Using 'we' everywhere.** Say clearly what you personally did."
      - "**No numbers.** Add a metric, even a rough one."
      - "**A rambling setup.** Trim the situation to two sentences."
      - "**Memorised scripts.** Know the beats, not the exact words."
    next: { label: "Next: tell me about yourself", href: /learn/int-tell-me-about-yourself }
