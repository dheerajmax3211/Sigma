id: int-sd-scaling
title: "System design: scaling a backend"
minutes: 15
order: 215
params:
  - { id: hit, label: "cache hit rate (percent)", min: 0, max: 99, step: 1, init: 80 }
  - { id: rps, label: "requests per second (thousands)", min: 1, max: 50, step: 1, init: 10 }
derived:
  - { id: db, expr: "rps * (100 - hit) / 100" }
  - { id: saved, expr: "rps - db" }
cards:
  - kind: story
    kicker: Start here
    title: "What breaks first"
    body:
      - "One server and one database work until they do not. Scaling is a short list of moves, each fixing a specific bottleneck."
      - "The usual order: **cache** repeated reads, **add servers** behind a load balancer, **queue** slow work, then **split the database**."
    callout: "Name the bottleneck first, then the fix. Never add a tool without saying what it solves."

  - kind: lab
    kicker: See it
    title: "The usual request path"
    intro: "Most reads should never reach the database."
    view:
      type: flow
      stages:
        - { label: "Load balancer", note: "Spreads requests over many app servers.", color: "#38bdf8" }
        - { label: "App servers", note: "Stateless, so you can add more.", color: "#1cd6ac" }
        - { label: "Cache", note: "Fast memory store for popular reads.", color: "#f97316" }
        - { label: "Database", note: "The source of truth. Protect it.", color: "#a78bfa" }

  - kind: lab
    kicker: See it
    title: "What a cache saves"
    intro: "Only cache misses reach the database. **Drag the hit rate.**"
    view:
      type: bars
      max: 50
      items:
        - { label: "requests (thousands per second)", value: rps, color: "#38bdf8" }
        - { label: "reach the database", value: db, color: "#ef4444" }
        - { label: "absorbed by the cache", value: saved, color: "#1cd6ac" }
    sliders: [hit, rps]
    outro: "At {hit} percent hits, the database sees **{db} thousand** requests per second instead of {rps} thousand."

  - kind: code
    kicker: Write it
    title: "A cache with expiry"
    intro: "Read from the cache first. On a miss, read the database and store the result with a time limit."
    lang: python
    code: |
      import time

      class Cache:
          def __init__(self, ttl):
              self.ttl, self.data = ttl, {}
          def get(self, key, load, now=None):
              now = time.time() if now is None else now
              hit = self.data.get(key)
              if hit and now - hit[1] < self.ttl:
                  return hit[0], True
              value = load(key)
              self.data[key] = (value, now)
              return value, False

      c = Cache(ttl=10)
      assert c.get("a", lambda k: 1, now=0) == (1, False)
      assert c.get("a", lambda k: 2, now=5) == (1, True)
      assert c.get("a", lambda k: 2, now=11) == (2, False)
    note: "Expiry limits how stale data can get. Say how stale is acceptable for this feature."

  - kind: check
    kicker: Your turn
    title: "Slow work"
    question: "Sending a welcome email takes 3 seconds and slows signup. What helps?"
    options:
      - { text: "Put the job on a queue and let a worker do it", correct: true, why: "The user gets a fast reply and the slow job runs in the background with retries." }
      - { text: "Add more database indexes", why: "The slow part is not the database." }
      - { text: "Remove the email", why: "That changes the product." }
      - { text: "Cache the signup page", why: "Does not help a write." }

  - kind: check
    kicker: Practice
    title: "Stale data"
    question: "A cache makes a product page show an old price for up to a minute. What do you say?"
    options:
      - { text: "Fine for browsing, but check the price fresh at checkout", correct: true, why: "Match freshness to the stakes: relaxed for display, strict for payment." }
      - { text: "Never use caches", why: "Too strong." }
      - { text: "Cache forever", why: "Prices would never update." }
      - { text: "Ignore it", why: "Staleness is a real trade-off to name." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Scaling the database first.** Cache and queue are cheaper."
      - "**Stateful servers.** Keep sessions in a shared store so any server can answer."
      - "**One big failure point.** Say how each part is replicated."
      - "**No invalidation plan.** Say how a cache gets updated."
    next: { label: "Next: designing an ML system", href: /learn/int-sd-ml-system }
