id: int-llm-prompt-rag-finetune
title: "Interview Q&A: prompting, RAG or fine-tuning?"
minutes: 13
order: 210
params:
  - { id: q, label: "situation", min: 0, max: 3, step: 1, init: 0 }
cards:
  - kind: story
    kicker: Start here
    title: "The question behind most LLM projects"
    body:
      - "'We want the model to answer questions about our company. What would you do?' The right answer is a **decision**, with reasons."
      - "Three tools: **prompting** (give instructions and examples), **RAG** (fetch facts at run time) and **fine-tuning** (change the model's weights)."
    callout: "Order of effort: prompt first, then RAG, then fine-tune. Each step costs more."

  - kind: lab
    kicker: See it
    title: "Pick by situation"
    intro: "Each situation points to a different tool. **Drag the situation.**"
    view:
      type: flow
      stages:
        - { label: "Prompting", note: "Cheapest. Instructions, examples, format rules.", color: "#38bdf8" }
        - { label: "RAG", note: "Fresh or private facts, with sources you can cite.", color: "#1cd6ac" }
        - { label: "Fine-tuning", note: "Style, format or a narrow skill, learned from examples.", color: "#f97316" }
    sliders: [q]
    says:
      - "Situation: a simple task, such as tidy up a summary. **Prompting** is enough."
      - "Situation: answers must use private or changing documents. Use **RAG**. Fine-tuning does not reliably store facts."
      - "Situation: you need a fixed tone or strict output shape at scale, and prompts keep failing. **Fine-tune.**"
      - "Situation: private facts AND a fixed style. Combine **RAG for the facts and a fine-tuned model for the style**."
    saysAt: q

  - kind: code
    kicker: Say it
    title: "A model answer"
    intro: "Question: customers ask about our return policy, which changes monthly."
    lang: text
    code: |
      I would start with prompting plus RAG. The policy changes monthly, so
      it should live in a document store, not in the model weights.
      I would retrieve the relevant policy chunks, put them in the prompt and
      ask the model to answer only from them, with a citation.
      I would add a small test set of real questions to measure accuracy.
      Fine-tuning only becomes useful if the style is still wrong after that.
    note: "Notice the order: simplest tool, a way to measure, then escalate only with evidence."

  - kind: check
    kicker: Your turn
    title: "Teach it facts?"
    question: "A teammate wants to fine-tune a model on the wiki so it 'learns' company facts. What is the main weakness?"
    options:
      - { text: "Facts go stale and the model may still invent details without sources", correct: true, why: "Retrieval keeps facts current and checkable. Weights are a poor database." }
      - { text: "Fine-tuning is impossible", why: "It is possible, just not ideal for facts." }
      - { text: "It makes the model smaller", why: "It does not." }
      - { text: "It removes the need for evaluation", why: "You still need evaluation." }

  - kind: check
    kicker: Practice
    title: "When fine-tune wins"
    question: "Which task is the best fit for fine-tuning?"
    options:
      - { text: "Always reply in a strict JSON shape and brand tone at high volume", correct: true, why: "Consistent format and style is what fine-tuning teaches well, and short prompts cut cost." }
      - { text: "Answer from yesterday's news", why: "Fresh facts need retrieval." }
      - { text: "Look up a user's order status", why: "That is a tool call or database query." }
      - { text: "Summarise a single pasted email", why: "A prompt handles that." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Jumping to fine-tuning.** It is slower to change and needs good data."
      - "**Forgetting evaluation.** Say how you will know it works."
      - "**Mixing up knowledge and behaviour.** RAG adds knowledge. Fine-tuning changes behaviour."
      - "**Ignoring cost and latency.** Long prompts and big models cost money."
    next: { label: "Next: RAG questions", href: /learn/int-rag-qa }
