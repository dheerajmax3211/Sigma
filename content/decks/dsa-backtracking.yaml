id: dsa-backtracking
title: "Backtracking"
minutes: 15
order: 122
params:
  - { id: s, label: "step", min: 0, max: 7, step: 1, init: 0 }
  - { id: n, label: "items n", min: 1, max: 12, step: 1, init: 3 }
derived:
  - { id: subsets, expr: "2 ^ n" }
cards:
  - kind: story
    kicker: Start here
    title: "Try, check, undo"
    body:
      - "Some problems ask for **every** answer: all subsets, all arrangements, all valid boards. You build each answer one choice at a time."
      - "**Backtracking** means: make a choice, explore what follows, then **undo** the choice and try the next one. It is a depth-first walk over a tree of decisions."
    callout: "Clue words: all combinations, all permutations, generate every, place so that no conflict."

  - kind: lab
    kicker: See it
    title: "Subsets of [1, 2]: include or skip"
    intro: "Each level decides one item: include it or skip it. Leaves are finished answers. **Drag the step.**"
    view:
      type: tree
      values: ["[]", "[1]", "[]", "[1,2]", "[1]", "[2]", "[]"]
      order: [0, 1, 3, 4, 2, 5, 6]
      step: s
    sliders: [s]
    says:
      - "Start with nothing chosen."
      - "Decide item 1: **include** it."
      - "Decide item 2: include it. Leaf: the answer is [1, 2]."
      - "**Undo** item 2 and skip it. Leaf: [1]."
      - "Back at the top, **skip** item 1."
      - "Include item 2. Leaf: [2]."
      - "Skip item 2. Leaf: []."
      - "Four leaves, four subsets. Every path was tried once."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "The template"
    intro: "Three beats in every backtracking function: **choose**, **recurse**, **un-choose**. Copy the path when you save an answer."
    lang: python
    code: |
      def subsets(nums):
          out, path = [], []
          def go(i):
              if i == len(nums):
                  out.append(path[:])      # copy, not the live list
                  return
              path.append(nums[i])         # choose
              go(i + 1)                    # explore
              path.pop()                   # un-choose
              go(i + 1)                    # skip it
          go(0)
          return out

      r = subsets([1, 2, 3])
      assert len(r) == 8
      assert [] in r and [1, 2, 3] in r and [2, 3] in r
    note: "Time O(2^n times n). It is exponential. That is unavoidable when you must list all answers."

  - kind: lab
    kicker: What it costs
    title: "Doubling per item"
    intro: "Every extra item doubles the number of subsets. **Drag n.**"
    view:
      type: bars
      max: 4096
      items:
        - { label: "n items", value: n, color: "#38bdf8" }
        - { label: "subsets 2 to the n", value: subsets, color: "#ef4444" }
    sliders: [n]
    outro: "With {n} items there are **{subsets}** subsets. At 30 items it is over a billion, so prune early."

  - kind: code
    kicker: Write it
    title: "Permutations and pruning"
    intro: "Use a `used` set so each item appears once. **Pruning** means stopping a path the moment it cannot work."
    lang: python
    code: |
      def permutations(nums):
          out, path, used = [], [], set()
          def go():
              if len(path) == len(nums):
                  out.append(path[:])
                  return
              for i, x in enumerate(nums):
                  if i in used:
                      continue
                  used.add(i); path.append(x)
                  go()
                  path.pop(); used.remove(i)
          go()
          return out

      def combo_sum(cands, target):
          out, path = [], []
          def go(start, left):
              if left == 0:
                  out.append(path[:]); return
              for i in range(start, len(cands)):
                  if cands[i] > left:
                      break                 # prune: sorted, so the rest is too big
                  path.append(cands[i])
                  go(i, left - cands[i])    # i, not i + 1: reuse allowed
                  path.pop()
          go(0, target)
          return out

      assert len(permutations([1, 2, 3])) == 6
      assert sorted(combo_sum([2, 3, 6, 7], 7)) == [[2, 2, 3], [7]]
    note: "Sort first so you can `break` instead of `continue` when a candidate is too big."

  - kind: check
    kicker: Your turn
    title: "Why copy?"
    question: "Why does the code save `path[:]` and not `path`?"
    options:
      - { text: "`path` keeps changing, so the saved answer would change too", correct: true, why: "Appending the same list object stores a reference. After undoing, every saved answer would be empty." }
      - { text: "It makes the code faster", why: "Copying is slightly slower." }
      - { text: "Python requires a slice", why: "It does not. The copy is for correctness." }
      - { text: "To sort the answer", why: "A slice does not sort." }

  - kind: check
    kicker: Practice
    title: "Can you prune?"
    question: "Finding all combinations that add up to 7 from positive numbers. A path already sums to 9. What do you do?"
    options:
      - { text: "Stop this path now", correct: true, why: "More positive numbers only increase the sum. Nothing below can work." }
      - { text: "Keep adding to be sure", why: "Wasted work with no chance of success." }
      - { text: "Restart from scratch", why: "Just undo one step and try another branch." }
      - { text: "Return the path", why: "It is not a valid answer." }

  - kind: practice
    kicker: Your turn
    title: "All subsets"
    intro: "Write `subsets(nums)` returning every subset of the list, as a list of lists sorted by length then by value. Choose or skip each item."
    entry: subsets
    starter: |
      def subsets(nums):
          pass
    solution: |
      def subsets(nums):
          out = [[]]
          for x in nums:
              out += [s + [x] for s in out]
          return sorted(out, key=lambda s: (len(s), s))
    tests:
      - { input: "[[1,2]]", expected: "[[],[1],[2],[1,2]]" }
      - { input: "[[]]", expected: "[[]]" }
      - { input: "[[1,2,3]]", expected: "[[],[1],[2],[3],[1,2],[1,3],[2,3],[1,2,3]]" }
    hint: "For each item, every existing subset can also grow by that item."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting to undo.** Every `append` needs a matching `pop`."
      - "**Saving the live list.** Always copy before storing."
      - "**Skipping pruning.** A cheap early check can cut millions of paths."
      - "**Using it when one answer is enough.** Counting or optimising usually wants dynamic programming."
    next: { label: "Next: greedy", href: /learn/dsa-greedy }
