id: dsa-bst
title: "Binary search trees"
minutes: 14
order: 114
params:
  - { id: s, label: "step", min: 0, max: 3, step: 1, init: 0 }
  - { id: n, label: "items n", min: 10, max: 1000000, step: 10, init: 100000 }
derived:
  - { id: bal, expr: "ceil(log(n) / log(2))" }
cards:
  - kind: story
    kicker: Start here
    title: "A tree with a sorting rule"
    body:
      - "A **binary search tree** (BST) has one rule at every node: everything in the left subtree is **smaller**, everything in the right subtree is **larger**."
      - "To find a value you start at the root and go left or right, throwing away half the tree each step. It is binary search, but on a tree."
    callout: "Reading a BST left to right (inorder) always gives a sorted list."

  - kind: lab
    kicker: See it
    title: "Search for 6"
    intro: "At each node ask: is my target smaller or larger? Go that way. **Drag the step.**"
    view:
      type: tree
      values: [8, 3, 10, 1, 6, null, 14]
      order: [0, 1, 4]
      step: s
    sliders: [s]
    says:
      - "Start at the root 8. We have not compared yet."
      - "6 is smaller than 8, so go **left** to 3."
      - "6 is bigger than 3, so go **right** to 6."
      - "Found 6 after 3 looks. The whole right side of the tree was never touched."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Search and insert"
    intro: "Both follow the same path. Insert simply stops at an empty spot and puts the new node there."
    lang: python
    code: |
      class Node:
          def __init__(self, val):
              self.val, self.left, self.right = val, None, None

      def insert(root, x):
          if not root:
              return Node(x)
          if x < root.val:
              root.left = insert(root.left, x)
          elif x > root.val:
              root.right = insert(root.right, x)
          return root

      def contains(root, x):
          while root:
              if x == root.val:
                  return True
              root = root.left if x < root.val else root.right
          return False

      def inorder(n):
          return [] if not n else inorder(n.left) + [n.val] + inorder(n.right)

      root = None
      for x in [8, 3, 10, 1, 6, 14]:
          root = insert(root, x)
      assert inorder(root) == [1, 3, 6, 8, 10, 14]
      assert contains(root, 6) and not contains(root, 7)
    note: "O(height) per operation. For a balanced tree that is O(log n)."

  - kind: lab
    kicker: The catch
    title: "Balanced vs lopsided"
    intro: "Insert already sorted data and every node goes right, making a chain. **Drag n.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "lopsided tree: search steps", value: n, color: "#ef4444" }
        - { label: "balanced tree: search steps", value: bal, color: "#1cd6ac" }
    sliders: [n]
    outro: "With {n} nodes a chain may take {n} steps. A balanced tree needs about **{bal}**. Production trees (red-black, AVL) rebalance themselves."

  - kind: code
    kicker: Interview classic
    title: "Is this a valid BST?"
    intro: "Checking only a node against its two children is **not enough**. Every node must fit inside a lower and upper limit inherited from all ancestors."
    lang: python
    code: |
      class Node:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      def valid(n, lo=float("-inf"), hi=float("inf")):
          if not n:
              return True
          if not (lo < n.val < hi):
              return False
          return valid(n.left, lo, n.val) and valid(n.right, n.val, hi)

      good = Node(5, Node(3), Node(8))
      bad = Node(5, Node(3), Node(8, Node(4), None))   # 4 is left of 5's right subtree
      assert valid(good) and valid(None)
      assert not valid(bad)
    note: "`bad` passes the local child check at every node but fails the limits. O(n)."

  - kind: check
    kicker: Your turn
    title: "Why not just check children?"
    question: "In `bad` above, why is 4 wrong even though 4 is less than its parent 8?"
    options:
      - { text: "It sits in the right subtree of 5, so it must be bigger than 5", correct: true, why: "Every ancestor sets a limit, not only the parent." }
      - { text: "4 is an even number", why: "Parity does not matter." }
      - { text: "Left children must be leaves", why: "No such rule." }
      - { text: "Trees cannot hold 4", why: "Any value is fine." }

  - kind: code
    kicker: Use the order
    title: "k-th smallest"
    intro: "Inorder gives sorted order, so the k-th item visited is the k-th smallest. Stop early once you have it."
    lang: python
    code: |
      class Node:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      def kth_smallest(root, k):
          st, cur = [], root
          while cur or st:
              while cur:
                  st.append(cur)
                  cur = cur.left
              cur = st.pop()
              k -= 1
              if k == 0:
                  return cur.val
              cur = cur.right

      t = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      assert [kth_smallest(t, k) for k in range(1, 7)] == [1, 3, 6, 8, 10, 14]
    note: "This is inorder with an explicit stack. Stopping early costs O(height + k)."

  - kind: check
    kicker: Practice
    title: "Which structure?"
    question: "You need fast insert and fast lookup, plus 'give me everything between 10 and 20 in order'. Best fit?"
    options:
      - { text: "A hash map", why: "Fast lookup, but no order." }
      - { text: "A balanced search tree", correct: true, why: "Ordered, so ranges are easy. Everything is O(log n)." }
      - { text: "A queue", why: "No lookup by value." }
      - { text: "A stack", why: "No lookup by value." }

  - kind: practice
    kicker: Your turn
    title: "Is it a BST"
    intro: "A tree is `[value, left, right]` or null. Write `is_bst(t)` that is true when every left value is smaller and every right value is larger, all the way down. Pass down allowed bounds."
    entry: is_bst
    starter: |
      def is_bst(t):
          pass
    solution: |
      def is_bst(t, lo=float('-inf'), hi=float('inf')):
          if t is None:
              return True
          v, l, r = t
          return lo < v < hi and is_bst(l, lo, v) and is_bst(r, v, hi)
    tests:
      - { input: "[[2,[1,null,null],[3,null,null]]]", expected: "true" }
      - { input: "[[5,[1,null,null],[4,[3,null,null],[6,null,null]]]]", expected: "false" }
      - { input: "[null]", expected: "true" }
    hint: "Each node must sit between a low bound and a high bound inherited from its ancestors."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Checking only parent and child.** Pass lower and upper limits down."
      - "**Duplicates.** Decide the rule first: skip, count, or always go right."
      - "**Believing a BST is always fast.** Sorted insertions give a chain with O(n) steps."
      - "**Deleting a node with two children.** Replace it with the next larger value, then delete that one."
    next: { label: "Next: heaps and priority queues", href: /learn/dsa-heaps-and-priority-queues }
