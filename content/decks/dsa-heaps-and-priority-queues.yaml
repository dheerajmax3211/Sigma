id: dsa-heaps-and-priority-queues
title: "Heaps and priority queues"
minutes: 15
order: 115
params:
  - { id: s, label: "step", min: 0, max: 2, step: 1, init: 0 }
  - { id: n, label: "items n", min: 10, max: 100000, step: 10, init: 50000 }
  - { id: k, label: "top k", min: 1, max: 100, step: 1, init: 10 }
derived:
  - { id: logk, expr: "ceil(log(k + 1) / log(2))" }
  - { id: logn, expr: "ceil(log(n) / log(2))" }
cards:
  - kind: story
    kicker: Start here
    title: "A queue where the most urgent goes first"
    body:
      - "A **priority queue** hands you the smallest (or largest) item every time, no matter when it arrived. Think of an emergency room, not a shop line."
      - "A **heap** is the structure that makes this fast: finding the smallest is O(1), and adding or removing is O(log n)."
    callout: "Clue words: top k, k-th largest, always the smallest, schedule by priority, running median."

  - kind: lab
    kicker: See it
    title: "A heap is a tree stored in a list"
    intro: "In a **min-heap** every parent is smaller than its children, so the smallest sits at the root. Children of index i live at 2i+1 and 2i+2."
    view:
      type: tree
      values: [1, 3, 2, 7, 4, 5]
      order: [0]
      step: "1"
      note: "Index 0 is 1, its children are indexes 1 and 2 (3 and 2). Index 1's children are indexes 3 and 4 (7 and 4)."
    sliders: []
    outro: "No pointers needed: the position in the list tells you who is whose child. Parent of index i is (i - 1) // 2."

  - kind: lab
    kicker: See it
    title: "Insert: add at the end, then bubble up"
    intro: "Insert 0 into the heap. Put it at the end, then swap it with its parent while it is smaller. **Drag the step.**"
    view:
      type: array
      cells: [2, 4, 3, 7, 5, 0]
      frames:
        - [2, 4, 3, 7, 5, 0]
        - [2, 4, 0, 7, 5, 3]
        - [0, 4, 2, 7, 5, 3]
      frame: s
      pointers:
        - { label: "new", at: "pick(s, 5, 2, 0)", color: "#1cd6ac" }
    sliders: [s]
    says:
      - "0 is added at the end, index 5. Its parent is index 2, which holds 3. 0 is smaller, so swap."
      - "0 is now at index 2. Its parent is index 0, which holds 2. 0 is smaller, so swap again."
      - "0 reached the root. The smallest value is at the top. At most log n swaps."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Python's heapq"
    intro: "`heapq` keeps a plain list as a min-heap. For a max-heap, push negated values."
    lang: python
    code: |
      import heapq

      h = []
      for x in [5, 3, 8, 1, 9]:
          heapq.heappush(h, x)
      assert h[0] == 1                      # peek the smallest
      assert heapq.heappop(h) == 1
      assert heapq.heappop(h) == 3

      mx = []
      for x in [5, 3, 8]:
          heapq.heappush(mx, -x)            # negate for max-heap
      assert -heapq.heappop(mx) == 8

      pairs = []
      heapq.heappush(pairs, (2, "write"))   # tuples compare by first item
      heapq.heappush(pairs, (1, "plan"))
      assert heapq.heappop(pairs) == (1, "plan")
    note: "heappush and heappop are O(log n). `heapq.heapify(list)` builds a heap in O(n)."

  - kind: lab
    kicker: What it saves
    title: "Top k of n items"
    intro: "Sorting everything costs n log n. A heap of size k only touches log k per item. **Drag n and k.**"
    view:
      type: bars
      max: 20
      items:
        - { label: "sort all: log n per item", value: logn, color: "#ef4444" }
        - { label: "heap of size k: log k per item", value: logk, color: "#1cd6ac" }
    sliders: [n, k]
    outro: "With n = {n} and k = {k}, each item costs about {logn} steps with a full sort and about **{logk}** with a small heap."

  - kind: code
    kicker: Write it
    title: "K-th largest, and merge sorted lists"
    intro: "Keep a min-heap of size k: its root is the k-th largest. To merge sorted lists, always take the smallest front item."
    lang: python
    code: |
      import heapq

      def kth_largest(a, k):
          h = []
          for x in a:
              heapq.heappush(h, x)
              if len(h) > k:
                  heapq.heappop(h)          # drop the smallest
          return h[0]

      def merge_sorted(lists):
          h = [(l[0], i, 0) for i, l in enumerate(lists) if l]
          heapq.heapify(h)
          out = []
          while h:
              v, i, j = heapq.heappop(h)
              out.append(v)
              if j + 1 < len(lists[i]):
                  heapq.heappush(h, (lists[i][j + 1], i, j + 1))
          return out

      assert kth_largest([3, 2, 1, 5, 6, 4], 2) == 5
      assert merge_sorted([[1, 4, 7], [2, 5], [3, 6, 9]]) == [1, 2, 3, 4, 5, 6, 7, 9]
    note: "kth_largest is O(n log k) time and O(k) space. Merge is O(N log m) for N items and m lists."

  - kind: check
    kicker: Your turn
    title: "Which heap?"
    question: "To keep the **3 largest** numbers seen so far in a stream, what do you keep?"
    options:
      - { text: "A min-heap of size 3", correct: true, why: "Its root is the smallest of your top 3. A bigger number replaces it." }
      - { text: "A max-heap of size 3", why: "You could not cheaply drop the smallest of the 3." }
      - { text: "A sorted list of everything", why: "Memory grows forever." }
      - { text: "A set", why: "A set has no order." }

  - kind: code
    kicker: Two heaps
    title: "Running median"
    intro: "Keep the smaller half in a max-heap and the larger half in a min-heap. The median sits at one or both tops."
    lang: python
    code: |
      import heapq

      class Median:
          def __init__(self):
              self.lo, self.hi = [], []          # lo is a max-heap (negated)

          def add(self, x):
              heapq.heappush(self.lo, -x)
              heapq.heappush(self.hi, -heapq.heappop(self.lo))
              if len(self.hi) > len(self.lo):
                  heapq.heappush(self.lo, -heapq.heappop(self.hi))

          def median(self):
              if len(self.lo) > len(self.hi):
                  return -self.lo[0]
              return (-self.lo[0] + self.hi[0]) / 2

      m = Median()
      for x in [5, 2, 8]:
          m.add(x)
      assert m.median() == 5
      m.add(1)
      assert m.median() == 3.5
    note: "Each add is O(log n), each median is O(1). Sorting again every time would be O(n log n) per query."

  - kind: practice
    kicker: Your turn
    title: "K largest"
    intro: "Write `k_largest(nums, k)` returning the k biggest numbers, largest first. Use the `heapq` module."
    entry: k_largest
    starter: |
      def k_largest(nums, k):
          pass
    solution: |
      def k_largest(nums, k):
          import heapq
          return heapq.nlargest(k, nums)
    tests:
      - { input: "[[3,2,1,5,6,4],2]", expected: "[6,5]" }
      - { input: "[[1],1]", expected: "[1]" }
      - { input: "[[5,5,4],3]", expected: "[5,5,4]" }
    hint: "`heapq.nlargest` does it, or keep a min-heap of size k."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Expecting a sorted list.** A heap list is only partly ordered. Only the root is guaranteed."
      - "**Forgetting Python's heap is a min-heap.** Negate for a max-heap."
      - "**Using a heap when sorting is enough.** If you need everything in order, just sort."
      - "**Searching a heap for a value.** That is O(n). Heaps are for the extremes."
    next: { label: "Next: tries", href: /learn/dsa-tries }
