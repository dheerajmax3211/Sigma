id: dsa-topological-sort
title: "Topological sort"
minutes: 13
order: 120
params:
  - { id: s, label: "step", min: 0, max: 5, step: 1, init: 0 }
cards:
  - kind: story
    kicker: Start here
    title: "Getting dressed in the right order"
    body:
      - "Socks before shoes. Compile before test. Take algebra before calculus. Some tasks depend on others, and you must do them in an order that respects every dependency."
      - "A **topological sort** lists the nodes of a directed graph so that every edge points forward. It exists only when there are **no cycles**."
    callout: "Clue words: prerequisites, build order, dependencies, schedule tasks, 'before'."

  - kind: lab
    kicker: See it
    title: "Peel off nodes that have no waiting prerequisites"
    intro: "Count each node's **in-degree**: how many arrows point at it. A node with in-degree 0 is ready. Take it, then remove its arrows. **Drag the step.**"
    view:
      type: graph
      directed: true
      nodes:
        - { id: A, x: 10, y: 20 }
        - { id: B, x: 10, y: 80 }
        - { id: C, x: 45, y: 50 }
        - { id: E, x: 65, y: 85 }
        - { id: D, x: 90, y: 50 }
      edges:
        - { a: A, b: C }
        - { a: B, b: C }
        - { a: B, b: E }
        - { a: C, b: D }
        - { a: E, b: D }
      order:
        - { node: A, label: 1 }
        - { node: B, label: 2 }
        - { node: C, from: B, label: 3 }
        - { node: E, from: B, label: 4 }
        - { node: D, from: E, label: 5 }
      step: s
    sliders: [s]
    says:
      - "In-degrees: A 0, B 0, C 2, E 1, D 2. A and B are ready."
      - "Take A. C loses one waiting arrow (now 1)."
      - "Take B. C drops to 0 and E drops to 0, so both are ready."
      - "Take C. D drops to 1."
      - "Take E. D drops to 0."
      - "Take D. Order: A, B, C, E, D. Every arrow points forward."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Kahn's algorithm"
    intro: "Keep a queue of nodes with in-degree 0. If you finish with fewer nodes than the graph has, a cycle blocked the rest."
    lang: python
    code: |
      from collections import deque

      def topo(n, edges):
          g = [[] for _ in range(n)]
          indeg = [0] * n
          for a, b in edges:
              g[a].append(b)
              indeg[b] += 1
          q = deque(i for i in range(n) if indeg[i] == 0)
          order = []
          while q:
              u = q.popleft()
              order.append(u)
              for v in g[u]:
                  indeg[v] -= 1
                  if indeg[v] == 0:
                      q.append(v)
          return order if len(order) == n else []     # [] means a cycle

      # 0=A 1=B 2=C 3=D 4=E
      edges = [(0, 2), (1, 2), (1, 4), (2, 3), (4, 3)]
      o = topo(5, edges)
      assert len(o) == 5 and all(o.index(a) < o.index(b) for a, b in edges)
      assert topo(2, [(0, 1), (1, 0)]) == []
    note: "O(V + E). Several valid orders may exist. Tests should check the rule, not one exact list."

  - kind: check
    kicker: Your turn
    title: "Is it possible?"
    question: "Courses: A needs B, B needs C, C needs A. Can you finish all of them?"
    options:
      - { text: "No, there is a cycle", correct: true, why: "None can start first. The topological sort comes back with fewer nodes than courses." }
      - { text: "Yes, take A first", why: "A needs B first." }
      - { text: "Yes, in alphabetical order", why: "Order cannot break a loop." }
      - { text: "Only with sorting", why: "Sorting does not remove dependencies." }

  - kind: code
    kicker: Write it
    title: "Course schedule with DFS"
    intro: "Three states per node: not started, on the current path, finished. Meeting a node on the current path means a cycle."
    lang: python
    code: |
      def can_finish(n, prereqs):
          g = [[] for _ in range(n)]
          for a, b in prereqs:              # b before a
              g[b].append(a)
          state = [0] * n                   # 0 new, 1 visiting, 2 done
          def dfs(u):
              if state[u] == 1:
                  return False              # back to the current path
              if state[u] == 2:
                  return True
              state[u] = 1
              ok = all(dfs(v) for v in g[u])
              state[u] = 2
              return ok
          return all(dfs(i) for i in range(n))

      assert can_finish(2, [[1, 0]])
      assert not can_finish(2, [[1, 0], [0, 1]])
      assert can_finish(3, [])
    note: "Reverse the order nodes finish and you also get a topological order."

  - kind: check
    kicker: Practice
    title: "Build systems"
    question: "A build tool must compile files so that each file's imports are built first. Which idea is it using?"
    options:
      - { text: "Topological sort of the import graph", correct: true, why: "Edges point from a file to what depends on it, and the order respects them." }
      - { text: "Binary search", why: "No sorted data." }
      - { text: "Dijkstra", why: "No costs to minimise." }
      - { text: "A stack of files", why: "Order comes from dependencies, not from last-in." }

  - kind: practice
    kicker: Your turn
    title: "Can you finish"
    intro: "Courses `0..n-1`; each pair `[a, b]` means b must come before a. Write `can_finish(n, pairs)` that is true when no cycle blocks you. Count in-degrees and peel off nodes with none."
    entry: can_finish
    starter: |
      def can_finish(n, pairs):
          pass
    solution: |
      def can_finish(n, pairs):
          from collections import deque
          g = [[] for _ in range(n)]
          deg = [0] * n
          for a, b in pairs:
              g[b].append(a); deg[a] += 1
          q = deque(i for i in range(n) if deg[i] == 0)
          done = 0
          while q:
              u = q.popleft(); done += 1
              for v in g[u]:
                  deg[v] -= 1
                  if deg[v] == 0:
                      q.append(v)
          return done == n
    tests:
      - { input: "[2,[[1,0]]]", expected: "true" }
      - { input: "[2,[[1,0],[0,1]]]", expected: "false" }
      - { input: "[3,[]]", expected: "true" }
    hint: "If you cannot remove every node, there is a cycle."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Wrong edge direction.** Say out loud 'edge a to b means a comes before b'."
      - "**Ignoring cycles.** Check that the output has all n nodes."
      - "**Expecting a unique answer.** Many valid orders can exist."
      - "**Undirected graphs.** Topological order only makes sense for directed edges."
    next: { label: "Next: union-find", href: /learn/dsa-union-find }
