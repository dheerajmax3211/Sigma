id: "dist-pipeline-parallel"
title: "Pipeline parallelism and the bubble"
minutes: 14
order: 804
params:
  - { id: "p", label: "pipeline stages (GPUs)", min: 1, max: 16, step: 1, init: 4 }
  - { id: "m", label: "micro-batches per step", min: 1, max: 64, step: 1, init: 8 }
derived:
  - { id: "bub", expr: "100 * (p - 1) / (m + p - 1)" }
  - { id: "use", expr: "100 - bub" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Assembly line for layers"
    body:
      - "**Pipeline parallelism** gives each GPU a block of consecutive layers. A batch flows through the stages like cars on an assembly line."
      - "If you send one big batch, only one stage works at a time. So split the batch into **micro-batches** and keep several in flight. The idle time at the start and end is the **bubble**."
    callout: "More micro-batches shrink the bubble."
  - kind: "lab"
    kicker: "See it"
    title: "How big is the bubble"
    intro: "The idle share is the stages minus one, over micro-batches plus stages minus one. **Drag both.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "time doing useful work (percent)", value: "use", color: "#1cd6ac" }
        - { label: "time idle in the bubble (percent)", value: "bub", color: "#ef4444" }
    sliders:
      - "p"
      - "m"
    outro: "With {p} stages and {m} micro-batches, **{bub} percent** of the time is idle. Rule of thumb: use several times more micro-batches than stages."
  - kind: "code"
    kicker: "Write it"
    title: "Bubble formula and a schedule"
    intro: "Count the time slots a forward-only pipeline needs."
    lang: "python"
    code: |
      def bubble(p, m):
          return (p - 1) / (m + p - 1)

      def slots(p, m):
          return m + p - 1              # last micro-batch leaves the last stage here

      assert slots(4, 8) == 11
      assert abs(bubble(4, 8) - 3 / 11) < 1e-12
      assert bubble(4, 1) == 0.75       # one big batch: three quarters idle
      assert bubble(4, 64) < bubble(4, 8) < bubble(4, 1)
      assert bubble(1, 10) == 0         # one stage has no bubble
    note: "The price of more micro-batches is more activation memory held at once."
  - kind: "lab"
    kicker: "Memorise"
    title: "Mixing the three"
    intro: "Large training runs combine all of them."
    view:
      type: "flow"
      stages:
        - { label: "Tensor", note: "Inside a node, splits layers.", color: "#38bdf8" }
        - { label: "Pipeline", note: "Across nodes, splits depth.", color: "#1cd6ac" }
        - { label: "Data", note: "Outside, copies the whole arrangement.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Bubble"
    question: "What shrinks the pipeline bubble?"
    options:
      - { text: "More micro-batches", correct: true, why: "The line stays full longer." }
      - { text: "Fewer micro-batches", why: "That grows it." }
      - { text: "A slower network", why: "No." }
      - { text: "Smaller layers", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Why pipeline"
    question: "When is pipeline parallelism a good choice?"
    options:
      - { text: "The model is too deep for one node and links between nodes are slow", correct: true, why: "It sends less data than tensor parallel." }
      - { text: "The model is tiny", why: "Use data parallel." }
      - { text: "You have one GPU", why: "No pipeline." }
      - { text: "You want no idle time", why: "A bubble remains." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Unbalanced stages.** The slowest stage sets the speed."
      - "**Too few micro-batches.** Idle GPUs."
      - "**Forgetting activation memory.** It grows with micro-batches in flight."
    next: { label: "Next: sequence and expert parallelism", href: "/learn/dist-sequence-expert" }
