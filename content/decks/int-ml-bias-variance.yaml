id: int-ml-bias-variance
title: "Interview Q&A: bias, variance and overfitting"
minutes: 14
order: 205
params:
  - { id: c, label: "model complexity", min: 0.5, max: 8, step: 0.1, init: 1 }
cards:
  - kind: story
    kicker: Start here
    title: "The most asked ML question"
    body:
      - "'Explain the bias-variance trade-off.' Interviewers use it to see whether you understand **why** models fail, not only how to train them."
      - "**Bias** is error from a model too simple to capture the pattern. **Variance** is error from a model so flexible it memorises noise in the training data."
    callout: "One-line answer: simple models underfit (high bias), complex models overfit (high variance). You want the middle."

  - kind: lab
    kicker: See it
    title: "Test error as the model grows"
    intro: "The dot is the test error at this complexity. Move left and the model is too simple. Move right and it overfits. **Drag the complexity.**"
    view:
      type: curve
      fn: "4 / t + 0.12 * t * t"
      min: 0.5
      max: 8
      point: c
      yMin: 0
      yMax: 9
      xLabel: "complexity"
      yLabel: "test error"
    sliders: [c]
    says:
      - "Too simple. The model misses the pattern even on training data. That is **high bias**, or underfitting."
      - "Near the bottom. Enough flexibility to learn the pattern, not enough to memorise noise."
      - "Training error keeps falling but test error rises. **Variance** is starting to dominate."
      - "Overfit. The model memorised the training set and fails on new data."
    saysAt: "floor(c / 2.2)"

  - kind: code
    kicker: Say it
    title: "A strong spoken answer"
    intro: "Aim for 30 seconds, then offer an example. This structure works for most concept questions."
    lang: text
    code: |
      Define: Error has a bias part and a variance part. Bias is error from
      overly simple assumptions. Variance is sensitivity to the particular
      training sample.
      Trade-off: more complexity lowers bias but raises variance.
      Diagnose: high training error means bias. A big gap between training and
      validation error means variance.
      Fix: for bias, use a richer model or better features. For variance, get
      more data, regularise, simplify or stop early.
    note: "Interviewers love the diagnose step. It shows you can act, not only define."

  - kind: lab
    kicker: Fix it
    title: "Diagnose from two numbers"
    intro: "Training error and validation error tell you which problem you have."
    view:
      type: flow
      stages:
        - { label: "Both high", note: "Underfitting. Add features, a bigger model or train longer.", color: "#ef4444" }
        - { label: "Train low, val high", note: "Overfitting. More data, regularise, dropout, early stop.", color: "#f97316" }
        - { label: "Both low, close", note: "A good fit. Check on a held-out test set.", color: "#1cd6ac" }

  - kind: check
    kicker: Your turn
    title: "Read the numbers"
    question: "Training accuracy is 99 percent and validation accuracy is 71 percent. What is the likely problem?"
    options:
      - { text: "Overfitting (high variance)", correct: true, why: "A large gap between training and validation means the model memorised training data." }
      - { text: "Underfitting", why: "Underfit models score badly on training data too." }
      - { text: "Too little training time", why: "Training score is already very high." }
      - { text: "A perfect model", why: "A 28 point gap is a warning, not success." }

  - kind: check
    kicker: Practice
    title: "Which fix?"
    question: "A model overfits. Which change is LEAST likely to help?"
    options:
      - { text: "Make the model bigger", correct: true, why: "More capacity makes memorisation easier." }
      - { text: "Add more training data", why: "It helps the model generalise." }
      - { text: "Add weight decay or dropout", why: "Both reduce effective complexity." }
      - { text: "Stop training earlier", why: "Early stopping limits overfitting." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Only defining the terms.** Always add how to diagnose and fix."
      - "**Mixing up the directions.** Underfit is high bias. Overfit is high variance."
      - "**Judging by training score.** Only held-out data tells the truth."
      - "**Forgetting data quality.** Sometimes the fix is cleaner labels, not a new model."
    next: { label: "Next: metrics questions", href: /learn/int-ml-metrics }
