id: "vis-diffusion-forward"
title: "Diffusion: destroying a picture with noise"
minutes: 14
order: 906
params:
  - { id: "t", label: "noising step out of 1000", min: 0, max: 1000, step: 50, init: 300 }
derived:
  - { id: "ab", expr: "exp(0 - 5 * t / 1000)" }
  - { id: "sig", expr: "100 * sqrt(ab)" }
  - { id: "noi", expr: "100 * sqrt(1 - ab)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "First learn to ruin things"
    body:
      - "A **diffusion model** is trained by corrupting real images with a little noise, many times, until nothing but noise remains. A network then learns to undo each small step."
      - "One step of the ruin process has a closed form. Mix the clean image with fresh noise: keep a fraction of the signal and add the rest as noise. The fractions come from a schedule."
    callout: "Generation is the ruin process run backwards."
  - kind: "lab"
    kicker: "See it"
    title: "Signal against noise"
    intro: "At step 0 the image is clean. By the end it is almost pure noise. **Drag the step.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "how much of the picture remains", value: "sig", color: "#1cd6ac" }
        - { label: "how much noise has been added", value: "noi", color: "#ef4444" }
    sliders:
      - "t"
    outro: "At step {t}, signal is **{sig}** and noise **{noi}** on a scale of 100. The mix is chosen so the total variance stays constant."
  - kind: "code"
    kicker: "Write it"
    title: "The noising formula"
    intro: "Closed form, and recoverable if you know the noise."
    lang: "python"
    code: |
      import math

      def noisy(x0, eps, ab):
          return math.sqrt(ab) * x0 + math.sqrt(1 - ab) * eps

      x0, eps = 2.0, 1.0
      assert noisy(x0, eps, 1.0) == x0              # no noise yet
      assert noisy(x0, eps, 0.0) == eps             # pure noise

      ab = 0.25
      xt = noisy(x0, eps, ab)
      assert abs(xt - 1.8660254) < 1e-6
      recovered = (xt - math.sqrt(1 - ab) * eps) / math.sqrt(ab)
      assert abs(recovered - x0) < 1e-12
    note: "If the noise is known, the clean image is exactly recoverable. So the network only has to predict the noise."
  - kind: "lab"
    kicker: "Memorise"
    title: "Training data for free"
    intro: "How one training example is made."
    view:
      type: "flow"
      stages:
        - { label: "Pick an image", note: "A real one from the dataset.", color: "#38bdf8" }
        - { label: "Pick a step", note: "Random, from clean to noisy.", color: "#1cd6ac" }
        - { label: "Add noise", note: "Using the formula above.", color: "#f97316" }
        - { label: "Ask the network", note: "What noise was added?", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Variance"
    question: "Why mix signal and noise as square roots of the fractions?"
    options:
      - { text: "It keeps the overall variance steady", correct: true, why: "The two shares add up to one." }
      - { text: "To make images brighter", why: "No." }
      - { text: "It is random", why: "It is derived." }
      - { text: "To save memory", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Free labels"
    question: "Where do the training targets come from?"
    options:
      - { text: "From the noise we added ourselves", correct: true, why: "We know it exactly." }
      - { text: "From human labels", why: "No labels are needed." }
      - { text: "From a second model", why: "No." }
      - { text: "From the test set", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Confusing the step with the amount of noise.** The schedule links them."
      - "**A schedule that ends with leftover signal.** The start of sampling then differs."
      - "**Forgetting images need scaling.** Use a standard range."
    next: { label: "Next: learning to denoise", href: "/learn/vis-diffusion-training" }
