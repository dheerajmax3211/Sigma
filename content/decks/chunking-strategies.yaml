id: chunking-strategies
title: Chunking strategies
order: 30
minutes: 9
params:
  - { id: words, label: "document words", min: 2000, max: 10000, step: 500, init: 5000 }
  - { id: size, label: "chunk size", min: 150, max: 800, step: 50, init: 300 }
  - { id: overlap, label: "overlap", min: 0, max: 100, step: 10, init: 50 }
derived:
  - { id: chunks, expr: "ceil((words - overlap) / (size - overlap))" }
  - { id: dup, expr: "100 * overlap / size" }
  - { id: sz, expr: "size / 8" }
  - { id: plain, expr: "ceil(words / size)" }
cards:
  - kind: story
    kicker: Start here
    title: A model cannot read the whole library
    body:
      - "A search system cannot hand a 5,000-word manual to the model for every question. So we cut documents into pieces called **chunks** and search the pieces."
      - "The cut is a real decision. Pieces that are too big blur their meaning. Pieces that are too small lose the context around them."
    callout: "Cut so each chunk makes sense alone."

  - kind: lab
    kicker: See it first
    title: Size and overlap
    intro: "Each chunk starts a little **before** the previous one ended. That shared stretch is the **overlap**, and it protects a sentence cut at the edge. **Drag the sliders.**"
    view:
      type: bars
      max: 80
      items:
        - { label: "chunks with this overlap", value: chunks, color: "#38bdf8" }
        - { label: "chunks with no overlap", value: plain, color: "#64748b" }
    also:
      type: bars
      max: 100
      items:
        - { label: "duplicate text (%)", value: dup, color: "#f59e0b" }
        - { label: "chunk size (% of 800)", value: sz, color: "#a78bfa" }
    sliders: [words, size, overlap]
    outro: "{words} words cut into pieces of {size} with {overlap} shared gives **{chunks} chunks**, of which **{dup} percent** is repeated text."

  - kind: formula
    kicker: Read the formula
    title: How many chunks
    tex: "N = \\left\\lceil \\frac{W - o}{s - o} \\right\\rceil"
    say: "Each new chunk moves forward by the size minus the overlap. Divide the words left after the first overlap by that step, then round up."
    verify:
      - { expr: "chunks", equals: 20, tol: 0.01 }
      - { expr: "ceil((5000 - 50) / (300 - 50))", equals: 20, tol: 0.01 }
      - { expr: "(5000 - 50) / (300 - 50)", equals: 19.8, tol: 0.01 }
    symbols:
      - { tex: "N", means: "how many chunks you end up with", value: chunks }
      - { tex: "W", means: "words in the whole document", value: words }
      - { tex: "s", means: "chunk size in words", value: size }
      - { tex: "o", means: "overlap: words shared with the previous chunk", value: overlap }
      - { tex: "\\lceil \\cdot \\rceil", means: "round up to the next whole number, since a half chunk is still a chunk" }

  - kind: check
    kicker: Check yourself
    title: Count by hand
    question: "A document has 1,000 words. Chunks are 200 words with no overlap. How many chunks?"
    options:
      - { text: "5", correct: true, why: "With no overlap each chunk moves forward 200 words, and 1,000 / 200 = 5." }
      - { text: "6", why: "That would need an overlap. With none, the pieces fit exactly." }
      - { text: "200", why: "That is the chunk size, not the count." }

  - kind: code
    kicker: Read it
    title: A chunker in six lines
    intro: "Walk through the words with a step of **size minus overlap**, and slice a window at each stop."
    lang: python
    code: |
      def chunk(words, size=300, overlap=50):
          step = size - overlap
          stop = max(len(words) - overlap, 1)   # no tiny tail chunk
          return [" ".join(words[i:i + size])
                  for i in range(0, stop, step)]

      pieces = chunk(text.split())
    note: "Real systems often split on headings and paragraphs first, then by size only when a section is too long."

  - kind: story
    kicker: Better cuts
    title: Split on structure first
    body:
      - "A heading, a paragraph or a code function is a natural unit of meaning. Cutting at those boundaries keeps ideas whole."
      - "Fall back to size only for sections that are still too long. Then add a little overlap as a safety net."
    callout: "Structure first, size second."

  - kind: check
    kicker: Check yourself
    title: Why overlap
    question: "Why do chunks usually share a few words with their neighbour?"
    options:
      - { text: "A sentence cut at the edge still appears whole in one chunk", correct: true, why: "Overlap guards against an idea being split across two chunks." }
      - { text: "It makes the search faster", why: "Overlap adds more text to store, so it never speeds things up." }
      - { text: "It lowers the storage cost", why: "Repeated text costs more storage, not less." }

  - kind: practice
    kicker: Your turn
    title: "Overlapping chunks"
    intro: "Write `chunks(words, size, overlap)` returning lists of `size` words where each chunk starts `size - overlap` words after the last. Stop once a chunk reaches the end."
    entry: chunks
    starter: |
      def chunks(words, size, overlap):
          pass
    solution: |
      def chunks(words, size, overlap):
          step = size - overlap
          out = []
          for i in range(0, len(words), step):
              out.append(words[i:i + size])
              if i + size >= len(words):
                  break
          return out
    tests:
      - { input: "[[\"a\", \"b\", \"c\", \"d\", \"e\"], 3, 1]", expected: "[[\"a\", \"b\", \"c\"], [\"c\", \"d\", \"e\"]]" }
      - { input: "[[\"a\", \"b\"], 5, 1]", expected: "[[\"a\", \"b\"]]" }
      - { input: "[[\"a\", \"b\", \"c\", \"d\"], 2, 0]", expected: "[[\"a\", \"b\"], [\"c\", \"d\"]]" }
    hint: "The overlap lets a sentence cut at one edge appear whole in the next chunk."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**One size for everything.** A legal contract and a chat log need different cuts."
      - "**Huge overlap.** Over a third repeated text wastes storage and returns near-duplicate hits."
      - "**Never testing it.** Try two sizes on real questions and compare the results."
    next: { label: "Next: vector search and indexes", href: /learn/vector-search-and-indexes }
