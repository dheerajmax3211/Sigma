id: fastapi-backend
title: "A Python backend with FastAPI"
order: 27
minutes: 20
params:
  - { id: workers, label: "workers", min: 1, max: 16, step: 1, init: 4 }
  - { id: ms, label: "milliseconds per request", min: 10, max: 500, step: 10, init: 100 }
derived:
  - { id: rps, expr: "workers * 1000 / ms" }
cards:
  - kind: story
    kicker: Lesson
    title: "The server behind the app"
    body:
      - "Your front end needs something to talk to. A **backend** is a program that listens for HTTP requests and sends back JSON."
      - "FastAPI is a small Python framework for it. You will build the two jobs every route does: **match a path** and **validate the body**."

  - kind: lab
    kicker: See it first
    title: "How many requests a second"
    intro: "Each worker handles one request at a time. **Drag the sliders** to see the ceiling."
    view:
      type: bars
      max: 1600
      items:
        - { label: "requests per second", value: rps, color: "#1cd6ac" }
        - { label: "one worker alone", value: "1000 / ms", color: "#64748b" }
    sliders: [workers, ms]
    outro: "{workers} workers at {ms} ms each handle about **{rps}** requests a second. Slow work, like a model call, should be moved out of the request path."

  - kind: code
    kicker: In code
    title: "A whole API"
    intro: "This is a complete FastAPI app. Run it with `uvicorn main:app`. The type hints on the model are what validate each request."
    lang: python
    code: |
      from fastapi import FastAPI
      from pydantic import BaseModel

      app = FastAPI()

      class Ask(BaseModel):
          question: str

      @app.post('/ask')
      def ask(body: Ask):
          return {'answer': body.question.upper()}
    note: "A wrong body gets a 422 reply before your function runs."

  - kind: practice
    kicker: Your turn
    title: "Match a route"
    intro: "A route pattern can hold placeholders in curly braces, such as id in the path items then id. Write `match(pattern, path)` returning a dict from each placeholder name to its text, or `null` if the path does not fit. Both are split on `/`."
    entry: match
    starter: |
      def match(pattern, path):
          pass
    solution: |
      def match(pattern, path):
          a, b = pattern.strip('/').split('/'), path.strip('/').split('/')
          if len(a) != len(b):
              return None
          out = {}
          for p, x in zip(a, b):
              if p.startswith('{') and p.endswith('}'):
                  out[p[1:-1]] = x
              elif p != x:
                  return None
          return out
    tests:
      - { input: "[\"/items/{id}\", \"/items/42\"]", expected: "{\"id\": \"42\"}" }
      - { input: "[\"/users/{u}/posts/{p}\", \"/users/a/posts/9\"]", expected: "{\"u\": \"a\", \"p\": \"9\"}" }
      - { input: "[\"/items/{id}\", \"/other/42\"]", expected: "null" }
      - { input: "[\"/a\", \"/a/b\"]", expected: "null" }
    hint: "Compare piece by piece. Curly braces mean take whatever is there."

  - kind: practice
    kicker: Your turn
    title: "Validate a body"
    intro: "Write `errors(body, required)` where `required` maps a field name to a type name, either `str` or `int`. Return a sorted list of messages: `missing NAME` if absent, or `bad NAME` if the type is wrong."
    entry: errors
    starter: |
      def errors(body, required):
          pass
    solution: |
      def errors(body, required):
          out = []
          for k, t in required.items():
              if k not in body:
                  out.append('missing ' + k)
              elif t == 'int' and (isinstance(body[k], bool) or not isinstance(body[k], int)):
                  out.append('bad ' + k)
              elif t == 'str' and not isinstance(body[k], str):
                  out.append('bad ' + k)
          return sorted(out)
    tests:
      - { input: "[{\"q\": \"hi\"}, {\"q\": \"str\"}]", expected: "[]" }
      - { input: "[{}, {\"q\": \"str\", \"n\": \"int\"}]", expected: "[\"missing n\", \"missing q\"]" }
      - { input: "[{\"n\": \"3\"}, {\"n\": \"int\"}]", expected: "[\"bad n\"]" }
    hint: "Check presence first, then the type."

  - kind: check
    kicker: Check yourself
    title: "A slow model call"
    question: "A route calls a model that takes 8 seconds. What helps most?"
    options:
      - { text: "Stream the answer or run it in the background", correct: true, why: "The caller sees progress and the worker is freed." }
      - { text: "Add more workers only", why: "Each request still blocks a worker for 8 seconds." }
      - { text: "Make the timeout longer", why: "It hides the problem." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Trusting the body.** Validate every field."
      - "**Blocking work in the route.** Move long jobs to a queue."
      - "**Returning secrets in errors.** Send a plain message."
    next: { label: "Back to all lessons", href: "/learn" }
