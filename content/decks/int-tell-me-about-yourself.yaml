id: int-tell-me-about-yourself
title: "Tell me about yourself"
minutes: 10
order: 203
params:
  - { id: sec, label: "seconds", min: 60, max: 120, step: 10, init: 90 }
derived:
  - { id: now, expr: "round(sec * 0.35)" }
  - { id: past, expr: "round(sec * 0.4)" }
  - { id: next, expr: "round(sec * 0.25)" }
cards:
  - kind: story
    kicker: Start here
    title: "The question you will always get"
    body:
      - "Almost every interview opens with it. It is not an invitation to recite your life. It is a chance to **frame** the rest of the conversation."
      - "Use **present, past, future**: what you do now, how you got here, and why this role is the next step."
    callout: "Keep it to about 90 seconds. Practise it until it sounds like talking, not reading."

  - kind: lab
    kicker: See it
    title: "Present, past, future"
    intro: "Spend a little more on the past, since it proves your skills. **Drag the total time.**"
    view:
      type: bars
      max: 50
      items:
        - { label: "Present: what I do now", value: now, color: "#38bdf8" }
        - { label: "Past: how I got here", value: past, color: "#1cd6ac" }
        - { label: "Future: why this role", value: next, color: "#f97316" }
    sliders: [sec]
    outro: "In {sec} seconds: {now} on the present, {past} on the past, {next} on the future."

  - kind: code
    kicker: Worked example
    title: "A 90 second answer"
    intro: "For a career changer moving into AI engineering. Every sentence earns its place."
    lang: text
    code: |
      Present: I'm a backend developer who now builds LLM features. Last year
      I shipped a document Q&A service used by 300 people.
      Past: I started in web backends, which taught me APIs, databases and
      testing. I moved into ML by taking courses and building projects, and
      my RAG project cut support search time by half.
      Future: I want to work on LLM products at scale, and your team's
      focus on retrieval quality is exactly that.
    note: "Notice the last line connects to the company. That turns a biography into an argument."

  - kind: check
    kicker: Your turn
    title: "What to leave out"
    question: "Which detail should you leave OUT of this answer?"
    options:
      - { text: "Your hobbies from school years", correct: true, why: "Nothing in it supports the role. Keep the focus on relevant experience." }
      - { text: "Your current job", why: "That is the present part." }
      - { text: "A project with a result", why: "That is strong evidence." }
      - { text: "Why you want this role", why: "That is the future part." }

  - kind: check
    kicker: Practice
    title: "Too long"
    question: "You spoke for five minutes covering every job since college. What is the best fix?"
    options:
      - { text: "Cut to the roles and results that fit this job", correct: true, why: "Selection is the skill. Details can come up in later questions." }
      - { text: "Speak faster", why: "Same content, less clarity." }
      - { text: "Add more detail", why: "Longer is the problem." }
      - { text: "Skip the question", why: "It frames everything after it." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Reciting your CV.** They have it. Tell the story behind it."
      - "**No future part.** End by linking to the role."
      - "**Apologising.** Skip 'I only have a little experience'. State what you have done."
      - "**Never practising aloud.** Record yourself once and listen."
    next: { label: "Next: your resume and projects", href: /learn/int-resume-and-projects }
