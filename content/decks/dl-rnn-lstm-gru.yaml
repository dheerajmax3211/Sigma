id: dl-rnn-lstm-gru
title: "RNN, LSTM and GRU"
minutes: 14
order: 409
params:
  - { id: w, label: "recurrent weight", min: 0.5, max: 1.2, step: 0.05, init: 0.8 }
  - { id: T, label: "steps later", min: 1, max: 30, step: 1, init: 10 }
derived:
  - { id: memory, expr: "100 * w ^ T" }
cards:
  - kind: story
    kicker: Start here
    title: "A network with a memory"
    body:
      - "An **RNN** reads a sequence one item at a time. It keeps a **hidden state** that carries what it has seen so far, and updates it at every step."
      - "The trouble is long sequences. The first input is multiplied by the same weight again and again, so it shrinks to nothing or explodes. **LSTM** and **GRU** add gates that decide what to keep."
    callout: "Transformers replaced them for most text, but RNN ideas still appear in state space models."

  - kind: lab
    kicker: See it
    title: "How fast a memory fades"
    intro: "A signal from step one is multiplied by the recurrent weight at every step. **Drag the sliders.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "what is left of the first input", value: memory, color: "#f97316" }
        - { label: "the first input at the start", value: "100", color: "#38bdf8" }
    sliders: [w, T]
    outro: "With weight {w} after {T} steps, **{memory} percent** remains. Below 1 it vanishes. Above 1 it grows without limit."

  - kind: code
    kicker: Write it
    title: "A recurrent loop and a gate"
    intro: "Linear here for clarity. Real cells add a non-linearity. The gate z blends the old state with new information."
    lang: python
    code: |
      def run(xs, w):
          h, out = 0.0, []
          for x in xs:
              h = w * h + x
              out.append(h)
          return out

      def gate(h_old, h_new, z):
          return [z * a + (1 - z) * b for a, b in zip(h_old, h_new)]

      assert run([1, 0, 0], 0.5) == [1, 0.5, 0.25]
      assert gate([1, 2], [5, 6], 1) == [1, 2]
      assert gate([1, 2], [5, 6], 0) == [5, 6]
    note: "A gate near 1 copies the old memory forward unchanged. That is how LSTM and GRU keep long-range information."

  - kind: lab
    kicker: Compare
    title: "Three cells"
    intro: "From simple to gated."
    view:
      type: flow
      stages:
        - { label: "Plain RNN", note: "One update rule. Forgets fast.", color: "#ef4444" }
        - { label: "LSTM", note: "Input, forget and output gates plus a cell state.", color: "#38bdf8" }
        - { label: "GRU", note: "Two gates. Lighter, often just as good.", color: "#1cd6ac" }

  - kind: check
    kicker: Your turn
    title: "Why gates"
    question: "What problem do LSTM gates mainly solve?"
    options:
      - { text: "Information and gradients vanishing over long sequences", correct: true, why: "Gates let a value pass through many steps nearly unchanged." }
      - { text: "Slow data loading", why: "No." }
      - { text: "Too many classes", why: "No." }
      - { text: "Overfitting only", why: "No." }

  - kind: check
    kicker: Practice
    title: "Exploding"
    question: "Gradients explode in an RNN. A standard fix?"
    options:
      - { text: "Clip the gradient norm", correct: true, why: "Cap the size of the update so one step cannot blow up." }
      - { text: "Remove the loss", why: "No." }
      - { text: "Use a longer sequence", why: "That worsens it." }
      - { text: "Raise the learning rate", why: "That worsens it." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting to reset the state** between unrelated sequences."
      - "**No gradient clipping** on long sequences."
      - "**Padding counted in the loss.** Mask it."
    next: { label: "Next: debugging training", href: /learn/dl-training-loop-debugging }
