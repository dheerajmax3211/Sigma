id: mcp-servers
title: MCP servers
order: 35
minutes: 9
params:
  - { id: apps, label: "AI apps (clients)", min: 1, max: 6, step: 1, init: 3 }
  - { id: tl, label: "tools or data sources", min: 1, max: 10, step: 1, init: 4 }
derived:
  - { id: custom, expr: "apps * tl" }
  - { id: std, expr: "apps + tl" }
  - { id: saved, expr: "custom - std" }
cards:
  - kind: story
    kicker: Start here
    title: One plug for every app
    body:
      - "Say you wrote a tool that searches your notes. Every AI app wants its own custom wiring to use it, and you rebuild it for each one."
      - "**MCP**, the Model Context Protocol, is a standard plug. You build a **server** once that offers tools. Any app that speaks MCP, a **client**, can use it."
    callout: "Write the tool once. Use it everywhere."

  - kind: lab
    kicker: See it first
    title: Wiring count
    intro: "Without a standard, each app needs its own link to each tool. With MCP, each app connects once and each tool is built once. **Drag the sliders.**"
    view:
      type: bars
      max: 60
      items:
        - { label: "custom links without MCP", value: custom, color: "#ef4444" }
        - { label: "pieces to build with MCP", value: std, color: "#1cd6ac" }
    also:
      type: flow
      stages:
        - { label: "Client", note: "an AI app, one of {apps}", color: "#38bdf8" }
        - { label: "MCP", note: "one shared way to list and call tools", color: "#a78bfa" }
        - { label: "Server", note: "offers one of your {tl} tools or data sources", color: "#1cd6ac" }
    sliders: [apps, tl]
    outro: "{apps} apps and {tl} tools need **{custom}** custom links, or only **{std}** pieces with MCP. That saves **{saved}** builds."

  - kind: formula
    kicker: Read the formula
    title: Multiply or add
    tex: "A \\times T \\ \\text{versus}\\ A + T"
    say: "Custom wiring grows by multiplying apps by tools. A shared standard grows by adding them. The gap widens quickly as either number grows."
    verify:
      - { expr: "custom", equals: 12, tol: 0.01 }
      - { expr: "std", equals: 7, tol: 0.01 }
      - { expr: "saved", equals: 5, tol: 0.01 }
    symbols:
      - { tex: "A", means: "number of AI apps that want your tools", value: apps }
      - { tex: "T", means: "number of tools or data sources you offer", value: tl }
      - { tex: "A \\times T", means: "links you build when each pair is wired by hand", value: custom }
      - { tex: "A + T", means: "pieces you build when everyone speaks one standard", value: std }

  - kind: code
    kicker: Read it
    title: A tiny server
    intro: "With the official Python SDK, a decorated function becomes a tool. The docstring is what the model reads to decide when to call it."
    lang: python
    code: |
      from mcp.server.fastmcp import FastMCP

      mcp = FastMCP("notes")

      @mcp.tool()
      def search_notes(query: str) -> str:
          """Find notes that mention the query."""
          hits = [n for n in NOTES if query.lower() in n.lower()]
          return "\n".join(hits) or "No notes found"

      if __name__ == "__main__":
          mcp.run()
    note: "A client launches this program, asks it to list its tools, and calls them on the model's behalf."

  - kind: check
    kicker: Check yourself
    title: Who does what
    question: "In MCP, which side offers the tools?"
    options:
      - { text: "The server", correct: true, why: "A server lists tools and data. The client, such as an AI app, discovers and calls them." }
      - { text: "The client", why: "The client is the app that uses the tools." }
      - { text: "The language model itself", why: "The model only asks for a call. Your client carries it out." }

  - kind: check
    kicker: Check yourself
    title: Count the savings
    question: "You have 2 AI apps and 5 tools. How many custom links are needed without a standard?"
    options:
      - { text: "10", correct: true, why: "Each app needs its own link to each tool, and 2 times 5 is 10." }
      - { text: "7", why: "That is 2 plus 5, the count when a shared standard is used." }
      - { text: "5", why: "That counts the tools only and forgets the apps." }

  - kind: practice
    kicker: Your turn
    title: "Answer a tool call"
    intro: "MCP speaks JSON-RPC. Write `rpc_reply(id, result)` returning a dict with keys `jsonrpc` set to `2.0`, `id`, and `result`."
    entry: rpc_reply
    starter: |
      def rpc_reply(id, result):
          pass
    solution: |
      def rpc_reply(id, result):
          return {'jsonrpc': '2.0', 'id': id, 'result': result}
    tests:
      - { input: "[1, {\"ok\": true}]", expected: "{\"jsonrpc\": \"2.0\", \"id\": 1, \"result\": {\"ok\": true}}" }
      - { input: "[7, [1, 2]]", expected: "{\"jsonrpc\": \"2.0\", \"id\": 7, \"result\": [1, 2]}" }
      - { input: "[3, \"pong\"]", expected: "{\"jsonrpc\": \"2.0\", \"id\": 3, \"result\": \"pong\"}" }
    hint: "The reply must carry the same id as the request so the caller can match them."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Trusting any server.** A server can run code and read data, so install only ones you trust."
      - "**Vague descriptions.** The model picks tools by their description, so a poor one means wrong calls."
      - "**Returning huge outputs.** Send back short, useful text, or you fill the model's context."
    next: { label: "Next: agent memory and guardrails", href: /learn/agent-memory-and-guardrails }
