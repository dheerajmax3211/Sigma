id: "fd-schedules-stability"
title: "Learning rate schedules and exploding gradients"
minutes: 14
order: 710
params:
  - { id: "t", label: "training step", min: 0, max: 100, step: 1, init: 10 }
derived:
  - { id: "lr", expr: "100 * min(t / 10, 1) * 0.5 * (1 + cos(3.14159 * max(t - 10, 0) / 90))" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Start gently, finish gently"
    body:
      - "A single fixed learning rate is rarely best. Early on the weights are random and gradients are wild, so a big step can wreck training. Later you want small steps to settle into a good spot."
      - "The standard recipe is **warm-up** then **cosine decay**. Rise from zero for a few steps, then glide down smoothly. When gradients still spike, **clip** their size."
    callout: "Warm-up protects the start. Decay polishes the end."
  - kind: "lab"
    kicker: "See it"
    title: "The schedule"
    intro: "Step 0 to 100. Warm-up covers the first ten steps. **Drag the step.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "learning rate (percent of the peak)", value: "lr", color: "#f97316" }
        - { label: "the peak", value: "100", color: "#38bdf8" }
    sliders:
      - "t"
    outro: "At step {t} the rate is **{lr} percent** of the peak. It climbs, then falls toward zero."
  - kind: "code"
    kicker: "Write it"
    title: "Schedule and clipping"
    intro: "Both are a few lines."
    lang: "python"
    code: |
      import math

      def lr_at(t, total, warm, peak):
          if t < warm:
              return peak * t / warm
          progress = (t - warm) / (total - warm)
          return peak * 0.5 * (1 + math.cos(math.pi * progress))

      def clip(g, max_norm):
          n = math.sqrt(sum(x * x for x in g))
          return g if n <= max_norm else [x * max_norm / n for x in g]

      assert lr_at(0, 100, 10, 1.0) == 0
      assert lr_at(10, 100, 10, 1.0) == 1.0
      assert abs(lr_at(100, 100, 10, 1.0)) < 1e-12
      c = clip([3.0, 4.0], 1.0)
      assert abs(c[0] - 0.6) < 1e-12 and abs(c[1] - 0.8) < 1e-12
      assert clip([0.3, 0.4], 1.0) == [0.3, 0.4]
    note: "Clipping keeps the direction and shrinks the length, so one bad batch cannot ruin the run."
  - kind: "lab"
    kicker: "Memorise"
    title: "Why gradients explode"
    intro: "Depth multiplies factors."
    view:
      type: "flow"
      stages:
        - { label: "Many layers", note: "Each backward step multiplies by a factor.", color: "#38bdf8" }
        - { label: "Factor above one", note: "The gradient grows without limit.", color: "#ef4444" }
        - { label: "Factor below one", note: "The gradient vanishes.", color: "#f97316" }
        - { label: "Fixes", note: "Good init, normalisation, skips, clipping.", color: "#1cd6ac" }
  - kind: "check"
    kicker: "Your turn"
    title: "Warm-up"
    question: "Why warm up the learning rate?"
    options:
      - { text: "Early gradients are noisy and large steps can diverge", correct: true, why: "Start small, then rise." }
      - { text: "To make training longer", why: "No." }
      - { text: "To lower the loss at step zero", why: "No." }
      - { text: "It is only tradition", why: "It has a real reason." }
  - kind: "check"
    kicker: "Practice"
    title: "Clipping"
    question: "Gradient norm spikes to 500 once. What does clipping do?"
    options:
      - { text: "Rescales the gradient to a safe length", correct: true, why: "The direction stays." }
      - { text: "Deletes the batch", why: "It keeps it." }
      - { text: "Raises the learning rate", why: "No." }
      - { text: "Stops training", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**No warm-up for big models.** Early steps can blow up."
      - "**Decaying to exactly zero too early.** Training stalls."
      - "**Clipping too tightly.** It slows learning."
    next: { label: "Next: randomness and reproducibility", href: "/learn/fd-reproducibility" }
