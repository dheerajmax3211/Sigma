id: dsa-dp-2d
title: "Dynamic programming: grids"
minutes: 15
order: 126
params:
  - { id: f, label: "cells filled", min: 0, max: 12, step: 1, init: 0 }
cards:
  - kind: story
    kicker: Start here
    title: "When one number is not enough"
    body:
      - "Sometimes the state needs **two** numbers: a row and a column, or a position in each of two strings. Then the table is a grid."
      - "The recipe is the same: say what a cell means, say how it comes from its neighbours, fill in an order where neighbours already exist."
    callout: "Clue words: grid paths, two strings, edit distance, longest common subsequence, matrix of choices."

  - kind: lab
    kicker: See it
    title: "Paths in a 3 by 4 grid"
    intro: "You move only right or down. Each cell holds the number of ways to reach it: **ways from above plus ways from the left**. **Drag the fill.**"
    view:
      type: grid
      rows:
        - [1, 1, 1, 1]
        - [1, 2, 3, 4]
        - [1, 3, 6, 10]
      rowLabels: [r0, r1, r2]
      colLabels: [c0, c1, c2, c3]
      fill: f
      note: "Cell {f} of 12 filled. The last cell is the answer."
    sliders: [f]
    outro: "The top row and left column are all 1: only one straight path reaches them. Every other cell adds its top and left neighbours. The corner holds **10**."

  - kind: code
    kicker: Write it
    title: "Unique paths"
    intro: "Fill a table row by row. Use the first row and column as base cases."
    lang: python
    code: |
      def unique_paths(m, n):
          dp = [[1] * n for _ in range(m)]
          for i in range(1, m):
              for j in range(1, n):
                  dp[i][j] = dp[i - 1][j] + dp[i][j - 1]
          return dp[m - 1][n - 1]

      assert unique_paths(3, 4) == 10
      assert unique_paths(1, 5) == 1
    note: "O(m times n) time. A single row of memory is enough, since each row only looks at the one above."

  - kind: lab
    kicker: See it
    title: "Longest common subsequence"
    intro: "For strings ABC and AC: if the letters match, take the diagonal plus 1. Otherwise take the larger of the top and left cells. **Drag the fill.**"
    view:
      type: grid
      rows:
        - [0, 0, 0]
        - [0, 1, 1]
        - [0, 1, 1]
        - [0, 1, 2]
      rowLabels: ["", A, B, C]
      colLabels: ["", A, C]
      fill: f
      note: "{f} of 12 cells filled."
    sliders: [f]
    outro: "The bottom right cell is **2**: the common subsequence AC. Cells where the letters match are where the count grows."

  - kind: code
    kicker: Write it
    title: "LCS and edit distance"
    intro: "Two strings means a grid with one row and column extra, as a base of nothing."
    lang: python
    code: |
      def lcs(a, b):
          dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
          for i in range(1, len(a) + 1):
              for j in range(1, len(b) + 1):
                  if a[i - 1] == b[j - 1]:
                      dp[i][j] = dp[i - 1][j - 1] + 1
                  else:
                      dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
          return dp[-1][-1]

      def edit_distance(a, b):
          dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
          for i in range(len(a) + 1):
              dp[i][0] = i                      # delete all of a
          for j in range(len(b) + 1):
              dp[0][j] = j                      # insert all of b
          for i in range(1, len(a) + 1):
              for j in range(1, len(b) + 1):
                  if a[i - 1] == b[j - 1]:
                      dp[i][j] = dp[i - 1][j - 1]
                  else:
                      dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])
          return dp[-1][-1]

      assert lcs("abc", "ac") == 2
      assert lcs("abc", "def") == 0
      assert edit_distance("horse", "ros") == 3
      assert edit_distance("", "abc") == 3
    note: "In edit distance the three neighbours mean delete, insert and replace."

  - kind: check
    kicker: Your turn
    title: "Which neighbour?"
    question: "In edit distance, the letters differ. Which neighbour cell means 'replace a letter'?"
    options:
      - { text: "The diagonal, up and left", correct: true, why: "Both strings advance by one letter, which is a replace." }
      - { text: "The cell above", why: "That is a delete from a." }
      - { text: "The cell to the left", why: "That is an insert into a." }
      - { text: "The last cell", why: "It is the answer, not an option." }

  - kind: practice
    kicker: Your turn
    title: "Grid paths"
    intro: "Write `paths(rows, cols)` returning how many ways go from top-left to bottom-right moving only right or down. Fill a table row by row."
    entry: paths
    starter: |
      def paths(rows, cols):
          pass
    solution: |
      def paths(rows, cols):
          t = [[1] * cols for _ in range(rows)]
          for r in range(1, rows):
              for c in range(1, cols):
                  t[r][c] = t[r - 1][c] + t[r][c - 1]
          return t[-1][-1]
    tests:
      - { input: "[3,7]", expected: "28" }
      - { input: "[3,2]", expected: "3" }
      - { input: "[1,1]", expected: "1" }
    hint: "A cell is reached from above or from the left, so add those two."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Index shift.** The table is one bigger than the strings. Use `a[i - 1]` for table row `i`."
      - "**Shared rows.** Never write `[[0] * n] * m`: all rows are the same list."
      - "**Forgetting base row and column.** Edit distance starts at 0, 1, 2, 3, not at 0."
      - "**Memory habits.** If each row needs only the previous row, keep two rows."
    next: { label: "Next: knapsack and strings", href: /learn/dsa-dp-knapsack-and-strings }
