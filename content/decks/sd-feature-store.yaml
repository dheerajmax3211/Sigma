id: "sd-feature-store"
title: "Feature stores and training-serving skew"
minutes: 14
order: 604
params:
  - { id: "refresh", label: "refresh every (minutes)", min: 1, max: 60, step: 1, init: 10 }
derived:
  - { id: "avgage", expr: "refresh / 2" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "The same feature, twice"
    body:
      - "A model trained on one definition of a feature and served another will quietly fail. This is **training-serving skew**."
      - "A **feature store** keeps one definition and two copies: an **offline** copy with history for training, and an **online** copy with only the latest values for fast serving."
    callout: "One definition, computed once, used in both places."
  - kind: "lab"
    kicker: "See it"
    title: "How stale is a feature"
    intro: "If the online copy is refreshed every few minutes, a request sees values of varying age. **Drag the refresh time.**"
    view:
      type: "bars"
      max: 60
      items:
        - { label: "average age of a feature (minutes)", value: "avgage", color: "#f97316" }
        - { label: "worst case age (minutes)", value: "refresh", color: "#ef4444" }
    sliders:
      - "refresh"
    outro: "Refreshing every {refresh} minutes means features are on average **{avgage}** minutes old, and up to {refresh}. Fast changing signals need streaming."
  - kind: "code"
    kicker: "Write it"
    title: "A point in time join"
    intro: "For each label, use the latest feature value known before that moment, never after."
    lang: "python"
    code: |
      def asof(features, t):
          best = None
          for ts, v in features:
              if ts <= t and (best is None or ts > best[0]):
                  best = (ts, v)
          return None if best is None else best[1]

      history = [(1, 10), (5, 20), (9, 30)]
      assert asof(history, 5) == 20
      assert asof(history, 8) == 20
      assert asof(history, 0) is None

      labels = [(6, 1), (10, 0)]
      rows = [(asof(history, t), y) for t, y in labels]
      assert rows == [(20, 1), (30, 0)]
    note: "Joining on the latest value instead of the value at label time leaks the future into training."
  - kind: "lab"
    kicker: "Memorise"
    title: "The two sides"
    intro: "What each copy is for."
    view:
      type: "flow"
      stages:
        - { label: "Offline store", note: "Years of history in a warehouse. Used to build training sets.", color: "#38bdf8" }
        - { label: "Online store", note: "Latest values in a key value store. Read in milliseconds.", color: "#1cd6ac" }
        - { label: "Pipelines", note: "One job computes both so they match.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Skew"
    question: "A model scores well offline and badly in production. A first suspect?"
    options:
      - { text: "Features are computed differently at serving time", correct: true, why: "Training-serving skew is a top cause." }
      - { text: "Too many layers", why: "Not the first suspect." }
      - { text: "The loss is wrong", why: "Not likely." }
      - { text: "Too little GPU", why: "Not related." }
  - kind: "check"
    kicker: "Practice"
    title: "Leak"
    question: "Why join on the value at label time and not the latest one?"
    options:
      - { text: "The latest value includes the future, which is a leak", correct: true, why: "The model must only see what it would have known." }
      - { text: "It is faster", why: "It is not about speed." }
      - { text: "It uses less memory", why: "No." }
      - { text: "Latest values are noisy", why: "The issue is leakage." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Two codebases for one feature.** They drift apart."
      - "**Joining on latest.** Leaks the future."
      - "**Ignoring freshness.** Set and monitor a limit."
    next: { label: "Next: recommendation pipelines", href: "/learn/sd-recommendation-pipeline" }
