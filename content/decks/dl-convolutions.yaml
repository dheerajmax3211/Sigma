id: dl-convolutions
title: "Convolutions"
minutes: 14
order: 406
params:
  - { id: n, label: "input size", min: 8, max: 64, step: 1, init: 32 }
  - { id: k, label: "kernel size", min: 1, max: 7, step: 1, init: 3 }
  - { id: p, label: "padding", min: 0, max: 3, step: 1, init: 1 }
  - { id: s, label: "stride", min: 1, max: 4, step: 1, init: 1 }
derived:
  - { id: out, expr: "floor((n - k + 2 * p) / s) + 1" }
cards:
  - kind: story
    kicker: Start here
    title: "One small filter, slid across the input"
    body:
      - "A **convolution** takes a small grid of weights, the **kernel**, and slides it across the input. At each spot it multiplies and adds up, giving one output number."
      - "The same kernel is reused everywhere, so a pattern like an edge is found wherever it appears. That sharing also means far fewer weights than a dense layer."
    callout: "A kernel is a pattern detector. Training decides which pattern."

  - kind: lab
    kicker: See it
    title: "How big is the output?"
    intro: "The output size depends on four numbers. **Drag them and watch.**"
    view:
      type: bars
      max: 70
      items:
        - { label: "input size", value: n, color: "#38bdf8" }
        - { label: "output size", value: out, color: "#1cd6ac" }
    sliders: [n, k, p, s]
    outro: "Input {n}, kernel {k}, padding {p}, stride {s} gives an output of **{out}**. Padding keeps edges. Stride skips positions and shrinks the output."

  - kind: code
    kicker: Write it
    title: "A 1D convolution"
    intro: "Slide the kernel, multiply, sum. This kernel detects change from left to right."
    lang: python
    code: |
      def conv1d(x, k):
          n, m = len(x), len(k)
          return [sum(x[i + j] * k[j] for j in range(m)) for i in range(n - m + 1)]

      def out_size(n, k, p, s):
          return (n - k + 2 * p) // s + 1

      assert conv1d([1, 2, 3, 4, 5], [1, 0, -1]) == [-2, -2, -2]
      assert conv1d([0, 0, 5, 5, 5], [1, 0, -1]) == [-5, -5, 0]
      assert out_size(32, 3, 1, 1) == 32
      assert out_size(32, 3, 0, 2) == 15
    note: "Frameworks call this cross-correlation. The kernel is not flipped, and it makes no difference for learning."

  - kind: check
    kicker: Your turn
    title: "Why share a kernel?"
    question: "What is the main benefit of reusing one kernel across the whole image?"
    options:
      - { text: "Far fewer weights, and a pattern is found anywhere", correct: true, why: "The same few weights are applied at every position." }
      - { text: "It makes the image bigger", why: "Padding or stride decide size." }
      - { text: "It removes the need for training", why: "The kernel is learned." }
      - { text: "It adds a bias to each pixel", why: "No." }

  - kind: check
    kicker: Practice
    title: "Compute the size"
    question: "Input 28, kernel 5, padding 0, stride 1. What is the output size?"
    options:
      - { text: "24", correct: true, why: "28 minus 5 plus 0, divided by 1, plus 1 is 24." }
      - { text: "28", why: "That needs padding of 2." }
      - { text: "23", why: "You forgot the plus 1." }
      - { text: "26", why: "That is a kernel of 3." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting the plus 1.** Count positions, not gaps."
      - "**Mixing up channels.** A kernel spans all input channels."
      - "**Odd shapes from stride.** Floor the division."
    next: { label: "Next: pooling and shapes", href: /learn/dl-pooling-shape-algebra }
