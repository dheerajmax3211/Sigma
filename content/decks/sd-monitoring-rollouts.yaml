id: "sd-monitoring-rollouts"
title: "Monitoring and safe rollouts"
minutes: 13
order: 610
params:
  - { id: "canary", label: "share of traffic on the new model (percent)", min: 1, max: 50, step: 1, init: 5 }
derived:
  - { id: "hurt", expr: "canary" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Models fail quietly"
    body:
      - "A broken web server throws errors. A broken model keeps answering, just worse. You need to watch **inputs**, **outputs** and **outcomes**, not only uptime."
      - "You also release carefully: run the new model in **shadow**, then send it a **canary** slice of traffic, then widen it."
    callout: "Assume every release might be bad, and limit the blast radius."
  - kind: "lab"
    kicker: "See it"
    title: "A canary limits the damage"
    intro: "If the new model is bad, only the canary share suffers. **Drag the share.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "users hit if the new model is bad", value: "hurt", color: "#f97316" }
        - { label: "users hit if shipped to everyone", value: "100", color: "#ef4444" }
    sliders:
      - "canary"
    outro: "At {canary} percent, a bad model touches **{hurt} percent** of users before you catch it."
  - kind: "code"
    kicker: "Write it"
    title: "A drift check"
    intro: "Compare live inputs to what the model saw in training."
    lang: "python"
    code: |
      def drifted(train_mean, train_sd, live, z=3):
          m = sum(live) / len(live)
          return abs(m - train_mean) > z * train_sd / len(live) ** 0.5

      assert drifted(10, 2, [10, 11, 9, 10]) is False
      assert drifted(10, 2, [20, 21, 19, 20]) is True

      def rollback(metric, baseline, tol):
          return metric < baseline - tol

      assert rollback(0.80, 0.90, 0.05) is True
      assert rollback(0.88, 0.90, 0.05) is False
    note: "Pick an automatic rollback rule before launch, not during the incident."
  - kind: "lab"
    kicker: "Memorise"
    title: "What to watch"
    intro: "Four layers."
    view:
      type: "flow"
      stages:
        - { label: "System", note: "Latency, errors, cost, saturation.", color: "#38bdf8" }
        - { label: "Inputs", note: "Feature ranges, missing values, drift.", color: "#1cd6ac" }
        - { label: "Outputs", note: "Score distribution, refusal rate, length.", color: "#f97316" }
        - { label: "Outcomes", note: "Clicks, fraud caught, user ratings. Often delayed.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Shadow"
    question: "What does shadow mode do?"
    options:
      - { text: "Runs the new model on live traffic without showing its answers", correct: true, why: "You compare it safely before any user is affected." }
      - { text: "Sends it to all users", why: "That is a full launch." }
      - { text: "Turns off the old model", why: "No." }
      - { text: "Trains it online", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Silent failure"
    question: "Latency and errors look fine but conversions fall. What is likely?"
    options:
      - { text: "The model quality dropped or the inputs drifted", correct: true, why: "System health does not show quality." }
      - { text: "The servers crashed", why: "They look fine." }
      - { text: "The disk is full", why: "Not the signal." }
      - { text: "Nothing is wrong", why: "Conversions fell." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Watching uptime only.** Models fail quietly."
      - "**Full launches.** Use shadow then canary."
      - "**No rollback plan.** Decide the rule beforehand."
    next: { label: "Next: a real-time voice agent", href: "/learn/sd-realtime-voice" }
