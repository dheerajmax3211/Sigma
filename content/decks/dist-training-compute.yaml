id: "dist-training-compute"
title: "How long will training take"
minutes: 13
order: 806
params:
  - { id: "pb", label: "parameters (billions)", min: 1, max: 100, step: 1, init: 7 }
  - { id: "dt", label: "training tokens (trillions)", min: 0.1, max: 15, step: 0.1, init: 1 }
  - { id: "g", label: "GPUs", min: 8, max: 4096, step: 8, init: 512 }
derived:
  - { id: "gh", expr: "pb * dt * 13333.33" }
  - { id: "days", expr: "gh / g / 24" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A back-of-envelope that is usually right"
    body:
      - "Training a transformer costs about **6 times parameters times tokens** floating point operations. Divide by what your GPUs really deliver and you have the time."
      - "A GPU rarely hits its peak. About 40 percent of the peak, called model FLOPs utilisation, is a good result."
    callout: "Size times data decides the bill."
  - kind: "lab"
    kicker: "See it"
    title: "Time to train"
    intro: "Assume a GPU that gives 125 trillion operations per second in practice. **Drag the model, the data and the GPUs.**"
    view:
      type: "bars"
      max: 60
      items:
        - { label: "days to train", value: "days", color: "#f97316" }
        - { label: "a 30 day target", value: "30", color: "#1cd6ac" }
    sliders:
      - "pb"
      - "dt"
      - "g"
    outro: "A {pb} billion model on {dt} trillion tokens needs about **{gh} GPU hours**. On {g} GPUs that is **{days} days**."
  - kind: "code"
    kicker: "Write it"
    title: "The estimate"
    intro: "Six times parameters times tokens, over real speed."
    lang: "python"
    code: |
      def gpu_hours(params, tokens, flops_per_gpu=1.25e14):
          total = 6 * params * tokens
          return total / flops_per_gpu / 3600

      h = gpu_hours(7e9, 1e12)
      assert abs(h - 93333.33) < 1
      assert abs(h / 512 / 24 - 7.6) < 0.1          # days on 512 GPUs
      assert gpu_hours(14e9, 1e12) == 2 * h or abs(gpu_hours(14e9, 1e12) - 2 * h) < 1e-6
    note: "Doubling either the model or the data doubles the cost."
  - kind: "lab"
    kicker: "Memorise"
    title: "What changes the number"
    intro: "Levers in practice."
    view:
      type: "flow"
      stages:
        - { label: "Utilisation", note: "Better kernels and overlap raise real speed.", color: "#1cd6ac" }
        - { label: "Precision", note: "Lower precision gives more operations per second.", color: "#38bdf8" }
        - { label: "Failures", note: "Restarts and checkpoints add lost time.", color: "#ef4444" }
        - { label: "Scaling", note: "More GPUs cost more communication.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Doubling"
    question: "You double the model size and keep the tokens. The cost?"
    options:
      - { text: "About doubles", correct: true, why: "Cost scales with parameters times tokens." }
      - { text: "Stays the same", why: "No." }
      - { text: "Quadruples", why: "Only if the data doubles too." }
      - { text: "Halves", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Utilisation"
    question: "Why do real runs use about 40 percent of peak speed?"
    options:
      - { text: "Waiting on memory and communication", correct: true, why: "The GPU idles during those." }
      - { text: "Peak is a lie", why: "It is real but rarely reachable." }
      - { text: "The model is too small", why: "Not the main reason." }
      - { text: "Data is slow only", why: "One of several causes." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Using peak speed in the estimate.** Use measured throughput."
      - "**Forgetting restarts.** Add slack."
      - "**Ignoring evaluation and data prep time.**"
    next: { label: "Next: continuous batching", href: "/learn/dist-continuous-batching" }
