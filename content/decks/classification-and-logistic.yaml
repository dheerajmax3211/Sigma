id: classification-and-logistic
title: Classification and the sigmoid
order: 16
minutes: 10
params:
  - { id: z, label: "score z", min: -6, max: 6, step: 0.5, init: 1 }
  - { id: th, label: "threshold", min: 0.1, max: 0.9, step: 0.05, init: 0.5 }
derived:
  - { id: p, expr: "sigmoid(z)" }
  - { id: yes, expr: "min(1, ceil(max(p - th, 0)))" }
  - { id: tp, expr: "min(1, ceil(max(0.93 - th, 0))) + min(1, ceil(max(0.82 - th, 0))) + min(1, ceil(max(0.62 - th, 0))) + min(1, ceil(max(0.38 - th, 0)))" }
  - { id: fp, expr: "min(1, ceil(max(0.72 - th, 0))) + min(1, ceil(max(0.47 - th, 0))) + min(1, ceil(max(0.22 - th, 0))) + min(1, ceil(max(0.08 - th, 0)))" }
  - { id: miss, expr: "4 - tp" }
  - { id: flagged, expr: "tp + fp" }
  - { id: prec, expr: "tp / max(flagged, 1)" }
  - { id: rec, expr: "tp / 4" }
cards:
  - kind: story
    kicker: Start here
    title: A score becomes a yes or a no
    body:
      - "A spam filter does not just say yes or no. First it computes a **score**, and the score can be any number, large or small."
      - "Two small steps turn that score into a decision. Squash it into a **probability** between 0 and 1, then compare it to a **threshold**."
    callout: "Score, then probability, then decision."

  - kind: lab
    kicker: See it first
    title: The sigmoid squashes any score
    intro: "The **sigmoid** curve turns a score z into a probability. Drag **z** along the curve. Then drag the **threshold**: the decision is yes only when the probability is above it."
    view: { type: curve, fn: "sigmoid(t)", min: -6, max: 6, yMin: 0, yMax: 1, point: z, xLabel: "score z", yLabel: probability }
    also:
      type: bars
      max: 1
      items:
        - { label: "probability p", value: p, color: "#38bdf8" }
        - { label: "threshold", value: th, color: "#a78bfa" }
        - { label: "decision (1 = yes)", value: yes, color: "#1cd6ac" }
    sliders: [z, th]
    outro: "Score {z} becomes probability **{p}**. With threshold {th} the decision is **{yes}**, where 1 means yes and 0 means no."

  - kind: formula
    kicker: Read the formula
    title: The sigmoid function
    tex: "\\sigma(z) = \\frac{1}{1 + e^{-z}}"
    say: "Flip the sign of the score, raise e to that power, add 1, then take one over the result. Big positive scores give nearly 1, big negative scores nearly 0, and a score of 0 gives exactly one half."
    verify:
      - { expr: "p", equals: 0.7311, tol: 0.001 }
      - { expr: "1 / (1 + exp(0 - z))", equals: 0.7311, tol: 0.001 }
      - { expr: "sigmoid(0)", equals: 0.5, tol: 0.001 }
    symbols:
      - { tex: "\\sigma(z)", means: "the probability, always between 0 and 1", value: p }
      - { tex: "z", means: "the raw score from the model", value: z }
      - { tex: "e", means: "a fixed constant, about 2.718", value: "exp(1)" }

  - kind: check
    kicker: Check yourself
    title: The midpoint
    question: "A model's score is z = 0. What probability does the sigmoid give?"
    options:
      - { text: "0.5", correct: true, why: "A score of 0 sits exactly in the middle: e to the power 0 is 1, so 1 / (1 + 1) = 0.5." }
      - { text: "0", why: "Probability 0 needs a very large negative score. Zero is the midpoint." }
      - { text: "1", why: "Probability 1 needs a very large positive score." }

  - kind: lab
    kicker: Try it
    title: Move the threshold, trade mistakes
    intro: "Eight emails have a model probability, and four are really spam. A **low** threshold catches more spam but flags good mail too. **Drag the threshold** and watch both counts."
    view:
      type: bars
      max: 4
      items:
        - { label: "spam caught", value: tp, color: "#1cd6ac" }
        - { label: "good mail flagged", value: fp, color: "#ef4444" }
        - { label: "spam missed", value: miss, color: "#f59e0b" }
    also:
      type: bars
      max: 1
      items:
        - { label: "precision", value: prec, color: "#38bdf8" }
        - { label: "recall", value: rec, color: "#a78bfa" }
    sliders: [th]
    outro: "At threshold {th}: precision **{prec}**, recall **{rec}**. Raise one and the other usually falls."

  - kind: formula
    kicker: Read the formula
    title: Precision and recall
    tex: "\\text{precision} = \\frac{TP}{TP + FP}, \\quad \\text{recall} = \\frac{TP}{TP + FN}"
    say: "Precision asks: of everything I flagged, how much was truly spam? Recall asks: of all the real spam, how much did I catch?"
    verify:
      - { expr: "tp / (tp + fp)", equals: 0.75, tol: 0.001 }
      - { expr: "tp / (tp + miss)", equals: 0.75, tol: 0.001 }
    symbols:
      - { tex: "TP", means: "true positives: spam that was correctly flagged", value: tp }
      - { tex: "FP", means: "false positives: good mail that was wrongly flagged", value: fp }
      - { tex: "FN", means: "false negatives: spam that was missed", value: miss }

  - kind: check
    kicker: Check yourself
    title: Pick what to push
    question: "A cancer screening test must not miss real cases, even if it raises some false alarms. Which measure matters most?"
    options:
      - { text: "Recall: catch every real case", correct: true, why: "Recall counts real cases found. A miss is the costly mistake here." }
      - { text: "Precision: avoid false alarms", why: "Precision guards against false alarms, but here a miss is worse." }
      - { text: "Neither, because accuracy tells it all", why: "Accuracy hides the difference when real cases are rare." }

  - kind: practice
    kicker: Your turn
    title: "Sigmoid and threshold"
    intro: "Write `predict(z, threshold)` that squeezes `z` with `1 / (1 + exp(-z))` and returns 1 if the result is at least `threshold`, otherwise 0."
    entry: predict
    starter: |
      import math
      def predict(z, threshold):
          pass
    solution: |
      import math
      def predict(z, threshold):
          p = 1 / (1 + math.exp(-z))
          return 1 if p >= threshold else 0
    tests:
      - { input: "[0, 0.5]", expected: "1" }
      - { input: "[2, 0.9]", expected: "0" }
      - { input: "[-3, 0.5]", expected: "0" }
      - { input: "[1, 0.5]", expected: "1" }
    hint: "The sigmoid maps any number into the range 0 to 1."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Using 0.5 by default.** The best threshold depends on which mistake costs more."
      - "**Trusting accuracy alone.** If 99 of 100 emails are good, always answering not spam scores 99%. Look at precision and recall."
      - "**Reading probability as certainty.** A 0.9 is the model's confidence, not a guarantee."
    next: { label: "Next: neurons and layers", href: /learn/neurons-and-layers }
