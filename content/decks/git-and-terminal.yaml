id: git-and-terminal
title: Git and the terminal
order: 9
minutes: 9
params:
  - { id: edits, label: "files you changed", min: 1, max: 8, step: 1, init: 5 }
  - { id: add, label: "files you add", min: 0, max: 8, step: 1, init: 3 }
  - { id: commits, label: "saves (commits) made", min: 0, max: 6, step: 1, init: 2 }
  - { id: push, label: "saves you push", min: 0, max: 6, step: 1, init: 1 }
derived:
  - { id: staged, expr: "min(add, edits)" }
  - { id: left, expr: "edits - staged" }
  - { id: sent, expr: "min(push, commits)" }
  - { id: ahead, expr: "commits - sent" }
cards:
  - kind: story
    kicker: Start here
    title: Git is a save button with history
    body:
      - "In a video game you save before a hard level. If you lose, you reload. **Git** does that for your code, with a labelled save for every step."
      - "The **terminal** is a text window where you type commands. You type one line, press Enter, and the computer runs it."
    callout: "A **commit** is one labelled save point you can always go back to."

  - kind: lab
    kicker: See it first
    title: Follow a change on its way
    intro: "Your work passes through four places. Change files, **add** the ones you want, **commit** them as a save, then **push** the saves to the shared copy online. Drag the sliders to move work along."
    view:
      type: flow
      stages:
        - { label: "1. Working folder", note: "{edits} files changed on your disk", color: "#38bdf8" }
        - { label: "2. Staging (git add)", note: "{staged} files picked for the next save", color: "#a78bfa" }
        - { label: "3. Local history (git commit)", note: "{commits} saves on your machine", color: "#f59e0b" }
        - { label: "4. Remote (git push)", note: "{sent} saves shared online", color: "#1cd6ac" }
    sliders: [edits, add, commits, push]
    outro: "**{left}** changed files are still only in your folder, and **{ahead}** saves have not reached the remote yet."

  - kind: code
    kicker: Daily commands
    title: The four commands you type every day
    intro: "Run these inside your project folder. Text after `#` is only a note for you."
    lang: bash
    code: |
      git status                       # what changed? what is staged?
      git add src/app.py               # stage one file for the next save
      git commit -m "Add login form"   # save a snapshot with a message
      git log --oneline                # list past saves, newest first
    note: "Write the message as what the change does, such as Add login form. Future you will search these."

  - kind: check
    kicker: Check yourself
    title: What goes into the commit?
    question: "You changed three files, ran `git add` on one of them, then ran `git commit`. How many files are in the new commit?"
    options:
      - { text: "1", correct: true, why: "Only staged files go into a commit. The other two stay changed in your folder." }
      - { text: "3", why: "A commit saves only what you added, not everything that changed." }
      - { text: "0", why: "The file you added was staged, so it is saved." }

  - kind: code
    kicker: Branches
    title: Try things without breaking main
    intro: "A **branch** is a movable label on your history. Work on a new branch and the main line stays untouched until you merge."
    lang: bash
    code: |
      git switch -c add-search     # make a new branch and move onto it
      # ...edit files, then git add and git commit...
      git switch main              # go back to the main branch
      git merge add-search         # bring the new work into main
    note: "Make one branch per task. If it goes badly, delete the branch and main is unharmed."

  - kind: code
    kicker: Sharing
    title: Push and pull with a remote
    intro: "A **remote** is a copy of the repository on a server such as GitHub. `push` uploads your saves. `pull` downloads other people's."
    lang: bash
    code: |
      git clone https://github.com/you/app.git   # first-time copy to your machine
      git pull                                    # get the latest saves
      git push -u origin add-search               # upload a new branch the first time
      git push                                    # later pushes need no extra words
    note: "Pull before you start work each day, so you build on the latest version."

  - kind: check
    kicker: Check yourself
    title: What is a branch?
    question: "Which sentence describes a git branch best?"
    options:
      - { text: "A movable label on a save, so you can work apart from main", correct: true, why: "Branches are cheap labels, not copies, which is why making one takes a moment." }
      - { text: "A full copy of the project folder on a second disk", why: "Git does not copy the folder. It stores the history once and points labels at it." }
      - { text: "A command that uploads code to GitHub", why: "That is push. A branch is a label you can push or keep local." }

  - kind: practice
    kicker: Your turn
    title: "Read git status"
    intro: "`git status --short` prints lines like `M  app.py` (staged change), ` M app.py` (not staged) and `?? new.txt` (untracked). Write `staged(lines)` returning the file names that are staged, in order."
    entry: staged
    starter: |
      def staged(lines):
          pass
    solution: |
      def staged(lines):
          return [l[3:] for l in lines if l[0] not in ' ?']
    tests:
      - { input: "[[\"M  a.py\", \" M b.py\", \"?? c.txt\", \"A  d.py\"]]", expected: "[\"a.py\", \"d.py\"]" }
      - { input: "[[]]", expected: "[]" }
      - { input: "[[\" M x\"]]", expected: "[]" }
    hint: "The first column is the staged state. A space or a question mark means nothing is staged."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Committing secrets.** Never commit passwords or an .env file. Once pushed, assume the secret is public and change it."
      - "**Working straight on main.** Make a branch for each task so main always works."
      - "**Vague messages.** A message like fix stuff tells nobody anything. Say what changed and why."
    next: { label: "Next: HTTP and REST APIs", href: /learn/http-and-rest }
