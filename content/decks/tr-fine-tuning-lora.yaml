id: tr-fine-tuning-lora
title: "Fine-tuning with LoRA"
minutes: 14
order: 310
params:
  - { id: r, label: "rank", min: 1, max: 64, step: 1, init: 8 }
derived:
  - { id: full, expr: "4096 * 4096 / 1000" }
  - { id: low, expr: "2 * 4096 * r / 1000" }
  - { id: pct, expr: "100 * low / full" }
cards:
  - kind: story
    kicker: Start here
    title: "Teach a big model a small thing"
    body:
      - "Full fine-tuning updates every weight, which needs the memory of training the whole model. Most teams cannot afford that."
      - "**LoRA** freezes the original weights and learns a small **add-on** for each big matrix. You train a tiny fraction and still get good results."
    callout: "Fine-tune for style, format or a narrow skill. Use retrieval for facts."

  - kind: lab
    kicker: See it
    title: "Two small matrices"
    intro: "A big matrix W stays frozen. The update is the product of a tall thin matrix B and a wide thin matrix A."
    view:
      type: flow
      stages:
        - { label: "Input x", note: "A vector entering the layer.", color: "#38bdf8" }
        - { label: "W x", note: "The frozen original path.", color: "#1cd6ac" }
        - { label: "B A x", note: "The small trained path, scaled by alpha over r.", color: "#f97316" }
        - { label: "Sum", note: "Both paths are added.", color: "#a78bfa" }

  - kind: lab
    kicker: See it
    title: "How much is trained"
    intro: "For one 4096 by 4096 matrix, in thousands of weights. **Drag the rank.**"
    view:
      type: bars
      max: 17000
      items:
        - { label: "full matrix", value: full, color: "#ef4444" }
        - { label: "LoRA update", value: low, color: "#1cd6ac" }
    sliders: [r]
    outro: "Rank {r} trains about **{pct} percent** of that matrix."

  - kind: code
    kicker: Write it
    title: "A LoRA layer"
    intro: "B starts at zero, so the model begins exactly as the original."
    lang: python
    code: |
      def matvec(M, x):
          return [sum(m * v for m, v in zip(row, x)) for row in M]

      def lora(W, A, B, x, alpha, r):
          base = matvec(W, x)
          delta = matvec(B, matvec(A, x))
          return [b + (alpha / r) * d for b, d in zip(base, delta)]

      W = [[1, 0], [0, 1]]
      A = [[1, 1]]
      zeros = [[0], [0]]
      assert lora(W, A, zeros, [2, 3], 8, 1) == [2, 3]
      B = [[1], [2]]
      assert lora(W, A, B, [2, 3], 1, 1) == [7, 13]
    note: "After training you can merge B A into W, so serving costs nothing extra."

  - kind: check
    kicker: Your turn
    title: "Why B starts at zero"
    question: "Why is B initialised to zeros?"
    options:
      - { text: "So training starts from the unchanged base model", correct: true, why: "The added path contributes nothing at first, which keeps early training stable." }
      - { text: "To save memory", why: "No." }
      - { text: "To make rank zero", why: "No." }
      - { text: "Because zeros are random", why: "No." }

  - kind: check
    kicker: Practice
    title: "Fine-tune or retrieve?"
    question: "You want a model to always reply in your company's tone and JSON shape. Best fit?"
    options:
      - { text: "LoRA fine-tuning on good examples", correct: true, why: "Tone and format are behaviour, which fine-tuning teaches well." }
      - { text: "Retrieval over documents", why: "That adds facts, not behaviour." }
      - { text: "Raise temperature", why: "No." }
      - { text: "Bigger vocabulary", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Fine-tuning to add facts.** Use retrieval for changing knowledge."
      - "**Tiny, messy data.** Quality of examples matters most."
      - "**No held-out test.** Check you did not make it worse elsewhere."
    next: { label: "Next: preference tuning", href: /learn/tr-preference-optimisation }
