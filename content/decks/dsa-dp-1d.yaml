id: dsa-dp-1d
title: "Dynamic programming: 1D"
minutes: 16
order: 125
params:
  - { id: s, label: "step", min: 0, max: 6, step: 1, init: 0 }
  - { id: n, label: "n", min: 5, max: 40, step: 1, init: 10 }
derived:
  - { id: naive, expr: "1.6 ^ n" }
  - { id: smart, expr: "n" }
cards:
  - kind: story
    kicker: Start here
    title: "Do not solve the same thing twice"
    body:
      - "**Dynamic programming** (DP) solves a big problem from answers to smaller ones, and **remembers** each answer so it is computed only once."
      - "Steps to apply it: define what `dp[i]` means, find how `dp[i]` comes from earlier entries, set the starting values, then fill in order."
    callout: "Clue words: how many ways, minimum cost, maximum profit, can you reach. If choices overlap and repeat, think DP."

  - kind: lab
    kicker: See it
    title: "Climbing stairs"
    intro: "You climb 1 or 2 steps at a time. `dp[i]` is the number of ways to reach step i. Ways to reach i = ways to reach i-1 plus ways to reach i-2. **Drag the step.**"
    view:
      type: array
      cells: [1, 1, 2, 3, 5, 8, 13]
      frames:
        - [1, "·", "·", "·", "·", "·", "·"]
        - [1, 1, "·", "·", "·", "·", "·"]
        - [1, 1, 2, "·", "·", "·", "·"]
        - [1, 1, 2, 3, "·", "·", "·"]
        - [1, 1, 2, 3, 5, "·", "·"]
        - [1, 1, 2, 3, 5, 8, "·"]
        - [1, 1, 2, 3, 5, 8, 13]
      frame: s
      pointers:
        - { label: "filling", at: "s", color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Base case: one way to stand at step 0 (do nothing)."
      - "Step 1: only one way (a single 1-step)."
      - "Step 2: 1 + 1 = **2** ways."
      - "Step 3: 1 + 2 = **3** ways."
      - "Step 4: 2 + 3 = **5** ways."
      - "Step 5: 3 + 5 = **8** ways."
      - "Step 6: 5 + 8 = **13** ways. Each cell used the two before it."
    saysAt: s

  - kind: lab
    kicker: Why remember
    title: "Repeating work explodes"
    intro: "Without memory the same sub-problems are recomputed again and again. **Drag n.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "without memory (roughly 1.6 to the n)", value: naive, color: "#ef4444" }
        - { label: "with memory (n steps)", value: smart, color: "#1cd6ac" }
    sliders: [n]
    outro: "At n = {n}, plain recursion does about **{naive}** calls. DP does {smart}."

  - kind: code
    kicker: Write it
    title: "Two ways to write it"
    intro: "**Top-down** is recursion plus a cache. **Bottom-up** fills a table from the base cases. Both give the same answer."
    lang: python
    code: |
      from functools import lru_cache

      def stairs_top_down(n):
          @lru_cache(maxsize=None)
          def go(i):
              if i <= 1:
                  return 1
              return go(i - 1) + go(i - 2)
          return go(n)

      def stairs_bottom_up(n):
          a, b = 1, 1                  # only the last two are needed
          for _ in range(n - 1):
              a, b = b, a + b
          return b if n > 0 else 1

      assert stairs_top_down(6) == 13
      assert stairs_bottom_up(6) == 13
      assert stairs_bottom_up(1) == 1 and stairs_bottom_up(0) == 1
    note: "Keeping only the last two values turns O(n) memory into O(1)."

  - kind: code
    kicker: Write it
    title: "House robber"
    intro: "You cannot rob two neighbours. `dp[i]` is the best loot using the first i houses: skip house i, or rob it plus the best up to i-2."
    lang: python
    code: |
      def rob(nums):
          prev, cur = 0, 0           # best up to i-2, best up to i-1
          for x in nums:
              prev, cur = cur, max(cur, prev + x)
          return cur

      assert rob([1, 2, 3, 1]) == 4
      assert rob([2, 7, 9, 3, 1]) == 12
      assert rob([]) == 0
    note: "Pattern: each state decides between two choices using earlier states."

  - kind: code
    kicker: Write it
    title: "Coin change (minimum coins)"
    intro: "`dp[a]` is the fewest coins to make amount a. Try every coin: `dp[a] = 1 + dp[a - coin]`."
    lang: python
    code: |
      def coin_change(coins, amount):
          INF = float("inf")
          dp = [0] + [INF] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a and dp[a - c] + 1 < dp[a]:
                      dp[a] = dp[a - c] + 1
          return dp[amount] if dp[amount] != INF else -1

      assert coin_change([1, 3, 4], 6) == 2     # greedy gets 3
      assert coin_change([2], 3) == -1
      assert coin_change([1], 0) == 0
    note: "O(amount times coins). This is the example where greedy fails."

  - kind: check
    kicker: Your turn
    title: "Pick the recurrence"
    question: "In house robber, `dp[i] = max(dp[i-1], dp[i-2] + nums[i])`. What does `dp[i-1]` stand for?"
    options:
      - { text: "Skipping house i", correct: true, why: "If you skip it, the best loot is whatever was possible up to the previous house." }
      - { text: "Robbing house i", why: "Robbing uses dp[i-2] plus its value." }
      - { text: "Robbing every house", why: "Neighbours cannot both be robbed." }
      - { text: "The base case", why: "Base cases are the first values." }

  - kind: practice
    kicker: Your turn
    title: "Climb the stairs"
    intro: "You climb 1 or 2 steps at a time. Write `ways(n)` returning how many different ways reach step n. Each answer is the sum of the two before it."
    entry: ways
    starter: |
      def ways(n):
          pass
    solution: |
      def ways(n):
          a, b = 1, 1
          for _ in range(n - 1):
              a, b = b, a + b
          return b
    tests:
      - { input: "[1]", expected: "1" }
      - { input: "[2]", expected: "2" }
      - { input: "[5]", expected: "8" }
      - { input: "[10]", expected: "89" }
    hint: "ways(n) = ways(n-1) + ways(n-2)."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Unclear state.** Write one sentence: dp[i] means ..."
      - "**Wrong base case.** Test n = 0 and n = 1 by hand."
      - "**Wrong order.** Fill so that earlier entries exist when you need them."
      - "**Forgetting the unreachable case.** Use infinity, then convert to -1."
    next: { label: "Next: dynamic programming 2D", href: /learn/dsa-dp-2d }
