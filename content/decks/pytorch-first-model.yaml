id: pytorch-first-model
title: Your first PyTorch model
order: 19
minutes: 10
params:
  - { id: w, label: "weight w", min: -1, max: 4, step: 0.1, init: 0 }
  - { id: lr, label: "learning rate", min: 0.01, max: 0.2, step: 0.01, init: 0.05 }
derived:
  - { id: loss, expr: "(w - 2) ^ 2 * 14 / 3" }
  - { id: grad, expr: "28 * (w - 2) / 3" }
cards:
  - kind: story
    kicker: Start here
    title: PyTorch does the calculus for you
    body:
      - "Last lesson you computed each blame number by hand. **PyTorch** is a library that does it automatically. You write the forward steps and it works out every gradient."
      - "Its main object is the **tensor**, a NumPy-style array that remembers how it was made so it can walk backwards."
    callout: "You write forward. PyTorch writes backward."

  - kind: code
    kicker: Read it
    title: The whole training loop
    intro: "We teach one weight w so that w × x matches y. The true answer is w = 2. Read the loop top to bottom: it is **the same five steps, every time**."
    lang: python
    code: |
      import torch

      x = torch.tensor([1., 2., 3.])
      y = torch.tensor([2., 4., 6.])
      w = torch.tensor(0., requires_grad=True)   # a knob to learn
      opt = torch.optim.SGD([w], lr=0.05)

      for step in range(20):
          pred = w * x                     # 1. forward
          loss = ((pred - y) ** 2).mean()  # 2. how wrong
          opt.zero_grad()                  # 3. clear old gradients
          loss.backward()                  # 4. backward: fill w.grad
          opt.step()                       # 5. nudge w downhill
    note: "`requires_grad=True` tells PyTorch to track w. After `backward()`, the blame sits in `w.grad`."

  - kind: lab
    kicker: See it first
    title: Run the loop, one step at a time
    intro: "This is the exact loop above. The curve is the loss for each value of w, and the orange line is its slope, the **gradient**. Press **Take a step** to run one pass of the loop."
    view: { type: curve, fn: "(t - 2) ^ 2 * 14 / 3", min: -1, max: 5, yMin: 0, yMax: 45, point: w, slope: grad, xLabel: w, yLabel: loss }
    sliders: [w, lr]
    action:
      label: "Take a step"
      set: { w: "w - rate * grad" }
      rate: lr
      track: loss
      hint: "Press it about ten times. The loss falls and w creeps toward 2. Then set the learning rate to 0.2 and watch w overshoot."
    outro: "Now w = **{w}**, the gradient is **{grad}** and the loss is **{loss}**. A gradient of 0 means the bottom of the bowl."

  - kind: formula
    kicker: Read the formula
    title: What opt.step does
    tex: "w \\leftarrow w - \\eta \\cdot \\frac{\\partial L}{\\partial w}"
    say: "Take the current weight, subtract the learning rate times the gradient, and store the result as the new weight. That single line is gradient descent."
    verify:
      - { expr: "w - lr * grad", equals: 0.9333, tol: 0.01 }
      - { expr: "loss", equals: 18.6667, tol: 0.01 }
      - { expr: "grad", equals: -18.6667, tol: 0.01 }
    symbols:
      - { tex: "w", means: "the weight, the knob being learned", value: w }
      - { tex: "\\eta", means: "the learning rate: how big each nudge is", value: lr }
      - { tex: "\\frac{\\partial L}{\\partial w}", means: "the gradient: how fast the loss changes as w changes, found by backward()", value: grad }
      - { tex: "\\leftarrow", means: "replace the left side with the right side" }

  - kind: check
    kicker: Check yourself
    title: Order matters
    question: "You forget `opt.zero_grad()` inside the loop. What happens?"
    options:
      - { text: "Gradients pile up across steps, so the updates are wrong", correct: true, why: "backward() adds into w.grad. Without clearing it, old blame is mixed with new." }
      - { text: "Nothing, PyTorch clears it by itself", why: "PyTorch does not clear gradients on its own. You must do it each step." }
      - { text: "The loss becomes exactly 0", why: "The loss is unaffected. The gradient used for the update is the broken part." }

  - kind: code
    kicker: In practice
    title: Real models use nn.Module
    intro: "A single weight is a toy. In real code you describe layers and PyTorch collects every weight for the optimizer."
    lang: python
    code: |
      model = torch.nn.Sequential(
          torch.nn.Linear(2, 4),   # 2 inputs -> 4 neurons
          torch.nn.ReLU(),         # the bend
          torch.nn.Linear(4, 1),   # 4 neurons -> 1 output
      )
      opt = torch.optim.Adam(model.parameters(), lr=0.01)
      # the loop is identical: forward, loss, zero_grad, backward, step
    note: "`model.parameters()` hands the optimizer every weight and bias at once."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Forgetting zero_grad.** Gradients accumulate, so training behaves strangely."
      - "**Evaluating without no_grad.** Wrap checks in `torch.no_grad()` so PyTorch does not track work it will never differentiate."
      - "**Wrong tensor shapes.** Print `x.shape` often. Most early errors are a shape that is off by one dimension."
    next: { label: "Next: embeddings and similarity", href: /learn/embeddings-and-cosine-similarity }
