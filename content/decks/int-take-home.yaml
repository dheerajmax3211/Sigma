id: int-take-home
title: "The take-home project"
minutes: 11
order: 219
params:
  - { id: h, label: "hours spent", min: 1, max: 12, step: 1, init: 4 }
derived:
  - { id: tests, expr: "min(100, h * 12)" }
  - { id: docs, expr: "min(100, h * 20)" }
cards:
  - kind: story
    kicker: Start here
    title: "A small project, graded closely"
    body:
      - "Many companies send a take-home: build a small API, a data pipeline or an AI feature in a few days. They read the code the way they would read a teammate's pull request."
      - "A **small, clean, tested** project beats a big, messy one. Stay inside the time they suggest."
    callout: "Treat the README as part of the answer. It is what they read first."

  - kind: lab
    kicker: See it
    title: "Where the hours go"
    intro: "More time is not always better. Spend it in this order. **Drag the hours.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "core feature working", value: "100", color: "#1cd6ac" }
        - { label: "tests", value: tests, color: "#38bdf8" }
        - { label: "README and notes", value: docs, color: "#f97316" }
    sliders: [h]
    outro: "At {h} hours you can cover the feature, **{tests} percent** of a sensible test set and **{docs} percent** of the notes. Extras come last."

  - kind: lab
    kicker: Memorise
    title: "A submission checklist"
    intro: "Run through this before you send."
    view:
      type: flow
      stages:
        - { label: "Runs from scratch", note: "A new clone starts with two commands.", color: "#38bdf8" }
        - { label: "Tests pass", note: "Include the command to run them.", color: "#1cd6ac" }
        - { label: "README", note: "What it does, how to run, trade-offs, next steps.", color: "#f97316" }
        - { label: "Clean history", note: "No secrets, no dead code, clear commits.", color: "#a78bfa" }

  - kind: code
    kicker: Write it
    title: "A README skeleton"
    intro: "Short and honest. Name what you left out and why."
    lang: text
    code: |
      # Project name
      One sentence: what it does.

      ## Run it
      pip install -r requirements.txt
      pytest
      uvicorn app:app

      ## Design choices
      Why this structure, and one trade-off I made.

      ## Not done
      Auth and pagination, skipped to stay within the time limit.
      With more time: rate limiting and a proper vector index.
    note: "Admitting what is missing reads as maturity, not weakness."

  - kind: check
    kicker: Your turn
    title: "Scope"
    question: "You have 4 hours but a long wish list. What do you do?"
    options:
      - { text: "Finish the core well, test it, and list the rest as next steps", correct: true, why: "Finished and clear beats half-built and broad." }
      - { text: "Start every feature", why: "Nothing will be finished." }
      - { text: "Skip tests to add features", why: "Tests signal quality." }
      - { text: "Work 20 hours and mention it", why: "They asked for a time limit." }

  - kind: check
    kicker: Practice
    title: "Secrets"
    question: "Your project calls an AI API with a key. How do you submit it?"
    options:
      - { text: "Read the key from an environment variable and give an example file", correct: true, why: "Keys in code get leaked and show poor habits." }
      - { text: "Paste the key in the code", why: "A security mistake." }
      - { text: "Email the key with the code", why: "Still exposed." }
      - { text: "Remove AI from the project", why: "Unneeded." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**No README.** It is the first thing they open."
      - "**Over-building.** Respect the time budget."
      - "**Committed secrets.** Use environment variables."
      - "**Untested.** Add at least a few meaningful tests."
    next: { label: "Next: negotiation and the offer", href: /learn/int-offer-negotiation }
