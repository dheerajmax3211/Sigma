id: "fd-numerical-stability"
title: "Numerical stability"
minutes: 13
order: 705
params:
  - { id: "x", label: "logit gap", min: -10, max: 10, step: 0.5, init: 3 }
derived:
  - { id: "p", expr: "100 * exp(x) / (exp(x) + 1)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Computers have limits"
    body:
      - "A computer stores numbers in a fixed number of bits. Very large values overflow and become infinity. Very small ones underflow to zero. A formula that is correct on paper can still return NaN."
      - "The fix is to rearrange the maths so the numbers stay in range. The classic example is softmax."
    callout: "Subtract the maximum before you exponentiate."
  - kind: "lab"
    kicker: "See it"
    title: "A saturating curve"
    intro: "The chance for the first class depends on the gap between two logits. **Drag the gap.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "chance of the first class", value: "p", color: "#1cd6ac" }
        - { label: "chance of the second class", value: "100 - p", color: "#38bdf8" }
    sliders:
      - "x"
    outro: "A gap of {x} gives **{p} percent**. Large gaps saturate. The exponential of a big gap overflows, so code never computes it directly."
  - kind: "code"
    kicker: "Write it"
    title: "Stable softmax"
    intro: "Subtracting the maximum changes nothing mathematically and keeps every exponent at most zero."
    lang: "python"
    code: |
      import math

      def softmax_naive(z):
          e = [math.exp(v) for v in z]
          return [v / sum(e) for v in e]

      def softmax(z):
          m = max(z)
          e = [math.exp(v - m) for v in z]
          s = sum(e)
          return [v / s for v in e]

      def logsumexp(z):
          m = max(z)
          return m + math.log(sum(math.exp(v - m) for v in z))

      try:
          softmax_naive([1000, 1000])
          failed = False
      except OverflowError:
          failed = True
      assert failed

      assert softmax([1000, 1000]) == [0.5, 0.5]
      assert abs(logsumexp([1000, 1000]) - (1000 + math.log(2))) < 1e-9
    note: "Frameworks already do this. Know it so you can read a NaN."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where NaN comes from"
    intro: "The usual suspects."
    view:
      type: "flow"
      stages:
        - { label: "Log of zero", note: "Add a tiny epsilon or use log-softmax.", color: "#ef4444" }
        - { label: "Divide by zero", note: "Norms and variances. Add epsilon.", color: "#f97316" }
        - { label: "Overflow", note: "Exponentials of big numbers. Subtract the max.", color: "#38bdf8" }
        - { label: "Large learning rate", note: "Weights blow up, then everything is NaN.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why subtract the max"
    question: "Why does subtracting the largest logit leave softmax unchanged?"
    options:
      - { text: "It divides top and bottom by the same factor", correct: true, why: "The shift cancels out." }
      - { text: "It changes the order of classes", why: "Order is the same." }
      - { text: "It removes small values", why: "No." }
      - { text: "It normalises the batch", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "NaN loss"
    question: "Your loss turns to NaN. Which is the first thing to check?"
    options:
      - { text: "Learning rate, and logs or divisions of zero", correct: true, why: "Those cause most NaNs." }
      - { text: "The font", why: "No." }
      - { text: "The batch order", why: "Rarely." }
      - { text: "The number of classes", why: "Rarely." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Computing softmax then log.** Use log-softmax."
      - "**Comparing floats with equals.** Use a tolerance."
      - "**Ignoring half precision limits.** Overflow comes sooner."
    next: { label: "Next: maximum likelihood", href: "/learn/fd-mle-cross-entropy" }
