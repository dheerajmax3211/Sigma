id: "sd-vector-database"
title: "Vector databases at scale"
minutes: 14
order: 607
params:
  - { id: "nprobe", label: "clusters searched out of 100", min: 1, max: 100, step: 1, init: 5 }
derived:
  - { id: "speed", expr: "100 / nprobe" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Nearest neighbour, without scanning everything"
    body:
      - "A vector database finds the stored vectors closest to a query. Comparing against every vector is too slow once there are millions."
      - "So it uses an **approximate** index. One kind groups vectors into clusters and searches only the nearest few. You trade a little accuracy for a large speed gain."
    callout: "Recall against speed is the dial you tune."
  - kind: "lab"
    kicker: "See it"
    title: "Search fewer clusters"
    intro: "Say 100 clusters hold equal shares. Searching only some scans less data. **Drag the count.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "share of data scanned (percent)", value: "nprobe", color: "#f97316" }
        - { label: "speed up against a full scan (times)", value: "speed", color: "#1cd6ac" }
    sliders:
      - "nprobe"
    outro: "Searching {nprobe} of 100 clusters scans **{nprobe} percent** of the data, about **{speed} times** faster than a full scan. The cost is missed neighbours."
  - kind: "code"
    kicker: "Write it"
    title: "A toy cluster index"
    intro: "Vectors are grouped by nearest centre. A query searches the nearest nprobe groups."
    lang: "python"
    code: |
      def build(centres, vecs):
          lists = {c: [] for c in centres}
          for v in vecs:
              lists[min(centres, key=lambda c: abs(v - c))].append(v)
          return lists

      def search(lists, q, nprobe):
          near = sorted(lists, key=lambda c: abs(q - c))[:nprobe]
          pool = [v for c in near for v in lists[c]]
          return min(pool, key=lambda v: abs(v - q))

      idx = build([0, 10], [1, 2, 9, 11])
      assert search(idx, 4.5, 1) == 2
      assert search(idx, 5.2, 1) == 9      # missed the true nearest, 2
      assert search(idx, 5.2, 2) == 2      # searching more clusters finds it
    note: "This is the miss that approximate search accepts. Measure recall against exact search on a sample."
  - kind: "lab"
    kicker: "Memorise"
    title: "Beyond the index"
    intro: "A production system also needs these."
    view:
      type: "flow"
      stages:
        - { label: "Filters", note: "Search only vectors with this tenant or date. Hard to combine with the index.", color: "#ef4444" }
        - { label: "Hybrid", note: "Mix keyword and vector scores for better results.", color: "#38bdf8" }
        - { label: "Updates", note: "New vectors arrive constantly. Indexes need merging.", color: "#f97316" }
        - { label: "Shards", note: "Split the index and merge results from each.", color: "#1cd6ac" }
  - kind: "check"
    kicker: "Your turn"
    title: "Recall"
    question: "You lower nprobe to speed up search and answers get worse. Why?"
    options:
      - { text: "True neighbours sit in clusters you skipped", correct: true, why: "Fewer clusters means a lower recall." }
      - { text: "The vectors changed", why: "They did not." }
      - { text: "The database lost data", why: "No." }
      - { text: "Distances became negative", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Filtering"
    question: "A query asks for the nearest vectors for one customer only. What is the risk of filtering after the search?"
    options:
      - { text: "Most results belong to others and few remain", correct: true, why: "Filter during the search or index per tenant." }
      - { text: "It is always exact", why: "It can return too few." }
      - { text: "It is faster", why: "It wastes work." }
      - { text: "Nothing", why: "There is a real risk." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Never measuring recall.** You cannot tune what you do not measure."
      - "**Post-filtering.** You can end up with empty results."
      - "**Changing the embedding model without reindexing.** Old and new vectors do not compare."
    next: { label: "Next: LLM serving", href: "/learn/sd-llm-serving" }
