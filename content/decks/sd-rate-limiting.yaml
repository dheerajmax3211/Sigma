id: "sd-rate-limiting"
title: "Rate limiting and load balancing"
minutes: 12
order: 603
params:
  - { id: "rate", label: "tokens added per second", min: 1, max: 20, step: 1, init: 5 }
  - { id: "burst", label: "bucket size", min: 1, max: 100, step: 1, init: 20 }
derived:
  - { id: "allowed", expr: "burst + rate * 10" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Protect the service from its own users"
    body:
      - "A **rate limiter** caps how many requests one client may send. It stops abuse, keeps one user from starving others, and protects costly calls such as model inference."
      - "A **load balancer** spreads traffic across servers and skips the ones that are down."
    callout: "Say no early and cheaply, before the expensive work."
  - kind: "lab"
    kicker: "See it"
    title: "A token bucket"
    intro: "A bucket fills at a steady rate up to a limit. Each request takes a token. **Drag the sliders.**"
    view:
      type: "bars"
      max: 300
      items:
        - { label: "requests allowed in the first 10 seconds", value: "allowed", color: "#1cd6ac" }
        - { label: "requests allowed in a 1 second burst", value: "burst", color: "#38bdf8" }
    sliders:
      - "rate"
      - "burst"
    outro: "With {rate} tokens a second and a bucket of {burst}, a client may send **{allowed}** requests in 10 seconds, but only {burst} at once."
  - kind: "code"
    kicker: "Write it"
    title: "A token bucket"
    intro: "Time is passed in so the code is easy to test."
    lang: "python"
    code: |
      class Bucket:
          def __init__(self, rate, cap):
              self.rate, self.cap, self.tokens, self.t = rate, cap, cap, 0.0

          def allow(self, now):
              self.tokens = min(self.cap, self.tokens + (now - self.t) * self.rate)
              self.t = now
              if self.tokens >= 1:
                  self.tokens -= 1
                  return True
              return False

      b = Bucket(rate=1, cap=2)
      assert [b.allow(0), b.allow(0), b.allow(0)] == [True, True, False]
      assert b.allow(1) is True
      assert b.allow(1) is False

      def round_robin(servers, i):
          return servers[i % len(servers)]

      assert [round_robin(["a", "b", "c"], i) for i in range(4)] == ["a", "b", "c", "a"]
    note: "In a real system the bucket lives in Redis, keyed by client."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where limits go"
    intro: "Layer them."
    view:
      type: "flow"
      stages:
        - { label: "Edge", note: "Cheap limits per IP at the gateway.", color: "#38bdf8" }
        - { label: "Per user", note: "Plan limits kept in a shared store.", color: "#1cd6ac" }
        - { label: "Per cost", note: "Model calls limited by tokens, not requests.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why a bucket"
    question: "Why allow short bursts instead of a strict one per second?"
    options:
      - { text: "Real traffic is bursty and bursts are harmless if bounded", correct: true, why: "The bucket allows a burst, then a steady rate." }
      - { text: "It is easier to code", why: "Both are easy." }
      - { text: "It saves memory", why: "No." }
      - { text: "It blocks everyone", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "A 429"
    question: "A client gets a 429 response. What should a polite client do?"
    options:
      - { text: "Wait and retry with backoff", correct: true, why: "Respect the retry hint and slow down." }
      - { text: "Retry instantly in a loop", why: "That makes it worse." }
      - { text: "Give up forever", why: "Limits reset." }
      - { text: "Switch to a new key", why: "That evades the limit." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Limiting in each app server alone.** Clients get a different limit per server."
      - "**Counting requests for LLM calls.** Count tokens."
      - "**No retry hint.** Return how long to wait."
    next: { label: "Next: feature stores", href: "/learn/sd-feature-store" }
