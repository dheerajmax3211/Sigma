id: overfitting-and-validation
title: Overfitting and validation
order: 15
minutes: 9
params:
  - { id: c, label: "model complexity", min: 1, max: 10, step: 1, init: 3 }
  - { id: n, label: "training examples", min: 20, max: 200, step: 10, init: 20 }
derived:
  - { id: train, expr: "10 / (c + 1)" }
  - { id: gap, expr: "0.08 * c ^ 2 * 20 / n" }
  - { id: val, expr: "train + gap" }
cards:
  - kind: story
    kicker: Start here
    title: Memorising is not learning
    body:
      - "A student gets last year's exam and learns every answer by heart. They score 100% on that paper and fail the new one. They **memorised** instead of learning the idea."
      - "Models do the same. A very flexible model can fit its training data perfectly, noise and all, and then do badly on data it has never seen."
    callout: "Judge a model on data it has never seen."

  - kind: lab
    kicker: See it first
    title: More knobs, then worse on new data
    intro: "Slide the complexity. Training error always falls. But the curve shows error on **new** data, and it falls, then rises again. These numbers are illustrative."
    view: { type: curve, fn: "10 / (t + 1) + 0.08 * t ^ 2 * 20 / n", min: 1, max: 10, yMin: 0, yMax: 9, point: c, xLabel: complexity, yLabel: "validation error" }
    also:
      type: bars
      max: 10
      items:
        - { label: "training error", value: train, color: "#38bdf8" }
        - { label: "validation error", value: val, color: "#f59e0b" }
        - { label: "gap", value: gap, color: "#ef4444" }
    sliders: [c]
    outro: "At complexity {c}: training error {train}, validation error {val}. A gap of {gap} means the model is partly memorising."

  - kind: formula
    kicker: Read the formula
    title: The generalisation gap
    tex: "\\text{gap} = E_{\\text{val}} - E_{\\text{train}}"
    say: "Take the error on data the model never saw, and subtract the error on the data it trained on. A big gap means memorising instead of learning."
    verify:
      - { expr: "val - train", equals: 0.72, tol: 0.01 }
      - { expr: "val", equals: 3.22, tol: 0.01 }
      - { expr: "train", equals: 2.5, tol: 0.01 }
    symbols:
      - { tex: "\\text{gap}", means: "how much worse the model does on new data", value: gap }
      - { tex: "E_{\\text{val}}", means: "error on the validation set, which the model never trained on", value: val }
      - { tex: "E_{\\text{train}}", means: "error on the training set, which it did train on", value: train }

  - kind: check
    kicker: Check yourself
    title: Diagnose the model
    question: "A model scores 99% on its training data but 70% on held-out validation data. What is happening?"
    options:
      - { text: "It is overfitting: it memorised the training set", correct: true, why: "A large gap between training and validation scores is the sign of memorising." }
      - { text: "It is underfitting: it is too simple", why: "An underfit model scores badly on both sets, not 99% on one." }
      - { text: "It is working well, because 99% is what counts", why: "Only the held-out score tells you how it will do on new data." }

  - kind: lab
    kicker: Try it
    title: More data closes the gap
    intro: "Same model, more training examples. With few examples the model can memorise them. With many it cannot, so the gap shrinks. **Drag** both sliders."
    view:
      type: bars
      max: 10
      items:
        - { label: "training error", value: train, color: "#38bdf8" }
        - { label: "validation error", value: val, color: "#f59e0b" }
        - { label: "gap", value: gap, color: "#ef4444" }
    sliders: [c, n]
    outro: "With {n} examples and complexity {c} the gap is **{gap}**."

  - kind: story
    kicker: What to do
    title: Three ways to fight overfitting
    body:
      - "**More data** makes memorising harder. **Regularisation** adds a penalty for wild knob values, so the model stays simple."
      - "**Early stopping** halts training when validation error starts to rise. Always split your data: train on one part, check on another."
    callout: "A held-out set is the honest judge."

  - kind: check
    kicker: Check yourself
    title: Pick the remedy
    question: "Which of these helps against overfitting?"
    options:
      - { text: "Collect more training examples", correct: true, why: "More data makes memorising harder, so the gap shrinks." }
      - { text: "Train on the validation set too", why: "Then you have no honest score. Validation data must stay unseen." }
      - { text: "Add many more knobs", why: "More complexity usually widens the gap." }

  - kind: practice
    kicker: Your turn
    title: "Split the data"
    intro: "Write `split(n, val_every)` returning `[train_indices, val_indices]` for the numbers `0..n-1`. Every `val_every`-th item (starting at index 0) is for validation, and the rest are for training."
    entry: split
    starter: |
      def split(n, val_every):
          pass
    solution: |
      def split(n, val_every):
          val = [i for i in range(n) if i % val_every == 0]
          train = [i for i in range(n) if i % val_every != 0]
          return [train, val]
    tests:
      - { input: "[6, 3]", expected: "[[1, 2, 4, 5], [0, 3]]" }
      - { input: "[5, 2]", expected: "[[1, 3], [0, 2, 4]]" }
      - { input: "[1, 5]", expected: "[[], [0]]" }
    hint: "Use the remainder operator to decide which list an index goes in."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Testing on training data.** A model always looks good on data it has seen. Keep a held-out set."
      - "**Tuning on the test set.** If you adjust until the test score is high, it stops being honest. Tune on validation and test once at the end."
      - "**Chasing 100% training accuracy.** That is usually memorising, not learning."
    next: { label: "Next: classification and the sigmoid", href: /learn/classification-and-logistic }
