id: mock-interview-drills
title: Mock interview drills
order: 47
minutes: 10
params:
  - { id: secs, label: "seconds you speak", min: 20, max: 180, step: 10, init: 60 }
derived:
  - { id: words, expr: "secs * 130 / 60" }
  - { id: ideas, expr: "floor(words / 25)" }
cards:
  - kind: story
    kicker: Start here
    title: Say it out loud
    body:
      - "Knowing a concept and explaining it live are different skills. In an interview you have one minute and a person watching your face."
      - "So practise **out loud**, with a timer. Explain simply, then use your own project as the example."
    callout: "If you cannot say it, you do not own it yet."

  - kind: lab
    kicker: See it first
    title: What fits in a minute
    intro: "People speak about 130 words a minute. A clear idea needs roughly 25 words. Use the time on a few ideas, not all of them. **Drag the time.**"
    view:
      type: bars
      max: 400
      items:
        - { label: "words you can say", value: words, color: "#38bdf8" }
        - { label: "seconds you speak", value: secs, color: "#64748b" }
    also:
      type: bars
      max: 16
      items:
        - { label: "ideas that fit", value: ideas, color: "#1cd6ac" }
        - { label: "minutes you speak", value: "secs / 60", color: "#f59e0b" }
    sliders: [secs]
    outro: "In {secs} seconds you can say about **{words}** words, which is room for **{ideas}** clear ideas. Pick them before you start."

  - kind: formula
    kicker: Read the formula
    title: Ideas in your answer
    tex: "k = \\left\\lfloor \\frac{130 \\cdot s / 60}{25} \\right\\rfloor"
    say: "Seconds s times 130 words a minute, divided by 60, gives your words. Divide by 25 words per idea and round down."
    verify:
      - { expr: "words", equals: 130, tol: 0.01 }
      - { expr: "ideas", equals: 5, tol: 0.01 }
      - { expr: "floor(90 * 130 / 60 / 25)", equals: 7, tol: 0.01 }
    symbols:
      - { tex: "k", means: "clear ideas that fit in your answer", value: ideas }
      - { tex: "s", means: "seconds you speak", value: secs }
      - { tex: "130", means: "words a minute, a comfortable speaking pace" }
      - { tex: "25", means: "words one clear idea needs, assumed here" }

  - kind: check
    kicker: Drill one
    title: Explain overfitting
    question: "Explain overfitting in one minute. Which answer is best?"
    options:
      - { text: "It is when a model memorises training data, so it scores well there but poorly on new data. I catch it by checking a held-out validation set.", correct: true, why: "It defines the term, says why it matters and names how you detect it, in two sentences." }
      - { text: "It is when the model fits too much", why: "It is short and vague. It never says what it fits, or how you notice." }
      - { text: "It relates to the bias-variance decomposition of expected generalisation error", why: "It may be right, but jargon with no plain explanation loses the listener." }

  - kind: check
    kicker: Drill two
    title: RAG or fine-tuning
    question: "A company wants answers from its changing policy documents. What do you recommend, and why?"
    options:
      - { text: "RAG, because the documents change often and retrieval lets answers cite the current text", correct: true, why: "It gives a clear choice, a reason tied to the problem and a trade-off." }
      - { text: "Fine-tuning, because it is more advanced", why: "Fine-tuning bakes knowledge into weights, which is slow to update. Advanced is not a reason." }
      - { text: "Either one works the same way", why: "A senior answer compares trade-offs. It does not shrug." }

  - kind: check
    kicker: Drill three
    title: When you do not know
    question: "An interviewer asks about a tool you have never used. What is the best reply?"
    options:
      - { text: "I have not used it, but here is how I would find out, and a similar tool I know", correct: true, why: "It is honest, shows how you learn and links to what you do know." }
      - { text: "Make up a confident answer", why: "Interviewers probe, and a bluff is easy to catch and costs trust." }
      - { text: "Say nothing and wait", why: "Silence tells them nothing. Show your thinking." }

  - kind: check
    kicker: Drill four
    title: Your project's trade-off
    question: "Why did you choose a chunk size of 300 words in your project?"
    options:
      - { text: "I tried 150, 300 and 600 on my 40-case eval, and 300 gave the best recall", correct: true, why: "A choice backed by your own measurement is the strongest kind of answer." }
      - { text: "It was the default in the tutorial", why: "It shows you did not question the choice." }
      - { text: "It felt about right", why: "A feeling is not evidence. Use your eval." }

  - kind: mistakes
    kicker: Checklist
    title: Your last week
    items:
      - "**Record yourself.** Answer five questions on your phone, listen back, and cut the rambling."
      - "**Have three project stories.** A problem solved, a trade-off, and a failure with what you learned."
      - "**Ask questions back.** What does the team measure, and how do they ship models?"
      - "**Sleep.** A rested mind beats one more night of cramming."
    next: { label: "All lessons", href: /learn }
