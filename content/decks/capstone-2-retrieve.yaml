id: capstone-2-retrieve
title: "DocChat stage 2: find the right chunks"
order: 1102
minutes: 18
params:
  - { id: k, label: "chunks sent", min: 1, max: 10, step: 1, init: 4 }
  - { id: tok, label: "tokens per chunk", min: 100, max: 500, step: 100, init: 300 }
derived:
  - { id: ctx, expr: "k * tok" }
cards:
  - kind: story
    kicker: "Capstone, week 5"
    title: "Search before you ask"
    body:
      - "Stage 1 gave you chunks. Now the app must pick the few that matter for a question. Sending everything is slow and buries the answer."
      - "**Stage 2**: turn text into counts, score each chunk against the question with cosine similarity, and keep the top few."

  - kind: lab
    kicker: See it first
    title: "The context budget"
    intro: "Every chunk you send uses part of the model's context. **Drag the sliders** and watch the prompt grow."
    view:
      type: bars
      max: 5000
      items:
        - { label: "tokens in the prompt", value: ctx, color: "#a78bfa" }
        - { label: "a 4000 token budget", value: "4000", color: "#64748b" }
    sliders: [k, tok]
    outro: "{k} chunks of {tok} tokens use **{ctx}** tokens. Past the budget you must send fewer or smaller chunks, so good ranking matters."

  - kind: code
    kicker: Starter code
    title: "The project so far"
    intro: "Add this helper to `docchat.py`. It turns text into word counts."
    lang: python
    code: |
      from collections import Counter

      def embed(text):
          return Counter(text.lower().split())

      assert embed("Cat cat dog") == {"cat": 2, "dog": 1}
      print(embed("the cat sat"))
    note: "This bag of words is crude, but it is real search and you can swap in a model later."

  - kind: practice
    kicker: Add this to your project
    title: "Score two texts"
    intro: "Write `cosine(a, b)` for two word-count dicts. It is the dot product divided by the two lengths. Return 0.0 if either is empty, and round to 3 places."
    entry: cosine
    starter: |
      def cosine(a, b):
          pass
    solution: |
      def cosine(a, b):
          dot = sum(v * b.get(w, 0) for w, v in a.items())
          na = sum(v * v for v in a.values()) ** 0.5
          nb = sum(v * v for v in b.values()) ** 0.5
          return round(dot / (na * nb), 3) if na and nb else 0.0
    tests:
      - { input: "[{\"a\":1,\"b\":1},{\"a\":1}]", expected: "0.707" }
      - { input: "[{\"a\":1},{\"b\":1}]", expected: "0.0" }
      - { input: "[{\"a\":2},{\"a\":5}]", expected: "1.0" }
      - { input: "[{},{\"a\":1}]", expected: "0.0" }
    hint: "Only words that appear in both add to the dot product."

  - kind: practice
    kicker: Add this to your project
    title: "Pick the top chunks"
    intro: "Write `top_k(question, chunks, k)` returning the indices of the k best chunks, best first. Count words (lowercase), score with cosine, and break ties by lower index."
    entry: top_k
    starter: |
      def top_k(question, chunks, k):
          pass
    solution: |
      def top_k(question, chunks, k):
          def emb(t):
              d = {}
              for w in t.lower().split():
                  d[w] = d.get(w, 0) + 1
              return d
          def cos(a, b):
              dot = sum(v * b.get(w, 0) for w, v in a.items())
              na = sum(v * v for v in a.values()) ** 0.5
              nb = sum(v * v for v in b.values()) ** 0.5
              return dot / (na * nb) if na and nb else 0.0
          q = emb(question)
          scored = sorted(range(len(chunks)), key=lambda i: (-cos(q, emb(chunks[i])), i))
          return scored[:k]
    tests:
      - { input: "[\"cat food\",[\"dog park\",\"cat food bowl\",\"fish tank\"],1]", expected: "[1]" }
      - { input: "[\"dog\",[\"dog park\",\"dog dog\",\"cat\"],2]", expected: "[1,0]" }
      - { input: "[\"x\",[\"a\",\"b\"],5]", expected: "[0,1]" }
    hint: "Sort the chunk numbers by score, highest first, then slice k."

  - kind: check
    kicker: Check yourself
    title: "Why top few"
    question: "A user's question matches 200 chunks a little. What do you send the model?"
    options:
      - { text: "The few highest scoring chunks", correct: true, why: "A short, relevant context gives a sharper answer and costs less." }
      - { text: "All 200, to be safe", why: "It overflows the budget and hides the useful part." }
      - { text: "One random chunk", why: "Random text will not contain the answer." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Ignoring ties.** Same score twice must give the same order every run."
      - "**Too many chunks.** More context is not better once the answer is already in it."
      - "**No test on real questions.** Try five questions you know the answer to."
    next: { label: "Next: stage 3", href: "/learn/capstone-3-trust" }
