id: tool-calling
title: Tool calling
order: 25
minutes: 10
params:
  - { id: tools, label: "tools offered", min: 1, max: 10, step: 1, init: 3 }
  - { id: ncalls, label: "tool calls needed", min: 1, max: 4, step: 1, init: 1 }
derived:
  - { id: menu, expr: "tools * 120" }
  - { id: trips, expr: "ncalls + 1" }
  - { id: extra, expr: "menu * trips" }
cards:
  - kind: story
    kicker: Start here
    title: A model cannot check the weather
    body:
      - "A model only knows its training text. It cannot see today's weather or your database. But it can **ask you** to look something up."
      - "You hand it a menu of **tools**, which are your own functions. The model picks one and names the arguments. **You** run it and report back."
    callout: "The model asks. Your code acts."

  - kind: lab
    kicker: See it first
    title: One round trip
    intro: "Follow a question through the loop. The model never runs code itself. Each trip re-sends the **tool menu**, so more tools and more calls cost more input tokens. **Drag the sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. You ask", note: "question plus a menu of {tools} tools", color: "#38bdf8" }
        - { label: "2. Model picks", note: "replies with a tool name and arguments, no answer yet", color: "#a78bfa" }
        - { label: "3. Your code runs it", note: "your function does the real work", color: "#f59e0b" }
        - { label: "4. You send the result", note: "the menu goes along again, **{trips}** model calls in all", color: "#ef4444" }
        - { label: "5. Model answers", note: "writes the final reply using the result", color: "#1cd6ac" }
    sliders: [tools, ncalls]
    outro: "The menu adds about **{menu}** tokens per call. Across {trips} calls that is **{extra}** extra input tokens."

  - kind: code
    kicker: Read it
    title: Describe a tool
    intro: "A tool is a **name**, a plain-language **description**, and a **JSON schema** for its arguments. The description is what the model reads to decide when to use it."
    lang: python
    code: |
      tools = [{
          "name": "get_weather",
          "description": "Current weather for a city.",
          "input_schema": {
              "type": "object",
              "properties": {"city": {"type": "string"}},
              "required": ["city"],
          },
      }]
    note: "Write the description for the model, as if explaining to a new colleague when to use it."

  - kind: code
    kicker: In code
    title: The loop that runs tools
    intro: "Keep asking until the model stops requesting tools. Each time, run the tool, then send back a `tool_result`."
    lang: python
    code: |
      msgs = [{"role": "user", "content": "Weather in Paris?"}]
      while True:
          r = client.messages.create(model=M, max_tokens=300,
                                     tools=tools, messages=msgs)
          if r.stop_reason != "tool_use":
              break
          msgs.append({"role": "assistant", "content": r.content})
          results = []
          for b in r.content:
              if b.type == "tool_use":
                  out = get_weather(**b.input)
                  results.append({"type": "tool_result",
                                  "tool_use_id": b.id, "content": out})
          msgs.append({"role": "user", "content": results})
      print(r.content[0].text)
    note: "`stop_reason` is `tool_use` while the model wants a tool, and something else when it is done."

  - kind: check
    kicker: Check yourself
    title: Who runs the tool
    question: "The model replies with a tool request for get_weather with city Paris. What happens next?"
    options:
      - { text: "Your code calls get_weather and sends the result back", correct: true, why: "The model only names the tool. Your program does the work and returns the result." }
      - { text: "The model has already run it", why: "A model cannot run your code. It only asks for it." }
      - { text: "The conversation ends", why: "It continues. The model still needs the result to write its answer." }

  - kind: formula
    kicker: Read the formula
    title: The hidden token cost
    tex: "\\text{extra} = T \\cdot 120 \\cdot (n + 1)"
    say: "Each tool description costs about 120 tokens. The whole menu travels with every model call, and there is one more call than there are tool uses."
    verify:
      - { expr: "extra", equals: 720, tol: 0.5 }
      - { expr: "3 * 120 * (1 + 1)", equals: 720, tol: 0.5 }
    symbols:
      - { tex: "\\text{extra}", means: "added input tokens from the tool menu", value: extra }
      - { tex: "T", means: "how many tools you offer", value: tools }
      - { tex: "120", means: "a rough token size for one tool description" }
      - { tex: "n + 1", means: "model calls: one per tool use, plus the final answer", value: trips }

  - kind: check
    kicker: Check yourself
    title: Trim the menu
    question: "Your app offers 20 tools but each request uses only one or two. What is a sensible fix?"
    options:
      - { text: "Offer only the tools relevant to each request", correct: true, why: "A smaller menu saves tokens and makes the right choice easier for the model." }
      - { text: "Make every description longer", why: "Longer descriptions cost more tokens on every call." }
      - { text: "Run the tools inside the model", why: "A model cannot run tools. Your code must." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Trusting the arguments.** The model may send a bad value. Validate before running the tool."
      - "**Vague descriptions.** If two tools sound alike, the model will pick the wrong one."
      - "**No loop limit.** Cap the number of rounds so a confused model cannot call tools forever."
    next: { label: "Next: streaming responses", href: /learn/streaming-responses }
