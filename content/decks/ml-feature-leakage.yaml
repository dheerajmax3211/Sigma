id: "ml-feature-leakage"
title: "Feature engineering and leakage"
minutes: 14
order: 510
params:
  - { id: "m", label: "mean of the new data", min: 10, max: 30, step: 1, init: 18 }
derived:
  - { id: "drift", expr: "abs(m - 10)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Good features win, leaks fool you"
    body:
      - "Models learn from the **features** you give them. Good ones are scaled, encoded and combined into things that carry signal, such as ratios, counts and time since last event."
      - "**Leakage** is when information the model will not have at prediction time sneaks into training. Scores look great and production fails."
    callout: "If a score looks too good, suspect leakage first."
  - kind: "lab"
    kicker: "See it"
    title: "Why fit scalers on train only"
    intro: "Training data has a mean of 10. New data has drifted. Scaling with the new data's own mean hides the drift. **Drag the new mean.**"
    view:
      type: "bars"
      max: 20
      items:
        - { label: "drift the model should see", value: "drift", color: "#f97316" }
        - { label: "drift seen if you rescale on the new data", value: "0", color: "#ef4444" }
    sliders:
      - "m"
    outro: "New mean {m} against 10 is a drift of **{drift}**. Scaling with test statistics would erase it, so you would never notice."
  - kind: "code"
    kicker: "Write it"
    title: "Fit on train, apply to test"
    intro: "Learn the numbers from training rows only, then reuse them."
    lang: "python"
    code: |
      def fit_scaler(train):
          m = sum(train) / len(train)
          sd = (sum((x - m) ** 2 for x in train) / len(train)) ** 0.5
          return m, sd

      def apply(xs, m, sd):
          return [(x - m) / sd for x in xs]

      m, sd = fit_scaler([8, 10, 12])
      assert m == 10
      assert apply([10], m, sd) == [0.0]
      assert apply([14], m, sd)[0] > 2

      # time split: train always earlier than test
      rows = list(range(10))
      train, test = rows[:7], rows[7:]
      assert max(train) < min(test)
    note: "For data over time, never shuffle. Train on the past and test on the future."
  - kind: "lab"
    kicker: "Memorise"
    title: "Common leaks"
    intro: "Check each one before you trust a score."
    view:
      type: "flow"
      stages:
        - { label: "Target in a feature", note: "A column built from the answer, like days overdue for a default model.", color: "#ef4444" }
        - { label: "Fit before split", note: "Scaling, imputing or selecting on all data.", color: "#f97316" }
        - { label: "Future in the past", note: "Using later rows to predict earlier ones.", color: "#a78bfa" }
        - { label: "Duplicates", note: "The same row in train and test.", color: "#38bdf8" }
  - kind: "check"
    kicker: "Your turn"
    title: "Too good"
    question: "Your model scores 99 percent on first try. What first?"
    options:
      - { text: "Hunt for leakage in features and splits", correct: true, why: "A huge easy win is usually a leak." }
      - { text: "Ship it", why: "Check first." }
      - { text: "Add more features", why: "Not the issue." }
      - { text: "Raise the learning rate", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Pick the leak"
    question: "Predicting hospital readmission, a feature is discharge summary text written after the stay. Is it safe?"
    options:
      - { text: "No, it may not exist at prediction time", correct: true, why: "A feature must be available when you predict." }
      - { text: "Yes, it is rich", why: "Richness is not the test." }
      - { text: "Yes if scaled", why: "Scaling is not the issue." }
      - { text: "Only for test", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**One shared pipeline fit on everything.** Fit inside each training fold."
      - "**Random split on time data.** Split by time."
      - "**Target encoding without folds.** It leaks the label."
    next: { label: "Next: time series", href: "/learn/ml-time-series" }
