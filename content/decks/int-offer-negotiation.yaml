id: int-offer-negotiation
title: "The offer and negotiation"
minutes: 11
order: 220
params:
  - { id: base, label: "base salary (thousands)", min: 20, max: 200, step: 1, init: 80 }
  - { id: bonus, label: "bonus (percent)", min: 0, max: 30, step: 1, init: 10 }
  - { id: ask, label: "your ask (percent above offer)", min: 0, max: 20, step: 1, init: 8 }
derived:
  - { id: total, expr: "base * (1 + bonus / 100)" }
  - { id: counter, expr: "base * (1 + ask / 100)" }
cards:
  - kind: story
    kicker: Start here
    title: "The offer is the start of a talk"
    body:
      - "A job offer is usually a first number, not a final one. Asking politely is normal and rarely costs you the offer."
      - "Look at the **whole package**: base pay, bonus, equity, leave, learning budget, start date, and the team you will join."
    callout: "Be warm, specific and grateful. You are negotiating with your future manager."

  - kind: lab
    kicker: See it
    title: "Total compensation"
    intro: "A bigger base counts every month. Compare packages by their total. **Drag the sliders.**"
    view:
      type: bars
      max: 260
      items:
        - { label: "base", value: base, color: "#38bdf8" }
        - { label: "base plus bonus", value: total, color: "#1cd6ac" }
        - { label: "your counter on base", value: counter, color: "#f97316" }
    sliders: [base, bonus, ask]
    outro: "With a base of {base} thousand and a {bonus} percent bonus, the package is about **{total} thousand**. A {ask} percent ask on base is about **{counter} thousand**."

  - kind: code
    kicker: Say it
    title: "A counter-offer script"
    intro: "Thank them, state a number backed by reasons, and ask for their thoughts."
    lang: text
    code: |
      Thank you, I am excited about the role and the team.
      Based on the scope and my research on similar roles,
      I was hoping for a base closer to X.
      Is there flexibility on the base, or on the signing bonus?
      I am ready to decide once we find something that works.
    note: "Never give a number you would not accept. Never lie about other offers."

  - kind: check
    kicker: Your turn
    title: "Their question"
    question: "A recruiter asks 'What salary do you expect?' very early. What is a good reply?"
    options:
      - { text: "Say you would like to learn the range first and share a number of your own once the role is clear", correct: true, why: "You keep your options open and avoid anchoring too low." }
      - { text: "Give your lowest number", why: "You may be locked in." }
      - { text: "Refuse to talk about pay at all", why: "Sounds difficult." }
      - { text: "Make up a very high number", why: "May end the talk early." }

  - kind: check
    kicker: Practice
    title: "Time to decide"
    question: "You need more time to compare offers. What do you do?"
    options:
      - { text: "Ask politely for a date and give a firm answer by then", correct: true, why: "Reasonable time is a normal request, and a clear date builds trust." }
      - { text: "Go silent", why: "Looks careless." }
      - { text: "Accept and keep interviewing", why: "Breaks trust." }
      - { text: "Demand a week at once without reason", why: "Be polite and flexible." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Accepting on the call.** Say thanks and ask for the offer in writing."
      - "**Only looking at base pay.** Compare the whole package."
      - "**Bluffing.** Keep every statement true."
      - "**Skipping practice.** Rehearse the conversation out loud once."
    next: { label: "Finish with the mock interview drills", href: /learn/mock-interview-drills }
