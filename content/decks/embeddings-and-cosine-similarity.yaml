id: embeddings-and-cosine-similarity
title: Embeddings and cosine similarity
order: 20
minutes: 9
params:
  - { id: qx, label: query x, min: -5, max: 5, step: 0.5, init: 2 }
  - { id: qy, label: query y, min: -5, max: 5, step: 0.5, init: 3 }
derived:
  - { id: lq, expr: "max(sqrt(qx ^ 2 + qy ^ 2), 0.01)" }
  - { id: dqc, expr: qx * 4 + qy * 1 }
  - { id: s_cat, expr: dqc / (lq * sqrt(17)) }
  - { id: s_dog, expr: (qx * 3 + qy * 2) / (lq * sqrt(13)) }
  - { id: s_car, expr: (qx * 1 + qy * 4) / (lq * sqrt(17)) }
cards:
  - kind: story
    kicker: The idea
    title: Meaning as coordinates
    body:
      - A computer cannot read meaning, only numbers. An **embedding** gives every word, sentence or image a position on a map, so that similar meanings land close together. Think of cities pinned on a map, where neighbours are a short trip apart.
      - Real embeddings use about 1,500 numbers instead of 2, but the idea is identical.
    callout: Searching by meaning means finding the points that sit nearest your question.

  - kind: lab
    kicker: See it first
    title: Words on a toy map
    intro: "Three words sit on a map with two numbers: how animal-like (right) and how machine-like (up). The white arrow is your search query. **Move the query.**"
    view:
      type: vectors
      range: 5
      xLabel: animal-like →
      yLabel: machine-like ↑
      arrows:
        - { label: cat, x: "4", y: "1", color: "#1cd6ac" }
        - { label: dog, x: "3", y: "2", color: "#a78bfa" }
        - { label: car, x: "1", y: "4", color: "#f97316" }
        - { label: query, x: qx, y: qy, color: "#f1f5f9" }
    sliders: [qx, qy]
    outro: The query is [{qx}, {qy}]. Which word's arrow points most the same way?

  - kind: formula
    kicker: Read the formula
    title: Cosine similarity
    tex: "\\text{sim}(q, w) = \\frac{q \\cdot w}{|q|\\,|w|}"
    say: Take the dot product from the last lesson and divide by both lengths. Dividing cancels size, so only direction counts. A score of 1 means the same direction, 0 unrelated, −1 opposite.
    verify:
      - { expr: "s_cat", equals: 0.74, tol: 0.01 }
      - { expr: "(2*4+3*1)/(sqrt(13)*sqrt(17))", equals: 0.74, tol: 0.01 }
      - { expr: "dqc", equals: 11, tol: 0.01 }
    symbols:
      - { tex: "\\text{sim}", means: "similarity of the query q with the word “cat”", value: s_cat }
      - { tex: "q \\cdot w", means: dot product of query and cat, value: dqc }
      - { tex: "|q|", means: length of the query arrow, value: lq }
      - { tex: "|w|", means: "length of cat's arrow, which is √17", value: "sqrt(17)" }

  - kind: lab
    kicker: Rank by meaning
    title: Which word is the best match?
    intro: Each bar is the cosine similarity between your query and one word. The longest bar wins. **Move the query** and watch the ranking change.
    view:
      type: vectors
      range: 5
      arrows:
        - { label: cat, x: "4", y: "1", color: "#1cd6ac" }
        - { label: dog, x: "3", y: "2", color: "#a78bfa" }
        - { label: car, x: "1", y: "4", color: "#f97316" }
        - { label: query, x: qx, y: qy, color: "#f1f5f9" }
    also:
      type: bars
      max: 1
      items:
        - { label: cat, value: s_cat, color: "#1cd6ac" }
        - { label: dog, value: s_dog, color: "#a78bfa" }
        - { label: car, value: s_car, color: "#f97316" }
    sliders: [qx, qy]
    outro: This is semantic search in miniature. Score every item, then show the top few.

  - kind: check
    kicker: Check yourself
    title: Bigger arrow, same direction
    question: A = [1, 1] and B = [10, 10]. B is just a longer arrow pointing the same way. What is their cosine similarity?
    options:
      - { text: "0, they are very different sizes", why: "Cosine ignores size and measures direction only." }
      - { text: "1, they point the same way", correct: true, why: "The dot product is 20, and the lengths multiply to 1.41 × 14.1 = 20. So 20 ÷ 20 = 1, perfectly aligned." }
      - { text: "10, because B is ten times bigger", why: "Cosine never exceeds 1. The factor of 10 cancels in the division." }

  - kind: story
    kicker: Scaling up
    title: From 2 numbers to 1,536
    body:
      - A real embedding model reads text and returns one long vector, say 1,536 numbers. Nobody can draw it, but the maths is unchanged, dot product, lengths and cosine.
      - You store one vector per document, embed the user's question the same way, and return the documents with the highest cosine. That is the whole trick behind semantic search and RAG.
    callout: The same model must embed both the documents and the question.

  - kind: practice
    kicker: Your turn
    title: "Cosine similarity"
    intro: "Write `cosine(a, b)`: the dot product divided by the product of the two lengths. Round to 4 places."
    entry: cosine
    starter: |
      import math
      def cosine(a, b):
          pass
    solution: |
      import math
      def cosine(a, b):
          d = sum(x * y for x, y in zip(a, b))
          return round(d / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b))), 4)
    tests:
      - { input: "[[1, 0], [0, 1]]", expected: "0.0" }
      - { input: "[[1, 1], [2, 2]]", expected: "1.0" }
      - { input: "[[1, 2, 3], [3, 2, 1]]", expected: "0.7143" }
    hint: "Same direction gives 1, at a right angle gives 0."

  - kind: mistakes
    kicker: Watch out
    title: Three traps
    items:
      - "**Mixing models.** Vectors from different embedding models live on different maps. Only compare vectors from the same model."
      - "**Reading 0.8 as “80% similar”.** Scores are not percentages. Choose a cutoff by testing on your own data."
      - "**Trusting meaning blindly.** “Not good” and “good” can land close together. Read the results by eye."
    next: { label: "Next: attention, intuitively", href: /learn/attention-intuition }
