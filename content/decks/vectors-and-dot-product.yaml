id: vectors-and-dot-product
title: Vectors and the dot product
order: 2
minutes: 9
params:
  - { id: ax, label: aₓ, min: -4, max: 4, step: 0.5, init: 3 }
  - { id: ay, label: a_y, min: -4, max: 4, step: 0.5, init: 1 }
  - { id: bx, label: bₓ, min: -4, max: 4, step: 0.5, init: 1 }
  - { id: by, label: b_y, min: -4, max: 4, step: 0.5, init: 3 }
  - { id: f1, label: size, min: 0, max: 3, step: 0.1, init: 1.2 }
  - { id: f2, label: rooms, min: 0, max: 6, step: 1, init: 3 }
  - { id: k1, label: "weight 1", min: 0, max: 4, step: 0.1, init: 2 }
  - { id: k2, label: "weight 2", min: 0, max: 4, step: 0.1, init: 1 }
derived:
  - { id: la, expr: sqrt(ax ^ 2 + ay ^ 2) }
  - { id: lb, expr: sqrt(bx ^ 2 + by ^ 2) }
  - { id: dot, expr: ax * bx + ay * by }
  - { id: cos, expr: "dot / (max(la, 0.01) * max(lb, 0.01))" }
  - { id: c1, expr: f1 * k1 }
  - { id: c2, expr: f2 * k2 }
  - { id: price, expr: c1 + c2 }
cards:
  - kind: story
    kicker: Start here
    title: Directions, written as numbers
    body:
      - Someone says, "walk 3 blocks east and 1 block north." That is a **vector**, written [3, 1]. Two numbers, one arrow.
      - In machine learning a vector is just a list of numbers describing one thing. A house is [size, rooms, age]. A word is a list of about 1,500 numbers. Same idea, longer list.
    callout: Once everything is a list of numbers, maths can measure how alike two things are. This lesson gives you the two tools for that, length and the dot product.

  - kind: lab
    kicker: See it first
    title: Two vectors as arrows
    intro: Each vector is an arrow from the centre. The first number is how far right, the second is how far up. **Drag the sliders.**
    view:
      type: vectors
      range: 5
      xLabel: right →
      yLabel: up ↑
      arrows:
        - { label: a, x: ax, y: ay, color: "#38bdf8" }
        - { label: b, x: bx, y: by, color: "#f97316" }
    sliders: [ax, ay, bx, by]
    outro: "**a** = [{ax}, {ay}] and **b** = [{bx}, {by}]."

  - kind: formula
    kicker: Read the formula
    title: How long is the arrow?
    tex: "|a| = \\sqrt{a_x^2 + a_y^2}"
    say: Walk right by aₓ and up by a_y. The straight-line distance back to the start is the length. This is the triangle rule (Pythagoras) from school.
    verify:
      - { expr: "la", equals: 3.162, tol: 0.01 }
      - { expr: "sqrt(3^2+1^2)", equals: 3.162, tol: 0.01 }
    symbols:
      - { tex: "|a|", means: "the length of arrow a, read “size of a”", value: la }
      - { tex: "a_x", means: how far right, value: ax }
      - { tex: "a_y", means: how far up, value: ay }
      - { tex: "\\sqrt{\\ \\ }", means: "square root: the number that multiplies by itself to give what is inside" }

  - kind: lab
    kicker: The key idea
    title: Do two arrows point the same way?
    intro: The **dot product** is one number that says how much two arrows agree. Positive means roughly the same direction. Zero means a right angle. Negative means opposite. Move the arrows and watch it.
    view:
      type: vectors
      range: 5
      arrows:
        - { label: a, x: ax, y: ay, color: "#38bdf8" }
        - { label: b, x: bx, y: by, color: "#f97316" }
    sliders: [ax, ay, bx, by]
    outro: "a · b = {ax}×{bx} + {ay}×{by} = **{dot}**"

  - kind: formula
    kicker: Read the formula
    title: Two ways to write the dot product
    tex: "a \\cdot b = a_x b_x + a_y b_y = |a|\\,|b|\\cos\\theta"
    say: Multiply matching entries, then add. The second form says the same thing in words of length and angle. cos θ is 1 for the same direction, 0 at a right angle, −1 for opposite.
    verify:
      - { expr: "dot", equals: 6, tol: 0.01 }
      - { expr: "cos", equals: 0.6, tol: 0.01 }
      - { expr: "3*1+1*3", equals: 6, tol: 0.01 }
    symbols:
      - { tex: "a \\cdot b", means: "the dot product, read “a dot b”", value: dot }
      - { tex: "|a|", means: length of a, value: la }
      - { tex: "|b|", means: length of b, value: lb }
      - { tex: "\\theta", means: "theta, the angle between the arrows" }
      - { tex: "\\cos\\theta", means: how aligned they are (−1 to 1), value: cos }

  - kind: check
    kicker: Check yourself
    title: Which pair has dot product exactly 0?
    question: Pick the pair of arrows that share no direction at all.
    options:
      - { text: "a = [2, 0] and b = [3, 0]", why: "Both point right, so 2×3 + 0×0 = 6. Same direction gives a positive number." }
      - { text: "a = [2, 0] and b = [0, 3]", correct: true, why: "2×0 + 0×3 = 0. One points right, one points up: a right angle, so they share no direction." }
      - { text: "a = [2, 0] and b = [−3, 0]", why: "2×(−3) = −6. Opposite directions give a negative number." }

  - kind: lab
    kicker: Why machine learning cares
    title: A score is a dot product
    intro: A house is the vector [size, rooms]. A model keeps **weights** saying how much each feature matters. Its price score is the dot product of the two. Change the weights and see which feature drives the price.
    view:
      type: bars
      items:
        - { label: size × weight, value: c1, color: "#38bdf8" }
        - { label: rooms × weight, value: c2, color: "#a78bfa" }
        - { label: price score, value: price, color: "#1cd6ac" }
    sliders: [f1, f2, k1, k2]
    outro: "score = {f1}×{k1} + {f2}×{k2} = **{price}**. This one line is a whole artificial neuron."

  - kind: practice
    kicker: Your turn
    title: "Dot product"
    intro: "Write `dot(a, b)` for two lists of equal length: multiply matching numbers, then add them up."
    entry: dot
    starter: |
      def dot(a, b):
          pass
    solution: |
      def dot(a, b):
          return sum(x * y for x, y in zip(a, b))
    tests:
      - { input: "[[1, 2, 3], [4, 5, 6]]", expected: "32" }
      - { input: "[[1, 0], [0, 1]]", expected: "0" }
      - { input: "[[2], [5]]", expected: "10" }
    hint: "Pair up the numbers with zip."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**The dot product is one number, not a vector.** Two lists in, a single number out."
      - "**Order matters.** [size, rooms] and [rooms, size] are different vectors. Pair the matching entries or the sum means nothing."
      - "**A big dot product is not always “more similar”.** Longer arrows give bigger numbers. Cosine similarity, coming in a later lesson, fixes that."
    next: { label: "Next: matrices as machines", href: /learn/matrices-as-machines }
