id: "vis-iou-nms"
title: "Object detection: IoU and NMS"
minutes: 14
order: 903
params:
  - { id: "s", label: "how far the second box is shifted (of 10)", min: 0, max: 10, step: 0.5, init: 3 }
derived:
  - { id: "iou", expr: "100 * (10 - s) / (10 + s)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Where is it, not just what is it"
    body:
      - "A detector outputs **boxes**, each with a class and a score. To judge a box we compare it with the true box using **intersection over union**, or **IoU**: the overlap area divided by the area covered by both together."
      - "A detector fires many overlapping boxes on one object. **Non-maximum suppression**, or NMS, keeps the best box and removes others that overlap it too much."
    callout: "IoU of 1 is a perfect match, 0 is no overlap."
  - kind: "lab"
    kicker: "See it"
    title: "Sliding a box"
    intro: "Two boxes 10 wide and 10 tall. The second slides sideways. **Drag the shift.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "IoU (percent)", value: "iou", color: "#1cd6ac" }
        - { label: "a common pass mark: 50", value: "50", color: "#f97316" }
    sliders:
      - "s"
    outro: "A shift of {s} gives an IoU of **{iou} percent**. A box shifted by a third of its width already falls to 50 percent."
  - kind: "code"
    kicker: "Write it"
    title: "IoU and NMS"
    intro: "Both are short."
    lang: "python"
    code: |
      def iou(a, b):
          ix = max(0, min(a[2], b[2]) - max(a[0], b[0]))
          iy = max(0, min(a[3], b[3]) - max(a[1], b[1]))
          inter = ix * iy
          area = lambda r: (r[2] - r[0]) * (r[3] - r[1])
          return inter / (area(a) + area(b) - inter)

      def nms(boxes, scores, thr=0.5):
          order = sorted(range(len(boxes)), key=lambda i: -scores[i])
          keep = []
          for i in order:
              if all(iou(boxes[i], boxes[j]) <= thr for j in keep):
                  keep.append(i)
          return keep

      A, B = (0, 0, 10, 10), (5, 0, 15, 10)
      assert iou(A, A) == 1
      assert abs(iou(A, B) - 1 / 3) < 1e-12
      assert iou(A, (20, 20, 30, 30)) == 0

      boxes = [A, (1, 0, 11, 10), (20, 20, 30, 30)]
      assert nms(boxes, [0.9, 0.8, 0.7]) == [0, 2]
    note: "Boxes are written as left, top, right, bottom."
  - kind: "lab"
    kicker: "Memorise"
    title: "Reading detector scores"
    intro: "Metrics you will meet."
    view:
      type: "flow"
      stages:
        - { label: "Precision", note: "Of the boxes drawn, how many are right.", color: "#38bdf8" }
        - { label: "Recall", note: "Of the real objects, how many were found.", color: "#1cd6ac" }
        - { label: "AP", note: "Area under the precision against recall curve.", color: "#f97316" }
        - { label: "mAP", note: "Average of AP over classes and IoU levels.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "IoU"
    question: "Two identical boxes have an IoU of?"
    options:
      - { text: "1", correct: true, why: "Intersection equals union." }
      - { text: "0", why: "That is no overlap." }
      - { text: "0.5", why: "No." }
      - { text: "2", why: "It never exceeds 1." }
  - kind: "check"
    kicker: "Practice"
    title: "NMS"
    question: "What does NMS remove?"
    options:
      - { text: "Lower-scoring boxes that overlap a better one too much", correct: true, why: "One box per object remains." }
      - { text: "The highest score box", why: "It keeps that." }
      - { text: "All boxes of one class", why: "No." }
      - { text: "Small boxes", why: "Size does not decide." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**An NMS threshold that is too low.** It deletes real neighbouring objects."
      - "**Judging with accuracy.** Use precision, recall and mAP."
      - "**Mixing box formats.** Corner and centre formats differ."
    next: { label: "Next: CLIP and contrastive learning", href: "/learn/vis-clip" }
