id: "vis-transfer-learning"
title: "Transfer learning and fine-tuning"
minutes: 14
order: 902
params:
  - { id: "n", label: "labelled images you have", min: 50, max: 5000, step: 50, init: 500 }
derived:
  - { id: "scr", expr: "95 - 60 * exp(0 - n / 1000)" }
  - { id: "pre", expr: "96 - 20 * exp(0 - n / 200)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Start from a model that already sees"
    body:
      - "A network trained on millions of images has already learned edges, textures and shapes. You rarely need to learn those again."
      - "**Transfer learning** keeps the pretrained network and trains only a new final layer, the **head**, for your task. If you have more data you can also **fine-tune** some or all of the earlier layers with a small learning rate."
    callout: "Almost every real vision project starts here."
  - kind: "lab"
    kicker: "See it"
    title: "Data you need"
    intro: "These curves are an illustrative model of a typical image task, not a measurement. **Drag the number of labelled images.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "accuracy from scratch (percent)", value: "scr", color: "#ef4444" }
        - { label: "accuracy from a pretrained model (percent)", value: "pre", color: "#1cd6ac" }
    sliders:
      - "n"
    outro: "With {n} images, scratch training reaches about **{scr} percent** and a pretrained start about **{pre} percent**. The gap is largest when data is scarce."
  - kind: "code"
    kicker: "Write it"
    title: "Freeze the backbone"
    intro: "Only unfrozen parameters get updated."
    lang: "python"
    code: |
      params = {
          "backbone": {"value": 1.0, "frozen": True},
          "head": {"value": 1.0, "frozen": False},
      }

      def step(params, grad, lr=0.1):
          for p in params.values():
              if not p["frozen"]:
                  p["value"] -= lr * grad

      step(params, grad=2.0)
      assert params["backbone"]["value"] == 1.0
      assert abs(params["head"]["value"] - 0.8) < 1e-12

      backbone_params = 1_000_000
      head_params = 512 * 10 + 10          # 512 features to 10 classes, plus bias
      assert head_params == 5130
      assert head_params / (backbone_params + head_params) < 0.01
    note: "Training under one percent of the weights is fast and hard to overfit."
  - kind: "lab"
    kicker: "Memorise"
    title: "A ladder of choices"
    intro: "Climb only as far as your data allows."
    view:
      type: "flow"
      stages:
        - { label: "Use as is", note: "Features from the frozen model plus a simple classifier.", color: "#38bdf8" }
        - { label: "Train the head", note: "Freeze the backbone, train the last layer.", color: "#1cd6ac" }
        - { label: "Fine-tune top layers", note: "Unfreeze the last blocks, small learning rate.", color: "#f97316" }
        - { label: "Fine-tune all", note: "Plenty of data, close domain, careful rate.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Frozen"
    question: "What does freezing the backbone mean?"
    options:
      - { text: "Its weights are not updated during training", correct: true, why: "Only the head learns." }
      - { text: "It is deleted", why: "No." }
      - { text: "It trains twice as fast on purpose", why: "No." }
      - { text: "Its inputs are blank", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Learning rate"
    question: "Why use a small learning rate when fine-tuning the whole network?"
    options:
      - { text: "Large steps would destroy the useful pretrained features", correct: true, why: "Nudge it, do not rewrite it." }
      - { text: "To save memory", why: "No." }
      - { text: "It is required by the GPU", why: "No." }
      - { text: "Small rates are always better", why: "Not for a new head." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Forgetting to normalise like the pretraining data.** Use the same mean and spread."
      - "**Fine-tuning everything on 100 images.** Overfits."
      - "**Using a model from a very different domain.** Medical scans differ from photos."
    next: { label: "Next: boxes, IoU and NMS", href: "/learn/vis-iou-nms" }
