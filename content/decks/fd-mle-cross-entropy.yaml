id: "fd-mle-cross-entropy"
title: "Maximum likelihood and cross-entropy"
minutes: 14
order: 706
params:
  - { id: "p", label: "chance of heads you try", min: 0.05, max: 0.95, step: 0.05, init: 0.5 }
  - { id: "h", label: "heads seen in 10 flips", min: 1, max: 9, step: 1, init: 7 }
derived:
  - { id: "nll", expr: "0 - (h * log(p) + (10 - h) * log(1 - p))" }
  - { id: "best", expr: "0 - (h * log(h / 10) + (10 - h) * log(1 - h / 10))" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Pick the settings that make the data likely"
    body:
      - "**Maximum likelihood** says: choose the parameters under which the data you saw is most probable. For a coin, that means the chance of heads that best explains your flips."
      - "We work with the **negative log likelihood**, called a loss, because sums are easier than products and minimising is the habit. For classifiers this is exactly **cross-entropy**."
    callout: "Cross-entropy loss is maximum likelihood in disguise."
  - kind: "lab"
    kicker: "See it"
    title: "Which coin explains the data?"
    intro: "You saw some heads in 10 flips. Try different chances. Lower loss means a better explanation. **Drag both.**"
    view:
      type: "bars"
      max: 10
      items:
        - { label: "loss for your chance", value: "nll", color: "#f97316" }
        - { label: "the lowest possible loss", value: "best", color: "#1cd6ac" }
    sliders:
      - "p"
      - "h"
    outro: "With {h} heads in 10, your loss is **{nll}** and the best possible is **{best}**. The best chance is heads divided by 10."
  - kind: "code"
    kicker: "Write it"
    title: "The loss and its minimum"
    intro: "Compute the loss for several chances and see where it is smallest."
    lang: "python"
    code: |
      import math

      data = [1, 1, 1, 0, 0, 0, 1, 1, 1, 0]    

      def nll(data, p):
          return -sum(math.log(p) if d == 1 else math.log(1 - p) for d in data)

      heads = sum(data)
      mle = heads / len(data)
      assert heads == 6
      assert mle == 0.6
      assert nll(data, 0.6) < nll(data, 0.5)
      assert nll(data, 0.6) < nll(data, 0.8)

      def cross_entropy(p_true_class):
          return -math.log(p_true_class)

      assert cross_entropy(0.9) < cross_entropy(0.5)
    note: "A confident wrong answer has a huge loss. A confident right one is nearly free."
  - kind: "lab"
    kicker: "Memorise"
    title: "The links"
    intro: "The same idea in three costumes."
    view:
      type: "flow"
      stages:
        - { label: "Likelihood", note: "How probable is the data under the model.", color: "#38bdf8" }
        - { label: "Negative log", note: "Turn the product into a sum and flip the sign.", color: "#1cd6ac" }
        - { label: "Cross-entropy", note: "The same number for classifiers.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why log"
    question: "Why take the log of the likelihood?"
    options:
      - { text: "Products become sums, which are easier and stable", correct: true, why: "Many tiny probabilities would underflow." }
      - { text: "It makes numbers larger", why: "No." }
      - { text: "It removes noise", why: "No." }
      - { text: "It is required by law", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "The best chance"
    question: "You see 3 heads in 10 flips. What is the maximum likelihood chance of heads?"
    options:
      - { text: "0.3", correct: true, why: "Heads over flips." }
      - { text: "0.5", why: "That ignores the data." }
      - { text: "0.7", why: "That is tails." }
      - { text: "3", why: "A chance is at most one." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Taking the log of zero.** Clamp probabilities."
      - "**Reading the loss like accuracy.** They measure different things."
      - "**Forgetting the minus sign.** Maximise likelihood, minimise loss."
    next: { label: "Next: Bayes and updating beliefs", href: "/learn/fd-bayes-updating" }
