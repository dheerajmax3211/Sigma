id: "dist-tensor-parallel"
title: "Tensor parallelism: splitting a matrix multiply"
minutes: 14
order: 803
params:
  - { id: "tp", label: "GPUs sharing one layer", min: 1, max: 16, step: 1, init: 4 }
derived:
  - { id: "share", expr: "100 / tp" }
  - { id: "comm", expr: "100 * (tp - 1) / tp" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "When one layer is too big"
    body:
      - "Some layers are so large that one GPU cannot hold them, or is too slow. **Tensor parallelism** splits the weight matrix of a single layer across GPUs."
      - "Split by **columns** and each GPU produces part of the output, which you glue together. Split by **rows** and each GPU produces a partial sum, which you add. Transformers pair a column split with a row split, so only one sum is needed."
    callout: "It needs fast links, so it stays inside one machine."
  - kind: "lab"
    kicker: "See it"
    title: "Share and chatter"
    intro: "Each GPU holds a slice of the layer, but the partial results must be combined. **Drag the GPU count.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "share of the layer on each GPU (percent)", value: "share", color: "#1cd6ac" }
        - { label: "relative traffic to combine results (percent)", value: "comm", color: "#f97316" }
    sliders:
      - "tp"
    outro: "With {tp} GPUs each holds **{share} percent** of the layer. The traffic does not shrink, so slow links hurt."
  - kind: "code"
    kicker: "Write it"
    title: "Column split and row split"
    intro: "Both reproduce the full result."
    lang: "python"
    code: |
      W = [[1, 2, 3, 4],
           [5, 6, 7, 8]]
      x = [1, 1]

      def matvec(x, W):
          return [sum(x[i] * W[i][j] for i in range(len(x))) for j in range(len(W[0]))]

      full = matvec(x, W)
      assert full == [6, 8, 10, 12]

      left = matvec(x, [row[:2] for row in W])
      right = matvec(x, [row[2:] for row in W])
      assert left + right == full                      # column split: join

      a = matvec([x[0]], [W[0]])
      b = matvec([x[1]], [W[1]])
      assert [p + q for p, q in zip(a, b)] == full     # row split: add
    note: "The join and the add are the communication. Pairing the splits avoids one of them."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where to use it"
    intro: "A rule of thumb."
    view:
      type: "flow"
      stages:
        - { label: "Inside a node", note: "Fast links between GPUs. Good for tensor parallel.", color: "#1cd6ac" }
        - { label: "Across nodes", note: "Slower network. Prefer data or pipeline parallel.", color: "#f97316" }
        - { label: "Degree", note: "Usually 2 to 8.", color: "#38bdf8" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why inside a node"
    question: "Why keep tensor parallelism inside one machine?"
    options:
      - { text: "It communicates on every layer, so it needs fast links", correct: true, why: "Slow links would stall each layer." }
      - { text: "It uses less memory across nodes", why: "No." }
      - { text: "It is only allowed there", why: "It is a speed choice." }
      - { text: "It needs no communication", why: "It needs a lot." }
  - kind: "check"
    kicker: "Practice"
    title: "Row split"
    question: "After a row split, what must you do with the partial results?"
    options:
      - { text: "Add them", correct: true, why: "Each GPU holds a partial sum." }
      - { text: "Concatenate them", why: "That is for a column split." }
      - { text: "Ignore them", why: "No." }
      - { text: "Multiply them", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Tensor parallel across a slow network.** Throughput collapses."
      - "**Splitting sizes that do not divide evenly.** Keep heads and widths divisible."
      - "**Ignoring the extra communication.** It is paid on every layer."
    next: { label: "Next: pipeline parallelism", href: "/learn/dist-pipeline-parallel" }
