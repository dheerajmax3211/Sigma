id: int-sd-ml-system
title: "System design: an ML system"
minutes: 15
order: 216
params:
  - { id: s, label: "stage", min: 0, max: 3, step: 1, init: 0 }
derived:
  - { id: cand, expr: "pick(s, 1000000, 1000, 100, 10)" }
  - { id: ms, expr: "pick(s, 5, 20, 60, 10)" }
cards:
  - kind: story
    kicker: Start here
    title: "More than a model"
    body:
      - "'Design a video recommendation system' is an ML system design question. The model is one box. The **data, serving and monitoring** around it are the real work."
      - "Say the business goal first, such as watch time, then the metric you will track, then the pipeline."
    callout: "Always cover the loop: data in, model out, results measured, model retrained."

  - kind: lab
    kicker: See it
    title: "The pipeline"
    intro: "Walk through these in order and name one risk at each."
    view:
      type: flow
      stages:
        - { label: "Data", note: "Logs of views and clicks. Risk: bias and leaks.", color: "#38bdf8" }
        - { label: "Features", note: "User and item signals. Risk: train and serve mismatch.", color: "#1cd6ac" }
        - { label: "Model", note: "Train and validate offline.", color: "#f97316" }
        - { label: "Serving", note: "Fast, cached predictions.", color: "#a78bfa" }
        - { label: "Monitoring", note: "Quality drift and latency.", color: "#ec4899" }

  - kind: lab
    kicker: See it
    title: "The funnel"
    intro: "You cannot score a million videos with a heavy model per request. Narrow in stages. **Drag the stage.**"
    view:
      type: flow
      stages:
        - { label: "All items", note: "About a million videos.", color: "#38bdf8" }
        - { label: "Candidates", note: "Cheap search picks about a thousand.", color: "#1cd6ac" }
        - { label: "Ranking", note: "A bigger model scores them.", color: "#f97316" }
        - { label: "Final list", note: "Re-rank for variety, show ten.", color: "#a78bfa" }
    sliders: [s]
    says:
      - "Stage 0: **{cand}** items. Far too many to score with a heavy model."
      - "Stage 1: **{cand}** candidates from a fast approximate search, about {ms} milliseconds."
      - "Stage 2: **{cand}** ranked with a larger model, about {ms} milliseconds."
      - "Stage 3: **{cand}** shown. Rules for variety and safety are applied last."
    saysAt: s

  - kind: code
    kicker: Say it
    title: "Skeleton of an answer"
    intro: "Use this order, and spend most time on the parts the interviewer reacts to."
    lang: text
    code: |
      Goal: increase watch time without hurting user trust.
      Offline metric: recall at 100 for candidates, NDCG for ranking.
      Online metric: watch time per session, measured by an A/B test.
      Data: view logs, with negative examples from items shown but skipped.
      Serving: candidates in 20 ms, ranking in 60 ms, cache per user.
      Monitoring: drift in features, click rate, and a daily offline re-check.
      Risks: feedback loops, cold start for new users and new videos.
    note: "Naming cold start and feedback loops shows you have seen real systems."

  - kind: check
    kicker: Your turn
    title: "Offline looks great"
    question: "The model scores well offline but the A/B test shows no gain. A likely cause?"
    options:
      - { text: "Training data differs from live traffic, or the offline metric does not match the goal", correct: true, why: "Mismatch between offline setup and real use is the most common reason." }
      - { text: "A/B tests are always wrong", why: "They are the ground truth for the product." }
      - { text: "The model is too accurate", why: "That is not a cause." }
      - { text: "Latency does not matter", why: "It can matter a lot." }

  - kind: check
    kicker: Practice
    title: "Train and serve mismatch"
    question: "What is the best way to avoid features differing between training and serving?"
    options:
      - { text: "Compute them with the same shared code or a feature store", correct: true, why: "One definition used in both places prevents silent differences." }
      - { text: "Write them twice, carefully", why: "Copies drift apart." }
      - { text: "Skip features", why: "Then there is no model." }
      - { text: "Retrain less often", why: "Does not fix mismatch." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Only talking about the model.** Cover data, serving and monitoring."
      - "**No metric link.** Tie offline metrics to a business goal."
      - "**Ignoring latency.** State a budget per stage."
      - "**Forgetting cold start.** New users and items have no history."
    next: { label: "Next: design a RAG chat product", href: /learn/int-sd-rag-chat }
