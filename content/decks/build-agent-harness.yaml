id: build-agent-harness
title: "Build an agent harness"
order: 1201
minutes: 25
params:
  - { id: tries, label: "attempts", min: 1, max: 8, step: 1, init: 4 }
  - { id: base, label: "first wait in seconds", min: 1, max: 5, step: 1, init: 1 }
derived:
  - { id: last, expr: "base * 2 ^ (tries - 1)" }
  - { id: total, expr: "base * (2 ^ tries - 1)" }
cards:
  - kind: story
    kicker: Guided build
    title: "Build a loop that survives failure"
    body:
      - "An agent is a loop: the model picks a tool, your code runs it, the result goes back. Real tools fail, time out and get called twice."
      - "You will build three guards: **backoff** between retries, **idempotency** so a retry never repeats a side effect, and a **step cap** so the loop always ends."

  - kind: lab
    kicker: See it first
    title: "Backoff adds up"
    intro: "Each retry waits twice as long as the one before. **Drag the sliders** to see the longest wait and the total."
    view:
      type: bars
      max: 1300
      items:
        - { label: "longest single wait", value: last, color: "#f97316" }
        - { label: "total seconds waiting", value: total, color: "#a78bfa" }
    sliders: [tries, base]
    outro: "{tries} attempts starting at {base} second wait **{total} seconds** in all, with the last wait at {last}. Add a cap, or users give up first."

  - kind: code
    kicker: Starter code
    title: "The loop in twelve lines"
    intro: "This is the skeleton you are filling in. Read it once, then build the guards below."
    lang: python
    code: |
      def run(actions, max_steps=5):
          done = []
          for step, act in enumerate(actions):
              if step >= max_steps:
                  break
              done.append(act)
              if act == 'done':
                  break
          return done

      assert run(['a', 'done', 'b']) == ['a', 'done']
      print(run(['a', 'b', 'c'], 2))
    note: "A model that never says done would loop forever, so the cap is not optional."

  - kind: practice
    kicker: Build step
    title: "Backoff delays"
    intro: "Write `backoff(tries, base, cap)` returning the wait before each retry. The waits double from `base` and never exceed `cap`."
    entry: backoff
    starter: |
      def backoff(tries, base, cap):
          pass
    solution: |
      def backoff(tries, base, cap):
          return [min(cap, base * 2 ** i) for i in range(tries)]
    tests:
      - { input: "[3, 1, 10]", expected: "[1, 2, 4]" }
      - { input: "[5, 1, 10]", expected: "[1, 2, 4, 8, 10]" }
      - { input: "[0, 1, 10]", expected: "[]" }
    hint: "The wait before retry number i is base times two to the power i."

  - kind: practice
    kicker: Build step
    title: "Apply a side effect once"
    intro: "A retry can send the same charge twice. Write `apply_once(events)` for a list of `[key, amount]` pairs. Add each amount to the total only the first time its key appears."
    entry: apply_once
    starter: |
      def apply_once(events):
          pass
    solution: |
      def apply_once(events):
          seen, total = set(), 0
          for key, amount in events:
              if key not in seen:
                  seen.add(key)
                  total += amount
          return total
    tests:
      - { input: "[[[\"a\", 5], [\"b\", 3], [\"a\", 5]]]", expected: "8" }
      - { input: "[[]]", expected: "0" }
      - { input: "[[[\"x\", 2], [\"x\", 9]]]", expected: "2" }
    hint: "Remember the keys you have seen, and skip a key you saw before."

  - kind: practice
    kicker: Build step
    title: "Cap the loop"
    intro: "Write `agent_loop(actions, max_steps)` returning the actions that ran, in order. Stop right after an action named `done`, or after `max_steps` actions."
    entry: agent_loop
    starter: |
      def agent_loop(actions, max_steps):
          pass
    solution: |
      def agent_loop(actions, max_steps):
          out = []
          for act in actions:
              if len(out) >= max_steps:
                  break
              out.append(act)
              if act == 'done':
                  break
          return out
    tests:
      - { input: "[[\"search\", \"read\", \"done\", \"extra\"], 10]", expected: "[\"search\", \"read\", \"done\"]" }
      - { input: "[[\"a\", \"b\", \"c\"], 2]", expected: "[\"a\", \"b\"]" }
      - { input: "[[], 3]", expected: "[]" }
    hint: "Check the cap before running, and stop after done."

  - kind: check
    kicker: Check yourself
    title: "Why a key"
    question: "A payment tool times out, and your harness retries. What makes it safe?"
    options:
      - { text: "Send the same idempotency key on every retry", correct: true, why: "The server can then spot the repeat and apply the charge once." }
      - { text: "Retry faster so it finishes sooner", why: "Speed does nothing to stop a duplicate charge." }
      - { text: "Never retry any tool", why: "Then every blip becomes a failure, and idempotency solves it properly." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Retrying forever.** Cap attempts and total time, then report the failure."
      - "**Retrying non-idempotent calls blind.** Add a key first."
      - "**No step cap.** One confused model can burn your whole budget."
    next: { label: "Next build", href: "/learn/build-diffusion-sampler" }
