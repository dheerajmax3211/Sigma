id: rag-pipeline
title: A RAG pipeline end to end
order: 29
minutes: 10
params:
  - { id: docs, label: "doc words", min: 2000, max: 100000, step: 2000, init: 20000 }
  - { id: chunk, label: "chunk size", min: 100, max: 800, step: 50, init: 300 }
  - { id: k, label: "top k", min: 1, max: 4, step: 1, init: 3 }
derived:
  - { id: n, expr: ceil(docs / chunk) }
  - { id: ctx, expr: k * chunk }
  - { id: pct, expr: 100 * ctx / docs }
  - { id: tok, expr: round(ctx * 1.3 + 150) }
cards:
  - kind: story
    kicker: The problem
    title: An open-book exam for AI
    body:
      - A language model knows a lot about the world and nothing about **your** documents, such as your refund policy, your codebase or last week's meeting. Retraining it on them is slow and expensive.
      - "**RAG** (retrieval-augmented generation) is the cheap trick. Before asking the model, look up the few relevant passages and paste them next to the question. Open book, not memorized."
    callout: RAG means search, paste, then ask.

  - kind: lab
    kicker: See it first
    title: The whole pipeline
    intro: Documents are cut into chunks once, ahead of time. At question time we embed the question, find the closest chunks and hand them to the model. **Change the sliders** and watch the numbers move.
    view:
      type: flow
      stages:
        - { label: Your documents, note: "{docs} words in total", color: "#38bdf8" }
        - { label: Chunks, note: "cut into **{n}** pieces of {chunk} words", color: "#a78bfa" }
        - { label: Embeddings, note: one vector per chunk in a vector index, color: "#a78bfa" }
        - { label: Search, note: "question → top **{k}** chunks", color: "#1cd6ac" }
        - { label: Prompt, note: "{ctx} words, about {tok} tokens", color: "#f97316" }
        - { label: LLM answer, note: grounded in those chunks, color: "#f1f5f9" }
    sliders: [docs, chunk, k]
    outro: The model sees only **{pct}%** of your documents on each question, so retrieval must pick the right slice.

  - kind: formula
    kicker: Read the formula
    title: Retrieval in one line
    tex: "\\text{context} = \\operatorname{top}_k\\big(\\cos(e_q, e_{c_i})\\big)"
    say: Turn the question into a vector e_q. Compare it with the vector of every chunk e_c using cosine similarity. Keep the k chunks that score highest.
    verify:
      - { expr: "n", equals: 67, tol: 0.01 }
      - { expr: "ceil(20000/300)", equals: 67, tol: 0.01 }
      - { expr: "pct", equals: 4.5, tol: 0.01 }
    symbols:
      - { tex: "e_q", means: the question as an embedding vector }
      - { tex: "e_{c_i}", means: "the embedding of chunk number i" }
      - { tex: "\\cos", means: "cosine similarity from the last lesson, 1 means same direction" }
      - { tex: k, means: how many top chunks to keep, value: k }

  - kind: lab
    kicker: Try it
    title: Choosing k
    intro: Four chunks, already scored against the question "How long do refunds take?". Chunk B holds the answer. Slide **k** to set how many chunks the model gets to see.
    view:
      type: bars
      max: 1
      items:
        - { label: A returns, value: "0.82", color: "#38bdf8", on: k }
        - { label: B refund times, value: "0.74", color: "#1cd6ac", on: k - 1 }
        - { label: C contact, value: "0.35", color: "#a78bfa", on: k - 2 }
        - { label: D careers, value: "0.12", color: "#f97316", on: k - 3 }
    sliders: [k]
    outro: With k = {k} the model sees the brightest {k} bars. With k = 1 it never sees chunk B and will guess. A very large k wastes tokens and buries the answer.

  - kind: code
    kicker: Under the hood
    title: The prompt is just text
    intro: After retrieval the app builds a prompt. There is no magic here, only string concatenation.
    lang: text
    code: |
      Answer using only the context below.
      If the answer is not there, say "I don't know".

      Context:
      [1] Refunds are issued within 5 business days...
      [2] Items can be returned within 30 days...

      Question: How long do refunds take?
    note: Instructions, then the retrieved chunks, then the question. The "I don't know" rule stops the model from inventing an answer.

  - kind: check
    kicker: Check yourself
    title: The bot answered wrongly. Now what?
    question: A user asks "How long do refunds take?" and the bot gives the wrong answer. What do you check first?
    options:
      - { text: Which chunks were retrieved for that question, correct: true, why: "If the right chunk was never retrieved, no model can answer correctly. Log the top k and read them." }
      - { text: Switch to a bigger language model, why: "A bigger model cannot use text it never received. Check retrieval first." }
      - { text: Add "please be accurate" to the prompt, why: "Politeness does not add missing facts." }

  - kind: practice
    kicker: Your turn
    title: "Build the prompt"
    intro: "Write `build_prompt(question, chunks)` returning a string: first a line per chunk like `[1] text`, numbered from 1, then a blank line, then `Question: ` followed by the question. Join lines with a newline."
    entry: build_prompt
    starter: |
      def build_prompt(question, chunks):
          pass
    solution: |
      def build_prompt(question, chunks):
          lines = [f'[{i}] {c}' for i, c in enumerate(chunks, 1)]
          return '\n'.join(lines) + '\n\nQuestion: ' + question
    tests:
      - { input: "[\"Why?\", [\"a\", \"b\"]]", expected: "\"[1] a\\n[2] b\\n\\nQuestion: Why?\"" }
      - { input: "[\"Who?\", []]", expected: "\"\\n\\nQuestion: Who?\"" }
      - { input: "[\"What?\", [\"x\"]]", expected: "\"[1] x\\n\\nQuestion: What?\"" }
    hint: "Use enumerate with a start of 1 for the numbers."

  - kind: mistakes
    kicker: Watch out
    title: Four ways RAG fails
    items:
      - "**No way to inspect retrieval.** Log the retrieved chunks with every answer. Most RAG bugs are retrieval bugs, not model bugs."
      - "**Chunks cut mid-sentence.** Split on paragraphs or headings and overlap neighbours a little, so an answer is not sliced in half."
      - "**Stuffing in everything.** A large k raises cost and can bury the answer. Start with 3 to 5 and measure."
      - "**A stale index.** Re-embed documents when they change, or answers quote old policy."
    next: { label: "Next: chunking strategies", href: /learn/chunking-strategies }
