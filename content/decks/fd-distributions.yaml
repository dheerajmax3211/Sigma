id: "fd-distributions"
title: "Distributions you will meet"
minutes: 13
order: 704
params:
  - { id: "sigma", label: "spread of the bell curve", min: 0.5, max: 3, step: 0.1, init: 1 }
derived:
  - { id: "peak", expr: "100 / (sigma * 2.5066)" }
  - { id: "wide", expr: "sigma * 10" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Three shapes cover most of ML"
    body:
      - "A **distribution** says how likely each outcome is. **Bernoulli** is a yes or no with a chance p. **Categorical** is one pick from several, which is what a classifier outputs. **Normal** is the bell curve, the shape of averages and of noise."
      - "A model predicts the parameters of a distribution. The softmax output is a categorical distribution. A regression with squared error assumes a normal."
    callout: "When you pick a loss, you are picking a distribution."
  - kind: "lab"
    kicker: "See it"
    title: "The bell curve"
    intro: "A wider bell is lower in the middle, because the total area stays at one. **Drag the spread.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "height of the peak", value: "peak", color: "#f97316" }
        - { label: "how wide it spreads", value: "wide", color: "#38bdf8" }
    sliders:
      - "sigma"
    outro: "With spread {sigma}, the peak height is **{peak}**. Wider means flatter."
  - kind: "code"
    kicker: "Write it"
    title: "Three distributions in code"
    intro: "Each one sums or integrates to one."
    lang: "python"
    code: |
      import math

      def normal_pdf(x, mu, sigma):
          return math.exp(-((x - mu) ** 2) / (2 * sigma ** 2)) / (sigma * math.sqrt(2 * math.pi))

      def softmax(z):
          e = [math.exp(v) for v in z]
          s = sum(e)
          return [v / s for v in e]

      assert abs(normal_pdf(0, 0, 1) - 0.39894) < 1e-4
      p = softmax([2.0, 1.0, 0.1])
      assert abs(sum(p) - 1) < 1e-12
      assert p[0] > p[1] > p[2]

      flips = [1, 0, 1, 1]
      assert sum(flips) / len(flips) == 0.75     # estimate of the Bernoulli p
    note: "Averaging many independent things tends toward a bell curve. That is why it appears everywhere."
  - kind: "lab"
    kicker: "Memorise"
    title: "Loss follows distribution"
    intro: "A quick map."
    view:
      type: "flow"
      stages:
        - { label: "Normal", note: "Squared error. Regression.", color: "#38bdf8" }
        - { label: "Bernoulli", note: "Binary cross-entropy. Yes or no.", color: "#1cd6ac" }
        - { label: "Categorical", note: "Cross-entropy with softmax. Many classes.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Which loss"
    question: "You predict house prices. Which distribution fits the errors?"
    options:
      - { text: "Normal, so squared error", correct: true, why: "Errors cluster around zero in a bell shape." }
      - { text: "Bernoulli", why: "That is for yes or no." }
      - { text: "Categorical", why: "That is for classes." }
      - { text: "None", why: "Every loss assumes one." }
  - kind: "check"
    kicker: "Practice"
    title: "Softmax"
    question: "What does softmax output?"
    options:
      - { text: "Positive numbers that sum to one", correct: true, why: "It is a categorical distribution." }
      - { text: "Any real numbers", why: "They are positive and sum to one." }
      - { text: "Only 0 or 1", why: "They are smooth." }
      - { text: "The loss", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Treating a score as a probability.** Only a calibrated model earns that."
      - "**Assuming everything is normal.** Heavy tails break it."
      - "**Mixing up density and probability.** A density can exceed one."
    next: { label: "Next: stable softmax and log sums", href: "/learn/fd-numerical-stability" }
