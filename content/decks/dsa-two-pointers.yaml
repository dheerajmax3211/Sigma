id: dsa-two-pointers
title: "Two pointers"
minutes: 15
order: 104
params:
  - { id: s, label: "step", min: 0, max: 4, step: 1, init: 0 }
  - { id: n, label: "items n", min: 2, max: 1000, step: 1, init: 100 }
derived:
  - { id: lp, expr: "pick(s, 0, 0, 1, 1, 2)" }
  - { id: rp, expr: "pick(s, 5, 4, 4, 3, 3)" }
  - { id: tot, expr: "pick(s, 12, 9, 11, 9, 10)" }
cards:
  - kind: story
    kicker: Start here
    title: "Two fingers on a sorted list"
    body:
      - "When the data is **sorted**, you can put one finger at each end and decide, from the numbers alone, which finger to move."
      - "You never go backwards, so the whole job takes one pass. That turns many O(n squared) problems into O(n)."
    callout: "Clue words: sorted, pair, palindrome, in place, remove duplicates."

  - kind: lab
    kicker: See it
    title: "Find a pair that sums to 10"
    intro: "The list is sorted. If the sum is too big, move the right finger left. If too small, move the left finger right. **Drag the step.**"
    view:
      type: array
      cells: [1, 3, 4, 6, 8, 11]
      pointers:
        - { label: "left", at: lp, color: "#1cd6ac" }
        - { label: "right", at: rp, color: "#f97316" }
    sliders: [s]
    says:
      - "1 + 11 = {tot}. Too big, so move **right** left to drop the biggest number."
      - "1 + 8 = {tot}. Too small, so move **left** right to raise the smallest."
      - "3 + 8 = {tot}. Too big. Move right."
      - "3 + 6 = {tot}. Too small. Move left."
      - "4 + 6 = {tot}. Found it."
    saysAt: s

  - kind: story
    kicker: Why it is safe
    title: "Why we never miss the answer"
    body:
      - "When 1 + 11 is too big, **no** partner for 11 can work. Even the smallest number, 1, already overshoots. So 11 can be dropped for good."
      - "Each step drops one number from consideration. With n numbers that is at most n steps, so the time is O(n)."
    callout: "This only works because the list is sorted. On unsorted data, use a hash map."

  - kind: code
    kicker: Write it
    title: "Pair with target sum"
    intro: "Same idea as the animation. The loop ends when the two fingers meet."
    lang: python
    code: |
      def pair_sum(a, target):
          l, r = 0, len(a) - 1
          while l < r:
              t = a[l] + a[r]
              if t == target:
                  return [l, r]
              if t < target:
                  l += 1
              else:
                  r -= 1
          return []

      assert pair_sum([1, 3, 4, 6, 8, 11], 10) == [2, 3]
      assert pair_sum([1, 3, 4], 100) == []
    note: "O(n) time, O(1) space. Compare Two Sum with a dict: same time, more memory."

  - kind: lab
    kicker: What it saves
    title: "Pairs checked"
    intro: "Checking every pair costs about n times n. Two fingers cost about n. **Drag n.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "check every pair", value: "n * n", color: "#ef4444" }
        - { label: "two pointers", value: n, color: "#1cd6ac" }
    sliders: [n]
    outro: "At n = {n}, nested loops do about {n} times {n} checks. Two pointers do {n}."

  - kind: code
    kicker: Write it
    title: "Three Sum: fix one, then two pointers"
    intro: "Find triples adding to 0. Sort, fix the first number, then run the two-pointer search on the rest. That is O(n squared) instead of O(n cubed)."
    lang: python
    code: |
      def three_sum(a):
          a = sorted(a)
          out = []
          for i in range(len(a) - 2):
              if i > 0 and a[i] == a[i - 1]:
                  continue                      # skip repeated first value
              l, r = i + 1, len(a) - 1
              while l < r:
                  t = a[i] + a[l] + a[r]
                  if t < 0:
                      l += 1
                  elif t > 0:
                      r -= 1
                  else:
                      out.append([a[i], a[l], a[r]])
                      l += 1
                      while l < r and a[l] == a[l - 1]:
                          l += 1
          return out

      assert three_sum([-1, 0, 1, 2, -1, -4]) == [[-1, -1, 2], [-1, 0, 1]]
      assert three_sum([0, 0, 0, 0]) == [[0, 0, 0]]
    note: "Skipping repeats is the part people forget. Without it you return the same triple twice."

  - kind: check
    kicker: Your turn
    title: "Can I use it?"
    question: "You must find two numbers that sum to a target in an **unsorted** list, and you may not sort it. Best choice?"
    options:
      - { text: "Two pointers from both ends", why: "Moving fingers relies on the order. Unsorted data breaks the reasoning." }
      - { text: "A set or dict, one pass", correct: true, why: "Hashing needs no order. O(n) time." }
      - { text: "Binary search", why: "Needs sorted data too." }
      - { text: "A stack", why: "Unrelated to sums." }

  - kind: code
    kicker: Same direction
    title: "Remove duplicates in place"
    intro: "Not every two-pointer problem uses both ends. Here **read** scans every item and **write** marks where the next unique value goes."
    lang: python
    code: |
      def dedupe(a):
          if not a:
              return 0
          w = 1
          for r in range(1, len(a)):
              if a[r] != a[w - 1]:
                  a[w] = a[r]
                  w += 1
          return w          # length of the unique prefix

      a = [1, 1, 2, 2, 2, 3]
      k = dedupe(a)
      assert k == 3 and a[:k] == [1, 2, 3]
      assert dedupe([]) == 0
    note: "Same shape as move zeroes from the arrays lesson. One pass, no extra list."

  - kind: check
    kicker: Practice
    title: "Which side moves?"
    question: "Container with most water: heights at both ends, the **shorter** wall limits the water. Which pointer should you move inward?"
    options:
      - { text: "The pointer at the taller wall", why: "Width shrinks and the shorter wall still limits. Never better." }
      - { text: "The pointer at the shorter wall", correct: true, why: "Only a taller wall can raise the limit. Moving the taller one cannot help." }
      - { text: "Both together", why: "You could skip the best answer." }
      - { text: "Always the left", why: "Nothing guarantees that is right." }

  - kind: practice
    kicker: Your turn
    title: "Is it a palindrome"
    intro: "Write `is_palindrome(s)` that is true when the string reads the same both ways, ignoring case and anything that is not a letter or digit. Use two pointers, one from each end."
    entry: is_palindrome
    starter: |
      def is_palindrome(s):
          pass
    solution: |
      def is_palindrome(s):
          t = [c.lower() for c in s if c.isalnum()]
          i, j = 0, len(t) - 1
          while i < j:
              if t[i] != t[j]:
                  return False
              i += 1
              j -= 1
          return True
    tests:
      - { input: "[\"A man, a plan, a canal: Panama\"]", expected: "true" }
      - { input: "[\"race a car\"]", expected: "false" }
      - { input: "[\"\"]", expected: "true" }
    hint: "Clean the string first, then move i up and j down while they match."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting to sort first.** The method needs order. Sorting costs O(n log n)."
      - "**`l <= r` vs `l < r`.** For pairs you want `<` so a number is not paired with itself."
      - "**Not moving a pointer.** An iteration that changes neither finger loops forever."
      - "**Returning indexes after sorting.** Sorting moves items. Keep the original positions if the question asks for them."
    next: { label: "Next: sliding window", href: /learn/dsa-sliding-window }
