id: auth-and-sessions
title: Auth and sessions
order: 41
minutes: 9
params:
  - { id: cost, label: "time to check one password (ms)", min: 1, max: 500, step: 1, init: 100 }
  - { id: list, label: "weak passwords an attacker tries (thousands)", min: 10, max: 1000, step: 10, init: 100 }
derived:
  - { id: secs, expr: "list * cost" }
  - { id: hrs, expr: "secs / 3600" }
  - { id: fast, expr: "list / 3600" }
cards:
  - kind: story
    kicker: Start here
    title: How login stays logged in
    body:
      - "A web request carries no memory. The server does not know that the request now arriving is from the person who logged in a minute ago."
      - "So after login the server hands your browser a **session** token, usually in a cookie. The browser sends it back every time as proof."
    callout: "Log in once. Prove it on every request."

  - kind: lab
    kicker: See it first
    title: Login, cookie, request
    intro: "Follow one visit. Below the flow, see why the server stores a slow **hash** of your password, never the password itself. **Drag the sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. Send credentials", note: "email and password travel over HTTPS", color: "#38bdf8" }
        - { label: "2. Check the hash", note: "the server hashes the attempt, which takes {cost} ms on purpose", color: "#a78bfa" }
        - { label: "3. Set a cookie", note: "a random session id the browser stores", color: "#f59e0b" }
        - { label: "4. Later requests", note: "the browser sends the cookie, the server looks it up", color: "#1cd6ac" }
    also:
      type: bars
      max: 150
      items:
        - { label: "hours to try the list with this hash", value: hrs, color: "#1cd6ac" }
        - { label: "hours if the check took 1 ms", value: fast, color: "#ef4444" }
    sliders: [cost, list]
    outro: "At {cost} ms a try, working through {list} thousand guesses takes **{hrs} hours**. With a 1 ms check it would take only **{fast} hours**."

  - kind: formula
    kicker: Read the formula
    title: Time to guess a list
    tex: "t = \\frac{N \\cdot c}{3600}"
    say: "Multiply the number of guesses by the time each one costs. Divide by 3600 to turn seconds into hours."
    verify:
      - { expr: "secs", equals: 10000, tol: 0.5 }
      - { expr: "hrs", equals: 2.78, tol: 0.01 }
      - { expr: "fast", equals: 0.0278, tol: 0.001 }
    symbols:
      - { tex: "t", means: "hours the attacker needs", value: hrs }
      - { tex: "N", means: "guesses in thousands, as the slider shows", value: list }
      - { tex: "c", means: "milliseconds your server spends checking one password", value: cost }
      - { tex: "3600", means: "seconds in an hour" }

  - kind: code
    kicker: Read it
    title: Hash, never store
    intro: "A library like bcrypt adds a random **salt** and is deliberately slow. You store only the hash."
    lang: python
    code: |
      import bcrypt

      # sign up
      hashed = bcrypt.hashpw(password.encode(), bcrypt.gensalt())
      save_user(email, hashed)

      # login
      ok = bcrypt.checkpw(attempt.encode(), stored_hash)
    note: "Never write your own hashing, and never use a plain fast hash such as MD5 for passwords."

  - kind: code
    kicker: Read it
    title: A safe session cookie
    intro: "Three flags matter. **HttpOnly** hides it from page scripts, **Secure** limits it to HTTPS, and **SameSite** blocks most cross-site abuse."
    lang: python
    code: |
      response.set_cookie(
          "session", session_id,
          httponly=True, secure=True, samesite="lax",
          max_age=60 * 60 * 24 * 7,
      )
    note: "The session id is random and meaningless. The server maps it to the user in its own store."

  - kind: check
    kicker: Check yourself
    title: What to store
    question: "What should a database store for a user's password?"
    options:
      - { text: "A salted, slow hash of it", correct: true, why: "If the database leaks, attackers still cannot read the passwords directly." }
      - { text: "The password, encrypted with a key", why: "Anyone who steals the key can decrypt every password. A hash cannot be reversed." }
      - { text: "The password in plain text", why: "A single leak would expose every account." }

  - kind: check
    kicker: Check yourself
    title: Where to enforce access
    question: "A page hides the Admin button from normal users. Is that enough to protect admin actions?"
    options:
      - { text: "No, the server must check permission on every admin request", correct: true, why: "Anyone can call your API directly, so hiding a button protects nothing." }
      - { text: "Yes, since users cannot see the button", why: "They can send the request by hand without any button." }
      - { text: "Yes, if the button is built with a framework", why: "The framework does not matter. Client code is always visible and changeable." }

  - kind: practice
    kicker: Your turn
    title: "Has the token expired"
    intro: "A session token is valid for `ttl` seconds after it was issued. Write `expired(issued, ttl, now)` returning true once `now` is at or past the expiry time."
    entry: expired
    starter: |
      def expired(issued, ttl, now):
          pass
    solution: |
      def expired(issued, ttl, now):
          return now >= issued + ttl
    tests:
      - { input: "[100, 60, 159]", expected: "false" }
      - { input: "[100, 60, 160]", expected: "true" }
      - { input: "[0, 10, 5]", expected: "false" }
    hint: "Expiry time is issued plus ttl."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Checking permission only in the UI.** Enforce it in the route handler, every time."
      - "**Tokens in local storage.** Page scripts can read them. Prefer HttpOnly cookies."
      - "**Rolling your own login.** Use a trusted library or service, and spend your time on the product."
    next: { label: "Next: caching and queues", href: /learn/caching-and-queues }
