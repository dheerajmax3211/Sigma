id: "vis-multimodal-fusion"
title: "Vision-language models: fusing modalities"
minutes: 14
order: 905
params:
  - { id: "im", label: "images in the prompt", min: 1, max: 10, step: 1, init: 2 }
derived:
  - { id: "it", expr: "im * 256" }
  - { id: "left", expr: "4096 - it - 200" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Pictures become tokens for a language model"
    body:
      - "A **vision-language model** takes an image encoder and a language model and joins them. A small **projector** maps each image feature into the language model's embedding space. The image then becomes a run of tokens placed before the text."
      - "From then on the language model treats them like words. This is early fusion. Other designs add cross-attention layers, or combine scores at the end, called late fusion."
    callout: "Same transformer, a few extra tokens."
  - kind: "lab"
    kicker: "See it"
    title: "Images use context"
    intro: "Each image becomes 256 tokens in a model with a 4096 token window, and the question takes 200. **Drag the number of images.**"
    view:
      type: "bars"
      max: 4096
      items:
        - { label: "tokens used by images", value: "it", color: "#f97316" }
        - { label: "the whole window", value: "4096", color: "#38bdf8" }
        - { label: "room left for the answer", value: "left", color: "#1cd6ac" }
    sliders:
      - "im"
    outro: "{im} images take **{it} tokens**, leaving **{left}** for reading and answering."
  - kind: "code"
    kicker: "Write it"
    title: "Project and concatenate"
    intro: "A linear map moves an image feature into the text space."
    lang: "python"
    code: |
      W = [[1, 0], [0, 1], [1, 1]]          # 3 image features to 2 text dimensions

      def project(f):
          return [sum(f[i] * W[i][j] for i in range(3)) for j in range(2)]

      image_features = [[1, 2, 3], [0, 1, 0]]
      image_tokens = [project(f) for f in image_features]
      assert image_tokens == [[4, 5], [0, 1]]

      text_tokens = [[7, 7], [8, 8], [9, 9]]
      sequence = image_tokens + text_tokens
      assert len(sequence) == 5
      assert sequence[0] == [4, 5]
    note: "Training often freezes both encoders at first and trains only the projector, then unfreezes more."
  - kind: "lab"
    kicker: "Memorise"
    title: "Fusion styles"
    intro: "Three ways to combine."
    view:
      type: "flow"
      stages:
        - { label: "Early", note: "Image tokens enter the language model directly.", color: "#1cd6ac" }
        - { label: "Cross-attention", note: "Text layers attend to image features.", color: "#38bdf8" }
        - { label: "Late", note: "Separate models, scores combined at the end.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Tokens"
    question: "Why does a high-resolution image cost so much?"
    options:
      - { text: "It becomes many tokens in the context window", correct: true, why: "Cost grows with token count." }
      - { text: "Colours are expensive", why: "No." }
      - { text: "The projector is huge", why: "No." }
      - { text: "Images cannot be batched", why: "They can." }
  - kind: "check"
    kicker: "Practice"
    title: "Projector"
    question: "What does the projector do?"
    options:
      - { text: "Maps image features into the language model's space", correct: true, why: "So the model can read them." }
      - { text: "Resizes the picture", why: "No." }
      - { text: "Generates captions alone", why: "No." }
      - { text: "Removes noise", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Too many images.** The context fills."
      - "**Expecting perfect counting and text reading.** Check small details."
      - "**Skipping evaluation on your own images.** Benchmarks differ."
    next: { label: "Next: diffusion, adding noise", href: "/learn/vis-diffusion-forward" }
