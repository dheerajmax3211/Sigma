id: "ml-pca"
title: "PCA: fewer dimensions, most of the information"
minutes: 13
order: 508
params:
  - { id: "c", label: "components kept", min: 1, max: 8, step: 1, init: 2 }
derived:
  - { id: "kept", expr: "100 * (1 - 0.5 ^ c)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Rotate, then drop the dull directions"
    body:
      - "Data with many features often lives close to a flatter shape. **Principal component analysis** finds the direction where the data spreads out most, then the next one at right angles, and so on."
      - "Keep the first few directions and drop the rest. You lose a little spread and gain a smaller, faster, less noisy dataset."
    callout: "Used for plotting, speeding up models, and removing noise."
  - kind: "lab"
    kicker: "See it"
    title: "How much spread you keep"
    intro: "Each later direction holds less of the spread. Here each holds half of the one before. **Drag the count.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "spread kept", value: "kept", color: "#1cd6ac" }
        - { label: "all of it", value: "100", color: "#38bdf8" }
    sliders:
      - "c"
    outro: "Keeping {c} directions keeps **{kept} percent** of the spread. Pick the smallest count that keeps enough, often 90 to 95 percent."
  - kind: "code"
    kicker: "Write it"
    title: "Project onto a direction"
    intro: "Centre the data, project it onto a unit direction, and measure the spread that remains."
    lang: "python"
    code: |
      import math

      pts = [(1, 2), (2, 4), (3, 6)]
      mx = sum(p[0] for p in pts) / 3
      my = sum(p[1] for p in pts) / 3
      c = [(x - mx, y - my) for x, y in pts]

      u = (1 / math.sqrt(5), 2 / math.sqrt(5))
      proj = [x * u[0] + y * u[1] for x, y in c]
      var_proj = sum(v * v for v in proj) / 3
      var_total = sum(x * x + y * y for x, y in c) / 3

      assert abs(var_proj - var_total) < 1e-9
      assert abs(var_total - 10 / 3) < 1e-9
    note: "These points sit on a line, so one direction keeps all the spread. Real data keeps most of it."
  - kind: "lab"
    kicker: "Memorise"
    title: "Steps in practice"
    intro: "Order matters."
    view:
      type: "flow"
      stages:
        - { label: "Scale", note: "Put every feature on the same footing first.", color: "#38bdf8" }
        - { label: "Fit on train", note: "Learn the directions from training data only.", color: "#1cd6ac" }
        - { label: "Transform", note: "Apply the same directions to validation and test.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Unscaled PCA"
    question: "You run PCA on unscaled features in different units. What happens?"
    options:
      - { text: "The largest-valued feature dominates the first direction", correct: true, why: "Spread depends on units, so scale first." }
      - { text: "Nothing", why: "Units matter." }
      - { text: "It uses labels", why: "PCA ignores labels." }
      - { text: "It fails", why: "It runs, misleadingly." }
  - kind: "check"
    kicker: "Practice"
    title: "Labels"
    question: "Does PCA use the labels?"
    options:
      - { text: "No, it only looks at spread in the features", correct: true, why: "The top directions need not separate your classes." }
      - { text: "Yes, it maximises class separation", why: "That is a different method." }
      - { text: "Only in training", why: "Never." }
      - { text: "Only for two classes", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Fitting on all data.** Leaks the test set. Fit on train."
      - "**Assuming top directions are most predictive.** They are most spread."
      - "**Using it on categories** that have no meaningful distance."
    next: { label: "Next: imbalanced data", href: "/learn/ml-imbalanced-data" }
