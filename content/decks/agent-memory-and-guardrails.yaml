id: agent-memory-and-guardrails
title: Agent memory and guardrails
order: 36
minutes: 9
params:
  - { id: risk, label: "risk of this action (0 to 10)", min: 0, max: 10, step: 1, init: 4 }
  - { id: lim, label: "approval limit", min: 1, max: 9, step: 1, init: 6 }
derived:
  - { id: ask, expr: "min(1, ceil(max(risk - lim, 0)))" }
  - { id: auto, expr: "1 - ask" }
cards:
  - kind: story
    kicker: Start here
    title: Useful and safe
    body:
      - "An agent remembers in two ways. **Short-term memory** is the conversation inside the model's context. **Long-term memory** is a store, like a database, that it searches."
      - "A useful agent can also do harm. A wrong tool call can delete files or email a customer. So you add **guardrails**."
    callout: "Remember what helps. Block what hurts."

  - kind: lab
    kicker: See it first
    title: Run it, or ask first
    intro: "Give every action a risk score. Below your limit the agent acts on its own. Above it, a human must approve. **Drag the sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. Model proposes", note: "an action with risk **{risk}** out of 10", color: "#a78bfa" }
        - { label: "2. Check the input", note: "validate the arguments before anything runs", color: "#f59e0b" }
        - { label: "3. Risk gate", note: "your limit is **{lim}**, and risk above it needs approval", color: "#ef4444" }
        - { label: "4. Run and check", note: "execute, then validate the output too", color: "#1cd6ac" }
    also:
      type: bars
      max: 1
      items:
        - { label: "runs automatically", value: auto, color: "#1cd6ac" }
        - { label: "asks the user first", value: ask, color: "#ef4444" }
    sliders: [risk, lim]
    outro: "With risk {risk} against a limit of {lim}, the action **{auto}** runs automatically and **{ask}** needs approval. A 1 means yes, a 0 means no."

  - kind: formula
    kicker: Read the formula
    title: The approval rule
    tex: "\\text{ask} = \\begin{cases} 1 & r \\gt t \\\\ 0 & r \\le t \\end{cases}"
    say: "If the risk r is above the limit t, ask a human. If it is at or below the limit, let the agent run."
    verify:
      - { expr: "ask", equals: 0, tol: 0.01 }
      - { expr: "auto", equals: 1, tol: 0.01 }
      - { expr: "min(1, ceil(max(7 - 6, 0)))", equals: 1, tol: 0.01 }
    symbols:
      - { tex: "r", means: "how risky this action is, from 0 to 10", value: risk }
      - { tex: "t", means: "the limit above which you want a human to decide", value: lim }
      - { tex: "\\text{ask}", means: "1 means ask the user, 0 means run on its own", value: ask }

  - kind: code
    kicker: Read it
    title: A guard in front of a tool
    intro: "Validate the input, check the risk, and only then call the tool. Dangerous tools default to asking."
    lang: python
    code: |
      RISK = {"search_docs": 1, "send_email": 7, "delete_file": 9}
      LIMIT = 6

      def guarded_call(name, args):
          if name not in RISK:
              raise ValueError("unknown tool")
          if RISK[name] > LIMIT and not user_approves(name, args):
              return "Action declined by the user"
          return TOOLS[name](**args)
    note: "Unknown tools are refused. Never let the model invent a tool name and have your code run it."

  - kind: story
    kicker: Memory in practice
    title: What to keep
    body:
      - "The context window is small and costs tokens every call. Keep recent messages, and summarise old ones."
      - "Store durable facts, such as a user's preferences, in a database. Fetch only the few that match the current task."
    callout: "Do not stuff everything into context."

  - kind: check
    kicker: Check yourself
    title: Which action asks
    question: "The limit is 6. Which action needs a human to approve it?"
    options:
      - { text: "delete_file, with risk 9", correct: true, why: "9 is above 6, so a person must approve it." }
      - { text: "search_docs, with risk 1", why: "1 is below the limit, so it runs on its own." }
      - { text: "Any action, since models are untrustworthy", why: "Asking about everything makes the agent useless. Use a risk threshold." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Trusting the model's arguments.** Validate types and ranges in code before running a tool."
      - "**Trusting tool output.** A web page can contain text that tries to give the model new orders."
      - "**One broad key.** Give each tool the least access it needs, so a mistake stays small."
    next: { label: "Next: Postgres and pgvector", href: /learn/postgres-and-pgvector }
