id: "ml-gradient-boosting"
title: "Gradient boosting"
minutes: 15
order: 503
params:
  - { id: "lr", label: "learning rate", min: 0.1, max: 1, step: 0.05, init: 0.5 }
  - { id: "rounds", label: "rounds", min: 0, max: 30, step: 1, init: 5 }
derived:
  - { id: "left", expr: "100 * (1 - lr) ^ rounds" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Each tree fixes the last one's mistakes"
    body:
      - "**Boosting** builds trees one after another. Each new small tree is trained on the **errors** the ensemble still makes, then added with a small weight."
      - "In forests the trees work alone and are averaged. In boosting they work as a team in sequence. This is why boosting wins most table data contests, in tools such as XGBoost and LightGBM."
    callout: "Small learning rate with many trees usually beats a big one with few."
  - kind: "lab"
    kicker: "See it"
    title: "Shrinking the error"
    intro: "Each round removes a share of the remaining error equal to the learning rate. **Drag the sliders.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "error left after the rounds", value: "left", color: "#f97316" }
        - { label: "starting error", value: "100", color: "#38bdf8" }
    sliders:
      - "lr"
      - "rounds"
    outro: "With rate {lr} and {rounds} rounds, **{left} percent** of the error remains. A small rate is slower but safer."
  - kind: "code"
    kicker: "Write it"
    title: "Boosting by hand"
    intro: "A stump predicts the mean on each side of a cut. Each round fits the residuals."
    lang: "python"
    code: |
      def stump(xs, ys, t):
          L = [y for x, y in zip(xs, ys) if x <= t]
          R = [y for x, y in zip(xs, ys) if x > t]
          ml, mr = sum(L) / len(L), sum(R) / len(R)
          return lambda x: ml if x <= t else mr

      def boost(xs, ys, t, lr, rounds):
          pred = [0.0] * len(xs)
          for _ in range(rounds):
              res = [y - p for y, p in zip(ys, pred)]
              f = stump(xs, res, t)
              pred = [p + lr * f(x) for p, x in zip(pred, xs)]
          return pred

      xs, ys = [1, 2, 3, 4], [1, 1, 5, 5]
      assert boost(xs, ys, 2.5, 0.5, 1) == [0.5, 0.5, 2.5, 2.5]
      assert boost(xs, ys, 2.5, 0.5, 2) == [0.75, 0.75, 3.75, 3.75]
    note: "For squared error the residual is the negative gradient. That is the gradient in gradient boosting."
  - kind: "lab"
    kicker: "Memorise"
    title: "Compare"
    intro: "Two ways to combine trees."
    view:
      type: "flow"
      stages:
        - { label: "Random forest", note: "Deep trees in parallel. Average. Cuts variance.", color: "#38bdf8" }
        - { label: "Gradient boosting", note: "Shallow trees in sequence. Fix errors. Cuts bias.", color: "#1cd6ac" }
        - { label: "Tuning", note: "Boosting needs more care but usually scores higher.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Too many rounds"
    question: "Boosting keeps lowering training loss but validation loss rises. What do you do?"
    options:
      - { text: "Stop early at the best validation round", correct: true, why: "Early stopping is the standard guard." }
      - { text: "Add more rounds", why: "That overfits further." }
      - { text: "Raise the learning rate", why: "That speeds overfitting." }
      - { text: "Delete the validation set", why: "You would lose your warning." }
  - kind: "check"
    kicker: "Practice"
    title: "Boosted trees depth"
    question: "Boosting usually uses shallow trees. Why?"
    options:
      - { text: "Each tree only needs to fix a bit, and many weak trees add up", correct: true, why: "Deep trees would overfit the residuals." }
      - { text: "Deep trees cannot be trained", why: "They can." }
      - { text: "It saves memory only", why: "The reason is accuracy." }
      - { text: "Shallow trees are faster than anything", why: "Not the main point." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**No early stopping.** Boosting will memorise."
      - "**High learning rate with many rounds.** Unstable."
      - "**Tuning on the test set.** Use a validation split."
    next: { label: "Next: nearest neighbours", href: "/learn/ml-knn-distance" }
