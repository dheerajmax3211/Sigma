id: dsa-greedy
title: "Greedy algorithms"
minutes: 13
order: 123
params:
  - { id: amt, label: "amount", min: 1, max: 99, step: 1, init: 63 }
derived:
  - { id: q, expr: "floor(amt / 25)" }
  - { id: r1, expr: "amt - 25 * q" }
  - { id: d, expr: "floor(r1 / 10)" }
  - { id: r2, expr: "r1 - 10 * d" }
  - { id: nk, expr: "floor(r2 / 5)" }
  - { id: p, expr: "r2 - 5 * nk" }
  - { id: coins, expr: "q + d + nk + p" }
cards:
  - kind: story
    kicker: Start here
    title: "Take the best thing right now"
    body:
      - "A **greedy** algorithm picks the best option at each step and never looks back. It is fast and simple."
      - "It only works when the best local choice also leads to the best overall answer. You must **argue** why, or test with a counter-example."
    callout: "Clue words: minimum number of, maximum number of, earliest, largest first. If a small example breaks greedy, use DP."

  - kind: lab
    kicker: See it
    title: "Making change"
    intro: "Coins are 25, 10, 5 and 1. Always take the biggest coin that fits. **Drag the amount.**"
    view:
      type: bars
      max: 4
      items:
        - { label: "25 cent coins", value: q, color: "#38bdf8" }
        - { label: "10 cent coins", value: d, color: "#1cd6ac" }
        - { label: "5 cent coins", value: nk, color: "#f97316" }
        - { label: "1 cent coins", value: p, color: "#a78bfa" }
    sliders: [amt]
    outro: "{amt} cents takes **{coins}** coins. For these coin values, biggest-first is provably optimal."

  - kind: check
    kicker: Your turn
    title: "Does greedy always work?"
    question: "Coins are 1, 3 and 4. To make 6, greedy takes 4 + 1 + 1 (3 coins). What is the best answer?"
    options:
      - { text: "3 + 3, which is 2 coins", correct: true, why: "Greedy failed here. These coin values need dynamic programming." }
      - { text: "4 + 1 + 1 is best", why: "3 + 3 uses fewer coins." }
      - { text: "6 coins of 1", why: "Far worse." }
      - { text: "It is impossible", why: "3 + 3 works." }

  - kind: code
    kicker: Write it
    title: "Jump game"
    intro: "Each number is the longest jump from that spot. Track the **farthest** index reachable. If you stand beyond it, you are stuck."
    lang: python
    code: |
      def can_jump(nums):
          far = 0
          for i, x in enumerate(nums):
              if i > far:
                  return False
              far = max(far, i + x)
          return True

      assert can_jump([2, 3, 1, 1, 4])
      assert not can_jump([3, 2, 1, 0, 4])
      assert can_jump([0])
    note: "O(n) time, O(1) space. The greedy fact: reaching farther never hurts."

  - kind: code
    kicker: Write it
    title: "Most meetings in one room"
    intro: "Sort by **end time**. Take a meeting if it starts after the last one ended. Finishing earliest leaves the most room."
    lang: python
    code: |
      def max_meetings(meetings):
          count, last_end = 0, float("-inf")
          for s, e in sorted(meetings, key=lambda m: m[1]):
              if s >= last_end:
                  count += 1
                  last_end = e
          return count

      assert max_meetings([(1, 3), (2, 4), (3, 5), (0, 6), (5, 7)]) == 3
      assert max_meetings([]) == 0
    note: "Sorting by start time or by length fails on small examples. Sorting by end time is the one that is provable."

  - kind: check
    kicker: Practice
    title: "Which sort key?"
    question: "To fit the most non-overlapping meetings, what should you sort by?"
    options:
      - { text: "End time", correct: true, why: "The meeting that finishes first leaves the most time for others." }
      - { text: "Start time", why: "One long early meeting would block everything." }
      - { text: "Shortest length", why: "A short meeting in the middle can block two others." }
      - { text: "Alphabetical", why: "Unrelated to timing." }

  - kind: practice
    kicker: Your turn
    title: "Jump game"
    intro: "Each number is how far you can jump from that spot. Write `can_reach(nums)` that is true if you can get to the last index starting from index 0. Track the furthest reach."
    entry: can_reach
    starter: |
      def can_reach(nums):
          pass
    solution: |
      def can_reach(nums):
          far = 0
          for i, x in enumerate(nums):
              if i > far:
                  return False
              far = max(far, i + x)
          return True
    tests:
      - { input: "[[2,3,1,1,4]]", expected: "true" }
      - { input: "[[3,2,1,0,4]]", expected: "false" }
      - { input: "[[0]]", expected: "true" }
    hint: "If you are standing past your furthest reach, you are stuck."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Assuming greedy works.** Try 3 small examples that try to break it."
      - "**Wrong sort key.** The key is the whole algorithm."
      - "**Ignoring ties.** Decide what happens when two choices look equal."
      - "**Using greedy for counting ways.** That is a DP job."
    next: { label: "Next: intervals", href: /learn/dsa-intervals }
