id: dsa-intervals
title: "Intervals"
minutes: 12
order: 124
params:
  - { id: s, label: "step", min: 0, max: 2, step: 1, init: 0 }
cards:
  - kind: story
    kicker: Start here
    title: "Ranges on a line"
    body:
      - "An **interval** is a start and an end: a meeting from 1 to 3, a booking, a time range in a log."
      - "Nearly every interval problem begins the same way: **sort by start**. After that, neighbours are the only ones that can overlap, so one pass is enough."
    callout: "Clue words: merge, overlap, meeting rooms, insert interval, free time, schedule."

  - kind: lab
    kicker: See it
    title: "Merge overlapping ranges"
    intro: "Intervals are 1-3, 2-6 and 8-9, already sorted by start. **Drag the step.**"
    view:
      type: array
      cells: ["1-3", "2-6", "8-9"]
      frames:
        - ["1-3", "2-6", "8-9"]
        - ["1-6", "·", "8-9"]
        - ["1-6", "·", "8-9"]
      frame: s
      pointers:
        - { label: "looking at", at: "pick(s, 1, 1, 2)", color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Sorted by start. Compare each interval to the last merged one."
      - "2 is not past the end 3, so they **overlap**. Merge into 1-6, taking the larger end."
      - "8 is past the end 6, so there is a gap. 8-9 stays separate. Result: 1-6 and 8-9."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Merge intervals"
    intro: "Keep a result list. If the next start is at or before the last end, extend the last end. Otherwise append."
    lang: python
    code: |
      def merge(iv):
          out = []
          for s, e in sorted(iv):
              if out and s <= out[-1][1]:
                  out[-1][1] = max(out[-1][1], e)
              else:
                  out.append([s, e])
          return out

      assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]
      assert merge([[1, 4], [4, 5]]) == [[1, 5]]
      assert merge([]) == []
    note: "O(n log n) for the sort, then one O(n) pass. The `max` matters: [1, 10] then [2, 3] must stay [1, 10]."

  - kind: check
    kicker: Your turn
    title: "Touching ends"
    question: "Are [1, 4] and [4, 5] overlapping for a merge problem that says 'closed intervals'?"
    options:
      - { text: "Yes, they share the point 4 and merge to [1, 5]", correct: true, why: "Closed means both ends count. Always read whether ends are inclusive." }
      - { text: "No, they only touch", why: "Closed intervals include the end point." }
      - { text: "Cannot merge ever", why: "They merge." }
      - { text: "Only if length equal", why: "Length is irrelevant." }

  - kind: code
    kicker: Write it
    title: "How many meeting rooms?"
    intro: "Sort the starts and the ends separately. Walk through time. A start takes a room, an end frees one. The most rooms in use at once is the answer."
    lang: python
    code: |
      def min_rooms(meetings):
          starts = sorted(s for s, _ in meetings)
          ends = sorted(e for _, e in meetings)
          rooms = best = j = 0
          for s in starts:
              while ends[j] <= s:        # someone already left
                  j += 1
                  rooms -= 1
              rooms += 1
              best = max(best, rooms)
          return best

      assert min_rooms([(0, 30), (5, 10), (15, 20)]) == 2
      assert min_rooms([(7, 10), (2, 4)]) == 1
    note: "A min-heap of end times also works. This two-sorted-lists version is shorter."

  - kind: check
    kicker: Practice
    title: "Where is the work?"
    question: "Merge intervals runs in O(n log n). Which step costs the log?"
    options:
      - { text: "The initial sort", correct: true, why: "The merge pass itself is a single O(n) loop." }
      - { text: "The merge loop", why: "It visits each interval once." }
      - { text: "The max call", why: "Constant time." }
      - { text: "The append", why: "Amortised constant." }

  - kind: practice
    kicker: Your turn
    title: "Merge intervals"
    intro: "Write `merge_intervals(iv)` that merges overlapping `[start, end]` pairs. Touching counts as overlapping. Return them sorted by start."
    entry: merge_intervals
    starter: |
      def merge_intervals(iv):
          pass
    solution: |
      def merge_intervals(iv):
          out = []
          for s, e in sorted(iv):
              if out and s <= out[-1][1]:
                  out[-1][1] = max(out[-1][1], e)
              else:
                  out.append([s, e])
          return out
    tests:
      - { input: "[[[1,3],[2,6],[8,10],[15,18]]]", expected: "[[1,6],[8,10],[15,18]]" }
      - { input: "[[[1,4],[4,5]]]", expected: "[[1,5]]" }
      - { input: "[[[1,2]]]", expected: "[[1,2]]" }
    hint: "Sort by start. Extend the last interval if the next one starts inside it."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Not sorting.** The one-pass trick needs sorted starts."
      - "**Using the new end instead of the larger end.** A long interval can swallow later ones."
      - "**Off-by-one on touching ends.** Check whether the problem treats them as overlapping."
      - "**Mutating while iterating.** Build a new result list."
    next: { label: "Next: dynamic programming 1D", href: /learn/dsa-dp-1d }
