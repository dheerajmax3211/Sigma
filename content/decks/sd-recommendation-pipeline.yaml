id: "sd-recommendation-pipeline"
title: "Recommendation pipelines"
minutes: 14
order: 605
params:
  - { id: "items", label: "items the ranker scores", min: 10, max: 2000, step: 10, init: 500 }
derived:
  - { id: "total", expr: "items * 0.05" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "From millions of items to ten"
    body:
      - "You cannot score every item for every user in 100 milliseconds. Real systems work as a **funnel**."
      - "**Candidate generation** cheaply picks a thousand or so items. A **ranker** scores those carefully. A final step applies rules such as variety and removing already-seen items."
    callout: "Cheap and wide first, costly and narrow last."
  - kind: "lab"
    kicker: "See it"
    title: "A latency budget"
    intro: "Say the ranker takes 0.05 milliseconds per item. The page must answer within 100 milliseconds. **Drag the item count.**"
    view:
      type: "bars"
      max: 120
      items:
        - { label: "time spent ranking (ms)", value: "total", color: "#f97316" }
        - { label: "whole request budget (ms)", value: "100", color: "#38bdf8" }
    sliders:
      - "items"
    outro: "Ranking {items} items takes **{total} ms**. Past about 2000 items the ranker alone eats the budget."
  - kind: "code"
    kicker: "Write it"
    title: "Two stages"
    intro: "Stage one is a fast dot product. Stage two is a slower scoring function on the survivors."
    lang: "python"
    code: |
      def candidates(user, items, k):
          score = lambda it: sum(a * b for a, b in zip(user, it[1]))
          return sorted(items, key=score, reverse=True)[:k]

      def rank(cands, boost):
          return sorted(cands, key=lambda it: it[2] + boost.get(it[0], 0), reverse=True)

      items = [("a", [1, 0], 0.2), ("b", [0.9, 0.1], 0.9), ("c", [0, 1], 0.99)]
      c = candidates([1, 0], items, 2)
      assert [x[0] for x in c] == ["a", "b"]
      assert [x[0] for x in rank(c, {})] == ["b", "a"]
      assert [x[0] for x in rank(c, {"a": 1})] == ["a", "b"]
    note: "Item c scores highest in the ranker but never reaches it. The funnel can drop good items early, so measure stage one recall."
  - kind: "lab"
    kicker: "Memorise"
    title: "The stages"
    intro: "Each has a different job."
    view:
      type: "flow"
      stages:
        - { label: "Retrieve", note: "Embeddings and nearest neighbours. Thousands out.", color: "#38bdf8" }
        - { label: "Rank", note: "A bigger model on rich features. Hundreds in.", color: "#1cd6ac" }
        - { label: "Re-rank", note: "Rules for variety, freshness and safety.", color: "#f97316" }
        - { label: "Log", note: "Record shown items for the next training run.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why two stages"
    question: "Why not run the big model on every item?"
    options:
      - { text: "It is far too slow and costly at that scale", correct: true, why: "The funnel spends compute where it matters." }
      - { text: "Big models are inaccurate", why: "They are more accurate." }
      - { text: "It breaks the cache", why: "No." }
      - { text: "Users dislike it", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Feedback loop"
    question: "The model only learns from items it showed. What is the risk?"
    options:
      - { text: "It never learns about items it never showed", correct: true, why: "Add exploration so new items get a chance." }
      - { text: "It overtrains on time", why: "Not the issue." }
      - { text: "It runs out of memory", why: "No." }
      - { text: "Nothing", why: "There is a real bias." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Ignoring recall of stage one.** The ranker cannot save missed items."
      - "**No exploration.** The system gets stuck on its own history."
      - "**Offline metrics only.** Run an A/B test."
    next: { label: "Next: CTR and fraud", href: "/learn/sd-ctr-fraud-labels" }
