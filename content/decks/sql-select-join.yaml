id: sql-select-join
title: SQL select and join
order: 12
minutes: 9
params:
  - { id: cut, label: "price above", min: 0, max: 25, step: 1, init: 8 }
  - { id: orders, label: "rows in orders", min: 1, max: 10, step: 1, init: 6 }
  - { id: nomatch, label: "orders with no customer", min: 0, max: 5, step: 1, init: 1 }
derived:
  - { id: kept, expr: "min(1, ceil(max(3 - cut, 0))) + min(1, ceil(max(5 - cut, 0))) + min(1, ceil(max(8 - cut, 0))) + min(1, ceil(max(9 - cut, 0))) + min(1, ceil(max(12 - cut, 0))) + min(1, ceil(max(15 - cut, 0))) + min(1, ceil(max(20 - cut, 0))) + min(1, ceil(max(25 - cut, 0)))" }
  - { id: inner, expr: "max(orders - nomatch, 0)" }
cards:
  - kind: story
    kicker: Start here
    title: A table is a spreadsheet you can question
    body:
      - "A database table is a spreadsheet. Each **row** is one thing, such as a product. Each **column** is one fact about it, such as its price. **SQL** is the language for asking tables questions."
      - "Almost every app you build keeps data this way, including the AI apps later in this path."
    callout: "Ask in three parts: which columns, from which table, and which rows."

  - kind: lab
    kicker: See it first
    title: WHERE keeps only some rows
    intro: "Here is a products table, one bar per row, labelled with its price. The query keeps rows whose price is **above** the cut. **Drag the cut** and watch rows fade away."
    view:
      type: bars
      max: 25
      items:
        - { label: "Eraser (3)", value: "3", color: "#38bdf8", on: "ceil(max(3 - cut, 0))" }
        - { label: "Notebook (5)", value: "5", color: "#38bdf8", on: "ceil(max(5 - cut, 0))" }
        - { label: "Pencil (8)", value: "8", color: "#38bdf8", on: "ceil(max(8 - cut, 0))" }
        - { label: "Stapler (9)", value: "9", color: "#38bdf8", on: "ceil(max(9 - cut, 0))" }
        - { label: "Pen (12)", value: "12", color: "#38bdf8", on: "ceil(max(12 - cut, 0))" }
        - { label: "Folder (15)", value: "15", color: "#38bdf8", on: "ceil(max(15 - cut, 0))" }
        - { label: "Lamp (20)", value: "20", color: "#38bdf8", on: "ceil(max(20 - cut, 0))" }
        - { label: "Desk (25)", value: "25", color: "#38bdf8", on: "ceil(max(25 - cut, 0))" }
    sliders: [cut]
    outro: "WHERE price > {cut} keeps **{kept}** of the 8 rows. Faded bars are filtered out."

  - kind: code
    kicker: Read it
    title: SELECT, FROM and WHERE
    intro: "Read a query in the order **FROM**, **WHERE**, **SELECT**: pick the table, keep rows, then show columns."
    lang: sql
    code: |
      SELECT name, price          -- which columns to show
      FROM products               -- which table to read
      WHERE price > 8             -- which rows to keep
      ORDER BY price DESC;        -- how to sort them
    note: "The order you write a query is not the order the database thinks about it."

  - kind: check
    kicker: Check yourself
    title: Write the query
    question: "You want only the names of products that cost more than 10. Which query is right?"
    options:
      - { text: "SELECT name FROM products WHERE price > 10;", correct: true, why: "It names the column, the table and the row filter, in that order." }
      - { text: "SELECT price FROM products WHERE name > 10;", why: "The columns are swapped. This compares names to 10." }
      - { text: "SELECT name WHERE price > 10;", why: "FROM is missing, so the database does not know which table to read." }

  - kind: lab
    kicker: Try it
    title: JOIN matches rows by a key
    intro: "Orders store only a `customer_id` number. A **JOIN** looks that number up in the customers table. **Drag** how many orders have no matching customer."
    view:
      type: flow
      stages:
        - { label: "orders table", note: "{orders} rows, each with a customer id", color: "#38bdf8" }
        - { label: "JOIN customers ON the id", note: "matches each order to its customer by the shared key", color: "#a78bfa" }
        - { label: "result", note: "**{inner}** rows with the customer name added. A LEFT JOIN would keep all {orders}.", color: "#1cd6ac" }
    sliders: [orders, nomatch]
    outro: "{nomatch} unmatched orders are dropped by a plain JOIN, leaving **{inner}** rows."

  - kind: code
    kicker: Read it
    title: A query with a JOIN
    intro: "Name the shared key after `ON`. When two tables have a column of the same name, write it as `table.column`."
    lang: sql
    code: |
      SELECT customers.name, orders.total
      FROM orders
      JOIN customers ON orders.customer_id = customers.id
      WHERE orders.total > 20;
    note: "A plain `JOIN` keeps only orders that have a customer. `LEFT JOIN` keeps every order and leaves the name empty when none matches."

  - kind: check
    kicker: Check yourself
    title: Count the joined rows
    question: "The orders table has 6 rows and 1 of them has a customer id that is not in customers. How many rows does a plain JOIN return?"
    options:
      - { text: "5", correct: true, why: "The unmatched order has no partner, so a plain JOIN drops it." }
      - { text: "6", why: "That would be a LEFT JOIN, which keeps every order." }
      - { text: "1", why: "That is the number of unmatched rows, which are the ones dropped." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Forgetting WHERE on a delete.** `DELETE FROM users` with no WHERE removes every row."
      - "**SELECT star everywhere.** It pulls columns you do not need. Name the ones you want."
      - "**Joining on the wrong key.** Joining on a column that is not unique multiplies rows."
    next: { label: "Next: fitting a line to data", href: /learn/linear-regression }
