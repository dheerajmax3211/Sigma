id: "au-spectrogram-mel"
title: "Spectrograms and mel features"
minutes: 14
order: 1003
params:
  - { id: "sec", label: "clip length (seconds)", min: 1, max: 30, step: 1, init: 5 }
derived:
  - { id: "frames", expr: "1 + floor((sec * 1000 - 25) / 10)" }
  - { id: "nums", expr: "frames * 80 / 1000" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A picture of sound"
    body:
      - "Speech models rarely read raw samples. They read a **spectrogram**: slice the audio into short windows of about 25 ms, take the Fourier transform of each, and stack the results. Time runs across, pitch runs up, and brightness is loudness."
      - "Human hearing is finer at low pitches than at high ones. The **mel scale** bends the pitch axis to match, and 80 mel bands is the usual choice."
    callout: "Window, transform, squash to mel."
  - kind: "lab"
    kicker: "See it"
    title: "How big is the picture"
    intro: "Windows of 25 ms every 10 ms, with 80 mel bands. **Drag the length.**"
    view:
      type: "bars"
      max: 3000
      items:
        - { label: "frames (columns)", value: "frames", color: "#38bdf8" }
        - { label: "a 30 second clip, for scale", value: "2998", color: "#64748b" }
    sliders:
      - "sec"
    outro: "{sec} seconds give **{frames}** frames and about **{nums} thousand** numbers. Models often shrink the time axis four times before the heavy layers."
  - kind: "code"
    kicker: "Write it"
    title: "Frames and the mel scale"
    intro: "The frame count and the pitch bend."
    lang: "python"
    code: |
      import math

      def n_frames(n_samples, frame=400, hop=160):
          return 1 + (n_samples - frame) // hop

      assert n_frames(16000) == 98                   # one second at 16 kHz
      assert n_frames(16000 * 5) == 498

      def mel(f):
          return 2595 * math.log10(1 + f / 700)

      assert abs(mel(1000) - 1000) < 1               # defined to match here
      assert mel(2000) - mel(1000) < mel(1000) - mel(0)   # high pitches get squeezed
    note: "Frames of 400 samples with a hop of 160 are 25 ms and 10 ms at 16 kHz."
  - kind: "lab"
    kicker: "Memorise"
    title: "The recipe"
    intro: "Same steps for almost every system."
    view:
      type: "flow"
      stages:
        - { label: "Window", note: "Cut 25 ms slices every 10 ms.", color: "#38bdf8" }
        - { label: "Transform", note: "Fourier transform of each slice.", color: "#1cd6ac" }
        - { label: "Mel filter", note: "80 bands that match hearing.", color: "#f97316" }
        - { label: "Log", note: "Compress the loudness range.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Frames"
    question: "How many frames does one second give with a 10 ms hop?"
    options:
      - { text: "About 100", correct: true, why: "One frame every 10 ms." }
      - { text: "About 10", why: "No." }
      - { text: "16000", why: "That is the samples." }
      - { text: "1", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Why mel"
    question: "Why bend the pitch axis to mel?"
    options:
      - { text: "It matches how people hear pitch", correct: true, why: "More detail where hearing is finer." }
      - { text: "It makes audio quieter", why: "No." }
      - { text: "It removes noise", why: "No." }
      - { text: "It saves disk", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Different settings in training and serving.** Features must match exactly."
      - "**Skipping the log.** Loudness varies hugely."
      - "**Forgetting normalisation.** Scale features consistently."
    next: { label: "Next: CTC and speech recognition", href: "/learn/au-ctc-asr" }
