id: "fd-reading-papers"
title: "Reading a paper without drowning"
minutes: 12
order: 712
params:
  - { id: "sec", label: "minutes you spend", min: 5, max: 60, step: 5, init: 15 }
derived:
  - { id: "pass", expr: "min(sec / 5, 3)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "You do not read a paper once"
    body:
      - "A paper is not a story to read start to finish. Experts make **three passes**, each with a different goal, and stop as soon as they have what they need."
      - "The first pass decides whether to read on. The second pass gets the idea. The third pass checks the details, and most papers never need it."
    callout: "Read for the claim, the method and the evidence, in that order."
  - kind: "lab"
    kicker: "See it"
    title: "Three passes"
    intro: "More time buys a deeper pass. **Drag your minutes.**"
    view:
      type: "bars"
      max: 3
      items:
        - { label: "passes you can afford", value: "pass", color: "#f97316" }
        - { label: "passes in full reading", value: "3", color: "#38bdf8" }
    sliders:
      - "sec"
    outro: "With {sec} minutes you can complete about **{pass}** pass. Five minutes for a skim, thirty for the idea, an hour or more for the details."
  - kind: "code"
    kicker: "Write it"
    title: "A reading checklist"
    intro: "Answer these in your own words after each pass."
    lang: "text"
    code: |
      Pass 1 (5 minutes): title, abstract, figures, conclusion.
        What problem? What is the claim? Is it worth my time?

      Pass 2 (30 minutes): method and results, skip the proofs.
        What is the key idea in one sentence?
        What do the main table and figure show?

      Pass 3 (1 hour or more): the details.
        Could I reimplement it? What would I check first?
        What does it not show? What were the baselines?
    note: "Write the one sentence idea before closing the paper. If you cannot, you did not get it."
  - kind: "lab"
    kicker: "Memorise"
    title: "Judge the evidence"
    intro: "Ask these of every results table."
    view:
      type: "flow"
      stages:
        - { label: "Baselines", note: "Compared to strong, tuned alternatives?", color: "#38bdf8" }
        - { label: "Seeds", note: "One run or several?", color: "#1cd6ac" }
        - { label: "Data", note: "Could the test set have leaked?", color: "#f97316" }
        - { label: "Cost", note: "Is the gain worth the extra compute?", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Where to start"
    question: "What is the best first thing to read in a paper?"
    options:
      - { text: "Abstract, figures and conclusion", correct: true, why: "They tell you whether to continue." }
      - { text: "Every equation", why: "That is pass three." }
      - { text: "The references", why: "Not first." }
      - { text: "The appendix", why: "Not first." }
  - kind: "check"
    kicker: "Practice"
    title: "Trust"
    question: "A paper claims a 2 point gain, one run, weak baselines. How much do you trust it?"
    options:
      - { text: "Treat it as a lead to test, not a fact", correct: true, why: "Evidence is thin." }
      - { text: "Fully", why: "Too much trust." }
      - { text: "Not at all", why: "Still useful as a lead." }
      - { text: "Only if famous", why: "Fame is not evidence." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Reading every line first.** Skim first."
      - "**Skipping the baselines.** They show how big the gain really is."
      - "**Not reproducing anything.** Reimplementing a small part teaches the most."
    next: { label: "Back to all lessons", href: "/learn" }
