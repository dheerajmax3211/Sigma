id: "vis-ddim-fast-sampling"
title: "Faster sampling: skipping steps with DDIM"
minutes: 13
order: 908
params:
  - { id: "s", label: "sampling steps", min: 5, max: 1000, step: 5, init: 50 }
derived:
  - { id: "sec", expr: "s * 0.05" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Skip, do not crawl"
    body:
      - "The original sampler uses all 1000 steps, so one image can take many seconds. **DDIM** rewrites the update so it is deterministic and can jump across many noise levels at once."
      - "You pick a short list of steps, say 50 out of 1000, and visit only those. Quality drops slowly as steps drop, and the same starting noise always gives the same picture."
    callout: "20 times fewer steps, nearly the same picture."
  - kind: "lab"
    kicker: "See it"
    title: "Time per image"
    intro: "Say each step takes 50 ms. **Drag the number of steps.**"
    view:
      type: "bars"
      max: 50
      items:
        - { label: "seconds per image", value: "sec", color: "#f97316" }
        - { label: "full 1000 step sampler", value: "50", color: "#ef4444" }
    sliders:
      - "s"
    outro: "With {s} steps an image takes **{sec} seconds**. Distillation and consistency models push this to one to four steps."
  - kind: "code"
    kicker: "Write it"
    title: "Choosing the steps and jumping"
    intro: "The jump uses the predicted clean image and noise."
    lang: "python"
    code: |
      import math

      def schedule(total, steps):
          stride = total // steps
          return list(range(total - stride, -1, -stride))

      ts = schedule(1000, 50)
      assert len(ts) == 50
      assert ts[0] == 980 and ts[-1] == 0

      def ddim_step(xt, eps_hat, ab, ab_prev):
          x0_hat = (xt - math.sqrt(1 - ab) * eps_hat) / math.sqrt(ab)
          return math.sqrt(ab_prev) * x0_hat + math.sqrt(1 - ab_prev) * eps_hat

      xt = math.sqrt(0.25) * 2.0 + math.sqrt(0.75) * 1.0
      out = ddim_step(xt, eps_hat=1.0, ab=0.25, ab_prev=1.0)
      assert abs(out - 2.0) < 1e-12                 # jumped straight to clean
    note: "No randomness is added in the jump, so the same noise always gives the same image."
  - kind: "lab"
    kicker: "Memorise"
    title: "Speed ideas"
    intro: "From slow to fast."
    view:
      type: "flow"
      stages:
        - { label: "DDPM", note: "1000 steps, random each step.", color: "#ef4444" }
        - { label: "DDIM", note: "Fifty or so, deterministic.", color: "#f97316" }
        - { label: "Better solvers", note: "Ten to twenty steps.", color: "#38bdf8" }
        - { label: "Distilled models", note: "One to four steps.", color: "#1cd6ac" }
  - kind: "check"
    kicker: "Your turn"
    title: "Deterministic"
    question: "What does deterministic sampling give you?"
    options:
      - { text: "The same image from the same starting noise", correct: true, why: "Useful for editing and interpolation." }
      - { text: "Random pictures", why: "No." }
      - { text: "Higher resolution", why: "No." }
      - { text: "No network needed", why: "Still needed." }
  - kind: "check"
    kicker: "Practice"
    title: "Steps"
    question: "Fewer steps means?"
    options:
      - { text: "Faster but eventually lower quality", correct: true, why: "A trade-off." }
      - { text: "Slower", why: "No." }
      - { text: "Identical quality always", why: "Not at one step." }
      - { text: "A bigger model", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Going straight to one step on a plain model.** It blurs."
      - "**Skipping the schedule match.** Use the same noise schedule as training."
      - "**Ignoring the sampler setting in a library.** Defaults differ."
    next: { label: "Next: guidance from the prompt", href: "/learn/vis-classifier-free-guidance" }
