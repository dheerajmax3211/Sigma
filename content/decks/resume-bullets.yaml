id: resume-bullets
title: Resume bullets that get calls
order: 46
minutes: 8
params:
  - { id: act, label: "starts with a strong action verb (0 or 1)", min: 0, max: 1, step: 1, init: 1 }
  - { id: num, label: "has a measured result (0 or 1)", min: 0, max: 1, step: 1, init: 0 }
  - { id: stack, label: "names the stack in plain words (0 or 1)", min: 0, max: 1, step: 1, init: 1 }
derived:
  - { id: score, expr: "(act + num + stack) / 3 * 100" }
  - { id: parts, expr: "act + num + stack" }
cards:
  - kind: story
    kicker: Start here
    title: Six seconds
    body:
      - "A recruiter skims your resume in seconds. They look for what you did, how well it worked, and with what tools."
      - "A good bullet answers all three in one line: **action**, **what**, and a **measured result**."
    callout: "Did what, with what, and how well."

  - kind: lab
    kicker: See it first
    title: Build a strong bullet
    intro: "Flip each part on or off. A bullet with all three parts reads as proof. A bullet with none reads as filler. **Drag the sliders.**"
    view:
      type: bars
      max: 1
      items:
        - { label: "action verb", value: act, color: "#38bdf8" }
        - { label: "measured result", value: num, color: "#1cd6ac" }
        - { label: "stack in plain words", value: stack, color: "#a78bfa" }
    also:
      type: bars
      max: 100
      items:
        - { label: "bullet strength (%)", value: score, color: "#f59e0b" }
        - { label: "room to improve (%)", value: "100 - score", color: "#64748b" }
    sliders: [act, num, stack]
    outro: "Your bullet has **{parts}** of 3 parts, so its strength is **{score} percent**. A missing result is the most common gap."

  - kind: formula
    kicker: Read the formula
    title: The bullet recipe
    tex: "\\text{strength} = \\frac{A + M + S}{3}"
    say: "Give one point each for an action verb A, a measured result M and a named stack S. Divide by three to see how complete the bullet is."
    verify:
      - { expr: "parts", equals: 2, tol: 0.01 }
      - { expr: "score", equals: 66.67, tol: 0.01 }
      - { expr: "(1 + 1 + 1) / 3 * 100", equals: 100, tol: 0.01 }
    symbols:
      - { tex: "A", means: "1 if it starts with a strong verb such as built, cut or shipped", value: act }
      - { tex: "M", means: "1 if it states a measured result", value: num }
      - { tex: "S", means: "1 if it names the tools in plain words", value: stack }

  - kind: check
    kicker: Check yourself
    title: Weak or strong
    question: "Which bullet is strongest?"
    options:
      - { text: "Built a RAG chat over 2,000 support articles with Next.js and Postgres, reaching 85 percent pass rate on a 40-case eval", correct: true, why: "It has a verb, scale, the stack and a measured result." }
      - { text: "Worked on an AI project using various technologies", why: "It has no verb that shows ownership, no result and no named tools." }
      - { text: "Responsible for the chatbot and helped the team", why: "It says what you were, not what you did, and it has no number." }

  - kind: check
    kicker: Check yourself
    title: Add the number
    question: "You cut model cost by caching a repeated prompt prefix. Which line is best?"
    options:
      - { text: "Cut monthly model cost about 40 percent by caching a fixed prompt prefix", correct: true, why: "A real, specific number from your own eval or logs makes it believable." }
      - { text: "Greatly improved efficiency", why: "It sounds vague. Nothing in it can be checked." }
      - { text: "Reduced cost by 99 percent using advanced AI", why: "An unbelievable number invites questions you cannot answer, and the words add nothing." }

  - kind: mistakes
    kicker: Checklist
    title: Before you send it
    items:
      - "**Only numbers you can defend.** Expect to be asked how you measured each one."
      - "**Five bullets for your best project**, not one for every tutorial."
      - "**Plain words.** Say vector search, not leveraged cutting-edge paradigms."
      - "**A link.** Put the demo and the repository next to the project name."
    next: { label: "Next: mock interview drills", href: /learn/mock-interview-drills }
