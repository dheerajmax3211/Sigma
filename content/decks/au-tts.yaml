id: "au-tts"
title: "Text to speech and real-time factor"
minutes: 14
order: 1007
params:
  - { id: "t", label: "seconds to synthesise a 10 second clip", min: 0.5, max: 20, step: 0.5, init: 3 }
derived:
  - { id: "rtf", expr: "t / 10" }
  - { id: "pct", expr: "t * 10" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "From words to waveform"
    body:
      - "A text to speech system has stages. **Normalisation** turns Dr. and 3 into words. A **text model** predicts how it should sound, as a spectrogram or as codec tokens. A **vocoder** turns that into the waveform you hear."
      - "Speed is measured by the **real-time factor**, the time to make a clip divided by its length. Below 1 it can keep up with a listener, which live voice needs."
    callout: "Say it, then check you can say it fast enough."
  - kind: "lab"
    kicker: "See it"
    title: "Can it keep up"
    intro: "A 10 second clip. **Drag the time to synthesise it.**"
    view:
      type: "bars"
      max: 200
      items:
        - { label: "time as percent of the audio length", value: "pct", color: "#f97316" }
        - { label: "the real-time limit, 100", value: "100", color: "#1cd6ac" }
    sliders:
      - "t"
    outro: "Taking {t} seconds gives a real-time factor of **{rtf}**. Above 1 it falls behind. Streaming speakers also need a fast first chunk."
  - kind: "code"
    kicker: "Write it"
    title: "Normalise and measure"
    intro: "Turn symbols into words before speaking."
    lang: "python"
    code: |
      import re

      ABBR = {"Dr.": "doctor", "St.": "street"}
      DIGITS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"]

      def normalise(text):
          words = []
          for tok in text.split():
              if tok in ABBR:
                  words.append(ABBR[tok])
              elif re.fullmatch(r"\d", tok):
                  words.append(DIGITS[int(tok)])
              else:
                  words.append(tok.lower())
          return " ".join(words)

      assert normalise("Dr. Lee has 3 cats") == "doctor lee has three cats"

      def rtf(compute_s, audio_s):
          return compute_s / audio_s

      assert rtf(3, 10) == 0.3
      assert rtf(12, 10) > 1
    note: "Real normalisers handle dates, money, and many languages. It is a large source of errors."
  - kind: "lab"
    kicker: "Memorise"
    title: "What makes it sound good"
    intro: "Quality has several parts."
    view:
      type: "flow"
      stages:
        - { label: "Clear", note: "Words are easy to understand.", color: "#38bdf8" }
        - { label: "Natural", note: "Rhythm and pitch sound human.", color: "#1cd6ac" }
        - { label: "Consistent", note: "The same voice throughout.", color: "#f97316" }
        - { label: "Fast", note: "First audio arrives quickly.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "RTF"
    question: "A system takes 5 seconds for 10 seconds of audio. RTF?"
    options:
      - { text: "0.5", correct: true, why: "Half of real time." }
      - { text: "2", why: "That is the inverse." }
      - { text: "5", why: "No." }
      - { text: "10", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Live"
    question: "Why must a live voice agent have an RTF below 1?"
    options:
      - { text: "Otherwise it cannot keep pace with playback", correct: true, why: "Gaps would appear." }
      - { text: "It sounds worse", why: "Not the reason." }
      - { text: "It uses more memory", why: "No." }
      - { text: "It needs more GPUs", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Skipping normalisation.** It reads 2024 oddly."
      - "**Cloning a voice without consent.** Get permission."
      - "**Only measuring total time.** Measure time to first audio."
    next: { label: "Next: audio language models", href: "/learn/au-audio-language-models" }
