id: "vis-clip"
title: "CLIP: pictures and words in one space"
minutes: 15
order: 904
params:
  - { id: "t", label: "temperature", min: 0.05, max: 1, step: 0.05, init: 0.5 }
derived:
  - { id: "pm", expr: "100 * exp(0.3 / t) / (exp(0.3 / t) + exp(0.1 / t) + 1)" }
  - { id: "po", expr: "100 - pm" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Teach two encoders to agree"
    body:
      - "**CLIP** trains an image encoder and a text encoder together on hundreds of millions of picture and caption pairs. Matching pairs must land close together, non-matching pairs far apart."
      - "This is **contrastive learning**. In a batch, each image should pick its own caption out of all the captions, and each caption its image. After that you can classify images by comparing them with text such as a photo of a cat."
    callout: "Match the pair, push away the rest."
  - kind: "lab"
    kicker: "See it"
    title: "The temperature"
    intro: "An image scores 0.3 against its caption and 0.1 and 0.0 against two others. The temperature sets how sharply the softmax picks. **Drag it.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "chance given to the right caption (percent)", value: "pm", color: "#1cd6ac" }
        - { label: "chance given to wrong captions (percent)", value: "po", color: "#ef4444" }
    sliders:
      - "t"
    outro: "At temperature {t} the right caption gets **{pm} percent**. A low temperature is sharp and punishes close wrong answers harder."
  - kind: "code"
    kicker: "Write it"
    title: "Contrastive loss and zero-shot"
    intro: "Rows are images, columns are captions."
    lang: "python"
    code: |
      import math

      def row_loss(row, correct, t=0.1):
          e = [math.exp(v / t) for v in row]
          return -math.log(e[correct] / sum(e))

      good = [[0.9, 0.1], [0.2, 0.8]]
      bad = [[0.1, 0.9], [0.8, 0.2]]
      loss = lambda S: sum(row_loss(S[i], i) for i in range(2)) / 2

      assert loss(good) < 0.01
      assert loss(bad) > 1

      def dot(a, b):
          return sum(x * y for x, y in zip(a, b))

      image = [1.0, 0.0]
      captions = {"a photo of a cat": [0.9, 0.1], "a photo of a dog": [0.1, 0.9]}
      best = max(captions, key=lambda k: dot(image, captions[k]))
      assert best == "a photo of a cat"       # no cat-specific training needed
    note: "Zero-shot means you invent the classes at test time by writing captions."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where it is used"
    intro: "One idea, many products."
    view:
      type: "flow"
      stages:
        - { label: "Zero-shot classify", note: "Compare an image with caption prompts.", color: "#38bdf8" }
        - { label: "Image search", note: "Search pictures with a sentence.", color: "#1cd6ac" }
        - { label: "Guidance", note: "Text encoders steer image generators.", color: "#f97316" }
        - { label: "Vision models", note: "Many multimodal models start from a CLIP encoder.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Negatives"
    question: "Where do the wrong pairs come from in training?"
    options:
      - { text: "Other examples in the same batch", correct: true, why: "Bigger batches give more negatives." }
      - { text: "A separate dataset", why: "No." }
      - { text: "Random noise", why: "No." }
      - { text: "The labels", why: "There are no class labels." }
  - kind: "check"
    kicker: "Practice"
    title: "Zero-shot"
    question: "What is zero-shot classification with CLIP?"
    options:
      - { text: "Choosing the caption closest to the image", correct: true, why: "No training for your classes." }
      - { text: "Training on zero images", why: "It was trained on many." }
      - { text: "Deleting the text", why: "No." }
      - { text: "Guessing at random", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Small batches.** Too few negatives to learn from."
      - "**Trusting zero-shot on rare domains.** Test it."
      - "**Poor prompts.** A photo of a cat beats cat."
    next: { label: "Next: vision-language models", href: "/learn/vis-multimodal-fusion" }
