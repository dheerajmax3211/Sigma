id: tr-normalisation-residuals
title: "Normalisation and residuals: keeping deep nets trainable"
minutes: 13
order: 304
params:
  - { id: n, label: "layers", min: 1, max: 50, step: 1, init: 20 }
derived:
  - { id: plain, expr: "100 * 0.8 ^ n" }
  - { id: res, expr: "100 * 0.98 ^ n" }
cards:
  - kind: story
    kicker: Start here
    title: "Why deep stacks are hard"
    body:
      - "A transformer stacks dozens of layers. Learning signals must travel back through all of them. Two small ideas make that work."
      - "A **residual connection** adds a layer's input to its output, giving the signal a shortcut. **Normalisation** keeps each layer's numbers in a steady range."
    callout: "Both are cheap. Without them, deep models barely train."

  - kind: lab
    kicker: See it
    title: "The shortcut"
    intro: "Illustrative numbers: a plain layer passes on 80 percent of the learning signal, a layer with a shortcut passes on 98 percent. **Drag the depth.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "signal reaching layer 1, no shortcut", value: plain, color: "#ef4444" }
        - { label: "signal reaching layer 1, with shortcut", value: res, color: "#1cd6ac" }
    sliders: [n]
    outro: "After {n} layers: **{plain} percent** without shortcuts, **{res} percent** with them."

  - kind: code
    kicker: Write it
    title: "Layer norm and a residual"
    intro: "Layer norm rescales one token's vector to mean zero and variance one. The residual adds the input back."
    lang: python
    code: |
      import math

      def layer_norm(x, eps=1e-5):
          m = sum(x) / len(x)
          var = sum((v - m) ** 2 for v in x) / len(x)
          return [(v - m) / math.sqrt(var + eps) for v in x]

      def residual(x, f):
          return [a + b for a, b in zip(x, f(x))]

      y = layer_norm([1.0, 2.0, 3.0, 4.0])
      assert abs(sum(y) / 4) < 1e-9
      assert abs(sum(v * v for v in y) / 4 - 1) < 1e-3
      assert residual([1, 2], lambda x: [10, 10]) == [11, 12]
    note: "Modern LLMs often use RMSNorm, a cheaper variant that skips the mean."

  - kind: lab
    kicker: See it
    title: "Where it sits"
    intro: "Most current models normalise before each sub-layer, which trains more stably."
    view:
      type: flow
      stages:
        - { label: "Norm", note: "Steady the input numbers.", color: "#38bdf8" }
        - { label: "Attention or MLP", note: "The actual computation.", color: "#1cd6ac" }
        - { label: "Add input", note: "The residual shortcut.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "What the shortcut gives"
    question: "Why does a residual connection help very deep networks?"
    options:
      - { text: "Gradients can flow straight through the addition", correct: true, why: "The identity path keeps the learning signal from shrinking layer by layer." }
      - { text: "It removes the need for data", why: "No." }
      - { text: "It makes layers smaller", why: "Size is unchanged." }
      - { text: "It replaces softmax", why: "Unrelated." }

  - kind: check
    kicker: Practice
    title: "Batch norm or layer norm?"
    question: "Why do transformers use layer norm rather than batch norm?"
    options:
      - { text: "Layer norm works per token, so it does not depend on batch size or padding", correct: true, why: "Batch statistics are awkward with variable-length text and small batches." }
      - { text: "Layer norm is always more accurate", why: "Not a general rule." }
      - { text: "Batch norm cannot be differentiated", why: "It can." }
      - { text: "There is no difference", why: "There is." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Mixing up the two ideas.** Residuals add. Norms rescale."
      - "**Forgetting epsilon.** Without it you can divide by zero."
      - "**Assuming order never matters.** Pre-norm and post-norm train differently."
    next: { label: "Next: pretraining objectives", href: /learn/tr-pretraining-objectives }
