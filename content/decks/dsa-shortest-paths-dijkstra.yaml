id: dsa-shortest-paths-dijkstra
title: "Shortest paths: Dijkstra"
minutes: 15
order: 119
params:
  - { id: s, label: "settled", min: 0, max: 5, step: 1, init: 0 }
  - { id: v, label: "nodes V", min: 10, max: 100000, step: 10, init: 10000 }
derived:
  - { id: e, expr: "4 * v" }
  - { id: logv, expr: "ceil(log(v) / log(2))" }
  - { id: work, expr: "e * logv" }
cards:
  - kind: story
    kicker: Start here
    title: "Roads with different lengths"
    body:
      - "BFS counts steps. But real roads, prices and latencies have different **weights**. The shortest path is the one with the smallest **total weight**, not the fewest edges."
      - "**Dijkstra's algorithm** always settles the closest unsettled node next, using a heap. Once a node is settled, its distance is final."
    callout: "Clue words: cheapest, fastest, minimum cost route, network delay. Weights must not be negative."

  - kind: lab
    kicker: See it
    title: "Shortest distance from S"
    intro: "Each label is the shortest known distance from S. Nodes are settled from nearest to farthest. **Drag the settled count.**"
    view:
      type: graph
      nodes:
        - { id: S, x: 8, y: 50 }
        - { id: A, x: 38, y: 15 }
        - { id: B, x: 38, y: 85 }
        - { id: C, x: 68, y: 50 }
        - { id: T, x: 93, y: 50 }
      edges:
        - { a: S, b: A, w: 4 }
        - { a: S, b: B, w: 1 }
        - { a: B, b: A, w: 2 }
        - { a: A, b: C, w: 1 }
        - { a: B, b: C, w: 5 }
        - { a: C, b: T, w: 3 }
      order:
        - { node: S, label: 0 }
        - { node: B, from: S, label: 1 }
        - { node: A, from: B, label: 3 }
        - { node: C, from: A, label: 4 }
        - { node: T, from: C, label: 7 }
      step: s
    sliders: [s]
    says:
      - "Only S is known, at distance 0. S to A costs 4 and S to B costs 1."
      - "S is settled. The closest unsettled node is B (1). Settle it."
      - "From B, going to A costs 1 + 2 = 3, **better than the direct 4**. Settle A at 3."
      - "From A, C costs 3 + 1 = 4, better than via B (1 + 5 = 6). Settle C at 4."
      - "From C, T costs 4 + 3 = 7."
      - "All settled. The cheapest S to T path is S, B, A, C, T with cost 7."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Dijkstra with a heap"
    intro: "Push `(distance, node)`. Pop the smallest. Skip it if you already found something better. Otherwise relax each edge."
    lang: python
    code: |
      import heapq

      def dijkstra(g, src):
          dist = {src: 0}
          h = [(0, src)]
          while h:
              d, u = heapq.heappop(h)
              if d > dist.get(u, float("inf")):
                  continue                       # stale entry
              for v, w in g[u]:
                  nd = d + w
                  if nd < dist.get(v, float("inf")):
                      dist[v] = nd
                      heapq.heappush(h, (nd, v))
          return dist

      g = {"S": [("A", 4), ("B", 1)], "A": [("S", 4), ("B", 2), ("C", 1)],
           "B": [("S", 1), ("A", 2), ("C", 5)], "C": [("A", 1), ("B", 5), ("T", 3)],
           "T": [("C", 3)], "Z": []}
      dist = dijkstra(g, "S")
      assert dist == {"S": 0, "B": 1, "A": 3, "C": 4, "T": 7}
      assert "Z" not in dist
    note: "Time O((V + E) log V). A node absent from `dist` is unreachable."

  - kind: lab
    kicker: What it costs
    title: "Work grows slowly"
    intro: "Each edge may push one heap entry, and each push costs log V. **Drag V.**"
    view:
      type: bars
      max: 2000000
      items:
        - { label: "edges E (4 per node)", value: e, color: "#38bdf8" }
        - { label: "work: E times log V", value: work, color: "#1cd6ac" }
    sliders: [v]
    outro: "With {v} nodes and {e} edges, Dijkstra does about **{work}** steps. That is why it routes maps in milliseconds."

  - kind: check
    kicker: Your turn
    title: "Which algorithm?"
    question: "Every road has the same cost of 1. You want the fewest roads from A to B. Which is simplest and correct?"
    options:
      - { text: "BFS", correct: true, why: "Equal weights mean fewest edges is cheapest. No heap needed." }
      - { text: "Dijkstra", why: "Works but is heavier than needed." }
      - { text: "DFS", why: "May find a long path first." }
      - { text: "Sorting", why: "Not a path algorithm." }

  - kind: check
    kicker: Your turn
    title: "Negative edges"
    question: "Why does Dijkstra break when an edge weight is negative?"
    options:
      - { text: "A settled node's distance might still improve later", correct: true, why: "A negative edge could make a longer route cheaper, but Dijkstra already declared the node final." }
      - { text: "Heaps cannot store negative numbers", why: "They can." }
      - { text: "Python forbids negative sums", why: "It does not." }
      - { text: "It never breaks", why: "It does. Use Bellman-Ford." }

  - kind: code
    kicker: Variation
    title: "Network delay time"
    intro: "A signal starts at node k. How long until **every** node receives it? That is the largest of the shortest distances, or -1 if any node is unreachable."
    lang: python
    code: |
      import heapq

      def network_delay(times, n, k):
          g = {i: [] for i in range(1, n + 1)}
          for u, v, w in times:
              g[u].append((v, w))
          dist, h = {}, [(0, k)]
          while h:
              d, u = heapq.heappop(h)
              if u in dist:
                  continue
              dist[u] = d
              for v, w in g[u]:
                  if v not in dist:
                      heapq.heappush(h, (d + w, v))
          return max(dist.values()) if len(dist) == n else -1

      assert network_delay([[2, 1, 1], [2, 3, 1], [3, 4, 1]], 4, 2) == 2
      assert network_delay([[1, 2, 1]], 2, 2) == -1
    note: "Settling a node the first time it is popped means its distance is final."

  - kind: check
    kicker: Practice
    title: "What is stored?"
    question: "In the heap, why are tuples like `(distance, node)` used and not just the node?"
    options:
      - { text: "The heap orders by the first item, the distance", correct: true, why: "Tuples compare left to right, so the smallest distance pops first." }
      - { text: "To store two nodes", why: "The second item is just a label." }
      - { text: "Python needs tuples", why: "Any ordered item works, but you need the distance in front." }
      - { text: "To avoid negative numbers", why: "Unrelated." }

  - kind: practice
    kicker: Your turn
    title: "Cheapest route"
    intro: "Edges are `[a, b, cost]` and undirected. Write `cheapest(n, edges, start, goal)` returning the lowest total cost, or -1. Use a heap."
    entry: cheapest
    starter: |
      def cheapest(n, edges, start, goal):
          pass
    solution: |
      def cheapest(n, edges, start, goal):
          import heapq
          g = [[] for _ in range(n)]
          for a, b, w in edges:
              g[a].append((b, w)); g[b].append((a, w))
          dist = {}
          h = [(0, start)]
          while h:
              d, u = heapq.heappop(h)
              if u in dist:
                  continue
              dist[u] = d
              for v, w in g[u]:
                  if v not in dist:
                      heapq.heappush(h, (d + w, v))
          return dist.get(goal, -1)
    tests:
      - { input: "[4,[[0,1,1],[1,2,2],[0,2,5],[2,3,1]],0,3]", expected: "4" }
      - { input: "[3,[[0,1,2]],0,2]", expected: "-1" }
    hint: "Always expand the unseen node with the smallest cost so far."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Negative weights.** Dijkstra gives wrong answers silently. Check the problem first."
      - "**Skipping the stale-entry check.** Without `continue`, old heap entries get processed again."
      - "**Using a list instead of a heap.** Picking the minimum becomes O(V), making the whole thing O(V squared)."
      - "**Forgetting unreachable nodes.** They are missing or infinite. Decide what to return."
    next: { label: "Next: topological sort", href: /learn/dsa-topological-sort }
