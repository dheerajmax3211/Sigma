id: evals-and-tracing
title: Evals and tracing
order: 38
minutes: 9
params:
  - { id: before, label: "cases passed before the change", min: 0, max: 20, step: 1, init: 14 }
  - { id: after, label: "cases passed after the change", min: 0, max: 20, step: 1, init: 17 }
derived:
  - { id: pb, expr: "100 * before / 20" }
  - { id: pa, expr: "100 * after / 20" }
  - { id: gain, expr: "pa - pb" }
cards:
  - kind: story
    kicker: Start here
    title: Did that change help
    body:
      - "You tweak a prompt and try two questions. They look better, so you ship. Next week another case breaks, and you cannot tell which change did it."
      - "An **eval** is a fixed set of test cases with the behaviour you expect. Run it before and after every change and compare the score."
    callout: "Measure, do not guess."

  - kind: lab
    kicker: See it first
    title: Before and after
    intro: "Your eval has **20 cases**. Run it with the old prompt, then with the new one. **Drag how many cases pass each time.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "pass rate before (%)", value: pb, color: "#64748b" }
        - { label: "pass rate after (%)", value: pa, color: "#1cd6ac" }
    sliders: [before, after]
    outro: "Before: {before} of 20 passed, which is **{pb} percent**. After: {after} of 20, or **{pa} percent**. The change moved the score by **{gain} points**."

  - kind: formula
    kicker: Read the formula
    title: Pass rate
    tex: "\\text{pass rate} = \\frac{\\text{passed}}{\\text{total}}"
    say: "Count the cases that met your expectation and divide by all the cases. Multiply by 100 to read it as a percentage."
    verify:
      - { expr: "pb", equals: 70, tol: 0.01 }
      - { expr: "pa", equals: 85, tol: 0.01 }
      - { expr: "gain", equals: 15, tol: 0.01 }
    symbols:
      - { tex: "\\text{passed}", means: "cases where the output met your check", value: before }
      - { tex: "\\text{total}", means: "all cases in the eval set", value: "20" }
      - { tex: "\\text{pass rate}", means: "the share that passed, shown here as a percent", value: pb }

  - kind: code
    kicker: Read it
    title: A tiny eval
    intro: "Each case is an input and a simple check. Run them all and report the rate. Start with checks code can do, like contains or valid JSON."
    lang: python
    code: |
      cases = [
          {"input": "Refund window?",   "must_contain": "30 days"},
          {"input": "Who pays return?", "must_contain": "customer"},
      ]

      def run_eval(app):
          passed = 0
          for c in cases:
              answer = app(c["input"])
              passed += c["must_contain"] in answer
          return passed / len(cases)
    note: "Later add a model as judge for fuzzy answers, and spot-check its grades by hand."

  - kind: story
    kicker: Tracing
    title: Record each step
    body:
      - "A score says **that** something failed. A **trace** shows **why**. It records every step of one run: the prompt, each tool call, the result and the time taken."
      - "When a case fails, open its trace and find the first step that went wrong."
    callout: "Evals find failures. Traces explain them."

  - kind: code
    kicker: In code
    title: A minimal trace
    intro: "Log each step as a small record with a name, its input, its output and how long it took."
    lang: python
    code: |
      import time

      trace = []

      def step(name, fn, **kw):
          start = time.time()
          out = fn(**kw)
          trace.append({"step": name, "input": kw, "output": out,
                        "ms": round((time.time() - start) * 1000)})
          return out
    note: "Tools such as Langfuse or LangSmith store traces and show them as a timeline."

  - kind: check
    kicker: Check yourself
    title: Read the score
    question: "Pass rate rose from 70 to 85 percent, but a case that used to pass now fails. What should you do?"
    options:
      - { text: "Open that case's trace and see what changed", correct: true, why: "Averages hide regressions. A trace shows where this case went wrong." }
      - { text: "Ship it, since the score went up", why: "A higher average can still hide a newly broken case that matters." }
      - { text: "Delete the case so the score looks better", why: "That hides the problem instead of fixing it." }

  - kind: practice
    kicker: Your turn
    title: "Pass rate by tag"
    intro: "Write `by_tag(results)` where each result is `[tag, passed]`. Return a dict of tag to pass rate, rounded to 2 places."
    entry: by_tag
    starter: |
      def by_tag(results):
          pass
    solution: |
      def by_tag(results):
          n, ok = {}, {}
          for tag, passed in results:
              n[tag] = n.get(tag, 0) + 1
              ok[tag] = ok.get(tag, 0) + (1 if passed else 0)
          return {t: round(ok[t] / n[t], 2) for t in n}
    tests:
      - { input: "[[[\"a\", true], [\"a\", false], [\"b\", true]]]", expected: "{\"a\": 0.5, \"b\": 1.0}" }
      - { input: "[[]]", expected: "{}" }
      - { input: "[[[\"x\", false]]]", expected: "{\"x\": 0.0}" }
    hint: "A single overall number can hide one tag that fails badly."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Too few cases.** Twenty is a start. Add a case every time a real user hits a bug."
      - "**Testing on cases you tuned for.** Keep some cases unseen while you iterate."
      - "**Skipping evals before release.** Run them every time, like unit tests."
    next: { label: "Next: docker basics", href: /learn/docker-basics }
