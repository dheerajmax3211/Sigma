id: agent-loop
title: The agent loop
order: 34
minutes: 9
params:
  - { id: cap, label: "max steps allowed", min: 1, max: 10, step: 1, init: 4 }
  - { id: need, label: "steps the task needs", min: 1, max: 10, step: 1, init: 3 }
derived:
  - { id: ran, expr: "min(need, cap)" }
  - { id: fin, expr: "min(1, floor(cap / need))" }
  - { id: cost, expr: "ran * 2" }
  - { id: capcost, expr: "cap * 2" }
cards:
  - kind: story
    kicker: Start here
    title: A model that keeps going
    body:
      - "A single model call answers once and stops. An **agent** is a loop around the model. It thinks, picks a tool, runs it, reads the result, and thinks again."
      - "It stops when it has an answer. If nothing stops it, it can loop forever and burn money."
    callout: "Think, act, observe, repeat."

  - kind: lab
    kicker: See it first
    title: The loop and its cap
    intro: "Each round trip is one **step**. The task needs a certain number of steps. Your **cap** is the most you allow. Illustrative cost: about 2 thousand tokens a step. **Drag the sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. Think", note: "the model reads the goal and what happened so far", color: "#a78bfa" }
        - { label: "2. Act", note: "it asks for a tool, and your code runs it", color: "#f59e0b" }
        - { label: "3. Observe", note: "the tool result goes back into the conversation", color: "#38bdf8" }
        - { label: "4. Stop or loop", note: "done, or the **{cap}** step cap is reached", color: "#ef4444" }
    also:
      type: bars
      max: 20
      items:
        - { label: "steps used", value: ran, color: "#1cd6ac" }
        - { label: "cost used (thousand tokens)", value: cost, color: "#f59e0b" }
        - { label: "worst-case cost at the cap", value: capcost, color: "#ef4444" }
    sliders: [cap, need]
    outro: "The task needs {need} steps and you allow {cap}, so the agent runs **{ran}** steps and uses about **{cost}** thousand tokens."

  - kind: formula
    kicker: Read the formula
    title: Steps actually run
    tex: "n = \\min(\\text{need},\\ \\text{cap})"
    say: "The agent runs until the task is done or the cap is hit, whichever comes first. Pick the smaller of the two numbers."
    verify:
      - { expr: "ran", equals: 3, tol: 0.01 }
      - { expr: "cost", equals: 6, tol: 0.01 }
      - { expr: "min(8, 4)", equals: 4, tol: 0.01 }
    symbols:
      - { tex: "n", means: "how many steps the agent really runs", value: ran }
      - { tex: "\\text{need}", means: "steps the task would take if nothing stopped it", value: need }
      - { tex: "\\text{cap}", means: "the limit you set in code", value: cap }
      - { tex: "\\min", means: "take the smaller of the two values" }

  - kind: code
    kicker: Read it
    title: The loop in code
    intro: "A `for` loop with a limit is the whole safety net. If the model asks for no tool, it has answered and you return."
    lang: python
    code: |
      def run_agent(goal, tools, max_steps=8):
          messages = [{"role": "user", "content": goal}]
          for step in range(max_steps):
              reply = call_model(messages, tools)
              if not reply.tool_calls:           # no tool asked: done
                  return reply.text
              for call in reply.tool_calls:
                  result = tools[call.name](**call.args)
                  messages.append(tool_result(call, result))
          return "Stopped: step limit reached"
    note: "Always return something useful at the limit, such as the best partial answer so far."

  - kind: check
    kicker: Check yourself
    title: Why a cap
    question: "What is the main reason to set a maximum number of steps?"
    options:
      - { text: "A confused agent could loop forever and run up cost", correct: true, why: "A cap bounds the worst case in both time and money." }
      - { text: "Models can only think three times", why: "There is no such limit. You choose it." }
      - { text: "It makes answers more accurate", why: "A cap does not improve answers. It only limits damage." }

  - kind: check
    kicker: Check yourself
    title: Read the result
    question: "The task needs 6 steps and your cap is 4. What happens?"
    options:
      - { text: "The agent stops after 4 without finishing", correct: true, why: "min(6, 4) is 4, so the cap cuts it off. Raise the cap or simplify the task." }
      - { text: "It runs all 6 steps", why: "The cap is a hard limit, so it never runs more than 4." }
      - { text: "It never starts", why: "It starts and runs until it reaches the cap." }

  - kind: practice
    kicker: Your turn
    title: "Run the tool calls"
    intro: "Write `run(calls, tools)`. `calls` is a list of `[name, arg]` pairs and `tools` maps a name to a number to add. Return the total after adding `tools[name] * arg` for each call. Skip names that are not in `tools`."
    entry: run
    starter: |
      def run(calls, tools):
          pass
    solution: |
      def run(calls, tools):
          total = 0
          for name, arg in calls:
              if name in tools:
                  total += tools[name] * arg
          return total
    tests:
      - { input: "[[[\"a\", 2], [\"b\", 3]], {\"a\": 10, \"b\": 1}]", expected: "23" }
      - { input: "[[[\"z\", 5]], {\"a\": 1}]", expected: "0" }
      - { input: "[[], {}]", expected: "0" }
    hint: "Check the name is known before you use it. A real agent must also cope with unknown tools."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**No step cap.** One bad prompt can turn into a very large bill."
      - "**Hiding errors.** If a tool fails, pass the error back so the model can try something else."
      - "**Too many tools.** A long menu confuses the model and costs tokens on every step."
    next: { label: "Next: MCP servers", href: /learn/mcp-servers }
