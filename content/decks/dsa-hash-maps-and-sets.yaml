id: dsa-hash-maps-and-sets
title: "Hash maps and sets"
minutes: 15
order: 103
params:
  - { id: n, label: "items n", min: 1, max: 1000, step: 1, init: 500 }
  - { id: s, label: "step", min: 0, max: 2, step: 1, init: 0 }
cards:
  - kind: story
    kicker: Start here
    title: "A phone book you can open at the right page"
    body:
      - "Searching a list means checking items one by one. A **hash map** turns the key into a box number with a formula, then opens that box directly."
      - "So looking up a name takes the same tiny time whether you store ten names or ten million. Python calls it a `dict`. A `set` is the same idea with keys only."
    callout: "If your code asks 'have I seen this before?', reach for a set or dict."

  - kind: lab
    kicker: See it
    title: "List scan vs dict lookup"
    intro: "Checking `x in my_list` may look at every item. Checking `x in my_dict` goes straight to one box. **Drag n.**"
    view:
      type: bars
      max: 1000
      items:
        - { label: "list: x in my_list", value: n, color: "#ef4444" }
        - { label: "dict or set: x in d", value: "1", color: "#1cd6ac" }
    sliders: [n]
    outro: "With {n} items the list may check up to **{n}** boxes. The dict checks about 1."

  - kind: code
    kicker: Write it
    title: "Counting with a dict"
    intro: "The most common use: count how often each thing appears. `d.get(k, 0)` returns 0 when the key is missing."
    lang: python
    code: |
      def count(items):
          d = {}
          for x in items:
              d[x] = d.get(x, 0) + 1
          return d

      assert count("banana") == {"b": 1, "a": 3, "n": 2}
      assert count([]) == {}

      def has_duplicate(a):
          seen = set()
          for x in a:
              if x in seen:
                  return True
              seen.add(x)
          return False

      assert has_duplicate([1, 2, 3, 1]) and not has_duplicate([1, 2, 3])
    note: "Both are O(n) time and O(n) space. You trade memory for speed."

  - kind: lab
    kicker: The classic
    title: "Two Sum, step by step"
    intro: "Find two numbers that add up to **9**. For each number, ask: has its partner already been seen? **Drag the step.**"
    view:
      type: array
      cells: [2, 7, 11, 15]
      pointers:
        - { label: "i", at: s, color: "#1cd6ac" }
    sliders: [s]
    says:
      - "i = 0, value 2. Partner needed is 9 - 2 = 7. Seen so far: nothing. Store 2."
      - "i = 1, value 7. Partner needed is 9 - 7 = 2. We stored 2 earlier, so the pair is found."
      - "Answer: indexes 0 and 1. One pass, no nested loop."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Two Sum in code"
    intro: "The dict maps each value to its index. Look up the partner before you store the current number."
    lang: python
    code: |
      def two_sum(nums, target):
          seen = {}                      # value -> index
          for i, x in enumerate(nums):
              need = target - x
              if need in seen:
                  return [seen[need], i]
              seen[x] = i
          return []

      assert two_sum([2, 7, 11, 15], 9) == [0, 1]
      assert two_sum([3, 3], 6) == [0, 1]
      assert two_sum([1, 2], 10) == []
    note: "Brute force checks every pair, O(n squared). This is O(n)."

  - kind: check
    kicker: Your turn
    title: "Why check before storing?"
    question: "In Two Sum, what goes wrong if you store `x` in `seen` before looking up `need`?"
    options:
      - { text: "Nothing, it is identical", why: "Not for inputs like target 6 with the number 3." }
      - { text: "A number can pair with itself", correct: true, why: "With [3, 4] and target 6, the single 3 would match itself." }
      - { text: "It becomes O(n squared)", why: "Still O(n). The bug is correctness." }
      - { text: "The dict raises an error", why: "Python allows it. It just gives a wrong answer." }

  - kind: code
    kicker: Grouping
    title: "Group anagrams"
    intro: "Two words are anagrams when their sorted letters match. Use the sorted letters as the **key** and collect words under it."
    lang: python
    code: |
      def group_anagrams(words):
          groups = {}
          for w in words:
              key = "".join(sorted(w))
              groups.setdefault(key, []).append(w)
          return list(groups.values())

      out = group_anagrams(["eat", "tea", "tan", "ate", "nat", "bat"])
      assert sorted(map(sorted, out)) == [["ate", "eat", "tea"], ["bat"], ["nat", "tan"]]
    note: "Keys must be unhashable-free: strings, numbers and tuples work. Lists do not."

  - kind: check
    kicker: Your turn
    title: "Which key?"
    question: "You want to know whether a list of 1 million ids contains any repeat. Best tool?"
    options:
      - { text: "Two nested loops", why: "About a trillion comparisons." }
      - { text: "A set, one pass", correct: true, why: "O(n) time. Each lookup and insert is about 1 step." }
      - { text: "Sort and print", why: "Sorting works but prints nothing useful. A set is simpler." }
      - { text: "A dict with random keys", why: "Keys must be the ids, not random." }

  - kind: check
    kicker: Practice
    title: "Prefix hint"
    question: "Count pairs of indexes with the same value. Which structure helps most?"
    options:
      - { text: "A frequency dict", correct: true, why: "A value seen k times makes k(k-1)/2 pairs." }
      - { text: "A stack", why: "Order is not the question." }
      - { text: "A sorted list only", why: "Possible, but slower to write." }
      - { text: "A 2D grid", why: "Nothing is two dimensional here." }

  - kind: practice
    kicker: Your turn
    title: "Two sum"
    intro: "Write `two_sum(nums, target)` returning the indices `[i, j]` (with `i < j`) of two numbers that add to target. One pass with a dict gives O(n)."
    entry: two_sum
    starter: |
      def two_sum(nums, target):
          pass
    solution: |
      def two_sum(nums, target):
          seen = {}
          for i, x in enumerate(nums):
              if target - x in seen:
                  return [seen[target - x], i]
              seen[x] = i
    tests:
      - { input: "[[2,7,11,15],9]", expected: "[0,1]" }
      - { input: "[[3,2,4],6]", expected: "[1,2]" }
      - { input: "[[3,3],6]", expected: "[0,1]" }
    hint: "For each number, ask: have I already seen target minus this number?"

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Using a list as a key.** Lists change, so they cannot be hashed. Use a tuple."
      - "**Assuming order.** A set has no first item you can rely on. Use a list if order matters."
      - "**Worst case.** Many keys can collide, making a lookup slow. Interviews still say O(1) on average."
      - "**Reading a missing key.** `d[k]` raises an error. Use `d.get(k)` or `in`."
    next: { label: "Next: two pointers", href: /learn/dsa-two-pointers }
