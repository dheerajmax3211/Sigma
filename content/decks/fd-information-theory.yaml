id: "fd-information-theory"
title: "Entropy and KL divergence"
minutes: 14
order: 708
params:
  - { id: "p", label: "chance of heads", min: 0.01, max: 0.99, step: 0.01, init: 0.5 }
derived:
  - { id: "H", expr: "100 * (0 - (p * log(p) + (1 - p) * log(1 - p))) / log(2)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Measuring surprise"
    body:
      - "**Entropy** is the average surprise of a distribution, in bits. A fair coin is one bit. A coin that nearly always lands heads is hardly surprising, so its entropy is low."
      - "**KL divergence** measures how far one distribution is from another. Cross-entropy is entropy plus KL. Minimising cross-entropy against fixed data therefore minimises KL."
    callout: "Lower cross-entropy means your model's guesses sit closer to reality."
  - kind: "lab"
    kicker: "See it"
    title: "A coin's uncertainty"
    intro: "Entropy peaks when both outcomes are equally likely. The bar shows hundredths of a bit. **Drag the chance.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "entropy (hundredths of a bit)", value: "H", color: "#f97316" }
        - { label: "the maximum, one bit", value: "100", color: "#38bdf8" }
    sliders:
      - "p"
    outro: "At chance {p}, entropy is **{H}** hundredths of a bit. It is highest at 0.5."
  - kind: "code"
    kicker: "Write it"
    title: "Entropy, KL and cross-entropy"
    intro: "They are linked by one identity."
    lang: "python"
    code: |
      import math

      def entropy(p):
          return -sum(a * math.log2(a) for a in p if a > 0)

      def cross_entropy(p, q):
          return -sum(a * math.log2(b) for a, b in zip(p, q) if a > 0)

      def kl(p, q):
          return cross_entropy(p, q) - entropy(p)

      assert entropy([0.5, 0.5]) == 1.0
      assert entropy([1.0, 0.0]) == 0
      p, q = [0.5, 0.5], [0.9, 0.1]
      assert kl(p, p) == 0
      assert kl(p, q) > 0
      assert abs(cross_entropy(p, q) - (entropy(p) + kl(p, q))) < 1e-12
    note: "KL is not symmetric. KL of p from q is not KL of q from p."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where it appears"
    intro: "You will see these names often."
    view:
      type: "flow"
      stages:
        - { label: "Cross-entropy loss", note: "The training loss of nearly every classifier and language model.", color: "#38bdf8" }
        - { label: "Perplexity", note: "Two to the power of the loss. Lower is better.", color: "#1cd6ac" }
        - { label: "KL penalty", note: "Keeps a tuned model near the original in preference training.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Entropy"
    question: "Which coin has the highest entropy?"
    options:
      - { text: "A fair coin", correct: true, why: "Both outcomes equally likely." }
      - { text: "A coin that is almost always heads", why: "It is predictable." }
      - { text: "A two headed coin", why: "No surprise at all." }
      - { text: "All the same", why: "They differ." }
  - kind: "check"
    kicker: "Practice"
    title: "KL"
    question: "What is KL divergence of a distribution from itself?"
    options:
      - { text: "Zero", correct: true, why: "No difference." }
      - { text: "One", why: "No." }
      - { text: "Infinity", why: "No." }
      - { text: "Negative", why: "It is never negative." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Treating KL as a distance.** It is not symmetric."
      - "**Mixing log bases.** Bits use base 2, nats use base e."
      - "**Zero probability in q where p is positive.** KL becomes infinite."
    next: { label: "Next: convexity and conditioning", href: "/learn/fd-convexity-conditioning" }
