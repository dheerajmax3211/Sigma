id: llm-apis-and-tokens
title: LLM APIs and tokens
order: 23
minutes: 10
params:
  - { id: ptok, label: "prompt tokens", min: 100, max: 4000, step: 100, init: 1000 }
  - { id: otok, label: "answer tokens", min: 50, max: 1000, step: 50, init: 300 }
  - { id: pin, label: "input price per million", min: 1, max: 10, step: 0.5, init: 3 }
  - { id: pout, label: "output price per million", min: 5, max: 30, step: 1, init: 15 }
  - { id: temp, label: "temperature", min: 0.1, max: 2, step: 0.1, init: 1 }
derived:
  - { id: inc, expr: "ptok * pin / 1000" }
  - { id: outc, expr: "otok * pout / 1000" }
  - { id: k, expr: "inc + outc" }
  - { id: t1, expr: "exp(2 / temp)" }
  - { id: t2, expr: "exp(1 / temp)" }
  - { id: t3, expr: "exp(0 / temp)" }
  - { id: pt1, expr: "t1 / (t1 + t2 + t3)" }
  - { id: pt2, expr: "t2 / (t1 + t2 + t3)" }
  - { id: pt3, expr: "t3 / (t1 + t2 + t3)" }
cards:
  - kind: story
    kicker: Start here
    title: You pay by the token
    body:
      - "A model does not read letters or words. It reads **tokens**, small chunks of text. A rough rule: one token is about four letters, or three quarters of a word."
      - "An **API** lets your code send text to a model and get text back. The bill counts tokens in and tokens out."
    callout: "Text becomes tokens. Tokens become your bill."

  - kind: lab
    kicker: See it first
    title: What does one call cost?
    intro: "Prices are quoted **per million tokens**, and output usually costs more than input. The bars show the cost of **1,000 calls**, in dollars. **Drag the sliders.**"
    view:
      type: bars
      max: 40
      items:
        - { label: "input cost", value: inc, color: "#38bdf8" }
        - { label: "output cost", value: outc, color: "#f59e0b" }
        - { label: "total", value: k, color: "#1cd6ac" }
    sliders: [ptok, otok, pin, pout]
    outro: "A prompt of {ptok} tokens and an answer of {otok} tokens costs about **{k} dollars** for 1,000 calls."

  - kind: formula
    kicker: Read the formula
    title: Cost from tokens
    tex: "\\text{cost} = \\frac{n_{\\text{in}} \\cdot p_{\\text{in}} + n_{\\text{out}} \\cdot p_{\\text{out}}}{1{,}000{,}000}"
    say: "Multiply the input tokens by the input price, do the same for output, add them, then divide by a million because prices are per million tokens."
    verify:
      - { expr: "k", equals: 7.5, tol: 0.01 }
      - { expr: "inc", equals: 3, tol: 0.01 }
      - { expr: "(1000 * 3 + 300 * 15) / 1000", equals: 7.5, tol: 0.01 }
    symbols:
      - { tex: "n_{\\text{in}}", means: "tokens you send: the prompt", value: ptok }
      - { tex: "n_{\\text{out}}", means: "tokens the model writes back", value: otok }
      - { tex: "p_{\\text{in}}, p_{\\text{out}}", means: "price per million tokens, in and out", value: pin }
      - { tex: "1{,}000{,}000", means: "one million, because the price is per million" }

  - kind: code
    kicker: Read it
    title: Your first API call
    intro: "Four parts matter: the **model**, a **system** message that sets behaviour, the **messages** list with roles, and **max_tokens** to cap the answer."
    lang: python
    code: |
      import anthropic

      client = anthropic.Anthropic()   # reads ANTHROPIC_API_KEY
      msg = client.messages.create(
          model="claude-sonnet-5-5",
          max_tokens=300,
          system="You are a concise tutor.",
          messages=[{"role": "user", "content": "Explain tokens in one line."}],
      )
      print(msg.content[0].text)
      print(msg.usage.input_tokens, msg.usage.output_tokens)
    note: "`usage` tells you the real token counts, so you can log the cost of every call."

  - kind: check
    kicker: Check yourself
    title: Estimate the bill
    question: "A prompt has 2,000 tokens and input costs 3 dollars per million. What does the input cost?"
    options:
      - { text: "0.006 dollars", correct: true, why: "2,000 × 3 = 6,000, and 6,000 divided by a million is 0.006." }
      - { text: "0.06 dollars", why: "That is ten times too big. Check the division by one million." }
      - { text: "6 dollars", why: "That forgets to divide by a million." }

  - kind: lab
    kicker: Try it
    title: Temperature changes the dice
    intro: "The model scores every possible next word, then picks one at random by those odds. **Temperature** reshapes the odds. Low means it nearly always picks the top word. High spreads the choice. **Drag it.**"
    view:
      type: bars
      max: 1
      items:
        - { label: "cat (score 2)", value: pt1, color: "#38bdf8" }
        - { label: "dog (score 1)", value: pt2, color: "#a78bfa" }
        - { label: "fish (score 0)", value: pt3, color: "#1cd6ac" }
    sliders: [temp]
    outro: "At temperature {temp} the top word is chosen **{pt1}** of the time."

  - kind: formula
    kicker: Read the formula
    title: Softmax with temperature
    tex: "p_i = \\frac{e^{z_i / T}}{\\sum_j e^{z_j / T}}"
    say: "Divide every score by the temperature, raise e to that power, and share the results out so they add up to 1. A small T makes the biggest score dominate."
    verify:
      - { expr: "pt1", equals: 0.6652, tol: 0.001 }
      - { expr: "pt1 + pt2 + pt3", equals: 1, tol: 0.001 }
    symbols:
      - { tex: "p_i", means: "the chance of picking word i", value: pt1 }
      - { tex: "z_i", means: "the model's raw score for word i" }
      - { tex: "T", means: "temperature, the knob you set in the API", value: temp }
      - { tex: "\\sum_j", means: "add up the term for every candidate word" }

  - kind: check
    kicker: Check yourself
    title: Pick a temperature
    question: "You extract an invoice number from text and want the same answer every run. Which setting fits?"
    options:
      - { text: "Temperature near 0", correct: true, why: "A low temperature almost always picks the top word, so output is steady." }
      - { text: "Temperature 2", why: "High temperature spreads choices, which makes answers vary." }
      - { text: "A larger max_tokens", why: "That only changes how long the answer can be, not how random it is." }

  - kind: practice
    kicker: Your turn
    title: "Estimate the cost"
    intro: "Write `cost(in_tokens, out_tokens, in_price, out_price)` where prices are per million tokens. Return the cost in dollars, rounded to 6 places."
    entry: cost
    starter: |
      def cost(in_tokens, out_tokens, in_price, out_price):
          pass
    solution: |
      def cost(in_tokens, out_tokens, in_price, out_price):
          return round(in_tokens * in_price / 1e6 + out_tokens * out_price / 1e6, 6)
    tests:
      - { input: "[1000, 500, 3, 15]", expected: "0.0105" }
      - { input: "[0, 1000, 3, 15]", expected: "0.015" }
      - { input: "[1000000, 0, 1, 2]", expected: "1.0" }
    hint: "Scale each count by its price, then divide by a million."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Forgetting that the whole conversation is re-sent.** Every turn pays again for all earlier messages."
      - "**Ignoring max_tokens.** An uncapped answer can run long and cost more than you planned."
      - "**Putting the API key in browser code.** Keep it on your server. Anyone can read what the browser receives."
    next: { label: "Next: prompting and structured output", href: /learn/prompting-and-structured-output }
