id: "fd-bayes-updating"
title: "Bayes rule and base rates"
minutes: 13
order: 707
params:
  - { id: "p", label: "how common the condition is (fraction)", min: 0.001, max: 0.5, step: 0.001, init: 0.01 }
derived:
  - { id: "post", expr: "100 * p * 0.9 / (p * 0.9 + (1 - p) * 0.05)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A positive test is not a diagnosis"
    body:
      - "A test catches 90 percent of real cases and wrongly flags 5 percent of healthy people. You test positive. How worried should you be?"
      - "The answer depends on how common the condition is, the **base rate**. Bayes rule combines the base rate with the test to give the true chance."
    callout: "Rare things stay unlikely even after a decent test."
  - kind: "lab"
    kicker: "See it"
    title: "The base rate decides"
    intro: "Same test, different base rate. **Drag how common the condition is.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "chance you are ill after a positive test (percent)", value: "post", color: "#f97316" }
        - { label: "chance of a correct positive from the test alone (percent)", value: "90", color: "#38bdf8" }
    sliders:
      - "p"
    outro: "If the condition affects {p} of people, a positive test means only **{post} percent**. Most positives come from the many healthy people."
  - kind: "code"
    kicker: "Write it"
    title: "Bayes in four lines"
    intro: "Posterior equals prior times likelihood, divided by everything that could give a positive."
    lang: "python"
    code: |
      def posterior(prior, sens, fpr):
          pos = prior * sens + (1 - prior) * fpr
          return prior * sens / pos

      assert abs(posterior(0.01, 0.9, 0.05) - 0.15385) < 1e-4
      assert posterior(0.5, 0.9, 0.05) > 0.9
      assert posterior(0.001, 0.9, 0.05) < 0.02
    note: "The same rule powers naive Bayes, spam filters and many probabilistic models."
  - kind: "lab"
    kicker: "Memorise"
    title: "Reading it"
    intro: "Say it in words."
    view:
      type: "flow"
      stages:
        - { label: "Prior", note: "What you believed before the evidence.", color: "#38bdf8" }
        - { label: "Likelihood", note: "How likely the evidence is under each possibility.", color: "#1cd6ac" }
        - { label: "Posterior", note: "Your updated belief after the evidence.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Rare disease"
    question: "A test is 99 percent accurate and the disease affects 1 in 10000. A positive result means:"
    options:
      - { text: "You are still probably healthy", correct: true, why: "False positives outnumber real cases." }
      - { text: "You are almost surely ill", why: "That ignores the base rate." }
      - { text: "The test is useless", why: "It is informative, not decisive." }
      - { text: "The disease is common", why: "It is rare." }
  - kind: "check"
    kicker: "Practice"
    title: "Fraud model"
    question: "Fraud is 0.1 percent of transactions. Why is a 5 percent false positive rate a problem?"
    options:
      - { text: "Most flagged transactions are legitimate", correct: true, why: "The base rate is tiny." }
      - { text: "It misses all fraud", why: "It is about false alarms." }
      - { text: "It slows training", why: "No." }
      - { text: "It is fine", why: "It overwhelms reviewers." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Ignoring the base rate.** The most common reasoning error."
      - "**Confusing p of test given illness with illness given test.** They differ."
      - "**Using a made up prior without saying so.**"
    next: { label: "Next: entropy and KL", href: "/learn/fd-information-theory" }
