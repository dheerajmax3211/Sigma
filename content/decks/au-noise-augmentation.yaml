id: "au-noise-augmentation"
title: "Noise, SNR and augmentation"
minutes: 13
order: 1002
params:
  - { id: "r", label: "noise loudness compared with the voice", min: 0.01, max: 1, step: 0.01, init: 0.1 }
derived:
  - { id: "snr", expr: "0 - 20 * log(r) / log(10)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Real audio is dirty"
    body:
      - "Models trained on clean studio recordings fall apart in a car, a cafe or on a bad phone line. The usual cure is to train on audio with noise deliberately added."
      - "We describe how noisy a clip is with the **signal to noise ratio**, SNR, in **decibels**. Every 20 dB means the voice is ten times louder than the noise in amplitude. Around 20 dB is easy and near 0 dB is hard."
    callout: "Train on the mess you will meet."
  - kind: "lab"
    kicker: "See it"
    title: "How noisy"
    intro: "Compare the noise loudness with the voice. **Drag the noise.**"
    view:
      type: "bars"
      max: 40
      items:
        - { label: "SNR in decibels", value: "snr", color: "#1cd6ac" }
        - { label: "a hard clip, 5 dB", value: "5", color: "#ef4444" }
    sliders:
      - "r"
    outro: "Noise at {r} of the voice gives an SNR of **{snr} dB**. Lower numbers are noisier."
  - kind: "code"
    kicker: "Write it"
    title: "Mix noise at a chosen SNR"
    intro: "Scale the noise so the mix hits the target."
    lang: "python"
    code: |
      import math

      def power(x):
          return sum(v * v for v in x) / len(x)

      def snr_db(sig, noise):
          return 10 * math.log10(power(sig) / power(noise))

      def mix(sig, noise, target_db):
          k = math.sqrt(power(sig) / (power(noise) * 10 ** (target_db / 10)))
          return [s + k * n for s, n in zip(sig, noise)], [k * n for n in noise]

      sig = [1, -1, 1, -1]
      noise = [1, 1, -1, -1]
      assert abs(snr_db(sig, [0.1 * v for v in noise]) - 20) < 1e-9

      mixed, scaled = mix(sig, noise, 10)
      assert abs(snr_db(sig, scaled) - 10) < 1e-9
      assert len(mixed) == 4
    note: "Other augmentations: speed change, pitch shift, room echo and masking bands of the spectrogram."
  - kind: "lab"
    kicker: "Memorise"
    title: "A cheap augmentation kit"
    intro: "Apply these at random while training."
    view:
      type: "flow"
      stages:
        - { label: "Background noise", note: "Add street, cafe or music at a random SNR.", color: "#f97316" }
        - { label: "Speed", note: "Play 0.9 to 1.1 times faster.", color: "#38bdf8" }
        - { label: "Room echo", note: "Convolve with a room response.", color: "#1cd6ac" }
        - { label: "Masking", note: "Hide time or frequency bands.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "20 dB"
    question: "What does 20 dB of SNR mean for amplitude?"
    options:
      - { text: "Voice is ten times the noise", correct: true, why: "20 dB is a factor of ten in amplitude." }
      - { text: "They are equal", why: "That is 0 dB." }
      - { text: "Noise is louder", why: "That is negative." }
      - { text: "Voice is two times", why: "That is about 6 dB." }
  - kind: "check"
    kicker: "Practice"
    title: "Why"
    question: "Why add noise to training audio?"
    options:
      - { text: "So the model works on noisy audio at test time", correct: true, why: "It learns to ignore it." }
      - { text: "To shrink the file", why: "No." }
      - { text: "To hide the speaker", why: "No." }
      - { text: "To speed training", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Only training on clean data.** It breaks in the real world."
      - "**Noise far louder than any real use.** Keep it plausible."
      - "**Augmenting the test set.** Keep it fixed."
    next: { label: "Next: spectrograms and mel features", href: "/learn/au-spectrogram-mel" }
