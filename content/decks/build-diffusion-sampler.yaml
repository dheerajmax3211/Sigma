id: build-diffusion-sampler
title: "Build a diffusion sampler"
order: 1202
minutes: 25
params:
  - { id: steps, label: "sampling steps", min: 5, max: 50, step: 5, init: 20 }
  - { id: w, label: "guidance weight", min: 1, max: 10, step: 1, init: 7 }
derived:
  - { id: calls, expr: "steps * 2" }
cards:
  - kind: story
    kicker: Guided build
    title: "Noise in, picture out"
    body:
      - "A diffusion model learns to predict the noise in an image. To make a picture you start from pure noise and remove a little of it, many times."
      - "You will build the three moves of a sampler: a **DDIM step**, a **flow matching Euler step**, and **classifier free guidance** that steers toward your prompt."

  - kind: lab
    kicker: See it first
    title: "Guidance doubles the work"
    intro: "Guidance runs the model twice per step, once with the prompt and once without. **Drag the sliders.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "model calls with guidance", value: calls, color: "#ef4444" }
        - { label: "model calls without", value: steps, color: "#1cd6ac" }
    sliders: [steps, w]
    outro: "{steps} steps with guidance cost **{calls}** model calls, double the {steps} without. Weight {w} pushes harder toward the prompt."

  - kind: code
    kicker: Starter code
    title: "One step on one number"
    intro: "Real images have millions of numbers, but the maths is the same on one. Here is the guidance rule."
    lang: python
    code: |
      def cfg(eps_uncond, eps_cond, w):
          return eps_uncond + w * (eps_cond - eps_uncond)

      assert cfg(1.0, 2.0, 3.0) == 4.0
      print(cfg(0.0, 1.0, 0.0))
    note: "At weight 0 you ignore the prompt, at 1 you follow it, above 1 you exaggerate it."

  - kind: practice
    kicker: Build step
    title: "Guide the noise prediction"
    intro: "Write `cfg(eps_u, eps_c, w)`: start at the unguided prediction and move `w` times the gap toward the prompted one. Round to 4 places."
    entry: cfg
    starter: |
      import math
      def cfg(eps_u, eps_c, w):
          pass
    solution: |
      import math
      def cfg(eps_u, eps_c, w):
          return round(eps_u + w * (eps_c - eps_u), 4)
    tests:
      - { input: "[1.0, 2.0, 3.0]", expected: "4.0" }
      - { input: "[0.5, 0.5, 7]", expected: "0.5" }
      - { input: "[0.0, 1.0, 0.0]", expected: "0.0" }
    hint: "The gap is conditional minus unconditional."

  - kind: practice
    kicker: Build step
    title: "Euler step"
    intro: "Flow matching moves along a velocity. Write `euler_step(x, v, dt)` returning the new value after one step. Round to 4 places."
    entry: euler_step
    starter: |
      import math
      def euler_step(x, v, dt):
          pass
    solution: |
      import math
      def euler_step(x, v, dt):
          return round(x + v * dt, 4)
    tests:
      - { input: "[1.0, 2.0, 0.1]", expected: "1.2" }
      - { input: "[0, -1, 0.5]", expected: "-0.5" }
    hint: "New position is old position plus velocity times time."

  - kind: practice
    kicker: Build step
    title: "DDIM step"
    intro: "Given noisy `x`, predicted noise `eps`, and signal levels `a_t` now and `a_prev` next, first estimate the clean value `x0 = (x - sqrt(1 - a_t) * eps) / sqrt(a_t)`. Return `sqrt(a_prev) * x0 + sqrt(1 - a_prev) * eps`, rounded to 4 places."
    entry: ddim_step
    starter: |
      import math
      def ddim_step(x, eps, a_t, a_prev):
          pass
    solution: |
      import math
      def ddim_step(x, eps, a_t, a_prev):
          x0 = (x - math.sqrt(1 - a_t) * eps) / math.sqrt(a_t)
          return round(math.sqrt(a_prev) * x0 + math.sqrt(1 - a_prev) * eps, 4)
    tests:
      - { input: "[2.0, 0.0, 1.0, 1.0]", expected: "2.0" }
      - { input: "[1.0, 1.0, 0.25, 1.0]", expected: "0.2679" }
      - { input: "[1.0, 0.5, 0.5, 0.8]", expected: "1.0413" }
    hint: "Guess the clean value first, then re-noise it to the next level."

  - kind: check
    kicker: Check yourself
    title: "Fewer steps"
    question: "You halve the sampling steps. What do you expect?"
    options:
      - { text: "Faster, with some loss of detail", correct: true, why: "Fewer steps are fewer model calls, but each step has to remove more noise." }
      - { text: "Identical pictures", why: "Coarser steps change the result." }
      - { text: "Better pictures, always", why: "Fewer steps rarely help quality." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Skipping the unconditional pass.** Without it there is no guidance."
      - "**Too high a weight.** Colours burn out and detail turns harsh."
      - "**Mixing up time directions.** DDIM runs from noisy to clean."
    next: { label: "Next build", href: "/learn/build-lora-engine" }
