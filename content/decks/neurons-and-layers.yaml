id: neurons-and-layers
title: Neurons and layers
order: 17
minutes: 10
params:
  - { id: x1, label: "input x₁", min: -2, max: 3, step: 0.5, init: 2 }
  - { id: x2, label: "input x₂", min: -2, max: 3, step: 0.5, init: 1 }
  - { id: w1, label: "weight w₁", min: -1.5, max: 1.5, step: 0.25, init: 1 }
  - { id: w2, label: "weight w₂", min: -1.5, max: 1.5, step: 0.25, init: -0.5 }
  - { id: b, label: "bias b", min: -2, max: 2, step: 0.25, init: -0.5 }
derived:
  - { id: z, expr: "w1 * x1 + w2 * x2 + b" }
  - { id: a, expr: "max(z, 0)" }
  - { id: nA, expr: "max(x1 - x2, 0)" }
  - { id: nB, expr: "max(x2 - x1, 0)" }
  - { id: nC, expr: "max(x1 + x2 - 2, 0)" }
cards:
  - kind: story
    kicker: Start here
    title: A neuron is a tiny voter
    body:
      - "A neuron looks at a few numbers, gives each one a **weight** for how much it matters, adds them up, and then decides how loudly to speak."
      - "One neuron can only do something simple. Stack thousands of them in **layers** and the network can recognise faces or write text."
    callout: "Weigh the inputs, add, then decide."

  - kind: lab
    kicker: See it first
    title: Compute one neuron
    intro: "Two inputs go in. Each is multiplied by its weight, the results are added with a **bias**, and that sum is called **z**. The neuron then keeps z if it is positive and outputs 0 if not. **Drag the sliders.**"
    view:
      type: chain
      nodes:
        - { label: "inputs x₁ and x₂", value: x1, color: "#38bdf8" }
        - { label: "sum z", value: z, color: "#a78bfa" }
        - { label: "output a", value: a, color: "#1cd6ac" }
      edges:
        - { label: "× weights, add b" }
        - { label: "keep if positive" }
    also:
      type: curve
      fn: "max(t, 0)"
      min: -6
      max: 12
      yMin: 0
      yMax: 12
      point: z
      xLabel: "sum z"
      yLabel: "output a"
    sliders: [x1, x2, w1, w2, b]
    outro: "The sum is **{z}**, so the neuron outputs **{a}**. A negative sum is clipped to 0."

  - kind: formula
    kicker: Read the formula
    title: One neuron in one line
    tex: "a = \\max\\left(0,\\; w_1 x_1 + w_2 x_2 + b\\right)"
    say: "Multiply each input by its weight, add them together with the bias, and if the total is below zero, output zero instead. The clipping step is called ReLU."
    verify:
      - { expr: "z", equals: 1, tol: 0.01 }
      - { expr: "a", equals: 1, tol: 0.01 }
      - { expr: "max(0, 1 * 2 + (0 - 0.5) * 1 + (0 - 0.5))", equals: 1, tol: 0.01 }
    symbols:
      - { tex: "a", means: "the neuron's output, called its activation", value: a }
      - { tex: "w_1, w_2", means: "weights: how much each input matters", value: w1 }
      - { tex: "x_1, x_2", means: "the inputs, the numbers coming in", value: x1 }
      - { tex: "b", means: "bias: a fixed nudge added to every sum", value: b }
      - { tex: "\\max(0, \\cdot)", means: "keep the number if positive, otherwise use 0" }

  - kind: check
    kicker: Check yourself
    title: Compute it by hand
    question: "Weights are 2 and 1, inputs are 1 and −3, and the bias is 0.5. What does the neuron output?"
    options:
      - { text: "0", correct: true, why: "The sum is 2 × 1 + 1 × (−3) + 0.5 = −0.5. It is negative, so ReLU clips it to 0." }
      - { text: "−0.5", why: "That is the sum z. The neuron then clips negative sums to 0." }
      - { text: "0.5", why: "That is only the bias. The weighted inputs must be added in too." }

  - kind: lab
    kicker: Try it
    title: A layer is many neurons side by side
    intro: "Three neurons read the **same two inputs** but use different weights, so each one notices something different. Neuron A likes x₁ bigger than x₂, B likes the opposite, and C likes both being large. **Drag x₁ and x₂.**"
    view:
      type: bars
      max: 4
      items:
        - { label: "neuron A", value: nA, color: "#38bdf8" }
        - { label: "neuron B", value: nB, color: "#a78bfa" }
        - { label: "neuron C", value: nC, color: "#1cd6ac" }
    sliders: [x1, x2]
    outro: "The layer's output is the list **{nA}, {nB}, {nC}**. The next layer reads this list as its inputs."

  - kind: story
    kicker: Why layers help
    title: The clipping is what makes depth useful
    body:
      - "Without the clip, every neuron is just multiply and add. Stacking multiply-and-add layers still gives one multiply-and-add, so extra layers would add nothing."
      - "The bend at zero breaks that. Each layer can now carve the data in a new way, and deeper layers build on the shapes found by earlier ones."
    callout: "Without a bend, depth is wasted."

  - kind: check
    kicker: Check yourself
    title: Why the activation
    question: "What goes wrong if a network has no activation function, only weights and sums?"
    options:
      - { text: "Many layers collapse into the power of just one", correct: true, why: "A sum of sums of weighted inputs is still one weighted sum. Depth buys nothing." }
      - { text: "The network cannot take inputs", why: "Inputs work fine. The problem is that the layers stop adding power." }
      - { text: "The weights stop being numbers", why: "Weights stay numbers. The issue is the missing bend between layers." }

  - kind: practice
    kicker: Your turn
    title: "One neuron"
    intro: "Write `neuron(x, w, b)`: the dot product of `x` and `w`, plus `b`, then ReLU (negative becomes 0). Round to 4 places."
    entry: neuron
    starter: |
      def neuron(x, w, b):
          pass
    solution: |
      def neuron(x, w, b):
          z = sum(p * q for p, q in zip(x, w)) + b
          return round(max(0.0, z), 4)
    tests:
      - { input: "[[1, 2], [0.5, 0.5], 0]", expected: "1.5" }
      - { input: "[[1, 1], [-1, -1], 0.5]", expected: "0.0" }
      - { input: "[[2], [3], -1]", expected: "5" }
    hint: "Weighted sum, add the bias, then clip below at zero."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Forgetting the bias.** Without b, a neuron with all-zero inputs can only output 0."
      - "**Thinking a neuron is a brain cell.** It is a weighted sum plus a clip. The name is just a nickname."
      - "**Mixing up weights and activations.** Weights are learned and fixed per example. Activations change with every input."
    next: { label: "Next: backpropagation", href: /learn/backpropagation }
