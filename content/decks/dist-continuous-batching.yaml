id: "dist-continuous-batching"
title: "Continuous batching"
minutes: 14
order: 807
params:
  - { id: "long", label: "length of the longest request (steps)", min: 4, max: 64, step: 1, init: 8 }
derived:
  - { id: "waste", expr: "100 * (1 - (long + 9) / (4 * long))" }
  - { id: "useful", expr: "100 - waste" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Do not wait for the slowest"
    body:
      - "A server answers many requests at once. In **static batching** it groups four, runs them together, and waits until the longest one finishes. Short requests sit idle and the slots are wasted."
      - "**Continuous batching** refills a slot the moment its request finishes. Every step, the server mixes new and old requests. Most modern LLM servers work this way."
    callout: "Slots stay busy, so the same GPU serves more people."
  - kind: "lab"
    kicker: "See it"
    title: "Wasted slots"
    intro: "Four requests share a batch: one long and three of 3 steps. **Drag the long one.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "slot time doing real work (percent)", value: "useful", color: "#1cd6ac" }
        - { label: "slot time sitting idle (percent)", value: "waste", color: "#ef4444" }
    sliders:
      - "long"
    outro: "When the longest runs {long} steps, **{waste} percent** of the slot time is idle in a static batch. Continuous batching reclaims it."
  - kind: "code"
    kicker: "Write it"
    title: "Static against continuous"
    intro: "Count the steps to finish eight requests with four slots."
    lang: "python"
    code: |
      import heapq

      lengths = [2, 8, 3, 3, 2, 6, 4, 3]
      slots = 4

      def static(lengths, slots):
          total = 0
          for i in range(0, len(lengths), slots):
              total += max(lengths[i:i + slots])      # wait for the longest
          return total

      def continuous(lengths, slots):
          free_at = lengths[:slots]
          heapq.heapify(free_at)
          for n in lengths[slots:]:
              t = heapq.heappop(free_at)              # first slot to free up
              heapq.heappush(free_at, t + n)
          return max(free_at)

      assert static(lengths, slots) == 14
      assert continuous(lengths, slots) == 9
    note: "The work is identical. Only the scheduling changed, and it cut the time by a third."
  - kind: "lab"
    kicker: "Memorise"
    title: "The loop"
    intro: "One server step."
    view:
      type: "flow"
      stages:
        - { label: "Admit", note: "Move waiting requests into free slots.", color: "#38bdf8" }
        - { label: "Decode", note: "Generate one token for every active request.", color: "#1cd6ac" }
        - { label: "Retire", note: "Remove finished requests.", color: "#f97316" }
        - { label: "Repeat", note: "Next step, with a new mix.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why better"
    question: "Why does continuous batching raise throughput?"
    options:
      - { text: "Finished requests free slots immediately", correct: true, why: "No slot waits for the longest request." }
      - { text: "It makes each token faster", why: "Latency per token is similar." }
      - { text: "It shrinks the model", why: "No." }
      - { text: "It skips tokens", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Trade"
    question: "What limits how many requests you can admit at once?"
    options:
      - { text: "KV cache memory", correct: true, why: "Each active request holds a cache." }
      - { text: "The alphabet size", why: "No." }
      - { text: "Learning rate", why: "No." }
      - { text: "Nothing", why: "Memory limits it." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Admitting too many.** The cache runs out."
      - "**Ignoring prefill.** Long prompts stall decoding."
      - "**Judging by average latency only.** Watch the tail."
    next: { label: "Next: speculative decoding", href: "/learn/dist-speculative-decoding" }
