id: dsa-big-o
title: "Big O: how fast is fast enough"
minutes: 14
order: 101
params:
  - { id: n, label: "items n", min: 2, max: 30, step: 1, init: 10 }
  - { id: big, label: "input size", min: 1000, max: 1000000, step: 1000, init: 100000 }
derived:
  - { id: lg, expr: "log(n) / log(2)" }
  - { id: nlg, expr: "n * lg" }
  - { id: sq, expr: "n * n" }
  - { id: ex, expr: "min(2 ^ n, 1000)" }
  - { id: biglg, expr: "log(big) / log(2)" }
  - { id: t_lin, expr: "big / 100000000" }
  - { id: t_nlg, expr: "big * biglg / 100000000" }
  - { id: t_sq, expr: "big * big / 100000000" }
cards:
  - kind: story
    kicker: Start here
    title: "Same code, two very different days"
    body:
      - "Your program works on 10 items. You run it on 10 million and it never finishes. The code did not change. **The amount of work grew faster than the data.**"
      - "Big O is a way to say how fast the work grows as the input grows. Interviewers ask about it in almost every coding question."
    callout: "Big O answers one question: if the input doubles, what happens to the work?"

  - kind: lab
    kicker: See it
    title: "Five growth rates"
    intro: "Each bar counts the steps an algorithm takes for **n** items. Drag n up and watch which bars explode."
    view:
      type: bars
      max: 1000
      items:
        - { label: "constant: 1", value: "1", color: "#1cd6ac" }
        - { label: "log n", value: lg, color: "#38bdf8" }
        - { label: "n", value: n, color: "#a78bfa" }
        - { label: "n log n", value: nlg, color: "#f59e0b" }
        - { label: "n squared", value: sq, color: "#f97316" }
        - { label: "2 to the n", value: ex, color: "#ef4444" }
    sliders: [n]
    outro: "At n = {n}: log n is {lg}, n squared is {sq}. The red bar stops at 1000 only because I capped it."

  - kind: code
    kicker: Count the steps
    title: "Loops are the whole story"
    intro: "Count how many times the inner line runs. One loop does **n** steps. A loop inside a loop does **n times n**. Two loops side by side do **n plus n**, which is still just n."
    lang: python
    code: |
      def count(n):
          one = 0
          for i in range(n):          # n steps
              one += 1
          nested = 0
          for i in range(n):          # n times
              for j in range(n):      # n steps each: n * n
                  nested += 1
          side = 0
          for i in range(n):
              side += 1
          for j in range(n):
              side += 1               # n + n = 2n, still linear
          return one, nested, side

      assert count(10) == (10, 100, 20)
      assert count(100) == (100, 10000, 200)
    note: "Going from 10 to 100 made the nested loop 100 times bigger, but the single loop only 10 times bigger."

  - kind: formula
    kicker: Read the symbols
    title: "Dropping what does not matter"
    tex: "3n + 10 \\ \\to \\ O(n)"
    say: "For big n, the constant 3 and the extra 10 barely change the shape. We keep only the part that grows fastest and drop its multiplier."
    verify:
      - { expr: "3 * n + 10", equals: 40, tol: 0.01 }
      - { expr: "n * n", equals: 100, tol: 0.01 }
    symbols:
      - { tex: "n", means: "how many items the input has", value: n }
      - { tex: "3n+10", means: "the exact number of steps, which is 3 per item plus 10 setup", value: "3 * n + 10" }
      - { tex: "O(n)", means: "read it as: grows in step with n" }
      - { tex: "n^{2}", means: "n times n, the shape of a loop inside a loop", value: sq }

  - kind: check
    kicker: Your turn
    title: "Which Big O?"
    question: "A function loops over a list once, and inside the loop it loops over the whole list again. What is its Big O?"
    options:
      - { text: "O(n)", why: "That would be one loop. The inner loop multiplies the work." }
      - { text: "O(n squared)", correct: true, why: "n passes of n steps each is n times n." }
      - { text: "O(2n)", why: "Two loops side by side give 2n. Nested loops multiply." }
      - { text: "O(log n)", why: "Log n needs the problem to halve each step. Nothing halves here." }

  - kind: lab
    kicker: Why log n is magic
    title: "Halving beats counting"
    intro: "To find a number in a sorted list, look at the middle and throw away half. That takes **log n** steps instead of **n**. Drag the input size."
    view:
      type: bars
      items:
        - { label: "check one by one", value: big, color: "#f97316" }
        - { label: "halve each time", value: biglg, color: "#1cd6ac" }
    sliders: [big]
    outro: "For {big} items, counting takes up to **{big}** steps. Halving takes about **{biglg}**."

  - kind: lab
    kicker: The real rule of thumb
    title: "A computer does about 100 million steps a second"
    intro: "Use that to choose an algorithm before you code. Seconds below assume 100 million simple steps per second. **Drag the input size.**"
    view:
      type: bars
      max: 10
      items:
        - { label: "n steps", value: t_lin, color: "#1cd6ac" }
        - { label: "n log n steps", value: t_nlg, color: "#f59e0b" }
        - { label: "n squared steps", value: t_sq, color: "#ef4444" }
    sliders: [big]
    outro: "At {big} items, n squared needs **{t_sq}** seconds. n log n needs **{t_nlg}**. If a problem says n can reach 10^5 or more, n squared is too slow."

  - kind: code
    kicker: Space counts too
    title: "Memory is a price you can pay"
    intro: "A set uses extra memory, O(n), to make lookups O(1). That is the most common trade in interviews: **spend memory to save time.**"
    lang: python
    code: |
      def has_duplicate_slow(nums):       # O(n^2) time, O(1) space
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] == nums[j]:
                      return True
          return False

      def has_duplicate_fast(nums):       # O(n) time, O(n) space
          seen = set()
          for x in nums:
              if x in seen:
                  return True
              seen.add(x)
          return False

      for f in (has_duplicate_slow, has_duplicate_fast):
          assert f([1, 2, 3, 1]) is True
          assert f([1, 2, 3]) is False
    note: "Both are correct. Which one is better depends on the input limit and the memory you have."

  - kind: check
    kicker: Pick the algorithm
    title: "Read the limit first"
    question: "A problem says n can be 200,000 and gives 1 second. Which approach is safe?"
    options:
      - { text: "Two nested loops over n", why: "200,000 squared is 40 billion steps. Far too slow." }
      - { text: "Sort once, then one pass", correct: true, why: "n log n is about 3.5 million steps. Fits easily." }
      - { text: "Try every subset", why: "That is 2 to the n. Not even close." }
      - { text: "Any of them, Python is fast", why: "No language saves you from 40 billion steps." }

  - kind: check
    kicker: Trick question
    title: "Does it halve?"
    question: "A loop runs while i < n and does i = i * 2 each time, starting at 1. How many times does it run?"
    options:
      - { text: "About n times", why: "i jumps 1, 2, 4, 8, so it reaches n much faster." }
      - { text: "About log n times", correct: true, why: "Doubling until you reach n takes log base 2 of n steps. Halving and doubling are the same shape." }
      - { text: "Exactly 2 times", why: "It keeps going until i reaches n." }
      - { text: "n squared times", why: "There is only one loop and no inner loop." }

  - kind: practice
    kicker: Your turn
    title: "Count the steps"
    intro: "Write `count_pairs(n)` that returns how many pairs `(i, j)` with `i < j` exist in a list of n items. Do it with a formula, not nested loops. That is the gap between O(n) and O(n squared)."
    entry: count_pairs
    starter: |
      def count_pairs(n):
          pass
    solution: |
      def count_pairs(n):
          return n * (n - 1) // 2
    tests:
      - { input: "[0]", expected: "0" }
      - { input: "[2]", expected: "1" }
      - { input: "[5]", expected: "10" }
      - { input: "[1000]", expected: "499500" }
    hint: "Each item pairs with every item after it: (n-1) + (n-2) + ... + 1."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Saying O(2n) or O(n + 5).** Write O(n). Constants and small terms are dropped."
      - "**Forgetting hidden loops.** `x in my_list`, `sorted(...)` and slicing all cost real time. A set lookup is O(1), a list lookup is O(n)."
      - "**Only counting time.** Say your space cost out loud too. Interviewers listen for both."
      - "**Coding before checking the limit.** Read n first. It tells you which Big O you are allowed."
    next: { label: "Next: arrays and strings", href: /learn/dsa-arrays-and-strings }
