id: dl-optimisers
title: "Optimisers: SGD, momentum and Adam"
minutes: 14
order: 403
params:
  - { id: lr, label: "learning rate", min: 0.05, max: 1.1, step: 0.05, init: 0.3 }
derived:
  - { id: dist, expr: "3 * abs(1 - 2 * lr) ^ 10" }
cards:
  - kind: story
    kicker: Start here
    title: "How far to step"
    body:
      - "The gradient tells you which way is downhill. The **optimiser** decides how big a step to take."
      - "Plain **SGD** steps by learning rate times gradient. **Momentum** keeps a running direction so it smooths noise. **Adam** also scales each weight's step by how large its gradients have been."
    callout: "Adam is the default for transformers. SGD with momentum is common for vision."

  - kind: lab
    kicker: See it
    title: "The learning rate"
    intro: "Minimise the bowl (w minus 3) squared, starting from 0. After 10 steps, how far are you from 3? **Drag the learning rate.**"
    view:
      type: bars
      max: 20
      items:
        - { label: "distance from best w after 10 steps", value: dist, color: "#f97316" }
        - { label: "starting distance", value: "3", color: "#38bdf8" }
    sliders: [lr]
    outro: "At rate {lr} you end **{dist}** away. Too small barely moves. Above 1 each step overshoots further and it blows up."

  - kind: code
    kicker: Write it
    title: "Three update rules"
    intro: "Each function returns the new weight and any state it keeps."
    lang: python
    code: |
      import math

      def sgd(w, g, lr):
          return w - lr * g

      def momentum(w, g, v, lr, beta=0.9):
          v = beta * v + g
          return w - lr * v, v

      def adam(w, g, m, v, t, lr, b1=0.9, b2=0.999, eps=1e-8):
          m = b1 * m + (1 - b1) * g
          v = b2 * v + (1 - b2) * g * g
          mh = m / (1 - b1 ** t)
          vh = v / (1 - b2 ** t)
          return w - lr * mh / (math.sqrt(vh) + eps), m, v

      assert sgd(1.0, 2.0, 0.1) == 0.8
      w, v = momentum(1.0, 2.0, 0.0, 0.1)
      assert abs(w - 0.8) < 1e-12 and v == 2.0
      w, m, v = adam(1.0, 2.0, 0.0, 0.0, 1, 0.1)
      assert abs(w - 0.9) < 1e-6
    note: "On the first step Adam moves by almost exactly the learning rate, whatever the gradient size."

  - kind: lab
    kicker: Compare
    title: "Which to reach for"
    intro: "A short rule of thumb."
    view:
      type: flow
      stages:
        - { label: "AdamW", note: "Default for language models and most new projects.", color: "#38bdf8" }
        - { label: "SGD with momentum", note: "Often best for image models, with tuning.", color: "#1cd6ac" }
        - { label: "Schedule", note: "Warm up, then decay the rate. Matters as much as the optimiser.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Loss explodes"
    question: "Your loss goes to infinity after a few steps. What is the first thing to try?"
    options:
      - { text: "Lower the learning rate", correct: true, why: "Steps that are too large overshoot and diverge." }
      - { text: "Raise the learning rate", why: "That makes it worse." }
      - { text: "Add more layers", why: "No." }
      - { text: "Remove the loss", why: "No." }

  - kind: check
    kicker: Practice
    title: "Why Adam is steadier"
    question: "What does Adam do that plain SGD does not?"
    options:
      - { text: "It gives each weight its own step size based on past gradients", correct: true, why: "Rarely updated weights take bigger steps, noisy ones smaller." }
      - { text: "It removes the gradient", why: "It uses gradients." }
      - { text: "It changes the loss", why: "No." }
      - { text: "It trains without data", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Tuning everything at once.** Fix the learning rate first."
      - "**No warm-up for transformers.** Early steps can blow up."
      - "**Weight decay in plain Adam.** Prefer AdamW."
    next: { label: "Next: regularisation", href: /learn/dl-regularisation }
