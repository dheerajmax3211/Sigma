id: dl-cnn-architectures
title: "CNN architectures and skip connections"
minutes: 13
order: 408
params:
  - { id: L, label: "layers", min: 1, max: 40, step: 1, init: 20 }
derived:
  - { id: plain, expr: "100 * 0.85 ^ L" }
cards:
  - kind: story
    kicker: Start here
    title: "Deeper helped, until it did not"
    body:
      - "**LeNet** read digits with a few layers. **AlexNet** went deeper on GPUs and won image contests. **VGG** stacked many small 3 by 3 kernels."
      - "Past about 20 layers, plain stacks got worse to train. **ResNet** fixed this by adding the input back to the output of each block, a **skip connection**."
    callout: "Skip connections let signal and gradients travel straight through."

  - kind: lab
    kicker: See it
    title: "Why depth hurt"
    intro: "Say each layer keeps 85 percent of the gradient signal. After many layers little is left. A skip path keeps a direct route. **Drag the depth.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "signal through a plain stack", value: plain, color: "#ef4444" }
        - { label: "signal with skip connections (direct path)", value: "100", color: "#1cd6ac" }
    sliders: [L]
    outro: "At {L} layers the plain stack keeps **{plain} percent**. The skip path still carries all of it."

  - kind: code
    kicker: Write it
    title: "A residual block"
    intro: "The block learns a change to add to its input, not a whole new output."
    lang: python
    code: |
      def residual(x, f):
          return [a + b for a, b in zip(x, f(x))]

      zero = lambda x: [0 for _ in x]
      double = lambda x: [a for a in x]

      assert residual([1, 2, 3], zero) == [1, 2, 3]
      assert residual([1, 2, 3], double) == [2, 4, 6]
    note: "If the best thing is to do nothing, the block only needs to learn zero, which is easy."

  - kind: lab
    kicker: Compare
    title: "The lineage"
    intro: "Each step solved one problem."
    view:
      type: flow
      stages:
        - { label: "AlexNet", note: "Deep conv nets work, with GPUs and ReLU.", color: "#38bdf8" }
        - { label: "VGG", note: "Many small 3 by 3 kernels in a row.", color: "#1cd6ac" }
        - { label: "ResNet", note: "Skip connections make 50 to 150 layers trainable.", color: "#f97316" }
        - { label: "EfficientNet", note: "Scale depth, width and size together.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "What a skip does"
    question: "What does a skip connection add to a layer's output?"
    options:
      - { text: "The layer's own input", correct: true, why: "Output equals input plus the learned change." }
      - { text: "Random noise", why: "No." }
      - { text: "The loss", why: "No." }
      - { text: "Extra labels", why: "No." }

  - kind: check
    kicker: Practice
    title: "Which in practice"
    question: "You need an image classifier on a small dataset. What is the sensible start?"
    options:
      - { text: "Fine-tune a pretrained ResNet", correct: true, why: "Pretrained features transfer well and need little data." }
      - { text: "Train a 100 layer net from scratch", why: "That needs far more data." }
      - { text: "Use a dense network on raw pixels", why: "It ignores image structure." }
      - { text: "Skip training", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Training from scratch on little data.** Start from pretrained weights."
      - "**Mismatched shapes in a skip.** Use a 1 by 1 conv to match channels."
      - "**Wrong input scaling.** Use the same normalisation the model was trained with."
    next: { label: "Next: RNN, LSTM, GRU", href: /learn/dl-rnn-lstm-gru }
