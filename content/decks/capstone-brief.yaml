id: capstone-brief
title: Your capstone project
order: 41
minutes: 9
params:
  - { id: feats, label: "features you plan", min: 1, max: 12, step: 1, init: 6 }
  - { id: hpf, label: "hours per feature", min: 4, max: 20, step: 2, init: 8 }
  - { id: avail, label: "hours you have", min: 20, max: 120, step: 10, init: 60 }
derived:
  - { id: need, expr: "feats * hpf + 20" }
  - { id: fit, expr: "max(floor((avail - 20) / hpf), 0)" }
  - { id: gap, expr: "max(need - avail, 0)" }
cards:
  - kind: story
    kicker: Start here
    title: One project that proves it
    body:
      - "A hiring manager does not read your course list. They open one project and ask whether you can build something real."
      - "So build **one** project, well. It solves a real user problem, has an AI core such as RAG or an agent, and is deployed so they can click it."
    callout: "One finished project beats five half-done ones. You build it as DocChat, in four stages from week 4."

  - kind: lab
    kicker: See it first
    title: Will your scope fit
    intro: "Every project also needs about **20 hours** for deploying, an eval and a write-up. Count features against the hours you really have. **Drag the sliders.**"
    view:
      type: bars
      max: 260
      items:
        - { label: "hours your plan needs", value: need, color: "#ef4444" }
        - { label: "hours you have", value: avail, color: "#1cd6ac" }
    also:
      type: bars
      max: 12
      items:
        - { label: "features you planned", value: feats, color: "#a78bfa" }
        - { label: "features that really fit", value: fit, color: "#38bdf8" }
    sliders: [feats, hpf, avail]
    outro: "{feats} features at {hpf} hours each need **{need} hours** plus the wrap-up. You have {avail}, so you are short by **{gap}**, and only **{fit}** features fit."

  - kind: formula
    kicker: Read the formula
    title: How many features fit
    tex: "n = \\left\\lfloor \\frac{H - 20}{h} \\right\\rfloor"
    say: "Take your hours, set aside 20 for deploying and writing up, and divide the rest by the hours one feature takes. Round down."
    verify:
      - { expr: "need", equals: 68, tol: 0.01 }
      - { expr: "fit", equals: 5, tol: 0.01 }
      - { expr: "gap", equals: 8, tol: 0.01 }
    symbols:
      - { tex: "n", means: "features you can finish", value: fit }
      - { tex: "H", means: "total hours you have", value: avail }
      - { tex: "h", means: "hours one feature takes you", value: hpf }
      - { tex: "\\lfloor \\cdot \\rfloor", means: "round down, since half a feature is not a feature" }

  - kind: story
    kicker: What goes in it
    title: The four parts
    body:
      - "**A real problem**: one person you can name, with a task that is slow today. **An AI core**: RAG over their documents, or an agent with a few tools."
      - "**Proof**: tests and an eval with a pass rate you can quote. **A demo**: deployed, with a short write-up on design choices and what failed."
    callout: "Problem, core, proof, demo."

  - kind: check
    kicker: Check yourself
    title: Pick the scope
    question: "You have 60 hours. Which plan is the sensible one?"
    options:
      - { text: "One chat feature over real documents, plus an eval and a deployed demo", correct: true, why: "It is small enough to finish, and it shows the whole path from idea to deployed." }
      - { text: "A chat app, a voice mode, a mobile app and a plugin store", why: "That is far too much for 60 hours, and nothing would be finished." }
      - { text: "A tutorial project copied from a course", why: "A hiring manager has seen it many times, and it solves nobody's real problem." }

  - kind: mistakes
    kicker: Checklist
    title: Before you call it done
    items:
      - "**Deployed.** A link that works, not only code on your laptop."
      - "**An eval.** A fixed set of cases with a pass rate you can say aloud."
      - "**A write-up.** One page: the problem, the design, a trade-off you made and what you would fix next."
      - "**A readme with a screenshot.** Reviewers decide in under a minute."
    next: { label: "Next: DSA patterns", href: /learn/dsa-patterns }
