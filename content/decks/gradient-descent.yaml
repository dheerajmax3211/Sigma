id: gradient-descent
title: Slope and gradient descent
order: 14
minutes: 9
params:
  - { id: w, label: w, min: -1, max: 7, step: 0.1, init: 0.5 }
  - { id: lr, label: rate, min: 0.01, max: 1.1, step: 0.01, init: 0.1 }
derived:
  - { id: loss, expr: (w - 3) ^ 2 + 1 }
  - { id: slope, expr: 2 * (w - 3) }
  - { id: next, expr: w - lr * slope }
cards:
  - kind: story
    kicker: The problem
    title: Lost on a hill in the fog
    body:
      - You are on a hillside in thick fog. You cannot see the valley, but you can feel which way the ground tilts under your feet. So you step downhill, feel again, and repeat.
      - Training a model works the same way. The hill is the **loss**, a number for how wrong the model is. Your position is a **weight**. The tilt under your feet is the **slope**.
    callout: Gradient descent means feel the slope, step downhill, repeat.

  - kind: lab
    kicker: See it first
    title: The loss curve and its slope
    intro: The blue curve shows the loss for every value of one weight w. The green dot is where we are. The orange line is the slope there. **Drag w.**
    view: { type: curve, fn: "(t - 3) ^ 2 + 1", min: -1, max: 7, point: w, slope: slope, xLabel: w, yLabel: loss }
    sliders: [w]
    outro: At w = **{w}** the loss is **{loss}** and the slope is **{slope}**. A negative slope tilts down to the right, a positive one down to the left, and zero is the bottom.

  - kind: formula
    kicker: Read the formula
    title: Slope is rise over run
    tex: "f'(w) \\approx \\frac{f(w+h) - f(w)}{h}"
    say: Nudge w by a tiny amount h, see how much the loss changes, then divide by the nudge. That ratio is the slope.
    verify:
      - { expr: "(((w+0.001-3)^2+1)-((w-3)^2+1))/0.001", equals: -5, tol: 0.01 }
      - { expr: "slope", equals: -5, tol: 0.01 }
    symbols:
      - { tex: "f(w)", means: "the loss at w, read “f of w”", value: loss }
      - { tex: h, means: a tiny nudge, such as 0.001 }
      - { tex: "f'(w)", means: "the slope, read “f prime of w”", value: slope }
      - { tex: "\\approx", means: "“is about equal to”; exact as h shrinks to zero" }

  - kind: formula
    kicker: Read the formula
    title: The update rule
    tex: "w_{\\text{new}} = w - \\eta\\, f'(w)"
    say: Move w against the slope, because downhill is opposite to uphill. The Greek letter η (eta) is the learning rate, how big a step to take.
    verify:
      - { expr: "next", equals: 1, tol: 0.01 }
      - { expr: "0.5-0.1*(2*(0.5-3))", equals: 1, tol: 0.01 }
    symbols:
      - { tex: w, means: the weight now, value: w }
      - { tex: "\\eta", means: "learning rate, our step size", value: lr }
      - { tex: "f'(w)", means: the slope at w, value: slope }
      - { tex: "w_{\\text{new}}", means: "where the weight lands after one step", value: next }

  - kind: lab
    kicker: Try it
    title: Take steps downhill
    intro: Press the button to apply the rule once. Then change the learning rate and try again.
    view: { type: curve, fn: "(t - 3) ^ 2 + 1", min: -1, max: 7, point: w, slope: slope, xLabel: w, yLabel: loss }
    sliders: [lr]
    action:
      label: Take a step
      set: { w: "w - rate * slope" }
      rate: lr
      track: loss
      hint: Try a rate of 0.1 (smooth), 0.9 (overshoots back and forth) and 1.05 (the loss grows, which is called divergence).
    outro: w is now **{w}** and the loss is **{loss}**.

  - kind: check
    kicker: Check yourself
    title: Which way should w move?
    question: At w = 5 the slope is +4, meaning uphill to the right. Which way does the update rule move w?
    options:
      - { text: "Increase w, since the slope is positive", why: "That climbs the hill and makes the loss bigger." }
      - { text: "Decrease w, because we step against the slope", correct: true, why: "w − η × 4 is smaller than 5, so w moves left, down the hill." }
      - { text: Leave w alone, why: "Only a slope of zero means stop." }

  - kind: story
    kicker: The bigger picture
    title: Millions of weights, one list of slopes
    body:
      - A real model has millions of weights, so there are millions of slopes, one per weight. That list is called the **gradient**, and it is a vector like the ones in the last lesson.
      - The update rule runs on every weight at once. Finding all those slopes cheaply is what **backpropagation** does.
    callout: Backpropagation finds the gradient. Gradient descent uses it.

  - kind: practice
    kicker: Your turn
    title: "One descent step"
    intro: "Write `descend(w, grad, lr)` returning the new value after moving against the gradient. Then write nothing else: that is the whole algorithm. Round to 4 places."
    entry: descend
    starter: |
      def descend(w, grad, lr):
          pass
    solution: |
      def descend(w, grad, lr):
          return round(w - lr * grad, 4)
    tests:
      - { input: "[1.0, 2.0, 0.1]", expected: "0.8" }
      - { input: "[5, -3, 0.5]", expected: "6.5" }
      - { input: "[0, 0, 1]", expected: "0" }
    hint: "Subtract the learning rate times the gradient."

  - kind: mistakes
    kicker: Watch out
    title: Three ways training goes wrong
    items:
      - "**Learning rate too big.** Steps overshoot the valley and the loss bounces or explodes."
      - "**Learning rate too small.** It works but crawls. Training that should take minutes takes days."
      - "**Real loss surfaces are bumpy.** Our curve has one valley. Real ones have many, and descent can settle in a mediocre one. Tricks such as momentum help."
    next: { label: "Next: overfitting and validation", href: /learn/overfitting-and-validation }
