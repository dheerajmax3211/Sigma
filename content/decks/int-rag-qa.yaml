id: int-rag-qa
title: "Interview Q&A: RAG in depth"
minutes: 15
order: 211
params:
  - { id: k, label: "chunks retrieved", min: 1, max: 5, step: 1, init: 3 }
derived:
  - { id: rec, expr: "pick(k - 1, 40, 60, 72, 80, 85)" }
  - { id: ctx, expr: "k * 3" }
cards:
  - kind: story
    kicker: Start here
    title: "A pipeline with many failure points"
    body:
      - "'Walk me through a RAG system and how you would improve it.' Interviewers want to hear that you can **find** which stage is failing."
      - "The stages: split documents into chunks, turn chunks into vectors, store them, retrieve the nearest, put them in a prompt, generate."
    callout: "Most bad RAG answers are retrieval problems, not model problems. Check the retrieved chunks first."

  - kind: lab
    kicker: See it
    title: "The trade-off in how many chunks"
    intro: "Retrieving more chunks finds the answer more often, but fills the prompt and adds noise. The numbers are illustrative. **Drag the chunk count.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "answer found (percent)", value: rec, color: "#1cd6ac" }
        - { label: "prompt size (hundreds of tokens)", value: ctx, color: "#f97316" }
    sliders: [k]
    outro: "At {k} chunks the answer is present about **{rec} percent** of the time, using roughly {ctx} hundred tokens. Gains slow down as k grows."

  - kind: code
    kicker: Write it
    title: "Chunking and similarity"
    intro: "Overlap keeps a sentence from being cut off from its context. Cosine similarity compares direction, not length."
    lang: python
    code: |
      import math

      def chunk(words, size, overlap):
          step = size - overlap
          return [words[i:i + size] for i in range(0, max(1, len(words) - overlap), step)]

      def cosine(a, b):
          dot = sum(x * y for x, y in zip(a, b))
          na = math.sqrt(sum(x * x for x in a))
          nb = math.sqrt(sum(y * y for y in b))
          return dot / (na * nb)

      w = list("abcdefghij")
      c = chunk(w, 4, 1)
      assert c[0] == list("abcd") and c[1] == list("defg")
      assert c[-1][-1] == "j"
      assert abs(cosine([1, 0], [2, 0]) - 1) < 1e-12
      assert abs(cosine([1, 0], [0, 3])) < 1e-12
    note: "Bigger chunks keep context but retrieve less precisely. Smaller chunks are precise but can lose meaning."

  - kind: lab
    kicker: Debug it
    title: "Which stage is failing?"
    intro: "Check the stages in order. Fix the earliest broken one."
    view:
      type: flow
      stages:
        - { label: "Chunking", note: "Is the answer split across chunks?", color: "#38bdf8" }
        - { label: "Retrieval", note: "Is the right chunk in the top k?", color: "#1cd6ac" }
        - { label: "Re-ranking", note: "Is it ranked above the noise?", color: "#f97316" }
        - { label: "Prompt", note: "Does it say to use only the context?", color: "#a78bfa" }
        - { label: "Generation", note: "Did the model follow the context?", color: "#ec4899" }

  - kind: check
    kicker: Your turn
    title: "First thing to check"
    question: "Your RAG bot gives a wrong answer. What do you inspect FIRST?"
    options:
      - { text: "The retrieved chunks for that question", correct: true, why: "If the right text was never retrieved, no prompt or model change will fix it." }
      - { text: "Switch to a bigger model", why: "Expensive and often does not help." }
      - { text: "Fine-tune the model", why: "Far too heavy for a first step." }
      - { text: "Lower the temperature", why: "Might reduce randomness but does not fix missing facts." }

  - kind: check
    kicker: Practice
    title: "Improve retrieval"
    question: "Pure vector search misses exact product codes like 'SKU-4412'. What helps most?"
    options:
      - { text: "Hybrid search: keyword plus vector", correct: true, why: "Keyword search matches exact tokens that embeddings blur." }
      - { text: "Larger chunks only", why: "Does not fix exact matching." }
      - { text: "Remove retrieval", why: "Then there is nothing to ground on." }
      - { text: "Higher temperature", why: "Makes answers less reliable." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Blaming the model first.** Look at retrieval."
      - "**No evaluation set.** Keep 30 real questions with known answers."
      - "**One chunk size for everything.** Tune it per document type."
      - "**No citations.** Return sources so users can verify."
    next: { label: "Next: agents and evaluation", href: /learn/int-agents-and-evals }
