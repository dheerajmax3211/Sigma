id: dsa-bit-manipulation
title: "Bit manipulation"
minutes: 12
order: 128
params:
  - { id: x, label: "number", min: 0, max: 15, step: 1, init: 6 }
derived:
  - { id: b3, expr: "floor(x / 8) - 2 * floor(x / 16)" }
  - { id: b2, expr: "floor(x / 4) - 2 * floor(x / 8)" }
  - { id: b1, expr: "floor(x / 2) - 2 * floor(x / 4)" }
  - { id: b0, expr: "x - 2 * floor(x / 2)" }
  - { id: ones, expr: "b3 + b2 + b1 + b0" }
cards:
  - kind: story
    kicker: Start here
    title: "Numbers as switches"
    body:
      - "Inside the computer every number is a row of **bits**, each 0 or 1. Reading from the right, the places are worth 1, 2, 4, 8 and so on."
      - "Bit tricks are rare, but when they fit they replace loops and extra memory with a single line."
    callout: "Clue words: single number, appears once, power of two, count bits, flip, XOR."

  - kind: lab
    kicker: See it
    title: "Four bits"
    intro: "Each bar is one bit. Place values are 8, 4, 2 and 1. **Drag the number.**"
    view:
      type: bars
      max: 1
      items:
        - { label: "bit worth 8", value: b3, color: "#38bdf8" }
        - { label: "bit worth 4", value: b2, color: "#1cd6ac" }
        - { label: "bit worth 2", value: b1, color: "#f97316" }
        - { label: "bit worth 1", value: b0, color: "#a78bfa" }
    sliders: [x]
    outro: "{x} uses **{ones}** bits set to 1. Counting them is the classic 'count bits' question."

  - kind: code
    kicker: Write it
    title: "The six operators"
    intro: "`&` and, `|` or, `^` xor (differ), `~` not, `<<` shift left (times 2), `>>` shift right (divide by 2)."
    lang: python
    code: |
      assert 6 & 3 == 2          # 110 and 011 = 010
      assert 6 | 3 == 7          # 110 or  011 = 111
      assert 6 ^ 3 == 5          # 110 xor 011 = 101
      assert 1 << 4 == 16
      assert 20 >> 2 == 5
      assert 5 ^ 5 == 0 and 5 ^ 0 == 5      # xor with itself cancels
      assert (6 >> 1) & 1 == 1               # read bit 1 of 6
    note: "`^` is the star. Anything xor itself is 0, and xor is order independent."

  - kind: code
    kicker: Use it
    title: "Single number and counting bits"
    intro: "Every value appears twice except one. XOR everything: pairs cancel and the loner remains. For counting bits, `n & (n - 1)` removes the lowest 1 bit."
    lang: python
    code: |
      def single_number(nums):
          r = 0
          for x in nums:
              r ^= x
          return r

      def count_bits(n):
          c = 0
          while n:
              n &= n - 1          # drop the lowest set bit
              c += 1
          return c

      def is_power_of_two(n):
          return n > 0 and n & (n - 1) == 0

      assert single_number([4, 1, 2, 1, 2]) == 4
      assert count_bits(11) == 3          # 1011
      assert is_power_of_two(16) and not is_power_of_two(18)
      assert not is_power_of_two(0)
    note: "O(n) time and O(1) space for the single number. A set would use O(n) space."

  - kind: code
    kicker: Use it
    title: "Subsets with a mask"
    intro: "A number from 0 to 2^n - 1 is a yes or no for every item. This lists all subsets without recursion."
    lang: python
    code: |
      def subsets_mask(nums):
          n = len(nums)
          return [[nums[i] for i in range(n) if mask >> i & 1] for mask in range(1 << n)]

      r = subsets_mask([1, 2, 3])
      assert len(r) == 8
      assert [1, 3] in r and [] in r
    note: "Handy for small n (up to about 20). Same 2^n cost as backtracking."

  - kind: check
    kicker: Your turn
    title: "Which operator?"
    question: "You want to know if the lowest bit of n is 1, meaning n is odd. Which expression?"
    options:
      - { text: "n & 1", correct: true, why: "Masking with 1 keeps only the last bit." }
      - { text: "n | 1", why: "That always gives an odd number." }
      - { text: "n ^ 1", why: "That flips the bit, not reads it." }
      - { text: "n << 1", why: "That doubles n." }

  - kind: practice
    kicker: Your turn
    title: "Single number"
    intro: "Every number appears twice except one. Write `single(nums)` returning the lonely one using XOR (a number XOR itself is 0)."
    entry: single
    starter: |
      def single(nums):
          pass
    solution: |
      def single(nums):
          r = 0
          for x in nums:
              r ^= x
          return r
    tests:
      - { input: "[[2,2,1]]", expected: "1" }
      - { input: "[[4,1,2,1,2]]", expected: "4" }
      - { input: "[[7]]", expected: "7" }
    hint: "Pairs cancel to zero, so only the lonely number is left."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Precedence.** `n & 1 == 0` parses wrongly. Write `(n & 1) == 0`."
      - "**Negative numbers.** Python integers are unbounded, so `~n` is `-n - 1`. Mask if you need a fixed width."
      - "**Cleverness over clarity.** Use bits only when they make the code simpler."
      - "**Shifting too far.** `1 << 64` is fine in Python but overflows in Java and C."
    next: { label: "Next: solving problems in an interview", href: /learn/dsa-interview-problem-solving-method }
