id: dsa-tries
title: "Tries"
minutes: 12
order: 116
params:
  - { id: s, label: "letters read", min: 0, max: 3, step: 1, init: 0 }
  - { id: w, label: "word length L", min: 1, max: 20, step: 1, init: 8 }
  - { id: m, label: "words m", min: 10, max: 10000, step: 10, init: 5000 }
derived:
  - { id: scan, expr: "m * w" }
cards:
  - kind: story
    kicker: Start here
    title: "A tree of letters"
    body:
      - "A **trie** (say 'try') stores words one letter at a time along a path. Words that share a start share the same nodes, like 'car' and 'cat' sharing 'ca'."
      - "That makes it perfect for questions about **prefixes**: is there any word starting with 'ca'? Autocomplete is built on this."
    callout: "Clue words: prefix, autocomplete, dictionary, word search, starts with."

  - kind: lab
    kicker: See it
    title: "Walk the path for car"
    intro: "The trie holds cat, car and dog. Reading a word means following one edge per letter. **Drag the letters read.**"
    view:
      type: graph
      directed: true
      nodes:
        - { id: root, x: 50, y: 10 }
        - { id: c, x: 25, y: 35 }
        - { id: a, x: 25, y: 58 }
        - { id: t, x: 12, y: 85 }
        - { id: r, x: 38, y: 85 }
        - { id: d, x: 75, y: 35 }
        - { id: o, x: 75, y: 58 }
        - { id: g, x: 75, y: 85 }
      edges:
        - { a: root, b: c, w: c }
        - { a: c, b: a, w: a }
        - { a: a, b: t, w: t }
        - { a: a, b: r, w: r }
        - { a: root, b: d, w: d }
        - { a: d, b: o, w: o }
        - { a: o, b: g, w: g }
      order:
        - { node: root }
        - { node: c, from: root }
        - { node: a, from: c }
        - { node: r, from: a }
      step: "s + 1"
    sliders: [s]
    says:
      - "Start at the root. Read **c**: follow the edge labelled c."
      - "Read **a**: follow the edge labelled a. We are on the shared prefix 'ca'."
      - "Read **r**: follow r. If the node marks a word end, 'car' exists."
      - "Done in 3 steps, regardless of how many words the trie holds."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Insert, search, prefix"
    intro: "Each node is a dict from letter to child, plus a flag for 'a word ends here'."
    lang: python
    code: |
      class Trie:
          def __init__(self):
              self.kids = {}
              self.end = False

          def insert(self, word):
              node = self
              for ch in word:
                  node = node.kids.setdefault(ch, Trie())
              node.end = True

          def _walk(self, s):
              node = self
              for ch in s:
                  node = node.kids.get(ch)
                  if node is None:
                      return None
              return node

          def search(self, word):
              n = self._walk(word)
              return n is not None and n.end

          def starts_with(self, prefix):
              return self._walk(prefix) is not None

      t = Trie()
      for w in ["cat", "car", "dog"]:
          t.insert(w)
      assert t.search("car") and not t.search("ca")
      assert t.starts_with("ca") and not t.starts_with("cb")
    note: "Each operation is O(L) for a word of length L, no matter how many words are stored."

  - kind: lab
    kicker: What it saves
    title: "Trie vs scanning every word"
    intro: "To find words starting with a prefix by scanning, you compare against all m words. **Drag m.**"
    view:
      type: bars
      max: 200000
      items:
        - { label: "scan all words (about m times L)", value: scan, color: "#ef4444" }
        - { label: "trie: follow L letters", value: w, color: "#1cd6ac" }
    sliders: [m, w]
    outro: "With {m} words of length {w}, scanning checks about {scan} letters. The trie checks **{w}**."

  - kind: check
    kicker: Your turn
    title: "Why the end flag?"
    question: "The trie holds only 'car'. Why must each node have an `end` flag?"
    options:
      - { text: "To tell the word 'ca' apart from the prefix 'ca'", correct: true, why: "'ca' is a path in the trie but not a stored word." }
      - { text: "To sort the letters", why: "Order comes from the dict." }
      - { text: "To count words", why: "A separate counter would do that." }
      - { text: "It is not needed", why: "Without it search('ca') wrongly says yes." }

  - kind: code
    kicker: Autocomplete
    title: "List every word with a prefix"
    intro: "Walk to the prefix node, then do a depth first search below it, collecting words as you pass end flags."
    lang: python
    code: |
      class Trie:
          def __init__(self):
              self.kids, self.end = {}, False

      def insert(root, word):
          node = root
          for ch in word:
              node = node.kids.setdefault(ch, Trie())
          node.end = True

      def complete(root, prefix):
          node = root
          for ch in prefix:
              node = node.kids.get(ch)
              if not node:
                  return []
          out = []
          def dfs(n, path):
              if n.end:
                  out.append(path)
              for ch in sorted(n.kids):
                  dfs(n.kids[ch], path + ch)
          dfs(node, prefix)
          return out

      r = Trie()
      for w in ["car", "card", "care", "cat", "dog"]:
          insert(r, w)
      assert complete(r, "car") == ["car", "card", "care"]
      assert complete(r, "x") == []
    note: "Cost is O(L + size of the answer)."

  - kind: check
    kicker: Practice
    title: "Trie or hash set?"
    question: "You only ever ask 'is this exact word in the list?'. Which is the simpler choice?"
    options:
      - { text: "A hash set", correct: true, why: "Exact lookups are O(L) and far simpler. Use a trie when you need prefixes." }
      - { text: "A trie", why: "Works, but more code for no benefit." }
      - { text: "A heap", why: "Not for lookups." }
      - { text: "A stack", why: "Not for lookups." }

  - kind: practice
    kicker: Your turn
    title: "Common prefix"
    intro: "A trie stores shared prefixes once. Write `common_prefix(words)` returning the longest prefix every word shares (empty string if none)."
    entry: common_prefix
    starter: |
      def common_prefix(words):
          pass
    solution: |
      def common_prefix(words):
          p = words[0]
          for w in words[1:]:
              while not w.startswith(p):
                  p = p[:-1]
          return p
    tests:
      - { input: "[[\"flower\",\"flow\",\"flight\"]]", expected: "\"fl\"" }
      - { input: "[[\"dog\",\"car\"]]", expected: "\"\"" }
      - { input: "[[\"abc\"]]", expected: "\"abc\"" }
    hint: "Shrink the prefix until the next word starts with it."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Skipping the end flag.** Prefixes would be reported as words."
      - "**Memory.** Every node holds a dict. Huge alphabets and many words use a lot."
      - "**Crashing on a missing letter.** Use `.get` and check for None."
      - "**Using a trie for exact matches only.** A set is simpler."
    next: { label: "Next: graph basics", href: /learn/dsa-graph-basics }
