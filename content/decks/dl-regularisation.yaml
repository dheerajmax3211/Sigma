id: dl-regularisation
title: "Regularisation: dropout and weight decay"
minutes: 13
order: 404
params:
  - { id: p, label: "dropout rate", min: 0, max: 0.9, step: 0.05, init: 0.5 }
derived:
  - { id: keep, expr: "100 * (1 - p)" }
  - { id: scale, expr: "1 / (1 - p)" }
cards:
  - kind: story
    kicker: Start here
    title: "Stopping memorisation"
    body:
      - "A big network can memorise its training set. **Regularisation** makes that harder, so it has to learn patterns that also hold on new data."
      - "**Dropout** switches off random neurons during training. **Weight decay** gently pulls every weight toward zero. **Early stopping** ends training when held-out loss stops improving."
    callout: "You can tell you need it when train loss falls but validation loss rises."

  - kind: lab
    kicker: See it
    title: "Dropout"
    intro: "During training each neuron is dropped with probability p. The survivors are scaled up so the total signal stays the same. **Drag the rate.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "neurons kept (percent)", value: keep, color: "#1cd6ac" }
        - { label: "scale applied to survivors (times 10)", value: "scale * 10", color: "#f97316" }
    sliders: [p]
    outro: "At rate {p}, about **{keep} percent** survive and each is multiplied by **{scale}**. At test time dropout is off."

  - kind: code
    kicker: Write it
    title: "Dropout and an L2 penalty"
    intro: "The mask is passed in so the result is repeatable. The L2 penalty adds the squared weights to the loss."
    lang: python
    code: |
      def dropout(xs, mask, p):
          return [x * m / (1 - p) for x, m in zip(xs, mask)]

      def l2_penalty(ws, lam):
          return lam * sum(w * w for w in ws)

      assert dropout([2, 4], [1, 0], 0.5) == [4.0, 0.0]
      # on average the output equals the input
      masks = [[1, 1], [1, 0], [0, 1], [0, 0]]
      outs = [dropout([2, 4], m, 0.5) for m in masks]
      assert [sum(o[i] for o in outs) / 4 for i in range(2)] == [2.0, 4.0]
      assert l2_penalty([3, 4], 0.1) == 2.5
    note: "Dividing by one minus p is why you do not need to rescale at test time."

  - kind: lab
    kicker: Compare
    title: "Tools for the same problem"
    intro: "Most projects use a mix."
    view:
      type: flow
      stages:
        - { label: "More data", note: "Best cure. Augmentation counts.", color: "#38bdf8" }
        - { label: "Weight decay", note: "Small, always on. Typical 0.01 to 0.1.", color: "#1cd6ac" }
        - { label: "Dropout", note: "Common 0.1 to 0.5 in big dense layers.", color: "#f97316" }
        - { label: "Early stopping", note: "Free. Watch validation loss.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "At test time"
    question: "What should dropout do when you evaluate the model?"
    options:
      - { text: "Be turned off, using all neurons", correct: true, why: "You want the full, stable network. Call `model.eval()`." }
      - { text: "Stay on", why: "Predictions would be noisy." }
      - { text: "Double the rate", why: "No." }
      - { text: "Drop the biggest weights", why: "No." }

  - kind: check
    kicker: Practice
    title: "Read the curves"
    question: "Training loss keeps falling but validation loss starts rising at epoch 12. What now?"
    options:
      - { text: "Stop near epoch 12 or add regularisation", correct: true, why: "The model has started to memorise." }
      - { text: "Train longer", why: "That makes overfitting worse." }
      - { text: "Remove validation data", why: "You would be blind." }
      - { text: "Raise the learning rate", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting `eval()`.** Dropout stays on and results wobble."
      - "**Too much dropout.** The model underfits."
      - "**Tuning on the test set.** Use validation data for decisions."
    next: { label: "Next: batch normalisation", href: /learn/dl-batchnorm }
