id: pytest-and-ci
title: "Tests and continuous integration"
order: 10
minutes: 18
params:
  - { id: runs, label: "code changes a day", min: 1, max: 20, step: 1, init: 6 }
  - { id: mins, label: "minutes to check by hand", min: 1, max: 30, step: 1, init: 10 }
derived:
  - { id: hours, expr: "runs * mins * 5 / 60" }
cards:
  - kind: story
    kicker: Lesson
    title: "Let a machine check"
    body:
      - "You change code many times a day. Checking by hand each time is slow and you forget steps."
      - "A **test** is a small function that says pass or fail. **Continuous integration** runs all tests for you on every push, so a broken change is caught before anyone else sees it."

  - kind: lab
    kicker: See it first
    title: "Hours you get back"
    intro: "Checking by hand costs minutes every change. **Drag the sliders** to see the weekly cost."
    view:
      type: bars
      max: 50
      items:
        - { label: "hours a week checking by hand", value: hours, color: "#ef4444" }
        - { label: "hours a week with CI", value: "0", color: "#1cd6ac" }
    sliders: [runs, mins]
    outro: "{runs} changes at {mins} minutes each is **{hours} hours** a week. A test run costs seconds and nobody has to remember it."

  - kind: code
    kicker: In code
    title: "A test with pytest"
    intro: "A pytest test is a function whose name starts with `test`. A plain `assert` is the check."
    lang: python
    code: |
      def slugify(t):
          return t.lower().strip().replace(' ', '-')

      def test_slugify():
          assert slugify('Hello World') == 'hello-world'

      test_slugify()
      print('passed')
    note: "Run `pytest` in the project folder and it finds every `test_` function."

  - kind: practice
    kicker: Your turn
    title: "Make the slug"
    intro: "Write `slugify(t)`: lowercase the text, trim spaces at the ends, and replace each inner space with a dash."
    entry: slugify
    starter: |
      def slugify(t):
          pass
    solution: |
      def slugify(t):
          return t.strip().lower().replace(' ', '-')
    tests:
      - { input: "[\"Hello World\"]", expected: "\"hello-world\"" }
      - { input: "[\"  Many   Words\"]", expected: "\"many---words\"" }
      - { input: "[\"one\"]", expected: "\"one\"" }
    hint: "Strip, lower, then replace."

  - kind: practice
    kicker: Your turn
    title: "What failed"
    intro: "A runner compares expected with actual. Write `failing(cases)` where each case is `[expected, actual]`. Return the indices of cases that do not match."
    entry: failing
    starter: |
      def failing(cases):
          pass
    solution: |
      def failing(cases):
          return [i for i, (e, a) in enumerate(cases) if e != a]
    tests:
      - { input: "[[[1, 1], [2, 3], [\"a\", \"a\"]]]", expected: "[1]" }
      - { input: "[[]]", expected: "[]" }
      - { input: "[[[1, 2], [1, 2]]]", expected: "[0, 1]" }
    hint: "Compare the two values in each case."

  - kind: check
    kicker: Check yourself
    title: "What to test"
    question: "You have little time. Which test is worth writing first?"
    options:
      - { text: "The function that handles money or user input", correct: true, why: "A bug there costs the most and is easy to hit." }
      - { text: "A getter that returns a field", why: "It almost cannot break." }
      - { text: "Everything equally", why: "You will run out of time on low-value tests." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Tests that need the network.** They fail at random. Use fixed data."
      - "**Not running tests before merge.** CI only helps if a red build blocks the merge."
      - "**Testing the framework.** Test your own logic."
    next: { label: "Back to all lessons", href: "/learn" }
