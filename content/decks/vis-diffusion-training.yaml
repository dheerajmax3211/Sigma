id: "vis-diffusion-training"
title: "Diffusion: learning to predict the noise"
minutes: 14
order: 907
params:
  - { id: "e", label: "error in the predicted noise", min: 0, max: 2, step: 0.1, init: 0.5 }
derived:
  - { id: "loss", expr: "e ^ 2" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A plain regression problem"
    body:
      - "Training a diffusion model is surprisingly ordinary. Make a noisy image, ask the network which noise was added, and score it with **mean squared error** against the true noise."
      - "Repeat over millions of images at random noise levels. To generate, start from pure noise and use the network again and again to remove a bit of noise."
    callout: "One simple loss, trained at every noise level."
  - kind: "lab"
    kicker: "See it"
    title: "The loss"
    intro: "A perfect guess scores zero. Predicting no noise at all scores the noise size squared, which is 1 for unit noise. **Drag the error.**"
    view:
      type: "bars"
      max: 4
      items:
        - { label: "training loss for this error", value: "loss", color: "#f97316" }
        - { label: "loss for always predicting zero", value: "1", color: "#ef4444" }
    sliders:
      - "e"
    outro: "An error of {e} costs **{loss}**. A network that has learned anything beats the zero guess of 1."
  - kind: "code"
    kicker: "Write it"
    title: "One training example, one sample"
    intro: "A toy world where every image is the number 2."
    lang: "python"
    code: |
      import math

      DATA = 2.0

      def make(ab, eps):
          return math.sqrt(ab) * DATA + math.sqrt(1 - ab) * eps

      def perfect_net(xt, ab):                       # what a trained network approximates
          return (xt - math.sqrt(ab) * DATA) / math.sqrt(1 - ab)

      def lazy_net(xt, ab):
          return 0.0

      ab, eps = 0.25, 1.0
      xt = make(ab, eps)
      mse = lambda net: (net(xt, ab) - eps) ** 2

      assert mse(perfect_net) < 1e-12
      assert mse(lazy_net) == 1.0

      # sampling: one denoising jump back to clean data
      x0_hat = (xt - math.sqrt(1 - ab) * perfect_net(xt, ab)) / math.sqrt(ab)
      assert abs(x0_hat - DATA) < 1e-12
    note: "Real networks are a U-Net or a transformer, and the data is far more complicated than one number."
  - kind: "lab"
    kicker: "Memorise"
    title: "Sampling"
    intro: "Make a picture from nothing."
    view:
      type: "flow"
      stages:
        - { label: "Start", note: "Pure random noise.", color: "#ef4444" }
        - { label: "Predict", note: "The network says which noise is present.", color: "#38bdf8" }
        - { label: "Remove a bit", note: "Step toward a cleaner image.", color: "#1cd6ac" }
        - { label: "Repeat", note: "Many steps until clean.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Target"
    question: "What does the network predict during training?"
    options:
      - { text: "The noise that was added", correct: true, why: "Scored by squared error." }
      - { text: "The class label", why: "No." }
      - { text: "The next word", why: "No." }
      - { text: "The image size", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Why many steps"
    question: "Why does sampling take many small steps?"
    options:
      - { text: "Each step only removes a little noise accurately", correct: true, why: "One giant step would be blurry." }
      - { text: "The GPU is slow", why: "No." }
      - { text: "It uses a curse", why: "No." }
      - { text: "To add more noise", why: "It removes noise." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Training at only a few noise levels.** Sample all of them."
      - "**Ignoring the U-Net's time input.** The network must know the step."
      - "**Expecting one pass to give a sharp image.**"
    next: { label: "Next: faster sampling with DDIM", href: "/learn/vis-ddim-fast-sampling" }
