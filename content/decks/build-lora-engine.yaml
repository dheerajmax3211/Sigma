id: build-lora-engine
title: "Build a LoRA engine"
order: 1203
minutes: 25
params:
  - { id: d, label: "layer width", min: 512, max: 4096, step: 512, init: 4096 }
  - { id: r, label: "adapter rank", min: 1, max: 64, step: 1, init: 8 }
derived:
  - { id: pct, expr: "200 * r / d" }
cards:
  - kind: story
    kicker: Guided build
    title: "Train one percent"
    body:
      - "Fine tuning a big model updates billions of weights. LoRA freezes them and learns two thin matrices beside each layer instead."
      - "You will build the **parameter count**, the **forward pass with the adapter branch**, and the **merge** that folds the adapter back so inference costs nothing extra."

  - kind: lab
    kicker: See it first
    title: "How little you train"
    intro: "A weight of width d needs d times d numbers to tune fully. The adapter needs only 2 times d times r. **Drag the sliders.**"
    view:
      type: bars
      max: 30
      items:
        - { label: "percent of the layer trained", value: pct, color: "#1cd6ac" }
        - { label: "a one percent budget", value: "1", color: "#64748b" }
    sliders: [d, r]
    outro: "Rank {r} on width {d} trains **{pct}** percent of that layer. Small ranks are enough surprisingly often."

  - kind: code
    kicker: Starter code
    title: "Two thin matrices"
    intro: "`A` squeezes the input down to r numbers and `B` expands it back. Their product has the full size but only rank r."
    lang: python
    code: |
      def matvec(M, v):
          return [sum(a * b for a, b in zip(row, v)) for row in M]

      A = [[1, 1]]
      B = [[1], [0]]
      assert matvec(B, matvec(A, [1, 2])) == [3, 0]
      print('adapter ok')
    note: "`B` starts at zero in real training, so the model begins unchanged."

  - kind: practice
    kicker: Build step
    title: "Count the adapter"
    intro: "Write `lora_params(d_in, d_out, r)` returning the number of numbers in both matrices."
    entry: lora_params
    starter: |
      def lora_params(d_in, d_out, r):
          pass
    solution: |
      def lora_params(d_in, d_out, r):
          return r * (d_in + d_out)
    tests:
      - { input: "[4096, 4096, 8]", expected: "65536" }
      - { input: "[10, 20, 2]", expected: "60" }
      - { input: "[512, 512, 1]", expected: "1024" }
    hint: "A is r by d_in and B is d_out by r."

  - kind: practice
    kicker: Build step
    title: "Forward with the branch"
    intro: "Write `lora_forward(W, A, B, x, alpha, r)` returning `W x + (alpha / r) * B (A x)`. Matrices are lists of rows. Round to 4 places."
    entry: lora_forward
    starter: |
      def lora_forward(W, A, B, x, alpha, r):
          pass
    solution: |
      def lora_forward(W, A, B, x, alpha, r):
          mv = lambda M, v: [sum(a * b for a, b in zip(row, v)) for row in M]
          base = mv(W, x)
          add = mv(B, mv(A, x))
          return [round(b + alpha / r * a, 4) for b, a in zip(base, add)]
    tests:
      - { input: "[[[1, 0], [0, 1]], [[1, 1]], [[1], [0]], [1, 2], 2, 1]", expected: "[7.0, 2.0]" }
      - { input: "[[[2, 0], [0, 2]], [[1, 0]], [[0], [1]], [3, 4], 4, 2]", expected: "[6.0, 14.0]" }
    hint: "Run the adapter on the input, scale it, and add it to the frozen layer output."

  - kind: practice
    kicker: Build step
    title: "Merge the adapter"
    intro: "Write `merge(W, A, B, alpha, r)` returning a single matrix `W + (alpha / r) * B A`. Using it must give the same answer as the branch. Round to 4 places."
    entry: merge
    starter: |
      def merge(W, A, B, alpha, r):
          pass
    solution: |
      def merge(W, A, B, alpha, r):
          s = alpha / r
          return [[round(W[i][j] + s * sum(B[i][k] * A[k][j] for k in range(len(A))), 4) for j in range(len(W[0]))] for i in range(len(W))]
    tests:
      - { input: "[[[1, 0], [0, 1]], [[1, 1]], [[1], [0]], 2, 1]", expected: "[[3.0, 2.0], [0.0, 1.0]]" }
      - { input: "[[[2, 0], [0, 2]], [[1, 0]], [[0], [1]], 4, 2]", expected: "[[2.0, 0.0], [2.0, 2.0]]" }
    hint: "B times A has the same shape as W, so add them cell by cell."

  - kind: check
    kicker: Check yourself
    title: "Why merge"
    question: "Why merge the adapter before serving?"
    options:
      - { text: "It removes the extra branch, so speed matches the base model", correct: true, why: "After the merge there is one matrix again." }
      - { text: "It makes the adapter train faster", why: "Merging happens after training." }
      - { text: "It changes the answers", why: "A correct merge gives identical outputs." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Forgetting the scale.** Alpha divided by r must match in training and merge."
      - "**Merging into a quantized weight.** Merge in full precision first."
      - "**Rank too high.** You lose the saving and may overfit."
    next: { label: "Next build", href: "/learn/build-mini-transformer" }
