id: "fd-reproducibility"
title: "Randomness and reproducibility"
minutes: 12
order: 711
params:
  - { id: "n", label: "runs with different seeds", min: 1, max: 30, step: 1, init: 5 }
derived:
  - { id: "se", expr: "2 / sqrt(n)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Two runs, two answers"
    body:
      - "Random starting weights, shuffled data and dropout all use random numbers. Run the same code twice and you can get different scores."
      - "A **seed** fixes the random stream, so a run can be repeated. But one lucky seed can fool you. To compare two models fairly you need several seeds."
    callout: "Report a mean and a spread, not your best run."
  - kind: "lab"
    kicker: "See it"
    title: "How many runs do you need"
    intro: "Say accuracy varies by about 2 points between seeds. The uncertainty of the average shrinks slowly. **Drag the number of runs.**"
    view:
      type: "bars"
      max: 5
      items:
        - { label: "uncertainty of the average (points)", value: "se", color: "#f97316" }
        - { label: "a difference you hope to detect (points)", value: "1", color: "#1cd6ac" }
    sliders:
      - "n"
    outro: "With {n} runs the average is uncertain by about **{se}** points. If that is bigger than your improvement, the result is noise."
  - kind: "code"
    kicker: "Write it"
    title: "Seeding"
    intro: "The same seed gives the same numbers."
    lang: "python"
    code: |
      import random

      def sample(seed, n=3):
          r = random.Random(seed)
          return [r.random() for _ in range(n)]

      assert sample(0) == sample(0)
      assert sample(0) != sample(1)

      def split(rows, seed, frac=0.8):
          r = random.Random(seed)
          idx = list(range(len(rows)))
          r.shuffle(idx)
          cut = int(len(rows) * frac)
          return sorted(idx[:cut]), sorted(idx[cut:])

      a = split(list(range(10)), 7)
      assert a == split(list(range(10)), 7)
      assert len(a[0]) == 8 and len(a[1]) == 2
    note: "Frameworks also need their own seeds, and GPUs have non-deterministic operations."
  - kind: "lab"
    kicker: "Memorise"
    title: "Reproducibility checklist"
    intro: "Write these down for every experiment."
    view:
      type: "flow"
      stages:
        - { label: "Seeds", note: "For data split, init and shuffling.", color: "#38bdf8" }
        - { label: "Versions", note: "Code commit and library versions.", color: "#1cd6ac" }
        - { label: "Data", note: "A fixed snapshot with a hash.", color: "#f97316" }
        - { label: "Config", note: "Every setting in one saved file.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "One lucky run"
    question: "Model B beats model A by 0.3 points on one seed. What do you conclude?"
    options:
      - { text: "Not enough evidence. Run several seeds", correct: true, why: "Seed noise can be larger than 0.3." }
      - { text: "B is better", why: "One run proves little." }
      - { text: "A is better", why: "No." }
      - { text: "Both are identical", why: "Unknown." }
  - kind: "check"
    kicker: "Practice"
    title: "Split"
    question: "Why fix the seed of the train and test split?"
    options:
      - { text: "So every experiment is judged on the same rows", correct: true, why: "Otherwise scores are not comparable." }
      - { text: "To hide the test set", why: "No." }
      - { text: "To make training faster", why: "No." }
      - { text: "It changes accuracy", why: "It controls comparability." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Picking the best seed.** That is cheating on your test."
      - "**Seeding only one library.** Seed them all."
      - "**Not recording versions.** Results become unrepeatable."
    next: { label: "Next: reading papers", href: "/learn/fd-reading-papers" }
