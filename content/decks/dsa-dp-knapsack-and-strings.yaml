id: dsa-dp-knapsack-and-strings
title: "Knapsack and string DP"
minutes: 15
order: 127
params:
  - { id: cap, label: "capacity", min: 0, max: 8, step: 1, init: 5 }
derived:
  - { id: best, expr: "pick(cap, 0, 0, 3, 4, 7, 7, 10, 11, 11)" }
cards:
  - kind: story
    kicker: Start here
    title: "A bag with a limit"
    body:
      - "**Knapsack**: each item has a weight and a value. The bag holds a limited weight. Choose items to get the most value. Each item is taken **at most once**."
      - "The state is: best value using the first i items with capacity c. For each item you choose: skip it, or take it and lose its weight."
    callout: "Clue words: subset sum, partition equal, target sum, pick items within a budget."

  - kind: lab
    kicker: See it
    title: "Items: weight 2 value 3, weight 3 value 4, weight 4 value 7"
    intro: "This shows the best value for each capacity. **Drag the capacity.**"
    view:
      type: bars
      max: 12
      items:
        - { label: "capacity", value: cap, color: "#38bdf8" }
        - { label: "best value", value: best, color: "#1cd6ac" }
    sliders: [cap]
    says:
      - "Capacity 0: nothing fits."
      - "Capacity 1: nothing fits (the lightest weighs 2)."
      - "Capacity 2: take the first item, value 3."
      - "Capacity 3: take the second item, value 4."
      - "Capacity 4: take the third item, value 7."
      - "Capacity 5: first plus second (weight 5), value 7. Ties the third item alone."
      - "Capacity 6: first plus third (weight 6), value 10."
      - "Capacity 7: second plus third (weight 7), value 11."
      - "Capacity 8: still 11. Taking all three needs weight 9."
    saysAt: cap

  - kind: code
    kicker: Write it
    title: "0/1 knapsack in one row"
    intro: "Loop capacity **downwards** so each item is used once. Looping upwards would reuse the same item many times."
    lang: python
    code: |
      def knapsack(weights, values, cap):
          dp = [0] * (cap + 1)
          for w, v in zip(weights, values):
              for c in range(cap, w - 1, -1):      # downwards
                  dp[c] = max(dp[c], dp[c - w] + v)
          return dp[cap]

      assert knapsack([2, 3, 4], [3, 4, 7], 5) == 7
      assert knapsack([2, 3, 4], [3, 4, 7], 7) == 11
      assert knapsack([2, 3, 4], [3, 4, 7], 1) == 0
    note: "O(items times capacity). The 1D trick works because each row only reads the previous row."

  - kind: code
    kicker: Use it
    title: "Partition equal subset sum"
    intro: "Can you split numbers into two groups with the same sum? That is: can some subset add up to **half the total**? A set of reachable sums."
    lang: python
    code: |
      def can_partition(nums):
          total = sum(nums)
          if total % 2:
              return False
          half = total // 2
          reach = {0}
          for x in nums:
              reach |= {r + x for r in reach if r + x <= half}
          return half in reach

      assert can_partition([1, 5, 11, 5])
      assert not can_partition([1, 2, 3, 5])
      assert can_partition([])
    note: "A set of reachable sums is the same DP as a boolean table, with less index work."

  - kind: code
    kicker: Use it
    title: "Word break and longest increasing subsequence"
    intro: "String and sequence DP often asks: can the first i letters be built? Or: what is the best sequence ending here?"
    lang: python
    code: |
      def word_break(s, words):
          words = set(words)
          ok = [True] + [False] * len(s)
          for i in range(1, len(s) + 1):
              ok[i] = any(ok[j] and s[j:i] in words for j in range(i))
          return ok[-1]

      def lis(nums):
          best = [1] * len(nums)             # best[i]: longest ending at i
          for i in range(len(nums)):
              for j in range(i):
                  if nums[j] < nums[i]:
                      best[i] = max(best[i], best[j] + 1)
          return max(best, default=0)

      assert word_break("leetcode", ["leet", "code"])
      assert not word_break("catsandog", ["cats", "dog", "sand", "and", "cat"])
      assert lis([10, 9, 2, 5, 3, 7, 101, 18]) == 4
      assert lis([]) == 0
    note: "Both are O(n squared) here. LIS has an O(n log n) version with binary search."

  - kind: check
    kicker: Your turn
    title: "Which loop direction?"
    question: "In 0/1 knapsack with one row, why must the capacity loop run from high to low?"
    options:
      - { text: "So an item is not counted twice", correct: true, why: "Going down means dp[c - w] still holds the value from before this item." }
      - { text: "It is faster", why: "Speed is the same." }
      - { text: "To sort the items", why: "Not a sorting concern." }
      - { text: "Python needs it", why: "It is about correctness only." }

  - kind: check
    kicker: Practice
    title: "Recognise the pattern"
    question: "'Is there a subset of these numbers that adds up to exactly T?' Which pattern is it?"
    options:
      - { text: "Knapsack style subset sum", correct: true, why: "Each number is taken or skipped and the total is the capacity." }
      - { text: "Sliding window", why: "Subsets are not contiguous." }
      - { text: "Binary search on a sorted list", why: "Nothing is sorted or monotone here." }
      - { text: "Union-find", why: "No groups to merge." }

  - kind: practice
    kicker: Your turn
    title: "Coin change"
    intro: "Write `fewest_coins(coins, amount)` returning the fewest coins that sum to amount, or -1. Build the best answer for every amount from 0 up."
    entry: fewest_coins
    starter: |
      def fewest_coins(coins, amount):
          pass
    solution: |
      def fewest_coins(coins, amount):
          best = [0] + [amount + 1] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a:
                      best[a] = min(best[a], best[a - c] + 1)
          return best[amount] if best[amount] <= amount else -1
    tests:
      - { input: "[[1,2,5],11]", expected: "3" }
      - { input: "[[2],3]", expected: "-1" }
      - { input: "[[1],0]", expected: "0" }
    hint: "best[a] = 1 + the smallest best[a - coin] over all coins."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Looping upwards in 0/1.** That quietly turns it into unlimited reuse."
      - "**Mixing up problem types.** Unlimited items loop upwards, coin change style."
      - "**Skipping the odd-total check.** Partition needs an even sum first."
      - "**Slicing in loops.** `s[j:i]` copies. Fine for interviews, slow for huge strings."
    next: { label: "Next: bit manipulation", href: /learn/dsa-bit-manipulation }
