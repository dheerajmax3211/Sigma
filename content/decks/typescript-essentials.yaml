id: typescript-essentials
title: TypeScript essentials
order: 28
minutes: 9
params:
  - { id: bugs, label: "mistakes you write", min: 1, max: 20, step: 1, init: 10 }
  - { id: share, label: "share types can catch (%)", min: 0, max: 100, step: 10, init: 60 }
derived:
  - { id: caught, expr: "bugs * share / 100" }
  - { id: escaped, expr: "bugs - caught" }
cards:
  - kind: story
    kicker: Start here
    title: A label on every box
    body:
      - "JavaScript lets you pass anything anywhere, and finds the mistake only when the code runs. **TypeScript** adds a **type** to each value, such as number or text."
      - "Then an editor can warn you **before** you run anything. The types vanish when the code ships."
    callout: "Types are labels checked while you type."

  - kind: code
    kicker: Read it
    title: Describe the shape of data
    intro: "An **interface** names the fields an object must have. A `?` makes a field optional. A function's parameter and return types are written after a colon."
    lang: typescript
    code: |
      interface User {
        id: number;
        name: string;
        email?: string;        // ? means optional
      }

      function greet(u: User): string {
        return "Hi " + u.name;
      }

      greet({ id: 1, name: "Asha" });   // fine
      greet({ id: 2 });                 // error: name is missing
    note: "The error shows in your editor at once, not when a user hits the bug."

  - kind: lab
    kicker: See it first
    title: Catch mistakes early
    intro: "Illustrative numbers. Every mistake is either caught by the compiler while you type or reaches a user. **Drag how many types can catch.**"
    view:
      type: bars
      max: 20
      items:
        - { label: "caught while typing", value: caught, color: "#1cd6ac" }
        - { label: "reach users", value: escaped, color: "#ef4444" }
    sliders: [bugs, share]
    outro: "Of {bugs} mistakes, **{caught}** are caught before running and **{escaped}** are left for testing."

  - kind: code
    kicker: Read it
    title: Unions model real cases
    intro: "A **union** says a value is one of several shapes. Check one field and TypeScript **narrows** the type for you."
    lang: typescript
    code: |
      type Result =
        | { ok: true; data: string[] }
        | { ok: false; error: string };

      function show(r: Result) {
        if (r.ok) {
          console.log(r.data.length);   // data exists here
        } else {
          console.log(r.error);         // error exists here
        }
      }
    note: "Inside each branch the compiler knows exactly which fields you have."

  - kind: check
    kicker: Check yourself
    title: Spot the error
    question: "Given the User interface, which call is a type error?"
    options:
      - { text: "greet({ id: 3, name: 7 })", correct: true, why: "name must be a string, and 7 is a number." }
      - { text: "greet({ id: 3, name: \"Lee\" })", why: "This matches the shape, so the compiler accepts it." }
      - { text: "greet({ id: 3, name: \"Lee\", email: \"l@x.io\" })", why: "email is optional, so including it is allowed." }

  - kind: check
    kicker: Check yourself
    title: When do types run
    question: "A TypeScript type says a value is a number, but a server actually sends the text \"5\". What happens at runtime?"
    options:
      - { text: "The type does not stop it, because types are erased", correct: true, why: "Types are checked only while you write code. Data from outside needs a runtime check." }
      - { text: "TypeScript converts it to a number", why: "TypeScript never changes values. It only checks your code." }
      - { text: "The program refuses to start", why: "Types vanish before the code runs, so nothing checks them then." }

  - kind: practice
    kicker: Your turn
    title: "Narrow a value"
    intro: "TypeScript checks a value's kind before you use it. Write `kind(v)` returning one of `string`, `number`, `boolean`, `null`, `array` or `object` for a JSON value. Check booleans before numbers."
    entry: kind
    starter: |
      def kind(v):
          pass
    solution: |
      def kind(v):
          if v is None:
              return 'null'
          if isinstance(v, bool):
              return 'boolean'
          if isinstance(v, (int, float)):
              return 'number'
          if isinstance(v, str):
              return 'string'
          return 'array' if isinstance(v, list) else 'object'
    tests:
      - { input: "[\"hi\"]", expected: "\"string\"" }
      - { input: "[3]", expected: "\"number\"" }
      - { input: "[true]", expected: "\"boolean\"" }
      - { input: "[null]", expected: "\"null\"" }
      - { input: "[[1]]", expected: "\"array\"" }
      - { input: "[{\"a\": 1}]", expected: "\"object\"" }
    hint: "In Python a bool is also a number, so test for bool first."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Using any everywhere.** It switches the checks off, so you lose the point of TypeScript."
      - "**Trusting types for outside data.** API replies and user input need validation, because types are erased at runtime."
      - "**Forcing types with as.** It silences the compiler without making the code correct."
    next: { label: "Next: a RAG pipeline", href: /learn/rag-pipeline }
