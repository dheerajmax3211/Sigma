id: int-sd-framework
title: "System design: a framework for 45 minutes"
minutes: 14
order: 213
params:
  - { id: a, label: "requirements", min: 2, max: 20, step: 1, init: 5 }
  - { id: b, label: "high level", min: 2, max: 20, step: 1, init: 10 }
  - { id: c, label: "deep dive", min: 2, max: 25, step: 1, init: 15 }
derived:
  - { id: d, expr: "max(0, 45 - a - b - c)" }
cards:
  - kind: story
    kicker: Start here
    title: "A blank whiteboard and 45 minutes"
    body:
      - "'Design a URL shortener' or 'design a chat app'. The question is vague on purpose. They want to see **how you think**, not a memorised answer."
      - "People fail by diving into details at minute two, or by drawing boxes without ever asking what the system must do."
    callout: "Use the same four steps every time. A fixed routine keeps you calm."

  - kind: lab
    kicker: See it
    title: "The four steps"
    intro: "Each step has a job. Say the step name out loud so the interviewer can follow."
    view:
      type: flow
      stages:
        - { label: "1 Clarify", note: "Features, users, scale. Ask before drawing.", color: "#38bdf8" }
        - { label: "2 Sketch", note: "Boxes and arrows for the main path.", color: "#1cd6ac" }
        - { label: "3 Deep dive", note: "Pick the hardest part and go deep.", color: "#f97316" }
        - { label: "4 Wrap up", note: "Bottlenecks, failures, what you would do next.", color: "#a78bfa" }

  - kind: lab
    kicker: Plan it
    title: "Spend the 45 minutes"
    intro: "Drag the sliders. Minutes left over go to wrapping up. **Aim for about 5, 10, 20 and 10.**"
    view:
      type: bars
      max: 45
      items:
        - { label: "clarify", value: a, color: "#38bdf8" }
        - { label: "sketch", value: b, color: "#1cd6ac" }
        - { label: "deep dive", value: c, color: "#f97316" }
        - { label: "wrap up", value: d, color: "#a78bfa" }
    sliders: [a, b, c]
    outro: "That leaves **{d} minutes** to wrap up. Under 5 and you will rush the failure and bottleneck talk."

  - kind: code
    kicker: Say it
    title: "An opening script"
    intro: "Use words like these in the first two minutes."
    lang: text
    code: |
      Before I draw anything, let me check what we are building.
      Who uses it, and what are the two or three key actions?
      Roughly how many users, and how many requests per second?
      Do we care more about speed or about never losing data?
      Is there anything out of scope, such as login or payments?
      OK, here is what I will design. Tell me if I got it wrong.
    note: "Repeat the requirements back in one short list. It proves you listened and gives you a contract."

  - kind: check
    kicker: Your turn
    title: "The first minute"
    question: "The interviewer says 'Design Twitter'. What do you do first?"
    options:
      - { text: "Ask which features and what scale", correct: true, why: "The problem is deliberately vague. Clarifying turns it into something you can finish in 45 minutes." }
      - { text: "Pick a database", why: "That is a decision for later, once you know the needs." }
      - { text: "Draw load balancers", why: "Boxes before requirements is the classic mistake." }
      - { text: "Talk about sharding", why: "Premature detail." }

  - kind: check
    kicker: Practice
    title: "Where to go deep"
    question: "In the deep dive step, which part do you choose?"
    options:
      - { text: "The part that is hardest or most specific to this problem", correct: true, why: "That is where your judgement shows. Generic parts like a load balancer need one sentence." }
      - { text: "Whatever you know best, even if it is easy", why: "Make it relevant to the problem." }
      - { text: "Everything equally", why: "You will run out of time." }
      - { text: "Nothing, stay high level", why: "Depth is what is being tested." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Silence.** Think aloud, even when unsure."
      - "**Drawing before asking.** Clarify first."
      - "**Name-dropping tools.** Say why you chose each one."
      - "**Ignoring failure.** Say what happens when a server dies."
    next: { label: "Next: back-of-envelope estimates", href: /learn/int-sd-estimates }
