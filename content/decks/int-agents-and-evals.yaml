id: int-agents-and-evals
title: "Interview Q&A: agents and evaluation"
minutes: 14
order: 212
params:
  - { id: n, label: "test cases", min: 10, max: 1000, step: 10, init: 50 }
derived:
  - { id: margin, expr: "100 / sqrt(n)" }
cards:
  - kind: story
    kicker: Start here
    title: "A model that can act"
    body:
      - "An **agent** is an LLM in a loop: it decides, calls a **tool** (search, database, code), reads the result, and decides again until it is done."
      - "Interviewers ask how you keep one **safe**, **bounded** and **measurable**. Loops can run forever and tools can do damage."
    callout: "Three guardrails to name: a step limit, permission checks on tools, and logging every step."

  - kind: lab
    kicker: See it
    title: "The agent loop"
    intro: "The loop stops on a final answer or when the step limit hits."
    view:
      type: flow
      stages:
        - { label: "Think", note: "The model chooses a tool or answers.", color: "#38bdf8" }
        - { label: "Act", note: "Your code runs the tool with checked inputs.", color: "#1cd6ac" }
        - { label: "Observe", note: "The result is added to the history.", color: "#f97316" }
        - { label: "Stop?", note: "Final answer, or step limit reached.", color: "#a78bfa" }

  - kind: code
    kicker: Write it
    title: "A bounded agent loop"
    intro: "The model here is a stub so you can test the loop alone. The step limit is what prevents runaway loops."
    lang: python
    code: |
      def run_agent(llm, tools, task, max_steps=5):
          history = []
          for _ in range(max_steps):
              act = llm(task, history)
              if act["type"] == "final":
                  return act["text"]
              if act["tool"] not in tools:                 # allow-list
                  history.append("error: unknown tool")
                  continue
              history.append(tools[act["tool"]](act["arg"]))
          return "stopped: step limit"

      tools = {"add": lambda s: str(sum(int(x) for x in s.split("+")))}

      def good_llm(task, history):
          if not history:
              return {"type": "tool", "tool": "add", "arg": "2+3"}
          return {"type": "final", "text": "answer " + history[-1]}

      def loop_llm(task, history):
          return {"type": "tool", "tool": "add", "arg": "1+1"}

      assert run_agent(good_llm, tools, "sum") == "answer 5"
      assert run_agent(loop_llm, tools, "sum") == "stopped: step limit"
    note: "A real version would also validate tool arguments and ask a human before risky actions."

  - kind: lab
    kicker: See it
    title: "How many test cases do you need?"
    intro: "A score from a small test set is noisy. The rough margin of error is 100 divided by the square root of the cases. **Drag the cases.**"
    view:
      type: bars
      max: 15
      items:
        - { label: "rough margin of error (points)", value: margin, color: "#f97316" }
        - { label: "a gain worth trusting (points)", value: "5", color: "#1cd6ac" }
    sliders: [n]
    outro: "With {n} cases the score could be off by about **{margin} points**. A 3 point improvement on 50 cases may be luck."

  - kind: lab
    kicker: Memorise
    title: "An evaluation loop"
    intro: "Say this when asked how you would know the system works."
    view:
      type: flow
      stages:
        - { label: "Golden set", note: "Real questions with known good answers.", color: "#38bdf8" }
        - { label: "Run", note: "Same inputs every time, versions logged.", color: "#1cd6ac" }
        - { label: "Score", note: "Exact checks, rubrics or a judge model.", color: "#f97316" }
        - { label: "Gate", note: "Block a release if the score drops.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "The runaway agent"
    question: "Your agent sometimes keeps calling the same tool for minutes. What is the first safeguard?"
    options:
      - { text: "A maximum step count and a repeated-call check", correct: true, why: "A hard bound limits cost and damage no matter what the model does." }
      - { text: "Hope the model improves", why: "Not an engineering control." }
      - { text: "Remove all tools", why: "Then it is no longer an agent." }
      - { text: "Raise the temperature", why: "It adds randomness, not safety." }

  - kind: check
    kicker: Practice
    title: "Judge model"
    question: "You use an LLM to grade answers. What is a sensible precaution?"
    options:
      - { text: "Check its grades against a few human-labelled examples", correct: true, why: "A judge can be biased or wrong. A human-checked sample tells you how far to trust it." }
      - { text: "Trust it fully", why: "Judges make mistakes." }
      - { text: "Use the same model that wrote the answer, always", why: "It may favour its own style." }
      - { text: "Skip evaluation", why: "That removes the safety net." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Unbounded loops.** Always set a step limit and a time limit."
      - "**Trusting tool output blindly.** Treat fetched text as untrusted input."
      - "**Judging by demos.** Use a fixed test set."
      - "**Ignoring cost.** Log tokens and tool calls per task."
    next: { label: "Next: a system design framework", href: /learn/int-sd-framework }
