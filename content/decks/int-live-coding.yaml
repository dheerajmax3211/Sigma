id: int-live-coding
title: "Live coding: habits that win"
minutes: 12
order: 218
params:
  - { id: t, label: "minutes used", min: 0, max: 45, step: 1, init: 0 }
derived:
  - { id: phase, expr: "pick(floor(t / 12), 0, 1, 2, 3)" }
cards:
  - kind: story
    kicker: Start here
    title: "They watch how you work"
    body:
      - "In a live coding round, a correct answer is only part of the score. Interviewers also watch whether you **communicate**, **test** and **recover** from mistakes."
      - "A calm, repeatable routine matters more than a flash of brilliance."
    callout: "Talk through your thinking. Silence looks like being stuck."

  - kind: lab
    kicker: See it
    title: "A 45 minute round"
    intro: "Use the whole time on purpose. **Drag the clock.**"
    view:
      type: flow
      stages:
        - { label: "Understand", note: "Repeat the problem, ask about edge cases, try an example.", color: "#38bdf8" }
        - { label: "Plan", note: "Say the approach and its cost before coding.", color: "#1cd6ac" }
        - { label: "Code", note: "Clean names, small steps, talk as you go.", color: "#f97316" }
        - { label: "Test", note: "Walk an example through. Try an empty input.", color: "#a78bfa" }
    sliders: [t]
    says:
      - "Minutes 0 to 11: **understand and plan.** Do not type code yet."
      - "Minutes 12 to 23: **write the solution.** Start simple, even if it is slow."
      - "Minutes 24 to 35: **test and fix.** Walk through by hand."
      - "Minutes 36 and after: **improve.** Discuss cost and better approaches."
    saysAt: phase

  - kind: code
    kicker: Write it
    title: "A self-check habit"
    intro: "Write two or three asserts as soon as the function exists. It shows discipline and catches bugs fast."
    lang: python
    code: |
      def two_sum(nums, target):
          seen = {}
          for i, n in enumerate(nums):
              if target - n in seen:
                  return [seen[target - n], i]
              seen[n] = i
          return []

      assert two_sum([2, 7, 11, 15], 9) == [0, 1]
      assert two_sum([3, 3], 6) == [0, 1]
      assert two_sum([], 5) == []
    note: "Say aloud: 'Normal case, a duplicate, and empty input.' That is the habit being scored."

  - kind: check
    kicker: Your turn
    title: "Stuck for a minute"
    question: "You are stuck on the optimal solution. What is the best move?"
    options:
      - { text: "State a simple correct solution first, then improve it", correct: true, why: "A working answer earns credit and often reveals the better one." }
      - { text: "Stay silent until you find it", why: "Silence hides your thinking." }
      - { text: "Guess code at random", why: "Unplanned code wastes time." }
      - { text: "Ask to skip the problem", why: "Try first." }

  - kind: check
    kicker: Practice
    title: "A hint arrives"
    question: "The interviewer gives a hint. How do you respond?"
    options:
      - { text: "Use it, say what it changed, and keep going", correct: true, why: "Taking direction well is a skill they are testing." }
      - { text: "Ignore it", why: "Looks stubborn." }
      - { text: "Apologise repeatedly", why: "Wastes time. Just continue." }
      - { text: "Start over silently", why: "Explain your new plan." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Coding at minute one.** Plan first."
      - "**Skipping a test.** Always run one example."
      - "**Cryptic names.** Use clear names such as `seen`, not `s`."
      - "**Arguing.** Discuss trade-offs calmly."
    next: { label: "Next: the take-home project", href: /learn/int-take-home }
