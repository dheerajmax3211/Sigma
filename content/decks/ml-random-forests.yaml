id: "ml-random-forests"
title: "Random forests"
minutes: 13
order: 502
params:
  - { id: "n", label: "number of trees", min: 1, max: 200, step: 1, init: 50 }
  - { id: "rho", label: "how alike the trees are", min: 0, max: 1, step: 0.05, init: 0.3 }
derived:
  - { id: "v", expr: "100 * (rho + (1 - rho) / n)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Many noisy trees beat one"
    body:
      - "A single tree is unstable. Change a few rows and it changes shape. A **random forest** trains many trees and averages their votes."
      - "Two kinds of randomness keep the trees different. Each tree sees a **bootstrap sample**, rows drawn with replacement. Each split considers only a **random subset of features**."
    callout: "Averaging cuts variance. It cannot cut bias."
  - kind: "lab"
    kicker: "See it"
    title: "Why averaging helps"
    intro: "The variance of the average depends on how alike the trees are. Alike trees share errors. **Drag both sliders.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "variance of the forest", value: "v", color: "#f97316" }
        - { label: "variance of one tree", value: "100", color: "#38bdf8" }
    sliders:
      - "n"
      - "rho"
    outro: "With {n} trees that are {rho} alike, variance falls to **{v}**. Adding trees past a point stops helping. Making them less alike keeps helping."
  - kind: "code"
    kicker: "Write it"
    title: "Bagging and a vote"
    intro: "Draw rows with replacement, train a model on each draw, and take the majority."
    lang: "python"
    code: |
      def bootstrap(rows, picks):
          return [rows[i] for i in picks]

      def majority(votes):
          return max(set(votes), key=votes.count)

      assert bootstrap(["a", "b", "c"], [0, 0, 2]) == ["a", "a", "c"]
      assert majority([1, 0, 1, 1, 0]) == 1

      def forest_predict(trees, x):
          return majority([t(x) for t in trees])

      trees = [lambda x: x > 1, lambda x: x > 3, lambda x: x > 5]
      assert forest_predict(trees, 4) == True
      assert forest_predict(trees, 2) == False
    note: "Each bootstrap leaves out about a third of rows. Those out-of-bag rows give a free test score."
  - kind: "lab"
    kicker: "Memorise"
    title: "Settings that matter"
    intro: "Most defaults are good. These three are worth knowing."
    view:
      type: "flow"
      stages:
        - { label: "Number of trees", note: "More is safe. 100 to 500 is typical.", color: "#38bdf8" }
        - { label: "Features per split", note: "Lower makes trees less alike. Square root of the feature count is common.", color: "#1cd6ac" }
        - { label: "Leaf size", note: "Raise it to smooth. Lower it to fit detail.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "More trees"
    question: "You raise the forest from 100 to 1000 trees. What happens to overfitting?"
    options:
      - { text: "It does not get worse", correct: true, why: "Averaging more trees never raises variance." }
      - { text: "It gets much worse", why: "That is true of depth, not tree count." }
      - { text: "Bias drops sharply", why: "Averaging reduces variance, not bias." }
      - { text: "Training becomes impossible", why: "It only costs time." }
  - kind: "check"
    kicker: "Practice"
    title: "Why pick random features"
    question: "Why does each split see only some features?"
    options:
      - { text: "To make the trees different so errors cancel", correct: true, why: "If one feature dominates, all trees copy each other." }
      - { text: "To speed up scoring only", why: "Decorrelation is the real reason." }
      - { text: "To remove useless features", why: "It is not a selector." }
      - { text: "Because trees cannot use them all", why: "They can." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Reading importance too literally.** Correlated features share credit."
      - "**Using a forest for extrapolation.** It cannot predict beyond the training range."
      - "**Skipping the out-of-bag score.** It is a free validation."
    next: { label: "Next: gradient boosting", href: "/learn/ml-gradient-boosting" }
