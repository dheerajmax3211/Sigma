id: int-the-interview-loop
title: "The interview loop and your prep plan"
minutes: 12
order: 201
params:
  - { id: days, label: "days left", min: 7, max: 56, step: 1, init: 28 }
  - { id: hrs, label: "hours a day", min: 1, max: 6, step: 1, init: 3 }
derived:
  - { id: total, expr: "days * hrs" }
  - { id: dsa, expr: "round(total * 0.35)" }
  - { id: ml, expr: "round(total * 0.25)" }
  - { id: sd, expr: "round(total * 0.2)" }
  - { id: beh, expr: "round(total * 0.1)" }
  - { id: mock, expr: "round(total * 0.1)" }
cards:
  - kind: story
    kicker: Start here
    title: "An interview is a pipeline, not one test"
    body:
      - "Most AI engineering jobs run the same loop: a recruiter call, a coding screen, then an **onsite** of three to five rounds in one day."
      - "Each round tests a different skill. If you know the round, you know what to practise. That is what this track is for."
    callout: "You do not need to be perfect in every round. You need to be solid in all of them."

  - kind: lab
    kicker: See it
    title: "The usual loop"
    intro: "Companies differ, but this order is common. Each stage has a different goal."
    view:
      type: flow
      stages:
        - { label: "Recruiter call", note: "30 minutes. Role, pay range, timeline, visa.", color: "#38bdf8" }
        - { label: "Coding screen", note: "45 minutes. One or two DSA problems, live.", color: "#1cd6ac" }
        - { label: "Take-home (some)", note: "A small project or notebook, a few hours.", color: "#f97316" }
        - { label: "Technical rounds", note: "Coding, ML or LLM questions, system design.", color: "#a78bfa" }
        - { label: "Behavioural", note: "Stories about teamwork, conflict and failure.", color: "#ec4899" }
        - { label: "Offer", note: "Numbers, benefits, start date. You can negotiate.", color: "#facc15" }

  - kind: lab
    kicker: Plan it
    title: "Split your hours"
    intro: "A balanced split gives coding the most time, then ML, design, behavioural and mock interviews. **Drag the days and hours.**"
    view:
      type: bars
      max: 120
      items:
        - { label: "DSA practice", value: dsa, color: "#38bdf8" }
        - { label: "ML and LLM questions", value: ml, color: "#1cd6ac" }
        - { label: "System design", value: sd, color: "#f97316" }
        - { label: "Behavioural stories", value: beh, color: "#a78bfa" }
        - { label: "Mock interviews", value: mock, color: "#ec4899" }
    sliders: [days, hrs]
    outro: "{days} days at {hrs} hours is **{total} hours**. Mock interviews get {mock} of them, and that is the part most people skip."

  - kind: code
    kicker: Use it
    title: "Questions to ask the recruiter"
    intro: "Ask early. The answers tell you what to practise, and asking shows you are organised."
    lang: text
    code: |
      1. What are the rounds, and how long is each?
      2. Is the coding in a shared editor, on a whiteboard or in my own IDE?
      3. Will there be an ML or LLM round, or system design for AI products?
      4. Is there a take-home? How long should it take?
      5. Who will I meet, and what are their roles?
      6. What is the timeline from onsite to decision?
    note: "Recruiters usually want you to succeed. Most will happily tell you the format."

  - kind: check
    kicker: Your turn
    title: "Where do the hours go?"
    question: "You have 4 weeks. A friend says to spend all of them on coding problems. What is the weakness in that plan?"
    options:
      - { text: "Several rounds are not coding at all", correct: true, why: "ML questions, system design and behavioural rounds each carry weight. Failing one can fail the loop." }
      - { text: "Coding problems are useless", why: "They matter a lot. They just are not the whole loop." }
      - { text: "Four weeks is too short", why: "It is enough for a focused plan." }
      - { text: "Coding screens are optional", why: "Most loops start with one." }

  - kind: check
    kicker: Practice
    title: "Which round is this?"
    question: "Someone asks: 'Tell me about a time you disagreed with a teammate.' Which round tests this?"
    options:
      - { text: "Behavioural", correct: true, why: "It checks how you work with people, using a real past example." }
      - { text: "Coding screen", why: "Coding rounds test problem solving." }
      - { text: "System design", why: "Design rounds test architecture." }
      - { text: "Recruiter call", why: "That is logistics." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Preparing for one round only.** Every round can end the loop."
      - "**Skipping mocks.** Speaking under pressure is a separate skill from knowing the answer."
      - "**Not asking the format.** Surprises cost points you never needed to lose."
      - "**Starting late.** Four steady weeks beat one frantic week."
    next: { label: "Next: behavioural stories", href: /learn/int-behavioural-star }
