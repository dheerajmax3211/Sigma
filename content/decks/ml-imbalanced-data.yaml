id: "ml-imbalanced-data"
title: "Imbalanced data"
minutes: 13
order: 509
params:
  - { id: "p", label: "rare class share (percent)", min: 0.1, max: 50, step: 0.1, init: 2 }
derived:
  - { id: "acc", expr: "100 - p" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "When 99 out of 100 are normal"
    body:
      - "Fraud, disease and failures are rare. A model that always says no looks very accurate and finds nothing."
      - "Fix it in three places: use metrics that care about the rare class, **move the decision threshold**, and optionally **reweight** the rare class in training."
    callout: "Accuracy is the wrong score when classes are lopsided."
  - kind: "lab"
    kicker: "See it"
    title: "The lazy model"
    intro: "A model that always predicts the common class. **Drag the rare share.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "accuracy of always saying no", value: "acc", color: "#f97316" }
        - { label: "share of rare cases it finds", value: "0", color: "#ef4444" }
    sliders:
      - "p"
    outro: "With {p} percent rare cases, always saying no is **{acc} percent** accurate and finds none. Look at recall and precision instead."
  - kind: "code"
    kicker: "Write it"
    title: "Precision, recall and the threshold"
    intro: "Lowering the threshold finds more of the rare cases and raises false alarms."
    lang: "python"
    code: |
      def pr(y, score, t):
          pred = [1 if s >= t else 0 for s in score]
          tp = sum(1 for a, b in zip(y, pred) if a == 1 and b == 1)
          fp = sum(1 for a, b in zip(y, pred) if a == 0 and b == 1)
          fn = sum(1 for a, b in zip(y, pred) if a == 1 and b == 0)
          return tp / (tp + fp), tp / (tp + fn)

      y = [1, 0, 0, 0, 1]
      s = [0.9, 0.8, 0.3, 0.2, 0.4]
      assert pr(y, s, 0.5) == (0.5, 0.5)
      p, r = pr(y, s, 0.35)
      assert abs(p - 2 / 3) < 1e-9 and r == 1.0
    note: "Pick the threshold from the cost of a miss against the cost of a false alarm."
  - kind: "lab"
    kicker: "Memorise"
    title: "Your toolbox"
    intro: "Try them roughly in this order."
    view:
      type: "flow"
      stages:
        - { label: "Right metric", note: "Recall, precision, PR curve. Not accuracy.", color: "#38bdf8" }
        - { label: "Threshold", note: "Tune on validation data for your costs.", color: "#1cd6ac" }
        - { label: "Class weights", note: "Make rare mistakes cost more in training.", color: "#f97316" }
        - { label: "Resampling", note: "Last. Only on the training set.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Resampling"
    question: "You oversample the rare class before splitting into train and test. What is wrong?"
    options:
      - { text: "Copies of the same row land in both sets and inflate the score", correct: true, why: "Split first, then resample only the training set." }
      - { text: "Nothing", why: "It leaks." }
      - { text: "Test gets harder", why: "It gets easier, falsely." }
      - { text: "Recall is lower", why: "It looks higher." }
  - kind: "check"
    kicker: "Practice"
    title: "Pick a metric"
    question: "A cancer screen where missing a case is very costly. What matters most?"
    options:
      - { text: "Recall", correct: true, why: "You want to catch nearly every case, accepting false alarms." }
      - { text: "Accuracy", why: "Misleading here." }
      - { text: "Precision only", why: "Ignores misses." }
      - { text: "Training loss", why: "Not a final metric." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Reporting accuracy.** It hides the failure."
      - "**Resampling before the split.** Leaks the answer."
      - "**Fixed threshold of 0.5.** Tune it."
    next: { label: "Next: features and leakage", href: "/learn/ml-feature-leakage" }
