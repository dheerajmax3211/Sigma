id: dsa-arrays-and-strings
title: "Arrays and strings"
minutes: 15
order: 102
params:
  - { id: s, label: "step", min: 0, max: 3, step: 1, init: 0 }
  - { id: z, label: "step", min: 0, max: 5, step: 1, init: 0 }
  - { id: n, label: "items n", min: 1, max: 1000, step: 1, init: 100 }
derived:
  - { id: r, expr: "5 - s" }
  - { id: slow, expr: "pick(z, 0, 0, 1, 1, 2, 3)" }
cards:
  - kind: story
    kicker: Start here
    title: "A row of numbered boxes"
    body:
      - "An array is a row of boxes sitting side by side in memory. Each box has a number, its **index**, starting at 0."
      - "Because the boxes are side by side, the computer can jump straight to box 5 without visiting boxes 0 to 4. That jump is what makes arrays fast."
    callout: "Python lists and strings are arrays underneath."

  - kind: lab
    kicker: See it
    title: "Reverse in place"
    intro: "Swap the first and last, then move both pointers toward the middle. No second array needed. **Drag the step.**"
    view:
      type: array
      cells: [1, 2, 3, 4, 5, 6]
      frames:
        - [1, 2, 3, 4, 5, 6]
        - [6, 2, 3, 4, 5, 1]
        - [6, 5, 3, 4, 2, 1]
        - [6, 5, 4, 3, 2, 1]
      frame: s
      pointers:
        - { label: "left", at: s, color: "#1cd6ac" }
        - { label: "right", at: r, color: "#f97316" }
    sliders: [s]
    says:
      - "Start. **left** is at index 0 and **right** is at index 5."
      - "Swapped the ends. Now move left to 1 and right to 4."
      - "Swapped again. Left is 2 and right is 3."
      - "One last swap and the pointers cross. Done in 3 swaps for 6 items."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Reverse and palindrome"
    intro: "Same idea in code. A **palindrome** reads the same both ways, so compare from the two ends moving inward."
    lang: python
    code: |
      def reverse(a):
          l, r = 0, len(a) - 1
          while l < r:
              a[l], a[r] = a[r], a[l]   # swap
              l += 1
              r -= 1
          return a

      def is_palindrome(s):
          l, r = 0, len(s) - 1
          while l < r:
              if s[l] != s[r]:
                  return False
              l += 1
              r -= 1
          return True

      assert reverse([1, 2, 3, 4, 5, 6]) == [6, 5, 4, 3, 2, 1]
      assert is_palindrome("level") and not is_palindrome("level up")
    note: "Time O(n), extra space O(1). The pointers are the whole trick."

  - kind: lab
    kicker: What costs what
    title: "Why the front is expensive"
    intro: "Reading box 7 is instant. But inserting at the **front** pushes every other item one box to the right. **Drag n.**"
    view:
      type: bars
      max: 1000
      items:
        - { label: "read by index", value: "1", color: "#1cd6ac" }
        - { label: "append at end", value: "1", color: "#38bdf8" }
        - { label: "insert at front", value: n, color: "#f97316" }
        - { label: "search for a value", value: n, color: "#ef4444" }
    sliders: [n]
    outro: "With {n} items, inserting at the front moves **{n}** items. Appending moves 1."

  - kind: check
    kicker: Your turn
    title: "Cost of insert"
    question: "What is the cost of `my_list.insert(0, x)` on a list with n items?"
    options:
      - { text: "O(1)", why: "That is append at the end. The front needs everything shifted." }
      - { text: "O(n)", correct: true, why: "Every existing item moves one place right." }
      - { text: "O(log n)", why: "Nothing is halved. It is a plain shift." }
      - { text: "O(n squared)", why: "One shift pass is enough." }

  - kind: lab
    kicker: Slow and fast pointers
    title: "Move zeroes to the end"
    intro: "Keep the non-zero items in order and push the zeros to the back, using one array. The **slow** pointer marks where the next non-zero belongs."
    view:
      type: array
      cells: [0, 1, 0, 3, 12]
      frames:
        - [0, 1, 0, 3, 12]
        - [0, 1, 0, 3, 12]
        - [1, 0, 0, 3, 12]
        - [1, 0, 0, 3, 12]
        - [1, 3, 0, 0, 12]
        - [1, 3, 12, 0, 0]
      frame: z
      pointers:
        - { label: "slow", at: slow, color: "#1cd6ac" }
        - { label: "fast", at: z, color: "#f97316" }
    sliders: [z]
    says:
      - "Start. **fast** looks at index 0. It is a zero, so skip it."
      - "fast moves to 1. It is 1, a non-zero."
      - "Swapped 1 into the slow slot. slow moves to 1. fast looks at index 2, a zero."
      - "fast is at 3. It holds 3, a non-zero."
      - "Swapped 3 into place. slow is 2. fast looks at 12."
      - "Swapped 12 into place. All zeros are now at the end."
    saysAt: z

  - kind: code
    kicker: Write it
    title: "Move zeroes, in code"
    intro: "Fast scans every item. Slow only moves when a non-zero is placed."
    lang: python
    code: |
      def move_zeroes(a):
          slow = 0
          for fast in range(len(a)):
              if a[fast] != 0:
                  a[slow], a[fast] = a[fast], a[slow]
                  slow += 1
          return a

      assert move_zeroes([0, 1, 0, 3, 12]) == [1, 3, 12, 0, 0]
      assert move_zeroes([0]) == [0]
      assert move_zeroes([1, 2]) == [1, 2]
    note: "One pass, O(n) time, O(1) space. You will see this slow and fast shape again in two pointers."

  - kind: code
    kicker: Strings
    title: "Strings cannot be changed"
    intro: "A Python string is **immutable**: `s += 'x'` builds a brand new string each time. Doing that in a loop copies again and again, which is O(n squared). Collect pieces in a list and join once."
    lang: python
    code: |
      def build_slow(parts):
          s = ""
          for p in parts:
              s += p            # copies the whole string every time
          return s

      def build_fast(parts):
          return "".join(parts)  # one pass

      parts = ["a", "bc", "def"]
      assert build_slow(parts) == build_fast(parts) == "abcdef"
      assert "abc"[::-1] == "cba"   # slicing makes a new string too
    note: "Interviews often say: in-place on a string is impossible in Python. Convert to a list of characters first."

  - kind: check
    kicker: Your turn
    title: "Spot the extra cost"
    question: "Which line quietly makes this loop O(n squared)? `for i in range(n): if x in my_list: ...`"
    options:
      - { text: "The for loop", why: "One loop alone is O(n)." }
      - { text: "`x in my_list`", correct: true, why: "Searching a list is O(n), and it runs n times. Use a set." }
      - { text: "`range(n)`", why: "range is lazy and free." }
      - { text: "Nothing, it is O(n)", why: "A hidden scan lives inside `in`." }

  - kind: check
    kicker: Practice
    title: "Which pattern?"
    question: "Remove duplicates from a sorted array in place, keeping the order. Which idea fits best?"
    options:
      - { text: "Slow pointer writes, fast pointer reads", correct: true, why: "Sorted means duplicates sit together. Fast scans, slow writes each new value." }
      - { text: "Insert at front for each item", why: "That makes it O(n squared)." }
      - { text: "Build a new string with +=", why: "Wrong type and slow." }
      - { text: "Sort it again first", why: "It is already sorted." }

  - kind: practice
    kicker: Your turn
    title: "Reverse the words"
    intro: "Write `reverse_words(s)` that reverses the order of the words in a sentence. Words are separated by single spaces."
    entry: reverse_words
    starter: |
      def reverse_words(s):
          pass
    solution: |
      def reverse_words(s):
          return ' '.join(s.split(' ')[::-1])
    tests:
      - { input: "[\"the sky is blue\"]", expected: "\"blue is sky the\"" }
      - { input: "[\"hello\"]", expected: "\"hello\"" }
      - { input: "[\"a b\"]", expected: "\"b a\"" }
    hint: "Split into a list, reverse the list, join it back."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Off by one.** The last index is `len(a) - 1`, not `len(a)`."
      - "**Changing a list while looping over it.** Items get skipped. Loop over a copy or use two pointers."
      - "**Assuming slicing is free.** `a[1:]` copies the rest of the list. Pass indexes instead."
      - "**Forgetting the empty array.** Test `[]` and a single item before you say you are done."
    next: { label: "Next: hash maps and sets", href: /learn/dsa-hash-maps-and-sets }
