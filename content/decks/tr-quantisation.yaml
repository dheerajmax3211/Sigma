id: tr-quantisation
title: "Quantisation: shrinking a model"
minutes: 13
order: 309
params:
  - { id: bits, label: "bits per weight", min: 2, max: 16, step: 1, init: 8 }
derived:
  - { id: gb, expr: "0.875 * bits" }
cards:
  - kind: story
    kicker: Start here
    title: "Fewer bits per number"
    body:
      - "A 7 billion parameter model stored as 16 bit numbers needs about 14 GB. Most laptops cannot hold that."
      - "**Quantisation** stores each weight with fewer bits, such as 8 or 4. The model shrinks and often runs faster, at a small cost in quality."
    callout: "This is how big models run on small machines."

  - kind: lab
    kicker: See it
    title: "Memory for a 7 billion weight model"
    intro: "Memory is weights times bits divided by 8. **Drag the bits.**"
    view:
      type: bars
      max: 14
      items:
        - { label: "memory at this precision (GB)", value: gb, color: "#1cd6ac" }
        - { label: "16 bit baseline (GB)", value: "14", color: "#38bdf8" }
    sliders: [bits]
    outro: "At {bits} bits the model needs about **{gb} GB**."

  - kind: code
    kicker: Write it
    title: "8 bit quantisation"
    intro: "Pick a scale from the largest value, round to integers, then multiply back. The error per weight is at most half a step."
    lang: python
    code: |
      def quantise(xs):
          scale = max(abs(x) for x in xs) / 127
          return [round(x / scale) for x in xs], scale

      def dequantise(qs, scale):
          return [q * scale for q in qs]

      xs = [0.5, -1.27, 0.03, 1.0]
      qs, scale = quantise(xs)
      back = dequantise(qs, scale)
      assert max(abs(a - b) for a, b in zip(xs, back)) <= scale / 2 + 1e-12
      assert max(abs(q) for q in qs) == 127
    note: "A single huge weight stretches the scale and hurts the others, so real methods use small groups with their own scales."

  - kind: lab
    kicker: Compare
    title: "Where it is applied"
    intro: "Not everything is shrunk equally."
    view:
      type: flow
      stages:
        - { label: "Weights", note: "Most common. 8 or 4 bit.", color: "#38bdf8" }
        - { label: "KV cache", note: "Can also be quantised to save serving memory.", color: "#1cd6ac" }
        - { label: "Activations", note: "Harder. Values vary a lot.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "The trade"
    question: "What is the main trade-off of 4 bit quantisation?"
    options:
      - { text: "Much less memory for a small drop in quality", correct: true, why: "Smaller and faster, with some accuracy loss that you should measure." }
      - { text: "More memory, more accuracy", why: "Opposite." }
      - { text: "No change at all", why: "Information is lost." }
      - { text: "It trains the model further", why: "It only compresses." }

  - kind: check
    kicker: Practice
    title: "Checking it worked"
    question: "You quantised a model. How should you decide if it is good enough?"
    options:
      - { text: "Run your own evaluation set before and after", correct: true, why: "Quality loss varies by task. Measure on your use case." }
      - { text: "Assume it is fine", why: "Risky." }
      - { text: "Check the file size only", why: "Size says nothing about quality." }
      - { text: "Raise the temperature", why: "Unrelated." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Skipping evaluation.** Some tasks suffer more than others."
      - "**Going too low.** Below 4 bits quality often drops fast."
      - "**Confusing it with training.** Quantisation shrinks a trained model."
    next: { label: "Next: fine-tuning with LoRA", href: /learn/tr-fine-tuning-lora }
