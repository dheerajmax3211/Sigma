id: tr-flash-long-context
title: "Long context and flash attention"
minutes: 14
order: 308
params:
  - { id: n, label: "context (thousands of tokens)", min: 1, max: 128, step: 1, init: 32 }
derived:
  - { id: mat, expr: "n * n * 0.002" }
  - { id: flash, expr: "n * 0.02" }
cards:
  - kind: story
    kicker: Start here
    title: "The n by n problem"
    body:
      - "Attention scores every token against every other, giving a table of **n times n** numbers. Double the context and the table is four times bigger."
      - "For long inputs the table is the problem. **Flash attention** computes the same answer without ever storing the whole table."
    callout: "It is an engineering trick: same maths, far less memory traffic."

  - kind: lab
    kicker: See it
    title: "Memory for the score table"
    intro: "One head, one layer, 2 bytes per number. Flash numbers are illustrative. **Drag the context.**"
    view:
      type: bars
      max: 35
      items:
        - { label: "full table (GB)", value: mat, color: "#ef4444" }
        - { label: "with flash attention (GB)", value: flash, color: "#1cd6ac" }
    sliders: [n]
    outro: "At {n} thousand tokens the full table needs about **{mat} GB**, against **{flash} GB** when computed in tiles."

  - kind: code
    kicker: Write it
    title: "The trick: softmax in pieces"
    intro: "Softmax needs a sum over all scores. You can build that sum chunk by chunk, fixing the running maximum as you go."
    lang: python
    code: |
      import math

      def online_denominator(xs, chunk=2):
          m, s = float("-inf"), 0.0
          for i in range(0, len(xs), chunk):
              part = xs[i:i + chunk]
              new_m = max(m, max(part))
              s = s * math.exp(m - new_m) if s else 0.0
              s += sum(math.exp(v - new_m) for v in part)
              m = new_m
          return m, s

      xs = [1.0, 5.0, 2.0, 7.0, 3.0]
      m, s = online_denominator(xs)
      full = sum(math.exp(v - max(xs)) for v in xs)
      assert m == 7.0 and abs(s - full) < 1e-12
    note: "Flash attention does this for whole blocks, keeping them in fast on-chip memory."

  - kind: lab
    kicker: Compare
    title: "Other ways to go long"
    intro: "Flash attention makes long context affordable. These ideas make it useful."
    view:
      type: flow
      stages:
        - { label: "Better positions", note: "Rotary scaling helps models handle lengths they saw little of.", color: "#38bdf8" }
        - { label: "Sliding windows", note: "Each token sees only recent tokens in some layers.", color: "#1cd6ac" }
        - { label: "Retrieval", note: "Fetch only the relevant text instead of reading everything.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Does flash change the answer?"
    question: "Compared with standard attention, flash attention gives:"
    options:
      - { text: "The same results, using less memory and often less time", correct: true, why: "It is an exact algorithm, not an approximation." }
      - { text: "Approximate results", why: "It is exact." }
      - { text: "A longer vocabulary", why: "Unrelated." }
      - { text: "A smaller model", why: "Weights are the same." }

  - kind: check
    kicker: Practice
    title: "A long prompt"
    question: "You paste a 100 page document and answers get worse in the middle of it. A sensible response?"
    options:
      - { text: "Retrieve the relevant passages instead of sending everything", correct: true, why: "Models often use the middle of very long prompts poorly. Targeted context helps and costs less." }
      - { text: "Always send more text", why: "More is not always better." }
      - { text: "Lower the temperature to zero", why: "Does not fix attention to the middle." }
      - { text: "Shorten the vocabulary", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Believing a big window means perfect recall.** Test it."
      - "**Ignoring cost.** Long prompts cost time and money."
      - "**Calling flash attention an approximation.** It is exact."
    next: { label: "Next: quantisation", href: /learn/tr-quantisation }
