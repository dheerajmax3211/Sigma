id: dsa-sorting
title: "Sorting"
minutes: 15
order: 111
params:
  - { id: s, label: "step", min: 0, max: 4, step: 1, init: 0 }
  - { id: n, label: "items n", min: 10, max: 1000, step: 10, init: 500 }
derived:
  - { id: nlogn, expr: "n * log(n) / log(2)" }
cards:
  - kind: story
    kicker: Start here
    title: "Why sorting matters"
    body:
      - "Sorted data unlocks binary search, two pointers, merging and duplicate checks. Often the best first move on a problem is simply: sort it."
      - "In real work you call `sorted()`. In interviews you must know **how** it works and what it costs, so you can explain the trade-offs."
    callout: "Python's built-in sort is O(n log n), stable, and almost always the right choice."

  - kind: lab
    kicker: See it
    title: "Insertion sort"
    intro: "Take the next item and slide it left until it sits in the right place, like sorting playing cards in your hand. **Drag the step.**"
    view:
      type: array
      cells: [5, 2, 4, 1, 3]
      frames:
        - [5, 2, 4, 1, 3]
        - [2, 5, 4, 1, 3]
        - [2, 4, 5, 1, 3]
        - [1, 2, 4, 5, 3]
        - [1, 2, 3, 4, 5]
      frame: s
      pointers:
        - { label: "inserted", at: s, color: "#1cd6ac" }
      windows:
        - { from: "0", to: s, color: "#38bdf8" }
    sliders: [s]
    says:
      - "The blue part is sorted. Right now it is just the first card, 5."
      - "Take 2. It is smaller than 5, so it slides left of it."
      - "Take 4. It goes between 2 and 5."
      - "Take 1. It slides all the way to the front."
      - "Take 3. It lands between 2 and 4. Everything is sorted."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Insertion sort in code"
    intro: "Simple and fast on tiny or nearly sorted lists. For big random data it needs about n times n steps."
    lang: python
    code: |
      def insertion_sort(a):
          for i in range(1, len(a)):
              x = a[i]
              j = i - 1
              while j >= 0 and a[j] > x:
                  a[j + 1] = a[j]       # shift right
                  j -= 1
              a[j + 1] = x
          return a

      assert insertion_sort([5, 2, 4, 1, 3]) == [1, 2, 3, 4, 5]
      assert insertion_sort([]) == [] and insertion_sort([1]) == [1]
    note: "Time O(n squared) worst case, O(n) if already sorted. Space O(1)."

  - kind: lab
    kicker: What it costs
    title: "n squared vs n log n"
    intro: "Simple sorts compare almost every pair. Smarter ones split the work in halves. **Drag n.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "n squared (insertion sort)", value: "n * n", color: "#ef4444" }
        - { label: "n log n (merge sort)", value: nlogn, color: "#1cd6ac" }
    sliders: [n]
    outro: "At {n} items, the simple sort does about {n} times {n} steps. Merge sort does about **{nlogn}**."

  - kind: code
    kicker: Divide and conquer
    title: "Merge sort"
    intro: "Split in half, sort each half, then **merge** the two sorted halves by comparing their fronts. Splitting gives log n levels, merging costs n per level."
    lang: python
    code: |
      def merge_sort(a):
          if len(a) <= 1:
              return a
          mid = len(a) // 2
          left, right = merge_sort(a[:mid]), merge_sort(a[mid:])
          out, i, j = [], 0, 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:        # <= keeps equal items in order
                  out.append(left[i]); i += 1
              else:
                  out.append(right[j]); j += 1
          return out + left[i:] + right[j:]

      assert merge_sort([5, 2, 4, 1, 3]) == [1, 2, 3, 4, 5]
      assert merge_sort([3, 3, 1]) == [1, 3, 3]
    note: "Time O(n log n) always. Space O(n) for the merged lists."

  - kind: code
    kicker: Partitioning
    title: "Quicksort"
    intro: "Pick a **pivot**, put smaller items on its left and larger on its right, then sort each side. Fast in practice, but a bad pivot can make it O(n squared)."
    lang: python
    code: |
      import random

      def quicksort(a):
          if len(a) <= 1:
              return a
          p = random.choice(a)
          less = [x for x in a if x < p]
          same = [x for x in a if x == p]
          more = [x for x in a if x > p]
          return quicksort(less) + same + quicksort(more)

      assert quicksort([5, 2, 4, 1, 3, 3]) == [1, 2, 3, 3, 4, 5]
      assert quicksort([]) == []
    note: "Random pivots make the bad case very unlikely. Average O(n log n). Real versions partition in place."

  - kind: check
    kicker: Your turn
    title: "Stable?"
    question: "Records are sorted by age, then by city. A **stable** sort on city keeps people of the same city in age order. Which sort does Python's `sorted` use?"
    options:
      - { text: "A stable sort", correct: true, why: "Equal keys keep their original order. Timsort is stable." }
      - { text: "An unstable sort", why: "Python guarantees stability." }
      - { text: "Selection sort", why: "Far too slow to be the default." }
      - { text: "Random shuffle", why: "That is not sorting." }

  - kind: code
    kicker: Everyday use
    title: "Sort with a key"
    intro: "Use `key=` to say what to sort by. Tuples compare item by item, so a tuple key sorts by several fields."
    lang: python
    code: |
      people = [("Ana", 31), ("Bo", 25), ("Cy", 31), ("Di", 25)]

      by_age = sorted(people, key=lambda p: p[1])
      assert by_age == [("Bo", 25), ("Di", 25), ("Ana", 31), ("Cy", 31)]   # stable

      by_age_desc_then_name = sorted(people, key=lambda p: (-p[1], p[0]))
      assert by_age_desc_then_name[0] == ("Ana", 31)

      words = sorted(["bb", "a", "ccc"], key=len, reverse=True)
      assert words == ["ccc", "bb", "a"]
    note: "`sorted` returns a new list. `list.sort()` changes the list in place and returns None."

  - kind: check
    kicker: Practice
    title: "Pick the sort"
    question: "You must sort 10 million integers that are all between 0 and 100. Which idea is fastest?"
    options:
      - { text: "Counting sort", correct: true, why: "Count how many of each value 0 to 100, then rebuild. O(n + 101)." }
      - { text: "Insertion sort", why: "About 10 million squared steps." }
      - { text: "Binary search", why: "Searching is not sorting." }
      - { text: "Sort strings instead", why: "That makes it slower." }

  - kind: practice
    kicker: Your turn
    title: "Merge two sorted lists"
    intro: "Write `merge(a, b)` that merges two sorted lists into one sorted list in O(n). This is the heart of merge sort."
    entry: merge
    starter: |
      def merge(a, b):
          pass
    solution: |
      def merge(a, b):
          i = j = 0
          out = []
          while i < len(a) and j < len(b):
              if a[i] <= b[j]:
                  out.append(a[i]); i += 1
              else:
                  out.append(b[j]); j += 1
          return out + a[i:] + b[j:]
    tests:
      - { input: "[[1,3,5],[2,4,6]]", expected: "[1,2,3,4,5,6]" }
      - { input: "[[],[1]]", expected: "[1]" }
      - { input: "[[1,1],[1]]", expected: "[1,1,1]" }
    hint: "Compare the front of each list and take the smaller one."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Using the result of `.sort()`.** It returns None. Use `sorted()` if you want the list."
      - "**Sorting when you only need the top k.** A heap does it in O(n log k)."
      - "**Assuming quicksort is always n log n.** Sorted input with a fixed first pivot is the worst case."
      - "**Writing your own sort in real code.** Use the built-in unless the task is the sort itself."
    next: { label: "Next: recursion", href: /learn/dsa-recursion }
