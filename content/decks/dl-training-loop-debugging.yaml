id: dl-training-loop-debugging
title: "The training loop and how to debug it"
minutes: 15
order: 410
params:
  - { id: steps, label: "steps on one small batch", min: 0, max: 40, step: 1, init: 0 }
derived:
  - { id: loss, expr: "100 * 0.85 ^ steps" }
cards:
  - kind: story
    kicker: Start here
    title: "Five lines run every model"
    body:
      - "Every network trains the same way: take a batch, run **forward**, compute the **loss**, run **backward**, then **step** the optimiser and clear the gradients."
      - "When training goes wrong there is rarely an error message. The loss just does not fall. A fixed order of checks finds the cause quickly."
    callout: "First make it overfit one tiny batch. If it cannot, there is a bug."

  - kind: lab
    kicker: See it
    title: "Overfit one batch"
    intro: "Train on 8 examples only. A working model and loop drives the loss close to zero. **Drag the steps.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "loss on the tiny batch", value: loss, color: "#f97316" }
        - { label: "starting loss", value: "100", color: "#38bdf8" }
    sliders: [steps]
    outro: "After {steps} steps the loss is **{loss}**. If yours stays flat, stop and fix the loop before anything else."

  - kind: code
    kicker: Write it
    title: "A complete training loop"
    intro: "Fit y equals 2x with one weight. The same five steps appear in PyTorch."
    lang: python
    code: |
      xs, ys = [1.0, 2.0, 3.0], [2.0, 4.0, 6.0]
      w, lr = 0.0, 0.05

      def loss_fn(w):
          return sum((w * x - y) ** 2 for x, y in zip(xs, ys)) / len(xs)

      first = loss_fn(w)
      for epoch in range(100):
          grad = sum(2 * (w * x - y) * x for x, y in zip(xs, ys)) / len(xs)
          w = w - lr * grad

      assert loss_fn(w) < first / 1000
      assert abs(w - 2.0) < 1e-3
    note: "In PyTorch: forward, loss, `zero_grad()`, `backward()`, `step()`."

  - kind: lab
    kicker: Memorise
    title: "Debug in this order"
    intro: "Move down the list. Stop at the first failure."
    view:
      type: flow
      stages:
        - { label: "Data", note: "Look at real batches, labels and shapes.", color: "#38bdf8" }
        - { label: "Overfit one batch", note: "Loss should reach near zero.", color: "#1cd6ac" }
        - { label: "Learning rate", note: "Try a few values, factor of ten apart.", color: "#f97316" }
        - { label: "Then regularise", note: "Only once train loss behaves.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Loss is flat"
    question: "Loss stays exactly flat from step one. What is the likely cause?"
    options:
      - { text: "No gradient reaches the weights, or the optimiser is not stepping", correct: true, why: "Check zero_grad, backward, optimiser parameters and frozen layers." }
      - { text: "Dropout is too low", why: "That affects overfitting." }
      - { text: "The dataset is too big", why: "No." }
      - { text: "Batch norm is on", why: "Unlikely." }

  - kind: check
    kicker: Practice
    title: "NaN loss"
    question: "The loss suddenly becomes NaN. First suspects?"
    options:
      - { text: "Learning rate too high, or log of zero or divide by zero", correct: true, why: "Lower the rate, clip gradients, and check numerics." }
      - { text: "Too few epochs", why: "No." }
      - { text: "Too much data", why: "No." }
      - { text: "Dropout", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Changing many things at once.** Change one, then rerun."
      - "**Never looking at the data.** Most bugs live there."
      - "**Trusting the loss alone.** Also watch a real metric and examples."
    next: { label: "Back to all lessons", href: /learn }
