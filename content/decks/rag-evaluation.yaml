id: rag-evaluation
title: Evaluating RAG
order: 32
minutes: 9
params:
  - { id: k, label: "chunks returned (k)", min: 1, max: 10, step: 1, init: 3 }
derived:
  - { id: hits, expr: "min(1, ceil(max(k - 0, 0))) + min(1, ceil(max(k - 1, 0))) + min(1, ceil(max(k - 3, 0))) + min(1, ceil(max(k - 5, 0))) + min(1, ceil(max(k - 8, 0)))" }
  - { id: rec, expr: "hits / 5" }
  - { id: prec, expr: "hits / k" }
cards:
  - kind: story
    kicker: Start here
    title: Feels good is not a measurement
    body:
      - "You try three questions, the answers look fine, and you ship. Then a user asks something else and the system answers confidently and wrongly."
      - "A RAG system has two parts that can fail. **Retrieval** may fetch the wrong chunks. **Generation** may misuse the right ones. Test them **separately**."
    callout: "Find out which half is broken."

  - kind: lab
    kicker: See it first
    title: Was the right chunk in the top k
    intro: "You wrote five test questions and noted where the correct chunk ranked: 1st, 2nd, 4th, 6th and 9th. Return the top **k** chunks. A question counts as **found** if its right chunk is inside. **Drag k.**"
    view:
      type: bars
      max: 1
      items:
        - { label: "Q1: right chunk ranked 1st", value: "1", color: "#1cd6ac", on: "ceil(max(k - 0, 0))" }
        - { label: "Q2: right chunk ranked 2nd", value: "1", color: "#1cd6ac", on: "ceil(max(k - 1, 0))" }
        - { label: "Q3: right chunk ranked 4th", value: "1", color: "#1cd6ac", on: "ceil(max(k - 3, 0))" }
        - { label: "Q4: right chunk ranked 6th", value: "1", color: "#1cd6ac", on: "ceil(max(k - 5, 0))" }
        - { label: "Q5: right chunk ranked 9th", value: "1", color: "#1cd6ac", on: "ceil(max(k - 8, 0))" }
    also:
      type: bars
      max: 1
      items:
        - { label: "recall at k", value: rec, color: "#38bdf8" }
        - { label: "precision at k", value: prec, color: "#f59e0b" }
    sliders: [k]
    outro: "With k = {k}, **{hits}** of 5 questions were found, so recall is **{rec}**. Only {prec} of the returned chunks were the right ones."

  - kind: formula
    kicker: Read the formula
    title: Recall at k
    tex: "\\text{recall@}k = \\frac{\\text{questions found in top } k}{\\text{all questions}}"
    say: "Count how many test questions had their correct chunk among the top k results, then divide by the number of questions. One means retrieval never missed."
    verify:
      - { expr: "rec", equals: 0.4, tol: 0.001 }
      - { expr: "hits", equals: 2, tol: 0.01 }
      - { expr: "prec", equals: 0.6667, tol: 0.001 }
    symbols:
      - { tex: "k", means: "how many chunks the search returns to the model", value: k }
      - { tex: "\\text{found}", means: "questions whose correct chunk is among those k", value: hits }
      - { tex: "\\text{recall@}k", means: "the share of questions that retrieval got right", value: rec }

  - kind: code
    kicker: Read it
    title: A tiny evaluation loop
    intro: "A test set is just questions paired with the id of the chunk that answers them. Loop, search, and count."
    lang: python
    code: |
      tests = [
          {"question": "How long is the refund window?", "chunk_id": 12},
          {"question": "Who pays for return shipping?",  "chunk_id": 14},
      ]

      def recall_at_k(tests, k):
          found = 0
          for t in tests:
              ids = [c.id for c in search(t["question"], k)]
              found += t["chunk_id"] in ids
          return found / len(tests)
    note: "Run it after every change to chunking or search. A drop tells you the change hurt."

  - kind: check
    kicker: Check yourself
    title: Read the result
    question: "Recall at 3 is 0.4 but recall at 10 is 1.0. What does that suggest?"
    options:
      - { text: "The right chunk is retrieved but ranked too low", correct: true, why: "It appears by rank 10 but not rank 3, so ranking is the weak point." }
      - { text: "The search never finds the right chunk", why: "At k = 10 every question was found, so it does find them." }
      - { text: "The model writes bad answers", why: "Recall only measures retrieval. It says nothing about the written answer." }

  - kind: story
    kicker: The other half
    title: Check the answer too
    body:
      - "Once retrieval is good, check the answer. Is each claim **supported** by the retrieved chunks? Does the answer address the question?"
      - "Start with a small labelled set of 30 to 50 questions and review it by hand. That is enough to catch most problems."
    callout: "A small honest test set beats a big gut feeling."

  - kind: check
    kicker: Check yourself
    title: Pick the fix
    question: "Retrieval recall is high, yet answers contain made-up facts. Where should you look?"
    options:
      - { text: "The prompt and generation step", correct: true, why: "Retrieval found the right chunks, so the model is misusing them or ignoring them." }
      - { text: "The chunk size", why: "Recall is already high, so chunking is working." }
      - { text: "The embedding model", why: "It is retrieving well, so it is not the problem." }

  - kind: practice
    kicker: Your turn
    title: "Hit rate"
    intro: "Write `hit_rate(results, answers)`: the share of questions where the right chunk id is in that question's retrieved list. `results[i]` is a list of ids and `answers[i]` is the right id. Round to 2 places."
    entry: hit_rate
    starter: |
      def hit_rate(results, answers):
          pass
    solution: |
      def hit_rate(results, answers):
          hits = sum(1 for r, a in zip(results, answers) if a in r)
          return round(hits / len(answers), 2)
    tests:
      - { input: "[[[\"a\", \"b\"], [\"c\"]], [\"a\", \"d\"]]", expected: "0.5" }
      - { input: "[[[\"x\"]], [\"x\"]]", expected: "1.0" }
      - { input: "[[[], []], [\"a\", \"b\"]]", expected: "0.0" }
    hint: "Count the questions you got right and divide by the total."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Testing on questions you wrote while reading the chunks.** Real users phrase things differently."
      - "**Only judging the final answer.** You cannot tell whether search or the model failed."
      - "**Big k as a cure.** Returning ten chunks lifts recall but fills the prompt with noise and cost."
    next: { label: "Next: a Next.js chat page", href: /learn/nextjs-api-and-streaming-ui }
