id: numbers-and-functions
title: Numbers, functions and graphs
order: 1
minutes: 8
params:
  - { id: x, label: x, min: -4, max: 4, step: 0.5, init: 2 }
  - { id: m, label: "m (slope)", min: -2, max: 2, step: 0.5, init: 1.5 }
  - { id: b, label: "b (start)", min: -3, max: 3, step: 1, init: 1 }
derived:
  - { id: y, expr: m * x + b }
cards:
  - kind: story
    kicker: Start here
    title: A function is a machine
    body:
      - Think of a vending machine. You press a button (the **input**), and a snack drops out (the **output**). The same button always gives the same snack.
      - A **function** is exactly that, but with numbers. Put a number in, get one number out. Everything in machine learning is built from these machines chained together.
    callout: "Input goes in, output comes out. That is all the symbol $f(x)$ means: the machine f, fed the number x."

  - kind: lab
    kicker: See it first
    title: A graph is every input and its output
    intro: This machine multiplies the input by {m} and then adds {b}. The graph draws every possible input along the bottom and its output up the side. **Drag x** and watch the dot ride the line.
    view: { type: curve, fn: "m * t + b", min: -4, max: 4, yMin: -11, yMax: 11, point: x, xLabel: x, yLabel: y }
    sliders: [x]
    outro: "Input x = **{x}** gives output y = **{y}**."

  - kind: formula
    kicker: Read the formula
    title: The straight-line machine
    tex: "y = m\\,x + b"
    say: Multiply the input by m, then add b. That recipe draws a straight line. Two numbers, m and b, completely decide which line you get.
    verify:
      - { expr: "m * x + b", equals: 4, tol: 0.01 }
      - { expr: "1.5 * 2 + 1", equals: 4, tol: 0.01 }
    symbols:
      - { tex: x, means: the input you choose, value: x }
      - { tex: y, means: the output the machine returns, value: y }
      - { tex: m, means: "the slope: how much y rises when x goes up by 1", value: m }
      - { tex: b, means: "the start: the value of y when x is 0", value: b }

  - kind: lab
    kicker: Try it
    title: Reshape the line with m and b
    intro: Slide **m** to tilt the line and **b** to lift it. The dot stays at the same input, so watch its height change.
    view: { type: curve, fn: "m * t + b", min: -4, max: 4, yMin: -11, yMax: 11, point: x, slope: m, xLabel: x, yLabel: y }
    sliders: [m, b, x]
    outro: "At x = {x} this line gives y = {m}×{x} + {b} = **{y}**."

  - kind: check
    kicker: Check yourself
    title: Run the machine by hand
    question: "A machine is $f(x) = 3x - 2$. What does it output when the input is 4?"
    options:
      - { text: "10", correct: true, why: "Put 4 in for x: 3 × 4 − 2 = 12 − 2 = 10." }
      - { text: "14", why: "That adds 2 instead of subtracting it: 12 + 2." }
      - { text: "12", why: "That forgets the − 2 at the end." }

  - kind: story
    kicker: Why this matters
    title: A model is a function with knobs
    body:
      - A machine learning model is just a function whose numbers, like m and b, are not chosen by hand. The computer **learns** them from data.
      - The next lessons show how arrows and tables of numbers extend this idea, and later how those knobs get tuned.
    callout: Learning means finding good values for the knobs.

  - kind: practice
    kicker: Your turn
    title: "Write a function"
    intro: "Write `line(m, b, x)` returning `m * x + b`. Every model in this course is a function like this one, with more inputs."
    entry: line
    starter: |
      def line(m, b, x):
          pass
    solution: |
      def line(m, b, x):
          return m * x + b
    tests:
      - { input: "[2, 1, 3]", expected: "7" }
      - { input: "[0, 5, 9]", expected: "5" }
      - { input: "[-1, 0, 4]", expected: "-4" }
    hint: "Multiply the slope by x, then add the intercept."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**$f(x)$ is not f times x.** It reads “f of x” and means the machine f applied to x."
      - "**m and b do different jobs.** m tilts the line and b lifts it. Mixing them up is the most common line mistake."
      - "**A negative slope still counts.** m = −1 means the line falls as x grows."
    next: { label: "Next: vectors and the dot product", href: /learn/vectors-and-dot-product }
