id: "sd-sharding-consistent-hashing"
title: "Sharding and consistent hashing"
minutes: 14
order: 601
params:
  - { id: "n", label: "shards now", min: 2, max: 20, step: 1, init: 4 }
derived:
  - { id: "modmoved", expr: "100 * n / (n + 1)" }
  - { id: "ringmoved", expr: "100 / (n + 1)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "One database stops being enough"
    body:
      - "When one machine cannot hold or serve all the data, you **shard**: split the rows across machines by a key, such as user id."
      - "The hard part is adding a machine later. The way you map keys to shards decides how much data must move."
    callout: "A good sharding scheme moves as little data as possible when the cluster grows."
  - kind: "lab"
    kicker: "See it"
    title: "Adding one shard"
    intro: "With a simple rule, shard equals key mod shard count, nearly every key changes shard. A **hash ring** moves only a slice. **Drag the count.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "keys moved with mod", value: "modmoved", color: "#ef4444" }
        - { label: "keys moved with a hash ring", value: "ringmoved", color: "#1cd6ac" }
    sliders:
      - "n"
    outro: "Going from {n} to one more shard moves about **{modmoved} percent** of keys with mod, and only **{ringmoved} percent** with a ring."
  - kind: "code"
    kicker: "Write it"
    title: "A tiny hash ring"
    intro: "Each node owns the keys up to its position, going clockwise. Adding a node takes over part of one neighbour."
    lang: "python"
    code: |
      def lookup(ring, key):
          for pos, node in sorted(ring):
              if key <= pos:
                  return node
          return sorted(ring)[0][1]

      ring = [(25, "A"), (50, "B"), (75, "C")]
      assert lookup(ring, 30) == "B"
      assert lookup(ring, 80) == "A"
      assert lookup(ring, 10) == "A"

      bigger = ring + [(60, "D")]
      moved = sum(1 for k in range(100) if lookup(ring, k) != lookup(bigger, k))
      assert moved == 10

      mod_moved = sum(1 for k in range(100) if k % 3 != k % 4)
      assert mod_moved == 73
    note: "Real rings give each node many positions, so load spreads evenly."
  - kind: "lab"
    kicker: "Memorise"
    title: "What to shard on"
    intro: "The key decides everything."
    view:
      type: "flow"
      stages:
        - { label: "Even load", note: "A key that spreads traffic, such as user id.", color: "#1cd6ac" }
        - { label: "Hot keys", note: "A celebrity or a date can overload one shard.", color: "#ef4444" }
        - { label: "Query fit", note: "Queries that skip the key hit every shard.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why a ring"
    question: "What is the benefit of consistent hashing over key mod count?"
    options:
      - { text: "Adding a shard moves only a small slice of keys", correct: true, why: "Most keys keep their owner." }
      - { text: "It removes the need for replicas", why: "Replication is separate." }
      - { text: "It makes queries faster", why: "It helps rebalancing." }
      - { text: "It encrypts keys", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "A hot shard"
    question: "One shard gets ten times the traffic of others. A likely cause?"
    options:
      - { text: "A skewed key, such as one huge customer", correct: true, why: "Spread the hot key or split it." }
      - { text: "Too many replicas", why: "Not the cause." }
      - { text: "A slow network only", why: "Unlikely to hit one shard." }
      - { text: "Too many shards", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Sharding too early.** First add indexes, caches and read replicas."
      - "**Choosing a key that queries skip.** Every query then fans out."
      - "**Forgetting resharding cost.** Plan it before you need it."
    next: { label: "Next: replication and consistency", href: "/learn/sd-replication-consistency" }
