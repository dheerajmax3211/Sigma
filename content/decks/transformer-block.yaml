id: transformer-block
title: The transformer block
order: 22
minutes: 10
params:
  - { id: d, label: "width d", min: 256, max: 1024, step: 128, init: 768 }
  - { id: layers, label: "number of blocks", min: 1, max: 24, step: 1, init: 12 }
derived:
  - { id: attn, expr: "4 * d ^ 2 / 1000000" }
  - { id: ffn, expr: "8 * d ^ 2 / 1000000" }
  - { id: per, expr: "attn + ffn" }
  - { id: total, expr: "per * layers" }
  - { id: ta, expr: "attn * layers" }
  - { id: tf, expr: "ffn * layers" }
cards:
  - kind: story
    kicker: Start here
    title: One block, repeated
    body:
      - "A **transformer** is one small recipe stacked again and again. Learn the recipe once and you understand every large language model."
      - "Each block does two jobs. First the tokens **talk to each other**. Then each token **thinks alone** about what it heard."
    callout: "Talk, then think. Repeat."

  - kind: lab
    kicker: See it first
    title: Walk through one block
    intro: "Follow a sentence through a block, top to bottom. Attention mixes words together, the feed-forward step processes each word alone, and the **add and normalise** steps keep it stable. **Drag the sliders** to size the block."
    view:
      type: flow
      stages:
        - { label: "1. Tokens in", note: "each word is a list of {d} numbers", color: "#38bdf8" }
        - { label: "2. Attention", note: "words look at each other, using **{attn} million** weights", color: "#a78bfa" }
        - { label: "3. Add and normalise", note: "add the input back, then rescale the numbers", color: "#f59e0b" }
        - { label: "4. Feed-forward", note: "each word is processed alone, using **{ffn} million** weights", color: "#1cd6ac" }
        - { label: "5. Add and normalise", note: "again, then pass to the next of {layers} blocks", color: "#f59e0b" }
    sliders: [d, layers]
    outro: "One block holds about **{per} million** weights. With {layers} blocks the model has about **{total} million**."

  - kind: formula
    kicker: Read the formula
    title: Counting the weights
    tex: "P \\approx 12\\, L\\, d^{2}"
    say: "Each block needs about twelve times the square of the width in weights. Multiply by the number of blocks to get the size of the model."
    verify:
      - { expr: "attn", equals: 2.3593, tol: 0.01 }
      - { expr: "total", equals: 84.9347, tol: 0.05 }
      - { expr: "12 * layers * d ^ 2 / 1000000", equals: 84.9347, tol: 0.05 }
    symbols:
      - { tex: "P", means: "total number of weights in the blocks, in millions", value: total }
      - { tex: "L", means: "how many blocks are stacked", value: layers }
      - { tex: "d", means: "the width: how many numbers describe one token", value: d }
      - { tex: "12", means: "4 from attention (four d by d matrices) plus 8 from the feed-forward step" }

  - kind: check
    kicker: Check yourself
    title: What changes the size
    question: "Doubling the width d while keeping the number of blocks the same does what to the weights?"
    options:
      - { text: "Multiplies them by about 4", correct: true, why: "Weights grow with d squared, and doubling d makes d squared four times bigger." }
      - { text: "Doubles them", why: "That would be true if weights grew with d alone. They grow with d squared." }
      - { text: "Leaves them alone", why: "Width sets the size of every matrix, so the count changes." }

  - kind: lab
    kicker: Try it
    title: Where do the weights live
    intro: "Add blocks and widen the model. The feed-forward step is twice the size of attention, so **most of the model sits there**. **Drag both sliders.**"
    view:
      type: bars
      max: 310
      items:
        - { label: "attention, all blocks (millions)", value: ta, color: "#a78bfa" }
        - { label: "feed-forward, all blocks (millions)", value: tf, color: "#1cd6ac" }
    sliders: [d, layers]
    outro: "Attention holds **{ta} million** and feed-forward **{tf} million**. Feed-forward is always twice as big."

  - kind: story
    kicker: Why it is stable
    title: Residuals and normalising
    body:
      - "The **residual** step adds a block's input back to its output. If a block learns nothing useful, the signal still passes through, so deep stacks train."
      - "**Normalising** rescales each token's numbers to a steady size, so values do not blow up or fade away from block to block."
    callout: "Add the input back, then keep numbers steady."

  - kind: check
    kicker: Check yourself
    title: Name the job
    question: "Which part lets one token use information from other tokens?"
    options:
      - { text: "Attention", correct: true, why: "Attention is the only step that mixes information between tokens." }
      - { text: "Feed-forward", why: "It processes each token alone, with no view of the others." }
      - { text: "Normalising", why: "It only rescales numbers within one token." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Thinking attention does all the work.** Feed-forward holds most of the weights and does much of the processing."
      - "**Forgetting word order.** Attention ignores position on its own, so models add position information to the tokens."
      - "**Treating blocks as different.** Every block has the same shape. Only the learned numbers differ."
    next: { label: "Next: LLM APIs and tokens", href: /learn/llm-apis-and-tokens }
