id: dsa-queues-and-deques
title: "Queues and deques"
minutes: 13
order: 108
params:
  - { id: s, label: "step", min: 0, max: 4, step: 1, init: 0 }
  - { id: n, label: "items n", min: 10, max: 1000, step: 10, init: 500 }
cards:
  - kind: story
    kicker: Start here
    title: "A line at the shop"
    body:
      - "A **queue** is first in, first out. People join at the back and leave from the front, so order is fair."
      - "A **deque** (say 'deck') allows adding and removing at both ends. Python gives you `collections.deque` for both, with O(1) at each end."
    callout: "Clue words: level by level, in order of arrival, shortest steps, sliding maximum."

  - kind: lab
    kicker: See it
    title: "Join at the back, leave from the front"
    intro: "Watch four operations on a queue. **Drag the step.**"
    view:
      type: array
      cells: ["A", "B", "C", "", ""]
      frames:
        - ["A", "B", "C", "", ""]
        - ["A", "B", "C", "D", ""]
        - ["", "B", "C", "D", ""]
        - ["", "", "C", "D", ""]
        - ["", "", "C", "D", "E"]
      frame: s
      pointers:
        - { label: "front", at: "pick(s, 0, 0, 1, 2, 2)", color: "#1cd6ac" }
        - { label: "back", at: "pick(s, 2, 3, 3, 3, 4)", color: "#f97316" }
    sliders: [s]
    says:
      - "Queue holds A, B, C. A is at the front."
      - "**enqueue D**: D joins at the back."
      - "**dequeue**: A leaves from the front. B is now first."
      - "**dequeue**: B leaves. C is first."
      - "**enqueue E**: E joins the back. Order out will be C, D, E."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Use deque, not a list"
    intro: "`list.pop(0)` shifts every other item, which is O(n). `deque.popleft()` is O(1)."
    lang: python
    code: |
      from collections import deque

      q = deque()
      q.append("A"); q.append("B"); q.append("C")
      assert q.popleft() == "A"
      q.append("D")
      assert list(q) == ["B", "C", "D"]

      d = deque([1, 2, 3])
      d.appendleft(0)
      assert d.pop() == 3 and d[0] == 0
    note: "Rule: stack = list, queue = deque."

  - kind: lab
    kicker: What it costs
    title: "Removing from the front"
    intro: "A list moves every remaining item left. A deque only moves a pointer. **Drag n.**"
    view:
      type: bars
      max: 1000
      items:
        - { label: "list.pop(0)", value: n, color: "#ef4444" }
        - { label: "deque.popleft()", value: "1", color: "#1cd6ac" }
    sliders: [n]
    outro: "At {n} items, one list pop(0) shifts about {n} of them. Draining the whole list that way costs about {n} times {n}."

  - kind: code
    kicker: Level order
    title: "Process layer by layer"
    intro: "A queue naturally gives breadth: finish everything one step away before anything two steps away. Take `len(q)` items per round to separate levels."
    lang: python
    code: |
      from collections import deque

      def levels(adj, start):
          seen = {start}
          q = deque([start])
          out = []
          while q:
              out.append(sorted(q))
              for _ in range(len(q)):
                  u = q.popleft()
                  for v in adj[u]:
                      if v not in seen:
                          seen.add(v)
                          q.append(v)
          return out

      adj = {1: [2, 3], 2: [4], 3: [4], 4: []}
      assert levels(adj, 1) == [[1], [2, 3], [4]]
    note: "This is the heart of breadth first search, which you meet again in trees and graphs."

  - kind: code
    kicker: Deque as a window
    title: "Sliding window maximum"
    intro: "Keep indexes in a deque so their values fall from front to back. The front is always the current maximum."
    lang: python
    code: |
      from collections import deque

      def window_max(a, k):
          dq, out = deque(), []
          for i, x in enumerate(a):
              while dq and a[dq[-1]] <= x:
                  dq.pop()                  # smaller ones can never win
              dq.append(i)
              if dq[0] <= i - k:
                  dq.popleft()              # left the window
              if i >= k - 1:
                  out.append(a[dq[0]])
          return out

      assert window_max([1, 3, -1, -3, 5, 3, 6, 7], 3) == [3, 3, 5, 5, 6, 7]
    note: "Every index enters and leaves once, so O(n). A naive max per window is O(n times k)."

  - kind: check
    kicker: Your turn
    title: "Pick the structure"
    question: "Which problem needs a queue and not a stack?"
    options:
      - { text: "Undo history", why: "Last action first: a stack." }
      - { text: "Print jobs in arrival order", correct: true, why: "First in, first out." }
      - { text: "Matching brackets", why: "Most recent opener first: a stack." }
      - { text: "Reversing a string", why: "Last first: a stack." }

  - kind: check
    kicker: Practice
    title: "Queue from two stacks"
    question: "You build a queue from two stacks: push to stack A, and when you need the front, pour A into stack B. Why does B give the right order?"
    options:
      - { text: "Pouring reverses the order, so oldest is on top", correct: true, why: "Reversal turns last in first out into first in first out." }
      - { text: "Stacks sort items", why: "They only reverse when poured." }
      - { text: "B is a deque", why: "Both are plain stacks." }
      - { text: "It does not, it is a bug", why: "It is the standard answer." }

  - kind: practice
    kicker: Your turn
    title: "Sliding window maximum"
    intro: "Write `window_max(nums, k)` returning the maximum of every window of k numbers. Keep a deque of indices whose values are in decreasing order."
    entry: window_max
    starter: |
      def window_max(nums, k):
          pass
    solution: |
      def window_max(nums, k):
          from collections import deque
          q, out = deque(), []
          for i, x in enumerate(nums):
              while q and nums[q[-1]] <= x:
                  q.pop()
              q.append(i)
              if q[0] <= i - k:
                  q.popleft()
              if i >= k - 1:
                  out.append(nums[q[0]])
          return out
    tests:
      - { input: "[[1,3,-1,-3,5,3,6,7],3]", expected: "[3,3,5,5,6,7]" }
      - { input: "[[1],1]", expected: "[1]" }
    hint: "The front of the deque is always the current maximum. Drop smaller values from the back."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Using a list as a queue.** It works but pop(0) is slow. Use deque."
      - "**Indexing a deque in the middle.** `d[i]` is O(n) in the middle. Use a list if you need that."
      - "**Marking visited too late.** Mark when you enqueue, not when you dequeue, or items enter twice."
      - "**Empty queue.** `popleft` on empty raises an error. Guard with `while q`."
    next: { label: "Next: linked lists", href: /learn/dsa-linked-lists }
