id: dsa-bfs-and-dfs
title: "BFS and DFS"
minutes: 16
order: 118
params:
  - { id: s, label: "visited", min: 0, max: 6, step: 1, init: 0 }
  - { id: d, label: "distance steps", min: 1, max: 10, step: 1, init: 4 }
cards:
  - kind: story
    kicker: Start here
    title: "Two ways to explore a maze"
    body:
      - "**Breadth first search** (BFS) explores in rings: everything one step away, then everything two steps away, using a **queue**."
      - "**Depth first search** (DFS) picks one path and goes as far as it can, then backs up, using a **stack** or recursion. Both visit each node once and cost O(V + E)."
    callout: "Fewest steps in an unweighted graph? BFS. Explore everything, find paths, detect cycles? DFS."

  - kind: lab
    kicker: See it
    title: "BFS from A: ring by ring"
    intro: "A is visited first, then both neighbours B and C, then the next ring. **Drag the visited count.**"
    view:
      type: graph
      nodes:
        - { id: A, x: 10, y: 50 }
        - { id: B, x: 35, y: 15 }
        - { id: C, x: 35, y: 85 }
        - { id: D, x: 58, y: 50 }
        - { id: E, x: 80, y: 20 }
        - { id: F, x: 92, y: 70 }
      edges:
        - { a: A, b: B }
        - { a: A, b: C }
        - { a: B, b: D }
        - { a: C, b: D }
        - { a: D, b: E }
        - { a: E, b: F }
      order:
        - { node: A, label: 0 }
        - { node: B, from: A, label: 1 }
        - { node: C, from: A, label: 1 }
        - { node: D, from: B, label: 2 }
        - { node: E, from: D, label: 3 }
        - { node: F, from: E, label: 4 }
      step: s
    sliders: [s]
    says:
      - "Nothing visited. The queue will start with A."
      - "Visit A. Its neighbours B and C go into the queue. Labels show distance from A."
      - "Visit B (distance 1)."
      - "Visit C (distance 1). Both ring-1 nodes are done."
      - "Visit D (distance 2), reached through B."
      - "Visit E (distance 3)."
      - "Visit F (distance 4). BFS gave the **shortest** number of steps to every node."
    saysAt: s

  - kind: lab
    kicker: See it
    title: "DFS from A: dive first"
    intro: "Same graph, different order. DFS goes A, B, then deep to D before it ever looks at C. **Drag the visited count.**"
    view:
      type: graph
      nodes:
        - { id: A, x: 10, y: 50 }
        - { id: B, x: 35, y: 15 }
        - { id: C, x: 35, y: 85 }
        - { id: D, x: 58, y: 50 }
        - { id: E, x: 80, y: 20 }
        - { id: F, x: 92, y: 70 }
      edges:
        - { a: A, b: B }
        - { a: A, b: C }
        - { a: B, b: D }
        - { a: C, b: D }
        - { a: D, b: E }
        - { a: E, b: F }
      order:
        - { node: A, label: 1 }
        - { node: B, from: A, label: 2 }
        - { node: D, from: B, label: 3 }
        - { node: C, from: D, label: 4 }
        - { node: E, from: D, label: 5 }
        - { node: F, from: E, label: 6 }
      step: s
    sliders: [s]
    outro: "Labels show the visit order. DFS reached C by going down B then D, not straight from A. Same nodes, different story."

  - kind: code
    kicker: Write it
    title: "BFS and DFS"
    intro: "Same skeleton. A queue (`popleft`) gives BFS. A stack (`pop`) or recursion gives DFS. Mark nodes visited when you add them."
    lang: python
    code: |
      from collections import deque

      g = {"A": ["B", "C"], "B": ["A", "D"], "C": ["A", "D"],
           "D": ["B", "C", "E"], "E": ["D", "F"], "F": ["E"]}

      def bfs(g, start):
          seen, q, order = {start}, deque([start]), []
          while q:
              u = q.popleft()
              order.append(u)
              for v in g[u]:
                  if v not in seen:
                      seen.add(v)
                      q.append(v)
          return order

      def dfs(g, u, seen=None, order=None):
          seen = seen if seen is not None else set()
          order = order if order is not None else []
          seen.add(u)
          order.append(u)
          for v in g[u]:
              if v not in seen:
                  dfs(g, v, seen, order)
          return order

      assert bfs(g, "A") == ["A", "B", "C", "D", "E", "F"]
      assert dfs(g, "A") == ["A", "B", "D", "C", "E", "F"]
    note: "Both O(V + E). BFS memory is one ring, DFS memory is the path depth."

  - kind: code
    kicker: Shortest path
    title: "Fewest steps from start to end"
    intro: "BFS finds the first time each node is reached, which is the fewest edges. Store the distance with each queue entry."
    lang: python
    code: |
      from collections import deque

      def shortest(g, start, goal):
          q, seen = deque([(start, 0)]), {start}
          while q:
              u, d = q.popleft()
              if u == goal:
                  return d
              for v in g[u]:
                  if v not in seen:
                      seen.add(v)
                      q.append((v, d + 1))
          return -1

      g = {"A": ["B", "C"], "B": ["A", "D"], "C": ["A", "D"],
           "D": ["B", "C", "E"], "E": ["D", "F"], "F": ["E"], "Z": []}
      assert shortest(g, "A", "F") == 4
      assert shortest(g, "A", "A") == 0
      assert shortest(g, "A", "Z") == -1
    note: "Returns -1 when no path exists. Works only when every edge costs the same."

  - kind: lab
    kicker: Why queues
    title: "The ring grows"
    intro: "On a grid, each BFS ring is bigger than the last. The number of cells within d steps is about 2d squared. **Drag the steps.**"
    view:
      type: bars
      max: 220
      items:
        - { label: "cells within d steps", value: "2 * d * d + 2 * d + 1", color: "#1cd6ac" }
        - { label: "steps d", value: d, color: "#38bdf8" }
    sliders: [d]
    outro: "Within {d} steps there are up to 2d² + 2d + 1 cells, so the ring grows quickly. BFS on big grids needs a big queue."

  - kind: check
    kicker: Your turn
    title: "BFS or DFS?"
    question: "Find the minimum number of moves to solve a sliding puzzle. Every move costs one. Which search?"
    options:
      - { text: "BFS", correct: true, why: "All moves cost the same, so the first time you reach the goal is the fewest moves." }
      - { text: "DFS", why: "It may find a very long solution first." }
      - { text: "Binary search", why: "No sorted order here." }
      - { text: "Sorting", why: "Not a search." }

  - kind: check
    kicker: Practice
    title: "Cycle in a directed graph"
    question: "To detect a cycle in a directed graph with DFS, what must you track?"
    options:
      - { text: "Nodes currently on the path, not only visited ones", correct: true, why: "Meeting a node that is on the current path means a loop. A visited node on another branch is fine." }
      - { text: "Only a visited set", why: "It would flag shared descendants as cycles." }
      - { text: "Edge weights", why: "Unrelated to loops." }
      - { text: "The graph's size", why: "Does not show loops." }

  - kind: practice
    kicker: Your turn
    title: "Shortest hops"
    intro: "Write `hops(n, edges, start, goal)` returning the fewest edges from start to goal in an undirected graph, or -1 if unreachable. BFS finds it."
    entry: hops
    starter: |
      def hops(n, edges, start, goal):
          pass
    solution: |
      def hops(n, edges, start, goal):
          from collections import deque
          g = [[] for _ in range(n)]
          for a, b in edges:
              g[a].append(b); g[b].append(a)
          seen = {start: 0}
          q = deque([start])
          while q:
              u = q.popleft()
              if u == goal:
                  return seen[u]
              for v in g[u]:
                  if v not in seen:
                      seen[v] = seen[u] + 1
                      q.append(v)
          return -1
    tests:
      - { input: "[4,[[0,1],[1,2],[2,3]],0,3]", expected: "3" }
      - { input: "[3,[[0,1]],0,2]", expected: "-1" }
      - { input: "[2,[],1,1]", expected: "0" }
    hint: "Use a queue. Record how far each node is when you first see it."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Marking visited when you pop.** Mark when you push, or a node enters the queue many times."
      - "**Using BFS on weighted edges.** It counts steps, not cost. Use Dijkstra."
      - "**Recursion depth.** DFS on a 100,000 node chain crashes Python. Use an explicit stack."
      - "**Forgetting disconnected parts.** Loop over every start node if you need everything."
    next: { label: "Next: shortest paths with Dijkstra", href: /learn/dsa-shortest-paths-dijkstra }
