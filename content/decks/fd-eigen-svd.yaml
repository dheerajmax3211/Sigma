id: "fd-eigen-svd"
title: "Eigenvectors and SVD"
minutes: 14
order: 703
params:
  - { id: "a", label: "diagonal value", min: 0, max: 5, step: 0.5, init: 2 }
  - { id: "b", label: "off-diagonal value", min: 0, max: 5, step: 0.5, init: 1 }
derived:
  - { id: "e1", expr: "a + b" }
  - { id: "e2", expr: "abs(a - b)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Directions a matrix only stretches"
    body:
      - "Most vectors change direction when a matrix acts on them. Some special directions only get **stretched**. These are **eigenvectors**, and the stretch factor is the **eigenvalue**."
      - "**SVD** extends this to any matrix. It writes a matrix as rotate, stretch along axes, rotate. Keep only the biggest stretches and you get the best low-rank copy. This is the idea behind PCA and LoRA."
    callout: "Big stretches carry the information. Small ones are often noise."
  - kind: "lab"
    kicker: "See it"
    title: "Two stretches"
    intro: "For the matrix with a on the diagonal and b off it, the two stretches are a plus b and a minus b. **Drag both.**"
    view:
      type: "bars"
      max: 10
      items:
        - { label: "stretch along the first direction", value: "e1", color: "#1cd6ac" }
        - { label: "stretch along the second direction", value: "e2", color: "#f97316" }
    sliders:
      - "a"
      - "b"
    outro: "With a {a} and b {b}, the stretches are **{e1}** and **{e2}**. When they are very different, one direction dominates and a low-rank copy works well."
  - kind: "code"
    kicker: "Write it"
    title: "Power iteration"
    intro: "Apply the matrix again and again. The vector turns toward the biggest stretch."
    lang: "python"
    code: |
      import math

      A = [[2, 1], [1, 2]]

      def mul(A, v):
          return [sum(a * b for a, b in zip(row, v)) for row in A]

      v = [1.0, 0.0]
      for _ in range(50):
          w = mul(A, v)
          n = math.sqrt(sum(x * x for x in w))
          v = [x / n for x in w]

      lam = sum(a * b for a, b in zip(v, mul(A, v)))
      assert abs(lam - 3) < 1e-6
      assert abs(v[0] - v[1]) < 1e-6
    note: "The eigenvalues here are 3 and 1. The direction (1, 1) is stretched threefold."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where it shows up"
    intro: "Three places you will meet it."
    view:
      type: "flow"
      stages:
        - { label: "PCA", note: "Eigenvectors of the covariance matrix are the new axes.", color: "#38bdf8" }
        - { label: "Low-rank", note: "Keep the top singular values to compress a weight matrix.", color: "#1cd6ac" }
        - { label: "LoRA", note: "Fine-tuning adds a low-rank change to a frozen matrix.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Eigenvector"
    question: "What is special about an eigenvector?"
    options:
      - { text: "The matrix only stretches it, without turning it", correct: true, why: "The direction stays the same." }
      - { text: "It has length zero", why: "No." }
      - { text: "It is always the first column", why: "No." }
      - { text: "It is random", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Rank"
    question: "Most singular values of a weight matrix are tiny. What does that suggest?"
    options:
      - { text: "A low-rank approximation will lose little", correct: true, why: "The big stretches carry nearly everything." }
      - { text: "The matrix is broken", why: "No." }
      - { text: "It cannot be trained", why: "No." }
      - { text: "It must be square", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Assuming real eigenvalues for any matrix.** Symmetric matrices are safe."
      - "**Keeping too few components.** Check how much you lose."
      - "**Forgetting that scaling features changes PCA.**"
    next: { label: "Next: probability distributions", href: "/learn/fd-distributions" }
