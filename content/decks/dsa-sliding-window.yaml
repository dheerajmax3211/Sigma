id: dsa-sliding-window
title: "Sliding window"
minutes: 15
order: 105
params:
  - { id: s, label: "step", min: 0, max: 3, step: 1, init: 0 }
  - { id: k, label: "window size k", min: 1, max: 20, step: 1, init: 3 }
  - { id: n, label: "items n", min: 20, max: 1000, step: 10, init: 200 }
derived:
  - { id: sum, expr: "pick(s, 8, 7, 9, 6)" }
  - { id: best, expr: "pick(s, 8, 8, 9, 9)" }
  - { id: end, expr: "s + 2" }
cards:
  - kind: story
    kicker: Start here
    title: "A frame sliding over a row"
    body:
      - "Many problems ask about a **contiguous run** of items: the best 3 days, the longest stretch without a repeat."
      - "Instead of re-adding every run from scratch, keep a frame and slide it one step. Add the new item on the right, remove the old item on the left."
    callout: "Clue words: subarray, substring, contiguous, window, longest, shortest, k items in a row."

  - kind: lab
    kicker: See it
    title: "Best sum of 3 in a row"
    intro: "The window covers 3 items. Slide it one step at a time and update the sum with just two operations. **Drag the step.**"
    view:
      type: array
      cells: [2, 1, 5, 1, 3, 2]
      windows:
        - { from: s, to: end, color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Window covers indexes 0 to 2. Sum is {sum}. Best so far: {best}."
      - "Slide: add the 1 on the right, drop the 2 on the left. Sum is {sum}. Best so far: {best}."
      - "Slide: add 3, drop 1. Sum is {sum}, a new best. Best so far: {best}."
      - "Last slide. Sum is {sum}. The best stays {best}."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Max sum of k in a row"
    intro: "Compute the first window once, then for each step add the new item and subtract the one that left."
    lang: python
    code: |
      def best_window(a, k):
          cur = sum(a[:k])
          best = cur
          for i in range(k, len(a)):
              cur += a[i] - a[i - k]    # add right, drop left
              best = max(best, cur)
          return best

      assert best_window([2, 1, 5, 1, 3, 2], 3) == 9
      assert best_window([5], 1) == 5
    note: "O(n) time. Re-adding each window from scratch would be O(n times k)."

  - kind: lab
    kicker: What it saves
    title: "Work per slide"
    intro: "Recomputing a window of size k costs k steps each time. Sliding costs 2. **Drag k.**"
    view:
      type: bars
      max: 20
      items:
        - { label: "recompute each window", value: k, color: "#ef4444" }
        - { label: "slide: add one, drop one", value: "2", color: "#1cd6ac" }
    sliders: [k]
    outro: "With k = {k}, recomputing does {k} additions per window. Sliding always does 2."

  - kind: check
    kicker: Your turn
    title: "Fixed or variable?"
    question: "Longest substring with no repeated letter. The window size is not given. What kind of window is this?"
    options:
      - { text: "Fixed size", why: "The size is exactly what you are searching for." }
      - { text: "Variable size", correct: true, why: "Grow on the right until a repeat appears, then shrink from the left." }
      - { text: "Not a window problem", why: "It is a contiguous run, so it is." }
      - { text: "Needs sorting", why: "Sorting would destroy the order of the characters." }

  - kind: code
    kicker: Write it
    title: "Variable window: longest unique substring"
    intro: "Grow right. When a letter repeats, move the left edge past its previous spot. A dict remembers the last index of each letter."
    lang: python
    code: |
      def longest_unique(s):
          last = {}
          left = best = 0
          for right, ch in enumerate(s):
              if ch in last and last[ch] >= left:
                  left = last[ch] + 1       # jump past the repeat
              last[ch] = right
              best = max(best, right - left + 1)
          return best

      assert longest_unique("abcabcbb") == 3
      assert longest_unique("bbbb") == 1
      assert longest_unique("") == 0
    note: "Each index is visited once by right and at most once by left, so the total is O(n)."

  - kind: code
    kicker: Shrinking window
    title: "Smallest run with sum at least target"
    intro: "Grow until the sum is big enough, then shrink from the left while it stays big enough. Record the length each time."
    lang: python
    code: |
      def shortest(a, target):
          left = total = 0
          best = len(a) + 1
          for right, x in enumerate(a):
              total += x
              while total >= target:
                  best = min(best, right - left + 1)
                  total -= a[left]
                  left += 1
          return 0 if best == len(a) + 1 else best

      assert shortest([2, 3, 1, 2, 4, 3], 7) == 2
      assert shortest([1, 1], 100) == 0
    note: "The inner while looks nested but left only moves forward. Still O(n). This needs non-negative numbers."

  - kind: check
    kicker: Practice
    title: "Spot the cost"
    question: "A window loop re-sums `sum(a[i:i+k])` for every i. What is the total time?"
    options:
      - { text: "O(n)", why: "That would need the add-one-drop-one update." }
      - { text: "O(n times k)", correct: true, why: "Each of about n windows costs k to sum." }
      - { text: "O(log n)", why: "Nothing is halved." }
      - { text: "O(1)", why: "The loop runs n times." }

  - kind: practice
    kicker: Your turn
    title: "Best window sum"
    intro: "Write `max_window(nums, k)` returning the largest sum of any k neighbouring numbers. Slide the window: add the new number, drop the old one."
    entry: max_window
    starter: |
      def max_window(nums, k):
          pass
    solution: |
      def max_window(nums, k):
          cur = sum(nums[:k])
          best = cur
          for i in range(k, len(nums)):
              cur += nums[i] - nums[i - k]
              best = max(best, cur)
          return best
    tests:
      - { input: "[[1,4,2,10,2,3,1,0,20],4]", expected: "24" }
      - { input: "[[5],1]", expected: "5" }
      - { input: "[[-1,-2,-3],2]", expected: "-3" }
    hint: "Do not re-add k numbers each time. Update the sum by one in, one out."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Shrinking with `if`.** When many items must leave, use `while`."
      - "**Off by one in the length.** A window from left to right has `right - left + 1` items."
      - "**Negative numbers.** The shrink-while-big trick fails because dropping an item can raise the sum."
      - "**Forgetting the first window.** For fixed size, fill it before you start sliding."
    next: { label: "Next: prefix sums", href: /learn/dsa-prefix-sums }
