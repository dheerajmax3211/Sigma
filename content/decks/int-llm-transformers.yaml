id: int-llm-transformers
title: "Interview Q&A: transformers and attention"
minutes: 14
order: 209
params:
  - { id: n, label: "context tokens", min: 100, max: 100000, step: 100, init: 4000 }
derived:
  - { id: thousand, expr: "n / 1000" }
  - { id: pairs, expr: "n * n / 1000000" }
cards:
  - kind: story
    kicker: Start here
    title: "Explain attention to a friend"
    body:
      - "'How does a transformer work?' is almost guaranteed for LLM roles. A clear story beats a pile of formulas."
      - "Attention lets each word **look at every other word** and decide how much each one matters, then mix their information into a new representation."
    callout: "Say it in three beats: query asks, keys answer, values carry the content."

  - kind: lab
    kicker: See it
    title: "Query, key and value"
    intro: "Every token makes all three. The steps repeat in every layer."
    view:
      type: flow
      stages:
        - { label: "Query", note: "What this token is looking for.", color: "#38bdf8" }
        - { label: "Key", note: "What each token offers to be matched on.", color: "#1cd6ac" }
        - { label: "Score", note: "Query times key, scaled, then softmax into weights.", color: "#f97316" }
        - { label: "Value mix", note: "Weighted sum of the values. This is the output.", color: "#a78bfa" }

  - kind: code
    kicker: Write it
    title: "Attention for one token"
    intro: "Small enough to type in an interview. Scores are dot products divided by the square root of the vector size."
    lang: python
    code: |
      import math

      def attention(q, keys, values):
          d = len(q)
          scores = [sum(a * b for a, b in zip(q, k)) / math.sqrt(d) for k in keys]
          m = max(scores)
          es = [math.exp(s - m) for s in scores]
          w = [e / sum(es) for e in es]                  # softmax weights
          out = [sum(w[i] * values[i][j] for i in range(len(values)))
                 for j in range(len(values[0]))]
          return w, out

      w, out = attention([1, 0], [[1, 0], [0, 1]], [[10, 0], [0, 10]])
      assert abs(sum(w) - 1) < 1e-12 and w[0] > w[1]
      assert out[0] > out[1] and abs(out[0] + out[1] - 10) < 1e-9
    note: "The scale by the square root stops large dot products from making softmax too spiky."

  - kind: lab
    kicker: See it
    title: "The cost of long context"
    intro: "Every token attends to every token, so the work grows with n times n. **Drag the context length.**"
    view:
      type: bars
      max: 10000
      items:
        - { label: "tokens (thousands)", value: thousand, color: "#38bdf8" }
        - { label: "token pairs (millions)", value: pairs, color: "#ef4444" }
    sliders: [n]
    outro: "{n} tokens means **{pairs} million** pairs per layer per head. Doubling the length quadruples it."

  - kind: lab
    kicker: Memorise
    title: "Follow-ups to expect"
    intro: "Have one sentence ready for each."
    view:
      type: flow
      stages:
        - { label: "Why multi-head?", note: "Different heads can track different relations at once.", color: "#38bdf8" }
        - { label: "Why positions?", note: "Attention ignores order, so position info is added.", color: "#1cd6ac" }
        - { label: "Causal mask", note: "A token may not look at later tokens when generating.", color: "#f97316" }
        - { label: "KV cache", note: "Reuse past keys and values to make generation faster.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Why the mask?"
    question: "Why does a text-generating model use a causal mask?"
    options:
      - { text: "So a token cannot see future tokens it is supposed to predict", correct: true, why: "Without it, training would let the model cheat by reading the answer." }
      - { text: "To save memory", why: "It does not mainly save memory." }
      - { text: "To make attention linear", why: "It stays quadratic." }
      - { text: "To remove positions", why: "Positions are separate." }

  - kind: check
    kicker: Practice
    title: "Longer context"
    question: "You double the prompt length. Roughly how does attention compute per layer change?"
    options:
      - { text: "It grows about four times", correct: true, why: "Every token attends to every token, so cost scales with n squared." }
      - { text: "It doubles", why: "That would be linear." }
      - { text: "It stays the same", why: "More tokens means more pairs." }
      - { text: "It halves", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Starting with matrices.** Begin with the idea, then the maths."
      - "**Forgetting positions.** Attention alone cannot tell word order."
      - "**Saying 'it reads left to right'.** It processes all tokens in parallel during training."
      - "**Ignoring cost.** Mention quadratic cost and the KV cache."
    next: { label: "Next: prompting, RAG or fine-tuning", href: /learn/int-llm-prompt-rag-finetune }
