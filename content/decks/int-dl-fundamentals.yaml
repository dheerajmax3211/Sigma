id: int-dl-fundamentals
title: "Interview Q&A: deep learning fundamentals"
minutes: 15
order: 208
params:
  - { id: L, label: "layers", min: 1, max: 20, step: 1, init: 5 }
derived:
  - { id: sig, expr: "0.25 ^ L" }
  - { id: zeros, expr: "round(L * 0.6)" }
cards:
  - kind: story
    kicker: Start here
    title: "Questions that probe the engine"
    body:
      - "Expect: 'What is backpropagation?', 'Why do gradients vanish?', 'What does dropout do?', 'Adam versus SGD?'. Short, clear answers win."
      - "Each answer should say **what it is**, **why it exists** and **when it breaks**."
    callout: "If you can draw the forward pass and the backward pass on a whiteboard, you are ahead of most candidates."

  - kind: lab
    kicker: See it
    title: "Backpropagation in one loop"
    intro: "Every training step repeats these four stages."
    view:
      type: flow
      stages:
        - { label: "Forward", note: "Inputs flow through layers to a prediction.", color: "#38bdf8" }
        - { label: "Loss", note: "Compare the prediction to the truth.", color: "#ef4444" }
        - { label: "Backward", note: "Chain rule gives each weight's gradient.", color: "#f97316" }
        - { label: "Update", note: "Step each weight a little against its gradient.", color: "#1cd6ac" }

  - kind: lab
    kicker: See it
    title: "Why gradients vanish"
    intro: "A sigmoid passes at most 0.25 of the gradient back through each layer. Multiply that over many layers. ReLU passes 1 where active. **Drag the layers.**"
    view:
      type: bars
      max: 1
      items:
        - { label: "gradient left (sigmoid)", value: sig, color: "#ef4444" }
        - { label: "gradient left (ReLU)", value: "1", color: "#1cd6ac" }
    sliders: [L]
    outro: "After {L} layers the sigmoid gradient has about **{zeros} zeros** after the decimal point. Early layers barely learn."

  - kind: code
    kicker: Check it
    title: "Numbers worth knowing"
    intro: "Small facts you can verify, so you can state them confidently."
    lang: python
    code: |
      import math

      def sigmoid(x):
          return 1 / (1 + math.exp(-x))

      def softmax(xs):
          m = max(xs)                          # subtract max for stability
          es = [math.exp(x - m) for x in xs]
          s = sum(es)
          return [e / s for e in es]

      # slope of sigmoid is s * (1 - s), largest at x = 0
      s0 = sigmoid(0)
      assert s0 * (1 - s0) == 0.25
      p = softmax([2.0, 1.0, 0.1])
      assert abs(sum(p) - 1) < 1e-12 and p[0] > p[1] > p[2]
      assert softmax([1000.0, 1000.0]) == [0.5, 0.5]    # no overflow
    note: "Subtracting the max does not change softmax but prevents exp from overflowing."

  - kind: lab
    kicker: Memorise
    title: "One-line answers"
    intro: "Say these, then add one detail."
    view:
      type: flow
      stages:
        - { label: "Dropout", note: "Randomly zero units in training so units cannot rely on each other.", color: "#38bdf8" }
        - { label: "Batch norm", note: "Normalise layer inputs per batch. Steadier, faster training.", color: "#1cd6ac" }
        - { label: "Adam", note: "SGD plus momentum and per-weight step sizes. Strong default.", color: "#f97316" }
        - { label: "Weight decay", note: "Penalise large weights to reduce overfitting.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Choose the activation"
    question: "A deep network trains very slowly, with tiny gradients in early layers. Which change most directly helps?"
    options:
      - { text: "Switch sigmoid activations to ReLU", correct: true, why: "ReLU keeps gradients from shrinking by 0.25 per layer." }
      - { text: "Add more sigmoid layers", why: "That worsens the vanishing." }
      - { text: "Lower the number of data points", why: "Unrelated to gradients." }
      - { text: "Remove the loss function", why: "No loss, no learning." }

  - kind: check
    kicker: Practice
    title: "At test time"
    question: "What happens to dropout when you run the trained model on new data?"
    options:
      - { text: "It is turned off and all units are used", correct: true, why: "Dropout is only for training. Frameworks scale activations so outputs stay consistent." }
      - { text: "It stays on", why: "Predictions would be noisy." }
      - { text: "It doubles", why: "No such rule." }
      - { text: "It is turned on harder", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Reciting without intuition.** Add one sentence on why it helps."
      - "**Forgetting train versus eval mode.** Dropout and batch norm behave differently."
      - "**Claiming Adam always wins.** SGD with momentum often generalises well."
      - "**Skipping initial values.** Poor initialisation can stall training."
    next: { label: "Next: transformers and attention", href: /learn/int-llm-transformers }
