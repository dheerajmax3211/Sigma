id: dl-autograd-engine
title: "Autograd: how frameworks compute gradients"
minutes: 15
order: 402
params:
  - { id: a, label: "a", min: -5, max: 5, step: 0.5, init: 2 }
  - { id: b, label: "b", min: -5, max: 5, step: 0.5, init: 3 }
derived:
  - { id: c, expr: "a * b + a" }
  - { id: dca, expr: "b + 1" }
  - { id: dcb, expr: "a" }
cards:
  - kind: story
    kicker: Start here
    title: "You never write backprop by hand"
    body:
      - "PyTorch records every operation as a **graph**. Each node remembers how to pass a gradient back to its inputs."
      - "Calling `backward()` walks the graph in reverse and applies the **chain rule** at every node. That is all autograd is."
    callout: "Forward builds the graph. Backward walks it."

  - kind: lab
    kicker: See it
    title: "A graph for c = a times b plus a"
    intro: "The value of c and how much it moves when each input moves. **Drag a and b.**"
    view:
      type: bars
      max: 25
      items:
        - { label: "c", value: "abs(c)", color: "#38bdf8" }
        - { label: "gradient of c with respect to a", value: "abs(dca)", color: "#1cd6ac" }
        - { label: "gradient of c with respect to b", value: "abs(dcb)", color: "#f97316" }
    sliders: [a, b]
    outro: "c is **{c}**. Nudge a and c moves by {dca} per unit. Nudge b and it moves by {dcb}. Note a is used twice, so its gradients add."

  - kind: code
    kicker: Write it
    title: "A 25 line autograd"
    intro: "Each value stores its inputs and a small function that passes gradients back. The backward pass visits nodes in reverse order."
    lang: python
    code: |
      class V:
          def __init__(self, d, kids=()):
              self.d, self.g, self.kids = d, 0.0, kids
              self.back = lambda: None

          def __add__(self, o):
              o = o if isinstance(o, V) else V(o)
              out = V(self.d + o.d, (self, o))
              def back():
                  self.g += out.g
                  o.g += out.g
              out.back = back
              return out

          def __mul__(self, o):
              o = o if isinstance(o, V) else V(o)
              out = V(self.d * o.d, (self, o))
              def back():
                  self.g += o.d * out.g
                  o.g += self.d * out.g
              out.back = back
              return out

          def backward(self):
              order, seen = [], set()
              def visit(n):
                  if id(n) not in seen:
                      seen.add(id(n))
                      for k in n.kids:
                          visit(k)
                      order.append(n)
              visit(self)
              self.g = 1.0
              for n in reversed(order):
                  n.back()

      a, b = V(2.0), V(3.0)
      c = a * b + a
      c.backward()
      assert c.d == 8.0
      assert a.g == 4.0 and b.g == 2.0
    note: "Gradients use += because a value used twice receives a gradient from each use."

  - kind: lab
    kicker: See it
    title: "What PyTorch adds"
    intro: "The idea is the same. The library adds speed and coverage."
    view:
      type: flow
      stages:
        - { label: "Tensors", note: "Whole arrays instead of single numbers.", color: "#38bdf8" }
        - { label: "Many ops", note: "Matmul, softmax, convolution all know their backward step.", color: "#1cd6ac" }
        - { label: "GPU", note: "The same graph runs on fast hardware.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Why +="
    question: "Why does the backward step add into the gradient rather than assign it?"
    options:
      - { text: "A value can feed several operations, and each contributes a gradient", correct: true, why: "In c equals a times b plus a, the value a is used twice." }
      - { text: "To make the code shorter", why: "It is about correctness." }
      - { text: "Because gradients are always positive", why: "They can be negative." }
      - { text: "To avoid softmax", why: "No." }

  - kind: check
    kicker: Practice
    title: "Forgetting to reset"
    question: "In PyTorch you run two training steps without clearing gradients. What happens?"
    options:
      - { text: "The new gradients are added to the old ones", correct: true, why: "Gradients accumulate, so call `zero_grad()` each step." }
      - { text: "They are replaced automatically", why: "They are not." }
      - { text: "Training stops", why: "No error is raised." }
      - { text: "The learning rate doubles", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Not zeroing gradients.** They accumulate."
      - "**Using `.item()` mid-graph.** It cuts the graph."
      - "**Calling backward twice.** The graph is freed after the first call."
    next: { label: "Next: optimisers", href: /learn/dl-optimisers }
