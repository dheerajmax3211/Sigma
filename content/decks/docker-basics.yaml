id: docker-basics
title: Docker basics
order: 39
minutes: 9
params:
  - { id: base, label: "base layer (MB)", min: 50, max: 500, step: 50, init: 150 }
  - { id: deps, label: "installed libraries (MB)", min: 20, max: 500, step: 20, init: 200 }
  - { id: runs, label: "copies running", min: 1, max: 8, step: 1, init: 3 }
derived:
  - { id: img, expr: "base + deps + 10" }
  - { id: naive, expr: "runs * img" }
  - { id: shared, expr: "img + runs * 5" }
cards:
  - kind: story
    kicker: Start here
    title: It works on my machine
    body:
      - "Your app runs on your laptop but fails on the server. The server has a different Python, or a missing library."
      - "**Docker** packs the app and everything it needs into an **image**. Running that image gives a **container**: the same app, the same way, anywhere."
    callout: "Image is the recipe. Container is the meal."

  - kind: lab
    kicker: See it first
    title: From recipe to running copies
    intro: "A **Dockerfile** lists the steps. Building it makes an image made of layers. Many containers can share one image on disk. Sizes are illustrative. **Drag the sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. Dockerfile", note: "text steps: start from a base, add libraries, copy code", color: "#38bdf8" }
        - { label: "2. Build", note: "each step becomes a layer, **{img} MB** in total", color: "#a78bfa" }
        - { label: "3. Image", note: "a frozen, read-only package you can ship", color: "#f59e0b" }
        - { label: "4. Containers", note: "**{runs}** running copies started from that image", color: "#1cd6ac" }
    also:
      type: bars
      max: 9000
      items:
        - { label: "disk if every copy held its own image (MB)", value: naive, color: "#ef4444" }
        - { label: "disk when copies share the image (MB)", value: shared, color: "#1cd6ac" }
    sliders: [base, deps, runs]
    outro: "The image is **{img} MB**. {runs} copies would need **{naive} MB** if separate, but only about **{shared} MB** when they share the image."

  - kind: formula
    kicker: Read the formula
    title: Image size
    tex: "S = S_{\\text{base}} + S_{\\text{libs}} + S_{\\text{app}}"
    say: "An image is the sum of its layers. The base system, the installed libraries and your own code each add their share."
    verify:
      - { expr: "img", equals: 360, tol: 0.01 }
      - { expr: "naive", equals: 1080, tol: 0.01 }
      - { expr: "shared", equals: 375, tol: 0.01 }
    symbols:
      - { tex: "S", means: "total image size in megabytes", value: img }
      - { tex: "S_{\\text{base}}", means: "the operating system layer you start from", value: base }
      - { tex: "S_{\\text{libs}}", means: "libraries installed by the build", value: deps }
      - { tex: "S_{\\text{app}}", means: "your own code, assumed 10 MB here", value: "10" }

  - kind: code
    kicker: Read it
    title: A Dockerfile
    intro: "Each line is a step. Copy the dependency list first, so Docker can reuse that layer when only your code changes."
    lang: dockerfile
    code: |
      FROM python:3.12-slim
      WORKDIR /app

      COPY requirements.txt .
      RUN pip install -r requirements.txt

      COPY . .
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    note: "Order matters. Steps that rarely change go first, so rebuilds stay fast."

  - kind: code
    kicker: Read it
    title: Build and run
    intro: "`build` makes the image and gives it a name. `run` starts a container. The `-p` flag connects a port on your machine to a port inside."
    lang: bash
    code: |
      docker build -t myapp .
      docker run -p 8080:8000 myapp
      # now open http://localhost:8080
    note: "The left number is your machine. The right one is inside the container."

  - kind: check
    kicker: Check yourself
    title: Image or container
    question: "Which statement is correct?"
    options:
      - { text: "A container is a running copy of an image", correct: true, why: "The image is the frozen package. Each container is a live instance of it." }
      - { text: "An image is a running program", why: "That describes a container. An image is only the stored recipe." }
      - { text: "Each container needs its own full copy of the image", why: "Containers share the read-only image layers, which is why they start fast." }

  - kind: check
    kicker: Check yourself
    title: Read the port flag
    question: "You run `docker run -p 8080:8000 myapp`. Which address reaches the app?"
    options:
      - { text: "localhost:8080 on your machine", correct: true, why: "The left number is the port on your machine. It forwards to 8000 inside." }
      - { text: "localhost:8000", why: "8000 exists only inside the container unless you publish it." }
      - { text: "localhost:80", why: "Neither number is 80, so nothing is listening there." }

  - kind: practice
    kicker: Your turn
    title: "Read a port mapping"
    intro: "`docker run -p 8080:80` maps host port 8080 to container port 80. Write `port_map(s)` that turns `\"8080:80\"` into the list `[8080, 80]`."
    entry: port_map
    starter: |
      def port_map(s):
          pass
    solution: |
      def port_map(s):
          h, c = s.split(':')
          return [int(h), int(c)]
    tests:
      - { input: "[\"8080:80\"]", expected: "[8080, 80]" }
      - { input: "[\"3000:3000\"]", expected: "[3000, 3000]" }
      - { input: "[\"5432:5432\"]", expected: "[5432, 5432]" }
    hint: "Split on the colon, then turn both halves into numbers."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Secrets in the image.** Anyone with the image can read them. Pass keys in at run time."
      - "**Data inside a container.** It vanishes when the container is removed. Use a volume for databases."
      - "**Using the latest tag.** Pin a version so a rebuild next month does not surprise you."
    next: { label: "Next: auth and sessions", href: /learn/auth-and-sessions }
