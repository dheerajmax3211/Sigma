id: "sd-realtime-voice"
title: "Real-time voice agents"
minutes: 13
order: 611
params:
  - { id: "asr", label: "speech to text (ms)", min: 50, max: 600, step: 10, init: 200 }
  - { id: "llm", label: "first model token (ms)", min: 100, max: 1500, step: 50, init: 400 }
  - { id: "tts", label: "first audio (ms)", min: 50, max: 600, step: 10, init: 150 }
derived:
  - { id: "total", expr: "asr + llm + tts" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Talk without awkward silence"
    body:
      - "A voice agent listens, thinks and speaks. People notice a pause over about a second. So every stage must **stream**, not wait for the previous one to finish."
      - "Speech to text emits words as they come. The model starts once it has enough. Speech output starts on the first sentence."
    callout: "The number that matters is time to first audio."
  - kind: "lab"
    kicker: "See it"
    title: "A latency budget"
    intro: "Add up the stages before the user hears anything. **Drag each stage.**"
    view:
      type: "bars"
      max: 1500
      items:
        - { label: "time to first audio (ms)", value: "total", color: "#f97316" }
        - { label: "comfortable limit (ms)", value: "1000", color: "#1cd6ac" }
    sliders:
      - "asr"
      - "llm"
      - "tts"
    outro: "These add to **{total} ms**. Over about 1000 ms the conversation feels slow."
  - kind: "code"
    kicker: "Write it"
    title: "Streaming versus waiting"
    intro: "Without streaming, each stage must finish first. With streaming only the first piece counts."
    lang: "python"
    code: |
      def sequential(asr_full, llm_full, tts_full):
          return asr_full + llm_full + tts_full

      def streaming(asr_final, llm_first, tts_first):
          return asr_final + llm_first + tts_first

      assert sequential(800, 2000, 900) == 3700
      assert streaming(200, 400, 150) == 750

      def barge_in(speaking, user_voice):
          return speaking and user_voice

      assert barge_in(True, True) is True
      assert barge_in(False, True) is False
    note: "Barge in means the agent stops talking as soon as the user speaks."
  - kind: "lab"
    kicker: "Memorise"
    title: "Moving parts"
    intro: "Each needs care."
    view:
      type: "flow"
      stages:
        - { label: "Voice activity", note: "Detect when the user has stopped. Too early cuts them off.", color: "#38bdf8" }
        - { label: "Streams", note: "Audio in, text, tokens, audio out, all overlapping.", color: "#1cd6ac" }
        - { label: "Interrupts", note: "Stop speech and drop queued output on barge in.", color: "#f97316" }
        - { label: "Fallback", note: "Short filler or a smaller model when the big one is slow.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Biggest win"
    question: "A voice agent feels slow. What gives the largest gain?"
    options:
      - { text: "Stream every stage and start speaking on the first sentence", correct: true, why: "Time to first audio drops the most." }
      - { text: "A longer prompt", why: "That adds delay." }
      - { text: "Bigger model", why: "Usually slower." }
      - { text: "Wait for the full answer", why: "That is the problem." }
  - kind: "check"
    kicker: "Practice"
    title: "Interrupt"
    question: "The user talks over the agent. What should happen?"
    options:
      - { text: "Stop playing audio and listen", correct: true, why: "Barge in must be immediate." }
      - { text: "Finish the sentence", why: "That feels rude." }
      - { text: "Ignore the user", why: "No." }
      - { text: "Restart the call", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Waiting for full responses.** Stream everything."
      - "**Cutting users off.** Tune end of speech detection."
      - "**No barge in.** Users hate it."
    next: { label: "Back to all lessons", href: "/learn" }
