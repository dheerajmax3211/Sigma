id: build-paged-attention
title: "Build paged attention"
order: 1205
minutes: 25
params:
  - { id: seqs, label: "requests", min: 2, max: 16, step: 1, init: 8 }
  - { id: avg, label: "tokens each", min: 100, max: 2000, step: 100, init: 500 }
derived:
  - { id: paged, expr: "seqs * (ceil(avg / 16) * 16 - avg)" }
  - { id: fixed, expr: "seqs * (2048 - avg)" }
cards:
  - kind: story
    kicker: Guided build
    title: "Memory in pages"
    body:
      - "A model stores keys and values for every token it has read. Reserving a full slab per request wastes most of it, like booking a whole bus for one passenger."
      - "You will build the **page maths**, a **block table** that hands out pages, and the **lookup** that finds one token's page and slot."

  - kind: lab
    kicker: See it first
    title: "What the slab wastes"
    intro: "Pages hold 16 tokens. Compare the empty slots left by paging with reserving 2048 slots per request. **Drag the sliders.**"
    view:
      type: bars
      max: 33000
      items:
        - { label: "empty slots with pages", value: paged, color: "#1cd6ac" }
        - { label: "empty slots with 2048 reserved", value: fixed, color: "#ef4444" }
    sliders: [seqs, avg]
    outro: "{seqs} requests of {avg} tokens waste **{paged}** slots with pages, against {fixed} with fixed slabs. Freed memory means more requests at once."

  - kind: code
    kicker: Starter code
    title: "Pages and a table"
    intro: "A request owns a list of page numbers. Token 37 lives in page `table[37 // 16]`, slot `37 % 16`."
    lang: python
    code: |
      def locate(table, pos, block):
          return [table[pos // block], pos % block]

      assert locate([4, 9], 20, 16) == [9, 4]
      print(locate([4, 9], 3, 16))
    note: "The pages need not sit next to each other, and that is the whole trick."

  - kind: practice
    kicker: Build step
    title: "How many pages"
    intro: "Write `blocks_needed(tokens, block)`, the number of pages to hold that many tokens."
    entry: blocks_needed
    starter: |
      def blocks_needed(tokens, block):
          pass
    solution: |
      def blocks_needed(tokens, block):
          return -(-tokens // block)
    tests:
      - { input: "[5, 16]", expected: "1" }
      - { input: "[16, 16]", expected: "1" }
      - { input: "[17, 16]", expected: "2" }
      - { input: "[0, 16]", expected: "0" }
    hint: "Divide and round up."

  - kind: practice
    kicker: Build step
    title: "Hand out pages"
    intro: "Write `block_table(lens, block)`. Give each request the pages it needs, numbering pages from 0 in order across all requests. Return one list of page numbers per request."
    entry: block_table
    starter: |
      def block_table(lens, block):
          pass
    solution: |
      def block_table(lens, block):
          nxt, out = 0, []
          for n in lens:
              k = -(-n // block)
              out.append(list(range(nxt, nxt + k)))
              nxt += k
          return out
    tests:
      - { input: "[[5, 20], 16]", expected: "[[0], [1, 2]]" }
      - { input: "[[], 16]", expected: "[]" }
      - { input: "[[33], 16]", expected: "[[0, 1, 2]]" }
    hint: "Keep a counter of the next free page."

  - kind: practice
    kicker: Build step
    title: "Find a token"
    intro: "Write `locate(table, pos, block)` returning `[page, slot]` for token number `pos`."
    entry: locate
    starter: |
      def locate(table, pos, block):
          pass
    solution: |
      def locate(table, pos, block):
          return [table[pos // block], pos % block]
    tests:
      - { input: "[[4, 9], 20, 16]", expected: "[9, 4]" }
      - { input: "[[4, 9], 3, 16]", expected: "[4, 3]" }
      - { input: "[[7], 15, 16]", expected: "[7, 15]" }
    hint: "The page index is the quotient, the slot is the remainder."

  - kind: check
    kicker: Check yourself
    title: "Why pages"
    question: "What does paging mainly save?"
    options:
      - { text: "Memory that was reserved but never used", correct: true, why: "Pages are given out as tokens arrive." }
      - { text: "Time spent computing attention", why: "The maths is the same, only where it is stored changes." }
      - { text: "The model weights", why: "Weights are separate from the key value cache." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Pages too big.** The last page wastes more."
      - "**Pages too small.** The table grows and lookups slow down."
      - "**Freeing too late.** Release a finished request's pages at once."
    next: { label: "Next build", href: "/learn/build-rag-system" }
