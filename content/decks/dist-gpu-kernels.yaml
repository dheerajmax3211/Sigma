id: "dist-gpu-kernels"
title: "GPU kernels, memory traffic and fusion"
minutes: 14
order: 810
params:
  - { id: "ops", label: "operations in a row (add, scale, activate...)", min: 1, max: 12, step: 1, init: 5 }
derived:
  - { id: "un", expr: "2 * ops" }
  - { id: "fu", expr: "2" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "The GPU is often waiting for memory"
    body:
      - "A GPU can do far more arithmetic than it can fetch numbers. Many steps in a model, like add, scale and activation, do little maths per number. They are limited by **memory traffic**, not compute."
      - "Run each as its own **kernel** and the data goes out to memory and back every time. **Fusing** them into one kernel reads once, does all the steps in fast registers, and writes once."
    callout: "Fewer trips to memory means faster."
  - kind: "lab"
    kicker: "See it"
    title: "Trips to memory"
    intro: "Count reads and writes of the array. **Drag the number of operations.**"
    view:
      type: "bars"
      max: 24
      items:
        - { label: "memory passes, one kernel each", value: "un", color: "#ef4444" }
        - { label: "memory passes, fused", value: "fu", color: "#1cd6ac" }
    sliders:
      - "ops"
    outro: "With {ops} steps in a row, separate kernels make **{un}** memory passes. A fused kernel makes **{fu}**."
  - kind: "code"
    kicker: "Write it"
    title: "Count the traffic"
    intro: "Same result, different number of passes over memory."
    lang: "python"
    code: |
      steps = [lambda v: v + 1, lambda v: v * 2, lambda v: max(v, 0), lambda v: v - 3]
      data = [1, -5, 3]

      def unfused(data):
          passes = 0
          for f in steps:
              data = [f(v) for v in data]
              passes += 2                      # read the array, write the array
          return data, passes

      def fused(data):
          out = []
          for v in data:
              for f in steps:
                  v = f(v)
              out.append(v)
          return out, 2                        # one read, one write

      a, pa = unfused(data)
      b, pb = fused(data)
      assert a == b == [1, -3, 5]
      assert (pa, pb) == (8, 2)
    note: "Triton and torch.compile write fused kernels for you. FlashAttention is the famous hand-made one."
  - kind: "lab"
    kicker: "Memorise"
    title: "Compute-bound or memory-bound"
    intro: "Ask this before optimising."
    view:
      type: "flow"
      stages:
        - { label: "Arithmetic intensity", note: "Operations per byte moved.", color: "#38bdf8" }
        - { label: "Low", note: "Memory-bound. Fuse and reduce traffic.", color: "#f97316" }
        - { label: "High", note: "Compute-bound. Use tensor cores, lower precision.", color: "#1cd6ac" }
        - { label: "Measure", note: "Profile first, then decide.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why fuse"
    question: "Why is a fused kernel faster for elementwise steps?"
    options:
      - { text: "Fewer reads and writes to slow memory", correct: true, why: "The arithmetic is the same." }
      - { text: "It does less arithmetic", why: "The maths is identical." }
      - { text: "It uses fewer GPUs", why: "No." }
      - { text: "It lowers precision", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Matmul"
    question: "Large matrix multiplies are usually which kind?"
    options:
      - { text: "Compute-bound, lots of maths per byte", correct: true, why: "Each number is reused many times." }
      - { text: "Memory-bound", why: "That is elementwise steps." }
      - { text: "Neither", why: "One of the two." }
      - { text: "Disk-bound", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Optimising before profiling.** Measure the real bottleneck."
      - "**Fusing everything by hand.** Try the compiler first."
      - "**Ignoring numerical changes.** Fused kernels can round differently."
    next: { label: "Back to all lessons", href: "/learn" }
