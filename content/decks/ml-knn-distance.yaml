id: "ml-knn-distance"
title: "Nearest neighbours and distance"
minutes: 12
order: 504
params:
  - { id: "d", label: "number of features", min: 1, max: 100, step: 1, init: 10 }
derived:
  - { id: "side", expr: "100 * 0.01 ^ (1 / d)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Look at the closest examples"
    body:
      - "**k nearest neighbours** has no training step. To predict, find the k closest stored rows and take a vote or an average of their labels."
      - "It depends entirely on what close means. That depends on the **distance** and on the scale of each feature."
    callout: "Always scale features before using distances."
  - kind: "lab"
    kicker: "See it"
    title: "Why many features hurt"
    intro: "To catch just 1 percent of the data in a cube, how much of each side must you cover? **Drag the feature count.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "share of each side needed", value: "side", color: "#f97316" }
        - { label: "share of each side with one feature", value: "1", color: "#38bdf8" }
    sliders:
      - "d"
    outro: "With {d} features you must cover **{side} percent** of every side to find 1 percent of the data. Neighbours stop being near. This is the **curse of dimensionality**."
  - kind: "code"
    kicker: "Write it"
    title: "k nearest neighbours"
    intro: "Rank rows by distance and vote."
    lang: "python"
    code: |
      import math

      def knn(points, labels, q, k):
          order = sorted(range(len(points)), key=lambda i: math.dist(points[i], q))
          votes = [labels[i] for i in order[:k]]
          return max(set(votes), key=votes.count)

      pts = [(0, 0), (0, 1), (5, 5), (5, 6)]
      lab = [0, 0, 1, 1]
      assert knn(pts, lab, (4, 5), 3) == 1
      assert knn(pts, lab, (0, 0.5), 1) == 0

      # unscaled features let the big one dominate
      a, b = (1, 1000), (2, 1000)
      assert math.dist(a, b) == 1.0
    note: "Small k is noisy. Large k blurs everything. Pick k on validation data."
  - kind: "lab"
    kicker: "Memorise"
    title: "When to use it"
    intro: "Good as a baseline, and the idea powers vector search."
    view:
      type: "flow"
      stages:
        - { label: "Strengths", note: "Simple. No training. Handles odd shapes.", color: "#1cd6ac" }
        - { label: "Weakness", note: "Slow to predict on big data. Hurt by many features.", color: "#ef4444" }
        - { label: "Modern use", note: "Embedding search finds nearest vectors, with approximate indexes.", color: "#38bdf8" }
  - kind: "check"
    kicker: "Your turn"
    title: "Wrong scale"
    question: "Features are age in years and income in dollars, unscaled. What happens to distances?"
    options:
      - { text: "Income dominates and age barely matters", correct: true, why: "The larger numbers swamp the sum." }
      - { text: "Age dominates", why: "Income has larger numbers." }
      - { text: "They cancel", why: "No." }
      - { text: "Nothing changes", why: "Scale matters a lot here." }
  - kind: "check"
    kicker: "Practice"
    title: "Choosing k"
    question: "k equals 1. What is the risk?"
    options:
      - { text: "It follows noise in single rows and overfits", correct: true, why: "One odd neighbour decides the answer." }
      - { text: "It underfits badly", why: "That is a large k." }
      - { text: "It cannot predict", why: "It can." }
      - { text: "It needs scaling less", why: "It needs it as much." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Not scaling.** Distances become meaningless."
      - "**Using it on hundreds of raw features.** Reduce dimension first."
      - "**Ties in voting.** Use an odd k for two classes."
    next: { label: "Next: naive Bayes", href: "/learn/ml-naive-bayes" }
