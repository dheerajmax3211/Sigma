id: "au-audio-language-models"
title: "Audio language models"
minutes: 14
order: 1008
params:
  - { id: "q", label: "codebooks per frame", min: 1, max: 8, step: 1, init: 4 }
derived:
  - { id: "tps", expr: "75 * q" }
  - { id: "secs", expr: "8192 / tps" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Treat sound like text"
    body:
      - "If a codec turns audio into discrete tokens, a language model can read and write them like words. Feed it speech tokens and it can continue the speech, answer, or follow a spoken instruction without writing text first."
      - "The catch is length. Audio makes many more tokens per second than text, so a context window holds far less time than it holds words."
    callout: "Same transformer, a much longer sequence."
  - kind: "lab"
    kicker: "See it"
    title: "How much audio fits"
    intro: "A codec with 75 frames a second and some stages per frame, in an 8192 token window. **Drag the stages.**"
    view:
      type: "bars"
      max: 600
      items:
        - { label: "audio tokens per second", value: "tps", color: "#f97316" }
        - { label: "seconds that fit in the window", value: "secs", color: "#1cd6ac" }
    sliders:
      - "q"
    outro: "With {q} stages there are **{tps}** tokens a second, so the window holds only **{secs} seconds**. Text is about 3 tokens a second of speech."
  - kind: "code"
    kicker: "Write it"
    title: "Flatten frames into one stream"
    intro: "Interleave the codebooks, frame by frame."
    lang: "python"
    code: |
      frames = [[11, 12], [21, 22], [31, 32]]      # three frames, two codebooks each

      def flatten(frames):
          return [tok for frame in frames for tok in frame]

      stream = flatten(frames)
      assert stream == [11, 12, 21, 22, 31, 32]
      assert len(stream) == 6

      tokens_per_second = 75 * 4
      text_tokens_per_second = 3
      assert tokens_per_second / text_tokens_per_second == 100
      assert 8192 / tokens_per_second < 28           # under half a minute fits
    note: "Practical systems use a delay pattern or a small second model so each frame is not a long run of steps."
  - kind: "lab"
    kicker: "Memorise"
    title: "What you can build"
    intro: "Capabilities from the same recipe."
    view:
      type: "flow"
      stages:
        - { label: "Speech to speech", note: "Hear and answer directly.", color: "#1cd6ac" }
        - { label: "Voice cloning", note: "Continue in a given voice.", color: "#38bdf8" }
        - { label: "Music", note: "Generate sound from a description.", color: "#f97316" }
        - { label: "Any sound", note: "Effects, ambience, events.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Length"
    question: "Why do audio language models struggle with long recordings?"
    options:
      - { text: "Audio makes far more tokens per second than text", correct: true, why: "The window fills quickly." }
      - { text: "Audio has no structure", why: "It does." }
      - { text: "Models cannot hear", why: "They read tokens." }
      - { text: "GPUs are slower on audio", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Fewer stages"
    question: "Fewer codebooks per frame mean?"
    options:
      - { text: "Fewer tokens, shorter sequences, lower quality", correct: true, why: "A trade-off." }
      - { text: "More tokens", why: "No." }
      - { text: "Better quality", why: "No." }
      - { text: "No change", why: "There is a change." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Forgetting the token rate.** Do the maths before choosing a codec."
      - "**Expecting text-level reasoning from tiny audio models.** Check it."
      - "**Ignoring safety.** Voice generation can be abused."
    next: { label: "Next: voice agents that stream", href: "/learn/au-voice-streaming" }
