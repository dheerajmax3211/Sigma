id: tr-multi-head-attention
title: "Multi-head attention: several views at once"
minutes: 13
order: 303
params:
  - { id: h, label: "heads", min: 1, max: 32, step: 1, init: 8 }
derived:
  - { id: dh, expr: "512 / h" }
cards:
  - kind: story
    kicker: Start here
    title: "One look is not enough"
    body:
      - "One attention head produces one set of weights per token. But a word relates to others in many ways: grammar, meaning, position, reference."
      - "**Multi-head attention** runs several smaller attentions in parallel, each with its own learned projections. Then it joins the results."
    callout: "Same total width, split across heads. More views, same cost."

  - kind: lab
    kicker: See it
    title: "Splitting the width"
    intro: "The model width stays 512. Each head gets an equal slice. **Drag the number of heads.**"
    view:
      type: bars
      max: 512
      items:
        - { label: "model width", value: "512", color: "#38bdf8" }
        - { label: "width per head", value: dh, color: "#f97316" }
        - { label: "heads", value: h, color: "#1cd6ac" }
    sliders: [h]
    outro: "{h} heads of **{dh}** dimensions each add back up to 512."

  - kind: code
    kicker: Write it
    title: "Split and join heads"
    intro: "The split is just a reshape. Each head then runs attention on its own slice."
    lang: python
    code: |
      def split_heads(vec, h):
          size = len(vec) // h
          return [vec[i * size:(i + 1) * size] for i in range(h)]

      def join_heads(parts):
          return [x for part in parts for x in part]

      v = [1, 2, 3, 4, 5, 6, 7, 8]
      parts = split_heads(v, 4)
      assert parts == [[1, 2], [3, 4], [5, 6], [7, 8]]
      assert join_heads(parts) == v
    note: "After joining, one more learned matrix mixes the heads' outputs."

  - kind: lab
    kicker: See it
    title: "What the heads do"
    intro: "Researchers find heads that specialise, though not always cleanly."
    view:
      type: flow
      stages:
        - { label: "Syntax head", note: "Verbs attend to their subjects.", color: "#38bdf8" }
        - { label: "Reference head", note: "'it' attends to what it refers to.", color: "#1cd6ac" }
        - { label: "Nearby head", note: "Attends to the previous few tokens.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Cost of more heads"
    question: "With the model width fixed at 512, how does using 16 heads instead of 8 change the parameter count?"
    options:
      - { text: "It stays about the same, since each head gets a thinner slice", correct: true, why: "Projection matrices still total width by width. Heads only divide the width." }
      - { text: "It doubles", why: "Width is split, not duplicated." }
      - { text: "It halves", why: "No." }
      - { text: "It becomes zero", why: "No." }

  - kind: check
    kicker: Practice
    title: "Why not one huge head?"
    question: "What is the benefit of several heads over one head of the same total width?"
    options:
      - { text: "Each head can learn a different relationship", correct: true, why: "One head must average every relation into one weight pattern." }
      - { text: "It removes softmax", why: "Each head still uses softmax." }
      - { text: "It makes training deterministic", why: "No." }
      - { text: "It shortens the sequence", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Thinking heads add width.** They divide it."
      - "**Forgetting the output matrix.** Heads are mixed after joining."
      - "**Assuming each head is interpretable.** Many are redundant."
    next: { label: "Next: normalisation and residuals", href: /learn/tr-normalisation-residuals }
