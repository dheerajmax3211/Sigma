id: tr-pretraining-objectives
title: "Pretraining: learning by predicting the next token"
minutes: 13
order: 305
params:
  - { id: pr, label: "probability given to the right token", min: 0.01, max: 1, step: 0.01, init: 0.25 }
derived:
  - { id: loss, expr: "-log(pr)" }
cards:
  - kind: story
    kicker: Start here
    title: "A game played trillions of times"
    body:
      - "A language model is trained on one simple task: given the text so far, **predict the next token**. No labels are needed. The text labels itself."
      - "To predict well, the model has to pick up grammar, facts and even some reasoning. That is why one plain objective produces such general ability."
    callout: "Pretraining teaches the model language. Later steps teach it to behave."

  - kind: lab
    kicker: See it
    title: "The loss for one token"
    intro: "The loss is minus the log of the probability given to the correct token. **Drag the probability.**"
    view:
      type: curve
      fn: "-log(t)"
      min: 0.02
      max: 1
      point: pr
      yMin: 0
      yMax: 4
      xLabel: probability of correct token
      yLabel: loss
    sliders: [pr]
    outro: "At probability {pr} the loss is **{loss}**. Confidently wrong answers are punished hard."

  - kind: code
    kicker: Write it
    title: "Cross-entropy for one step"
    intro: "Softmax turns scores into probabilities. The loss reads off the correct token."
    lang: python
    code: |
      import math

      def softmax(z):
          m = max(z)
          e = [math.exp(v - m) for v in z]
          s = sum(e)
          return [v / s for v in e]

      def next_token_loss(logits, target):
          return -math.log(softmax(logits)[target])

      V = 4
      assert abs(next_token_loss([0, 0, 0, 0], 2) - math.log(V)) < 1e-12
      assert next_token_loss([0, 0, 5, 0], 2) < 0.1
      assert next_token_loss([5, 0, 0, 0], 2) > 4
    note: "A model with no knowledge scores log of the vocabulary size. Training pushes the loss down."

  - kind: lab
    kicker: Compare
    title: "Three families"
    intro: "Not every model predicts left to right."
    view:
      type: flow
      stages:
        - { label: "Decoder only", note: "Next token. GPT and Llama style. Best for generation.", color: "#38bdf8" }
        - { label: "Encoder only", note: "Fill in masked words. BERT style. Best for understanding.", color: "#1cd6ac" }
        - { label: "Encoder decoder", note: "Read input, write output. T5 style. Translation.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Where labels come from"
    question: "Where do the training labels for next-token prediction come from?"
    options:
      - { text: "The text itself: each next token is the label for the tokens before it", correct: true, why: "This is self-supervised learning, so no human labelling is needed." }
      - { text: "Human annotators", why: "Too expensive at this scale." }
      - { text: "A second model", why: "Not required." }
      - { text: "Random numbers", why: "No." }

  - kind: check
    kicker: Practice
    title: "Reading a loss"
    question: "A model's loss is about 0 on training text but high on new text. What does that suggest?"
    options:
      - { text: "It memorised the training data", correct: true, why: "Low training loss with high held-out loss is overfitting." }
      - { text: "It learned perfectly", why: "Held-out loss says otherwise." }
      - { text: "The tokeniser is broken", why: "No evidence." }
      - { text: "The learning rate is too low", why: "Not implied." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Thinking pretraining makes a chatbot.** It makes a text continuer."
      - "**Forgetting the mask.** The model must not see future tokens."
      - "**Comparing losses across tokenisers.** Different vocabularies change the scale."
    next: { label: "Next: decoding strategies", href: /learn/tr-decoding-strategies }
