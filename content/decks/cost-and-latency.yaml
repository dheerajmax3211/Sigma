id: cost-and-latency
title: Cost and latency for AI apps
order: 43
minutes: 9
params:
  - { id: users, label: "active users", min: 100, max: 5000, step: 100, init: 1000 }
  - { id: reqs, label: "requests per user per day", min: 1, max: 10, step: 1, init: 5 }
  - { id: ptok, label: "prompt size (tokens)", min: 500, max: 8000, step: 500, init: 2000 }
derived:
  - { id: per, expr: "ptok * 3 / 1000000 + 0.0075" }
  - { id: month, expr: "users * reqs * 30" }
  - { id: bill, expr: "month * per" }
  - { id: cbill, expr: "month * (ptok * 0.3 / 1000000 + 0.0075)" }
cards:
  - kind: story
    kicker: Start here
    title: The bill is a multiplication
    body:
      - "A model charges for **tokens**, both the ones you send and the ones it writes. Output tokens cost more than input tokens."
      - "So the monthly bill is just requests times the cost of one request. Once you can multiply, you can predict it and cut it."
    callout: "Know the number before you launch."

  - kind: lab
    kicker: See it first
    title: What a month costs
    intro: "Illustrative prices: 3 dollars per million input tokens, 15 per million output tokens, and a 500-token reply. A **prompt cache** can make repeated input about 90 percent cheaper. **Drag the sliders.**"
    view:
      type: bars
      max: 50000
      items:
        - { label: "monthly cost (dollars)", value: bill, color: "#ef4444" }
        - { label: "with a prompt cache (dollars)", value: cbill, color: "#1cd6ac" }
    sliders: [users, reqs, ptok]
    outro: "{users} users making {reqs} requests a day send **{month}** requests a month. Each costs about **{per}** dollars, so the bill is **{bill} dollars**, or **{cbill}** with caching."

  - kind: formula
    kicker: Read the formula
    title: Cost of one request
    tex: "c = \\frac{T_{\\text{in}} \\cdot p_{\\text{in}} + T_{\\text{out}} \\cdot p_{\\text{out}}}{10^{6}}"
    say: "Multiply the tokens sent by the input price, add the tokens received times the output price, then divide by a million."
    verify:
      - { expr: "per", equals: 0.0135, tol: 0.0001 }
      - { expr: "bill", equals: 2025, tol: 0.5 }
      - { expr: "cbill", equals: 1215, tol: 0.5 }
    symbols:
      - { tex: "c", means: "dollars for one request", value: per }
      - { tex: "T_{\\text{in}}", means: "tokens you send, the prompt", value: ptok }
      - { tex: "T_{\\text{out}}", means: "tokens the model writes, assumed 500", value: "500" }
      - { tex: "p_{\\text{in}},\\ p_{\\text{out}}", means: "dollars per million input and output tokens, here 3 and 15" }

  - kind: code
    kicker: Read it
    title: Estimate before you ship
    intro: "A ten-line helper beats a surprise invoice. Read the real token counts from each API reply and log them."
    lang: python
    code: |
      PRICE_IN, PRICE_OUT = 3.0, 15.0     # dollars per million tokens

      def request_cost(tokens_in, tokens_out):
          return (tokens_in * PRICE_IN + tokens_out * PRICE_OUT) / 1_000_000

      def monthly(users, per_day, tokens_in, tokens_out):
          return users * per_day * 30 * request_cost(tokens_in, tokens_out)

      print(monthly(1000, 5, 2000, 500))   # about 2025
    note: "Check your provider's current prices. They change often."

  - kind: story
    kicker: Cut it
    title: Four levers
    body:
      - "**Shorter prompts**: trim instructions and retrieve fewer, better chunks. **Prompt caching**: reuse a large fixed prefix cheaply."
      - "**Smaller models**: send easy tasks to a cheaper model. **Streaming**: it does not cut cost, but the first words appear sooner, so slow answers feel fast."
    callout: "Cheaper, or at least faster to feel."

  - kind: check
    kicker: Check yourself
    title: Which lever
    question: "Your prompt includes the same 5,000-token policy document on every request. What cuts cost most directly?"
    options:
      - { text: "Prompt caching of that fixed prefix", correct: true, why: "A repeated prefix is exactly what caching discounts." }
      - { text: "Streaming the response", why: "Streaming changes how fast it feels, not what you are charged." }
      - { text: "Asking for longer answers", why: "Longer output costs more, not less." }

  - kind: check
    kicker: Check yourself
    title: Scale it
    question: "Cost per request is 0.01 dollars. You have 2,000 requests a day. About what is a 30-day month?"
    options:
      - { text: "600 dollars", correct: true, why: "2,000 times 30 is 60,000 requests, and 60,000 times 0.01 is 600." }
      - { text: "20 dollars", why: "That is one day's cost. Multiply by 30." }
      - { text: "6,000 dollars", why: "That is ten times too large. Check the multiplication." }

  - kind: practice
    kicker: Your turn
    title: "Cache saving"
    intro: "Write `saving(hit_rate, cost_full, cost_cached)` returning the average cost per request. A hit costs `cost_cached`, a miss costs `cost_full`. Round to 4 places."
    entry: saving
    starter: |
      def saving(hit_rate, cost_full, cost_cached):
          pass
    solution: |
      def saving(hit_rate, cost_full, cost_cached):
          return round(hit_rate * cost_cached + (1 - hit_rate) * cost_full, 4)
    tests:
      - { input: "[0.5, 1.0, 0.1]", expected: "0.55" }
      - { input: "[0, 1.0, 0.1]", expected: "1.0" }
      - { input: "[1, 2.0, 0.2]", expected: "0.2" }
    hint: "Weight each cost by how often it happens."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Forgetting output tokens.** They are pricier than input, and long answers add up."
      - "**Resending whole chat history.** Cost grows each turn, so summarise old messages."
      - "**No usage limit per user.** One heavy user, or a script, can wreck your budget."
    next: { label: "Next: designing an AI app", href: /learn/system-design-ai-app }
