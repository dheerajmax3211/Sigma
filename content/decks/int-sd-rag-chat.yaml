id: int-sd-rag-chat
title: "System design: a RAG chat product"
minutes: 14
order: 217
params:
  - { id: chats, label: "chats per day (thousands)", min: 1, max: 500, step: 1, init: 50 }
  - { id: ctx, label: "context tokens per chat (thousands)", min: 1, max: 20, step: 1, init: 6 }
derived:
  - { id: cost, expr: "chats * ctx * 3 / 1000" }
cards:
  - kind: story
    kicker: Start here
    title: "A support bot for company docs"
    body:
      - "A common question: 'Design a chat assistant that answers from our documents.' It combines the RAG pipeline with ordinary backend design."
      - "Cover two paths. The **indexing path** prepares documents. The **query path** answers a user in a few seconds."
    callout: "Separate the slow offline path from the fast online path. It keeps the design easy to explain."

  - kind: lab
    kicker: See it
    title: "Two paths"
    intro: "Indexing happens ahead of time. Queries must be fast."
    view:
      type: flow
      stages:
        - { label: "Ingest docs", note: "Parse, clean, split into chunks.", color: "#38bdf8" }
        - { label: "Embed and store", note: "Vectors in an index with source metadata.", color: "#1cd6ac" }
        - { label: "Retrieve", note: "Search, filter by user permission, re-rank.", color: "#f97316" }
        - { label: "Generate", note: "Prompt with chunks, stream the answer with citations.", color: "#a78bfa" }

  - kind: lab
    kicker: See it
    title: "The cost of context"
    intro: "Providers charge per token. Assume 3 units of cost per thousand tokens, purely for illustration. **Drag the sliders.**"
    view:
      type: bars
      max: 10000
      items:
        - { label: "cost per day (units)", value: cost, color: "#f97316" }
        - { label: "chats per day (thousands)", value: chats, color: "#38bdf8" }
    sliders: [chats, ctx]
    outro: "{chats} thousand chats with {ctx} thousand tokens each cost about **{cost} units** per day. Halving the context halves the bill."

  - kind: code
    kicker: Write it
    title: "A cost guard"
    intro: "Trim retrieved chunks to fit a token budget, highest score first."
    lang: python
    code: |
      def fit(chunks, budget):
          # chunks: list of (score, tokens, text)
          chosen, used = [], 0
          for score, tokens, text in sorted(chunks, reverse=True):
              if used + tokens <= budget:
                  chosen.append(text)
                  used += tokens
          return chosen

      docs = [(0.9, 400, "a"), (0.8, 700, "b"), (0.7, 300, "c")]
      assert fit(docs, 1000) == ["a", "c"]
      assert fit(docs, 100) == []
    note: "Budgets keep latency and cost predictable. Log the tokens used per chat."

  - kind: check
    kicker: Your turn
    title: "Private documents"
    question: "Different employees may see different documents. Where do you enforce that?"
    options:
      - { text: "At retrieval time, filtering chunks by the user's permissions", correct: true, why: "If a forbidden chunk never reaches the prompt, the model cannot leak it." }
      - { text: "Ask the model not to reveal secrets", why: "Instructions are not a security control." }
      - { text: "Only on the front end", why: "It can be bypassed." }
      - { text: "Skip it", why: "A serious data leak risk." }

  - kind: check
    kicker: Practice
    title: "Slow answers"
    question: "Users wait 8 seconds for an answer. What is a good first improvement?"
    options:
      - { text: "Stream the answer as it is written and cache common questions", correct: true, why: "Streaming makes the wait feel short and caching removes repeat work." }
      - { text: "Use a longer prompt", why: "That makes it slower." }
      - { text: "Remove citations", why: "Hurts trust and barely helps." }
      - { text: "Retrieve 50 chunks", why: "More context means more time and cost." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Ignoring permissions.** Filter before the prompt, not after."
      - "**No refresh plan.** Say how changed documents get re-indexed."
      - "**No evaluation.** Keep a test set of real questions."
      - "**No fallback.** Say what happens when nothing relevant is found."
    next: { label: "Next: live coding habits", href: /learn/int-live-coding }
