id: int-ml-training
title: "Interview Q&A: training, validation and leakage"
minutes: 14
order: 207
params:
  - { id: e, label: "epoch", min: 0, max: 6, step: 1, init: 0 }
derived:
  - { id: tr, expr: "pick(e, 1.0, 0.7, 0.5, 0.35, 0.25, 0.15, 0.08)" }
  - { id: va, expr: "pick(e, 1.05, 0.8, 0.65, 0.6, 0.62, 0.7, 0.85)" }
cards:
  - kind: story
    kicker: Start here
    title: "Three sets, three jobs"
    body:
      - "Split your data into **train** (the model learns from it), **validation** (you tune choices with it) and **test** (touched once at the end)."
      - "Interviewers love **data leakage** questions: any way information from outside the training data sneaks in and makes results look better than they are."
    callout: "If your score looks too good to be true, suspect leakage first."

  - kind: lab
    kicker: See it
    title: "Early stopping"
    intro: "Training loss keeps falling. Validation loss falls, then rises. The best moment is the lowest validation loss. **Drag the epoch.**"
    view:
      type: bars
      max: 1.1
      items:
        - { label: "training loss", value: tr, color: "#38bdf8" }
        - { label: "validation loss", value: va, color: "#f97316" }
    sliders: [e]
    says:
      - "Epoch 0: both losses high. The model has just started."
      - "Epoch 1: both fall."
      - "Epoch 2: both keep falling."
      - "Epoch 3: **validation is lowest.** This is the checkpoint to keep."
      - "Epoch 4: training still improves, validation starts to rise. Overfitting begins."
      - "Epoch 5: the gap widens."
      - "Epoch 6: a large gap. Early stopping would have saved epoch 3."
    saysAt: e

  - kind: lab
    kicker: Watch for it
    title: "Common leaks"
    intro: "Each of these makes validation scores look better than real life."
    view:
      type: flow
      stages:
        - { label: "Scaling first", note: "Fitting a scaler on all data before splitting.", color: "#ef4444" }
        - { label: "Duplicates", note: "The same row sits in train and test.", color: "#f97316" }
        - { label: "Future data", note: "Using tomorrow's info to predict today.", color: "#facc15" }
        - { label: "Target in features", note: "A column built from the answer.", color: "#a78bfa" }

  - kind: code
    kicker: Write it
    title: "Split first, then compute statistics"
    intro: "Learn the mean from training data only. Apply that same number to validation data."
    lang: python
    code: |
      def split(xs, frac=0.8):
          k = int(len(xs) * frac)
          return xs[:k], xs[k:]

      def standardise(train, other):
          mu = sum(train) / len(train)
          sd = (sum((x - mu) ** 2 for x in train) / len(train)) ** 0.5
          return [(x - mu) / sd for x in train], [(x - mu) / sd for x in other]

      def kfold(n, k):
          sizes = [n // k + (i < n % k) for i in range(k)]
          start, folds = 0, []
          for s in sizes:
              val = list(range(start, start + s))
              train = [i for i in range(n) if i not in val]
              folds.append((train, val))
              start += s
          return folds

      tr, va = split(list(range(10)))
      a, b = standardise(tr, va)
      assert len(tr) == 8 and len(va) == 2
      assert abs(sum(a) / len(a)) < 1e-9
      f = kfold(10, 5)
      assert len(f) == 5 and all(len(v) == 2 for _, v in f)
      assert all(set(t).isdisjoint(v) for t, v in f)
    note: "For time-ordered data, split by time. Shuffling lets the model peek at the future."

  - kind: check
    kicker: Your turn
    title: "Spot the leak"
    question: "You normalise all rows using the overall mean, then split into train and test. What went wrong?"
    options:
      - { text: "Test data influenced the training statistics", correct: true, why: "The mean includes test rows, so information leaked. Split first, then fit statistics on train only." }
      - { text: "Nothing, this is standard", why: "It is a classic leak." }
      - { text: "The split was too small", why: "Size is not the problem." }
      - { text: "Normalising is forbidden", why: "It is fine when done after the split." }

  - kind: check
    kicker: Practice
    title: "Why a test set?"
    question: "You tune hyperparameters on the validation set many times. Why keep a separate test set?"
    options:
      - { text: "Repeated tuning overfits the validation set, so you need an untouched final check", correct: true, why: "Each tweak slightly fits validation data. The test set gives an honest estimate." }
      - { text: "To train on more data", why: "Test data must stay unseen." }
      - { text: "It is a tradition", why: "It has a real statistical reason." }
      - { text: "To speed training", why: "Unrelated." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Tuning on the test set.** Touch it once."
      - "**Random split on time series.** Split by date."
      - "**Duplicates across splits.** Deduplicate before splitting."
      - "**Trusting one split.** Use cross-validation for small datasets."
    next: { label: "Next: deep learning questions", href: /learn/int-dl-fundamentals }
