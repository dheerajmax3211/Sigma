id: streaming-responses
title: Streaming responses
order: 26
minutes: 9
params:
  - { id: tps, label: "tokens per second", min: 20, max: 100, step: 10, init: 40 }
  - { id: len, label: "answer length (tokens)", min: 100, max: 600, step: 100, init: 400 }
derived:
  - { id: gen, expr: "len / tps" }
  - { id: wait, expr: "0.6 + len / tps" }
  - { id: first, expr: "0.6" }
cards:
  - kind: story
    kicker: Start here
    title: Do not make people stare at a blank screen
    body:
      - "A model writes one token at a time. A long answer can take ten seconds or more. If you wait for the end, the user sees nothing until then."
      - "**Streaming** sends the answer in small chunks as they are made, so words appear almost at once."
    callout: "Show the first word fast."

  - kind: lab
    kicker: See it first
    title: Watch the chunks travel
    intro: "The model makes tokens, the server forwards each **chunk**, and the page appends it to the text. **Drag the speed and the length.**"
    view:
      type: flow
      stages:
        - { label: "1. Model writes", note: "{tps} tokens each second", color: "#a78bfa" }
        - { label: "2. Server forwards", note: "each chunk is sent the moment it exists", color: "#38bdf8" }
        - { label: "3. Page appends", note: "text grows on screen, {len} tokens in all", color: "#1cd6ac" }
    sliders: [tps, len]
    outro: "Generating {len} tokens at {tps} per second takes **{gen} seconds** in total."

  - kind: formula
    kicker: Read the formula
    title: How long you wait
    tex: "t_{\\text{full}} = t_0 + \\frac{n}{r}"
    say: "The wait for a full answer is the start-up delay plus the length divided by the speed. Streaming shows the first token after only the start-up delay."
    verify:
      - { expr: "wait", equals: 10.6, tol: 0.01 }
      - { expr: "0.6 + 400 / 40", equals: 10.6, tol: 0.01 }
    symbols:
      - { tex: "t_{\\text{full}}", means: "seconds until the whole answer exists", value: wait }
      - { tex: "t_0", means: "start-up delay before the first token, about 0.6 seconds", value: first }
      - { tex: "n", means: "tokens in the answer", value: len }
      - { tex: "r", means: "tokens per second", value: tps }

  - kind: lab
    kicker: Try it
    title: Streaming changes how it feels
    intro: "Both screens finish at the same moment. But with streaming the user sees text after the **first token**, not the last. **Drag the length.**"
    view:
      type: bars
      max: 31
      items:
        - { label: "wait without streaming (s)", value: wait, color: "#ef4444" }
        - { label: "wait to first word, streaming (s)", value: first, color: "#1cd6ac" }
    sliders: [len, tps]
    outro: "Without streaming the page is blank for **{wait} seconds**. With streaming it starts after **{first} seconds**."

  - kind: code
    kicker: Read it
    title: Read a stream in the browser
    intro: "`fetch` gives you a **reader**. Loop, decode each chunk and show the text so far. An `AbortController` lets the user press stop."
    lang: javascript
    code: |
      const ctrl = new AbortController();     // call ctrl.abort() to stop
      const res = await fetch("/api/chat", {
        method: "POST",
        body: JSON.stringify({ question }),
        signal: ctrl.signal,
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let text = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        text += decoder.decode(value, { stream: true });
        render(text);                         // update the screen
      }
    note: "`stream: true` keeps a half-received character from breaking the text."

  - kind: check
    kicker: Check yourself
    title: What streaming saves
    question: "A 400-token answer arrives at 40 tokens per second. What does streaming improve?"
    options:
      - { text: "How soon the user sees the first word", correct: true, why: "The total time is the same. Streaming cuts the blank wait down to the first token." }
      - { text: "The total time to generate", why: "The model still needs the same time to write every token." }
      - { text: "The price per token", why: "Streaming does not change the bill." }

  - kind: check
    kicker: Check yourself
    title: Handle the middle
    question: "The connection drops halfway through an answer. What should your page do?"
    options:
      - { text: "Show the error and keep the text received so far", correct: true, why: "A stream can fail at any point, so handle errors mid-way and let the user retry." }
      - { text: "Nothing, streams never fail", why: "Networks drop. A mid-stream error must be handled." }
      - { text: "Throw away the partial text silently", why: "Hiding the failure confuses the user. Show it clearly." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**No stop button.** Long answers need a cancel so the user is not stuck waiting."
      - "**Re-rendering everything on every chunk.** Update only the growing text, or the page will stutter."
      - "**Forgetting to clean up.** Abort the request when the user leaves the page."
    next: { label: "Next: TypeScript essentials", href: /learn/typescript-essentials }
