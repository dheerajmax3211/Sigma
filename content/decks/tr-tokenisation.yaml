id: tr-tokenisation
title: "Tokenisation: how text becomes numbers"
minutes: 14
order: 301
params:
  - { id: v, label: "vocab size (thousands)", min: 1, max: 200, step: 1, init: 32 }
derived:
  - { id: table, expr: "v * 4.1" }
  - { id: toks, expr: "max(1200, 2600 - 8 * v)" }
cards:
  - kind: story
    kicker: Start here
    title: "Models read numbers, not letters"
    body:
      - "A language model cannot read the word 'hello'. Text is first chopped into **tokens**, and each token is swapped for an id."
      - "Tokens are usually pieces of words. 'unbelievable' might become 'un', 'believ' and 'able'. Common words stay whole."
      - "This is why you pay per token, why context has a token limit, and why models stumble on spelling and counting letters."
    callout: "A token is roughly three quarters of an English word."

  - kind: lab
    kicker: See it
    title: "The pipeline"
    intro: "Each step is simple. The clever part is choosing the pieces."
    view:
      type: flow
      stages:
        - { label: "Text", note: "'I love tokens'", color: "#38bdf8" }
        - { label: "Pieces", note: "'I', ' love', ' token', 's'", color: "#1cd6ac" }
        - { label: "Ids", note: "Each piece maps to a number in the vocabulary.", color: "#f97316" }
        - { label: "Embeddings", note: "Each id looks up a learned vector.", color: "#a78bfa" }

  - kind: code
    kicker: Write it
    title: "One step of byte pair encoding"
    intro: "BPE starts from single characters. It repeatedly merges the most frequent neighbouring pair into a new token."
    lang: python
    code: |
      from collections import Counter

      def merge_once(tokens):
          pairs = Counter(zip(tokens, tokens[1:]))
          if not pairs:
              return tokens
          (a, b), _ = pairs.most_common(1)[0]
          out, i = [], 0
          while i < len(tokens):
              if i + 1 < len(tokens) and tokens[i] == a and tokens[i + 1] == b:
                  out.append(a + b)
                  i += 2
              else:
                  out.append(tokens[i])
                  i += 1
          return out

      t = list("abababc")
      t = merge_once(t)
      assert t == ["ab", "ab", "ab", "c"]
      assert merge_once(t) == ["abab", "ab", "c"]
    note: "Real tokenisers run this thousands of times on a huge corpus and keep the merge list."

  - kind: lab
    kicker: See it
    title: "The vocabulary trade-off"
    intro: "A bigger vocabulary makes text shorter but the embedding table larger. The numbers are illustrative. **Drag the vocabulary size.**"
    view:
      type: bars
      max: 2600
      items:
        - { label: "tokens for a 1000 word page", value: toks, color: "#38bdf8" }
        - { label: "embedding table (millions of weights)", value: table, color: "#f97316" }
    sliders: [v]
    outro: "At {v} thousand tokens the page costs about **{toks} tokens** and the table holds about **{table} million** weights."

  - kind: check
    kicker: Your turn
    title: "Why subwords?"
    question: "Why do models use subword tokens rather than whole words?"
    options:
      - { text: "Any new or rare word can still be built from known pieces", correct: true, why: "Whole-word vocabularies fail on unseen words. Pieces cover everything." }
      - { text: "Subwords are always shorter", why: "Not always. Rare words split into many pieces." }
      - { text: "It removes the need for embeddings", why: "Embeddings are still needed." }
      - { text: "It makes the model faster at spelling", why: "Spelling is actually harder with subwords." }

  - kind: check
    kicker: Practice
    title: "Counting letters"
    question: "A model miscounts the letters in 'strawberry'. What is a likely cause?"
    options:
      - { text: "It sees tokens, not individual letters", correct: true, why: "The word may be one or two tokens, so letter-level facts are hidden." }
      - { text: "It cannot do arithmetic at all", why: "The issue is the input view." }
      - { text: "The vocabulary is too small", why: "Not the cause." }
      - { text: "Temperature was too low", why: "Unrelated." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Counting words instead of tokens.** Limits and prices use tokens."
      - "**Mixing tokenisers.** A model must use the tokeniser it was trained with."
      - "**Ignoring other languages.** Some scripts take many more tokens per word."
      - "**Trusting spelling tasks.** Tokens hide the letters."
    next: { label: "Next: positional encoding", href: /learn/tr-positional-encoding }
