id: "fd-matrix-shapes-gradients"
title: "Matrix calculus: gradients keep the shape"
minutes: 14
order: 702
params:
  - { id: "nin", label: "inputs", min: 1, max: 100, step: 1, init: 10 }
  - { id: "nout", label: "outputs", min: 1, max: 100, step: 1, init: 5 }
derived:
  - { id: "w", expr: "nin * nout" }
  - { id: "b", expr: "nout" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "One rule that saves hours"
    body:
      - "A layer computes y equals W times x. The loss has a gradient with respect to every number in W. So the gradient of W has **exactly the same shape as W**."
      - "Remember this and most backward pass bugs disappear. If your gradient has the wrong shape, you have a transposition error."
    callout: "Gradient shape equals parameter shape."
  - kind: "lab"
    kicker: "See it"
    title: "What a layer owns"
    intro: "A layer from some inputs to some outputs holds a weight matrix and a bias. **Drag both.**"
    view:
      type: "bars"
      max: 10000
      items:
        - { label: "weights", value: "w", color: "#38bdf8" }
        - { label: "biases", value: "b", color: "#f97316" }
    sliders:
      - "nin"
      - "nout"
    outro: "A layer with {nin} inputs and {nout} outputs has **{w}** weights and **{b}** biases. Each one gets its own gradient."
  - kind: "code"
    kicker: "Write it"
    title: "Gradients of a linear layer"
    intro: "Take the loss as the sum of the outputs, so each output has gradient 1."
    lang: "python"
    code: |
      W = [[1, 2, 3], [4, 5, 6]]     # shape 2 by 3
      x = [1, 0, 2]                   # length 3

      y = [sum(w * v for w, v in zip(row, x)) for row in W]
      assert y == [7, 16]

      dy = [1, 1]                     # gradient of the loss with respect to y
      dW = [[d * v for v in x] for d in dy]
      dx = [sum(W[i][j] * dy[i] for i in range(2)) for j in range(3)]

      assert dW == [[1, 0, 2], [1, 0, 2]]      # same shape as W
      assert dx == [5, 7, 9]                   # same shape as x
    note: "The pattern: dW is dy times x transposed, and dx is W transposed times dy."
  - kind: "lab"
    kicker: "Memorise"
    title: "Shape check recipe"
    intro: "Do this on paper before coding."
    view:
      type: "flow"
      stages:
        - { label: "Write shapes", note: "Name every tensor and its shape.", color: "#38bdf8" }
        - { label: "Forward", note: "Each result shape follows from the matmul rule.", color: "#1cd6ac" }
        - { label: "Backward", note: "Each gradient matches its tensor.", color: "#f97316" }
        - { label: "Assert", note: "Add shape asserts. They catch silent bugs.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Wrong shape"
    question: "W has shape 4 by 3. What shape is its gradient?"
    options:
      - { text: "4 by 3", correct: true, why: "Gradients match the parameter." }
      - { text: "3 by 4", why: "That is the transpose." }
      - { text: "4", why: "That is one row." }
      - { text: "12 by 1", why: "The shape stays a matrix." }
  - kind: "check"
    kicker: "Practice"
    title: "Batches"
    question: "With a batch of 32 inputs, what happens to the gradient of W?"
    options:
      - { text: "Contributions from all 32 are added together", correct: true, why: "The weights are shared, so gradients sum or average." }
      - { text: "It becomes 32 matrices", why: "They are combined." }
      - { text: "It is ignored", why: "No." }
      - { text: "It doubles", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Forgetting the transpose.** Check shapes first."
      - "**Not summing over the batch.** Weights are shared."
      - "**Skipping shape asserts.** They are cheap."
    next: { label: "Next: eigenvectors and SVD", href: "/learn/fd-eigen-svd" }
