id: "sd-agent-platform"
title: "Agent platforms: retries and reliability"
minutes: 14
order: 609
params:
  - { id: "s", label: "success of each step", min: 0.8, max: 1, step: 0.01, init: 0.95 }
  - { id: "n", label: "steps in the task", min: 1, max: 30, step: 1, init: 10 }
derived:
  - { id: "all", expr: "100 * s ^ n" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Every step can fail"
    body:
      - "An agent calls a model, then tools, then the model again, over many steps. Each step can time out, error, or go wrong."
      - "Small failure rates **compound**. A platform must retry safely, remember where it was, and stop runaway loops."
    callout: "Reliability comes from the platform, not from a better prompt."
  - kind: "lab"
    kicker: "See it"
    title: "Failures multiply"
    intro: "If each step succeeds with some chance, the whole task needs all of them. **Drag both.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "chance the whole task works", value: "all", color: "#f97316" }
        - { label: "chance a single step works", value: "s * 100", color: "#38bdf8" }
    sliders:
      - "s"
      - "n"
    outro: "With steps that work {s} of the time and {n} of them, the task works only **{all} percent** of the time."
  - kind: "code"
    kicker: "Write it"
    title: "Safe retries"
    intro: "A retry must not repeat a side effect. An idempotency key makes a repeated call return the old result."
    lang: "python"
    code: |
      calls = []
      done = {}

      def charge(key, amount):
          if key in done:
              return done[key]
          calls.append(amount)
          done[key] = "ok"
          return "ok"

      assert charge("k1", 5) == "ok"
      assert charge("k1", 5) == "ok"
      assert calls == [5]

      def retry(fn, tries):
          for i in range(tries):
              try:
                  return fn(i)
              except ValueError:
                  pass
          raise RuntimeError("gave up")

      def flaky(i):
          if i < 2:
              raise ValueError
          return "x"

      assert retry(flaky, 3) == "x"
    note: "Without the key, a retried payment could charge the customer twice."
  - kind: "lab"
    kicker: "Memorise"
    title: "Platform pieces"
    intro: "What an agent platform provides."
    view:
      type: "flow"
      stages:
        - { label: "Queue", note: "Tasks wait their turn. Workers can crash safely.", color: "#38bdf8" }
        - { label: "State", note: "Save progress after each step so a task can resume.", color: "#1cd6ac" }
        - { label: "Limits", note: "Cap steps, time and spend per task.", color: "#f97316" }
        - { label: "Trace", note: "Log every call to debug failures.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Compounding"
    question: "A task has 20 steps at 98 percent each. About how reliable is the task?"
    options:
      - { text: "Roughly two thirds", correct: true, why: "0.98 to the power 20 is about 0.67." }
      - { text: "98 percent", why: "That is one step." }
      - { text: "Nearly certain", why: "Failures compound." }
      - { text: "Zero", why: "Not that low." }
  - kind: "check"
    kicker: "Practice"
    title: "Retry danger"
    question: "Which action is unsafe to retry blindly?"
    options:
      - { text: "Sending an email or charging a card", correct: true, why: "Side effects repeat. Use idempotency keys." }
      - { text: "Reading a page", why: "Reads are safe." }
      - { text: "Computing a sum", why: "Safe." }
      - { text: "Listing files", why: "Safe." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Unbounded loops.** Cap steps and spend."
      - "**No saved state.** A crash restarts everything."
      - "**Retrying side effects blindly.** Use idempotency keys."
    next: { label: "Next: monitoring and rollouts", href: "/learn/sd-monitoring-rollouts" }
