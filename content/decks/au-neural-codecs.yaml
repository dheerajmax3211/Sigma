id: "au-neural-codecs"
title: "Neural audio codecs and quantisation"
minutes: 15
order: 1006
params:
  - { id: "q", label: "codebooks (stages)", min: 1, max: 8, step: 1, init: 4 }
derived:
  - { id: "kbps", expr: "q * 0.75" }
  - { id: "ratio", expr: "round(256 / kbps)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Compress sound into tokens"
    body:
      - "A **neural audio codec** has an encoder that squeezes audio into a short sequence. A quantiser snaps each step to a code from a book of entries. A decoder then rebuilds the sound."
      - "To keep quality, it quantises in stages. The first stage picks the closest code. The next picks a code for the **leftover**, then the next for what is left, and so on. This is **residual vector quantisation**, and each stage adds detail."
    callout: "Each stage fixes what the last one missed."
  - kind: "lab"
    kicker: "See it"
    title: "Bitrate"
    intro: "Say 75 frames per second and 1024 codes per book, which is 10 bits per stage. Raw 16 kHz audio is 256 kilobits per second. **Drag the stages.**"
    view:
      type: "bars"
      max: 256
      items:
        - { label: "codec rate (kilobits per second)", value: "kbps", color: "#1cd6ac" }
        - { label: "raw audio (kilobits per second)", value: "256", color: "#ef4444" }
    sliders:
      - "q"
    outro: "With {q} stages the codec uses **{kbps} kilobits per second**, about {ratio} times smaller than raw audio."
  - kind: "code"
    kicker: "Write it"
    title: "Residual quantisation in one dimension"
    intro: "Three small books. Each stage shrinks the error."
    lang: "python"
    code: |
      def nearest(book, x):
          return min(book, key=lambda c: abs(c - x))

      def rvq(x, books):
          codes, recon = [], 0.0
          for book in books:
              c = nearest(book, x - recon)
              codes.append(c)
              recon += c
          return codes, recon

      books = [[0, 4, 8], [0, 1, 2], [0, 0.25, 0.5]]
      codes, recon = rvq(5.3, books)
      assert codes == [4, 1, 0.25]
      assert abs(recon - 5.25) < 1e-12
      assert abs(5.3 - rvq(5.3, books[:1])[1]) > abs(5.3 - rvq(5.3, books[:2])[1]) > abs(5.3 - recon)

      bits_per_second = 3 * 10 * 75
      assert bits_per_second == 2250
    note: "Dropping the later stages gives a lower bitrate and lower quality, so one model can serve many rates."
  - kind: "lab"
    kicker: "Memorise"
    title: "What codecs are for"
    intro: "Where the tokens go."
    view:
      type: "flow"
      stages:
        - { label: "Telephony", note: "Cheap streaming of voice.", color: "#38bdf8" }
        - { label: "Speech generation", note: "Language models write codec tokens.", color: "#1cd6ac" }
        - { label: "Music", note: "Wider bandwidth, more stages.", color: "#f97316" }
        - { label: "Editing", note: "Work in the token space.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Residual"
    question: "What does the second quantiser stage encode?"
    options:
      - { text: "What the first stage got wrong", correct: true, why: "The leftover error." }
      - { text: "The same thing again", why: "It would add nothing." }
      - { text: "The text", why: "No." }
      - { text: "Silence", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Rate"
    question: "You use fewer stages. What happens?"
    options:
      - { text: "Lower bitrate and lower quality", correct: true, why: "Less detail is stored." }
      - { text: "Higher quality", why: "No." }
      - { text: "Same everything", why: "No." }
      - { text: "The sample rate rises", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Codebook collapse.** Some entries are never used. Track usage."
      - "**Judging by loss only.** Listen."
      - "**Mismatched codec at train and serve.**"
    next: { label: "Next: text to speech", href: "/learn/au-tts" }
