id: dl-batchnorm
title: "Batch normalisation"
minutes: 13
order: 405
params:
  - { id: B, label: "batch size", min: 1, max: 256, step: 1, init: 16 }
derived:
  - { id: noise, expr: "100 / sqrt(B)" }
cards:
  - kind: story
    kicker: Start here
    title: "Keep every layer's inputs steady"
    body:
      - "As weights change, the numbers entering later layers keep shifting, which slows learning. **Batch norm** rescales each feature across the batch to mean zero and variance one."
      - "It then applies a learned scale and shift. Networks train faster and tolerate larger learning rates."
    callout: "Used in image models. Transformers use layer norm instead."

  - kind: lab
    kicker: See it
    title: "Why small batches are noisy"
    intro: "Batch norm estimates the mean from the batch. Fewer samples mean a noisier estimate. **Drag the batch size.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "noise in the batch mean (relative)", value: noise, color: "#ef4444" }
        - { label: "a single sample (relative)", value: "100", color: "#38bdf8" }
    sliders: [B]
    outro: "With a batch of {B}, the estimate is off by about **{noise}** units compared with a single sample at 100."

  - kind: code
    kicker: Write it
    title: "Train mode and eval mode"
    intro: "Training uses the batch statistics and updates running averages. Evaluation uses the saved averages."
    lang: python
    code: |
      import math

      class BN:
          def __init__(self, momentum=0.1, eps=1e-5):
              self.rm, self.rv, self.mo, self.eps = 0.0, 1.0, momentum, eps

          def __call__(self, xs, training):
              if training:
                  m = sum(xs) / len(xs)
                  v = sum((x - m) ** 2 for x in xs) / len(xs)
                  self.rm = (1 - self.mo) * self.rm + self.mo * m
                  self.rv = (1 - self.mo) * self.rv + self.mo * v
              else:
                  m, v = self.rm, self.rv
              return [(x - m) / math.sqrt(v + self.eps) for x in xs]

      bn = BN()
      y = bn([1.0, 2.0, 3.0, 4.0], training=True)
      assert abs(sum(y)) < 1e-9
      assert abs(bn.rm - 0.25) < 1e-12
      z = bn([10.0], training=False)
      assert z[0] > 5
    note: "At eval time one sample is normalised with stored averages, so the result does not depend on its batch."

  - kind: lab
    kicker: Compare
    title: "Pick a normaliser"
    intro: "They differ in what they average over."
    view:
      type: flow
      stages:
        - { label: "Batch norm", note: "Across the batch, per feature. Needs decent batch size.", color: "#38bdf8" }
        - { label: "Layer norm", note: "Across features, per sample. Used in transformers.", color: "#1cd6ac" }
        - { label: "Group norm", note: "Across groups of channels. Good for small batches.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "A batch of one"
    question: "Why does batch norm struggle with a batch size of 1 in training?"
    options:
      - { text: "One sample gives a useless mean and variance", correct: true, why: "The statistics need several samples to mean anything." }
      - { text: "It cannot multiply", why: "No." }
      - { text: "It needs a GPU", why: "No." }
      - { text: "It drops neurons", why: "No." }

  - kind: check
    kicker: Practice
    title: "Different at serving"
    question: "A model scores well in training mode but poorly in eval mode. A likely cause?"
    options:
      - { text: "The running averages are off, for example from tiny or unrepresentative batches", correct: true, why: "Eval mode uses stored statistics, so bad ones hurt." }
      - { text: "Dropout is too low", why: "Not related." }
      - { text: "The loss is wrong", why: "Unlikely." }
      - { text: "The vocabulary is large", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting `eval()`.** Batch statistics leak into predictions."
      - "**Tiny batches.** Switch to group or layer norm."
      - "**Freezing a layer but not its norm.** Running averages keep updating."
    next: { label: "Next: convolutions", href: /learn/dl-convolutions }
