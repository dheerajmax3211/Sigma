id: "au-voice-streaming"
title: "Voice agents: streaming and latency"
minutes: 15
order: 1009
params:
  - { id: "asr", label: "speech recognition (ms)", min: 50, max: 500, step: 10, init: 150 }
  - { id: "llm", label: "language model first token (ms)", min: 100, max: 1500, step: 50, init: 400 }
  - { id: "tts", label: "speech synthesis first audio (ms)", min: 50, max: 500, step: 10, init: 150 }
  - { id: "net", label: "network (ms)", min: 20, max: 300, step: 10, init: 80 }
derived:
  - { id: "tot", expr: "asr + llm + tts + net" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "The gap people notice"
    body:
      - "In conversation, people leave about **a quarter to a half second** between turns. A voice agent that takes two seconds feels broken."
      - "The delay is the sum of the stages: recognise, think, speak, and the network. Voice agents win by **streaming**, starting each stage before the one before it has finished, and by detecting quickly that the user stopped talking."
    callout: "Overlap the stages and add up what is left."
  - kind: "lab"
    kicker: "See it"
    title: "The latency budget"
    intro: "Time from the user finishing to the first sound. **Drag the four stages.**"
    view:
      type: "bars"
      max: 2800
      items:
        - { label: "total delay (ms)", value: "tot", color: "#f97316" }
        - { label: "a comfortable limit, 800 ms", value: "800", color: "#1cd6ac" }
    sliders:
      - "asr"
      - "llm"
      - "tts"
      - "net"
    outro: "The stages add to **{tot} ms**. Cutting the language model wait usually helps most."
  - kind: "code"
    kicker: "Write it"
    title: "Endpointing and barge-in"
    intro: "Decide the user finished, and stop talking if they interrupt."
    lang: "python"
    code: |
      def endpoint(energies, threshold=0.5, hang=3):
          silent = 0
          started = False
          for i, e in enumerate(energies):
              if e >= threshold:
                  started, silent = True, 0
              elif started:
                  silent += 1
                  if silent == hang:
                      return i
          return None

      assert endpoint([0.9, 0.8, 0.1, 0.1, 0.1, 0.1, 0.9]) == 4
      assert endpoint([0.9, 0.1, 0.9, 0.1, 0.9]) is None      # short pauses do not end a turn
      assert endpoint([0.1, 0.1, 0.1]) is None                # never started

      def on_user_speech(bot_speaking):
          return "stop_talking" if bot_speaking else "listen"

      assert on_user_speech(True) == "stop_talking"           # barge-in
    note: "A longer hang waits for slow talkers but adds delay. Smarter systems also read the words to see if a sentence is complete."
  - kind: "lab"
    kicker: "Memorise"
    title: "Where time goes"
    intro: "Typical fixes."
    view:
      type: "flow"
      stages:
        - { label: "Stream recognition", note: "Transcribe while the user speaks.", color: "#38bdf8" }
        - { label: "Stream the model", note: "Start speech on the first sentence.", color: "#1cd6ac" }
        - { label: "Warm connections", note: "Keep sockets and models loaded.", color: "#f97316" }
        - { label: "Nearby servers", note: "Cut the network leg.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Add up"
    question: "Stages take 150, 400, 150 and 80 ms. Total?"
    options:
      - { text: "780 ms", correct: true, why: "The sum of all four." }
      - { text: "400 ms", why: "That is only the slowest." }
      - { text: "150 ms", why: "No." }
      - { text: "1000 ms", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Barge-in"
    question: "The user talks while the agent is speaking. What should happen?"
    options:
      - { text: "The agent stops and listens", correct: true, why: "Like a polite human." }
      - { text: "It talks louder", why: "No." }
      - { text: "It finishes the sentence", why: "Rude." }
      - { text: "It ends the call", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Waiting for the full reply before speaking.** Stream sentences."
      - "**Cutting the user off on a pause.** Tune the hang time."
      - "**Ignoring echo.** The agent can hear itself."
    next: { label: "Back to all lessons", href: "/learn" }
