id: dsa-stacks
title: "Stacks"
minutes: 14
order: 107
params:
  - { id: s, label: "step", min: 0, max: 6, step: 1, init: 0 }
  - { id: d, label: "nesting depth", min: 0, max: 8, step: 1, init: 3 }
cards:
  - kind: story
    kicker: Start here
    title: "A stack of plates"
    body:
      - "A **stack** lets you add and remove only at the top. The last plate you put on is the first one you take off. This rule is called **last in, first out**."
      - "In Python a list does the job: `append` pushes and `pop` removes the top. Both are O(1)."
    callout: "Clue words: matching brackets, undo, nested, most recent, next greater."

  - kind: lab
    kicker: See it
    title: "Matching brackets"
    intro: "Read `( [ { } ] )` left to right. Push every opener. At a closer, the top must be its partner, then pop. **Drag the step.**"
    view:
      type: array
      cells: ["(", "[", "{", "}", "]", ")"]
      pointers:
        - { label: "read", at: "max(0, s - 1)", color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Nothing read yet. The stack is empty."
      - "Read **(**. Push it. Stack: ( "
      - "Read **[**. Push it. Stack: ( ["
      - "Read **{**. Push it. Stack: ( [ {"
      - "Read **}**. The top is {, a match. Pop. Stack: ( ["
      - "Read **]**. The top is [, a match. Pop. Stack: ("
      - "Read **)**. Match, pop. The stack is empty, so the string is valid."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Valid parentheses"
    intro: "A dict maps each closer to its opener. A mismatch, or leftovers at the end, means invalid."
    lang: python
    code: |
      def valid(s):
          pair = {")": "(", "]": "[", "}": "{"}
          st = []
          for ch in s:
              if ch in pair:
                  if not st or st.pop() != pair[ch]:
                      return False
              else:
                  st.append(ch)
          return not st

      assert valid("()[]{}") and valid("([{}])")
      assert not valid("(]") and not valid("((") and not valid(")")
    note: "O(n) time, O(n) space for the stack."

  - kind: check
    kicker: Your turn
    title: "Read the stack"
    question: "You push 1, push 2, pop, push 3, pop. What is on the stack now?"
    options:
      - { text: "1 only", correct: true, why: "pop removed 2, then 3 was pushed and removed. Only 1 remains." }
      - { text: "1 and 3", why: "3 was popped by the last operation." }
      - { text: "Empty", why: "1 was never popped." }
      - { text: "2", why: "2 was popped first." }

  - kind: lab
    kicker: Memory
    title: "Why deep nesting costs memory"
    intro: "The stack holds one item per open bracket. A string nested **d** levels deep needs d slots. **Drag the depth.**"
    view:
      type: bars
      max: 8
      items:
        - { label: "stack size needed", value: d, color: "#1cd6ac" }
        - { label: "string length", value: "2 * d", color: "#38bdf8" }
    sliders: [d]
    outro: "Depth {d} needs a stack of {d}. The same idea is why very deep recursion crashes: each call is a stack entry."

  - kind: code
    kicker: Monotonic stack
    title: "Next warmer day"
    intro: "For each day, how many days until a warmer one? Keep a stack of days still waiting. A warmer temperature settles everything colder on top."
    lang: python
    code: |
      def warmer(t):
          ans = [0] * len(t)
          st = []                       # indexes, temperatures falling
          for i, x in enumerate(t):
              while st and t[st[-1]] < x:
                  j = st.pop()
                  ans[j] = i - j
              st.append(i)
          return ans

      assert warmer([73, 74, 75, 71, 69, 72, 76, 73]) == [1, 1, 4, 2, 1, 1, 0, 0]
    note: "Each index is pushed once and popped once, so the total is O(n), not O(n squared)."

  - kind: code
    kicker: Design
    title: "Min stack"
    intro: "A stack that also returns the smallest value in O(1). Store each value with the minimum so far."
    lang: python
    code: |
      class MinStack:
          def __init__(self):
              self.st = []                     # (value, min so far)

          def push(self, x):
              m = min(x, self.st[-1][1]) if self.st else x
              self.st.append((x, m))

          def pop(self):
              return self.st.pop()[0]

          def get_min(self):
              return self.st[-1][1]

      m = MinStack()
      for x in [5, 3, 7, 3]:
          m.push(x)
      assert m.get_min() == 3
      m.pop(); m.pop()
      assert m.get_min() == 3
      m.pop()
      assert m.get_min() == 5
    note: "Storing the running minimum beside each item means popping needs no search."

  - kind: check
    kicker: Practice
    title: "Which tool?"
    question: "Evaluate `3 4 + 2 *` (postfix). Which structure fits?"
    options:
      - { text: "A stack of numbers", correct: true, why: "Push numbers. On an operator pop two, compute, push the result. 3 4 + gives 7, then 7 2 * gives 14." }
      - { text: "A set", why: "Order and repeats matter." }
      - { text: "A dict", why: "No lookup by key here." }
      - { text: "Two pointers", why: "Nothing is sorted." }

  - kind: practice
    kicker: Your turn
    title: "Balanced brackets"
    intro: "Write `balanced(s)` that is true when every bracket in `()[]{}` is closed by the right kind in the right order. Use a stack."
    entry: balanced
    starter: |
      def balanced(s):
          pass
    solution: |
      def balanced(s):
          pairs = {')': '(', ']': '[', '}': '{'}
          st = []
          for c in s:
              if c in '([{':
                  st.append(c)
              elif not st or st.pop() != pairs[c]:
                  return False
          return not st
    tests:
      - { input: "[\"()[]{}\"]", expected: "true" }
      - { input: "[\"(]\"]", expected: "false" }
      - { input: "[\"((\"]", expected: "false" }
      - { input: "[\"{[]}\"]", expected: "true" }
    hint: "Push openers. On a closer, the top of the stack must be its partner."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Popping an empty stack.** Check `if st` first. It raises an error otherwise."
      - "**Forgetting leftovers.** `((` never fails mid-loop. Return `not st` at the end."
      - "**Using `list.pop(0)`.** That is the front, O(n). Stacks use the end."
      - "**Mixing up peek and pop.** `st[-1]` looks. `st.pop()` removes."
    next: { label: "Next: queues and deques", href: /learn/dsa-queues-and-deques }
