id: backpropagation
order: 18
title: Backpropagation
minutes: 8
params:
  - { id: x, label: x, min: -3, max: 3, step: 0.1, init: 2 }
  - { id: w1, label: w₁, min: -2, max: 2, step: 0.1, init: 0.5 }
  - { id: w2, label: w₂, min: -2, max: 2, step: 0.1, init: 0.5 }
  - { id: y, label: y, min: -4, max: 4, step: 0.1, init: 3 }
  - { id: lr, label: rate, min: 0.005, max: 0.2, step: 0.005, init: 0.02 }
derived:
  - { id: h, expr: w1 * x }
  - { id: yh, expr: w2 * h }
  - { id: L, expr: (yh - y) ^ 2 }
  - { id: dyh, expr: 2 * (yh - y) }
  - { id: dw2, expr: dyh * h }
  - { id: dh, expr: dyh * w2 }
  - { id: dw1, expr: dh * x }
cards:
  - kind: story
    kicker: The problem
    title: Who made the team lose?
    body:
      - Imagine a relay race. The team finishes slowly. Was it the first runner, the second, or a bad handoff between them?
      - A neural network is a relay of tiny steps, each with a number called a **weight**. When the answer is wrong, we need to know **how much each weight is to blame**, so we can fix the guilty ones the most.
    callout: Backpropagation is the method that hands out that blame. Nothing more. It does not change the weights itself.

  - kind: lab
    kicker: See it first
    title: The smallest network that can be wrong
    intro: "Two weights, one chain: **x → w₁ → h → w₂ → ŷ**. The loss measures how far the guess ŷ is from the target y. **Drag the sliders** and watch every number change."
    view:
      type: chain
      nodes:
        - { label: input x, value: x, color: "#38bdf8" }
        - { label: hidden h, value: h, color: "#a78bfa" }
        - { label: guess ŷ, value: yh, color: "#1cd6ac" }
        - { label: loss, value: L, color: "#f97316" }
      edges:
        - { label: w₁, value: w1 }
        - { label: w₂, value: w2 }
        - {}
    sliders: [x, w1, w2, y]
    outro: Right now the guess is **{yh}** and the target is **{y}**, so the loss is **{L}**.

  - kind: formula
    kicker: Read the formula
    title: "Going forward: what each symbol means"
    tex: "h = w_1\\,x,\\qquad \\hat y = w_2\\,h,\\qquad L = (\\hat y - y)^2"
    say: Multiply x by w₁ to get h, multiply h by w₂ to get the guess, then square the gap to the target. Squaring keeps the loss positive and punishes big misses.
    verify:
      - { expr: "L", equals: 6.25, tol: 0.01 }
      - { expr: "2*(0.5*0.5*2-3)*0.5*2", equals: -5, tol: 0.01 }
      - { expr: "dw1", equals: -5, tol: 0.01 }
    symbols:
      - { tex: x, means: the input, value: x }
      - { tex: w_1, means: "first weight: scales x into h", value: w1 }
      - { tex: h, means: "hidden value, w₁ times x", value: h }
      - { tex: w_2, means: "second weight: scales h into the guess", value: w2 }
      - { tex: "\\hat y", means: "“y hat”, the network's guess", value: yh }
      - { tex: y, means: the correct answer (target), value: y }
      - { tex: L, means: "loss: how wrong the guess is", value: L }

  - kind: reveal
    kicker: The idea
    title: Hand out the blame, backwards
    intro: Start at the end, where the error is easy to see, and walk back one step at a time. **Press Next blame.**
    view:
      type: chain
      nodes:
        - { label: input x, value: x, color: "#38bdf8" }
        - { label: hidden h, value: h, color: "#a78bfa" }
        - { label: guess ŷ, value: yh, color: "#1cd6ac" }
        - { label: loss, value: L, color: "#f97316" }
      edges:
        - { label: w₁, value: w1, blame: dw1, blameAt: 3 }
        - { label: w₂, value: w2, blame: dw2, blameAt: 1 }
        - { blame: dyh, blameAt: 0 }
    steps:
      - { tex: "\\partial L/\\partial \\hat y", says: How much the loss changes if the guess moves a little, value: "2(ŷ − y) = {dyh}" }
      - { tex: "\\partial L/\\partial w_2", says: "Blame on w₂ = the line above × h", value: "{dyh} × {h} = {dw2}" }
      - { tex: "\\partial L/\\partial h", says: "Blame passed back to h = the first line × w₂", value: "{dyh} × {w2} = {dh}" }
      - { tex: "\\partial L/\\partial w_1", says: "Blame on w₁ = blame on h × x", value: "{dh} × {x} = {dw1}" }
    outro: Each line reuses the line above it. That reuse is the **chain rule**, and it is why this scales to billions of weights.

  - kind: lab
    kicker: Try it
    title: Use the blame to fix the weights
    intro: Each weight moves a small step **against** its blame. The step size is the **learning rate**. Press the button several times and watch the loss.
    view:
      type: chain
      nodes:
        - { label: input x, value: x, color: "#38bdf8" }
        - { label: hidden h, value: h, color: "#a78bfa" }
        - { label: guess ŷ, value: yh, color: "#1cd6ac" }
        - { label: loss, value: L, color: "#f97316" }
      edges:
        - { label: w₁, value: w1, blame: dw1 }
        - { label: w₂, value: w2, blame: dw2 }
        - { blame: dyh }
    showBlame: true
    sliders: [lr]
    action:
      label: Nudge weights
      set: { w1: "w1 - rate * dw1", w2: "w2 - rate * dw2" }
      rate: lr
      track: L
      hint: Try a rate of 0.2. If the loss explodes, that is a real failure mode called divergence.

  - kind: check
    kicker: Check yourself
    title: Which weight gets the most blame?
    question: With x = {x}, w₁ = {w1}, w₂ = {w2}, the blames are w₁ **{dw1}** and w₂ **{dw2}**. Why are they different?
    options:
      - { text: Because one weight is closer to the output, why: "Closeness alone is not it. Look at the formulas: each blame ends with the value that weight multiplies." }
      - { text: Because each blame is scaled by the value its weight multiplies, correct: true, why: "Yes. w₁ multiplies x and w₂ multiplies h, so a bigger input value means more blame. Set x to 0 in card 2 and the blame on w₁ vanishes." }
      - { text: Because backprop picks one at random, why: "Backprop is exact arithmetic with no randomness. Same numbers in, same blame out." }

  - kind: practice
    kicker: Your turn
    title: "Chain rule by hand"
    intro: "For `y = (w * x - t) ** 2`, write `grad_w(w, x, t)` returning the derivative of `y` with respect to `w`. Use the chain rule: outer derivative times inner derivative."
    entry: grad_w
    starter: |
      def grad_w(w, x, t):
          pass
    solution: |
      def grad_w(w, x, t):
          return 2 * (w * x - t) * x
    tests:
      - { input: "[1, 2, 3]", expected: "-4" }
      - { input: "[0, 1, 1]", expected: "-2" }
      - { input: "[2, 3, 6]", expected: "0" }
    hint: "The outer part gives 2 times the bracket. The inner part gives x."

  - kind: mistakes
    kicker: Watch out
    title: Two mistakes everyone makes
    items:
      - "**Thinking backprop updates the weights.** It only computes blame (gradients). The optimizer decides the step."
      - "**Forgetting to reset gradients.** In PyTorch, gradients add up across calls unless you zero them, so your fix pushes the wrong way."
    next: { label: "Next: your first PyTorch model", href: /learn/pytorch-first-model }
