id: "au-wer"
title: "Measuring recognition: word error rate"
minutes: 13
order: 1005
params:
  - { id: "s", label: "substitutions", min: 0, max: 30, step: 1, init: 5 }
  - { id: "d", label: "deletions", min: 0, max: 20, step: 1, init: 3 }
  - { id: "i", label: "insertions", min: 0, max: 20, step: 1, init: 2 }
  - { id: "n", label: "words in the reference", min: 20, max: 200, step: 10, init: 100 }
derived:
  - { id: "wer", expr: "100 * (s + d + i) / n" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "One number for recognisers"
    body:
      - "To score a recogniser, compare what it wrote with the true transcript. **Word error rate**, WER, counts the fewest edits to turn one into the other: **substitutions**, **deletions** and **insertions**, divided by the number of true words."
      - "Lower is better. It can exceed 100 percent if the system adds many extra words."
    callout: "Count edits, divide by the true length."
  - kind: "lab"
    kicker: "See it"
    title: "Building the score"
    intro: "Add up the three kinds of mistake. **Drag them.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "word error rate (percent)", value: "wer", color: "#ef4444" }
        - { label: "a good system on clean speech: 5", value: "5", color: "#1cd6ac" }
    sliders:
      - "s"
      - "d"
      - "i"
      - "n"
    outro: "{s} substitutions, {d} deletions and {i} insertions over {n} words give a WER of **{wer} percent**."
  - kind: "code"
    kicker: "Write it"
    title: "Word error rate"
    intro: "The edit distance, over words."
    lang: "python"
    code: |
      def edits(ref, hyp):
          r, h = ref.split(), hyp.split()
          d = [[0] * (len(h) + 1) for _ in range(len(r) + 1)]
          for i in range(len(r) + 1):
              d[i][0] = i
          for j in range(len(h) + 1):
              d[0][j] = j
          for i in range(1, len(r) + 1):
              for j in range(1, len(h) + 1):
                  cost = 0 if r[i - 1] == h[j - 1] else 1
                  d[i][j] = min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost)
          return d[-1][-1]

      def wer(ref, hyp):
          return edits(ref, hyp) / len(ref.split())

      assert wer("the cat sat on the mat", "the cat sat on the mat") == 0
      assert wer("the cat sat on the mat", "the cat sat the mat") == 1 / 6      # one deletion
      assert wer("the cat sat on the mat", "a cat sat on the mat") == 1 / 6     # one substitution
      assert wer("a", "b c d") == 3                                              # above 100 percent
    note: "Normalise case and punctuation the same way for both texts before scoring."
  - kind: "lab"
    kicker: "Memorise"
    title: "Beyond one number"
    intro: "What WER hides."
    view:
      type: "flow"
      stages:
        - { label: "Which words", note: "Names and numbers matter more than the word the.", color: "#ef4444" }
        - { label: "Which speakers", note: "Accents and ages can differ a lot.", color: "#f97316" }
        - { label: "Which conditions", note: "Noise and phone lines raise it.", color: "#38bdf8" }
        - { label: "Latency", note: "A live system also needs speed.", color: "#1cd6ac" }
  - kind: "check"
    kicker: "Your turn"
    title: "Compute"
    question: "Reference has 10 words. The system makes 1 substitution and 1 deletion. WER?"
    options:
      - { text: "20 percent", correct: true, why: "Two edits over ten words." }
      - { text: "10 percent", why: "Two edits, not one." }
      - { text: "2 percent", why: "No." }
      - { text: "80 percent", why: "That is the accuracy." }
  - kind: "check"
    kicker: "Practice"
    title: "Over 100"
    question: "Can WER be above 100 percent?"
    options:
      - { text: "Yes, with many insertions", correct: true, why: "Edits can exceed the reference length." }
      - { text: "No, never", why: "It can." }
      - { text: "Only for music", why: "No." }
      - { text: "Only in French", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Comparing WER across different normalisation.** Use one rule."
      - "**Testing on the training speakers.** Hold out speakers."
      - "**Averaging per sentence instead of over all words.**"
    next: { label: "Next: neural audio codecs", href: "/learn/au-neural-codecs" }
