id: build-rag-system
title: "Build a retrieval system"
order: 1206
minutes: 25
params:
  - { id: docs, label: "documents in millions", min: 1, max: 100, step: 1, init: 10 }
  - { id: m, label: "bytes per vector after compression", min: 8, max: 64, step: 8, init: 16 }
derived:
  - { id: flat, expr: "docs * 1.536" }
  - { id: small, expr: "docs * m / 1000" }
cards:
  - kind: story
    kicker: Guided build
    title: "Find, then rank"
    body:
      - "Search over millions of chunks must be fast and good. So it runs in two stages: a cheap search that finds a few hundred candidates, then a careful ranker that orders them."
      - "You will build the **recall** measure, a way to **fuse two rankings**, and the **compression ratio** that makes big indexes fit in memory."

  - kind: lab
    kicker: See it first
    title: "Why compress vectors"
    intro: "A 384 number vector in full precision takes 1536 bytes. Product quantisation stores a few bytes instead. **Drag the sliders.**"
    view:
      type: bars
      max: 160
      items:
        - { label: "gigabytes, full vectors", value: flat, color: "#ef4444" }
        - { label: "gigabytes, compressed", value: small, color: "#1cd6ac" }
    sliders: [docs, m]
    outro: "{docs} million documents need **{flat} GB** raw, or **{small} GB** compressed at {m} bytes each. The trade is a little recall."

  - kind: code
    kicker: Starter code
    title: "Measure before you tune"
    intro: "You cannot improve search you do not measure. Recall at k asks how many right answers appear in the top k."
    lang: python
    code: |
      def recall_at_k(ranked, relevant, k):
          hit = len(set(ranked[:k]) & set(relevant))
          return round(hit / len(relevant), 2) if relevant else 0.0

      assert recall_at_k(['a', 'b', 'c'], ['a', 'c'], 2) == 0.5
      print(recall_at_k(['x'], [], 1))
    note: "Build a small list of questions with known right chunks and track this number."

  - kind: practice
    kicker: Build step
    title: "Recall at k"
    intro: "Write `recall_at_k(ranked, relevant, k)`: the share of `relevant` items that appear in the first `k` of `ranked`. Round to 2 places, and give 0.0 if `relevant` is empty."
    entry: recall_at_k
    starter: |
      def recall_at_k(ranked, relevant, k):
          pass
    solution: |
      def recall_at_k(ranked, relevant, k):
          hit = len(set(ranked[:k]) & set(relevant))
          return round(hit / len(relevant), 2) if relevant else 0.0
    tests:
      - { input: "[[\"a\", \"b\", \"c\"], [\"a\", \"c\"], 2]", expected: "0.5" }
      - { input: "[[\"a\"], [], 1]", expected: "0.0" }
      - { input: "[[\"x\", \"y\"], [\"y\"], 5]", expected: "1.0" }
    hint: "Count the overlap of the top k with the right answers."

  - kind: practice
    kicker: Build step
    title: "Fuse two rankings"
    intro: "Write `rrf(lists)`. Each id scores `1 / (60 + rank)` in every list that has it, with rank starting at 1. Add the scores, then return ids best first, ties broken by id."
    entry: rrf
    starter: |
      def rrf(lists):
          pass
    solution: |
      def rrf(lists):
          s = {}
          for lst in lists:
              for i, x in enumerate(lst):
                  s[x] = s.get(x, 0) + 1 / (60 + i + 1)
          return sorted(s, key=lambda x: (-round(s[x], 12), x))
    tests:
      - { input: "[[[\"a\", \"b\", \"c\"], [\"b\", \"a\", \"d\"]]]", expected: "[\"a\", \"b\", \"c\", \"d\"]" }
      - { input: "[[[\"x\", \"y\"], [\"y\", \"z\"]]]", expected: "[\"y\", \"x\", \"z\"]" }
    hint: "An item ranked well in two lists beats one ranked first in a single list."

  - kind: practice
    kicker: Build step
    title: "Compression ratio"
    intro: "Write `compression(d, m)`: how many times smaller a `d` number vector (4 bytes each) becomes when stored in `m` bytes. Round to 1 place."
    entry: compression
    starter: |
      def compression(d, m):
          pass
    solution: |
      def compression(d, m):
          return round(d * 4 / m, 1)
    tests:
      - { input: "[384, 16]", expected: "96.0" }
      - { input: "[768, 32]", expected: "96.0" }
      - { input: "[128, 8]", expected: "64.0" }
    hint: "Full size is d times 4 bytes."

  - kind: check
    kicker: Check yourself
    title: "Two stages"
    question: "Why not rank every chunk with the careful ranker?"
    options:
      - { text: "It is too slow, so a cheap search narrows the field first", correct: true, why: "The ranker costs much more per item than a vector lookup." }
      - { text: "The careful ranker is less accurate", why: "It is usually more accurate, just slower." }
      - { text: "Cheap search cannot find anything", why: "It finds good candidates fast." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**No recall measure.** You cannot tell if a change helped."
      - "**Reranking too many.** Latency grows with every candidate."
      - "**Compressing without checking.** Measure recall before and after."
    next: { label: "Back to all lessons", href: "/learn" }
