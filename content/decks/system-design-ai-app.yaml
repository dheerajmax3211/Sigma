id: system-design-ai-app
title: Designing an AI app
order: 44
minutes: 10
params:
  - { id: dau, label: "daily users", min: 1000, max: 100000, step: 1000, init: 20000 }
  - { id: msgs, label: "messages per user per day", min: 1, max: 20, step: 1, init: 6 }
derived:
  - { id: perday, expr: "dau * msgs" }
  - { id: avgrps, expr: "perday / 86400" }
  - { id: peak, expr: "avgrps * 5" }
  - { id: live, expr: "peak * 10" }
  - { id: bill, expr: "perday * 30 * 0.0135" }
cards:
  - kind: story
    kicker: Start here
    title: Numbers before boxes
    body:
      - "A design interview, or a real launch, starts with the same question. Who uses this, how often, and what must it cost and how fast must it feel?"
      - "Estimate the load first. Then choose parts to fit it. Then name where it will break."
    callout: "Requirements, then numbers, then boxes."

  - kind: lab
    kicker: See it first
    title: A RAG chat product at scale
    intro: "A chat app that answers from your documents. Each answer streams for about 10 seconds. Peak traffic is assumed 5 times the average. **Drag the sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. Browser", note: "**{perday}** messages a day arrive", color: "#38bdf8" }
        - { label: "2. API route", note: "about **{peak}** requests per second at peak", color: "#a78bfa" }
        - { label: "3. Retrieval", note: "a vector search in Postgres, quick and cheap", color: "#f59e0b" }
        - { label: "4. Model", note: "**{live}** answers streaming at the same moment", color: "#ef4444" }
        - { label: "5. Stream back", note: "tokens flow to the browser as they arrive", color: "#1cd6ac" }
    also:
      type: bars
      max: 1300
      items:
        - { label: "average requests per second", value: avgrps, color: "#38bdf8" }
        - { label: "peak requests per second", value: peak, color: "#f59e0b" }
        - { label: "open streams at peak", value: live, color: "#ef4444" }
    sliders: [dau, msgs]
    outro: "{dau} users sending {msgs} messages each means **{perday}** a day. The monthly model bill at 0.0135 dollars a message is about **{bill} dollars**."

  - kind: formula
    kicker: Read the formula
    title: Peak requests per second
    tex: "R_{\\text{peak}} = \\frac{U \\cdot m}{86400} \\times k"
    say: "Messages per day divided by the seconds in a day gives the average rate. Multiply by a peak factor k, since traffic is never flat."
    verify:
      - { expr: "avgrps", equals: 1.389, tol: 0.01 }
      - { expr: "peak", equals: 6.94, tol: 0.01 }
      - { expr: "live", equals: 69.4, tol: 0.1 }
    symbols:
      - { tex: "U", means: "users who send messages in a day", value: dau }
      - { tex: "m", means: "messages each user sends per day", value: msgs }
      - { tex: "86400", means: "seconds in one day" }
      - { tex: "k", means: "peak factor, assumed 5 here" }

  - kind: story
    kicker: Name the failure points
    title: Where it breaks first
    body:
      - "**The model**: rate limits and outages. Plan for retries and a fallback model. **Retrieval**: stale or missing documents give confident wrong answers."
      - "**Cost**: one heavy user can drain the budget, so add limits. **Prompt injection**: a document can carry instructions, so guard tool actions."
    callout: "Say it out loud before it happens."

  - kind: check
    kicker: Check yourself
    title: Capacity
    question: "Peak load is 7 requests per second and each answer streams for 10 seconds. About how many answers are open at once?"
    options:
      - { text: "About 70", correct: true, why: "Open streams equal the arrival rate times the duration, and 7 times 10 is 70." }
      - { text: "About 7", why: "That is the arrival rate. Each stream stays open for 10 seconds." }
      - { text: "About 700", why: "That is ten times too many. Multiply 7 by 10, not by 100." }

  - kind: check
    kicker: Check yourself
    title: First step
    question: "You are asked to design a chat app for a company. What do you do first?"
    options:
      - { text: "Ask who uses it, how often, and what it must cost", correct: true, why: "Requirements and rough numbers decide every later choice." }
      - { text: "Pick the vector database", why: "Choosing parts before you know the load is guessing." }
      - { text: "Draw the final architecture", why: "A diagram without numbers cannot be defended." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Designing for a million users on day one.** Size for the next ten times, not a hundred times."
      - "**Averages only.** Peaks decide whether it falls over, so estimate both."
      - "**No story for failure.** Say what the user sees when the model is down."
    next: { label: "Next: your capstone project", href: /learn/capstone-brief }
