id: dl-pooling-shape-algebra
title: "Pooling and tracking shapes"
minutes: 12
order: 407
params:
  - { id: size, label: "image size", min: 16, max: 128, step: 16, init: 64 }
  - { id: layers, label: "conv plus pool blocks", min: 0, max: 4, step: 1, init: 2 }
derived:
  - { id: final, expr: "size / 2 ^ layers" }
  - { id: kept, expr: "100 / 4 ^ layers" }
cards:
  - kind: story
    kicker: Start here
    title: "Shrink while you learn more"
    body:
      - "**Pooling** replaces each small window with one number, usually the largest. It halves height and width, makes the network less sensitive to small shifts, and cuts cost."
      - "A typical image network alternates convolutions with pooling. The picture gets smaller while the number of channels grows."
    callout: "Most shape bugs come from losing track of these numbers. Write them down."

  - kind: lab
    kicker: See it
    title: "Halving, block after block"
    intro: "Each block halves the side length. **Drag the sliders.**"
    view:
      type: bars
      max: 128
      items:
        - { label: "starting side length", value: size, color: "#38bdf8" }
        - { label: "side length after the blocks", value: final, color: "#1cd6ac" }
    sliders: [size, layers]
    outro: "After {layers} blocks a side of {size} becomes **{final}**. Only **{kept} percent** of the positions remain."

  - kind: code
    kicker: Write it
    title: "Max pooling and a shape trace"
    intro: "Pooling is a loop. Tracing shapes on paper before coding saves hours."
    lang: python
    code: |
      def maxpool1d(x, w):
          return [max(x[i:i + w]) for i in range(0, len(x) - w + 1, w)]

      def conv_out(n, k, p, s):
          return (n - k + 2 * p) // s + 1

      assert maxpool1d([1, 3, 2, 4, 6, 5], 2) == [3, 4, 6]
      n = 32
      n = conv_out(n, 3, 1, 1)
      assert n == 32
      n = n // 2
      assert n == 16
      n = conv_out(n, 3, 1, 1) // 2
      assert n == 8
    note: "After the last block the maps are flattened, or averaged, into a vector for the final layer."

  - kind: lab
    kicker: Memorise
    title: "A small image network"
    intro: "The common shape of the whole thing."
    view:
      type: flow
      stages:
        - { label: "Image", note: "Height, width and 3 colour channels.", color: "#38bdf8" }
        - { label: "Conv plus pool", note: "Repeat. Smaller maps, more channels.", color: "#1cd6ac" }
        - { label: "Flatten or average", note: "Turn the maps into one vector.", color: "#f97316" }
        - { label: "Dense", note: "Final layer gives class scores.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Pooled size"
    question: "A 16 by 16 map goes through 2 by 2 pooling with stride 2. What size results?"
    options:
      - { text: "8 by 8", correct: true, why: "Each side is halved." }
      - { text: "4 by 4", why: "That would be two poolings." }
      - { text: "14 by 14", why: "That is a kernel, not pooling." }
      - { text: "16 by 16", why: "Pooling shrinks." }

  - kind: check
    kicker: Practice
    title: "Why pool"
    question: "What is a benefit of max pooling?"
    options:
      - { text: "Small shifts of a feature barely change the output", correct: true, why: "The maximum of a window ignores exactly where inside it the feature sat." }
      - { text: "It adds weights", why: "Pooling has none." }
      - { text: "It raises resolution", why: "It lowers it." }
      - { text: "It normalises the batch", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Pooling too early.** Fine detail is lost."
      - "**Wrong flatten size.** Compute it from the trace, not by guess."
      - "**Channels first or last.** Frameworks differ."
    next: { label: "Next: CNN architectures", href: /learn/dl-cnn-architectures }
