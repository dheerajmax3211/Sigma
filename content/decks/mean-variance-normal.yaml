id: mean-variance-normal
title: Mean, spread and the bell curve
order: 5
minutes: 9
params:
  - { id: mu, label: "mean μ", min: -3, max: 3, step: 0.5, init: 0 }
  - { id: sd, label: "spread σ", min: 0.5, max: 3, step: 0.5, init: 1 }
  - { id: x, label: "a value x", min: -6, max: 6, step: 0.5, init: 1.5 }
derived:
  - { id: z, expr: (x - mu) / sd }
cards:
  - kind: story
    kicker: Start here
    title: Two numbers describe a crowd
    body:
      - Test scores for a class are a long list of numbers. To talk about them, we squeeze the list into two numbers. The **mean** is the typical score. The **standard deviation** says how far scores usually sit from it.
      - "Same mean, different spread: one class where everyone scored near 60, and one where scores range from 20 to 100."
    callout: Mean is the centre. Spread is the width.

  - kind: formula
    kicker: Read the formula
    title: Mean and spread of 8 numbers
    tex: "\\sigma = \\sqrt{\\frac{1}{n}\\sum_{i=1}^{n} (x_i - \\mu)^2}"
    say: "Take the numbers 2, 4, 4, 4, 5, 5, 7, 9. Their mean μ is 5. Find each number's distance from 5, square it, average those squares, then take the square root."
    verify:
      - { expr: "(2+4+4+4+5+5+7+9) / 8", equals: 5, tol: 0.001 }
      - { expr: "sqrt(((2-5)^2 + 3*(4-5)^2 + 2*(5-5)^2 + (7-5)^2 + (9-5)^2) / 8)", equals: 2, tol: 0.001 }
    symbols:
      - { tex: "\\mu", means: "the mean, read “mu”: add everything up and divide by n", value: "5" }
      - { tex: "\\sigma", means: "the standard deviation, read “sigma”", value: "2" }
      - { tex: "x_i", means: the i-th number in the list }
      - { tex: "n", means: how many numbers there are, value: "8" }
      - { tex: "\\sum", means: "“add up”, over every i from 1 to n" }

  - kind: lab
    kicker: See it first
    title: The bell curve
    intro: Many real measurements pile up in a bell shape. **μ** slides the centre and **σ** controls the width. Narrow means everyone is alike, wide means they vary.
    view: { type: curve, fn: "exp(-((t - mu) ^ 2) / (2 * sd ^ 2)) / (sd * 2.5066)", min: -8, max: 8, yMin: 0, yMax: 0.85, point: mu, xLabel: value, yLabel: how common }
    sliders: [mu, sd]
    outro: "Centre **{mu}**, spread **{sd}**. About two thirds of values land within one σ of the centre."

  - kind: formula
    kicker: Read the formula
    title: The z-score
    tex: "z = \\frac{x - \\mu}{\\sigma}"
    say: A z-score says how many spreads a value sits from the mean. It lets you compare numbers from different scales on one ruler.
    verify:
      - { expr: z, equals: 1.5, tol: 0.001 }
      - { expr: "(70 - 60) / 5", equals: 2, tol: 0.001 }
    symbols:
      - { tex: "z", means: how many σ away from the mean, value: z }
      - { tex: "x", means: the value you are judging, value: x }
      - { tex: "\\mu", means: the mean, value: mu }
      - { tex: "\\sigma", means: the spread, value: sd }

  - kind: lab
    kicker: Try it
    title: How unusual is x?
    intro: Move the value **x** along the bottom. A z near 0 is ordinary. Beyond 2 or below −2 is unusual.
    view: { type: curve, fn: "exp(-((t - mu) ^ 2) / (2 * sd ^ 2)) / (sd * 2.5066)", min: -8, max: 8, yMin: 0, yMax: 0.85, point: x, xLabel: value, yLabel: how common }
    sliders: [x, mu, sd]
    outro: "x = {x} is **{z}** spreads from the mean."

  - kind: check
    kicker: Check yourself
    title: Compute a z-score
    question: A student scores 70. The class mean is 60 and the spread is 5. What is the z-score?
    options:
      - { text: "2", correct: true, why: "(70 − 60) ÷ 5 = 2. The student sits two spreads above the mean." }
      - { text: "10", why: "That is only the distance, 70 − 60. You still divide by the spread." }
      - { text: "0.5", why: "That divides the other way, 5 ÷ 10." }

  - kind: practice
    kicker: Your turn
    title: "Mean and variance"
    intro: "Write `stats(xs)` returning `[mean, variance]`, where variance is the average squared distance from the mean. Round both to 4 places."
    entry: stats
    starter: |
      def stats(xs):
          pass
    solution: |
      def stats(xs):
          m = sum(xs) / len(xs)
          v = sum((x - m) ** 2 for x in xs) / len(xs)
          return [round(m, 4), round(v, 4)]
    tests:
      - { input: "[[2, 4, 4, 4, 5, 5, 7, 9]]", expected: "[5.0, 4.0]" }
      - { input: "[[1, 1, 1]]", expected: "[1.0, 0.0]" }
      - { input: "[[0, 10]]", expected: "[5.0, 25.0]" }
    hint: "Find the mean first, then average the squared gaps."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Spread is not variance.** Variance is σ squared. Standard deviation σ is back in the same units as your data, which is why we quote it."
      - "**Normalise with training numbers only.** Compute μ and σ on the training data, then reuse them on new data, or you leak information."
      - "**One outlier drags the mean.** A single huge value shifts μ and inflates σ. Plot your data before trusting them."
    next: { label: "Next: Python you need for ML", href: /learn/python-for-ml-basics }
