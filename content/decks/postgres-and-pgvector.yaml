id: postgres-and-pgvector
title: Postgres and pgvector
order: 37
minutes: 9
params:
  - { id: rows, label: "stored chunks (thousands)", min: 10, max: 1000, step: 10, init: 500 }
derived:
  - { id: scan, expr: "rows * 0.05" }
  - { id: hnsw, expr: "5 + rows * 0.002" }
  - { id: gain, expr: "scan / hnsw" }
cards:
  - kind: story
    kicker: Start here
    title: One database for everything
    body:
      - "You already store users and documents in Postgres. **pgvector** is an extension that adds a vector column, so embeddings live in the same row as the text."
      - "That means one database to run, one backup, and one query that filters by user and finds the nearest meaning."
    callout: "Vectors are just another column."

  - kind: lab
    kicker: See it first
    title: Scan or use an index
    intro: "Without an index Postgres compares your query with every row. An **HNSW index** jumps through a graph of neighbours instead. Times are illustrative. **Drag the rows.**"
    view:
      type: bars
      max: 60
      items:
        - { label: "full scan (ms)", value: scan, color: "#ef4444" }
        - { label: "with an HNSW index (ms)", value: hnsw, color: "#1cd6ac" }
    sliders: [rows]
    outro: "With {rows} thousand chunks, a full scan takes about **{scan} ms** and the index about **{hnsw} ms**, roughly **{gain}** times faster."

  - kind: code
    kicker: Read it
    title: A table and an index
    intro: "Create the extension, add a `vector` column sized to your embedding model, then index it. Use the same distance in the index and the query."
    lang: sql
    code: |
      CREATE EXTENSION IF NOT EXISTS vector;

      CREATE TABLE chunks (
        id        serial PRIMARY KEY,
        doc_id    int NOT NULL,
        body      text NOT NULL,
        embedding vector(1536)
      );

      CREATE INDEX ON chunks
        USING hnsw (embedding vector_cosine_ops);
    note: "The 1536 must equal your embedding model's output size, or inserts fail."

  - kind: code
    kicker: Read it
    title: Filter and search together
    intro: "The `<=>` operator means cosine distance, so smaller is closer. Ordering by it and adding a limit returns the nearest chunks."
    lang: sql
    code: |
      SELECT id, body
      FROM chunks
      WHERE doc_id = 7
      ORDER BY embedding <=> '[0.12, -0.03, 0.88, ...]'
      LIMIT 5;
    note: "Your app sends the question's embedding as that list. A normal WHERE filter narrows the rows first."

  - kind: check
    kicker: Check yourself
    title: Why one database
    question: "What is the main benefit of pgvector over a separate vector database?"
    options:
      - { text: "Vectors and normal data share one database and one query", correct: true, why: "You can filter by user or date and search by meaning together." }
      - { text: "It is always faster at any size", why: "Dedicated systems can win at very large scale. For most apps pgvector is plenty." }
      - { text: "It removes the need for embeddings", why: "You still need an embedding model to make the vectors." }

  - kind: check
    kicker: Check yourself
    title: Spot the bug
    question: "Your embedding model outputs 768 numbers, but the column is vector(1536). What happens on insert?"
    options:
      - { text: "It fails, because the sizes must match", correct: true, why: "A vector column has a fixed length and rejects other sizes." }
      - { text: "Postgres pads it with zeros", why: "Postgres does not silently pad vectors." }
      - { text: "It works, but search is slower", why: "The insert is rejected, so nothing is stored." }

  - kind: practice
    kicker: Your turn
    title: "Write a vector literal"
    intro: "pgvector reads a vector as text like `[0.1,0.2,0.3]`. Write `vec_literal(xs)` that builds that text from a list of numbers, with no spaces."
    entry: vec_literal
    starter: |
      def vec_literal(xs):
          pass
    solution: |
      def vec_literal(xs):
          return '[' + ','.join(str(x) for x in xs) + ']'
    tests:
      - { input: "[[0.1, 0.2, 0.3]]", expected: "\"[0.1,0.2,0.3]\"" }
      - { input: "[[1, 2]]", expected: "\"[1,2]\"" }
      - { input: "[[]]", expected: "\"[]\"" }
    hint: "Join the numbers with commas and wrap them in square brackets."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Different distance in index and query.** An index built for cosine is not used by a query that asks for another distance."
      - "**Indexing too early.** A few thousand rows scan fast enough without one."
      - "**Mixing embedding models.** Old and new vectors are not comparable, so re-embed everything when you switch."
    next: { label: "Next: evals and tracing", href: /learn/evals-and-tracing }
