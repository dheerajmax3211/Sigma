id: "sd-ctr-fraud-labels"
title: "CTR prediction and fraud: delayed labels"
minutes: 14
order: 606
params:
  - { id: "delay", label: "days until the label arrives", min: 0, max: 30, step: 1, init: 7 }
derived:
  - { id: "usable", expr: "100 * (30 - delay) / 30" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "The answer shows up late"
    body:
      - "In ads, a click is known in seconds. A purchase may take days. In fraud, a chargeback can take weeks. The label arrives **after** you need to predict."
      - "This changes how you train, how you measure and how you set thresholds. Freshest data is the least labelled."
    callout: "Plan for labels that are late, missing, or wrong."
  - kind: "lab"
    kicker: "See it"
    title: "Recent data has no labels yet"
    intro: "You train on the last 30 days. Rows newer than the delay are not labelled yet. **Drag the delay.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "share of the window with final labels", value: "usable", color: "#f97316" }
        - { label: "the whole window", value: "100", color: "#38bdf8" }
    sliders:
      - "delay"
    outro: "With a delay of {delay} days only **{usable} percent** of the window has final labels. Newest behaviour is the least visible."
  - kind: "code"
    kicker: "Write it"
    title: "Log loss and calibration"
    intro: "Ads need probabilities, not just a ranking. Check that predicted rates match real ones."
    lang: "python"
    code: |
      import math

      def logloss(y, p):
          return -sum(a * math.log(b) + (1 - a) * math.log(1 - b) for a, b in zip(y, p)) / len(y)

      assert abs(logloss([1], [0.9]) - 0.10536) < 1e-4
      assert logloss([1], [0.9]) < logloss([1], [0.6])

      def calibration(y, p):
          return sum(p) / len(p), sum(y) / len(y)

      pred_rate, real_rate = calibration([1, 0, 0, 1, 0], [0.5, 0.3, 0.1, 0.6, 0.5])
      assert abs(pred_rate - real_rate) < 1e-9
    note: "If predicted 0.3 does not mean 30 percent of those cases click, bids and costs go wrong."
  - kind: "lab"
    kicker: "Memorise"
    title: "Fraud adds a twist"
    intro: "Attackers adapt."
    view:
      type: "flow"
      stages:
        - { label: "Rules", note: "Fast and clear. Easy to evade once known.", color: "#38bdf8" }
        - { label: "Model", note: "Scores risk from many signals. Retrain often.", color: "#1cd6ac" }
        - { label: "Review", note: "Humans handle the grey zone and produce labels.", color: "#f97316" }
        - { label: "Threshold", note: "Set by cost of a miss against cost of a false alarm.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Delay"
    question: "Labels arrive 14 days late. What do you do about the newest data?"
    options:
      - { text: "Exclude it from training or treat labels as incomplete", correct: true, why: "Unlabelled rows look like negatives and bias the model." }
      - { text: "Treat missing labels as negatives", why: "That teaches the wrong thing." }
      - { text: "Use only the newest data", why: "It has no labels." }
      - { text: "Ignore delays", why: "They bias you." }
  - kind: "check"
    kicker: "Practice"
    title: "Why calibrate"
    question: "Why must an ad model be calibrated?"
    options:
      - { text: "Prices and budgets use the predicted probability itself", correct: true, why: "A ranking alone is not enough." }
      - { text: "To look better in a paper", why: "No." }
      - { text: "To speed up training", why: "No." }
      - { text: "It is not needed", why: "It is needed." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Counting unlabelled rows as negatives.** The model underpredicts."
      - "**Optimising accuracy.** Use log loss and costs."
      - "**A fixed threshold forever.** Attackers shift, and so should you."
    next: { label: "Next: vector databases", href: "/learn/sd-vector-database" }
