id: "dist-sequence-expert"
title: "Sequence and expert parallelism"
minutes: 14
order: 805
params:
  - { id: "k", label: "context length (thousands of tokens)", min: 8, max: 1024, step: 8, init: 128 }
  - { id: "n", label: "GPUs sharing the sequence", min: 1, max: 16, step: 1, init: 4 }
derived:
  - { id: "per", expr: "k / n" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Two more ways to split"
    body:
      - "Long inputs make the KV cache and activations huge. **Sequence parallelism** cuts the token sequence into chunks, one chunk per GPU. Ring attention passes keys and values around the ring so every token still sees all the others."
      - "In a mixture of experts model, each token goes to a few experts. **Expert parallelism** puts different experts on different GPUs and sends tokens to them with an all-to-all exchange."
    callout: "One splits the tokens. The other splits the experts."
  - kind: "lab"
    kicker: "See it"
    title: "Tokens per GPU"
    intro: "A long context shared across GPUs. **Drag the context and the GPU count.**"
    view:
      type: "bars"
      max: 1024
      items:
        - { label: "total context (thousand tokens)", value: "k", color: "#38bdf8" }
        - { label: "held by each GPU (thousand tokens)", value: "per", color: "#1cd6ac" }
    sliders:
      - "k"
      - "n"
    outro: "A {k} thousand token context on {n} GPUs leaves each with **{per} thousand** tokens of cache."
  - kind: "code"
    kicker: "Write it"
    title: "Routing tokens to experts"
    intro: "Each token picks one expert. Experts have a fixed capacity, so crowded ones drop tokens."
    lang: "python"
    code: |
      import math

      def argmax(row):
          return row.index(max(row))

      assert argmax([0.1, 0.7, 0.2]) == 1

      choices = [0, 0, 0, 1, 2, 2, 3, 0]           # expert chosen by each of 8 tokens
      experts = 4
      load = [choices.count(e) for e in range(experts)]
      assert load == [4, 1, 2, 1]

      capacity = math.ceil(len(choices) / experts)  # fair share is 2
      dropped = sum(max(0, l - capacity) for l in load)
      assert capacity == 2
      assert dropped == 2                           # expert 0 overflowed
    note: "Dropped tokens skip the layer, so training adds a balancing loss that pushes the router to spread load."
  - kind: "lab"
    kicker: "Memorise"
    title: "Which split fixes what"
    intro: "Match the problem to the tool."
    view:
      type: "flow"
      stages:
        - { label: "Weights too big", note: "Tensor, pipeline or FSDP.", color: "#38bdf8" }
        - { label: "Context too long", note: "Sequence or context parallelism.", color: "#1cd6ac" }
        - { label: "Many experts", note: "Expert parallelism with all-to-all.", color: "#f97316" }
        - { label: "Lots of data", note: "Data parallelism.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Long context"
    question: "A 1 million token prompt does not fit in memory. What helps most?"
    options:
      - { text: "Sequence parallelism", correct: true, why: "It splits the tokens across GPUs." }
      - { text: "More data parallel copies", why: "Each copy still sees the whole sequence." }
      - { text: "A smaller learning rate", why: "No." }
      - { text: "More layers", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Expert overload"
    question: "One expert gets most of the tokens. What is the effect?"
    options:
      - { text: "It slows the step and may drop tokens", correct: true, why: "The busiest expert is the bottleneck." }
      - { text: "Nothing", why: "It matters." }
      - { text: "The model gets better", why: "No." }
      - { text: "Memory drops", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**No load-balancing loss.** Routers collapse onto a few experts."
      - "**Ignoring all-to-all cost.** It can dominate."
      - "**Mixing up the two.** One splits tokens, the other experts."
    next: { label: "Next: the compute budget of training", href: "/learn/dist-training-compute" }
