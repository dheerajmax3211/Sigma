id: tr-kv-cache
title: "The KV cache: why generation is fast"
minutes: 13
order: 307
params:
  - { id: n, label: "tokens generated", min: 1, max: 200, step: 1, init: 100 }
derived:
  - { id: slow, expr: "n * (n + 1) / 2" }
  - { id: gb, expr: "n * 0.5 / 1000" }
cards:
  - kind: story
    kicker: Start here
    title: "Do not redo old work"
    body:
      - "A model writes one token at a time. To write token 101, attention needs the keys and values of tokens 1 to 100."
      - "Those do not change. So we **save them** in a **KV cache** and only compute the new token's key and value each step."
    callout: "The cache trades memory for speed. Long chats use a lot of it."

  - kind: lab
    kicker: See it
    title: "Work with and without the cache"
    intro: "Without a cache every step recomputes every earlier token. With it, each step adds one. **Drag the length.**"
    view:
      type: bars
      max: 20100
      items:
        - { label: "token computations, no cache", value: slow, color: "#ef4444" }
        - { label: "token computations, with cache", value: n, color: "#1cd6ac" }
    sliders: [n]
    outro: "For {n} tokens the cache cuts **{slow}** computations down to **{n}**."

  - kind: code
    kicker: Write it
    title: "How big is the cache?"
    intro: "Per token, each layer stores one key and one value vector. Size grows with every token and every layer."
    lang: python
    code: |
      def kv_bytes(layers, width, tokens, bytes_per=2):
          return 2 * layers * width * tokens * bytes_per

      assert kv_bytes(32, 4096, 1) == 524288
      assert kv_bytes(32, 4096, 4096) == 2 * 1024 ** 3
      assert kv_bytes(32, 4096, 8192) == 2 * kv_bytes(32, 4096, 4096)
    note: "A 7 billion parameter style model needs about 2 GiB of cache for one 4,096 token chat. Many users at once multiply that."

  - kind: lab
    kicker: See it
    title: "Memory grows with length"
    intro: "About half a megabyte per token for a model this size. **Drag the length above.**"
    view:
      type: bars
      max: 0.1
      items:
        - { label: "cache so far (GB, illustrative)", value: gb, color: "#f97316" }
        - { label: "a comfortable budget (GB)", value: "0.1", color: "#38bdf8" }

  - kind: check
    kicker: Your turn
    title: "What is cached?"
    question: "What exactly does the KV cache store?"
    options:
      - { text: "The key and value vectors of every earlier token, per layer", correct: true, why: "Queries are only needed for the new token, so they are not cached." }
      - { text: "The model weights", why: "Those are already in memory." }
      - { text: "The final answers", why: "No." }
      - { text: "The tokeniser", why: "No." }

  - kind: check
    kicker: Practice
    title: "Serving many users"
    question: "A server runs out of memory when many users chat at once, though the weights fit easily. A likely cause?"
    options:
      - { text: "The KV caches of all active chats add up", correct: true, why: "Cache memory scales with users times length." }
      - { text: "The tokeniser is too large", why: "It is tiny." }
      - { text: "Softmax uses all memory", why: "No." }
      - { text: "The learning rate is too high", why: "Not relevant to serving." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Ignoring cache memory when sizing a GPU.** Weights are only part."
      - "**Thinking the cache speeds up the first token.** It helps later steps."
      - "**Forgetting it resets per chat.** Each conversation has its own."
    next: { label: "Next: long context and flash attention", href: /learn/tr-flash-long-context }
