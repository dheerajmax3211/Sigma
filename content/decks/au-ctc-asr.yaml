id: "au-ctc-asr"
title: "Speech recognition and CTC"
minutes: 15
order: 1004
params:
  - { id: "fps", label: "model frames per second", min: 25, max: 100, step: 5, init: 50 }
  - { id: "cps", label: "characters spoken per second", min: 5, max: 25, step: 1, init: 15 }
derived:
  - { id: "blank", expr: "100 * (1 - cps / fps)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "More frames than letters"
    body:
      - "The model produces one prediction per time frame, but speech has far fewer letters than frames. We do not know which frame belongs to which letter, and labelling that by hand would be hopeless."
      - "**CTC** solves it. The model may output a letter or a special **blank** at every frame. To read the result, merge repeated letters, then remove blanks. Training sums over every way of aligning the text to the frames."
    callout: "The model says what it hears each frame, and CTC cleans it up."
  - kind: "lab"
    kicker: "See it"
    title: "Mostly blank"
    intro: "With many more frames than letters, most frames must be blank. **Drag both.**"
    view:
      type: "bars"
      max: 100
      items:
        - { label: "frames that are blank (percent)", value: "blank", color: "#f97316" }
        - { label: "frames that carry a letter (percent)", value: "100 - blank", color: "#1cd6ac" }
    sliders:
      - "fps"
      - "cps"
    outro: "At {fps} frames and {cps} letters per second, about **{blank} percent** of frames are blank."
  - kind: "code"
    kicker: "Write it"
    title: "Collapse and greedy decode"
    intro: "Merge repeats, then drop blanks. A blank between lets a double letter survive."
    lang: "python"
    code: |
      def collapse(frames, blank="_"):
          out, prev = [], None
          for ch in frames:
              if ch != prev and ch != blank:
                  out.append(ch)
              prev = ch
          return "".join(out)

      assert collapse("hh_e_ll_lloo") == "hello"      # blank between the two l groups
      assert collapse("hheelllloo") == "helo"         # no blank, so the l's merge
      assert collapse("___") == ""

      def greedy(scores, alphabet):
          return "".join(alphabet[max(range(len(row)), key=row.__getitem__)] for row in scores)

      alphabet = "_ab"
      scores = [[0.1, 0.8, 0.1], [0.7, 0.2, 0.1], [0.1, 0.1, 0.8]]
      assert greedy(scores, alphabet) == "a_b"
      assert collapse(greedy(scores, alphabet)) == "ab"
    note: "Better decoding uses beam search with a language model, which fixes spelling the audio alone cannot settle."
  - kind: "lab"
    kicker: "Memorise"
    title: "Three families"
    intro: "How recognisers are built."
    view:
      type: "flow"
      stages:
        - { label: "CTC", note: "Frame by frame, fast, simple, easy to stream.", color: "#1cd6ac" }
        - { label: "Encoder-decoder", note: "Writes text word by word, like Whisper.", color: "#38bdf8" }
        - { label: "Transducer", note: "CTC plus a text predictor. Good for live speech.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Blank"
    question: "Why does CTC need a blank symbol?"
    options:
      - { text: "To separate repeats and to mark frames with no letter", correct: true, why: "Both needs." }
      - { text: "To mark spaces", why: "Spaces are separate." }
      - { text: "To hide errors", why: "No." }
      - { text: "To speed up the GPU", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Alignment"
    question: "What problem does CTC remove?"
    options:
      - { text: "Knowing which frame belongs to which letter", correct: true, why: "It sums over all alignments." }
      - { text: "Recording audio", why: "No." }
      - { text: "Choosing a sample rate", why: "No." }
      - { text: "Language translation", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Merging repeats before removing blanks in the wrong order.** Collapse repeats first."
      - "**Training on text with odd characters.** Normalise the text."
      - "**Judging by loss alone.** Measure word error rate."
    next: { label: "Next: measuring word error rate", href: "/learn/au-wer" }
