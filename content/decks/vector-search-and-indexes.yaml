id: vector-search-and-indexes
title: Vector search and indexes
order: 31
minutes: 9
params:
  - { id: dk, label: "vectors stored (thousands)", min: 10, max: 1000, step: 10, init: 100 }
  - { id: probe, label: "groups searched", min: 1, max: 10, step: 1, init: 3 }
derived:
  - { id: flat, expr: "dk * 1000" }
  - { id: idx, expr: "sqrt(dk * 1000) * (1 + probe)" }
  - { id: speed, expr: "flat / idx" }
  - { id: recall, expr: "100 * (1 - 0.5 ^ probe)" }
  - { id: flatk, expr: "dk" }
  - { id: idxk, expr: "idx / 1000" }
  - { id: miss, expr: "100 - recall" }
cards:
  - kind: story
    kicker: Start here
    title: Finding the nearest needle
    body:
      - "Every chunk is stored as a list of numbers, a **vector**. To answer a question, you turn it into a vector too and find the stored vectors closest to it."
      - "The simple way checks every vector. That is exact but slow. A faster way checks only a promising few and accepts a small risk of missing the best one."
    callout: "Exact is slow. Approximate is fast and almost as good."

  - kind: lab
    kicker: See it first
    title: Comparisons per search
    intro: "**Flat search** compares your question with every stored vector. An **index** first sorts vectors into groups and only searches the closest few groups. Numbers are illustrative. **Drag the sliders.**"
    view:
      type: bars
      max: 1000
      items:
        - { label: "flat: comparisons (thousands)", value: flatk, color: "#ef4444" }
        - { label: "indexed: comparisons (thousands)", value: idxk, color: "#1cd6ac" }
    also:
      type: bars
      max: 100
      items:
        - { label: "chance best match found (%)", value: recall, color: "#a78bfa" }
        - { label: "chance it is missed (%)", value: miss, color: "#ef4444" }
    sliders: [dk, probe]
    outro: "With {dk} thousand vectors, flat search makes **{flat}** comparisons and the index about **{idx}**, roughly **{speed}** times fewer. It finds the true best about **{recall} percent** of the time."

  - kind: formula
    kicker: Read the formula
    title: Cost of a grouped search
    tex: "C \\approx \\sqrt{N}\\,(1 + p)"
    say: "Split N vectors into about the square root of N groups. Compare against the group centres, then look inside p groups, which together cost about p times root N."
    verify:
      - { expr: "idx", equals: 1264.9, tol: 0.5 }
      - { expr: "speed", equals: 79.06, tol: 0.1 }
      - { expr: "recall", equals: 87.5, tol: 0.01 }
    symbols:
      - { tex: "C", means: "comparisons per search with the index", value: idx }
      - { tex: "N", means: "number of stored vectors", value: flat }
      - { tex: "\\sqrt{N}", means: "about how many groups, and how big each group is", value: "sqrt(flat)" }
      - { tex: "p", means: "how many groups you choose to search", value: probe }

  - kind: code
    kicker: Read it
    title: Exact search in two lines
    intro: "With a matrix of unit-length vectors, one matrix product scores **every** vector at once."
    lang: python
    code: |
      import numpy as np

      scores = vectors @ query            # one score per stored vector
      best = np.argsort(-scores)[:5]      # ids of the 5 closest
    note: "Fine for tens of thousands of vectors. Beyond that, use an index such as HNSW in a library like FAISS, or pgvector inside Postgres."

  - kind: check
    kicker: Check yourself
    title: Pick the search
    question: "You have 5,000 chunks and your app is a prototype. Which search is a sensible start?"
    options:
      - { text: "Flat exact search", correct: true, why: "At this size an exact search is fast and has no accuracy risk. Keep it simple." }
      - { text: "A complex approximate index", why: "That adds setup and tuning for no gain at a small size." }
      - { text: "Searching only the first 100 chunks", why: "That throws away data. It is not a search strategy." }

  - kind: check
    kicker: Check yourself
    title: The trade
    question: "What does searching more groups in an index usually do?"
    options:
      - { text: "Finds the best match more often but costs more time", correct: true, why: "More groups means more comparisons, so it is slower and more accurate." }
      - { text: "Makes search faster and less accurate", why: "It is the other way round. More groups means more work." }
      - { text: "Changes nothing", why: "The number of groups searched is the main tuning knob." }

  - kind: practice
    kicker: Your turn
    title: "Top k by dot product"
    intro: "Write `top_k(query, docs, k)` where `docs` is a list of vectors. Return the indices of the `k` highest dot products, best first. Break ties by the lower index."
    entry: top_k
    starter: |
      def top_k(query, docs, k):
          pass
    solution: |
      def top_k(query, docs, k):
          s = [(-sum(q * d for q, d in zip(query, v)), i) for i, v in enumerate(docs)]
          return [i for _, i in sorted(s)[:k]]
    tests:
      - { input: "[[1, 0], [[1, 0], [0, 1], [0.5, 0.5]], 2]", expected: "[0, 2]" }
      - { input: "[[0, 1], [[1, 0], [0, 1]], 1]", expected: "[1]" }
      - { input: "[[1, 1], [[1, 1], [1, 1]], 2]", expected: "[0, 1]" }
    hint: "Score every document, sort, then take the first k."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Indexing too early.** Below roughly a hundred thousand vectors, exact search is often fast enough."
      - "**Mixing models.** Query and chunks must be embedded by the same model, or the distances mean nothing."
      - "**Never measuring recall.** An index can silently miss good matches. Compare it against exact search on a sample."
    next: { label: "Next: evaluating RAG", href: /learn/rag-evaluation }
