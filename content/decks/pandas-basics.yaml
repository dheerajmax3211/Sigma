id: pandas-basics
title: "pandas for data work"
order: 8
minutes: 18
params:
  - { id: rows, label: "rows in the file", min: 1000, max: 100000, step: 1000, init: 20000 }
  - { id: miss, label: "percent missing", min: 0, max: 50, step: 1, init: 10 }
derived:
  - { id: kept, expr: "rows * (100 - miss) / 100" }
  - { id: lost, expr: "rows * miss / 100" }
cards:
  - kind: story
    kicker: Lesson
    title: "Tables before models"
    body:
      - "Most ML work is cleaning a table, not building a model. pandas holds a table as a **DataFrame**: named columns, one row per example."
      - "You will practise the three moves you use daily: **fill gaps**, **count values** and **group and average**."

  - kind: lab
    kicker: See it first
    title: "Missing values cost rows"
    intro: "Dropping every row with a gap loses data. **Drag the sliders** to see how much."
    view:
      type: bars
      max: 100000
      items:
        - { label: "rows you keep", value: kept, color: "#1cd6ac" }
        - { label: "rows you lose", value: lost, color: "#ef4444" }
    sliders: [rows, miss]
    outro: "With {miss} percent missing you lose **{lost}** of {rows} rows. Filling the gaps often beats dropping them."

  - kind: code
    kicker: In code
    title: "The same moves in pandas"
    intro: "These lines do what your practice below does by hand."
    lang: python
    code: |
      import pandas as pd

      df = pd.DataFrame({'city': ['a', 'b', 'a'], 'price': [10, 20, None]})
      df['price'] = df['price'].fillna(0)
      print(df['city'].value_counts())
      print(df.groupby('city')['price'].mean())
    note: "`fillna`, `value_counts` and `groupby` cover most first-day cleaning."

  - kind: practice
    kicker: Your turn
    title: "Fill the gaps"
    intro: "Write `fill_missing(xs, fill)` returning a list where every `None` is replaced by `fill`. This is `fillna`."
    entry: fill_missing
    starter: |
      def fill_missing(xs, fill):
          pass
    solution: |
      def fill_missing(xs, fill):
          return [fill if x is None else x for x in xs]
    tests:
      - { input: "[[1, null, 3], 0]", expected: "[1, 0, 3]" }
      - { input: "[[null, null], 9]", expected: "[9, 9]" }
      - { input: "[[], 1]", expected: "[]" }
    hint: "Check each item for None."

  - kind: practice
    kicker: Your turn
    title: "Count the values"
    intro: "Write `value_counts(xs)` returning a dict from each value to how many times it appears. This is `value_counts`."
    entry: value_counts
    starter: |
      def value_counts(xs):
          pass
    solution: |
      def value_counts(xs):
          out = {}
          for x in xs:
              out[x] = out.get(x, 0) + 1
          return out
    tests:
      - { input: "[[\"a\", \"b\", \"a\"]]", expected: "{\"a\": 2, \"b\": 1}" }
      - { input: "[[]]", expected: "{}" }
      - { input: "[[1, 1, 1]]", expected: "{\"1\": 3}" }
    hint: "Add one to a running count for each value."

  - kind: practice
    kicker: Your turn
    title: "Group and average"
    intro: "Write `group_mean(rows, key, val)` where `rows` is a list of dicts. Return a dict from each `key` value to the mean of `val`, rounded to 2 places. This is `groupby().mean()`."
    entry: group_mean
    starter: |
      def group_mean(rows, key, val):
          pass
    solution: |
      def group_mean(rows, key, val):
          g = {}
          for r in rows:
              g.setdefault(r[key], []).append(r[val])
          return {k: round(sum(v) / len(v), 2) for k, v in g.items()}
    tests:
      - { input: "[[{\"c\": \"a\", \"p\": 10}, {\"c\": \"b\", \"p\": 20}, {\"c\": \"a\", \"p\": 20}], \"c\", \"p\"]", expected: "{\"a\": 15.0, \"b\": 20.0}" }
      - { input: "[[{\"c\": \"x\", \"p\": 5}], \"c\", \"p\"]", expected: "{\"x\": 5.0}" }
    hint: "Collect the values for each key, then average each list."

  - kind: check
    kicker: Check yourself
    title: "Drop or fill"
    question: "A column is 40 percent missing. What is usually the better first move?"
    options:
      - { text: "Fill it, or add a flag column for missing", correct: true, why: "Dropping 40 percent of rows throws away most of your data." }
      - { text: "Drop every row with a gap", why: "You would lose a large share of the data." }
      - { text: "Ignore it, models handle None", why: "Most models fail or silently misread missing values." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Filling before splitting.** Work out fill values on the training rows only, or you leak the test set."
      - "**Changing a copy.** Assign the result back to the column."
      - "**Reading dates as text.** Convert them, or sorting will be wrong."
    next: { label: "Back to all lessons", href: "/learn" }
