id: linear-regression
title: Fitting a line to data
order: 13
minutes: 10
params:
  - { id: m, label: "m (slope)", min: 0, max: 4, step: 0.1, init: 1 }
  - { id: b, label: "b (start)", min: -2, max: 5, step: 0.25, init: 0 }
  - { id: lr, label: "learning rate", min: 0.01, max: 0.1, step: 0.01, init: 0.05 }
derived:
  - { id: e1, expr: "3.2 - (m * 1 + b)" }
  - { id: e2, expr: "4.8 - (m * 2 + b)" }
  - { id: e3, expr: "7.3 - (m * 3 + b)" }
  - { id: e4, expr: "8.7 - (m * 4 + b)" }
  - { id: mse, expr: "(e1 ^ 2 + e2 ^ 2 + e3 ^ 2 + e4 ^ 2) / 4" }
  - { id: dm, expr: "-2 * (1 * e1 + 2 * e2 + 3 * e3 + 4 * e4) / 4" }
  - { id: db, expr: "-2 * (e1 + e2 + e3 + e4) / 4" }
cards:
  - kind: story
    kicker: Start here
    title: A model is a rule with knobs
    body:
      - "Say you want to guess a flat's rent from its size. Pick a rule: rent = m × size + b. The numbers m and b are the **knobs**."
      - "Different knobs give different guesses. **Training** means finding the knob settings whose guesses are closest to the real answers."
    callout: "Training is turning knobs until the guesses stop being wrong."

  - kind: lab
    kicker: See it first
    title: How wrong is the line?
    intro: "Four flats have a real rent. The line guesses rent = {m} × size + {b}. Each bar is the **miss**: real minus guess. **Drag m and b** until every bar is short."
    view:
      type: bars
      max: 10
      items:
        - { label: "size 1, real 3.2", value: e1, color: "#f59e0b" }
        - { label: "size 2, real 4.8", value: e2, color: "#f59e0b" }
        - { label: "size 3, real 7.3", value: e3, color: "#f59e0b" }
        - { label: "size 4, real 8.7", value: e4, color: "#f59e0b" }
    sliders: [m, b]
    outro: "The average squared miss is **{mse}**. Smaller is better."

  - kind: formula
    kicker: Read the formula
    title: Mean squared error
    tex: "\\text{MSE} = \\frac{1}{n}\\sum_{i=1}^{n}\\left(y_i - \\hat{y}_i\\right)^2"
    say: "Take each miss, square it so misses never cancel out, then average them. One number says how wrong the rule is on all the data."
    verify:
      - { expr: "mse", equals: 13.315, tol: 0.01 }
      - { expr: "(2.2 ^ 2 + 2.8 ^ 2 + 4.3 ^ 2 + 4.7 ^ 2) / 4", equals: 13.315, tol: 0.01 }
      - { expr: "e1", equals: 2.2, tol: 0.001 }
    symbols:
      - { tex: "\\text{MSE}", means: "mean squared error, the loss: how wrong the rule is", value: mse }
      - { tex: "n", means: "how many data points there are", value: "4" }
      - { tex: "y_i", means: "the real answer for point number i" }
      - { tex: "\\hat{y}_i", means: "the line's guess for point i: m times the size, plus b" }
      - { tex: "\\sum", means: "add up the terms for every point, from the first to the last" }
      - { tex: "(\\cdot)^2", means: "square it, so a miss of −2 and a miss of +2 both count as 4" }

  - kind: check
    kicker: Check yourself
    title: Why square the misses?
    question: "A line misses two points by +2 and −2. What is the mean squared error?"
    options:
      - { text: "4", correct: true, why: "(2² + (−2)²) / 2 = (4 + 4) / 2 = 4. Squaring makes both misses count." }
      - { text: "0", why: "That is the plain average of the misses. Squaring stops +2 and −2 from cancelling." }
      - { text: "2", why: "That is the typical size of a miss, not the average of the squares." }

  - kind: lab
    kicker: Try it
    title: Training is rolling downhill
    intro: "Fix b and look at how the loss changes as only m moves. The orange line is the **slope** of the loss. Press the button to let the computer step downhill on both m and b."
    view: { type: curve, fn: "((3.2 - (t * 1 + b)) ^ 2 + (4.8 - (t * 2 + b)) ^ 2 + (7.3 - (t * 3 + b)) ^ 2 + (8.7 - (t * 4 + b)) ^ 2) / 4", min: 0, max: 4, yMin: 0, yMax: 45, point: m, slope: dm, xLabel: m, yLabel: loss }
    sliders: [m, b, lr]
    action:
      label: Take a step
      set: { m: "m - rate * dm", b: "b - rate * db" }
      rate: lr
      track: mse
      hint: "Press it a few times. Both knobs move and the loss keeps falling. Then try a learning rate of 0.1 and see the steps overshoot."
    outro: "Now m = **{m}**, b = **{b}** and the loss is **{mse}**. The best fit for these four points is near m = 1.9 and b = 1.25."

  - kind: story
    kicker: Why this matters
    title: Every model trains this way
    body:
      - "A line has two knobs. A big neural network has billions. The recipe is identical: measure the loss, find which way each knob lowers it, and nudge every knob a little."
      - "The next lesson shows exactly how that nudge is computed."
    callout: "Measure the loss, then step downhill."

  - kind: practice
    kicker: Your turn
    title: "Fit a line"
    intro: "Write `fit(xs, ys)` returning `[slope, intercept]` of the least squares line. Use `slope = sum((x-mx)*(y-my)) / sum((x-mx)^2)`. Round to 4 places."
    entry: fit
    starter: |
      def fit(xs, ys):
          pass
    solution: |
      def fit(xs, ys):
          mx, my = sum(xs) / len(xs), sum(ys) / len(ys)
          s = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sum((x - mx) ** 2 for x in xs)
          return [round(s, 4), round(my - s * mx, 4)]
    tests:
      - { input: "[[1, 2, 3], [2, 4, 6]]", expected: "[2.0, 0.0]" }
      - { input: "[[0, 1, 2, 3], [1, 3, 5, 7]]", expected: "[2.0, 1.0]" }
      - { input: "[[1, 2, 3], [3, 3, 3]]", expected: "[0.0, 3.0]" }
    hint: "The line always passes through the point made of the two means."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Averaging the raw misses.** Positive and negative misses cancel, so a bad line can look perfect. That is why we square."
      - "**Trusting a tiny training loss.** The model may have memorised the data. Overfitting is a later lesson."
      - "**A learning rate that is too big.** Steps overshoot the bottom and the loss can grow."
    next: { label: "Next: slope and gradient descent", href: /learn/gradient-descent }
