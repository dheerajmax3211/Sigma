id: dl-mlp-from-scratch
title: "An MLP from scratch"
minutes: 14
order: 401
params:
  - { id: x, label: "input x", min: -3, max: 3, step: 0.1, init: 1 }
  - { id: w, label: "weight w", min: -3, max: 3, step: 0.1, init: 1.5 }
  - { id: b, label: "bias b", min: -3, max: 3, step: 0.1, init: -1 }
derived:
  - { id: z, expr: "w * x + b" }
  - { id: a, expr: "max(0, z)" }
cards:
  - kind: story
    kicker: Start here
    title: "A network is neurons in layers"
    body:
      - "A **neuron** multiplies its inputs by weights, adds a bias, and passes the total through an **activation** function."
      - "Stack neurons side by side and you get a layer. Stack layers and you get a **multi-layer perceptron**, or MLP."
      - "The activation matters. Without it, any number of layers collapses into one straight line."
    callout: "Weights are what the network learns. Everything else is fixed."

  - kind: lab
    kicker: See it
    title: "One neuron with ReLU"
    intro: "The neuron computes z equals w times x plus b, then ReLU keeps only the positive part. **Drag the sliders.**"
    view:
      type: bars
      max: 10
      items:
        - { label: "z (before activation)", value: "abs(z)", color: "#38bdf8" }
        - { label: "a (after ReLU)", value: a, color: "#1cd6ac" }
    sliders: [x, w, b]
    outro: "With w {w}, x {x} and b {b}, z is **{z}** and the output is **{a}**. Negative totals are switched off."

  - kind: code
    kicker: Write it
    title: "A tiny network solves XOR"
    intro: "XOR cannot be solved by one straight line. Two hidden neurons can. Here the weights are set by hand."
    lang: python
    code: |
      def relu(v):
          return max(0, v)

      def forward(x1, x2):
          h1 = relu(x1 + x2)
          h2 = relu(x1 + x2 - 1)
          return h1 - 2 * h2

      assert [forward(a, b) for a, b in [(0, 0), (0, 1), (1, 0), (1, 1)]] == [0, 1, 1, 0]
    note: "Training finds such weights automatically by following gradients."

  - kind: lab
    kicker: Memorise
    title: "The shape of a forward pass"
    intro: "Each layer does the same two things."
    view:
      type: flow
      stages:
        - { label: "Input", note: "A vector of numbers.", color: "#38bdf8" }
        - { label: "Linear", note: "Multiply by weights, add bias.", color: "#1cd6ac" }
        - { label: "Activation", note: "ReLU, GELU or similar.", color: "#f97316" }
        - { label: "Repeat", note: "Then a final layer gives the prediction.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Why an activation?"
    question: "Why must a hidden layer have a non-linear activation?"
    options:
      - { text: "Without it, stacked layers equal one linear layer", correct: true, why: "Linear functions of linear functions are still linear, so depth would add nothing." }
      - { text: "It makes training faster only", why: "It changes what the network can represent." }
      - { text: "It removes the bias", why: "No." }
      - { text: "It shrinks the data", why: "No." }

  - kind: check
    kicker: Practice
    title: "Counting weights"
    question: "A layer maps 10 inputs to 20 outputs with a bias per output. How many weights does it have?"
    options:
      - { text: "220", correct: true, why: "10 times 20 is 200 weights, plus 20 biases." }
      - { text: "200", why: "You forgot the biases." }
      - { text: "30", why: "That adds instead of multiplying." }
      - { text: "20", why: "That counts only biases." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting the activation.** The network stays linear."
      - "**Wrong shapes.** Check input size against the weight matrix."
      - "**All-zero weights.** Every neuron learns the same thing. Use random starts."
    next: { label: "Next: autograd", href: /learn/dl-autograd-engine }
