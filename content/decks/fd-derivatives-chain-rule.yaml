id: "fd-derivatives-chain-rule"
title: "Derivatives and the chain rule"
minutes: 14
order: 701
params:
  - { id: "x", label: "x", min: -2, max: 2, step: 0.1, init: 1 }
derived:
  - { id: "u", expr: "3 * x + 1" }
  - { id: "y", expr: "u ^ 2" }
  - { id: "dy", expr: "6 * u" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "How fast does the output move?"
    body:
      - "A **derivative** answers one question: if I nudge the input a tiny bit, how much does the output move? It is the slope of the curve at that point."
      - "The **chain rule** handles functions made of steps. Multiply the slope of each step. This one rule is what backpropagation applies, layer after layer."
    callout: "Slope of a chain equals the product of the slopes of its links."
  - kind: "lab"
    kicker: "See it"
    title: "A function made of two steps"
    intro: "First u equals 3x plus 1. Then y equals u squared. **Drag x.**"
    view:
      type: "bars"
      max: 50
      items:
        - { label: "y", value: "abs(y)", color: "#38bdf8" }
        - { label: "slope of y with respect to x", value: "abs(dy)", color: "#f97316" }
    sliders:
      - "x"
    outro: "At x equal to {x}, u is {u} and y is {y}. The slope is 2u times 3, which is **{dy}**. The outer slope times the inner slope."
  - kind: "code"
    kicker: "Write it"
    title: "Check a derivative by nudging"
    intro: "You can always test a formula by nudging the input and watching the output."
    lang: "python"
    code: |
      def f(x):
          return (3 * x + 1) ** 2

      def numeric(f, x, h=1e-5):
          return (f(x + h) - f(x - h)) / (2 * h)

      def analytic(x):
          return 2 * (3 * x + 1) * 3   # outer slope times inner slope

      assert abs(numeric(f, 1.0) - 24) < 1e-4
      assert abs(numeric(f, 1.0) - analytic(1.0)) < 1e-4
      assert abs(numeric(f, -0.5) - analytic(-0.5)) < 1e-4
    note: "This is called a gradient check. Use it whenever you write a gradient by hand."
  - kind: "lab"
    kicker: "Memorise"
    title: "Common slopes"
    intro: "A short table worth knowing."
    view:
      type: "flow"
      stages:
        - { label: "x squared", note: "Slope 2x. Steeper as x grows.", color: "#38bdf8" }
        - { label: "exp of x", note: "Slope is itself. Grows as fast as it is big.", color: "#1cd6ac" }
        - { label: "log of x", note: "Slope 1 over x. Flattens for large x.", color: "#f97316" }
        - { label: "sigmoid", note: "Slope s times one minus s. Never above one quarter.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Chain rule"
    question: "y equals (2x plus 5) squared. What is the slope at x equal to 0?"
    options:
      - { text: "20", correct: true, why: "u is 5, so 2 times 5 times 2 is 20." }
      - { text: "10", why: "You forgot the inner slope of 2." }
      - { text: "25", why: "That is y." }
      - { text: "4", why: "That is only the inner part." }
  - kind: "check"
    kicker: "Practice"
    title: "Why check"
    question: "Why compare your gradient to a nudged estimate?"
    options:
      - { text: "It catches mistakes in hand-written gradients", correct: true, why: "Bugs show up as a mismatch." }
      - { text: "It makes training faster", why: "It is a debugging tool." }
      - { text: "It removes the need for derivatives", why: "It only checks them." }
      - { text: "It lowers the loss", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Dropping the inner slope.** Multiply every link in the chain."
      - "**Using too small a nudge.** Rounding error swamps it."
      - "**Confusing slope with value.** The slope can be large where the value is small."
    next: { label: "Next: matrix calculus and shapes", href: "/learn/fd-matrix-shapes-gradients" }
