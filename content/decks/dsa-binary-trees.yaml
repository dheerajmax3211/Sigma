id: dsa-binary-trees
title: "Binary trees"
minutes: 16
order: 113
params:
  - { id: s, label: "visited", min: 0, max: 6, step: 1, init: 0 }
  - { id: h, label: "height h", min: 1, max: 20, step: 1, init: 10 }
derived:
  - { id: nodes, expr: "2 ^ h - 1" }
cards:
  - kind: story
    kicker: Start here
    title: "A family tree that splits in two"
    body:
      - "A **binary tree** starts at one **root** node. Every node has at most two children: **left** and **right**. A node with no children is a **leaf**."
      - "Trees are naturally recursive. Each child is the root of a smaller tree, so most tree problems are a short recursive function."
    callout: "Height means the number of levels. Depth of a node is how far it is from the root."

  - kind: lab
    kicker: See it
    title: "Depth first: go all the way down first"
    intro: "**Preorder** visits a node, then its whole left subtree, then its whole right subtree. **Drag to visit nodes.**"
    view:
      type: tree
      values: [1, 2, 3, 4, 5, null, 6]
      order: [0, 1, 3, 4, 2, 6]
      step: s
    sliders: [s]
    outro: "Order so far follows 1, 2, 4, 5, 3, 6. It dives left to the bottom, backs up, then goes right."

  - kind: lab
    kicker: See it
    title: "Breadth first: one level at a time"
    intro: "**Level order** visits the whole top level, then the next one. It uses a queue instead of recursion. **Drag to visit nodes.**"
    view:
      type: tree
      values: [1, 2, 3, 4, 5, null, 6]
      order: [0, 1, 2, 3, 4, 6]
      step: s
    sliders: [s]
    outro: "Order is 1, then 2 and 3, then 4, 5 and 6. Same nodes, different path."

  - kind: code
    kicker: Write it
    title: "Three depth first orders"
    intro: "The only difference is **when** you handle the node: before its children (pre), between them (in), or after (post)."
    lang: python
    code: |
      class Node:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      def pre(n):  return [] if not n else [n.val] + pre(n.left) + pre(n.right)
      def inn(n):  return [] if not n else inn(n.left) + [n.val] + inn(n.right)
      def post(n): return [] if not n else post(n.left) + post(n.right) + [n.val]

      t = Node(1, Node(2, Node(4), Node(5)), Node(3, None, Node(6)))
      assert pre(t) == [1, 2, 4, 5, 3, 6]
      assert inn(t) == [4, 2, 5, 1, 3, 6]
      assert post(t) == [4, 5, 2, 6, 3, 1]
    note: "Each visits every node once: O(n) time. Space is the height, from the call stack."

  - kind: code
    kicker: Write it
    title: "Height and level order"
    intro: "Height uses the recursive shape: one more than the taller child. Level order uses a queue and takes a whole level per round."
    lang: python
    code: |
      from collections import deque

      class Node:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      def height(n):
          return 0 if not n else 1 + max(height(n.left), height(n.right))

      def levels(root):
          out, q = [], deque([root] if root else [])
          while q:
              out.append([n.val for n in q])
              for _ in range(len(q)):
                  n = q.popleft()
                  if n.left: q.append(n.left)
                  if n.right: q.append(n.right)
          return out

      t = Node(1, Node(2, Node(4), Node(5)), Node(3, None, Node(6)))
      assert height(t) == 3 and height(None) == 0
      assert levels(t) == [[1], [2, 3], [4, 5, 6]]
    note: "Empty tree: height 0, no levels. Always test it."

  - kind: lab
    kicker: How big
    title: "A full tree grows fast"
    intro: "A tree where every level is completely full has 2 to the h minus 1 nodes. **Drag the height.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "nodes in a full tree", value: nodes, color: "#1cd6ac" }
        - { label: "height", value: h, color: "#38bdf8" }
    sliders: [h]
    outro: "Height {h} holds up to **{nodes}** nodes. So a balanced tree is only about log n tall. That is why trees are fast."

  - kind: check
    kicker: Your turn
    title: "Which order?"
    question: "To copy a tree you must create a parent **before** its children. Which traversal fits?"
    options:
      - { text: "Preorder", correct: true, why: "Parent first, then children." }
      - { text: "Inorder", why: "The parent comes between the children." }
      - { text: "Postorder", why: "The parent comes last. That fits deleting a tree." }
      - { text: "None, trees cannot be copied", why: "They can, recursively." }

  - kind: code
    kicker: Pattern
    title: "Diameter: answer from both children"
    intro: "Many tree questions ask for something that combines the left and right answers. Compute heights bottom up and update a best answer on the way."
    lang: python
    code: |
      class Node:
          def __init__(self, val, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      def diameter(root):
          best = 0
          def h(n):
              nonlocal best
              if not n:
                  return 0
              l, r = h(n.left), h(n.right)
              best = max(best, l + r)       # longest path through n
              return 1 + max(l, r)
          h(root)
          return best

      t = Node(1, Node(2, Node(4), Node(5)), Node(3))
      assert diameter(t) == 3
      assert diameter(None) == 0
    note: "Diameter is the number of edges on the longest path. One pass, O(n). The pass returns one thing and records another."

  - kind: check
    kicker: Practice
    title: "Invert the tree"
    question: "To mirror a tree, which recursive step is right at each node?"
    options:
      - { text: "Swap the left and right children, then recurse on both", correct: true, why: "The same step applied everywhere flips the whole tree." }
      - { text: "Reverse the node values", why: "Values stay, positions change." }
      - { text: "Only swap at the root", why: "The subtrees would stay unflipped." }
      - { text: "Sort the children", why: "That is not mirroring." }

  - kind: practice
    kicker: Your turn
    title: "Tree depth"
    intro: "A tree is given as nested lists `[value, left, right]` with `null` for empty. Write `depth(t)` returning the number of levels (an empty tree has depth 0)."
    entry: depth
    starter: |
      def depth(t):
          pass
    solution: |
      def depth(t):
          if t is None:
              return 0
          return 1 + max(depth(t[1]), depth(t[2]))
    tests:
      - { input: "[null]", expected: "0" }
      - { input: "[[1,null,null]]", expected: "1" }
      - { input: "[[1,[2,[4,null,null],null],[3,null,null]]]", expected: "3" }
    hint: "depth = 1 + the larger depth of the two children."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting `None`.** Every recursive tree function starts with `if not node`."
      - "**Mixing up height and depth.** Height counts down from a node, depth counts up from the root."
      - "**Using a list for the queue.** Use deque so each pop is O(1)."
      - "**Very deep trees.** A tree shaped like a list of 100,000 nodes crashes recursion. Use an explicit stack."
    next: { label: "Next: binary search trees", href: /learn/dsa-bst }
