id: build-mini-transformer
title: "Build a mini transformer block"
order: 1204
minutes: 25
params:
  - { id: n, label: "sequence length", min: 4, max: 64, step: 4, init: 16 }
derived:
  - { id: allowed, expr: "n * (n + 1) / 2" }
  - { id: scores, expr: "n * n" }
cards:
  - kind: story
    kicker: Guided build
    title: "Four parts, one block"
    body:
      - "A decoder block normalises, mixes tokens with attention, normalises again, then transforms each token. Two shortcuts add the input back."
      - "You will build **RMSNorm**, the **causal softmax** that hides the future, and the **rotary rotation** that tells attention where each token sits."

  - kind: lab
    kicker: See it first
    title: "Half the scores are hidden"
    intro: "Each token may look only at itself and earlier tokens. **Drag the slider** to see how many scores are allowed."
    view:
      type: bars
      max: 4096
      items:
        - { label: "scores computed", value: scores, color: "#64748b" }
        - { label: "scores allowed", value: allowed, color: "#1cd6ac" }
    sliders: [n]
    outro: "With {n} tokens there are {scores} scores, and only **{allowed}** may be used. The rest are masked to zero weight."

  - kind: code
    kicker: Starter code
    title: "The norm in code"
    intro: "RMSNorm divides by the root mean square, so values keep their direction but not their size."
    lang: python
    code: |
      import math

      def rmsnorm(x, eps=1e-6):
          r = math.sqrt(sum(v * v for v in x) / len(x) + eps)
          return [v / r for v in x]

      assert round(rmsnorm([3, 4])[0], 3) == 0.849
      print(rmsnorm([1, 1]))
    note: "Modern models apply it before each sub-block, which is called pre-norm."

  - kind: practice
    kicker: Build step
    title: "RMSNorm"
    intro: "Write `rmsnorm(x)` that divides each value by `sqrt(mean(x squared) + 1e-6)`. Round to 4 places."
    entry: rmsnorm
    starter: |
      import math
      def rmsnorm(x):
          pass
    solution: |
      import math
      def rmsnorm(x):
          r = math.sqrt(sum(v * v for v in x) / len(x) + 1e-6)
          return [round(v / r, 4) for v in x]
    tests:
      - { input: "[[3, 4]]", expected: "[0.8485, 1.1314]" }
      - { input: "[[1, 1, 1]]", expected: "[1.0, 1.0, 1.0]" }
      - { input: "[[0, 2]]", expected: "[0.0, 1.4142]" }
    hint: "Square, average, root, then divide."

  - kind: practice
    kicker: Build step
    title: "Causal softmax"
    intro: "Write `causal_softmax(scores)` for a square list of rows. In row i, softmax only columns up to i, and give later columns 0. Round to 3 places."
    entry: causal_softmax
    starter: |
      import math
      def causal_softmax(scores):
          pass
    solution: |
      import math
      def causal_softmax(scores):
          out = []
          for i, row in enumerate(scores):
              e = [math.exp(v) for v in row[:i + 1]]
              s = sum(e)
              out.append([round(v / s, 3) for v in e] + [0.0] * (len(row) - i - 1))
          return out
    tests:
      - { input: "[[[0, 0], [0, 0]]]", expected: "[[1.0, 0.0], [0.5, 0.5]]" }
      - { input: "[[[1, 5, 9], [0, 0, 0], [2, 2, 2]]]", expected: "[[1.0, 0.0, 0.0], [0.5, 0.5, 0.0], [0.333, 0.333, 0.333]]" }
    hint: "Cut each row to its allowed part, softmax that, then pad with zeros."

  - kind: practice
    kicker: Build step
    title: "Rotate a pair"
    intro: "Rotary encoding turns each pair of numbers by an angle. Write `rope_pair(x0, x1, theta)` returning `[x0*cos - x1*sin, x0*sin + x1*cos]`, rounded to 4 places."
    entry: rope_pair
    starter: |
      import math
      def rope_pair(x0, x1, theta):
          pass
    solution: |
      import math
      def rope_pair(x0, x1, theta):
          c, s = math.cos(theta), math.sin(theta)
          return [round(x0 * c - x1 * s, 4), round(x0 * s + x1 * c, 4)]
    tests:
      - { input: "[1, 0, 0]", expected: "[1.0, 0.0]" }
      - { input: "[1, 0, 1.5707963]", expected: "[0.0, 1.0]" }
      - { input: "[2, 3, 0.5]", expected: "[0.3169, 3.5916]" }
    hint: "It is a plain 2D rotation."

  - kind: check
    kicker: Check yourself
    title: "The mask"
    question: "What goes wrong if you forget the causal mask in training?"
    options:
      - { text: "The model sees the answer and learns to copy it", correct: true, why: "It cheats in training and fails when future tokens are missing." }
      - { text: "Training gets slower only", why: "The damage is to what the model learns." }
      - { text: "Nothing, the model ignores it", why: "Attention uses every unmasked score." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Softmax before masking.** Masked scores leak into the sum."
      - "**Norm after the block.** Pre-norm trains more stably."
      - "**Forgetting the residual.** Add the input back after each sub-block."
    next: { label: "Next build", href: "/learn/build-paged-attention" }
