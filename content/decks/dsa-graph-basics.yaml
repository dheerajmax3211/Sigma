id: dsa-graph-basics
title: "Graph basics"
minutes: 14
order: 117
params:
  - { id: s, label: "step", min: 0, max: 5, step: 1, init: 0 }
  - { id: v, label: "nodes V", min: 10, max: 1000, step: 10, init: 500 }
derived:
  - { id: matrix, expr: "v * v" }
  - { id: lists, expr: "3 * v" }
cards:
  - kind: story
    kicker: Start here
    title: "Dots and lines"
    body:
      - "A **graph** is a set of **nodes** (dots) joined by **edges** (lines). Cities and roads, people and friendships, web pages and links."
      - "Edges can have a direction (a one-way street) and a number on them (distance or cost). A tree is just a graph with no loops."
    callout: "Clue words: connected, network, route, friends, dependencies, grid of cells you can move between."

  - kind: lab
    kicker: See it
    title: "Counting connected groups"
    intro: "Start a walk from any node you have not visited yet. Everything you reach is one **connected component**. Starting again means a new one. **Drag the step.**"
    view:
      type: graph
      nodes:
        - { id: A, x: 15, y: 25 }
        - { id: B, x: 40, y: 15 }
        - { id: C, x: 35, y: 70 }
        - { id: D, x: 70, y: 30 }
        - { id: E, x: 85, y: 75 }
      edges:
        - { a: A, b: B }
        - { a: B, b: C }
        - { a: D, b: E }
      order:
        - { node: A }
        - { node: B, from: A }
        - { node: C, from: B }
        - { node: D }
        - { node: E, from: D }
      step: s
    sliders: [s]
    says:
      - "Nothing visited. No component counted yet."
      - "Start at A. This is a **new walk**, so component 1 begins."
      - "A reaches B."
      - "B reaches C. Nothing else connects to A, B or C."
      - "D was never reached, so we start a **new walk** at D. Component 2 begins."
      - "D reaches E. Every node is visited. Answer: **2 components**."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Build an adjacency list"
    intro: "An **adjacency list** maps each node to the list of its neighbours. It is the default way to store a graph."
    lang: python
    code: |
      from collections import defaultdict

      def build(n, edges, directed=False):
          g = defaultdict(list)
          for a, b in edges:
              g[a].append(b)
              if not directed:
                  g[b].append(a)
          for i in range(n):
              g[i]                       # make sure lonely nodes exist
          return g

      g = build(5, [(0, 1), (1, 2), (3, 4)])
      assert sorted(g[1]) == [0, 2]
      assert g[3] == [4] and g[4] == [3]
      d = build(3, [(0, 1), (1, 2)], directed=True)
      assert d[0] == [1] and d[2] == []
    note: "Undirected means an edge goes both ways, so store it twice."

  - kind: lab
    kicker: What it costs
    title: "List vs matrix"
    intro: "A matrix stores a yes/no for every pair of nodes. A list stores only the edges that exist. Sparse graphs are the norm. **Drag V.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "matrix: V times V cells", value: matrix, color: "#ef4444" }
        - { label: "list: about 3 edges per node", value: lists, color: "#1cd6ac" }
    sliders: [v]
    outro: "With {v} nodes, a matrix needs {matrix} cells. A list with about 3 neighbours each needs about **{lists}**."

  - kind: code
    kicker: Write it
    title: "Count components"
    intro: "Loop over nodes. If a node is unvisited, count one more component and explore everything reachable from it."
    lang: python
    code: |
      def components(n, edges):
          g = [[] for _ in range(n)]
          for a, b in edges:
              g[a].append(b); g[b].append(a)
          seen = [False] * n
          count = 0
          for start in range(n):
              if seen[start]:
                  continue
              count += 1
              stack = [start]
              seen[start] = True
              while stack:
                  u = stack.pop()
                  for v in g[u]:
                      if not seen[v]:
                          seen[v] = True
                          stack.append(v)
          return count

      assert components(5, [(0, 1), (1, 2), (3, 4)]) == 2
      assert components(3, []) == 3
      assert components(0, []) == 0
    note: "Time O(V + E): every node and edge is touched a constant number of times."

  - kind: code
    kicker: Hidden graphs
    title: "A grid is a graph"
    intro: "Each cell is a node. Its neighbours are the cells above, below, left and right. Count islands of 1s."
    lang: python
    code: |
      def islands(grid):
          R, C = len(grid), len(grid[0]) if grid else 0
          seen = set()
          def dfs(r, c):
              if not (0 <= r < R and 0 <= c < C) or grid[r][c] != 1 or (r, c) in seen:
                  return
              seen.add((r, c))
              for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  dfs(r + dr, c + dc)
          n = 0
          for r in range(R):
              for c in range(C):
                  if grid[r][c] == 1 and (r, c) not in seen:
                      n += 1
                      dfs(r, c)
          return n

      g = [[1, 1, 0, 0],
           [1, 0, 0, 1],
           [0, 0, 1, 1]]
      assert islands(g) == 2
      assert islands([]) == 0
    note: "No adjacency list is built. The four directions are the edges."

  - kind: check
    kicker: Your turn
    title: "Pick a representation"
    question: "A social network has 10 million users and each has about 200 friends. Which storage fits?"
    options:
      - { text: "A matrix of 10 million by 10 million", why: "That is 100 trillion cells, nearly all empty." }
      - { text: "An adjacency list", correct: true, why: "About 2 billion entries, only the real friendships." }
      - { text: "One long list of names", why: "You could not find the friends of one person quickly." }
      - { text: "A heap", why: "Not a graph structure." }

  - kind: check
    kicker: Practice
    title: "Directed or not?"
    question: "Course A must be taken before course B. Which graph models this?"
    options:
      - { text: "Directed: an edge from A to B", correct: true, why: "The order matters, so edges have a direction." }
      - { text: "Undirected: a line between A and B", why: "It would lose which comes first." }
      - { text: "A matrix of names", why: "A representation, not a model." }
      - { text: "A tree always", why: "Prerequisites can join and share, so not always a tree." }

  - kind: practice
    kicker: Your turn
    title: "Build adjacency lists"
    intro: "Write `adjacency(n, edges)` for an undirected graph of nodes `0..n-1`. Return a list where item `i` is the sorted list of neighbours of node i."
    entry: adjacency
    starter: |
      def adjacency(n, edges):
          pass
    solution: |
      def adjacency(n, edges):
          g = [[] for _ in range(n)]
          for a, b in edges:
              g[a].append(b)
              g[b].append(a)
          return [sorted(x) for x in g]
    tests:
      - { input: "[3,[[0,1],[1,2]]]", expected: "[[1],[0,2],[1]]" }
      - { input: "[2,[]]", expected: "[[],[]]" }
    hint: "Each edge adds b to a's list and a to b's list."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Forgetting the visited set.** A graph with a cycle will make the walk run forever."
      - "**Missing lonely nodes.** A node with no edges still counts as a component."
      - "**Storing an undirected edge once.** Add it in both directions."
      - "**Mixing up V and E.** Graph algorithms are usually O(V + E)."
    next: { label: "Next: BFS and DFS", href: /learn/dsa-bfs-and-dfs }
