id: prompting-and-structured-output
title: Prompting and structured output
order: 24
minutes: 10
params:
  - { id: p, label: "valid on one try (%)", min: 30, max: 95, step: 5, init: 70 }
  - { id: n, label: "tries allowed", min: 1, max: 5, step: 1, init: 3 }
derived:
  - { id: pf, expr: "p / 100" }
  - { id: okp, expr: "100 * (1 - (1 - pf) ^ n)" }
  - { id: calls, expr: "(1 - (1 - pf) ^ n) / pf" }
cards:
  - kind: story
    kicker: Start here
    title: Models talk. Programs need data.
    body:
      - "Ask a model for a support ticket and it may reply with a friendly paragraph. Your program cannot read a paragraph. It needs **JSON** in a fixed shape."
      - "So you do three things: ask clearly, **check** the reply against the shape, and **retry** if it fails."
    callout: "Ask, validate, retry."

  - kind: code
    kicker: Read it
    title: A prompt that gets JSON
    intro: "Be specific, show the exact shape, and give one **example**. Examples are the strongest hint you can give."
    lang: text
    code: |
      Turn the message into a support ticket.
      Reply with JSON only, no other text.

      Shape:
      {"title": string, "priority": 1 | 2 | 3, "tags": [string]}

      Example
      Message: "Checkout crashes on my phone, urgent!"
      JSON: {"title": "Checkout crash on mobile", "priority": 1, "tags": ["checkout", "mobile"]}

      Message: "{user_message}"
      JSON:
    note: "Priority 1 means most urgent. State the allowed values so the model does not invent new ones."

  - kind: lab
    kicker: See it first
    title: Retries make it reliable
    intro: "Say the model gives valid JSON on **{p} percent** of single tries. Allow a few retries and the odds climb quickly. **Drag both sliders.**"
    view:
      type: flow
      stages:
        - { label: "1. Prompt", note: "schema plus one example", color: "#38bdf8" }
        - { label: "2. Model answers", note: "valid JSON about {p} percent of the time", color: "#a78bfa" }
        - { label: "3. Validate", note: "check the shape in code, never trust it", color: "#f59e0b" }
        - { label: "4. Retry", note: "on failure, ask again with the error, up to {n} tries", color: "#ef4444" }
        - { label: "5. Result", note: "valid **{okp} percent** of the time, about {calls} calls each", color: "#1cd6ac" }
    sliders: [p, n]
    outro: "With {n} tries the chance of getting valid output is **{okp} percent**."

  - kind: formula
    kicker: Read the formula
    title: Chance of at least one success
    tex: "P = 1 - (1 - p)^{n}"
    say: "The chance that all tries fail is the failure chance multiplied by itself n times. Subtract that from 1 to get the chance that at least one try works."
    verify:
      - { expr: "okp", equals: 97.3, tol: 0.01 }
      - { expr: "100 * (1 - 0.3 ^ 3)", equals: 97.3, tol: 0.01 }
      - { expr: "calls", equals: 1.39, tol: 0.01 }
    symbols:
      - { tex: "P", means: "chance of at least one valid answer", value: pf }
      - { tex: "p", means: "chance one try is valid, as a fraction", value: pf }
      - { tex: "1 - p", means: "chance one try fails" }
      - { tex: "n", means: "how many tries you allow", value: n }

  - kind: code
    kicker: In code
    title: Validate, then retry
    intro: "A schema library such as **pydantic** checks the reply. On failure, send the error text back so the model can fix it."
    lang: python
    code: |
      import json
      from pydantic import BaseModel, ValidationError

      class Ticket(BaseModel):
          title: str
          priority: int      # 1, 2 or 3
          tags: list[str]

      def get_ticket(prompt, tries=3):
          for _ in range(tries):
              text = ask_model(prompt)
              try:
                  return Ticket(**json.loads(text))
              except (ValueError, ValidationError) as err:
                  prompt += f"\nYour last reply was invalid: {err}\nJSON only:"
          raise RuntimeError("no valid JSON after retries")
    note: "`json.loads` fails on broken JSON. `Ticket(...)` fails on wrong types or missing fields."

  - kind: check
    kicker: Check yourself
    title: Why validate
    question: "The model returned JSON that parses fine, but priority is the word \"high\". What catches it?"
    options:
      - { text: "A schema check that priority must be an integer", correct: true, why: "Valid JSON is not the same as the right shape. A schema checks types and fields." }
      - { text: "json.loads alone", why: "It only checks the syntax, and \"high\" is a valid string." }
      - { text: "A higher temperature", why: "Temperature changes randomness, not correctness of shape." }

  - kind: check
    kicker: Check yourself
    title: Improve the prompt
    question: "Replies keep arriving wrapped in chatty text. Which change helps most?"
    options:
      - { text: "Say JSON only and add a full example", correct: true, why: "Clear instructions plus a concrete example strongly steer the format." }
      - { text: "Ask the model to be creative", why: "Creativity makes the format less predictable." }
      - { text: "Make the prompt much longer with background", why: "More text does not fix the format. A precise example does." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Trusting the reply.** Always validate before the data reaches your database or screen."
      - "**Retrying forever.** Cap the tries and fail loudly after that."
      - "**Retrying with the same prompt.** Include the error message so the next try can fix it."
    next: { label: "Next: tool calling", href: /learn/tool-calling }
