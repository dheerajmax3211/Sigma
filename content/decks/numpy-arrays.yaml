id: numpy-arrays
title: NumPy arrays and shapes
order: 7
minutes: 9
params:
  - { id: c, label: "multiply by", min: 0, max: 4, step: 0.5, init: 2 }
  - { id: n, label: "n rows of A", min: 1, max: 5, step: 1, init: 2 }
  - { id: m, label: "m (shared)", min: 1, max: 5, step: 1, init: 3 }
  - { id: k, label: "k columns of B", min: 1, max: 5, step: 1, init: 4 }
derived:
  - { id: o1, expr: 1 * c }
  - { id: o2, expr: 2 * c }
  - { id: o3, expr: 3 * c }
  - { id: cells, expr: n * k }
  - { id: mults, expr: n * m * k }
cards:
  - kind: story
    kicker: Start here
    title: A spreadsheet that does maths all at once
    body:
      - A NumPy **array** is a grid of numbers, like a spreadsheet. Its **shape** tells you how many rows and columns, for example (2, 3) means 2 rows and 3 columns.
      - The big idea is that one instruction works on every cell at once, with no loop. That is why ML code is fast and short.
    callout: Always ask "what is its shape?" before anything else.

  - kind: code
    kicker: Make and inspect
    title: Arrays and their shape
    intro: Every array has a shape. Printing it is the first thing to do when something goes wrong.
    lang: python
    code: |
      import numpy as np

      v = np.array([1, 2, 3])           # shape (3,)
      M = np.array([[1, 2, 3],
                    [4, 5, 6]])         # shape (2, 3)

      print(v.shape, M.shape)           # (3,) (2, 3)
      print(M[1, 2])                    # 6: row 1, column 2
    note: Rows and columns count from 0, so M[1, 2] is the second row, third column.

  - kind: lab
    kicker: See it first
    title: One instruction, every cell
    intro: The array is [1, 2, 3]. Writing `v * c` multiplies every item by c. This stretching of a single number across a whole array is called **broadcasting**.
    view:
      type: bars
      items:
        - { label: "1 × c", value: o1, color: "#38bdf8" }
        - { label: "2 × c", value: o2, color: "#a78bfa" }
        - { label: "3 × c", value: o3, color: "#1cd6ac" }
    sliders: [c]
    outro: "[1, 2, 3] × {c} = [{o1}, {o2}, {o3}]. No loop was written."

  - kind: formula
    kicker: Read the formula
    title: The shape rule for matrix multiply
    tex: "(n \\times m)\\,(m \\times k) = (n \\times k)"
    say: The inner two numbers must match and then vanish. The outer two numbers are the shape of the answer. Match the middle, keep the ends.
    verify:
      - { expr: cells, equals: 8, tol: 0.001 }
      - { expr: mults, equals: 24, tol: 0.001 }
      - { expr: "2 * 3 * 4", equals: 24, tol: 0.001 }
    symbols:
      - { tex: "n", means: rows of the first array A, value: n }
      - { tex: "m", means: "columns of A and rows of B, which must match", value: m }
      - { tex: "k", means: columns of the second array B, value: k }
      - { tex: "n \\times k", means: how many numbers the result holds, value: cells }

  - kind: lab
    kicker: Try it
    title: Will these shapes multiply?
    intro: Here A has shape (n, m) and B has shape (m, k). Change **n**, **m** and **k**. The result always takes the outer two numbers.
    view:
      type: flow
      stages:
        - { label: "A", note: "shape ({n}, {m})", color: "#38bdf8" }
        - { label: "B", note: "shape ({m}, {k})", color: "#a78bfa" }
        - { label: "A @ B", note: "shape ({n}, {k}), {cells} numbers, {mults} multiplications", color: "#1cd6ac" }
    sliders: [n, m, k]
    outro: "Result shape is ({n}, {k}). It cost {n} × {m} × {k} = **{mults}** multiplications."

  - kind: check
    kicker: Check yourself
    title: Predict the shape
    question: "A has shape (3, 4) and B has shape (4, 2). What is the shape of `A @ B`?"
    options:
      - { text: "(3, 2)", correct: true, why: "The inner 4s match and vanish. The outer numbers, 3 and 2, remain." }
      - { text: "(4, 4)", why: "That keeps the inner numbers, but those are the ones that cancel." }
      - { text: "It is an error", why: "The inner numbers are both 4, so the shapes are compatible." }

  - kind: practice
    kicker: Your turn
    title: "Normalise a column"
    intro: "Write `standardise(xs)`: subtract the mean from every number and divide by the standard deviation. Return a list rounded to 4 places. This is what `(x - x.mean()) / x.std()` does in NumPy."
    entry: standardise
    starter: |
      import math
      def standardise(xs):
          pass
    solution: |
      import math
      def standardise(xs):
          m = sum(xs) / len(xs)
          s = math.sqrt(sum((x - m) ** 2 for x in xs) / len(xs))
          return [round((x - m) / s, 4) for x in xs]
    tests:
      - { input: "[[1, 2, 3]]", expected: "[-1.2247, 0.0, 1.2247]" }
      - { input: "[[10, 20]]", expected: "[-1.0, 1.0]" }
      - { input: "[[2, 4, 4, 4, 5, 5, 7, 9]]", expected: "[-1.5, -0.5, -0.5, -0.5, 0.0, 0.0, 1.0, 2.0]" }
    hint: "Mean first, then standard deviation, then rescale each number."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**`*` is not `@`.** `A * B` multiplies cell by cell. `A @ B` is the matrix multiply from the last lessons."
      - "**Shape (3,) is not shape (3, 1).** One is a flat list and the other is a column. Mixing them gives surprising answers, so print `.shape`."
      - "**Broadcasting can hide bugs.** NumPy will quietly stretch a smaller array. Check the result shape matches what you expected."
    next: { label: "Next: Git and the terminal", href: /learn/git-and-terminal }
