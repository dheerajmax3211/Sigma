id: dsa-patterns
title: DSA patterns
order: 45
minutes: 10
params:
  - { id: n, label: "input size n", min: 10, max: 200, step: 10, init: 100 }
derived:
  - { id: lin, expr: "n" }
  - { id: nlg, expr: "n * log(n) / log(2)" }
  - { id: quad, expr: "n * n" }
  - { id: ratio, expr: "quad / lin" }
cards:
  - kind: story
    kicker: Start here
    title: Patterns, not 500 problems
    body:
      - "Interview coding problems look endless, but most are a few shapes in disguise. Learn to **recognise the shape**, and the solution follows."
      - "Always start by saying the slow, obvious answer out loud. Then ask what repeated work you can remove."
    callout: "Brute force first, then remove repeats."

  - kind: lab
    kicker: See it first
    title: Why speed class matters
    intro: "Count operations as the input grows. **n** means one pass. **n squared** means a loop inside a loop. Both look fine for small input. **Drag n.**"
    view:
      type: bars
      max: 40000
      items:
        - { label: "one pass: n", value: lin, color: "#1cd6ac" }
        - { label: "sorting: n log n", value: nlg, color: "#38bdf8" }
        - { label: "loop in a loop: n squared", value: quad, color: "#ef4444" }
    sliders: [n]
    outro: "With n = {n}, one pass does **{lin}** steps and a loop inside a loop does **{quad}**. That is **{ratio}** times more."

  - kind: formula
    kicker: Read the formula
    title: O(n) versus O(n squared)
    tex: "O(n) \\ \\text{versus}\\ O(n^{2})"
    say: "Big O describes how work grows as input grows, ignoring small constants. Double the input and O(n) work doubles, but O(n squared) work quadruples."
    verify:
      - { expr: "quad", equals: 10000, tol: 0.01 }
      - { expr: "nlg", equals: 664.4, tol: 0.5 }
      - { expr: "ratio", equals: 100, tol: 0.01 }
    symbols:
      - { tex: "n", means: "how many items you are given", value: n }
      - { tex: "O(n)", means: "work grows in step with n, such as one loop", value: lin }
      - { tex: "O(n^{2})", means: "work grows with n times n, such as a loop inside a loop", value: quad }

  - kind: code
    kicker: Pattern one
    title: "Hash map: seen it before"
    intro: "Two numbers that add to a target. Brute force checks every pair, which is n squared. A dictionary remembers what you have seen, so one pass is enough."
    lang: python
    code: |
      def two_sum(nums, target):
          seen = {}                       # value -> index
          for i, x in enumerate(nums):
              if target - x in seen:      # the partner appeared earlier
                  return [seen[target - x], i]
              seen[x] = i
          return []
    note: "Use a hash map when you ask whether you have seen a value before."

  - kind: code
    kicker: Pattern two
    title: Sliding window
    intro: "Best sum of k neighbours. Instead of re-adding k numbers each time, slide: add the new one and drop the old one."
    lang: python
    code: |
      def best_window(nums, k):
          total = sum(nums[:k])
          best = total
          for i in range(k, len(nums)):
              total += nums[i] - nums[i - k]   # add new, drop old
              best = max(best, total)
          return best
    note: "Use it for a contiguous stretch with a size or a rule. Two pointers on a sorted list work the same way."

  - kind: check
    kicker: Check yourself
    title: Name the pattern
    question: "Find the longest stretch of a string with no repeated letters. Which pattern fits?"
    options:
      - { text: "Sliding window", correct: true, why: "You need a contiguous stretch, so grow and shrink a window as you scan." }
      - { text: "Sorting then binary search", why: "Sorting would destroy the order of the string, which matters here." }
      - { text: "Recursion on every subset", why: "That is exponential, and a window solves it in one pass." }

  - kind: check
    kicker: Check yourself
    title: Read the cost
    question: "A function has one loop over n items, and inside it another loop over the same n items. What is its time complexity?"
    options:
      - { text: "O(n squared)", correct: true, why: "n passes of n steps each is n times n." }
      - { text: "O(n)", why: "That would be two loops one after the other, not one inside the other." }
      - { text: "O(log n)", why: "Logarithmic means halving the work each step, which nothing here does." }

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Coding in silence.** Say the brute force and its cost first, then improve it."
      - "**Skipping edge cases.** Try an empty list, one item and duplicates before you say done."
      - "**Memorising answers.** Interviewers change details, so learn the shape instead."
    next: { label: "Next: resume bullets", href: /learn/resume-bullets }
