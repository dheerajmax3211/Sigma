id: dsa-union-find
title: "Union-find"
minutes: 13
order: 121
params:
  - { id: s, label: "step", min: 0, max: 4, step: 1, init: 0 }
  - { id: n, label: "nodes n", min: 10, max: 1000000, step: 10, init: 100000 }
derived:
  - { id: slow, expr: "n" }
cards:
  - kind: story
    kicker: Start here
    title: "Which group are you in?"
    body:
      - "Union-find (also called disjoint set) keeps track of groups. It answers two questions fast: **find** which group an item is in, and **union** two groups into one."
      - "Each item points to a **parent**. Following parents leads to the group's **root**. Two items are in the same group when they share a root."
    callout: "Clue words: connected, merge groups, friends of friends, redundant connection, number of components as edges arrive."

  - kind: lab
    kicker: See it
    title: "Merging groups"
    intro: "The array shows each item's parent. At the start everyone is their own parent. **Drag the step.**"
    view:
      type: array
      cells: [0, 1, 2, 3, 4, 5]
      frames:
        - [0, 1, 2, 3, 4, 5]
        - [0, 0, 2, 3, 4, 5]
        - [0, 0, 2, 2, 4, 5]
        - [0, 0, 0, 2, 4, 5]
        - [0, 0, 0, 0, 4, 5]
      frame: s
      pointers:
        - { label: "changed", at: "pick(s, 0, 1, 3, 2, 3)", color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Index is the item, value is its parent. Everyone points at themselves: 6 groups."
      - "**union(0, 1)**: 1's parent becomes 0. Groups: 5."
      - "**union(2, 3)**: 3's parent becomes 2. Groups: 4."
      - "**union(1, 3)**: roots are 0 and 2, so 2's parent becomes 0. Groups: 3."
      - "**find(3)** walked 3 to 2 to 0, then **path compression** pointed 3 straight at 0. Next time it is one hop."
    saysAt: s

  - kind: code
    kicker: Write it
    title: "Find and union"
    intro: "Find follows parents to the root and shortcuts the path. Union attaches the smaller tree under the larger one."
    lang: python
    code: |
      class DSU:
          def __init__(self, n):
              self.p = list(range(n))
              self.size = [1] * n
              self.groups = n

          def find(self, x):
              while self.p[x] != x:
                  self.p[x] = self.p[self.p[x]]      # path compression
                  x = self.p[x]
              return x

          def union(self, a, b):
              ra, rb = self.find(a), self.find(b)
              if ra == rb:
                  return False                        # already together
              if self.size[ra] < self.size[rb]:
                  ra, rb = rb, ra
              self.p[rb] = ra
              self.size[ra] += self.size[rb]
              self.groups -= 1
              return True

      d = DSU(6)
      assert d.union(0, 1) and d.union(2, 3) and d.union(1, 3)
      assert d.find(3) == d.find(0)
      assert d.groups == 3
      assert not d.union(0, 3)
    note: "With both tricks each operation is nearly O(1). The real name is inverse Ackermann, below 5 for any input you will ever see."

  - kind: lab
    kicker: What it saves
    title: "Naive group labels"
    intro: "A naive way: keep a group id per item and relabel one whole group on every merge, which can cost n each time. **Drag n.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "relabel on merge (worst case)", value: slow, color: "#ef4444" }
        - { label: "union-find per operation", value: "4", color: "#1cd6ac" }
    sliders: [n]
    outro: "With {n} items one naive merge may touch {slow} labels. Union-find does a handful of steps."

  - kind: check
    kicker: Your turn
    title: "Same group?"
    question: "After union(0, 1), union(2, 3), union(1, 3), is find(0) equal to find(2)?"
    options:
      - { text: "Yes, all four are in one group", correct: true, why: "0 joined 1, 2 joined 3, and the third union joined both pairs." }
      - { text: "No", why: "The last union connected the two pairs." }
      - { text: "Only if sorted", why: "Order of items does not matter." }
      - { text: "Cannot say", why: "Follow the unions: they link 0, 1, 2 and 3 together." }

  - kind: code
    kicker: Use it
    title: "Redundant connection"
    intro: "Add edges one by one. The first edge whose two ends are **already connected** closes a cycle and is the redundant one."
    lang: python
    code: |
      def redundant(edges):
          p = {}
          def find(x):
              p.setdefault(x, x)
              while p[x] != x:
                  p[x] = p[p[x]]
                  x = p[x]
              return x
          for a, b in edges:
              ra, rb = find(a), find(b)
              if ra == rb:
                  return [a, b]
              p[ra] = rb
          return []

      assert redundant([[1, 2], [1, 3], [2, 3]]) == [2, 3]
      assert redundant([[1, 2], [2, 3]]) == []
    note: "O(E) near-linear. A DFS per edge would be O(E times V)."

  - kind: code
    kicker: Use it
    title: "Count components as edges arrive"
    intro: "Start with n groups. Every successful union removes one. The counter is always up to date, which DFS cannot do cheaply."
    lang: python
    code: |
      def components_after(n, edges):
          p = list(range(n))
          def find(x):
              while p[x] != x:
                  p[x] = p[p[x]]
                  x = p[x]
              return x
          groups, out = n, []
          for a, b in edges:
              ra, rb = find(a), find(b)
              if ra != rb:
                  p[ra] = rb
                  groups -= 1
              out.append(groups)
          return out

      assert components_after(4, [(0, 1), (2, 3), (1, 0), (1, 2)]) == [3, 2, 2, 1]
    note: "Great for 'add a connection, how many networks now?' streams."

  - kind: check
    kicker: Practice
    title: "Union-find or BFS?"
    question: "Edges are added over time and you must answer 'are x and y connected?' after each. Best fit?"
    options:
      - { text: "Union-find", correct: true, why: "Each update and query is nearly O(1)." }
      - { text: "Run BFS every query", why: "O(V + E) per question." }
      - { text: "Sort the edges", why: "Does not answer connectivity." }
      - { text: "Heap", why: "Not about connectivity." }

  - kind: practice
    kicker: Your turn
    title: "Count the groups"
    intro: "Write `groups(n, edges)` returning how many connected groups the n nodes form. Union-find merges groups and counts what is left."
    entry: groups
    starter: |
      def groups(n, edges):
          pass
    solution: |
      def groups(n, edges):
          p = list(range(n))
          def find(x):
              while p[x] != x:
                  p[x] = p[p[x]]
                  x = p[x]
              return x
          count = n
          for a, b in edges:
              ra, rb = find(a), find(b)
              if ra != rb:
                  p[ra] = rb
                  count -= 1
          return count
    tests:
      - { input: "[5,[[0,1],[1,2],[3,4]]]", expected: "2" }
      - { input: "[3,[]]", expected: "3" }
      - { input: "[2,[[0,1]]]", expected: "1" }
    hint: "Start with n groups. Every edge that joins two different groups removes one."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Comparing parents, not roots.** Always call `find` first."
      - "**Skipping path compression.** Chains grow long and `find` slows down."
      - "**Using it for removals.** Union-find cannot split a group apart."
      - "**Using it on directed graphs.** It models plain connectivity only."
    next: { label: "Next: backtracking", href: /learn/dsa-backtracking }
