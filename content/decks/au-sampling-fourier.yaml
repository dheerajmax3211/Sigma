id: "au-sampling-fourier"
title: "Sound as numbers: sampling and the Fourier transform"
minutes: 15
order: 1001
params:
  - { id: "sr", label: "sample rate (Hz)", min: 4000, max: 48000, step: 1000, init: 16000 }
  - { id: "f", label: "tone frequency (Hz)", min: 500, max: 12000, step: 500, init: 3000 }
derived:
  - { id: "nyq", expr: "sr / 2" }
  - { id: "heard", expr: "abs(f - sr * round(f / sr))" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A wave becomes a list"
    body:
      - "A microphone measures air pressure. To store it, we read the pressure many times a second. Each reading is a **sample**, and the number of readings per second is the **sample rate**. Speech models usually use 16000 per second."
      - "The **Fourier transform** turns that list back into which pitches are present and how strong each is. It is the first step of nearly every speech system."
    callout: "Audio is a long list of numbers. The Fourier transform says which pitches are inside it."
  - kind: "lab"
    kicker: "See it"
    title: "The speed limit"
    intro: "You can only capture pitches up to **half** the sample rate, called the Nyquist limit. Higher pitches fold back down and sound like a lower one. **Drag both.**"
    view:
      type: "bars"
      max: 12000
      items:
        - { label: "the highest pitch you can capture (Hz)", value: "nyq", color: "#1cd6ac" }
        - { label: "pitch you play (Hz)", value: "f", color: "#38bdf8" }
        - { label: "pitch you actually record (Hz)", value: "heard", color: "#f97316" }
    sliders:
      - "sr"
      - "f"
    outro: "At {sr} samples a second the limit is **{nyq} Hz**. A {f} Hz tone is recorded as **{heard} Hz**. If the two differ, it has been folded back."
  - kind: "code"
    kicker: "Write it"
    title: "Aliasing and a tiny Fourier transform"
    intro: "Two different tones give identical samples. A transform finds the true pitch of a clean one."
    lang: "python"
    code: |
      import math

      sr = 16000
      a = [math.cos(2 * math.pi * 12000 * n / sr) for n in range(16)]
      b = [math.cos(2 * math.pi * 4000 * n / sr) for n in range(16)]
      assert all(abs(x - y) < 1e-9 for x, y in zip(a, b))     # 12 kHz looks like 4 kHz

      def magnitudes(x):
          n = len(x)
          out = []
          for k in range(n // 2):
              re = sum(x[t] * math.cos(2 * math.pi * k * t / n) for t in range(n))
              im = sum(x[t] * math.sin(2 * math.pi * k * t / n) for t in range(n))
              out.append(math.hypot(re, im))
          return out

      x = [math.sin(2 * math.pi * 4 * t / 32) for t in range(32)]   # 4 cycles in 32 samples
      m = magnitudes(x)
      assert m.index(max(m)) == 4
    note: "Real code uses the fast version, the FFT, which gives the same answer much quicker."
  - kind: "lab"
    kicker: "Memorise"
    title: "Common rates"
    intro: "What you will meet."
    view:
      type: "flow"
      stages:
        - { label: "8 kHz", note: "Old phone calls. Voice only.", color: "#f97316" }
        - { label: "16 kHz", note: "Speech recognition and most speech models.", color: "#1cd6ac" }
        - { label: "24 kHz", note: "Many speech synthesis systems.", color: "#38bdf8" }
        - { label: "44.1 or 48 kHz", note: "Music and film.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Nyquist"
    question: "What is the highest pitch you can capture at 16000 samples per second?"
    options:
      - { text: "8000 Hz", correct: true, why: "Half the sample rate." }
      - { text: "16000 Hz", why: "That would need twice the samples." }
      - { text: "32000 Hz", why: "No." }
      - { text: "4000 Hz", why: "That is a quarter." }
  - kind: "check"
    kicker: "Practice"
    title: "Aliasing"
    question: "What happens to a pitch above the limit?"
    options:
      - { text: "It folds back and sounds like a lower pitch", correct: true, why: "Nothing in the samples can tell them apart." }
      - { text: "It is silent", why: "No." }
      - { text: "It is louder", why: "No." }
      - { text: "It is deleted", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Mixing sample rates.** Resample everything to the model's rate."
      - "**Resampling without a filter.** Aliasing sneaks in."
      - "**Forgetting stereo.** Mix to mono unless told otherwise."
    next: { label: "Next: noise and augmentation", href: "/learn/au-noise-augmentation" }
