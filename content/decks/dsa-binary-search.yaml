id: dsa-binary-search
title: "Binary search"
minutes: 15
order: 110
params:
  - { id: s, label: "step", min: 0, max: 3, step: 1, init: 0 }
  - { id: n, label: "items n", min: 1, max: 1000000, step: 1000, init: 1000000 }
derived:
  - { id: lo, expr: "pick(s, 0, 5, 5, 6)" }
  - { id: hi, expr: "pick(s, 9, 9, 6, 6)" }
  - { id: mid, expr: "pick(s, 4, 7, 5, 6)" }
  - { id: guesses, expr: "ceil(log(n) / log(2))" }
cards:
  - kind: story
    kicker: Start here
    title: "Guess the number in 20 questions"
    body:
      - "Pick a number from 1 to 1,000,000. Ask 'is it higher or lower than 500,000?' Each answer throws away **half** of what is left."
      - "That is binary search. It needs sorted data and finds the answer in about 20 steps, even for a million items."
    callout: "Clue words: sorted, find, first or last position, minimum that works, 'at least'."

  - kind: lab
    kicker: See it
    title: "Searching for 17"
    intro: "Check the middle. If it is too small, drop the left half. If too big, drop the right half. **Drag the step.**"
    view:
      type: array
      cells: [1, 3, 5, 8, 11, 14, 17, 20, 25, 30]
      pointers:
        - { label: "lo", at: lo, color: "#38bdf8" }
        - { label: "mid", at: mid, color: "#1cd6ac" }
        - { label: "hi", at: hi, color: "#f97316" }
      windows:
        - { from: lo, to: hi, color: "#1cd6ac" }
    sliders: [s]
    says:
      - "Window is the whole list. mid is index 4, value 11. 17 is bigger, so everything up to mid is out."
      - "lo moves to 5. mid is index 7, value 20. 17 is smaller, so everything after mid is out."
      - "hi moves to 6. mid is index 5, value 14. 17 is bigger, so lo moves up."
      - "lo is 6. mid is index 6, value 17. **Found** after 4 looks in a list of 10."
    saysAt: s

  - kind: lab
    kicker: How fast
    title: "Halving is powerful"
    intro: "Steps needed = how many times n can be halved until 1 is left. **Drag n.**"
    view:
      type: bars
      max: 1000000
      items:
        - { label: "scan one by one", value: n, color: "#ef4444" }
        - { label: "binary search guesses", value: guesses, color: "#1cd6ac" }
    sliders: [n]
    outro: "For {n} items a scan may take {n} looks. Binary search needs at most **{guesses}**."

  - kind: code
    kicker: Write it
    title: "The standard template"
    intro: "Keep a window `[lo, hi]` that still might contain the answer. Compute `mid` without overflow in other languages as `lo + (hi - lo) // 2`."
    lang: python
    code: |
      def search(a, x):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = lo + (hi - lo) // 2
              if a[mid] == x:
                  return mid
              if a[mid] < x:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1

      a = [1, 3, 5, 8, 11, 14, 17, 20, 25, 30]
      assert search(a, 17) == 6
      assert search(a, 2) == -1
      assert search([], 1) == -1 and search([5], 5) == 0
    note: "O(log n) time, O(1) space. Always test the empty list and the one-item list."

  - kind: code
    kicker: Boundaries
    title: "First position where a rule becomes true"
    intro: "The most useful version: the answers look like `no no no yes yes yes`. Find the first `yes`. This also gives first occurrence and insert position."
    lang: python
    code: |
      def first_true(lo, hi, ok):
          # smallest x in [lo, hi] with ok(x) True; hi+1 if none
          while lo <= hi:
              mid = lo + (hi - lo) // 2
              if ok(mid):
                  hi = mid - 1
              else:
                  lo = mid + 1
          return lo

      a = [1, 2, 2, 2, 5, 8]
      first_2 = first_true(0, len(a) - 1, lambda i: a[i] >= 2)
      assert first_2 == 1
      assert first_true(0, len(a) - 1, lambda i: a[i] >= 9) == 6
    note: "bisect_left in Python's standard library does exactly this."

  - kind: check
    kicker: Your turn
    title: "Which half?"
    question: "a = [2, 4, 6, 8, 10], x = 9, mid points at 6. Which update is right?"
    options:
      - { text: "lo = mid + 1", correct: true, why: "6 is less than 9, so 9 can only be to the right." }
      - { text: "hi = mid - 1", why: "That drops the right side, where 9 would be." }
      - { text: "return mid", why: "6 is not 9." }
      - { text: "lo = mid", why: "Without +1 the window may never shrink and you loop forever." }

  - kind: code
    kicker: Search on the answer
    title: "Minimum speed that finishes in time"
    intro: "You do not need a sorted array, only a yes/no rule that flips once. Here: eating speed k, must finish all piles in h hours."
    lang: python
    code: |
      def min_speed(piles, h):
          def ok(k):
              return sum((p + k - 1) // k for p in piles) <= h
          lo, hi = 1, max(piles)
          while lo < hi:
              mid = (lo + hi) // 2
              if ok(mid):
                  hi = mid
              else:
                  lo = mid + 1
          return lo

      assert min_speed([3, 6, 7, 11], 8) == 4
      assert min_speed([30, 11, 23, 4, 20], 5) == 30
    note: "Larger speed never hurts, so the rule flips once. This pattern solves many 'minimum that works' questions."

  - kind: check
    kicker: Practice
    title: "Can I use it?"
    question: "Which of these can use binary search?"
    options:
      - { text: "Find a name in an unsorted list", why: "Order is required." }
      - { text: "Smallest size that fits a deadline, where bigger always works too", correct: true, why: "A yes/no rule that flips once is enough." }
      - { text: "Find the largest of an unsorted list", why: "Needs a single scan." }
      - { text: "Count items in a linked list", why: "You cannot jump to the middle." }

  - kind: practice
    kicker: Your turn
    title: "Find the first position"
    intro: "Write `search(nums, target)` on a sorted list. Return the index of target, or -1 if missing. Cut the search range in half each step."
    entry: search
    starter: |
      def search(nums, target):
          pass
    solution: |
      def search(nums, target):
          lo, hi = 0, len(nums) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if nums[mid] == target:
                  return mid
              if nums[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
    tests:
      - { input: "[[-1,0,3,5,9,12],9]", expected: "4" }
      - { input: "[[-1,0,3,5,9,12],2]", expected: "-1" }
      - { input: "[[5],5]", expected: "0" }
    hint: "Look at the middle. If it is too small, throw away the left half."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Infinite loop.** Always move past mid with `mid + 1` or `mid - 1`."
      - "**`<` vs `<=`.** Pick one template and keep the whole pattern consistent."
      - "**Searching unsorted data.** The answer will be wrong without any error."
      - "**Off by one at the end.** Ask what happens when the answer is the very first or very last item."
    next: { label: "Next: sorting", href: /learn/dsa-sorting }
