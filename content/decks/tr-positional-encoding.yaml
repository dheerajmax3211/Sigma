id: tr-positional-encoding
title: "Positional encoding: telling attention the order"
minutes: 13
order: 302
params:
  - { id: f, label: "frequency", min: 0.1, max: 2, step: 0.1, init: 1 }
  - { id: p, label: "position", min: 0, max: 12, step: 1, init: 3 }
derived:
  - { id: val, expr: "sin(p * f)" }
cards:
  - kind: story
    kicker: Start here
    title: "Attention cannot tell order"
    body:
      - "Attention compares every token with every other token. Shuffle the tokens and the scores are the same, just reordered."
      - "'Dog bites man' and 'man bites dog' would look alike. So we add **position information** to each token before attention."
    callout: "No position signal, no sense of word order."

  - kind: lab
    kicker: See it
    title: "A wave per position"
    intro: "The original recipe adds sine and cosine waves of different speeds. Each position gets its own pattern. **Drag the frequency and position.**"
    view:
      type: curve
      fn: "sin(t * f)"
      min: 0
      max: 12
      point: p
      yMin: -1.2
      yMax: 1.2
      xLabel: position
      yLabel: value
    sliders: [f, p]
    outro: "At position {p} with frequency {f}, this wave has value **{val}**. Many waves together form a unique fingerprint."

  - kind: code
    kicker: Write it
    title: "Sinusoidal encoding"
    intro: "Even slots use sine, odd slots use cosine, and each pair has its own wavelength."
    lang: python
    code: |
      import math

      def pe(pos, d):
          out = []
          for i in range(d // 2):
              w = pos / 10000 ** (2 * i / d)
              out += [math.sin(w), math.cos(w)]
          return out

      assert pe(0, 4) == [0.0, 1.0, 0.0, 1.0]
      assert len(pe(7, 8)) == 8
      assert pe(1, 4) != pe(2, 4)
    note: "These vectors are added to the token embeddings."

  - kind: lab
    kicker: Compare
    title: "Three common choices"
    intro: "Modern models use different tricks."
    view:
      type: flow
      stages:
        - { label: "Sinusoidal", note: "Fixed waves. The original transformer.", color: "#38bdf8" }
        - { label: "Learned", note: "A trained vector per position. Simple but capped length.", color: "#1cd6ac" }
        - { label: "Rotary (RoPE)", note: "Rotates queries and keys by position. Common in current LLMs.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Why add positions?"
    question: "What goes wrong if you give a transformer no positional information?"
    options:
      - { text: "It treats the sentence as a bag of tokens, ignoring order", correct: true, why: "Attention alone is order-blind." }
      - { text: "It cannot compute softmax", why: "Softmax is unaffected." }
      - { text: "Training becomes unstable at once", why: "It trains, but loses word order." }
      - { text: "Vocabulary doubles", why: "Unrelated." }

  - kind: check
    kicker: Practice
    title: "Longer than training"
    question: "A model with learned position vectors was trained on 2,048 positions. What is the problem at 4,000 tokens?"
    options:
      - { text: "It has no trained vectors for positions past 2,048", correct: true, why: "Learned tables have a fixed size. Relative schemes extend more easily." }
      - { text: "Softmax overflows", why: "Not the cause." }
      - { text: "Tokens merge together", why: "No." }
      - { text: "Nothing", why: "Length limits are real." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Assuming order is free.** The model needs a signal for it."
      - "**Believing longer context is automatic.** Position schemes limit length."
      - "**Confusing token and position embeddings.** They are added, not stacked."
    next: { label: "Next: multi-head attention", href: /learn/tr-multi-head-attention }
