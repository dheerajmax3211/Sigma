id: tr-mixture-of-experts
title: "Mixture of experts: big model, small bill"
minutes: 12
order: 312
params:
  - { id: e, label: "experts", min: 2, max: 64, step: 1, init: 8 }
derived:
  - { id: total, expr: "1 + 0.5 * e" }
  - { id: active, expr: "1 + 0.5 * 2" }
cards:
  - kind: story
    kicker: Start here
    title: "Only some of the model works on each token"
    body:
      - "In a normal model every weight is used for every token. In a **mixture of experts** the feed-forward part is split into many small **experts**."
      - "A small **router** picks the best two or so for each token. The model can hold huge knowledge while each token only pays for a few experts."
    callout: "More total parameters, similar compute per token."

  - kind: lab
    kicker: See it
    title: "Total versus used"
    intro: "Illustrative sizes in billions: a shared part of 1, and 0.5 per expert with two used per token. **Drag the experts.**"
    view:
      type: bars
      max: 33
      items:
        - { label: "total parameters (billions)", value: total, color: "#38bdf8" }
        - { label: "used per token (billions)", value: active, color: "#1cd6ac" }
    sliders: [e]
    outro: "With {e} experts the model holds **{total} billion** weights but each token uses only about **{active} billion**."

  - kind: code
    kicker: Write it
    title: "A top-2 router"
    intro: "The router scores every expert, keeps the best two and turns their scores into weights that add to one."
    lang: python
    code: |
      import math

      def route(scores, k=2):
          top = sorted(range(len(scores)), key=lambda i: -scores[i])[:k]
          ex = [math.exp(scores[i]) for i in top]
          s = sum(ex)
          return {i: v / s for i, v in zip(top, ex)}

      r = route([0.1, 2.0, -1.0, 1.5])
      assert set(r) == {1, 3}
      assert abs(sum(r.values()) - 1) < 1e-12
      assert r[1] > r[3]
    note: "The layer output is the weighted sum of the chosen experts' outputs."

  - kind: lab
    kicker: See it
    title: "The catch"
    intro: "Savings come with engineering problems."
    view:
      type: flow
      stages:
        - { label: "Memory", note: "All experts must still be loaded, even if few run.", color: "#ef4444" }
        - { label: "Balance", note: "A loss term stops the router overusing a few experts.", color: "#f97316" }
        - { label: "Communication", note: "Experts on different GPUs need fast links.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "What do you save?"
    question: "What does a mixture of experts mainly save compared with a dense model of the same total size?"
    options:
      - { text: "Compute per token, since only a few experts run", correct: true, why: "Memory for all weights is still needed, but the work per token is smaller." }
      - { text: "Memory for weights", why: "All experts are still stored." }
      - { text: "Training data", why: "No." }
      - { text: "The tokeniser", why: "No." }

  - kind: check
    kicker: Practice
    title: "Router collapse"
    question: "The router sends almost every token to the same two experts. What is the fix?"
    options:
      - { text: "Add a load-balancing loss that rewards using experts evenly", correct: true, why: "Without it the favoured experts train faster and the others go unused." }
      - { text: "Remove the router", why: "Then it is not a mixture." }
      - { text: "Lower the temperature", why: "No." }
      - { text: "Shrink the vocabulary", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Reading parameter counts alone.** Ask how many are active per token."
      - "**Forgetting memory.** All experts stay loaded."
      - "**Ignoring balance.** Collapse wastes the extra capacity."
    next: { label: "Back to the Learn page", href: /learn }
