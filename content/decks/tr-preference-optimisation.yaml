id: tr-preference-optimisation
title: "Preference tuning: RLHF and DPO"
minutes: 13
order: 311
params:
  - { id: d, label: "score gap (good minus bad)", min: -4, max: 4, step: 0.1, init: 1 }
derived:
  - { id: pref, expr: "sigmoid(d)" }
  - { id: loss, expr: "-log(sigmoid(d))" }
cards:
  - kind: story
    kicker: Start here
    title: "From text continuer to helpful assistant"
    body:
      - "A pretrained model continues text. To make it helpful, people show it pairs of answers and mark **which one is better**."
      - "The model is then nudged to produce more answers like the winner. **RLHF** does this with a reward model and reinforcement learning. **DPO** skips the reward model and trains on the pairs directly."
    callout: "Preference data teaches taste: helpful, honest, safe."

  - kind: lab
    kicker: See it
    title: "The usual recipe"
    intro: "Three stages turn a base model into an assistant."
    view:
      type: flow
      stages:
        - { label: "Pretrain", note: "Learn language from huge text.", color: "#38bdf8" }
        - { label: "Instruction tuning", note: "Learn to follow prompts from example answers.", color: "#1cd6ac" }
        - { label: "Preference tuning", note: "Learn which answers people prefer.", color: "#f97316" }

  - kind: lab
    kicker: See it
    title: "From scores to a preference"
    intro: "If a good answer scores higher than a bad one, the chance it is preferred is the sigmoid of the gap. **Drag the gap.**"
    view:
      type: curve
      fn: "sigmoid(t)"
      min: -4
      max: 4
      point: d
      yMin: 0
      yMax: 1
      xLabel: score gap
      yLabel: chance preferred
    sliders: [d]
    outro: "A gap of {d} gives a **{pref}** chance the good answer wins. The training loss is **{loss}**, which shrinks as the gap grows."

  - kind: code
    kicker: Write it
    title: "A pairwise preference loss"
    intro: "The loss is minus the log of the preference probability. Training pushes the gap up."
    lang: python
    code: |
      import math

      def sigmoid(z):
          return 1 / (1 + math.exp(-z))

      def pair_loss(good, bad):
          return -math.log(sigmoid(good - bad))

      assert abs(pair_loss(1.0, 1.0) - math.log(2)) < 1e-12
      assert pair_loss(3.0, 0.0) < pair_loss(1.0, 0.0)
      assert pair_loss(0.0, 3.0) > pair_loss(0.0, 1.0)
    note: "DPO uses the same shape, with the gap measured from the model's own log probabilities against a frozen reference."

  - kind: check
    kicker: Your turn
    title: "RLHF versus DPO"
    question: "What does DPO remove compared with classic RLHF?"
    options:
      - { text: "The separate reward model and the reinforcement learning loop", correct: true, why: "DPO optimises directly on preference pairs, which is simpler and steadier." }
      - { text: "The need for any human data", why: "Preference pairs are still needed." }
      - { text: "The base model", why: "No." }
      - { text: "Tokenisation", why: "No." }

  - kind: check
    kicker: Practice
    title: "A risk"
    question: "A model tuned on preferences starts giving long, flattering answers. Why?"
    options:
      - { text: "Raters tended to prefer them, so the model learned to chase that signal", correct: true, why: "Optimising a proxy can drift from what you really want." }
      - { text: "The tokeniser changed", why: "No." }
      - { text: "Lower temperature", why: "No." }
      - { text: "Smaller vocabulary", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Treating preferences as truth.** Raters have biases."
      - "**Skipping the reference model.** It stops the model drifting too far."
      - "**Mixing up stages.** Instruction tuning comes first."
    next: { label: "Next: mixture of experts", href: /learn/tr-mixture-of-experts }
