id: tr-decoding-strategies
title: "Decoding: choosing the next token"
minutes: 14
order: 306
params:
  - { id: T, label: "temperature", min: 0.2, max: 3, step: 0.1, init: 1 }
derived:
  - { id: e1, expr: "exp(2 / T)" }
  - { id: e2, expr: "exp(1 / T)" }
  - { id: e3, expr: "exp(0.5 / T)" }
  - { id: e4, expr: "exp(0 / T)" }
  - { id: s, expr: "e1 + e2 + e3 + e4" }
  - { id: p1, expr: "100 * e1 / s" }
  - { id: p2, expr: "100 * e2 / s" }
  - { id: p3, expr: "100 * e3 / s" }
  - { id: p4, expr: "100 * e4 / s" }
cards:
  - kind: story
    kicker: Start here
    title: "The model gives odds, you choose"
    body:
      - "At each step the model outputs a probability for every token. **Decoding** is how you pick one. The choice changes the style of the answer a lot."
      - "Pick the top token every time and the text is safe but repetitive. Sample freely and it is creative but can wander."
    callout: "Temperature, top-k and top-p are three ways to control that dial."

  - kind: lab
    kicker: See it
    title: "Temperature"
    intro: "Four tokens with scores 2, 1, 0.5 and 0. Low temperature sharpens the odds, high temperature flattens them. **Drag the temperature.**"
    view:
      type: bars
      max: 100
      items:
        - { label: "token A (percent)", value: p1, color: "#1cd6ac" }
        - { label: "token B", value: p2, color: "#38bdf8" }
        - { label: "token C", value: p3, color: "#f97316" }
        - { label: "token D", value: p4, color: "#a78bfa" }
    sliders: [T]
    outro: "At temperature {T}, token A gets **{p1} percent**. Near zero it becomes greedy, picking A almost every time."

  - kind: code
    kicker: Write it
    title: "Temperature and top-k"
    intro: "Divide the scores by the temperature before softmax. Top-k keeps only the k best tokens."
    lang: python
    code: |
      import math

      def probs(logits, temp=1.0):
          z = [v / temp for v in logits]
          m = max(z)
          e = [math.exp(v - m) for v in z]
          s = sum(e)
          return [v / s for v in e]

      def top_k(p, k):
          keep = set(sorted(range(len(p)), key=lambda i: -p[i])[:k])
          q = [v if i in keep else 0.0 for i, v in enumerate(p)]
          s = sum(q)
          return [v / s for v in q]

      p = probs([2, 1, 0.5, 0])
      assert probs([2, 1, 0.5, 0], 0.1)[0] > 0.99
      assert max(probs([2, 1, 0.5, 0], 5)) < 0.4
      q = top_k(p, 2)
      assert q[2] == 0 and abs(sum(q) - 1) < 1e-12
    note: "Top-p keeps the smallest set of tokens whose probabilities add to p. It adapts to how sure the model is."

  - kind: lab
    kicker: Compare
    title: "Which to use"
    intro: "Match the setting to the job."
    view:
      type: flow
      stages:
        - { label: "Greedy or low T", note: "Code, extraction, maths. You want the same answer each time.", color: "#38bdf8" }
        - { label: "Medium T with top-p", note: "Chat and writing. A balanced default.", color: "#1cd6ac" }
        - { label: "High T", note: "Brainstorming. Expect odd and sometimes wrong output.", color: "#f97316" }

  - kind: check
    kicker: Your turn
    title: "Temperature zero"
    question: "What does temperature close to zero do?"
    options:
      - { text: "It makes the model almost always pick the most likely token", correct: true, why: "Dividing by a tiny number makes the top score dominate." }
      - { text: "It makes output random", why: "That is high temperature." }
      - { text: "It stops generation", why: "No." }
      - { text: "It shortens the answer", why: "No." }

  - kind: check
    kicker: Practice
    title: "Repeating itself"
    question: "A model loops on the same phrase. What is a sensible first fix?"
    options:
      - { text: "Raise the temperature a little or use top-p sampling with a repetition penalty", correct: true, why: "Pure greedy decoding easily falls into loops. A little randomness breaks them." }
      - { text: "Set temperature to zero", why: "That makes loops more likely." }
      - { text: "Shorten the vocabulary", why: "Unrelated." }
      - { text: "Remove the prompt", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**High temperature for facts.** It raises hallucination risk."
      - "**Expecting determinism at T above zero.** Set a seed to repeat runs."
      - "**Stacking every knob.** Change one at a time."
    next: { label: "Next: the KV cache", href: /learn/tr-kv-cache }
