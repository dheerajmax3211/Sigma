id: "fd-convexity-conditioning"
title: "Convexity and conditioning"
minutes: 14
order: 709
params:
  - { id: "kappa", label: "steepness ratio between directions", min: 1, max: 100, step: 1, init: 10 }
derived:
  - { id: "steps", expr: "kappa * 4.6" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Why some problems train easily"
    body:
      - "A function is **convex** if it is a single bowl. Gradient descent on a bowl always reaches the bottom. Linear and logistic regression are convex. Neural networks are not, yet they train well in practice."
      - "Even in a bowl, shape matters. If the bowl is a long narrow valley, steps zigzag. The ratio of the steepest to the flattest direction is the **condition number**."
    callout: "Badly conditioned problems need small steps and many of them."
  - kind: "lab"
    kicker: "See it"
    title: "A narrow valley"
    intro: "Say the steepest direction is this many times steeper than the flattest. The steps needed to shrink the error 100 times grow with that ratio. **Drag the ratio.**"
    view:
      type: "bars"
      max: 500
      items:
        - { label: "steps needed (roughly)", value: "steps", color: "#f97316" }
        - { label: "steps when both directions match", value: "4.6", color: "#1cd6ac" }
    sliders:
      - "kappa"
    outro: "With a ratio of {kappa}, expect about **{steps}** steps. Scaling features is a cheap way to lower the ratio."
  - kind: "code"
    kicker: "Write it"
    title: "Two directions, one learning rate"
    intro: "The learning rate must fit the steepest direction, so the flattest crawls."
    lang: "python"
    code: |
      a, b = 1.0, 10.0          # slopes of the two directions
      lr = 1 / b

      x, y = 1.0, 1.0
      for _ in range(10):
          x = x - lr * a * x
          y = y - lr * b * y

      assert abs(y) < 1e-12                       # steep direction solved at once
      assert abs(x - 0.9 ** 10) < 1e-12           # flat direction still crawling
      assert x > 0.34

      # equal slopes: one step is enough
      a = b = 1.0
      x = 1.0 - 1.0 * a * 1.0
      assert x == 0.0
    note: "This is why normalising inputs and using Adam help. They even out the directions."
  - kind: "lab"
    kicker: "Memorise"
    title: "Remedies"
    intro: "How practice softens bad conditioning."
    view:
      type: "flow"
      stages:
        - { label: "Scale features", note: "Make every input about the same size.", color: "#38bdf8" }
        - { label: "Normalisation layers", note: "Keep layer inputs steady.", color: "#1cd6ac" }
        - { label: "Adaptive optimisers", note: "Give each weight its own step size.", color: "#f97316" }
  - kind: "check"
    kicker: "Your turn"
    title: "Convex"
    question: "What is guaranteed when you run gradient descent on a convex function with a small enough rate?"
    options:
      - { text: "It reaches the global minimum", correct: true, why: "There is only one bowl." }
      - { text: "It never converges", why: "It does." }
      - { text: "It finds a local minimum only", why: "Local and global agree." }
      - { text: "It needs momentum", why: "Not required." }
  - kind: "check"
    kicker: "Practice"
    title: "Slow training"
    question: "Training is slow and zigzags. A good first fix?"
    options:
      - { text: "Normalise or scale the inputs", correct: true, why: "It improves the conditioning." }
      - { text: "Add more layers", why: "Not first." }
      - { text: "Remove the loss", why: "No." }
      - { text: "Use a bigger learning rate", why: "It can diverge." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Assuming deep nets are convex.** They are not."
      - "**Ignoring feature scale.** It slows every optimiser."
      - "**Chasing the global minimum.** Good enough minima generalise."
    next: { label: "Next: schedules and exploding gradients", href: "/learn/fd-schedules-stability" }
