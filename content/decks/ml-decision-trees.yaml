id: "ml-decision-trees"
title: "Decision trees"
minutes: 14
order: 501
params:
  - { id: "p", label: "share of class A", min: 0, max: 1, step: 0.05, init: 0.5 }
derived:
  - { id: "g", expr: "100 * 2 * p * (1 - p)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A tree is a list of yes or no questions"
    body:
      - "A **decision tree** asks one question about one feature at a time, such as is income above 50 thousand, and sends the row left or right. At the bottom, a **leaf** gives the answer."
      - "To pick each question, the tree measures how **mixed** the groups are afterwards. A group of one class only is **pure**. The best question leaves the purest groups."
    callout: "Trees need no scaling, handle mixed data, and are easy to explain."
  - kind: "lab"
    kicker: "See it"
    title: "How mixed is a group?"
    intro: "The **Gini impurity** is one minus the sum of each class share squared. Zero means pure. **Drag the share.**"
    view:
      type: "bars"
      max: 50
      items:
        - { label: "impurity of this group", value: "g", color: "#f97316" }
        - { label: "worst possible impurity", value: "50", color: "#38bdf8" }
    sliders:
      - "p"
    outro: "With {p} of the group in class A, impurity is **{g}** out of a worst case of 50. Pure groups score 0."
  - kind: "code"
    kicker: "Write it"
    title: "Score a split"
    intro: "The tree tries every cut on every feature and keeps the one with the lowest weighted impurity."
    lang: "python"
    code: |
      def gini(labels):
          n = len(labels)
          return 1 - sum((labels.count(c) / n) ** 2 for c in set(labels))

      def split_score(left, right):
          n = len(left) + len(right)
          return len(left) / n * gini(left) + len(right) / n * gini(right)

      def best_cut(xs, ys):
          best = None
          for t in sorted(set(xs))[:-1]:
              left = [y for x, y in zip(xs, ys) if x <= t]
              right = [y for x, y in zip(xs, ys) if x > t]
              s = split_score(left, right)
              if best is None or s < best[0]:
                  best = (s, t)
          return best

      assert gini([0, 0, 1, 1]) == 0.5
      assert gini([1, 1, 1]) == 0
      assert best_cut([1, 2, 3, 10, 11, 12], [0, 0, 0, 1, 1, 1]) == (0.0, 3)
    note: "The cut at 3 means x at most 3 goes left. A perfectly pure split scores 0."
  - kind: "lab"
    kicker: "Memorise"
    title: "Depth is the dial"
    intro: "Growing deeper fits more detail, and then fits noise."
    view:
      type: "flow"
      stages:
        - { label: "Shallow", note: "Few rules. Misses real patterns. High bias.", color: "#38bdf8" }
        - { label: "Just right", note: "Splits that hold on new data.", color: "#1cd6ac" }
        - { label: "Too deep", note: "One leaf per row. Memorises. High variance.", color: "#ef4444" }
  - kind: "check"
    kicker: "Your turn"
    title: "Perfect training score"
    question: "A tree scores 100 percent on training and 65 percent on test. What is wrong?"
    options:
      - { text: "It is too deep and has memorised", correct: true, why: "Limit depth, require more rows per leaf, or prune." }
      - { text: "The test set is broken", why: "First suspect the model." }
      - { text: "It needs more features", why: "It already fits training perfectly." }
      - { text: "Gini is the wrong measure", why: "Gini and entropy rarely differ." }
  - kind: "check"
    kicker: "Practice"
    title: "What controls overfitting"
    question: "Which setting most directly limits a tree from memorising?"
    options:
      - { text: "Maximum depth and minimum rows per leaf", correct: true, why: "They stop splits that only fit a few rows." }
      - { text: "The random seed", why: "It changes ties only." }
      - { text: "Gini versus entropy", why: "Little effect." }
      - { text: "Feature order", why: "No effect." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Letting it grow fully.** Always cap depth or leaf size."
      - "**Trusting one tree.** Small data changes give a different tree. Use a forest."
      - "**Scaling features.** Trees do not need it."
    next: { label: "Next: random forests", href: "/learn/ml-random-forests" }
