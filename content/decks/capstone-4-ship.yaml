id: capstone-4-ship
title: "DocChat stage 4: protect and ship"
order: 1104
minutes: 18
params:
  - { id: limit, label: "requests per user per minute", min: 1, max: 20, step: 1, init: 5 }
  - { id: users, label: "active users", min: 10, max: 100, step: 10, init: 50 }
derived:
  - { id: peak, expr: "limit * users" }
cards:
  - kind: story
    kicker: "Capstone, week 7"
    title: "Ready for strangers"
    body:
      - "Once it is public, anyone can send anything, quickly. Stage 4 adds the checks that stop one bad request or one eager user from breaking it for everyone."
      - "**Stage 4**: validate the request, rate limit each user, then follow the ship checklist: container, deploy, readme and a short write-up."

  - kind: lab
    kicker: See it first
    title: "Why a rate limit exists"
    intro: "Each request costs model time and money. **Drag the sliders** to see the worst load per minute."
    view:
      type: bars
      max: 2000
      items:
        - { label: "worst case requests per minute", value: peak, color: "#f97316" }
        - { label: "what one server handles", value: "600", color: "#64748b" }
    sliders: [limit, users]
    outro: "{users} users at {limit} each can send **{peak}** requests a minute. If that beats what one server handles, lower the limit or add capacity."

  - kind: code
    kicker: Starter code
    title: "The project so far"
    intro: "The final shape of `docchat.py`. Every stage fits into one request handler."
    lang: python
    code: |
      def handle(body):
          # stage 4: validate first
          # stage 2: pick chunks
          # stage 3: build the prompt and check citations
          # stage 1: stream the answer
          return 'ok'

      print(handle({"question": "hi"}))
    note: "Now add the two guards below at the very top of the handler."

  - kind: practice
    kicker: Add this to your project
    title: "Validate the request"
    intro: "Write `validate(body)` for a dict. Return `missing question` if the key is absent, `empty question` if it is only spaces, `too long` if over 500 characters, otherwise `ok`."
    entry: validate
    starter: |
      def validate(body):
          pass
    solution: |
      def validate(body):
          if 'question' not in body:
              return 'missing question'
          q = body['question']
          if not q.strip():
              return 'empty question'
          if len(q) > 500:
              return 'too long'
          return 'ok'
    tests:
      - { input: "[{\"question\":\"hi\"}]", expected: "\"ok\"" }
      - { input: "[{}]", expected: "\"missing question\"" }
      - { input: "[{\"question\":\"  \"}]", expected: "\"empty question\"" }
      - { input: "[{\"question\": \"\"}]", expected: "\"too long\"" }
    hint: "Check the cheapest and most basic problem first."

  - kind: practice
    kicker: Add this to your project
    title: "Rate limit a user"
    intro: "Write `allow(times, now, limit, window)`. `times` are earlier request times in seconds. Allow the request only if fewer than `limit` of them fall within the last `window` seconds before `now`."
    entry: allow
    starter: |
      def allow(times, now, limit, window):
          pass
    solution: |
      def allow(times, now, limit, window):
          return sum(1 for t in times if now - t < window) < limit
    tests:
      - { input: "[[1,2,3],10,3,60]", expected: "false" }
      - { input: "[[1,2],10,3,60]", expected: "true" }
      - { input: "[[1,2,3],100,3,60]", expected: "true" }
    hint: "Count recent requests only, then compare to the limit."

  - kind: check
    kicker: Check yourself
    title: "Ship order"
    question: "Which should come last before you share the link?"
    options:
      - { text: "A deployed demo, readme with screenshot and short write-up", correct: true, why: "These make the project visible, and they depend on everything before." }
      - { text: "Adding a fifth feature", why: "Finish and ship first, then extend." }
      - { text: "Rewriting the chunking", why: "Only do that if the eval says it is the problem." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**No input limit.** One huge request can cost real money."
      - "**Shipping without the eval.** You cannot say it works."
      - "**Secrets in the repo.** Keep keys in environment variables, never in code."
    next: { label: "Back to the path", href: "/learn" }
