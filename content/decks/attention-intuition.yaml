id: attention-intuition
title: Attention, intuitively
order: 21
minutes: 10
params:
  - { id: q1, label: "query q₁", min: 0, max: 3, step: 0.25, init: 1 }
  - { id: q2, label: "query q₂", min: 0, max: 3, step: 0.25, init: 1 }
  - { id: dim, label: "vector size d", min: 1, max: 64, step: 1, init: 16 }
derived:
  - { id: s1, expr: "3 * q1 + 1 * q2" }
  - { id: s2, expr: "1 * q1 + 1 * q2" }
  - { id: s3, expr: "1 * q1 + 2 * q2" }
  - { id: e1, expr: "exp(s1 / sqrt(2))" }
  - { id: e2, expr: "exp(s2 / sqrt(2))" }
  - { id: e3, expr: "exp(s3 / sqrt(2))" }
  - { id: tot, expr: "e1 + e2 + e3" }
  - { id: a1, expr: "e1 / tot" }
  - { id: a2, expr: "e2 / tot" }
  - { id: a3, expr: "e3 / tot" }
  - { id: out, expr: "a1 * 10 + a2 * 2 + a3 * 6" }
  - { id: u1, expr: "exp(dim * 0.9)" }
  - { id: u2, expr: "exp(dim * 0.3)" }
  - { id: u3, expr: "exp(dim * 0.6)" }
  - { id: pu1, expr: "u1 / (u1 + u2 + u3)" }
  - { id: pu2, expr: "u2 / (u1 + u2 + u3)" }
  - { id: pu3, expr: "u3 / (u1 + u2 + u3)" }
  - { id: v1, expr: "exp(sqrt(dim) * 0.9)" }
  - { id: v2, expr: "exp(sqrt(dim) * 0.3)" }
  - { id: v3, expr: "exp(sqrt(dim) * 0.6)" }
  - { id: ps1, expr: "v1 / (v1 + v2 + v3)" }
  - { id: ps2, expr: "v2 / (v1 + v2 + v3)" }
  - { id: ps3, expr: "v3 / (v1 + v2 + v3)" }
cards:
  - kind: story
    kicker: Start here
    title: Every word asks a question
    body:
      - "Take the sentence \"The cat sat on the mat because it was tired.\""
      - "To understand the word **it**, you must look back at the other words and decide which one matters."
      - "**Attention** does exactly that. The current word sends out a **query**, every other word holds a **key** that says what it offers, and a match means more attention."
    callout: "Query asks. Key answers. Value is what gets copied."

  - kind: lab
    kicker: See it first
    title: Who does the query listen to?
    intro: "Three words each have a key and a **value**, the information they carry. The query is a pair of numbers. The more a key matches the query, the **bigger its bar**. **Drag the query.**"
    view:
      type: bars
      max: 1
      items:
        - { label: "cat (value 10)", value: a1, color: "#38bdf8" }
        - { label: "mat (value 2)", value: a2, color: "#a78bfa" }
        - { label: "sat (value 6)", value: a3, color: "#1cd6ac" }
    sliders: [q1, q2]
    outro: "Attention weights: {a1}, {a2}, {a3}. They always add up to 1. The blended output is **{out}**, a weighted average of the values."

  - kind: formula
    kicker: Read the formula
    title: Scores, softmax, blend
    tex: "s_i = \\frac{q \\cdot k_i}{\\sqrt{d}},\\qquad a_i = \\frac{e^{s_i}}{\\sum_j e^{s_j}},\\qquad \\text{out} = \\sum_i a_i\\, v_i"
    say: "Score each key by its dot product with the query. Turn the scores into shares that add up to 1 using softmax. Then average the values using those shares."
    verify:
      - { expr: "a1", equals: 0.576, tol: 0.001 }
      - { expr: "a1 + a2 + a3", equals: 1, tol: 0.001 }
      - { expr: "out", equals: 7.7438, tol: 0.01 }
    symbols:
      - { tex: "q", means: "the query: what the current word is looking for" }
      - { tex: "k_i", means: "the key of word i: what that word advertises" }
      - { tex: "q \\cdot k_i", means: "dot product: a bigger number means a better match", value: s1 }
      - { tex: "d", means: "the size of the vectors, here 2", value: "2" }
      - { tex: "a_i", means: "the attention weight on word i, between 0 and 1", value: a1 }
      - { tex: "v_i", means: "the value of word i: the information that gets copied" }

  - kind: check
    kicker: Check yourself
    title: Predict the bars
    question: "The query is q = (0, 2). The keys are cat = (3, 1), mat = (1, 1) and sat = (1, 2). Which word gets the biggest weight?"
    options:
      - { text: "sat", correct: true, why: "The dot products are 2, 2 and 4. The key sat = (1, 2) matches this query best." }
      - { text: "cat", why: "cat only scores 2 here. It would win if the query pointed along x₁ instead." }
      - { text: "They tie", why: "cat and mat tie at 2, but sat scores 4 and wins." }

  - kind: lab
    kicker: Try it
    title: Why divide by √d
    intro: "Dot products grow with the vector size d. Without the **√d** division, softmax goes extreme and one word takes everything. **Drag d** and compare the two sets of bars."
    view:
      type: bars
      max: 1
      items:
        - { label: "no division: cat", value: pu1, color: "#ef4444" }
        - { label: "no division: mat", value: pu2, color: "#ef4444" }
        - { label: "no division: sat", value: pu3, color: "#ef4444" }
    also:
      type: bars
      max: 1
      items:
        - { label: "divide by √d: cat", value: ps1, color: "#1cd6ac" }
        - { label: "divide by √d: mat", value: ps2, color: "#1cd6ac" }
        - { label: "divide by √d: sat", value: ps3, color: "#1cd6ac" }
    sliders: [dim]
    outro: "At d = {dim} the undivided top weight is **{pu1}**. With √d it is **{ps1}**, so the other words still get a say."

  - kind: check
    kicker: Check yourself
    title: What attention returns
    question: "What does one attention step output for the current word?"
    options:
      - { text: "A weighted average of the value vectors", correct: true, why: "The weights come from query and key matches. The values are blended by those weights." }
      - { text: "The single best-matching word, unchanged", why: "That would be a hard pick. Softmax gives a soft blend of all the words." }
      - { text: "The keys added together", why: "Keys only decide the weights. The values carry the information." }

  - kind: practice
    kicker: Your turn
    title: "Softmax weights"
    intro: "Write `softmax(scores)` returning a list of weights that are positive and add up to 1. Round to 4 places. Attention uses these weights to decide how much to read from each word."
    entry: softmax
    starter: |
      import math
      def softmax(scores):
          pass
    solution: |
      import math
      def softmax(scores):
          e = [math.exp(s) for s in scores]
          t = sum(e)
          return [round(v / t, 4) for v in e]
    tests:
      - { input: "[[0, 0]]", expected: "[0.5, 0.5]" }
      - { input: "[[1, 2, 3]]", expected: "[0.09, 0.2447, 0.6652]" }
      - { input: "[[5]]", expected: "[1.0]" }
    hint: "Raise e to each score, then divide by the total."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Thinking attention is a lookup.** It is a soft blend of everything, not a pick of one item."
      - "**Mixing up keys and values.** Keys decide how much to listen. Values are what you actually hear."
      - "**Forgetting the weights sum to 1.** Softmax makes them shares of one whole, so raising one lowers the others."
    next: { label: "Next: the transformer block", href: /learn/transformer-block }
