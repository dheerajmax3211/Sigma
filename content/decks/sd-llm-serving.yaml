id: "sd-llm-serving"
title: "Serving an LLM"
minutes: 15
order: 608
params:
  - { id: "B", label: "requests batched together", min: 1, max: 64, step: 1, init: 8 }
derived:
  - { id: "step", expr: "20 + 0.5 * B" }
  - { id: "tps", expr: "1000 * B / (20 + 0.5 * B)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "A GPU is wasted on one request"
    body:
      - "Producing a token reads all the model weights from memory. With a single request that is expensive for one token. With many at once the same read serves them all."
      - "So servers **batch** requests together. Each user waits a little longer per token, and total output rises a lot. **Continuous batching** lets requests join and leave a batch at every step."
    callout: "Throughput, latency and cost pull against each other."
  - kind: "lab"
    kicker: "See it"
    title: "Batching"
    intro: "Assume each step costs 20 ms plus half a millisecond per request. These are illustrative numbers. **Drag the batch size.**"
    view:
      type: "bars"
      max: 1500
      items:
        - { label: "tokens per second, all users", value: "tps", color: "#1cd6ac" }
        - { label: "milliseconds per token for each user", value: "step", color: "#f97316" }
    sliders:
      - "B"
    outro: "A batch of {B} gives **{tps}** tokens a second in total, while each user waits **{step} ms** per token."
  - kind: "code"
    kicker: "Write it"
    title: "Cost per million tokens"
    intro: "The price of a token comes from what the GPU costs and how many tokens it makes."
    lang: "python"
    code: |
      def cost_per_million(gpu_per_hour, tokens_per_second):
          return gpu_per_hour / (tokens_per_second * 3600) * 1_000_000

      assert abs(cost_per_million(2.0, 1000) - 0.5556) < 1e-3
      # doubling throughput halves the cost
      assert abs(cost_per_million(2.0, 2000) * 2 - cost_per_million(2.0, 1000)) < 1e-9

      def kv_gb(layers, kv_heads, head_dim, tokens, bytes_per=2):
          return 2 * layers * kv_heads * head_dim * tokens * bytes_per / 1e9

      assert abs(kv_gb(32, 8, 128, 8000) - 1.0486) < 1e-3
    note: "The cache for each request grows with its length. Memory, not compute, often limits the batch."
  - kind: "lab"
    kicker: "Memorise"
    title: "What to tune"
    intro: "Know the levers."
    view:
      type: "flow"
      stages:
        - { label: "Batch size", note: "Higher: cheaper per token, slower per user.", color: "#38bdf8" }
        - { label: "Quantise", note: "Smaller weights, less memory, more room to batch.", color: "#1cd6ac" }
        - { label: "Cache prefixes", note: "Reuse work for shared system prompts.", color: "#f97316" }
        - { label: "Speculate", note: "A small model drafts, the big one checks.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why batch"
    question: "Why does batching lower the cost per token?"
    options:
      - { text: "The weights are read once and serve many requests", correct: true, why: "Memory reads dominate a single request." }
      - { text: "Tokens get shorter", why: "No." }
      - { text: "The model gets smaller", why: "No." }
      - { text: "GPUs run slower", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Memory limit"
    question: "Long conversations from many users crash the server. A likely limit?"
    options:
      - { text: "The KV cache fills GPU memory", correct: true, why: "Each token of each request holds cache." }
      - { text: "The CPU is idle", why: "Not the cause." }
      - { text: "The disk is full", why: "Not the cause." }
      - { text: "The learning rate", why: "Not for serving." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Optimising only average latency.** Watch the slow tail."
      - "**Ignoring prompt length.** Long prompts cost memory and time."
      - "**No timeouts or limits.** One huge request can stall others."
    next: { label: "Next: agent platforms", href: "/learn/sd-agent-platform" }
