id: int-sd-estimates
title: "System design: back-of-envelope estimates"
minutes: 14
order: 214
params:
  - { id: users, label: "daily users (millions)", min: 1, max: 500, step: 1, init: 50 }
  - { id: per, label: "requests per user per day", min: 1, max: 100, step: 1, init: 20 }
derived:
  - { id: qps, expr: "users * 1000000 * per / 86400" }
  - { id: peak, expr: "qps * 3" }
cards:
  - kind: story
    kicker: Start here
    title: "Rough numbers, quickly"
    body:
      - "Interviewers ask 'how many requests per second?' to see whether your design **fits the scale**. A rough answer in 30 seconds beats an exact one in 5 minutes."
      - "Round hard. A day has about **100 thousand seconds** (really 86400). Peak traffic is often about **3 times** the average."
    callout: "Say your assumptions out loud. The method matters more than the digits."

  - kind: lab
    kicker: See it
    title: "From users to requests per second"
    intro: "Daily requests divided by seconds in a day gives the average rate. **Drag the sliders.**"
    view:
      type: bars
      max: 60000
      items:
        - { label: "average requests per second", value: qps, color: "#38bdf8" }
        - { label: "peak (about 3 times)", value: peak, color: "#f97316" }
    sliders: [users, per]
    outro: "{users} million users making {per} requests each is about **{qps} requests per second**, and **{peak}** at peak."

  - kind: code
    kicker: Write it
    title: "A tiny estimator"
    intro: "Keep estimates in code so you can change an assumption and see the result."
    lang: python
    code: |
      def qps(users, per_user_per_day):
          return users * per_user_per_day / 86400

      def storage_gb(items_per_day, bytes_each, days):
          return items_per_day * bytes_each * days / 1e9

      assert round(qps(86400, 1)) == 1
      assert round(qps(50e6, 20)) == 11574
      # 10 million photos a day, 2 MB each, kept for 365 days
      assert round(storage_gb(10e6, 2e6, 365)) == 7300000
    note: "That last number is 7.3 petabytes. It tells you photos need cheap object storage, not a database."

  - kind: lab
    kicker: Memorise
    title: "Numbers worth knowing"
    intro: "Orders of magnitude are enough."
    view:
      type: flow
      stages:
        - { label: "Memory read", note: "About 100 nanoseconds.", color: "#1cd6ac" }
        - { label: "SSD read", note: "About 100 microseconds.", color: "#38bdf8" }
        - { label: "Same data centre", note: "About 0.5 milliseconds round trip.", color: "#f97316" }
        - { label: "Across continents", note: "About 150 milliseconds round trip.", color: "#a78bfa" }

  - kind: check
    kicker: Your turn
    title: "Quick maths"
    question: "100 million requests per day. Roughly how many per second on average?"
    options:
      - { text: "About 1,000", correct: true, why: "100 million divided by about 100 thousand seconds is 1,000. Real value is 1157." }
      - { text: "About 100", why: "That would be 10 million a day." }
      - { text: "About 100,000", why: "That would be 10 billion a day." }
      - { text: "About 10", why: "Far too low." }

  - kind: check
    kicker: Practice
    title: "Why estimate?"
    question: "Why do interviewers ask for these estimates?"
    options:
      - { text: "To check your design choices match the scale", correct: true, why: "1,000 requests per second and 100,000 need very different designs." }
      - { text: "To test mental arithmetic only", why: "The reasoning matters more." }
      - { text: "Because the answer is fixed", why: "There is no single right number." }
      - { text: "To waste time", why: "No." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**False precision.** Say 'about 12 thousand', not '11,574'."
      - "**Forgetting peak.** Design for peak, not the average."
      - "**Mixing units.** Bytes, kilobytes and gigabytes slip easily."
      - "**Skipping read versus write ratio.** It shapes the whole design."
    next: { label: "Next: scaling a backend", href: /learn/int-sd-scaling }
