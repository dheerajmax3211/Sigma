id: int-resume-and-projects
title: "Resume and project walkthroughs"
minutes: 14
order: 204
params:
  - { id: a, label: "actions listed", min: 0, max: 3, step: 1, init: 0 }
cards:
  - kind: story
    kicker: Start here
    title: "Every line is a question waiting to happen"
    body:
      - "Interviewers pick a project from your resume and dig. **Anything on the page can be asked about**, so list only what you can explain."
      - "A strong bullet has three parts: what you **did**, how you **did it**, and the **result** with a number."
    callout: "Rule: if you cannot explain why you chose a tool, take it off the resume."

  - kind: lab
    kicker: See it
    title: "From weak to strong"
    intro: "The same work, four versions. **Drag to add detail.**"
    view:
      type: flow
      stages:
        - { label: "Weak", note: "Worked on a chatbot.", color: "#ef4444" }
        - { label: "Better", note: "Built a chatbot using Python.", color: "#f97316" }
        - { label: "Good", note: "Built a RAG chatbot over 10 thousand docs.", color: "#facc15" }
        - { label: "Strong", note: "Built a RAG chatbot over 10 thousand docs, cutting support search time 52 percent.", color: "#1cd6ac" }
    sliders: [a]
    says:
      - "No detail. Interviewers cannot tell what you did."
      - "A tool is named, but no result."
      - "Scale appears, so the work feels real."
      - "A result with a number. This one gets asked about."
    saysAt: a

  - kind: code
    kicker: Write it
    title: "Bullet formulas"
    intro: "Start with a strong verb, add how, end with impact. Replace each blank with your own facts."
    lang: text
    code: |
      Built [system] using [tools], serving [scale] and improving [metric] by [amount].
      Reduced [cost or latency] from [before] to [after] by [method].
      Evaluated [model or approach] on [data], lifting [score] from [x] to [y].

      Example: Reduced LLM cost from 0.04 to 0.01 dollars per query by
      caching repeated prompts and routing easy questions to a small model.
    note: "If you lack a real number, estimate honestly and say 'about'."

  - kind: lab
    kicker: Walk it
    title: "How to present a project in 3 minutes"
    intro: "Follow this order. It keeps you from drowning in details."
    view:
      type: flow
      stages:
        - { label: "Problem", note: "Who had what pain? Why it mattered.", color: "#38bdf8" }
        - { label: "Approach", note: "Your design in one diagram.", color: "#1cd6ac" }
        - { label: "Decision", note: "One choice you made and the alternative you rejected.", color: "#f97316" }
        - { label: "Result", note: "A number and how you measured it.", color: "#a78bfa" }
        - { label: "Next", note: "What you would improve with more time.", color: "#facc15" }

  - kind: check
    kicker: Your turn
    title: "The tough follow-up"
    question: "The interviewer asks, 'Why did you choose that vector database?' What is the best reply?"
    options:
      - { text: "Name the need, the options compared, and why one won", correct: true, why: "It shows you decide with reasons, not habit." }
      - { text: "It was popular on social media", why: "That is not an engineering reason." }
      - { text: "A tutorial used it", why: "Honest but weak. Add what you checked yourself." }
      - { text: "I do not remember", why: "That suggests you did not do the work." }

  - kind: check
    kicker: Practice
    title: "Which bullet stays?"
    question: "You skimmed a Kubernetes tutorial once. Should it go on the resume as a skill?"
    options:
      - { text: "No, list only what you can discuss", correct: true, why: "An interviewer will ask about it, and a shaky answer hurts the true items too." }
      - { text: "Yes, more keywords is better", why: "Keywords you cannot defend become liabilities." }
      - { text: "Yes, but in small font", why: "It still gets asked about." }
      - { text: "Yes, if the job lists it", why: "Only if you can speak about it." }

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Vague verbs.** 'Worked on' hides what you did. Use built, reduced, shipped."
      - "**Tool soup.** A long list of buzzwords reads as shallow."
      - "**No numbers.** Even a rough figure is better than none."
      - "**Claiming team work as solo.** Be clear about your own part."
    next: { label: "Next: bias and variance", href: /learn/int-ml-bias-variance }
