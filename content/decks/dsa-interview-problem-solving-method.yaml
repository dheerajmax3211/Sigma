id: dsa-interview-problem-solving-method
title: "How to solve any problem in an interview"
minutes: 14
order: 129
params:
  - { id: n, label: "input size n", min: 1, max: 100000, step: 1, init: 1000 }
derived:
  - { id: lin, expr: "n" }
  - { id: nlog, expr: "n * ceil(log(n) / log(2))" }
  - { id: quad, expr: "n * n" }
cards:
  - kind: story
    kicker: Start here
    title: "A routine beats inspiration"
    body:
      - "Interviewers are not testing whether you remember the answer. They watch **how you think**. A steady routine keeps you calm when the problem is new."
      - "Six steps: **clarify, example, brute force, improve, code, test**. Say each one out loud."
    callout: "Silence feels long. Narrate. A correct slow answer with good talk beats a silent fast one."

  - kind: lab
    kicker: The routine
    title: "Six steps"
    intro: "Follow the stages left to right on every problem."
    view:
      type: flow
      stages:
        - { label: "1 Clarify", note: "Ask about input size, duplicates, empty input, negatives.", color: "#38bdf8" }
        - { label: "2 Example", note: "Work one small case by hand, plus one edge case.", color: "#1cd6ac" }
        - { label: "3 Brute force", note: "State the obvious slow way and its cost.", color: "#f97316" }
        - { label: "4 Improve", note: "Find the repeated work. Pick a pattern.", color: "#a78bfa" }
        - { label: "5 Code", note: "Small functions, clear names, talk as you type.", color: "#ec4899" }
        - { label: "6 Test", note: "Trace your example, then the empty and single cases.", color: "#facc15" }

  - kind: lab
    kicker: Pick the pattern
    title: "What the input size tells you"
    intro: "The limit on n hints at the speed you need. Roughly 10 million steps per second in an interview setting. **Drag n.**"
    view:
      type: bars
      max: 100000000
      items:
        - { label: "O(n)", value: lin, color: "#1cd6ac" }
        - { label: "O(n log n)", value: nlog, color: "#38bdf8" }
        - { label: "O(n squared)", value: quad, color: "#ef4444" }
    sliders: [n]
    outro: "At n = {n}, O(n squared) is **{quad}** steps. Past about 10 thousand that is too slow, so look for a better pattern."

  - kind: story
    kicker: Cheat sheet
    title: "Clue to pattern"
    body:
      - "**Sorted array, pair or target** → two pointers or binary search. **Longest or shortest contiguous part** → sliding window."
      - "**Seen before? count? lookup** → hash map. **Next greater, matching brackets** → stack. **Top k, running median** → heap."
      - "**Shortest path, levels** → BFS. **Connected, groups** → union-find or DFS. **Order with prerequisites** → topological sort."
      - "**All answers** → backtracking. **Count ways, min or max with overlap** → DP. **Overlapping ranges** → sort, then sweep."
    callout: "Still stuck? Solve a smaller input by hand and notice what you repeat."

  - kind: code
    kicker: Worked example
    title: "Two sum, all six steps"
    intro: "**Clarify:** one answer? no reuse of an element? **Example:** [2, 7, 11, 15], target 9 gives [0, 1]. **Brute force:** check every pair, O(n squared). **Improve:** for each x, the partner is target - x. A hash map finds it in O(1)."
    lang: python
    code: |
      def two_sum(nums, target):
          seen = {}                          # value -> index
          for i, x in enumerate(nums):
              if target - x in seen:
                  return [seen[target - x], i]
              seen[x] = i
          return []

      assert two_sum([2, 7, 11, 15], 9) == [0, 1]
      assert two_sum([3, 3], 6) == [0, 1]       # duplicates
      assert two_sum([1], 5) == []              # no answer
    note: "**Test:** the duplicate pair and the single item both pass. Complexity: O(n) time, O(n) space."

  - kind: check
    kicker: Your turn
    title: "What do you do first?"
    question: "You are handed a problem you have never seen. What is the best first move?"
    options:
      - { text: "Ask clarifying questions and work an example", correct: true, why: "It buys thinking time, avoids solving the wrong problem and shows maturity." }
      - { text: "Start typing the optimal solution", why: "Without understanding the problem you will likely code the wrong thing." }
      - { text: "Stay silent until you see it", why: "The interviewer cannot help or give credit for silent thinking." }
      - { text: "Say you have not seen it", why: "Unseen problems are the point. Use the routine." }

  - kind: check
    kicker: Practice
    title: "When you are stuck"
    question: "You cannot see the optimal solution. What earns the most credit?"
    options:
      - { text: "Code the brute force, state its cost, then improve it", correct: true, why: "A working answer plus a clear path to better beats a blank page." }
      - { text: "Keep thinking silently", why: "No evidence of progress." }
      - { text: "Guess a pattern and hope", why: "A wrong confident guess costs more time." }
      - { text: "Ask for the answer", why: "A hint is fine, but try the brute force first." }

  - kind: practice
    kicker: Your turn
    title: "Group anagrams count"
    intro: "Practise the method on a small one. Write `anagram_groups(words)` returning how many groups of anagrams there are. State the idea out loud first: words with the same sorted letters belong together."
    entry: anagram_groups
    starter: |
      def anagram_groups(words):
          pass
    solution: |
      def anagram_groups(words):
          return len({''.join(sorted(w)) for w in words})
    tests:
      - { input: "[[\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"]]", expected: "3" }
      - { input: "[[\"\"]]", expected: "1" }
      - { input: "[[\"a\"]]", expected: "1" }
    hint: "Make a key for each word that is the same for all its anagrams."

  - kind: mistakes
    kicker: Before you move on
    title: "Mistakes to avoid"
    items:
      - "**Coding too early.** Five minutes of clarifying saves twenty of rewriting."
      - "**Skipping the test.** Always trace one example through your own code."
      - "**Forgetting to state complexity.** Say time and space unprompted."
      - "**Going quiet when stuck.** Say what you tried and what you are considering."
    next: { label: "Next: the patterns recap", href: /learn/dsa-patterns }
