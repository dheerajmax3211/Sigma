id: "dist-inference-cost"
title: "The cost of an answer"
minutes: 14
order: 809
params:
  - { id: "b", label: "requests batched together", min: 1, max: 256, step: 1, init: 8 }
derived:
  - { id: "step", expr: "20 + 0.1 * b" }
  - { id: "tps", expr: "b * 1000 / step" }
  - { id: "cost", expr: "2000000 / (tps * 3600)" }
cards:
  - kind: "story"
    kicker: "Start here"
    title: "Why batching is the whole game"
    body:
      - "Generating a token is limited by memory: each step reads every weight once, whether it serves one request or fifty. So the **first** request pays almost the whole step cost, and the **next** ones are nearly free."
      - "That is why serving cost per token falls so sharply as you batch more. The limit is memory for the caches, and the latency users will tolerate."
    callout: "Fill the GPU and the price per token drops."
  - kind: "lab"
    kicker: "See it"
    title: "Price per million tokens"
    intro: "A GPU costs 2 dollars an hour. Each step takes 20 ms plus a little per request. **Drag the batch size.**"
    view:
      type: "bars"
      max: 12
      items:
        - { label: "dollars per million tokens", value: "cost", color: "#f97316" }
        - { label: "a 1 dollar target", value: "1", color: "#1cd6ac" }
    sliders:
      - "b"
    outro: "With {b} requests at once, the server makes **{tps} tokens per second** and each million tokens costs about **{cost} dollars**."
  - kind: "code"
    kicker: "Write it"
    title: "Cost from throughput"
    intro: "Throughput first, then price."
    lang: "python"
    code: |
      def tokens_per_second(b, base_ms=20.0, per_req_ms=0.1):
          step_ms = base_ms + per_req_ms * b
          return b * 1000 / step_ms

      def dollars_per_million(b, gpu_per_hour=2.0):
          return gpu_per_hour * 1e6 / (tokens_per_second(b) * 3600)

      assert abs(tokens_per_second(8) - 384.615) < 0.01
      assert dollars_per_million(1) > dollars_per_million(8) > dollars_per_million(64)
      assert abs(dollars_per_million(8) - 1.444) < 0.01
    note: "Latency per request rises a little with the batch. Real services pick the batch that meets a latency goal."
  - kind: "lab"
    kicker: "Memorise"
    title: "Levers on the bill"
    intro: "How teams cut the cost."
    view:
      type: "flow"
      stages:
        - { label: "Batch more", note: "Continuous batching fills the GPU.", color: "#1cd6ac" }
        - { label: "Quantise", note: "Smaller weights read faster.", color: "#38bdf8" }
        - { label: "Speculate", note: "Fewer slow passes.", color: "#f97316" }
        - { label: "Cache prompts", note: "Reuse the prefix of shared prompts.", color: "#a78bfa" }
  - kind: "check"
    kicker: "Your turn"
    title: "Why cheaper"
    question: "Why does the cost per token fall as the batch grows?"
    options:
      - { text: "The weights are read once and shared", correct: true, why: "The fixed step cost is split across requests." }
      - { text: "Tokens get shorter", why: "No." }
      - { text: "GPUs get cheaper", why: "Price is fixed." }
      - { text: "Accuracy rises", why: "No." }
  - kind: "check"
    kicker: "Practice"
    title: "Limit"
    question: "What stops you batching without limit?"
    options:
      - { text: "Cache memory and the latency users accept", correct: true, why: "Both rise with the batch." }
      - { text: "Nothing", why: "Limits exist." }
      - { text: "The font", why: "No." }
      - { text: "Token price", why: "No." }
  - kind: "mistakes"
    kicker: "Before you move on"
    title: "Mistakes to avoid"
    items:
      - "**Costing on a single request.** Real cost is at batch."
      - "**Ignoring idle time.** Low traffic wastes the GPU."
      - "**Quoting average latency only.** Watch the 99th percentile."
    next: { label: "Next: GPU kernels and fusion", href: "/learn/dist-gpu-kernels" }
