id: capstone-1-ingest
title: "DocChat stage 1: ingest and stream"
order: 1101
minutes: 18
params:
  - { id: size, label: "words per chunk", min: 50, max: 400, step: 50, init: 200 }
  - { id: ov, label: "overlap", min: 0, max: 40, step: 10, init: 20 }
derived:
  - { id: chunks, expr: "ceil((1000 - ov) / (size - ov))" }
  - { id: repeated, expr: "chunks * ov" }
cards:
  - kind: story
    kicker: "Capstone, week 4"
    title: "You are building DocChat"
    body:
      - "Over four stages you build one app: you ask a question and it answers from your own documents, with sources. Each stage adds one working piece."
      - "**Stage 1 (this one)**: split documents into chunks and stream an answer. Stage 2 adds search, stage 3 adds trust and an eval, stage 4 ships it."

  - kind: lab
    kicker: See it first
    title: "Chunk size is a trade"
    intro: "A model cannot read a whole book, so you cut documents into overlapping chunks. Here a 1000 word document is cut up. **Drag the sliders.**"
    view:
      type: bars
      max: 20
      items:
        - { label: "chunks made", value: chunks, color: "#1cd6ac" }
        - { label: "chunks with no overlap", value: "1000 / size", color: "#64748b" }
    sliders: [size, ov]
    outro: "Chunks of {size} words with {ov} overlap give **{chunks}** chunks. The overlap repeats {repeated} words so an idea cut at an edge still appears whole in one chunk."

  - kind: code
    kicker: Starter code
    title: "The project so far"
    intro: "Create a file `docchat.py`. This is where it stands after the first task below."
    lang: python
    code: |
      def chunk(text, size, overlap):
          words = text.split()
          step = size - overlap
          out, i = [], 0
          while i < len(words):
              out.append(" ".join(words[i:i + size]))
              if i + size >= len(words):
                  break
              i += step
          return out

      assert chunk("a b c d e", 3, 1) == ["a b c", "c d e"]
      print(chunk("one two three four", 2, 0))
    note: "Next you add streaming, so the user sees words as they arrive."

  - kind: practice
    kicker: Add this to your project
    title: "Chunk a document"
    intro: "Write `chunk(text, size, overlap)` that returns a list of chunks. Each chunk holds up to `size` words, and neighbours share `overlap` words. Stop when the last words are included."
    entry: chunk
    starter: |
      def chunk(text, size, overlap):
          pass
    solution: |
      def chunk(text, size, overlap):
          words = text.split()
          step = size - overlap
          out, i = [], 0
          while i < len(words):
              out.append(' '.join(words[i:i + size]))
              if i + size >= len(words):
                  break
              i += step
          return out
    tests:
      - { input: "[\"a b c d e\",3,1]", expected: "[\"a b c\",\"c d e\"]" }
      - { input: "[\"a b\",5,1]", expected: "[\"a b\"]" }
      - { input: "[\"a b c d\",2,0]", expected: "[\"a b\",\"c d\"]" }
    hint: "Move the start forward by size minus overlap each time."

  - kind: practice
    kicker: Add this to your project
    title: "Stream the answer"
    intro: "Browsers read a stream as lines starting with `data: ` and a blank line after each. Write `sse(tokens)` returning one string: one such event per token, then a final `data: [DONE]` event."
    entry: sse
    starter: |
      def sse(tokens):
          pass
    solution: |
      def sse(tokens):
          return ''.join(f'data: {t}\n\n' for t in tokens) + 'data: [DONE]\n\n'
    tests:
      - { input: "[[\"Hi\",\"there\"]]", expected: "\"data: Hi\\n\\ndata: there\\n\\ndata: [DONE]\\n\\n\"" }
      - { input: "[[]]", expected: "\"data: [DONE]\\n\\n\"" }
    hint: "Each event is the text data: then the token, then two newlines."

  - kind: check
    kicker: Check yourself
    title: "What to build now"
    question: "Your documents are 300 pages. What is the right first step?"
    options:
      - { text: "Cut them into overlapping chunks and index those", correct: true, why: "A model works on small pieces, and overlap keeps ideas whole." }
      - { text: "Paste all 300 pages into every prompt", why: "It will not fit, and it costs a lot per question." }
      - { text: "Train a new model on them first", why: "That is slow and costly, and chunks plus search are enough." }

  - kind: mistakes
    kicker: Watch for
    title: Common slips
    items:
      - "**Cutting mid-sentence.** Overlap softens it, but prefer to split at paragraph ends."
      - "**No overlap.** An answer that sits across a boundary is lost."
      - "**Waiting for the whole answer.** Stream it, since people judge speed by the first word."
    next: { label: "Next: stage 2", href: "/learn/capstone-2-retrieve" }
