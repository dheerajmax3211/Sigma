id: matrices-as-machines
title: Matrices as machines
order: 3
minutes: 9
params:
  - { id: x1, label: x₁, min: -2, max: 2, step: 0.5, init: 2 }
  - { id: x2, label: x₂, min: -2, max: 2, step: 0.5, init: 1 }
  - { id: a, label: a, min: -2, max: 2, step: 0.5, init: 1 }
  - { id: b, label: b, min: -2, max: 2, step: 0.5, init: 0.5 }
  - { id: c, label: c, min: -2, max: 2, step: 0.5, init: -0.5 }
  - { id: d, label: d, min: -2, max: 2, step: 0.5, init: 1 }
derived:
  - { id: y1, expr: a * x1 + b * x2 }
  - { id: y2, expr: c * x1 + d * x2 }
cards:
  - kind: story
    kicker: Start here
    title: A table that moves arrows
    body:
      - A **matrix** is a grid of numbers. You feed it an arrow (a vector) and it hands back a new arrow, stretched, turned or flipped.
      - Picture a photo filter. The photo goes in, a changed photo comes out, and the filter's settings decide the change. A matrix is the settings table for arrows.
    callout: Every layer of a neural network is one of these machines.

  - kind: lab
    kicker: See it first
    title: An arrow goes in, another comes out
    intro: The blue arrow is the input **x**. The orange arrow is what the matrix returns. Drag the input and watch the output follow.
    view:
      type: vectors
      range: 8
      arrows:
        - { label: in, x: x1, y: x2, color: "#38bdf8" }
        - { label: out, x: y1, y: y2, color: "#f97316" }
    sliders: [x1, x2]
    outro: "Input [{x1}, {x2}] becomes output [{y1}, {y2}]."

  - kind: formula
    kicker: Read the formula
    title: Each output is a dot product
    tex: "\\begin{bmatrix} y_1 \\\\ y_2 \\end{bmatrix} = \\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix} \\begin{bmatrix} x_1 \\\\ x_2 \\end{bmatrix}"
    say: Take the first row of the matrix and do the dot product with the input to get y₁. Take the second row for y₂. Rows of the table times the input, one output each.
    verify:
      - { expr: y1, equals: 2.5, tol: 0.01 }
      - { expr: y2, equals: 0, tol: 0.01 }
      - { expr: "1 * 2 + 0.5 * 1", equals: 2.5, tol: 0.01 }
    symbols:
      - { tex: "y_1", means: "first output = a·x₁ + b·x₂", value: y1 }
      - { tex: "y_2", means: "second output = c·x₁ + d·x₂", value: y2 }
      - { tex: "\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}", means: "the matrix: its two rows are the two recipes" }
      - { tex: "x", means: the input vector }

  - kind: lab
    kicker: Try it
    title: Edit the machine itself
    intro: Now change the matrix numbers. Try a = 0, b = 0, c = 0, d = 0 to crush everything to nothing. Then try a = 0, b = −1, c = 1, d = 0, which spins the input a quarter turn.
    view:
      type: vectors
      range: 8
      arrows:
        - { label: in, x: x1, y: x2, color: "#38bdf8" }
        - { label: out, x: y1, y: y2, color: "#f97316" }
    sliders: [a, b, c, d, x1, x2]
    outro: "Row 1 is [{a}, {b}] and row 2 is [{c}, {d}]. Output = [{y1}, {y2}]."

  - kind: check
    kicker: Check yourself
    title: Multiply by hand
    question: The matrix has rows [2, 0] and [0, 3]. The input is [1, 1]. What comes out?
    options:
      - { text: "[2, 3]", correct: true, why: "Row 1: 2×1 + 0×1 = 2. Row 2: 0×1 + 3×1 = 3." }
      - { text: "[3, 2]", why: "The rows are in the wrong order. Row 1 gives the first output." }
      - { text: "[5, 5]", why: "That adds the whole matrix up. Each row pairs only with the input." }

  - kind: story
    kicker: Why this matters
    title: A layer is a matrix times a vector
    body:
      - A neural network layer with 1,000 inputs and 500 outputs is a matrix with 500 rows. Each row is one neuron, and each neuron does a dot product, just as you did above.
      - Training changes the numbers in the matrix. That is what "learning" physically is.
    callout: A matrix times a vector is the heart of every model.

  - kind: practice
    kicker: Your turn
    title: "Apply a matrix"
    intro: "Write `apply(M, v)` where `M` is a list of rows. Return the list you get by taking the dot product of each row with `v`."
    entry: apply
    starter: |
      def apply(M, v):
          pass
    solution: |
      def apply(M, v):
          return [sum(x * y for x, y in zip(row, v)) for row in M]
    tests:
      - { input: "[[[1, 0], [0, 1]], [3, 4]]", expected: "[3, 4]" }
      - { input: "[[[2, 0], [0, 3]], [1, 1]]", expected: "[2, 3]" }
      - { input: "[[[1, 1]], [5, 6]]", expected: "[11]" }
    hint: "One output number per row."

  - kind: mistakes
    kicker: Watch out
    title: Three easy slips
    items:
      - "**Shapes must match.** A matrix with 2 columns needs an input of length 2. Rows times input only works when the lengths agree."
      - "**Order matters.** Matrix times vector is not the same as vector times matrix, and for two matrices A × B differs from B × A."
      - "**Rows, not columns, make the outputs.** Output number i comes from row i."
    next: { label: "Next: probability in plain words", href: /learn/probability-basics }
